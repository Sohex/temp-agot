 c_tyroshi_landing:0 "Havre-Tyroshi"
 free_city_events.9999.t:0 "L'élection [term_limit_country.GetAdjective]"
 free_city_events.9999.a:0 "Longue vie [magister_winner.Custom('FR_AuAla')] Premi[magister_winner.Custom('FR_ErEre')] Magistrat[magister_winner.Custom('FR_E')] ! Longue vie à [term_limit_country.GetName] !"
 free_city_events.0001.t:0 "L’alliance des Trois Filles"
 free_city_events.0001.desc:0 "Au premier abord, la lettre portant le sceau [request_sender.Custom('FR_du_Char_Pi')][request_sender.GetTitledFirstName] qui m’est tendue paraît anodine, et pourtant son contenu laisse entrevoir une décision porteuse de grands bouleversements.\n\n[request_sender.GetFirstNameNoTooltip] souhaite enterrer la hache de guerre et déterrer l’antique alliance qui unissait jadis Myr, Lys et Tyrosh. Cette même alliance qui donna naissance à la tant redoutée Triarchie. En quelques mots finement choisis, la missive fait miroiter dans mon esprit des images de prestige et de puissance.\n\n#POE Faisons fi des rancœurs passées pour nous tourner vers un avenir commun, et quelle que soit la tempête qui se dressera sur notre route, nous la braveront ensemble !#!"
 free_city_events.0001.a:0 "La Triarchie #bold sera#! la tempête que tous redouteront !"
 free_city_events.0001.b:0 "Je serais [Select_CString(ROOT.Char.IsFemale,'seule maîtresse','seul maître')] de mon cap !"
 free_city_events.0003.t:0 "La résurgence de la Triarchie"
 free_city_events.0003.desc:0 "À nouveau, les Trois Filles se sont unies !\n\nL’alliance de Myr, Lys et Tyrosh reparue, le monde ne tardera pas à se souvenir de la puissance de la Triarchie, celle-là même qui fit trembler Westeros tout autant qu’Essos.\n\nEnsemble, nous ferons face à toutes les tempêtes. Ensemble, nous bouterons nos ennemis hors de nos terres. Ensemble, nous repousserons nos frontières jusqu’aux confins du monde.\n\nQue nul n’ignore que nous sommes à l’orée d’une nouvelle ère !"
 free_city_events.0003.a:0 "À la Triarchie et aux innombrables victoires qui nous attendent !"
 free_city_events.0004.t:0 "Cendres et songes"
 free_city_events.0004.desc:0 "La Triarchie était peut-être sur le point de revoir le jour, mais le rêve [request_sender.Custom('FR_du_Char_Pi')][request_sender.GetTitledFirstName] n’est maintenant plus que poussière au vent, et la vision d’un royaume uni sous la bannière commune des Trois Filles s’estompe déjà.\n\nUn jour prochain, peut-être ; sous de meilleures auspices, sous d’autres étoiles…"
 free_city_events.0004.a:0 "Seul l’avenir nous le dira…"
 free_city_events.0004.b:0 "Seul l’avenir nous le dira."
