 agot_artifact_myrish_lace_name:0 "Dentelle de Myr"
 agot_artifact_myrish_lace_desc:0 "La dentelle de Myr, célèbre dans le monde entier, est convoitée autant par les hommes que par les femmes."
 agot_artifact_norvoshi_bear_carving_name:0 "Sculpture d'ours norvoshi"
 agot_artifact_norvoshi_bear_carving_desc:0 "Les ours ont toujours habités dans les collines de Norvos, et ce avant même l'existence de la cité, il n'est donc pas surprenant que l'animal soit devenu un symbole pour les habitants de la région."
 agot_artifact_pentoshi_cheese_name:0 "Fromage pentoshi"
 agot_artifact_pentoshi_cheese_desc:0 "Bien qu'il ne soit pas aussi renommé que la dentelle de Myr, les heaumes de Tyrosh ou les teintures de Braavos, le fromage de Pentos est une denrée précieuse et la base de la richesse de plus d'un Magistrat de la cité."
 agot_artifact_dothraki_bow_name:0 "Arc dothraki"
 agot_artifact_dothraki_bow_desc:0 "Les arcs dothraki sont l'une de leurs armes les plus redoutables. Bien qu'ils ne soient pas aussi emblématiques que l'arakh, leur portée dépasse celle de bon nombre d'arcs ouestriens tout en étant suffisamment petits pour être utilisés à cheval."
 traditional_house_artifact_modifier_desc:0 "Cet artefact appartient traditionnellement à ma maison ou à ma dynastie : $VALUE|=+0$"
 weirwood_flute_name:0 "Flute en barral"
 weirwood_flute_desc:0 "Le son produit par cette flûte finement taillée dans du bois de barral a quelque chose d'enchanteur, à tel point que même un néophyte pourrait manier cet instrument avec la plus grande aisance."
 is_a_poet_tt:0 "Vous avez le trait [GetTrait('lifestyle_poet').GetName(GetNullCharacter)]"
 brewing_herbs_name:0 "Herbes d'infusion"
 brewing_herbs_desc:0 "Ce sachet contient des feuilles et des racines séchées, certaines grandement connues pour leurs propriétés médicinales et apaisantes, d'autres plus difficiles à reconnaître."
 create_crown_of_hugor_decision:0 "Forger la couronne de l'onction du Père"
 create_crown_of_hugor_decision_desc:0 "Jadis, Hugor de la Colline fut couronné par le Père d'En-Haut avec sept étoiles qu'il avait lui-même cueillies dans les cieux. Il ordonna ensuite à Hugor d'emmener le peuple élu des dieux jusqu'au coucher du soleil pour y retrouver leurs terres destinées, Westeros. Depuis lors, les sept Étoiles de Hugor ont été dispersées et perdues dans le temps, mais désormais qu'elles sont réunies, je peux recréer la couronne qui a consacré Hugor."
 I_POSSESS_ALL_STARS:0 "Vous possédez les sept Étoiles de Hugor"
 I_POSSESS_ALL_STARS_NOT:0 "Vous ne possédez pas la totalité des sept Étoiles."
 create_crown_of_hugor_decision_tooltip:0 "Vous allez utiliser l'artefact des sept Étoiles de Hugor pour créer la couronne de l'onction du Père."
 create_crown_of_hugor_decision_confirm:0 "Je suis l'héritier d'Hugor !"
 animal_type_lizard_lion:0 "lézard-lion"
 artifact_hide_type_lizard_lion:0 "d'un lézard-lion"
 artifact_wall_animal_skull_lizard_lion:0 "d'un féroce lézard-lion"
 feature_animal_hide_type_lizard_lion:0 "d'un féroce lézard-lion"
 feature_animal_skull_type_lizard_lion:0 "d'un terrifiant lézard-lion"
 vs_resonance_name:0 "Résonance"
 vs_resonance_description:0 "L’épée en acier valyrien de la Maison Belmore, et dont on prétend qu’au cœur de la bataille, l’écho de ses fracas serait d’une grâce sans nom à l’oreille."
 vs_starcross_name:0 "Croix-Céleste"
 vs_starcross_description:0 "L’épée en acier valyrien de la Maison Templeton, et dont la légende raconte que sa lame aurait occis Robar Royce, deuxième du nom, lors de la Bataille des Sept Étoiles."
 vs_upright_name:0 "Intègre"
 vs_upright_description:0 "L’épée en acier valyrien de la Maison Vanbois, noblesse du Val par excellence, dont le pommeau est nanti d’une émeraude."
 vs_redhorn_name:0 "Corne Rouge"
 vs_redhorn_description:0 "L’épée en acier valyrien de la Maison Prestre, fiers seigneurs de Feux-de-Joie, et dont on dit que les plus féroces membres l’ont maniée pour ainsi bouter hors des rivages les Fer-nés."
 vs_fools_errand_name:0 "Folle Coureuse"
 vs_fools_errand_description:0 "L’épée en acier valyrien de la Maison Fallières. Sa lame est longue, en plus d’être ornée de décorations rouges et or sur la poignée."
 vs_blood_moon_name:0 "Lune-de-Sang"
 vs_blood_moon_description:0 "L’épée en acier valyrien de la Maison Wynch de Holt de Fer, payée au prix du fer lorsque son propriétaire de jadis, un capitaine pirate, fut terrassé sur les rives de Martcrâne à une époque antérieure au Fléau."
 vs_elegance_name:0 "Élégance"
 vs_elegance_description:0 "Épée en acier valyrien de la Maison Redwyne, Élégance est une épée bâtarde à triple gorge, au style sophistiqué et nantie d’une poignée incurvée et de décorations en laiton. Les seigneurs de la Treille en firent l’acquisition peu avant le Fléau de Valyria."
 vs_guile_name:0 "Roublarde"
 vs_guile_description:0 "Épée en acier valyrien de la Maison Florent, Roublarde est incrustée d’argent et fait la fierté des seigneurs de Rubriant."
 vs_oldroot_name:0 "Vieille-Racine"
 vs_oldroot_description:0 "L’épée en acier valyrien de la Maison du Rouvre, et dont la participation à maintes guerres contre les Dorniens a coûté la vie à bon nombre de grands seigneurs."
 vs_clover_name:0 "Trèfle"
 vs_clover_description:0 "Épée en acier valyrien de la Maison Goüer, Trèfle fut prise lors du sororicide par Lord Martyn Goüer, des mains même de son ancienne propriétaire sur le champ de bataille."
 vs_feastmaker_name:0 "Faiseuse-de-Festin"
 vs_feastmaker_description:0 "L’épée en acier valyrien de la Maison Morrigen, nommée ainsi en l’honneur des moult festins dont se repaissent les corbeaux au sortir des batailles qu’elle livre."
 vs_heartbreaker_name:0 "Brisecoeur"
 vs_heartbreaker_description:0 "Un poignard, acéré comme sait l’être l’acier valyrien, appartenant à la Maison Staedmon depuis maintes générations. Rares sont ceux à savoir le nombre de cœurs d’ennemis — ou d’amants — dont elle a goûté le sang, mais la lame n’en reste pas moins tranchante, comme le sera toujours la justice exercée contre les ennemis de la maison."
 vs_freedom_name:0 "Liberté"
 vs_freedom_description:0 "Épée en acier valyrien de la Maison Tignac, Liberté est l’un des derniers vestiges de leur prestige d’antan."
 vs_mourning_name:0 "Mortifère"
 vs_mourning_description:0 "Maniée par la Maison Penrose, Mortifère est une épée en acier valyrien dont la poignée est incrusté d’émail blanc."
 vs_guardian_name:0 "Gardienne"
 vs_guardian_description:0 "Hache de pas en acier valyrien de la Maison Ferboys, elle est aussi polyvalente que dangereuse, en plus d’être magnifiquement décorée. Nombre de sots ont fini fendu, fracassé ou transpercé par elle, apprenant à leurs dépens qu’il reste des gardiens pour veiller sur la Voie de Pierre. Elle a été maniée par d’innombrables Sangderoy, lui octroyant ainsi un prestige tout particulier à Dorne."
 vs_boneclaw_name:0 "Griffe-Os"
 vs_boneclaw_description:0 "Épée en acier valyrien de la Maison Le Voi, Griffe-Os possède un pommeau sur lequel est sculptée une tête de léopard."
 vs_honest_broker_name:0 "Équité"
 vs_honest_broker_description:0 "Épée en acier valyrien de la Maison Vance, Équité est restée dans la lignée de Bel Accueil durant maintes générations, suscitant l’envie et la jalousie des autres branches de la maison."
 vs_ascendant_name:0 "Ascendante"
 vs_ascendant_description:0 "Hallebarde en acier valyrien de la Maison Mallister, Ascendante est ornée de gravures complexes à sa tête, tandis que son manche, lui, est façonné dans un précieux morceau de barral. Célèbre pour avoir protégé les habitants de Salvemer des siècles durant, elle est une immense source de fierté pour ses propriétaires ancestraux, qui la brandissent pour protéger leur foyer."
 vs_fortitude_name:0 "Fortitude"
 vs_fortitude_description:0 "Épée à deux mains en acier valyrien de la Maison Fort, Fortitude possède une poignée en barral ainsi qu’une garde et un pommeau en bronze, l’une et l’autre ornés de saphirs, de rubis et d’émeraudes, arborant ainsi à la fois les couleurs de la Maison et du Trident, son foyer ancestral. Transmise de génération en génération, elle fut témoin de maintes batailles."
 vs_venom_name:0 "Vénéfice"
 vs_venom_description:0 "Vénéfice est l’épée en acier valyrien de la Maison Vyprin, et selon les dires, sa lame serait capable de tuer d’un seul coup, aussi superficiel soit-il, par ce que d’aucuns prétendent être une forme d’empoissonnement maléfique."
 vs_boartusk_name:0 "Défense"
 vs_boartusk_description:0 "Longue et imposante lance, Défense fut forgée sur commission de la Maison Crakehall avant le Fléau, et nombre d’ennemis, hommes comme bêtes, furent pourfendu de sa pointe en acier valyrien."
 norvos_armor_02_name:0 "Armure commune norvoshi"
 norvos_armor_02_description:0 "Une armure composée d’une cuirasse solide recouvrant un rembourrage aux couleurs vives et fabriquée dans le plus pur style norvoshi."
 norvos_armor_03_name:0 "Haute armure norvoshi"
 norvos_armor_03_description:0 "Une armure ornée possédant une cuirasse gravée recouvrant un rembourrage aux couleurs vives, le tout rendant hommage aux symboles propres à Norvos."
 qohor_armor_02_name:0 "Armure commune qohorienne"
 qohor_armor_02_description:0 "Une armure ayant vu le jour grâce au savoir-faire qohorien dans le domaine de la métallurgie, elle se compose d’une cuirasse multicolore, de jambières ainsi que d’un harnais lamellaire pour le bras porté par-dessus une cotte de mailles."
 qohor_armor_03_name:0 "Haute armure qohorienne"
 qohor_armor_03_description:0 "Chef d’œuvre conçu grâce à la maîtrise de la métallurgie propre aux Qohoriens, cette armure se compose d’une cuirasse multicolore, de jambières ainsi que d’un harnais lamellaire pour le bras porté par-dessus une cotte de mailles. La protection qu’elle offre à son porteur est sans commune mesure à travers le monde."
 northman_armor_02_name:0 "Armure de cuir commune nordienne"
 northman_armor_02_description:0 "Un ensemble qui se compose d’une cotte de mailles, d’un haubert et de jambières renforcées avec du cuir bouilli. Le surcot est porté par-dessus la cuirasse pour arborer fièrement les armoiries."
 northman_armor_02_b_name:0 "Armure de plates commune nordienne"
 northman_armor_02_b_description:0 "Un ensemble qui se compose d’une cotte de mailles, d’un haubert et de jambières renforcées avec des plaques d’acier. Le surcot est porté par-dessus la cuirasse pour arborer fièrement les armoiries."