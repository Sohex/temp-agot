l_french:
 vs_adders_fang_name:0 "Croc-de-Vipère"
 vs_adders_fang_description:0 "L'arme ancestrale de la maison Wyl est une épée bâtarde ornée, dont la lame ondulée si caractéristique fut maniée à maintes reprises pour protéger Dorne."
 vs_blackfyre_name:0 "Feunoyr"
 vs_blackfyre_description:0 "L'une des deux épées en acier valyrien ramenée de Valyria avant le Fléau, Feunoyr est une possession des plus précieuses pour la Maison Targaryen. Il s'agit d'une épée bâtarde ornée, dont les quillons sont décorés de têtes de dragon en acier noirci."
 vs_black_blood_name:0 "Noire Sang"
 vs_black_blood_description:0 "La grande hache à deux mains en acier valyrien de la Maison Chenu, qui, au contraire de bien d’autres maisons fer-nés ayant obtenu leurs artefacts familiaux par le prix du fer, l’obtinrent, eux, par le prix de l’or. Une extravagante prodigalité rendue possible par leur gargantuesque richesse et leur appui du commerce à travers les Îles de Fer. De telles pratiques ont valus à leurs membres d’être surnommés « la lignée noire » — une insulte devenue par la force des choses, un motif de fierté."
 vs_eleneis_grace_name:0 "La Grâce d’Elenei"
 vs_eleneis_grace_description:0 "Imposante épée à deux mains en acier valyrien de la Maison Durrandon, nombreuses sont les ballades chantées à la gloire de ceux qui l’ont maniée, les comparant à de véritables tempêtes meurtrières faisant tournoyer la lame et décimant des régiments entiers d’ennemis dans une gracieuse danse d’acier."
 vs_sg_lizard_lion_name:0 "Baguette magique"
 vs_sg_lizard_lion_description:0 "Ceci est une baguette magique. Remington à canon double. Calibre 12. Sa crosse est en noyer, son canon est en acier bleu trempé, et elle a une détente très sensible."
 vs_brightroar_name:0 "Rugissante"
 vs_brightroar_description:0 "L'épée ancestrale en acier valyrien de la maison Lannister, perdue par Tommen II lors d'une quête insensée dans les ruines de Valyria."
 vs_cloudbreak_name:0 "Brise-Nuée"
 vs_cloudbreak_description:0 "L'arme noble d'une époque civilisée. Reflétant l'élégante beauté perdue de Valyria, cette épée longue à garde en os de dragon est couronnée d'un morceau de pierre de sang, polie et scintillante, en guise de pommeau. Depuis que le Fléau a mis à bas le dragonnier qui en était le propriétaire, Brise-Nuée a été confié aux riches marchands Tyroshis de la maison Adarys, un symbole évident de leur ascendance."
 vs_iron_will_name:0 "Volonté-de-Fer"
 vs_iron_will_description:0 "Volonté-de-Fer est la grande épée en acier valyrien transmise par les seigneurs de la maison Forestier. Sa valeur inestimable en fait bien évidemment un artefact grandement convoité."
 vs_pincer_name:0 "Pince"
 vs_pincer_description:0 "La hache en acier valyrien appartenant à la Maison Celtigar, et qui reflète leur héritage valyrien, Pince a été portée par maintes générations depuis l'époque précédant le Fléau."
 vs_dark_moon_name:0 "Sombre Lune"
 vs_dark_moon_description:0 "Sur le pommeau est gravée une pleine lune, froide et livide, et cette épée n'est qu'un rayon de sa lumière comme le rappel l'éclat de sa lame."
 vs_dark_sister_name:0 "Noire Sœur"
 vs_dark_sister_description:0 "L'une des deux épées en acier valyrien ramenée de Valyria avant le Fléau, Noire Sœur est une possession des plus précieuses pour la Maison Targaryen. Il s'agit d'une épée longue, aussi fine qu'élégante, et dotée d'une lame à la couleur de fumée."
 vs_heartsbane_name:0 "Corvenin"
 vs_heartsbane_description:0 "Corvenin est l'épée à deux mains ancestrale en acier valyrien de la maison Tarly. Elle fut possédée par les fiers Seigneurs des Marches pendant près de 300 ans avant la Conquête."
 vs_ice_name:0 "Glace"
 vs_ice_description:0 "Épée en acier valyrien aux dimensions démesurées et appartenant à la Maison Stark depuis maintes générations, si elle fut forgée à Valyria plus d'un siècle avant la Conquête d'Aegon, son nom, lui, provient d'une épée bien plus ancienne, et cela afin de perpétuer la tradition de transmettre « Glace », tradition héritée depuis l'époque de l'Âge des Héros."
 vs_oathkeeper_name:0 "Féale"
 vs_oathkeeper_description:0 "Épée en acier valyrien à la coloration unique ; des ondulations d’un rouge profond contrasté de gris parcourent habillent élégamment la lame, avec un pommeau orné d’une tête de lion dorée dont les yeux brillent d’un rouge aussi éclatant que deux étoiles jumelles."
 vs_oathkeeper_historical_description:0 "Longue épée en acier valyrien forgée à partir de Glace sur ordre de Tywin Lannister, des ondulations de rouge et de noir parcourent l’ensemble de la lame, laquelle est plus tranchante que toutes les griffes de lion réunies."
 vs_widows_wail_name:0 "Pleurs-de-Veuve"
 vs_widows_wail_description:0 "Épée en acier valyrien de couleur unique avec des ondulations de rouge profond et de gris sur toute la lame. Elle est accompagnée d'un fourreau décoré d'or, de merisier, de cuir rouge et de têtes de lion dorées aux yeux rubis."
 vs_widows_wail_historical_description:0 "Pleurs-de-Veuve est une nouvelle épée en acier valyrien forgée à partir de l'ancienne lame Glace sur ordre de Tywin Lannister. Elle présente des ondulations rouges et noires à travers l'acier et son fourreau est richement décoré d'or, de bois de cerisier, de cuir rouge et de têtes de lion dorées aux yeux rubis."
 vs_lady_forlorn_name:0 "Dame Affliction"
 vs_lady_forlorn_description:0 "Dame Affliction est l'épée longue en acier valyrien de la maison Corbray. Son pommeau est orné d'un rubis en forme de cœur."
 vs_lamentation_name:0 "Lamentation"
 vs_lamentation_description:0 "Lamentation est l'épée en acier valyrien des Royce, la noble et puissante maison qui régna autrefois sur le Val, à une époque antérieure aux Arryn. Leur lignée remonterait aux Premiers Hommes, et leur souveraineté en tant que Rois de Bronze de Roches-aux-runes prit fin avec la Conquête des Andals, lorsqu'ils furent défaits par Artys Arryn, dit le Chevalier Ailé, lors de la bataille des Sept Étoiles."
 vs_longclaw_name:0 "Grand-Griffe"
 vs_longclaw_description:0 "L'épée bâtarde ancestrale en acier valyrien qui est en possession de la Maison Mormont depuis maints siècles. Sa longueur est un brin supérieur à la plupart de ses semblables, et trois gouttières ont été creusées jusqu'à mi-chemin de la lame afin d'améliorer son équilibre déjà formidable."
 vs_nightfall_name:0 "Crépuscule"
 vs_nightfall_description:0 "Épée en acier valyrien à la lame sombre et au pommeau faite de pierre de lune, elle est entrée en possession de la Maison Harloi sur le tard du troisième siècle après la Conquête, acquise par le prix du fer — plus précisément saisie des mains d’un corsaire occis par Lord Dalton Greyjoy."
 vs_orphan_maker_name:0 "Faiseuse d’Orphelin"
 vs_orphan_maker_description:0 "L'épée en acier valyrien appartenant à l'origine à la Maison Roxton, son métal sombre en acier bleuté est sculpté en pointes menaçantes, ce qui lui confère une aura macabre et redoutable."
 vs_poison_name:0 "Poison"
 vs_poison_description:0 "Épée bâtarde en acier valyrien de la maison Vunatis, Poison devait à l'origine être échangée contre des sacs d'or avec les Volantains de l'autre côté du Détroit, avant que le navire sur lequel elle voyageait ne soit saisi par les seigneurs pirates de Peyresang. La poignée est en os de dragon, sculptée en tire-bouchon."
 vs_red_rain_name:0 "Pluie Pourpre"
 vs_red_rain_description:0 "Pluie Pourpre est une épée bâtarde de couleur sang, incrustée de rubis en forme de larme. Elle appartient à la maison Timbal depuis que Hilmar le Matois a pris la lame d'un chevalier en armure avec rien d'autre que son intelligence et un gourdin en bois."
 vs_remige_name:0 "Rémige"
 vs_remige_description:0 "L'épée ancestrale en acier valyrien de la Maison Cargyll, jadis entre les mains de la légendaire Oie d'Or qui fut la première à apporter des œufs à Westeros."
 vs_strangers_mercy_name:0 "Miséricorde"
 vs_strangers_mercy_description:0 "Épée bâtarde en acier valyrien, dont le pommeau est serti d'un morceau de verredragon poli."
 vs_truth_name:0 "Vérité"
 vs_truth_description:0 "L'épée en acier valyrien de la maison Rogare, une famille noble originaire de Lys. Sa poignée dorée est ornée de sculptures qui évoquent la richesse obscène de la famille, accumulée au fil des siècles dans la profession bancaire."
 vs_vigilance_name:0 "Vigilance"
 vs_vigilance_description:0 "L'arme ancestrale en acier valyrien de la Maison Hightower. Il s'agit d'une épée longue, fine et effilée, décorée de flammes dorées et de créneaux, une référence explicite au phare de la Grand-Tour située au cœur de Villevieille."
 vs_widestripe_name:0 "Grandestrie"
 vs_widestripe_description:0 "Grandestrie est l'épée longue ancestrale en acier valyrien de la maison Lydden, apportée pour la première fois à Westeros entre les mains du futur roi Joffrey Lydden. Cette large et sombre lame a été portée dans de nombreuses batailles par des chevaliers et des seigneurs à la crête de blaireau."
 vs_longclaw_stark_name:0 "Grand-Griffe"
 vs_longclaw_stark_description:0 "Grand-Griffe est l'épée bâtarde ancestrale en acier valyrien de la maison Mormont, qui est entre les mains de leur dynastie depuis des centaines d'années. Cette épée est plus longue que la plupart des autres, effilée pour trancher aussi bien qu'elle coupe. Trois pleins sont disposés à mi-chemin de la lame sombre, améliorant l'équilibre déjà sublime. Le pommeau d'origine en forme de tête d'ours a été remplacé par une tête de loup en pierre pâle lorsque l'épée a été offerte à Jon Snow."
 vs_dancer_name:0 "Danseuse"
 vs_dancer_description:0 "Cette épée bâtarde à large lame appartenait au dernier des rois Massey, qui revendiquait et défendait des terres s'étendant des rives orientales du Bec de Massey jusqu'à l'embouchure de la Néra. La poignée dorée est sculptée de motifs anciens, probablement inspirés d'une arme contemporaine de l'Âge des Héros."
 vs_darktalon_name:0 "Noire-Serre"
 vs_darktalon_description:0 "Les Vouyvère de Repos-des-Vouivres manient cette épée à deux mains depuis des générations. La poignée argentée est sculptée à l'effigie d'une vouivre féroce, aux ailes largement déployées."
 vs_dawn_name:0 "Aube"
 vs_dawn_description:0 "La légendaire épée de la Maison Dayne, possédant une lame aussi pâle que du verre de lait et une étoile dorée ornant la garde. Les légendes racontent que le fondateur de la maison aurait suivi une étoile tombant du ciel, jusqu'à l'embouchure de la Torrentine, un lieu aujourd'hui nommé Les Météores. La lame aurait été forgée à partir du cœur de ce fragment céleste, et depuis lors, les membres les plus valeureux de la Maison Dayne la brandissent."
 vs_defiance_name:0 "Défiance"
 vs_defiance_description:0 "Épée longue possédant un manche en bronze et appartenant à la Maison Forgefer. L'importance croissante de cette dernière, en raison de son apport en fer à cheval à la cavalerie du Nord, lui aura permis de commander une arme en acier valyrien, consolidant leur statut parmi la noblesse nordienne."
 vs_disputant_name:0 "Dissidente"
 vs_disputant_description:0 "Une épée à lame courte, avec une poignée en forme de chauve-souris en or foncé, et dont la lame est aussi noire que la nuit."
 vs_the_dagger_name:0 "Dague à garde en os de dragon"
 vs_the_dagger_description:0 "Cette dague est incrustée de rubis sur toute la longueur de la poignée faite d'os de dragon. La forme semi-incurvée inhabituelle et l'utilisation d'un matériau aussi précieux témoignent d'un ouvrage datant de l'Antique Valyria, probablement forgé pour une famille noble à la richesse inestimable."
 vs_dusk_name:0 "Vespre"
 vs_dusk_description:0 "Épée à deux mains en acier valyrien de la Maison Caron, elle est nantie d’une lame aussi massive que sombre ainsi que d’une garde et d’un pommeau torsadée. Autant d’éléments qui font de cette arme un ouvrage dont il est difficile de ne pas être impressionné par son aspect."
 vs_eleneis_bulwark_name:0 "Le Rempart d’Elenei"
 vs_eleneis_bulwark_description:0 "agot_eleneis_bulwark_description"
 vs_justicar_name:0 "Justicière"
 vs_justicar_description:0 "agot_justicar_description"
 vs_pride_name:0 "Fierté"
 vs_pride_description:0 "Une épée longue portée par les chevaliers aux lions de la Maison Jast depuis l'époque du Royaume du Roc."
 vs_prosperity_name:0 "Prospérité"
 vs_prosperity_description:0 "Cette épée dorée ornée est la propriété de la maison Narratys, une famille noble de grande race parmi l'aristocratie Pentoshi. Plusieurs princes de Pentos sont issus de cette dynastie, leur permettant d'amasser les richesses nécessaires à l'achat de ce symbole de leur propre prospérité."
 vs_seafoam_name:0 "Écume"
 vs_seafoam_description:0 "Le coutelas en acier valyrien de la Maison Velaryon, sur lequel figure l'hippocampe caractéristique de leur blason et dont la magnifique poignée est faite d'argent sculpté. L'arme fut achetée grâce au fruit de multiples générations de commerce."
 vs_skullcleaver_name:0 "Coupe-Crâne"
 vs_skullcleaver_description:0 "Cette immense épée à deux mains est maniée par les seigneurs de Fléaufort depuis des générations. L'épée a été nommée après qu'un capitaine fer-né ait été tué en combat singulier par le seigneur de la Maison Fléaufort, avec un coup qui a traversé la hache, le casque et le crâne du pilleur."
 vs_soaring_glory_name:0 "Glorieuse"
 vs_soaring_glory_description:0 "agot_soaring_glory_description"
 vs_stalwart_name:0 "Vigoureuse"
 vs_stalwart_description:0 "Cette épée longue effilée au métal d'or gravée est un spectacle remarquable, et s'est avérée mortelle durant les générations de Sombrelyn qui l'ont manié au combat. Les rois, seigneurs et chevaliers de la Maison Sombrelyn ont brandi cette épée contre maints adversaires et ont défendu plus de rois que n'importe quelle autre maison."
 vs_swansong_name:0 "Chant-du-Cygne"
 vs_swansong_description:0 "L'épée longue en acier valyrien de la Maison Swann, et qui a, au fil des ans, aidé les seigneurs de Pierheaume à repousser d'innombrables raids dorniens et pirates. Un élégant cygne sculpté dans du marbre blanc lui sert de pommeau."
 vs_supremacy_name:0 "Suprématie"
 vs_supremacy_description:0 "Les Serrett de Montargent sont une fière maison andale, ayant acheté cette épée ostentatoire avec l'argent taillé dans les terres entourant leur donjon."
 vs_swordfish_name:0 "Espadon"
 vs_swordfish_description:0 "Les Bar Emmon de Pointe-Vive ont été fondés par Togarion le Terrible, un chef de guerre Andal qui s'est taillé un petit royaume pour lui et ses descendants à la pointe de l'épée. Cette épée bâtarde à garde d'or et d'argent a été utilisée plus tard par les Bar Emmon pour maintenir le contrôle sur ce royaume, et est leur bien précieux — ils ont même nommé le vaisseau amiral de leur flotte d'après l'épée."
 vs_yron_key_name:0 "La Clé d'Yron"
 vs_yron_key_description:0 "agot_yron_key_description"
 vs_tranquility_name:0 "Tranquillité"
 vs_tranquility_description:0 "Cette impressionnante épée longue argentée en acier valyrien est incrustée d'améthystes. La maison Brax la possède depuis des centaines d'années."
 vs_wyrmfang_name:0 "Croc-de-Guivre"
 vs_wyrmfang_description:0 "Les Dustin de Tertre-Bourg sont une ancienne maison avec une histoire riche et fière. Cette épée a été forgée à l'image des épées de bronze que les anciens rois Dustin portaient à l'Âge des Héros."
 vs_evergold_name:0 "Or-Éternel"
 vs_evergold_description:0 "Commandée par l'illustre maison Aveline avant le Fléau, cette lame est de la plus haute qualité artisanale valyrienne. Son pommeau porte l'étendard doré de la maison Aveline."
 vs_longthorn_name:0 "Longuépine"
 vs_longthorn_description:0 "L’épée longue en acier valyrien de la Maison Jardinier, portée par les rois du Bief depuis des temps immémoriaux, possède une lame d’un vert profond, affublée d’une garde ornée d’émeraudes et d’un pommeau en marbre vert poli, lequel est sculpté à l’effigie d’une main."
 vs_longprickle_name:0 "Longuécharde"
 vs_longprickle_description:0 "L’épée longue en acier valyrien de la Maison Jardinier, portée par les rois du Bief depuis des temps immémoriaux, possède une lame d’un vert profond, affublée d’une garde ornée d’émeraudes et d’un pommeau en marbre vert poli, lequel est sculpté à l’effigie d’une main."
 vs_longthorn_ruined_name:0 "La lame de Longuépine"
 vs_longthorn_ruined_description:0 "Jadis l’épée longue des rois du Bief, Longuépine ne ressortit pas indemne du Champ de Feu. La Maison Oldflowers préserva ce qu’il en resta dans l’espoir de pouvoir un jour la reforger, et de la restituer à sa juste place : dans les mains de la maison régnante de Hautjardin."
 vs_longthorn_restored_description:0 "L’épée ancestrale de la Maison Jardinier ayant finalement renaquit de ses cendres après le Champ de Feu, sa lame verte en acier valyrien est à nouveau le prolongement d’une garde croisée incrustée d'or et d’une poignée nouvellement forgée. Son marbre vert poli peut être lorgné de tous, comme le symbole de légitimité des contrées du Bief."
 vs_black_death_name:0 "Mort Noire"
 vs_black_death_description:0 "Une épée à deux mains forgée dans l'unique but d'être efficace sur le champ de bataille. Sa garde est taillée en pointes acérées, son manche a été fabriqué dans un fer noir et son pommeau a été façonné en une masse de fer à pointes conçue pour écraser le crâne des inconscients qui se risquent à s'approcher d'un peu trop près."
 vs_mothers_grief_name:0 "Deuil-Mère"
 vs_mothers_grief_description:0 "Le pommeau de cette épée longue a été façonné en une statue en cuivre à l'effigie de la Mère d'En-Haut, peut-être pour prier les dieux d'accorder protection à leurs proches au combat. La garde gravée et la poignée sont toutes deux fabriquées dans le même cuivre rouge."
 vs_talon_name:0 "Serre"
 vs_talon_description:0 "La garde croisée de cette épée longue a la forme d'ailes, avec un grand saphir bleu siégeant au centre. Son pommeau, fabriqué dans le même acier teinté en bleu, représente la tête d'un faucon avec des stries dorées coulant du dessous et deux saphirs plus petits pour les yeux."
 vs_glory_name:0 "Gloire"
 vs_glory_description:0 "Un rubis rouge foncé, en forme de cœur, sert de pommeau à cette épée courte. L'or massif, posé en forme de flammes, enlace le rubis de chaque côté dans l'étreinte ardente de R'hllor."
 vs_skinpeeler_name:0 "Écorcheuse"
 vs_skinpeeler_description:0 "Cette épée à deux mains est dotée d'une lame en acier valyrien ondulée caractéristique, teintée de rose clair."
 vs_sting_name:0 "Dard"
 vs_sting_description:0 "Épée longue à la finesse exquise et pourvue d'une lame en acier valyrien effilée, elle n'est pas sans rappeler un dard. Son manche en marbre spiralé et sa garde d'or finement travaillé lui donnent une apparence d'autant plus magnifiée. Un joyau d'ambre lisse orne le pommeau en forme de larme, conférant à l'arme une allure aussi élégante que redoutable."
 vs_stormy_nights_name:0 "Sorne-Trombe"
 vs_stormy_nights_description:0 "Dépourvue des décorations ostentatoires si fréquentes sur les artefacts valyriens, cette épée possède une lame tordue et moulée pour l'aspect pratique. Son aspect minimaliste lui donne une aura brutale et sévère, à l'opposé de la plupart des créations de l'ancien empire — il s'agit là d'une arme de guerrier, non d'un ornement pour nobliaux."
 vs_strangers_touch_name:0 "Toucher de l'Étranger"
 vs_strangers_touch_description:0 "Ceux qui tombent dans l’ombre de cette monstruosité peuvent trouver du réconfort en sachant qu’ils ont été condamnés par quelqu’un qui estimait que leur fin méritait la dépense la plus élevée qui soit."
 vs_dragonbane_name:0 "Drag-Fléau"
 vs_dragonbane_description:0 "La poignée de cette épée est en argent teint en bleu foncé. Son pommeau a été fabriqué dans le même métal et présente des gravures complexes. La garde croisée de l'épée longue a la forme d'une paire de dragons dont les ailes sont déployées des deux côtés de la lame."
 vs_iron_price_name:0 "Fer-Prix"
 vs_iron_price_description:0 "Arme aussi imposante que redoutable, le kraken dessiné par le pommeau et la garde accentue cette aura de férocité qui s'en dégage."
 vs_unkindness_name:0 "Malveillance"
 vs_unkindness_description:0 "Dotée d'une lame tranchante, cette épée est ornée d'un crâne de corbeau noirci en guise de pommeau, d'une poignée robuste faite en bois de barral, ainsi que d'une multitude de rubis."
 vs_andal_armingsword_gold_name:0 "Épée longue andale dorée"
 vs_andal_armingsword_gold_description:0 "Le métal de cette épée longue brille d'un éclat doré. Le fin filigrane scintille à la lueur des bougies, aussi détaillé que le motif tourbillonnant de la lame en acier valyrien. Cette épée semble faite pour le Guerrier lui-même, une arme héroïque rappelant une époque révolue."
 vs_andal_armingsword_silver_name:0 "Épée longue andale en argent"
 vs_andal_armingsword_silver_description:0 "Le métal argenté orné de cette épée longue est magnifiquement gravé. Le filigrane fin scintille à la lueur des bougies, aussi détaillé que le motif tourbillonnant de la fine lame en acier valyrien. Cette épée semble faite pour le Guerrier lui-même, une arme héroïque rappelant une époque révolue."
 vs_andal_longsword_gold_name:0 "Épée bâtarde andale dorée"
 vs_andal_longsword_gold_description:0 "La ferronnerie de cette épée bâtarde brille d'un éclat doré. Le filigrane fin scintille à la lueur des bougies, aussi détaillé que le motif tourbillonnant de la fine lame en acier valyrien. Cette épée semble faite pour le Guerrier lui-même, une arme héroïque rappelant une époque révolue."
 vs_andal_longsword_silver_name:0 "Épée bâtarde andale en argent"
 vs_andal_longsword_silver_description:0 "Le métal argenté orné de cette épée bâtarde est magnifiquement gravé. Le filigrane fin scintille à la lueur des bougies, aussi détaillé que le motif tourbillonnant de la fine lame en acier valyrien. Cette épée semble faite pour le Guerrier lui-même, une arme héroïque rappelant une époque révolue."
 vs_firstman_armingsword_gold_name:0 "Épée longue dorée des Premiers Hommes"
 vs_firstman_armingsword_gold_description:0 "Le métal de cette épée longue brille d'un éclat doré. Les inscriptions runiques, écrites dans la vieille langue, scintillent à la lueur des bougies, aussi détaillées que les motifs tourbillonnants de la lame en acier valyrien sombre et ondulée. Le style et les proportions de l'épée rappellent fortement celles portées par les anciens héros de nombreuses maisons nordiennes prétendant descendre des Premiers Hommes."
 vs_firstman_armingsword_silver_name:0 "Épée longue en argent des Premiers Hommes"
 vs_firstman_armingsword_silver_description:0 "Le métal argenté orné de cette épée longue est magnifiquement gravé. Les inscriptions runiques, écrites dans la vieille langue, scintillent à la lueur des bougies, aussi détaillées que les motifs tourbillonnants de la lame en acier valyrien sombre et ondulée. Le style et les proportions de l'épée rappellent fortement celles portées par les anciens héros de nombreuses maisons nordiennes prétendant descendre des Premiers Hommes."
 vs_firstman_armingsword_bronze_name:0 "Épée longue en bronze des Premiers Hommes"
 vs_firstman_armingsword_bronze_description:0 "Le bronze de cette épée longue a été poli pour obtenir un éclat brillant. Les inscriptions runiques, écrites dans la vieille langue, scintillent à la lueur des bougies, aussi détaillées que les motifs tourbillonnants de la lame en acier valyrien sombre et ondulée. Le style et les proportions de l'épée rappellent fortement celles portées par les anciens héros de nombreuses maisons nordiennes prétendant descendre des Premiers Hommes."
 vs_firstman_longsword_gold_name:0 "Épée bâtarde dorée des Premiers Hommes"
 vs_firstman_longsword_gold_description:0 "La métal de cette épée bâtarde brille d'un éclat doré. Les inscriptions runiques, écrites dans la vieille langue, scintillent à la lueur des bougies, aussi détaillées que les motifs tourbillonnants de la lame en acier valyrien sombre et ondulée. Le style et les proportions de l'épée rappellent fortement celles portées par les anciens héros de nombreuses maisons nordiennes prétendant descendre des Premiers Hommes."
 vs_firstman_longsword_silver_name:0 "Épée bâtarde en argent des Premiers Hommes"
 vs_firstman_longsword_silver_description:0 "Le métal argenté orné de cette épée bâtarde est magnifiquement gravé. Les inscriptions runiques, écrites dans la vieille langue, scintillent à la lueur des bougies, aussi détaillées que les motifs tourbillonnants de la lame en acier valyrien sombre et ondulée. Le style et les proportions de l'épée rappellent fortement celles portées par les anciens héros de nombreuses maisons nordiennes prétendant descendre des Premiers Hommes."
 vs_firstman_longsword_bronze_name:0 "Épée bâtarde en bronze des Premiers Hommes"
 vs_firstman_longsword_bronze_description:0 "Le bronze de cette épée bâtarde a été poli pour obtenir un éclat brillant. Les inscriptions runiques, écrites dans la vieille langue, scintillent à la lueur des bougies, aussi détaillées que les motifs tourbillonnants de la lame en acier valyrien sombre et ondulée. Le style et les proportions de l'épée rappellent fortement celles portées par les anciens héros de nombreuses maisons nordiennes prétendant descendre des Premiers Hommes."
 vs_valyrian_armingsword_gold_name:0 "Épée longue valyrienne dorée"
 vs_valyrian_armingsword_gold_description:0 "Le métal orné de cette épée longue brille d'un éclat doré. Les écailles du métal texturé scintillent et brillent à la lueur des bougies, aussi détaillées que le motif tourbillonnant de la lame en acier valyrien sombre et ondulée. Cette épée rappelle les armes redoutables utilisées par les seigneurs dragons de l’ancienne Valyria."
 vs_valyrian_armingsword_silver_name:0 "Épée longue valyrienne en argent"
 vs_valyrian_armingsword_silver_description:0 "Le métal argenté orné de cette épée longue est magnifiquement gravé. Les écailles du métal texturé scintillent et brillent à la lueur des bougies, aussi détaillées que le motif tourbillonnant de la lame en acier valyrien sombre et ondulée. Cette épée rappelle les armes redoutables utilisées par les seigneurs dragons de l’ancienne Valyria."
 vs_valyrian_longsword_gold_name:0 "Épée bâtarde valyrienne dorée"
 vs_valyrian_longsword_gold_description:0 "Le métal de cette épée bâtarde brille d'un éclat doré. Le fin filigrane scintille à la lueur des bougies, aussi détaillé que le motif tourbillonnant de la lame en acier valyrien sombre et ondulée. Cette épée rappelle les armes redoutables utilisées par les seigneurs dragons de l’ancienne Valyria."
 vs_valyrian_longsword_silver_name:0 "Épée bâtarde valyrienne en argent"
 vs_valyrian_longsword_silver_description:0 "Le métal argenté orné de cette épée bâtarde est magnifiquement gravé. Les écailles du métal texturé scintillent et brillent à la lueur des bougies, aussi détaillées que le motif tourbillonnant de la lame en acier valyrien sombre et ondulée. Cette épée rappelle les armes redoutables utilisées par les seigneurs dragons de l’ancienne Valyria."
 maekar_mace_name:0 "Masse de Maekar"
 maekar_mace_description:0 "Forgée durant la jeunesse de Maekar Targaryen, cette énorme masse bardée de pointes ne peut être correctement maniée que par le plus puissant des guerriers."
 hes_strong:0 "Doit avoir le [trait|El] [GetTrait('strong').GetName( GetNullCharacter )|l], [GetTrait('physique_good_1').GetName( GetNullCharacter )|l], [GetTrait('physique_good_2').GetName( GetNullCharacter )|l] ou [GetTrait('physique_good_3').GetName( GetNullCharacter )|l]"
 bobby_hammer_name:0 "Marteau de guerre de Robert"
 bobby_hammer_description:0 "Forgé par le maître forgeron d'Accalmie, Donal Noye, ce marteau de guerre a des proportions tellement démesurées qu'il faudrait un homme avec la force d'un géant pour réussir à le manier."
 bobby_hammer_cooler_description:0 "Forgé par le maître forgeron d'Accalmie, Donal Noye, ce marteau de guerre a des proportions tellement démesurées qu'il faudrait un homme avec la force d'un géant pour réussir à le manier. C'est grâce à cette arme que Robert Baratheon parvint à écraser la poitrine du prince Rhaegar Targaryen durant la Bataille du Trident."
 bobby_hammer_duel_description:0 "[my_weapon.GetDesc] [owner.GetFullName] a utilisé ce marteau pour écraser la poitrine de [loser.GetFullName] lors de la bataille de [battle_location.GetNameNoTooltip]."
 emoBoy_sword_name:0 "Harpe"
 emoBoy_sword_description:0 "Le plus bel ouvrage jamais forgé dans la rue de l'Acier à Port-Réal et offert à Rhaegar Targaryen lorsqu'il est devenu Prince de Peyredragon. D'une élégance qui n'a d'égal que sa finesse, c'est assurément la lame qui sied à un futur roi qui joue aussi bien de l'instrument que de l'épée."
 emoBoy_sword_duel_description:0 "[my_weapon.GetDesc] [owner.Custom('FR_le_Char')|U][owner.GetName] a utilisé cette épée pour occire [loser.Custom('FR_le_Char')][loser.GetName] lors de la bataille de [battle_location.GetNameNoTooltip]."
 bumblin_sword_name:0 "Dardillon"
 bumblin_sword_description:0 "Épée familiale de la Maison des Essaims, elle est aussi élégante qu'est effilée sa lame. Le tranchant et la précision d'un dard. La poignée en ambre torsadé combiné à une garde complexe d'acier noirci, auquel s'ajoute un joyau d'ambre poli pour orner un pommeau en forme de larme, formant un ouvrage redoutablement élégant."
 kingsguard_sword_name:0 "Épée de [owner.GetFullName]"
 kingsguard_sword_description:0 "Une épée offerte [owner.Custom('FR_au_Char_P')][owner.GetFullName] lors de son intronisation à la Garde Royale."
 redbeard_axe_name:0 "Hache de Barberouge"
 redbeard_axe_description:0 "Une hache en bronze forgée par des mains de maître et ayant appartenu à Raymun Barberouge, le roi d'au-delà du Mur."
 agot_is_wildling_desc:0 "Vous appartenez au peuple libre"
 bloodraven_longbow_name:0 "Dent-de-Freux"
 bloodraven_longbow_description:0 "L'arc long de Brynden Rivers, communément appelé « Freuxsanglant ». D'un blanc aussi pâle que les os, cet ouvrage d'exception a été fabriqué à partir d'une branche tombée du grand barral de Corneilla."
 weirwood_longbow_name:0 "Arc long en bois de barral"
 weirwood_longbow_description:0 "Taillé à partir du bois d'un barral, cet arc, d'un blanc osseux caractéristique des arbres sacrés des Anciens dieux, est d'une excellente conception et traversera les années sans mal."
 dragonbone_longbow_name:0 "Arc long en os de dragon"
 dragonbone_longbow_description:0 "De tels ouvrages sont rares et grandement recherchés. Offrant la solidité de l'acier avec une flexibilité et une légèreté bien supérieures, l'os de dragon constitue un excellent matériau pour la conception d'arcs, que d'aucuns jugent même supérieur aux arcs en orcœur des Îles d'Été."
 agot_is_independent_crown_tooltip_desc:0 "Seul les dirigeants indépendants, leur conjoint, et leurs héritiers peuvent porter cette couronne."
 baelor_crown_tooltip_desc:0 "Seuls les dirigeants vertueux peuvent porter cette couronne."
 aegon_i_crown_name:0 "La Couronne du Conquérant"
 aegon_i_crown_description:0 "La couronne d'Aegon Ier, dit le Conquérant, l'homme qui a forgé un royaume uni à l'aide du Feu et du Sang. Elle est faite d'acier valyrien et arbore plusieurs gros rubis."
 aenys_crown_name:0 "La Couronne du Premier Né"
 aenys_crown_description:0 "La couronne d'Aenys Ier, forgée en or jaune, en jade et incrustée de perles. Elle arbore le visage des Sept, chose assez ironique compte tenu de ce qui a eu lieu durant son règne."
 jaehaerys_crown_name:0 "La Couronne du Conciliateur"
 jaehaerys_crown_description:0 "La couronne de Jaehaerys Ier, dit le Conciliateur, est un simple bandeau serti de sept pierres précieuses de couleur différente — une pour chacun des royaumes et des dieux."
 aegon_iii_crown_name:0 "La Couronne de la Perte des Dragons"
 aegon_iii_crown_description:0 "La couronne d'Aegon III, dit la Perte des Dragons, est l'une des couronnes les plus basiques qui soit, il s'agit d'un simple bandeau d'or. Aegon III l'a fait forgé pour refléter l'image de sa Cour, calme et ordonnée."
 baelors_crown_name:0 "La Couronne du Bienheureux"
 baelors_crown_description:0 "Abandonnant le métal de ses ancêtres, Baelor, dit le Bienheureux, préférait arborer une couronne de fleurs. Cet entrelacement de fleurs resplendissantes et de vignes verdoyantes témoignait de son admiration pour toutes les créations des Sept qui ne font qu'Un, et de sa dévotion envers eux."
 aegon_iv_crown_name:0 "La Couronne de l’Indigne"
 aegon_iv_crown_description:0 "La couronne d'Aegon IV, dit l'Indigne, est un objet ostentatoire, fait d'or rouge et entouré de nombreuses têtes de dragon."
 maekars_crown_name:0 "La Couronne de l’Enclume"
 maekars_crown_description:0 "La couronne de Maekar Ier arbore une apparence martiale, à l'image de l'homme qui la portait, avec ses pointes de fer noir érigé sur une bande d'or rouge."
 rhaella_crown_name:0 "La Couronne de la Reine Tragique"
 rhaella_crown_historical_description:0 "Une couronne portée par la reine Rhaella Targaryen, épouse du roi Aerys II. Il s'agit d'un cerclet d'argent et de fer marqué de rubis rouges et entrecoupé de dizaines de diamants."
 rhaella_crown_description:0 "Une couronne portée par la reine Rhaella Targaryen. Il s'agit d'un cerclet d'argent et de fer marqué de rubis rouges et entrecoupé de dizaines de diamants."
 visenya_circlet_name:0 "Cerclet de la Noire Sœur"
 visenya_circlet_description:0 "Un cercle d'acier valyrien sombre entouré de rubis rouges porté par la reine Visenya, l'aînée des Trois Dragons. Il s’agit d’un puissant rappel de la sœur noire d’Aegon le Dragon."
 rhaenys_circlet_name:0 "Cerclet de la Reine Bien-Aimée"
 rhaenys_circlet_description:0 "Forgé à partir d'acier valyrien sombre et incrusté de rubis en forme de diamant, ce magnifique cerclet a été fait pour la reine Rhaenys Targaryen."
 rhaenys_circlet_historical_description:0 "Forgé à partir d'acier valyrien sombre et incrusté de rubis en forme de diamant, ce magnifique cerclet appartenait à la reine Rhaenys Targaryen, la plus charmante des épouses du roi Aegon le Conquérant."
 alysannecrown_name:0 "La Couronne de la Bonne Reine"
 alysannecrown_description:0 "La couronne de la reine Alysanne Targaryen est une fine et simple bande de sept pierres précieuses, chacune d'une couleur différente."
 alysannecrown_historical_description:0 "La couronne de la reine Alysanne Targaryen, connue sous le nom de « La Bonne Reine », est une variante plus fine de celle de son époux."
 daenerys_crown_name:0 "La Couronne du Typhon"
 daenerys_crown_historical_description:0 "La couronne de Daenerys première du nom, surnommée « du Typhon » ou « Typhon-Née », était un cadeau de Qarth et arbore une touche orientale. Elle est faite à l'effigie d'un dragon tricéphale, dont les ailes sont faites d'argent et les têtes sculptées dans du jade, de l'ivoire et de l'onyx."
 daenerys_crown_description:0 "La couronne de Daenerys première du nom, surnommée « du Typhon » ou « Typhon-Née ». Elle est faite à l'effigie d'un dragon tricéphale, dont les ailes sont faites d'argent et les têtes sculptées dans du jade, de l'ivoire et de l'onyx."
 daemon_stepstone_crown_name:0 "La Couronne du Prince Vaurien"
 daemon_stepstone_crown_description:0 "Couronne de fer et d'argent incrustée de rubis rouges et vaguement inspirée des couronnes du Conquérant et du Conciliateur, elle était portée par Daemon Targaryen, dit le Prince vaurien, après sa conquête des Degrés de Pierre."
 daemon_queen_stepstone_crown_name:0 "La Couronne de la consort du Prince Vaurien"
 daemon_queen_stepstone_crown_description:0 "Un cerclet de fer et d'argent incrusté de rubis rouges et librement inspiré des couronnes du Conquérant et du Conciliateur."
 westerosi_valyrian_crown1_name:0 "Couronne du Dragon Rouge"
 westerosi_valyrian_crown1_description:0 "Une couronne dorée en forme d'ailes de dragons et ornée de trois gros rubis."
 westerosi_valyrian_crown2_name:0 "Couronne de feu et de sang"
 westerosi_valyrian_crown2_description:0 "Une couronne de fer noir en forme d'ailes de dragons et ornée de trois gros rubis qui symbolisent les couleurs et le symbole de la maison Targaryen."
 robertI_crown_name:0 "La Couronne du Cerf Couronné"
 robertI_crown_description:0 "La couronne de Robert Baratheon, premier du nom, faite de bois de cerf et d'or."
 stannis_crown_name:0 "La Couronne du Cerf Ardent"
 stannis_crown_description:0 "La couronne de Stannis Baratheon, premier du nom, faite d'or rouge et façonné dans les flammes du Maître de la Lumière, sa nouvelle religion."
 renly_crown_name:0 "La Couronne du Cerf Cabré"
 renly_crown_description:0 "La couronne de Renly Baratheon premier du nom, qui illustre son mariage en arborant une tête de cerf de jade entouré d'un anneau de roses dorées."
 joffreyI_crown_name:0 "La Couronne du Lion et du Cerf"
 joffreyI_crown_description:0 "La couronne de Joffrey Baratheon, premier du nom, est une couronne d'or arborant des bois de cerf, bien qu'elle soit moins menaçante que celle de son père, et ornée de rubis et de diamants noirs."
 daemonblackfyre_crown_name:0 "La Couronne du Dragon Noir"
 daemonblackfyre_crown_historical_description:0 "La couronne de Daemon Feunoyr, dit le Dragon Noir, qui fut le premier des prétendants Feunoyr. Inspirée de celle du Conquérant, elle a néanmoins les couleurs inversées, à l'image de l'emblème des Feunoyr. En lieu et place de rubis, c'est du verredragon qui a été utilisé, le tout lié à l'aide de cuivre rouge."
 daemonblackfyre_crown_description:0 "Cette couronne, inspirée de celle du Conquérant, a néanmoins les couleurs inversées, à l'image de l'emblème des Feunoyr. En lieu et place de rubis, c'est du verredragon qui a été utilisé, le tout lié à l'aide de cuivre rouge."
 driftwood_crown_1_name:0 "Couronne de Bois-Flotté"
 driftwood_crown_1_description:0 "A l'inverse des Rois des Terres Vertes, les couronnes des anciens Grands Rois étaient des présents de la mer, faites à partir de bois flotté échoué sur la mer, afin de leur rappeler que tout ce qu'ils possédaient, ils le devaient au Dieu Noyé."
 iron_isles_crown_name:0 "La Couronne des Rois de Fer"
 iron_isles_crown_description:0 "Lorsque les Greyfer mirent fin aux États généraux de la royauté et se déclarèrent Rois des Îles, ils firent forger une couronne de fer, symbolisant sa prise de pouvoir."
 iron_isles_crown_historical_description:0 "Lorsque les Greyfer mirent fin aux États généraux de la royauté et se déclarèrent Rois des Îles, ils firent forger une couronne de fer, symbolisant sa prise de pouvoir. Depuis lors, elle est transmise de générations en générations."
 riverlands_crown_name:0 "La Couronne du Trident"
 riverlands_crown_description:0 "Une élégante couronne ornée du symbole d'un trident, en l'honneur du fleuve du même nom, et destiné à être porté par le souverain du Conflans."
 crown_of_mudd_name:0 "Couronne des Rivières et des Collines"
 crown_of_mudd_description:0 "Une couronne dorée parsemée d'émeraudes, confectionnée à l'image des armoiries de l'ancienne maison d'Alluve."
 crown_of_mudd_coa_name:0 "La Couronne des Vieux Rois"
 crown_of_mudd_coa_description:0 "Une couronne dorée ornée de pierres précieuses et confectionnée dans un style ancien, semblable à celle portée par les anciens rois du Trident."
 crown_of_winter_name:0 "La Couronne de l’Hiver"
 crown_of_winter_description:0 "L’ancienne couronne de la Maison Stark, portée par les Rois de l’Hiver puis par les Rois du Nord, composée de neuf épées de fer liées par un cerclet de bronze sur lequel sont inscrites des runes. Le symbole d’une terre dure et d’un peuple plus dur encore."
 crown_of_winter_historical_description:0 "L’ancienne couronne des Rois de l’Hiver de la Maison Stark, composée de neuf épées de fer liées par un cerclet de bronze sur lequel sont inscrites des runes. Le symbole d’une terre dure et d’un peuple plus dur encore."
 crown_of_jeyne_westerling_name:0 "La Couronne de la Jeune Reine"
 crown_of_jeyne_westerling_description:0 "Un cerclet ouvert en bronze martelé avec des bords argentés. Semblable à la célèbre couronne portée par les anciens rois de l'Hiver de la maison Stark, elle est surmontée de pointes forgées en forme d'épées. Bien que contrairement à celle-ci, elle n'en comporte que six, fabriquées à l'image de Glace, l'épée ancestrale faite d'acier Valyrien de la maison Stark. Pour représenter la famille de son porteur, elle présente également six coquillages en argent interposés entre les lames."
 dorne_crown_name:0 "La Couronne du Soleil et de la Lance"
 dorne_crown_description:0 "Un bandeau en or orné de huit sceaux dorés de la Maison Nymeros Martell, du soleil et des lances, et dont le centre forme un rubis rouge."
 falcon_crown_name:0 "La Couronne de la Montagne et du Val"
 falcon_crown_description:0 "Une couronne en argent similaire à celles portées par les rois Arryn de la Montagne et du Val, centrée par les ailes d’un faucon sortant d’une pierre précieuse bleue, tandis qu’en dessous se trouve une lune argentée à crête."
 falcon_crown_historical_description:0 "La couronne en argent portée par les rois Arryn de la Montagne et du Val, centrée par les ailes d’un faucon sortant d’une pierre précieuse bleue, tandis qu’en dessous se trouve une lune argentée à crête."
 iron_stag_crown_name:0 "La Couronne des Épois de Fer"
 iron_stag_crown_description:0 "Une couronne qui reflète une nature belliqueuse et ayant appartenu aux rois Durrandon. Si la plupart des Rois de l'Orage sont connus pour leur goût de la martialité, cette couronne est réservée à ceux qui se consacrent corps et à âme à la voie de l'épée."
 stormlands_crown_name:0 "La Couronne des Orages"
 stormlands_crown_description:0 "La Couronne des Orages fut la couronne ancestrale de la maison Durrandon, portée depuis que Durran a épousé Elenei et que le septième château fut érigé."
 stormlands_crown_historical_description:0 "Couronne ancestrale de la maison Durrandon, portée depuis que Durran a épousé Elenei et que le septième château fut érigé."
 westerlands_crown_name:0 "Le Cerclet du Roc"
 westerlands_crown_description:0 "Le Cerclet du Roc fut la couronne traditionnelle de la reine consort de la Maison Lannister. Il s’agit d’une magnifique bande décorée d'or, de pierres précieuses et de lions."
 westerlands_crown_historical_description:0 "Couronne traditionnelle de la reine consort de la Maison Lannister, il s’agit d’une magnifique bande décorée d'or, de pierres précieuses et de lions."
 westerlands2_crown_name:0 "La Couronne du Roc et de la Colline"
 westerlands2_crown_description:0 "La Couronne du Roc fut autrefois portée par les Rois du Roc de la maison Lannister, descendants de Lann le Futé et Loreon le Lion."
 westerlands2_crown_historical_description:0 "La couronne autrefois portée par les Rois du Roc de la maison Lannister, descendants de Lann le Futé et Loreon le Lion."
 crown_of_gardener_peace_name:0 "Fleurs de Paix"
 crown_of_gardener_peace_description:0 "Une couronne de vignes et de fleurs. Les rois Jardinier d’autrefois en portaient des semblables durant les temps de paix."
 crown_of_gardener_peace_historical_description:0 "La couronne de vignes et de fleurs portait jadis par les rois Jardinier durant les temps de paix."
 crown_of_gardener_war_iron_name:0 "Épines de Guerre"
 crown_of_gardener_war_iron_description:0 "Une couronne de vignes en fer avec des épines proéminentes. Les rois Jardinier d’autrefois en portaient des semblables durant les temps de guerre."
 crown_of_gardener_war_iron_historical_description:0 "La couronne de vignes en fer avec des épines proéminentes, portait jadis par les rois Jardinier durant les temps de guerre."
 crown_of_first_men_name:0 "La Couronne des Premiers Hommes"
 crown_of_first_men_description:0 "Un cerclet en bronze tout ce qu'il y a de plus simple, sur lequel figure des inscriptions runiques des Premiers Hommes."
 crown_of_the_andals_name:0 "Couronne des Andals"
 crown_of_the_andals_description:0 "Une couronne royale de bronze et d'argent, incrustée de gros joyaux et ornée de fines perles, et fabriquée dans un style andal traditionnel qui remonte à l'époque des aventuriers de jadis."
 crown_of_the_andals_silver_name:0 "Couronne en argent des Andals"
 crown_of_the_andals_silver_description:0 "Une couronne royale en argent, incrustée de gros joyaux et ornée de fines perles, et fabriquée dans un style andal traditionnel qui remonte à l'époque des aventuriers de jadis."
 crown_of_westerosi_diadem_name:0 "Couronne élégante ouestrienne"
 crown_of_westerosi_diadem_description:0 "Une couronne en bronze qui allie élégance et robustesse, incrustée de pierres précieuses aux multiples couleurs et décorée de détails dorés."
 crown_of_westerosi_diadem_silver_name:0 "Couronne élégante ouestrienne en argent"
 crown_of_westerosi_diadem_silver_description:0 "Une couronne en argent qui allie élégance et robustesse, incrustée de pierres précieuses aux multiples couleurs et décorée de détails dorés."
 valeman_crown_name:0 "La Couronne du Val"
 valeman_crown_description:0 "Une couronne en argent avec des motifs finement sculptés et des joyaux incrustés. Elle est réalisée dans la plus pure tradition valoise."
 stormlander_crown_name:0 "La Couronne de l’Orage"
 stormlander_crown_description:0 "Une fière couronne dorée avec de grosses pierres précieuses sur toute sa circonférence. Elle est réalisée dans la plus pure tradition orageoise."
 westerlander2_crown_name:0 "La Couronne de l’Ouest"
 westerlander2_crown_description:0 "Une couronne dorée ornée de motifs complexes et de pierres précieuses polies. Elle est réalisée dans la plus pure tradition ouestienne."
 reachman_crown_name:0 "La Couronne du Bief"
 reachman_crown_description:0 "Une magnifique couronne dorée ornée de vignes tout aussi dorées et finement entrelacées, serties de joyaux scintillants. Au centre de cet exquis ouvrage se trouve une splendide fleur dorée, dont le cœur orné d'un bijou de taille imposante ajoute une touche d'élégance captivante."
 dornish_crown_name:0 "La Couronne Dornienne"
 dornish_crown_description:0 "Une bande circulaire faite d'or, entourée de huit soleils dorés qui abritent en leur centre des pierres précieuses aux couleurs étincelantes."
 swann_crown_name:0 "La Couronne des Cygnes Combattants"
 swann_crown_description:0 "Une couronne noire et blanche représentant deux cygnes face à face tandis qu'au centre se trouvent de nombreux petits joyaux."
 beyondthewall_crown_name:0 "La Couronne du Peuple Libre"
 beyondthewall_crown_description:0 "Une couronne de cuir rugueux et de pointes d'obsidienne, conçue pour quelqu'un assez audacieux pour revendiquer et conserver les terres Au-delà du Mur."
 blackwood_crown_name:0 "La Couronne des Corbeaux"
 blackwood_crown_description:0 "Une couronne sombre en forme de crâne de corbeau avec des branches qui représentent l'ancien barral de Corneilla."
 bolton_crown_name:0 "La Couronne de l’Écorché"
 bolton_crown_description:0 "Une couronne des plus menaçantes, ornées de motifs d'hommes écorchés afin d'arborer fièrement l'ancienne tradition de la Maison Bolton qui leur a valu leurs armoiries, à savoir écorcher leurs ennemis, comme ils le firent avec bon nombre de Rois de l'Hiver."
 bolton_skin_crown_name:0 "La Couronne de l’Écorcheur"
 bolton_skin_crown_description:0 "Une large bande d'argent entièrement recouverte de morceaux de peau humaine grossièrement cousus ensemble, qui témoigne de l'ancienne et infâme coutume de la Maison Bolton, qui était connue pour écorcher vifs ses ennemis."
 cargyll_crown_name:0 "La Couronne de l’Œuf d’Or"
 cargyll_crown_description:0 "Une couronne dorée qui arbore deux oies dorées se faisant face, tandis qu'au centre se trouvent deux rubis rouges et un gros rubis noir."
 dayne_crown_name:0 "La Couronne du Matin"
 dayne_crown_description:0 "Une couronne réalisée dans le style des anciennes coiffes des rois des Météores, faite d'argent et arborant une grande étoile en argent, elle-même arborant une étoile en améthyste en son centre."
 crown_of_hellholt_name:0 "La Couronne Denfert"
 crown_of_hellholt_description:0 "Une couronne d'apparence féroce, faite d'or rouge et conçue pour représenter ceux qui règnent sur le Soufre."
 dustin_crown_name:0 "La Couronne des Tertres"
 dustin_crown_description:0 "La couronne des anciens Rois des Tertres, qui seraient des descendants du Premier Roi."
 florent_crown_name:0 "La Couronne du Renard"
 florent_crown_description:0 "Une couronne en or arborant le regard rouge rubis d'un renard rusé, et ornée de fleurs en bronze incrustées d'une pierre précieuse bleue sur le côté."
 frey_crown_name:0 "La Couronne du Pont"
 frey_crown_description:0 "Une copie conforme d'une couronne qui aurait été portée durant l'Âge des Cent Royaumes par la maison Frey. Cette couronne, faite d'argent, arbore une série de petites tours similaires à celles du Pont, autrement appelé les Jumeaux, et chaque tour surplombe trois gemmes bleues."
 greyjoy_crown_name:0 "La Couronne du Kraken"
 greyjoy_crown_description:0 "Une couronne de fer et d'or à l'effigie d'un kraken, dont les longs tentacules entourent et agrippent la tête de celui qui en est coiffé."
 harlaw_crown_name:0 "La Couronne des Harloi"
 harlaw_crown_description:0 "Une couronne qui arbore la mort. Des crânes hurlants, la faux de l'Étranger et une pierre précieuse d'un violet clair y sont visibles."
 hightower_crown_name:0 "La Couronne de la Grand-Tour"
 hightower_crown_description:0 "Une couronne exquise fabriquée à partir d'argent et d'or, et qui arbore neuf répliques miniatures de la Grand-Tour de Villevieille, faites d'argent et chacune ornée d'une flamme dorée scintillante à son sommet. Ces tours sont élégamment reliées par d'autres flammes dorées, tandis que la couronne elle-même est incrustée d'émeraudes et de rubis qui rayonnent de mille éclats."
 manderly_crown_name:0 "La Couronne du Triton"
 manderly_crown_description:0 "Une reproduction parfaite de la couronne autrefois portait par la Maison Manderly, des siècles avant leur exil du Bief. Cette resplendissante couronne dorée, évoquant des vagues qui ondulent, est ornée de perles brillantes et présente en son cœur une représentation méticuleusement réalisée de deux tritons serrant un trident. Au milieu des motifs de vagues figurent des émeraudes qui encerclent la couronne et accentue le caractère majestueux de l'ensemble."
 reach_crown_name:0 "La Couronne de la Rose d’Or"
 reach_crown_description:0 "Une magnifique bande dorée ornée de vignes elles aussi dorées, finement entrelacées et ornées d'émeraudes scintillantes. Au centre de la couronne se trouve une splendide fleur dorée, son cœur orné d'une grande émeraude qui ajoute une touche d'élégance captivante."
 redwyne_crown_name:0 "La Couronne du Vin"
 redwyne_crown_description:0 "Un délicat anneau doré orné de pierres précieuses bleues qui scintillent au sein d'une élégante vigne. Au centre se trouve une feuille de vigne inversée, flanquée de somptueux bijoux violets confectionnés à l’effigie de raisins."
 reed_crown_name:0 "La Couronne des Paludes"
 reed_crown_description:0 "Un diadème fait de peau de crocodile qu'on trouve au Neck, son sommet est orné de leurs dents tandis que la façade principale arbore un trio de leurs yeux."
 crown_of_bear_island_name:0 "La Couronne de l’Île-aux-Ours"
 crown_of_bear_island_description:0 "Une couronne imposante inspirée des arbres de l'Île-aux-Ours et incrustée de grosses émeraudes et de diamants noirs."
 royce_crown_name:0 "La Couronne Runique"
 royce_crown_description:0 "Une couronne de bronze ornée de pierres précieuses circulaires noires et de gravure de runes des Premiers Hommes et fabriquée à l'image de l'ancienne couronne royale de la Maison Royce du Val."
 crown_of_hearts_home_name:0 "La Couronne de Cœurmanoir"
 crown_of_hearts_home_description:0 "Une couronne en argent avec trois grands joyaux incrustés en forme de cœur et ornée de trois figures au sommet destinées à représenter des corbeaux. Elle a été forgée pour honorer l'héraldique de la maison Corbray."
 tarly_crown_name:0 "La Couronne de la Chasse"
 tarly_crown_description:0 "Une couronne faite d'or et d'argent qui arbore une bande centrale en or ornée de pierres précieuses d'un vert brillant, ainsi qu'une série de pointes de flèches en argent, chacune ornée d'un rubis rouge éclatant en son centre. Au cœur de la couronne se trouve une splendide représentation d'un arc en argent, aux branches ornées de bijoux rouges et verts. Au centre de l’arc se trouve un visage doré où figurent des gravures complexes de feuilles et d’archers."
 tarth_crown_name:0 "La Couronne de l’Étoile-du-Soir"
 tarth_crown_description:0 "Une élégante couronne cylindrique dorée, caractérisée par six ouvertures méticuleusement sculptées ressemblant au soleil, complétées par six ouvertures supplémentaires reflétant la forme de la lune."
 crown_of_dondarrion_name:0 "La Couronne de Havrenoir"
 crown_of_dondarrion_description:0 "Un cerclet sombre avec des diamants blancs en forme d'étoile, conçu pour illustrer les couleurs de la maison Dondarrion des Terres de l'Orage."
 tully_crown_name:0 "La Couronne de la Truite"
 tully_crown_description:0 "Une couronne de fer et d'argent caractérisée par des tours en forme de nageoires de poisson. La couronne est ornée d'un tore de fer à sa base, et de tours à poissons au-dessus et au-dessous, tandis qu'un arrangement de pierres précieuses bleues et roses sur un motif en peau de poisson argenté ajoute une touche d'opulence."
 umber_crown_name:0 "La Couronne d’Âtre-lès-Confins"
 umber_crown_description:0 "Une couronne de fer finement moulée en forme de mains d'homme enchaînées, symbolisant la libération alors qu'il se défait de l'esclavage."
 crown_of_the_wall_name:0 "La Couronne du Mur"
 crown_of_the_wall_description:0 "Une couronne de verre parsemée de pointes de fer noir qui évoque le Mur et ses dix-neuf châteaux. Traditionnellement tenu par la Garde de Nuit, le Mur protège le royaume des humains des menaces venus d'au-delà. Tout dirigeant qui revendique cette ancienne fortification se heurtera à un règne difficile et décrié."
 crown_of_westerling_name:0 "La Couronne de Falaise"
 crown_of_westerling_description:0 "Un cerclet ouvert avec une texture sableuse sur toute sa longueur et décoré de six coquillages blancs représentant ceux de la maison Ouestrelin."
 crown_of_castamere_name:0 "La Couronne de Castamere"
 crown_of_castamere_description:0 "Une couronne en argent sertie de rubis et ornée de figures de lions rouges proéminentes."
 crown_of_deep_den_name:0 "La Couronne d’Antrecombe"
 crown_of_deep_den_description:0 "Une couronne royale de bronze et d'argent, incrustée de grosses émeraudes et ornée de fines perles, et qui rend hommage aux couleurs et au symbole de la Maison Lydden d'Antrecombe."
 crown_of_the_banefort_name:0 "La Couronne des Fléaufort"
 crown_of_the_banefort_description:0 "Une couronne dorée, d'apparence féroce, forgée dans le style arboré autrefois par les Rois Cagoulés de la Maison Fléaufort."
 crown_of_crakehall_name:0 "La Couronne des Crakehall"
 crown_of_crakehall_description:0 "Couronne en bronze ornée de motifs complexes et de diamants noirs polis, dont les couleurs évoquent celles de la Maison Crakehall."
 crown_of_the_tides_name:0 "La Couronne des Marées"
 crown_of_the_tides_description:0 "Une couronne ornée d'hippocampes et de motifs évoquant les profondeurs de l'océan, parfait pour coiffer un Roi des Marées."
 crown_of_darklyn_name:0 "La Couronne de Sombreval"
 crown_of_darklyn_description:0 "Une couronne royale en fer noir et en argent, incrustée de gros joyaux et ornée de sept perles fines."
 crown_of_true_winter_name:0 "La Couronne de Glace"
 crown_of_true_winter_description:0 "Un cerclet ouvert de fer poli incrusté de diamants scintillants et surmonté de neuf pointes glacées. Une couronne semblable à celle-ci fut perdue il y a de cela très longtemps et n'est évoquée que dans les archives de la Citadelle et dans les documents dispersés à travers le Nord. Sa forme ressemblait à celle des couronnes d'Hiver de la Maison Stark, bien qu'elle différait de par sa couleur, son esthétique et son matériau. La composition des pointes est sujet à débat, d'aucuns soutenant qu'elles étaient faites de diamant, de verre ou d'un cristal inconnu, tandis que d'autres avancent l'hypothèse de véritables glaces, préservées par l'ancienne magie des enfants de la forêt. L'origine de la couronne est inconnue : fut-elle créée en hommage à la Maison Stark, et portée par une reine ou une princesse de Winterfell ? Ou bien aurait-elle été fabriquée pour se moquer des rois Stark. Plus fantastiques encore sont les récits selon lesquels elle aurait appartenu à la Reine Cadavre aux yeux bleus, amante du légendaire Roi de la Nuit. Ces affirmations, cependant, sont fortement contestées par les mestres, qui les considèrent comme de simples ouï-dire."
 valyrian_crown1_name:0 "Cerclet des Possessions"
 valyrian_crown1_description:0 "Un cerclet de conception valyrienne honorant les dieux de l'Ancienne Valyria."
 valyrian_crown2_name:0 "Couronne des Possessions"
 valyrian_crown2_description:0 "Une couronne d'argent en forme d'ailes de dragons et ornée de trois grosses pierres précieuses."
 crown_of_the_grey_king_rusted_name:0 "La Couronne du Roi Gris"
 crown_of_the_grey_king_rusted_description:0 "Cette ancienne couronne fut fabriquée à partir des dents de Nagga, le grand dragon des mers, occis par le Roi Gris. C'est le symbole ultime d'autorité du Fer-né, car seul cet illustre pillard l'a porté."
 crown_of_the_nights_king_name:0 "La Couronne du Roi de la Nuit"
 crown_of_the_nights_king_description:0 "Une couronne sombre et ancienne, conçue pour celui dont l'histoire se souviendra comme le Roi de la Nuit, faite d'un fer noir et de pointes d'une glace qui ne fond jamais grâce à la même magie qui soutient le Mur lui-même."
 crown_of_the_nights_king_replica_name:0 "La Couronne du Roi de la Nuit"
 crown_of_the_nights_king_replica_description:0 "Une couronne sombre, conçue comme la copie de celle qui fut portée par celui dont l'histoire se souviendra comme le Roi de la Nuit, faite de fer noir et comportant des pointes en verre afin d'imiter visuellement la glace qui compose le Mur."
 cannibal_crown_name:0 "La Couronne de l’Échine Brisée"
 cannibal_crown_description:0 "Une couronne de conception macabre façonnée à partir d'une colonne vertébrale humaine dont les vertèbres sont recourbées de sorte à former un cercle. À l'avant repose la partie supérieure d'un crâne, dont la courbe lisse de l'os et l'ouverture nasale creuse forment un ensemble sinistre."
 crown_of_the_seven_name:0 "La Couronne de la Foi"
 crown_of_the_seven_description:0 "La Couronne de la Foi est un symbole des Sept qui ne font qu'Un et de leur culte. Faite d'or et décorée de perles, d'argent et de pierres précieuses aux multiples couleurs, elle arbore fièrement sept occurrences de l'étoile à sept branches sur sa circonférence."
 crown_of_the_old_gods_name:0 "La Couronne du Pacte"
 crown_of_the_old_gods_description:0 "Symbole des Anciens Dieux et qui fait office de guide pour tous ceux qui pratiquent leur culte, la couronne est faite de bronze, le métal des Premiers Hommes, et ornée de rubis rouges pour refléter les barrals."
 crown_of_rhllor_name:0 "La Couronne de Flammes"
 crown_of_rhllor_description:0 "Une couronne de feu conçue pour représenter et honorer le Maître de la Lumière. Car la nuit est sombre et pleine de terreurs."
 circlet_of_rhllor_name:0 "Cerclet de feu"
 circlet_of_rhllor_description:0 "Un cerclet de feu conçu pour représenter et honorer le Maître de la Lumière. Car la nuit est sombre et pleine de terreurs."
 crown_of_hugor_name:0 "La Couronne de l’Onction du Père"
 crown_of_hugor_description:0 "Cette couronne, fabriquée à partir des sept étoiles de Hugor, est une reconstitution de la légendaire qui fut décernée au premier roi des Andals par le Père lui-même."
 crown_of_winter_roses_name:0 "La Couronne de Roses d’Hiver"
 crown_of_winter_roses_description:0 "Une superbe couronne de roses bleues pâles comme le givre."
 shieraseastar_necklace_name:0 "Collier de Shaïra Astre des Mers"
 shieraseastar_necklace_description:0 "Un collier ayant appartenu à Shaïra Astre des Mers, fille bâtarde de Aegon IV, dit l'Indigne. De nombreuses perles blanches y sont incrustées, mais également d'autres de plus grosse taille, vertes et bleues."
 brightflame_armor_name:0 "L’Armure de Viveflamme"
 brightflame_armor_description:0 "L’armure finement décorée ayant été forgée pour le prince Aerion 'Viveflamme' de la Maison Targaryen, et dont le casque est orné d'une paire d’imposantes ailes de dragons et d’une gueule béante aux dents acérées, dans le simple but d’inspirer la plus grande terreur possible aux adversaires qui oseraient vouloir porter la main contre le Prince Flamboyant."
 maelys_armor_name:0 "Armure de plates du Monstrueux"
 maelys_armor_description:0 "Maelys Feunoyr, le prétendant tristement célèbre, était connu pour sa monstrueuse deuxième tête, nécessitant une armure spécialement conçue pour lui."
 monstrous_desc:0 "Cette armure a été conçue pour quelqu'un de monstrueux."
 rhaegars_armor_name:0 "L’Armure de Rhaegar"
 rhaegars_armor_description:0 "L'armure de Rhaegar Targaryen est faite de plaques d'un noir profond, ornée du dragon tricéphale de la Maison Targaryen, fait de rubis. Sous l'armure repose un haubert de cotte de mailles dorée, et le heaume de l'armure est minutieusement décoré d'un motif draconique."
 roberts_armor_name:0 "L’Armure de Robert"
 roberts_armor_description:0 "L'armure de Robert Baratheon a beau refléter la simplicité, elle n'en reste pas moins formidable. De grandes plaques d'acier protègent le porteur, sous lesquelles se trouve un haubert en cottes de mailles. Une grande partie de l'armure est recouverte d'un tabard sur lequel figure le cerf noir de la Maison Baratheon, tandis que le heaume est orné de redoutables bois de ce même animal."
 kingsguard_armor_name:0 "Armure de la Garde Royale [owner.Custom('FR_du_Char')][owner.GetNameNicknamed]"
 kingsguard_armor_description:0 "Une armure émaillée blanche offerte [owner.Custom('FR_au_Char_P')][owner.GetFullName] lors de son intronisation à la Garde Royale."
 skinchangers_second_pelt_name:0 "Seconde peau d'un change-peau"
 skinchangers_second_pelt_description:0 "Cette peau mal traitée a été prélevée sur une bête qu'un change-peau avait choisie pour y trouver refuge, quand son propre corps n'était plus en mesure de protéger son esprit."
 valyrian_steel_armor_name:0 "Armure en acier valyrien"
 valyrian_steel_armor_description:0 "Cet ensemble d'armures, une combinaison d'écailles d'acier valyrien, dépasse de loin la valeur d'un royaume et constitue sûrement la protection la plus efficace qui soit."
 decorated_dragon_plate_armor_name:0 "Armure de plates de dragon décorée"
 decorated_dragon_plate_armor_description:0 "Cette armure de plates complète est pourvue d'ornements de plaques en argent et de cannelures délicates conçues pour évoquer les ailes d'un dragon."
 royce_runic_armor_name:0 "Armure de bronze runique"
 royce_runic_armor_description:0 "L'une des nombreuses armures de plates faites de bronze antique appartenant à la maison Royce. Les runes gravées à sa surface sont censées garder le porteur de toutes blessures, mais la question est de savoir si elles sont efficaces ou non."
 agot_custom_armor_name:0 "Armure personnelle"
 baratheon_armor_01_name:0 "Armure des Baratheon"
 baratheon_armor_01_description:0 "D'apparence rudimentaire, cette armure complète surmontée d'un surcot et d'une ceinture à plaques possède également de larges et grossières épaulières, lui conférant une silhouette imposante. Elle est dépourvue des formes complexes que l'on retrouve dans d'autres modèles d'armures, ce qui ne l'empêche pourtant pas d'offrir une protection optimale."
 ned_armor_01_name:0 "Armure des Stark"
 ned_armor_01_description:0 "Une armure de plates partielle portée par-dessus une cotte de mailles, comme il n'est pas rare d'en trouver dans le Nord. Si elle arbore de menues décorations, elle n'a pas l'apparat ostentatoire d'or ou de laiton fréquent chez les armures suderonnes, leur préférant des motifs en relief basiques et une ceinture à plaques."
 rhaegar_armor_01_name:0 "Armure princière des Targaryen"
 rhaegar_armor_01_description:0 "Cette armure de plates complète arbore des épaulières en forme d'ailes de dragon, une cotte de mailles dorée et des galons rouges pour compléter l'ensemble. Des rubis forment également un dragon sur la cuirasse, pour unifier le tout et former ainsi une armure richement ornée."
 maelys_armor_01_name:0 "Armure du Monstrueux"
 maelys_armor_01_description:0 "Une armure de plates bleutée portée avec un surcot, dont le côté droit est orné de fines cannelures et de filigranes pour lui conférer une apparence noble et immaculée, tandis que le gauche est couvert de dents de dragon et de plaques aux dimensions hors normes, formant un ensemble dont le seul qualificatif approprié ne peut être que « monstrueux »."
 tywin_armor_01_name:0 "Armure écarlate des Lannister"
 tywin_armor_01_description:0 "Une armure de plates complète, de couleur or et rouge, avec un drap d'or sur l'épaule. Ses cannelures s'inspirent du style ouestien, tandis que le rouge vif et le laiton évoquent la richesse et la fierté."
 jaime_armor_01_name:0 "Armure dorée des Lannister"
 jaime_armor_01_description:0 "Une armure dorée à laquelle est ajoutée une draperie blanche sur l'épaule gauche pour en renforcer la magnificence. Sa surface entièrement cannelée a été dorée à l'aide de procédés chimiques, aussi dangereux que le résultat est magnifique."
 reyne_armor_01_name:0 "Armure des Reyne"
 reyne_armor_01_description:0 "Une armure d'un rouge éclatant qui arbore le style ouestien, lequel est complété par une draperie sur l'épaule. Entièrement émaillée, elle témoigne d'une richesse ostentatoire, et sa couleur uniforme la rend particulièrement visible sur un champ de bataille."
 arryn_armor_01_name:0 "Armure des Arryn"
 arryn_armor_01_description:0 "Une armure imposante prisée des chevaliers qui privilégient une meilleure protection, quitte à perdre en mobilité. La sobriété des couleurs contraste avec un casque qui arbore moult détails, permettant à l'ensemble de se distinguer et de conserver une allure chevaleresque traditionnelle."
 tyrell_armor_01_name:0 "Armure des Tyrell"
 tyrell_armor_01_description:0 "Une armure ornée d'une dorure raffinée polie à l'extrême et de décorations en relief d'une grande finesse. Des plumes et une robe de satin complètent l'ensemble, la rendant idéale pour tout chevalier désireux d'arborer raffinement et richesse."
 bolton_armor_01_name:0 "Armure des Bolton"
 bolton_armor_01_description:0 "Les armures de plates sont rares chez les Nordiens, et le plus souvent rudimentaires, mais cette armure est l'exception qui confirme la règle. Les plaques sont minutieusement cannelées et émaillées pour imiter de la chair écorchée, parcourues par des lignes évoquant des tendons, le tout dans un ton rouge sang qui ajoute une part de menace à l'ensemble."
 royce_armor_01_name:0 "Armure des Royce"
 royce_armor_01_description:0 "Il est ardu d'estimer l'âge d'une telle armure, dont certaines parties ont été remplacées au fil du temps. Faite de bronze, elle est le vestige d'un lointain passé, dont les épaulières et la cuirasse ne ressemblent à aucune conception moderne. Quelle que soit son âge, elle demeure fonctionnelle et apte à protéger son porteur."
 rowan_armor_01_name:0 "Armure des Rowan"
 rowan_armor_01_description:0 "Une armure de plates complète portée par-dessus une longue tunique ornée de motifs complexes de feuilles et de branches. Des motifs d'arbres parcourent l'ensemble de l'armure, laquelle est agrémentée de fioritures décoratives et d'une plaque frontale proéminente qui met l'ensemble en valeur."
 osgrey_armor_01_name:0 "Armure échiquetée"
 osgrey_armor_01_description:0 "Une armure de plates complète qui arbore un jupon à motif échiqueté, remplaçant l'aspect de l'acier nu par un emblème héraldique clinquant, parfait pour les maisons arborant des blasons échiquetés."
 osgrey_armor_02_name:0 "Armure en quartiers"
 osgrey_armor_02_description:0 "Une armure de plates complètes qui se compose d'un jupon en quartiers qui remplace l'acier sobre par un blason coloré, parfait pour les maisons arborant des emblèmes écartelés."
 lydden_armor_01_name:0 "Armure des Hautes Terres"
 lydden_armor_01_description:0 "Bien qu'étant une armure de plates complète, celle-ci ne possède pas certains éléments complexes que l'on retrouve dans d'autres modèles. Sa cuirasse carrée, l'absence de fauld, et ses épaulières circulaires la rendent particulièrement inhabituelle à Westeros, mais non pour autant dénuer d'indéniables avantages. Une tunique bicolore permet en outre d'afficher des armoiries."
 braavosi_armor_01_name:0 "Armure braavienne"
 braavosi_armor_01_description:0 "D'une conception flamboyante qui mêle plaques et lamelles, le plus remarquable n'est pourtant pas l'armure elle-même à proprement parler. Le textile chatoyant orné de fentes et de plis suggère qu'elle est conçue autant pour l'apparat que pour le combat."
 braavosi_armor_02_name:0 "Haute armure braavienne"
 braavosi_armor_02_description:0 "Une armure aux couleurs vives qui contraste avec des formes élaborées, combinant du textile monochrome et des plaques à du tissu richement décoré. Bien que d'apparence ostentatoire, elle reste portée par certains des bretteurs les plus redoutables qui soient."
 triarchy_armor_03_name:0 "Haute armure de la Triarchie"
 triarchy_armor_03_description:0 "Une armure faite d'écailles portées par-dessus un gilet de cuir et une tunique rembourrée, ornée dans un style emblématique des cités libres. La cuirasse bombée caractéristique contribue à dévier les coups afin de mieux protéger les zones vitales du porteur."
 decorated_dragon_plate_armor_01_name:0 "Armure de plates de dragon décorée"
 decorated_dragon_plate_armor_01_description:0 "Une armure d'un bleu ornée de liserées argentées qui accentue chacune des plaques qui la composent. Portée par-dessus un gilet d'écailles rembourré rouge vif, les cannelles qui la parcourent évoquent les ailes d'un dragon, et sa conception, qui ne laisse que peu d'espace non protégé, en fait une merveille d'artisanat."
 valyrian_armor_02_name:0 "Armure valyrienne"
 valyrian_armor_02_description:0 "Une armure cannelée qui arbore une patine sombre, la protégeant des intempéries, et dont les formes anguleuses et acérées contrastent avec la tunique ornée portée par-dessous. En outre, son absence de protection pour les avant-bras offre une meilleure agilité au combat."
 valyrian_armor_03_name:0 "Haute armure valyrienne"
 valyrian_armor_03_description:0 "Une armure de plates complète, présentant une patine sombre ornée de cannelures argentées et dont la longue tunique portée en dessous contraste avec le métal sombre. Des dents de dragon bordent certaines plaques, en plus de posséder des ailes de dragon gravées sur les épaules."
 valyrian_armor_03_red_name:0 "Haute armure écarlate valyrienne"
 valyrian_armor_03_red_description:0 "Une armure de plates complète, rouge et ornée de nombreux motifs de dragons, notamment des cannelures en forme de membranes d'ailes de dragon."
 valyrian_armor_03_high_name:0 "Armure de plates de dragon"
 valyrian_armor_03_high_description:0 "Une armure de plates complète bleutée, portée par-dessus une cotte de mailles et un gilet rembourré pour offrir une protection optimale. Elle est richement détaillée avec des cannelures et des motifs évoquant un dragon, notamment des tassettes et des articulations renforcées."
 valyrian_armor_03_high_red_name:0 "Armure écarlate de plates de dragon"
 valyrian_armor_03_high_red_description:0 "Une armure de plates émaillée d'un rouge qui brille de mille feux et dont les surfaces sont ornées de motifs de dragon, en sus de posséder des gantelets se terminant par des doigts griffus, offrant à l'ensemble une dimension offensive aussi bien que défensive."
 stormlander_armor_02_name:0 "Armure orageoise"
 stormlander_armor_02_description:0 "Une armure principalement composée d'éléments à lamelles, avec une brigandine sur le torse et un jupon et une cotte de mailles en dessous, sans oublier un manteau de mailles pour protéger le cou. Bien que moins protectrice qu'une armure de plates complète, elle permet une plus grande variété de couleurs que l'acier à nu."
 stormlander_armor_03_name:0 "Haute armure orageoise"
 stormlander_armor_03_description:0 "Une armure très cannelée qui se porte par-dessus un jupon. Bien qu'elle ne comprenne pas toutes les pièces d'une armure de plates complète, la cotte de mailles et le manteau offrent une protection efficace tout en préservant une certaine souplesse."
 westerlander_armor_02_name:0 "Armure ouestienne"
 westerlander_armor_02_description:0 "Une armure de plates complète, cannelée et ornée d'un petit surcot aux couleurs héraldiques, offrant un contraste avec l'acier nu."
 westerlander_armor_03_name:0 "Haute armure ouestienne"
 westerlander_armor_03_description:0 "Une armure de plates complète, richement cannelée et ornant des motifs distinctifs sur toute la surface. Un long tissu drapé sur l'épaule arbore des couleurs héraldiques."
 valeman_armor_02_name:0 "Armure valoise"
 valeman_armor_02_description:0 "Une brigandine qui utilise des plaques internes d'une taille exceptionnelle tout en conservant sa flexibilité. Les bras et le bas des jambes sont protégés par de larges plaques d'acier, conférant une excellente protection à son porteur."
 valeman_armor_03_name:0 "Haute armure valoise"
 valeman_armor_03_description:0 "Une armure réputée pour sa blancheur immaculée, en raison de l'absence de surcot ou de tissu, mais qui néanmoins possède de grandes plaques qui forment les épaulières, les tassettes ainsi que d'autres éléments voués à protéger davantage le porteur."
 reachman_armor_02_name:0 "Armure biefoise"
 reachman_armor_02_description:0 "Une armure sophistiquée dont la conception soignée allie esthétique et praticité. Le plastron et les épaulières bulbeuses sont recouverts de tissu pour arborer fièrement les armoiries directement sur l'armure."
 reachman_armor_03_name:0 "Haute armure biefoise"
 reachman_armor_03_description:0 "Une armure ornée de motifs floraux et végétaux tout en relief, avec une cotte en satin à manche courte portée en dessous, et qui met en valeur des couleurs héraldiques éclatantes."
 honeywiner_armor_01_name:0 "Armure hydromélienne"
 honeywiner_armor_01_description:0 "Une cuirasse de plate intégrale, fortement cannelée et qui utilise de grandes plaques pour protéger les parties vitales. La tunique portée par-dessus contraste grandement avec l'acier poli."
 riverlander_armor_03_name:0 "Armure commune riveraine"
 riverlander_armor_03_description:0 "Une armure composée d'écailles portées par-dessus un long haubert, avec des plaques pour protéger les mains et les jambes. Bien qu'elle soit moins protectrice qu'une armure de plates complète, elle offre néanmoins une plus grande flexibilité que cette dernière. Les écailles étincelantes créent, par ailleurs, un magnifique effet réfléchissant lorsque la lumière vient la frapper sous un certain angle."
 riverlander_armor_04_name:0 "Haute armure riveraine"
 riverlander_armor_04_description:0 "Une armure qui combine écailles et plaques, avec un haubert d'écailles et des plaques pour protéger le torse, les mains et les jambes. Un jupon apporte un brin de couleur et le manteau arbore un petit écu portant l'emblème de la maison."
 northman_armor_03_name:0 "Haute armure nordienne"
 northman_armor_03_description:0 "Une armure principalement composée d'éclisses et de brigandines, dont les plaques sont réservées uniquement aux articulations clés. Bien qu'elle permette afficher les couleurs de la maison, elle offre une protection moindre que les armures de plates plus sophistiquées."
 ironborn_armor_03_name:0 "Haute armure fer-née"
 ironborn_armor_03_description:0 "Une armure rudimentaire et lourde, composée de grandes plaques et de lames, ornée de pointes comme seule décoration, et qui, malgré sa conception grossière, offre une protection optimale."
 dornish_armor_03_name:0 "Haute armure dornienne"
 dornish_armor_03_description:0 "Une armure qui se compose de grandes plaques de bronze intégrées à une cotte de mailles, offrant un style propre à Dorne. En outre, elle offre une robuste protection sans pour autant étouffer son porteur et en lui garantissant une grande liberté de mouvement."
 stone_dornish_armor_01_name:0 "Armure dornienne rocheuse"
 stone_dornish_armor_01_description:0 "Une armure inhabituelle qui associe des écailles sous des plaques pour les membres, ainsi qu'une tunique rembourrée pour recouvrir le torse. Elle assure protection au porteur sans pour autant l'étouffer ou le limiter dans ses mouvements."
 hedge_knight_armor_01_name:0 "Armure de chevalier errant"
 hedge_knight_armor_01_description:0 "Un assemblage disparate de pièces, certaines rouillées ou cabossées, portée par-dessus un gambison et une cotte de mailles. Bien qu'elle manque de raffinement, cette armure fait ce qu'on attend d'elle, à savoir protéger son porteur."
 raven_feather_cloak_name:0 "Manteau en plumes de corbeau"
 raven_feather_cloak_description:0 "Un magnifique manteau fait de plumes d'onyx prélevées des corbeaux qui se perchent sur le barral de Corneilla."
 dennecent_axe_name:0 "Grignoteuse"
 dennecent_axe_description:0 "Nonobstant son nom, cette hache de bronze s’est forgée une réputation des plus redoutable entre les mains de la Maison Dennecent, devenant une arme séculaire ayant fait couler le sang de maintes générations, témoignant de l’idée que même la plus humble créature peut laisser son empreinte dans l’Histoire."
 lucerys_gun_name:0 "Flingue de Lucerys"
 lucerys_gun_desc:0 "Prépare toi à mourir."
 claimed_dawn_desc:0 "De droit ou de force, vous devez revendiquer Aube pour la manier."
 sword_of_the_morning_desc:0 "Épée du Matin"
 artifact_martell_wall_shield_name:0 "Bouclier dornien"
 artifact_martell_wall_shield_description:0 "Un bouclier dornien stylisé orné de décorations régionales."
 the_white_book_name:0 "Le Livre Blanc"
 the_white_book_desc:0 "Ce tome en cuir blanc, officiellement connu comme « le Livre des Frères », consigne les faits et exploits de tous les membres ayant servi au sein de l'illustre Garde Royale."
 agot_artifact_saans_scrolls_name:0 "Anciens parchemins valyriens"
 agot_artifact_saans_scrolls_desc:0 "Des anciens parchemins provenant de Valyria et qui narrent des histoires de prophéties et de dragons."
 treasure_map_name:0 "Une carte au trésor"
 treasure_map_description:0 "Une carte loin d’être en bon état mais qui est censé indiquer le lieu où repose l’épave d’un navire jadis chargé de richesses :\n\n« [sunken_ship_province.GetName] »"
 agot_artifact_winter_rose:0 "Rose d'hiver"
 agot_artifact_winter_rose_desc:0 "Une belle floraison bleu pâle, couleur des gelées de l’hiver."
 artifact_dragon_egg:0 "Œuf de dragon"
 artifact_dragon_egg_reforged_tt:0 "Votre œuf a été reforgé en un [court_artifact|El]"
 dud_egg_desc:0 "[egg_artifact.GetDesc]\n\nCet œuf semble pétrifié et ne montre aucun signe d'éclosion."
 dragon_egg_gen_desc:0 "Un œuf de dragon pétrifié. Le temps l'a changé en pierre, mais il restera toujours magnifique."
 dragon_egg_gen_parent:0 "[egg_artifact.GetDesc] Il a été pondu par [dragon_parent.GetName]."
 dragon_egg_gen_parents:0 "[egg_artifact.GetDesc] Il a été pondu par [dragon_parent.GetName] et [dragon_parent_other.GetName]."
 dragon_egg_rainbow:0 "Œuf de dragon arc-en-ciel"
 dragon_egg_rainbow_desc:0 "$dragon_egg_gen_desc$ Ses écailles iridescents scintillent comme du métal poli."
 dragon_egg_rainbow_desc_living:0 "Les écailles iridescents de cet œuf scintillent comme du métal poli."
 dragon_egg_yellow:0 "Œuf de dragon jaune"
 dragon_egg_yellow_desc:0 "$dragon_egg_gen_desc$ Ses écailles jaunes réfléchissant la lumière, il brille avec le même éclat qu'une flamme."
 dragon_egg_yellow_desc_living:0 "Ses écailles jaunes réfléchissant la lumière, cet œuf brille avec le même éclat qu'une flamme."
 dragon_egg_blue:0 "Œuf de dragon bleu"
 dragon_egg_blue_desc:0 "$dragon_egg_gen_desc$ Scintillant d'un bleu parfait, il évoque un magnifique ciel d'été."
 dragon_egg_blue_desc_living:0 "Scintillant d'un bleu parfait, cet œuf évoque un magnifique ciel d'été."
 dragon_egg_purple:0 "Œuf de dragon pourpre"
 dragon_egg_purple_desc:0 "$dragon_egg_gen_desc$ Son violet profond évoque un ciel au crépuscule, dont la lumière reflétée serait un voile d'étoiles scintillantes."
 dragon_egg_purple_desc_living:0 "Le violet profond de cet œuf évoque un ciel au crépuscule, dont la lumière reflétée serait un voile d'étoiles scintillantes."
 dragon_egg_red:0 "Œuf de dragon rouge"
 dragon_egg_red_desc:0 "$dragon_egg_gen_desc$ Ses écailles rouge foncé projettent des étincelles écarlates tels des rubis scintillant au soleil."
 dragon_egg_red_desc_living:0 "Les écailles rouge foncé de cet œuf projettent des étincelles écarlates tels des rubis scintillant au soleil."
 dragon_egg_tan:0 "Œuf de dragon crème"
 dragon_egg_tan_desc:0 "$dragon_egg_gen_desc$ Sa couleur donne l'impression d'y voir les dunes et tourbillons de poussière qu'on trouve à Dorne."
 dragon_egg_tan_desc_living:0 "La couleur de cet œuf donne l'impression d'y voir les dunes et tourbillons de poussière qu'on trouve à Dorne."
 dragon_egg_brown:0 "Œuf de dragon brun"
 dragon_egg_brown_desc:0 "$dragon_egg_gen_desc$ Teinté de reflets d'or et nappé d'une touche de bronze, il s'en trouve sublimé."
 dragon_egg_brown_desc_living:0 "Teinté de reflets d'or et nappé d'une touche de bronze, cet œuf s'en trouve sublimé."
 dragon_egg_blackdarkred:0 "Œuf de dragon obsidienne"
 dragon_egg_blackdarkred_desc:0 "$dragon_egg_gen_desc$ Ses écailles noires sont ondulées et tourbillonnées d'un écarlate profond."
 dragon_egg_blackdarkred_desc_living:0 "Les écailles noires de cet œuf sont ondulées et tourbillonnées d'un écarlate profond."
 dragon_egg_icefire:0 "Œuf de dragon de glace et de feu"
 dragon_egg_icefire_desc:0 "$dragon_egg_gen_desc$ Ses écailles, d'un bleu glaçant et d'un rouge ardent, donnent l'impression d'y voir une danse des éléments, comme une lutte éternelle entre deux rivaux."
 dragon_egg_icefire_desc_living:0 "Les écailles de cet œuf, d'un bleu glaçant et d'un rouge ardent, donnent l'impression d'y voir une danse des éléments, comme une lutte éternelle entre deux rivaux."
 dragon_egg_black:0 "Œuf de dragon noir"
 dragon_egg_black_desc:0 "$dragon_egg_gen_desc$ L'éclat d'obsidienne de cet œuf rappelle les plus sombres nuits sans lune."
 dragon_egg_black_desc_living:0 "L'éclat d'obsidienne de cet œuf rappelle les plus sombres nuits sans lune."
 dragon_egg_orange:0 "Œuf de dragon orange"
 dragon_egg_orange_desc:0 "$dragon_egg_gen_desc$ Le ton orangé de ses éclats le rendent aussi magnifique à regarder qu'un coucher de soleil."
 dragon_egg_orange_desc_living:0 "Le ton orangé de ses éclats rendent cet œuf aussi magnifique à regarder qu'un coucher de soleil."
 dragon_egg_white:0 "Œuf de dragon blanc"
 dragon_egg_white_desc:0 "$dragon_egg_gen_desc$ Le blanc nacré de ses écailles lui donnent l'apparence d'une perle."
 dragon_egg_white_desc_living:0 "Le blanc nacré des écailles de cet œuf lui donnent l'apparence d'une perle."
 dragon_egg_pink:0 "Œuf de dragon rose"
 dragon_egg_pink_desc:0 "$dragon_egg_gen_desc$ Ses écailles d'un rose pâle reflètent avec délicatesse la lumière."
 dragon_egg_pink_desc_living:0 "Les écailles d'un rose pâle de cet œuf reflètent avec délicatesse la lumière."
 dragon_egg_green_1:0 "Œuf de dragon vert"
 dragon_egg_green_1_desc:0 "$dragon_egg_gen_desc$ Son vert pétant le fait ressembler à une énorme émeraude plus belle qu'aucune autre."
 dragon_egg_green_1_desc_living:0 "Le vert pétant de cet œuf le fait ressembler à une énorme émeraude plus belle qu'aucune autre."
 dragon_egg_green_2:0 "Œuf de dragon béryl"
 dragon_egg_green_2_desc:0 "$dragon_egg_gen_desc$ Un vert profond parsemé de reflets de bronze en fait un ornement d'une beauté quasi inégalable."
 dragon_egg_green_2_desc_living:0 "Un vert profond parsemé de reflets de bronze fait de cet œuf un ornement d'une beauté quasi inégalable."
 dragon_egg_grey_1:0 "Œuf de dragon gris"
 dragon_egg_grey_1_desc:0 "$dragon_egg_gen_desc$ De par sa teinte fumée, on jurerait qu'il est couvert d'une couche de cendres volcaniques."
 dragon_egg_grey_1_desc_living:0 "De par sa teinte fumée, on jurerait que cet œuf est couvert d'une couche de cendres volcaniques."
 dragon_egg_grey_2:0 "Œuf de dragon ardoise"
 dragon_egg_grey_2_desc:0 "$dragon_egg_gen_desc$ De par sa teinte fumée, on jurerait qu'il est couvert d'une couche de cendres volcaniques."
 dragon_egg_grey_2_desc_living:0 "De par sa teinte fumée, on jurerait que cet œuf est couvert d'une couche de cendres volcaniques."
 dragon_egg_gold:0 "Œuf de dragon doré"
 dragon_egg_gold_desc:0 "$dragon_egg_gen_desc$ Ses écailles dorées scintillant à la lumière, il ne souffre d'aucun rival en termes de beauté."
 dragon_egg_gold_desc_living:0 "Les écailles dorées de cet œuf scintillant à la lumière, il ne souffre d'aucun rival en termes de beauté."
 dragon_egg_whitegold:0 "Œuf de dragon ivoire"
 dragon_egg_whitegold_desc:0 "$dragon_egg_gen_desc$ Ses écailles laiteuses sont complétées par de profondes veines dorées qui scintillent tels les rayons du soleil."
 dragon_egg_whitegold_desc_living:0 "Les écailles laiteuses de cet œuf sont complétées par de profondes veines dorées qui scintillent tels les rayons du soleil."
 dragon_egg_purplegold:0 "Œuf de dragon amétrine"
 dragon_egg_purplegold_desc:0 "$dragon_egg_gen_desc$ Ses teintes violettes s'entrelacent avec des stries dorées chatoyantes, créant une apparence majestueuse rappelant les tapisseries royales."
 dragon_egg_purplegold_desc_living:0 "Les teintes violettes de cet œuf s'entrelacent avec des stries dorées chatoyantes, créant une apparence majestueuse rappelant les tapisseries royales."
 dragon_egg_flame:0 "Œuf de dragon flamboyant"
 dragon_egg_flame_desc:0 "$dragon_egg_gen_desc$ Sa surface scintille de teintes ardentes, ressemblant à des flammes tourbillonnantes qui dansent et lèchent l'air avec des tons orange, rouge et jaune vifs."
 dragon_egg_flame_desc_living:0 "La surface de cet œuf scintille de teintes ardentes, ressemblant à des flammes tourbillonnantes qui dansent et lèchent l'air avec des tons orange, rouge et jaune vifs."
 dragon_egg_blackred:0 "Œuf de dragon hématite"
 dragon_egg_blackred_desc:0 "$dragon_egg_gen_desc$ Majoritairement noir, il est néanmoins orné çà et là de quelques taches rouge vif brillant telles des gouttes de sang dans une obscurité uniforme."
 dragon_egg_blackred_desc_living:0 "Cet œuf est majoritairement noir, il est néanmoins orné çà et là de quelques taches rouge vif brillant telles des gouttes de sang dans une obscurité uniforme."
 dragon_egg_brownspots:0 "Œuf de dragon enstatite"
 dragon_egg_brownspots_desc:0 "$dragon_egg_gen_desc$ Sa surface d'un brun hétérogène comprend plusieurs variations plus ou moins claires, le tout formant des motifs naturels qui s'apparente à ceux qu'on peut trouver sur l'écorce de vieux arbres."
 dragon_egg_brownspots_desc_living:0 "La surface de cet œuf d'un brun hétérogène comprend plusieurs variations plus ou moins claires, le tout formant des motifs naturels qui s'apparente à ceux qu'on peut trouver sur l'écorce de vieux arbres."
 dragon_egg_redblackgold:0 "Œuf de dragon cendré"
 dragon_egg_redblackgold_desc:0 "$dragon_egg_gen_desc$ Ses écailles d'un pourpre profond sont bordées d'or scintillant, tandis que des touches de noirs rajoutent une part de mystère et d'élégance à l'ensemble."
 dragon_egg_redblackgold_desc_living:0 "Les écailles d'un pourpre profond de cet œuf sont bordées d'or scintillant, tandis que des touches de noirs rajoutent une part de mystère et d'élégance à l'ensemble."
 dragon_egg_palered:0 "Œuf de dragon corail"
 dragon_egg_palered_desc:0 "$dragon_egg_gen_desc$ Sa surface rouge pâle exsude une lueur douce et chaleureuse, rappelant un délicat rougissement à l'aube."
 dragon_egg_palered_desc_living:0 "La surface rouge pâle de cet œuf exsude une lueur douce et chaleureuse, rappelant un délicat rougissement à l'aube."
 dragon_egg_darkblue:0 "Œuf de dragon cobalt"
 dragon_egg_darkblue_desc:0 "$dragon_egg_gen_desc$ Sa surface d'un bleu profond évoque les profondeurs de l'océan, dégageant un sentiment mêlant mystère et quiétude."
 dragon_egg_darkblue_desc_living:0 "La surface d'un bleu profond de cet œuf évoque les profondeurs de l'océan, dégageant un sentiment mêlant mystère et quiétude."
 dragon_egg_darkred:0 "Œuf de dragon carmin"
 dragon_egg_darkred_desc:0 "$dragon_egg_gen_desc$ Sa surface est d'un rouge profond et intense, comme s'il avait été plongé dans du sang frais, et les pointes de noir sombre accentuent l'allure inquiétante qui en émane."
 dragon_egg_darkred_desc_living:0 "La surface de cet œuf est d'un rouge profond et intense, comme s'il avait été plongé dans du sang frais, et les pointes de noir sombre accentuent l'allure inquiétante qui en émane."
 dragon_egg_frost:0 "Œuf de dragon givré"
 dragon_egg_frost_desc:0 "$dragon_egg_gen_desc$ Sa surface est un mélange saisissant de blanc glacé et de bleu givré, sa surface rayonnant d’un froid hivernal."
 dragon_egg_frost_desc_living:0 "La surface de cet œuf est un mélange saisissant de blanc glacé et de bleu givré, sa surface rayonnant d’un froid hivernal."
 dragon_egg_greengrey:0 "Œuf de dragon émeraude"
 dragon_egg_greengrey_desc:0 "$dragon_egg_gen_desc$ Sa surface vert pâle est agrémentée de délicats tourbillons gris, créant un motif serein et fascinant."
 dragon_egg_greengrey_desc_living:0 "La surface vert pâle de cet œuf est agrémentée de délicats tourbillons gris, créant un motif serein et fascinant."
 dragon_egg_magma:0 "Œuf de dragon magma"
 dragon_egg_magma_desc:0 "$dragon_egg_gen_desc$ Sa surface, mélange ardent de rouges et d'oranges fondus, lui donne l'apparence d'une boule de magma bouillonnant, qui donne l'impression d'y voir un fragment du Fléau de Valyria."
 dragon_egg_magma_desc_living:0 "La surface de cet œuf, mélange ardent de rouges et d'oranges fondus, lui donne l'apparence d'une boule de magma bouillonnant, qui donne l'impression d'y voir un fragment du Fléau de Valyria."
 dragon_egg_darkpurple:0 "Œuf de dragon violet"
 dragon_egg_darkpurple_desc:0 "$dragon_egg_gen_desc$ Ses nuances diverses de violet cristallisent une teinte qui capture l'essence même d'un crépuscule caractéristique."
 dragon_egg_darkpurple_desc_living:0 "Les nuances diverses de violet de cet œuf cristallisent une teinte qui capture l'essence même d'un crépuscule caractéristique."
 dragon_egg_palepink:0 "Œuf de dragon rosé"
 dragon_egg_palepink_desc:0 "$dragon_egg_gen_desc$ Le rose pâle et délicat de sa surface donne une teinte douce et apaisante, qui lui confère une aura de pureté et de gracieuseté."
 dragon_egg_palepink_desc_living:0 "Le rose pâle et délicat de la surface de cet œuf lui donne une teinte douce et apaisante, qui lui confère une aura de pureté et de gracieuseté."
 dragon_egg_palebluepink:0 "Œuf de dragon opale"
 dragon_egg_palebluepink_desc:0 "$dragon_egg_gen_desc$ D’une douce teinte bleu pâle, il est orné de délicates taches roses, rappelant une fraîche matinée de printemps."
 dragon_egg_palebluepink_desc_living:0 "D’une douce teinte bleu pâle, cet œuf est orné de délicates taches roses, rappelant une fraîche matinée de printemps."
 dragon_egg_pinkspot:0 "Œuf de dragon magenta"
 dragon_egg_pinkspot_desc:0 "$dragon_egg_gen_desc$ Il rayonne de teintes vibrantes de rose vif et de violet, se mélangeant dans un éclat saisissant de couleurs."
 dragon_egg_pinkspot_desc_living:0 "Cet œuf rayonne de teintes vibrantes de rose vif et de violet, se mélangeant dans un éclat saisissant de couleurs."
 dragon_egg_rainbowgold:0 "Œuf de dragon prismatique"
 dragon_egg_rainbowgold_desc:0 "$dragon_egg_gen_desc$ Il exhibe une gamme de couleurs sombre entremêlé de reflets dorés, formant un dédale de couleurs captivantes."
 dragon_egg_rainbowgold_desc_living:0 "Cet œuf exhibe une gamme de couleurs sombre entremêlé de reflets dorés, formant un dédale de couleurs captivantes."
 dragon_egg_sunburst:0 "Œuf de dragon radieux"
 dragon_egg_sunburst_desc:0 "$dragon_egg_gen_desc$ Sa surface éclate de teintes vibrantes, rappelant un rayon de soleil radieux, ses couleurs se mélangeant dans un spectacle éblouissant de chaleur et d'énergie."
 dragon_egg_sunburst_desc_living:0 "La surface de cet œuf éclate de teintes vibrantes, rappelant un rayon de soleil radieux, ses couleurs se mélangeant dans un spectacle éblouissant de chaleur et d'énergie."
 dragon_egg_goldpink:0 "Œuf de dragon triphane"
 dragon_egg_goldpink_desc:0 "$dragon_egg_gen_desc$ Il brille d'une teinte dorée brillante, délicatement embrassée par des nuances de rose tendre, dégageant une aura d'élégance et de chaleur."
 dragon_egg_goldpink_desc_living:0 "Cet œuf brille d'une teinte dorée brillante, délicatement embrassée par des nuances de rose tendre, dégageant une aura d'élégance et de chaleur."
 dragon_egg_bluebronze:0 "Œuf de dragon apatite"
 dragon_egg_bluebronze_desc:0 "$dragon_egg_gen_desc$ Il présente un mélange harmonieux de bleu profond et de bronze exquis, créant un savant mélange qui lui confère un caractère royal."
 dragon_egg_bluebronze_desc_living:0 "Cet œuf présente un mélange harmonieux de bleu profond et de bronze exquis, créant un savant mélange qui lui confère un caractère royal."
 dragon_egg_greenorange:0 "Œuf de dragon unakite"
 dragon_egg_greenorange_desc:0 "$dragon_egg_gen_desc$ Il affiche un contraste vif de vert et d'orange, dont il émane une sensation d'énergie et de clarté."
 dragon_egg_greenorange_desc_living:0 "Cet œuf affiche un contraste vif de vert et d'orange, dont il émane une sensation d'énergie et de clarté."
 dragon_egg_bronze:0 "Œuf de dragon bronze"
 dragon_egg_bronze_desc:0 "$dragon_egg_gen_desc$ Sa surface est d'un bronze brillant, reflétant une teinte chaude et riche rappelant le métal vieilli."
 dragon_egg_bronze_desc_living:0 "La surface de cet œuf est d'un bronze brillant, reflétant une teinte chaude et riche rappelant le métal vieilli."
 dragon_egg_blackgreen:0 "Œuf de dragon feu grégeois"
 dragon_egg_blackgreen_desc:0 "$dragon_egg_gen_desc$ Imprégné de sinistres tourbillons de noirs menaçants et de verts étranges, il évoque la folie et le danger de par la profondeur de sa teinte."
 dragon_egg_blackgreen_desc_living:0 "Imprégné de sinistres tourbillons de noirs menaçants et de verts étranges, cet œuf évoque la folie et le danger de par la profondeur de sa teinte."
 dragon_egg_greygreenyellow:0 "Œuf de dragon andalousite"
 dragon_egg_greygreenyellow_desc:0 "$dragon_egg_gen_desc$ Son motif imite la palette de la nature, mélangeant des couleurs tel que du vert, du brun et du tan dans un ensemble harmonieux qui évoque les sous-bois."
 dragon_egg_greygreenyellow_desc_living:0 "Le motif cet œuf imite la palette de la nature, mélangeant des couleurs tel que du vert, du brun et du tan dans un ensemble harmonieux qui évoque les sous-bois."
 dragon_egg_blackyellow:0 "Œuf de dragon serpentine"
 dragon_egg_blackyellow_desc:0 "$dragon_egg_gen_desc$ Il est orné de tons noirs et jaunes saisissants, créant un contraste audacieux et accrocheur qui rappelle les abeilles volant au milieu d'un rêve de printemps."
 dragon_egg_blackyellow_desc_living:0 "Cet œuf est orné de tons noirs et jaunes saisissants, créant un contraste audacieux et accrocheur qui rappelle les abeilles volant au milieu d'un rêve de printemps."
 dragon_egg_yellowgreen:0 "Œuf de dragon péridot"
 dragon_egg_yellowgreen_desc:0 "$dragon_egg_gen_desc$ Il rayonne de teintes jaunes et vertes vibrantes, capturant l'essence du feuillage frais du printemps et des joyeuses journées ensoleillées."
 dragon_egg_yellowgreen_desc_living:0 "Cet œuf rayonne de teintes jaunes et vertes vibrantes, capturant l'essence du feuillage frais du printemps et des joyeuses journées ensoleillées."
 dragon_egg_silver:0 "Œuf de dragon argenté"
 dragon_egg_silver_desc:0 "$dragon_egg_gen_desc$ Il a une surface lisse semblable à un miroir et dégage une aura de quiétude empreinte de mysticisme."
 dragon_egg_silver_desc_living:0 "La surface lisse de cet œuf est semblable à un miroir et dégage une aura de quiétude empreinte de mysticisme."
 dragon_egg_america:0 "Œuf de dragon rubis lazuli"
 dragon_egg_america_desc:0 "$dragon_egg_gen_desc$ Des bandes écarlates, blanches et bleues ondulent à sa surface, évoquant le cœur d'une tempête."
 dragon_egg_america_desc_living:0 "Cet œuf possède des bandes écarlates, blanches et bleues qui ondulent à sa surface, évoquant le cœur d'une tempête."
 dragon_egg_greyBlue:0 "Œuf de dragon bleu brumeux"
 dragon_egg_greyBlue_desc:0 "$dragon_egg_gen_desc$ Sa coquille brille d'une teinte d'acier froid, où le bleu brumeux se fond dans un gris orageux, évoquant les vagues se brisant contre les récifs."
 dragon_egg_greyBlue_desc_living:0 "La coquille de cet œuf brille d'une teinte d'acier froid, où le bleu brumeux se fond dans un gris orageux, évoquant les vagues se brisant contre les récifs."
 dragon_egg_redGreen:0 "Œuf de dragon tourmaline"
 dragon_egg_redGreen_desc:0 "$dragon_egg_gen_desc$ Des veines écarlates s'enroulent autour de ses écailles d'émeraude, à l'image d'un incendie qui dévore une forêt verdoyante."
 dragon_egg_redGreen_desc_living:0 "Les veines écarlates de cet œuf s'enroulent autour de ses écailles d'émeraude, à l'image d'un incendie qui dévore une forêt verdoyante."
 dragon_egg_lightBrown:0 "Œuf de dragon ocre"
 dragon_egg_lightBrown_desc:0 "$dragon_egg_gen_desc$ Sa coquille évoque la chaleur de l'argile cuite au soleil et le parfum de la pluie sur le sol, ancré et ancien."
 dragon_egg_lightBrown_desc_living:0 "La coquille de cet œuf évoque la chaleur de l'argile cuite au soleil et le parfum de la pluie sur le sol, ancré et ancien."
 dragon_egg_redYellow:0 "Œuf de dragon crépusculaire"
 dragon_egg_redYellow_desc:0 "$dragon_egg_gen_desc$ Les traînées dorées qui brillent à travers ses écailles rouges lui donnent l'apparence d'un soleil se couchant dans une mer de flammes en fusion."
 dragon_egg_redYellow_desc_living:0 "Cet œuf arbore des traînées dorées qui brillent à travers ses écailles rouges, lui donnant l'apparence d'un soleil se couchant dans une mer de flammes en fusion."
 dragon_egg_blackWhite:0 "Œuf de dragon marbré"
 dragon_egg_blackWhite_desc:0 "$dragon_egg_gen_desc$ L'équilibre parfait entre ombre et lumière qui tourbillonne à la surface de sa coquille n'est pas sans rappeler la dualité omniprésente de ce monde."
 dragon_egg_blackWhite_desc_living:0 "Cet œuf, de par l'équilibre parfait entre ombre et lumière qui tourbillonne à la surface de sa coquille, n'est pas sans rappeler la dualité omniprésente de ce monde."
 dragon_egg_spotPurple:0 "Œuf de dragon pourpre nacré"
 dragon_egg_spotPurple_desc:0 "$dragon_egg_gen_desc$ Ses nuances d'un violet royal tourbillonnent harmonieusement avec un blanc qui rappelle la nacre, donnant à l'ensemble un côté presque enchanteur."
 dragon_egg_spotPurple_desc_living:0 "Cet œuf possède des nuances d'un violet royal tourbillonnant harmonieusement avec un blanc qui rappelle la nacre, donnant à l'ensemble un côté presque enchanteur."
 dragon_egg_teal:0 "Œuf de dragon sarcelle"
 dragon_egg_teal_desc:0 "$dragon_egg_gen_desc$ Sa coquille ondule au gré de teintes paisibles évoquant la mer, où le bleu se marie sereinement au vert."
 dragon_egg_teal_desc_living:0 "La coquille de cet œuf ondule au gré de teintes paisibles évoquant la mer, où le bleu se marie sereinement au vert."
 dragon_egg_tealSpot:0 "Œuf de dragon aigue-marine"
 dragon_egg_tealSpot_desc:0 "$dragon_egg_gen_desc$ Des courants blancs tourbillonnent tout du long de la coquille d'un bleu cyan léger, à l'image des remous qui se dessinent à la surface d'une mer paisible."
 dragon_egg_tealSpot_desc_living:0 "Sur ce œuf figurent des courants blancs qui tourbillonnent tout du long de la coquille d'un bleu cyan léger, à l'image des remous qui se dessinent à la surface d'une mer paisible."
 dragon_egg_weirwood:0 "Œuf de dragon blanc barral"
 dragon_egg_weirwood_desc:0 "$dragon_egg_gen_desc$ Ses écailles pâles comme la lune parcourues de veines écarlates ne sont pas sans rappeler les arbres sacrés des Anciens Dieux, attentifs et séculaires."
 dragon_egg_weirwood_desc_living:0 "Les écailles de cet œuf, pâles comme la lune, sont parcourues de veines écarlates, ce qui n'est sans rappeler les arbres sacrés des Anciens Dieux, attentifs et séculaires."
 dragon_egg_lime:0 "Œuf de dragon lime"
 dragon_egg_lime_desc:0 "$dragon_egg_gen_desc$ Son éclat verdoyant lui donne une apparence de gros agrume qui foudroie de par sa vitalité reflétée."
 dragon_egg_lime_desc_living:0 "Cet œuf possède un éclat verdoyant qui lui donne une apparence de gros agrume, foudroyant de par sa vitalité reflétée."
 artifact_dragon_skull:0 "Crâne de dragon"
 agot_artifact_dragon_skull_name:0 "Le crâne de [dragon.GetNameNoTooltip]"
 agot_artifact_dragon_skull_desc:0 "Ce crâne a appartenu à [newly_created_artifact.MakeScope.Var('dragon').Char.GetNameNicknamed], un[newly_created_artifact.MakeScope.Var('dragon').Char.Custom('DR_FR_E')] drago[newly_created_artifact.MakeScope.Var('dragon').Char.Custom('DR_FR_NNne')] de [newly_created_artifact.GetFeatureText('dragon_skull_size')], dont le feu et la chair ont été changé en cendres et en os. [newly_created_artifact.Custom('DragonSkullIsSmallSkull')]\n\n[newly_created_artifact.Custom('DragonSkullGetDragonRider')] [newly_created_artifact.Custom('DragonSkullGetDragonKiller')]"
 agot_own_red_keep.tt:0 "Cet artefact ne peut être exposé que dans le Donjon Rouge."
 feature_dragon_skull_size_huge:0 "taille massive"
 feature_dragon_skull_size_large:0 "grande taille"
 feature_dragon_skull_size_medium:0 "taille moyenne"
 feature_dragon_skull_size_small:0 "petite taille"
 agot_empty:0 ""
 agot_artifact_dragon_skull_natural:0 "$agot_empty$"
 agot_artifact_dragon_skull_slain:0 " La bête a été occis par [ROOT.Var('killer').Char.Custom('FR_le_Char')][ROOT.Var('killer').Char.GetName]."
 agot_artifact_dragon_skull_past_rider:0 "[ROOT.Var('dragon').Char.Custom('DR_FR_IlElle')|U] fut revendiqué[ROOT.Var('dragon').Char.Custom('DR_FR_E')] pour la première fois par [ROOT.Var('rider').Char.Custom('FR_le_Char')][ROOT.Var('rider').Char.GetName]."
 agot_artifact_dragon_skull_famous_past_rider:0 "[ROOT.Var('dragon').Char.GetNameNoTooltip] était monté[ROOT.Var('dragon').Char.Custom('DR_FR_E')] par [ROOT.Var('famous_rider').Char.Custom('FR_le_Char')][ROOT.Var('famous_rider').Char.GetNameNicknamed]."
 agot_artifact_dragon_skull_wall_ornament:0 "Malgré l'absence d'yeux, on pourrait jurer que ces cavités n'ont de cesse d'observer tous ceux qui passent."
 artifact_dragon_horn:0 "Corne de dragon"
 agot_artifact_dragon_horn_desc:0 "[newly_created_artifact.Custom('DragonHornForgedBy')] Les glyphes valyriens sculptés à sa surface ne laissent aucun doute quant à sa nature mystique. On pense que les seigneurs dragons de jadis utilisaient de tels artefacts pour lier les dragons à leur volonté."
 agot_artifact_dragon_horn_old_valyria:0 "Ce cor d'enfer a été forgé à partir des restes d'un dragon de l'Antique Valyria."
 agot_artifact_dragon_horn_after_doom:0 "Ce cor d'enfer a été forgé à partir des restes de [ROOT.Var('dragon').Char.GetName] par [ROOT.Var('creator').Char.GetName]."
 agot_dragonbinder:0 "Dompte-dragon"
 agot_artifact_dragonbinder_desc:0 "Mesurant plus de 6 pieds de long, ce cor d'enfer a été forgée à partir des restes d'un énorme dragon de l'Antique Valyria. Il brille d'un noir profond et est entouré d'or rouge et d'acier valyrien. Des glyphes sont gravés dans la surface réfléchissante, mais déformée, de cette corne. Au vu de leur nature, seuls ceux sachant lire le valyrien peuvent les déchiffrer. [ROOT.Char.Custom('DragonBinderReadValyrian')]"
 agot_dragonbinder_read_valyrian:0 "Il y est inscrit : « Je suis Dompte-dragon... Aucun mortel qui me sonnera n’y survivra... Du sang pour le feu, du feu pour le sang. »"
 agot_must_bind_horn.tt:0 "Seul quelqu'un lié au cor peut l'utiliser."
 uller_skull:0 "Crâne aux yeux d'améthyste"
 uller_skull_desc:0 "La maison Uller garde un bien étrange objet dans son château : un crâne tout ce qu'il y a de plus banal, à l'exception des deux améthystes qui trônent dans ses orbites. Lorsqu'on leur pose la question, les Uller se contentent de sourire en disant qu'il s'agit d'un vieil héritage."
 hands_hand:0 "Main de la Main"
 hands_hand_desc:0 "L'Amant des Veuves était tristement célèbre pour sa cruauté et lorsque la rançon d'Orys Baratheon arriva enfin, il amputa chaque captif de leur main d'épée, y compris celle de la Main du Roi en personne, Orys Baratheon."
 smugglers_fingers:0 "Doigts du contrebandier oignon"
 smugglers_fingers_desc:0 "Les doigts du contrebandier oignon"
 aemond_eye:0 "L'Œil du Parricide"
 aemond_eye_desc:0 "Ce saphir, qui serait l’œil d’Aemond le Parricide, a été retrouvé sur les rives de l’Œildieu."
 fox_wedding_cloak:0 "La cape d'épousailles de la Renarde"
 fox_wedding_cloak_desc:0 "Selon la légende, Florys la Renarde aurait eu trois maris, portant une cape différente à chaque mariage."
 stars_of_hugor:0 "L'Étoile d'Hugor"
 stars_of_hugor_desc:0 "L'une des sept étoiles légendaires arrachées du ciel par le Père en personne pour en sertir la couronne de Hugor de la Colline."
 harp_of_the_bard:0 "Harpe du Barde"
 harp_of_the_bard_desc:0 "Cette vieille harpe délabrée aurait appartenu à un barde qui avait volé une rose bleue."
 symeon_left_eye:0 "L'œil gauche de Symeon"
 symeon_right_eye:0 "L'œil droit de Symeon"
 symeon_eye_desc:0 "L'un des saphirs étoilés utilisés par le légendaire chevalier Symeon Prunelles étoilées."
 oily_black_stone:0 "Morceau de pierre noire huileuse"
 oily_black_stone_desc:0 "Un morceau de pierre noire huileuse"
 giants_tooth:0 "Dent de géant"
 giants_tooth_desc:0 "Une dent qui ressemble en tout point à une molaire humaine — si on met de côté sa taille gargantuesque."
 forgotten_magnars_drinking_horn:0 "Corne à boire oubliée du Magnar"
 forgotten_magnars_drinking_horn_desc:0 "Cette corne à boire magnifiquement décorée appartenait jadis à un chef des Premiers Hommes. Il est peu probable de parvenir à déterminer qui était l'ancien propriétaire."
 eggs_boot:0 "Botte de l'Œuf"
 eggs_boot_desc:0 "Cette chevalière a été offerte à Aegon V par son père pour ses services en tant qu'écuyer de Ser Duncan le Grand, un chevalier errant."
 harmund_tongue:0 "Langue d'Harmund"
 harmund_tongue_desc:0 "À l'intérieur d'une boîte richement sculptée et ornée, portant le sceau des Lannister, se trouve une langue séchée et conservée. Selon certains, cette boîte aurait été prise lors d'un raid dans les Terres de l'Ouest, et sa nature semble le confirmer, mais la langue qui se trouve à l'intérieur aurait appartenu à Harmund III, qui s'en serait vu dépossédé par la Pie-grièche en punition de ses mensonges et blasphèmes."
 rhaegar_ruby:0 "Rubis du Trident"
 rhaegar_ruby_desc:0 "Lorsque Robert Baratheon a porté le coup fatal à Rhaegar Targaryen, les rubis de son plastron se sont dispersés dans l'eau. Certains d’entre eux s’échouent encore occasionnellement sur les rives du Trident."
 bran_set_square:0 "Équerres de Brandon"
 bran_set_square_desc:0 "Selon la légende, ces équerres auraient été utilisés par Brandon Stark, premier du nom, dit Brandon le Bâtisseur, l'homme a qui l'on doit la première Grand-Tour, Accalmie, le Mur ainsi que Winterfell."
 dragon_blood_and_bones_potion:0 "Élixir draconique"
 dragon_blood_and_bones_potion_desc:0 "Un breuvage trouble fabriqué à partir du sang et des ossements fraîchement prélevés de [dragon.GetName]. Bien que ses effets ne soient pas tout à fait clairs, ceux qui en ont consommé sont connus pour avoir... d'étranges expériences qu'ils attribuent à cet élixir."
 gold_leaves_name:0 "Feuilles d'or"
 gold_leaves_desc:0 "Une paire de feuilles d'or qui, dit-on, serait tombée de l'arbre autrefois planté par Rowan Arbre-d'Or, naît d'une pomme enveloppée de ses cheveux dorés. Si cette véracité est contestée, du fait qu'un orfèvre aurait pu les façonner sans mal, la Maison Rowan n'apprécie guère qu'on la remette en doute."
 bors_skull_name:0 "Le crâne de Bors"
 bors_skull_desc:0 "L'héritage de la Maison Bulwer, qui n'est autre qu'un crâne humain pourvu de cornes de taureau, noires et brillantes — une difformité que Bors le Fracasseur aurait obtenue en s'abreuvant exclusivement de sang de taureau."
 elenei_cloak_name:0 "Cape virginale d'Elenei"
 elenei_cloak_desc:0 "Cette cape était un précieux héritage, jadis de la maison Durrandon, aujourd'hui de la maison Baratheon. Le tissu, de conception inconnue, est tout aussi doux qu'il est magnifique, semblable à de la soie, mais en plus léger et plus résistant. Elle est souvent utilisée pour appuyer l'origine divine d'Elenei."
 elenei_cloak_old_desc:0 "Précieux héritage de la maison Durrandon, cette cape, confectionnée à partir d'un tissu de conception inconnue, qui est tout aussi doux que magnifique, semblable à de la soie, mais en plus léger et plus résistant. Elle est souvent utilisée pour appuyer l'origine divine d'Elenei."
 stone_skin_club_name:0 "Gourdin du Géant Gris"
 stone_skin_club_desc:0 "Selon la légende, Argoth Peau-de-Pierre fut le vainqueur du tout premier tournoi de Westeros, et bien que le prix devait être la main de Maris la Jouvencelle, l'une des filles de Garth Mainverte, le Géant Gris se fit priver de sa récompense au profit du roi Uthor de la Grand-Tour, seigneur de Villevieille."
 herndons_horn_name:0 "Bris du Cor d'Herndon"
 herndons_horn_desc:0 "Les morceaux brisés d'une vieille corne en os, dont la Maison Tarly affirme qu'il s'agirait des fragments du cor de chasse autrefois utilisé par Herndon du Cor, l'un des frères légendaires fondateurs de leur maison."
 florys_cloak_01_name:0 "Cape d'épousailles de la Renarde"
 florys_cloak_01_desc:0 "Selon la légende, Florys la Renarde prit trois époux, portant une cape différente à chaque mariage. Celle-ci serait l'une d'entre elles, restée aux mains de la Maison Florent depuis l'Âge des Héros."
 florys_cloak_02_name:0 "Cape d'épousailles de la Renarde"
 florys_cloak_02_desc:0 "Selon la légende, Florys la Renarde prit trois époux, portant une cape différente à chaque mariage. Celle-ci serait l'une d'entre elles, restée aux mains de la Maison Peake depuis l'Âge des Héros."
 florys_cloak_03_name:0 "Cape d'épousailles de la Renarde"
 florys_cloak_03_desc:0 "Selon la légende, Florys la Renarde prit trois époux, portant une cape différente à chaque mariage. Celle-ci serait l'une d'entre elles, restée aux mains de la Maison Boule depuis l'Âge des Héros."
 foss_bow_name:0 "Arc de Foss"
 foss_bow_desc:0 "Un arc ancien, préservé pour éviter qu'il ne se brise, et qui aurait prétendument appartenu à Foss l'Archer, père de la Maison Fossovoie et fils du légendaire Garth Mainverte. On lui prêtait la coutume de tirer sur des pommes placées sur la tête des demoiselles sur lesquelles il avait jeté son dévolu."
 dondarrion_message_name:0 "Message du Seigneur la Foudre"
 dondarrion_message_desc:0 "La Maison Dondarrion aurait été fondée par un messager, lequel fut sauvé d'une embuscade par la grâce d'un éclair qui s'abattit sur deux Dorniens, lui permettant de délivrer sa précieuse missive à temps. Le message en question a été scellé et conservé en guise d'héritage."
 flaying_knife_name:0 "Couteau affutée"
 flaying_knife_desc:0 "Une lame particulièrement aiguisée, autrefois utilisée pour dépecer les ennemis de la Maison Bolton. Si la pratique est aujourd'hui interdite, des rumeurs évoquent des histoires de peau de prisonniers exposés dans une chambre secrète de Fort-Terreur, laissant supposer que la coutume aurait malgré tout survécu."
 falcon_knight_helm_name:0 "Heaume brisé du Chevalier Faucon"
 falcon_knight_helm_desc:0 "Le heaume brisé du prétendu « Chevalier Faucon » tué par le Roi Robar II Royce, et dont la bravoure aura permis au véritable Chevalier Faucon, Ser Artys Arryn, de prendre à revers les Premiers Hommes et de remporter la bataille décisive des Sept Étoiles."
 marsh_king_mount_name:0 "Peau de la monture du Roi des Paluds"
 marsh_king_mount_desc:0 "La Maison Reed a longtemps conservé la peau du lézard-lion personnel du Roi des Paluds, sur lequel il chevaucha à la rencontre des Rois de l'Hiver."
 horns_of_the_wood_name:0 "Cornes du Bois"
 horns_of_the_wood_desc:0 "Les imposants épois d'un orignac, montés sur une belle plaque."
 green_hand_tabard_name:0 "Tabard de la Main Verte"
 green_hand_tabard_desc:0 "Un tabard orné du symbole de l'Ordre de la Main Verte. Bien qu'officiellement les derniers membres soient morts avec le roi Mern Jardinier, neuvième du nom, lors de la bataille du Champ de Feu, de nombreux chevaliers de la Maison Manderly revendiquent toujours leur appartenance à l'ordre."
 bittersteel_skull:0 "Crâne d'Aigracier"
 bittersteel_skull_desc:0 "Le crâne d'Aigracier, premier capitaine général de la Compagnie Dorée."
 maelys_skull:0 "Le crâne de Maelys le Monstrueux"
 maelys_skull_desc:0 "Le crâne de Maelys Ier Feunoyr, dernier prétendant Feunoyr et capitaine général de la Compagnie Dorée. Un crâne grotesque plus grand que la moyenne, avec un autre, déformé et plus petit, de la taille d'un poing."
 daemon_blackfyre_skull:0 "Le crâne de Daemon Feunoyr"
 daemon_blackfyre_skull_desc:0 "Le crâne de Daemon Feunoyr, capitaine général de la Compagnie Dorée qui a été assassiné par son cousin, Maelys Ier Feunoyr."
 agot_artifact_moons_rod_name:0 "La Queue de la Lune"
 agot_artifact_moons_rod_desc:0 "Septon Lune était réputé pour sa virilité divine. Après l'échec de son insurrection qui a entraîné sa mort, ses dévoués partisans ont coupé leur membre viril, l'ont mariné et l'ont conservé afin que les générations futures de jeunes jouvencelles stériles puissent encore fleurir avec la bénédiction de la Queue de la Lune."
 iron_throne:0 "Trône de Fer"
 iron_throne_desc:0 "Le Trône de Fer des Sept Couronnes de Westeros a été forgé sur ordre du roi Aegon Ier à partir des épées de ses ennemis. C'est le plus grand symbole du royaume et de la royauté."
 iron_throne_valid:0 "Ne peut être utilisé que dans la cour de [GetTitleByKey('c_kings_landing').GetNameNoTier]"
 gilded_throne:0 "Trône Doré"
 gilded_throne_desc:0 "Cet imposant trône est un élément permanent de la Galerie d'Or. Le grand lion, sculpté dans le Roc lui-même et doré avec l'or provenant des mines situées en contrebas, veille sur les nombreux trésors et honneurs de la galerie."
 gilded_throne_valid:0 "Ne peut être utilisé que dans la cour de [GetTitleByKey('c_casterly_rock').GetNameNoTier]"
 seastone_chair:0 "Trône de Grès"
 seastone_chair_desc:0 "Le trône mystérieux des îles de Fer, le Trône de grès est faite de pierre noire huileuse, et sa construction et son histoire sont perdues depuis longtemps dans les annales du temps."
 seastone_chair_valid:0 "Ne peut être utilisé que dans la cour de [GetTitleByKey('c_pyke').GetNameNoTier]"
 ruined_oakenseat:0 "Souche de Chêne"
 ruined_oakenseat_desc:0 "Le trône autrefois vivant de House Jardinier, qui aurait été planté par Garth le Vert lui-même. Ce trône légendaire a été incendié il y a longtemps et n'est désormais plus qu'un vestige mort des gloires passées."
 restored_oakenseat:0 "Trône de Chêne"
 restored_oakenseat_desc:0 "Hommage à l'ancien chêne qui servait de siège aux rois Jardinier de jadis, un nouveau trône sculpté dans un arbre vivant témoigne désormais de la grandeur et des soins patients des dynastes de Hautjardin."
 oakenseat_valid:0 "Ne peut être utilisé que dans la cour de [GetTitleByKey('c_highgarden').GetNameNoTier]"
 painted_table:0 "La Table peinte"
 painted_table_desc:0 "Une grande table en bois massif verni, noirci et brûlé pour représenter les mers, fleuves et lacs. Cet imposant ouvrage, long de cinquante pieds, a été sculpté pour figurer Westeros et les Sept Couronnes sur ordre d'Aegon le Conquérant, on peut ainsi y voir les villes et châteaux — mais sans aucune frontière, comme si chacun des royaumes était appelé à n'en former qu'un. Un seul royaume pour un seul roi."
 painted_table_valid:0 "Ne peut être utilisé que dans la cour de [GetTitleByKey('c_dragonstone').GetNameNoTier]"
 high_seat_of_winter:0 "Haut siège de l’Hiver"
 high_seat_of_winter_desc:0 "Imposant et austère, ce siège fait de pierre polie arbore deux loups géants ainsi que diverses décorations sculptées en l'honneur des barrals, les arbres sacrés des Anciens Dieux. Il fut le trône de la Maison Stark pour d'innombrables générations de Rois de l'Hiver."
 high_seat_of_winter_valid:0 "Ne peut être utilisé que dans la cour de [GetTitleByKey('c_winterfell').GetNameNoTier]"
 weirwood_throne:0 "Trône de barral"
 weirwood_throne_desc:0 "Taillé dans le bois d'un barral ancien et orné d'un coussin touffeté bleu pâle, c'est du haut de ce perchoir que les rois de la Montagne et du Val ont régné depuis l'époque d'Artys, dit le Chevalier Faucon."
 weirwood_throne_valid:0 "Ne peut être utilisé que dans la cour de [GetTitleByKey('c_the_eyrie').GetNameNoTier]"
 seahorse_statue:0 "Statue d'hippocampe"
 seahorse_statue_desc:0 "Un impressionnant hippocampe de jade, datant d'avant le Fléau de Valyria, lorsque les seigneurs dragons faisaient souvent du commerce avec les marchands de l'Outre-Orient."
 artifact_dragon_doll:0 "Poupée à l'effigie d'un dragon"
 dragon_doll_01:0 "Simple poupée à l'effigie d'un dragon"
 dragon_doll_01_desc:0 "Une poupée en laine de conception simple et réalisée à l'image d'un dragon, convenable pour tout enfant provenant d'une maison de dragonniers."
 dragon_doll_02:0 "Magnifique poupée à l'effigie d'un dragon"
 dragon_doll_02_desc:0 "Une poupée en laine multicolore et magnifiquement réalisée à l'image d'un dragon, parfaite pour tout enfant provenant d'une maison de dragonniers."
 dragon_doll_03:0 "Poupée à l'effigie d'Aile-d'Argent"
 dragon_doll_03_desc:0 "Une poupée en laine parfaitement réalisée pour ressembler trait pour trait au dragon Aile-d'Argent. Elle a été faite par la reine Alysanne Targaryen pour être offerte à ses filles."
 dragon_doll_04:0 "Poupée à l'effigie de Vermithor"
 dragon_doll_04_desc:0 "Une poupée en laine parfaitement réalisée pour ressembler trait pour trait au dragon Vermithor. Elle a été faite par la reine Alysanne Targaryen pour être offerte à ses filles."
 dragon_doll_05:0 "Poupée à l'effigie d'un dragon bleu"
 dragon_doll_05_desc:0 "Une poupée à l'effigie d'un dragon, faite en laine d'un bleu évoquant le gel. Malgré ses points irréguliers et sa forme légèrement maladroite, l'ouvrage, tricoté par Lyanna Stark pour son enfant à naître, reste tout à fait charmant et on peut aisément discerner les efforts d'une mère aimante, en dépit de ses difficultés évidentes avec les travaux d'aiguille."
 dragon_doll_06:0 "Maîtresse de tous les Maux"
 dragon_doll_06_desc:0 "Cette poupée, tout aussi adorable que sinistre, est à l'image d'un dragon aux écailles évoquant la nuit et aux cornes violettes recourbées. Sa silhouette, d'une magnificence maléfique, saura titiller l'imagination de vos chérubins — pour le meilleur comme pour le pire !"
 viserra_mirror:0 "Miroir valyrien"
 viserra_mirror_desc:0 "Un ancien miroir de l'Antique Valyria, fabriqué par une main de maître en acier, agrémenté de rubis et dont le cadre, orné d'un motif draconique complexe, reflète la puissance et l'art des Possessions de Valyria."
 artifact_mirror:0 "Miroir"
 gold_mirror:0 "Miroir en or"
 gold_mirror_desc:0 "Un miroir en or magnifiquement confectionné."
 silver_mirror:0 "Miroir en argent"
 silver_mirror_desc:0 "Un miroir en argent magnifiquement confectionné."
 artifact_horn:0 "Cor"
 horn_of_herrock_name:0 "Trompe de Sarocq"
 horn_of_herrock_desc:0 "Un grande cor noir, torsadé et cerclé d'or. La légende raconte que [GetScriptedCharacterByHistoryID('KenningK_4').GetFirstNameNicknamed] aurait soufflé dedans depuis l'extérieur des murs de [GetTitleByKey('c_kayce').GetNameNoTier] pour donner le signal aux putains de la ville d'ouvrir une poterne, permettant à lui et ses hommes de prendre les lieux au nom de la Maison [GetDynastyByID('dynn_Lannister').GetName]."
 horn_of_herrock_valid:0 "Vous devez être un membre de la Maison [GetDynastyHouseByID('house_KenningK').GetName] et détenir le comté de [GetTitleByKey('c_kayce').GetNameNoTier] en tant que votre [realm_capital|El]."
 soul_of_harrenhal_name:0 "L'âme d'Harrenhal"
 soul_of_harrenhal_desc:0 "Un collier qui allie simplicité et élégance, orné d'une pierre noire polie sertie sur de l'argent scintillant et qui semble émettre une lueur terne, mais envoûtante, la nuit. La chaîne semble s'enrouler autour du cou de son porteur, à l'image de l'étreinte d'un être aimant."
 soul_of_harrenhal_dagger_desc:0 "Une dague, simple mais néanmoins de belle facture, ornée d'une pierre noire polie sertie dans un éclat d'argent scintillant et qui semble émettre une lueur terne, mais envoûtante, la nuit."
 krakenhorn_name:0 "Cor de Kraken"
 krakenhorn_desc:0 "Parmi la multitude de trésors accumulés par la Maison [GetDynastyByID('dynn_Celtigar').GetName], l’on évoque un magnifique cor, qui, lorsque l’on souffle dedans, invoquerait des créatures depuis les profondeurs des mers.\n\nQu’il s'agisse ou non d’une fable, il n’en demeure pas moins qu’il s’agit là d’un #italic très#! bel ouvrage."
 krakenhorn_generic_desc:0 "Un magnifique cor, qui, lorsque l’on souffle dedans, invoquerait des créatures depuis les profondeurs des mers.\n\nQu’il s'agisse ou non d’une fable, il n’en demeure pas moins qu’il s’agit là d’un #italic très#! bel ouvrage."
 artifact_maester_link:0 "Maillon de chaîne"
 artifact_maester_link_collection:0 "Collection de maillons de mestre"
 artifact_maester_chain:0 "Chaîne de mestre"
 agot_artifact_link_name:0 "Maillon en [owner.Custom('GetLinkType')]"
 agot_artifact_link_desc:0 "[owner.GetShortUIName|U] a obtenu ce maillon [owner.Custom('GetLinkArtifactDescription')] sous l'enseignement de [maester.Custom('MaesterCheck')] [maester.GetName]"
 agot_artifact_link_desc_no_maester:0 "[owner.GetShortUIName|U] a obtenu ce maillon [owner.Custom('GetLinkArtifactDescription')]"
 agot_artifact_link_desc_black_iron:0 "en ayant maîtrisé la corbellerie."
 agot_artifact_link_desc_brass:0 "en ayant mémorisé un nombre incalculable de lignées."
 agot_artifact_link_desc_bronze:0 "en ayant étudié les étoiles."
 agot_artifact_link_desc_copper:0 "en ayant apprit les histoires du monde."
 agot_artifact_link_desc_electrum:0 "de façon énigmatique."
 agot_artifact_link_desc_yellow_gold:0 "en ayant trafiqué les comptes."
 agot_artifact_link_desc_red_gold:0 "en ayant méticuleusement étudié les mathématiques."
 agot_artifact_link_desc_iron:0 "en ayant démontré un esprit militaire."
 agot_artifact_link_desc_lead:0 "en ayant démontré sa connaissance pointue des poisons."
 agot_artifact_link_desc_pewter:0 "en ayant consolidé les fondements de son savoir en architecture."
 agot_artifact_link_desc_platinum:0 "en ayant récolté le fruit de son savoir en agriculture."
 agot_artifact_link_desc_silver:0 "en ayant apprit à traiter les maux grâce à la médicine."
 agot_artifact_link_desc_steel:0 "en ayant forgé sa propre chaîne dans une forge."
 agot_artifact_link_desc_tin:0 "en ayant étudié les langues du monde."
 agot_artifact_link_desc_bismuth:0 "en ayant approfondit sa connaissance des fois."
 agot_artifact_link_desc_cast_iron:0 "en ayant apprit à s'occuper des animaux."
 agot_artifact_link_desc_antimony:0 "en ayant étudié la géographie du monde naturel."
 agot_artifact_link_desc_nickel:0 "en ayant étudié l'alchimie."
 agot_artifact_link_desc_white_copper:0 "en ayant étudié les sciences politiques."
 agot_artifact_link_desc_aluminum:0 "en ayant étudié la logistique et l'intendance."
 agot_artifact_link_desc_zinc:0 "en ayant étudié l'ingénierie."
 agot_artifact_link_desc_vs:0 "en ayant tenté vaillamment de percer les mystères les plus profonds."
 agot_artifact_link_collection_name:0 "$artifact_maester_link_collection$"
 agot_artifact_link_collection_desc:0 "Symbole de la validation de leur travail et de leurs études, les maillons des mestres témoignent de leur expérience dans leurs domaines respectifs.\nCette collection comprend les maillons suivants : [newly_created_artifact.Custom('GetAluminumLinkCount')][newly_created_artifact.Custom('GetAntimonyLinkCount')][newly_created_artifact.Custom('GetBismuthLinkCount')][newly_created_artifact.Custom('GetBlackIronLinkCount')][newly_created_artifact.Custom('GetBrassLinkCount')][newly_created_artifact.Custom('GetBronzeLinkCount')][newly_created_artifact.Custom('GetCastIronLinkCount')][newly_created_artifact.Custom('GetCopperLinkCount')][newly_created_artifact.Custom('GetElectrumLinkCount')][newly_created_artifact.Custom('GetIronLinkCount')][newly_created_artifact.Custom('GetLeadLinkCount')][newly_created_artifact.Custom('GetNickelLinkCount')][newly_created_artifact.Custom('GetPewterLinkCount')][newly_created_artifact.Custom('GetPlatinumLinkCount')][newly_created_artifact.Custom('GetRedGoldLinkCount')][newly_created_artifact.Custom('GetSilverLinkCount')][newly_created_artifact.Custom('GetSteelLinkCount')][newly_created_artifact.Custom('GetTinLinkCount')][newly_created_artifact.Custom('GetVSLinkCount')][newly_created_artifact.Custom('GetWhiteCopperLinkCount')][newly_created_artifact.Custom('GetYellowGoldLinkCount')][newly_created_artifact.Custom('GetZincLinkCount')]\nTotal : [newly_created_artifact.MakeScope.Var('links_collected').GetValue]"
 agot_artifact_maester_chain_name:0 "$artifact_maester_chain$"
 agot_artifact_maester_chain_desc:0 "Assemblée à partir d'une douzaine de maillons gagnés à la Citadelle, la chaîne d'un mestre symbolise la richesse des connaissances et de l'expérience acquises par son propriétaire.\nMaillons assemblés : [newly_created_artifact.Custom('GetAluminumLinkCount')][newly_created_artifact.Custom('GetAntimonyLinkCount')][newly_created_artifact.Custom('GetBismuthLinkCount')][newly_created_artifact.Custom('GetBlackIronLinkCount')][newly_created_artifact.Custom('GetBrassLinkCount')][newly_created_artifact.Custom('GetBronzeLinkCount')][newly_created_artifact.Custom('GetCastIronLinkCount')][newly_created_artifact.Custom('GetCopperLinkCount')][newly_created_artifact.Custom('GetElectrumLinkCount')][newly_created_artifact.Custom('GetIronLinkCount')][newly_created_artifact.Custom('GetLeadLinkCount')][newly_created_artifact.Custom('GetNickelLinkCount')][newly_created_artifact.Custom('GetPewterLinkCount')][newly_created_artifact.Custom('GetPlatinumLinkCount')][newly_created_artifact.Custom('GetRedGoldLinkCount')][newly_created_artifact.Custom('GetSilverLinkCount')][newly_created_artifact.Custom('GetSteelLinkCount')][newly_created_artifact.Custom('GetTinLinkCount')][newly_created_artifact.Custom('GetVSLinkCount')][newly_created_artifact.Custom('GetWhiteCopperLinkCount')][newly_created_artifact.Custom('GetYellowGoldLinkCount')][newly_created_artifact.Custom('GetZincLinkCount')]\nTotal : [newly_created_artifact.MakeScope.Var('links_collected').GetValue]"
