 court_position_disloyal_trait:0 "[GetTrait('disloyal').GetName( ROOT.Char )]"
 bloodrider_court_position:0 "Sang-coureur"
 bloodrider_court_position_desc:0 "Même si le rôle d'un sang-coureur semble analogue à celui d'un garde du corps ou d'un bouclier lige, il est bien plus que cela. Son devoir de protéger et sa volonté de servir dépassent le simple appât du gain ou le simple respect d'honorer des mots proférés. Il est lié par le sang à la personne pour qui il est prêt à mourir, tel un frère. S'il faillit à protéger alors il vengera, et une fois la mort donnée à celui qui aura tué son frère, il se la donnera à lui-même pour le rejoindre."
 bloodrider_employer_custom_effect_description:0 "$BULLET$A une chance d’empêcher les [schemes|El] visant à [GetScheme('murder').GetActionName|l]#!\n$BULLET$Réduit votre risque de mourir ou d’être capturé dans les [battles|El] auxquelles vous participez tous les deux#!\n$BULLET$Obtiendra le [trait|El] [GetTrait('loyal').GetName( GetNullCharacter )|l] et deviendra votre [friend|El]\n$BULLET$Commettra un suicide pour honorer le serment du sang @death_icon!"
 first_sword_court_position:0 "Première épée de Braavos"
 first_sword_court_position_desc:0 "La première épée est le chef de la garde personnelle du Seigneur de la Mer de Braavos."
 court_position_inquisitive_trait:0 "[GetTrait('inquisitive').GetName( ROOT.Char )]"
 septon_tradition_bonus:0 "De la [culture_tradition|El]"
 septa_tradition_bonus:0 "De la [culture_tradition|El]"
 court_position_standardized_dragonkeeper_training:0 "Formation conventionnelle des gardiens des dragons"
 admiral_court_position:0 "Amiral"
 admiral_court_position_desc:0 "[councillor|E] en charge des questions nautiques et navales. Il est le grand capitaine de votre [fleet|El] et supervise l'[embarking|El] de vos armées."
 admiral_fleet:0 "Superviser les flottes"
 admiral_fleet_desc:0 "Ce personnage déploie les flottes du pays pour patrouiller les vastes eaux et réagir promptement aux menaces côtières."
 admiral_maritime:0 "Protéger le commerce"
 admiral_maritime_desc:0 "Ce personnage est assigné à protéger les routes commerciales maritimes afin d'assurer un flux constant de biens entre tous vos ports."
 admiral_raid:0 "Enhardir les pillards"
 admiral_raid_desc:0 "Ce personnage encourage l'action agressive en mer, privilégiant les frappes rapides et le pillage au mépris de toute prudence."
 agot_pirate_cost_reduction_50:0 "Vous êtes un pirate sans terre"
 generic_scheme_warning_employer_custom_effect_description:0 "#!\n@warning_icon! #X Puissant [agent|El] des [hostile_schemes|El] contre vous #!"
 sea_watch_commander_court_position:0 "Commandant du Guet des eaux"
 sea_watch_commander_court_position_desc:0 "Le commandant de la flotte chargée de patrouiller les eaux de la Baie de la Néra entourant Port-Réal et qui s'étendent jusqu'à la Presqu'île de Claquepince, les rives du Bois-du-Roi et le Bec de Massey."
 royal_counter_court_position:0 "Comptable royal"
 royal_counter_court_position_desc:0 "Le $royal_counter_court_position$ est essentiellement responsable de la perception des taxes à travers tout le royaume."
 royal_scales_court_position:0 "Trébuchet royal"
 royal_scales_court_position_desc:0 "Le $royal_scales_court_position$ est le gardien des poids et mesures royales et veille à les faire respecter à travers le royaume."
 high_reeve_court_position:0 "Haut prévôt"
 high_reeve_court_position_desc:0 "Le $high_reeve_court_position$ est en charge de toutes les affaires de moindre justice dans la capitale, tels que les vols et vols à la tire."
 justiciar_court_position:0 "Justicier"
 justiciar_court_position_desc:0 "Aux Justiciers sont accordés des pouvoirs de haute justice directement par le monarque régnant. Ils parcourent le royaume pour juger toutes sortes d'affaires et ainsi rendre la justice au nom du roi en tout lieu où cela est nécessaire, de leur propre main ou par l'intermédiaire de ceux qui sont à leur ordre."
 royal_mint_officer_court_position:0 "Maître de la monnaie royale"
 royal_mint_officer_court_position_desc:0 "Des officiers en charge de superviser la production de monnaie dans les ateliers monétaires royaux de leurs villes respectives."
 keeper_of_keys_court_position:0 "Garde-clefs"
 keeper_of_keys_court_position_desc:0 "Le $keeper_of_keys_court_position$ est en charge du contrôle des clés de portes spécifiques et de certains coffres de la maisonnée royale, qu'ils renferment des joyaux de la couronne ou d'autres fonds personnels du monarque."
 grey_cloaks_commander_court_position:0 "Commandant des manteaux gris"
 grey_cloaks_commander_court_position_desc:0 "Le $grey_cloaks_commander_court_position$ est à la tête du guet de Villevieille."
 crimson_cloaks_commander_court_position:0 "Commandant des manteaux écarlates"
 crimson_cloaks_commander_court_position_desc:0 "Le $crimson_cloaks_commander_court_position$ est à la tête du guet de Port-Lannis."
 white_knife_court_position:0 "Gardien de la Blanchedague"
 white_knife_court_position_desc:0 "Le $white_knife_court_position$ est en charge de protéger l'embouchure de la Blanchedague."
 stone_way_court_position:0 "Gardien de la Voie de Pierre"
 stone_way_court_position_desc:0 "Le $stone_way_court_position$ est le titre décerné au principal défenseur de ce que l'on appelle plus communément les « Osseux ». Il confère une autorité militaire supérieure à celle de tous les autres vassaux lors de la défense de la Voie de Pierre."
 princes_pass_court_position:0 "Gardien de la Passe-du-Prince"
 princes_pass_court_position_desc:0 "Le $princes_pass_court_position$ est le titre décerné au principal défenseur de ce que l'on appelle plus communément la « Voie Large ». Il confère une autorité militaire supérieure à celle de tous les autres vassaux lors de la défense de la Passe-du-Prince."
 employee_is_not_your_spouse:0 "Ne peut pas être votre [spouse|El]"
 court_position_lifestyle_mariner:0 "[GetTrait('lifestyle_mariner').GetName( ROOT.Char )]"
 court_position_reforge_vs:0 "Connaît les secrets de la reforge de l’acier valyrien"
 lorath_harvest_prince_court_position:0 "Prince des Moissons"
 lorath_harvest_prince_court_position_desc:0 "Élu par les propriétaires terriens des îles Lorath, le Prince des Moissons supervisait autrefois l’administration de toutes les terres de la cité. Aujourd’hui relégué à une simple fonction honorifique, il a pour charge de parrainer les festivités et autres réjouissances."
 lorath_fisher_prince_court_position:0 "Prince des Pêches"
 lorath_fisher_prince_court_position_desc:0 "Élu par tous les Lorathi propriétaires de ports ou de navires, le Prince des Pêches supervisait autrefois le commandement de tous les navires appartenant au peuple. Aujourd’hui relégué à une simple fonction honorifique, il a pour charge la mise en service de tous les nouveaux navires."
 lorath_prince_of_streets_court_position:0 "Prince des Rues"
 lorath_prince_of_streets_court_position_desc:0 "Élu par tous les citoyens libres de Lorath, le Prince des Rues supervisait autrefois l’administration de la justice et le pouvoir populaire. Aujourd’hui relégué à une simple fonction honorifique, il a pour charge d’organiser les défilés au sein de la cité."