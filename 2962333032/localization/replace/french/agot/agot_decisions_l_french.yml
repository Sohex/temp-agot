 reforge_longthorn_good_aptitude:0 "Votre $court_smith_court_position|l$ a besoin d’un niveau de [aptitude|El] #V bon#!"
 decision_reforge_longthorn_alt:0 "Restaurer Longuépine"
 decision_reforge_longthorn_desc_alt:0 "Si Longuépine n’est plus, sa lame demeure, car l’acier valyrien ne saurait être si aisément soufflé par le feu d'un dragon. Le temps est venu d’effacer ce camouflet et de lui rendre sa splendeur d’antan."
 evil_goose_decision:0 "Abattre l’Aubier de l’Oie Morte"
 evil_goose_decision_desc:0 "Il est temps de venger la grande oie et d’abattre cette abomination !"
 evil_goose_decision_tooltip:0 "Abattez l’Arbre Bourru"
 evil_goose_decision_confirm:0 "Pour la grande oie !"