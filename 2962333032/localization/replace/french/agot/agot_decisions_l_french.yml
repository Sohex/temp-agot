 pcoa_plain:0 "Blason simple"
 pcoa_plain_tooltip:0 "Vous obtiendrez un blason personnel identique à celui de votre maison."
 pcoa_nickname:0 "Blason épithétique"
 pcoa_nickname_tooltip:0 "Vous obtiendrez un blason personnel basé sur votre surnom."
 pcoa_ancestral_quartering:0 "Blason ancestral"
 pcoa_ancestral_quartering_tooltip:0 "Vous obtiendrez un blason personnel, écartelé avec un quartier basé sur les armoiries d'un ancêtre de la maison."
 pcoa_religious:0 "Blason pieux"
 pcoa_religious_tooltip:0 "Vous obtiendrez un blason personnel basé sur votre foi."
 pcoa_fourth_child:0 "Blason en quartiers"
 pcoa_fourth_child_tooltip:0 "Vous obtiendrez un blason personnel, écartelé à l'identique avec les armoiries de votre maison."
 adopt_personal_coa_decision_next_stop_button:0 "Continuer"
 pcoa_random:0 "Blason aléatoire"
 pcoa_random_tooltip:0 "Vous obtiendrez un blason personnel généré de façon aléatoire."
 dynamic_bastard_house_revival_decision:0 "Faire renaître la Maison [ROOT.Char.GetHouse.MakeScope.Var('bastard_house_of').House.GetName]"
 dynamic_bastard_house_revival_decision_desc:0 "La Maison [ROOT.Char.GetHouse.MakeScope.Var('bastard_house_of').House.GetName] s'est éteinte. Ses étendards ont été balayés et sa devise n'est plus entendue que lors des histoires que l'on raconte aux chérubins. Mais en tant que descendant[ROOT.Char.Custom('FR_E')] direct[ROOT.Char.Custom('FR_E')] de cette maison, je puis récupérer son legs et arborer son nom ! Je puis raviver son souvenir et faire perdurer sa mémoire !"
 dynamic_bastard_house_revival_decision_confirm:0 "La Maison [ROOT.Char.GetHouse.MakeScope.Var('bastard_house_of').House.GetNameNoTooltip] renaîtra de la poussière !"
 dynamic_bastard_house_revival_decision_bastard:0 "Votre [house|El] est une [bastard_branch|El]"
 dynamic_bastard_house_revival_decision_westeros_needs_legitimization:0 "[top_liege.Custom('FR_le_Char_Pi')|U][top_liege.GetTitledFirstName] décidera si oui ou non vous pourrez faire vôtre le blason et le nom de la Maison [bastard_house_of.GetName]."
 recover_brightroar_decision:0 "Retrouver Rugissante"
 recover_brightroar_decision_desc:0 "Rugissante, l'épée ancestrale de la Maison Lannister, a été perdue dans les ruines de l'Antique Valyria il y a fort longtemps. Pour la retrouver, je n'ai nulle autre choix que d'envoyer une expédition dans ce lieu de perdition. Les chances d'y parvenir sont probablement infimes, mais la récompense sera à la hauteur d'une telle entreprise."
 recover_brightroar_decision_tooltip:0 "Planifier une expédition pour retrouver Rugissante"
 recover_brightroar_decision_confirm:0 "Préparer un navire"
 retrieve_hidden_artifact_decision:0 "Révéler un artefact caché"
 retrieve_hidden_artifact_decision_desc:0 "[ROOT.Char.Custom('HiddenArtifact')|U] est en ma possession, et nul ne le sait, mais puisque la discrétion n'est plus de rigueur, je peux cesser de m'en cacher."
 retrieve_hidden_artifact_decision_tooltip:0 "Révéler publiquement que vous êtes en possession d'un [artifact|El] caché"
 retrieve_hidden_artifact_decision_confirm:0 "Le monde saura !"
 retrieve_stored_artifacts_decision:0 "Exhumer les artefacts du Donjon Rouge"
 retrieve_stored_artifacts_decision_desc:0 "Dans les souterrains du Donjon Rouge reposent de nombreuses reliques ayant appartenu naguère à la Maison Targaryen. Qu'ils s'agissent de couronnes ou de crânes de dragon, la poussière a trop longtemps terni ces objets de grande valeur qui méritent de retrouver leur lustre d'antan."
 retrieve_stored_artifacts_decision_tooltip:0 "Récupérer les [artifacts|El] de la Maison Targaryen qui se trouvent dans les soubassements du Donjon Rouge"
 retrieve_stored_artifacts_decision_confirm:0 "Sortez-moi tout ça de là"
 high_heart_the_pact_decision:0 "Faire repousser les barrals de Noblecœur"
 high_heart_the_pact_decision_desc:0 "Depuis trop longtemps déjà, Noblecœur a été dévoyé par les Andals et leurs nouveaux dieux. L'heure est venue pour les barrals de renaître, de laisser s'exprimer les visages sculptés dans le bois et de leur permettre de veiller sur ceux qui n'auront pas oublier le Pacte."
 high_heart_the_pact_decision_effect:0 "Vous allez replanter le bosquet pour faire renaître [GetBuilding('agot_high_heart_01').GetName]"
 high_heart_the_pact_decision_tooltip:0 "Vous allez replanter les barrals de Noblecœur"
 high_heart_the_pact_decision_confirm:0 "Que les Anciens Dieux nous protègent !"
 high_heart_the_seven_decision:0 "Couper les barrals de Noblecœur"
 high_heart_the_seven_decision_desc:0 "Jadis, Erreg le Fratricide a purifié Noblecœur en débarrassant les lieux de tous ces maudits arbres blancs qui s'y trouvaient. Ce qui a été fait a également été défait, et les arbres-démons ont été replantés. Il nous appartient de nettoyer la souillure une fois encore et de faire taire les paroles hérétiques que certains trouvent dans le bruissement des feuilles."
 high_heart_the_seven_decision_tooltip:0 "Vous allez débarrasser Noblecœur de tous les barrals qui s'y trouvent"
 high_heart_the_seven_decision_confirm:0 "Telle est la volonté des Sept !"
 reforge_valyrian_steel_additional_requirements:0 "Votre $court_smith_court_position|l$ doit soit posséder la connaissance nécessaire pour reforger l'acier valyrien ou appartenir à une [faith|El] avec le [core_tenet|El] [GetFaithDoctrine('tenet_blood_magic_steel').GetBaseName|l]"
 justman_revival_decision:0 "Faire renaître la Maison Lejuste"
 justman_revival_desc:0 "Jadis, Benedict Rivers, enfant issu du sang Nerbosc et Bracken, parvint à unifier le Trident sous son joug et fonda la Maison Lejuste. Sa lignée régna sur le Conflans durant presque trois cents ans avant d'être cruellement anéantie par les Fer-nés. Aujourd'hui, quelqu'un porte à nouveau le sang des Nerbosc et des Bracken dans ses veines, et ce quelqu'un, c'est moi. Le temps est venu de ramener d'outre-tombe cette dynastie autrefois si prestigieuse, et de la mener vers une gloire nouvelle."
 justman_revival_decision_confirm:0 "Je ferais honneur à ce nom."
 agot_events_generic.0030.t:0 "[Select_CString(ROOT.Char.IsFemale,'À mon impudente vassale','À mon impudent vassal')],"
 agot_events_generic.0030.desc_vassal:0 "De quel droit croyez-vous pouvoir siéger impunément à Port-Réal ? Je vous somme séant de me céder son titre, sans quoi je m'assurerais de raviver la teinte du Donjon Rouge."
 agot_events_generic.0030.a:0 "Je vous assure que ce n'est qu'une terrible méprise."
 agot_events_generic.0030.b:0 "J'espère que vous vous embrocherez le cul sur une de ces épées."
 saerygan_revival_decision:0 "Faire renaître la Maison Saerygan"
 saerygan_revival_desc:0 "Comme frappée d’infortune et victime d’un acharnement du destin, la Maison Saerygan s’est éteinte, et avec elle, le règne d’une lignée vieille de plusieurs siècles qui fut présente pour voir l’Empire Valyrien atteindre son apogée et déchoir dans la ruine du Fléau.\n\nPeut-être est-il venu le temps d’une résurgence. Je puis faire renaître cette dynastie autrefois si glorieuse, et la mener vers un nouvel âge d’or !"
 saerygan_revival_decision_confirm:0 "Je ferais honneur à ce nom."
 decision_reforge_longthorn:0 "Restaurer Longuépine"
 decision_reforge_longthorn_desc:0 "Si Longuépine n’est plus, sa lame demeure, car l’acier valyrien ne saurait être si aisément soufflé par le feu d'un dragon. Mais notre maison a fait le serment solennel de ne point reforger l’épée tant que la Maison Jardinier n’aura pas restauré sa gloire d’antan et reprit Hautjardin des mains de ceux qui nous ont usurpé."
 decision_reforge_longthorn_tooltip:0 "Vous ferez de la lame de Longuépine une [Concept('artifact','épée')|E] apte à être portée"
 decision_reforge_longthorn_confirm:0 "Allez quérir les forgerons !"
 abdicate_decision:0 "Abdiquer en faveur de mon héritier"
 abdicate_decision_tooltip:0 "Mon règne doit prendre fin."
 abdicate_decision_desc:0 "Compte tenu des circonstances, je ne vois pas d'autre solution que de remettre les rênes du pouvoir à mon héritier et de laisser les livres d'histoire écrire la note de bas de page de mon règne."
 abdicate_decision_confirm:0 "Appelez mon mestre"
 agot_abdicate.1.t:0 "Abdication"
 agot_abdicate.1.desc:0 "[ROOT.Char.Custom('FR_le_Char_Pi')|U][ROOT.Char.GetTitledFirstName] a décidé d’abdiquer en votre faveur."
 agot_abdicate.1.a:0 "Je suis reconnaissant[ROOT.Char.Custom('FR_E')]."
 agot_minor_decisions_events.0005.t:0 "Me laisser aller"
 agot_minor_decisions_events.0005.desc:0 "#italic [ROOT.Char.GetFullNameNicknamedNoTooltip] a totalement sombré dans la folie...#!\n\nJe les entends... les chuchotements... mes courtisans... dans ma propre cour... Ils disent que je suis une horreur, tant par mon comportement que par mon apparence. Si c'est ainsi que l'on me voit, je pourrais tout aussi bien arrêter de sauver les apparences."
 agot_minor_decisions_events.0005.a:0 "Du balai, barbier !"
 recruit_forder_specialist_decision:0 "Recruter un spécialiste Traverseur au gué"
 recruit_forder_specialist_decision_desc:0 "Recruter un commandant qui non seulement sait comment traverser efficacement les rivières, mais qui est aussi un combattant compétent lorsqu'il le fait."
 recruit_forder_specialist_decision_tooltip:0 "Un commandant ayant le trait Traverseur au gué rejoindra votre cour."
 recruit_forder_specialist_decision_confirm:0 "J'espère en trouver un"
 agot_commission_special_artifact_decision:0 "Commander un artefact spécial"
 agot_commission_special_artifact_decision_tooltip:0 "Demander au forgeron de la Cour de créer un [artifact|El] spécial"
 agot_commission_special_artifact_decision_effects_tooltip:0 "Vous allez commander un nouvel artefact spécial."
 agot_commission_special_artifact_decision_desc:0 "Qu'est-ce qui définit un[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetTitleAsNameNoTooltip|l] ? Ses actes ? Sans aucun doute, mais pas seulement. Les parures et les dorures, certains n'y voient que des fioritures, du superflu, mais couronnes et armures sont avant tout des symboles d'affirmation du pouvoir, un témoignage de la grandeur d'un nom ou d'une lignée. Et je me dois d'affirmer la mienne."
 agot_commission_special_artifact_decision_confirm:0 "Allez quérir le forgeron !"
 agot_commission_special_artifact_button:0 "Choisissez un artefact"
 agot_commission_special_artifact_crown_choice_loc:0 "Une couronne pour moi"
 agot_commission_special_artifact_crown_choice_tooltip:0 "Une couronne qui reflétera et témoignera de mon héritage, ma foi et mes titres."
 agot_commissioned_personal_crown_recently:0 "Vous ne pouvez pas commander une nouvelle couronne pour vous-même jusqu'au [GetCurrentDateWithDiff( THIS.VarRemaining( 'agot_recently_commissioned_crown' ))]"
 agot_commission_special_artifact_crown_spouse_choice_loc:0 "Une couronne pour mon épou[ROOT.Char.GetPrimarySpouse.Custom('FR_XSe')]"
 agot_commission_special_artifact_crown_spouse_choice_tooltip:0 "Une couronne qui reflétera et témoignera de son héritage, sa foi et ses titres."
 agot_commissioned_spouse_crown_recently:0 "Vous ne pouvez pas commander une nouvelle couronne pour [spouse_scope.Custom('FR_le_Char')][spouse_scope.GetName] jusqu'au [GetCurrentDateWithDiff( GetVarTimeRemaining( spouse_scope.MakeScope, 'agot_recently_commissioned_crown') )]"
 agot_commission_special_artifact_armor_choice_loc:0 "Un ensemble d’armure"
 agot_commission_special_artifact_armor_choice_tooltip:0 "Une armure forgée sur mesure pour refléter et témoigner de la grandeur de la personne qui s’en équipera."
 agot_commissioned_armor_recently:0 "Vous ne pouvez pas commander une nouvelle armure jusqu'au [GetCurrentDateWithDiff( THIS.VarRemaining( 'agot_recently_commissioned_armor' ))]"
 disavow_incest_decision:0 "Désavouer l’inceste"
 disavow_incest_decision_desc:0 "Des siècles durant, la dynastie Targaryen a fait grand cas de préserver la pureté de son sang, et la foi septentique elle-même a accepté de fermer les yeux sur notre pratique de l'inceste qu'elle jugeait pourtant blasphématoire. Mais peut-être est-il venu le temps de reconsidérer cette tradition ? Peut-être est-il préférable de s'ouvrir à de nouveaux horizons, de nouvelles alliances et de ne plus laisser notre vision désuète du passé ternir notre futur ?"
 disavow_incest_decision_tooltip:0 "Interdire la pratique du mariage adelphique au sein de votre maison."
 disavow_incest_decision_confirm:0 "Faisons table rase du passé !"
 reinstate_incest_decision:0 "Rétablir l’inceste"
 reinstate_incest_decision_desc:0 "Naguère, notre maison devait sa prospérité à la pureté de son sang ; pureté qui a su être protégée grâce à l'inceste. Cette tradition a été désavouée, mais puisque la doctrine de l'exceptionnalisme de la Foi demeure, nous pourrions renouer avec les coutumes de nos ancêtres, et choisir de réhabiliter l'héritage qui nous a défini durant des générations."
 reinstate_incest_decision_tooltip:0 "Autoriser la pratique du mariage adelphique au sein de votre maison."
 reinstate_incest_decision_confirm:0 "Restaurons les us d'autrefois !"
 agot_take_new_face_decision:0 "Prendre un nouveau visage"
 agot_take_new_face_decision_desc:0 "Je puis faire usage de la bénédiction du Dieu Multiface pour changer de visage et ainsi continuer de le servir sous un nouveau jour."
 agot_take_new_face_decision_tooltip:0 "Vous allez choisir un autre visage provenant d'un personnage de même sexe."
 agot_take_new_face_decision_tt:0 "Prendre un nouveau visage ne remplacera que votre apparence et votre âge. Vos terres et vos titres seront conservés."
 agot_take_new_face_multiple_player_warning_tt:0 "@warning_icon! Puisqu'il s'agit d'une session multijoueur, le transfert du joueur vers le nouveau personnage n'est pas automatique."
 agot_take_new_face_decision_confirm:0 "Direction la Chambre des Visages."
 agot_has_taken_face_recently:0 "Vous avez récemment changé de visage"
 agot_faceless_new_adventure_decision:0 "Faire table rase de mon identité"
 agot_faceless_new_adventure_decision_desc:0 "Le temps est venu d'abandonner qui je suis et de prendre un nouveau départ à travers une nouvelle vie, une nouvelle voie, toujours à dessein de servir le Dieu Multiface."
 agot_faceless_new_adventure_decision_tooltip:0 "Vous allez abandonner votre personnage actuel et débuter une nouvelle aventure en revêtant un nouveau visage."
 agot_faceless_new_adventure_decision_tt:0 "Prendre un nouveau visage aura les conséquences suivantes :\n$EFFECT_LIST_BULLET$Vous abandonnerez votre personnage actuel et en jouerez un nouveau. Seul votre [gold|El], vos [inventory_artifacts|El], vos [traits|El] et votre [faith|El] seront conservés, tout le reste sera déterminé selon le visage choisi.\n$EFFECT_LIST_BULLET$Vous jouerez en tant que personnage sans terre d'une nouvelle [house|El]."
 agot_faceless_new_adventure_decision_confirm:0 "[ROOT.Char.GetFirstNameNoTooltip] n'est plus !"
