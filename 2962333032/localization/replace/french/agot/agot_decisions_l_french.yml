 CUSTOMIZE_PERSONAL_ARMS:0 "#T Personnaliser les [agot_personal_coa|El]#!\nOuvrez le menu de personnalisation pour modifier vos armoiries personnelles."
 reforge_valyrian_steel_decision:0 "Reforger une lame d'acier valyrien"
 reforge_valyrian_steel_decision_desc:0 "Je souhaite forger une nouvelle lame de ma propre conception"
 reforge_valyrian_steel_decision.tt:0 "Vous allez commencer le processus de reforge d’une lame en acier valyrien en votre possession"
 reforge_valyrian_steel_decision_confirm:0 "Convoquez le forgeron !"
 reforge_valyrian_steel_decision_tooltip:0 "Vous allez commencer le processus de reforge d’une lame en acier valyrien en votre possession"
 reforge_valyrian_steel_excellent_aptitude:0 "Votre $court_smith_court_position|l$ a besoin d'un niveau de [aptitude|El] #V excellent#!"
