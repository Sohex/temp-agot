 agot_great_project_events.1000.t.ruins: "$agot_great_project_events.1000.t.base$ : [province.GetHolding.GetSpecialBuildingType.GetName] restauré"
 agot_great_project_events.1000.t.chroyane: "$agot_great_project_events.1000.t.base$ : [GetBuilding('agot_ruins_chroyane_walls_04').GetName] restaurées"
 agot_great_project_events.1000.t.special: "$agot_great_project_events.1000.t.base$ : [province.GetHolding.GetSpecialBuildingType.GetName] construit"
 agot_great_project_events.1000.desc.ruins: "Là où naguère gisaient de vulgaires et mornes ruines, s’élève désormais un ouvrage robuste et magnifique. Un labeur récompensé par une splendeur restaurée.\n\nCe que les hommes ont fait, le temps l’a défait. Et ce que le temps a fait, à son tour l'homme l’a défait. J’y trouve là une certaine forme d’ironie poétique, suffisamment en tout cas, pour vouloir rester là, et contempler les lieux."
 agot_great_project_events.1000.desc.chroyane: "Là où naguère gisaient de vulgaires et mornes ruines, s’élève désormais un ouvrage robuste et magnifique. Un labeur récompensé par une splendeur restaurée.\n\nCe que les hommes ont fait, le temps l’a défait. Et ce que le temps a fait, à son tour l'homme l’a défait. J’y trouve là une certaine forme d’ironie poétique, suffisamment en tout cas, pour vouloir rester là, et flatter la beauté des lieux en leur accordant un peu de mon temps — bien que je ne dois pas oublier qu’il reste encore tant à faire pour que la cité retrouve proprement son lustre de jadis."
 agot_great_project_events.1000.desc.special: "Les ouvriers congédiés, j’ai toute liberté de contempler le fruit de leur labeur — et quel labeur, mes aïeux.\n\nCe qu’ils ont érigé n’a point à rougir avec le reste. La cité est désormais plus grande, plus forte, plus belle que jamais.\n\nJ’avais prévu de consacrer la journée à [ROOT.Char.Custom('IdleActivity')], mais pour l’heure, je veux simplement contempler le travail si magnifiquement accompli."
 agot_great_project_events.1000.a.ruins: "Il y a de quoi s’ébaudir à contempler pareils progrès."
 agot_great_project_events.1000.a.chroyane: "Du nerf, ce n’est pas le travail qui manque !"
 agot_great_project_events.1000.a.special: "La splendeur de la cité jamais ne saurait être ternie désormais !"
 agot_great_project_events.1010.t.ruins: "$agot_great_project_events.1000.t.base$ : [province.GetHolding.GetSpecialBuildingType.GetName] restauré"
 agot_great_project_events.1010.t.chroyane: "$agot_great_project_events.1000.t.base$ : [GetBuilding('agot_ruins_chroyane_walls_04').GetName] restaurées"
 agot_great_project_events.1010.t.special: "$agot_great_project_events.1000.t.base$ : [province.GetHolding.GetSpecialBuildingType.GetName] construit"
 agot_great_project_events.1010.desc.ruins: "Au point du jour, point justement l’envoyé de m[ROOT.Char.Custom2('FR_LMF_RelationToMeShort_OnA', overlord_scope)], [overlord_scope.Custom('FR_le_Char_Pi')][overlord_scope.GetTitledFirstName], inondant les lieux d’un enthousiasme certain.\n\n« [ROOT.Char.Custom('FormOfAddressForLiege')|U], » débute-t-[envoy.Custom('FR_IlElle')] tout en m’accordant une révérence qui lui donne l’occasion de reprendre son souffle : « La restauration est achevée ! [project_location.GetNameNoTooltip] resplendit de mille éclats, et conséquemment, notre gracieu[overlord_scope.Custom('FR_XSe')] [overlord_scope.GetTitleAsNameNoTooltip|l] m’a dépêché pour vous faire savoir que votre généreuse contribution dans ce projet a été grandement appréciée. »\n\nTandis qu’[envoy.Custom('FR_IlElle')] dépeint avec une verve poétique le résultat de cette restauration, j’opine du chef, bien aise de savoir que ce monde est un peu plus éclatant grâce à moi."
 agot_great_project_events.1010.desc.chroyane: "Au point du jour, point justement l’envoyé de m[ROOT.Char.Custom2('FR_LMF_RelationToMeShort_OnA', overlord_scope)], [overlord_scope.Custom('FR_le_Char_Pi')][overlord_scope.GetTitledFirstName], inondant les lieux d’un enthousiasme certain.\n\n« [ROOT.Char.Custom('FormOfAddressForLiege')|U], » débute-t-[envoy.Custom('FR_IlElle')] tout en m’accordant une révérence qui lui donne l’occasion de reprendre son souffle : « La restauration est achevée ! [project_location.GetNameNoTooltip] resplendit de mille éclats, et conséquemment, notre gracieu[overlord_scope.Custom('FR_XSe')] [overlord_scope.GetTitleAsNameNoTooltip|l] m’a dépêché pour vous faire savoir que votre généreuse contribution dans ce projet a été grandement appréciée. »\n\nTandis qu’[envoy.Custom('FR_IlElle')] dépeint avec une verve poétique le résultat de cette restauration, j’opine du chef, bien aise de savoir que ce monde est un peu plus éclatant grâce à moi."
 agot_great_project_events.1010.desc.special: "Au point du jour, point justement l’envoyé de m[ROOT.Char.Custom2('FR_LMF_RelationToMeShort_OnA', overlord_scope)], [overlord_scope.Custom('FR_le_Char_Pi')][overlord_scope.GetTitledFirstName], inondant les lieux d’un enthousiasme certain.\n\n« [ROOT.Char.Custom('FormOfAddressForLiege')|U], » débute-t-[envoy.Custom('FR_IlElle')] tout en m’accordant une révérence qui lui donne l’occasion de reprendre son souffle : « La construction est achevée ! [project_location.GetNameNoTooltip] resplendit de mille éclats, et conséquemment, notre gracieu[overlord_scope.Custom('FR_XSe')] [overlord_scope.GetTitleAsNameNoTooltip|l] m’a dépêché pour vous faire savoir que votre généreuse contribution dans ce projet a été grandement appréciée. »\n\nTandis qu’[envoy.Custom('FR_IlElle')] dépeint avec une verve poétique l’ouvrage qui me faut sa visite, j’opine du chef, bien aise de savoir que ce monde est un peu plus éclatant grâce à moi."
 agot_great_project_events.1010.a: "Transmettez-lui mes salutations."
