 building_type_agot_great_fleet_01: "Port militaire"
 building_type_agot_great_fleet_01_desc: "Ce port abrite une imposante flotte qui témoigne d’une puissance qui s’étend au-delà des simples frontières terrestres."
 building_agot_great_fleet_01: "Port militaire"
 building_agot_great_fleet_01_desc: "Ce port abrite une imposante flotte qui témoigne d’une puissance qui s’étend au-delà des simples frontières terrestres. Une telle construction ne peut être réalisée que dans le cadre d’un [great_project|El]."
 building_agot_great_fleet_02: "Arsenal"
 building_agot_great_fleet_02_desc: "L’agrandissement du port permet d’accueillir une flotte bien plus imposante encore, témoignant d’une formidable richesse dont l’influence va bien au-delà des simples frontières terrestres. Une telle construction ne peut être réalisée que dans le cadre d’un [great_project|El]."
 building_agot_great_fleet_03: "Grand arsenal"
 building_agot_great_fleet_03_desc: "Le simple port militaire est devenu le lieu de mouillage pour une formidable armada qui témoigne d’une puissance et d’une richesse sans commune mesure et dont l’influence se ressent jusqu’aux plus lointaines mers connues. Une telle construction ne peut être réalisée que dans le cadre d’un [great_project|El]."