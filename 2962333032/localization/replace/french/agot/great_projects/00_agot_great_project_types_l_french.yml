l_french:
 great_project_type_construct_great_fleet_01: "Construire une grande flotte"
 great_project_type_construct_great_fleet_01_desc: "La mer qui borde mon domaine serait grandement utile pour non seulement assurer la protection de mon peuple, mais aussi pour étendre son influence par-delà les rivages. Et avec une flotte digne de ce nom sous mon commandement, la mer sera mienne."
 great_project_type_construct_great_fleet_01_coastal_barony: "Doit être à proximité de la côte"
 great_project_type_construct_great_fleet_02: "Aggrandir la grande flotte"
 great_project_type_construct_great_fleet_02_desc: "La construction d’une grande flotte n’était que le premier pas vers la prospérité. Désormais, nous devons faire de cette armada un symbole de pouvoir et d’autorité, et pour cela, il nous faut plus de navires. Beaucoup plus de navires !"
 great_project_type_construct_great_fleet_02_coastal_county: "Doit être un comté côtier et posséder un $building_agot_great_fleet_01|l$"
 great_project_type_construct_great_fleet_03: "Construire un grand arsenal"
 great_project_type_construct_great_fleet_03_desc: "Désormais en possession d'une imposante et redoutable flotte de guerre, il est temps de fortifier le domaine lui-même. Je vais ériger un port comme nul n'en a jamais vu. Un havre de guerre dont la puissance suffira à dissuader tout envahisseur de poser le pied à terre !"
 great_project_type_construct_great_fleet_03_coastal_county: "Doit être un comté côtier et posséder un $building_agot_great_fleet_02|l$"
 great_project_type_construct_great_fleet_01_contribution_materials: "Matériaux"
 great_project_type_construct_great_fleet_01_contribution_materials_desc: "Tout [great_project|El] débute par ces petites choses que nous appelons les ressources. La flotte aura besoin entre autres choses de bois pour la charpente et de tissu pour les voiles."
 great_project_type_construct_great_fleet_01_contribution_workforce: "Main-d’œuvre"
 great_project_type_construct_great_fleet_01_contribution_workforce_desc: "Il ne faut jamais oublier que c'est par la force du travail que les plus grandes ambitions prennent vie. Pour concrétiser un [great_project|El] de cette ampleur, il va me falloir en appeler aux meilleurs ouvriers."
 great_project_type_construct_great_fleet_01_contribution_engineers: "Ingénieurs navals"
 great_project_type_construct_great_fleet_01_contribution_engineers_desc: "Un [great_project|El] de cette nature requiert une expérience et des aptitudes qui ne sont pas données à tout le monde. Cette précieuse force de travail sera un atout indispensable à la réalisation d’une telle flotte."
 great_project_type_construct_great_fleet_01_contribution_military_wharf: "Aménagement militaire"
 great_project_type_construct_great_fleet_01_contribution_military_wharf_desc: "En construisant une zone de mouillage dédiée et des structures telles que des cales sèches, la durabilité et donc l’efficacité de la flotte s’en trouvera grandement améliorée."
 great_project_type_construct_great_fleet_01_contribution_merchant_quays: "Aménagement commercial"
 great_project_type_construct_great_fleet_01_contribution_merchant_quays_desc: "L’ajout d’une zone marchande dédiée permettra d’augmenter les revenus et la puissance économique du port."
 great_project_type_construct_great_fleet_02_contribution_materials: "Matériaux"
 great_project_type_construct_great_fleet_02_contribution_materials_desc: "Tout [great_project|El] débute par ces petites choses que nous appelons les ressources. L’agrandissement de la flotte ne pourra se faire sans davantage de bois et de tissu."
 great_project_type_construct_great_fleet_02_contribution_workforce: "Main-d’œuvre"
 great_project_type_construct_great_fleet_02_contribution_workforce_desc: "Il ne faut jamais oublier que c'est par la force du travail que les plus grandes ambitions prennent vie. Pour concrétiser un [great_project|El] de cette ampleur, il va me falloir en appeler à toujours plus d’ouvriers."
