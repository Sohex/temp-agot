l_french:
 send_to_nightswatch_interaction:0 "Envoyer à la Garde de Nuit #weak (Dynastie)#!"
 send_to_nightswatch_interaction_extra_icon:0 "$hook_extra_icon$"
 send_to_nightswatch_interaction_desc:0 "$dynasty_interaction_header$Envoyer [recipient.Custom('FR_le_Char_U_Pi')][recipient.GetShortUINameNoTooltip] servir en tant que veilleur au rempart à la Garde de Nuit. Il n'engendrera pas d'enfant, ni ne possédera de terre, pour ainsi mener un devoir sacré envers les royaumes des hommes."
 send_to_nightswatch_interaction_toast:1 "[recipient.Custom('FR_le_Char_U_Pi')|U][recipient.GetShortUIName] est parti rejoindre la Garde de Nuit"
 send_to_nightswatch_interaction_toast_desc:0 "Et à présent sa garde commence."
 CHARACTER_INTERACTION_NOT_ALLOWED_IN_NIGHTSWATCH:0 "[recipient.Custom('FR_IlElle')|U] n'est pas autorisé[recipient.Custom('FR_E')] à servir comme [knight|El] à la [court|El] ciblée"
 send_to_nightswatch_interaction_effect_desc:1 "#weak [CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName] quittera votre cour pour servir dans la Garde de Nuit. [CHARACTER.Custom('FR_IlElle')|U] renoncera à tout héritage et à tout ses droits afin de veiller à la défense du royaume.#!"
 agot_send_to_citadel_interaction:0 "Envoyer à la Citadelle"
 agot_send_to_citadel_interaction_desc:0 "Envoyer [recipient.GetFirstNameNoTooltip] à la Citadelle"
 agot_send_to_citadel_interaction_extra_icon:0 "$hook_extra_icon$"
 agot_send_to_citadel_effect_desc:0 "#weak [CHARACTER.Custom('FR_le_Char_U_Pi')|U][CHARACTER.GetShortUIName] quittera votre cour pour étudier à la Citadelle. Après avoir prononcé ses vœux, il renoncera au nom de sa maison et à tout héritage afin de servir le royaume.#!"
 citadel_decline_summary:0 "Si [CHARACTER.Custom('FR_le_Char_U_Pi')][recipient.GetShortUINameNoTooltip] refuse, il restera à votre [court|E]"
 tried_to_send_me_to_citadel_opinion:0 "A essayé de m'envoyer à la Citadelle"
 REQUEST_CITADEL_NOTIFICATION_TEXT:0 "Vous êtes prié de quitter votre poste à la cour et de vous rendre à la Citadelle pour entamer votre formation de mestre."
 CITADEL_PATIENT:1 "[GetTrait('patient').GetName( recipient.Self )] : $VALUE|=+0$"
 CITADEL_CALM:1 "[GetTrait('calm').GetName( recipient.Self )] : $VALUE|=+0$"
 CITADEL_DILIGENT:1 "[GetTrait('diligent').GetName( recipient.Self )] : $VALUE|=+0$"
 CITADEL_HERBALIST:1 "[GetTrait('lifestyle_herbalist').GetName( recipient.Self )] : $VALUE|=+0$"
 CITADEL_SCHOLAR:1 "[GetTrait('scholar').GetName( recipient.Self )] : $VALUE|=+0$"
 CITADEL_PENSIVE:1 "[GetTrait('pensive').GetName( recipient.Self )] : $VALUE|=+0$"
 CITADEL_ROWDY:1 "[GetTrait('rowdy').GetName( recipient.Self )] : $VALUE|=+0$"
 CITADEL_CURIOUS:1 "[GetTrait('curious').GetName( recipient.Self )] : $VALUE|=+0$"
 CITADEL_WRATHFUL:1 "[GetTrait('wrathful').GetName( recipient.Self )] : $VALUE|=+0$"
 CITADEL_LAZY:1 "[GetTrait('lazy').GetName( recipient.Self )] : $VALUE|=+0$"
 CITADEL_INTELLECT_BAD:1 "[personality|E] — #italic Il n'est guère savant :#! $VALUE|=+0$"
 CITADEL_SQUIRE:1 "[GetTrait('squire').GetName( recipient.Self )] : $VALUE|=+0$"
 CITADEL_KNIGHT:1 "[GetTrait('knight').GetName( recipient.Self )] : $VALUE|=+0$"
 CITADEL_FIGHTER:1 "[personality|E] — #italic Il est plus enclin à mener une vie au champ d’honneur :#! $VALUE|=+0$"
 CITADEL_WANTS_TO_LEARN:1 "[personality|E] — #italic Il est désireux d’apprendre :#! $VALUE|=+0$"
 CITADEL_LUSTFUL:1 "[GetTrait('lustful').GetName( recipient.Self )] : $VALUE|=+0$"
 CITADEL_PHYSICIAN:1 "[personality|E] — #italic Il est féru des connaissances sur le corps humain :#! $VALUE|=+0$"
 CITADEL_ZEALOUS:1 "[personality|E] — #italic Il est plus enclin à mener une vie d’ecclésiastique :#! $VALUE|=+0$"
 CITADEL_GREED:1 "[personality|E] — #italic Il n’a aucun désir de renoncer aux plaisirs terrestres :#! $VALUE|=+0$"
 CITADEL_WEAK:1 "[personality|E] — #italic Il est trop frêle pour aspirer à la gloire sur le champ de bataille :#! $VALUE|=+0$"
 agot_the_citadel.1000.desc:0 "Rien ne saurait plus me mettre en joie que de consacrer ma vie à la noble quête du savoir. Je vais de ce pas me mettre en route pour la Citadelle."
 agot_the_citadel.1000.positive:0 "Je n'ai jamais douté de votre sagesse."
 agot_the_citadel.1001.desc:0 "Vous me demandez de dire adieu à tout ce que je connais pour aller me terrer à la Citadelle comme un vulgaire rat gris ? Quelle fadaise est-ce là ?"
 agot_the_citadel.1001.negative:0 "J'ai vraisemblablement surestimé[ROOT.Char.Custom('FR_E')] votre sagesse…"
 send_to_silent_sisterhood_interaction:0 "Envoyer à la Sororité du Silence"
 send_to_silent_sisterhood_interaction_desc:0 "Envoyer [recipient.Custom('FR_le_Char_U_Pi')][recipient.GetShortUINameNoTooltip] prononcer les vœux pour rejoindre [GetGovernment( 'silent_sisterhood_government' ).GetName|l] et devenir une [GetTrait('silent_sister').GetName(GetNullCharacter)]"
 take_vows_septon_interaction_desc:0 "Demander [recipient.Custom('FR_au_Char_U_Pi')][recipient.GetShortUINameNoTooltip] de prononcer les vœux et de rejoindre le clergé"
 take_vows_septon_decline_summary:0 "Si [recipient.Custom('FR_le_Char_U_Pi')][recipient.GetShortUINameNoTooltip] refuse, [recipient.Custom('FR_IlElle')] restera à votre [court|E]"
 REQUEST_SEPTON_VOWS_NOTIFICATION_TEXT:0 "Vous êtes prié de quitter votre poste à la cour et de prononcer vos voeux."
 take_vows_septon_interaction:0 "Demander de prononcer les vœux"
