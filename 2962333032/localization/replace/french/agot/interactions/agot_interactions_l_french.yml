 agot_release_strip_lordship_banish:0 "Vous ne pouvez pas à la fois dépouiller [TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')][TARGET_CHARACTER.GetShortUINameNoTooltip] de sa seigneurie et [TARGET_CHARACTER.Custom('FR_LeLa')] bannir"
