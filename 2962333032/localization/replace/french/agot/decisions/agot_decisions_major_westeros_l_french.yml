l_french:
 agot_proclaim_iron_throne:0 "Proclamer le Trône de Fer"
 agot_proclaim_iron_throne_tooltip:0 "Unifier le pays sous l’égide du Trône de Fer."
 agot_proclaim_iron_throne_desc:0 "Le Trône de Fer a longtemps été un symbole d'unité et de pouvoir à Westeros. Les innombrables petits fiefs du royaume ayant été rassemblés sous notre bannière, le moment est peut-être venu de rassembler à leur tour les lames des vaincus et de forger un nouveau Trône de Fer pour le bien du royaume.\n\nMais aurais-je la force, la ruse et la volonté suffisantes pour ainsi revendiquer un tel pouvoir, et faire de la Maison [ROOT.Char.GetHouse.GetName] l'unique et véritable maison souveraine des Sept Couronnes ?"
 agot_proclaim_iron_throne_confirm:0 "Envoyez les corbeaux."
 set_capital_kingslanding_decision:0 "Réclamer Port-Réal"
 set_capital_kingslanding_decision_tooltip:0 "Restaurer Port-Réal comme [capital|El] de votre [realm|El]."
 set_capital_kingslanding_decision_desc:0 "Port-Réal est la capitale légitime du Trône de Fer, et à ce titre, elle m'appartient."
 set_capital_kingslanding_decision_confirm:0 "Mon titre, mon trône !"
 end_the_ironborn_decision:0 "Mettre fin aux Fer-nés"
 end_the_ironborn_decision_desc:0 "Depuis des siècles et des siècles, ces chiens bâtards que sont les Fer-nés n’ont jamais cessé de violer et de piller partout où leurs navires ont pu jeter l’ancre. Cette vermine a bien trop pullulé pour qu’elle demeure ignoré. Il nous faut débarrasser les eaux de cette engeance et libérer les côtes de la terreur qu’elle véhicule. Nous leur ferons une guerre comme jamais ils n’en ont connu, et alors plus aucun de leur peste de Roi de Fer n’osera jamais plus revendiquer le Trône de Grès. Jamais !"
 end_the_ironborn_decision_confirm_text_desc:0 "Ce qui est mort le restera cette fois !"
 end_the_ironborn_decision_tooltip:0 "Mettez fin aux Fer-nés."
 regrow_oakenseat_decision:0 "Faire repousser le Trône de Chêne"
 regrow_oakenseat_decision_tooltip:0 "Faire appel à un jardinier qualifié pour faire repousser le Trône de Chêne."
 regrow_oakenseat_decision_desc:0 "Le Trône de Chêne, planté par Garth Mainverte, fut détruit par un roi Dornien sous le règne de Garth Jardinier, dixième du nom et n'est désormais plus qu'une légende.\n\nMême si ce n’est pas une mince affaire, le faire repousser apporterait à ma maison : renommée, gloire et influence au sein du Bief — et même à travers tout Westeros."
 regrow_oakenseat_decision_confirm:0 "Plantez la graine."
 regrow_oakenseat_excellent_aptitude:0 "Votre jardinier de la Cour a besoin d'un niveau d’aptitude #V excellent#!"
 agot_major_decisions_events.1001.t:0 "Le Trône de Chêne a été restauré"
 agot_major_decisions_events.1001.desc:0 "La légende raconte que [greenhand.Custom('FR_le_Char_Pi')][greenhand.GetTitledFirstNameNicknamed] aurait sculpté le Trône de Chêne de sa propre main verte, et que les rois [greenhand.GetHouse.GetName] ont régné depuis ce même trône des générations durant.\n\nSa destruction a provoqué la mort des racines — et du cœur — de Hautjardin.\n\nFinalement, après des décennies de croissance, d'élagage et de propagation minutieuses, l'ancienne fierté que fut le Trône de Chêne a repoussé. Jusqu'à nos frontières, et même au-delà, tous connaîtront la gloire de la Maison [ROOT.Char.GetHouse.GetName] pour ce qui a été accompli aujourd'hui. Je pourrais même me revendiquer comme le véritable successeur de Garth Mainverte lui-même..."
 agot_major_decisions_events.1001.a:0 "Ainsi la légende a été restaurée !"
 ironborn_rebellion_decision:0 "Se rebeller contre le Trône de fer"
 ironborn_rebellion_decision_desc:0 "Depuis trop longtemps, les hommes du continent dorment confortablement dans leur lit. Depuis la mort d'Harren le Noir, Westeros n'a plus vraiment eu peur des Fer-nés. Seuls quelques groupes occasionnels de pilleurs se sont rendus à terre pour payer le fer-prix. Les rois, l'un après l'autre, se sont assis sur leur Trône de Fer. Mais, avons-nous oublié que nous avons notre propre trône, que pendant des siècles nous avons eu nos propres rois ?\n\nD'autres hommes peuvent l'avoir oublié, mais pas moi. Je vais briser les chaînes qui lient notre peuple; Je serai le Roi du Sel et du Roc. Les Andals, les Rhoynar et les Premiers Hommes sauront une fois de plus ce que c'est que de craindre les Fer-nés."
 ironborn_rebellion_decision_tooltip:0 "Pleure, ô Westeros, que les Îles se lèvent à nouveau !"
 ironborn_rebellion_decision_confirm_text_desc:0 "Nous paierons le prix du fer !"
 defy_winter_lords_decision:0 "Défier les seigneurs de l'hiver"
 defy_winter_lords_decision_desc:0 "Les piernés n'ont rien connu d'autre que de la dérision de la part des nordiens, qui ont autant de considération envers nous qu'envers les sauvageons. Skagos était autrefois libre et indépendant des seigneurs de l'Hiver — et il en sera de nouveau ainsi. Notre puissance fera trembler [ROOT.Char.GetLiege.Custom('FR_le_Char_Pi')][ROOT.Char.GetLiege.GetTitledFirstNameNicknamedRegnal] !"
 defy_winter_lords_decision_tooltip:0 "Vous déclarerez votre indépendance et renverrez les Piernés dans les mers une fois de plus."
 defy_winter_lords_decision_confirm_text_desc:0 "Le Nord se souviendra de craindre Skagos !"
 agot_minor_decisions_events.0001:0 "Défier les seigneurs de l'hiver"
 agot_minor_decisions_events.0001.desc:0 "De nombreux piernés ont rêvé du jour où Skagos retrouverait sa liberté. Lorsque le roi Brandon Stark a brisé notre pouvoir, il nous a interdit la mer. Aujourd'hui, le Nord tremblera à l'approche de nos navires !"
 agot_minor_decisions_events.0001.a:0 "Nous ne jurons #bold plus#! fidélité."
 agot_minor_decisions_events.0001.a_tt:0 "Il est certain que le Nord n'acceptera pas cet acte de déloyauté sans se battre. Êtes-vous prêts à la guerre ?"
 agot_minor_decisions_events.0002:0 "Un Skagos indépendant"
 agot_minor_decisions_events.0002.desc:0 "Les piernés sont à nouveau leurs propres maîtres ! La Baie des Phoques connaîtra nos bannières.\n\nJ'ai gravé mon héritage dans la pierre, et tous les piernés se souviendront de mon nom."
 agot_minor_decisions_events.0002.a:0 "Mon héritage résistera à l'épreuve du temps."
 agot_minor_decisions_events.0002.a_tt:0 "Skagos acquiert son indépendance."
 agot_adopt_kneeler_ways_decision:0 "Se conformer aux coutumes suderonnes"
 agot_adopt_kneeler_ways_decision_desc:0 "La vie dans l'étendue gelée du grand nord a fait de nous des gens impitoyables et inflexibles, très différents de ceux qui vivent de l'autre côté du Mur. Mais maintenant que nous avons élu domicile parmi eux, il serait sans doute avisé de nous acclimater plutôt que de nous obstiner. Embrassant leurs us et coutumes et faisons de leur loi les nôtres."
 agot_adopt_kneeler_ways_decision_confirm:0 "Le temps est venu de fléchir le genou"
 agot_adopt_kneeler_ways_decision_tooltip:0 "Votre peuple adoptera les coutumes des sujets du Trône de Fer. Cela facilitera les interactions avec les dirigeants suderons, tel que le mariage, mais à l'inverse, cela pénalisera celles avec le peuple libre."
 is_culture_head:0 "Vous êtes le chef de votre culture"
 hybridized_with_kneelers:0 "Votre culture a été hybridée avec une culture suderonne"
 capital_south_of_the_wall:0 "Votre capitale est au sud du Mur"
 agot_major_decisions_events.1003.t:0 "De l'autre côté…"
 agot_major_decisions_events.1003.desc:0 "Après maintes générations à avoir souhaité s'arracher aux conditions rudes d'une existence passée au nord du Mur, voilà que l'opportunité se présente. Si le Grand Nord a fait de nos anciens un peuple fort et robuste, le climat plus doux du sud nous offrira une vie plus longue et agréable. Ce que nous perdrons en force, nous le gagnerons en confort. Nos ancêtres ne nous le pardonneront peut-être pas, mais nos descendants nous remercieront pour cela, et c'est pour eux que je prends cette décision. Pour tous les futurs [ROOT.Char.GetCulture.GetCollectiveNoun] à naître !"
 agot_major_decisions_events.1003.a:0 "Levons nos coupes ! À un futur plus radieux !"
 every_freefolk_ruler_tt:0 "Chaque chef du peuple libre"