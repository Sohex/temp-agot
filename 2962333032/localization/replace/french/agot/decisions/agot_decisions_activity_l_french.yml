l_french:
 agot_go_on_reaving_decision:0 "Partir en pillage"
 agot_go_on_reaving_decision_opening_desc:0 "#F Payez le fer-prix et organisez une grande expédition pour parcourir les terres de l'autre côté du Détroit. Les Fer-nés viendront de l'autre côté du royaume vers votre flotte pour ravager ces terres de safran et de soie #!"
 reaving_effect_1:0 "Vous choisirez une destination propice au pillage"
 reaving_effect_2:0 "Plus votre pillage est réussi, plus vous obtiendrez de [piety|El] et de [prestige|El]"
 reaving_effect_3:0 "Vous pourriez obtenir le trait [GetTrait('viking').GetName( GetNullCharacter )]"
 agot_go_on_reaving_decision_tooltip:0 "Un grand [reaving|El] sera organisé."
 agot_go_on_reaving_decision_confirm:0 "Les continentaux craindront les Fer-nés !"
 agot_buy_diving_bell:0 "Acquérir une cloche de plongée"
 agot_buy_diving_bell_desc:0 "La mer recèle bien des cadeaux, il est vrai, mais certaines nécessitent d’aller plus loin que la simple surface. Si je fais installer une cloche de plongée sur mon navire, alors les richesses englouties par les eaux noires seront à portée de main."
 agot_buy_diving_bell_tooltip:0 "Obtenez une cloche de plongée pour permettre une chasse au trésor"
 agot_buy_diving_bell_effect_tooltip:0 "Déverrouille la chasse au trésor lors d’un [GetActivityType('activity_agot_sailing').GetName|l]"
 agot_buy_diving_bell_confirm_text_desc:0 "Allez quérir les ouvriers !"
 agot_buy_ship:0 "Acquérir un navire"
 agot_buy_ship_desc:0 "La mer a tant à offrir, que ce soit en termes de richesse, de gloire ou d’aventure. Tout ce qu’il faut pour s'en saisir, c’est un peu de courage et un bon navire. Si j’en fais la commande, je permettrais à l’ensemble de ma maison de voguer jusqu’aux rivages lointains pour faire sienne des opportunités que la seule terre ne saurait lui offrir."
 agot_buy_ship_tooltip:0 "Commander un navire pour votre [house|El]"
 agot_buy_ship_effect_1_tooltip:0 "Déverrouille le pillage lors d’un [GetActivityType('activity_agot_sailing').GetName|l]"
 agot_buy_ship_effect_2_tooltip:0 "Déverrouille l’expédition vers Valyria lors d’un [GetActivityType('activity_agot_sailing').GetName|l]"
 agot_buy_ship_confirm_text_desc:0 "Charpentiers, à vos marteaux !"
 agot_buy_ship_small_ship:0 "Acquérir un $owns_small_ship|l$"
 agot_buy_ship_small_ship_desc:0 "Un modeste navire pour un modeste prix, qui permettra de brandir ma bannière sur les mers sans avoir à vider mes coffres."
 agot_buy_ship_small_ship_tooltip:0 "$agot_buy_ship_small_ship_desc$"
 agot_buy_ship_big_ship:0 "Acquérir un $owns_big_ship|l$"
 agot_buy_ship_big_ship_desc:0 "Un formidable navire digne d’une formidable maison, qui ne manquera pas d’attirer les regards, aussi bien admiratifs que craintifs, quel que soit le lieu où il mouillera."
 agot_buy_ship_big_ship_tooltip:0 "$agot_buy_ship_big_ship_desc$"