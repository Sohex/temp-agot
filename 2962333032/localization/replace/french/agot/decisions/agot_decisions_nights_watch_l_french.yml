l_french:
 restore_the_nights_watch:0 "Restaurer la Garde de Nuit"
 restore_the_nights_watch_desc:0 "La fin de la Garde de Nuit a jeté une obscurité sur le Nord. Le bouclier qui protégeait le royaume des humains n’est plus, et depuis lors notre peuple vit dans l’ombre des sauvageons et autres monstruosités venues des contrées d’au-delà du Mur. Si nous souhaitons que les nôtres puissent vivre paisiblement, il nous faut rétablir l’ordre séculaire qui a veillé aux remparts durant maintes et maintes nuits. Il nous faut raviver l’aube face aux ténèbres qui s’amassent !"
 restore_the_nights_watch_tooltip:0 "Restaurez la Garde de Nuit pour raviver la flamme dans l’obscurité et ramener les veilleurs aux remparts"
 restore_the_nights_watch.tooltip.1:0 "Un nouveau Lord Commandant sera placé à la tête du Mur."
 restore_the_nights_watch.tooltip.2:0 "#N Vous perdrez les terres attenantes au Mur !#!"
 restore_the_nights_watch_confirm:0 "Que soit brandie l’épée au cœur des ténèbres !"
 dissolve_the_nights_watch:0 "Dissoudre la Garde de Nuit"
 dissolve_the_nights_watch_desc:0 "De toute éternité, les corbeaux furent notre ennemi, nous chassant comme des bêtes, nous massacrant génération après génération. Mais maintenant que leur perchoir est à nous, nous pouvons enfin éradiquer cette foutrerie de confrérie noire. Le Mur ne sera plus un obstacle, mais un symbole, et nous offrirons à notre peuple la véritable liberté dont nous avons été privés depuis des siècles."
 dissolve_the_nights_watch_tooltip:0 "Achevez l’ordre séculaire qui a veillé aux remparts durant des siècles"
 dissolve_the_nights_watch_confirm:0 "Notre liberté est pleinement méritée !"
 rebuild_nights_watch_fort:0 "Rebâtir une forteresse du Mur"
 rebuild_nights_watch_fort_desc:0 "Si jadis, la Garde de Nuit fut grande et glorieuse, les siècles ne l’auront pas épargnée. Le temps faisant son office, nombre de forteresses érigées pour protéger le Mur furent abandonnées, faute de moyens. Mais la situation étant plus propice aujourd’hui, il est peut-être temps de redorer la Garde et de rebâtir l’un des quelques postes de veilleurs."
 rebuild_nights_watch_fort_tooltip:0 "Restaurez l’une des forteresses du Mur."
 rebuild_nights_watch_fort_confirm:0 "Allez quérir le Premier Ingénieur !"
 desert_the_nw:0 "Déserter la Garde de Nuit"
 desert_the_nw_desc:0 "Après tant de temps passé au sein de la Garde de Nuit, j’ai pu voir toute l’étendue de l’honneur qu’il peut y avoir à servir de sentinelle aux confins du monde, dans un désert gelé où le temps est plus volontiers consacré à braver le froid ou la faim qu’une quelconque menace pour le royaume. Je suis las de n’avoir que mes vœux pour réchauffer ma couche la nuit. Las de tant offrir au royaume pour n’avoir que si peu en retour. En désertant je m’exposerais à la peine capitale, mais qu’aurais-je à perdre, sinon une vie dépouillée de toute existence ?"
 desert_the_nw_tooltip:0 "Vous allez déserter la [nw_govt|E]"
 desert_the_nw_confirm:0 "Je refuse de mourir à mon poste"
 reclaim_brandons_gift_decision:0 "Revendiquer le Don-Bran"
 reclaim_brandons_gift_decision_desc:0 "Jadis, les terres du Don-Bran appartenaient au Nord avant qu’elles soient concédées à la Garde de Nuit à perpétuité pour ainsi aider les frères noirs dans leur lutte contre les menaces d’au-delà du Mur. Mais aujourd’hui la Garde a périclité, elle n’est plus qu'une bande organisée de violeurs et de voleurs ayant pour mortier des vœux friables. Au regard de cette situation, il serait plus judicieux de s’en emparer pour les placer entre de meilleures mains."
 reclaim_brandons_gift_decision_tooltip:0 "Revendiquez le Don-Bran"
 reclaim_gift_decision.requirements:0 "Vous devez remplir au moins l’une des conditions suivantes :\n\n$EFFECT_LIST_BULLET$Vous êtes allié à la Garde de Nuit\n$EFFECT_LIST_BULLET$Vous avez l’atout [GetPerk('diplomat_perk').GetName( GetNullCharacter )|l]\n$EFFECT_LIST_BULLET$Le Lord Commandant de la Garde de Nuit a 100 d’opinion envers vous"
 reclaim_brandons_gift_decision_confirm:0 "Revendiquer le Don-Bran"
 reclaim_gift_decision:0 "Revendiquer Neufdon"
 reclaim_gift_decision_desc:0 "Jadis, les terres du Neufdon appartenaient au Nord avant qu’elles soient concédées à la Garde de Nuit à perpétuité pour ainsi aider les frères noirs dans leur lutte contre les menaces d’au-delà du Mur. Mais aujourd’hui la Garde a périclité, elle n’est plus qu'une bande organisée de violeurs et de voleurs ayant pour mortier des vœux friables. Au regard de cette situation, il serait plus judicieux de s’en emparer pour les placer entre de meilleures mains."
 reclaim_gift_decision_tooltip:0 "Revendiquez Neufdon"
 reclaim_gift_decision_confirm:0 "Revendiquer Neufdon"
 reclaim_gift_decision_desc_effect:0 "[GetTitleByKey('k_the_wall').GetHolder.Custom('FR_le_Char_Pi')|U][GetTitleByKey('k_the_wall').GetHolder.GetTitledFirstName] se verra proposer de rétrocéder [GetTitleByKey('d_new_gift').GetNameNoTier] au Nord."
 reclaim_brandons_gift_decision_desc_effect:0 "[GetTitleByKey('k_the_wall').GetHolder.Custom('FR_le_Char_Pi')|U][GetTitleByKey('k_the_wall').GetHolder.GetTitledFirstName] se verra proposer de rétrocéder [GetTitleByKey('d_brandons_gift').GetNameNoTier] au Nord."
 reclaim_gift_decision_desc_use_hook_tt:0 "L’[hook|El] sur votre [top_liege|El] sera utilisé."
 agot_nights_watch.3000.t:0 "Demande de don"
 agot_nights_watch.3000.desc:0 "Il y a fort longtemps, Neufdon était terre attenante du Nord, avant que les contrées soient accordées à la Garde de Nuit pour soutenir les défenses du Mur. Aujourd’hui, [winterfell_petitioner.Custom('FR_le_Char_Pi')][winterfell_petitioner.GetTitledFirstName] demande à ce que ces terres lui soient rétrocédées, en échange d’une coquette somme bien entendu.\n\nDe nouveaux seigneurs inféodés au Nord gouverneront la région et les terres seront concédées à perpétuité, comme elles le furent déjà à l’origine."
 agot_nights_watch.3000.desc_brandons_gift:0 "Il y a fort longtemps, le Don-Bran était terre attenante du Nord, avant que les contrées soient accordées à la Garde de Nuit pour soutenir les défenses du Mur. Aujourd’hui, [winterfell_petitioner.Custom('FR_le_Char_Pi')][winterfell_petitioner.GetTitledFirstName] demande à ce que ces terres lui soient rétrocédées, en échange d’une coquette somme bien entendu.\n\nDe nouveaux seigneurs inféodés au Nord gouverneront la région et les terres seront concédées à perpétuité, comme elles le furent déjà à l’origine."
 agot_nights_watch.3000.a:0 "Fort bien. Le Nord saura en faire bon usage."
 agot_nights_watch.3000.b:0 "Et comment ferons-nous pour défendre le royaume avec si peu ?"
 agot_nights_watch.3001.t:0 "Le Don accordé"
 agot_nights_watch.3001.desc:0 "[nw_lc.Custom('FR_le_Char_Pi')|U][nw_lc.GetTitledFirstName] a accepté de rétrocéder le Don à ses propriétaires d’antan, ramenant ainsi ces précieuses terres dans le giron du Nord.\n\nUne page se tourne, mais une question demeure : à qui dois-je confier la bonne gestion de la région ?"
 agot_nights_watch.3001.a:0 "La question mérite réflexion. Il me faut choisir judicieusement."
 agot_nights_watch.3001.b:0 "Que les terres soient confiés à qui bon il plaira d’en disposer. Cela m’importe peu."
 agot_nights_watch.3003.t:0 "Les nouveaux seigneurs du Don"
 agot_nights_watch.3003.desc:0 "Qui donc dirigera [new_gift_county_to_give_away.GetNameNoTier] ?"
 agot_nights_watch.3003.a:0 "Parfait."
 agot_nights_watch.3003.b:0 "J’aime autant accorder le titre à une personne quelconque."
 nw_proposal_rejected:0 "La proposition a été rejetée"
 agot_nights_watch.3004.t:0 "Le Don rétrocédé"
 agot_nights_watch.3004.desc:0 "Neufdon est à nouveau attenant au Nord. La Garde de Nuit a concédé la mainmise de la région et [winterfell_petitioner.Custom('FR_le_Char_Pi')][winterfell_petitioner.GetTitledFirstName] a d’ores et déjà choisi ceux qui tiendront les terres en son nom :\n\n$BULLET$[norlinton_holder.GetFirstName] [norlinton_holder.GetHouse.GetName] gouvernera [GetTitleByKey('c_norlinton').GetNameNoTier]\n$BULLET$[boreharrow_holder.GetFirstName] [boreharrow_holder.GetHouse.GetName] gouvernera [GetTitleByKey('c_boreharrow').GetNameNoTier]\n$BULLET$[whitecross_holder.GetFirstName] [whitecross_holder.GetHouse.GetName] gouvernera [GetTitleByKey('c_whitecross').GetNameNoTier]\n$BULLET$[giantsbeard_holder.GetFirstName] [giantsbeard_holder.GetHouse.GetName] gouvernera [GetTitleByKey('c_giantsbeard').GetNameNoTier]"
 agot_nights_watch.3004.desc_brandons_gift:0 "Don-Bran est à nouveau attenant au Nord. La Garde de Nuit a concédé la mainmise de la région et [winterfell_petitioner.Custom('FR_le_Char_Pi')][winterfell_petitioner.GetTitledFirstName] a d’ores et déjà choisi ceux qui tiendront les terres en son nom :\n\n$BULLET$[weatherback_ridge_holder.GetFirstName] [weatherback_ridge_holder.GetHouse.GetName] gouvernera [GetTitleByKey('c_weatherback_ridge').GetNameNoTier]\n$BULLET$[moles_town_holder.GetFirstName] [moles_town_holder.GetHouse.GetName] gouvernera [GetTitleByKey('c_moles_town').GetNameNoTier]\n$BULLET$[hoarburn_holder.GetFirstName] [hoarburn_holder.GetHouse.GetName] gouvernera [GetTitleByKey('c_hoarburn').GetNameNoTier]"
 agot_nights_watch.3004.a:0 "C’est pour le mieux."
 agot_nights_watch.holding_conversion_tt:0 "[new_gift_county_to_give_away.GetNameNoTier] deviendra une [castle_holding|El]"
 agot_nights_watch.new_capital_tt:0 "[new_capital.GetName] deviendra la capitale de [new_gift_county_to_give_away.GetNameNoTier]"
 donate_land_to_nw_decision_desc:0 "Certaines des terres que je possède appartenaient naguère à la Garde de Nuit et je n’ignore pas le caractère sacré de son devoir. Les veilleurs aux remparts ont juré d’être le bouclier du royaume des humains contre tous les fléaux venus des confins du monde. Une telle mission a préséance sur les vaines querelles qui alimentent Westeros et c’est pourquoi il serait judicieux de restituer ces terres à leurs propriétaires légitimes."
 donate_land_to_nw_decision_tooltip:0 "Rendre à la Garde de Nuit les terres qui furent autrefois les leurs"
 donate_land_to_nw_decision:0 "Rendre à la Garde de Nuit son territoire historique"
 donate_land_to_nw_decision_confirm:0 "Que les terres leur soient rendues !"
 brandons_gift_will_be_returned_to_nw_tt:0 "Tous les comtés dans le [GetTitleByKey('d_brandons_gift').GetName] seront accordés [GetTitleByKey('k_the_wall').GetHolder.Custom('FR_au_Char_Pi')][GetTitleByKey('k_the_wall').GetHolder.GetTitledFirstName]"
 new_gift_will_be_returned_to_nw_tt:0 "Tous les comtés dans le [GetTitleByKey('d_new_gift').GetName] seront accordés [GetTitleByKey('k_the_wall').GetHolder.Custom('FR_au_Char_Pi')][GetTitleByKey('k_the_wall').GetHolder.GetTitledFirstName]"
 agot_nights_watch.3005.t:0 "Le Don offert"
 agot_nights_watch.3005.desc:0 "Le Nord avait naguère revendiqué Neufdon, mais une fois encore ces terres se voient changer de main dans un élan de générosité à tout le moins inattendu.\n\n[GetTitleByKey('c_norlinton').GetNameNoTier], [GetTitleByKey('c_boreharrow').GetNameNoTier], [GetTitleByKey('c_whitecross').GetNameNoTier] ainsi que [GetTitleByKey('c_giantsbeard').GetNameNoTier] sont désormais à nouveau attenants à la Garde de Nuit, comme ils le furent jadis.\n\nC’est là un soutien inestimable dans notre lutte éternel contre les dangers d’au-delà du Mur."
 agot_nights_watch.3005.desc_brandons_gift:0 "Le Nord avait naguère revendiqué Don-Bran, mais une fois encore ces terres se voient changer de main dans un élan de générosité à tout le moins inattendu.\n\n[GetTitleByKey('c_weatherback_ridge').GetNameNoTier], [GetTitleByKey('c_moles_town').GetNameNoTier] et [GetTitleByKey('c_hoarburn').GetNameNoTier] sont désormais à nouveau attenants à la Garde de Nuit, comme ils le furent jadis.\n\nC’est là un soutien inestimable dans notre lutte éternel contre les dangers d’au-delà du Mur."
 agot_nights_watch.3005.a:0 "Nous devrons faire bon usage de ce présent !"