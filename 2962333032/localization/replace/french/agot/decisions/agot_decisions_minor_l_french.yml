 global_events_settings.0002.t:0 "$global_events_settings.0001.t$"
 global_events_settings.0002.desc:0 "$global_events_settings.0001.desc$"
 global_events_settings.0002.less_homage:0 "Que mes vassaux viennent rendre hommage à un rythme raisonnable."
 global_events_settings.0002.less_homage.tt:0 "Vous verrez le nombre normal de vassaux venir rendre hommage."
 global_events_settings.0002.more_homage:0 "Tous doivent me rendre hommage."
 global_events_settings.0002.more_homage.tt:0 "Vous répondrez à #N #bold BEAUCOUP PLUS#!#! de vassaux qui viennent rendre hommage."
 global_events_settings.0002.homage_on:0 "Que les seigneurs du royaume viennent me rendre à nouveau hommage."
 global_events_settings.0002.homage_on.tt:0 "Vous allez #P #bold autoriser#!#!  les vassaux à venir rendre hommage."
 global_events_settings.0002.homage_off:0 "Je n'ai aucun intérêt pour les hommages."
 global_events_settings.0002.homage_off.tt:0 "Vous allez #N #bold interdire#!#! aux vassaux de venir rendre hommage."
 global_events_settings.0002.petitioners_on:0 "Autoriser les seigneurs du royaume à demander une audience."
 global_events_settings.0002.petitioners_on.tt:0 "Vous allez #P #bold autoriser#!#! les demandes d'audience."
 global_events_settings.0002.petitioners_off:0 "Je ne veux plus m'encombrer avec les audiences."
 global_events_settings.0002.petitioners_off.tt:0 "Vous allez #N #bold refuser#!#! les demandes d'audience."
 global_events_settings.0003.t:0 "$global_events_settings.0002.t$"
 global_events_settings.0003.desc:0 "$global_events_settings.0002.desc$"
 global_events_settings.0003.it_toggle_on:0 "Tenez-moi informé de la succession du Trône de Fer."
 global_events_settings.0003.it_toggle_on.tt:0 "Actuellement, #N #bold vous ne serez pas#!#! informé de la succession du Trône de Fer."
 global_events_settings.0003.it_toggle_off:0 "La succession du Trône de Fer ne me concerne en rien."
 global_events_settings.0003.it_toggle_off.tt:0 "Actuellement, #P #bold vous serez #!#! informé chaque fois qu'un nouveau dirigeant montera sur le Trône de Fer."
 global_events_settings.0004.t:0 "$global_events_settings.0002.t$"
 global_events_settings.0004.desc:0 "$global_events_settings.0002.desc$"
 global_events_settings.0004.nw_toggle_on:0 "Les affaires de la Garde de Nuit m'intéressent."
 global_events_settings.0004.nw_toggle_on.tt:0 "Actuellement, #N #bold vous ne serez pas#!#! informé par les élections de la Garde de Nuit."
 global_events_settings.0004.nw_toggle_off:0 "Les agissements de la Garde de Nuit ne me concernent pas."
 global_events_settings.0004.nw_toggle_off.tt:0 "Actuellement, #P #bold vous serez#!#! informé chaque fois qu'un nouveau Lord Commandant de la Garde de Nuit sera élu."
 agot_house_maintenance.1000.t:0 "Liste des querelles de maison"
 agot_house_maintenance.1000.desc:0 "À votre demande, voici la liste de toutes les [house_feuds|El] de maison dont nous connaissons l'existence :"
 agot_house_maintenance.1000.desc_none:0 "Il semble qu'il n'y ait aucune querelle connue."
 manage_bank_decision:0 "Gérer la banque"
 manage_bank_decision_desc:0 "En tant que [Concept( 'agot_bank_director', 'direct' )|E][ROOT.Char.Custom('FR_EurRice')|E], c'est à moi qu'il revient de prendre les décisions à propos des politiques en vigueur au sein de la [agot_bank|El]. De mes choix peuvent dépendre la faillite ou la fortune."
 manage_bank_decision_tooltip:0 "Choisissez quelle politique bancaire vous souhaitez modifier"
 manage_bank_decision_confirm:0 "Voyons cela"
 manage_bank_decision_effect:0 "Choisissez quelle politique bancaire vous souhaitez modifier"
 CHOOSE_BANK_DECISION_NEXT_STEP_BUTTON:0 "Sélectionner le sujet"
 set_risk_level_name:0 "Changer le niveau de risque"
 set_risk_level_tooltip:0 "Vous pourrez choisir entre un [agot_bank_risk_level|El] faible, moyen ou élevé pour les prêts et les investissements."
 set_dividend_level_name:0 "Ajuster les taux de dividendes"
 set_dividend_level_tooltip:0 "Vous pourrez choisir entre des taux faible, moyen ou élevé pour les [agot_bank_dividends|El]."
 set_interest_level_name:0 "Ajuster les taux d'intérêt"
 set_interest_level_tooltip:0 "Vous pourrez choisir entre un [agot_bank_interest_rate|El] faible, normal ou élevé. Plus le taux d'intérêt est faible et plus vous diminuez les [agot_bank_profits|El] de votre [agot_bank|El], mais en contrepartie vous attirez davantage de clients."
 delegate_defaulter_handling_name:0 "Déléguer la gestion des défauts de paiement"
 delegate_defaulter_handling_tooltip:0 "Vous ne recevrez plus de messages concernant les défauts de paiement."
 handle_defaulters_again_name:0 "Gérer les défauts de paiement"
 handle_defaulters_again_tooltip:0 "Vous recevrez un message à chaque fois qu'un défaut de paiement aura lieu."
 investments_forbidden_name:0 "Rejeter les nouveaux investissements"
 investments_forbidden_tooltip:0 "Vous serez [ROOT.Char.Custom('FR_LeLa')] seul[ROOT.Char.Custom('FR_E')] à pouvoir investir dans la banque."
 investments_allowed_name:0 "Autoriser les nouveaux investissements"
 investments_allowed_tooltip:0 "Tous les personnages dans votre pays seront autorisés à investir dans la banque."
