l_french:
 stress_loss_summerhall_decision:0 "Évadez-vous à Lestival"
 stress_loss_summerhall_decision_tooltip:0 "Trouver la paix au milieu des ruines"
 stress_loss_summerhall_decision_desc:0 "J'ai besoin d'être seul avec mes pensées et loin de tous ces gens. Lestival est peut-être en ruines aujourd'hui, mais il offrira un répit salutaire."
 stress_loss_summerhall_decision_confirm:0 "Il est temps"
 agot_minor_decisions_events.0004.t:0 "Les ruines de Lestival"
 agot_minor_decisions_events.0004.desc:0 "La tragédie de Lestival a failli sonné le glas des Targaryen, pourtant une étrange sensation de quiétude règne parmi les ruines. Les brumes de mon esprit semblent se dissiper."
 agot_minor_decisions_events.0004.a:0 "Il est temps de rentrer..."
 stress_loss_uncouth_decision:0 "Laissez vous aller"
 stress_loss_uncouth_decision_desc:0 "La pression est devenu trop forte. Si le monde veut me voir comme un monstre, un monstre je vais leur faire voir."
 stress_loss_uncouth_decision_tooltip:0 "Vous allez renoncer à sauver les apparences, laissant vos cheveux et vos ongles pousser à leur guise."
 stress_loss_uncouth_decision_confirm:0 "Qui a besoin de se laver ?"
 uncouth_stopped_cutting:0 "Cheveux non coupés"
 uncouth_stopped_cutting_desc:0 "Ce personnage a cessé de se couper les cheveux, laissant paraître une apparence négligée."
 mend_dynasty_relations_decision:0 "Réconcilier les dragons"
 mend_dynasty_relations_decision_desc:0 "Depuis l’époque du bon roi, le dragon noir a toujours cherché vicieusement un moyen de détruire le rouge. Mais nous avons #italic enfin#!  appris à vivre en paix, et les deux dragons peuvent enfin être en bons termes. Faut-il tourner la page sur notre ancienne animosité ?"
 mend_dynasty_relations_decision_tooltip:0 "Vous allez rétablir les relations entre Targaryen et Feunoyr."
 mend_dynasty_relations_decision_confirm:0 "Les dragons rugiront à l'unisson !"
 agot_minor_decisions_events.0004.desc_egg:0 "\n\nDu coin de l'œil, j'aperçois quelque chose dans les décombres. Avec grande précaution, je retire les débris et constate l'ampleur de mon étonnante trouvaille. Un diamant parmi les charbons, un trésor parmi les ruines : #bold un œuf de dragon !#!"
 start_contraceptives_decision:0 "Utiliser des contraceptifs"
 start_contraceptives_decision_desc:0 "En consultant un médecin je peux obtenir des contraceptifs, comme le thé de lune, qui peuvent être utilisés pour s'assurer que mes escapades occasionnelles n'engendrent pas d'inconvénients."
 start_contraceptives_decision_tooltip:0 "Sacrifier un peu de [income|El] pour réduire votre [fertility|El]."
 start_contraceptives_decision_confirm:0 "Je suis prêt[ROOT.Char.Custom('FR_E')]"
 stop_contraceptives_decision:0 "Arrêter d'utiliser des contraceptifs"
 stop_contraceptives_decision_desc:0 "Il est temps pour moi de mettre mes herbes et cataplasmes de côté. Je ne voulais peut-être pas d'enfants auparavant, mais le moment est venu de mettre au monde des fils et des filles."
 stop_contraceptives_decision_tooltip:0 "Arrêter de sacrifier un peu de [income|El] pour réduire votre [fertility|El]."
 stop_contraceptives_decision_confirm:0 "Laisser la nature suivre son cours"
 can_be_knight_and_commander_decision:0 "Accepter de devenir capitaine ou commandant"
 can_be_knight_and_commander_decision_tooltip:0 "Vous pourrez devenir le capitaine ou le commandant de votre seigneur lige."
 can_be_knight_and_commander_decision_desc:0 "Mon seigneur lige pourra me désigner comme son capitaine ou commandant."
 can_be_knight_and_commander_decision_confirm:0 "Je suis prêt[ROOT.Char.Custom('FR_E')] à me battre"
 cannot_be_knight_and_commander_decision:0 "Refuser de devenir capitaine ou commandant"
 cannot_be_knight_and_commander_decision_tooltip:0 "Vous ne pourrez pas devenir le capitaine ou commandant de votre seigneur lige."
 cannot_be_knight_and_commander_decision_desc:0 "Mon seigneur lige ne pourra pas me désigner comme son capitaine ou commandant."
 cannot_be_knight_and_commander_decision_confirm:0 "Je ne veux plus me battre"
 manage_realm_affairs_decision:0 "Gérer les affaires du pays"
 manage_realm_affairs_decision_desc:0 "Ne dit-on pas que le savoir, c’est le pouvoir ? Le monde est vaste et nombre de choses s’y passent, il est donc de bon ton de garder un œil sur son évolution. Sur quels sujets je souhaite être informé ? Où se trouvent les précieux artefacts de valeur ? Quelles sont les rivalités d’envergure à connaître ?\n\nTant de questions qui méritent une réponse si l’on souhaite prendre les bonnes décisions."
 manage_realm_affairs_decision_tooltip:0 "Choisissez les événements sur lesquels vous souhaitez être informé ou consultez les différents rapports"
 manage_realm_affairs_decision_confirm:0 "Convoquer un domestique."
 manage_realm_affairs_decision_effect:0 "Sélectionnez les affaires qui doivent vous être soumises directement ou consultez les rapports venus du monde entier"
 CHOOSE_REALM_AFFAIRS_DECISION_NEXT_STEP_BUTTON:0 "Sélectionner le sujet"
 choose_petitioners_and_homage_name:0 "Requérants et hommage"
 choose_petitioners_and_homage_tooltip:0 "Choisissez si vous souhaitez recevoir des requérants et des hommages"
 choose_foreign_succession_name:0 "Héritage étranger"
 choose_foreign_realms_succession_tooltip:0 "Choisissez si vous souhaitez être informé des successions étrangères"
 choose_foreign_succession_invalid:0 "Vous dirigez déjà le Trône de Fer !"
 choose_nights_watch_elections_name:0 "Élections de la Garde de Nuit"
 choose_nights_watch_elections_tooltip:0 "Choisissez si vous souhaitez être informé de l'élection d'un nouveau Lord Commandant de la Garde de Nuit"
 choose_nights_watch_elections_invalid:0 "Vous êtes déjà le Lord Commandant !"
 choose_show_valyrian_steel_name:0 "Acier valyrien"
 choose_show_valyrian_steel_tooltip:0 "Vous recevrez une liste de tous les propriétaires d'acier valyriens connus."
 choose_dragons_name:0 "Dragons"
 choose_dragons_tooltip:0 "Choisissez si vous souhaitez être informé des nouvelles concernant les [dragons_plural|El] ou bien recevoir une liste de tous les dragons et de leurs œufs"
 choose_house_feuds:0 "Querelles de maison"
 choose_house_feuds_desc:0 "Vous recevrez une liste de toutes les [house_feuds|El] de maisons"
 choose_house_feuds_tooltip:0 "Vous recevrez une liste de toutes les [house_feuds|El] de maisons"
 choose_dragon_trees:0 "Lignées draconiques"
 choose_dragon_trees_tooltip:0 "Vous recevrez une liste de toutes les [dragon_matriarchs|El]"
 choose_banks:0 "Banques"
 choose_banks_desc:0 "Vous recevrez une liste de toutes les [agot_banks|El]"
 choose_banks_tooltip:0 "Vous recevrez une liste de toutes les [agot_banks|El]"
 agot_requires_rc:0 "Cette option requiert le DLC Royal Court"
 agot_requires_court:0 "Cette option requiert une [royal_court|El]"
 agot_requires_fnf:0 "Cette option requiert le DLC Friends and Foes"
 agot_requires_rtp:0 "Cette option requiert le DLC Roads to Power"
 global_events_settings.0001.t:0 "Les affaires du royaume"
 global_events_settings.0001.desc:0 "Les décisions quotidiennes du pays accaparent tellement mon attention ces derniers temps...\n\nAlors qu’une autre affaire est portée à mon attention par l’un de mes domestiques, je me demande si j’ai vraiment besoin d’être dérangé par tout cela."
 global_events_settings.0001.dragonrider_death_toggle_on:0 "Tenez-moi informé de la mort des dragonniers."
 global_events_settings.0001.dragonrider_death_toggle_on.tt:0 "Actuellement, #N #bold vous ne serez pas#!#! informé lorsqu'un dragonnier meurt."
 global_events_settings.0001.dragonrider_death_toggle_off:0 "La mort des dragonniers ne me concerne en rien."
 global_events_settings.0001.dragonrider_death_toggle_off.tt:0 "Actuellement, #P #bold vous serez #!#! informé lorsqu'un dragonnier meurt."
 global_events_settings.0001.dragon_death_toggle_on:0 "Tenez-moi informé de la mort des dragons."
 global_events_settings.0001.dragon_death_toggle_on.tt:0 "Actuellement, #N #bold vous ne serez pas#!#! informé lorsqu'un dragon meurt."
 global_events_settings.0001.dragon_death_toggle_off:0 "La mort des dragons ne me concerne en rien."
 global_events_settings.0001.dragon_death_toggle_off.tt:0 "Actuellement, #P #bold vous serez #!#! informé lorsqu'un dragon meurt."
 global_events_settings.0001.inform_dragon_egg_hatched_toggle_on:0 "Tenez-moi informé de l'éclosion des œufs de dragon."
 global_events_settings.0001.inform_dragon_egg_hatched_toggle_on.tt:0 "Actuellement, #N #bold vous ne serez pas#!#! informé lorsqu'un œuf de dragon éclot."
 global_events_settings.0001.inform_dragon_egg_hatched_toggle_off:0 "L'éclosion des œufs de dragon ne me concerne en rien."
 global_events_settings.0001.inform_dragon_egg_hatched_toggle_off.tt:0 "Actuellement, #P #bold vous serez #!#! informé lorsqu'un œuf de dragon éclot."
 global_events_settings.0001.inform_dragon_tamed_toggle_on:0 "Tenez-moi informé de l'apprivoisement des dragons."
 global_events_settings.0001.inform_dragon_tamed_toggle_on.tt:0 "Actuellement, #N #bold vous ne serez pas#!#! informé lorsqu'un dragon est apprivoisé."
 global_events_settings.0001.inform_dragon_tamed_toggle_off:0 "L'apprivoisement des dragons ne me concerne en rien."
 global_events_settings.0001.inform_dragon_tamed_toggle_off.tt:0 "Actuellement, #P #bold vous serez #!#! informé lorsqu'un dragon est apprivoisé."
 global_events_settings.0001.vs_blades:0 "À propos des porteurs d'acier valyrien..."
 global_events_settings.0001.petitioners:0 "À propos des requérants et des hommages..."
