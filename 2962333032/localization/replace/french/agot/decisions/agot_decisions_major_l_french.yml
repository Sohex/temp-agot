l_french:
 reveal_identity_decision:0 "Dévoiler votre identité"
 reveal_identity_decision_tooltip:0 "Dévoilez votre identité au monde."
 reveal_identity_decision_desc:0 "Je cache ce secret depuis un certain temps déjà, peut-être est-il temps de le dévoiler au monde ?"
 reveal_identity_decision_confirm:0 "Révélez la vérité !"
 knight_of_the_laughing_tree_effect:0 "Votre identité en tant que #Bold Chevalier d'Aubier rieur#! sera dévoilée"
 generic_secret_identity_tooltip:0 "Votre véritable identité sera révélée au grand jour"
 select_dynastic_nickname:0 "Choisir le symbole épithétique de votre maison"
 select_dynastic_nickname_desc:0 "Le blason n'est pas qu'un morceau de tissu pour habiller les murs d'un château ou décorer les champs de bataille, il est l'identité même de la maison qui le brandit, un symbole de son histoire. C'est pourquoi nous devons adopter un symbole qui résonnera dans le cœur de nos ennemis autant que de nos alliés."
 select_dynastic_nickname_tooltip:0 "Choisissez un symbole pour les [nicknames|El] de votre [house|El]"
 select_dynastic_nickname_tt:0 "Vous aurez la possibilité de choisir le symbole qui illustrera les [nicknames|El] de votre [house|El]."
 select_dynastic_nickname_confirm:0 "Que nul ne puisse nous ignorer !"
 agot_beg_bittersteel_to_make_golden_company:0 "Sous l'or, l'aigre acier"
 agot_beg_bittersteel_to_make_golden_company_desc:0 "Aigracier a sué sang et eau pour la cause des Feunoyr, en tant que mercenaire. Mais l'exil émousse peu à peu son soutien, au gré des nombreuses compagnies auxquelles il loue son épée. Le temps est peut-être venu de fonder une nouvelle compagnie… celle qui jurera de servir loyalement le Dragon Noir."
 agot_beg_bittersteel_to_make_golden_company_effect:0 "Aigracier va former la Compagnie Dorée"
 agot_beg_bittersteel_to_make_golden_company_confirm:0 "Former la Compagnie Dorée"
 agot_beg_bittersteel_to_make_golden_company_tooltip:0 "$agot_beg_bittersteel_to_make_golden_company_effect$ — une compagnie de mercenaires à recruter"
 AGOT_PREFIX_THE:0 "$articleblank_blank$"
 agot_mega_war_declare_independence_decision:0 "Déclarer l’indépendance"
 agot_mega_war_declare_independence_decision_desc:0 "Il est temps de déclarer mon indépendance [ROOT.Var('agot_pwl_direct').Char.Custom('FR_au_Char_Pi')][ROOT.Var('agot_pwl_direct').Char.GetTitledFirstName] ! Je ne suis pas sans savoir que faire sécession va très probablement m’attirer ses foudres, et conduire à une escalade qui poussera mes propres vassaux à reconsidérer leur loyauté, mais si c’est le prix à payer pour nous libérer du joug de la Maison [ROOT.Var('agot_pwl_direct').Char.GetHouse.GetName], alors qu’il en soit ainsi."
 agot_mega_war_declare_independence_decision_tooltip:0 "Vous obtiendrez l’indépendance complète pour vos terres… ou deviendrez un[THIS.Char.Custom('FR_E')] rebelle dans une [war|El] contre votre lige."
 agot_mega_war_declare_independence_decision_confirm:0 "Le moment est venu !"
 agot_mega_war_declare_rebellion_decision:0 "Entrer en rébellion ouverte"
 agot_mega_war_declare_rebellion_decision_desc.1:0 "[ROOT.Var('agot_pwl_direct').Char.Custom('FR_le_Char_Pi')|U][ROOT.Var('agot_pwl_direct').Char.GetTitledFirstName] est coupable de bien trop de torts pour que son règne perdure plus longtemps, mais la destitution ne saurait être la solution. Ce dont a besoin [ROOT.Var('agot_pwl_direct').Char.GetPrimaryTitle.GetNameNoTier] c’est d’un nouveau ordre plus que d’un nouveau règne. Il est temps de faire table rase !"
 agot_mega_war_declare_rebellion_decision_desc.2:0 "[ROOT.Char.GetLiege.Custom('FR_le_Char_Pi')|U][ROOT.Char.GetLiege.GetTitledFirstName] est coupable de bien trop de torts pour que son règne perdure plus longtemps, mais la destitution ne saurait être la solution. Ce dont a besoin [ROOT.Char.GetLiege.GetPrimaryTitle.GetNameNoTier] c’est d’un nouveau ordre plus que d’un nouveau règne. Il est temps de faire table rase !"
 agot_mega_war_declare_rebellion_decision_tooltip:0 "Déclarez la guerre contre le pouvoir en place"
 agot_mega_war_declare_rebellion_decision_confirm:0 "Le moment est venu !"