l_french:
 agot_attempt_triarchy:0 "Tenter de former la Triarchie"
 agot_attempt_triarchy_desc:0 "Contacter les autres Filles dans le but de former la Triarchie."
 agot_attempt_triarchy_tooltip:0 "Prendre contact avec vos confrères dirigeants pour former la Triarchie"
 agot_attempt_triarchy_confirm:0 "Apportez-moi mon sceau."
 agot_stepstones_rhoynish_culture:0 "Une nouvelle identité"
 agot_stepstones_rhoynish_culture_desc:0 "Depuis longtemps nous sommes bloqués sur ces îles, et depuis longtemps nous sommes restés fidèles aux racines qui nous lient à la Rhoyne et aux Anciennes Principautés. Mais souhaitons-nous vraiment qu'il en reste ainsi ?"
 agot_stepstones_rhoynish_culture_tooltip:0 "Une nouvelle culture divergente émergera de la culture $rhoynish$, avec ses propres traditions."
 agot_stepstones_rhoynish_culture_confirm:0 "Une nouvelle ère commence"
 agot_seize_control:0 "Prise de contrôle"
 agot_seize_control_desc:0 "Une dictature n'est pas voué à perdurer éternellement ; si je veux assurer la succession de ma dynastie, je dois abandonner toute prétention à la démocratie."
 agot_seize_control_tooltip:0 "Les élections vont être définitivement abandonné au profit d'un gouvernement féodal"
 agot_seize_control_confirm:0 "Apportez-moi mon sceau"
 agot_seize_control_full_county_control_tt:0 "Le [county_control|El] de votre [capital|El] est au maximum"
 strong_hook_on_all_powerful_vassals_tt:0 "Vous avez un [strong_hook|El] sur tous vos [powerful_vassals|El]"
 agot_form_undisputed_lands:0 "Annexer les Terres Disputées"
 agot_form_undisputed_lands_decision_desc:0 "Ces terres ont connu maintes et maintes guerres depuis le Fléau de Valyria, mais je les ai finalement unies."
 agot_form_undisputed_lands_decision_tooltip:0 "Former un royaume à partir de ces terres autrefois disputées"
 agot_form_undisputed_lands_confirm:0 "À l'infamie et à l'immortalité !"
 three_daughters_confederation:0 "La confédération des Trois Filles existe"
 agot_break_braavos_pentos_treaty:0 "Briser le traité braavo-pentoshi"
 agot_break_braavos_pentos_treaty_desc:0 "Depuis l'an 209, les Braaviens ont contraint la fière cité de Pentos à respecter leur maudit traité, mais de quel droit devrions-nous souffrir de l'autorité étrangère de faquins qui brandissent leur morceau de papier, comme le maître brandit son fouet devant l'esclave ?! Le temps est venu de nous en libérer ! Le temps est venu de retrouver notre souveraineté véritable !"
 agot_break_braavos_pentos_treaty_effect_tt:0 "Le traité braavo-pentoshi sera brisé. Pentos pourra à nouveau #bold développer son armée, engager des mercenaires et participer à l'esclavage#!."
 agot_break_braavos_pentos_treaty_effect_2_tt:0 "Braavos obtiendra un casus belli pendant #bold 15 ans#! qui lui permettra de tenter de réaffirmer le traité."
 agot_break_braavos_pentos_treaty_tooltip:0 "Briser le traité braavo-pentoshi"
 agot_break_braavos_pentos_treaty_confirm:0 "Pour Pentos !"
 agot_create_braavos_pentos_treaty_effect_tt:0 "Le modificateur « [GetModifier('agot_pentos_braavos_treaty').GetNameWithTooltip] » sera appliqué à tous les personnages à l'intérieur du territoire contrôlé par Pentos, et cela jusqu'à ce que le traité soit brisé par la guerre."
 agot_break_braavos_pentos_treaty_as_braavos:0 "$agot_break_braavos_pentos_treaty$"
 agot_break_braavos_pentos_treaty_as_braavos_desc:0 "Jusque-là, nous avons fait montre de respect pour les frontières de Pentos, en vertu du traité de l'an 209. Mais un morceau de papier ne saurait être un frein à l'expansion de notre belle cité, et moins encore un bouclier capable de les protéger de la fureur du Titan."
 agot_break_braavos_pentos_treaty_as_braavos_effect_tt:0 "Vous, ainsi que tous les vassaux au sein de Braavos, pourrez déclarer librement la guerre à Pentos et à ses vassaux."
 agot_break_braavos_pentos_treaty_as_braavos_confirm:0 "Pour Braavos !"
 agot_braavos_pentos_treaty_is_active:0 "Vous ne pouvez pas déclarer de guerre tant que le [GetModifier('agot_pentos_braavos_treaty').GetNameWithTooltip] est actif."
 agot_break_braavos_pentos_treaty_as_braavos_tooltip:0 "$agot_break_braavos_pentos_treaty_tooltip$"
 agot_overthrow_bearded_priests:0 "Renverser les prêtres à barbe"
 agot_overthrow_bearded_priests_desc:0 "Norvos est entre les mains des prêtres à barbe. La grande et fière cité est sous l'emprise du dogme tandis que la magistrature est traitée comme une caste subalterne, et de cela il est temps de mettre un terme. Il est temps de renverser le pouvoir en place et de rompre les chaînes de cette dictature religieuse."
 norvos_diarch_attempt_to_overthrow_liege.tt.majority_powerful_conspirators_support:0 "Nombre actuel de [powerful_vassals|El] et de [powerful_families|El] vous soutenant dans votre coup d'État #weak (vous y compris)#! : [SCOPE.ScriptValue('norvos_pv_overthrow_tally_display_value')|0] (sur [SCOPE.ScriptValue('norvos_pv_overthrow_threshold_display_value')|0] requis)"
 agot_attempt_to_overthrow_bearded_priests.tt.liege_accepts.keep_hof:0 "[liege.Custom('FR_le_Char_Pi')|U][liege.GetTitledFirstName] garde ses titres de [head_of_faith|El]."
 agot_attempt_to_overthrow_bearded_priests.tt.liege_fights_and_loses.may_lose_everything:0 "[liege.Custom('FR_le_Char_Pi')|U][liege.GetTitledFirstName] sera contraint[liege.Custom('FR_E')] d'abandonner ses titres de [head_of_faith|El]."
 agot_attempt_to_overthrow_bearded_priests.tt.liege_response:0 "Votre [diarch|El] pourra au choix abdiquer, vous surclasser dans l’[skill|El] que vous aurez choisie, ou bien choisir un intermédiaire pour le faire"
 agot_attempt_to_overthrow_bearded_priests.tt.liege_response.information_on_converting_councillors:0 "#WEAK Les [powerful_vassals|El] qui soutiennent votre coup d’État refuseront de servir d’intermédiaire pour votre [diarch|El]#!"
 agot_attempt_to_overthrow_bearded_priests.tt.convert_to_free_city:0 "Norvos deviendra un royaume [GetGovernment( 'administrative_government' ).GetName|l]"
 norvos_estate_tier_change_warning:0 "@warning_icon! #warning  La [estate|El] [usurper.Custom('FR_du_Char_Pi')][usurper.GetTitledFirstName] ainsi que tous les dirigeants dans votre pays seront de [title_tier|El] [Concept('duchy','ducal')|E], ce qui pourrait entraîner des changements dans les [domicile_buildings|El] déjà construits !#!"
 diarch_attempt_to_overthrow_liege.tt.win.norvos_diarch_captured:0 "#P Victoire#! : vous [Concept('imprisoned','emprisonnez')|E] votre [diarch|El]"
 diarch_attempt_to_overthrow_liege.tt.win.norvos_diarch_dies:0 "#P Victoire#! : votre [diarch|El] [character_death_dies|El]"
 norvos_diarch_coup_liege_interaction.tt.promising_nothing:0 "Je n’ai rien à gagner : $VALUE|+=0$"
 norvos_diarch_coup_liege_interaction.tt.has_eroded_bp_power:0 "A réduit significativement l’[Concept('swing_scales_of_power','équilibre des pouvoirs')|E] des prêtres à barbe"