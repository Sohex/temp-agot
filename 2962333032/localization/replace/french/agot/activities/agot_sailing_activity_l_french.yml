 agot_sailing_type_valyria_desc:0 "$EFFECT_LIST_BULLET$Braver les dangers de la Mer Fumeuse et des ruines de Valyria\n$EFFECT_LIST_BULLET$Possibilité d’obtenir des [artifacts|El] rares valyriens ainsi qu’un [modifier|El] unique\n$EFFECT_LIST_BULLET$Augmente l’[Concept('trait_level_track_xp','expérience du trait')|E] [GetTrait('lifestyle_mariner').GetName(GetNullCharacter)|l]\n\n#weak Nombreux sont ceux qui se sont risqués à voyager jusqu'aux ruines de l’Antique Valyria, mais combien en sont revenus ? Ce serait déjà un exploit en soi, mais qui sait ce qui peut être trouvé dans les vestiges de la plus grande civilisation de mémoire d’homme ?#!\n\n#N C'est un voyage extrêmement risqué à entreprendre et une mort quasi-certaine sans préparation adéquate !#!"
