 activity_agot_sailing_desc:0 "La mer, dans son immensité d’azur, regorge de mystères, d’opportunités et d’aventures, alors pourquoi diantre n’irais-je pas à sa rencontre ?"
 activity_agot_sailing_destination_selection:0 "Choisissez le port depuis lequel débutera votre voyage !"
 activity_agot_sailing_selection_tooltip:0 "Voguez en haute mer pour aller dénicher les richesses qui s’y trouvent.\n\nRécompenses prévues :\n$BULLET_WITH_TAB$[legitimacy|E] [legitimacy_i]\n$BULLET_WITH_TAB$[prestige|E] [prestige_i]\n$BULLET_WITH_TAB$[gold|E] [gold_i]\n$BULLET_WITH_TAB$[stress_loss|E] [stress_loss_i]"
