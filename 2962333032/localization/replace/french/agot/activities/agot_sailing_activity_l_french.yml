 activity_agot_sailing_guest_desc:0 "\n\n$BULLET_WITH_TAB$[prestige|E] [prestige_i|E]\n$BULLET_WITH_TAB$[gold|E] [gold_i]\n$BULLET_WITH_TAB$[stress_loss|E] [stress_loss_i|E]\n$BULLET_WITH_TAB$[artifacts|E] @artifact_icon!\n"
