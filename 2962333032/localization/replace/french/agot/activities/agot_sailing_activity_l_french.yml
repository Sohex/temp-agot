 agot_sailing_type_hunt:0 "Traque d’une bête"
 agot_sailing_type_hunt_desc:0 "$EFFECT_LIST_BULLET$Vous aurez l’occasion de prendre en chasse une proie parmi diverses créatures marines\n$EFFECT_LIST_BULLET$Augmente l’[Concept('trait_level_track_xp','expérience du trait')|E] [GetTrait('lifestyle_mariner').GetName(GetNullCharacter)|l]\n\n#weak Des baleines, des krakens, ou simplement des tortues de mer, qui sait ce que vous pourriez réussir à embrocher du bout de votre harpon !#!"
 agot_sailing_type_raid:0 "Se livrer au pillage"
 agot_sailing_type_raid_desc:0 "$EFFECT_LIST_BULLET$Vous aurez l’occasion de choisir entre piller des côtes ou des navires de passage\n$EFFECT_LIST_BULLET$Augmente l’[Concept('trait_level_track_xp','expérience du trait')|E] [GetTrait('lifestyle_mariner').GetName(GetNullCharacter)|l]\n\n#weak La mer peut être changeante, comme l’est le vent, comme le sont les marées, mais une chose demeure constante : il y a toujours quelqu’un quelque part dont l’or ne demande qu’à être cueilli comme un fruit bien juteux.#!"
