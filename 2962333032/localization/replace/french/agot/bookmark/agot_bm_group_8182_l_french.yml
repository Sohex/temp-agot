l_french:
 agot_bm_group_8182:0 "182 Ap.C."
 agot_bm_8182:0 "Au son des cloches"
 agot_bm_8182_desc:0 "Les flammes de la guerre menacent de part et d’autres, une fournaise comme la Rhoyne n’en avait plus été témoin depuis le temps jadis où les dragons se sont déchaînés par centaines.\n\nÀ Lorath, la victoire du Premier Magistrat Thys O’Rel contre Norvos n’aura pas étanché sa soif de conquête, et désormais son regard se tourne vers la colonie ibbénienne installée à la Hache.\n\nÀ Qohor, la lutte est d’ordre politique, avec l’élection qui oppose Haratt Ekna à Korena Ostorlat — l’une partisane d’une vindicte contre Norvos pour prix des exactions de la cité, l’autre prêcheuse d’une alliance avec cette même cité pour contrecarrer le conquérant Lorathi.\n\nTandis qu’au sud, c’est un Volantain qui rythme la marche. Krahas Segal, gouverneur de Gar Sagon, s’est retourné contre les Rhoynar menés par Asuhara Arhe Maeli, et mène désormais une guerre existentielle contre ses alliés de naguère.\n\n#bold Une funeste cacophonie résonne tout du long de la Mère, et bientôt viendra le moment de sonner le glas de ses instigateurs.#!"
 bookmark_182_thys_o_rell:0 "Premier Magistrat Thys"
 bookmark_182_thys_o_rell_subheading:0 "Premier Magistrat de Lorath"
 bookmark_182_thys_o_rell_desc:0 "[Concept( 'story_content_thys_o_rell_182', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_thys_o_rell_182', '$bm_story_content_available_copy|q$' )|E]\nDepuis sa victoire contre la Grande Norvos il y a de cela deux ans et demi, le commandant lorathi, conquérant s’il en est, a les yeux rivés sur la Hache, mais empêtré dans une campagne devenue un véritable bourbier, ses ambitions pourraient se faire plus fardeau que bienfait pour sa patrie, car rares sont les ennemis a oublier les défaites.\n\n#bold Lorsque l’ambition devient un dédale duquel son propre bâtisseur ne peut plus s’échapper, la cité qu’il a en charge peut-elle espérer trouver une issue heureuse ?#!"
 bookmark_182_korena_ostorlat:0 "Magistrate Korena"
 bookmark_182_korena_ostorlat_subheading:0 "Magistrate de Grjevuros"
 bookmark_182_korena_ostorlat_desc:0 "[Concept( 'story_content_korena_ostorlat_182', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_korena_ostorlat_182', '$bm_story_content_available_copy|q$' )|E]\nAlors que l’élection du prochain magistrat de Qohor approche, Korena Ostorlat se présente comme ouvertement favorable à une alliance avec Norvos, arguant qu’une telle conciliation serait la seule façon de contrecarrer l’ambition inextinguible de Thys, Premier Magistrat de Lorath, dont les plans de conquête pourraient bien mettre le feu à toute la région.\n\n#bold Certaines batailles se livrent sur le champ de bataille, et d’autres sur le champ politique, et celle qui approche pourrait bien sceller le destin de Qohor.#!"
 bookmark_182_haratt_ekna:0 "Magistrat Haratt"
 bookmark_182_haratt_ekna_subheading:0 "Magistrat d’Erodhunavar"
 bookmark_182_haratt_ekna_desc:0 "[Concept( 'story_content_haratt_ekna_182', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_haratt_ekna_182', '$bm_story_content_available_copy|q$' )|E]\nSi certains — ou certaines — voient en Norvos un allié potentiel, pour Harrat Ekna c’est un ennemi contre lequel Qohor doit brandir bien haut le glaive de la justice et frapper sans tarder pour prix de ses trop nombreux crimes perpétués contre la cité.\n\n#bold Le grondement de la guerre se fait entendre, mais pour qui sonnera le glas si Haratt devait s’élever au titre de Premier Magistrat ?#!"
 bookmark_182_krahas_segal:0 "Gouverneur Krahas"
 bookmark_182_krahas_segal_subheading:0 "Gouverneur de Gar Sagon"
 bookmark_182_krahas_segal_desc:0 "[Concept( 'story_content_krahas_segal_182', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_krahas_segal_182', '$bm_story_content_available_copy|q$' )|E]\nKrahas Segal, gouverneur Volantain, est parvenu à se hisser à la tête de Gar Sagon par une habile conquête obtenue au sortir d’une alliance avec la confédération rhoynar, contre laquelle il n’a pas hésité à se retourner pour poursuivre plus avant ses projets de domination de la Rhoyne.\n\n#bold Lorsqu’un homme transforme de fidèles alliées en farouches ennemis, peut-il espérer triompher ou se risque-t-il à se noyer dans sa propre ambition ?#!"
 bookmark_182_arhe_meali:0 "Lady Asuhara"
 bookmark_182_arhe_meali_subheading:0 "Dame de Pihu Sar"
 bookmark_182_arhe_meali_desc:0 "[Concept( 'story_content_arhe_meali_182', '$bm_story_content_available_icon|q$' )|E] [Concept( 'story_content_arhe_meali_182', '$bm_story_content_available_copy|q$' )|E]\nNaguère alliée de premier ordre des Volantains, Asuhara Arhe Meali, redoutable meneuse de la confédération rhoynar, a souffert d’une odieuse trahison, et cherche désormais à défaire ceux qu’elle a aidés à prendre possession de Gar Sagon.\n\n#bold La guerre et la trahison étant devenues les piliers fondateurs de la Rhoyne actuelle, Asuhara devra certainement singer ses ennemis si elle souhaite triompher.#!"