l_french:
 agot_knighthood_maintenance.0005.t:0 "L’infortune d’un écuyer"
 agot_knighthood_maintenance.0005.desc:0 "Parce que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('my_squire'))] n’est malheureusement plus en capacité de prétendre à la chevalerie, il me faut [my_squire.Custom('FR_LeLa')] congédier de son service d’écuage."
 agot_knighthood_maintenance.0005.a:0 "Puisse [ROOT.Char.GetFaith.WarGodName] lui donner la force de surmonter cette épreuve."
 agot_knighthood_maintenance.0005.a.tt:0 "En raison d’un trait qui [my_squire.Custom('FR_LeLa')] rend inapte à la chevalerie, vous ne pouvez plus garder [my_squire.GetFirstNameNoTooltip] comme écuyer."
 agot_knighthood_maintenance.0006.t:0 "Cruelle infortune"
 agot_knighthood_maintenance.0006.desc:0 "Parce que je ne suis malheureusement plus en capacité de prétendre à la chevalerie, il me faut me résigner à ne plus pouvoir servir [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('my_knight'))] comme écuyer et abandonner l’idée d’être un jour adoubé."
 agot_knighthood_maintenance.0006.a:0 "Hélas, trois fois hélas…"
 agot_knighthood_maintenance.0006.a.tt:0 "En raison d’un trait qui vous rend inapte à la chevalerie, vous ne pouvez plus être écuyer."
 agot_knighthood_maintenance.0008.t:0 "La tutelle se termine"
 agot_knighthood_maintenance.0008.desc:0 "Un chevalier a bien des devoirs, quiconque n’aura pas oublié ses vœux, pourrait en témoigner. Et parmi ces devoirs, il est celui de former dûment l’écuyer à son service, car plus qu’un servant, c’est lui-même un chevalier en devenir, et donc le futur garant des serments de la chevalerie.\n\nMais malheureusement, c’est là un devoir qu’il me faut abandonner. En raison de trouble entre nous, je ne peux pas garder [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('my_squire'))] comme écuyer."
 agot_knighthood_maintenance.0008.a:0 "Regrettable, mais nécessaire."
 agot_knighthood_maintenance.0008.desc_nemesis: "Un chevalier a bien des devoirs, quiconque n’aura pas oublié ses vœux, pourrait en témoigner. Et parmi ces devoirs, il est celui de former dûment l’écuyer à son service, car plus qu’un servant, c’est lui-même un chevalier en devenir, et donc le futur garant des serments de la chevalerie.\n\nMais malheureusement, c’est là un devoir qu’il me faut abandonner car il serait malavisé pour un chevalier de garder son ennemi juré comme écuyer, en l’occurrence, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('my_squire'))]."
 agot_knighthood_maintenance.0008.desc_rivalry: "Un chevalier a bien des devoirs, quiconque n’aura pas oublié ses vœux, pourrait en témoigner. Et parmi ces devoirs, il est celui de former dûment l’écuyer à son service, car plus qu’un servant, c’est lui-même un chevalier en devenir, et donc le futur garant des serments de la chevalerie.\n\nMais malheureusement, c’est là un devoir qu’il me faut abandonner car il serait malavisé pour un chevalier de garder son propre rival comme écuyer, en l’occurrence, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('my_squire'))]."
 agot_knighthood_maintenance.0008.desc_war_against_knight: "Un chevalier a bien des devoirs, quiconque n’aura pas oublié ses vœux, pourrait en témoigner. Et parmi ces devoirs, il est celui de former dûment l’écuyer à son service, car plus qu’un servant, c’est lui-même un chevalier en devenir, et donc le futur garant des serments de la chevalerie.\n\nMais malheureusement, c’est là un devoir qu’il me faut abandonner. En raison de la guerre qui nous oppose, je ne peux pas garder [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('my_squire'))] comme écuyer."
 agot_knighthood_maintenance.0008.desc_liege_war_against_knight: "Un chevalier a bien des devoirs, quiconque n’aura pas oublié ses vœux, pourrait en témoigner. Et parmi ces devoirs, il est celui de former dûment l’écuyer à son service, car plus qu’un servant, c’est lui-même un chevalier en devenir, et donc le futur garant des serments de la chevalerie.\n\nMais malheureusement, c’est là un devoir qu’il me faut abandonner. En raison de la guerre qui m’oppose à [Select_CString(my_squire.GetLiege.IsFemale,'sa dame lige','son seigneur lige')], je ne peux pas garder [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('my_squire'))] comme écuyer."
 agot_knighthood_maintenance.0008.desc_liege_war_against_knight_liege: "Un chevalier a bien des devoirs, quiconque n’aura pas oublié ses vœux, pourrait en témoigner. Et parmi ces devoirs, il est celui de former dûment l’écuyer à son service, car plus qu’un servant, c’est lui-même un chevalier en devenir, et donc le futur garant des serments de la chevalerie.\n\nMais malheureusement, c’est là un devoir qu’il me faut abandonner. En raison de la guerre qui oppose nos lige respectifs, je ne peux pas garder [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('my_squire'))] comme écuyer."
 agot_knighthood_maintenance.0009.t:0 "La tutelle se termine"
 agot_knighthood_maintenance.0009.desc:0 "Un chevalier a bien des devoirs, quiconque n’aura pas oublié ses vœux, pourrait en témoigner. Et parmi ces devoirs, il est celui de former dûment l’écuyer à son service, car plus qu’un servant, c’est lui-même un chevalier en devenir, et donc le futur garant des serments de la chevalerie, ce que j’espère devenir un jour.\n\nMalheureusement, cet espoir semble s’amenuir lorsque [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('my_knight'))] me fait savoir qu’il me relève de mes fonctions d’écuyer, et cela par la faute de l’hostilité qui nous divisent désormais."
 agot_knighthood_maintenance.0009.a:0 "Peste !"
 agot_knighthood_maintenance.0009.desc_nemesis: "Un chevalier a bien des devoirs, quiconque n’aura pas oublié ses vœux, pourrait en témoigner. Et parmi ces devoirs, il est celui de former dûment l’écuyer à son service, car plus qu’un servant, c’est lui-même un chevalier en devenir, et donc le futur garant des serments de la chevalerie, ce que j’espère devenir un jour.\n\nMalheureusement, cet espoir semble s’amenuir lorsque [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('my_knight'))] me fait savoir qu’il me délie de mes fonctions d’écuyer, ne souhaitant aucunement avoir son ennemi juré pour fourbir son équipement et lui servir ses coupes [my_knight.Custom('RegionalAlcoholicDrink')]."
 agot_knighthood_maintenance.0009.desc_rivalry: "Un chevalier a bien des devoirs, quiconque n’aura pas oublié ses vœux, pourrait en témoigner. Et parmi ces devoirs, il est celui de former dûment l’écuyer à son service, car plus qu’un servant, c’est lui-même un chevalier en devenir, et donc le futur garant des serments de la chevalerie, ce que j’espère devenir un jour.\n\nMalheureusement, cet espoir semble s’amenuir lorsque [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('my_knight'))] me fait savoir qu’il me délie de mes fonctions d’écuyer, ne souhaitant aucunement avoir son rival pour fourbir son équipement et lui servir ses coupes [my_knight.Custom('RegionalAlcoholicDrink')]."
 agot_knighthood_maintenance.0009.desc_war_against_knight: "Un chevalier a bien des devoirs, quiconque n’aura pas oublié ses vœux, pourrait en témoigner. Et parmi ces devoirs, il est celui de former dûment l’écuyer à son service, car plus qu’un servant, c’est lui-même un chevalier en devenir, et donc le futur garant des serments de la chevalerie, ce que j’espère devenir un jour.\n\nMalheureusement, cet espoir semble s’amenuir lorsque [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('my_knight'))] me fait savoir qu’il me délie de mes fonctions d’écuyer, en raison de la guerre qui nous oppose."
 agot_knighthood_maintenance.0009.desc_liege_war_against_knight: "Un chevalier a bien des devoirs, quiconque n’aura pas oublié ses vœux, pourrait en témoigner. Et parmi ces devoirs, il est celui de former dûment l’écuyer à son service, car plus qu’un servant, c’est lui-même un chevalier en devenir, et donc le futur garant des serments de la chevalerie, ce que j’espère devenir un jour.\n\nMalheureusement, cet espoir semble s’amenuir lorsque [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('my_knight'))] me fait savoir qu’il me délie de mes fonctions d’écuyer, en raison de la guerre qui l’oppose à [Select_CString(ROOT.Char.GetLiege.IsFemale,'ma dame lige','mon seigneur lige')]."
 agot_knighthood_maintenance.0009.desc_liege_war_against_knight_liege: "Un chevalier a bien des devoirs, quiconque n’aura pas oublié ses vœux, pourrait en témoigner. Et parmi ces devoirs, il est celui de former dûment l’écuyer à son service, car plus qu’un servant, c’est lui-même un chevalier en devenir, et donc le futur garant des serments de la chevalerie, ce que j’espère devenir un jour.\n\nMalheureusement, cet espoir semble s’amenuir lorsque [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('my_knight'))] me fait savoir qu’il me délie de mes fonctions d’écuyer, en raison de la guerre qui oppose nos lige respectifs."
 agot_knighthood_maintenance.0010.t:0 "La chevalerie en deuil"
 agot_knighthood_maintenance.0010.desc:0 "Feu [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('dead_knight'))] [dead_knight.GetDeathReason], ce qui signifie que mon mentor et chevalier n’est plus.\n\nSa mort l’aura délié de tous ses serments, et elle ne saurait m’enchaîner. Un funeste obstacle sur la route qui me mènera à la chevalerie, mais tout bon chevalier se doit de surmonter des épreuves pour prouver sa valeur. Si je souhaite triompher de celle-ci, il me faudra trouver un autre chevalier pour achever ma formation et ainsi me permettre de prononcer mes vœux devant [ROOT.Char.GetFaith.PantheonTerm], le jour venu."
 agot_knighthood_maintenance.0010.a:0 "Je chercherais quelqu’un, mais pour l’heure j’ai d’autres préoccupations."
 agot_knighthood_maintenance.0010.a.tt:0 "Vous conserverez votre expérience en tant qu’écuyer et pourrez continuer d’arpenter la voie de la chevalerie si d’aventure vous trouviez un nouveau chevalier pour vous prendre sous son aile."
 agot_knighthood_maintenance.0010.b:0 "Que l’on fasse savoir que je suis en quête d’un preux !"
 agot_knighthood_maintenance.0010.b.tt:0 "S’il y a des chevaliers présents dans la région qui sont intéressés à l’idée de vous prendre comme écuyer, vous en serez informé[THIS.Char.Custom('FR_E')]."
 agot_knighthood_maintenance.0011.t:0 "En quête d’un chevalier"
 agot_knighthood_maintenance.0011.desc:0 "L’on me rapporte une requête pour le moins inhabituelle alors que je vaque à [ROOT.Char.Custom('IdleActivity')]. [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('knightless_squire'))|U] ayant perdu le chevalier qu’il servait en tant qu’écuyer, se retrouve sans nul personne pour terminer sa formation et lui permettre ainsi de se faire adouber le moment venu.\n\nÉtant moi-même chevalier, il requiert de moi que je le prenne sous mon aile, et l’aide à le parfaire comme le preux qu’il souhaite devenir."
 agot_knighthood_maintenance.0011.a:0 "Enseigner les nobles vertus de la chevalerie est un devoir."
 agot_knighthood_maintenance.0011.b:0 "Je n’ai que faire d’un écuyer."
 agot_knighthood_maintenance.0011.b.tt:0 "Vous rejetez la demande de [knightless_squire.GetFirstNameNoTooltip] d’en faire votre écuyer."
 agot_knighthood_maintenance.0012.t:0 "Le dernier geste"
 agot_knighthood_maintenance.0012.desc:0 "L’instant est solennel et l’heure funeste : l’homme qui m'a tant appris repose sur son lit de mort, et chaque souffle expiré pourrait être le dernier.\n\n[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('dead_knight'))|U] a souhaité me voir avant la fin, et en bon écuyer, j'ai répondu à son appel. Tandis que je m’approche [ROOT.Char.Custom('quirk_pos_adverb')], je m’interroge sur la dernière tâche que mon chevalier pourrait me confier au soir de son existence. Lorsqu’il se saisit d’une épée et la place difficilement sur mon épaule, je comprends…\n\n« [ROOT.Char.GetFirstNameNoTooltip]… au… au nom… [dead_knight.GetFaith.WarGodNamePossessive]… je t’enjoins… à être brave… » Un mélange de peine et de joie s’entasse dans ma bouche…"
 agot_knighthood_maintenance.0012.a:0 "Merci, [dead_knight.GetTitledFirstNameNoTooltip]. Merci…"
 agot_knighthood_maintenance.0012.a.tt:0 "Vous avez été adoubé."
 agot_knighthood_maintenance.0300.t:0 "Les réflexions d’un écuyer"
 agot_knighthood_maintenance.0300.desc:0 "L’homme qui était en charge de me guider sur la noble voie de la chevalerie n’est plus, et il en est ainsi depuis trop longtemps.\n\nDès lors, n’ayant pu lui trouver un remplaçant, il me faut, à mon corps défendant, accepter l’idée que cette étape de mon voyage ne saurait se poursuivre dans l’immédiat…"
 agot_knighthood_maintenance.0300.a:0 "Quel dessein peut bien servir un écuyer sans chevalier ?"
 agot_knighthood_maintenance.0300.a.tt:0 "Vous renoncez à votre fonction d’écuyer, tout en gardant l’idée de le redevenir plus tard."
 agot_knighthood_maintenance.0300.b:0 "L’or fera tout aussi bien de moi un chevalier que la noblesse d’âme."
 agot_knighthood_maintenance.0300.b.tt:0 "Vous achèterez votre titre de chevalier."
 agot_knighthood_maintenance.0300.c:0 "Être écuyer n’est pas moins honorable qu’être chevalier, si le cœur y est."
 agot_knighthood_maintenance.0300.c.tt:0 "Vous resterez écuyer indéfiniment."
 agot_knighthood_maintenance.0400.t:0 "Un piètre écuyer"
 agot_knighthood_maintenance.0400.desc:0 "N’est pas chevalier qui veut, semble-t-il.\n\nDéfendre les faibles, protéger les innocents, épauler les justes, tout cela nécessite une rigueur et un dévouement que tout bon écuyer se doit d’avoir et d’apprendre. Quelle qualité me fait le plus défaut, la rigueur ou le dévouement ? C’est la question qui me trotte dans la tête tandis que j’apprends que je suis relevé de mes fonctions d’écuyer, la faute à de bien trop piètres résultats…"
 agot_knighthood_maintenance.0400.a:0 "Par [ROOT.Char.GetFaith.NegativeAfterLife] !"
 agot_knighthood_maintenance.0500.t:0 "L’écuyer qui devint [ROOT.Char.GetTitleAsNameNoTooltip|l]"
 agot_knighthood_maintenance.0500.desc:0 "Mon récent héritage met en lumière le fait que je ne peux plus m’appesantir du titre d’écuyer. C’est une condition indigne d’un[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetTitleAsNameNoTooltip|l] et je ne souhaite ni souffrir des quolibets de mes ennemis, ni des ricanements de mes sujets.\n\nJ’aimerais que ce soit un plus noble dessein que la vulgaire politique qui presse mon allure sur le long chemin de la chevalerie, mais il en est ainsi."
 agot_knighthood_maintenance.0500.a:0 "Que mon chevalier m’adoube séant !"
 agot_knighthood_maintenance.0500.b:0 "Je puis dévouer cette tâche à l’un de mes vassaux."
 agot_knighthood_maintenance.0500.c:0 "Qu’un membre de ma [ROOT.Char.Custom('KingsguardName')] s'en charge !"
 agot_knighthood_maintenance.0500.d:0 "N’importe quel chevalier de ma cour fera l’affaire."
 agot_knighthood_maintenance.0500.e:0 "L’or fera tout aussi bien de moi un chevalier que la noblesse d’âme."
 agot_knighthood_maintenance.0500.f:0 "Au diable la chevalerie et les coqs qui s’en gargarisent !"
 agot_knighthood_maintenance.0501.opening:0 "[my_relation.Custom2('AppropriateGreeting', ROOT.Char)],"
 agot_knighthood_maintenance.0501.desc:0 "Mon récent héritage met en lumière le fait que je ne peux plus m’appesantir du titre d’écuyer. C’est une condition indigne d’un[my_relation.Custom('FR_E')] [my_relation.GetTitleAsNameNoTooltip|l] et je ne souhaite ni souffrir des quolibets de mes ennemis, ni des ricanements de mes sujets. J’aimerais que ce soit un plus noble dessein que la vulgaire politique qui presse mon allure sur le long chemin de la chevalerie, mais il en est ainsi.\n\nJe requiers que vous m’adoubiez séant !"
 agot_knighthood_maintenance.0501.a:0 "Montrez-vous digne de votre serment, Ser [my_relation.GetFirstNameNoTooltip]."
 agot_knighthood_maintenance.0550.t:0 "Le chemin du retour"
 agot_knighthood_maintenance.0550.desc:0 "Sur mon ordre, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('cancelled_squire_child'))] est désormais en route pour [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], ce qui bien entendu met fin à son écuage envers [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('childs_knight'))]."
 agot_knighthood_maintenance.0550.a:0 "Je pourrais toujours lui trouver un autre chevalier le moment venu."
 agot_knighthood_maintenance.0551.opening:0 "[recipient.Custom2('AppropriateGreeting', childs_knight)|U],"
 agot_knighthood_maintenance.0551.desc:0 "En raison d’affaires familiales dont je vous épargnerais les détails, il me faut rappeler [cancelled_squire_child.Custom('FR_le_Char_Pi')][cancelled_squire_child.GetTitledFirstName] à ma Cour.\n\nComme vous pouvez vous en douter, cela signifie donc qu’[Select_CString(cancelled_squire_child.IsFemale,'elle est relevée','il est relevé')] de ses fonctions d’écuyer à votre égard."
 agot_knighthood_maintenance.0551.a:0 "Soit."