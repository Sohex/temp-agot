l_french:
 norvos_government_events.0001.t:0 "Frappé d’anathème"
 norvos_government_events.0001.desc:0 "En vertu de mes pêchés, [shadowy_priests.Custom('FR_le_Char_Pi')][shadowy_priests.GetTitledFirstName] a jeté sur moi une profonde opprobre.\n\nMe voilà désormais mis au ban de la société norvoshi. Pour la décennie à venir, je serais traité[ROOT.Char.Custom('FR_E')] non plus qu’un vulgaire paria aux yeux de Norvos."
 norvos_government_events.0001.a:0 "Voilà qui est fâcheux."
 norvos_government_events.0050.t:0 "Une vision dogmatique"
 norvos_government_events.0050.desc:0 "Pour avoir embrasser [ROOT.Char.GetFaith.GetNameNoTooltip|l], [shadowy_priests.Custom('FR_le_Char_Pi')][shadowy_priests.GetTitledFirstName] a jeté sur moi l’opprobre, et plus encore, la marque de l’hérésie.\n\nS’il est vrai que les autres cités libres font preuve de tolérance vis-à-vis des cultes et autres croyances qui leur sont étrangères, à Norvos la foi est loi, et les prêtres à barbe n’en tolèrent qu’une : la leur.\n\nL’infamie appelle la fureur, la faute appelle la sentence. Moi, ainsi que tous ceux qui m’ont suivis dans cette folle conversion, devons maintenant nous attendre à subir la vindicte des grands prêtres en personne."
 norvos_government_events.0050.a:0 "Dois-je prier [ROOT.Char.GetFaith.HighGodName], ou le Dieu à Barbe, pour me sortir de là ?"
 norvos_government_events.0050.a_tt:0 "Les prêtres à barbe vont #italic trancher#! la question de votre sort."
 norvos_government_events.0051.t:0 "Un jugement dogmatique"
 norvos_government_events.0051.desc:0 "Après délibération, le jugement est prêt à être rendu. Pour crime d’hérésie, je suis jugé[ROOT.Char.Custom('FR_E')] coupable, et la sentence est… "
 norvos_government_events.0051.desc_judgement_conversion:0 "#high la pénitence par la reconversion.#!\n\n\nSi j’abandonne mes fausses croyances, si je brûle mes fausses idoles, et que j’embrasse à nouveau le dogme des prêtres à barbe, alors [shadowy_priests.Custom('FR_le_Char_Pi')][shadowy_priests.GetTitledFirstName] consentira à m’accorder la vie sauve."
 norvos_government_events.0051.desc_judgement_death:0 "#warning la mort.#!\n\n\nUne fine perle de sueur coule le long de ma joue, et celle-ci double de volume lorsque je vois mon propre reflet sur le métal étincelant de la grande hache du prêtre qui s’avance vers moi."
 norvos_government_events.0051.a:0 "J’en appelle [ROOT.Char.GetFaith.PantheonTerm2]. Sauvez votre [Select_CString(ROOT.Char.IsFemale,'loyale servante','loyal serviteur')] !"
 norvos_government_events.0051.b:0 "Les foutaises prêchaient par [ROOT.Char.GetFaith.ReligiousSymbol] ne valent pas mon sacrifice."
 norvos_government_events.0051.c:0 "Plutôt pourrir dans [ROOT.Char.GetFaith.NegativeAfterLife] que de renier [ROOT.Char.GetFaith.GetNameNoTooltip|l] !"
 norvos_government_events.0051.d:0 "En public je serais un[ROOT.Char.Custom('FR_E')] disciple du Dieu à Barbe, mais en public seulement."
 norvos_government_events.0502.t:0 "Un jugement dogmatique"
 norvos_government_events.0502.desc:0 "S’il est vrai que les autres cités libres font preuve de tolérance vis-à-vis des cultes et autres croyances étrangères, à Norvos la foi est loi, et les prêtres à barbe n’en tolèrent qu’une : la leur. Ainsi, pour avoir embrassé [ROOT.Char.GetFaith.GetNameNoTooltip|l], [accused.Custom('FR_le_Char_Pi')][accused.GetTitledFirstName] a été sommairement exécuté[accused.Custom('FR_E')].\n\nC'est maintenant à mon tour de choisir : brûler ce que les prêtres à barbe considèrent comme de fausses idoles pour me laver de l'hérésie qui est la mienne, ou bien rester fidèle à la foi [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] et partager le même sort que [accused.GetFirstNameNoTooltip]."
 norvos_government_events.0502.a:0 "Qu’est-ce que la foi comparée à la vie ?"
 norvos_government_events.0502.b:0 "En public je serais un[ROOT.Char.Custom('FR_E')] disciple du Dieu à Barbe, mais en public seulement."
 norvos_government_events.0502.c:0 "Plutôt pourrir dans [ROOT.Char.GetFaith.NegativeAfterLife] que de renier [ROOT.Char.GetFaith.HighGodName] !"
 norvos_government_events.0502_secret_conversion_tt:0 "Vous embrassez secrètement [converted_faith.GetName|l]"