l_french:
 agot_filler_westerlands.0001.t:0 "La bête tapie dans l’ombre"
 agot_filler_westerlands.0001.desc:0 "À l'occasion d’une petite escapade dans les terres de mon domaine, je découvre avec étonnement un vaste réseau de caverne au cœur même de la montagne, son exploration m’amenant rapidement à la conclusion que nul homme n’a foulé l’endroit.\n\nAllant plus avant dans les profondeurs souterraines, quelque chose finit par me dissuader de poursuivre mon périple : l’écho caverneux d’un bruit qui déchire violemment le silence — non — qui le massacre sauvagement. C'est là un rugissement ; le cri de semonce d’une bête qui m’enjoint à déguerpir de son antre.\n\nIl est bien connu que les contrées rocheuses et escarpées des Terres de l’Ouest sont le foyer de bien des créatures, féroces pour la plupart, mais aucune n’inspire la crainte autant que le respect qu’un lion acculé."
 agot_filler_westerlands.0001.a:0 "Je ne crains nullement d’aller #italic tirer la queue du lion#!."
 agot_filler_westerlands.0001.a_tt:0 "Vous dégainez votre [THIS.Char.Custom('signature_weapon')] et allez à la rencontre du gardien des lieux."
 agot_filler_westerlands.0001.b:0 "Il serait malavisé de ne pas tenir compte de cet avertissement."
 agot_filler_westerlands.0002.t:0 "La bête tapie dans l’ombre"
 agot_filler_westerlands.0002.desc:0 "[ROOT.Char.Custom('FR_Un_signature_weapon')|U] dans une main, une torche dans l’autre, j’avance un pas après l’autre, la respiration rauque de la bête se faisant toujours plus proche, toujours plus menaçante.\n\nJe n’aurai sans doute le temps que de porter un, peut-être deux coups avant que ses griffes ne m’atteignent, et alors nous verrons qui aura l’arme la plus aiguisée.\n\nJe prends une profonde inspiration, histoire d’éclaircir ma cervelle, et puisque l’idée d’aller quérir quelques glorioles dans le noir me paraît toujours être une idée avisée, je continue d’avancer…"
 agot_filler_westerlands.0002.a:0 "Cette aventure me vaudra sûrement une chanson en mon nom."
 agot_filler_westerlands.0002.a_tt:0 "#italic Mais les bardes la chanteront-ils d’un ton glorieux, d’un ton moqueur ou d’un ton funeste ?#!"
 agot_filler_westerlands.0003.t:0 "La bête tapie dans l’ombre"
 agot_filler_westerlands.0003.desc:0 "#warning Je suis couvert[ROOT.Char.Custom('FR_E')] de sang…#! est-ce à dire que la bête a eu raison de moi ? #bold Non.#!\n\nIl me faut un petit moment pour le réaliser, mon esprit étant encore embrumée par l’excès de violence qui coule dans mes veines, mais j’ai occis l’animal. Ce sang est le sien, non le mien, car ses griffes étaient certes acérées, mais les miennes l’étaient plus encore, acérées, que les siennes.\n\nSi je puis me gargariser de sortir de ces tunnels en un seul morceau, je ne peux espérer ramener une fourrure en guise de trophée : la bête est dans un sale état…"
 agot_filler_westerlands.0003.a:0 "Au moins ramènerais-je une chanson de ce périple."
 agot_filler_westerlands.0004.t:0 "The Old Man's Gemstone"
 agot_filler_westerlands.0004.desc:0 "I oft pass my spare time by wandering in the woods to relax. On today's walk, I come across an old man. Usually, I'd ignore the commoners however this one is eager for my attention...\n\nThe old man introduces himself as [old_man_filler1.GetFirstNameNoTooltip], and claims his forebears were not always commoners. \"We were once lords not unlike yourself,\" he rasps with a toothy grin. \"But how we lost our seat is a song for another day...\"\n\nHe reveals a peculiar gemstone from his pocket. It glimmers in red and gold hues. \"My ancestors were rich. This gem is one of the last remaining vestiges of our once mighty rule. I see it has caught your fancy,\" his grin hardens into a scowl. \"I would part with this gem, but the price would be steep...\""
 agot_filler_westerlands.0004.a:0 "Well, this seems quite the rare find!"
 agot_filler_westerlands.0004.a_tt:0 "But what if it's a fake..."
 agot_filler_westerlands.0004.b:0 "I am a noble. I take what I want!"
 agot_filler_westerlands.0004.b_tt:0 "You take the gem by force."
 agot_filler_westerlands.0004.c:0 "No, thank you. This intrusion has only added to my worries."
 agot_filler_westerlands.0005.t:0 "The Old Man's Gemstone"
 agot_filler_westerlands.0005.desc:0 "I find myself fidgeting with the red-and-gold gemstone. Was it worth the cost I paid for it? Could it indeed be the last remnant of an extinguished house?\n\nMy [steward.GetCouncilTitle], [steward.GetTitledFirstName], notices my worried demeanor and offers counsel. \"Entrust the gem to me, and I can assess the authenticity of its origins,\" [steward.GetSheHe] says. I hardly have a chance to answer before the gemstone is in [steward.GetHerHis] hands..."
 agot_filler_westerlands.0005.a:0 "I pray this puts my mind at ease."
 agot_filler_westerlands.0005.a_tt:0 "But do you truly trust your steward?"
 agot_filler_westerlands.0006.t:0 "The Old Man's Gemstone"
 agot_filler_westerlands.0006.desc:0 "It has been a week since anyone in the keep has seen my [steward.GetCouncilTitle], none knowing the task with which I'd entrusted [steward.GetHerHim]. I find myself pacing back and forth in my throne room, increasingly agitated.\n\nAfter all I went through to secure the gemstone, I am now certain: #N My [steward.GetCouncilTitle] has stolen the red-and-gold gem for [steward.GetHerHis] own!#!"
 agot_filler_westerlands.0006.a:0 "That swine!"
 agot_filler_westerlands.0006.a_tt:0 "Perhaps you ought to find a new steward..."
 agot_filler_westerlands.0007.t:0 "The Old Man's Gemstone"
 agot_filler_westerlands.0007.desc:0 "[steward.GetTitledFirstName] enters the throne room, trembling — in fear or anger, I cannot tell. \"My [ROOT.Char.GetLadyLord], I apologize for my appearance, but I have... upsetting news,\" [steward.GetSheHe] stammers.\n\n\"Speak plainly,\" I urge. Then, with a sigh, [steward.GetSheHe] brings forth the red-and-gold gemstone from [steward.GetHerHis] pocket. By [steward.GetHerHis] look, I can tell the search to verify its authenticity has concluded.\n\n\"A fake, my [ROOT.Char.GetLadyLord],\" [steward.GetSheHe] says, handing the #italic 'gem'#! back to me."
 agot_filler_westerlands.0007.a:0 "Damn you!"
 agot_filler_westerlands.0007.a_tt:0 "You feel a lion's rage take over your body as you lunge for your steward."
 agot_filler_westerlands.0007.b:0 "Damn that thief!"
 agot_filler_westerlands.0007.b_tt:0 "How did you fall for such a ruse?"
 agot_filler_westerlands.0008.t:0 "The Old Man's Gemstone"
 agot_filler_westerlands.0008.desc:0 "I leap toward my steward, allowing my anger to burst forth even though he is just the messenger.\n\nUnfortunately for me, my steward reaches for his sword in defense, and I am a bit slow to react..."
 agot_filler_westerlands.0008.a:0 "Gods be good, what have I done?"
 agot_filler_westerlands.0008.a_tt:0 "So much blood..."
 agot_filler_westerlands.0009.t:0 "The Old Man's Gemstone"
 agot_filler_westerlands.0009.desc:0 "[steward.GetTitledFirstName] enters the throne room, trembling — in fear or excitement, I cannot tell. \"My lord, I apologize for my appearance, but I have... #bold wonderful#! news,\" he says, breathing heavily. He clearly came in a hurry.\n\n\"Speak plainly,\" I urge. With a gasp, he brings forth the red-and-gold gemstone from his pocket. By his look, I can tell his search to verify its authenticity has concluded.\n\n\"This gem is impeccable, my lord,\" he says, handing it to me. \"I was able to verify that it is, in fact, a treasure of the extinguished House Reyne!\""
 agot_filler_westerlands.0009.a:0 "A rare find indeed!"
 agot_filler_westerlands.0009.a_tt:0 "But does that mean... The old man I met..."
 agot_filler_westerlands.0010.t:0 "L’éboulement"
 agot_filler_westerlands.0010.desc:0 "Lors d’une inspection de routine de mon domaine aux côtés [steward.Custom('FR_du_Char_Pi')][steward.GetTitledFirstName], un messager arrivant grand train se fait corbeau de malefortune, et pour cause, les Terres de l’Ouest savent se faire inhospitalières à bien des égards, et parmi la multitude d’aléas qui peuvent frapper les habitants des collines escarpées et autres montagnes abruptes, il est bien entendu souvent question d'éboulement — raison de l’empressement du messager, en l’occurrence.\n\n« Pardonnez-moi [ROOT.Char.Custom('FormOfAddressForLiege')], mais les nouvelles sont pressantes. Un village voisin a vu une partie de sa route être emportée par la chute de rochers plus gros que des carrioles. Les habitants implorent l’aide de leur suzerain, car sans cette voie commerciale de premier ordre, ils se disent condamnés. »"
 agot_filler_westerlands.0010.a:0 "Qu’y a-t-il donc de si extraordinaire pour qu’un[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetTitleAsNameNoTooltip|l] doive se charger de cela ?"
 agot_filler_westerlands.0010.a_tt:0 "Vous pensez les habitants tout à fait capables de résoudre ce problème par eux-mêmes."
 agot_filler_westerlands.0010.b:0 "[steward.GetFirstNameNoTooltip], envoyez quelques gros bras prêter main forte."
 agot_filler_westerlands.0010.c:0 "Je ne rechigne jamais au dur labeur."
 agot_filler_westerlands.0010.c_tt:0 "Vous irez en personne et montrerez à tous que vous êtes un[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetTitleAsNameNoTooltip|l] qui n’a pas peur de se retrousser les manches."
 agot_filler_westerlands.0011.t:0 "Fureur populaire"
 agot_filler_westerlands.0011.desc:0 "Au sortir d’une longue journée, la conversation que j’entretiens avec mes conseillers s’achève, et tandis que je m’apprête à me retirer pour aller [ROOT.Char.Custom('IdleActivity')], un vacarme de tous les diables brise la tranquillité qui régnait jusque-là entre ces murs.\n\nL’homme responsable de cet outrage s’avance, visage furieux, démarche furieuse, propos furieux : « Vous nous avez abandonnés ! Par votre faute, des mères, des fils et des filles sont morts ! L’éboulement nous a privé de notre route, et la famine a achevé le travail ! »\n\nToute la Cour continue de l’entendre, même lorsqu’il est expulsé hors les murs par mes gardes. Des visages d’indignation s’affichent de ci de là, mais ce n’est peut-être pas tant les propos proférés que les conséquences de mon inaction que ces gens fustigent…"
 agot_filler_westerlands.0011.a:0 "Je n’ai plus le luxe de choisir désormais."
 agot_filler_westerlands.0011.a_tt:0 "Vous n’avez plus d’autre choix que d’envoyer des gens prêter main forte au village"
 agot_filler_westerlands.0012.t:0 "La voie est dégagée"
 agot_filler_westerlands.0012.desc:0 "Lorsqu’enfin quelqu’un pénètre dans la salle du trône pour m’informer des suites de l’affaire de l’éboulement, j’ai la plaisante surprise de voir qu’il s’agit de m[marshal.Custom('FR_OnA')] propre [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('marshal'))] : [marshal.Custom('FR_du_Char_Pi')][marshal.GetTitledFirstName].\n\n« [ROOT.Char.Custom('FormOfAddressForLiege')|U], nos hommes ont fait de l’excellent travail. La route est dégagée et les habitants nous en savent gré. » dit-[marshal.Custom('FR_IlElle')] d'un ton plus qu’enjoué."
 agot_filler_westerlands.0012.a:0 "Voilà qui fait plaisir à entendre."
 agot_filler_westerlands.0012.a_tt:0 "Le petit peuple chantera vos louanges."
 agot_filler_westerlands.0012.b:0 "Que mes hommes se voient remercier comme il se doit !"
 agot_filler_westerlands.0012.b_tt:0 "Les réserves de vin de miel épicé de Port-Lannis que vous possédez seront grandement appréciées."
 agot_filler_westerlands.0013.t:0 "Déblayer la caillasse"
 agot_filler_westerlands.0013.desc:0 "Arrivé[ROOT.Char.Custom('FR_E')] sur les lieux, je constate avec effarement les dégâts causés par l’éboulement. D’énormes rochers jonchent le sol, rendant la route pour ainsi dire impraticable. Les quelques villageois présents tentent maladroitement de déblayer ceux que leurs maigres moyens peuvent déblayer, quand ils ne s’en remettent tout simplement pas aux dieux, mais dans le meilleur des cas, cela leur prendra quelques lunes.\n\nQuelque chose doit être fait, et doit être fait dare-dare."
 agot_filler_westerlands.0013.a:0 "Il n’y a pas trente six façons de régler le problème. En avant !"
 agot_filler_westerlands.0013.b:0 "Allez quérir séant charrettes et chevaux pour le déblayage !"
 agot_filler_westerlands.0013.b_tt:0 "Avec l’aide des [THIS.Char.Custom('LevyMenWomen')] du village, cela ne devrait pas être une trop grosse gageure."
 agot_filler_westerlands.0013.c:0 "Ce ne sera pas une mince affaire. Peut-être que…"
 agot_filler_westerlands.0013.c_tt:0 "En utilisant certains mécanismes d’engins de siège, il serait possible de construire des grues de fortune pour faciliter et accélérer le déblaiement."
 agot_filler_westerlands.0013.d:0 "Avec la bonne expertise, ce sera un jeu d’enfant !"
 agot_filler_westerlands.0013.d_tt:0 "Quelques schémas et une bonne planification suffiront à résoudre le problème en un rien de temps."
 agot_filler_westerlands.0013.e:0 "Et si on ramenait des chèvres pour qu’elles poussent les gros cailloux ?"
 agot_filler_westerlands.0013.f:0 "Je ne suis clairement pas [Select_CString(ROOT.Char.IsFemale,'la mieux charpentée','le mieux charpenté')] pour un tel travail…"
 agot_filler_westerlands.0014.t:0 "La voie est dégagée"
 agot_filler_westerlands.0014.desc:0 "Je contemple le résultat de ce dur labeur — je n’irais pas jusqu’à dire que la route est comme neuve, mais l’éboulement n’est plus qu’un mauvais souvenir, et de fait, les villageois peuvent pousser un soupir de soulagement.\n\nLe commerce devrait rapidement reprendre son cours."
 agot_filler_westerlands.0014.a:0 "Voilà une bonne chose de réglée."
 agot_filler_westerlands.0015.t:0 "La voie est dégagée"
 agot_filler_westerlands.0015.desc:0 "À en juger par le résultat, l’idée était ingénieuse.\n\nL’éboulement a été déblayé en un temps record, et le commerce va pouvoir reprendre son cours. Les villageois m’en savent gré d’une telle efficacité."
 agot_filler_westerlands.0015.a:0 "Ce genre de défi est toujours plaisant."
 agot_filler_westerlands.0015.a_tt:0 "L’esprit a besoin de problèmes à résoudre comme l’épée d’une pierre à aiguiser."
 agot_filler_westerlands.0016.t:0 "La voie est dégagée"
 agot_filler_westerlands.0016.desc:0 "C’est avec grande joie que je contemple mon œuvre. Une planification rigoureuse aura permis, non pas simplement de réparer la route et de déblayer l’éboulement, mais d’améliorer considérablement la voie commerciale.\n\nLes villageois eux-mêmes sont stupéfaits d’une telle prouesse, et la région ne s’en trouvera que plus prospère."
 agot_filler_westerlands.0016.a:0 "Les résultats ont dépassés mes espérances !"
 agot_filler_westerlands.0016.a_tt:0 "L’esprit a besoin de problèmes à résoudre comme l’épée d’une pierre à aiguiser."
 agot_filler_westerlands.0017.t:0 "Road Damages Worsened"
 agot_filler_westerlands.0017.desc:0 "It seems the more I have attempted to clear out the boulders, the worse the road beneath the rocks has been damaged. I am beginning to think the road will never be cleared. Is it possible for me to sneak away and never speak of this again?"
 agot_filler_westerlands.0017.a:0 "Drats!"
 agot_filler_westerlands.0017.a_tt:0 "You may have overestimated your abilities..."
 agot_filler_westerlands.0018.t:0 "Attempting to Remove the Rocks"
 agot_filler_westerlands.0018.desc:0 "I'm determined to move a large boulder that has fully blocked the road along a cliff's edge, but the more I heave the shorter my breath becomes..."
 agot_filler_westerlands.0018.a:0 "I'm feeling faint..."
 agot_filler_westerlands.0018.a_tt:0 "But how close to the cliff's edge are you standing?"
 agot_filler_westerlands.0019.t:0 "Rats! There is Only One Solution..."
 agot_filler_westerlands.0019.desc:0 "As I wake in my chambers I hear the scurrying of rats. I look around and see that I am surrounded by the disgusting rodents. They're trapping me in my own bed with their weight! Little teeth gnashing at my skin!\n\nI jolt awake! Wake up! It was all a dream! The rats... no. The rats are real. Or they may be real. They may one day be real! I must be prepared! I must be prepared for the rats! A lion! A lion is the solution! A lion will eat the rats! I must find a lion!"
 agot_filler_westerlands.0019.a:0 "I will get a lion cub to hunt rats!"
 agot_filler_westerlands.0019.a.f:0 "You will put out a call for a lion cub to be brought to you."
 agot_filler_westerlands.0019.b:0 "I will get a fully grown lion to hunt rats!"
 agot_filler_westerlands.0019.b.f:0 "You will put out a call for a fully grown lion to be brought to you."
 agot_filler_westerlands.0019.c:0 "What? No, this was just a dream."
 agot_filler_westerlands.0019.c.f:0 "You will pull yourself back together!"