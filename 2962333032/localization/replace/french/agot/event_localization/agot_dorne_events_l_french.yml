l_french:
 agot_dorne.0001.t:0 "Un serpent dans le sable"
 agot_dorne.0001.desc:0 "Il est des poisons plus doucereux que d’autres. Quiconque ayant étudié cet art subtil pourrait l’affirmer, mais je parle là non en tant qu’expert en poison, mais expert en amour. L’amour de la chair est ce qui a motivé bien des décisions dans ma vie, et alors que je flâne dans les Jardins Aquatiques, j’aperçois la sublime fille de Lord Uller.\n\nBelle, ravissante. Des courbes aussi finement dessinées que les dunes de Dorne. Ses yeux sont une invitation — ses lèvres un défi."
 agot_dorne.0001.a:0 "Voilà un poison dans lequel je tremperais volontiers mes lèvres."
 agot_dorne.0001.b:0 "Elle est ravissante… comme le sont tant de femmes de par le monde…"