 agot_sailing.5506.t:0 "L’Orque"
 agot_sailing.5506.desc:0 "Les pieds fermement ancrés sur le pont, et la main resserrée sur mon harpon, l’équipage me dévisage d’un regard empli d’appréhension.\n\nL’orque est là, rôdant près du navire sous mon regard assassin. Je brandis sa mort bien haut, me préparant à frapper.\n\n#italic Un peu plus à droite…#!"
 agot_sailing.5506.a:0 "*#high Inspirer#!*"
 agot_sailing.5506.a.success:0 "Vous tuez l’orque"
 agot_sailing.5507.t:0 "La baleine à bosse"
 agot_sailing.5507.desc:0 "Les pieds fermement ancrés sur le pont, et la main resserrée sur mon harpon, l’équipage me dévisage d’un regard empli d’appréhension.\n\nLa baleine à bosse est là, nageant près du navire sous mon regard assassin. Je brandis sa mort bien haut, me préparant à frapper.\n\n#italic Un peu plus à droite…#!"
 agot_sailing.5507.a:0 "*#high Inspirer#!*"
 agot_sailing.5507.a.success:0 "Vous tuez la baleine à bosse"
 agot_sailing.5508.t:0 "Le cachalot"
 agot_sailing.5508.desc:0 "Les pieds fermement ancrés sur le pont, et la main resserrée sur mon harpon, l’équipage me dévisage d’un regard empli d’appréhension.\n\nLe cachalot est là, fracassant la surface de toute sa masse sous mon regard assassin. Je brandis sa mort bien haut, me préparant à frapper.\n\n#italic Un peu plus à droite…#!"
 agot_sailing.5508.a:0 "*#high Inspirer#!*"
 agot_sailing.5508.a.success:0 "Vous tuez le cachalot"
 agot_sailing.5509.t:0 "La baleine bleue"
 agot_sailing.5509.desc:0 "Les pieds fermement ancrés sur le pont, et la main resserrée sur mon harpon, l’équipage me dévisage d’un regard empli d’appréhension.\n\nLa baleine bleue est là, ondulant parmi les vagues sous mon regard assassin. Je brandis sa mort bien haut, me préparant à frapper.\n\n#italic Un peu plus à droite…#!"
 agot_sailing.5509.a:0 "*#high Inspirer#!*"
 agot_sailing.5509.a.success:0 "Vous tuez la baleine bleue"
 agot_sailing.5510.t:0 "Le kraken"
 agot_sailing.5510.desc:0 "Les cris des marins sont noyés dans le hurlement de la bête, et le navire est en proie à un effroyable chaos.\n\nLes tentacules s’agrippent de toutes parts, et il n’est déjà plus question d’envisager la fuite. Les malheureux morts de peur se jettent de bon gré dans les eaux, tandis que ceux qui ont encore un semblant de bravoure empoignent tout ce qui peut trancher ou planter de sorte à mourir l’arme à la main. Les corps sont écrasés, broyés, balancés, démembrés ou désarticulés à mesure que la bête fait montre de toute sa fureur. Déjà plusieurs morts, et les harpons et les flèches continuent de s'empaler dans l’amas de chair visqueuse.\n\nJ’empoigne m[ROOT.Char.Custom('FR_OnA_signature_weapon')] et bataille contre une tentacule pour me frayer un chemin jusqu’à la tête. Jeté[ROOT.Char.Custom('FR_E')] au sol et contraint[ROOT.Char.Custom('FR_E')] de lâcher prise, je n’ai d'autre choix que de récupérer le harpon d’un bras sans corps, et espérer avoir plus de chance que son précédent propriétaire. Une occasion se présente quand je vois un œil gigantesque surgir des eaux. #high Voilà ma chance. La seule que j’aurais…#!"
 agot_sailing.5510.a:0 "Fais-moi risette, saloperie !"
 agot_sailing.5510.a.success:0 "Vous tuez le kraken"
 agot_sailing.5510.a.failure:0 "Vous ratez le point faible"
 agot_sailing.5510.b:0 "*#high Souffler dans le cor#!*"
 agot_sailing.5510.b_tt:0 "Vous soufflez dans le cor dans l’espoir de distraire le kraken"
 agot_sailing.5511.t:0 "La Terreur Blanche"
 agot_sailing.5511.desc:0 "Une nouvelle vague déferle si violemment que la coque du navire craque à l’impact. Je vais grand train de bâbord à tribord, guettant de part et d’autres pour trouver le monstre marin. Le navire essuie un nouvel impact, cette fois de la bête en personne. L’entièreté de l’équipage jetée à terre, tout le monde se relève péniblement, presque plaqué au sol par une pluie battante que l’on croirait invoquée par #high la Terreur Blanche#! elle-même.\n\nLa bête est rusée, c’est certain. Et vivace, et puissante, et tout le reste, tant et si bien que même [first_mate.GetFirstNameNoTooltip] en perd toute contenance. La bête, la bougre de bête, se joue de moi, elle s’en gausserait presque. Elle est la monstruosité sans pareille dans les mers de Westeros, et elle est là, à se pavaner, à surgir hors de l’eau et à rugir de raillerie.\n\n#italic Elle me raille. Elle me nargue. Elle me met au défi !#!"
 agot_sailing.5511.desc.a:0 "Ma main serre si violemment le harpon que j’en saignerais presque. « Cette fois tu ne m’échapperas pas ! » Lorsqu’une violente vague vient s’abattre sur le navire, nombreux parmi l’équipage tombent à la renverse, quand ils ne tombent pas tout simplement par-dessus bord, mais je tiens bon — je tiens ferme.\n\nLa détermination est mon rempart, et nul ne saurait l’ébranler ou l’effriter ! Cela dure depuis trop longtemps. Trop longtemps depuis que cette bête hante mes pensées. Trop longtemps qu’elle gangrène mes songes.\n\nLa Terreur Blanche hurle, de défi ou de raillerie, peu me chaut. Je dois l’abattre. #bold Je vais l’abattre !#!"
 agot_sailing.5511.a:0 "Voilà ta fin, maudite bestiasse[Select_CString(ROOT.Char.HasTrait( GetTrait('rude') ), ' de mes deux', '' )] !"
 agot_sailing.5511.a.success:0 "Vous tuez #high la Terreur Blanche#! !"
 agot_sailing.5511.a.failure:0 "La terreur blanche vous échappe"
 agot_sailing.5512.t:0 "Ô Terreur ennemie"
 agot_sailing.5512.desc:0 "Nous sommes encore vivants. Difficile à croire après pareille rencontre, mais c’est pourtant le cas, et la Terreur Blanche s’en est allée, s’évanouissant dans la brume.\n\nPour ce qui est de l’étendue des dégâts, après un examen sommaire je constate un mât meurtri, une coque fêlée et quelques lambeaux de tissus ici et là. Rien qu’un peu de lait de pavot ne saurait faire oublier, et pour ce qui est du navire, eh bien ma foi, nous sommes encore à flot…\n\nCette bête et moi n'en avons pas encore terminé, de cela j’en suis certain[ROOT.Char.Custom('FR_E')]. Je le sens jusque dans mes tripes. Elle patientera dans les eaux, jusqu’au jour de nos retrouvailles, comme je le ferais en scrutant l’horizon. Malgré le choc, je sens quelque chose bouillonner en moi, une vive émotion dont je ne parviens pas à en définir la nature exacte — de la fureur ou de la peur ?"
 agot_sailing.5512.a:0 "#high Ce n’est que partie remise, monstre de malheur !#!"
 agot_sailing.5512.b:0 "#weak Cet adversaire est bien plus fort que moi…#!"
 agot_sailing.5512.c:0 "Apprendre de ses erreurs, c’est la bonne chose à faire."
 agot_sailing.5600.t:0 "La traque commence"
 agot_sailing.5600.desc:0 "Une étendue de bleu à perte de vue, mais qui doit s’apparenter à un océan de possibilités pour [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))].\n\n« Tout le monde est à l’affût capitaine. Pas un aileron n’échappera à notre vigilance, » lui fait savoir [first_mate.GetFirstNameNoTooltip], en bon commandant en second qu’[first_mate.Custom('FR_IlElle')] est.\n\nLedit capitaine acquiesce, et en voyant l’étendue du terrain de chasse qui s’offre à nous, j’ai grande curiosité quant à ce que nous allons bien pouvoir attraper."
 agot_sailing.5600.a:0 "Restons vigilants !"
 agot_sailing.5601.t:0 "Une traque dûment menée"
 agot_sailing.5601.desc.a:0 "« Tortue ! Tortue à bâbord ! » alerte un membre d’équipage.\n\nJe l’aperçois : grande, verte, paisible ; une créature aussi humble qu’élégante. « Quels sont vos ordres, capitaine ? » demande le second, avant que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] ne donne l’ordre de la prendre en chasse. [host.Custom('FR_IlElle')|U] se saisit d’un harpon… ajuste sa visée… inspire un grand coup… quand finalement… #warning #italic Clac !#!#!\n\nUn jet parfaitement exécuté, et il n’en faut guère plus pour occire si frêle créature, qui finit hissée à bord, sous les yeux d’un équipage tout juste enjoué d’une si modeste prise."
 agot_sailing.5601.desc.b:0 "« Phoque ! Phoque à bâbord ! » alerte un membre d’équipage.\n\nJe l’aperçois : gris, potelé ; un animal plus agile qu’il n’y paraît. « Quels sont vos ordres, capitaine ? » demande le second, avant que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] ne donne l’ordre de le prendre en chasse. [host.Custom('FR_IlElle')|U] se saisit d’un harpon… ajuste sa visée… inspire un grand coup… quand finalement… #warning #italic Clac !#!#!\n\nUn jet parfaitement exécuté, et il n’en faut guère plus pour occire si frêle créature, qui finit hissée à bord, sous les yeux d’un équipage tout juste enjoué d’une si modeste prise."
 agot_sailing.5601.desc.c:0 "« Dauphin ! Dauphin à bâbord ! » alerte un membre d’équipage.\n\nJe l’aperçois : blanc, élancé ; une véritable beauté des mers. « Quels sont vos ordres, capitaine ? » demande le second, avant que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] ne donne l’ordre de le prendre en chasse. [host.Custom('FR_IlElle')|U] se saisit d’un harpon… ajuste sa visée… inspire un grand coup… quand finalement… #warning #italic Clac !#!#!\n\nUn jet parfaitement exécuté, et il n’en faut guère plus pour occire si frêle créature, qui finit hissée à bord, sous les yeux d’un équipage enjoué."
 agot_sailing.5601.desc.d:0 "« Morse ! Morse à bâbord ! » alerte un membre d’équipage.\n\nJe l’aperçois : massif, imposant ; un véritable colosse des mers. « Quels sont vos ordres, capitaine ? » demande le second, avant que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] ne donne l’ordre de le prendre en chasse. [host.Custom('FR_IlElle')|U] se saisit d’un harpon… ajuste sa visée… inspire un grand coup… quand finalement… #warning #italic Clac !#!#!\n\nUn jet parfaitement exécuté, et s’il en faut plus pour occire si gaillarde créature, alors un second, puis un troisième, l’achève sans plus de mal. La bête finit hissée à bord, sous les yeux d’un équipage grandement enjoué."
 agot_sailing.5601.desc.e:0 "« Orque ! Orque à bâbord ! » s’égosille une âme enthousiaste.\n\nJe l’aperçois : Imposant, tout de blanc et de noir. Une créature aussi redoutable que magnifique ; un trophée hors du commun. « Quels sont vos ordres, capitaine ? » demande le second, avant que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] ne s’exclame : « Allons chasser de l’orque ! » devant les sourires échangés de l’équipage. [host.Custom('FR_IlElle')|U] se saisit d’un harpon… ajuste sa visée… inspire un grand coup… quand finalement… #warning #italic Clac !#!#!\n\nUn jet parfaitement exécuté, qui ne suffit pourtant pas à terrasser pareille bestiasse, mais qui l’affaiblisse suffisamment pour que les tirs du reste de l’équipage en viennent à bout. La bête finit hissée à bord, sous les yeux d’un équipage qui exulte devant une telle prise."
 agot_sailing.5601.desc.f:0 "« Baleine ! Baleine à tribord ! » s’égosille une âme des plus enthousiastes.\n\nLa gigantesque créature surgit des profondeurs, propulsant un énorme jet d’eau. « Une baleine à bosse, capitaine ! Quels sont vos ordres ? » demande le second qui peine à contenir sa joie, avant que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] ne donne l’ordre de la prendre en chasse. [host.Custom('FR_IlElle')|U] se saisit d’un harpon… ajuste sa visée… inspire un grand coup… quand finalement… #warning #italic Clac !#!#!\n\nUn jet parfaitement exécuté qui termine précisément sa course dans l’œil éborgné. Il en faudrait plus pour terrasser une telle chose, et c’est précisément pour cette raison qu’une pluie de harpons se met à déferler. La lutte est terrible, la traque intense, mais tous ses efforts pour s’échapper sont vains et s’achèvent par le glas de la bête. Il ne sera pas aisé de ramener sa carcasse, mais le plus dur est fait."
 agot_sailing.5601.desc.g:0 "« Cachalot ! Cachalot à tribord ! » s’égosille une âme des plus enthousiastes.\n\nLa gigantesque créature surgit des profondeurs, propulsant un énorme jet d’eau. « Un cachalot, capitaine ! Quels sont vos ordres ? » demande le second qui peine à contenir sa joie, avant que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] ne donne l’ordre de le prendre en chasse. [host.Custom('FR_IlElle')|U] se saisit d’un harpon… ajuste sa visée… inspire un grand coup… quand finalement… #warning #italic Clac !#!#!\n\nUn jet parfaitement exécuté qui termine précisément sa course dans l’œil éborgné. Il en faudrait plus pour terrasser une telle chose, et c’est précisément pour cette raison qu’une pluie de harpons se met à déferler. La lutte est terrible, la traque intense, mais tous ses efforts pour s’échapper sont vains et s’achèvent par le glas de la bête. Il ne sera pas aisé de ramener sa carcasse, mais le plus dur est fait."
 agot_sailing.5601.desc.h:0 "« Baleine ! Baleine à tribord ! » s’égosille une âme extatique.\n\nLa gigantesque bête surgit et crache une non moins gigantesque gerbe d’eau. C’est une baleine, oui, mais point ordinaire. « Une baleine bleue, capitaine ! Quels sont vos ordres ? » demande le second qui trépigne d’impatience avec le reste de l’équipage, avant que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] ne donne l’ordre de la prendre en chasse. [host.Custom('FR_IlElle')|U] se saisit d’un harpon… ajuste sa visée… inspire un grand coup… quand finalement… #warning #italic Clac !#!#!\n\nUn jet parfaitement exécuté qui termine précisément sa course dans l’œil éborgné. Il en faudrait plus pour terrasser une telle chose, et c’est précisément pour cette raison qu’une pluie de harpons se met à déferler. La lutte est terrible, la traque intense, mais tous ses efforts pour s’échapper sont vains et s’achèvent par le glas de la bête. Il ne sera pas aisé de ramener sa carcasse, mais le plus dur est fait."
 agot_sailing.5601.desc.i:0 "« #EMP Kraken !#! » Le cri de la vigie qui semble surgir du fond de ses entrailles suffit à plonger dans un mutisme béant l’ensemble de l'équipage. Plus un bruit n’en émane. Ni pas, ni murmure, ni respiration. Les yeux sont médusés, les corps figés, et face à cette terreur, un monstre des mers qui déploie ses effroyables tentacules et laisse échapper un hurlement indicible et indescriptible.\n\n[first_mate.GetFirstNameNoTooltip] balbutie quelque chose, avant que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] ne s’exclame à cor et à cri : « Rassemblez ce qu’il vous reste de courage et préparez-vous à mourir ! »\n\nLa lutte qui s’ensuit est d’une effroyable et monstrueuse violence. Les tentacules s’agrippent de toutes parts, et il n’est déjà plus question d’envisager la fuite. Je saisis m[ROOT.Char.Custom('FR_OnA_signature_weapon')] et participe à la défense du navire, tandis que les cris des marins sont noyés dans le hurlement de la bête. Le chaos environnant m’empêche de réaliser ce qui se passe, ou combien de temps s’écoule, mais finalement, après ce qui semble être une éternité, j’entends le capitaine crier : « Fais-moi risette, saloperie ! » et enfin la bête s’écroule, libérant le navire de son étreinte…"
 agot_sailing.5601.desc.i_two:0 "« #EMP Kraken !#! » Le cri de la vigie qui semble surgir du fond de ses entrailles suffit à plonger dans un mutisme béant l’ensemble de l'équipage. Plus un bruit n’en émane. Ni pas, ni murmure, ni respiration. Les yeux sont médusés, les corps figés, et face à cette terreur, un monstre des mers qui déploie ses effroyables tentacules et laisse échapper un hurlement indicible et indescriptible.\n\n[first_mate.GetFirstNameNoTooltip] balbutie quelque chose, avant que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] ne rétorque : « C’est l’occasion ou jamais de voir si cette corne fonctionne… »\n\nSur le moment, je ne comprends pas de quelle corne il est question, mais la lutte qui s’ensuit est d’une effroyable et monstrueuse violence. Les tentacules s’agrippent de toutes parts, et il n’est déjà plus question d’envisager la fuite. Je saisis m[ROOT.Char.Custom('FR_OnA_signature_weapon')] dans l’idée de défendre moi aussi le navire, mais subitement le son d’un cor retentit sur les eaux. L’effroyable bête se fige, devenant une cible facile pour les flèches et les harpons qui la mettent à bas."
 agot_sailing.5601.desc.j:0 "« Baleine ! Baleine blanche droit devant ! » s’égosille une âme mortifiée, tandis qu’une imposante forme surgit depuis les profondeurs. De tout son poids, elle plie la surface de l’eau et le navire s’en trouve secoué et l’équipage renversé. [first_mate.GetFirstNameNoTooltip] rampe, le visage livide comme si la mort l’avait déjà emporté[first_mate.Custom('FR_E')] : « La… la Terreur Blanche, capitaine ! La Terreur Blanche ! Les légendes en parlent comme d’une monstruosité malicieuse qui hante les eaux de la Mer Grelotte ! Nombreux sont les navires à reposer dans les abysses pour s’être attirés sa fureur ! Cette bête sonne notre perte à tous ! »\n\nUne telle déclaration en ferait frémir plus d’un, mais [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] se saisit d’un harpon et déclare avec une vaillance qui frôle sans doute la démence : « Je pourfendrais cette terreur de mes mains ! »\n\nUne nouvelle vague déferle si violemment que la coque du navire craque à l’impact. Projeté[ROOT.Char.Custom('FR_E')] contre un tonneau de provision, ma vision fait tanguer le navire plus que les vagues elles-mêmes, et c’est dans ce chaos indescriptible qu’une violente lutte a lieu. J’entends un juron proféré comme un cri de guerre, puis un hurlement s’ensuit. Quand je reprends pleinement possession de mes esprits, la tant redoutée Terreur Blanche n’est déjà plus. [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))|U] a prouvé sa valeur — #italic la légende est morte, vive la légende.#!"
 agot_sailing.5601.desc.k:0 "Il règne sur ces eaux un silence très particulier. #italic Un calme qui précède une tempête#!, un calme étrangement familier, comme l’est le cri de la vigie : « Baleine ! Baleine blanche droit devant ! », comme l’est aussi la forme monstrueuse qui émerge des eaux.\n\nC'est elle : #high la Terreur Blanche !#! Le destin nous fait hommage l’un comme l’autre d’une occasion de mettre fin à notre vieille rivalité. Elle fend les eaux de sa masse monstrueuse, et elle le fait avec la même célérité que naguère. Le temps se suspend, pour nous laisser, à l’un et l’autre, ce petit moment de frisson où nous échangeons un regard vindicatif.\n\nLe bois du navire craque, mais pas moi. Je reste ferme, l’œil affuté, la main resserrée, le pied bien ancré. Le fer du harpon fuse entre mes doigts et vient percer la blanche chair. La course de la bête s’en trouve changée, et plus furieuse encore, elle repart à la charge. Un harpon après l’autre, la bête ralentit, et dans un dernier râle, elle bondit hors de l’eau, avant qu’un dernier jet ne la fasse taire. Plus qu’au silence, la légende est réduite à néant, car c’est la mienne de légende qui sera chantée dans les tavernes des ports de tout horizon."
 agot_sailing.5601.a:0 "[Select_CString(ROOT.Char.HasTrait( GetTrait('arrogant') ), 'Honnêtement, j’aurais fait mieux…', 'Joli coup !' )]"
 agot_sailing.5602.t:0 "Une traque dûment foirée"
 agot_sailing.5602.desc.a:0 "« Tortue ! Tortue à bâbord ! » alerte un membre d’équipage.\n\nJe l’aperçois : grande, verte, paisible ; une créature aussi humble qu’élégante. « Quels sont vos ordres, capitaine ? » demande le second, avant que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] ne donne l’ordre de la prendre en chasse. [host.Custom('FR_IlElle')|U] se saisit d’un harpon… ajuste sa visée… inspire un grand coup… quand finalement… #defender_color #italic Plouf !#!#!\n\n#italic Une bien belle foirade…#! et la tortue, prise de panique, disparaît dans les profondeurs maritimes…"
 agot_sailing.5602.desc.b:0 "« Phoque ! Phoque à bâbord ! » alerte un membre d’équipage.\n\nJe l’aperçois : gris, potelé ; un animal plus agile qu’il n’y paraît. « Quels sont vos ordres, capitaine ? » demande le second, avant que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] ne donne l’ordre de le prendre en chasse. [host.Custom('FR_IlElle')|U] se saisit d’un harpon… ajuste sa visée… inspire un grand coup… quand finalement… #defender_color #italic Plouf !#!#!\n\n#italic Le tir est foireux…#! et le phoque, pris de panique, disparaît dans les profondeurs maritimes…"
 agot_sailing.5602.desc.c:0 "« Dauphin ! Dauphin à bâbord ! » alerte un membre d’équipage.\n\nJe l’aperçois : blanc, élancé ; une véritable beauté des mers. « Quels sont vos ordres, capitaine ? » demande le second, avant que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] ne donne l’ordre de le prendre en chasse. [host.Custom('FR_IlElle')|U] se saisit d’un harpon… ajuste sa visée… inspire un grand coup… quand finalement… #defender_color #italic Plouf !#!#!\n\n#italic Une bien belle foirade…#! au moins aussi belle que la fuite du dauphin qui s’éclipse en un claquement de doigt…"
 agot_sailing.5602.desc.d:0 "« Morse ! Morse à bâbord ! » alerte un membre d’équipage.\n\nJe l’aperçois : massif, imposant ; un véritable colosse des mers. « Quels sont vos ordres, capitaine ? » demande le second, avant que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] ne donne l’ordre de le prendre en chasse. [host.Custom('FR_IlElle')|U] se saisit d’un harpon… ajuste sa visée… inspire un grand coup… quand finalement… #defender_color #italic Plouf !#!#!\n\nLa pointe fend l’eau au lieu de la chair, et le morse, conscient du danger, disparaît dans les profondeurs maritimes…"
 agot_sailing.5602.desc.e:0 "« Orque ! Orque à bâbord ! » s’égosille une âme enthousiaste.\n\nJe l’aperçois : Imposant, tout de blanc et de noir. Une créature aussi redoutable que magnifique ; un trophée hors du commun. « Quels sont vos ordres, capitaine ? » demande le second, avant que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] ne s’exclame : « Allons chasser de l’orque ! » devant les sourires échangés de l’équipage. [host.Custom('FR_IlElle')|U] se saisit d’un harpon… ajuste sa visée… inspire un grand coup… quand finalement… #defender_color #italic Plouf !#!#!\n\nLa pointe fend l’eau au lieu de la chair, et l’orque, conscient du danger, disparaît dans les profondeurs maritimes…"
 agot_sailing.5602.desc.f:0 "« Baleine ! Baleine à tribord ! » s’égosille une âme des plus enthousiastes.\n\nLa gigantesque créature surgit des profondeurs, propulsant un énorme jet d’eau. « Une baleine à bosse, capitaine ! Quels sont vos ordres ? » demande le second qui peine à contenir sa joie, avant que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] ne donne l’ordre de la prendre en chasse. [host.Custom('FR_IlElle')|U] se saisit d’un harpon… ajuste sa visée… inspire un grand coup… quand finalement… #defender_color #italic Plouf !#!#!\n\nLa pointe fend l’eau au lieu de la chair, et la baleine, consciente du danger, s’échappe dans les profondeurs maritimes après un violent coup de queue qui éclabousse un équipage, humilié par deux fois…"
 agot_sailing.5602.desc.g:0 "« Cachalot ! Cachalot à tribord ! » s’égosille une âme des plus enthousiastes.\n\nLa gigantesque créature surgit des profondeurs, propulsant un énorme jet d’eau. « Un cachalot, capitaine ! Quels sont vos ordres ? » demande le second qui peine à contenir sa joie, avant que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] ne donne l’ordre de le prendre en chasse. [host.Custom('FR_IlElle')|U] se saisit d’un harpon… ajuste sa visée… inspire un grand coup… quand finalement… #defender_color #italic Plouf !#!#!\n\nLa pointe fend l’eau au lieu de la chair, et le cachalot, conscient du danger, s’échappe dans les profondeurs maritimes après un violent coup de queue qui éclabousse un équipage, humilié par deux fois…"
 agot_sailing.5602.desc.h:0 "« Baleine ! Baleine à tribord ! » s’égosille une âme extatique.\n\nLa gigantesque bête surgit et crache une non moins gigantesque gerbe d’eau. C’est une baleine, oui, mais point ordinaire. « Une baleine bleue, capitaine ! Quels sont vos ordres ? » demande le second qui trépigne d’impatience avec le reste de l’équipage, avant que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] ne donne l’ordre de la prendre en chasse. [host.Custom('FR_IlElle')|U] se saisit d’un harpon… ajuste sa visée… inspire un grand coup… quand finalement… #defender_color #italic Plouf !#!#!\n\nLa pointe fend l’eau au lieu de la chair, et le cachalot, conscient du danger, s’échappe dans les profondeurs maritimes après un violent coup de queue qui éclabousse un équipage, humilié par deux fois…"
 agot_sailing.5602.desc.i:0 "« #EMP Kraken !#! » Le cri de la vigie qui semble surgir du fond de ses entrailles suffit à plonger dans un mutisme béant l’ensemble de l'équipage. Plus un bruit n’en émane. Ni pas, ni murmure, ni respiration. Les yeux sont médusés, les corps figés, et face à cette terreur, un monstre des mers qui déploie ses effroyables tentacules et laisse échapper un hurlement indicible et indescriptible.\n\n[first_mate.GetFirstNameNoTooltip] balbutie quelque chose, avant que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] ne s’exclame à cor et à cri : « Rassemblez ce qu’il vous reste de courage et préparez-vous à mourir ! »\n\nLa lutte qui s’ensuit est d’une effroyable et monstrueuse violence. Les tentacules s’agrippent de toutes parts, et il n’est déjà plus question d’envisager la fuite. Je saisis m[ROOT.Char.Custom('FR_OnA_signature_weapon')] et participe à la défense du navire, tandis que les cris des marins sont noyés dans le hurlement de la bête. Mais toute bravoure que nous pouvons conjurer contre la bête ne la terrasse en rien, et après maintes et maintes morts, la bête nous délivre de ce cauchemar en se retirant dans les eaux, rassasiée de viande ou de violence.\n\n#italic Oserais-je parler de chance en voyant l’entièreté du pont souillé du sang de l’équipage ?#!"
 agot_sailing.5602.desc.i_two:0 "« #EMP Kraken !#! » Le cri de la vigie qui semble surgir du fond de ses entrailles suffit à plonger dans un mutisme béant l’ensemble de l'équipage. Plus un bruit n’en émane. Ni pas, ni murmure, ni respiration. Les yeux sont médusés, les corps figés, et face à cette terreur, un monstre des mers qui déploie ses effroyables tentacules et laisse échapper un hurlement indicible et indescriptible.\n\n[first_mate.GetFirstNameNoTooltip] balbutie quelque chose, avant que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] ne rétorque : « C’est l’occasion ou jamais de voir si cette corne fonctionne… »\n\nSur le moment, je ne comprends pas de quelle corne il est question, mais la lutte qui s’ensuit est d’une effroyable et monstrueuse violence. Les tentacules s’agrippent de toutes parts, et il n’est déjà plus question d’envisager la fuite. Je saisis m[ROOT.Char.Custom('FR_OnA_signature_weapon')] dans l’idée de défendre moi aussi le navire, mais subitement le son d’un cor retentit sur les eaux. L’effroyable bête se fige, mais un instant seulement. Nul ne peut en venir à bout, et après maintes et maintes morts, la bête nous délivre de ce cauchemar en se retirant dans les eaux, rassasiée de viande ou de violence."
 agot_sailing.5602.desc.j:0 "« Baleine ! Baleine blanche droit devant ! » s’égosille une âme mortifiée, tandis qu’une imposante forme surgit depuis les profondeurs. De tout son poids, elle plie la surface de l’eau et le navire s’en trouve secoué et l’équipage renversé. [first_mate.GetFirstNameNoTooltip] rampe, le visage livide comme si la mort l’avait déjà emporté[first_mate.Custom('FR_E')] : « La… la Terreur Blanche, capitaine ! La Terreur Blanche ! Les légendes en parlent comme d’une monstruosité malicieuse qui hante les eaux de la Mer Grelotte ! Nombreux sont les navires à reposer dans les abysses pour s’être attirés sa fureur ! Cette bête sonne notre perte à tous ! »\n\nUne telle déclaration en ferait frémir plus d’un, mais [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] se saisit d’un harpon et déclare avec une vaillance qui frôle sans doute la démence : « Je pourfendrais cette terreur de mes mains ! »\n\nUne nouvelle vague déferle si violemment que la coque du navire craque à l’impact. Projeté[ROOT.Char.Custom('FR_E')] contre un tonneau de provision, ma vision fait tanguer le navire plus que les vagues elles-mêmes, et c’est dans ce chaos indescriptible qu’une violente lutte a lieu. Quand je reprends pleinement possession de mes esprits, la bien nommée #high Terreur Blanche#! pousse un hurlement qui résonne au plus profond de ma chair.\n\nLa bête s’en va, mais l’effroi qu’elle a instillé en moi ne saurait s’évanouir aussi aisément…"
 agot_sailing.5602.desc.k:0 "Il règne sur ces eaux un silence très particulier. #italic Un calme qui précède une tempête#!, un calme étrangement familier, comme l’est le cri de la vigie : « Baleine ! Baleine blanche droit devant ! », comme l’est aussi la forme monstrueuse qui émerge des eaux.\n\nC'est elle : #high la Terreur Blanche !#! Le destin nous fait hommage l’un comme l’autre d’une occasion de mettre fin à notre vieille rivalité. Elle fend les eaux de sa masse monstrueuse, et elle le fait avec la même célérité que naguère. Le temps se suspend, pour nous laisser, à l’un et l’autre, ce petit moment de frisson où nous échangeons un regard vindicatif.\n\nLe bois du navire craque, et mon esprit avec lui. Je m'efforce de rester ferme, l’œil affuté, la main resserrée, le pied bien ancré, mais la terreur m'envahit. Le fer du harpon fuse entre mes doigts, mais plutôt que de la transpercer, elle glisse le long de la chair. Un énorme tronçon du navire vole en éclat à l’impact de la bête, projetant une moitié d’équipage au sol, et l’autre moitié par dessus bord. La bête pousse un hurlement triomphal teinté de raillerie, avant de s’évanouir dans les eaux, laissant ma chair, mes os et mes tripes continuer à trembler longtemps après sa disparition…"
 agot_sailing.5602.a:0 "[ROOT.Char.Custom('CulturalCurse')|U]…"
 agot_sailing.5603.t:0 "La Terreur Blanche"
 agot_sailing.5603.desc:0 "La mer est empreinte d’une quiétude presque surnaturelle. Ni l’eau ni le vent ne semble désireux de nous nuire en ce jour, et c’est dans cette sérénité absolue que quelque chose d’anormalement gigantesque émerge. Cela prend d’abord les traits d'une tâche blanche grandissante, puis la forme d'une baleine massive qui secoue le navire par la simple force des eaux qu’elle déplace.\n\n« La… #high la Terreur Blanche#!, capitaine ! #high La Terreur Blanche !#! balbutie [first_mate.GetFirstNameNoTooltip]. Les légendes en parlent comme d’une monstruosité malicieuse qui hante ces eaux ! Nombreux sont les navires à reposer dans les abysses pour s’être attirés sa fureur ! Cette bête sonne notre perte à tous ! »\n\nMais aujourd’hui la légende prend vie sous une apparence plus paisible que monstrueuse. La bête n’a nulle hostilité à notre égard, juste de la curiosité, non de celle qui caractérise un prédateur, mais plutôt un esprit espiègle, l’amenant à tourner autour du navire. La grâce avec laquelle elle nage semble faire mentir l’image horrifique que lui prête les fables rabâchées sans discontinuer par [first_mate.GetFirstNameNoTooltip]. Puis, la bête s’en va, après avoir projeté haut dans les airs une énorme gerbe d’eau en guise d’adieu."
 agot_sailing.5603.a:0 "Je n’en crois pas mes yeux !"
 agot_sailing.6000.toast:0 "Une carte au trésor a été trouvée lors du siège !"
 agot_sailing.6000.toast_desc:0 "Elle indique [sunken_ship_province.GetName] comme lieu où repose l’épave d'un navire marchand perdu."
 agot_sailing.6001.t:0 "En quête de l’épave"
 agot_sailing.6001.desc:0 "« Nous y sommes ! » j’affirme haut et fort carte en main pour m’en assurer avec certitude, tandis que le navire progresse à faible allure tout du long de la côte.\n\nSur ordre de [first_mate.GetFirstNameNoTooltip], l’équipage se met sur le qui-vive, scrutant avec attention les alentours à la recherche du moindre signe de l’épave qui devrait se trouver tout près d’ici. Dans un même temps, la cloche de plongée est préparée en prévision de pouvoir remplir son office.\n\nMe questionnant à propos des richesses qui pourraient bien être miennes d’ici peu, je ne peux m’empêcher de consulter encore et encore la même carte…"
 agot_sailing.6001.a:0 "Ouvrez l’œil et le bon !"
 agot_sailing.6001.a.success.tt:0 "Vous trouvez des signes de l’épave"
 agot_sailing.6001.a.failure.tt:0 "Vous ne trouvez aucune trace de l’épave"
 agot_sailing.6002.t:0 "Épave en vue !"
 agot_sailing.6002.desc:0 "« [ROOT.Char.Custom('FormOfAddressForLiege')|U] ! »\n\nAlerté[ROOT.Char.Custom('FR_E')] par l’appel de [first_mate.GetNameNoTooltip], je me hâte à ses côtés, scrutant les eaux alentours pour espérer trouver ce pourquoi nous avons tant voyagé.\n\nMes yeux s’illuminent en voyant, même indistinctement, l’épave qui gît ci-dessous. À vrai dire, plus qu’une épave, c’est la promesse de moult richesses, mais encore faut-il pouvoir l’atteindre…"
 agot_sailing.6002.a:0 "Le moment est venu de se mouiller."
 agot_sailing.6002.b:0 "L’endroit me semble bien trop dangereux…"
 agot_sailing.6003.t:0 "Plonger dans les profondeurs"
 agot_sailing.6003.desc:0 "La cloche descend petit à petit, et moi avec elle, la silhouette de l’épave s’affinant à mesure que je m’enfonce dans les profondeurs marines.\n\nLe navire repose tout au fond, là où la lumière perce plus difficilement les eaux, et les débris éparpillés aux quatre coins témoignent de la tragédie qui l’aura condamné à ce funeste sort.\n\n[Select_CString(ROOT.Char.HasTrait( GetTrait('compassionate') ), 'Une tragédie c’est certain, mais verser des larmes ne ramènera pas les pauvres âmes qui se sont échouées ici', 'Ma foi, le malheur des uns fait le bonheur des autres' )], et même si je n’ai pour le moment aucune idée de ce que je vais pouvoir y trouver — dangers comme trésors — l’excitation me rend déjà bien fébrile…"
 agot_sailing.6003.a:0 "Voyons ce qui se cache là-dedans !"
 agot_sailing.6004.t:0 "Un havre parmi les eaux"
 agot_sailing.6004.desc:0 "Il règne autour de l’épave une quiétude comme il m'’a rarement été donné d’en être témoin. Tout juste quelques poissons perturbent paisiblement ces eaux d’un calme parfait, et les maigres jets de lumière font baigner les lieux dans une clarté apaisante.\n\nLe calme avant la tempête ? C’est ma première pensée lorsque j’entends subitement un son bien singulier, mais il n’en est rien. Cet écho lointain, c’est le chant majestueux d’une gigantesque mais magnifique baleine blanche, laquelle semble dissuader tout prédateur de s’aventurer dans les environs. C’est un spectacle magnifique qui s’offre à moi, et dès lors je réfléchis : #italic ne serait-ce finalement pas ça le plus beau des trésors ?#!\n\nLa réponse est aussi prompte que la réflexion est fugace : #high bien évidemment que non.#!"
 agot_sailing.6004.a:0 "Voyons ce que recèle cette épave."
 agot_sailing.6005.t:0 "Des dents dans la mer"
 agot_sailing.6005.desc:0 "En approchant plus près de l’épave, je remarque quelques formes menaçantes qui rôdent autour : #warning des requins !#!\n\nLes eaux sont leur domaine, non le mien, si je souhaite mettre la main sur le trésor qui se cache ici, je n’ai d'autres choix que de me frayer un passage en force ou d’essayer de me faufiler à leur insu. Dans le pire des cas, je pourrais aussi bien abandonner et m’épargner de finir taillé[ROOT.Char.Custom('FR_E')] en pièces."
 agot_sailing.6005.a:0 "Quand faut y aller, faut y aller !"
 agot_sailing.6005.a.success:0 "Vous parvenez à passer en force"
 agot_sailing.6005.toast.a.success:0 "Vous atteignez le trésor au nez et à la barbe des requins"
 agot_sailing.6005.a.failure:0 "Les requins vous bloquent le passage"
 agot_sailing.6005.toast.a.failure:0 "Vous êtes obligé[THIS.Char.Custom('FR_le_Char_Pi')] de fuir pour ne pas finir en pâture pour requin"
 agot_sailing.6005.b:0 "Mieux vaut tenter la discrétion."
 agot_sailing.6005.b.success:0 "Vous vous faufilez jusqu’à l’épave"
 agot_sailing.6005.toast.b.success:0 "Vous atteignez le trésor sans qu’aucun requin ne remarque votre présence"
 agot_sailing.6005.b.failure:0 "Vous manquez de discrétion"
 agot_sailing.6005.toast.b.failure:0 "Les requins vous forcent à décamper"
 agot_sailing.6005.c:0 "C’est bien trop dangereux !"
 agot_sailing.6006.t:0 "Le choc des titans"
 agot_sailing.6006.desc:0 "Il est rare de voir pareil cauchemar de ses yeux éveillés…\n\nDeux gigantesques créatures s’affrontent dans les abîmes. Leurs formes est rendues indistinctes par la quantité de sables qu’ils soulèvent, néanmoins, d’après la silhouette tentaculaire de l’une, et fusiforme de l’autre, cela me semble être un duel à mort entre un kraken et une baleine. Mais je doute qu’une simple baleine pourrait donner tant de mal à un tel monstre : un léviathan serait plus probable. C'est là un véritable combat de titan.\n\nLa force qu’ils déploient l’un et l’autre est si violente que l’eau en est secouée à chaque impact. Leur attention est trop accaparée pour se soucier du menu fretin que je suis très probablement à leurs yeux, mais si par malchance je venais à être pris[ROOT.Char.Custom('FR_E')] entre les deux, je ne donnerais pas cher de ma peau. Pourtant, si je souhaite atteindre l’épave, il va me falloir prendre ce risque…"
 agot_sailing.6006.a:0 "C’est un risque à prendre !"
 agot_sailing.6006.a.success:0 "Vous parvenez à ramener le trésor sans encombre"
 agot_sailing.6006.toast.a.success:0 "Le trésor est vôtre !"
 agot_sailing.6006.a.failure:0 "Vous vous retrouvez au milieu d’un combat titanesque"
 agot_sailing.6006.toast.a.failure:0 "Vous n’en ressortez pas indemne"
 agot_sailing.6006.b:0 "Au diable le trésor, ma vie est plus précieuse que ça !"
 death_by_kraken:0 "@death_icon! Vous finissez écrasé[THIS.Char.Custom('FR_E')] par le kraken"
 agot_sailing.6007.t:0 "Sans un sou vaillant"
 agot_sailing.6007.desc:0 "Les eaux sont scrutées par des dizaines de paires d’yeux avides des richesses qui reposent en leur sein, chacune se figurant sa propre idée de la fortune qui nous attend, et après moult rêveries et fantasmes, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] se décide à nous délivrer de cette attente interminable, mais hélas, sa délivrance se fait dans une amère déception.\n\nLe capitaine n’a pas la moindre once de richesse en main, laissant son équipage assoiffé de richesse dépérir de déshydratation. Cette chasse au trésor n’aura été qu’une perte sèche de temps et d’efforts…"
 agot_sailing.6007.a:0 "Rentrons…"
 agot_sailing.6010.t:0 "Le retour du capitaine"
 agot_sailing.6010.desc_big:0 "Les eaux sont scrutées par des dizaines de paires d’yeux avides des richesses qui reposent en leur sein, chacune se figurant sa propre idée de la fortune qui nous attend, et après moult rêveries et fantasmes, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] se décide à nous délivrer de cette attente interminable.\n\nSous un tonnerre d’exultation et d’acclamations, le capitaine ramène à bord un fort pesant coffre, qui malgré toute son opiniâtreté à refuser de s’ouvrir, cède face à l’engouement de l’équipage et dévoile une fortune qui rayonne de mille éclats comme rarement [Select_CString(ROOT.Char.IsFemale,'une femme','un homme')] a l’occasion d’en voir dans sa terne existence.\n\n« Mes amis… #bold nous sommes riches !#! » clame [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] avec un enthousiasme endiablé."
 agot_sailing.6010.desc_normal:0 "Les eaux sont scrutées par des dizaines de paires d’yeux avides des richesses qui reposent en leur sein, chacune se figurant sa propre idée de la fortune qui nous attend, et après moult rêveries et fantasmes, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] se décide à nous délivrer de cette attente interminable.\n\nSous un tonnerre d’exultation et d’acclamations, le capitaine ramène à bord un pesant coffre, qui malgré toute son opiniâtreté à refuser de s’ouvrir, cède face à l’engouement de l’équipage et dévoile un très joli pactole.\n\n« Mes amis… #bold nous sommes riches !#! » se gargarise [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] avec force entrain."
 agot_sailing.6010.desc_small:0 "Les eaux sont scrutées par des dizaines de paires d’yeux avides des richesses qui reposent en leur sein, chacune se figurant sa propre idée de la fortune qui nous attend, et après moult rêveries et fantasmes, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] se décide à nous délivrer de cette attente interminable.\n\nSous un tonnerre d’exultation et d’acclamations, le capitaine ramène à bord un coffre, qui malgré toute son opiniâtreté à refuser de s’ouvrir, cède face à l’engouement de l’équipage et dévoile la fortune qui nous sourit d’un jaune éclatant.\n\n« Mes amis… #bold nous sommes riches !#! »"
 agot_sailing.6010.desc:0 "Les eaux sont scrutées par des dizaines de paires d’yeux avides des richesses qui reposent en leur sein, chacune se figurant sa propre idée de la fortune qui nous attend, et après moult rêveries et fantasmes, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] se décide à nous délivrer de cette attente interminable, mais hélas, sa délivrance se fait dans une amère déception.\n\nLe capitaine n’a pas la moindre once de richesse en main, laissant son équipage assoiffé de richesse dépérir de déshydratation. Cette chasse au trésor n’aura été qu’une perte sèche de temps et d’efforts…"
 agot_sailing.6010.a:0 "Il est temps de rentrer."
 agot_sailing.6012.t:0 "Sans un sou vaillant"
 agot_sailing.6012.desc:0 "Me revoilà de retour sur le pont du navire, [Select_CString(ROOT.Char.IsFemale,'saine et sauve','sain et sauf')], certes, mais sans le moindre sou vaillant.\n\nTant d’efforts pour rien, un bien beau gâchis de temps que ce voyage — sans oublier le camouflet que représente un tel échec…\n\n« [ROOT.Char.Custom('CulturalCurse')|U] ! »"
 agot_sailing.6012.a:0 "Rentrons…"
 agot_sailing.6013.t:0 "Épave en vue !"
 agot_sailing.6013.desc:0 "« [host.Custom('FormOfAddressForLiege')|U] ! »\n\nAlerté[host.Custom('FR_E')] par l’appel de [first_mate.GetNameNoTooltip], [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] se hâte à ses côtés, scrutant les eaux alentours. \n\nCherchant avec le reste de l’équipage le motif de notre voyage, mes yeux s’illuminent lorsque je vois, même indistinctement, l’épave qui gît ci-dessous. À vrai dire, plus qu’une épave, c’est la promesse de moult richesses, mais encore faut-il pouvoir l’atteindre…"
 agot_sailing.6013.a:0 "Tout repose sur notre capitaine désormais."
 agot_sailing.6014.t:0 "Une chasse réussie"
 agot_sailing.6014.desc:0 "De retour sur le pont du navire, des mines d’exultation et de promptes acclamations ajoutent toujours plus de satisfaction au plaisir d’avoir mis la main sur un trésor.\n\nMalgré la rouille qui le recouvre, le coffre fait preuve d’une certaine opiniâtreté à refuser de s’ouvrir, mais bien vite il capitule et dévoile son contenu.\n\n« Mes amis… #bold nous sommes riches !#! »"
 agot_sailing.6014.vermax_skull:0 "\nMais plus que ce coffre, au fond des eaux reposait depuis longtemps les restes de [GetScriptedCharacterByHistoryID('dragon_vermax').GetName]. Sa disparition remonte à la Danse des Dragons, lorsqu’il aurait, selon toute vraisemblance, connu une fin tragique dans le Gosier. C’est pour le moins une trouvaille inespérée."
 agot_sailing.6014.a:0 "Rentrons fêter ça !"
 agot_sailing.6014.a_generic_artifact:0 "#V Vous#! obtenez : [generic_artifact.GetNameNoTooltip]"
 agot_sailing.6014.a_valyrian_steel_sword:0 "#V Vous#! obtenez : [valyrian_steel_sword.GetNameNoTooltip]"
 agot_sailing.6014.a_spare:0 "#V Vous#! obtenez : [spare.GetNameNoTooltip]"
 found_new_map:0 "Vous trouvez une nouvelle carte au trésor"
 agot_sailing.9001.t:0 "L’odyssée s’achève"
 agot_sailing.9001.desc:0 "Ainsi s’achève mon glorieux périple en mer, par un humble pas qui me ramène sur la terre ferme.\n\nJ’aimerais continuer à voguer, continuer à m’enorgueillir d'un sentiment d’accomplissement, mais pour l'heure j’ai d'autres devoirs qui requièrent ma présence…"
 agot_sailing.9001.a:0 "…En attendant de retourner dans les contrées d’azur."
 agot_sailing.9002.t:0 "L’odyssée s’achève"
 agot_sailing.9002.desc:0 "Ainsi s’achève mon piètre périple en mer, par un réconfortant retour sur la terre ferme.\n\nMalgré tous ces déboires, je sais que l’envie de voguer à nouveau me reviendra, mais j’ai pour l’heure d’autres devoirs qui requièrent ma présence…"
 agot_sailing.9002.a:0 "…En attendant de retourner dans les contrées d’azur."
 agot_sailing.9100.t:0 "Les préparatifs"
 agot_sailing.9100.desc:0 "C’est avec grande célérité que j’arrive sur les quais, comme porté[ROOT.Char.Custom('FR_E')] par le vent lui-même, transporté[ROOT.Char.Custom('FR_E')] par le souffle de l’aventure. La mer m’attend, et je me fais fort de lui être agréable en récompensant sa patience.\n\nLe pied à peine posé sur le navire, et déjà [first_mate.GetFirstNameNoTooltip] annonce mon arrivée : « Capitaine sur le pont ! » L’équipage cesse toute activité pour former deux lignes parallèles entre lesquelles j’avance, jugeant et jaugeant chacun des braves comparses qui bientôt feront couler le sang pour que l’or coule à flot.\n\n« Tout le monde est prêt et attend de savoir quel sera notre cible » me fait savoir mon second[Select_CString(first_mate.HasTrait( GetTrait('compassionate') ), '', ', avec une pointe d’exultation' )]."
 agot_sailing.9100.a:0 "Direction les côtes !"
 agot_sailing.9100.b:0 "Nous pillerons en haute mer !"
 agot_sailing.9110.t:0 "Le choix de la cible"
 agot_sailing.9110.desc:0 "Les officiers et moi-même rassemblés, la carte étalée devant eux fait miroiter dans leurs prunelles l’avidité pour les richesses qui nous attendent — mais la question demeure de savoir où nous irons #italic prendre#! ces richesses.\n\nLa réponse est au cœur de la discussion qui se tient depuis maintenant une heure. Une joute oratoire où chacun y va de son beau mot ou de sa grande gueule pour convaincre les autres du lieu où la fortune nous sourira. Une heure de trop, m’est avis, car la joute est un sport pour gens courtois. Une pratique pleine d’afféterie qui vise à lutter sans blesser. Mais nous autres, nous ne sommes pas ici pour nous draper dans la courtoisie. Nous sommes des pillards, la brutalité est notre langue :\n\n« [Select_CString(ROOT.Char.HasTrait( GetTrait('rude') ), 'Vos gueules', 'Silence' )] ! » j’assène en frappant la table de mon gobelet pour annoncer le glas des débats stériles. Plus personne ne pipe mot, mis à part [first_mate.GetFirstNameNoTooltip] qui pose #bold la#! question qui brûle sur toutes les lèvres :\n« Où allons-nous capitaine ? »"
 agot_sailing.9110.a:0 "[piracy_destination_1.GetName] !"
 agot_sailing.9110.b:0 "[piracy_destination_2.GetName] !"
 agot_sailing.9110.c:0 "[piracy_destination_3.GetName] !"
 agot_sailing.9110.d:0 "Il n’y a malheureusement rien d’intéressant à piller."
 agot_sailing.9111.t:0 "Patrouille en vue !"
 agot_sailing.9111.desc:0 "Nous cinglons vers la promesse de richesse, et les voiles gonflées par le vent, comme l’équipage par l'appât du gain, nous y amènent prestement. Mais comme pour rappeler que sur la mer, le destin est aussi changeant que les marées, le nid-de-pie s’égosille : « Patrouille droit devant ! »\n\nUn navire chargé de marins armés se profile sur les eaux, et ni une ni deux, [first_mate.GetFirstNameNoTooltip] en appelle à mon jugement : attaquer de front ; manœuvrer pour contourner ; ou faire demi-tour et rentrer au port —\n« Vos ordres capitaine ? »"
 agot_sailing.9111.a:0 "Fracassez-moi ces marins d’eau douce !"
 agot_sailing.9111.a.success:0 "Vous coulez le navire ennemi"
 agot_sailing.9111.a.failure:0 "La bataille endommage votre navire, mais vous parvenez à rentrer au bercail"
 agot_sailing.9111.toast.a.success:0 "Patrouille éliminée !"
 agot_sailing.9111.toast.a.failure:0 "Navire endommagé !"
 agot_sailing.9111.c:0 "Le vent joue en notre faveur, tentons de les contourner."
 agot_sailing.9111.c.success:0 "Vous échappez à la patrouille"
 agot_sailing.9111.c.failure:0 "La patrouille endommage votre navire et vous contraint à battre en retraite"
 agot_sailing.9111.toast.c.success:0 "Patrouille évitée !"
 agot_sailing.9111.toast.c.failure:0 "Vous sonnez la retraite !"
 agot_sailing.9111.e:0 "[ROOT.Char.Custom('CulturalCurse')|U] ! Virez de bord !"
 agot_sailing.9114.t:0 "Le pillage"
 agot_sailing.9114.desc:0 "La côte se dessine, et avec elle, #italic une promesse#!, #high la promesse…#!\n\nL’équipage se précipite sur le pont, et les mouettes qui tournoient autour du mât pleurent, elles pleurent à grand cri pour les malheureux qui bientôt, délestés de leur or, n’auront plus que leurs yeux.\n\nReste, comme bien souvent, à prendre une décision sur la meilleure façon d’agir. Comment frapper au mieux [selected_piracy_destination.GetName] ?"
 agot_sailing.9114.a:0 "Sapons la production !"
 agot_sailing.9114.a.success:0 "[selected_piracy_destination.GetName] verra son niveau de [development|El] réduit et sa [garrison|El] affaiblie"
 agot_sailing.9114.a.failure:0 "Vous avez été blessé[ROOT.Char.Custom('FR_E')] par les gardes"
 agot_sailing.9114.toast.a.success:0 "Province sabotée !"
 agot_sailing.9114.toast.a.failure:0 "Le sabotage a échoué !"
 agot_sailing.9114.b:0 "Nous sommes ici pour piller, alors pillons !"
 agot_sailing.9114.b.success:0 "Vous pillez [selected_piracy_destination.GetNameNoTooltip]"
 agot_sailing.9114.b.failure:0 "Vous avez été blessé[ROOT.Char.Custom('FR_E')] par les gardes"
 agot_sailing.9114.toast.b.success:0 "Province pillée !"
 agot_sailing.9114.toast.b.failure:0 "Pillage réussi !"
 agot_sailing.9114.c:0 "Notre cible c'est [selected_piracy_destination_baron.Custom('FR_le_Char_Pi')|U][selected_piracy_destination_baron.GetTitledFirstName] !"
 agot_sailing.9114.c.success:0 "Vous blessez [selected_piracy_destination_baron.Custom('FR_le_Char_Pi')][selected_piracy_destination_baron.GetTitledFirstNameNoTooltip]"
 agot_sailing.9114.c.failure:0 "Vous êtes blessé[ROOT.Char.Custom('FR_E')] par [selected_piracy_destination_baron.Custom('FR_le_Char_Pi')][selected_piracy_destination_baron.GetTitledFirstNameNoTooltip]"
 agot_sailing.9114.toast.c.success:0 "Vous remportez le duel !"
 agot_sailing.9114.toast.c.failure:0 "Vous perdez le duel !"
 agot_sailing.9114.d:0 "Allons mettre la main sur la populace !"
 agot_sailing.9114.d.success:0 "Vous enlevez quelqu’un de la roture"
 agot_sailing.9114.d.failure:0 "Vous êtes blessé[ROOT.Char.Custom('FR_E')] par les gardes"
 agot_sailing.9114.toast.d.success:0 "Vous avez capturé quelqu’un !"
 agot_sailing.9114.toast.d.failure:0 "Votre tentative d’enlèvement a échoué !"
 agot_sailing.9114.e:0 "C’est trop dangereux… Virez de bord !"
 agot_sailing.9120.t:0 "Le navire marchand"
 agot_sailing.9120.desc:0 "La fortune nous sourit-elle ? C’est la question que je me pose lorsque je constate un temps clément, un vent favorable, mais aucun navire en vue depuis voilà quelques jours. L’équipage s’impatiente, et les chants enthousiastes des premiers jours ont maintenant laissé place à des grognements maussades. L’équipage a faim. Il ne peut se sustenter de simples mets. L’équipage a faim et il réclame de l’or et du sang.\n\n« Navire à tribord ! » entends-je venir du très haut perché nid-de-pie, pour ainsi silencier les maugréments croissants. Prise en chasse, la proie grossit à mesure que nous nous rapprochons. Une imposante cogue, laquelle j’imagine, pesante de marchandises. « Une belle prise que voilà, n’est-ce pas capitaine ? » S’il eût été possible de se lécher les babines pour de l’or, [first_mate.GetFirstNameNoTooltip] l’aurait fait."
 agot_sailing.9120.a:0 "Pour sûr ! Préparez-vous, tas de canailles !"
 agot_sailing.9120.a.success:0 "Vous pillez le navire marchand !"
 agot_sailing.9120.toast.a.success:0 "Navire marchand pillé !"
 agot_sailing.9120.a.failure:0 "Vous êtes mis[THIS.Char.Custom('FR_E')] en déroute par les défenses du navire"
 agot_sailing.9120.toast.a.failure:0 "L’attaque a échoué !"
 agot_sailing.9120.c:0 "D’autant plus belle que nous allons nous en emparer."
 agot_sailing.9120.c.success:0 "Vous capturez le navire et le ramenez à votre capitale"
 agot_sailing.9120.toast.c.success:0 "Navire marchand capturé !"
 agot_sailing.9120.c.failure:0 "Vous êtes mis[THIS.Char.Custom('FR_E')] en déroute par les défenses du navire"
 agot_sailing.9120.toast.c.failure:0 "La capture a échoué !"
 agot_sailing.9120.e:0 "Je crains le pire. Virez de bord !"
 agot_sailing.9130.t:0 "À pillard, pillard et demi"
 agot_sailing.9130.desc:0 "Voguant toutes voiles dehors pour [selected_piracy_destination.GetNameNoTooltip], un cri retentit alors que nous en sommes encore bien loin, annonçant l’arrivée d'un navire. Tout l’équipage pointe son attention sur l’horizon, les sourires d’avidité se multipliant petit à petit, puis, après un certain suspens, la silhouette révèle sa vraie nature :\n\n« Pirates, capitaine ! Des pirates ! »\n\nLoin d’être le menu fretin que certains semblaient s’imaginer, un navire pirate promet aussi bien de grandes richesses qu’une rude bataille, mais après tout, la fortune sourit aux audacieux, n’est-ce pas ?"
 agot_sailing.9130.a:0 "Préparez-vous au combat !"
 agot_sailing.9130.a.success:0 "Vous mettez la main sur l’or des pirates"
 agot_sailing.9130.toast.a.success:0 "Navire pirate pillé !"
 agot_sailing.9130.a.failure:0 "Vous êtes mis[THIS.Char.Custom('FR_E')] en déroute par l’équipage adverse"
 agot_sailing.9130.toast.a.failure:0 "Navire endommagé !"
 agot_sailing.9130.c:0 "Nous allons régler ça à l’ancienne, juste moi et leur capitaine !"
 agot_sailing.9130.c.success:0 "Vous gagnez le duel contre [dueled_pirate.Custom('FR_le_Char')][dueled_pirate.GetName] et décidez de son sort"
 agot_sailing.9130.toast.c.success:0 "Vous lui faites mordre la poussière"
 agot_sailing.9130.c.failure:0 "Vous perdez le duel"
 agot_sailing.9130.toast.c.failure:0 "Vous mordez la poussière !"
 agot_sailing.9130.d:0 "Ce jour ne sera pas celui de l’audace. Virez de bord !"
 agot_sailing.9131.t:0 "La sentence"
 agot_sailing.9131.desc:0 "« Voilà ce que j’appelle une victoire à la [ROOT.Char.GetCulture.GetNameNoTooltip] ! » Raillerie en bouche, la victoire a un goût tout particulier, tandis que m[ROOT.Char.Custom('FR_OnA_signature_weapon')] se trouve bien en évidence au-dessus de la tête de [dueled_pirate.GetFirstName].\n\nTout le monde a les yeux rivés sur nous, mon équipage autant que le sien, et l’attente pour [dueled_pirate.Custom('FR_CeluiCelle')] qui gît vaincu[dueled_pirate.Custom('FR_E')] face au vainqueur lui est si insupportable qu’[dueled_pirate.Custom('FR_IlElle')] rompt le silence qui s'était installé depuis quelques longues minutes : « Ayez pitié… »"
 agot_sailing.9131.a:0 "Mettez-[dueled_pirate.Custom('FR_LeLa')] aux fers !"
 agot_sailing.9131.b:0 "La mer n’a nul besoin de faibles dans ton genre !"
 agot_sailing.9131.c:0 "Bien combattu [dueled_pirate.Custom('InsultNoun')] ! Dorénavant, tu combattras pour moi."
 agot_sailing.9131.toast.c.success:0 "[dueled_pirate.GetFirstNameNoTooltip] rejoint votre équipage"
 agot_sailing.9131.d:0 "Vous autres là ! N’avez-vous point envie de servir un capitaine digne de ce nom ?"
 agot_sailing.9131.d.success:0 "Vous persuadez l’équipage de [dueled_pirate.GetFirstNameNoTooltip] de vous rejoindre"
 agot_sailing.9131.toast.d.success:0 "Équipage recruté !"
 agot_sailing.9131.d.failure:0 "Vous ne parvenez pas à être suffisamment convaincant[THIS.Char.Custom('FR_E')]…"
 agot_sailing.9131.toast.d.failure:0 "L’équipage vous envoie chier"
 agot_sailing.9131.e:0 "Tu es en veine, c’est mon jour de bonté."
 agot_sailing.9131.toast.e.success:0 "Vous laissez [dueled_pirate.GetFirstNameNoTooltip] repartir"
 agot_sailing.9140.t:0 "Un butin peut en cacher un autre"
 agot_sailing.9140.desc:0 "La curiosité m’amène à retourner sens dessus dessous la cabine du capitaine vaincu, laquelle ne semble au premier abord contenir qu’une multitude de choses somme toute insignifiantes. Mais au premier abord seulement, car la fortune me souriant, je tombe par inadvertance sur quelque chose d’infiniment plus précieux que tout le reste :\n\n« Une carte au trésor ! »\n\nC’est là une très jolie trouvaille, car si j’en crois ce qui est écrit, elle pourrait mener à un navire échoué rempli de richesses. Quoi qu’il en soit, pour mener à bien une telle entreprise, une cloche de plongée sera nécessaire."
 agot_sailing.9140.a:0 "Magnifique !"
 agot_sailing.9150.t:0 "N’est pas pillard qui veut"
 agot_sailing.9150.desc:0 "Bien des efforts ont été faits pour mener à bien un pillage, mais aucun n'a été fructueux.\n\n[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))|U] étant le capitaine, la faute lui revient. Si seulement nous avions eu quelqu'un de plus compétent…"
 agot_sailing.9150.a:0 "Peste !"
 agot_sailing.9151.t:0 "Une belle prise !"
 agot_sailing.9151.desc:0 "La côte se dessine, et avec elle, #italic une promesse#!, #high la promesse…#!\nL’équipage se précipite sur le pont, et les mouettes qui tournoient autour du mât pleurent, elles pleurent à grand cri pour les malheureux qui bientôt, délestés de leur or, n’auront plus que leurs yeux.\n\nReste, comme bien souvent, à établir un plan d’attaque. [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))|U] nous fait savoir le nôtre :"
 agot_sailing.9151.desc_sabotaged_production:0 "« Ciblez leurs moyens de production. Nous saccagerons plus que nous emporterons ! » Le reste n’étant que du menu détail, je ne m’en préoccupe guère…\n\nLe navire nous amène à bon port si j’ose dire, et quelques bâtiments incendiés et quelques gorges tranchées plus tard, nous repartons, en victorieux fils de putains que nous sommes !"
 agot_sailing.9151.desc_pillage_settlement:0 "« Nous pillerons tout ce qui pourra être pillé, et nous ferons notre leur or ! » Le reste n’étant que du menu détail, je ne m’en préoccupe guère…\n\nLe navire nous amène à bon port si j’ose dire, et quelques pouilleux aux mains encombrées occis plus tard, nous repartons, en victorieux fils de putains que nous sommes !"
 agot_sailing.9151.desc_duel_the_baron:0 "« Je vais affronter [selected_piracy_destination_baron.Custom('FR_le_Char_Pi')][selected_piracy_destination_baron.GetTitledFirstName] en personne ! Tout ce que vous avez à faire est de vous charger de la merdaille locale pour me laisser le champ libre ! » Le reste n’étant que du menu détail, je ne m’en préoccupe guère…\n\nLe navire nous amène à bon port si j’ose dire, et quelques faquins trucidés plus tard, nous repartons, en victorieux fils de putains que nous sommes !"
 agot_sailing.9151.desc_kidnap_villager:0 "« Le sang vaut parfois plus que l’or. Tâchons de ramener quelques pauvres hères qui iront réchauffer nos cellules ! » Le reste n’étant que du menu détail, je ne m’en préoccupe guère…\n\nLe navire nous amène à bon port si j’ose dire, et après moult hurlements plus tard, nous repartons, en victorieux fils de putains que nous sommes !"
 agot_sailing.9151.a:0 "La victoire est nôtre !"
 agot_sailing.9152.t:0 "La débandade"
 agot_sailing.9152.desc:0 "La côte se dessine, et avec elle, #italic une promesse#!, #high la promesse…#!\nL’équipage se précipite sur le pont, et les mouettes qui tournoient autour du mât pleurent, elles pleurent à grand cri pour les malheureux qui bientôt, délestés de leur or, n’auront plus que leurs yeux.\n\nReste, comme bien souvent, à établir un plan d’attaque. [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))|U] nous fait savoir le nôtre :"
 agot_sailing.9152.desc_sabotaged_production:0 "« Ciblez leurs moyens de production. Nous saccagerons plus que nous emporterons ! » Le reste n’étant que du menu détail, je ne m’en préoccupe guère…\n\nMalheureusement, une fois débarqués, tout va à vau-l’eau. La garnison nous donne plus de fil à retordre que notre capitaine l’espérait, et de trop nombreuses pertes plus tard, nous finissons par retourner au navire, la queue entre les jambes…"
 agot_sailing.9152.desc_pillage_settlement:0 "« Nous pillerons tout ce qui pourra être pillé, et nous ferons notre leur or ! » Le reste n’étant que du menu détail, je ne m’en préoccupe guère…\n\nMalheureusement, une fois débarqués, tout va à vau-l’eau. Notre capitaine ayant minoré les défenses ennemies, nous finissons par devoir nous carapater la queue entre les jambes, mais pire encore : les mains vides…"
 agot_sailing.9152.desc_duel_the_baron:0 "« Je vais affronter [selected_piracy_destination_baron.Custom('FR_le_Char_Pi')][selected_piracy_destination_baron.GetTitledFirstName] en personne ! Tout ce que vous avez à faire est de vous charger de la merdaille locale pour me laisser le champ libre ! » Le reste n’étant que du menu détail, je ne m’en préoccupe guère…\n\nMalheureusement, une fois débarqués, tout va à vau-l’eau. Ayant grandement surestimé ses talents martiaux, notre capitaine finit par devoir fuir la queue entre les jambes, et nous avec…"
 agot_sailing.9152.desc_kidnap_villager:0 "« Le sang vaut parfois plus que l’or. Tâchons de ramener quelques pauvres hères qui iront réchauffer nos cellules ! » Le reste n’étant que du menu détail, je ne m’en préoccupe guère…\n\nMalheureusement, une fois débarqués, tout va à vau-l’eau. Notre capitaine ayant minoré les défenses ennemies, nous finissons par devoir nous carapater la queue entre les jambes…"
 agot_sailing.9152.a:0 "Pff, capitaine de mes deux…"
 agot_sailing.9501.t:0 "Tragique naufrage"
 agot_sailing.9501.desc_intro:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('admiral'))|U] s’approche, missive en main pour délivrer sa nouvelle comme un corbeau qui funeste ma journée :\n\n« [ROOT.Char.Custom('FormOfAddressForLiege')|U], un navire a sombré. La tragédie a eu lieu non loin de [ship_province.GetName], et on dénombre très peu de survivants. »"
 agot_sailing.9501.desc_reaction_sadistic:0 "\n\nUne tragédie pour sûr : une cargaison entière de perdue, et l’or avec elle."
 agot_sailing.9501.desc_reaction:0 "\n\nIl faudra s’assurer de prendre les mesures pour qu’une telle chose ne se reproduise pas."
 agot_sailing.9501.desc_reaction_compassionate:0 "\n\nBien entendu, mes pensées vont d’abord aux survivants et aux familles endeuillées."
 agot_sailing.9501.desc_greed_greedy:0 "\n\nTandis que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('admiral'))] fait état de la cargaison qui repose désormais dans les eaux, une idée se fraie un chemin : ayant connaissance du lieu de l’incident, je pourrais appareiller un navire pour récupérer ce qui pourrait l’être dans l'épave. Mais la nouvelle de ce naufrage a sans doute déjà fait le tour du pays, et des chasseurs de trésor sont probablement déjà en route en ce moment même…"
 agot_sailing.9501.desc_greed_not_tarth:0 "\n\nUne immense et étincelante fortune gît désormais dans les tréfonds marins, si étincelante que les eaux bleu-saphir de Torth en rougiraient presque de ne plus être le parangon de la joliesse maritime — une beauté gagnée au prix du sang."
 agot_sailing.9501.desc_greed_tarth:0 "\n\nUne immense fortune gît désormais dans les eaux de Torth, sublimant je n'en doute point le bleu-saphir d’étincelantes nuances d’or, rendant l’île plus belle qu’elle ne l'a jamais été — une beauté consolidée au prix du sang."
 agot_sailing.9501.a:0 "Triste nouvelle."
 agot_sailing_end:0 "@warning_icon! #X Cela mettra fin au voyage#!"
 agot_sailing_end_failure:0 "@warning_icon! #X Cela mettra fin au voyage#!"
 agot_sailing_kraken_spawn:0 "Cela fait plusieurs jours que nous voguons sur les eaux, plusieurs jours que les vagues cognent la coque et que le vent fouette mon visage. Et c’est dans cette banalité quotidienne qu’apparaît un îlot au loin — rocher solitaire perdu au beau milieu des eaux. Le spectacle est banal, au premier abord du moins, car la banalité se fait monstruosité quand je réalise que… #high l’îlot bouge ?#!\n\nCe qui commence par un frisson le long de la nuque, se transforme en frayeur le long de la joue. Le rocher est bien plus grand qu’il n’y parait, et il est pourvu d’extrémités tentaculaires. La peur ne saurait abuser la vérité plus longtemps : ce n’est point un rocher, c’est le crâne d’une monstruosité tant redoutée : « Un kraken ! » s’égosille l’ensemble de l’équipage qui ne fait que mettre un mot compréhensible par tous sur un spectacle d’une horreur indicible."