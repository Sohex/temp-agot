l_french:
 agot_sailing.0800.t:0 "Arrivée au port"
 agot_sailing.0800.desc:0 "Je pose le pied dans le port et j’hume l’air marin qui entoure [location.GetNameNoTooltip]. Une douce brise gorgée de sel qui excite mes narines et titille mon envie d’aventure, tandis que l’équipage prépare le navire qui bientôt m’emmènera dans l’étreinte des vents et marées.\n\nLe brouhaha des matelots se mélange à celui des mouettes, et les uns gueulant plus fort que les autres à qui mieux mieux, en arriveraient presque à silencier la douce mélodie de l’eau.\n\n#defender_color La mer est là, et elle m’attend, elle m’appelle.#!"
 agot_sailing.0800.a:0 "[Select_CString(ROOT.Char.HasTrait( GetTrait('rude') ), 'La putain attend qu’on la prenne', 'Voilà une invitation qui ne se refuse pas' )]."
 agot_sailing.0800.b:0 "Le navire manque de bras !"
 nice_try_tt:0 "Aucune carte au trésor que vous possédez ne vous mènera là où vous avez navigué"
 agot_sailing.1005.t:0 "Plaisirs portuaires"
 agot_sailing.1005.desc:0 "Dans l'attente que le navire soit prêt à prendre le large, je vais ça et là d'un bout à l'autre des quais, lorgnant du côté de la mer, dont la surface miroite le soleil, et l'horizon moult promesse d'aventure. Mais c'est à une autre forme d'aventure que je me confronte, ici, sur la terre ferme, quand m'aborde [Select_CString(hooker.IsFemale,'une femme','un homme')] au physique avenant.\n\n« Si tu cherches à goûter aux délices que l'on trouve en mer, je peux t'en donner un avant-goût [Select_CString(ROOT.Char.IsFemale,'ma mignonne','mon mignon')]. »"
 agot_sailing.1005.a:0 "Une perle comme toi mérite une place dans m[ROOT.Char.Custom('FR_ResidenceBuilding_OnA')]."
 agot_sailing.1005.b:0 "Tu mouilles plus facilement que les navires, drôlesse. Viens donc."
 agot_sailing.1005.c:0 "Du vent, morue."
 sailing_gained_concubine_log:0 "Vous avez pris [hooker.GetFirstName]  comme [concubine|El][hooker.Custom('FR_E')|E]"
 sailing_had_sexual_encounter:0 "Vous avez couché avec [hooker.GetFirstName]"
 agot_sailing.1006.t:0 "Le baiser de la mort"
 agot_sailing.1006.desc:0 "Notre petite affaire terminée, la première chose qu’il me faut faire est de reprendre mon souffle, [hooker.GetFirstName] n’ayant pas ménagé son entrain…\n\nLe cœur qui tambourine dans ma poitrine semble lui aussi de cet avis, et comme pour complimenter à demi-mot sa fougue, j’affirme sur le ton de la plaisanterie : « C’est à croire que tu souhaites ma mort, ah ah » mais qui s’avère moins une plaisanterie qu’une prophétie :\n\n« [Select_CString(ROOT.Char.IsFemale,'Cette femme','Cet homme')] est perspicace », dit-[hooker.Custom('FR_IlElle')] dague effilée en main, révélant sa vraie nature — ou plutôt son #italic son vrai visage#! devrais-je dire…"
 agot_sailing.1006.a:0 "Merde !"
 agot_sailing.1006.a.desc:0 "Vous tentez tout ce qui est en votre pouvoir pour vous en sortir :"
 agot_sailing.1006.duel_success:0 "Dans un geste désespéré, vous parvenez à lui arracher la dague des mains et à [hooker.Custom('FR_LeLa')] mettre hors d’état de nuire"
 agot_sailing.1006.duel_failure:0 "Après des ébats sulfureux, le froid baiser de la lame vous procure une sensation très désagréable…"
 agot_sailing.1007.t:0 "Dans l’attente…"
 agot_sailing.1007.desc:0 "Parmi la myriade de bruits qui émane des quais, il en est un qui suscite mon attention plus que les autres : celui du fer travaillant le bois.\n\n[whittler.GetFirstName] s'attèle à faire d'un morceau informe et impropre, une œuvre d'art, selon ses dires : « Faites donc de même, [whittler.Custom2('spoken_address_by_familiarity', ROOT.Char)], ça vous occupera le temps que le navire soit prêt à lever l'ancre, » dit-[whittler.Custom('FR_IlElle')] en m'offrant un couteau à la lame finement aiguisée…"
 agot_sailing.1007.a:0 "Je pourrais sculpter un joli présent pour mon enfant."
 agot_sailing.1007.b:0 "Je pourrais sculpter un joli présent pour mon amour."
 agot_sailing.1007.c:0 "[ROOT.Char.Custom('FR_LeLa')|U] poète que je suis se doit d’avoir une flûte."
 agot_sailing.1007.d:0 "Je vais essayer, mais c'est juste histoire de m’occuper."
 agot_sailing.1007.e:0 "J’aime autant [ROOT.Char.Custom('IdleActivity')]."
 agot_sailing.1008.t:0 "La rixe"
 agot_sailing.1008.desc:0 "La veille de notre partance en mer est l’occasion de profiter une dernière fois des plaisirs simples d’une soirée à la taverne. Boissons, rires et chansons, de quoi prodiguer à l’endroit une ambiance plus festive qu’avant notre arrivée.\n\nMais dans l’effervescence générale, une clameur s’élève plus haut que toutes les chopes : « Merdaille ! » vocifère [brawler.GetFirstNameNicknamed] « je vais te faire ravaler tes dents ! » [brawler.Custom('lmf_neg_reaction_type')].\n\nQue serait une taverne sans quelques poings levés et dents cassés ? Mais s’[brawler.Custom('FR_IlElle')] semble plutôt bien s’en tirer au début, [brawler.Custom('FR_IlElle')] se retrouve subitement à devoir se castagner contre plus d’un bougre…"
 agot_sailing.1008.a:0 "Allons allons, je suis sûr qu’on peut discuter…"
 agot_sailing.1008.a.success:0 "Vous parvenez à calmer la situation"
 agot_sailing.1008.a.failure:0 "Vous payez votre audace de vous mêler de ce qui ne vous regarde pas"
 agot_sailing.1008.b:0 "[Select_CString(ROOT.Char.HasTrait( GetTrait('brave') ), 'Je ne dis jamais non à une bonne bagarre !', 'Bougez pas, j’arrive !' )]"
 agot_sailing.1008.b.success:0 "Les bougres décampent après quelques gnons bien sentis"
 agot_sailing.1008.b.failure:0 "Vous et [brawler.GetFirstNameNoTooltip] prenez une sacrée dérouillée"
 agot_sailing.1008.c:0 "Bonne chance [brawler.GetFirstNameNoTooltip] !"
 agot_sailing.1009.t:0 "Concours à boire"
 agot_sailing.1009.desc:0 "Lorsque l'heure est entre chien et loup, vient le moment pour l'équipage d'oublier le dur labeur d'une vie de mathurin et d'embrasser la jovialité des moments festifs. Et voilà que ça cacarde à foison, dégainant les vantardises des beaux jours, comme un spadassin ayant des comptes à rendre. J'entends des récits d'exploits guerriers et de conquêtes amoureuses, le tout couvert par les singulières paroles de « Alice aux trois doigts ».\n\nC'est dans ce tohu-bohu grivois que [Select_CString(challenger.IsFemale,'cette bonne vieille','ce bon vieux')] [challenger.GetFirstName] se lève : « Je n'ai pas mon pareil pour vider les coupes ! » dit-[challenger.Custom('FR_IlElle')] en frappant la sienne sur la table.\n\n« [challenger.Custom2('spoken_address_by_familiarity', ROOT.Char)|U], tentez votre chance ! [Select_CString(And(ROOT.Char.IsFemale, challenger.IsFemale), 'La dernière', 'Le dernier')] a vidé sa coupe se remplit les bourses ! » #italic d’or#!, précise-t-[challenger.Custom('FR_IlElle')] derechef, provoquant une hilarité sans doute exagérée par les effluves d'alcool."
 agot_sailing.1009.a:0 "L'alcool vous a déjà grandement abusé si vous pensez avoir une chance !"
 agot_sailing.1009.a.success:0 "Après moult gorgées, vous entendez [challenger.GetFirstNameNoTooltip] s'écrouler par terre"
 agot_sailing.1009.a.failure:0 "Vous vous demandez pourquoi le monde se renverse autour de vous…"
 agot_sailing.1009.b:0 "Je passe mon tour."
 agot_sailing.1010.t:0 "La diseuse de bonne aventure"
 agot_sailing.1010.desc:0 "Dans une attente par trop longue, je m’arme de patience en faisant les cent pas, dont le tambourinement rythmé est subitement cassé par une voix quasi d’outre-tombe : « Par ici » me dit une vieille femme avec pour toute possession une petite charrette et une table ornée.\n\nPlus je m’approche, plus son sourire s’étire, et quand finalement il se dessine d’une oreille à l’autre, elle grippe quelques cailloux gravés de runes, avant de les ranger dans un sac de velours. #italic Clac clac#! font-ils lorsqu’elle les secoue, #italic clac clac#! font-ils encore avant qu’elle n'en tire cinq, soigneusement alignés devant elle. \n\n« Bien le bonjour [ROOT.Char.GetFirstNameNoTooltip], dit-elle comme si me saluer lui était familier. Voyez ces pierres. Elles renferment un pouvoir mystique, un pouvoir issu… #B des profondeurs…#! Ce qu’elles ont à dire pourrait vous être fort utile dans votre périple… si vous êtes prêt[ROOT.Char.Custom('FR_E')] à en payer le prix… »"
 agot_sailing.1010.a:0 "Je suis tout ouïe."
 agot_sailing.1010.a.success.t:0 "De bons présages"
 agot_sailing.1010.a.success:0 "Votre voyage sera bénie, comme le sera votre vie pour les mois à venir"
 agot_sailing.1010.a.failure.t:0 "De mauvais présages"
 agot_sailing.1010.a.failure:0 "Une noirceur se profile à l’horizon…"
 agot_sailing.1010.b:0 "Vous n’avez rien de plus original pour soutirer de l’argent ?"
 agot_sailing.1011.t:0 "Les délices du port"
 agot_sailing.1011.desc:0 "En cette fraîche matinée du jour de notre départ, un parfum tout particulier vient titiller mes narines autant que celles de [fellow_diner.GetFirstName].\n\nCe n’est pas la senteur si singulièrement salée de l'air marin, c’est une odeur de mangeaille, et elle semble nourrir l’imaginaire de [fellow_diner.GetFirstNameNoTooltip] qui se met à remonter la piste comme un limier traquant du gibier. « Il faut absolument que vous goûtiez à cela » dit-[Select_CString(fellow_diner.IsFemale,'elle toute','il tout')] jouasse après m’avoir traîné[ROOT.Char.Custom('FR_E')] jusqu’à une cuisine de rue, délabrée et nichée entre deux entrepôts.\n\nJe ne reconnais pas le contenu du bol qu’[fellow_diner.Custom('FR_IlElle')] s’empresse d’engloutir sous mes yeux, mais il n’y va pas avec le dos de la cuillère, c’est certain. C’est [Select_CString(fellow_diner.IsFemale,'une habituée','un habitué')] de la maison, mais malgré son insistance répétée pour me pousser à goûter, l’état crasseux des lieux n’en finit pas de me convaincre de tourner les talons."
 agot_sailing.1011.a:0 "Ça ne peut pas être si mauvais… n’est-ce pas ?"
 agot_sailing.1011.a.success.t:0 "C’est un régal !"
 agot_sailing.1011.a.success:0 "La texture est bien plus appétissante en bouche qu’à l’œil, et vous voilà repu[ROOT.Char.Custom('FR_E')] pour le voyage qui s’annonce"
 agot_sailing.1011.a.too_spicy.t:0 "Le plat est trop épicé !"
 agot_sailing.1011.a.too_spicy:0 "Vous vous demandez qu’est-ce qu’il peut bien y avoir là-dedans pour que ce soit si épicé"
 agot_sailing.1011.a.failure.t:0 "La bouffe est dégueulasse !"
 agot_sailing.1011.a.failure:0 "Vous avez des haut-le-cœur à chaque bouchée, et encore plus en imaginant avec quoi cela a pu être préparé"
 agot_sailing.1011.b:0 "C’est répugnant…"
 agot_sailing.1012.t:0 "[ROOT.Char.Custom('FR_LeLa')|U] [ROOT.Char.GetTitleAsNameNoTooltip] et l’Oiseau"
 agot_sailing.1012.desc:0 "L’esprit égaré par le voyage qui s’annonce bientôt, mes pas me mènent machinalement vers le navire situé en bout de ponton, mais avant de pouvoir embarquer, il me faut semble-t-il souffrir d’une ultime péripétie. Cela, je le comprends quand quelque chose vient s’écraser mollement en coin de visage. Mes doigts inspectent la matière visqueuse, et j’entends un rire éclaté dans mon dos.\n\n« Là-bas ! » se gausse [laugher.GetFirstName], l’index pointé vers mon assaillant : une mouette, tout de blanc emplumée, qui, je le jure devant [ROOT.Char.GetFaith.HighGodNameAlternate], semble bomber le torse pour se gargariser de son infamie. Plus que mon visage, c’est mon honneur que ce con de volatile vient de conchier, sous les yeux d’un[laugher.Custom('FR_E')] [laugher.Custom('polite_gender_ref')] dont les éclats de rire semblent singer les cris de l’oiseau."
 agot_sailing.1012.a:0 "Un piaf a réussi à m’atteindre, là où tant d’autres ont échoué. Cocasse."
 agot_sailing.1012.b:0 "[laugher.Custom('InsultNoun')|U] ! Je vais t’apprendre le respect !"
 agot_sailing.1013.t:0 "[Select_CString(recruit.IsFemale,'Une femme d’expérience','Un homme d’expérience')]"
 agot_sailing.1013.desc:0 "Souhaitant m’assurer que tout est en ordre en vue du voyage qui s’annonce, je consulte diverses listes — équipement, cargaison, équipage — et c’est cette dernière qui m’interpelle : nous manquons de bras. Rien de particulièrement fâcheux il est vrai, mais il est toujours préférable d’avoir un équipage au complet lorsque l’on s’aventure en mer.\n\nAprès avoir écumé divers lieux où l’on est susceptible de trouver de vaillants et vieux loups de mer, un nom résonne plus souvent qu’à l'accoutumé : [recruit.GetFirstName]. [recruit.Custom('FR_IlElle')|U] m’est vendu[recruit.Custom('FR_E')] comme [Select_CString(recruit.IsFemale,'une matelote expérimentée','un marin expérimenté')] ayant déjà plusieurs voyages à son actif, mais, lorsque finalement je retrouve sa piste, je [recruit.Custom('FR_LeLa')] découvre déjà prêt[recruit.Custom('FR_E')] à embarquer avec un autre équipage. Me voyant ruminer silencieusement mon désarroi, [recruit.Custom('FR_IlElle')] s’approche, le sourcil inquisiteur : « Qu’est-ce que vous voulez ? »"
 agot_sailing.1013.a:0 "Je vous veux sur mon navire, où vous attend la fortune !"
 agot_sailing.1013.a.success:0 "Vous parvenez à convaincre [recruit.GetFirstNameNoTooltip] de rejoindre votre équipage"
 agot_sailing.1013.a.failure:0 "Vous ne parvenez pas à [recruit.Custom('FR_LeLa')] convaincre"
 agot_sailing.1013.b:0 "Et si on parlait plutôt de ce que #bold vous#! voulez ?"
 agot_sailing.1013.c:0 "C’est curieux, chez les marins, ce besoin de faire des phrases."
 agot_sailing.1014.t:0 "Une journée au marché"
 agot_sailing.1014.desc:0 "L’équipage besognant à charger les provisions depuis les quais jusqu'aux cales du navire, le capitaine que je suis n’a d'autre choix que de s’occuper en attendant. Je pourrais tout aussi bien [ROOT.Char.Custom('IdleActivity')], mais les étals de marché qui abondent dans les environs sont à même de m’offrir une distraction plus stimulante, car dans ce dédale mercantile, où chacun y va de son mot ou de sa voix pour appâter le chaland, c’est déjà un voyage à l’autre bout du monde qui s’ouvre à moi.\n\nUn arôme que je n’ai jamais humé, un met que je n’ai jamais goûté, une langue que je n’ai jamais prononcée, il y a tant de choses pour me pousser à sortir ma bourse…"
 agot_sailing.1014.a:0 "Donnez-moi un exemplaire de ce livre."
 agot_sailing.1014.a.tt:0 "Vous pourriez augmenter votre [Concept('trait_level_track_xp','expérience')|E] de [GetTrait('lifestyle_mariner').GetName( GetNullCharacter )|l]"
 agot_sailing.1014.a.success.toast:0 "Vous avez gagné de l’expérience en tant que [GetTrait('lifestyle_mariner').GetName( GetNullCharacter )|l]"
 agot_sailing.1014.a.failure.toast:0 "Vous n’avez pas gagné d’expérience en tant que [GetTrait('lifestyle_mariner').GetName( GetNullCharacter )|l]"
 agot_sailing.1014.b:0 "Un fût de votre meilleur alcool ! Preste !"
 agot_sailing.1014.c:0 "Charriez ces fruits dans la cale, nous en aurons grand besoin."
 agot_sailing.1014.d:0 "Une carte au trésor ? Intéressant."
 agot_sailing.1014.d.tt.success.toast:0 "Vous obtenez une carte au trésor"
 agot_sailing.1014.d.tt.failure.toast:0 "La soi-disant carte au trésor n’est qu’un attrape-couillon"
 agot_sailing.1014.e:0 "Je ne suis là que pour regarder…"
 agot_sailing.1015.t:0 "[Select_CString(dockyard_beggar.IsFemale,'La vieille mendiante','Le vieux mendant')]"
 agot_sailing.1015.desc:0 "[dockyard_guest.GetFirstName] et moi nous dégourdissons un peu les jambes avant la longue traversée en mer qui nous attend, lorsqu’inopinément, [Select_CString(dockyard_beggar.IsFemale,'une vieille mendiante','un vieux mendant')] se met en travers de notre route :\n\n« On répond à l’appel de la mer à c'que j'vois, vot' seigneurie. Sachez qu'j'en sais beaucoup sur la mer, et cont' une 'tite pièce, j'vous apprendrais des trucs qui pourraient bien vous s'ver la vie plus tard ! Qu'esce z'en dites ? » dit-[dockyard_beggar.Custom('FR_IlElle')] en ne mâchant pas ses mots mais en mangeant quelques syllabes.\n\nL’outrecuidance d’[Select_CString(dockyard_beggar.IsFemale,'une femme','un homme')] qui s’oublie pousse m[Select_CString(dockyard_guest.IsFemale,'a compagne','on compagnon')] de marche à intervenir séant : « Débarrasse le plancher, vieillard[dockyard_beggar.Custom('FR_E')], [ROOT.Char.Custom('FormOfAddressForLiege')] n’a pas à s’infliger ta sale trogne de si bon matin ! »"
 agot_sailing.1015.a:0 "Allons allons, écoutons ce qu’[Select_CString(dockyard_beggar.IsFemale,'une femme','un homme')] d’expérience peut nous apprendre."
 agot_sailing.1015.b:0 "[dockyard_guest.GetFirstNameNoTooltip] a raison. Va donc gueuser ailleurs !"
 agot_sailing.1015.c:0 "Vous n’avez rien à m’apprendre. Allons-nous en."
 agot_sailing.1016.t:0 "Un truc à propos des bâteaux"
 agot_sailing.1016.desc:0 "« J’ai rarement pas été sur des bateaux ! »\n\nUne dispute entre deux hommes sur les quais attire tous les regards, monopolisant toute l’attention aux alentours.\n\n« Non, tu ne peux pas ne pas avoir été sur des bateaux ! » Un désaccord qui me laisse perplexe."
 agot_sailing.1016.a:0 "Qu’est-ce qu’ils baragouinent ?"
 agot_sailing.1016.b:0 "Ah oui, ah ça oui, effectivement."
 agot_sailing.1016.b.tt:0 "Et si la mort était bateau ?"
 agot_sailing.1990.t:0 "Le choix du second"
 agot_sailing.1990.desc:0 "Le moment tant attendu où nous ferons voile approche à grand pas, mais reste une décision cruciale à prendre : qui me secondera durant ce voyage ?\n\nParmi toutes les personnes réunies devant moi, il me faut choisir quelqu’un qui partagera la responsabilité du commandement. C'est là une question épineuse que de savoir quelle qualité je souhaite favoriser dans mon choix — l’expérience, la loyauté, la bravoure ?\n\nDans un élan de réflexion, je vois des yeux qui brillent d’admiration, et d’autres qui bouillonnent d'ambition…"
 agot_sailing.1990.a:0 "Approchez, commandant en second !"
 agot_sailing.1991.t:0 "Vers l’horizon et au-delà !"
 agot_sailing.1991.desc:0 "Le navire quitte le port, et la houle semble particulièrement prononcée aujourd'hui à en juger par le tangage que je ressens jusque dans mes os — à moins que ce ne soit mon corps qui trépigne d'impatience à l'idée de ce qui nous attend.\n\n[host.Custom('FR_le_Char_Pi')|U][host.GetTitledFirstNameNicknamed] et son second, [first_mate.Custom('FR_le_Char_Pi')][first_mate.GetTitledFirstName], parcourent l'horizon, là où se trouve notre destin, funeste ou fortunée…"
 agot_sailing.1991.a:0 "Que la traque commence !"
 agot_sailing.1991.b:0 "La fortune nous attend !"
 agot_sailing.1991.c:0 "L’Antique Valyria nous attend…"
 agot_sailing.1991.d:0 "Partons en chasse !"
 agot_sailing.2001.t:0 "Une partie de dés"
 agot_sailing.2001.desc:0 "En traversant le pont principal, les clameurs d’une foule venant du pont inférieur arrivent jusqu’à mes esgourdes. Des membres de l’équipage sont réunis autour d’une table, laquelle sert de support pour une partie de dés endiablée, où ceux qui perdent leur or se consolent dans l’alcool.\n\n« Pourquoi ne pas vous joindre à nous, capitaine ? beugle [first_mate.GetFirstNameNoTooltip], auriez-vous peur de perdre ? »\n\nÀ son invitation provocatrice, une voix s’élève parmi les joueurs : « Vous en faites pas, on vous laissera de quoi payer notre solde ! » suscitant un rire général."
 agot_sailing.2001.a:0 "Vous rirez moins quand je vous aurai plumé comme des volailles."
 agot_sailing.2001.b:0 "J'ai d’autres chats à fouetter."
 agot_sailing.2001.c:0 "Une belle occasion d’apprendre à connaître ces fripouilles."
 agot_sailing.2002.t:0 "Navire en détresse"
 agot_sailing.2002.desc:0 "« Navire à tribord ! » annonce un membre d’équipage, tandis que la silhouette dudit navire se fait de plus en plus précise.\n\nIl est aisé, même d’ici, de voir que son voyage ne lui a pas été favorable — quant à savoir s’il a subit les foudres de la mer ou des pirates…\n\nMais pour l’heure, les survivants, affairés sur le pont, tentent vaille que vaille de le maintenir à flot en priant qu’une main bienveillante leur soit tendue."
 agot_sailing.2002.a:0 "Nous n’allons certainement pas abandonner ces pauvres âmes !"
 agot_sailing.2002.a.tt_success:0 "Vous parvenez à sauver l’équipage"
 agot_sailing.2002.a.tt_failure:0 "Le navire coule avec l’équipage et sa cargaison"
 agot_sailing.2002.b:0 "Achevons ce que d’autres ont commencé, et à nous leur or !"
 agot_sailing.2002.b.tt_success:0 "Vous abordez le navire et massacrez l’équipage"
 agot_sailing.2002.b.tt_failure:0 "Vous parvenez à piller le navire mais finissez mal-en-point"
 agot_sailing.2002.c:0 "Leur sort ne nous concerne en rien."
 agot_sailing.2003.t:0 "Léviathan !"
 agot_sailing.2003.desc:0 "L’air marin est, comme à son habitude, vivifiant pour le corps et l’esprit, et même si le vent n’est pas tendre avec moi, cela reste une belle journée en mer.\n\nMais la douce traversée de l’azur prend une tournure beaucoup plus… stimulante, lorsqu’au loin s'élève un panache d’eau, révélant dans son sillage une petite îlot de chair grise qui se déplace.\n\n« C’est un des léviathans. À moins que mes yeux ne soient abusés par quelques sorcelleries. » Mon murmure est aussitôt soufflé dans la brise. Le monde n’a point connu de créatures plus anciennes et plus gigantesques que celles-ci, aux dires de certains."
 agot_sailing.2003.a:0 "La fortune nous sourit… #high À vos harpons !#!"
 agot_sailing.2003.a.tt_success:0 "Vous tuez la bête et hissez les plus belles pièces sur votre navire"
 agot_sailing.2003.a.tt_failure:0 "La bête vous échappe"
 agot_sailing.2003.b:0 "Pas de quartier ! Et qu’importe s’il n'en reste rien !"
 agot_sailing.2003.c:0 "Ça c’est ce que j’appelle un sacré morceau !"
 agot_sailing.2003.c.tt:0 "Vous êtes face à une créature #EMP gargantuesque#!"
 agot_sailing.2003.c.tt_success:0 "$agot_sailing.2003.a.tt_success$"
 agot_sailing.2003.c.tt_failure:0 "$agot_sailing.2003.a.tt_failure$"
 agot_sailing.2003.d:0 "Quel honneur y aurait-il à tuer si majestueuse créature ?"
 agot_sailing.2003.d.tt:0 "Vous laissez partir le léviathan."
 agot_sailing.2004.t:0 "Bataille en haute mer"
 agot_sailing.2004.desc:0 "Je profite d’une journée propice — météo favorable et soleil chatoyant — pour [ROOT.Char.Custom('IdleActivity')], confortablement installé[ROOT.Char.Custom('FR_E')] sur le pont principal. Mais la quiétude ne saurait durer…\n\n« Navire en approche ! » alerte le nid-de-pie.\n\nJe cesse toute activité et me précipite sur le bastingage, scrutant l’horizon où j’y trouve en effet une silhouette cinglant sur nous. Il apparaît évident et rapidement qu'il s’agit là d’un navire pirate qui cherche à en découdre. Mon équipage attend les ordres, ne sachant pas encore si leur capitaine va choisir la fuite ou le combat."
 agot_sailing.2004.a:0 "[SelectLocalization(ROOT.Char.GetGovernment.HasGovernmentFlag( 'government_is_pirate' ), 'À pirate, pirate et demi !', 'Préparez-vous à vous battre !')]"
 agot_sailing.2004.a.success:0 "Les pirates sont mis en déroute"
 agot_sailing.2004.a.failure:0 "Les pirates repartent avec un joli magot"
 agot_sailing.2004.b:0 "Toutes voiles dehors et virez de bord !"
 agot_sailing.2005.t:0 "Homme à la mer !"
 agot_sailing.2005.desc:0 "La mer, au contraire de la terre, est mouvement. Elle se meut, elle s’agite, parfois même elle se déchaîne. La vigilance est toujours de mise, surtout lorsque les vagues se souviennent de leur nature profonde…\n\n« Un homme à la mer ! » entend-t-on tandis que des cris sont poussés depuis la surface, par quelqu’un qui remue ciel et terre pour que la mer ne l’engloutisse pas.\n\nLa pluie battante, le vent violent et les vagues impétueuses présagent d’un sauvetage difficile, mais la vitesse est de mise car c’est la vie d’un homme qui est en jeu !"
 agot_sailing.2005.a:0 "Tenez-bon, j’arrive !"
 agot_sailing.2005.a.tt_success:0 "Vous parvenez à sauver le membre d’équipage à la nage"
 agot_sailing.2005.a.tt_failure:0 "Les vagues sont trop violentes et l’homme se noie"
 agot_sailing.2005.b:0 "Nous n’avons que très peu de temps, alors tâchons d’agir efficacement !"
 agot_sailing.2005.b.tt_success:0 "Votre sens de l’organisation permet de sauver une vie"
 agot_sailing.2005.b.tt_failure:0 "L’équipage est désorganisé sous vos ordres et l’homme se noie"
 agot_sailing.2005.c:0 "Une leçon pour ceux qui oublient que la prudence est d’usage en mer."
 agot_sailing.2006.t:0 "Une partie de cartes"
 agot_sailing.2006.desc:0 "En traversant le pont principal, les clameurs d’une foule venant du pont inférieur arrivent jusqu’à mes esgourdes. Des membres de l’équipage sont réunis autour d’une table, laquelle sert de support pour une partie de cartes endiablée, où ceux qui perdent leur or se consolent dans l’alcool.\n\n« Pourquoi ne pas vous joindre à nous, capitaine ? beugle [first_mate.GetFirstNameNoTooltip], auriez-vous peur de perdre ? »\n\nÀ son invitation provocatrice, une voix s’élève parmi les joueurs : « Vous en faites pas, on vous laissera de quoi payer notre solde ! » suscitant un rire général."
 agot_sailing.2006.a:0 "*Battre les cartes*"
 agot_sailing.2006.a.tt_success:0 "Vous gagnez la partie"
 agot_sailing.2006.a.tt_failure:0 "Vous perdez votre mise"
 agot_sailing.2006.b:0 "C’est l’occasion pour moi de sortir… #bold ma carte maîtresse.#!"
 agot_sailing.2006.b.tt_success:0 "Personne ne remarque votre remarquable #italic habileté#!"
 agot_sailing.2006.b.tt_failure:0 "Vous êtes pris[THIS.Char.Custom('FR_E')] la main dans le sac"
 agot_sailing.2006.c:0 "Je ne viens que pour la boisson, les gars."
 agot_sailing.2007.t:0 "Prendre son mal en patience"
 agot_sailing.2007.desc:0 "Si jusqu’à présent nos pérégrinations en mer se sont montrées plutôt avare en mésaventure, et j’en suis fort aise, je commence pourtant à discerner une grogne croissante à travers le navire. C’est un vieux loup de mer qui vient confirmer mes doutes, lequel s’approche pour me prévenir de sa voix rauque qui s’échappe de derrière une barbe grisonnante, aussi drue que celle d’un morse :\n\n« Vous pouvez être fi[ROOT.Char.Custom('FR_ErEre')] de votre équipage, capitaine, ça oui. Pas le genre à rechigner à la tâche, mais ce qu’ils veulent, c’est pas tant le labeur que l’excitation, le frisson de la découverte. Et pour ça, il faudrait leur montrer plus avant ce qu’il y a à Essos, vous comprenez ? » demande-t-il avec un sourire édenté mais non moins facétieux.\n\nSes mots sont nantis d’une certaine sagesse, probablement dénichée dans les tréfonds de sa barbe, mais fut-ce la vérité, il n’en demeure pas moins que les contrées lointaines d’Essos ne sont pas à l'ordre du jour…"
 agot_sailing.2007.a:0 "Votre patience sera récompensée, ayez foi en moi !"
 agot_sailing.2007.a.tt_success:0 "L’équipage vous fait confiance et rentre dans le rang"
 agot_sailing.2007.a.tt_failure:0 "L’attente d’Essos devient trop longue…"
 agot_sailing.2008.t:0 "Pour qui souffle le calme"
 agot_sailing.2008.desc:0 "Le temps est capricieux. Capricieux de ne point nous faire hommage d’un peu de vent. Depuis plusieurs jours les voiles sont hissées, et je déplore qu’il n’y a pas eu la moindre rafale, pas la moindre brise pour venir les gonfler et nous emporter. J’entends l’impatience gagner le cœur des uns et des autres, mais que faire ? L’équipage se tourne vers leur capitaine ; le capitaine se tourne vers son second ; et le second lui semble vouloir se tourner vers les dieux…\n\n« Certains disent que nous nous sommes attirés la colère [ROOT.Char.GetFaith.WaterGodNamePossessive], affirme [first_mate.GetFirstNameNoTooltip]. Mais il n’y a nul dieu dans nul cieux qui ne soit pas enclin au pardon, pour peu que nous soyons disposer à faire une offrande. »\n\n[Select_CString(ROOT.Char.HasTrait( GetTrait('cynical') ), 'La grande sagesse des Hommes pour qui l’or peut tout régler…', 'Je ne saurais dire si l’or peut acheter la bienveillance de l’océan, mais du moins, peut-il apaiser quelques esprits troublés.' )]"
 agot_sailing.2008.a:0 "Puisse [ROOT.Char.GetFaith.WaterGodName] accepter cet humble tribut."
 agot_sailing.2008.b:0 "Le prochain qui colporte ces racontars passera par-dessus bord !"
 agot_sailing.2008.c:0 "Une telle colère serait autrement moins clémente qu’une absence de vent."
 agot_sailing.2009.t:0 "Des étoiles plein les yeux"
 agot_sailing.2009.desc:0 "Le soleil n’est plus et c’est sous une voûte étoilée et sur un pont des plus calmes que je me retrouve, apercevant quelqu’un qui a les yeux rivés en direction de ce tableau, d’un noir émaillé de blanc scintillant.\n\nNaturellement, je ne peux qu’entamer la conversation par un « Magnifique, n’est-ce pas ? » ce à quoi, la surprise de ne pas m’avoir entendu arriver passée, [stargazer.Custom('FR_IlElle')] répond : « On ne prend que trop rarement le temps de les admirer… »\n\nJ’acquiesce silencieusement…"
 agot_sailing.2009.a:0 "Elles sont également très utiles pour la navigation, vous savez…"
 agot_sailing.2009.a.mariner_progress:0 "Vous gagnez de l’[Concept('trait_level_track_xp','expérience du trait')|E] [GetTrait('lifestyle_mariner').GetName( GetNullCharacter )|l]."
 agot_sailing.2009.a.success.toast:0 "Vous partagez un peu de votre expérience"
 agot_sailing.2009.b:0 "Assurément la plus belle création [ROOT.Char.GetFaith.PantheonTerm3]."
 agot_sailing.2009.c:0 "Le jour viendra où nous naviguerons parmi elles, vous verrez…"
 agot_sailing.2010.t:0 "Le faux pas !"
 agot_sailing.2010.desc:0 "Un ciel dégagé, un vent favorable, une navigation aisée et un moral au beau fixe. #italic Que pourrait bien souhaiter de plus un capitaine ?#!\n\n« Attention ! » un cri d’alerte qui suffit à souffler ma bonne humeur, et lorsque je me retourne pour en trouver l’origine, je vois l’un des membres d’équipage étendu sur le pont au milieu d’une cargaison, sans nul doute renversée par sa maladresse ou son imprudence, avec la jambe tournée dans un angle qui n’est pas souhaitable.\n\n« Aaah ! Ça fait un putain de mal de chien de tous les diables ! » vocifère-t-[sailor.Custom('FR_IlElle')], attendant que l’on vienne lui prêter main forte."
 agot_sailing.2010.a:0 "De la toile de lin et une planche de bois, vite !"
 agot_sailing.2010.a.success:0 "Vous arrivez à [sailor.Custom('FR_LeLa')] remettre sur pied"
 agot_sailing.2010.a.failure:0 "Vous ne faites qu’aggraver son cas…"
 agot_sailing.2010.b:0 "Que cela vous serve de leçon, imbécile."
 agot_sailing.2010.c:0 "Que quelqu’un fasse quelque chose !"
 agot_sailing.2011.t:0 "Contre brumes et marées"
 agot_sailing.2011.desc:0 "Le port tout juste disparu au-delà de la ligne d’horizon, et déjà un épais voile grisâtre nous engloutit, comme une bête affamée cherchant à se repaître de marins imprudents…\n\nLe bleu du ciel n’est déjà plus qu’un gris terne, comme l’est le bleu de la mer. L’inconnu évoqué par le lointain n’est plus un appel à l’aventure, mais un danger indicible.\n\nC’est alors à mes interrogations de devenir un amas brumeux duquel je ne peux m’extirper : faut-il maintenir le cap en espérant que le brouillard se dissipera plus vite que nos inquiétudes, ou bien faut-il virer de bord, quitte à perdre quelques précieux jours ?"
 agot_sailing.2011.a:0 "Le brouillard ne durera pas — #high maintenez le cap !#!"
 agot_sailing.2011.a.success:0 "Vous échappez à l’épais brouillard"
 agot_sailing.2011.a.failure:0 "Vous vous perdez dans ces brumes sans fin"
 agot_sailing.2011.b:0 "Gardons-nous de tout danger — #high virez de bord !#!"
 agot_sailing.2011.c:0 "Un peu de grisaille ne m’effraie point, j’en ai vu d’autres."
 agot_sailing.2020.t:0 "Au secours de l’équipage"
 agot_sailing.2020.desc:0 "« Navire à tribord ! » annonce un membre d’équipage, tandis que la silhouette dudit navire se fait de plus en plus précise et révèle que son voyage ne lui a pas été favorable. Les survivants, affairés sur le pont, tentent vaille que vaille de le maintenir à flot en priant qu’une main bienveillante leur soit tendue — et cette main, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] accepte de leur offrir.\n\n"
 agot_sailing.2020.desc.jerk:0 "Ainsi, ces idiots de marins s’efforcent de venir en aide à un misérable équipage qui réchappe d’un sort funeste.\n\nEt tout ça pourquoi ? Quelques louanges sans intérêt…"
 agot_sailing.2020.desc.normal:0 "Ainsi, les valeureux marins s’attèlent à secourir l’équipage en perdition, sauvant de pauvres âmes des funestes et troubles eaux.\n\nUn acte d’une grande noblesse qu’il me plaît d’être témoin."
 agot_sailing.2020.a:0 "Ramenons ces gens sains et saufs jusqu’au prochain port !"
 agot_sailing.2020.b:0 "Par [ROOT.Char.GetFaith.NegativeAfterLife], pourrait-on se remettre en route ?"
 agot_sailing.2020.c:0 "Voir des navires si brillamment conçus couler si aisément…"
 agot_sailing.2021.t:0 "Perdus en mer"
 agot_sailing.2021.desc:0 "« Navire à tribord ! » annonce un membre d’équipage, tandis que la silhouette dudit navire se fait de plus en plus précise et révèle que son voyage ne lui a pas été favorable. Les survivants, affairés sur le pont, tentent vaille que vaille de le maintenir à flot en priant qu’une main bienveillante leur soit tendue — et cette main, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] accepte de leur offrir.\n\nMais le navire en perdition s’avère être plus traître qu’il n’y paraît. Son mât, fragilisé, s’effondre subitement sur un pont en piteux état, achevant de faire sombrer l’ensemble dans les profondeurs maritimes. Notre équipage parvient à sauver quelques personnes, mais les eaux ont déjà tôt fait d’engloutir la vaste majorité des marins, déjà grandement épuisés voire blessés par leurs précédentes mésaventures…"
 agot_sailing.2021.a:0 "Quelle tragédie…[Select_CString(ROOT.Char.HasTrait( GetTrait('callous') ),' Ah ah ah !',Select_CString(ROOT.Char.HasTrait( GetTrait('sadistic') ),' Ah ah ah !',''))]"
 agot_sailing.2021.b:0 "La mer peut être aussi aimante qu’elle peut être cruelle."
 agot_sailing.2022.t:0 "À l’abordage !"
 agot_sailing.2022.desc:0 "« Navire à tribord ! » annonce un membre d’équipage, tandis que la silhouette dudit navire se fait de plus en plus précise et révèle que son voyage ne lui a pas été favorable. Les survivants, affairés sur le pont, tentent vaille que vaille de le maintenir à flot en priant qu’une main bienveillante leur soit tendue — mais c’est par une main armée que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] choisit de répondre à leurs prières.\n\n« Achevons ce que d’autres ont commencé, et à nous leur or ! » [host.Custom('lmf_neg_reaction_type')], avant que les marins, avides d’or ou de sang, selon chacun, se livrent à un massacre, comme un banc de requins déchiquetant la carcasse agonisante d’une baleine. Le navire dépouillé de ses biens et ôté de toute vie, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] se réjouit d’un butin si aisément raflé."
 agot_sailing.2022.a:0 "La loi du plus fort règne, sur mer plus qu’ailleurs…"
 agot_sailing.2022.b:0 "Comme on dit, le malheur des uns…"
 agot_sailing.2023.t:0 "Pour une poignée d’or"
 agot_sailing.2023.desc:0 "« Navire à tribord ! » annonce un membre d’équipage, tandis que la silhouette dudit navire se fait de plus en plus précise et révèle que son voyage ne lui a pas été favorable. Les survivants, affairés sur le pont, tentent vaille que vaille de le maintenir à flot en priant qu’une main bienveillante leur soit tendue — mais c’est par une main armée que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] choisit de répondre à leurs prières.\n\n« Achevons ce que d’autres ont commencé, et à nous leur or ! » [host.Custom('lmf_neg_reaction_type')], avant que les marins, avides d’or ou de sang, se lancent à l’abordage du navire en perdition, comme un banc de requins attiré par la carcasse agonisante d’une baleine. Mais comme chacun sait, la bête n’est jamais plus dangereuse que lorsqu’elle est blessée. N’ayant rien à perdre, les survivants se battent avec une rage inégalable, forçant [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))], blessé[host.Custom('FR_E')], à crier retraite, son équipage emportant tout ce qu’il peut dans la foulée."
 agot_sailing.2023.a:0 "Un butin bien cher payé."
 agot_sailing.2024.t:0 "Passer son chemin"
 agot_sailing.2024.desc:0 "« Navire à tribord ! » annonce un membre d’équipage, tandis que la silhouette dudit navire se fait de plus en plus précise et révèle que son voyage ne lui a pas été favorable. Les survivants, affairés sur le pont, tentent vaille que vaille de le maintenir à flot en priant qu’une main bienveillante leur soit tendue — malheureusement pour eux, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] reste sourd[host.Custom('FR_E')] à toutes prières : « Leur sort ne nous concerne en rien. »\n\nLe navire en perdition rejoint les profondeurs marines, et son équipage avec lui…"
 agot_sailing.2024.a:0 "Espérons que notre sort sera plus enviable."
 agot_sailing.2024.b:0 "La mer peut être aussi aimante qu’elle peut être cruelle."
 agot_sailing.2024.c:0 "Qui sait quelles richesses contenaient leur navire…"
 agot_sailing.2024.d:0 "Sage décision de le part de notre capitaine."
 agot_sailing.2025.t:0 "Léviathan !"
 agot_sailing.2025.desc:0 "L’air marin est, comme à son habitude, vivifiant pour le corps et l’esprit, mais la douce traversée de l’azur prend une toute autre tournure lorsqu’au loin s’élève un panache d’eau, révélant dans son sillage une petite îlot de chair grise qui se déplace. De suite j’entends le mot « léviathan » être prononcé sur le pont et [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] ordonne la chasse à cet imposant mastodonte des mers.\n\nLa bête se démène mais les harpons ont raison de son opiniâtreté, et bientôt le bleu de l’azur prend la teinte rouge du sang. La bête est morte, et sa carcasse dépecée morceau après morceau."
 agot_sailing.2025.a:0 "Nulle créature, aussi puissante soit-elle, ne saurait échapper à la mort."
 agot_sailing.2025.b:0 "Puisse [ROOT.Char.GetFaith.PantheonTerm] pardonner une telle barbarie."
 agot_sailing.2026.t:0 "Léviathan !"
 agot_sailing.2026.desc:0 "L’air marin est, comme à son habitude, vivifiant pour le corps et l’esprit, mais la douce traversée de l’azur prend une toute autre tournure lorsqu’au loin s’élève un panache d’eau, révélant dans son sillage une petite îlot de chair grise qui se déplace. De suite j’entends le mot « léviathan » être prononcé sur le pont et [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] ordonne la chasse à cet imposant mastodonte des mers.\n\nMais bien vite, l’animal se révèle à la hauteur de ses semblables et nul harpon n’en vient à bout avant qu’il ne disparaisse dans les profondeurs de l’océan."
 agot_sailing.2026.a:0 "Tout ça pour ça…"
 agot_sailing.2026.b:0 "Il n’est point si aisé d’en venir à bout."
 agot_sailing.2027.t:0 "Léviathan !"
 agot_sailing.2027.desc:0 "L’air marin est, comme à son habitude, vivifiant pour le corps et l’esprit, mais la douce traversée de l’azur prend une toute autre tournure lorsqu’au loin s’élève un panache d’eau, révélant dans son sillage une petite îlot de chair grise qui se déplace. De suite j’entends le mot « léviathan » être prononcé sur le pont et [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] ordonne la chasse à cet imposant mastodonte des mers.\n\nLa bête se démène mais les harpons ont raison de son opiniâtreté, et bientôt le bleu de l’azur prend la teinte rouge du sang. La bête est massacrée, et ce qu’il reste de la carcasse dépecée morceau après morceau."
 agot_sailing.2027.a:0 "Son sort était scellé au moment où il a été aperçu."
 agot_sailing.2028.t:0 "Léviathan !"
 agot_sailing.2028.desc:0 "L’air marin est, comme à son habitude, vivifiant pour le corps et l’esprit, mais la douce traversée de l’azur prend une toute autre tournure lorsqu’au loin s'élève un panache d’eau, révélant dans son sillage une petite îlot de chair grise qui se déplace. De suite j’entends le mot « léviathan » être prononcé sur le pont et [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))], en [Select_CString(host.IsFemale,'marinière expérimentée qu’elle est','marin expérimenté qu’il est')], ordonne la chasse à cet imposant mastodonte des mers.\n\nLa bête se démène mais les harpons ont raison de son opiniâtreté, et bientôt le bleu de l’azur prend la teinte rouge du sang. Le capitaine porte le coup de grâce d’un jet d’une précision… mortelle."
 agot_sailing.2028.a:0 "Plus qu’un capitaine, c’est un[host.Custom('FR_E')] peintre qui marie brillamment le rouge au bleu."
 agot_sailing.2028.b:0 "Une telle majesté ne devrait pas être ainsi meurtrie !"
 agot_sailing.2029.t:0 "Léviathan !"
 agot_sailing.2029.desc:0 "L’air marin est, comme à son habitude, vivifiant pour le corps et l’esprit, mais la douce traversée de l’azur prend une toute autre tournure lorsqu’au loin s'élève un panache d’eau, révélant dans son sillage une petite îlot de chair grise qui se déplace. De suite j’entends le mot « léviathan » être prononcé sur le pont et [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))], en [Select_CString(host.IsFemale,'marinière expérimentée qu’elle est','marin expérimenté qu’il est')], ordonne la chasse à cet imposant mastodonte des mers.\n\nMais tout expert qu’[host.Custom('FR_IlElle')] soit sur les eaux, la bête lui est supérieure et parvient à s’échapper…"
 agot_sailing.2029.a:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))|U] n’est point digne des louanges qu’[host.Custom('FR_IlElle')] suscite."
 agot_sailing.2030.t:0 "Léviathan !"
 agot_sailing.2030.desc:0 "L’air marin est, comme à son habitude, vivifiant pour le corps et l’esprit, mais la douce traversée de l’azur prend une toute autre tournure lorsqu’au loin s'élève un panache d’eau, révélant dans son sillage une petite îlot de chair grise qui se déplace. De suite j’entends le mot « léviathan » être prononcé, et alors que certains parmi l’équipage sont déjà sur le pied de guerre en prévision de la chasse qui s’annonce, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] décide de laisser la bête s’échapper.\n\n« Quel honneur y aurait-il à tuer si majestueuse créature ? » dit-[host.Custom('FR_IlElle')] avec une moue d’admiration."
 agot_sailing.2030.a:0 "Il est vrai ! Un spectacle majestueux que voici."
 agot_sailing.2030.b:0 "Qui parle d’honneur ? Une telle prise vaut son pesant d’or[Select_CString(ROOT.Char.HasTrait( GetTrait('rude') ), ', putain', '' )] !"
 agot_sailing.2031.t:0 "$agot_sailing.2004.t$"
 agot_sailing.2031.desc:0 "C'est une journée propice pour l’équipage, où météo favorable et soleil chatoyant incite chacun à s’occuper comme il l’entend. Mais la quiétude ne saurait durer…\n\n« Navire en approche ! » alerte le nid-de-pie, amenant [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] à se précipiter sur le bastingage pour ainsi scruter l’horizon. Il apparaît évident et rapidement qu’il s’agit là d’un navire pirate qui cherche à en découdre, en conséquence de quoi le capitaine ordonne à chacun de se mettre à son poste.\n\nLa lutte est aussi intense qu’éphémère. Les pirates, tous hardis qu’ils soient, sont mis en déroute, et repartent les mains vides et la queue entre les jambes !"
 agot_sailing.2031.a:0 "Et qu’on ne vous y reprenne pas, tas de crevure !"
 agot_sailing.2032.t:0 "$agot_sailing.2004.t$"
 agot_sailing.2032.desc:0 "C'est une journée propice pour l’équipage, où météo favorable et soleil chatoyant incite chacun à s’occuper comme il l’entend. Mais la quiétude ne saurait durer…\n\n« Navire en approche ! » alerte le nid-de-pie, amenant [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] à se précipiter sur le bastingage pour ainsi scruter l’horizon. Il apparaît évident et rapidement qu’il s’agit là d’un navire pirate qui cherche à en découdre, en conséquence de quoi le capitaine ordonne à chacun de se mettre à son poste.\n\nLa lutte est aussi intense qu’éphémère, mais notre équipage, tout vaillant qu’il soit, se retrouve submergé par le nombre. Le navire est dépouillé de toutes richesses, et après si cruelle humiliation, nous ne pouvons que nous réjouir d’être encore en vie lorsque les pirates repartent vers le lointain."
 agot_sailing.2032.a:0 "Qu’ils aillent pourrir dans [ROOT.Char.GetFaith.NegativeAfterLife] !"
 agot_sailing.2033.t:0 "$agot_sailing.2004.t$"
 agot_sailing.2033.desc:0 "C'est une journée propice pour l’équipage, où météo favorable et soleil chatoyant incite chacun à s’occuper comme il l’entend. Mais la quiétude ne saurait durer…\n\n« Navire en approche ! » alerte le nid-de-pie, amenant [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] à se précipiter sur le bastingage pour ainsi scruter l’horizon. Il apparaît évident et rapidement qu’il s’agit là d’un navire pirate qui cherche à en découdre, en conséquence de quoi le capitaine ordonne de hisser les voiles et de virer de bord, estimant nos chances plus élevées si l’on privilégie la fuite au combat.\n\nUne sage décision semble-t-il, car les pirates ne sont déjà plus qu’une vague silhouette dans le lointain…"
 agot_sailing.2033.a:0 "Hourra !"
 agot_sailing.2034.t:0 "$agot_sailing.2005.t$"
 agot_sailing.2034.desc:0 "La mer, au contraire de la terre, est mouvement. Elle se meut, elle s’agite, parfois même elle se déchaîne. La vigilance est toujours de mise, surtout lorsque les vagues se souviennent de leur nature profonde…\n\n« Un homme à la mer ! » entend-t-on tandis que des cris sont poussés depuis la surface, par quelqu’un qui remue ciel et terre pour que la mer ne l’engloutisse pas.\n\nNi une ni deux, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] s’arme d’impétuosité et plonge tête la première dans les eaux, avant de ressurgir triomphalement l’instant d’après."
 agot_sailing.2034.a:0 "Incroyable !"
 agot_sailing.2035.t:0 "$agot_sailing.2005.t$"
 agot_sailing.2035.desc:0 "La mer, au contraire de la terre, est mouvement. Elle se meut, elle s’agite, parfois même elle se déchaîne. La vigilance est toujours de mise, surtout lorsque les vagues se souviennent de leur nature profonde…\n\n« Un homme à la mer ! » entend-t-on tandis que des cris sont poussés depuis la surface, par quelqu’un qui remue ciel et terre pour que la mer ne l’engloutisse pas.\n\nNi une ni deux, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] s’arme d’impétuosité et plonge tête la première dans les eaux, mais malheureusement l’impétuosité du capitaine fait pâle figure face à celle des vagues, et déjà il n’y a plus signe du matelot…"
 agot_sailing.2035.a:0 "La mer est bien souvent sans pitié…"
 agot_sailing.2036.t:0 "$agot_sailing.2005.t$"
 agot_sailing.2036.desc:0 "La mer, au contraire de la terre, est mouvement. Elle se meut, elle s’agite, parfois même elle se déchaîne. La vigilance est toujours de mise, surtout lorsque les vagues se souviennent de leur nature profonde…\n\n« Un homme à la mer ! » entend-t-on tandis que des cris sont poussés depuis la surface, par quelqu’un qui remue ciel et terre pour que la mer ne l’engloutisse pas.\n\nComprenant l’urgence de la situation, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] dirige le sauvetage en multipliant les ordres, le tout avec l’efficacité nécessaire pour permettre le sauvetage du matelot passé par-dessus bord."
 agot_sailing.2036.a:0 "Voilà un capitaine digne de ce nom !"
 agot_sailing.2037.t:0 "$agot_sailing.2005.t$"
 agot_sailing.2037.desc:0 "La mer, au contraire de la terre, est mouvement. Elle se meut, elle s’agite, parfois même elle se déchaîne. La vigilance est toujours de mise, surtout lorsque les vagues se souviennent de leur nature profonde…\n\n« Un homme à la mer ! » entend-t-on tandis que des cris sont poussés depuis la surface, par quelqu’un qui remue ciel et terre pour que la mer ne l’engloutisse pas.\n\nComprenant l’urgence de la situation, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] se hâte de multiplier les ordres pour assurer le sauvetage, mais faute d’une bonne organisation, les vagues impétueuses et la pluie battante ont tôt fait de faire disparaître le matelot dans les eaux…"
 agot_sailing.2037.a:0 "[Select_CString(ROOT.Char.HasTrait( GetTrait('sadistic') ), 'Ah ah ah !', 'Il est déjà trop tard maintenant.' )]"
 agot_sailing.2038.t:0 "$agot_sailing.2005.t$"
 agot_sailing.2038.desc:0 "La mer, au contraire de la terre, est mouvement. Elle se meut, elle s’agite, parfois même elle se déchaîne. La vigilance est toujours de mise, surtout lorsque les vagues se souviennent de leur nature profonde…\n\n« Un homme à la mer ! » entend-t-on tandis que des cris sont poussés depuis la surface, par quelqu’un qui remue ciel et terre pour que la mer ne l’engloutisse pas.\n\n« Une leçon pour ceux qui oublient que la prudence est d’usage en mer » est la seule chose que daigne répondre [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))]. S’il en est parmi l’équipage pour contester ce choix, alors c’est une contestation qui se fait dans un mutisme total."
 agot_sailing.2038.a:0 "La mer ne pardonne pas l’imprudence…"
 agot_sailing.2040.t:0 "Des chieurs invétérés"
 agot_sailing.2040.desc:0 "Jusqu’à présent nos pérégrinations en mer se sont montrées plutôt avare en mésaventure, et je pourrais tout à fait me satisfaire qu’il en reste ainsi, pourtant, une grogne croissante se fait entendre parmi l'équipage : « À quand Essos ? » ; « C’est pour quand Essos ? » ; « Nous voulons en voir toujours plus ! »\n\nLorsque [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] finit par être exaspéré[host.Custom('FR_E')] des geignements toujours plus insistants, [host.Custom('FR_IlElle')] se décide à fermer quelques clapets : « Votre patience sera récompensée, ayez foi en moi ! » et l’équipage, prenant conscience qu'aucun soupir ne fera jamais gonfler les voiles d’un navire, fait acte de silence, mue par une prise de conscience."
 agot_sailing.2040.a:0 "La paix, de grâce !"
 agot_sailing.2041.t:0 "L’attente d’Essos devient trop longue…"
 agot_sailing.2041.desc:0 "Jusqu’à présent nos pérégrinations en mer se sont montrées plutôt avare en mésaventure, et je pourrais tout à fait me satisfaire qu’il en reste ainsi, pourtant, une grogne croissante se fait entendre parmi l'équipage : « À quand Essos ? » ; « C’est pour quand Essos ? » ; « Nous voulons en voir toujours plus ! »\n\nLorsque [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] finit par être exaspéré[host.Custom('FR_E')] des geignements toujours plus insistants, [host.Custom('FR_IlElle')] va pour fermer quelques clapets : « Votre patience sera récompensée, ayez foi en moi ! », mais aussi éloquent[host.Custom('FR_E')] qu’[host.Custom('FR_IlElle')] puisse être, nul n’en a cure et les gens ne cessent de radoter à l’infini."
 agot_sailing.2041.a:0 "Quand est-ce que nous connaîtrons la paix ?"
 agot_sailing.2042.t:0 "L’offrande"
 agot_sailing.2042.desc:0 "Le temps est capricieux. Capricieux de ne point nous faire hommage d’un peu de vent. Depuis plusieurs jours les voiles sont hissées, et [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] déplore qu’il n’y a pas eu la moindre rafale, pas la moindre brise pour venir les gonfler et nous emporter.\n\nCette situation propice à l’inquiétude amène [first_mate.GetFirstNameNoTooltip] à en discuter avec le capitaine, lequel décide, sur les conseils de son second, de préparer une offrande pour gagner les faveurs divines.\n\n« Puisse [host.GetFaith.WaterGodName] accepter cet humble tribut », l’entend-on conjurer."
 agot_sailing.2042.a:0 "[Select_CString(ROOT.Char.HasTrait( GetTrait('cynical') ), 'S’il était si simple d’obtenir faveur des dieux, le monde aurait son content…', 'Que pourrions-nous faire d’autre de toute façon ?' )]"
 agot_sailing.2043.t:0 "Pour qui souffle le calme"
 agot_sailing.2043.desc:0 "Le temps est capricieux. Capricieux de ne point nous faire hommage d’un peu de vent. Depuis plusieurs jours les voiles sont hissées, et [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] déplore qu’il n’y a pas eu la moindre rafale, pas la moindre brise pour venir les gonfler et nous emporter.\n\nCette situation propice à l’inquiétude amène [first_mate.GetFirstNameNoTooltip] à en discuter avec le capitaine, lequel décide, en dépit des conseils de son second, de ne point tenir compte de ce qu’il considère n’être que des élucubrations de l’équipage à propos d’une soi-disant colère [host.GetFaith.WaterGodNamePossessive].\n\n« Le prochain qui colporte ces racontars passera par-dessus bord ! » [host.Custom('lmf_neg_reaction_type')]."
 agot_sailing.2043.a:0 "Espérons que le vent se lève…"
 agot_sailing.2044.t:0 "Un argument imparable"
 agot_sailing.2044.desc:0 "Le temps est capricieux. Capricieux de ne point nous faire hommage d’un peu de vent. Depuis plusieurs jours les voiles sont hissées, et [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] déplore qu’il n’y a pas eu la moindre rafale, pas la moindre brise pour venir les gonfler et nous emporter.\n\nCette situation propice à l’inquiétude amène [first_mate.GetFirstNameNoTooltip] à en discuter avec le capitaine à propos d’une éventuelle colère [host.GetFaith.WaterGodNamePossessive] que l’équipage se serait attirée.\n\nCe à quoi [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] argue sobrement : « Une telle colère serait autrement moins clémente qu’une absence de vent » — et l’affaire est close sans que nul n’y trouve à redire."
 agot_sailing.2044.a:0 "Tant de sagesse en si peu de mots."
 agot_sailing.2045.t:0 "$agot_sailing.2010.t$"
 agot_sailing.2045.desc:0 "Un ciel dégagé, un vent favorable, une navigation aisée et un moral au beau fixe, je pense qu'aucun capitaine ne pourrait espérer journée plus propice, mais hélas, en un instant [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] voit sa bonne humeur soufflé par un cri d’alerte : « Attention ! »\n\nUn des membres d’équipage se retrouve étendu sur le pont au milieu d’une cargaison, renversée par une maladresse ou une imprudence quelconque, avec la jambe tournée dans un angle guère souhaitable. « Aaah ! Ça fait un putain de mal de chien de tous les diables ! » vocifère-t-[sailor.Custom('FR_IlElle')], attendant que l’on vienne lui prêter main forte, ce que daigne faire le capitaine, remettant avec succès le membre dans un état plus convenable."
 agot_sailing.2045.a:0 "Chapeau bas, capitaine."
 agot_sailing.2046.t:0 "$agot_sailing.2010.t$"
 agot_sailing.2046.desc:0 "Un ciel dégagé, un vent favorable, une navigation aisée et un moral au beau fixe, je pense qu'aucun capitaine ne pourrait espérer journée plus propice, mais hélas, en un instant [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] voit sa bonne humeur soufflé par un cri d’alerte : « Attention ! »\n\nUn des membres d’équipage se retrouve étendu sur le pont au milieu d’une cargaison, renversée par une maladresse ou une imprudence quelconque, avec la jambe tournée dans un angle guère souhaitable. « Aaah ! Ça fait un putain de mal de chien de tous les diables ! » vocifère-t-[sailor.Custom('FR_IlElle')], attendant que l’on vienne lui prêter main forte, ce que daigne faire le capitaine, au grand dam du marin qui voit sa jambe en plus piteuse état qu’elle ne l’était avant l’intervention."
 agot_sailing.2046.a:0 "Ouch, ça doit faire mal…"
 agot_sailing.2047.t:0 "$agot_sailing.2010.t$"
 agot_sailing.2047.desc:0 "Un ciel dégagé, un vent favorable, une navigation aisée et un moral au beau fixe, je pense qu'aucun capitaine ne pourrait espérer journée plus propice, mais hélas, en un instant [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] voit sa bonne humeur soufflé par un cri d’alerte : « Attention ! »\n\nUn des membres d’équipage se retrouve étendu sur le pont au milieu d’une cargaison, renversée par une maladresse ou une imprudence quelconque, avec la jambe tournée dans un angle guère souhaitable. « Aaah ! Ça fait un putain de mal de chien de tous les diables ! » vocifère-t-[sailor.Custom('FR_IlElle')], attendant que l’on vienne lui prêter main forte — chose que le capitaine interdit séant tout en se raillant du pauvre hère : « Que cela vous serve de leçon, imbécile. »"
 agot_sailing.2047.a:0 "Le capitaine ne mâche guère ses mots."
 agot_sailing.2048.t:0 "$agot_sailing.2010.t$"
 agot_sailing.2048.desc:0 "Un ciel dégagé, un vent favorable, une navigation aisée et un moral au beau fixe, je pense qu'aucun capitaine ne pourrait espérer journée plus propice, mais hélas, en un instant [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] voit sa bonne humeur soufflé par un cri d’alerte : « Attention ! »\n\nUn des membres d’équipage se retrouve étendu sur le pont au milieu d’une cargaison, renversée par une maladresse ou une imprudence quelconque, avec la jambe tournée dans un angle guère souhaitable. « Aaah ! Ça fait un putain de mal de chien de tous les diables ! » vocifère-t-[sailor.Custom('FR_IlElle')], attendant que l’on vienne lui prêter main forte, ce qu’incite maladroitement le capitaine à faire en beuglant mécaniquement : « Que quelqu’un fasse quelque chose ! »"
 agot_sailing.2048.a:0 "Je n’aimerais pas être à sa place…"
 agot_sailing.2049.t:0 "$agot_sailing.2011.t$"
 agot_sailing.2049.desc:0 "Le port tout juste disparu au-delà de la ligne d’horizon, et déjà un épais voile grisâtre nous engloutit, comme une bête affamée cherchant à se repaître de marins imprudents. Le bleu du ciel n’est déjà plus qu’un gris terne, comme l’est le bleu de la mer. L’inconnu évoqué par le lointain n’est plus un appel à l’aventure, mais un danger indicible.\n\nMais plus que le navire, c’est le capitaine qui semble perdu. [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))|U] reste figé[host.Custom('FR_E')] sur le pont sans piper mot, certainement l’esprit égaré dans les contrées de l’incertitude — quand finalement, un ordre est proféré : « Maintenez le cap ! »\n\nL’équipage s’exécute et le cap est maintenu, semble-t-il dans l’espoir qu’entre le brouillard et nous, lui cédera en premier. Un pari risqué, mais payant, car bientôt je vois poindre le bleu, et avec lui, le soulagement…"
 agot_sailing.2049.a:0 "Formidable !"
 agot_sailing.2050.t:0 "$agot_sailing.2011.t$"
 agot_sailing.2050.desc:0 "Le port tout juste disparu au-delà de la ligne d’horizon, et déjà un épais voile grisâtre nous engloutit, comme une bête affamée cherchant à se repaître de marins imprudents. Le bleu du ciel n’est déjà plus qu’un gris terne, comme l’est le bleu de la mer. L’inconnu évoqué par le lointain n’est plus un appel à l’aventure, mais un danger indicible.\n\nMais plus que le navire, c’est le capitaine qui semble perdu. [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))|U] reste figé[host.Custom('FR_E')] sur le pont sans piper mot, certainement l’esprit égaré dans les contrées de l’incertitude — quand finalement, un ordre est proféré : « Maintenez le cap ! »\n\nL’équipage s’exécute et le cap est maintenu, semble-t-il dans l’espoir qu’entre le brouillard et nous, lui cédera en premier. Un pari risqué, et qui plus est, guère payant. Des heures et des heures durant, le gris laisse place à toujours plus de gris…"
 agot_sailing.2050.a:0 "[ROOT.Char.Custom('CulturalCurse')|U]…"
 agot_sailing.2051.t:0 "$agot_sailing.2011.t$"
 agot_sailing.2051.desc:0 "Le port tout juste disparu au-delà de la ligne d’horizon, et déjà un épais voile grisâtre nous engloutit, comme une bête affamée cherchant à se repaître de marins imprudents. Le bleu du ciel n’est déjà plus qu’un gris terne, comme l’est le bleu de la mer. L’inconnu évoqué par le lointain n’est plus un appel à l’aventure, mais un danger indicible.\n\nMais plus que le navire, c’est le capitaine qui semble perdu. [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))|U] reste figé[host.Custom('FR_E')] sur le pont sans piper mot, certainement l’esprit égaré dans les contrées de l’incertitude — quand finalement, un ordre est proféré : « Virez de bord ! »\n\nPlutôt que de se risquer à un vœu pieux et d’espérer que le brouillard se lèvera, le capitaine nous fait contourner le brouillard, quitte à sacrifier un temps précieux…"
 agot_sailing.2051.a:0 "Une sage décision, pour sûr."
 agot_sailing.2052.t:0 "$agot_sailing.2011.t$"
 agot_sailing.2052.desc:0 "Le port tout juste disparu au-delà de la ligne d’horizon, et déjà un épais voile grisâtre nous engloutit, comme une bête affamée cherchant à se repaître de marins imprudents. Le bleu du ciel n’est déjà plus qu’un gris terne, comme l’est le bleu de la mer. L’inconnu évoqué par le lointain n’est plus un appel à l’aventure, mais un danger indicible.\n\nTout cela pourrait, à juste titre, en effrayé plus d'un, mais [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))], [Select_CString(host.IsFemale,'en marinière d’exception','en bon marin aguerri')], ne se laisse pas décontenancer si aisément :\n\n« Un peu de grisaille ne m’effraie point, j’en ai vu d’autres », argue-t-[host.Custom('FR_IlElle')] sans craindre le moins du monde l'épais brouillard…"
 agot_sailing.2052.a:0 "[host.Custom('FR_IlElle')|U] sait sûrement ce qu'[host.Custom('FR_IlElle')] fait…"
 agot_sailing.2100.t:0 "Bercé[ROOT.Char.Custom('FR_E')] par la mer"
 agot_sailing.2100.desc:0 "Le navire poursuit sa course sur les flots sans fin, tandis que je prends une profonde inspiration pour inviter l’air marin à venir requinquer mes poumons, les yeux clos pour mieux sentir chaque bribe de vent, aussi infime soit-elle.\n\nJe sens l’océan me parcourir. Sa force imprégnant mon corps et sa quiétude apaisant mon âme. Si tempête il y a en mon for intérieur, elle est silenciée par le bruit des vagues, le son de l’eau, le chant de l’azur.\n\n#defender_color — Tout est d’un calme parfait : la mer ; mon esprit —#!"
 agot_sailing.2100.a:0 "#defender_color *Inspirer à nouveau*#!"
 agot_sailing.2101.t:0 "La croisière s’amuse"
 agot_sailing.2101.opening:0 "Le temps est au beau fixe, et les côtes que longent le navire dessinent un paysage qui attire tous les regards — excepté le mien. Moi je n’ai d’yeux que pour [woo_target.GetFirstName], et des pensées affriolantes font vaciller ma tête, bien plus que les vagues ne le pourront jamais."
 agot_sailing.2101.married:0 "Son épou[woo_target.GetPrimarySpouse.Custom('FR_XSe')], [woo_target.GetPrimarySpouse.Custom('FR_le_Char_Pi')][woo_target.GetPrimarySpouse.GetTitledFirstName], étant distrait[woo_target.GetPrimarySpouse.Custom('FR_E')], c'est l’occasion idéale :"
 agot_sailing.2101.married_absent:0 "Son épou[woo_target.GetPrimarySpouse.Custom('FR_XSe')], [woo_target.GetPrimarySpouse.Custom('FR_le_Char_Pi')][woo_target.GetPrimarySpouse.GetTitledFirstName], n’étant pas là pour garder un œil sur [woo_target.Custom('FR_LuiElle')], c'est l’occasion idéale :"
 agot_sailing.2101.currentspouse:0 "C'est l’occasion idéale de gagner son cœur :"
 agot_sailing.2101.desc:0 "\n\n« Comment trouvez-vous ce voyage en mer, très ch[woo_target.Custom('FR_ErEre')] ? » Ma voix emprunte à la mer, sa quiétude apaisante.\n\n« La vue est agréable » rétorque-t-[woo_target.Custom('FR_IlElle')] en me faisant cadeau d’un sourire. L’idée me vient que si je titille son intérêt, j’arriverais à obtenir de sa part une générosité autrement moins formelle qu’une politesse bienséante…"
 agot_sailing.2101.a:0 "La haute mer, c’est l’appel à l’aventure, n’est-ce pas ?"
 agot_sailing.2101.a.tt:0 "#F Émoustiller le côté actif de [woo_target.GetFirstNameNoTooltip].#!"
 agot_sailing.2101.b:0 "Une belle vue et une bonne compagnie, que demander de plus ?"
 agot_sailing.2101.b.tt:0 "#F Émoustiller le côté social de [woo_target.GetFirstNameNoTooltip].#!"
 agot_sailing.2101.c:0 "Rappelez-moi de féliciter l’équipage pour ce si plaisant voyage."
 agot_sailing.2101.c.tt:0 "#F Émoustiller le côté compatissant de [woo_target.GetFirstNameNoTooltip].#!"
 agot_sailing.2101.d:0 "Tout le monde n’a pas conscience du labeur qu’exige la bonne tenue d’un navire."
 agot_sailing.2101.d.tt:0 "#F Émoustiller le côté assidu de [woo_target.GetFirstNameNoTooltip].#!"
 agot_sailing.2101.e:0 "Certains ne voient dans la mer que la liberté, mais moi j’y vois l’opulence."
 agot_sailing.2101.e.tt:0 "#F Émoustiller l’intérêt pour l’intendance de [woo_target.GetFirstNameNoTooltip].#!"
 agot_sailing.2102.reply_sailor:0 "« $agot_sailing.2101.a$ »\n\n"
 agot_sailing.2102.reply_socialite:0 "« $agot_sailing.2101.b$ »\n\n"
 agot_sailing.2102.reply_pity:0 "« $agot_sailing.2101.c$ »\n\n"
 agot_sailing.2102.reply_wastrel:0 "« $agot_sailing.2101.d$ »\n\n"
 agot_sailing.2102.reply_steward:0 "« $agot_sailing.2101.e$ »\n\n"
 agot_sailing.2102.opening:0 "Le temps est au beau fixe, et les côtes que longent le navire dessinent un paysage qui attire tous les regards. C’est alors que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('woo_actor'))] se décide à venir converser."
 agot_sailing.2102.sailor:0 "$agot_sailing.2102.reply_sailor$Que je sois damné[ROOT.Char.Custom('FR_E')] si son sourire n’est pas sans arrière-pensée, mais je partage son goût pour l’aventure."
 agot_sailing.2102.socialite:0 "$agot_sailing.2102.reply_socialite$Que je sois damné[ROOT.Char.Custom('FR_E')] si son sourire n’est pas sans arrière-pensée, mais je partage son goût pour la bonne compagnie."
 agot_sailing.2102.pity:0 "$agot_sailing.2102.reply_pity$Que je sois damné[ROOT.Char.Custom('FR_E')] si son sourire n’est pas sans arrière-pensée, mais je partage son empathie pour ceux que l’on oublie trop facilement."
 agot_sailing.2102.wastrel:0 "$agot_sailing.2102.reply_wastrel$Que je sois damné[ROOT.Char.Custom('FR_E')] si son sourire n’est pas sans arrière-pensée, mais je partage sa dilection pour le travail bien fait."
 agot_sailing.2102.steward:0 "$agot_sailing.2102.reply_steward$Que je sois damné[ROOT.Char.Custom('FR_E')] si son sourire n’est pas sans arrière-pensée, mais je gage que nous partageons une certaine vision du monde en commun."
 agot_sailing.2102.fallback:0 "Que pourrais-je bien lui répondre ?"
 agot_sailing.2102.a:0 "Je lui découvre un charme que je ne soupçonnais point."
 intent_sailing_conversation:0 "Au cours d’un voyage en mer, [TARGET_CHARACTER.Custom('FR_le_Char_U_Pi')][TARGET_CHARACTER.GetShortUIName] [Select_CString(CHARACTER.IsLocalPlayer,'vos ','')][Select_CString(TARGET_CHARACTER.IsLocalPlayer, 'avez', 'a')] trouvé[CHARACTER.LocalPlayerString('', 'Loc_FR_le_GetShortUIName')] plus attrayant[CHARACTER.Custom('FR_E')] que le voyage lui-même."
 agot_sailing.2103.sailor:0 "$agot_sailing.2102.reply_sailor$L’embarras est si fort que je ne peux l’empêcher de grimacer mon visage…"
 agot_sailing.2103.socialite:0 "$agot_sailing.2102.reply_socialite$L’embarras est si fort que je ne peux l’empêcher de grimacer mon visage…"
 agot_sailing.2103.pity:0 "$agot_sailing.2102.reply_pity$L’embarras est si fort que je ne peux l’empêcher de grimacer mon visage…"
 agot_sailing.2103.wastrel:0 "$agot_sailing.2102.reply_wastrel$L’embarras est si fort que je ne peux l’empêcher de grimacer mon visage…"
 agot_sailing.2103.steward:0 "$agot_sailing.2102.reply_steward$L’embarras est si fort que je ne peux l’empêcher de grimacer mon visage…"
 agot_sailing.2103.fallback:0 "[woo_actor.Custom('FR_IlElle')|U] m'adresse un simple sourire et l’embarras est si fort que je ne peux l’empêcher de grimacer mon visage…"
 agot_sailing.2103.a:0 "C’est d’un risible…"
 agot_sailing.2104.reply:0 "Je suis fort aise de voir que mon bon mot a eu son petit effet sur [woo_target.GetFirstName]"
 agot_sailing.2104.sailor:0 "$agot_sailing.2104.reply$, [woo_target.Custom('FR_LequelLaquelle')] opine du chef avec pétulance."
 agot_sailing.2104.socialite:0 "$agot_sailing.2104.reply$, [woo_target.Custom('FR_LequelLaquelle')] me lorgne d’un œil autrement plus… chaleureux."
 agot_sailing.2104.pity:0 "$agot_sailing.2104.reply$, [woo_target.Custom('FR_LequelLaquelle')] semble apprécier qu’il y en ait encore pour s’enquérir des braves qui triment à la sueur de leur front."
 agot_sailing.2104.wastrel:0 "$agot_sailing.2104.reply$, [woo_target.Custom('FR_LequelLaquelle')] apprécie ma perspicacité."
 agot_sailing.2104.steward:0 "$agot_sailing.2104.reply$, [woo_target.Custom('FR_IlElle')]-même fort aise de se savoir aux côtés de quelqu'un qui a l’œil pour ces choses-là."
 agot_sailing.2104.fallback:0 "$agot_sailing.2104.reply$, [woo_target.Custom('FR_LequelLaquelle')] ne feint pas le moins du monde de me dévorer du regard."
 agot_sailing.2104.desc:0 "\n\nLorsqu’[woo_target.Custom('FR_IlElle')] prend congé, le zèle qu’[woo_target.Custom('FR_IlElle')] met dans ses politesses me laisse comprendre que le chemin vers son cœur est déjà tout tracé."
 agot_sailing.2104.a:0 "[woo_target.Custom('FR_IlElle')|U] sera mie[woo_target.Custom('FR_NNne')], foi de [ROOT.Char.GetHouse.GetNameNoTooltip] !"
 agot_sailing.2105.reply:0 "Je doute d’avoir su trouver les bons mots"
 agot_sailing.2105.sailor:0 "$agot_sailing.2105.reply$ à en juger par ses yeux qui font tout pour m’éviter, nous mettant l’un[ROOT.Char.Custom2('FR_E', SCOPE.sC('woo_target'))] et l’autre dans l’embarras jusqu’à la délivrance où [woo_target.Custom('FR_IlElle')] se décide à prendre congé."
 agot_sailing.2105.socialite:0 "$agot_sailing.2105.reply$ quand je vois que ses yeux en seraient presque révulsés de dédain, lesquels ne daigneront toujours pas m’accorder plus de considération au moment de prendre congé."
 agot_sailing.2105.pity:0 "$agot_sailing.2105.reply$ d’après l’attitude impassible qu’[woo_target.Custom('FR_IlElle')] manifeste jusqu’au moment de prendre congé."
 agot_sailing.2105.wastrel:0 "$agot_sailing.2105.reply$, [woo_target.GetFirstNameNoTooltip] semblant totalement absent[woo_target.Custom('FR_E')], n’écoutant rien de ce que je puis dire et ce jusqu’au moment de prendre congé."
 agot_sailing.2105.steward:0 "$agot_sailing.2105.reply$, [woo_target.GetFirstNameNoTooltip] semblant préférer lorgner le lointain comme pour éviter d’avoir à échanger quelques paroles que ce soit."
 agot_sailing.2105.fallback:0 "$agot_sailing.2105.reply$ voyant à quel point [Select_CString(woo_target.IsFemale,'la malheureuse','le malheureux')] semble si prompt[woo_target.Custom('FR_E')] à vouloir prendre congé."
 agot_sailing.2105.desc:0 "\n\nEt me voilà, pauvre âme esseulée que je suis, à me questionner sur mes erreurs avec l’azur pour tout confident…"
 agot_sailing.2105.a:0 "Mon cœur est comme un navire à la dérive…"
 agot_sailing.2201.t:0 "La cible"
 agot_sailing.2201.desc:0 "En partance pour la haute mer, les contrées d’azur infinies s’ouvrent à nous, mais aussi belle puisse être la mer, je n’ai d’yeux que pour [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('murder_target'))] — guignant ma cible, tel le requin qui lorgne sa proie…"
 agot_sailing.2201.agent:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('murder_schemer'))|U] n’est point ici, mais les occasions savent se faire aussi vivaces que le liseron."
 agot_sailing.2201.a:0 "Encore un peu de patience…"
 sailing_murder_accomplice_tt:0 "[THIS.Char.Custom('FR_le_Char_U_Pi')|U][THIS.Char.GetShortUIName|U] [Select_CString(THIS.Char.IsLocalPlayer, 'tenterez', 'tentera')] d’assassiner [murder_target.Custom('FR_le_Char_U_Pi')][murder_target.GetShortUIName]"
 agot_sailing.2202.opening:0 "Devenu[ROOT.Char.Custom('FR_E')] l’ombre de [murder_target.GetFirstName] en toute occasion, les journées me paraissent interminables, mais c’est un maigre prix à payer pour ne pas me rendre tributaire de la chance dans cette entreprise ô combien périlleuse.\n\nSur le tard, le moment propice semble finalement poindre lorsque le navire se fait l’hôte d'une brume épaisse par une fraîche nuit sans lune aucune. L’insouciant[murder_target.Custom('FR_E')] se décide alors à se retirer dans sa cabine, loin de tout regard — excepté celui qui l’épie sur le pas de sa porte, laissée innocemment entrouverte…"
 agot_sailing.2202.desc:0 "\n\nMa silhouette avalée dans la pénombre et mes bruits de pas étouffés par le craquement du bois, je n’aurais aucun mal à m’approcher…"
 agot_sailing.2202.a:0 "Un coup net et sans bavure…"
 agot_sailing.2202.a.tt:0 "#EMP L’occasion est trop belle pour ne pas la saisir !#!"
 agot_sailing.2202.b:0 "Patience. Patience…"
 agot_sailing.2202.b.tt:0 "#EMP La mort est certaine, le moment ne l’est pas.#!"
 sailing_kill_murder_missed:0 "La chance sourit pour [murder_target.GetFirstNameOrMeNoTooltip]"
 sailing_kill_murder_injured:0 "[murder_target.GetFirstNameOrMeNoTooltip] subit un #italic malencontreux#! accident"
 sailing_kill_murder_killed:0 "[murder_target.GetFirstNameOrMeNoTooltip] subit un trépas des plus #italic tragiques#!"
 sailing_kill_murder_escape:0 "[murder_target.GetFirstNameOrMeNoTooltip|U] [Select_CString(murder_target.IsLocalPlayer,'parvenez à vous échapper','parvient à s’échapper')]"
 sailing_target_attendee_killed_tt:0 "@death_icon! [murder_target.Custom('FR_le_Char_U_Pi')|U][murder_target.GetShortUIName|U] meurt"
 sailing_target_attendee_injured_chance_tt:0 "[murder_target.Custom('FR_le_Char_U_Pi')|U][murder_target.GetShortUIName|U] [Select_CString(murder_target.IsLocalPlayer,'pourriez','pourrait')] être blessé[murder_target.Custom('FR_E')]"
 agot_sailing.2203.desc:0 "Mon action est aussi vive et soudaine qu’une rafale de vent. La lame patiemment aiguisée réfléchit la lumière d’une flamme mourante, et juste avant que je ne porte le coup fatal, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('murder_target'))] remarque ma présence…"
 agot_sailing.2203.agent:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('abduct_schemer'))|U] attend de moi que mort soit donnée, alors mort sera donnée…"
 agot_sailing.2203.success:0 "\n\n« Saloperie de [ROOT.Char.Custom('InsultNoun')] de #warning margh...#! » Ses dernières paroles me vont droit au cœur, comma ma lame dans le sien, et rapidement, l’imbécile s’étouffe plus qu’[ROOT.Char.Custom('FR_IlElle')] ne s’exprime, ses mots se noyant dans son propre son sang…\n\nLa basse besogne accomplie, je m’empresse d’effacer au mieux mes traces, et de jeter le corps à l’eau pour laisser la mer terminer le travail…"
 agot_sailing.2203.failure:0 "\n\n« Sale ordure ! » vocifère-t-[murder_target.Custom('FR_IlElle')] en parvenant, par adresse ou par chance, à échapper au furieux baiser du fer.\n\nProfitant de la situation, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('murder_target'))] atteint la porte et s’échappe, me laissant décontenancé[ROOT.Char.Custom('FR_E')] par la situation, à craindre les conséquences d’une telle foirade !"
 agot_sailing.2203.a:0 "Ne reste plus qu’à retourner dans ma cabine…"
 agot_sailing.2203.b:0 "Par [ROOT.Char.GetFaith.NegativeAfterLife] !"
 agot_sailing.2204.t:0 "Un cri dans l’océan"
 agot_sailing.2204.desc:0 "Pris[ROOT.Char.Custom('FR_E')] d’une fatigue soudaine le soir venu, je m’en vais profiter du confort de ma cabine avant d’entreprendre un paisible voyage pour le royaume des songes. Mais avant que partance soit entreprise, un bruit inhabituel attire mon attention, lequel attire mon regard et dévoile un funeste spectacle : [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('murder_actor'))], une arme à la main !"
 agot_sailing.2204.success:0 "\n\nJe conjure toutes les forces qui m’ont été accordées par [ROOT.Char.GetFaith.WarGodNamePossessive] pour échapper à la mort, mais le métal froid en décide autrement.\n\nJ’aurais aimé voir une dernière fois l’azur de l'eau et du ciel, mais dans cette lugubre cabine imbibée de sang, je repose dans un rouge familièrement désagréable…"
 agot_sailing.2204.failure:0 "\nJe vois la mort fondre sur moi sous l’apparence d'une lame vindicative. Lame que j’évite, à la faveur de mon adresse ou de la chance, avant de me diriger hâtivement vers la porte et regagner le pont pour échapper à mon assaillant[murder_actor.Custom('FR_E')], m’époumonant à cor et à cri en quête de quiconque pourrait me venir en aide…"
 agot_sailing.2204.a:0 "#warning …#!"
 agot_sailing.2204.b:0 "À l’assassin ! À l’assassin !"
 sailing_ends_tt:2 "Le [GetActivityType('activity_agot_sailing').GetName|l] prend fin"
 agot_sailing.2301.t:1 "Un brin de causette"
 agot_sailing.2301.desc:0 "Notre traversée sur les infinis bleutés connaît une période de grâce bénie par un soleil rayonnant et une mer des plus calmes. C’est dans cette idylle maritime que je me décide à aborder [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('befriend_target'))] :\n\n« Les marins de tout horizon nous envieraient pareille journée. »\n\nUne entrée en matière convenue, mais qui a le mérite de [Select_CString(befriend_target.IsFemale,'la rendre réceptive','le rendre réceptif')] : « Certes. »"
 agot_sailing.2302.reply_sailor:0 "« $agot_sailing.2101.a$ »\n\n"
 agot_sailing.2302.reply_pity:0 "« $agot_sailing.2101.c$ »\n\n"
 agot_sailing.2302.reply_wastrel:0 "« $agot_sailing.2101.d$ »\n\n"
 agot_sailing.2302.reply_steward:0 "« $agot_sailing.2101.e$ »\n\n"
 agot_sailing.2302.opening:0 "Notre traversée sur les infinis bleutés connaît une période de grâce bénie par un soleil rayonnant et une mer des plus calmes. Et c’est dans cette idylle maritime que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('befriend_actor'))] m’aborde chaleureusement :"
 agot_sailing.2302.sailor:0 "$agot_sailing.2302.reply_sailor$Ma foi, qui pourrait nier une telle évidence ?"
 agot_sailing.2302.pity:0 "$agot_sailing.2302.reply_pity$Il est vrai que trop souvent ceux qui triment sont les grands oubliés des grandes réussites dans l’Histoire."
 agot_sailing.2302.wastrel:0 "$agot_sailing.2302.reply_wastrel$Ma foi, qui pourrait nier une telle évidence ?"
 agot_sailing.2302.steward:0 "$agot_sailing.2302.reply_steward$Une telle perspicacité est à saluer."
 agot_sailing.2302.fallback:0 "Que pourrais-je bien lui répondre ?"
 agot_sailing.2302.a:0 "Les grands esprits se rencontrent, semble-t-il."
 agot_sailing.2303.opening:0 "Notre traversée sur les infinis bleutés connaît une période de grâce bénie par un soleil rayonnant et une mer des plus calmes. Et c’est dans cette idylle maritime que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('befriend_actor'))] choisit de venir m’aborder."
 agot_sailing.2303.sailor:0 "$agot_sailing.2302.reply_sailor$[befriend_actor.Custom('FR_SilSielle')|U] le dit…"
 agot_sailing.2303.pity:0 "$agot_sailing.2302.reply_pity$Qui peut bien s’en soucier ?"
 agot_sailing.2303.wastrel:0 "$agot_sailing.2302.reply_wastrel$Et peu s’en soucie, à vrai dire."
 agot_sailing.2303.steward:0 "$agot_sailing.2302.reply_steward$Tant mieux pour [befriend_actor.Custom('FR_LuiElle')]…"
 agot_sailing.2303.fallback:0 "Après maintes banalités sans éclat, il apparaît évident qu’[befriend_actor.Custom('FR_IlElle')] mise sur son sourire plus que sur sa verve."
 agot_sailing.2303.a:0 "*Soupirer*"
 agot_sailing.2304.reply:0 "Je suis fort aise de me découvrir quelques points communs avec [befriend_target.GetFirstName]"
 agot_sailing.2304.sailor:0 "$agot_sailing.2304.reply$, et plus encore de converser avec [woo_target.Custom('FR_LuiElle')] à propos de la vie de marin, tant nous semblons nous entendre sur tout."
 agot_sailing.2304.pity:0 "$agot_sailing.2304.reply$, notamment notre inquiétude envers les petites gens."
 agot_sailing.2304.wastrel:0 "$agot_sailing.2304.reply$, notamment notre goût prononcé pour le travail bien fait."
 agot_sailing.2304.steward:0 "$agot_sailing.2304.reply$, [befriend_target.Custom('FR_LuiElle')] qui est si désireu[befriend_target.Custom('FR_XSe')] de converser encore et encore à propos des moult bienfaits que peut apporter la mer."
 agot_sailing.2304.fallback:0 "$agot_sailing.2304.reply$, nos échanges étant mutuellement appréciables."
 agot_sailing.2304.desc:0 "\n\nCette belle journée ne saurait se terminer alors que de nombreuses heures peuvent encore être partagées en si bonne compagnie !"
 agot_sailing.2304.a:0 "Assurément le début d’une belle amitié."
 agot_sailing.2305.reply:0 "Je doute d’avoir su trouver les bons mots"
 agot_sailing.2305.sailor:0 "$agot_sailing.2305.reply$ à en juger par ses sourires à demi-gênés, ses raclements de gorge intempestifs et ses tentatives désespérées d’écourter autant que possible le moindre échange de mots."
 agot_sailing.2305.pity:0 "$agot_sailing.2305.reply$ à en juger par le soufflement de nez qu’[befriend_target.Custom('FR_IlElle')] daigne m’accorder pour toute réponse."
 agot_sailing.2305.wastrel:0 "$agot_sailing.2305.reply$ à en juger par son regard des plus perplexe."
 agot_sailing.2305.steward:0 "$agot_sailing.2305.reply$ d’après le désintérêt total qu’[befriend_target.Custom('FR_IlElle')] manifeste à l’égard de notre conversation."
 agot_sailing.2305.fallback:0 "$agot_sailing.2305.reply$ quand je constate qu’[befriend_target.Custom('FR_IlElle')] n’a strictement rien à répondre à tout ce qui peut sortir de ma bouche."
 agot_sailing.2305.desc:0 "\n\nLorsque la gêne atteint son pinacle, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('befriend_target'))] se décide à aller quérir meilleure compagnie à l’autre bout du navire, me laissant avec la mer pour seule oreille prêtée…"
 agot_sailing.2305.a:0 "Triste bévue…"
 sailing_woo_success_key_title:0 "$agot_sailing.2301.t$"
 sailing_woo_failure_key_title:0 "$agot_sailing.2301.t$"
 sailing_murder_restrain_key_title:0 "$agot_sailing.2301.t$"
 sailing_kill_murder_killed_title:0 "$agot_sailing.2301.t$"
 sailing_kill_murder_missed_title:0 "$agot_sailing.2301.t$"
 sailing_befriend_success_key_title:0 "$agot_sailing.2301.t$"
 sailing_befriend_failure_key_title:0 "$agot_sailing.2301.t$"
 agot_sailing.3100.t:0 "Un itinéraire pour Valyria"
 agot_sailing.3100.desc:0 "[first_mate.GetFirstNameNoTooltip] déborde d’excitation, et celle-ci se transmet au reste de l’équipage, qui s’empresse de déployer les voiles et de lever l’ancre.\n\nLe soleil inonde ma cabine et met en lumière la pile de cartes soigneusement étalée ; #italic la Mer d’Été#!, #italic le Golfe de Douleur#!, #italic la Mer Fumeuse#!, tous ces noms semblent graviter autour de la principale intéressée : l’Antique, mais désormais maudite, Valyria. Ravagée par le Fléau, celui-ci a surgi de nulle part sans jamais véritablement disparaître. La région en porte encore les stigmates, et nombreux sont ceux qui ont disparu dans ces contrées désolées. #italic Oui très nombreux…#!\n\n« Montrez-nous la voie, capitaine » me dit [first_mate.GetFirstNameNoTooltip], qui par la même, m’extirpe du dédale brumeux de mes pensées."
 agot_sailing.3100.a:0 "Sans un bon itinéraire, nous sommes déjà morts…"
 agot_sailing.3100.a.success:0 "Vous parvenez à tracer un itinéraire"
 agot_sailing.3100.a.success.tt:0 "Vous parvenez à tracer un itinéraire sûr."
 agot_sailing.3100.a.failure.tt:0 "Vous ne parvenez pas à tracer un itinéraire sûr."
 agot_sailing.3101.t:0 "Un itinéraire pour Valyria"
 agot_sailing.3101.desc:0 "Lorsque vient le moment d’évoquer Valyria, tracer un itinéraire #bold sûr#! prend des allures d’énigme insoluble, et pour quiconque se butte contre celle-ci, ne reste que l’abandon ou la mort. Mais des heures passées à recouper les cartes aux informations en ma possession me permettent désormais de percer à travers les brumes d’incertitudes :\n\n« Nous longerons ces côtes, » j’affirme du bout de mon doigt traçant un cap, « puis nous ferons voile vers la Mer Fumeuse. De là, nous atteindrons les Quatorze Flammes. » Armé[ROOT.Char.Custom('FR_E')] d’une plume, je griffonne ça et là, plaçant diverses annotations pour marquer par l’encre ma certitude désormais indélébile."
 agot_sailing.3101.a:0 "Valyria, nous voilà."
 agot_sailing.3102.t:0 "Un itinéraire pour Valyria"
 agot_sailing.3102.desc:0 "Le fatras étalé sur la table, où se chevauche des cartes, des notes et des parchemins, est à l'image du fatras dont j'aimerais débourrer mon crâne. Je me ressers une coupe [ROOT.Char.Custom('RegionalAlcoholicDrink')], espérant que cela aidera à décanter l'incertitude, mais rien n'y fait. Je ne vois aucun lieu de mouillage sûr, je n'imagine aucune route maritime possible, et plus ma patience s'étiole, plus la confiance de [first_mate.GetFirstNameNoTooltip] en fait de même.\n\n« Il serait plus avisé de reporter le voyage à une prochaine fois… » dit-[first_mate.Custom('FR_IlElle')] avec la pointe de déception suffisante pour me passer l’envie de terminer ma coupe."
 agot_sailing.3102.a:0 "Voguer à l’aveugle vers Valyria serait du suicide…"
 agot_sailing.3200.t:0 "La terreur des profondeurs"
 agot_sailing.3200.desc:0 "Cela fait plusieurs jours que nous voguons sur les eaux, plusieurs jours que les vagues cognent la coque et que le vent fouette mon visage. Et c’est dans cette banalité quotidienne qu’apparaît un îlot au loin — rocher solitaire perdu au beau milieu des eaux. Le spectacle est banal, au premier abord du moins, car la banalité se fait monstruosité quand je réalise que… #high l’îlot bouge ?#!\n\nCe qui commence par un frisson le long de la nuque, se transforme en frayeur le long de la joue. Le rocher est bien plus grand qu’il n’y parait, et il est pourvu d’extrémités tentaculaires. La peur ne saurait abuser la vérité plus longtemps : ce n’est point un rocher, c’est le crâne d’une monstruosité tant redoutée : « Un kraken ! » s’égosille l’ensemble de l’équipage qui ne fait que mettre un mot compréhensible par tous sur un spectacle d’une horreur indicible.\n\n« Capitaine ! » hurle [first_mate.GetFirstNameNoTooltip] qui parvient à m’arracher à mes pensées cauchemardesques…"
 agot_sailing.3200.a:0 "#warning #bold Tout le monde à son poste de combat !!!#!#!"
 agot_sailing.3200.a.success:0 "Vous parvenez à occire la bête"
 agot_sailing.3200.a.success.tt:0 "Vous célébrez cette glorieuse victoire avec le reste de l’équipage"
 agot_sailing.3200.a.failure:0 "Vous n’êtes pas de taille face à un tel monstre"
 agot_sailing.3200.a.failure.tt:0 "@death_icon! Le kraken déchaîne sa fureur et il ne vous reste qu’à prier [THIS.Char.GetFaith.PantheonTerm]."
 agot_sailing.3200.b:0 "Putain, qu’est-ce que vous attendez pour virer de bord ?!"
 agot_sailing.3200.b.tt:0 "Vous tentez de fuir en retournant au port."
 agot_sailing.3200.b.success.tt:0 "Vous parvenez à distancer le kraken et arriver à bon port."
 agot_sailing.3200.b.failure.tt:0 "Vous ne ressortez pas indemne de cette rencontre, mais parvenez à échapper au pire."
 agot_sailing.3200.c:0 "C’est l’occasion ou jamais de voir si cette corne fonctionne…"
 agot_sailing.3200.c_success:0 "Vous parvenez à soumettre le kraken et à lui ordonner de partir"
 agot_sailing.3200.c_failure:0 "Vous échouez et la bête détruit tout sur son passage"
 agot_sailing.3201.t:0 "[Select_CString(ROOT.Char.IsFemale,'La tueuse','Le tueur')] de kraken"
 agot_sailing.3201.t_horn:0 "[Select_CString(ROOT.Char.IsFemale,'La dompteuse','Le dompteur')] de kraken"
 agot_sailing.3201.desc:0 "La bête est noyée sous une pluie de flèches, et usant de ce déluge de fer comme d’un rempart contre sa fureur, j’empoigne aussi fermement que possible m[ROOT.Char.Custom('FR_OnA_signature_weapon')], et frappe et tranche et taillade tout ce qui n'est ni de bois ni de fer devant moi. Ses tentacules s’enroulent toujours plus autour du mât et du pont, cherchant à faire chavirer le navire, mais ce serait bien mal me connaître que de croire que je me laisserais emporter dans les fonds sans combattre.\n\nL’équipage tout entier se bat avec un acharnement de tous les diables, les braises de leur courage ravivées par la bravoure de leur capitaine en première ligne, et comme pour enhardir cette bravoure, je hurle : « [ROOT.Char.GetHouse.GetMotto] ! » Une gueule monstrueuse s’ouvre devant moi, et j’enfonce m[ROOT.Char.Custom('FR_OnA_signature_weapon')] dans la cavité béante, avant de répéter l’action, cette fois dans l’œil apparent qui m’observe d'une iris furibonde. S’ensuit un cri mourant qui résonne et s’éteint sur les flots, sonnant une victoire improbable…\n\nD’une terreur effroyable, l’ambiance se mue en une démonstration de fierté et d’allégresse. « Saluez tous [Select_CString(ROOT.Char.IsFemale,'la Tueuse','le Tueur')] de Kraken ! » enjoint [first_mate.GetFirstNameNoTooltip], alors que l’image d’une mort imminente est encore gravée dans mon esprit…"
 agot_sailing.3201.desc_horn:0 "#italic La bête avance… L’équipage fuit vers la poupe… La bête approche… Je me dresse à la proue… La bête est là…#!\n\nLes tentacules s’enroulent autour du navire et la gigantesque tête me fait face. Un rugissement que je ne saurais décrire, même avec les plus effroyables mots trouvables dans [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip], fait trembler la surface de l’eau. Une gigantesque gueule béante s’ouvre, prêt à me mettre en pièce, et moi, [ROOT.Char.Custom('quirk_pos_adverb')], je porte la corne à mes lèvres. Un son s’échappe de l’autre extrémité, et le temps semble alors s’arrêter Du moins, je l’imagine, jusqu’à remarquer que c’est la bête qui s’est figée. Délivrant le navire de son emprise, elle se retire paisiblement dans les profondeurs…\n\nD’une terreur effroyable, l’ambiance se mue en une démonstration de fierté et d’allégresse. « Saluez tous [Select_CString(ROOT.Char.IsFemale,'la Dompteuse','le Dompteur')] de Kraken ! » enjoint [first_mate.GetFirstNameNoTooltip], alors que l’image d’une mort imminente est encore gravée dans mon esprit…"
 agot_sailing.3201.a:0 "Modérez votre joie, notre voyage est encore loin d’être terminé !"
 agot_sailing.3201.b:0 "Trinquons à #bold notre#! victoire !"
 agot_sailing.3202.t:0 "Face à la mort"
 agot_sailing.3202.desc:0 "L’horreur tentaculaire s’abat sur l'équipage, et ni les flèches, ni les lances, ni les harpons n’en viennent à bout. Le pont est déjà jonché de corps, brisé, mutilé, démembré, massacré. Ne reste que des lambeaux de chair des morts, sur lesquels les rares survivants glissent dans leur fuite désespérée…\n\nUn œil gigantesque surgit des eaux et me dévisage, ne voyant ici qu’un autre bout de viande à éparpiller. Quand une cavité béante s’ouvre devant moi, si proche que l’haleine d’une puanteur de mort pourrait presque m’étouffer, je ne trouve aucun mot dans [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] pour décrire la monstruosité qui est là.\n\nJe saisis ce qu’il me reste de courage et court le plus vite et le plus loin possible que mes jambes tremblantes me le permettent…"
 agot_sailing.3202.a:0 "Pas aujourd’hui ! Par tous les dieux ! Pas aujourd’hui, pas comme ça !"
 agot_sailing.3202.a.success.tt:0 "Par un quelconque miracle, vous parvenez à échapper au pire…"
 agot_sailing.3202.a.failure.tt:0 "@death_icon! #warning Vous finissez dans l’estomac du monstre, et votre sort n’est guère enviable…#!"
 agot_sailing.3300.t:0 "La famine guette"
 agot_sailing.3300.desc:0 "Que serait un périple en mer sans l’épée de la famine suspendue au-dessus de nos têtes ?\n\nDes courants contraires et des vents capricieux des jours durant auront rendu la progression sur les eaux bien plus lente et difficile que nos plus mauvaises estimations. Ainsi, lorsque [first_mate.GetFirstNameNoTooltip] m’informe à voix basse que les provisions sont au plus bas, je comprends que les disputes déjà trop régulières parmi l’équipage ne seront que plus nombreuses et plus violentes dans les jours à venir.\n\nPour nous sortir de ce mauvais pas, il ne me reste que mon autorité de capitaine et une décision à prendre. La bonne réussite de ce voyage tient à peu de choses, mais je garde également à l’esprit que les réserves sont encore suffisantes pour nous permettre de rebrousser chemin jusqu’au port…"
 agot_sailing.3300.a:0 "Il faut rationner ce qu’il reste, sur-le-champ !"
 agot_sailing.3300.a.success:0 "Vous parvenez à rationner les provisions restantes"
 agot_sailing.3300.a.success.tt:0 "Vous aurez suffisamment de vivres pour le restant du voyage."
 agot_sailing.3300.a.failure:0 "Votre gestion des stocks est un échec"
 agot_sailing.3300.a.failure.tt:0 "@death_icon! La famine vous fauche tous autant que vous êtes."
 agot_sailing.3300.b:0 "J’ai déjà maté des régiments plus coriaces que cet équipage !"
 agot_sailing.3300.b.success:0 "L’équipage rentre dans le rang"
 agot_sailing.3300.b.success.tt:0 "Votre application des mesures militaires sur l’équipage permet d’assurer sa survie."
 agot_sailing.3300.b.failure:0 "La situation échappe à votre contrôle"
 agot_sailing.3300.b.failure.tt:0 "@death_icon! Votre incapacité à appliquer les bonnes mesures au sein de l’équipage entraîne une mutinerie, dont l’issue n’est guère enviable pour vous."
 agot_sailing.3300.c:0 "C’est regrettable, mais nous ferions mieux de rentrer…"
 agot_sailing.3300.c.tt:0 "Vous rebroussez chemin et faites voile vers [location.GetNameNoTooltip]"
 agot_sailing.3300.d:0 "*Regarder [man_meat.GetFirstName] avec insistance*"
 agot_sailing.3300.d.tt:0 "Le cannibalisme pourrait être une solution à la famine…"
 agot_sailing.3301.t:0 "Le rationnement"
 agot_sailing.3301.desc:0 "Parfois, un esprit éclairé est tout ce qui nous sépare de la mort, et en l’occurrence, de la famine.\n\nEn imposant un rationnement minutieux calculé, je sauve la vie à mon équipage. Il nous faudra attendre notre retour au port pour faire bonne chère, mais au moins, retour au port il y aura — le moment venu."
 agot_sailing.3301.a:0 "Ce jour n’est pas celui de notre faim !"
 agot_sailing.3302.t:0 "La famine"
 agot_sailing.3302.desc:0 "La gorge sèche et les crampes d’estomac témoignent de la belle foirade que fut cette idée de rationnement.\n\nAurais-je mal calculé nos réserves de vivres ? Mal calculé la quantité adéquate à distribuer quotidiennement ? Serait-il possible qu’un voleur se trouve parmi l’équipage ?\n\nDes questions aussi vides d’intérêt que vides sont nos estomacs, car le nombre de morts ne fait que croître à chaque jour qui passe, et si fautif il y a, peut-être est-il déjà mort — ou peut-être le sera-t-il d’ici demain…"
 agot_sailing.3302.a:0 "Mon navire pour une bouchée !"
 agot_sailing.3303.t:0 "La discipline"
 agot_sailing.3303.desc:0 "Les vagues d’agitation qui se faisaient jusque-là de plus en plus nombreuses sont venues se fracasser contre mon autorité, aussi assurément que les vagues se meurent face aux récifs.\n\nLe moral a décliné, les estomacs se sont vidés, mais du reste, l’équipage survivra.\n\nIls sont sans doute nombreux en ce moment même à me maudire, mais lorsqu’ils rentreront à bon port, leur mépris s’éteindra dans les bras de leurs épouses et leurs enfants retrouvés, et tous me seront reconnaissants de leur avoir sauvé la vie."
 agot_sailing.3303.a:0 "En avant !"
 agot_sailing.3304.t:0 "La mutinerie"
 agot_sailing.3304.desc:0 "Aussi fort qu’un[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetTitleAsNameNoTooltip|l] puisse s’exprimer, [ROOT.Char.Custom('FR_IlElle')] ne s’exprimera jamais aussi fort qu’un estomac criant famine !\n\nAffamé et mécontent, l’équipage qui me doit respect et obéissance en est venu à la pire félonie qu’un capitaine puisse redouter : une mutinerie — avec [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('mutiny_leader'))] à sa tête en l’occurrence.\n\nSubmergé[ROOT.Char.Custom('FR_E')] et rapidement ligoté[ROOT.Char.Custom('FR_E')], je me retrouve à devoir attendre de connaître la sentence qui sera la mienne d’ici peu. Après quelques brèves délibérations, [Select_CString(mutiny_leader.IsFemale,'la cheffe','le chef')] de cette meute de chiens me traîne finalement jusqu’à une planche de fortune qui donne directement sur la mer…\n\n« Vous êtes relevé[ROOT.Char.Custom('FR_E')] de vos fonctions… capitaine. » [mutiny_leader.Custom('lmf_neg_reaction_type')], une épée pointée dans ma direction."
 agot_sailing.3304.a:0 "Bande de traîtres !"
 agot_sailing.3305.desc:0 "Des courants contraires et des vents capricieux des jours durant auront rendu la progression sur les eaux bien plus lente et difficile que les plus mauvaises estimations, et des disputes commencent à éclater de part et d’autres à travers le navire.\n\nAjouter à cela les murmures à propos de provisions au plus bas qui se font entendre, et il apparaît rapidement que la situation ne va aller que de mal en pis. N’ayant d’autre choix, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] en vient à rationner les vivres qu’il nous reste, mais cette extrémité semble avoir été prise bien trop tard…"
 agot_sailing.3305.a:0 "Ma vie pour une bouchée…"
 agot_sailing.3306.t:0 "La faim justifie les moyens…"
 agot_sailing.3306.desc:0 "La famine s’attaque d'abord à votre estomac, puis c’est votre esprit qu’elle commence à ronger…\n\nLa dernière part de galette disparut en bouche, je sais que je n'en aurai pas d’autre avant demain, et déjà le poids de cette disparition m’obsède. Les vivres se raréfient et la pêche n’est guère fructueuse. Il nous faut trouver une solution, et vite, car bientôt nous n’aurons sans doute plus la force, ni d’agir, ni même de réfléchir. Mais pire qu’entendre son estomac crier famine, c’est entendre un[man_meat.Custom('FR_E')] jacasseu[man_meat.Custom('FR_RSe')] s’en plaindre… [man_meat.GetFirstName] radote encore et toujours. C[man_meat.Custom('FR_EEtte')] [man_meat.Custom('InsultNoun')] ne daigne pas garder son claque-merde fermé pour nous laisser crever de faim en paix. Puis, comme pour répondre à #bold toutes#! nos prières, [man_meat.Custom('FR_IlElle')] finit par s’écrouler au sol, spolié[man_meat.Custom('FR_E')] de toute force par la faim…\n\n[Select_CString(ROOT.Char.HasTrait( GetTrait('cannibal') ), 'J’espère que c’est le genre à être plus facile à supporter en bouche qu’à l’oreille…', 'C’est une pensée terrible qui me vient à l’esprit. Terrible… mais nécessaire…' )]"
 agot_sailing.3306.a:0 "[Select_CString(ROOT.Char.HasTrait( GetTrait('cannibal') ), 'Y a de la viande fraîche au menu les gars !', 'La damnation plutôt que la mort…' )]"
 agot_sailing.3306.d.tt:0 "Chacun des autres membres de l’équipage est libre de choisir entre le cannibalisme ou mourir de faim…"
 agot_sailing.3307.desc:0 "La famine s’attaque d'abord à votre estomac, puis c’est votre esprit qu’elle commence à ronger…\n\nLes vivres se raréfient et la pêche n’est guère fructueuse. Il nous faut trouver une solution, et vite, car bientôt nous n’aurons sans doute plus la force, ni d’agir, ni même de réfléchir. Mais pire qu’entendre son estomac crier famine, c’est entendre un[man_meat.Custom('FR_E')] jacasseu[man_meat.Custom('FR_RSe')] s’en plaindre… [man_meat.GetFirstName] radote encore et toujours, jusqu'à s'écrouler à terre, spolié[man_meat.Custom('FR_E')] de toute force par la faim…\n\n[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))|U] se lève subitement, et comme si ses prières avaient été entendues, s’approche et fait passer [Select_CString(man_meat.IsFemale,'la malheureuse','le malheureux')] de vie à trépas d’un coup net… Mais ce n’est pas un simple meurtre auquel j’assiste, c’est à un festin sanguinolent… [Select_CString(ROOT.Char.HasTrait( GetTrait('cannibal') ), 'et cela me met l’eau à la bouche', 'et cela me terrifie…' )]"
 agot_sailing.3307.a:0 "[Select_CString(ROOT.Char.HasTrait( GetTrait('cannibal') ), 'Je meurs de faim !', 'La damnation plutôt que la mort…' )]"
 agot_sailing.3307.b:0 "Je réussirai à tenir bon !"
 agot_sailing.3307.b.success_tt:0 "Vous parvenez à survivre en dépit des maigres rations"
 agot_sailing.3400.t:0 "La folie de Valyria"
 agot_sailing.3400.desc:0 "« CAPITAINE !!! » la voix d’ordinaire si familière de [first_mate.GetFirstName] me réveille brusquement et me force à sortir précipitamment de ma cabine. Je [first_mate.Custom('FR_LeLa')] découvre en sanglot, ne réagissant aucunement à ma présence, [first_mate.Custom('FR_LuiElle')] comme bien d'autres membres de l’équipage, tous semblant frappés du même mal. Qu’ils balbutient nerveusement ou hurlent à cor et à cri, leurs propos relatent la même vision, la même souffrance, la même démence : un brasier qui dévore aussi aisément la chair que la pierre et des eaux aussi brûlantes que les flammes.\n\nLe navire, dépourvu de voile hissé ou de rame manœuvré, gît sur la mer, immobile. L’équipage adresse des prières, [ROOT.Char.GetFaith.HighGodName2] ; aux dieux quels qu’ils soient ; à qui voudra bien leur répondre, et [first_mate.GetFirstNameNoTooltip], [first_mate.Custom('FR_LuiElle')], se tourne vers moi : « Il nous faut faire demi-tour ! Le Fléau ! Le Fléau de Valyria ! »"
 agot_sailing.3400.a:0 "N’ayez crainte mes amis ! Tout cela n’est que votre imagination !"
 agot_sailing.3400.a.success:0 "Vous parvenez à calmer l’équipage"
 agot_sailing.3400.a.success.tt:0 "Vous rassérénez les membres de l’équipage qui chassent ces pensées imaginaires de leurs esprits"
 agot_sailing.3400.a.failure:0 "Vos belles paroles ne suffisent pas"
 agot_sailing.3400.a.failure.tt:0 "Entre la mort et la mutinerie, votre équipage a tôt fait de choisir"
 agot_sailing.3400.b:0 "Ce sera moi votre #EMP Fléau#! si vous ne vous reprenez pas sur-le-champ !"
 agot_sailing.3400.b.desc:0 "Vous tentez de faire usage de votre [dread|El] pour intimider l’équipage et le pousser à se ressaisir"
 agot_sailing.3400.b.success.tt:0 "Terrifié, l’équipage parvient à se ressaisir"
 agot_sailing.3400.b.failure.tt:0 "Tout redoutable que vous soyez, vous n’êtes rien en comparaison du Fléau"
 agot_sailing.3400.c:0 "Ce serait pure folie que de poursuivre ce voyage !"
 agot_sailing.3400.c.tt:0 "Vous rebroussez chemin et faites voile vers [location.GetNameNoTooltip]"
 agot_sailing.3401.t:0 "La folie s’estompe"
 agot_sailing.3401.desc:0 "Les brumes de la démence qui se sont emparées de l’équipage sont soufflées par les mots du capitaine, et la raison, à l’image de la marée, revient progressivement.\n\n[first_mate.GetFirstName], ayant désormais retrouvé tous ses esprits, s’approche et s’excuse. « Trêve de bavardage, nous avons encore un long chemin à parcourir ! » j’enjoins en mêlant les mots aux gestes.\n\nTous autant qu’ils sont, ils n’oublieront pas ce qu’ils viennent de traverser, et leur détermination à poursuivre plus avant pour aller percer les mystères de l’Antique et Maudite Valyria n’en sera que plus tenace."
 agot_sailing.3401.a:0 "Après pareille ordalie, la peur ne peut qu’être derrière nous."
 agot_sailing.3402.t:0 "L’embrasement de la folie"
 agot_sailing.3402.desc:0 "« N’ayez crainte mes amis ! Tout cela n’est que votre imagination ! » Tous me regardent comme si j’étais le Fléau en personne, de leurs yeux embrasés de stupéfaction. Je suis le dernier espoir de ce navire, et comprendre cela me donne la force de m’élancer vers la barre, depuis laquelle je dois espérer pouvoir nous emmener plus avant vers Valyria.\n\n« Arrêtez capitaine ! » objecte [first_mate.GetFirstName] en s’interposant. La démence que je vois dans ses yeux a tant rongé son esprit qu’il est prêt à faire fi de mon autorité et à nous empêcher d’atteindre notre objectif ? J’en ai bien peur, et c’est pourquoi j’empoigne mon arme…\n\nMais avant que je ne puisse faire quoi que ce soit, je suis agrippé[ROOT.Char.Custom('FR_E')] de toutes part. L’équipage tout entier s’est laissé consumé par la folie et les voilà maintenant conjurant notre échec à tous : « Vous avez perdu l’esprit ! » Ces mots qui pourraient être les miens, sont en réalité ceux de [first_mate.GetFirstNameNoTooltip], qui donne l’ordre à l'équipage de m'enfermer dans ma cabine : « Allez vous reposer capitaine. Nous rentrons, avant que le mal qui vous grignote l’esprit ne termine le travail ! » Pourquoi tous ceux qui criaient jusqu’à présent se sont tus ? Pourquoi ne voient-ils pas que j’essaie de les aider ? Pourquoi ? Pourquoi ?"
 agot_sailing.3402.a:0 "#EMP Pourquoi ? Pourquoi ? Pourquoi Pourquoi ?#!"
 agot_sailing.3500.t:0 "La fureur des éléments"
 agot_sailing.3500.desc:0 "Une expédition vers Valyria n’est point une sinécure, néanmoins, constatant que le vent et les eaux me sont favorables, j’en viens à penser que nous sommes face à une accalmie dans l’immensité des aléas de notre périple. Mais comme pour punir ma sotte naïveté, je vois une noirceur poindre à l’horizon…\n\nLe vent, les eaux, le temps, tout ce qui jusque-là semblait être nos alliés semblent avoir subitement décidés de conjurer notre perte, et tandis que le navire est rudoyé par les rafales et les vagues et la bruine diluvienne, il apparaît au loin que tout ceci n’est que prémices pour de plus sombres nuées encore.\n\nValyria attend quelque part au-delà de cet horizon de noir et de gris, alors la question se pose de savoir s’il faut braver la tempête ou accepter qu’une obscure force nous fasse rempart et nous contraignent à abandonner…"
 agot_sailing.3500.a:0 "Je ne reculerais pas si près du but ! #EMP En avant toute !#!"
 agot_sailing.3500.a.success:0 "Vous survivez à la tempête"
 agot_sailing.3500.a.success.tt:0 "En mettant à profit l'entièreté de votre expérience de marin, vous arrivez à traverser cette calamité"
 agot_sailing.3500.a.failure:0 "Votre navire est englouti dans la tempête"
 agot_sailing.3500.a.failure.tt:0 "@death_icon! Ni votre expérience ni votre hardiesse ne vous sauve de la fureur des éléments qui s'abat sur vous…"
 agot_sailing.3500.b:0 "Cette tempête signera notre fin à tous ! Virez de bord !"
 agot_sailing.3500.b.tt:0 "Vous rebroussez chemin et faites voile vers [location.GetNameNoTooltip]"
 agot_sailing.3501.t:0 "En pleine tempête !"
 agot_sailing.3501.desc:0 "Jamais de toute ma chienne de vie je n’ai eu à faire face à pareille tempête ! J’agrippe la barre comme si ma vie en dépendait, car c’est très exactement le cas…\n\nLe tonnerre explose avec un tel acharnement que la moitié des ordres que je vocifère sont néantisés, et l’autre moitié à peine audible par la pluie fracassante. Si les dieux nous crachent à la gueule, alors qu’il en soit ainsi, je prierais ma bravoure et mon expérience de me montrer la voie ! Les vagues et les éclairs se succèdent, encore et encore, jusqu’à ce que finalement, après avoir bu toute l'entièreté de l'océan, je vois quelque chose dans cette tempétueuse noirceur : #highlight un perçant rayon de soleil…#!\n\nLe navire glisse enfin hors de la tempête, et j’en étais presque à avoir oublié que la mer pouvait être… si calme… si belle. J’use des forces que le vent et la pluie ont daigné épargner pour ne pas m’évanouir de soulagement — lorsque subitement j’entends… « #positive_value Terre ! Terre en vue !#! »"
 agot_sailing.3501.a:0 "*Sourire*"
 agot_sailing.3502.t:0 "Une tombe parmi les eaux"
 agot_sailing.3502.desc:0 "Jamais de toute ma chienne de vie je n’ai eu à faire face à pareille tempête ! J’agrippe la barre comme si ma vie en dépendait, car c’est très exactement le cas…\n\nLe tonnerre éclate et l’éclair qu’il précède fait tomber le grand mât d’un seul coup, écrasant un malheureux qui, aveuglé par la pluie fracassante, ne l’aura même pas vu venir. Si le navire est dépourvu de sa grand’voile, alors nous ferons sans. Je gueule pour faire entendre mes ordres, mais le ciel se gausse de moi en gueulant toujours plus fort. Un membre d’équipage est emporté par une vague, un autre bascule sous la force du vent et fait une chute mortelle. Si le navire est dépourvu de son équipage, alors je ferais sans…\n\nJe tiens la barre, je la tiens encore lorsqu’elle est arrachée du navire, et je la tiens toujours quand nous finissons elle et moi, jeté[ROOT.Char.Custom('FR_E')]s par-dessus bord. Je me retrouve dans les noirceurs abyssales, du sel plein les yeux et de l’eau plein les poumons…"
 agot_sailing.3502.a:0 "#warning …#!"
 agot_sailing.3503.desc:0 "Jamais de toute ma chienne de vie je n’ai eu à faire face à pareille tempête ! [host.GetFirstName] agrippe la barre comme si notre vie à tous en dépendait, car c’est très exactement le cas…\n\nLe tonnerre éclate et l’éclair qu’il précède fait tomber le grand mât d’un seul coup, écrasant un malheureux qui, aveuglé par la pluie fracassante, ne l’aura même pas vu venir. Un autre membre d’équipage est emporté par une vague et un autre bascule sous la force du vent et fait une chute mortelle. Le navire se fracture à peine sous mes pieds, et je me retrouve déjà dans les noirceurs abyssales, du sel plein les yeux et de l’eau plein les poumons…"
 agot_sailing.3900.t:0 "Les Quatorze Flammes"
 agot_sailing.3900.desc:0 "« Nous y sommes… enfin, nous y sommes… » Après tant de déboire, après tant de mésaventure, après tant de calamité, enfin la délivrance nous tend les bras, et plus que le soleil qui rayonne au loin, c’est mon visage qui s’illumine d’un sourire…\n\nL’amas d'îles brisées qui gît sous mes yeux en dit long sur ce qui a fait choir la jadis si flamboyante civilisation valyrienne, mais en réalité, même le courroux divin n’aura pas su totalement balayé la grandeur de l’Antique et Glorieuse Valyria. Je ne peux qu’imaginer les merveilles que doivent recéler cet endroit, néanmoins, même de mes yeux scintillants d’étoiles je suis capable d’entrevoir le danger qui règne encore ici…\n\nOù que mon regard se pose, je ne vois qu’un dédale de falaises abruptes, des colonnes de roches érigées telles des lances comme pour dissuader les éventuels chanceux qui seraient arrivés jusque-là. Et les amas de fumée qui s’échappent de part et d’autres, aussi bien de l’eau que de la pierre, me laissent à penser que la calamité qui a balayé les seigneurs dragons d’alors n’a point tout à fait disparu. Ces contrées sont maudites, et jamais, nultemps jamais, le temps n’y changera quoi que ce soit…\n\nValyria est enfin à portée de main, et des récompenses attendent peut-être les plus braves parmi les braves !"
 agot_sailing.3900.a:0 "Pouvoir poser mes yeux sur cette merveille est déjà une récompense en soi."
 agot_sailing.3900.a.tt:0 "Vous ne ferez pas plus que contempler respectueusement les vestiges depuis votre navire, avant de repartir vers [location.GetNameNoTooltip]"
 agot_sailing.3900.b:0 "Je n’ai pas triomphé de la mort pour me contenter de regarder !"
 agot_sailing.3900.b.success:0 "Vous trouvez un lieu d’accostage pour explorer plus avant les ruines"
 agot_sailing.3900.b.failure:0 "@death_icon! Une ultime mésaventure met fin à votre expédition…"
 agot_sailing.3901.t:0 "L’Antique et Majestueuse Valyria"
 agot_sailing.3901.desc:0 "J’ai eu mon content de rencontre avec la mort durant les dernières semaines, alors nul question d’accoster et de mettre encore une fois à l’épreuve ma bonne fortune. Le spectacle qui s’offre à moi est plus que suffisant pour contenter ma soif de richesse tandis que le navire longe les côtes — aussi près que la prudence nous le permette.\n\nCe que je devine avoir été des tours ne s’élèvent plus si haut qu’elles le fîmes jadis, mais encore bien assez pour émoustiller mon imagination. Des restants de piliers, de murs et de palais suffisent à faire renaître la Valyria des beaux jours dans mon esprit, et ce sans même avoir besoin de clore les paupières. Je vois devant moi maints merveilles : des tours qui tutoient les cieux, des bêtes ailées gigantesques, et un peuple au sommet de tout, au sommet de la civilisation, au sommet des cieux, siégeant dans les hauteurs infinies…\n\nLe soleil décline à l’horizon quand je décide qu’il est temps de reprendre la route. #italic Nous l’avons vu. Nous en avons été témoins. L’Antique Valyria…#!\n#high Je redoutais ce voyage, je chérirais ce souvenir…#!"
 agot_sailing.3901.a:0 "Puisse-t-il être aussi éternel que la splendeur de Valyria."
 agot_sailing.3902.t:0 "Les vestiges de la grandeur"
 agot_sailing.3902.desc:0 "Posant le pied à terre après avoir trouvé l’endroit parfait pour accoster, une étrange sensation m’envahit…\nLa paume de la main appuyée sur le flanc d’une falaise, la roche y est chaude au toucher, et levant les yeux au ciel, l’impressionnant pic du volcan ayant façonné les lieux perce haut, très haut, jusqu’à tutoyer les nuages. Un sentier perdu au milieu du paysage escarpé m’amène à trouver des marches, taillées à même la falaise. Ce que le Fléau a grandement entamé, le temps l’aura achevé, mais l’escalier étant encore praticable, il ouvre la voie, certes difficile, jusqu’à un ancien palais valyrien.\n\nÀ en juger par les autres vestiges alentours, celles-ci semblent s’en être plutôt bien tirés pour quelque chose ayant subit de plein fouet le plus grand cataclysme de mémoire d’homme. Simple chance ou preuve du génie derrière l’architecture valyrienne, je ne saurais le dire, mais la grandeur et le prestige d’autrefois sont désormais ternis par une imagerie de désespoir, les colonnes de fumée qui s’en dégagent donnant une dimension funeste à l’ensemble.\n\nL’exploration qui se fait sous des yeux avertis amène l’un des membres d’équipage a venir rapporter un premier trésor…"
 agot_sailing.3902.a:0 "Ces ruines sont dangereuses. Nous avons déjà de la chance d’avoir trouvé ça…"
 agot_sailing.3902.b:0 "Le premier mais certainement pas le dernier ! Ouvrez l’œil, et le bon !"
 attempt_to_leave_valyria:0 "Vous tentez de quitter Valyria"
 valyrian_artifact:0 "Vous avez découvert un [artifact|El] datant de l’Antique Valyria"
 guest_reached_valyria_tt:0 "Tous ceux qui vous accompagnent obtiennent « [GetModifier( 'guest_reached_valyria' ).GetNameWithTooltip|L] »"
 agot_sailing.3903.t:0 "Ô Valyria ennemie"
 agot_sailing.3903.desc:0 "Tout du long de notre traversée de la Mer Fumeuse, nous n’avons pour tout paysage que ces falaises morcelées et fumantes. Notre recherche infructueuse d’un lieu sûr pour accoster nous contraint à aller toujours plus avant, mais dans cette attente insupportable, je me console en imaginant les montagnes de richesses qui nous attendent. De l’or à ne plus savoir quoi en faire, des joyaux plus gros que des poings, et bien entendu, le plus précieux et le plus enviable de tous les trésors : l’acier valyrien. Tout cela sera bientôt mien.\n\n#EMP #warning CRAC !!!#!#!\n\nQuelque chose vient de s’abattre sur le grand mât : un énorme rocher de feu, qui a tout simplement traversé le pont principal. En un instant, un incendie se déclare, consumant le bois et propageant les flammes. La vitesse est notre seule alliée désormais, mais le feu se déclare en de multiples endroits. Le mât, le pont principal, les voiles, le pont inférieur, tout est déjà noyé dans le rouge et l’orange embrasé. « Ce lieu est maudit ! » ; « Le Fléau va tous nous emporter ! » Les cris fussent de tous sens, et gangréné[ROOT.Char.Custom('FR_E')] par la panique générale, je jurerais de voir les flammes prendre vie et dévorer les uns et les autres. N’ayant plus le choix, je me jette dans la Mer Fumeuse, et rapidement, je regrette de ne pas avoir donner leur chance aux flammes…"
 agot_sailing.3903.a:0 "#warning AAAAAA—#!"
 agot_sailing.3904.t:0 "Les vestiges de la terreur"
 agot_sailing.3904.desc_one:0 "Posant le pied à terre après avoir trouvé l’endroit parfait pour accoster, une étrange sensation m’envahit…\nLe paysage, marqueur du plus grand cataclysme de mémoire d’homme, est tout à la fois impressionnant et terrifiant. La chaleur y est presque suffocante, mais vaille que vaille je progresse dans cet environnement hostile dans lequel un escalier en ruine m’amène jusqu’au sommet des falaises surplombant la Mer Fumeuse.\n\nFinalement arrivé jusqu'à ce qui semble être les vestiges d’un antique palais valyrien, je me tourne vers mon fidèle équipage : « Nous l’avons vu ! Nous en avons été témoins ! L’Antique Valyria est là qui nous tend les bras ! Les bras chargés de richesse ! »\n\nÀ mon enthousiasme, exacerbé par la vue, un rugissement de fureur y répond. À peine ai-je le temps de tourner la tête qu’une bête monstrueusement écailleuse apparaît comme de nulle part et nous décime les uns après les autres avec une célérité comme je n’en avais encore jamais vu…"
 agot_sailing.3904.desc_two:0 "Posant le pied à terre après avoir trouvé l’endroit parfait pour accoster, une étrange sensation m’envahit…\nLe paysage, marqueur du plus grand cataclysme de mémoire d’homme, est tout à la fois impressionnant et terrifiant. La chaleur y est presque suffocante, mais vaille que vaille je progresse dans cet environnement hostile jusqu’à trouver l’entrée d'une grotte.\n\n« Regardez ! » s’exclame l’un des membres de l’équipage en désignant la bête qui en sort. Couverte d’une fourrure blanche et dotée de deux longues oreilles, la créature ne fait que nous fixer paisiblement. « Ce n’est… qu’un lapin… » Mais alors que la curiosité nous pousse à avancer, l’indescriptible se produit.\n\nLes yeux subitement injectés de sang, la bête se jette sur nous les uns après les autres, arrachant d’un simple coup de dent l’entièreté d’une tête sans le moindre effort…"
 agot_sailing.3904.desc_three:0 "Posant le pied à terre après avoir trouvé l’endroit parfait pour accoster, une étrange sensation m’envahit…\nLe paysage, marqueur du plus grand cataclysme de mémoire d’homme, est tout à la fois impressionnant et terrifiant. La chaleur y est presque suffocante, mais vaille que vaille je progresse dans cet environnement hostile jusqu'à trouver l’entrée d'une grotte d’où s'échappe de la fumée.\n\n« Regardez ! » s’exclame l’un des membres de l’équipage en désignant un petit amas de pierres couvertes… d'écailles ? #EMP Serait-ce des œufs de dragon ?#! \n\nL’émotion me fait oublier toute considération pour la prudence et je me précipite pour regarder de plus près. J’en saisit un, avec la délicatesse qu’il sied à un tel artefact — moins l’excitation dû à mon enthousiasme effréné. « Gaffe, capitaine, allez pas nous le casser ! » Mais mon imprudence nous coûte à tous bien plus cher que la perte d’un simple trésor de grande valeur. Ce qui avait la forme d’un œuf l'instant d’avant se dévoile en une silhouette monstrueuse, crachant et sifflant. Mon sang se met à bouillonner et ma chair à se liquéfier…"
 agot_sailing.3904.desc_four:0 "Posant le pied à terre après avoir trouvé l’endroit parfait pour accoster, une étrange sensation m’envahit…\nLe paysage, marqueur du plus grand cataclysme de mémoire d’homme, est tout à la fois impressionnant et terrifiant. La chaleur y est presque suffocante, mais vaille que vaille je progresse dans cet environnement hostile, m’appuyant solidement à la paroi, jusqu’à l’inévitable faux pas qui me fait perdre l’équilibre.\n\nSouhaitant éviter une possible chute mortelle, je m’agrippe à la première chose qui me passe sous la main : un appendice rocheux. La chose est fragile, et elle se brise, son sacrifice m’évitant tout de même un sort peu enviable. Mais lorsque j’y regarde de plus près, je prends conscience que cet appendice est celui d’un homme, car c’est un doigt. Je réalise alors la présence d’un visage de pierre, fondu dans la roche. L’horreur se lit sur ce visage, et l’horreur s’empare de moi quand subitement quelque chose s’agrippe à ma gorge. Mon cri s’étouffe et ma vie s’éteint…"
 agot_sailing.3904.desc_five:0 "Posant le pied à terre après avoir trouvé l’endroit parfait pour accoster, une étrange sensation m’envahit…\nLe paysage, marqueur du plus grand cataclysme de mémoire d’homme, est tout à la fois impressionnant et terrifiant. La chaleur y est presque suffocante, mais vaille que vaille je progresse dans cet environnement hostile jusqu’à trouver l’entrée d'une grotte d’où s’échappe de la fumée.\n\n« Regardez ! » s’exclame l’un des membres d’équipage en désignant un roc dans lequel est fichée une lame scintillante. Les ondulations visibles sur le métal sont caractéristiques d’une seule chose : l’acier valyrien.\n\nC'est là une trouvaille que je n’aurais jamais espéré mettre la main dessus, même dans mes rêves les plus fous. Je saisis l’épée, et m’arme de toutes mes forces pour l’extirper de son socle. J’essaie encore et encore, et quand finalement mon orgueil s’efface pour redonner à la raison son juste droit, je me retourne vers mon équipage… lequel est décimé. Cela ressemble à un cauchemar, mais en voyant la silhouette tout de noir qui se dresse au-dessus de moi, je ne peux qu’admettre que la réalité est bien plus horrible encore. Cette monstruosité a une peau semblable au verredragon, mais là, tout de suite, ce qui m’effraie le plus, ce sont ses bras acérés en forme de faux…"
 agot_sailing.3904.desc_six:0 "Posant le pied à terre après avoir trouvé l’endroit parfait pour accoster, une étrange sensation m’envahit…\nLe paysage, marqueur du plus grand cataclysme de mémoire d’homme, est tout à la fois impressionnant et terrifiant. La chaleur y est presque suffocante, mais vaille que vaille je progresse dans cet environnement hostile jusqu’à trouver l’entrée d'une grotte d’où s'échappe de la fumée.\n\nL’endroit y est faiblement éclairé, mais suffisamment encore pour que je puisse entr’apercevoir ce qui semble être des figures de pierre, blotties les unes contre les autres comme pour se réchauffer. Le spectacle a quelque chose d’au moins aussi dérangeant qu’angoissant, et j’en comprends la raison quand je réalise que ces silhouettes ne cherchent pas à se réchauffer #high mais à se protéger !#!\n\nUn cri étouffé me pousse à me retourner, découvrant que quelque chose a attaqué mon équipage sans que je ne sache précisément quoi, faute d’y voir convenablement. Soudainement, une main empoigne ma jambe — une main de pierre. La douleur est atroce, mais moins du fait de la force exercée que de la nature du toucher. Une autre main surgit de l’obscurité et attrape mon bras, une autre encore m’attrape mon autre jambe, et une dernière se saisit de mon visage…"
 agot_sailing.3904.a:0 "#warning AAAAAA—#!"
 ship_sunk:0 "Les restes de votre navire rejoignent ceux de Valyria"
 ship_sunk_bell:0 "La cloche de plongée disparaît avec le navire"
 agot_sailing.3905.t:0 "Un trésor parmi les ruines"
 agot_sailing.3905.desc:0 "Comme le reste de l'équipage, je pose le pied à terre pour suivre [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))], mais une étrange sensation m’envahit…\n\nCe lieu que nous foulons est sans doute resté inexploré depuis l’époque du Fléau de Valyria, du moins, depuis que [GetScriptedCharacterByHistoryID('Varezys_1').Custom('FR_du_Char')][GetScriptedCharacterByHistoryID('Varezys_1').GetName] aura levé son ost pour reconquérir l’endroit après s’être proclamé Empereur de Valyria, ce qui ne manque pas d’en faire jubiler certains ici — moi [Select_CString(ROOT.Char.IsFemale,'la première','le premier')].\n\nLe paysage, marqueur du plus grand cataclysme de mémoire d’homme, est tout à la fois impressionnant et terrifiant, avec l’imposant pic du volcan ayant façonné les lieux qui perce haut, très haut, jusqu’à tutoyer les nuages. Notre capitaine nous mène jusqu’à un sentier, lequel nous mène à un escalier, puis à ce qui ressemble de toute évidence aux vestiges d’un antique palais valyrien.\n\nLa beauté mortuaire des lieux ne nous empêche pas de fouiller avec avidité, et après moult pierres déplacées et salles fouillées, enfin la fortune me sourit lorsque je découvre un artefact des plus précieux !"
 agot_sailing.3905.a:0 "[Select_CString(ROOT.Char.HasTrait( GetTrait('intellect_bad_2') ),'C’est de toute beauté !',Select_CString(ROOT.Char.HasTrait( GetTrait('intellect_bad_3') ),'C’est de toute beauté !','Magnifique !'))]"
 agot_sailing.3938.t:0 "L’île de tous les dangers"
 agot_sailing.3938.desc:0 "Comme le reste de l'équipage, je pose le pied à terre pour suivre [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))], mais une étrange sensation m’envahit…\n\nLe paysage, marqueur du plus grand cataclysme de mémoire d’homme, est tout à la fois impressionnant et terrifiant. La chaleur y est presque suffocante, mais vaille que vaille je progresse dans cet environnement hostile dans lequel un escalier en ruine m’amène jusqu’au sommet des falaises surplombant la Mer Fumeuse, où se trouve ce qui semble être les vestiges d’un antique palais valyrien…\n\nL’instant pourrait être glorieux, pour nous autres aventuriers témoins de telles merveilles que même la divine fureur n'est parvenue qu’à légèrement entacher, mais malheureusement, Valyria est une funeste merveille, et funeste est le sort de ceux qui s’y aventurent. Cela je le comprends lorsque, me retournant, je vois des mains froides et monstrueuses m’agripper le cou avant de m’ôter la vie dans un sifflement macabre…"
 agot_sailing.3938.a:0 "#warning …#!"
 agot_sailing.3938.a.tt:0 "L’expédition est un échec et l’ensemble de l’équipage disparait à jamais dans les brumes de Valyria"
 agot_sailing.3906.t:0 "Pour quelques artefacts de plus…"
 agot_sailing.3906.desc:0 "« Qu’est-ce que vous attendez pour continuer les recherches ?! »\n\nSitôt l’ordre donné, l’équipage reprend les fouilles d’arrache-pied, et à raison. Atteindre Valyria aura été bien trop périlleux pour que je me risque à retenter cela de sitôt, et maintenant que nous sommes là, mieux vaut en profiter…\n\nLe Fléau n'aura pas été tendre, et peut-être n’y a-t-il plus rien à trouver, mais peut-être que si, et même hypothétique, l’occasion se doit d'être saisie. Je sais l’endroit dangereux, à bien des égards, mais la fortune sourit aux audacieux après tout…\n\n« Hâtez-vous ! » j’ordonne, tandis qu’il me semble apercevoir quelque chose dans les débris…"
 agot_sailing.3906.a:0 "L’Antique Valyria nous sourit !"
 agot_sailing.3907.t:0 "Le voyage de retour"
 agot_sailing.3907.desc_good:0 "Quelle aventure, mes aïeux ! Et quel soulagement d’en ressortir vivant[ROOT.Char.Custom('FR_E')] !\n\nL’équipage embarque sur le navire qui nous a fidèlement amené jusqu’ici, pour que puisse s’entamer le voyage de retour.\n\nMoi, je jette un dernier regard sur les vestiges d’une époque lointaine…"
 agot_sailing.3907.desc_bad:0 "Quelle aventure, mes aïeux ! Et quel soulagement d’en ressortir vivant !\n\nL’équipage embarque sur le navire qui nous a fidèlement amené jusqu’ici, pour que puisse s’entamer le voyage de retour.\n\nMoi, je jette un dernier regard sur les vestiges d’une époque lointaine… avant d’être pris[ROOT.Char.Custom('FR_E')] d’une sensation. Elle est d’abord singulièrement étrange, mais rapidement je comprends que c’est une douleur. Une douleur comme je n’en avais jamais expérimentée jusqu’à présent. C’est une brûlure, mais comme si elle provenait de l’intérieur de ma chair. Et lorsque j’ouvre la bouche pour crier, il n’y a pas de son qui en sort, juste de la fumée…"
 agot_sailing.3907.a_good:0 "Adieu Valyria…[Select_CString(ROOT.Char.HasTrait( GetTrait('gallant') ),' Adieu belle balafrée…',Select_CString(ROOT.Char.HasTrait( GetTrait('lifestyle_poet') ),' Adieu belle balafrée…',''))]"
 agot_sailing.3907.a_bad:0 "#warning …#!"
 agot_sailing.3920.t:0 "$agot_sailing.3101.t$"
 agot_sailing.3920.desc:0 "Avant de nous risquer sur la route de Valyria, encore faut-il savoir où se trouve cette fameuse route, et c’est justement la raison qui retient [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] dans sa cabine.\n\nQuelques heures passées à recouper diverses informations plus tard, et enfin la bonne nouvelle se fait entendre. Le capitaine nous fait part de son intention de longer les côtes puis de faire voile jusqu’à la Mer Fumeuse, ce qui devrait nous permettre d’atteindre les Quatorze Flammes."
 agot_sailing.3920.a:0 "Il n'y a plus qu’à espérer que ses calculs soient exacts."
 agot_sailing.3921.t:0 "$agot_sailing.3102.t$"
 agot_sailing.3921.desc:0 "Avant de nous risquer sur la route de Valyria, encore faut-il savoir où se trouve cette fameuse route, et c’est justement la raison qui retient [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] dans sa cabine depuis des heures.\n\nLorsqu’[host.Custom('FR_IlElle')] en sort, sa mine dépité en dit bien assez : « Voguer à l’aveugle vers Valyria serait du suicide… » l’entend-t-on marmonner."
 agot_sailing.3921.a:0 "Quel dommage…"
 agot_sailing.3922.t:0 "$agot_sailing.3200.t$"
 agot_sailing.3922.desc:0 "Cela fait plusieurs jours que nous voguons sur les eaux, plusieurs jours que les vagues cognent la coque et que le vent fouette mon visage. Et c’est dans cette banalité quotidienne qu’apparaît un îlot au loin — rocher solitaire perdu au beau milieu des eaux. Le spectacle est banal, au premier abord du moins, car la banalité se fait monstruosité quand je réalise que… #high l’îlot bouge ?#!\n\nCe qui commence par un frisson le long de la nuque, se transforme en frayeur le long de la joue. Le rocher est bien plus grand qu’il n’y parait, et il est pourvu d’extrémités tentaculaires. La peur ne saurait abuser la vérité plus longtemps : ce n’est point un rocher, c’est le crâne d’une monstruosité tant redoutée : « Un kraken ! » s’égosille l’ensemble de l’équipage qui ne fait que mettre un mot compréhensible par tous sur un spectacle d’une horreur indicible.\n\nTandis que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('first_mate'))] hurle « Capitaine ! » pour rappeler à l’ordre [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))], [Select_CString(host.IsFemale,'cette dernière','ce dernier')] rétorque par une réplique cinglante : « Putain, qu’est-ce que vous attendez pour virer de bord ?! »"
 agot_sailing.3922.a:0 "Tous ces efforts pour rien !"
 agot_sailing.3923.t:0 "$agot_sailing.3200.t$"
 agot_sailing.3923.desc:0 "Cela fait plusieurs jours que nous voguons sur les eaux, plusieurs jours que les vagues cognent la coque et que le vent fouette mon visage. Et c’est dans cette banalité quotidienne qu’apparaît un îlot au loin. Le spectacle est banal, au premier abord du moins, car la banalité se fait monstruosité quand je réalise que… #high l’îlot bouge ?#!\n\nCe qui commence par un frisson le long de la nuque, se transforme en frayeur le long de la joue. Le rocher est bien plus grand qu’il n’y parait, et il est pourvu d’extrémités tentaculaires. « Un kraken ! » s’égosille l’ensemble de l’équipage qui ne fait que mettre un mot compréhensible par tous sur un spectacle d’une horreur indicible.\n\nLa situation s’apparente à un cauchemar, jusqu’à ce que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] surgisse, tel un phare dans l’obscurité. Placé[host.Custom('FR_E')] en bout de proue, face à la bête et un cor en main, [host.Custom('FR_IlElle')] semble être notre seul espoir. Le cor fait son office, et le son qui en sort fait trembler le navire. C’est une corne de kraken qu’il a en bouche, et elle a pour dessein de renvoyer la monstruosité dans les abysses. Quel glorieux spectacle propice à de futurs chansons qui résonneront éternellement dans les tavernes : #EMP le capitaine face à la bête#! — jusqu’à ce qu’un tentacule vienne aplatir [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))].\n\nDu capitaine, il ne reste que des morceaux informes et une flaque rouge, et lorsque je vois le même tentacule fondre sur moi, je comprends que mon tour est venu…"
 agot_sailing.3923.a:0 "Par [ROOT.Char.GetFaith.NegativeAfterLife]…"
 agot_sailing.3924.t:0 "$agot_sailing.3200.t$"
 agot_sailing.3924.desc:0 "Cela fait plusieurs jours que nous voguons sur les eaux, plusieurs jours que les vagues cognent la coque et que le vent fouette mon visage. Et c’est dans cette banalité quotidienne qu’apparaît un îlot au loin — rocher solitaire perdu au beau milieu des eaux. Le spectacle est banal, au premier abord du moins, car la banalité se fait monstruosité quand je réalise que… #high l’îlot bouge ?#!\n\nCe qui commence par un frisson le long de la nuque, se transforme en frayeur le long de la joue. Le rocher est bien plus grand qu’il n’y parait, et il est pourvu d’extrémités tentaculaires. La peur ne saurait abuser la vérité plus longtemps : ce n’est point un rocher, c’est le crâne d’une monstruosité tant redoutée : « Un kraken ! » s’égosille l’ensemble de l’équipage qui ne fait que mettre un mot compréhensible par tous sur un spectacle d’une horreur indicible.\n\n« Tout le monde à son poste de combat !!! » ordonne [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))], et dès lors, la bête est noyée sous un déluge de fer. Ses tentacules s’enroulent toujours plus autour du mât et du pont, cherchant à faire chavirer le navire, mais les braises de notre courage ravivées par la bravoure du capitaine en première ligne nous donnent la force suffisante pour en venir à bout après une lutte acharnée.\n\n« Saluez tous [Select_CString(host.IsFemale,'la Tueuse','le Tueur')] de Kraken ! » enjoint [first_mate.GetFirstNameNoTooltip] en désignant [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))], porteu[host.Custom('FR_RSe')] du coup de grâce ayant occis le monstre."
 agot_sailing.3924.desc_horn:0 "Cela fait plusieurs jours que nous voguons sur les eaux, plusieurs jours que les vagues cognent la coque et que le vent fouette mon visage. Et c’est dans cette banalité quotidienne qu’apparaît un îlot au loin — rocher solitaire perdu au beau milieu des eaux. Le spectacle est banal, au premier abord du moins, car la banalité se fait monstruosité quand je réalise que… #high l’îlot bouge ?#!\n\nCe qui commence par un frisson le long de la nuque, se transforme en frayeur le long de la joue. Le rocher est bien plus grand qu’il n’y parait, et il est pourvu d’extrémités tentaculaires. La peur ne saurait abuser la vérité plus longtemps : ce n’est point un rocher, c’est le crâne d’une monstruosité tant redoutée : « Un kraken ! » s’égosille l’ensemble de l’équipage qui ne fait que mettre un mot compréhensible par tous sur un spectacle d’une horreur indicible.\n\nLorsque [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] s’avance en bout de proue sans piper d'ordre, certains le croit frappé de démence, mais une corne à la main, je réalise son intention. Les tentacules s’enroulent autour du navire et la gigantesque tête surgit des eaux. Un rugissement que je ne saurais décrire, même avec les plus effroyables mots trouvables dans [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip], fait trembler la surface de l’eau. Soudain, un son s’échappe du cor dans lequel souffle le capitaine, et la bête se fige d’abord, et se retire paisiblement ensuite.\n\nD’une terreur effroyable, l’ambiance se mue en une démonstration de fierté et d’allégresse. « Saluez tous [Select_CString(host.IsFemale,'la Dompteuse','le Dompteur')] de Kraken ! » enjoint [first_mate.GetFirstNameNoTooltip]."
 agot_sailing.3924.a:0 "Ce jour sera chanté dans toutes les tavernes !"
 agot_sailing.3925.t:0 "$agot_sailing.3200.t$"
 agot_sailing.3925.desc:0 "Cela fait plusieurs jours que nous voguons sur les eaux, plusieurs jours que les vagues cognent la coque et que le vent fouette mon visage. Et c’est dans cette banalité quotidienne qu’apparaît un îlot au loin — rocher solitaire perdu au beau milieu des eaux. Le spectacle est banal, au premier abord du moins, car la banalité se fait monstruosité quand je réalise que… #high l’îlot bouge ?#!\n\nCe qui commence par un frisson le long de la nuque, se transforme en frayeur le long de la joue. Le rocher est bien plus grand qu’il n’y parait, et il est pourvu d’extrémités tentaculaires. La peur ne saurait abuser la vérité plus longtemps : ce n’est point un rocher, c’est le crâne d’une monstruosité tant redoutée : « Un kraken ! » s’égosille l’ensemble de l’équipage qui ne fait que mettre un mot compréhensible par tous sur un spectacle d’une horreur indicible.\n\n« Tout le monde à son poste de combat !!! » ordonne [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))], et dès lors, la bête est noyée sous un déluge de fer, mais rien qui puisse freiner l’horreur tentaculaire qui s’abat sur l'équipage, et ni les flèches, ni les lances, ni les harpons n’en viennent à bout. Le pont est déjà jonché de corps, brisé, mutilé, démembré, massacré. Ne reste que des lambeaux de chair des morts, sur lesquels les rares survivants glissent dans leur fuite désespérée…\n\nUn tentacule vient s’enrouler autour de ma main, broyant chacun de mes doigts aussi facilement que je le ferais avec des brindilles, et rapidement la bête me traîne jusqu’à l’énorme cavité béante qui lui sert de gueule…"
 agot_sailing.3925.a:0 "Putain non ! Pas comme ça !"
 agot_sailing.3925.a.success.tt:0 "Par un quelconque miracle, vous parvenez à échapper au pire…"
 agot_sailing.3925.a.failure.tt:0 "@death_icon! #warning Vous finissez dans l’estomac du monstre, et votre sort n’est guère enviable…#!"
 agot_sailing.3925.b:0 "Je dois me libérer… à tout prix !"
 agot_sailing.3925.b.success.tt:0 "Vous réchappez au pire, mais en y laissant quelques plumes"
 agot_sailing.3925.b.failure.tt:0 "@death_icon! #warning Vous finissez dans l’estomac du monstre, moins votre main qui finit à la mer…#!"
 agot_sailing.3926.t:0 "$agot_sailing.3300.t$"
 agot_sailing.3926.desc:0 "Des courants contraires et des vents capricieux des jours durant auront rendu la progression sur les eaux bien plus lente et difficile que les plus mauvaises estimations, et des disputes commencent à éclater de part et d’autres à travers le navire.\n\nAjouter à cela les murmures à propos de provisions au plus bas qui se font entendre, et il apparaît rapidement que la situation ne va aller que de mal en pis. N’ayant d’autre choix, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] en vient à rationner les vivres qu’il nous reste, et si ses calculs sont exacts, nous devrions tous survivre — en dépit des nombreux et bruyants estomacs que l’on peut déjà entendre gargouiller de contrariété."
 agot_sailing.3926.a:0 "Il n'y a plus qu’à espérer que ses calculs soient exacts."
 agot_sailing.3926.a.fatty:0 "Rationner la bouffe ? Je dépéris déjà à vu d’œil !"
 agot_sailing.3927.t:0 "$agot_sailing.3300.t$"
 agot_sailing.3927.desc:0 "Des courants contraires et des vents capricieux des jours durant auront rendu la progression sur les eaux bien plus lente et difficile que les plus mauvaises estimations, et des disputes commencent à éclater de part et d’autres à travers le navire.\n\nAjouter à cela les murmures à propos de provisions au plus bas qui se font entendre, et il apparaît rapidement que la situation ne va aller que de mal en pis. N’ayant d’autre choix, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] en vient à rationner les vivres qu’il nous reste, mais, l’imbécile ayant grandement surévalué ses compétences, nous nous retrouvons rapidement victime de la famine."
 agot_sailing.3927.a:0 "Ma vie pour une bouchée…"
 agot_sailing.3928.t:0 "$agot_sailing.3300.t$"
 agot_sailing.3928.desc:0 "Des courants contraires et des vents capricieux des jours durant auront rendu la progression sur les eaux bien plus lente et difficile que les plus mauvaises estimations, et des disputes commencent à éclater de part et d’autres à travers le navire.\n\nAjouter à cela les murmures à propos de provisions au plus bas qui se font entendre, et il apparaît rapidement que la situation ne va aller que de mal en pis. Face à la grogne croissante, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] n’a d’autre choix que de faire montre d’une autorité sans faille : « J’ai déjà maté des régiments plus coriaces que cet équipage ! »\n\nD’une poigne de fer, le capitaine broie toute trace de mutinerie, le mécontentement s’effaçant peu à peu au profit de la discipline. Et même si le moral n’est plus au beau fixe, au moins l’équipage survivra avec des estomacs à demi-plein."
 agot_sailing.3928.a:0 "Espérons que cela suffira pour le restant de l’expédition."
 agot_sailing.3929.t:0 "$agot_sailing.3304.t$"
 agot_sailing.3929.desc:0 "Des courants contraires et des vents capricieux des jours durant auront rendu la progression sur les eaux bien plus lente et difficile que les plus mauvaises estimations, et des disputes commencent à éclater de part et d’autres à travers le navire.\n\nAjouter à cela les murmures à propos de provisions au plus bas qui se font entendre, et il apparaît rapidement que la situation ne va aller que de mal en pis. Face à la grogne croissante, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] tente de faire montre d’une autorité sans faille : « J’ai déjà maté des régiments plus coriaces que cet équipage ! » mais aussi fort qu’un[host.Custom('FR_E')] [host.GetTitleAsNameNoTooltip|l] puisse s’exprimer, [host.Custom('FR_IlElle')] ne s’exprimera jamais aussi fort qu’un estomac criant famine !\n\n[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('mutiny_leader'))|U], mu[mutiny_leader.Custom('FR_E')] par la faim, a choisi de faire fi de l’autorité du capitaine et a patiemment retourné l’entièreté de l’équipage contre [host.Custom('FR_LuiElle')]. N’ayant nul soutien, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] entame sa lente marche jusqu’au bout d'une planche, où l’attend son funeste destin…"
 agot_sailing.3929.a:0 "Adieu, capitaine."
 agot_sailing.3930.t:0 "$agot_sailing.3400.t$"
 agot_sailing.3930.desc:0 "#italic #warning Des flammes ! Des flammes à perte de vue ! La pierre fond, la mer bouillonne, et les dragons hurlent. Le monde se fend en deux !#!#!\n\nLe navire est frappé par le Fléau, comme Valyria jadis.\n\nL'équipage entier se consume, l’esprit meurtri et la chair gangréné par un mal d’une nature inconnue. Je reconnais [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] qui approche, mais il est déjà trop tard. #bold #warning Nous sommes perdus ! Perdus !#!#!\n\n« N’ayez crainte mes amis ! Tout cela n’est que votre imagination ! » Je me raccroche à la voix du capitaine, comme à une planche de salue au beau milieu d’une tempête, et les brumes de la démence qui se sont emparées de moi comme du reste de l'équipage sont soufflées. La raison, à l’image de la marée, revient progressivement. Il n'y a pas la moindre trace de Fléau dans l’air, juste une démence nourrie par les légendes et vivifiée par la fatigue d’un très — trop long — voyage."
 agot_sailing.3930.a:0 "Ce n’est pas le moment de craquer. Nous y sommes presque…"
 agot_sailing.3931.t:0 "$agot_sailing.3400.t$"
 agot_sailing.3931.desc:0 "Alors que nous voguons vers la encore bien trop lointaine Valyria, le capitaine sort de sa cabine comme un possédé : « N’ayez crainte mes amis ! Tout cela n’est que votre imagination ! » Faisant fi des regards de stupéfaction qu'il attire sur lui, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] s'élance vers la barre pour prendre le contrôle du navire.\n\n« Arrêtez capitaine ! » objecte [first_mate.GetFirstName] en sa qualité de commandant en second, s’interposant pour ne pas laisser la folie au commande de cette expédition. L’esprit rongé par un mal inconnu, il dédaigne la raison et les tentatives de le rasséréner, préférant empoigner son arme. Rapidement, le capitaine se retrouve agrippé par son propre équipage, pour son propre bien. « Vous avez perdu l’esprit ! » affirme son second, qui nous donne l’ordre de l’enfermer dans sa cabine.\n\nAprès de vives délibérations, la décision est prise de rebrousser chemin. [ROOT.Char.Custom('FR_CeluiCelle')|U] qui était [ROOT.Char.Custom('FR_LeLa')] plus à même de nous mener à bon port jusqu’à l’Antique Valyria ayant perdu la raison, et cette folie soudaine étant sans nul doute l’augure envoyée par les dieux pour nous avertir de bien plus funestes dangers à venir, la seule chose qu’il nous reste à faire est encore d’accepter que cette entreprise était vouée à l’échec depuis le début…"
 agot_sailing.3931.a:0 "Le Fléau demeure, et la folie guette les imprudents !"
 agot_sailing.3932.t:0 "$agot_sailing.3501.t$"
 agot_sailing.3932.desc:0 "Une expédition vers Valyria n’est point une sinécure, néanmoins, constatant que le vent et les eaux nous sont favorables, j’en viens à penser que nous sommes face à une accalmie dans l’immensité des aléas de notre périple. Mais comme pour punir ma sotte naïveté, je vois une noirceur poindre à l’horizon…\n\nLe vent, les eaux, le temps, tout ce qui jusque-là semblait être nos alliés semblent avoir subitement décidés de conjurer notre perte, et tandis que le navire est rudoyé par les rafales et les vagues et la bruine diluvienne, il apparaît au loin que tout ceci n’est que prémices pour de plus sombres nuées encore. Mais parce que Valyria attend quelque part au-delà de cet horizon de noir et de gris, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] nous fait savoir qu’il n’y aura nulle retraite : « #EMP En avant toute !#! » \n\nLes vagues et les éclairs se succèdent, encore et encore, jusqu’à ce que finalement un perçant rayon de soleil nous apporte la délivrance. Le navire parvient à glisser hors de la tempête, et alors que je recrache la moitié de l'océan par-dessus bord, j'entends ce que je n'osais plus croire possible : « #positive_value Terre ! Terre en vue !#! »"
 agot_sailing.3932.a:0 "Enfin… #bold Enfin !#!"
 agot_sailing.3933.t:0 "$agot_sailing.3502.t$"
 agot_sailing.3933.desc:0 "Une expédition vers Valyria n’est point une sinécure, néanmoins, constatant que le vent et les eaux nous sont favorables, j’en viens à penser que nous sommes face à une accalmie dans l’immensité des aléas de notre périple. Mais comme pour punir ma sotte naïveté, je vois une noirceur poindre à l’horizon…\n\nLe vent, les eaux, le temps, tout ce qui jusque-là semblait être nos alliés semblent avoir subitement décidés de conjurer notre perte, et tandis que le navire est rudoyé par les rafales et les vagues et la bruine diluvienne, il apparaît au loin que tout ceci n’est que prémices pour de plus sombres nuées encore. Mais parce que Valyria attend quelque part au-delà de cet horizon de noir et de gris, [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] nous fait savoir qu’il n’y aura nulle retraite : « #EMP En avant toute !#! »\n\nLe tonnerre éclate et l’éclair qu’il précède fait tomber le grand mât d’un seul coup, écrasant quelqu’un juste sous mes yeux. La pluie est si violente que je ne parviens même pas à retrouver mon chemin jusqu’au pont inférieur. Avant qu'une vague s’abatte sur moi, il me semble entendre le capitaine gueuler quelque chose, mais quelle différence cela peut-il faire désormais ? Par la faute de [Select_CString(host.IsFemale,'cette sombre conne','ce pauvre con')], me voilà engloutit dans l’obscurité…"
 agot_sailing.3933.a:0 "#warning …#!"
 agot_sailing.3934.t:0 "$agot_sailing.3900.t$"
 agot_sailing.3934.desc:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))|U] laisse échapper un soupir de contentement : « Nous y sommes… enfin, nous y sommes… »\n\nAprès tant de déboire, après tant de mésaventure, après tant de calamité, notre capitaine est parvenu à nous emmener jusqu’ici, et tandis qu’[host.Custom('FR_IlElle')] contemple l’amas d'îles brisées qui gît devant nous, l’équipage éclate d’une joie tonitruante — mais le périple est-il vraiment terminé ?\n\nOù que notre regard se pose, il n’y a qu’un dédale de falaises abruptes et de colonnes de roches érigées telles des lances comme pour dissuader les éventuels chanceux qui seraient arrivés jusque-là. Et les amas de fumée qui s’échappent de part et d’autres, aussi bien de l’eau que de la pierre, laissent à penser que la calamité qui a balayé les seigneurs dragons d’alors n’a point tout à fait disparu. Ces contrées sont maudites, et jamais, nultemps jamais, le temps n’y changera quoi que ce soit…\n\nMais Valyria est enfin à portée de main, et des récompenses attendent peut-être les plus braves parmi les braves !"
 agot_sailing.3934.a:0 "Que va choisir de faire [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] ?"
 agot_sailing.3935.t:0 "$agot_sailing.3901.t$"
 agot_sailing.3935.desc:0 "« Pouvoir poser mes yeux sur cette merveille est déjà une récompense en soi. »\n\nTels sont les mots qui scellent ici la fin de notre périple. [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))|U] a eu son content de rencontre avec la mort durant les dernières semaines, et je puis aisément comprendre cela. Le spectacle qui s’offre à nous est plus que suffisant pour contenter notre soif de richesse tandis que le navire longe les côtes — aussi près que la prudence nous le permette.\n\nCe que je devine avoir été des tours ne s’élèvent plus si haut qu’elles le fîmes jadis, mais encore bien assez pour émoustiller mon imagination. Des restants de piliers, de murs et de palais suffisent à faire renaître la Valyria des beaux jours dans mon esprit, et ce sans même avoir besoin de clore les paupières. Je vois devant moi maints merveilles : des tours qui tutoient les cieux, des bêtes ailées gigantesques, et un peuple au sommet de tout, au sommet de la civilisation, au sommet des cieux, siégeant dans les hauteurs infinies…\n\nLe soleil décline à l’horizon quand nous reprenons la route. #italic Nous l’avons vu. Nous en avons été témoins. L’Antique Valyria…#!\nPourtant, au fond de moi je ne peux m’empêcher de penser à l’idée que nous aurions pu en voir plus… beaucoup plus."
 agot_sailing.3935.a:0 "Participer à cette expédition fut un grand honneur."
 agot_sailing.3936.t:0 "$agot_sailing.3907.t$"
 agot_sailing.3936.desc_good:0 "Quelle aventure, mes aïeux ! Et quel soulagement d’en ressortir vivant[ROOT.Char.Custom('FR_E')] !\n\nNous embarquons sur le navire qui nous a fidèlement amené jusqu’ici, pour que puisse s’entamer le voyage de retour.\n\nLe capitaine jette un dernier regard sur les vestiges d’une époque lointaine, sans doute dans un entrain de fierté teinté de mélancolie, et lorsqu’[host.Custom('FR_IlElle')] monte à bord, j’opine d’un hochement de camaraderie."
 agot_sailing.3936.desc_bad:0 "Quelle aventure, mes aïeux ! Et quel soulagement d’en ressortir vivant[ROOT.Char.Custom('FR_E')] !\n\nNous embarquons sur le navire qui nous a fidèlement amené jusqu’ici, pour que puisse s’entamer le voyage de retour.\n\n[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))|U] jette un dernier regard sur les vestiges d’une époque lointaine, sans doute dans un entrain de fierté teinté de mélancolie, et lorsqu’[host.Custom('FR_IlElle')] monte à bord, j’opine d’un hochement de camaraderie, quand subitement [Select_CString(host.IsFemale,'la voilà prise','le voilà pris')] d’une étrange sensation.\n\nSes palpitations sont de mauvaises augures, et lorsqu’après une atroce douleur, [host.Custom('FR_IlElle')] se met à cracher de la fumée, cette vision d’horreur me terrifie. Mais pour un fugace instant, malheureusement, car je finis moi aussi par ressentir la même étrange et funeste sensation…"
 agot_sailing.3936.desc_bad_two:0 "Quelle aventure, mes aïeux ! Et quel soulagement d’en ressortir vivant[ROOT.Char.Custom('FR_E')] !\n\nNous embarquons sur le navire qui nous a fidèlement amené jusqu’ici, pour que puisse s’entamer le voyage de retour.\n\n[ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))|U] jette un dernier regard sur les vestiges d’une époque lointaine, sans doute dans un entrain de fierté teinté de mélancolie, et lorsqu’[host.Custom('FR_IlElle')] monte à bord, j’opine d’un hochement de camaraderie. Lorsque nous commençons à faire voile vers notre foyer, un bruit provenant de la cabine du capitaine m’attire.\n\nL’horreur auquel j’assiste en ouvrant la porte est au-delà de tous mots que je pourrais user pour la décrire. [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))|U] se tord de douleur, et une chaleur anormale se dégage de son corps. Sous sa peau semble grouiller des formes vivantes, et [host.Custom('FR_LeLa')] meurtrir de la pire des manières.\n\nRapidement, je partage sa douleur, non par un sens aigu de l’empathie, mais parce que les mêmes formes étranges se meuvent dans ma propre chair…"
 agot_sailing.3936.desc_cancelled:0 "Victime des affres divines ou d’une mauvaise fortune, notre expédition vers l’Antique Valyria n’est guère un succès, et il nous faut désormais faire voile pour rentrer chez nous.\n\nDu reste, nous rentrons en vie, et si pour certains ce n’est point un motif de soulagement, au moins ceux-là vivront pour ruminer leurs regrets."
 agot_sailing.3936.a_good:0 "Ce fut un honneur de participer à cette expédition."
 agot_sailing.3936.a_bad:0 "$agot_sailing.3907.a_bad$"
 agot_sailing.3937.t:0 "$agot_sailing.3903.t$"
 agot_sailing.3937.desc:0 "Tout du long de notre traversée de la Mer Fumeuse, nous n’avons pour tout paysage que ces falaises morcelées et fumantes. Notre recherche infructueuse d’un lieu sûr pour accoster nous contraint à aller toujours plus avant, mais dans cette attente insupportable, je me console en imaginant les montagnes de richesses qui nous attendent. De l’or à ne plus savoir quoi en faire, des joyaux plus gros que des poings, et bien entendu, le plus précieux et le plus enviable de tous les trésors : l’acier valyrien. Tout cela sera bientôt mien.\n\n#EMP #warning CRAC !!!#!#!\n\nQuelque chose vient de s’abattre sur le grand mât : un énorme rocher de feu, qui a tout simplement traversé le pont principal. En un instant, un incendie se déclare, consumant le bois et propageant les flammes. La vitesse est notre seule alliée désormais, mais le feu se déclare en de multiples endroits. Le mât, le pont principal, les voiles, le pont inférieur, tout est déjà noyé dans le rouge et l’orange embrasé. « Ce lieu est maudit ! » ; « Le Fléau va tous nous emporter ! » Les cris fussent de tous sens, et gangréné[ROOT.Char.Custom('FR_E')] par la panique générale, je jurerais de voir les flammes prendre vie et dévorer les uns et les autres. N’ayant plus le choix, je me jette dans la Mer Fumeuse, et rapidement, je regrette de ne pas avoir donner leur chance aux flammes…"
 agot_sailing.3937.a:0 "$agot_sailing.3903.a$"
 agot_sailing.5500.t:0 "La traque commence"
 agot_sailing.5500.desc:0 "Une étendue de bleu à perte de vue, mais qui pour moi s’apparente à un océan de possibilités. Là, quelque part, se trouve notre récompense, et il nous faut la dénicher.\n\n[first_mate.GetFirstName], qui me sait fébrile, s’approche : « Tout le monde est à l’affût capitaine. Pas un aileron n’échappera à notre vigilance. »\n\nJ’acquiesce. Tout le monde est à l’affût, moi [Select_CString(ROOT.Char.IsFemale,'la première','le premier')]…"
 agot_sailing.5500.desc.a:0 "Convaincu[ROOT.Char.Custom('FR_E')] que la mer a autre chose à nous offrir, je laisse la bête disparaître dans les noires profondeurs, au grand dam de certains membres d'équipage, et ordonne à tous de se tenir prêts.\n\nUne autre proie ne tardera pas à se montrer…"
 agot_sailing.5500.a:0 "Ne reste qu'à patienter maintenant…"
 agot_sailing.5500.a.tt:0 "#high Vous vous mettez en chasse#!"
 agot_sailing.5501.t:0 "Proie en vue !"
 agot_sailing.5501.desc.a:0 "« Tortue ! Tortue à bâbord ! » alerte un membre d'équipage.\n\nJe l’aperçois : grande, verte, paisible ; une créature aussi humble qu’élégante.\n\n« Quels sont vos ordres, capitaine ? » me demande [first_mate.GetFirstNameNoTooltip]."
 agot_sailing.5501.a:0 "Une prise facile n’en reste pas moins une prise…"
 agot_sailing.5501.a.tt:0 "Vous prenez en chasse #high la tortue de mer#!"
 agot_sailing.5501.desc.b:0 "« Phoque ! Phoque à bâbord ! » alerte un membre d’équipage.\n\nJe l’aperçois : gris, potelé ; un animal plus agile qu’il n’y paraît.\n\n« Quels sont vos ordres, capitaine ? » me demande [first_mate.GetFirstNameNoTooltip]."
 agot_sailing.5501.b:0 "Virez de bord !"
 agot_sailing.5501.b.tt:0 "Vous prenez en chasse #high le phoque#!"
 agot_sailing.5501.desc.c:0 "« Dauphin ! Dauphin à bâbord ! » alerte un membre d’équipage.\n\nJe l’aperçois : blanc, élancé ; une véritable beauté des mers.\n\n« Un dauphin blanc, capitaine ! Quels sont vos ordres ? » me demande [first_mate.GetFirstNameNoTooltip]."
 agot_sailing.5501.c:0 "Virez de bord !"
 agot_sailing.5501.c.tt:0 "Vous prenez en chasse #high le dauphin blanc#!"
 agot_sailing.5501.desc.d:0 "« Morse ! Morse à bâbord ! » alerte un membre d’équipage.\n\nJe l’aperçois : massif, imposant ; un véritable colosse des mers.\n\n« Quels sont vos ordres, capitaine ? » me demande [first_mate.GetFirstNameNoTooltip]."
 agot_sailing.5501.d:0 "Ses défenses valent leur pesant d’or ! En avant !"
 agot_sailing.5501.d.tt:0 "Vous prenez en chasse #high le morse#!"
 agot_sailing.5501.desc.e:0 "« Orque ! Orque à bâbord ! » s’égosille une âme enthousiaste.\n\nJe l’aperçois : Imposant, tout de blanc et de noir. Une créature aussi redoutable que magnifique ; un trophée hors du commun.\n\n« Quels sont vos ordres, capitaine ? » me demande [first_mate.GetFirstNameNoTooltip], impatient[first_mate.Custom('FR_E')] d'en découdre."
 agot_sailing.5501.e:0 "Allons chasser de l’orque !"
 agot_sailing.5501.e.tt:0 "Vous prenez en chasse #high l’orque#!"
 agot_sailing.5501.desc.f:0 "« Baleine ! Baleine à tribord ! » s’égosille une âme des plus enthousiastes.\n\nLa gigantesque créature surgit des profondeurs, propulsant un énorme jet d’eau.\n\n« Une baleine à bosse, capitaine ! Quels sont vos ordres ? » me demande fébrilement [first_mate.GetFirstNameNoTooltip] qui peine à contenir sa joie."
 agot_sailing.5501.f:0 "À vos harpons !"
 agot_sailing.5501.f.tt:0 "Vous prenez en chasse #high la baleine à bosse#!"
 agot_sailing.5501.desc.g:0 "« Cachalot ! Cachalot à tribord ! » s’égosille une âme des plus enthousiastes.\n\nLa gigantesque créature surgit des profondeurs, propulsant un énorme jet d’eau.\n\n« Un cachalot, capitaine ! Quels sont vos ordres ? » me demande fébrilement [first_mate.GetFirstNameNoTooltip] qui peine à contenir sa joie."
 agot_sailing.5501.g:0 "À vos harpons !"
 agot_sailing.5501.g.tt:0 "Vous prenez en chasse #high le cachalot#!"
 agot_sailing.5501.desc.h:0 "« Baleine ! Baleine à tribord ! » s’égosille une âme extatique.\n\nLa gigantesque bête surgit et crache une non moins gigantesque gerbe d’eau. C’est une baleine, oui, mais point ordinaire.\n\n« Une baleine bleue, capitaine ! Quels sont vos ordres ? » me demande [first_mate.GetFirstNameNoTooltip] qui trépigne d’impatience avec le reste de l’équipage."
 agot_sailing.5501.h:0 "Hors de question de laisser filer un pareil spécimen !"
 agot_sailing.5501.h.tt:0 "Vous prenez en chasse #high la baleine bleue#!"
 agot_sailing.5501.desc.i:0 "« #EMP Kraken !#! » Le cri de la vigie qui semble surgir du fond de ses entrailles suffit à plonger dans un mutisme béant l’ensemble de l'équipage. Plus un bruit n’en émane. Ni pas, ni murmure, ni respiration. Les yeux sont médusés, les corps figés, et face à cette terreur, un monstre des mers qui déploie ses effroyables tentacules et laisse échapper un hurlement indicible et indescriptible.\n\n« Vos… vos ordres… capitaine ? » balbutie [first_mate.GetFirstNameNoTooltip], dont le regard n’a pas décroché de la bête un seul instant…"
 agot_sailing.5501.i:0 "Rassemblez ce qu’il vous reste de courage et préparez-vous à mourir !"
 agot_sailing.5501.i.tt:0 "Vous prenez en chasse #high le kraken#!"
 agot_sailing.5501.desc.j:0 "« Baleine ! Baleine blanche droit devant ! » s’égosille une âme mortifiée.\n\nL’imposante forme surgit depuis les profondeurs, et lorsque de tout son poids, elle plie la surface de l’eau, le navire s’en trouve secoué et l’équipage renversé. La chasse n’a point véritablement commencé que déjà deux âmes se retrouvent jetées par-dessus bord. [first_mate.GetFirstNameNoTooltip] rampe, le visage livide comme si la mort l’avait déjà emporté[first_mate.Custom('FR_E')] :\n\n« La… la Terreur Blanche, capitaine ! La Terreur Blanche ! Les légendes en parlent comme d’une monstruosité malicieuse qui hante les eaux de la Mer Grelotte ! Nombreux sont les navires à reposer dans les abysses pour s’être attirés sa fureur ! Cette bête sonne notre perte à tous ! »"
 agot_sailing.5501.desc.k:0 "Tout est d'un calme plat, la mer autant que l’équipage. #italic Le calme avant la tempête#!, me dis-je avant que la vigie ne s’égosille : « Baleine ! Baleine blanche en vue ! » comme pour donner à mes pensées un caractère prophétique.\n\nLa bête, gigantesque, que dis-je, gargantuesque, se révèle à l’horizon, et de sa masse, fend les flots. Je n’ai alors qu’un seul réflexe face à cette mort qui déferle pour nous emporter tous dans les abysses : « À vos harpons ! Et souillez moi ce blanc d’un rouge de sang ! »"
 agot_sailing.5501.reroll:0 "\n\nPuisque nous n'avons que trop tarder, il nous faudra nous contenter de ça."
 agot_sailing.5501.j:0 "Je pourfendrais cette terreur de mes mains !"
 agot_sailing.5501.j.tt:0 "Vous prenez en chasse #high la Terreur Blanche#!"
 agot_sailing.5501.k:0 "Continuons les recherches."
 agot_sailing.5501.k.tt:0 "Vous continuez la traque en vue d’une autre proie"
 agot_sailing.5501.l:0 "Foutons le camp d’ici !"
 sailing.hunt.success:0 "Après avoir hissé votre prise à bord du navire, vous faites voile vers [location.GetNameNoTooltip]"
 sailing.hunt.failure.tt:0 "Vous ratez votre cible"
 sailing.hunt.failure:0 "Vous perdez de vue votre proie"
 agot_sailing.5502.t:0 "La tortue de mer"
 agot_sailing.5502.desc:0 "Les pieds fermement ancrés sur le pont, et la main resserrée sur mon harpon, l’équipage me dévisage d’un regard empli d’appréhension.\n\nLa tortue est là, nageant paisiblement près du navire sous mon regard assassin. Je brandis sa mort bien haut, me préparant à frapper.\n\n#italic Un peu plus à droite…#!"
 agot_sailing.5502.a:0 "*#high Inspirer#!*"
 agot_sailing.5502.a.success:0 "Vous tuez la tortue de mer"
