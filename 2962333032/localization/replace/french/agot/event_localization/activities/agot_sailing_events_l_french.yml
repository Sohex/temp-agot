 agot_sailing.5505.desc:0 "Les pieds fermement ancrés sur le pont, et la main resserrée sur mon harpon, l’équipage me dévisage d’un regard empli d’appréhension.\n\nLe morse est là, paisiblement affalé sur un ilôt sous mon regard assassin. Je brandis sa mort bien haut, me préparant à frapper.\n\n#italic Un peu plus à droite…#!"
