l_french:
 agot_commission_special_artifact_crown.0001.t:0 "Commission d'une couronne"
 agot_commission_special_artifact_crown.0001.desc:0 "Le droit à posséder une couronne n’est point chose commune, non moins que posséder le pouvoir de s'en coiffer le chef. L’heure est venue de forger un nouveau symbole qui témoignera de mon règne et le légitimera au vu et au su de tous, afin que nul n’oublie jamais ni mon nom ni mes actes. En commandant un tel ouvrage, j’assurerais à ma lignée un héritage qui fera perdurer mon influence pour les générations à venir."
 agot_commission_special_artifact_crown.0001.desc_coronation:0 "Un couronnement ne saurait se faire sans couronne, et c'est pourquoi je ferais forger ce qui deviendra un héritage qui se transmettra de génération en génération, faisant ainsi perdurer mon nom et mon influence bien au-delà de ma seule existence."
 agot_commission_special_artifact_crown.0001.a:0 "Celle-ci sera parfaite."
 agot_commission_special_artifact_crown.0001.b:0 "Après mûre réflexion…"
 agot_commission_special_artifact_crown_spouse.0001.desc:0 "Le droit à posséder une couronne n’est point chose commune, non moins que posséder le pouvoir de s'en coiffer le chef, mais mon épou[ROOT.Char.Custom('FR_XSeOpp')] n’est pas du commun. Je ferais forger une coiffe digne de son rang.\n"
 agot_commission_special_artifact_armor.0001.t:0 "Commission d'une armure"
 agot_commission_special_artifact_armor.0001.desc:0 "Bien sot est celui qui ne voit qu’une banale protection dans une armure. Comme tant d’autres ouvrage que peut revêtir un[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetTitleAsNameNoTooltip|l], c’est également un symbole de pouvoir, de richesse ou de statut. Il me faut en faire forger une nouvelle, pour ainsi mettre à l’abri mon nom des dégâts du temps et de l’oubli."
 agot_commission_special_artifact_armor.0001.a:0 "Celle-ci sera parfaite."
 agot_commission_special_artifact_armor.0001.b:0 "Après mûre réflexion…"