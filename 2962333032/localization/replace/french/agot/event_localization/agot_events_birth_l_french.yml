 agot_birth_events.1501.a:0 "Puisse [ROOT.Char.GetFaith.FertilityGodName] faire montre de miséricorde."
 birth.3001.desc_incompatible_biology:0 "\n\n[Select_CString(ROOT.Char.HasTrait( GetTrait('callous') ), 'Cette chose est une monstruosité difforme', 'L’enfant est difforme' )] — une ignoble difformité qui rendrait certains rétifs à y voir un[dummy_gender.Custom('FR_E')] enfant. Je le sais car derrière les larmes sincères de la sage-femme se trouve du dégoût à tenir"
 birth.3001.desc_incompatible_biology.nohead:0 "un corps sans tête…"
 birth.3001.desc_incompatible_biology.eightdigits:0 "un corps ayant bien trop de doigts à chaque main…"
 birth.3001.desc_incompatible_biology.threeeyes:0 "un corps ayant trois yeux au lieu de deux…"
 birth.3001.desc_incompatible_biology.fisheyes:0 "un corps aux yeux livides et globuleux comme ceux d’un poisson…"
 birth.3001.desc_incompatible_biology.unicornhorn:0 "un corps dont l’excroissance sur le front suggère l’idée d’une corne inachevée…"
 birth.3001.desc_incompatible_biology.fur:0 "un corps couvert d’une fourrure semblable à celle que l’on prête aux Hommes Velus des légendes…"