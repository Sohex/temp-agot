l_french:
 agot_bells_of_war.0001.t:0 "Les méandres du pouvoir"
 agot_bells_of_war.0001.desc:0 "J’ai défait la Grande Norvos et les bigots qui la gouvernent, puis, fort de cette victoire, je me suis tourné vers la Hache pour y chasser les Ibbéniens qui s’y sont installés, pensant obtenir une victoire aussi aisée que la première. Aujourd’hui, me voilà empêtré dans une guerre contre [ibbenese_colony_leader.Custom('FR_le_Char_Pi')][ibbenese_colony_leader.GetTitledFirstName], la faute à un terrain qui lui est favorable, tandis que mes troupes peinent à s’adapter.\n\nJ’ai placé Lorath sur le chemin de la grandeur, mais le trajet est plus sinueux qu’au premier abord. Je n’ai maintenant d’autres choix que d’écraser mes ennemis au plus vite, car au moindre signe de faiblesse de ma part, nombreux sont ceux qui viendront réclamer ma tête."
 agot_bells_of_war.0001.a:0 "Ces chiens d’Ibbéniens ne tarderont pas à grelotter de peur !"
 agot_bells_of_war.0002.t:0 "Pour qui sonne la guerre"
 agot_bells_of_war.0002.desc:0 "Cela fait presque trois ans depuis la défaite de la Grande Norvos contre Lorath. Presque trois ans à ruminer ma vengeance…\n\nLes élections approchant à grand pas, si je suis élu, je pourrais faire regretter aux Lorathi d’être sortis de leur foutrerie de labyrinthe, chose à laquelle je me prépare depuis si longtemps. Et il en sera d’autant plus aisée que les rapports des éclaireurs indiquent que [lorathi_leader.Custom('FR_le_Char')][lorathi_leader.GetName] est embourbé dans une guerre qui s’éternise contre les Ibbéniens de la Hache.\n\nDu reste, Lorath demeure une menace, et il en sera ainsi tant que nous ne trouverons pas des alliés. [qohor_m1.Custom('FR_le_Char')|U][qohor_m1.GetName] est parmi les favoris pour les prochaines élections, et s’il advenait qu'elle se hisse à la tête de la cité, nous pourrions organiser une contre-attaque et écraser ces chiens de Lorathi."
 agot_bells_of_war.0002.a:0 "Vienne l’heure où les cloches sonneront notre victoire !"
 agot_bells_of_war.0003.t:0 "Aux portes du pouvoir"
 agot_bells_of_war.0003.desc:0 "[old_qohor_guy.Custom('FR_le_Char_Pi')|U][old_qohor_guy.GetTitledFirstName] est mourant…\n\nBien entendu, ma candidature demeure putative jusqu’à son décès, mais les ouï-dire vont grand train à travers la cité, et tous corroborent que je suis parmi les favoris pour le poste de Premier Magistrat. Le seul qui semble en mesure de pouvoir me couper l’herbe sous le pied se trouve être [qohor_m2.Custom('FR_le_Char_Pi')][qohor_m2.GetTitledFirstName] — mon opposant politique non moins qu'idéologique.\n\nQohor doit se montrer forte et implacable, raison pour laquelle, si je venais à être élue, je lancerais une contre-attaque face à la vermine lorathi. Cette démonstration de puissance réaffirmerait la cité aux yeux des étrangers et néantiserait toute dissension interne, faisant ainsi d’une pierre deux coups."
 agot_bells_of_war.0003.a:0 "Mais encore faut-il que je remporte les élections…"
 agot_bells_of_war.0004.t:0 "Aux portes du pouvoir"
 agot_bells_of_war.0004.desc:0 "[old_qohor_guy.Custom('FR_le_Char_Pi')|U][old_qohor_guy.GetTitledFirstName] n’en a plus pour très longtemps…\n\nIl apparaît évident aux yeux de tous que l’élection pour lui succéder se jouera entre moi et [qohor_m1.Custom('FR_le_Char_Pi')][qohor_m1.GetTitledFirstName], cette imbécile qui souhaite frayer avec la vermine norvoshi, celle-là même qui a tant œuvré à la perte de Qohor par le passé.\n\nSi je suis élu, Norvos paiera pour ses crimes. Nombreux le savent, et c’est pourquoi nombreux sont ceux à me soutenir !"
 agot_bells_of_war.0004.a:0 "Je mènerais Qohor vers la prospérité, et ses ennemis vers l’anéantissement !"
 agot_bells_of_war.0005.t:0 "Une élection imminente"
 agot_bells_of_war.0005.desc:0 "Ma vie arrive à son terme, tout comme mon mandat de Premier Magistrat.\n\nMes propres sujets semblent impatients de ma mort, car une fois cette affaire close, une nouvelle page se tournera vers Qohor. Que puis-je faire, si ce n’est attendre ma propre mort…"
 agot_bells_of_war.0005.a:0 "Pour l’heure je suis là, alors patience."
 agot_bells_of_war.0006.t:0 "Le tournoi des écuyers"
 agot_bells_of_war.0006.desc:0 "Voici qu’arrive à grand pas l’anniversaire de [daemon_blackfyre.GetFirstName]. Si je dois admettre ne pas avoir été présent à ses côtés autant qu’il m'aurait fallu l’être, mon affection pour lui n’en est en rien diminuée, et de cela je défie quiconque d’oser le prétendre.\n\nDe tous mes enfants, c’est peut-être celui que je chéris le plus, et en l’honneur de cet amour paternel, je compte lui faire don d’un présent qui marquera le royaume à jamais.\n\nC’est un garçon valeureux, qui nourrit pour le combat à l’épée une grande passion. Voilà pourquoi j’ai décidé d’organiser ce grand tournoi qui réunira tous les plus illustres écuyers, et lui permettra de faire ses preuves aux yeux de tous."
 agot_bells_of_war.0006.a:0 "Que le Guerrier guide votre lame !"
 agot_bells_of_war.0007.t:0 "La première-née de Valyria"
 agot_bells_of_war.0007.desc:0 "Que la grisécaille emporte ces tourne-casaques de Volantains !\n\n[rhoynar_confederation.GetName] a saigné aux côtés [volantis_invader.Custom('FR_du_Char_Pi')][volantis_invader.GetTitledFirstName] pour lui permettre de prendre possession de Gar Sagon, et toute honte bue, ce chien s’est retourné contre nous.\n\nNos frères Rhoynar, eux, ne nous aurons pas abandonnés. En réponse à mon appel, les voilà ralliant leurs bannières à la mienne. Ensemble, nous allons bouter ces prétendus héritiers des dragons loin de la Rhoyne…"
 agot_bells_of_war.0007.a:0 "Et sous peu, ils les rejoindront dans la tombe !"
 agot_bells_of_war.0008.t:0 "L’attaque des Rhoynar"
 agot_bells_of_war.0008.desc:0 "Les Rhoynar ont su jouer leur rôle à merveille dans la conquête de Gar Sagon, mais je ne puis m’appesantir de considérations triviales et les laisser proliférer davantage dans la région. Il serait insultant pour les héritiers des dragons de frayer avec la vermine fangeuse.\n\nJ’ai en ma possession une puissante forteresse et un ost redoutable. Je triompherai encore et encore, pour permettre à la plus antique et vénérable fille de Valyria de prospérer !"
 agot_bells_of_war.0008.a:0 "Il me reste encore tant à entreprendre. Qu’on en finisse rapidement !"
 agot_bells_of_war.0020.t:0 "Le début du tournoi"
 agot_bells_of_war.0020.desc:0 "Le sort ayant choisi qui affrontera qui, le tournoi peut débuter !\n\n[squire_1.Custom('FR_le_Char')|U][squire_1.GetName][squire_1.Custom('AGOTGetSurname')] affrontera [squire_2.Custom('FR_le_Char')][squire_2.GetName][squire_2.Custom('AGOTGetSurname')]\n\n[squire_3.Custom('FR_le_Char')|U][squire_3.GetName][squire_3.Custom('AGOTGetSurname')] affrontera [squire_4.Custom('FR_le_Char')][squire_4.GetName][squire_4.Custom('AGOTGetSurname')]\n\n[squire_5.Custom('FR_le_Char')|U][squire_5.GetName][squire_5.Custom('AGOTGetSurname')] affrontera [squire_6.Custom('FR_le_Char')][squire_6.GetName][squire_6.Custom('AGOTGetSurname')]\n\n[squire_7.Custom('FR_le_Char')|U][squire_7.GetName][squire_7.Custom('AGOTGetSurname')] affrontera [squire_8.Custom('FR_le_Char')][squire_8.GetName][squire_8.Custom('AGOTGetSurname')]\n\n[squire_9.Custom('FR_le_Char')|U][squire_9.GetName][squire_9.Custom('AGOTGetSurname')] affrontera [squire_10.Custom('FR_le_Char')][squire_10.GetName][squire_10.Custom('AGOTGetSurname')]\n\n[squire_11.Custom('FR_le_Char_Pi')|U][squire_11.GetName][squire_11.Custom('AGOTGetSurname')] affrontera [squire_12.Custom('FR_le_Char')][squire_12.GetName][squire_12.Custom('AGOTGetSurname')]\n\n[squire_13.Custom('FR_le_Char')|U][squire_13.GetName][squire_13.Custom('AGOTGetSurname')] affrontera [squire_14.Custom('FR_le_Char')][squire_14.GetName][squire_14.Custom('AGOTGetSurname')]\n\n[squire_15.Custom('FR_le_Char')|U][squire_15.GetName][squire_15.Custom('AGOTGetSurname')] affrontera [squire_16.Custom('FR_le_Char')][squire_16.GetName][squire_16.Custom('AGOTGetSurname')]"
 agot_bells_of_war.0020.a:0 "Que le tournoi commence !"
 agot_bells_of_war.0021.t:0 "Les finalistes"
 agot_bells_of_war.0021.desc:0 "Le tournoi a été riche en rebondissements, et chacun des participants a redoublé d’efforts et d’acharnement.\n\nDésormais vient le moment pour [top_bracket_finalist.Custom('FR_le_Char')][top_bracket_finalist.GetName] d’affronter [bottom_bracket_finalist.Custom('FR_le_Char')][bottom_bracket_finalist.GetName] pour le titre de champion."
 agot_bells_of_war.0021.desc_daemon_blackfyre_flavor:0 "\n\nJe savais que mon fils me rendrait fier et je savais qu’il s'épanouirait dans un tel environnement. Il est sans nul doute le meilleur bretteur de sa génération. Il est né pour porter une épée. Il est destiné à en manier une.\n\nUn tel prodige, s’il venait à remporter le tournoi, ne saurait être récompensé dûment par une vulgaire babiole. À un tel guerrier ne pourrait convenir qu’un présent hors du commun."
 agot_bells_of_war.0021.a:0 "Le royaume vous regarde !"
 agot_bells_of_war.0022.t:0 "Le champion du tournoi"
 agot_bells_of_war.0022.desc:0 "Les acclamations se font aussi retentissantes que le tonnerre, pour ainsi célébrer la victoire de [champion.GetFirstName] contre [loser.GetFirstName].\n\nNul ne peut contester son triomphe acquis vaillamment, et il est désormais en droit d’attendre une récompense pour son haut fait."
 agot_bells_of_war.0022.desc_generic_aegon_bastard_flavor:0 "\n\nMaintenant que le royaume a été témoin de sa prouesse, qui donc oserait nier qu’il est un authentique Targaryen ? Qui donc oserait douter que la force de l’Antique Valyria coule dans ses veines ?\n\nIl est de mon sang, mais plus encore, il est mon fils. Le fils prodige le plus digne d’honneur que les dieux ont daigné m’accorder !"
 agot_bells_of_war.0022.a:0 "Vous avez prouvé votre valeur, [champion.GetName]. Félicitations."
 agot_bells_of_war.0022.generic_targaryen_description:0 "Vous faites honneur au sang du dragon qui coule dans vos veines !"
 agot_bells_of_war.0022.baelor_or_maekar_extra_snark:0 "Au contraire de son père, [champion.GetFirstNameNoTooltip] est un authentique et valeureux guerrier !"
 agot_bells_of_war.0022.b:0 "[champion.GetFirstNameNoTooltip] mérite une faveur royale et la reconnaissance du roi !"
 agot_bells_of_war.0022.c:0 "Je ne lui accorderais que ce qui est attendu pour le vainqueur du tournoi…"
 agot_bells_of_war.0023.t:0 "Les conséquences du tournoi"
 agot_bells_of_war.0023.desc:0 "Voilà un moment déjà que [champion.GetFirstName] a été dûment rétribué pour sa prouesse lors du tournoi. Je pensais naïvement que nul ne pourrait contester le fait qu’il ait mérité honneurs et louanges, mais c’était oublier que bon nombre de membres de ma propre famille sont gangrénés par la jalousie.\n\nIls ne cherchent même plus à voiler leur mécontentement derrière leurs basses politesses et leurs viles flagorneries. Ils répugnent ouvertement la générosité dont ils sont dépourvus et envient ceux qui en jouissent.\n\nFût-ce à quelqu’un de leur sang qu’ils pensent s’adresser, je m’en contrefous…"
 agot_bells_of_war.0023.a:0 "#EMP ...JE SUIS LE ROI !!!#!"
 agot_bells_of_war.0024.t:0 "Le tournoi des écuyers"
 agot_bells_of_war.0024.a:0 "Formidable !"
 agot_bells_of_war.0031.t:0 "L’ascension d’Ostorlat"
 agot_bells_of_war.0031.desc:0 "Le temps se fait long dans l’attente de connaître le sort qui attend Qohor — et la région toute entière à dire vrai. Même occupé[ROOT.Char.Custom('FR_E')] à [ROOT.Char.Custom('IdleActivity')], ma patience est mise à rude épreuve. Puis vient enfin la délivrance, en la personne d’un messager qui m’annonce que j’ai remporté l’élection et que je suis désormais [Select_CString(ROOT.Char.IsFemale,'Première Magistrate','Premier Magistrat')] de Qohor.\n\nL’heure est venue d’exécuter les plans que j’ai habilement mis en branle."
 agot_bells_of_war.0031.a:0 "Faites savoir à Norvos que nous allons écraser Lorath !"
 agot_bells_of_war.0031.a_tt:0 "Norvos déclarera bientôt une guerre contre Lorath, à laquelle vous participerez en tant qu’allié"
 agot_bells_of_war.0032.t:0 "L’ascension d’Ekna"
 agot_bells_of_war.0032.desc:0 "Le temps se fait long dans l’attente de connaître le sort qui attend Qohor — et la région toute entière à dire vrai. Même occupé[ROOT.Char.Custom('FR_E')] à [ROOT.Char.Custom('IdleActivity')], ma patience est mise à rude épreuve. Puis vient enfin la délivrance, en la personne d’un messager qui m’annonce que j’ai remporté l’élection et que je suis désormais [Select_CString(ROOT.Char.IsFemale,'Première Magistrate','Premier Magistrat')] de Qohor.\n\nL’heure est venue d’exécuter les plans que j’ai habilement mis en branle."
 agot_bells_of_war.0032.a:0 "L’heure de la vengeance a sonné !"
 agot_bells_of_war.0033.t:0 "$agot_bells_of_war.0002.t$"
 agot_bells_of_war.0033.desc:0 "[qohor_leader.Custom('FR_le_Char_Pi')|U][qohor_leader.GetTitledFirstName] a remporté l’élection qohorienne !\n\nIl ne pouvait y avoir de nouvelles qui puissent me mettre plus en joie. Avec [qohor_leader.Custom('FR_LuiElle')] à sa tête, Qohor va apporter son soutien militaire immédiat pour contre-carrer les projets [lorath_leader.Custom('FR_du_Char_Pi')][lorath_leader.GetTitledFirstName] et laver le camouflet souffert."
 agot_bells_of_war.0033.a:0 "Sonnez les cloches ! La guerre est imminente !"
 agot_bells_of_war.0034.t:0 "$agot_bells_of_war.0002.t$"
 agot_bells_of_war.0034.desc:0 "[norvos_leader.GetName] of Norvos has received word of my victory in the recent election, along with my reaffirmed support against Lorath. [lorath_leader.GetNameNicknamed] has overextended [lorath_leader.GetHerHis] expansionist ambitions, so the time is ripe for us to strike!"
 agot_bells_of_war.0034.a:0 "I hear the bells of war!"
 agot_bells_of_war.0034.a.tt:0 "You and [norvos_leader.GetNameNoTooltip] have become allies"
 agot_bells_of_war.0035.t:0 "Norvos et Qohor pactisent"
 agot_bells_of_war.0035.desc:0 "« [ROOT.Char.Custom('FormOfAddressForLiege')|U] ! » Le domestique, bien que porteur de nouvelles alarmantes, prend le temps d’observer la révérence attendue.\n\nL’instant d’après, il m’informe que [norvos_leader.Custom('FR_le_Char_Pi')][norvos_leader.GetName] et [qohor_leader.Custom('FR_le_Char_Pi')][qohor_leader.GetName] ont formé une alliance dans le but de contre-carrer mes ambitions futures.\n\nLa guerre qu’ils me déclarent vise à reprendre les terres que j’ai prises à Norvos."
 agot_bells_of_war.0035.a:0 "Cela complique quelque peu les choses."
 agot_bells_of_war.0036.t:0 "Sur le pied de guerre"
 agot_bells_of_war.0036.desc:0 "De mauvaises nouvelles me viennent de Qohor. L'élection qui s'y est déroulé n'a pas connu l'issue que j'escomptais.\n\nMon alliée, [ostorlat.Custom('FR_le_Char_Pi')][ostorlat.GetTitledFirstName], a été battue par [qohor_leader.Custom('FR_le_Char_Pi')][qohor_leader.GetTitledFirstName], un candidat qui n’a jamais caché son aversion pour Norvos. Et cela se vérifie encore aujourd’hui, car le misérable nous a déclaré la guerre alors même qu’il vient tout juste d’entrer en fonction."
 agot_bells_of_war.0036.a:0 "Peste !"
 agot_bells_of_war.0037.t:0 "Bygone Election Plans"
 agot_bells_of_war.0037.desc:0 "The election results in Qohor have reached me at last.\n\nMy ally, [ostorlat.GetName], was defeated by an unknown third party, [qohor_leader.GetName]. Though I cannot say what fate awaits Qohor, I know that Norvos now stands alone against Lorath."
 agot_bells_of_war.0037.a:0 "I must stop Lorath now."
 agot_bells_of_war.0037.b:0 "We have no chance on our own."
 agot_bells_of_war.0050.t:0 "Le tourne-casaque est vaincu"
 agot_bells_of_war.0050.desc:0 "Gar Sagon est tombée et les Volantains ont été châtiés pour leur traîtrise.\n\nCette affaire close, il ne reste qu’à savoir si la confédération que nous avons formée et qui nous a menés jusque-là doit être dissoute, pour privilégier un royaume uni sous une bannière commune, ou si chacun doit conserver son indépendance et poursuivre ses desseins personnels."
 agot_bells_of_war.0050.a:0 "Les Rhoynar marcheront comme un seul homme."
 agot_bells_of_war.0050.b:0 "La confédération a prouvé sa force, qu’elle demeure ainsi !"
 agot_bells_of_war.0051.t:0 "Les Rhoynar en déroute"
 agot_bells_of_war.0051.desc:0 "Mes forces ont triomphé ! Gar Sagon est sauve et nul Rhoynar ne viendra plus contester mon autorité sur ces terres ! La mienne, ni celle de Volantis, d’ailleurs."
 agot_bells_of_war.0051.a:0 "Gloire à Volantis !"
 agot_bells_of_war.0052.t:0 "The End of the Rhoynar Confederation"
 agot_bells_of_war.0052.desc:0 "[confederation_leader.GetName] has proclaimed our victory over the Volantene traitors.\n\nWith the war over, [confederation_leader.GetNameNoTooltip] has claimed Gar Sagon as [confederation_leader.GetHerHis] own fief, and has proclaimed the dissolution of the Rhoynar Confederation. [confederation_leader.GetSheHe|U] has also claimed dominion over we few who stood by [confederation_leader.GetHerHis] side as [confederation_leader.GetHerHis] fellow confederates in days past. For better or worse, what remains of the Rhoynar Confederation has now been consolidated into a new realm under the leadership of [confederation_leader.GetLadyLord|U] [confederation_leader.GetNameNoTooltip]!"
 agot_bells_of_war.0052.a:0 "A new day dawns on the Rhoyne."
 agot_bells_of_war.0009.t:0 "Le tournoi des écuyers"
 agot_bells_of_war.0009.desc:0 "Mon père organise un tournoi à Port-Réal, auquel est convié à participer de nombreux écuyers notables du royaume, dont mes fils, [baelor.GetFirstName] et [maekar.GetFirstName], mais également [daemon_blackfyre.GetName], ce jeune garçon que d’aucuns subodorent être le fils naturel du roi.\n\nJ’ignore ce que trame mon père, mais je ne vois pas dans quel monde les actes de cet homme pourraient être porteurs de bienfait…"
 agot_bells_of_war.0009.a:0 "N’avez-vous point encore infligé suffisamment de torts au royaume, père ?"
 agot_bells_of_war.0010.t:0 "The Squires' Tourney"
 agot_bells_of_war.0010.desc:0 "[squire_tourney_participant.GetName] has been invited to take part in a grand squires' tourney in King's Landing. The finest young warriors from across the realm will gather to compete, and [squire_tourney_participant.GetFirstNameNoTooltip] will have the chance to prove [squire_tourney_participant.GetHerselfHimself] among them.\n\nIt is a rare honor for a squire to receive such an invitation. I cannot help but feel a mixture of pride and concern. [squire_tourney_participant.GetFirstNameNoTooltip] is still young, and a tourney can be a dangerous place.\n\nStill, this is an opportunity that cannot be passed up. If [squire_tourney_participant.GetFirstNameNoTooltip] distinguishes [squire_tourney_participant.GetHerselfHimself], it may be the beginning of a promising future."
 agot_bells_of_war.0010.two_squires_desc:0 "[squire_tourney_participant.GetName] and [squire_tourney_participant_2.GetName] have both been invited to take part in a grand squires' tourney in King's Landing. The finest young warriors from across the realm will gather to compete, and both will have the chance to prove themselves among them.\n\nIt is a rare honor for a squire to receive such an invitation. I cannot help but feel a mixture of pride and concern. They are still young, and a tourney can be a dangerous place.\n\nStill, this is an opportunity that cannot be passed up. If either of them distinguishes themselves, it may be the beginning of a promising future."
 agot_bells_of_war.0010.a:0 "Do us proud, [squire_tourney_participant.GetFirstNameNoTooltip]!"
 agot_bells_of_war.0010.two_squires_a:0 "Do us proud!"
 agot_bells_of_war.0024.squire_winner_desc:0 "[champion.GetName] has emerged victorious from the tourney, defeating every challenger who stood in [champion.GetHerHis] path. I could not be prouder to see [champion.GetHerHim] claim the champion's honors. It is a fine achievement for one so young, and I hope it will be the first of many."
 agot_bells_of_war.0024.squire_loser_desc:0 "[champion.GetName] has emerged victorious in the tourney, proving [champion.GetHerselfHimself] the finest young warrior in the realm. [my_squire.GetName] may not have reached the final victory, but [my_squire.GetSheHe] can still take pride in having competed among such formidable company."
 agot_bells_of_war.0024.blackfyre_sword_reaction_desc:0 "\n\nThe king has chosen to bestow the Valyrian steel sword Blackfyre upon [champion.GetNameNoTooltip]. Once wielded by Aegon the Conqueror and passed from king to heir, Blackfyre is more than a blade. It is a symbol of the Targaryen monarchy and legitimacy."
 agot_bells_of_war.0024.daemon_reaction_desc:0 "\n\nThe king has officially acknowledged Daemon as his son, and has chosen to mark the occasion by bestowing upon him the Valyrian steel sword Blackfyre. Once wielded by Aegon the Conqueror and passed from king to heir, Blackfyre is more than a blade. It is a symbol of the Targaryen monarchy and legitimacy."
 agot_bells_of_war.0024.b:0 "Unfortunate..."
 agot_bells_of_war.0024.c:0 "Father, what have you done..."