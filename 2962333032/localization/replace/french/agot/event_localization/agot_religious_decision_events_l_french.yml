l_french:
 agot_religious_decision.1001.t:0 "L'arbre-cœur"
 agot_religious_decision.1001.desc:0 "Qu'importe les croyances de chacun, rien au monde ne peut prétendre à offrir plus de quiétude que le cœur d'un bois sacré. Mais plus qu'un havre de paix où il fait bon de s'égarer l'esprit, c'est un lieu sur lequel les Anciens Dieux veillent et règnent.\n\nTandis que j'approche de l'arbre-cœur, je ne désire qu'une chose…"
 agot_religious_decision.1001.a:0 "...la bénédiction des dieux."
 agot_religious_decision.1001.b:0 "…une bonne santé."
 agot_religious_decision.1001.c:0 "…le calme."
 agot_religious_decision.1001.d:0 "…que l'on me guide."
 gain_piety_tooltip:0 "Ma ferveur a été remarquée"
 wounds_turn_to_cripple_tooltip:0 "Vos blessures guérissent complètement, mais vous obtenez le trait [GetTrait('crippled').GetName( GetNullCharacter )|l]."
 weirwood_fertility_bonus_modifier:0 "Bénédiction sacrée de fécondité"
 weirwood_minor_health_bonus_modifier:0 "Bénédiction sacrée revigorante"
 weirwood_medium_health_bonus_modifier:0 "Bénédiction sacrée vivifiante"
 weirwood_stress_modifier:0 "Sérénité sacrée"
 agot_religious_decision.1101.t:0 "À l'ombre des feuilles rouges"
 agot_religious_decision.1101.desc:0 "Les barrals plantés à Noblecœur se sont enracinés dans la terre avec une vigueur presque surnaturelle. Leurs troncs d'un blanc immaculé se dressant et se tordant vers les cieux, tandis que leurs rameaux terminés d'un rouge écarlate semblent murmurer dans le vent, tel un chant qui célèbre le renouveau qui empreigne les lieux.\n\nAu cœur du bosquet, à l'endroit exact où les souches d'autrefois pleuraient dans un mutisme de mort, j'arrive à percevoir de nouveau la présence des Anciens Dieux, à les entendre et à sentir leurs regards bienveillants au travers de la vie renouvelée."
 agot_religious_decision.1101.a:0 "Puissent-ils me guider tout au long de ma vie."
 agot_religious_decision.3001.t:0 "Les flammes bénies"
 agot_religious_decision.3001.desc:0 "Il est dit que [ROOT.Char.GetFaith.HighGodName] parle à ses élus à travers le feu béni, dans une langue de cendres — une langue que même ses prêtres peinent à saisir.\n\nJ'observe les bûchers nocturnes et je me demande : de quoi pourrais-je être témoin ?\n\n[red_priest.GetFirstName] suggère qu'une offrande me ferait sûrement gagner la faveur [ROOT.Char.GetFaith.HighGodNameAlternatePossessive]."
 agot_religious_decision.3001.prisoner:0 "Le pouvoir habite le sang des rois. Un pouvoir qui plaira à [ROOT.Char.GetFaith.HighGodName]."
 agot_religious_decision.3001.prisoner.tt:0 "Les [vassals|El], [courtiers|El] et [guests|El] zélés ayant la même foi que vous gagnent #P 10#! d'[opinion|El] envers #V vous#!"
 agot_religious_decision.3001.prisoner.tt.a:0 "Tous les [vassals|El], [courtiers|El] et [guests|El] qui ne pratiquent pas des sacrifices rituelles perdent #N 30#! d'[opinion|El] envers #V vous#!"
 agot_religious_decision.3001.peasants:0 "Est-ce que quelques roturiers pourraient le satisfaire ?"
 agot_religious_decision.3001.peasants.tt:0 "Tous les [courtiers|El] et [guests|El] qui ne pratiquent pas des sacrifices rituelles perdent #N 15#! d'[opinion|El] envers #V vous#!"
 agot_religious_decision.3001.peasants.tt.a:0 "Les [courtiers|El] et [guests|El] zélés ayant la même foi que vous gagnent #P 10#! d'[opinion|El] envers #V vous#!"
 agot_religious_decision.3001.false_idols:0 "Il n'y a qu'un seul dieu, [ROOT.Char.GetFaith.HighGodName]. Les fausses idoles doivent brûler."
 agot_religious_decision.3001.false_idols.tt:0 "Une offrande de moindre importance pourrait ne pas m'apporter la faveur que je recherche…"
 agot_religious_decision.3001.a:0 "Je ne ferai aucune offrande cette fois."
 agot_religious_decision.3001.a.tt:0 "Aucune offrandes ne sera faite."
 agot_religious_decision.3001.b:0 "À bien y réfléchir, ce n’est pas le bon moment."
 agot_religious_decision.3002.t:0 "Prières sans réponses"
 agot_religious_decision.3002.desc:0 "[red_priest.GetFirstName] et moi avons passé des heures à regarder les feux sacrés nuit après nuit, et malgré tous nos efforts, ni figure ni forme n'est apparue — rien que de la fumée et des cendres qui s'élèvent vers le ciel…"
 agot_religious_decision.3002.offering_desc:0 "Les heures passent, et même si [red_priest.GetFirstName] continue ses prières avec une ferveur inextinguible, les flammes ne révèlent ni forme ni vision.\n\nLa fumée qui s'élève commence à me piquer les yeux — malgré le sacrifice fait, je ne suis témoin que d'un feu nocturne des plus banals..."
 agot_religious_decision.3002.zealous:0 "Est-ce que [ROOT.Char.GetFaith.HighGodNameAlternate] m'a abandonné ?"
 agot_religious_decision.3002.cynical:0 "Un feu comme tant d'autres finalement..."
 agot_religious_decision.3002.a:0 "[ROOT.Char.GetFaith.HighGodNameAlternate] reste silencieux."
 agot_look_into_flames.vision_intro_desc:0 "Alors que [red_priest.GetFirstName] persiste dans ses prières devant le feu de joie conjurant l'obscurité de la nuit, je tombe lentement dans la contemplation.\n\n"
 agot_look_into_flames.vision_outro_desc:0 "#italic Ai-je été béni[ROOT.Char.Custom('FR_E')] d'une vision par [ROOT.Char.GetFaith.HighGodName] ? Quel message peut-elle bien renfermer ?#!"
 agot_look_into_flames.vision_title:0 "Une vision dans les flammes"
 agot_religious_decision.3003.t:0 "$agot_look_into_flames.vision_title$ : L'ombre"
 agot_religious_decision.3003.desc:0 "Enchanté[ROOT.Char.Custom('FR_E')] par les flammes, je n'aperçois qu'une ombre solitaire, une silhouette à peine perceptible cachée dans l'obscurité, et tandis que les flammes vacillent, la silhouette semble lancer une invitation par ses gestes.\n\nUn frisson parcourt mon dos, et aussi rapidement que l'étrange ombre est apparue, elle s'est transformée en brume ; le feu n'est alors plus que du feu."
 agot_religious_decision.3003.a:0 "Le murmure d’une future amitié à venir ?"
 agot_religious_decision.3003.b:0 "Des ombres tapies dans l'obscurité... un avertissement d'un danger à venir ?"
 agot_religious_decision.3003.tt: "Mes prières ont été entendues."
 agot_religious_decision.3004.t:0 "$agot_look_into_flames.vision_title$ : Le guerrier"
 agot_religious_decision.3004.desc:0 "Hypnotisé[ROOT.Char.Custom('FR_E')] par les flammes dansantes, j'aperçois seulement une silhouette au-delà du feu — un conquérant brandissant une puissante épée, entouré d'ennemis tombés à ses pieds. En un instant, l'épée du guerrier se brise, envoyant une myriade d'étincelles vers le ciel.\n\nUn frisson parcourt mon dos ; le feu n'est alors plus que du feu."
 agot_religious_decision.3004.a: "[ROOT.Char.GetFaith.HighGodNameAlternate] me mènera à la victoire."
 agot_religious_decision.3004.b:0 "Mieux vaut éviter les conflits..."
 agot_religious_decision.3005.t:0 "$agot_look_into_flames.vision_title$ : Le château"
 agot_religious_decision.3005.desc:0 "Pendant de brefs instants, les étincelles s'élevant vers le ciel semblent brûler avec plus d'intensité, et tandis que je regarde à travers les flammes dansantes, je discerne un château majestueux — quelque peu familier — se fondant dans des braises dorées scintillantes.\n\nMon cœur commence à s'emballer, mais en un instant tout a disparu et le feu n'est alors plus que du feu."
 agot_religious_decision.3005.a:0 "Un écho de la gloire et des futures richesses qui m'attendent."
 agot_religious_decision.3005.a.tt:0 "Ma persévérance et ma dévotion seront sûrement récompensées."
 agot_religious_decision.3005.b:0 "Un aperçu de l'Antique Valyria, transformée en cendres."
 agot_religious_decision.3005.b.tt:0 "Intrigué[ROOT.Char.Custom('FR_E')] par cette vision, je me concentre sur l’étude des empires d'autrefois."
 agot_religious_decision.3006.t:0 "$agot_look_into_flames.vision_title$ : Des dagues dans l'obscurité"
 agot_religious_decision.3006.desc:0 "Pourtant, tandis que le feu crépitant continue d'envoyer des étincelles dans le ciel, moins d'un battement de cœur plus tard elles deviennent des poignards ardents, transperçant sans effort les ombres voilées par l'épaisse fumée qui s'élève bien haut.\n\nFrappé[ROOT.Char.Custom('FR_E')] de peur, je frissonne malgré la chaleur du bûcher, et en un instant tout disparaît ; le feu n'est alors plus que du feu."
 agot_religious_decision.3006.a:0 "Je dois rester vigilant[ROOT.Char.Custom('FR_E')]."
 agot_religious_decision.3006.b:0 "Peut-être est-il temps de frapper ?"
 agot_religious_decision.3007.t:0 "$agot_look_into_flames.vision_title$ : Les glyphes dansants"
 agot_religious_decision.3007.desc:0 "Hypnotisé[ROOT.Char.Custom('FR_E')] par les flammes vacillantes, la fumée et les tourbillons de feu commencent à prendre forme, et pendant un bref instant, le feu béni révèle d'étranges symboles — ils vacillent et se fondent les uns dans les autres, comme si les ombres elles-mêmes dansaient devant moi.\n\nAussi vite qu'elles sont apparues, elles fondent ; le feu n'est alors plus que du feu."
 agot_religious_decision.3007.a:0 "Je dois approfondir les connaissances des hauts mystères !"
 agot_religious_decision.3007.b:0 "Les réponses doivent se trouver dans les anciens contes..."
 agot_religious_decision.3008.t:0 "$agot_look_into_flames.vision_title$ : Marche indemne"
 agot_religious_decision.3008.t.scheme:0 "$agot_look_into_flames.vision_title$ : Trahison révélée"
 agot_religious_decision.3008.desc:0 "Tandis que [red_priest.GetFirstName] accomplit les rites sacrés et continue ses prières devant les feux nocturnes, durant un bref instant "
 agot_religious_decision.3008.scheme_murder_desc:0 "les flammes dansantes révèlent le contour d'une ombre voilée — et je réalise qu'il s'agit [owner.Custom('FR_du_Char_Pi')][owner.GetTitledFirstName] complotant pour #bold m'assassiner !#!"
 agot_religious_decision.3008.scheme_abduction_desc:0 "les flammes dansantes révèlent le contour d'une ombre voilée — et je réalise qu'il s'agit [owner.Custom('FR_du_Char_Pi')][owner.GetTitledFirstName] complotant pour #bold m'enlever !#!"
 agot_religious_decision.3008.scheme_steal_artifact_desc:0 "les flammes dansantes révèlent le contour d'une ombre voilée — et je réalise qu'il s'agit [owner.Custom('FR_du_Char_Pi')][owner.GetTitledFirstName] complotant pour #bold me voler un artefact !#!"
 agot_religious_decision.3008.scheme_fallback_desc:0 "les flammes dansantes révèlent le contour d'une ombre voilée — et je réalise qu'il s'agit [owner.Custom('FR_du_Char_Pi')][owner.GetTitledFirstName] complotant contre moi !"
 agot_religious_decision.3008.no_scheme_desc:0 "Je me reconnais dans les flammes.\n\nUne torche à la main, je marche indemne parmi les ténèbres. Plus que jamais, je suis certain que [ROOT.Char.GetFaith.HighGodNameAlternate] veille sur moi."
 agot_religious_decision.3008.a:0 "J'ai les faveurs [ROOT.Char.GetFaith.HighGodNamePossessive]."
 agot_religious_decision.3008.b:0 "La peste soit c[owner.Custom('FR_EEtte')] [owner.Custom('InsultNoun')] !"
 agot_religious_decision.4000.t:0 "L’appel du profit"
 agot_religious_decision.4000.desc:0 "Après avoir eu vent de marchés inexploités situés dans de lointaines contrées, l'idée m'est venue d'organiser une grande expédition mercantile. Un tel projet, s'il venait à se conclure de manière fructueuse, pourrait apporter la richesse à mon pays — dans le cas contraire cependant, ce serait ni plus ni moins qu'un gâchis de ressources.\n\nTandis que le conseil se réunit en vue des préparatifs à venir, la première question à régler est celle du montant de l'investissement qui sera alloué au voyage."
 agot_religious_decision.4000.a:0 "Prudence est mère de sûreté."
 agot_religious_decision.4000.a.flavor:0 "Avec un investissement modeste, l'expédition partira pour une durée de deux mois."
 agot_religious_decision.4000.b:0 "Lorsqu'il est question d'argent, il faut savoir prendre des risques."
 agot_religious_decision.4000.b.flavor:0 "Avec un investissement adéquat, l'expédition partira pour une durée de six mois."
 agot_religious_decision.4000.c:0 "Je ne vais pas lésiner sur les moyens."
 agot_religious_decision.4000.c.flavor:0 "Avec un généreux investissement, l'expédition partira pour une durée d'un an."
 agot_religious_decision.4000.d:0 "Inutile de regarder à la dépense."
 agot_religious_decision.4000.d.flavor:0 "Avec un investissement substantiel, l'expédition partira pour une durée de deux ans."
 agot_religious_decision.4000.e:0 "Finalement, j'ai changé d'avis."
 agot_religious_decision.4001.t:0 "Le retour de l’expédition"
 agot_religious_decision.4001.desc:0 "« L’expédition est de retour » m’informe-t-on. Celle-là même que j’avais financée, et dont les promesses miroitaient monts et merveilles. Hélas, les résultats font pâle figure au regard de mes espérances.\n\nLes survivants témoignent de la myriade d’infortune qui s’est dressée contre eux. Entre aléas climatiques et autres attaques de pirates, certains s’estiment déjà heureux d’être simplement revenus vivants[Select_CString(ROOT.Char.HasTrait( GetTrait('callous') ),' — ce dont je me contrefous royalement',Select_CString(ROOT.Char.HasTrait( GetTrait('sadistic') ),' — ce dont je me contrefous royalement',''))].\n\nQue reste-t-il des hardis et ambitieux voyageurs que j’eusse envoyés naguère, sinon quelques âmes meurtries porteuses d’une maigre pitance pour sustenter mon appétit mercantile…"
 agot_religious_decision.4001.a:0 "Misère de misère."
 agot_religious_decision.4002.t:0 "Le retour de l’expédition"
 agot_religious_decision.4002.desc:0 "« L’expédition est de retour » m’informe-t-on. Celle-là même que j'avais financée, et dont les promesses miroitaient monts et merveilles.\n\nDe merveilles, je n’en vois guère, mais au moins la cargaison acheminée, bien que modeste, témoigne d’une certaine réussite. Les membres de l’expédition rapportent différents sons de cloches. Certains sont prompts à mettre en avant les nouvelles routes commerciales établies, d’autres déplorent les quelques revers soufferts tout du long. Dans l’ensemble, leur labeur ne peut être minoré."
 agot_religious_decision.4002.a:0 "Cela n’en reste pas moins une bonne nouvelle."
 agot_religious_decision.4003.t:0 "Le retour de l’expédition"
 agot_religious_decision.4003.desc:0 "« L’expédition est de retour » m’informe-t-on. Et quel retour, mes aïeux !\n\nLes hardis voyageurs sont accueillis dans un triomphe retentissant. Les coffres remplis d’or qui sont acheminés sous mes yeux en font saliver plus d’un, et les nouvelles voies commerciales qui sont vantées en promettent davantage. Les [ROOT.Char.Custom('LevyMenWomen')], extatiques, narrent le récit grandiose de cette entreprise, évoquant le nom de lointaines cités dont je doutais même jusqu’à l’existence.\n\nNul doute que [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] rayonnera désormais comme le phare d’un commerce florissant."
 agot_religious_decision.4003.a:0 "C’est au-delà de toute espérance !"
 agot_religious_decision.5000.t:0 "Expédition baleinière"
 agot_religious_decision.5000.desc:0 "Il est temps de rassembler les provisions et les fonds qui seront nécessaires à l'expédition."
 agot_religious_decision.5000.a:0 "Ne lésinons pas sur les moyens !"
 agot_religious_decision.5000.b:0 "Mieux vaut être bien préparé."
 agot_religious_decision.5000.c:0 "Le minimum fera l'affaire..."
 agot_religious_decision.5000.d:0 "À bien y réfléchir, le moment n'est pas propice."
 agot_religious_decision.5001.t:0 "Expédition baleinière"
 agot_religious_decision.5001.desc_great:0 "Quelques jours bercés par l’étendue d’azur, et enfin puis-je entendre mes [ROOT.Char.Custom('LevyMenWomen')] m’annoncer la bonne nouvelle : « Baleines à l’horizon ! »\n\nLe spectacle est saisissant, comme une myriade d’îlots qui dansent selon leur bon vouloir. L’équipage peine à contenir sa joie, car chacune de ces bêtes valant son pesant d’or, c’est une véritable fortune qui se présente à nous, et les chants que nous entendons présentement augurent ceux que nous entendrons prochainement, lorsque notre retour à terre sera triomphant et que nos louanges seront entendues !"
 agot_religious_decision.5001.desc_good:0 "Quelques jours bercés par l’étendue d’azur, et enfin puis-je entendre mes [ROOT.Char.Custom('LevyMenWomen')] m’annoncer la bonne nouvelle : « Baleine en vue ! »\n\nUn puissant jet d’eau le confirme : une baleine sillonne ces eaux. L’équipage qui trépigne d’impatience depuis trop longtemps lorgne avec avidité sur ce trophée en devenir.\n\nLa bête est grande, comme le sera la bourse que rapportera sa carcasse."
 agot_religious_decision.5001.desc_bad:0 "Après des jours à sillonner les eaux sans voir signe de la moindre baleine, la grogne monte au sein de l’équipage. Les [ROOT.Char.Custom('LevyMenWomen')] désespèrent et arguent que l’expédition est d’ores et déjà un échec.\n\nJe pourrais m’emmurer dans mon opiniâtreté et ordonner de continuer les recherches, mais il est sans doute bien plus judicieux de convenir qu’hélas, cette expédition fut ni plus ni moins qu’une perte de temps et d’argent."
 agot_religious_decision.5001.a:0 "Préparez vos harpons !"
 agot_religious_decision.5001.b:0 "La bête sera mienne !"
 agot_religious_decision.5001.c:0 "Par [ROOT.Char.GetFaith.NegativeAfterLife] !"
 agot_religious_decision.5001.a.tt_success:0 "Vous ramenez triomphant le fruit de votre chasse"
 agot_religious_decision.5001.b.tt_success:0 "Vous ramenez triomphant le fruit de votre chasse"
 agot_religious_decision.5001.a.tt_failure:0 "Vous rentrez bredouille au port"
 agot_religious_decision.5100.t:0 "L’appel"
 agot_religious_decision.5100.desc.holy_site:0 "Mes yeux se perdent dans cette abyssale noirceur…\n\nDe la pierre noire et huileuse émane une puissance mutique. La surface reflète des vérités insondables et suinte d’une sombreur sans nom. L’obélisque appelle ; invite ; guide. #B C’est un phare ! Un phare d’obscurité ! Un phare d’une noirceur rayonnante !#!\n\nDe tout temps et en tout lieu, nombreux furent ceux à s’approprier des fragments, tandis que d’autres érigèrent des monuments. Mais ici se dresse une merveille que nulle main humaine n’a ouvragée ni souillée. L’obélisque recèle maintes vérités, mais il ne les livrera qu’en échange d’un tribut…"
 agot_religious_decision.5100.desc.artifact:0 "Quelle étrangeté, qu’un si petit fragment puisse receler une si profonde et abyssale noirceur…\n\nDe la pierre noire et huileuse émane une puissance mutique. Là, au creux de ma main, des vérités insondables et une sombreur sans nom s’agitent. Quelque chose m’appelle et m’invite. Une lueur obscure qui me guide à travers le dédale de mon propre esprit.\n\nDe tout temps et en tout lieu, nombreux furent ceux à s’approprier de tels fragments. La pierre recèle maintes vérités, mais elle ne les livrera qu’en échange d’un tribut…"
 agot_religious_decision.5100.a:0 "Nul prix ne saurait être trop grand !"
 agot_religious_decision.5100.a.tt:0 "Un objet de grande valeur pourrait contenter la pierre, mais qui sait ce qu’un tel présent pourrait réveiller…"
 agot_religious_decision.5100.b:0 "Je puis contenter la pierre avec une modeste offrande."
 agot_religious_decision.5100.b.tt:0 "Une offrande certes modeste, mais non moins significative, pourrait éveiller sa curiosité sans risquer de provoquer sa fureur."
 agot_religious_decision.5100.c:0 "C’est moi que la pierre appelle ! Moi et rien d’autre !"
 agot_religious_decision.5100.c.tt:0 "Les possessions matérielles ne sont pas la réponse à une telle énigme. Seul l’esprit peut satisfaire la pierre, mais qui sait ce qu’elle en fera…"
 agot_religious_decision.5100.d:0 "Pour l’heure, il est préférable de ne rien faire."
 agot_religious_decision.5100.d.tt:0 "Le pouvoir de la pierre est indéniable, mais le moment n’est point encore propice pour l’éveiller…"
 agot_religious_decision.5101.t:0 "Le rituel"
 agot_religious_decision.5101.desc.start_no_offering:0 "Je n’ai pour toute offrande que mon humble présence, et je laisse ainsi la pierre être juge de mon choix, et m’accorder, selon sa convenance, rétribution ou damnation."
 agot_religious_decision.5101.desc.start_offering:0 "Alors que je dépose mon offrande devant la pierre, avec toute la révérence qui m’habite, les sombres reflets à la surface semblent se mouvoir différemment, comme si réaction il y avait."
 agot_religious_decision.5101.desc:0 "\nDès lors j’entame le rituel. Mes pensées sont pleinement accaparées par la surface lisse et huileuse, noire et suintante — #B Non#! — #weak (Accaparées n’est pas le mot)#! « #italic Offertes.#! » — #B Oui !#! — Mes pensées lui sont offertes. Quelque chose pulse dans les profondeurs, et chaque geste que je fais, chaque murmure que je prononce semble l’attirer."
 agot_religious_decision.5101.desc.end_no_change:0 "\nTout s’arrête, et en faisant un pas en arrière, je réalise que rien n’a changé, que je demeure inchangé. La noirceur qui semblait m’appeler s’est tue, et ne reste que de ternes pensées grisâtres. Mes efforts ont été vains, et pourtant, je sais qu’il reste des vérités insondées, là, quelque part au-delà de ces murs d’un noir absolu…"
 agot_religious_decision.5101.desc.end_changed:0 "\n\n#B Quelque chose a changé…#!\nQuelque chose que je ne saurais ni expliquer, ni décrire ni même comprendre. Tout ce que je puis dire, c’est que sous la surface, une force s’est mise à l’œuvre…"
 agot_religious_decision.5101.shrewd:0 "Un esprit affûté"
 agot_religious_decision.5101.shrewd.tt:0 "La pierre a ouvert quelque chose en moi. Une fenêtre dont j’ignorais jusqu’à l’existence. Désormais, j’ai une vision claire de tout ce qui m’entoure."
 agot_religious_decision.5101.strong:0 "Une force inébranlable"
 agot_religious_decision.5101.strong.tt:0 "Quelque chose pulse en mon sein. Les battements de mon cœur ne sont plus les mêmes. Un pouvoir qui m’est étranger coule dans mes veines."
 agot_religious_decision.5101.good:0 "Un don indicible"
 agot_religious_decision.5101.good.tt:0 "Je ne peux user d’aucun mot pour décrire ce que la pierre m’a offert, et pourtant, je sens bel et bien son don m’imprégner et m’habiter."
 agot_religious_decision.5101.no_change_tt:0 "Qu’a donc fait la pierre ? Qu’a-t-elle offerte ? Je ne sens ni changement… ni quoi que ce soit. Je me sens comme une âme perdue au milieu d’un rien sans fin."
 agot_religious_decision.5101.bad:0 "Le revers de la médaille"
 agot_religious_decision.5101.bad.tt:0 "Quelque chose a changé, mais je ne saurais dire si c’est pour le mieux. La pierre a donné, mais qu’a-t-elle pris en retour ?"
 agot_religious_decision.5101.possessed:0 "Une voix dans les ténèbres"
 agot_religious_decision.5101.possessed.tt:0 "Quelque chose a imprégné mon être mais les mots me manquent pour l’expliquer. La noirceur qui habite la pierre se serait-elle emparée de moi ? Aurait-elle fait de mon corps sa nouvelle demeure ?"
 agot_religious_decision.5101.no_change.zealous:0 "Qu’ai-je fait [ROOT.Char.GetFaith.PantheonTerm2] pour subir pareil châtiment ?"
 agot_religious_decision.5101.no_change.zealous.tt:0 "Je ne saurais expliquer pourquoi, mais les faveurs divines me sont refusées ! La pierre devait m’apporter des réponses, et en lieu et place elle ne fait que soulever de nouvelles interrogations !"
 agot_religious_decision.5101.no_change:0 "Des prières sans réponse"
 agot_religious_decision.5101.no_change.tt:0 "La pierre est restée mutique et les noires vérités me sont refusées. Dans le dédale d’interrogations qu’est devenu mon esprit, je peine à trouver une issue…"
 agot_religious_decision.5200.t:0 "L’essence de la vie"
 agot_religious_decision.5200.desc:0 "#italic Le temps de la moisson est arrivé.#!\n\nLequel de ces rats vais-je saigner ?"
 agot_religious_decision.5200.a:0 "Toi !"
 agot_religious_decision.5200.b:0 "$agot_religious_decision.5200.a$"
 agot_religious_decision.5201.t:0 "L’essence de la vie"
 agot_religious_decision.5201.desc:0 "Il est toujours fascinant de voir à quel point l’Homme est chose fragile. Guère plus que du sang, de la chair, et une ossature pour maintenir le tout.\n\nPrenons [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('living_blood_bag'))] par exemple. Quelques instruments pour extraire la précieuse essence écarlate de ses veines, et [living_blood_bag.Custom('FR_LeLa')] voilà à geindre et à en appeler [living_blood_bag.GetFaith.PantheonTerm2] que son supplice prenne fin."
 agot_religious_decision.5201.a:0 "[Select_CString(ROOT.Char.HasTrait( GetTrait('sadistic') ), 'Votre souffrance est jubilatoire, mais je ne peux m’en sustenter', 'De grâce, souffrez en silence' )]."
 agot_religious_decision.5201.a_tt:0 "Vous avez gagné 20 de sang."