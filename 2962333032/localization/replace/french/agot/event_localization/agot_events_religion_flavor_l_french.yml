l_french:
 pregnancy.1001.motheroffering:0 "Mère d'en Haut, acceptez mon offrande !"
 pregnancy.1001.motheroffering.self:0 "Puisse-t-elle veiller sur ma grossesse."
 pregnancy.1001.motheroffering.father:0 "Puisse-t-elle veiller sur la grossesse de mon épouse."
 pregnancy.1001.motheroffering.deadhusband:0 "Puisse-t-elle veiller sur le dernier présent de mon époux."
 agot_religion_flavor.0002.t:0 "Honorer les morts"
 agot_religion_flavor.0002.desc:0 "L'écho de la bataille s'est éteint, comme il en fut de la vie de nombreux braves soldats, tous morts pour que nous puissions célébrer un jour aussi glorieux que funeste. La victoire est nôtre, certes, mais le prix fut coûteux, et déjà l'on voit poindre les charognards, tout impatients qu'ils sont devant ce macabre buffet.\n \n« [ROOT.Char.GetTitledFirstNameNoTooltip], m'interpelle alors l'un des septons qui accompagnait nos troupes, nous devrions ériger un petit sanctuaire dédié à l'Étranger. Il aidera les pauvres âmes à trouver le chemin vers les Sept Cieux… et à trouver la paix. »"
 agot_religion_flavor.0002.a:0 "C'est le moins que l'on puisse faire, en effet."
 agot_religion_flavor.0002.b:0 "Ils méritent mieux qu'un humble sanctuaire ! Rendons leur vraiment honneur !"
 agot_religion_flavor.0002.c:0 "Ils sont morts. Où qu'ils soient, ils n'ont plus besoin d'aide."
 agot_religion_flavor.0100.t:0 "Le jour de la Jouvencelle"
 agot_religion_flavor.0100.desc:0 "Tandis que mes occupations journalières débutent par [ROOT.Char.Custom('IdleActivity')], quelques papotages parviennent jusqu'à mes esgourdes. Le sujet qui est sur toutes les lèvres [ROOT.Char.Custom('FR_GetCourt_Au')] est bien entendu le Jour de la Jouvencelle — aujourd'hui même, en l'occurrence.\n\nEn cette journée si particulière, il est attendu que toutes les demoiselles se rendent au septuaire le plus proche pour y allumer un cierge aux pieds de la statue de la Jouvencelle, et de lui faire hommage d'une guirlande de parchemin.\n\nNonobstant l'importance d'une telle fête, j'en suis venu[ROOT.Char.Custom('FR_E')] à l'oublier, distrait[ROOT.Char.Custom('FR_E')] que je suis…"
 agot_religion_flavor.0100.a:0 "Faire une offrande serait de bon aloi."
 agot_religion_flavor.0100.b:0 "Le septuaire aura fort à faire aujourd'hui, un peu d'aide leur serait bénéfique."
 agot_religion_flavor.0100.c:0 "Je n'ai pas le temps pour de menues distractions."
 agot_religion_flavor.0100.d:0 "Il serait bon que [maiden_daughter.GetFirstName] aille rendre hommage à la Jouvencelle."
 agot_religion_flavor.0100.e:0 "Il serait bon que [maiden_daughter.GetFirstName] aille rendre hommage à la Jouvencelle."
 agot_religion_flavor.0100.f:0 "Je rendrais hommage à la Jouvencelle en personne."
 agot_religion_flavor.0100.g:0 "L'usage voudrait que je me rende au septuaire, mais je n'ai guère le temps."
 agot_religion_flavor.0100.g.tt:0 "Vous allez vous soustraire à vos devoirs, mais qui sait si #bold quelqu'un#! n'est pas en train de vous épier…"
 agot_religion_flavor.0100.h:0 "J'entends dire que de bons chanteurs sont de passage..."
 agot_listened_to_songs:0 "Vous passez la journée à écouter de bien belles ballades."
 agot_religion_flavor.0101.t:0 "Arrivée au septuaire"
 agot_religion_flavor.0101.desc:0 "C'est comme une montagne de degrés qui s'étend devant moi, formant un escalier qui ne semble trouver sa fin qu'à l'orée de l'immensité du ciel. Des murs de marbre et un dôme doré se dressent au sommet, tel un phare qui invite les fidèles à venir quérir le salut.\n\nNombreuses sont les jouvencelles du pays à être venues célébrer ce jour si saint, et dès lors que mes pas gravissent une à une les marches du septuaire, je me prépare aux maintes prières et moult chants qui m'accompagneront tout du long de cette célébration de notre pureté..."
 agot_religion_flavor.0101.a:0 "Vienne les danses, les chants, et les prières."
 agot_religion_flavor.0102.t:0 "Dans la lumière des Sept"
 agot_religion_flavor.0102.desc:0 "Les yeux de la Jouvencelle, du moins ceux de son effigie sculptée, veillent sur moi, fut-ce t'ils de pierre. J'avance d'un pas gracieux pour ajouter ma propre guirlande de parchemin à celles déjà déposées autour de son cour.\n\nLes gestes, maintes fois répétés en présence des septa, le sont encore aujourd'hui, mais sans que nul n'ait besoin d'y poindre corrections ou remontrances cette fois. Humblement agenouillée, j'allume une à une les sept bougies, et joins mes mains pour ainsi débuter la prière…"
 agot_religion_flavor.0102.a:0 "Accordez-moi votre bénédiction, Ô Sept qui ne font qu'Un."
 agot_religion_flavor.0103.t:0 "La septa veille au grain"
 agot_religion_flavor.0103.desc:0 "La simple évocation des festivités d'aujourd'hui suffit à m'arracher un bâillement, alors pourquoi diable devrais-je gaspiller un temps déjà fort précieux quand je pourrais me consacrer à des tâches plus utiles ?\n\nVoilà exactement la pensée qui me saute au visage quand je surprends Septa [maiden_day_septa.GetFirstName] qui hantent mes pas dans les jardins, affichant une moue d'irritabilité habilement cachée derrière un sourire :\n\n« Mon enfant, ne devriez-vous pas vous préparer pour ce jour si particulier ? Il serait regrettable de faire attendre la Jouvencelle, ne pensez-vous pas ? »"
 agot_religion_flavor.0103.a:0 "Vous êtes bien outrecuidante pour une septa."
 agot_religion_flavor.0103.b:0 "Un jour consacré à la virginité… En quoi cela me concerne-t-il ?"
 agot_religion_flavor.0103.b.tt:0 "Un tel sous-entendu pourrait avoir de lourdes conséquences…"
 agot_religion_flavor.0103.b.toast:0 "Septa [maiden_day_septa.GetFirstName] a dénoncé publiquement votre dépravation de fornicatrice."
 agot_religion_flavor.0103.c:0 "Vous avez raison… La Jouvencelle doit être honorée."
 agot_religion_flavor.0105.t:0 "Une vierge effarouchée"
 agot_religion_flavor.0105.desc:0 "À l'orée des festivités de la Jouvencelle, je constate que [maiden_daughter.GetFirstName] n'a nullement prit la peine d'entamer ses préparatifs pour ce jour si particulier :\n\n« J'ai mieux à faire que de me rendre au septuaire pour y écouter les sermons de vieilles mégères défripées sur les choses de ma vertu, » [maiden_daughter.Custom('lmf_neg_reaction_type')], après que j'eus cherché lumière à ma lanterne.\n\nDepuis le temps, j'aurais dû m'accoutumer à l'idée que tout doit toujours être par trop compliqué avec m[ROOT.Char.Custom2('FR_LMF_RelationToMeShort_OnA', SCOPE.sC('maiden_daughter'))], mais force est de constater qu'être [maiden_daughter.Custom2('LMF_RelationToMeShort', ROOT.Char )] est non moins éprouvant que d'être [ROOT.Char.GetTitleAsNameNoTooltip|l]."
 agot_religion_flavor.0105.a:0 "Voyons, ce serait folie que de vous attirer les foudres des septas."
 agot_religion_flavor.0105.a.tt:0 "Vous tentez de ramener [maiden_daughter.GetFirstNameNoTooltip] à la raison"
 agot_religion_flavor.0105.b:0 "C'est un jour sacré, mon enfant, et donc un devoir d'honorer les dieux."
 agot_religion_flavor.0105.c:0 "Votre insolence n'a que trop duré jeune fille !"
 agot_religion_flavor.0105.c.tt:0 "Une bonne gifle devrait apprendre le respect à [maiden_daughter.GetFirstNameNoTooltip]…"
 msg_went_to_celebrations:0 "[maiden_daughter.GetFirstNameNoTooltip] consent à assister au festival."
 agot_religion_flavor.0106.t:0 "Une enfant de la Foi"
 agot_religion_flavor.0106.desc:0 "En prévision des festivités de la Jouvencelle, je vais pour m'assurer que [maiden_daughter.GetFirstName] est bien entamée dans ses préparatifs, et quelle n'est pas ma surprise de découvrir qu'elle est déjà fin prête.\n\nCheveux somptueusement tressés et drapée d'une élégante robe, je ne puis qu'être fi[ROOT.Char.Custom('FR_ErEre')] que ma propre [ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('maiden_daughter'))] soit faite comme une sublime jouvencelle.\n\nQuand vient enfin l'heure pour elle de partir pour le septuaire, elle m'offre son baiser le plus tendre en guise d'au revoir."
 agot_religion_flavor.0106.a:0 "Nul [maiden_daughter.Custom2('LMF_RelationToMeShort', ROOT.Char )] n'a jamais était aussi fi[ROOT.Char.Custom('FR_ErEre')] de s[ROOT.Char.Custom2('FR_LMF_RelationToMeShort_OnA', SCOPE.sC('maiden_daughter'))]."
 agot_religion_flavor.0108.t:0 "Les caprices de la jeunesse"
 agot_religion_flavor.0108.desc:0 "L'exaspération devenant trop pesante, [maiden_daughter.GetFirstName] se laisse choir sur son lit.\n\n« Vous ne me ferez pas changé d'avis, [maiden_daughter.Custom2('LMF_RelationToMeShort', ROOT.Char )] ! Tous vos sermons ne seront jamais aussi assommant que ces festivités grotesques, où les gens perdent leur temps à chanter et à se tresser les cheveux ! »\n\nTandis que la complainte de m[ROOT.Char.Custom2('FR_LMF_RelationToMeShort_OnA', SCOPE.sC('maiden_daughter'))] se fait interminable, c'est à mon tour de souffrir des affres de l'exaspération..."
 agot_religion_flavor.0108.a:0 "C'est plus que je ne peux en supporter."
 agot_religion_flavor.0108.a.tt:0 "Vous abandonnez [maiden_daughter.GetFirstNameNoTooltip] à ses jérémiades"
 agot_religion_flavor.0109.t:0 "La vertu s'en est allée"
 agot_religion_flavor.0109.desc:0 "Pris[ROOT.Char.Custom('FR_E')] à part à la demande de [maiden_daughter.GetFirstName], je puis voir auber le mauvais augure simplement dans ses plissures d'inquiétudes. \n\n« [maiden_daughter.Custom2('spoken_address_by_familiarity', ROOT.Char )|U], j'ai quelque chose à vous dire… » balbutie-t-elle dans un accent de nervosité qui confirme mes propres craintes.\n\nÀ voir son regard fuyant de ci de là, je sais qu'elle cherche ses mots, et quand enfin ils daignent s'inviter, je regrette d'en être l'hôte.\n\n« J'ai été déflorée… »"
 agot_religion_flavor.0109.a:0 "…"
 agot_religion_flavor.0109.a.tt:0 "Vous quittez s[ROOT.Char.Custom('FR_GetChambersOrTent_OnA')] sans dire un mot..."
 agot_religion_flavor.0109.b:0 "Perdre ainsi votre vertu avant le mariage… par les Sept Enfers !"
 agot_religion_flavor.0110.t:0 "Bien se préparer"
 agot_religion_flavor.0110.desc:0 "En prévision des festivités de la Jouvencelle, je vais pour m'assurer que [maiden_daughter.GetFirstName] est bien entamée dans ses préparatifs, mais hélas, si elle a su s'habiller convenablement, je ne puis en dire autant de sa coiffure.\n\n« [maiden_daughter.Custom2('LMF_RelationToMeShort', ROOT.Char )|U], venez à mon secours ! » implore-t-elle en badinant.\n\nJe saisis la brosse, tout sourire, et m'attèle à démêler ce fatras capillaire. Les brins de cheveux s'avouent vaincus les uns après les autres devant mon habileté, avant que je ne transforme le tout en une magnifique tresse."
 agot_religion_flavor.0110.a:0 "Aussi ravissante que la Jouvencelle en personne !"
 agot_religion_flavor.0110.a.tt:0 "[maiden_daughter.GetFirstNameNoTooltip] assistera au festival"
 agot_religion_flavor.0111.t:0 "Jusqu'au septuaire"
 agot_religion_flavor.0111.desc:0 "Le Jour de la Jouvencelle, le jour tant attendu où toutes les demoiselles du pays se rendent au septuaire pour de galantes festivités. Si viendra le moment pour [maiden_daughter.GetFirstName] de s'y rendre seule, aujourd'hui elle est encore bien trop jeune pour que je ne l'accompagne pas.\n\nLa robe confectionnée pour l'occasion lui va à ravir, et toute mignonne qu'elle est ainsi faite, elle me tend sa petite main, que je saisis avec la même tendresse que je trouve dans son sourire.\n\nLe trajet jusqu'au septuaire se fait dans une gaieté si joviale que nous sommes déjà arrivé[ROOT.Char.Custom2('FR_E', SCOPE.sC('maiden_daughter'))]s avant que je ne m'en rende compte."
 agot_religion_flavor.0111.a:0 "Nous avons déjà bien entamé[ROOT.Char.Custom2('FR_E', SCOPE.sC('maiden_daughter'))]s les réjouissances, n'est-ce pas mon cœur ?"
 agot_religion_flavor.0112.t:0 "La belle parmi les belles"
 agot_religion_flavor.0112.desc:0 "En cette journée consacrée à la Jouvencelle, rien de plus naturel que de voir les jeunes beautés du pays venir lui dédier danses et chansons. Et que de joliesse en ce jour. Où que mes yeux se posent, je ne vois et n'entends que belles demoiselles et belles voix. Pourtant, si elles savent toutes flatter les sens, il en est une qui les envoûte.\n\n[maiden_day_muse.GetFirstNameNicknamed], tel est le nom qui lui a été donné, à elle qui a fait sienne mon âme.\n\nElle est la rose dans un champ d'œillets, le diamant parmi les perles, et quand elle cesse les couplets, j'engage la conversation. Même lorsqu'elle ne chante pas, sa voix reste mélodieuse. Même lorsqu'elle ne danse pas, sa gestuelle reste avenante."
 agot_religion_flavor.0112.a:0 "Soyez bonne, gente demoiselle, et chantez pour moi."
 agot_religion_flavor.0112.a.tt:0 "Vous passez la journée à écouter [maiden_day_muse.GetFirstNameNoTooltip]"
 agot_religion_flavor.0112.b:0 "Peut-être pourrions-nous trouver un lieu plus propice à l'intimité ?"
 agot_religion_flavor.0112.b.tt:0 "Vous tentez de gagner ses faveurs sans une once de subtilité"
 msg_got_rejected_by_muse:0 "[maiden_day_muse.GetFirstNameNoTooltip] rejette vos avances"
 agot_religion_flavor.0113.t:0 "Comme un parfum d'amour"
 agot_religion_flavor.0113.desc:0 "Elle était déjà belle quand je ne faisais que la regarder, mais maintenant que je la dévore du regard, elle est magnifique.\n\nLe monde s'est éteint autour de nous. Plus d'yeux indiscrets, plus de voix incessantes, seulement elle, moi, et nos respirations qui s'accélèrent.\n\nLointaine est l'époque de la retenue, de la bienséance et de la galanterie. Maintenant ce n'est plus que passion sulfureuse et fougue éhontée. Je fais preuve d'une ardente ferveur, mais pour honorer [maiden_day_muse.GetFirstNameNoTooltip] plus que pour honorer la Jouvencelle. Nous avons abandonné les réjouissances de ses festivités pour la jouissance de nos frasques, car sans nul âme pour nous juger, la vertu n'a plus sa place…"
 agot_religion_flavor.0113.a:0 "Je ne peux imaginer ma vie sans vous désormais, dame de mon cœur."
 agot_religion_flavor.0113.b:0 "Soyez mienne, et je serais vôtre, [maiden_day_muse.Custom('LoverPetName_possessive')]."
 agot_religion_flavor.0113.c:0 "Chérissez cet instant, gente gourgandine, car il n'y en aura pas d'autre."