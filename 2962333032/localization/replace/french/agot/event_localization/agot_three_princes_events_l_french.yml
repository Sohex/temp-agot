 agot_three_princes.2001.c:0 "[fisher_prince_candidate_three.Custom('FR_le_Char_P')|U][fisher_prince_candidate_three.GetFullNameNicknamed] !"
 agot_three_princes.2003.t:0 "Le nouveau Prince des Pêches"
 agot_three_princes.2003.desc:0 "L’élection est close et le résultat irrévocable : [lorath_new_fisher_prince.GetFirstName] devient aujourd’hui le nouveau Prince des Pêches !\n\nC’est au son des ovations qu’il est escorté jusqu’à [GetTitleByKey('c_qapahienn').GetName] où il siègera à sa juste place dans la Demeure des Pêches."
 agot_three_princes.2003.a:0 "Ainsi soit-il."
 agot_three_princes.3000.t:0 "La mort du Prince des Rues"
 agot_three_princes.3000.desc:0 "Le Prince des Rues [dead_prince.GetDeathReason].\n\nL’une des trois principautés lorathi voit désormais son siège devenir vacant, et en tant que citoye[ROOT.Char.Custom('FR_NNne')] de [GetTitleByKey('k_lorath').GetName], j’ai voix au chapitre dans l’élection de son successeur. Bien que ce titre princier n’ait aujourd’hui guère plus qu’une valeur honorifique, il demeure un legs qu’il nous faut perpétuer."
 agot_three_princes.3000.a:0 "Il me faut choisir judicieusement."
 agot_three_princes.3001.t:0 "L’élection du Prince des Rues"
 agot_three_princes.3001.desc:0 "Les candidats ont été choisis, et conformément à la coutume, ce sont tous les citoyens libres des îles lorathi qui ont à charge de choisir le futur Prince des Pêches.\n\nCe n’est aujourd’hui plus qu’un titre honorifique, certes, mais cela n’en reste pas moins un titre, et en tant que tel, fait miroiter aux yeux de certains un prestige enviable — en pratique sinon en titre.\n\nMais trêve de réflexions, à qui dois-je offrir mon vote ?"
