 agot_a_new_harvest_prince_is_elected_tt:0 "Un nouveau Prince des Moissons sera élu sous peu"
 agot_a_new_harvest_prince_is_elected_soon_tt:0 "Un nouveau Prince des Moissons sera élu dans trois jours"
 agot_a_new_harvest_prince_is_elected_eight_tt:0 "Les élections pour la Principauté des Moissons débuteront dans huit jours"
 agot_a_new_fisher_prince_is_elected_tt:0 "Un nouveau Prince des Pêches sera élu sous peu"
 agot_a_new_fisher_prince_is_elected_soon_tt:0 "Un nouveau Prince des Pêches sera élu dans trois jours"
 agot_a_new_fisher_prince_is_elected_eight_tt:0 "Les élections pour la Principauté des Pêches débuteront dans huit jours"
 agot_a_new_prince_of_streets_is_elected_tt:0 "Un nouveau Prince des Rues sera élu sous peu"
 agot_a_new_prince_of_streets_is_elected_soon_tt:0 "Un nouveau Prince des Rues sera élu dans trois jours"
 agot_a_new_prince_of_streets_is_elected_eight_tt:0 "Les élections pour la Principauté des Rues débuteront dans huit jours"
 agot_three_princes.1000.t:0 "La mort du Prince des Moissons"
 agot_three_princes.1000.desc:0 "Le Prince des Moissons [dead_prince.GetDeathReason].\n\nL’une des trois principautés de Lorath voit désormais son siège devenir vacant, et en tant que détenteu[ROOT.Char.Custom('FR_RSe')] d’une propriété située sur les îles de [GetTitleByKey('k_lorath').GetName], j’ai voix au chapitre dans l’élection de son successeur. Bien que ce titre princier n’ait aujourd’hui guère plus qu’une valeur honorifique, il demeure un legs qu’il nous faut perpétuer."
 agot_three_princes.1000.a:0 "Il me faut choisir judicieusement."
 agot_three_princes.1001.t:0 "L’élection du Prince des Moissons"
 agot_three_princes.1001.desc:0 "Les candidats ont été choisis, et conformément à la coutume, ce sont les propriétaires terriens des îles lorathi qui ont à charge de choisir le futur Prince des Moissons.\n\nCe n’est aujourd’hui plus qu’un titre honorifique, certes, mais cela n’en reste pas moins un titre, et en tant que tel, fait miroiter aux yeux de certains un prestige enviable — en pratique sinon en titre.\n\nMais trêve de réflexions, à qui dois-je offrir mon vote ?"
 agot_three_princes.1001.a:0 "[harvest_prince_candidate_one.Custom('FR_le_Char_P')|U][harvest_prince_candidate_one.GetFullNameNicknamed] !"
 agot_three_princes.1001.b:0 "[harvest_prince_candidate_two.Custom('FR_le_Char_P')|U][harvest_prince_candidate_two.GetFullNameNicknamed] !"
 agot_three_princes.1001.c:0 "[harvest_prince_candidate_three.Custom('FR_le_Char_P')|U][harvest_prince_candidate_three.GetFullNameNicknamed] !"
 agot_three_princes.1003.t:0 "Le nouveau Prince des Moissons"
 agot_three_princes.1003.desc:0 "L’élection est close et le résultat irrévocable : [lorath_new_harvest_prince.GetFirstName] devient aujourd’hui le nouveau Prince des Moissons !\n\nC’est au son des ovations qu’il est escorté jusqu’à [GetTitleByKey('c_palliera').GetName] où il siègera à sa juste place dans la Demeure des Moissons."
 agot_three_princes.1003.a:0 "Ainsi soit-il."
 agot_three_princes.2000.t:0 "La mort du Prince des Pêches"
 agot_three_princes.2000.desc:0 "Le Prince des Pêches [dead_prince.GetDeathReason].\n\nL’une des trois principautés lorathi voit désormais son siège devenir vacant, et en tant que citoye[ROOT.Char.Custom('FR_NNne')] de [GetTitleByKey('k_lorath').GetName] détenteu[ROOT.Char.Custom('FR_RSe')] d’un navire, j’ai voix au chapitre dans l’élection de son successeur. Bien que ce titre princier n’ait aujourd’hui guère plus qu’une valeur honorifique, il demeure un legs qu’il nous faut perpétuer."
 agot_three_princes.2000.a:0 "Il me faut choisir judicieusement."
 agot_three_princes.2001.t:0 "L’élection du Prince des Pêches"
 agot_three_princes.2001.desc:0 "Les candidats ont été choisis, et conformément à la coutume, ce sont les propriétaires de navires à travers les îles lorathi qui ont à charge de choisir le futur Prince des Pêches.\n\nCe n’est aujourd’hui plus qu’un titre honorifique, certes, mais cela n’en reste pas moins un titre, et en tant que tel, fait miroiter aux yeux de certains un prestige enviable — en pratique sinon en titre.\n\nMais trêve de réflexions, à qui dois-je offrir mon vote ?"
 agot_three_princes.2001.a:0 "[fisher_prince_candidate_one.Custom('FR_le_Char_P')|U][fisher_prince_candidate_one.GetFullNameNicknamed] !"
