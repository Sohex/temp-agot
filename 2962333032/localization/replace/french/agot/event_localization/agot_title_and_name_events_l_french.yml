l_french:
 agot_title_and_name_events.0001.t:0 "Une affaire de royauté"
 agot_title_and_name_events.0001.desc:0 "Bien que de sang royal, m[ROOT.Char.Custom2('FR_LMF_RelationToMeShort_OnA', SCOPE.sC('child'))], [AGOTGetName(child)], n'a pas la reconnaissance qui sied à quelqu'un de si noble origine.\n\nNéanmoins, en ma qualité de [ROOT.Char.GetTitleAsNameNoTooltip|l] je puis redresser ce tort et lui conférer les honneurs nécessaires pour que nul ne puisse ignorer la parentèle royale qui est la sienne."
 agot_title_and_name_events.0001.desc.twins:0 "Bien que de sang royal, [AGOTGetName(child)] et [AGOTGetName(child_2)], nouveau-né[child.Custom2('FR_E', SCOPE.sC('child_2'))]s de m[ROOT.Char.Custom2('FR_LMF_RelationToMeShort_OnA', SCOPE.sC('scoped_relative'))], [AGOTGetName(scoped_relative)], n'ont pas la reconnaissance qui sied à une si noble origine.\n\nNéanmoins, en ma qualité de [ROOT.Char.GetTitleAsNameNoTooltip|l] je puis redresser ce tort et leur conférer les honneurs nécessaires pour que nul ne puisse ignorer la parentèle royale qui est la leur."
 agot_title_and_name_events.0001.desc.triplets:0 "Bien que de sang royal, [AGOTGetName(child)], [AGOTGetName(child_2)] et [AGOTGetName(child_3)], nouveau-nés; de m[ROOT.Char.Custom2('FR_LMF_RelationToMeShort_OnA', SCOPE.sC('scoped_relative'))], [AGOTGetName(scoped_relative)], n'ont pas la reconnaissance qui sied à une si noble origine.\n\nNéanmoins, en ma qualité de [ROOT.Char.GetTitleAsNameNoTooltip|l] je puis redresser ce tort et leur conférer les honneurs nécessaires pour que nul ne puisse ignorer la parentèle royale qui est la leur."
 agot_title_and_name_events.0001.a:0 "Qui dit sang royal dit reconnaissance royale."
 agot_title_and_name_events.0001.b:0 "Ce serait concéder trop d'honneur pour de si lointains parents."
 agot_title_and_name_events.0001.b.flavor:0 "@alert_icon!#alert_trial Vous serez toujours en mesure d'accorder des titres royaux ultérieurement#!"
 agot_title_and_name_events.0002.desc:0 "Certains membres de ma maison portent le sang royal sans pour autant porter la reconnaissance qui sied à une si noble origine. Néanmoins, en ma qualité de [ROOT.Char.GetTitleAsNameNoTooltip|l] je puis redresser ce tort et leur conférer les honneurs nécessaires pour que nul ne puisse ignorer la parentèle royale qui est la leur.\n\n#I Sélectionnez les parents à qui vous souhaitez accorder des titres royaux#!"