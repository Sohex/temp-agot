l_french:
 agot_wildling_events.0001.t:0 "Le sevrage"
 agot_wildling_events.0001.desc.me:0 "« [ROOT.Char.GetFirstNameNoTooltip] »\n\nCela n’était rien de plus qu’un simple nom de lait, une coutume bien connue pour conjurer le mauvais sort qui frappe si souvent les nourrissons.\n\nMaintenant que la frêle enfance s’en est allée, et il est temps pour moi de revêtir quelque chose de plus éloquent."
 agot_wildling_events.0001.desc:0 "« [child.GetFirstNameNoTooltip] »\n\nCela n’était rien de plus qu’un simple nom de lait, une coutume bien connue pour conjurer le mauvais sort qui frappe si souvent les nourrissons.\n\nMaintenant que la frêle enfance s’en est allée, et il est temps pour m[ROOT.Char.Custom2('FR_LMF_RelationToMeShort_OnA', SCOPE.sC('child'))] de revêtir quelque chose de plus éloquent."
 agot_wildling_events.0001.a:0 "Puisse [ROOT.Char.GetFaith.PantheonTerm] bénir ce nom."
 agot_wildling_events.0100.t:0 "Un nom qui prend forme"
 agot_wildling_events.0100.desc.me:0 "« [ROOT.Char.GetFirstNameNoTooltip] »\n\nComme attendue dans la coutume [ROOT.Char.GetCulture.GetNameNoTooltip], le nom de lait a laissé place à un véritable nom qui sied davantage à un[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetWomanMan] en devenir.\n\nC’est certes un simple premier pas vers la fin de l’enfance, lorsque j’en changerais encore, mais je marche avec assurance sous la bénédiction [ROOT.Char.GetFaith.HealthGodNamePossessive]."
 agot_wildling_events.0100.desc:0 "« [child.GetFirstNameNoTooltip] »\n\nComme attendue dans la coutume [ROOT.Char.GetCulture.GetNameNoTooltip], le nom de lait a laissé place à un véritable nom qui sied davantage à un[child.Custom('FR_E')] [child.GetWomanMan] en devenir.\n\nC’est certes un simple premier pas vers la fin de l’enfance, lorsque m[ROOT.Char.Custom2('FR_LMF_RelationToMeShort_OnA', SCOPE.sC('child'))] en changerais encore, mais [child.Custom('FR_IlElle')] marche avec assurance sous la bénédiction [ROOT.Char.GetFaith.HealthGodNamePossessive]."
 agot_wildling_events.0100.a:0 "Chaque pas nous fait grandir davantage."
 agot_wildling_events.0101.t:0 "L’achèvement d’un nom"
 agot_wildling_events.0101.desc.me:0 "L’enfance n’est plus, et me voilà [Select_CString(ROOT.Char.IsFemale,'une femme faite','un homme fait')] avec le nom approprié à cette condition.\n\n\n\nPuisse « [ROOT.Char.GetFirstNameNoTooltip] » laissé son empreinte parmi les [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]."
 agot_wildling_events.0101.desc:0 "Pour m[ROOT.Char.Custom2('FR_LMF_RelationToMeShort_OnA', SCOPE.sC('child'))] l’enfance n’est plus, et [child.Custom('FR_LeLa')] voilà désormais [Select_CString(child.IsFemale,'une femme faite','un homme fait')] avec le nom approprié à cette condition.\n\n\n\n« [child.GetFirstNameNoTooltip] » puisse ce nom laissé son empreinte parmi les [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] !"
 agot_wildling_events.0101.a:0 "Un nom que je chérirais."