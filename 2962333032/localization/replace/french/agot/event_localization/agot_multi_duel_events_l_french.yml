 agot_multi_duel.0020.t.t.tos:0 "Un moment de vérité"
 agot_multi_duel.0020.desc.intro1:0 "Une tempête éclate sur la lice et d’acier sont ces rafales. [winner_duelist.Custom('FR_le_Char_Pi')|U][winner_duelist.GetTitledFirstName] et [loser_duelist.Custom('FR_le_Char_Pi')][loser_duelist.GetTitledFirstName] en sont la cause, dansant armes à la main."
 agot_multi_duel.0020.desc.intro2:0 "Au cœur des échos d’acier, [winner_duelist.Custom('FR_le_Char_Pi')][winner_duelist.GetTitledFirstName] et [loser_duelist.Custom('FR_le_Char_Pi')][loser_duelist.GetTitledFirstName] se tournent autour, se jaugeant par des regards aux intentions belliqueuses."
 agot_multi_duel.0020.desc.intro3:0 "Aux multiples coups qui fièrent de toutes parts, [winner_duelist.Custom('FR_le_Char_Pi')][winner_duelist.GetTitledFirstName] et [loser_duelist.Custom('FR_le_Char_Pi')][loser_duelist.GetTitledFirstName] bataillent à qui mieux mieux, comme pour accaparer tous les regards sur eux."
 agot_multi_duel.0020.desc.intro4:0 "[winner_duelist.Custom('FR_le_Char_Pi')|U][winner_duelist.GetTitledFirstName] et [loser_duelist.Custom('FR_le_Char_Pi')][loser_duelist.GetTitledFirstName] s’affrontent avec force férocité, leurs grognements rivalisant à qui mieux mieux avec le cri de leurs aciers entrechoqués."
 agot_multi_duel.0020.desc.intro5:0 "Dans le déluge de violence qui inonde la lice, [winner_duelist.Custom('FR_le_Char_Pi')][winner_duelist.GetTitledFirstName] et [loser_duelist.Custom('FR_le_Char_Pi')][loser_duelist.GetTitledFirstName] s’affrontent par des regards meurtriers, se lacèrent par des yeux vindicatifs, augurant le fer et l’acier qui bientôt vont férir."
 agot_multi_duel.0020.desc.intro6:0 "Le tonnerre gronde et les éclairs fusent. L’acier tonne et les coups frappent. [winner_duelist.Custom('FR_le_Char_Pi')|U][winner_duelist.GetTitledFirstName] attaque et [loser_duelist.Custom('FR_le_Char_Pi')][loser_duelist.GetTitledFirstName] riposte."
 agot_multi_duel.0020.desc.intro7:0 "Une violente mélodie donne le ton sur la lice ; [winner_duelist.Custom('signature_weapon')] contre [loser_duelist.Custom('signature_weapon')] ; [winner_duelist.GetFirstName] contre [loser_duelist.GetFirstName] ; et ils dansent et dansent encore, au son des armes qui chantent."
 agot_multi_duel.0020.desc.intro8:0 "Mes yeux ne sauraient échapper aux violences conjuguées et confrontées qui assaillent la lice, [winner_duelist.Custom('FR_le_Char_Pi')][winner_duelist.GetTitledFirstName] et [loser_duelist.Custom('FR_le_Char_Pi')][loser_duelist.GetTitledFirstName] participant volontiers à cette débauche de fureur."
 agot_multi_duel.0020.desc.intro9:0 "La lice s’apparente à un bordel, l’ordalie a une orgie, et dans cet enchevêtrement informe de corps dégoulinant de sueur, [winner_duelist.Custom('FR_le_Char_Pi')][winner_duelist.GetTitledFirstName] et [loser_duelist.Custom('FR_le_Char_Pi')][loser_duelist.GetTitledFirstName] font montre de plus de fougue et d’ardeur que nul autre."
 agot_multi_duel.0020.desc.intro10:0 "[winner_duelist.Custom('signature_weapon')|U] au vent, [loser_duelist.Custom('signature_weapon')] en garde, pour chaque mouvement que fait [winner_duelist.Custom('FR_le_Char_Pi')][winner_duelist.GetTitledFirstName], [loser_duelist.Custom('FR_le_Char_Pi')][loser_duelist.GetTitledFirstName] rétorque par la manœuvre appropriée."
 agot_multi_duel.0020.desc.middle1:0 "\n\nLe combat se poursuit au gré des coups véloces et des frappes puissantes, dont l’une manque de peu de se frayer un chemin à travers la garde de [winner_duelist.GetFirstNameNoTooltip]."
 agot_multi_duel.0020.desc.middle2:0 "\n\nIl ne saurait y avoir d’ordalie sans supplice, et comme pour mettre à l’épreuve la droiture de son adversaire, les Sept donnent à [winner_duelist.GetFirstNameNoTooltip] l’habileté et la force de faire couler le sang d’un coup porté sur le flanc."
 agot_multi_duel.0020.desc.middle3:0 "\n\nLe duel gagne en intensité lorsque [winner_duelist.GetFirstNameNoTooltip] bloque au moment crucial, repoussant son adversaire pour mieux l’assaillir de coups."
 agot_multi_duel.0020.desc.middle4:0 "\n\nJouant d’infortune ou d’imprudence, [winner_duelist.GetFirstNameNoTooltip] se fait berner par une feinte, laquelle lui vaut une riposte adverse qui manque de peu d’ébranler sa posture."
 agot_multi_duel.0020.desc.middle5:0 "\n\nLa bonne parade au bon moment offre à [winner_duelist.GetFirstNameNoTooltip] l’occasion d’enfoncer la garde adverse et d’aller tutoyer le bas-ventre de son adversaire d’un bon coup de genou."
 agot_multi_duel.0020.desc.middle6:0 "\n\nFort d’une défense aussi impénétrable qu’une muraille, [winner_duelist.GetFirstNameNoTooltip] ne laisse nul intrus pénétrer en son sein, et dès lors que son adversaire se risque à trouver l’endroit où la garde y est plus friable, [winner_duelist.Custom('FR_IlElle')] lui décoche une habile punition."
 agot_multi_duel.0020.desc.middle7:0 "\n\nPour chaque coup donné, un autre est rendu, sans qu’aucun des deux ne prenne l’ascendant, contraignant la mort à faire preuve de patience pour réclamer son dû."
 agot_multi_duel.0020.desc.middle8:0 "\n\nDans la frénésie du combat, [winner_duelist.GetFirstNameNoTooltip] parvient à transformer avec brio une manœuvre défensive en tactique offensive, laquelle vient tracer une ligne écarlate sur l’épaule de son adversaire."
 agot_multi_duel.0020.desc.middle9:0 "\n\nUne ouverture se présente à [winner_duelist.GetFirstNameNoTooltip], [winner_duelist.Custom('FR_LequelLaquelle')] réussit à asséner une attaque qui vient salement rudoyer son adversaire."
 agot_multi_duel.0020.desc.middle10:0 "\n\nAu plus fort de la bataille, le métal ne cesse de s’entrechoquer, rythmant chaque riposte de [winner_duelist.GetTitledFirstNameNoTooltip] qui s’essaie à atteindre le point faible de son adversaire."
 agot_multi_duel.0020.desc.outro1:0 "\n\nLa funeste fresque qui se dessine sous les yeux de la foule se retrouve rapidement pavoisée de rouge, et la gerbe de sang que crache [loser_duelist.GetFirstNameNoTooltip] dans son dernier souffle devient la touche finale qui achève cette peinture d’une main de maître."
 agot_multi_duel.0020.desc.outro2:0 "\n\nQuelques passe d’armes plus tard et [loser_duelist.GetFirstNameNoTooltip] se met à tituber, à vaciller, comme le font si bien les hommes quand leur cœur est mortellement touché. Sa carcasse sans vie s’effondre alors que son dernier râle appartient déjà au passé."
 agot_multi_duel.0020.desc.outro3:0 "\n\nDans un moment d’inattention, [loser_duelist.GetFirstNameNoTooltip] laisse sa gorge exposée, laquelle se voit ouvrir en deux d’un coup net, le sang s’échappant avec grande hâte de l’estafilade rougeoyante."
 agot_multi_duel.0020.desc.outro4:0 "\n\n[loser_duelist.GetFirstNameNoTooltip], sentant les griffes de la mort se resserrer, redouble d’ardeur d’effort et de vaillance pour arracher la victoire des mains de son ennemi, mais son trépas n’en devient que plus spectaculaire."
 agot_multi_duel.0020.desc.outro5:0 "\n\nL’insolente violence dont la foule se repaît atteint son paroxysme lorsque [loser_duelist.GetFirstNameNoTooltip] se voit raccourcir d’une tête, laquelle virevolte en l’air avant de s’écraser au sol, suivi du corps qui, dénué de chef, s’effondre comme une marionnette à qui l’on aurait coupé les fils."
 agot_multi_duel.0020.desc.outro6:0 "\n\nUne plaie béante ici, une sévère contusion là, ou encore un morceau manquant, difficile de dire ce qui coûte la vie à [loser_duelist.GetFirstNameTooltip], mais [loser_duelist.Custom('FR_IlElle')] lui en coûte, et les dieux obtiennent toujours leur dû."
 agot_multi_duel.0020.desc.outro7:0 "\n\n[loser_duelist.GetFirstNameNoTooltip] reste inerte, les yeux figés dans le néant. S[loser_duelist.Custom('FR_OnA_signature_weapon')] glisse lentement entre ses doigts avant de s’écraser au sol. [Select_CString(loser_duelist.IsFemale,'Elle est morte','Il est mort')]. #italic Comment ?#! La réponse m’échappe, car je n’ai tourner la tête qu’un bref moment, mais c’est parfois plus de temps qu’il n’en faut pour sceller l’issue d’un duel."
 agot_multi_duel.0020.desc.outro8:0 "\n\nUn vulgaire faux pas, une perte d’équilibre inopportune, une parade infructueuse, lors d’un duel, la frontière est mince entre victoire et défaite, entre vie et mort. De cela, [loser_duelist.GetFirstNameNoTooltip] en fait la funeste expérience devant une foule médusée."
 agot_multi_duel.0020.desc.outro9:0 "\n\nAprès un coup violemment véloce [loser_duelist.GetFirstNameNoTooltip] réalise que le corps est chose si fragile. Un sac de viande et de sang, avec quelques os pour maintenir le tout. Rien qui ne puisse assurer la survie une fois la gorge tranchée."
 agot_multi_duel.0020.desc.outro10:0 "\n\nIl faut un moment à [loser_duelist.GetFirstNameNoTooltip] pour réaliser que ses entrailles sont à l’air libre, et tout l’acharnement qu’[loser_duelist.Custom('FR_IlElle')] met à ramener à l’intérieur ce qu’il y a à l’extérieur n’y change rien. Ses boyaux prennent la poudre d’escampette plus vite qu’un homme ayant mis enceinte une catin."
 agot_multi_duel.0020.desc.outro_survived1:0 "\n\nMalgré une lutte acharnée pour s’abattre l’un l’autre, les deux preux chevaliers repartent chacun de leur côté, le travail bâclé, pour lécher leurs plaies, tout ensanglantés et meurtris qu’ils sont."
 agot_multi_duel.0020.desc.outro_survived2:0 "\n\nAu moment où [loser_duelist.GetFirstNameNoTooltip] se retrouve en très mauvaise posture, l’arme adverse dressée bien haut pour porter le coup de grâce, rien ne se passe. Le glas ne sonne pas pour [Select_CString(loser_duelist.IsFemale,'celle ainsi épargnée','celui ainsi épargné')] dans un geste que certains prennent pour de la faiblesse, et d’autres comme l’intervention miséricordieuse de la Mère en personne."
 agot_multi_duel.0020.desc.outro_survived3:0 "\n\nLorsque les forces lui manquent, même le plus brave doit abandonner l’idée de triompher, et dans ce duel qui oppose deux preux à bouts de force, chacun s’éloigne de l'autre, le souffle coupé et l’honneur intact."
 agot_multi_duel.0020.desc.outro_survived4:0 "\n\nContraints à interrompre leur petit face-à-face par la faute d’une confusion grandissante dans la lice, ce n’est là que partie remise pour [loser_duelist.GetFirstNameNoTooltip] et [winner_duelist.GetFirstNameNoTooltip]."
 agot_multi_duel.0020.desc.outro_survived5:0 "\n\nAprès moult échanges de coups, aucun des deux ne parvient à trouver la faille qui pourrait assurer une victoire. N’ayant d’autre choix, ils repartent chacun de leur côté, la tête aussi haute qui leur est possible de la lever, accablés qu’ils sont par le poids de la fatigue."
 agot_multi_duel.0020.desc.outro_survived6:0 "\n\nL’empiètement de leur espace de combat par d’autres champions les contraint bon gré mal gré à mettre en suspend leur duel personnel pour aller croiser le fer dans une plus grande cause que leur petite personne."
 agot_multi_duel.0020.desc.outro_survived7:0 "\n\nUn vulgaire faux pas, une perte d’équilibre au mauvais moment, une parade infructueuse, lors d’un duel, la frontière est mince entre victoire et défaite, entre vie et mort, mais ici, aucun des deux champions ne traversent cette frontière aussi espérée que redoutée."
 agot_multi_duel.0020.desc.outro_survived8:0 "\n\nFrappé d’infortune, [loser_duelist.GetFirstNameNoTooltip] subit la blessure de trop, celle qui lui coûtera la vie, mais conjurant par un heureux hasard sa propre guigne, il finit par empiéter l’espace de deux autres champions qui interviennent, l’un avec une intention belliqueuse, et l’autre salutaire."
 agot_multi_duel.0020.desc.outro_survived9:0 "\n\nÉpuisés comme jamais, les deux champions n’ont d’autres choix que de reculer, mais parce que leur honneur survit à la fatigue, même au beau milieu du marasme de la bataille, ils se gratifient l’un l’autre d’un signe de tête comme pour admettre leur valeur réciproque."
 agot_multi_duel.0020.desc.outro_survived10:0 "\n\nTandis que [winner_duelist.GetFirstNameNoTooltip] joue d’habileté en portant un coup potentiellement mortel, [loser_duelist.GetFirstNameNoTooltip] jouit de sa bonne étoile, laquelle vient le sauver en s’assurant que son armure fasse son office. Vivants, mais éreintés, les deux s’éloignent pour reprendre leur souffle."
 agot_multi_duel.0020.desc.outro_survived1.stands_up:0 "\n\n[loser_duelist.GetFirstNameNoTooltip] se retrouve finalement à mordre la poussière, mais dans un élan de bravoure plus qu’admirable, se remet sur pied, reprend du poil de la bête, et charge tel un aurochs dans la mêlée."
 agot_multi_duel.0020.desc.outro_survived2.stands_up:0 "\n\nLorsqu’un élan de vaillance se mue en élan de maladresse, la chute peut s’avérer des plus mortels. [loser_duelist.GetFirstNameNoTooltip] réussit néanmoins à éviter le pire en se redressant à temps, saisissant avec d’autant plus de fermeté s[loser_duelist.Custom('FR_OnA_signature_weapon')] pour repartir à la charge."
 agot_multi_duel.0020.desc.outro_survived3.stands_up:0 "\n\n[loser_duelist.GetFirstNameNoTooltip] voit s[loser_duelist.Custom('FR_OnA_signature_weapon')] lui glisser entre les doigts après une violente chute. Rampant pour sa vie, [loser_duelist.Custom('FR_IlElle')] l’empoigne à nouveau, et se relève, plus dur à la peine et plus vigoureux."
 agot_multi_duel.0020.desc.outro_survived4.stands_up:0 "\n\nDéséquilibré[loser_duelist.Custom('FR_E')] par un coup adverse, [loser_duelist.GetFirstNameNoTooltip] finit par mordre la poussière, littéralement. Mais une bataille perdue ne scelle pas pour autant la fin d’une guerre, et bien décidé[loser_duelist.Custom('FR_E')] à arracher la victoire aux mains de son adversaire, [loser_duelist.Custom('FR_IlElle')] se relève, prêt[loser_duelist.Custom('FR_E')] à contre-attaquer."
 agot_multi_duel.0020.desc.outro_survived5.stands_up:0 "\n\nDu bon acier et une force adéquate, parfois il n’en faut guère plus pour vous mettre un homme à terre. [loser_duelist.GetFirstNameNoTooltip] se met à ramper dans un mélange de boue, de sueur et de sang, mais ne se laissant pas abattre pour autant, ses jambes trouvent la force de le remettre sur pied, au beau milieu des échos ferrailleux."
 agot_multi_duel.0020.desc.outro_survived6.stands_up:0 "\n\nAssailli par une pluie de coups ininterrompus, [loser_duelist.GetFirstNameNoTooltip] se fait méchamment plaquer au sol, et y reste un bon moment avant de trouver le moment opportun pour s'éloigner et se relever, prêt à rendre la monnaie de sa pièce à [winner_duelist.GetFirstNameNoTooltip]."
 agot_multi_duel.0020.desc.outro_survived7.stands_up:0 "\n\nLe sang entache l’air dans un arc finement ciselé et [loser_duelist.GetFirstNameNoTooltip] se retrouve à terre. La foule l’imagine déjà vaincu[loser_duelist.Custom('FR_E')], prêt[loser_duelist.Custom('FR_E')] à expirer son ultime râle, mais il n’en est rien. La blessure reçue est superficielle, et empoignant son courage aussi fermement que s[loser_duelist.Custom('FR_OnA_signature_weapon')], [loser_duelist.Custom('FR_IlElle')] est à nouveau prêt[loser_duelist.Custom('FR_E')] à saigner pour la cause qui est la sienne."
 agot_multi_duel.0020.desc.outro_survived8.stands_up:0 "\n\nFace à [winner_duelist.Custom('FR_Un_signature_weapon')] en furie, [loser_duelist.GetFirstNameNoTooltip] n’a d’autre choix que de concéder du terrain et d’abandonner sa posture avantageuse — ou pour dire sans fioriture verbale, [loser_duelist.Custom('FR_IlElle')] bouffe le sol. Mais le bougre a encore de la ressource en réserve, et après un bref moment, [loser_duelist.Custom('FR_LeLa')] revoilà prêt à batailler, plus vaillant[loser_duelist.Custom('FR_E')] que jamais."
 agot_multi_duel.0020.desc.outro_survived9.stands_up:0 "\n\nViolemment mis à mal par son adversaire, [loser_duelist.GetFirstNameNoTooltip] flanche le temps qu’un genou heurte le sol. La situation augure un trépas prochain, mais vaillant comme savent si bien l’être les [loser_duelist.GetCulture.GetCollectiveNounNoTooltip], [loser_duelist.Custom('FR_IlElle')] empoigne fermement s[loser_duelist.Custom('FR_OnA_signature_weapon')] et en use pour se remettre sur pied, le regard plus hargneux que naguère."
 agot_multi_duel.0020.desc.outro_survived10.stands_up:0 "\n\nDans l’extrême et frénétique confusion de la mêlée, la foule perd de vue [loser_duelist.GetFirstNameNoTooltip], suffisamment longtemps pour nourrir une imagination fertile. Mais alors que les plus esprits les plus malavisés l’imaginent déjà aux portes [loser_duelist.GetFaith.NegativeAfterLife3], [loser_duelist.Custom('FR_IlElle')] émerge du chaos, prêt[loser_duelist.Custom('FR_E')] à poursuivre le combat."
 agot_multi_duel.0020.desc.outro_survived1.stands_up.friend:0 "\n\nViolemment mis à mal par son adversaire, [loser_duelist.GetFirstNameNoTooltip] flanche, un genou s’effondrant au sol. Alors que la situation présage un funeste sort, une voix s’élève plus haute que toutes les autres dans la foule :\n\n#EMP « Auriez-vous oublié vos vœux, chevalier ?! Levez-vous et honorez votre serment ! »#!\n\nRagaillardi par les encouragements [loser_duelist_friend.Custom('FR_du_Char_Pi')][loser_duelist_friend.GetTitledFirstName], [loser_duelist.GetFirstNameNoTooltip] empoigne fermement s[loser_duelist.Custom('FR_OnA_signature_weapon')] et en use pour se redresser, le regard plus déterminé que jamais."
 agot_multi_duel.0020.desc.outro_survived2.stands_up.friend:0 "\n\nRudoyé[loser_duelist.Custom('FR_E')] dans l’honneur, violenté[loser_duelist.Custom('FR_E')] dans la chair, les perspectives de victoire de [loser_duelist.GetFirstNameNoTooltip] s’amenuisent à chaque coup reçu, jusqu’au dernier qui le jette à terre. La foule le croit déjà terrassé, mais il en est un[loser_duelist.Custom('FR_E')] qui voit avec plus de perspicacité que tous les autres :\n\n#EMP « Le combat n’est pas terminé chevalier ! Alors debout ! »#!\n\nC’est tout à la fois surprenant et édifiant de voir ce que de simples paroles peuvent faire sur un esprit, et celles [loser_duelist_friend.Custom('FR_du_Char_Pi')][loser_duelist_friend.GetTitledFirstName] sont le vent d’espoir qui attise les braises d’une volonté malmenée."
 agot_multi_duel.0020.desc.outro_survived3.stands_up.friend:0 "\n\nL’acier fait voler l’arme et choir [loser_duelist.Custom('FR_CeluiCelle')] qui la manie. [loser_duelist.GetFirstNameNoTooltip] se retrouve à terre, en si mauvaise posture que s[loser_duelist.Custom2('FR_LMF_RelationToMeShort_OnA', SCOPE.sC('loser_duelist_friend'))] en vient à scander depuis la foule :\n\n#EMP « [loser_duelist.GetHouse.GetMotto] ! [loser_duelist.GetHouse.GetMotto] ! »#!\n\nTouchant la corde sensible, [loser_duelist_friend.Custom('FR_le_Char_Pi')][loser_duelist_friend.GetTitledFirstName] parvient à embraser la motivation du chevalier, qui sitôt, se relève, prêt[loser_duelist.Custom('FR_E')] à poursuivre le combat."
 agot_multi_duel.0020.desc.outro_survived4.stands_up.friend:0 "\n\nLorsque [loser_duelist.GetFirstNameNoTooltip] se fait violemment jeté[loser_duelist.Custom('FR_E')] à terre, on peut deviner aux lèvres qui remuent de toutes parts que les murmures sont légions. De funestes paris ou d’odieuses médisances ? De cela, [loser_duelist_friend.Custom('FR_le_Char_Pi')][loser_duelist_friend.GetTitledFirstName] n’en a cure et fait entendre la pleine force de sa voix :\n\n#EMP « Debout ! Debout [loser_duelist.GetTitledFirstNameNoTooltip] ! #bold DEBOUT !!!#! »#!\n\nS’exécutant, le preux se remet sur pied, posture chancelante mais bravoure inépuisée."
 agot_multi_duel.0020.desc.outro_survived5.stands_up.friend:0 "\n\nAssailli par une pluie de coups ininterrompus, [loser_duelist.GetFirstNameNoTooltip] se fait méchamment plaquer au sol, et y reste un bon moment avant de trouver dans les encouragements de s[loser_duelist.Custom2('FR_LMF_RelationToMeShort_OnA', SCOPE.sC('loser_duelist_friend'))], [loser_duelist_friend.Custom('FR_le_Char_Pi')][loser_duelist_friend.GetTitledFirstName], la force nécessaire pour repartir au combat :\n\n#EMP « Relevez-vous ! Les Sept vous observent, ne fléchissez point ! »"
 agot_multi_duel.0020.desc.outro_survived1.downed:0 "\n\nUn coup, puis un autre, puis encore un autre, tant et tant de coups et voilà [loser_duelist.GetFirstNameNoTooltip] envoyé au sol pour y mordre vigoureusement la poussière. Ses forces lui faisant défection, le preux s’écroule et le duel s’achève."
 agot_multi_duel.0020.desc.outro_survived2.downed:0 "\n\n[loser_duelist.GetFirstNameNoTooltip], sentant les griffes de la mort se resserrer, redouble d’ardeur d’effort et de vaillance pour arracher la victoire des mains de son ennemi, mais gaspillant ses dernières forces dans un va-tout, ses jambes ne parviennent plus à le porter, ni son esprit à garder conscience."
 agot_multi_duel.0020.desc.outro_survived3.downed:0 "\n\n\nUn vulgaire faux pas, une perte d’équilibre inopportune, une parade infructueuse, lors d’un duel, victoire comme défaite peuvent être déterminées sur un instant aussi fugace que crucial. De cela, [loser_duelist.GetFirstNameNoTooltip] en fait l’expérience."
 agot_multi_duel.0020.desc.outro_survived4.downed:0 "\n\nEreinté par un déluge d’attaque qui frappe sans discontinuer, [loser_duelist.GetFirstNameNoTooltip] s’en trouve le souffle coupé et les membres engourdis, tant et si bien qu’une fois mis à terre, [loser_duelist.Custom('FR_IlElle')] n’a plus la force suffisante pour se relever."
 agot_multi_duel.0020.desc.outro_survived5.downed:0 "\n\nRenversé par [winner_duelist.Custom('FR_Un_signature_weapon')] en furie, [loser_duelist.GetFirstNameNoTooltip] voit son honneur être plus sévèrement entaché que sa propre personne. Incapable de puiser la force pour se relever, son combat s’achève ici, au milieu des coups échangés et du métal entrechoqué."
 agot_multi_duel.0020.desc.outro_survived6.downed:0 "\n\nLa foule est en proie à une profonde stupeur lorsque [loser_duelist.GetFirstNameNoTooltip] est soulevé de terre pour y être envoyé avec force et fracas. Les yeux affamés de spectacles morbides l’imaginent déjà mort, mais les Sept ont semble-t-il préféré lui faire perdre connaissance, plutôt que perdre la vie."
 agot_multi_duel.0020.desc.outro_survived7.downed:0 "\n\nL’affrontement se termine par une chute, celle de [loser_duelist.GetFirstNameNoTooltip]. Et après l’affrontement vient un spectacle quelque peu grotesque, celui d’un homme qui tente vaille que vaille de se relever, mais en vain."
 agot_multi_duel.0020.desc.outro_survived8.downed:0 "\n\nFrappé avec une violence qu’il fait bon de ne pas se prendre en pleine trogne, [loser_duelist.GetFirstNameNoTooltip] gît désormais à terre, sans plus nul désir de continuer — à moins qu’il ait simplement perdu connaissance."
 agot_multi_duel.0020.desc.outro_survived9.downed:0 "\n\nPeu d’homme serait capable d’encaisser pareille violence et réussir à tenir bon, peu d’homme oui, et [loser_duelist.GetFirstNameNoTooltip] n’en fait pas partie. Un dernier effort infructueux pour se relever et il apparaît évident qu’[loser_duelist.Custom('FR_IlElle')] n’est plus en état de combattre."
 agot_multi_duel.0020.desc.outro_survived10.downed:0 "\n\nEn un coup, [loser_duelist.GetFirstNameNoTooltip] est mis[loser_duelist.Custom('FR_E')] à terre et sa volonté mise à bas. Meurtri[loser_duelist.Custom('FR_E')] par la fatigue et la douleur, sa perte de connaissance est pour lui une délivrance, et pour son adversaire, un soulagement."
 agot_multi_duel.0020.desc.outro_survived1.yielded:0 "\n\nAu plus fort de la tempête d’acier qui règne sur la lice, la foule voit poindre l’accalmie tant espérée. [loser_duelist.GetFirstNameNoTooltip] jette s[loser_duelist.Custom('FR_OnA_signature_weapon')] à terre, et pour paraphraser son geste, y joint quelques mots proférés avec autant de force qui lui reste :\n \n« J’abandonne… Je retire mes accusations ! »\n\n[tos_accused.Custom('FR_le_Char_Pi')|U][tos_accused.GetTitledFirstName] se voit libérer d’un poids, [tos_accused.Custom('FR_LuiElle')], comme l’ensemble des champions encore debout et vivants pour entendre sonner la fin du jugement des Sept."
 agot_multi_duel.0020.desc.outro_survived2.yielded:0 "\n\nPour chaque coup donné, un coup est rendu, car la violence appelle la violence, et c’est ce que tout le monde est en droit de s’imaginer. Mais comme pour briser un cercle vicieux, [loser_duelist.GetFirstNameNoTooltip] hurle à travers la lice :\n\n« Je dépose les armes ! J’abandonne toutes accusations contre [tos_accused.Custom('FR_le_Char_Pi')][tos_accused.GetTitledFirstName] ! »\n\nLes échos fracassant s’estompent, les effusions de sang s’arrêtent. L’accusateur n'ayant plus la force, de corps ou d’esprit, de poursuivre le combat, l’ordalie s’achève et le royaume peut à nouveau respirer."
 agot_multi_duel.0020.desc.outro_survived3.yielded:0 "\n\n« Je retire mes accusations ! »\n\nLa cacophonie du combat qui ne faisait que croître jusque-là s’arrête subitement. Plus d’échos vindicatifs, plus de grognes bestiales, plus de métal mis à l’épreuve. Ne reste qu’un long, solennel et imperturbable silence suite à la reddition de [loser_duelist.GetFirstNameNoTooltip]. Les dieux ont mis à l’épreuve les hommes, et [tos_accused.Custom('FR_le_Char_Pi')][tos_accused.GetTitledFirstName] s’est montré[tos_accused.Custom('FR_E')] suffisamment digne pour mériter d'être libéré du poids de l’accusation. La violence a été silenciée, et les Sept, entendus."
 agot_multi_duel.0020.desc.outro_survived4.yielded:0 "\n\nLa volonté de [loser_duelist.GetFirstNameNoTooltip] trésaillent devant une foule dubitative. Le combat aurait-il eu raison de ses forces, de sa vaillance, de son opiniâtreté ? Il semblerait :\n\n« J’abandonne… » dit-[loser_duelist.Custom('FR_IlElle')] à demi-voix avant de chasser l’incertitude et de le répéter avec cette fois plus de conviction : « J’abandonne !!! »\n\nAbandonnant le combat, [loser_duelist.Custom('FR_IlElle')] abandonne par la même toutes accusations contre [tos_accused.Custom('FR_le_Char_Pi')][tos_accused.GetTitledFirstName], [tos_accused.Custom('FR_LequelLaquelle')] semble soulager de savoir son innocence reconnue de son vivant. Un simple mot, voilà ce qui met fin aux hostilités et clos le jugement des Sept."
 agot_multi_duel.0020.desc.outro_survived5.yielded:0 "\n\nJusqu’à présent c’est l’acier qui s’est fait entendre, mais la volonté de [loser_duelist.GetFirstNameNoTooltip] ne partageant nullement sa robustesse, [Select_CString(loser_duelist.IsFemale,'la femme','l’homme')] fait taire le métal en quelques mots :\n\n« Cessez le combat !!! J’abandonne ! J’abandonne… » Sa voix s’éteint, et avec elle, toute hostilité.\n\n[tos_accused.Custom('FR_le_Char_Pi')|U][tos_accused.GetTitledFirstName] désormais libéré[tos_accused.Custom('FR_E')] des accusations, le jugement des Sept n’a plus lieu d’être, et déjà les armes sont déposées de part et d’autres de la lice."
 agot_multi_duel.0020.a.a:0 "Restez concentré !"
 agot_multi_duel.0020.a.b:0 "Ne baissez pas votre garde !"
 agot_multi_duel.0020.a.c:0 "Il faut en terminer au plus vite !"
 agot_multi_duel.0020.a.d:0 "Prenez garde !"
 agot_multi_duel.0020.a.e:0 "Accrochez-vous !"
 agot_multi_duel.0020.a.f:0 "Ne lâchez rien !"
