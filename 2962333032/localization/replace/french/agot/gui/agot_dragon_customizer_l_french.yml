 dragon_fire_color_template_de_gui:0 "Mode de couleur du feu"
 dragon_fire_color_template_de_gui_tt:0 "#bold Par défaut#! fait correspondre la couleur du feu à celle du dragon.\n\n#bold Personnalisée#! vous permet de choisir vous-même la couleur."
 dragon_fire_color_value_de_gui:0 "Couleur du feu"
 dragon_fire_color_value_de_gui_tt:0 "#bold Par défaut#! : le pourcentage indique #emp l’intensité#! avec laquelle les flammes prennent la couleur du dragon (0% étant une flamme orange classique)\n\n#bold Personnalisée#! : le pourcentage indique #emp la couleur elle-même#! par rapport au cercle chromatique (0 et 100% correspondent à une flamme orange classique ; 50% au bleu)\n\nL’intensité de la couleur du feu va décroissante à partir de la gueule jusqu’à prendre la couleur d’une flamme naturelle."
 dragon_fire_smoke_template_de_gui:0 "Mode fumée"
 dragon_fire_smoke_template_de_gui_tt:0 "#bold Automatique#! : la fumée n’apparaît que sur un dragon sombre, où elle paraît naturelle.\n\n#bold Personnalisée#! : permet de régler la quantité de fumée de n’importe quel dragon."
