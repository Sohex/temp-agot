l_french:
 feast_option_type:0 "Un motif de festin"
 feast_type_generic:0 "Festin"
 feast_type_generic_desc:1 "$EFFECT_LIST_BULLET$ Des événement vous donneront l’occasion de gagner de l’[opinion|El]\n$EFFECT_LIST_BULLET$ Certains options permettront des pertes de [stress|El]\n\n#weak Faut-il vraiment un prétexte pour faire la fête ?#!"
 feast_type_murder:0 "Festin meurtrier"
 feast_type_murder_desc:3 "$EFFECT_LIST_BULLET$ Vous allez choisir comment assassiner votre invité d’honneur et sa suite\n\n#weak Vous n’attirez pas des invités, mais des victimes.#!\n\n@warning_icon! #X Vous ne pourrez pas organiser d’autre [GetActivityType('activity_feast').GetName] sanglant pendant 15 ans#!\n@warning_icon! #X Cibler votre [liege|El] ou votre [head_of_faith|El] entraînera des pénalités plus importantes#!\n\n@alert_icon! #alert_trial Les personnages avec les traits [GetTrait('just').GetName( GetNullCharacter )], [GetTrait('compassionate').GetName( GetNullCharacter )] et [GetTrait('calm').GetName( GetNullCharacter )] gagneront du [stress|El]#!"
 feast_option_food:1 "Complexité des repas"
 feast_food_bad:1 "Simples tranchoirs"
 feast_food_bad_desc:2 "$EFFECT_LIST_BULLET$ Gain de [prestige|El] réduit\n\n#weak Les nobles préfèrent sûrement la bonne nourriture, simple et copieuse, à une bouillie qui se veut sophistiquée.#!"
 feast_food_normal:1 "Mets exotiques"
 feast_food_normal_desc:2 "$EFFECT_LIST_BULLET$ Gain de [prestige|El] moyen\n\n#weak Tout festin remarquable avec de la nourriture riche et exotique complète le luxe de base auquel la noblesse s’attend.#!"
 feast_food_good:1 "Œuvres d’art culinaires"
 feast_food_good_desc:2 "$EFFECT_LIST_BULLET$ Gain de [prestige|El] très accru\n\n#weak Faites en sorte que cela ressemble à un faucon en vol ! Un plat sans histoire n’est rien d’autre qu’une vulgaire bouillie.#!"
 feast_option_courses:0 "Nombre de plats"
 feast_courses_bad:0 "Acceptable"
 feast_courses_bad_desc:2 "$EFFECT_LIST_BULLET$ Petit gain d’[opinion|El]\n$EFFECT_LIST_BULLET$ Très petit gain d’[opinion|El] auprès des [vassals|El] [GetVassalStance( 'courtly' ).GetName|l][GetVassalStance( 'courtly' ).GetTextIcon]\n\n#weak Avec une demi-douzaine de plats, les convives seront certainement rassasiés, à défaut d’être particulièrement impressionnés.#!"
 feast_courses_normal:0 "Approprié"
 feast_courses_normal_desc:3 "$EFFECT_LIST_BULLET$ Gain d’[opinion|El] moyen\n$EFFECT_LIST_BULLET$ Gain d’[opinion|El] moyen auprès des [vassals|El] [GetVassalStance( 'courtly' ).GetName|l][GetVassalStance( 'courtly' ).GetTextIcon]\n\n#weak Un festin exige un certain excès de nourriture, et vous avez tout prévu pour ça.#!"
 feast_courses_good:0 "Exorbitant"
 feast_courses_good_desc:2 "$EFFECT_LIST_BULLET$ Gain d’[opinion|El] considérable\n$EFFECT_LIST_BULLET$ Gain d’[opinion|El] accru auprès des [vassals|El] [GetVassalStance( 'courtly' ).GetName|l][GetVassalStance( 'courtly' ).GetTextIcon]\n\n#weak Plus de deux douzaines de plats provenant de terres proches ou lointaines ! Des plats traditionnels et inédits ! Des soupes ! Des hors-d’œuvre !#!"
 feast_phase_meal:0 "Banquet"
 feast_phase_toast:0 "Trinquée"
 every_guest_scope_tt:0 "Tous les invités"
 feast.0010.desc:0 "J’ignore pourquoi vous avez accepté mon invitation pour finalement assister au festin [other_host.Custom('FR_du_Char_Pi')][other_host.GetTitledFirstName], mais sachez que je m’en souviendrai."
 feast.0010.a:0 "Dommage."
 feast.1501.opening:0 "[sender.Custom2('AppropriateGreeting', ROOT.Char)]"
 feast.1501.opening_desc:0 "Je vous invite cordialement à mon festin à [barony.GetNameNoTier] !"
 feast.1501.host_likes_me:0 "J’espère que vous y assisterez, autrement votre présence nous manquerait beaucoup."
 feast.1501.host_gets_along_with_me:0 "En tant qu’éminent[ROOT.Char.Custom('FR_E')] [ROOT.Char.GetTitleTierName], je serais honoré[sender.Custom('FR_E')] de votre présence."
 feast.1501.host_dislikes_me:0 "Je m’attends à ce que tout le monde soit présent, ce qui malheureusement vous inclut."
 feast.1501.a:0 "Bien sûr que j’y serai."
 feast.1501.b:0 "Je viendrai. À contrecœur."
 feast.1501.c:0 "Je suis triste de dire que je suis occupé[ROOT.Char.Custom('FR_E')]."
 feast.1501.d:0 "Non, je refuse !"
 feast.1502.desc:0 "Je vous invite par la présente à mon festin à [barony.GetNameNoTier] ! Ce sera un grand événement, digne de votre honorable présence."
 feast.1502.a:0 "Avec plaisir."
 feast.1502.b:0 "J’ai des problèmes plus importants à régler."
 feast.1503.desc:0 "Je vous invite par la présente à mon festin à [barony.GetNameNoTier] ! Ce sera un grand événement, avec une cuisine délicieuse et des divertissements."
 feast.1503.a:0 "Avec plaisir."
 feast.1503.b:0 "J’ai des problèmes plus importants à régler."
 feast.2001.t:0 "Un joyeux rassemblement"
 feast.2001.t_murder:0 "Un vil rassemblement"
 feast.2001.desc_intro:0 "Je [Select_CString(ROOT.Char.HasTrait( GetTrait('clouded_eyes') ), 'devine', 'regarde' )] [ROOT.Char.Custom('quirk_pos_adverb')] les convives qui se tiennent devant moi. De grands noms rassemblés dans une grande salle."
 feast.2001.desc_fallback:0 "$feast.2001.desc_intro$\n\n$feast.2001.desc_outro$"
 feast.2001.desc_gregarious:0 "$feast.2001.desc_intro$\n\nToutes ces bonnes gens qui ne demandent qu’à converser, délibérer, palabrer, de tous les mets qui composent un festin, c’est de cela que j’aime le plus me rassasier.\n\n$feast.2001.desc_outro$"
 feast.2001.desc_shy:0 "$feast.2001.desc_intro$\n\nJ’admets bien volontiers qu’en cet instant, je préférerais plutôt [ROOT.Char.Custom('IdleActivity')], néanmoins ce festin est nécessaire.\n\n$feast.2001.desc_outro$"
 feast.2001.desc_ambitious:0 "$feast.2001.desc_intro$\n\nQuand je vois toutes ces moues qui ne demandent qu’à être avinées et ces langues à être déliées, nul doute que je saurais tirer profit de ce festin de bien des manières.\n\n$feast.2001.desc_outro$"
 feast.2001.desc_nerd:0 "$feast.2001.desc_intro$\n\nJe trouve dans l’encre séché plus de charme et d’intérêt que dans l’alcool renversé, mais pour un soir, je puis troquer ma plume contre une fourchette.\n\n$feast.2001.desc_outro$"
 feast.2001.desc_martial:0 "$feast.2001.desc_intro$\n\nL’écho des coupes [ROOT.Char.Custom('RegionalAlcoholicDrink')] qui s’entrechoquent n’a point la même musicalité que les épées sur le champ de bataille, mais du moins trouverais-je dans cette trêve passagère un peu de réconfort.\n\n$feast.2001.desc_outro$"
 feast.2001.desc_lustful:0 "$feast.2001.desc_intro$\n\nQue m’importe [ROOT.Char.Custom('GetExpensiveMeal')] et des coupes [ROOT.Char.Custom('RegionalAlcoholicDrink')]. Moi, je raffole de plaisir charnel et m’enivre avec le parfum des [ROOT.Char.Custom('AttractionWomanManMultiple')].\n\n$feast.2001.desc_outro$"
 feast.2001.desc_outro:0 "La musique résonne déjà à tue-tête et les flammes des bougies dansent en conséquence. L’ambiance ne saurait être plus entraînante !"
 feast.2001.desc_murder_feast:1 "Tandis que les invités entrent dans la grande salle, je les observe l’un après l’autre. [honorary_guest.Custom('FR_le_Char_Pi')|U][honorary_guest.GetTitledFirstName]... Comment ose-t-[honorary_guest.Custom('FR_IlElle')] entrer chez moi ? Et ceux qui l’accompagnent... tous mes ennemis. Les ennemis du pays autrement dit !\n\nAlors que les serviteurs allument le grand foyer, j’ai une soudaine révélation. Et si le monde pouvait en un instant être débarrassé du fléau de leurs existences ?"
 feast.2001.a:0 "Soyez tous les bienvenus !"
 feast.2001.a.tt:0 "Que le festin commence"
 feast.2001.b:1 "Je veux leur mort à tous, à [honorary_guest.GetFirstNameNoTooltip] et sa suite."
 feast.2001.c:1 "Je ne veux que la mort de [honorary_guest.GetFirstNameNoTooltip]."
 feast.2001.d:2 "[honorary_guest.GetFirstNameNoTooltip] doit mourir, mais personne ne doit me soupçonner."
 feast.2001.d.tt:1 "La tentative d’assassinat peut échouer"
 feast.2001.e:0 "Ce sont tous mes invités. Il est hors de question qu’il leur arrive malheur."
 feast.2001.c.people_to_spare:0 "Toute personne qui m’est chère sera prévenue"
 feast.2001.e.tt:0 "Le festin commence, et nulle violence ne sera commise"
 feast.2002.t:0 "$feast_header$ soustrait à son devoir"
 feast.2002.desc:1 "Quel désastre !\n\nAprès tous mes préparatifs, mes invités sont arrivés à un festin sans hôt[ROOT.Char.Custom('FR_EEsse')] ! Ils sont rentrés chez eux et je leur ai donné une bien mauvaise image de ma personne."
 feast.2002.a:0 "Je risque de le regretter."
 feast.2003.t:0 "$feast_header$ une fête médiocre"
 feast.2003.desc:0 "Je ne peux pas le croire. Malgré mes invitations et mes préparatifs, pas un seul invité ne s’est présenté à ma fête.\n\nPeu importe ! Je vais profiter seul[ROOT.Char.Custom('FR_E')] de toute cette nourriture et de ce vin, et l’écho des pas dans ma grande salle est toute la compagnie dont j’ai besoin !"
 feast.2003.a:0 "Suis-je vraiment si seul[ROOT.Char.Custom('FR_E')] ?"
 feast.2003.b:0 "Je me sens un peu soulagé[ROOT.Char.Custom('FR_E')]."
 feast.2010.t:0 "$feast_header$ coup de chance ?"
 feast.2010.desc:0 "J’ai appris que mon invité[ROOT.Var('murder_guest_host_var').GetCharacter.Custom('FR_E')] très spécial[ROOT.Var('murder_guest_host_var').GetCharacter.Custom('FR_E')], [ROOT.Var('murder_guest_host_var').GetCharacter.Custom('FR_le_Char_Pi')][ROOT.Var('murder_guest_host_var').GetCharacter.GetTitledFirstName], est décédé[ROOT.Var('murder_guest_host_var').GetCharacter.Custom('FR_E')] un peu plus tôt que prévu. Nous allons tous pleurer sa mort, et annuler la fête par respect pour [ROOT.Var('murder_guest_host_var').GetCharacter.Custom('FR_LuiElle')].\n\n#EMP Dommage, j’aurais aimé qu’[ROOT.Var('murder_guest_host_var').GetCharacter.GetSheHe] meure de ma main.#!"
 feast.2010.a:0 "C’est vraiment dommage."
 feast.2010.a.tt:0 "Le festin meurtrier est annulé"
 feast.2011.t:0 "$feast_header$ décès inattendu"
 feast.2011.desc:0 "La mort subite [host.Var('murder_guest_host_var').GetCharacter.Custom('FR_du_Char_Pi')][host.Var('murder_guest_host_var').GetCharacter.GetTitledFirstName] nous a tous surpris et [host.Custom('FR_le_Char_Pi')][host.GetTitledFirstName] a décidé d’annuler la fête, par respect pour [host.Var('murder_guest_host_var').GetCharacter.Custom('FR_LuiElle')]. Après tout, elle était organisée en son honneur."
 feast.2011.a:0 "$feast.2010.a$"
 feast.2011.a.tt:0 "Le festin est annulé"
 feast.2020.t:0 "$feast_header$ invitation déclinée"
 feast.2020.desc:0 "C’est incroyable ! [ROOT.Var('murder_guest_host_var').GetCharacter.Custom('FR_le_Char_Pi')|U][ROOT.Var('murder_guest_host_var').GetCharacter.GetTitledFirstName] a refusé mon invitation à un festin, alors qu’elle n’était pas du tout suspecte ! Et en plus, c’était mon invité[ROOT.Var('murder_guest_host_var').GetCharacter.Custom('FR_E')] très spécial[ROOT.Var('murder_guest_host_var').GetCharacter.Custom('FR_E')]. C’est absolument inacceptable !"
 feast.2020.a:0 "Je vous aurai, un jour, [ROOT.Var('murder_guest_host_var').GetCharacter.GetFirstNameNoTooltip]. Je vous aurai !"
 feast.2020.a.tt:0 "$feast.2010.a.tt$"
 feast.2021.t:0 "$feast.2020.t$"
 feast.2021.desc:0 "Quelle humiliation ! [host.Var('murder_guest_host_var').GetCharacter.Custom('FR_le_Char_Pi')|U][host.Var('murder_guest_host_var').GetCharacter.GetTitledFirstName] a refusé l’invitation [host.Custom('FR_du_Char_Pi')][host.GetTitledFirstName] à un festin, comme invité[host.Var('murder_guest_host_var').GetCharacter.Custom('FR_E')] spécial[host.Var('murder_guest_host_var').GetCharacter.Custom('FR_E')] ! Et maintenant, [host.GetSheHe] nous renvoie tous chez nous ! À sa place, je ne me serais jamais permis une chose pareille !"
 feast.2021.a:0 "$feast.2010.a$"
 feast.2021.a.tt:0 "$feast.2011.a.tt$"
 feast.2501.t:0 "Un accueil chaleureux"
 feast.2501.likes_host:0 "Tous les invités se sont rassemblés dans la grande salle et notre aimable hôt[host.Custom('FR_EEsse')], [host.Custom('FR_le_Char_Pi')][host.GetTitledFirstName], nous accueille à sa fête !"
 feast.2501.dislikes_host:0 "Tous les invités se sont rassemblés dans la grande salle et l’espèce de [host.Custom2('InsultAdjective', ROOT.Char)] qui nous sert d’hôt[host.Custom('FR_EEsse')], [host.Custom('FR_le_Char_Pi')][host.GetTitledFirstName], nous accueille à sa fête !"
 feast.2501.a.gluttonous:0 "Je peux sentir les cuisines d’ici !"
 feast.2501.a.drunkard:0 "Où sont les fûts [ROOT.Char.Custom('RegionalAlcoholicDrink')] ?"
 feast.2501.a.gregarious:0 "J’ai hâte de parler à tout le monde !"
 feast.2501.a.shy:0 "Il y a beaucoup de gens ici..."
 feast.2501.a:0 "J’ai hâte !"
 feast.2501.b:0 "J’espère que ça en vaut la peine."
 feast.5003.t:0 "La fin des festivités"
 feast.3601.desc:1 "Puisque [host.Custom2('MyCharacterIntroduction', ROOT.Char)] est décédé[host.Custom('FR_E')], sa fête prend fin.\n\nAlors que les invités discrets s’en vont, je prie pour que [ROOT.Char.GetFaith.HighGodNameAlternate] accueille [host.GetFirstName] [ROOT.Char.GetFaith.PositiveAfterLife2] aussi chaleureusement qu[host.Custom('FR_EluiElle')] nous a accueillis chez [host.Custom('FR_LuiElle')]."
 feast.3601.a:0 "C’était une fête si amusante !"
 feast.3601.a.tt:1 "#F Jusqu’à sa mort...#!"
 feast.5004.desc:0 "Puisque je suis maintenant enfermé[ROOT.Char.Custom('FR_E')] derrière des barreaux, mon grand festin va être annulé. Toutes les heures que j’ai passées à le préparer sont ainsi gaspillées !"
 feast.5002.a:1 "Pas d’hôte, pas de fête."
 feast.5005.desc:0 "[host.Custom2('MyCharacterIntroduction', ROOT.Char)|U] a été emprisonné[host.Custom('FR_E')] et sa grande fête doit prendre fin. Cela arrive vraiment au mauvais moment !"
 feast.0050.t:0 "L’art de faire la fête"
 feast.0050.desc:0 "Festoyer jusqu’à pas d’heure, faire bonne ripaille, se délecter [ROOT.Char.Custom('RegionalAlcoholicDrink')]…\n\nQuand les affres du monde frappent à la porte et résonnent dans les cœurs, quel mal y a-t-il à les silencier par des rires et des chants ?"
 feast.0050.a:0 "La fête c’est l’art de vivre. #bold L’art de vivre pleinement !#!"
 feast.0050.b:0 "C’est hélas un train de vie que je ne puis épouser…"
 feast.7002.t:0 "Vienne les festivités"
 feast.7002.desc_intro:0 "La salle est pavoisée de sorte à la rendre déjà bien festive, alors même qu’il nous faut encore attendre les derniers convives pour que débutent les réjouissances. Pour l’heure n’est entendu que les percussions des domestiques qui vont grand train d’un bout à l’autre pour achever les préparatifs, mais bientôt, rires et chants agrémenteront les lieux de musiques plus harmonieuses et entraînantes."
 feast.7002.dislikes_host:0 "Du moins, jusqu’à l’instant fatidique où [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] [Select_CString(ROOT.Char.HasTrait( GetTrait('rude') ), 'viendra nous chier dans les oreilles', 'ruinera l’ambiance en ouvrant son clapet' )]."
 feast.7002.likes_host:0 "Je gage que [ROOT.Char.Custom2('direct_address_by_familiarity', SCOPE.sC('host'))] a pris toute les dispositions nécessaires pour que les festivités soient à la hauteur des attentes."
 feast.7002.neutral:0 "\n\nÀ l’odeur qui vient titiller mes narines, je puis déjà deviner qu’un fût [ROOT.Char.Custom('RegionalAlcoholicDrink')] vient d’être ouvert."
 feast.7002.intent_arrived:0 "\n\nCependant, il me faut garder en tête la raison de ma présence ici. Les festivités sont une chose, mais [ROOT.Char.GetInvolvedActivityIntent.GetName|l] en est une autre."
 feast.7002.intent:0 "\n\n[ROOT.Char.GetIntentTarget.Custom('FR_le_Char_Pi')|U][ROOT.Char.GetIntentTarget.GetTitledFirstName] ne nous a toujours pas fait grâce de sa présence, mais sachant qu’[ROOT.Char.GetIntentTarget.Custom('FR_IlElle')] est ma préoccupation première à ce festin, je ne puis qu’être extatique de [ROOT.Char.GetIntentTarget.Custom('FR_LeLa')] savoir bientôt ici."
 feast.7002.a.good:0 "Il me tarde de pouvoir ripailler et festoyer !"
 feast.7002.a.bad:0 "Tâchons de faire bonne figure…"
 feast.7101.t:0 "La fête est finie"
 feast.7101.desc:0 "Les derniers invités sont partis et il reste peu de bougies allumées. J’entends deux serviteurs soupirer de soulagement, une fois les portes closes. La nourriture est encore chaude dans les assiettes.\n\nBientôt, la nouvelle parviendra jusqu’aux coins les plus reculés du pays et tous les nobles dignes de ce nom sauront que ma magnificence est sans égale."
 feast.7101.a:0 "Et voilà qui est bel et bien terminé."
 feast.7110.t:0 "Fin heureuse"
 feast.7110.desc.entourage:2 "La lumière des bougies donne au sang l’aspect d’un tapis de velours. En voyant le dernier de mes $knight_culture_player_plural_no_tooltip$ nettoyer son épée en m’adressant sereinement un signe de tête, je recommence à respirer.\n\nJe fais signe à l’un[my_knight.Custom('FR_E')] des [my_knight.GetWomenMen] de fermer les portes, puis je fais mes au revoir à mes invités. « Quel dommage... »"
 feast.7110.a:0 "C’est du bel ouvrage."
 feast.7110.a.failure:0 "La prochaine fois, je l’aurai..."
 feast.7110.desc.target_intro:0 "« Quel malheureux incident ! », me lamenté-je en prenant congé de mes invités. « C’est une véritable honte », abonde une autre invitée en partant. « C’est vraiment malheureux, » entends-je ajouter son époux, qui la suit sans tarder.\n\n"
 feast.7110.desc.target:0 "$feast.7110.desc.target_intro$« Qui a bien pu faire ça ? Gâcher un festin de la sorte... Les conspirateurs sont partout », marmonne un courtisan. Je me tourne vers mes serviteurs et leur adresse un geste vif. « Il est temps de fermer les portes. »"
 feast.7110.desc.sneaky:0 "$feast.7110.desc.target_intro$« Quelle horrible façon de périr ! », dit encore un invité, en appelant les serviteurs à l’aide. « C’est une suffocation ! » « Ce n’est pas la première mort de ce genre, et certainement pas la dernière », murmure un domestique, tandis que les courtisans quittent les lieux. Les portes se ferment derrière eux."
 feast.7110.desc.failed:0 "« Merci pour ce magnifique festin ! » Avant leur départ, certains invités m’entourent pour me témoigner leur gratitude. « Nous avons passé un excellent moment ! » Je peine à leur prêter attention, car une seule pensée m’obsède.\n\n[honorary_guest.Custom('FR_le_Char_Pi')|U][honorary_guest.GetTitledFirstName] est près de la sortie, en train de me saluer. Son sourire est plus exaspérant que tout."
 murder_feast_family_opinion:0 "Famille massacrée lors d’un festin"
 bloody_wedding_family_opinion:0 "Famille tuée lors d’un mariage sanglant"
 murder_feast_murderer_modifier:0 "Hôte comploteur"
 murder_feast_great_murderer_modifier:1 "Souper sinistre"
 murder_feast_murderer_modifier_desc:1 "Ce personnage n’a pas réussi à protéger son invité d’honneur lors de son festin."
 murder_feast_great_murderer_modifier_desc:0 "$murder_feast_murderer_modifier_desc$"
 feast_every_guest:0 "Chaque invité"
 feast.7102.opening:0 "[avenging_family.Custom2('AppropriateGreeting', ROOT.Char)]"
 feast.7102.desc:0 "Je sais ce que vous avez fait."
 feast.7102.a:0 "Heureusement pour vous, vous n’étiez pas là."
 feast.7102.a.tt:0 "Tous les membres de la famille proche [murder_guest.Custom('FR_du_Char_U_Pi')][murder_guest.GetShortUIName]"
 feast.7151.t:0 "Il est l’heure"
 feast.7151.desc:0 "La lumière du jour pénètre par les fenêtres et en un instant, toute la salle est illuminée. La plupart des sièges sont vides, à présent. Quelques serviteurs se saluent joyeusement et prennent congé.\n\n[host.Custom('FR_le_Char_Pi')|U][host.GetTitledFirstName] me sourit."
 feast.7151.desc.desc_roughed_up: "La lumière du jour pénètre par les fenêtres et en un instant, toute la salle est illuminée. La plupart des sièges sont vides, à présent – ce qui n’est pas surprenant, vu ce qu’est devenu cet endroit !\n\n« Je vous méprise jusqu’au plus profond de mon âme. Comment avez-vous pu faire ça à mon foyer ! » me crie [host.Custom('FR_le_Char_Pi')][host.GetTitledFirstName]."
 feast.7151.a:0 "À présent, je dois partir."
 feast.7201.t:0 "L’invité[goh.Custom('FR_E')] d’honneur"
 feast.7201.desc:0 "La soirée a été riche en animations, riche comme le sont les victuailles qui diaprent les tables. Néanmoins, demeure une dernière modalité à respecter pour ce genre d’événement, et sans doute la plus sacrée de toutes : le moment où doit être élogié l’invité d’honneur.\n\nCe soir, cet honneur revient [goh.Custom('FR_au_Char_Pi')][goh.GetTitledFirstNameNicknamedNoTooltip], qui anticipe [goh.Custom2('QuirkAdverbPosOrNeg', ROOT.Char)] ce moment.\n\nQuelques paroles reluisantes, une ovation retentissante, voilà ce que l’usage requiert de moi, tandis qu’[goh.Custom('FR_IlElle')] se délectera de l’instant, comme [Select_CString(goh.IsFemale,'elle s’est délectée','il s’est délecté')] [goh.Custom('RegionalDrink')]… [goh.Custom('GetExpensiveMeal')]… et de tout ce que [host.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] a eu la générosité de lui offrir…"
 feast.7201.a:0 "C’est grande joie que de l’avoir sous mon toit, et je veux que cela se sache !"
 feast.7201.b:0 "Je ne laisserais pas un[goh.Custom('FR_E')] vulgaire pique-assiette s’arroger tous les honneurs !"
 feast.7201.b.tt:0 "Le discours que vous allez servir à [goh.GetFirstNameNoTooltip] sera l’onctueuse sauce qui nappera le fumet de son indigeste présence"
 feast.7201.c:0 "[goh.Custom('FR_IlElle')|U] n’en vaut pas la peine…"
 feast.7201.d: "Mon règne est bien plus digne d’éloges !"
 feast.7202.t:0 "$feast.7201.t$"
 feast.7202.desc.intro:0 "Alors que la fête touche inexorablement à son terme, tout le monde attend impatiemment de lever son verre pour l’invité d’honneur [host.Custom('FR_du_Char_Pi')][host.GetTitledFirstName] :"
 feast.7202.desc.honoured:0 "moi.\n\nJ’attends ce grand moment depuis le début des festivités, même s’il ne dure qu’un bref instant."
 feast.7202.desc.slagged_off:0 "moi.\n\nMalheureusement, au lieu de faire mon éloge, comme promis dans son invitation, [host.GetFirstNameNoTooltip] se lance dans une diatribe acerbe, mettant en cause mon caractère, mon intelligence et mon hygiène. Dans les moindres détails !"
 feast.7202.desc.bragged:0 "moi.\n\nMalheureusement, [Select_CString(host.IsFemale, 'cette vantarde', 'ce vantard')] m’ignore totalement et choisit de se complimenter à la place, pour avoir organisé cette maudite fête. J’aurais dû m’en douter."
 feast.7202.a:0 "Quel plaisir d’être apprécié[ROOT.Char.Custom('FR_E')]."
 feast.7202.b:0 "Comment avez-vous pu me faire ça ?"
 feast.7202.c:0 "Je saurai m’en souvenir."
 feast.7202.adventurer_loot: "Par le ?! Tabassez-[host.Custom('FR_LeLa')] et volez [host.Custom('GetExpensiveMeal')] !"
 feast.7202.c.tt:0 "[goh.GetFirstNameNoTooltip] en fait une affaire personnelle"
 feast.7203.t:0 "$feast.7201.t$"
 feast.7203.desc.intro:0 "$feast.7202.desc.intro$"
 feast.7203.desc.honoured:0 "[goh.GetTitledFirstName]\n\nC’est un bon discours, quoique longuet, mais rien d’inhabituel. L’assemblée applaudit poliment à la fin, certains se montrent plus enthousiastes que d’autres."
 feast.7203.desc.slagged_off:0 "[goh.GetTitledFirstName]\n\nÀ la surprise générale, [host.GetFirstNameNoTooltip] se tourne vers son invité[goh.Custom('FR_E')] d’honneur non pas pour faire son éloge, mais pour l’accabler au cours d’un discours véhément, empreint d’une verve farouche, mettant en question son intelligence, sa moralité et son odeur en général. L’audience, dont je fais partie, est frappée de mutisme."
 feast.7203.desc.bragged:0 "[goh.GetTitledFirstName]\n\nNous ne sommes que modérément étonnés, lorsque [host.GetFirstNameNoTooltip] omet de parler de son invité[goh.Custom('FR_E')] d’honneur pour s’attribuer tout le mérite de la réussite du festin. C’est, au mieux, quelque peu grossier et les applaudissements s’en ressentent."
 feast.7203.a:0 "Votre attention, je vous prie !"
 feast.7203.b.goh_honoured:0 "En toute franchise, je n’ai jamais vraiment aimé [goh.GetFirstNameNoTooltip]."
 feast.7203.b.goh_dishonoured:0 "C’était inconvenant."
 feast.0800.t:1 "$feast_header$ interruption du banquet"
 feast.0800.desc:0 "Mon prédécesseur, [host.GetNameRegnal], a rendu l’âme alors qu’[host.GetSheHe] était en tournée dans le pays. Par malheur, [host.GetSheHe] [host.GetDeathReason].\n\n"
 feast.0800.desc.entourage:0 "$activity_system.1010.desc.entourage$"
 feast.0800.desc.ruler:0 "Feu [host.Custom('FR_le_Char_L')][host.GetTitleAsName] ne méritait pas de trépasser ainsi."
 feast.0800.a:0 "$activity_system.1010.a$"
 feast.0800.tt:0 "Le [GetActivityType('activity_feast').GetName] [host.Custom('FR_du_Char_U_Pi')][host.GetShortUINameNoTooltip] a été annulé"
 feast_events_flavor.0001.t: "Mon petit doigt m’a dit…"
 feast_events_flavor.0001.desc.intro: "Tandis que j’hésite entre imprégner mes lèvres [ROOT.Char.Custom('RegionalDrink')] ou privilégier quelque chose de plus solide comme [ROOT.Char.Custom('GetExpensiveMeal')], [guest.Custom('FR_le_Char_Pi')][guest.GetTitledFirstNameNoTooltip] parvient à se frayer un passage dans le dédale d’invités qui nous séparait jusque-là."
 feast_events_flavor.0001.desc.good: "\n\n« [ROOT.Char.GetTitledFirstNameNoTooltip], » débute-t-[guest.Custom('FR_IlElle')] d’une voix plus mielleuse que toutes les douceurs que l’on pourrait servir ici. « Il me tardait de converser avec vous. Nombreux sont les éloges à votre égard qui ont papillonné jusqu’à mes oreilles, dont le plus grand nombre viennent directement de la bouche de [relation_target.GetFirstNameNoTooltip]. »"
 feast_events_flavor.0001.desc.bad: "\n\n« [ROOT.Char.GetTitledFirstNameNoTooltip], » m’apostrophe-t-[guest.Custom('FR_IlElle')] d’un ton plus amer que tout ce qui pourrait être servi ici. « J’ai ouï-dire bien des choses à votre égard ces derniers temps, mais rien qui ne soit très reluisant. Compte tenu de l’énergie que [relation_target.GetFirstNameNoTooltip] met à vous honnir en toute circonstance, je m’interroge sur la véracité des médisances qui vous précèdent. »"
 feast_events_flavor.0001.aa: "C'est l’occasion ou jamais de rapprocher [ROOT.Char.GetHouse.GetNameNoTooltip] et [guest.GetHouse.GetNameNoTooltip] !"
 feast_alliance_effect_tooltip: "[guest.Custom('FR_le_Char_Pi')|U][guest.GetTitledFirstNameNoTooltip] et moi signons une [alliance|El]"
 feast_events_flavor.0001.a: "Que[relation_target.Custom('FR_LLle')] [relation_target.Custom('WomanManGirlBoy')] perspicace que votre [guest.Custom2('LMF_RelationToMeShort', SCOPE.sC('relation_target'))]. [relation_target.Custom('FR_IlElle')|U] fait honneur aux [guest.GetDynasty.GetBaseNameNoTooltip] !"
 feast_events_flavor.0001.b: "Je n’aurais aucun mal à lui rendre la politesse."
 feast_events_flavor.0001.c: "Le sang des [guest.GetDynasty.GetBaseNameNoTooltip] est traître par nature !"
 feast_events_flavor.0001.d: "Il est vrai que j’ai mon lot de torts dans cette histoire."
 feast_events_flavor.0001.e: "Et si nous discutions autour d’une bouteille [ROOT.Char.Custom('RegionalAlcoholicDrink')] ?"
 feast_events_flavor.0002.t: "Le pardon est une vertu divine"
 feast_events_flavor.0002.desc: "M[ROOT.Char.Custom2('FR_RelationToMeShort_OnA', SCOPE.sC('former_rival'))] et [Concept('rival',Select_CString(former_rival.IsFemale,'ancienne rivale','ancien rival'))|E], [former_rival.Custom('FR_le_Char_Pi')][former_rival.GetTitledFirstName], s’approche de ma table avec deux coupes à la main et s’assoit [former_rival.Custom('quirk_pos_adverb')] sur la chaise à côté de moi. Nous nous retrouvons vite à discuter, nous remémorant les querelles passées."
 feast_events_flavor.0002.a: "Vos taquineries me manquent un peu, ch[former_rival.Custom('FR_ErEre')] [former_rival.GetFirstName]..."
 feast_events_flavor.0002.b: "Soyons plus proches que jamais !"
 feast_events_flavor.0002.c: "Merci de me l’avoir rappelé – partez, [former_rival.Custom2('InsultNoun', ROOT.Char)] [former_rival.Custom2('InsultAdjective', ROOT.Char)] !"
 feast_events_flavor.0002.c.vengeful_sinful.tt: "Vous perdrez de la [piety|El] car votre [faith|El] [THIS.GetCharacter.GetFaith.GetAdjective] considère le [trait|El] [GetTrait('forgiving').GetName( GetNullCharacter )] comme [virtuous|El] ou [GetTrait('vengeful').GetName( GetNullCharacter )] comme [sinful|El]"
 feast_events_flavor.0002.c.forgiving_sinful.tt: "Vous gagnerez de la [piety|El] car votre [faith|El] [THIS.GetCharacter.GetFaith.GetAdjective] considère le [trait|El] [GetTrait('vengeful').GetName( GetNullCharacter )] comme [virtuous|El] ou [GetTrait('forgiving').GetName( GetNullCharacter )] comme [sinful|El]"
 feast_events_flavor.0002.d: "Plus [former_rival.Custom('RegionalAlcoholicDrink')] pour c[former_rival.Custom('FR_EEtte')] [former_rival.Custom2('InsultNoun', ROOT.Char)] [former_rival.Custom('ComplimentAdjective')] !"
 feast_events_flavor.0002.d.virtuous: "Le pardon est chose sacrée pour les [ROOT.Char.GetFaith.GetReligion.GetAdherentNamePlural] !"
 feast_events_flavor.0002.d.virtuous.tt: "Cette option est disponible car votre [faith|El] [THIS.GetCharacter.GetFaith.GetAdjective] considère le [trait|El] [GetTrait('forgiving').GetName( GetNullCharacter )] comme [virtuous|El] ou [GetTrait('vengeful').GetName( GetNullCharacter )] comme [sinful|El]"
 feast_turning_the_other_cheek_modifier: "Tendre l’autre joue"
 feast_turning_the_other_cheek_modifier_desc: "Ce personnage est connu pour sa capacité à pardonner."