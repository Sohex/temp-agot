 agot_great_project_events.1010.desc.ruins: "我[ROOT.Char.Custom2('RelationToMe', overlord_scope)]的使者[overlord_scope.GetTitledFirstName]一大早就兴奋地来到我面前。\n\n“[ROOT.Char.Custom('FormOfAddressForLiege')|U]！”#EMP [envoy.GetSheHe|U]喘了口气，然后向我鞠了一躬。#!“[project_location.GetNameNoTooltip]的[province.GetHolding.GetType.GetName|l]终于修复完成了！”\n\n“我们仁慈的[overlord_scope.GetTitleAsNameNoTooltip]派我前来，向您转达[overlord_scope.GetHerHis]对您为此做出的慷慨贡献的谢意！”这个[envoy.GetWomanMan]眼中闪烁着热忱的光芒，[envoy.GetSheHe]重述着修复后建筑的景象，用许多奇妙的描述赞美着[province.GetHolding.GetType.GetName|l]。\n\n我轻哼一声，点了点头，对自己为这项事业所做的贡献感到满意……"
 agot_great_project_events.1010.desc.chroyane: "我[ROOT.Char.Custom2('RelationToMe', overlord_scope)]的使者[overlord_scope.GetTitledFirstName]一大早就兴奋地来到我面前。\n\n“[ROOT.Char.Custom('FormOfAddressForLiege')|U]！”#EMP [envoy.GetSheHe|U]喘了口气，然后向我鞠了一躬。#!“[project_location.GetNameNoTooltip]的[province.GetHolding.GetType.GetName|l]终于修复完成了！”\n\n“我们仁慈的[overlord_scope.GetTitleAsNameNoTooltip]派我前来，向您转达[overlord_scope.GetHerHis]对您为此做出的慷慨贡献的谢意！”这个[envoy.GetWomanMan]眼中闪烁着热忱的光芒，[envoy.GetSheHe]重述着修复后建筑的景象，用许多奇妙的描述赞美着[province.GetHolding.GetType.GetName|l]。\n\n我轻哼一声，点了点头，对自己为这项事业所做的贡献感到满意……"
 agot_great_project_events.1010.desc.special: "我[ROOT.Char.Custom2('RelationToMe', overlord_scope)]的使者[overlord_scope.GetTitledFirstName]一大早就兴奋地来到我面前。\n\n“[ROOT.Char.Custom('FormOfAddressForLiege')|U]！”#EMP [envoy.GetSheHe|U]喘了口气，然后向我鞠了一躬。#!“[project_location.GetNameNoTooltip]的[province.GetHolding.GetType.GetName|l]终于建成了！”\n\n“我们仁慈的[overlord_scope.GetTitleAsNameNoTooltip]派我前来，向您转达[overlord_scope.GetHerHis]对您为此做出的慷慨贡献的谢意！”这个[envoy.GetWomanMan]眼中闪烁着热忱的光芒，[envoy.GetSheHe]重述着完工建筑的景象，用许多奇妙的描述赞美着[province.GetHolding.GetType.GetName|l]。\n\n我轻哼一声，点了点头，对自己为这项事业所做的贡献感到满意……"
