 agot_great_project_events.1000.desc.ruins: "放眼望去，这座[province.GetHolding.GetType.GetName|l]已恢复昔日的辉煌。工人们此时已尽完义务，各自散去，只留下一座从废墟中重建起来的美丽而坚固的建筑。\n\n我驻足片刻，欣赏领地新添的建筑。\n\n是的，是的，这就足够了。我将自豪地统治这座[province.GetHolding.GetType.GetName|l]。"
 agot_great_project_events.1000.desc.chroyane: "放眼望去，这座[province.GetHolding.GetType.GetName|l]已恢复昔日的辉煌。工人们此时已尽完义务，各自散去，只留下一座从废墟中重建起来的美丽而坚固的建筑。\n\n我驻足片刻，欣赏领地新添的建筑。\n\n是的，是的，这就足够了。但要恢复这座城市，还有更多的工作要做。"
 agot_great_project_events.1000.desc.special: "放眼望去，这座[province.GetHolding.GetType.GetName|l]已重新建起。工人们此时已尽完义务，各自散去，只留下一座美丽而坚固的建筑，为城市增色不少。\n\n我驻足片刻，欣赏领地新添的建筑。\n\n是的，是的，这就足够了。我将自豪地统治这座[province.GetHolding.GetType.GetName|l]。"
 agot_great_project_events.1000.a.ruins: "我们取得的进展令人瞩目。"
 agot_great_project_events.1000.a.chroyane: "废墟的残存部分等待着我们的努力。"
 agot_great_project_events.1000.a.special: "此城的辉煌与日俱增。"
