 building_type_agot_great_fleet_01: "舰队港口"
 building_type_agot_great_fleet_01_desc: "这个港口维持着一支庞大的舰队，将海军力量投射至附近海域与海岸。"
 building_agot_great_fleet_01: "舰队港口"
 building_agot_great_fleet_01_desc: "这个港口维持着一支庞大的舰队，将海军力量投射至附近海域与海岸。这项工程只能通过[great_project|E]来完成。"
 building_agot_great_fleet_02: "大型舰队港口"
 building_agot_great_fleet_02_desc: "这座港口已被扩建，足以容纳一支远为庞大的舰队，使其影响力延伸开来，将海上力量和不断增长的财富投射至周边的海域与海岸。这项工程只能通过[great_project|E]来完成。"
 building_agot_great_fleet_03: "精锐武装"
 building_agot_great_fleet_03_desc: "这座港口如今停泊着一支庞大的舰队，使其成为主导附近海域和海岸的战争与贸易的决定性工具。它是一支可怕的军事力量，能够粉碎敌方海军并在波涛上贯彻其意志。这项工程只能通过[great_project|E]来完成。"