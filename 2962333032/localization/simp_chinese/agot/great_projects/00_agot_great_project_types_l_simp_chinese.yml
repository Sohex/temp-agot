l_simp_chinese:
 great_project_type_construct_great_fleet_01: "打造舰队"
 great_project_type_construct_great_fleet_01_desc: "我领地的海岸线必须得到保护，还有什么比建立一支强大的舰队更能确保海上安全并彰显远洋威力的呢？"
 great_project_type_construct_great_fleet_01_coastal_barony: "必须是沿海男爵领"
 great_project_type_construct_great_fleet_02: "扩充舰队"
 great_project_type_construct_great_fleet_02_desc: "我们已打造出一支强大的舰队来保卫[domain|E]，同时也意识到这支舰队仍有成长的空间。还有什么比进一步扩充它更能彰显我们的财富与权势呢？"
 great_project_type_construct_great_fleet_02_coastal_county: "必须是沿海伯爵领且拥有$building_agot_great_fleet_01$"
 great_project_type_construct_great_fleet_03: "建立舰队武装"
 great_project_type_construct_great_fleet_03_desc: "如今这支庞大的舰队已经扩充完毕，它已成为我领地内发展的灯塔。但这样的繁荣必须得到保护，我们必须集结一支强大的武装力量，来好好保卫我领地的水域！"
 great_project_type_construct_great_fleet_03_coastal_county: "必须是沿海伯爵领且拥有$building_agot_great_fleet_02$"
 great_project_type_construct_great_fleet_01_contribution_materials: "材料"
 great_project_type_construct_great_fleet_01_contribution_materials_desc: "无中生有可不行。我们将为[great_project|E]提供建造舰队所需的一切建筑材料。"
 great_project_type_construct_great_fleet_01_contribution_workforce: "劳动力"
 great_project_type_construct_great_fleet_01_contribution_workforce_desc: "船只不会自己造出来！我们将为[great_project|E]提供完成这项伟大任务所需的人力。"
 great_project_type_construct_great_fleet_01_contribution_engineers: "造船工匠"
 great_project_type_construct_great_fleet_01_contribution_engineers_desc: "经验丰富的造船匠和海军工程师将为[great_project|E]贡献他们的专业技能，提升舰队的建造效率。"
 great_project_type_construct_great_fleet_01_contribution_military_wharf: "军用码头"
 great_project_type_construct_great_fleet_01_contribution_military_wharf_desc: "为[great_project|E]增设专用港口和干船坞，将提升舰队的耐用性与服役寿命。"
 great_project_type_construct_great_fleet_01_contribution_merchant_quays: "商人码头"
 great_project_type_construct_great_fleet_01_contribution_merchant_quays_desc: "在[great_project|E]增设专门的商业码头，将提升舰队港口的收入和贸易流量。"
