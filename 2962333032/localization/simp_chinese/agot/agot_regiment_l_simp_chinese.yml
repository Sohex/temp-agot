l_simp_chinese:
 arbor_marines:0 "青亭水陆军团"
 barrow_knights:0 "荒冢骑士"
 royal_crossbowmen:0 "王家弩手"
 finger_scouts:0 "半岛斥候骑兵"
 cape_watch:0 "海望骑手"
 green_hand:0 "青手骑士"
 honeywine_quirrels:0 "蜜酒河弩手"
 hunters_of_the_moon:0 "明月猎手"
 stolen_spears:0 "强袭矛手"
 clan_champions:0 "氏族斗士"
 winter_wolves:0 "冬狼军"
 greenblood_oars:0 "绿血河桨手"
 summer_knights:0 "盛夏骑士"
 river_bows:0 "河间地弓手"
 sun_spears:0 "贯日长枪手"
 sand_steeds:0 "沙地骠骑"
 misty_shields:0 "迷雾之盾"
 sistermen_pirates:0 "姐妹海盗"
 unicorn_riders:0 "独角兽骑兵"
 pass_pikes:0 "隘口长矛手"
 storm_knights:0 "风暴骑士"
 winged_knights:0 "飞翼骑士"
 sea_snakes:0 "海蛇军"
 wolfswood_hunters:0 "狼林猎手"
 bronze_raiders:0 "青铜掠袭者"
 weeping_guard:0 "哭泣守卫"
 myrish_crossbows:0 "密尔弩手"
 holy_guard:0 "大胡子僧侣圣卫"
 indentured_legion:0 "契约军团"
 cohort_of_the_three_thousand:0 "科霍尔三千勇士"
 stepstone_sailors:0 "石阶列岛海盗"
 unsullied:0 "无垢者"
 collared_bows:0 "曲弓手"
 iron_legion:0 "铁方阵"
 arbor_marines_flavor:0 "#F 这些轻甲军团习惯于在雷德温舰队的战舰上作战，是熟练的小规模战斗部队。#!"
 barrow_knights_flavor:0 "#F 虽然没有南方的骑兵那么华丽，但是先民荒冢的重骑兵可以快速地完成所有的任务，除了最有纪律的军队。#!"
 royal_crossbowmen_flavor:0 "#F 与传统弓箭手相比，弩手更容易训练，同时可以轻松击穿最精良的装甲，在与重步兵和骑兵作战时更有优势。#!"
 finger_scouts_flavor:0 "#F 虽然半岛骑兵的冲锋比重甲骑士破坏力小，但他们的速度使其在掩护较慢的阵型推进和追击溃逃的敌人方面效果显著。#!"
 cape_watch_flavor:0 "#F 海怪角长期以来一直是铁种和北境人之间的战场，它的战士们汲取了两方的军事传统。#!"
 green_hand_flavor:0 "#F 这些北境骑士是河湾地国王建立的古老骑士团的最后一支残余力量，他们将南方的骑士精神和战术发挥到了极致，对步兵形成了毁灭性的打击。#!"
 honeywine_quirrels_flavor:0 "#F 河湾地的弓手非常适合对抗骑士和重步兵的板甲，尽管他们的装备成本比普通弓箭手要高。#!"
 hunters_of_the_moon_flavor:0 "#F 这些来自明月山脉的弓箭手不需要昂贵的装备，是对抗轻甲步兵的有效武器。#!"
 stolen_spears_flavor:0 "#F 尽管山地氏族的矛兵装备比低地士兵更原始，但他们以刺死他们憎恨的安达尔敌人的马为乐。#!"
 clan_champions_flavor:0 "#F 北境的山地氏族生性好斗，他们有能力派出经验丰富的战士组成强大的军团。#!"
 winter_wolves_flavor:0 "#F 在这片终年积雪的土地上，重装步兵而非骑兵往往能大显身手，但这些北境战士在任何战场上都游刃有余。#!"
 greenblood_oars_flavor:0 "#F 虽然这些战士在绿血河上的木筏上勉强维持着艰辛的生活，但他们却对古老的洛伊拿祖先相当自豪。#!"
 summer_knights_flavor:0 "#F 河湾地的骑士精神在和平时期是一道美丽的风景，而在战争时期则是步兵的可怕敌人。#!"
 river_bows_flavor:0 "#F 河间地弓箭手是一支轻盈敏捷的部队，能够对战场上不断变化的情况做出反应，不会放过敌方步兵的任何一次失误。#!"
 sun_spears_flavor:0 "#F 无论是轻骑兵、重骑兵，甚至战象，多恩长枪手都是其顽固且危险的敌人。#!"
 sand_steeds_flavor:0 "#F 多恩的沙马以其美丽和优雅而闻名，是世界上最快的马之一，但它们的耐力也同样令人印象深刻。在战斗中，多恩轻骑兵侧翼包抄和追击速度较慢的敌人的能力是无与伦比的。#!"
 misty_shields_flavor:0 "#F 这些军团来自盾牌列岛，经历了与最可怕的铁种掠夺者的战斗考验，必须随时准备好应对突袭。#!"
 sistermen_pirates_flavor:0 "#F 三姐妹群岛的海盗最难以约束，他们在战场上是一股敏捷而令人烦恼的力量。#!"
 unicorn_riders_flavor:0 "#F 许多人认为斯卡格斯独角兽是传说而不是事实，它们是脚步稳健的野兽，和骑着它们的人一样强壮。在战场上，它们是一道可怕的风景。#!"
 pass_pikes_flavor:0 "#F 隘口长矛手是多恩人的后裔，他们守卫隘口抵御坦格利安家族的入侵长达一个多世纪。#!"
 storm_knights_flavor:0 "#F 风暴地骑士发起的冲锋如同他们家乡的风暴一样，震撼着大地和敌人。#!"
 winged_knights_flavor:0 "#F 作为维斯特洛境内安达尔文化的发源地，艾林谷的骑士传统可以追溯到几千年前。谷地骑士对步兵来说几乎是不可阻挡的。#!"
 sea_snakes_flavor:0 "#F 这些军团来自黑水湾的岛屿，他们早已适应了海上作战的混乱无序，他们的迅捷与勇猛使得无论是追击还是撤退都能游刃有余。#!"
 wolfswood_hunters_flavor:0 "#F 广阔的狼林不仅栖息着野生动物，也栖息着以捕猎为生的人。在战场上，这些猎人将化身为狡猾的弓箭手。#!"
 bronze_raiders_flavor:0 "#F 来自瑟恩山谷崎岖的苔原上的青铜掠袭者是少数使用本土制造的金属武器的野人士兵。除了令人印象深刻的武器外，青铜掠袭者在战斗中也很可怕；他们是长城以北唯一的重装步兵。#!"
 sarsfield_horse_archers:0 "萨斯菲尔德弓箭手"
 sarsfield_horse_archers_flavor:0 "#F 这支精英骑射手装饰有萨斯菲尔德家族的纹章，他们会在领主的命令下任意驰骋战场。#!"
 weeping_guard_flavor:0 "#F 里斯的自由人认为佩戴武器盔甲与其身份不符，因此，他们将保卫城市的重任交给了哭泣守卫。这支重装奴隶部队手持异域武器，并将誓死保卫可爱的里斯。#!"
 myrish_crossbows_flavor:0 "#F 尽管外界常将密尔人使用十字弩视为懦弱的表现，但这种武器在战场上易于操作且威力巨大，光这点就足以打消这种偏见。#!"
 holy_guard_flavor:0 "#F 大胡子僧侣的奴隶兵团——圣卫，是一支令人生畏的队伍。他们自幼受训，挥舞巨斧为诺佛斯的僧侣与总督效命。#!"
 indentured_legion_flavor:0 "#F 潘托斯的“散兵军团”虽名为契约军团，但实际与一般奴隶兵团无异。军团中的士兵毫无斗志可言，他们服役只是因为别无选择。#!"
 cohort_of_the_three_thousand_flavor:0 "#F 当科霍尔面临东方部落大军的威胁时，拯救他们的既非自由佣兵团，亦非本地征召兵，甚至连自由城邦的盟军都未能施以援手。是三千名阿斯塔波的奴隶士兵，那些无垢者们，连续十八次击退了马王们的攻势。自那以后，这三千勇士便始终守护着这座城市。#!"
 stepstone_sailors_flavor:0 "#F 自末日浩劫开始，直至长夜再次降临，石阶列岛的海盗一直是个大问题。#!"
 unsullied_flavor:0 "#F 阿斯塔波的奴隶军团——无垢者，是这座红城试图重现格拉兹旦与古帝国方阵军团的产物。#!"
 collared_bows_flavor:0 "#F 渊凯虽不以训练奴隶作战闻名，但即便如此，那里的奴隶仍被训练用弓箭守卫城市。#!"
 iron_legion_flavor:0 "#F 当阿斯塔波试图用奴隶重建方阵军团时，新吉斯谨遵格拉兹旦的教诲，任用与城邦休戚与共的自由民，铸造了忠诚而纪律严明的铁军团。#!"
 black_brothers:0 "黑衣兄弟"
 northern_spears:0 "铁木矛手"
 northern_spears_flavor:0 "#F 这些北境军队手持铁树枝干制作的长矛，对南方骑士造成很大的威胁。#!"
 dornish_crossbows:0 "多恩蝰矛手"
 dornish_crossbows_flavor:0 "#F 多恩蝰矛手配有带毒的弩箭，以高精准而闻名。#!"
 vale_heavy_infantry:0 "血门卫"
 vale_heavy_infantry_flavor:0 "#F 这些士兵以守卫血门，捍卫艾林谷而闻名。#!"
 crownlands_spears:0 "暮谷长矛手"
 crownlands_spears_flavor:0 "#F 这些长矛手熟悉黑水湾的土地，并以擅长在城市作战而闻名。#!"
 reach_light_cavalry:0 "青手先锋骑士"
 reach_light_cavalry_flavor:0 "#F 迅捷且轻盈，这支骑兵部队能比其他任何部队更快地驰骋整个河湾地，向敌人传达口谕或展开骚扰。#!"
 riverlands_light_infantry:0 "驳船卫"
 riverlands_light_infantry_flavor:0 "#F 这些驳船卫在三叉戟河及其无数支流上巡回护卫，是一支领主的迅捷步兵武装。#!"
 westerlands_knights:0 "雄狮骑士"
 westerlands_knights_flavor:0 "#F 勇猛且忠诚，这些西境的骑士有如狮子一般凶猛。#!"
 stormlands_heavy_infantry:0 "鹿角民"
 stormlands_heavy_infantry_flavor:0 "#F 这些士兵用寒铁武装全身，用饰有鹿角的头盔向敌人展示自己的怒火。#!"
 she_bears:0 "母熊军"
 battering_ram:0 "攻城锤"
 battering_ram_flavor:0 "#F 用来砸开敌人的大门和城墙的攻城锤！#!"
 westerosi_sellswords:0 "维斯特洛佣兵"
 westerosi_sellswords_flavor:0 "#F 许多维斯特洛的骑士在厄斯索斯的自由佣兵团中服役，他们不像维斯特洛的那些效忠领主的人那么忠诚，因为金钱永远比不上誓言。#!"
 she_bears_flavor:0 "#F 熊岛的女性比大陆上的更加粗犷坚强，她们能把铁民的头骨劈成两半。#!"
 ornate_helms:0 "亮盔团"
 ornate_helms_flavor:0 "#F 亮盔团是一支长矛部队，他们头戴花纹复杂的头盔，因在争议之地作战而闻名。#!"
 frog_spears:0 "三叉蛙矛手"
 goldcloaks:0 "金袍子"
 goldcloaks_flavor:0 "#F 君临城的守备部队，俗称金袍子，是一支不容小觑的力量。他们披着染成金色的羊毛斗篷，手持短矛、长棍，身着黑色锁子甲和手套，在王国的任何地方都能一眼认出他们。#!"
 sworn_brothers:0 "誓言兄弟"
 sworn_brothers_flavor:0 "#F 尽管誓言兄弟人数比过去有所减少，但其仍是一股不可忽视的力量，对长城外的野人来说尤为如此。#!"
 shadow_spears:0 "影子塔矛手"
 shadow_spears_flavor:0 "#F 影子塔矛手们一直守卫着头骨桥，只为在此处关键的咽喉要塞阻挡敌人，长久的守卫让他们对长矛的技艺日臻熟练。#!"
 eastwatch_sailors:0 "东海望水手"
 eastwatch_sailors_flavor:0 "#F 作为守夜人唯一的港口，东海望的兄弟们都是熟练的水手，日夜巡逻在颤抖海沿岸。#!"
 sea_watch:0 "海上警卫队"
 sea_watch_flavor:0 "#F 铁王座的海上警卫队是一支海上部队，其职责是守卫黑水湾及通往君临城的航道。走私者对他们闻风丧胆，毕竟一旦被捕便会立即处决。#!"
 redcloaks:0 "红袍子"
 redcloaks_flavor:0 "#F 兰尼斯港的城市守备队又称红袍子，这支部队以纪律严明且效率高超而闻名。得益于兰尼斯港的雄厚财力，他们装备精良，训练有素。#!"
 greycloaks:0 "鹅卵石守卫"
 greycloaks_flavor:0 "#F 旧镇的城市守备队又称鹅卵石守卫，是维斯特洛最古老的城市守备力量，以其职业素质和有序的组织度而闻名。#!"
 cailin_archers:0 "卡林湾射手"
 cailin_archers_flavor:0 "#F 卡林湾是通往北方的门户，它位于堤道的尽头，以颈泽作为天然屏障，在此驻扎一小支弓箭手就能轻松抵御任何来犯之敌，无论其重建与否。#!"
 frog_spears_flavor:0 "#F 这些轻装士兵使用猎蛙矛进行狩猎，对所有被其追踪的人来说他们都是噩梦。#!"
 black_brothers_flavor:0 "#F #!"
 anti_dragon:0 "#F [anti_dragon_maa|E]#!"
 scorpions:0 "蝎子弩"
 scorpions_flavor:0 "#F 一种大型的弩炮，足以穿透最厚重的盔甲。虽然蝎子弩在传统战争中表现平平，但在某一方面无可替代——击穿龙鳞。#!"
 dragons_flavor:0 "#F 龙是世界上最可怕的武器，一头成年巨龙能将整支军队烧成灰烬。面对龙，就等于面对死亡。#!"
 dragons_regiment:0 "#F [dragons_plural|E]#!"
 giant_regiment:0 "巨人"
 giant_regiment_flavor:0 "#F 传说中生活在远北之地的巨人一族，这群庞大生物当前正在为某个塞外部落而战。#!"
 sun_guard:0 "太阳守卫"
 sun_guard_flavor:0 "#F 失落的自由城邦爱萨利亚的守卫。如今城市重建复兴，阳光再度照耀在太阳守卫的金盾上。#!"
 moroshi_pikes:0 "摩洛西长矛手"
 moroshi_pikes_flavor:0 "#F 尽管是最小且常被遗忘的自由城邦，罗拉斯仍维持着一支精锐卫队，守护着他们在萨恩江口处的殖民地与盟友。当其他城邦花钱打发多斯拉克人时，罗拉斯人不得不以执起长枪尖矛以保卫摩洛西。#!"
 stair_guard:0 "阶梯守卫"
 stair_guard_flavor:0 "#F 常被大胡子僧侣的圣卫所忽视的诺佛斯城防军，其名源自连接诺佛斯上下城区的巨型阶梯——当地人称之为「罪人阶梯」。#!"
 disputant_scouts:0 "争议之地斥候"
 disputant_scouts_flavor:0 "#F 这片曾为瓦雷利亚自由堡垒粮仓的土地，如今被称为争议之地，乃是哈塔拉尔人的家园。他们惯于躲避三女儿王国的大军，因而斥候行动迅捷且悄无声息。#!"
 slave_legion:0 "奴隶军团"
 slave_legion_flavor:0 "#F 瓦雷利亚自由堡垒的伟业由血魔法与龙焰铸就，更建立在无数奴隶的脊梁之上。凡无龙骑士或血巫亲临之处，必有自由堡垒的奴隶军团横行。#!"
 tiger_cloaks:0 "虎袍军"
 tiger_cloaks_flavor:0 "#F 瓦兰提斯及其属地的守卫者——虎袍军，乃是一支奴隶军团，他们身披银色甲胄，手持锋利长矛，遵从执政官的命令。#!"
 black_wall_chariots:0 "黑墙战车"
 black_wall_chariots_flavor:0 "#F 瓦兰提斯的古老血脉自诩高人一等，他们一年一度在黑墙之上举办战车竞速以彰显荣耀，这不仅是场盛事，更是对他们致命的战争机器进行训练。#!"
 dragonsworn:0 "龙誓者"
 dragonsworn_flavor:0 "#F 彩绘山脉氏族是个凶蛮可怖的民族，他们之中最勇猛的战士更甚。其人自诩为龙神的冠军勇士，追捕任何敌人，并举起巨剑进行斩杀。#!"
 demon_guards:0 "恶魔守卫"
 demon_guards_flavor:0 "#F 玛塔里斯的人民同他们所栖息的土地一样，扭曲而注定毁灭。其守卫更是将这种骇人名声为己所用，戴着狰狞可怖的面具。#!"
 elyrian_sailors:0 "埃利亚水手"
 elyrian_sailors_flavor:0 "#F 埃利亚的水手们不仅纵横奴隶湾，更远航至外海诸域。他们常将奴隶湾诸城驯熟的奴隶运往里斯与瓦兰提斯，再载回未经驯化的生奴，如此循环往复。#!"
 tolosi_slingers:0 "脱罗斯投石者"
 tolosi_slingers_flavor:0 "#F 脱罗斯的投石手以夺命精准闻名厄斯索斯，相传他们能双石齐发击中巨龙双目，令这猛兽轰然坠地。#!"
 pit_fighters:0 "斗技士"
 pit_fighters_flavor:0 "#F 弥林的竞技场在古帝国的土地上声名远扬，从那里走出的斗士个个凶残暴戾。#!"
 lockstep_legion:0 "方阵军团"
 lockstep_legion_flavor:0 "#F 古吉斯帝国由「伟人」格拉兹旦及其方阵军团所建造，这支军队的严明纪律令吉斯在多次战争中足以威慑瓦雷利亚及其巨龙。#!"
 star_carved:0 "刻星者"
 star_carved_flavor:0 "#F 安达尔战士手持铁器奔赴战场，前额所刻的七芒星昭示其对「七位一体」的信仰。#!"
 qarlons_fallen:0 "科尔龙之陨"
 qarlons_fallen_flavor:0 "#F 「伟人」科尔隆——厄斯索斯的最后一位安达尔国王，曾率领部族征战横扫厄斯索斯北部。安达尔人至今还在使用他所教授的作战传统。#!"
 mother_sworn:0 "母亲之誓"
 mother_sworn_flavor:0 "#F 在洛恩河上谋生的人们，皆向母亲河立誓效忠，守护她，至死方休。#!"
 festival_guards:0 "节日守卫"
 festival_guards_flavor:0 "#F 查约恩以其遍布全城、终年不息的盛大节庆闻名于世，城中守卫身披锃亮钢甲，头戴高顶盔——这本身也成了一道景观。#!"
 flower_spears:0 "鲜花矛手"
 flower_spears_flavor:0 "#F 洛恩河东岸的白城以其鲜花闻名，由一支以长矛著称的卫队守护，他们的长矛上常装饰着花朵。#!"
 green_daggers:0 "绿匕首"
 green_daggers_flavor:0 "#F 位于琴恩河畔的阿·诺颐以其绿色大理石塔楼和城墙闻名。当地水手负责巡逻琴恩河与匕首湖，其名由此而来。#!"
 garden_guard:0 "花园守卫"
 garden_guard_flavor:0 "#F 位于母亲河出海口的伟大洛伊拿海港——萨霍伊，曾受到“花园守卫”的保护，其得名于该城著名的盐水花园。#!"
 grey_spears:0 "灰矛手"
 grey_spears_flavor:0 "#F 娜·萨星相比于其他洛伊拿人城邦，有着尤为深厚的尚武传统。正是「灰」加利斯亲王将长毛人逐出了娜恩河流域，城市卫队也因此得名于他。#!"
 market_guard:0 "市场守卫"
 market_guard_flavor:0 "#F 奴隶贸易为吉斯卡利诸城带来了巨量财富，其中以哈兹达恩·诺的收益最为丰厚。然而商人之间的竞争往往剑拔弩张，加之奴隶起义的威胁始终存在——正因如此，市场守卫应运而生。#!"
 skahazdahn_wardens:0 "斯卡札丹卫士"
 skahazdahn_wardens_flavor:0 "#F 斯卡札丹河将吉斯核心地带与大草原上的遥远前哨连接起来。从草原运来的奴隶必须经此送往奴隶湾接受训练或买卖，因此这条河道需要巡逻和保护。#!"
 dothraki_screamers:0 "多斯拉克咆哮者"
 dothraki_screamers_flavor:0 "#F 驰骋的多斯拉克咆哮武士不披盔甲，只带弯刀和骇人战吼。他们迅捷如风，凶狠如火，以无匹的狂暴扑向敌人。听到平原上传来他们的吼声，便知死亡正策马逼近。#!"
 fiery_hand:0 "拉赫洛圣火之手"
 fiery_hand_flavor:0 "#F 圣火之手是自由城邦中信仰光之王的奴隶士兵，专门执行瓦兰提斯至高牧师所传达的光之王旨意。#!"
 water_wizards:0 "水巫师"
 water_wizards_flavor:0 "#F 洛伊拿人因与伟大洛恩河的紧密联系而闻名，他们尊这条河为母亲。这种崇拜在水巫师身上体现得最为强烈，他们操纵着母亲河的身体，甚至杀死过巨龙。#!"
 chariot_cavalry:0 "#F [chariot_cavalry|E]#!"
 game_concept_chariot_cavalry:0 "战车"
 game_concept_chariot_cavalry_desc:0 "战车是一种强力的骑兵[men_at_arms|E]，能够[counters|E][heavy_cavalry|E]和[heavy_infantry|E]，但会被[spearmen|E]和弩手克制。"
 chariot_cavalry_damage_add:0 "[chariot_cavalry|E][damage|E]"
 chariot_cavalry_damage_mult:0 "#F $chariot_cavalry_damage_add$#!"
 chariot_cavalry_toughness_add:0 "[chariot_cavalry|E][toughness|E]"
 chariot_cavalry_toughness_mult:0 "#F $chariot_cavalry_toughness_add$#!"
 chariot_cavalry_pursuit_add:0 "[chariot_cavalry|E][pursuit|E]"
 chariot_cavalry_pursuit_mult:0 "#F $chariot_cavalry_pursuit_add$#!"
 chariot_cavalry_screen_add:0 "[chariot_cavalry|E][screen|E]"
 chariot_cavalry_screen_mult:0 "#F $chariot_cavalry_screen_add$#!"
 chariot_cavalry_maintenance_mult:0 "[chariot_cavalry|E]维护费"
 chariot_cavalry_recruitment_cost_mult:0 "[chariot_cavalry|E]招募花费"
 chariot_cavalry_max_size_add:1 "[chariot_cavalry|E][regiments|E]的最大规模"
 goldenheart_bowmen:0 "金心木弓手"
 goldenheart_bowmen_flavor:0 "#F 海盗和奴隶贩子都畏惧盛夏群岛和天鹅船，因为金心木弓手保护着那里——这些弓箭手的弓威力惊人，仅次于极其罕见的龙骨弓。#!"
 ruby_spearwomen:0 "红玉女战士"
 ruby_spearwomen_flavor:0 "#F 骸骨山脉的女战士令人畏惧，她们凶猛善战，惯用长矛，并以佩戴红玉和铁环而闻名。#!"
 ironborn_reavers:0 "铁种掠夺者"
 ironborn_reavers_flavor:0 "#F 这些可怕的重步兵是维斯特洛海岸线的祸害，对轻装步兵构成了严重的威胁。#!"
 marcher_longbowmen:0 "边疆地长弓手"
 marcher_longbowmen_flavor:0 "#F 这些战士继承了多恩边疆地的光荣传统，他们擅长使用强力的长弓扰乱移动缓慢的步兵编队。#!"
 nw_rangers:0 "游骑兵"
 nw_rangers_flavor:0 "#F 游骑兵作为守夜人的主要战力，其主要职责是巡视绝境长城，必要时会与野人作战。#!"
 nw_trackers:0 "追迹者"
 nw_trackers_flavor:0 "#F 偶尔会有守夜人被派往远方追踪重要目标或收集关键信息。尽管这支部队人数不多，却是少有的骑马部队。#!"
 wildling_cavalry:0 "自由民骑手"
 wildling_cavalry_flavor:0 "#F 野人不像下跪的人那样过分依赖骑兵，他们骑着一种小而耐寒的马种，在寒冷中依靠稀疏的牧草生存。#!"
 laamp_settler_maa:0 "开拓者"
 laamp_settler_maa_flavor:0 "#F 开拓者并不是真正的士兵，而是由那些寻求新开始的人拼凑起来的群体。他们在任何领地都随处可见，并且愿意加入任何拥有#V 开拓者训练#![building|E]的[adventurer|E]。#!"
 marsh_walkers:0 "沼泽行者"
 marsh_walkers_flavor:0 "#F 安达尔人征服蟹爪半岛失败不仅仅是因为其复杂的地形，还因为居住于其上的轻装战士。这些兵士坚持游击战术的传统，在抵抗入侵的过程中发挥了很大作用。#!"
 dragonguard:0 "龙卫"
 dragonguard_flavor:0 "#F 龙卫是一支装备精良的部队，效忠着坦格利安家族和其他狭海上的高等瓦雷利亚领主。#!"
 smiths_axes:0 "铁匠之斧"
 smiths_axes_flavor:0 "#F 目前尚不清楚“安达尔之斧”这个名字是来自他们使用的武器，还是武器的名字本就来自他们，但这些战士确实更喜欢使用巨斧而不是剑。#!"
 dothraki_archers:0 "多斯拉克弓手"
 dothraki_archers_flavor:0 "#F 和所有卡拉萨战士一样，多斯拉克弓手也是骑乘作战，他们的箭法精准得无可挑剔。无数军队、城邦与王国都曾毁在他们的箭下。#!"
 shepherds:0 "牧羊人"
 shepherds_flavor:0 "#F 正如牧羊人守卫羊群，这些男子也守护着拉札林人，使其免受外部世界的威胁。#!"
 tribute_guards:0 "贡品护卫"
 tribute_guards_flavor:0 "#F 大部分奥柏人的成功很大程度上取决于它所付出的贡品——既包括彼此之间付出的，也包括为应对外部威胁付出的——因此，这些贡品必须不惜一切代价加以维护。#!"
 caravan_guards:0 "商队护卫"
 caravan_guards_flavor:0 "#F 穿越大草海——即使是沿着有人定居的萨恩江流域——也绝非易事，商队必须严加防范，以应对潜在的袭击者。#!"
 cymmeri_iron_shirts:0 "西米利亚铁衫军"
 cymmeri_iron_shirts_flavor:0 "#F 以精通制造铁器和擅长打造锁子甲著称的西米利亚人，拥有比大草海绝大多数游牧民族都更好的防护。#!"
 gipp_wicker_shields:0 "吉普斯柳条盾士"
 gipp_wicker_shields_flavor:0 "#F 在大草原上，速度往往是最宝贵的财富。这些战士虽徒步作战，但凭借柳条盾牌，行动极为迅捷。#!"
 zoqora_chariots:0 "佐科拉战车"
 zoqora_chariots_flavor:0 "#F 佐科拉人以其大型战车著称，这些战车在大草海上疾驰，所向披靡。#!"
 lake_wardens:0 "湖泊守卫"
 lake_wardens_flavor:0 "#F 戈拉赞·费恩的湖泊守卫宣誓守护他们的城市和那片巨大的湖泊，这片湖泊是银海的遗存之一。#!"
 library_guard:0 "图书馆守卫"
 library_guard_flavor:0 "#F 塞洛西的图书馆守卫因其坚定不移的奉献精神而闻名，他们誓死捍卫着这座城市庞大而古老的知识宝库。#!"
 silver_shields:0 "银盾兵"
 silver_shields_flavor:0 "#F 「士兵之城」著名的银盾兵，被公认为全萨洛尔纪律最严明、作风最勤勉的战士。#!"
 clan_raiders:0 "氏族掠夺者"
 clan_raiders_flavor:0 "#F 那些被困在布兰登之墙以北的人，与温暖安适的土地隔绝，各氏族为了生存，不得不互相劫掠。#!"
 scythed_chariots:0 "镰刀战车"
 scythed_chariots_flavor:0 "#F 坦嘎赞·费恩，即萨洛尔的高人，继承了诸多古老的传统。他们保持着使用巨型镰刀战车的习俗，这些战车令整个大草原上的部族为之畏惧。#!"
 shining_cataphracts:0 "甲胄圣骑兵"
 shining_cataphracts_flavor:0 "#F 沙萨尔的甲胄圣骑兵在冲破敌阵时如同狂瀑冲碎岩石一般，迅速而猛烈。#!"
 coin_collectors:0 "钱币收集者"
 coin_collectors_flavor:0 "#F 在洛茨拉，金钱至上，负责收钱的人经常面临来自各方的危险，因此必须携带武器。#!"
 temple_guardians:0 "神庙守护者"
 temple_guardians_flavor:0 "#F 凯萨神庙的守护者们坚定不移地履行着他们神圣的职责，保卫着众神的殿堂。#!"
 hill_runners:0 "山丘行者"
 hill_runners_flavor:0 "#F 霍莫斯的山丘行者以其警惕而闻名，他们守护着这座城市及其周边领土。#!"
 firstborne:0 "长子军"
 firstborne_flavor:0 "#F 在塞利斯城，每一位长子公民都以在城墙上服役保卫城市为荣。#!"
 lastborne:0 "末裔军"
 lastborne_flavor:0 "#F 作为萨洛尔人的最后一座城池，塞阿斯的守卫者们自称为“末裔”，因为他们是古老传承的最后坚守者。#!"
 ar_archers:0 "强弓手"
 ar_archers_flavor:0 "#F 诺特罗斯人不仅在地理上夹在密尔与潘托斯之间，军事上也深受两国掣肘。虽然他们无法像密尔人那样大批量生产弩箭，却训练出了极为出色的弓箭手。#!"
 black_blood_cavalry:0 "黑血骑兵"
 black_blood_cavalry_flavor:0 "#F 随着铁民深入青绿之地肆意掠夺，他们再不能像群岛同族那样仰仗长船与掠夺者。如今在青绿之地，战马便是他们的长船，黑血骑兵便是他们的掠夺者。#!"
 sons_of_gendel:0 "詹德尔之子"
 sons_of_gendel_flavor:0 "#F 戈尼和詹德尔入侵北境失败之后，并非所有人都返回了地面。许多战士留在了地下，而其中最凶悍的那群战士，如今称自己为“詹德尔之子”。#!"
 fire_flingers:0 "掷火者"
 fire_flingers_flavor:0 "#F 生活在霜雪之牙，每一天都是与死亡的殊死搏斗，而火则是关键的武器。然而火不仅用来抵御严酷的环境，也用来攻击他人，并焚毁他们的营地。#!"
 cannibal_bows:0 "食人弓手"
 cannibal_bows_flavor:0 "#F 冰川氏族因其食人习性令整个极北之地闻风丧胆，他们的弓箭手擅长射伤猎物而不取其性命。#!"
 bat_catchers:0 "蝙蝠捕手"
 bat_catchers_flavor:0 "#F 夜行部的战士从小就在夜晚捕捉蝙蝠进行训练，学习如何悄无声息地快速移动，因而被其他部落称为“蝙蝠捕手“。#!"
 wildling_raiders:0 "野人掠夺者"
 wildling_raiders_flavor:0 "#F 长城之外，生活艰难，土地寒冷。为了生存下去，人们相互掠夺食物、武器，甚至妻子。对野人而言，掠夺即是生存。#!"
 ice_skatters:0 "冰上滑行者"
 ice_skatters_flavor:0 "#F 在极北之地，鬼影森林之外，巨大的冰封湖面上，人们在辽阔的冰盖上交战。据说他们的脚上绑着金属或骨头制成的刀刃，从而在冰面上疾驰如飞。#!"
 cairn_wardens:0 "石冢守卫"
 cairn_wardens_flavor:0 "#F 塞外的野人鲜有共识，但对乳河河谷间那些安葬着先王与英雄的石冢，他们却怀着共同的敬仰。若有谁胆敢亵渎逝者，石冢守卫必将严惩不贷。#!"
 civic_guard:0 "城市防卫军"
 civic_guard_flavor:0 "#F 魁尔斯的王族不像其他地区的蛮族那样骑马。他们骑乘骆驼——这优越得多的坐骑。自他们来到这片土地以来，这一传统便保障着他们对众城之女王的守护与统治。#!"
 pale_cavalry:0 "苍白骑兵"
 pale_cavalry_flavor:0 "#F 古魁尔斯人来自北方的平原。与那片土地上的诸多民族一样，他们以精湛的骑术闻名，而古魁尔斯人尤为珍视萨比诺马。#!"
 gate_sailors:0 "玉门水手"
 gate_sailors_flavor:0 "#F 魁尔岛坐落于玉海之门内侧，常作为魁尔斯控制该门户的防御要塞。#!"
 port_guard:0 "港口守卫"
 port_guard_flavor:0 "#F 伊班人受到大海的召唤，因而他们的重要聚居地往往是大小港口，这使得港口守卫成了他们最接近职业军人的存在。#!"
 mountain_spears:0 "山地之矛"
 mountain_spears_flavor:0 "#F 那些迁徙到内陆的伊班人，要应对的更多是熊祸而非人祸；手持长矛，便足以能使这些危险保持在一定距离之外。#!"
 sar_wardens:0 "萨城看守"
 sar_wardens_flavor:0 "#F 从最初的罪犯流放地起步，伊班·萨逐渐发展壮大，而它的守卫者们至今仍自称为“看守”。#!"
 bronze_cavalry:0 "青铜骑兵"
 bronze_cavalry_flavor:0 "#F 昔日先民凭借着骏马和青铜兵器征服了日落之地——如今，他们照样能征服这片土地。#!"
 patriarchal_guard:0 "上父卫队"
 patriarchal_guard_flavor:0 "#F 上父们承载着最后的英雄血脉；救世主将从他们中归来，因此必须守护他们以确保这一血脉延续。#!"
 stone_shields:0 "石之盾"
 stone_shields_flavor:0 "#F 骸骨山脉的生存本就无比艰难，而那些栖身于石之路上的人们，正用坚不可摧的巨盾抵挡着来自东西两面的重重威胁。#!"
 sand_couriers:0 "沙尘信使"
 sand_couriers_flavor:0 "#F 在绵长的沙之路沿途，巴亚撒布哈德人扮演着远东与厄斯索斯其他地区之间中间人的角色。他们的信使无畏一切艰险，无论是恶劣的天气、野兽，还是心怀歹意的敌人。#!"
 asa_scouts:0 "阿萨斥候"
 asa_scouts_flavor:0 "#F 阿萨伯哈德的武士以其迅捷无声的斥候闻名，传说中，无论是崎岖山岭还是密林深处，他们都能如履平地，行动自如。#!"
 pearl_phoenixes:0 "珍珠凤卫"
 pearl_phoenixes_flavor:0 "#F 正如凤凰之火会焚尽不洁不敬之人，这些士兵的方镞箭会找到一切意图加害君主之人。#!"
 jade_dragons:0 "翡翠龙卫"
 jade_dragons_flavor:0 "#F 在海绿朝的统治下，翡翠族的水手称霸着玉海及更遥远的地方。据说他们的船队受到了水龙的庇佑。#!"
 tourmaline_tortoises:0 "碧玺龟卫"
 tourmaline_tortoises_flavor:0 "#F 碧玺族长久以来饱受来自东边阴影之地的劫掠侵袭。他们的战士效仿巨龟，身披厚重铠甲，将那些阴影之民尽数击退。#!"
 onyx_crows:0 "黑瑙鸦卫"
 onyx_crows_flavor:0 "#F 黑瑙族驻守在夷地北部的鸠格斯奈平原边境，以手中长矛和钢铁般的意志誓死捍卫黄金天朝。#!"
 topaz_tigers:0 "黄玉虎卫"
 topaz_tigers_flavor:0 "#F 中部丛林是众多掠食者的栖息地，其中最令人忌惮的，莫过于在林间潜行觅食的猛虎。但黄玉族的弓箭手同样危险——他们是黄玉虎卫，其凌厉攻势如同猛虎的爪撕齿咬般致命。#!"
 opal_cranes:0 "奥宝鹤卫"
 opal_cranes_flavor:0 "#F 在夷地的中原平原上，速度决定了战争与贸易的成败。因此，奥宝族战斗时迅捷如云天鹤群。#!"
 depth_killers:0 "深渊杀手"
 depth_killers_flavor:0 "#F 雷岛人已精通游击之道，将黄金天朝驱逐出了他们的土地。据说任何被俘的敌人都会消失在岛屿的深处。#!"
 jade_sailors:0 "玉海水手"
 jade_sailors_flavor:0 "#F 玉海上的生活充满机遇，但总有人企图掠夺而非创造。因此，正直的水手们都武装自己以求自保。#!"
 poison_stings:0 "毒刺者"
 poison_stings_flavor:0 "#F 即使在玉海的群岛天堂中也潜藏着危险。往往最美丽的昆虫，蛰刺最为致命。#!"
 crescent_blades:0 "新月之刃"
 crescent_blades_flavor:0 "#F 即便是天堂岛上也需要守卫。其中最强大的当属新月之刃，因他们挥舞的弯月形刀刃而得名。#!"
 moraqi_elephants:0 "莫拉克战象"
 moraqi_elephants_flavor:0 "#F 莫拉克的大象声名远扬，常被作为礼物和贡品进献。但其中最大最强壮的象群从不离开大莫拉克岛，而是留在莫拉克人的军队中，成为一股强大而可怕的力量。#!"
 shans_herd:0 "掸王牧群"
 shans_herd_flavor:0 "#F 在象岛，掸王居住于象牙宫殿，受到世界上最大最凶猛的战象的守护。#!"
 blue_eyes:0 "蓝眼者"
 blue_eyes_flavor:0 "#F 瓦哈尔中最危险的是那些拥有蓝眼睛的人，他们经受过严酷的训练。#!"
 stone_ranchers:0 "石牧者"
 stone_ranchers_flavor:0 "#F 正如牧主和农人守护他们的牲畜，石牧者同样守护着石牛及其牧群——法罗斯人。#!"
 ash_wardens:0 "灰烬守卫"
 ash_wardens_flavor:0 "#F 灰烬河是亚夏的毒水动脉，阴影中的威胁有时会沿着河水而来。灰烬守卫必须迅速应对。#!"
 shadow_raiders:0 "阴影掠夺者"
 shadow_raiders_flavor:0 "#F 据说在阴影之下生活比任何地方都更加艰难。居住在那里的人们以劫掠邻近地区为生，无论阴影内外。#!"
 lions_of_night:0 "夜狮民"
 lions_of_night_flavor:0 "#F 在人类背叛天庭后，夜狮释放他的恶魔降临在人间诸界，其中最强大的一个化身为巨狮。因此，如今五垒之外的人们穿着以这种形象打造的铠甲。#!"
 vassals_in_yellow:0 "黄衣仆臣"
 vassals_in_yellow_flavor:0 "#F 即便在五垒之外，卡科萨也显得格格不入，陌生而阴暗。它的居民忠于他们的黄帝，手中的长矛威胁着周围的一切。#!"
 dream_questors:0 "梦境探寻者"
 dream_questors_flavor:0 "#F 据说在遥远的卡达什，真正的伟大只存在于梦境中，且往往与疯狂相伴。这些追随诡异低语的人，如今已成为无所畏惧的战士。#!"
 drainers:0 "汲血者"
 drainers_flavor:0 "#F 在五垒之外，无血人的土地令整个世界都感到恐惧。据说任何胆敢踏足此地之人，终将被吸干所有血液。#!"
 waste_raiders:0 "荒原掠夺者"
 waste_raiders_flavor:0 "#F 五堡之外，灰色荒原是一片荒凉而危险的地方。为了生存，劫掠必须不分友敌地进行下去。#!"
 wind_demons:0 "风之恶魔"
 wind_demons_flavor:0 "#F 据说五堡之外的人都怪异可怖，尤其是翼人。想必，这些故事只是对他们骑术的迅捷和技巧的比喻吧。#!"
 venom_bites:0 "剧毒之牙"
 venom_bites_flavor:0 "#F 来自五垒之外的伯劳鸟攻击迅捷且带有毒液，就像毒蛇的咬击一样。#!"
 knights_of_the_dragon:0 "龙骑士团"
 knights_of_the_dragon_flavor:0 "#F 随着瓦雷利亚人逐渐接纳维斯特洛的习俗，他们中最伟大的战士也接受了骑士传统。这些骑士身披骇人的板甲，甲胄上饰有龙纹，在战场上是一股令人畏惧的力量。#!"
 rain_bringers:0 "雨季弩士"
 rain_bringers_flavor:0 "#F 在某些人看来，弩是一种不光彩的武器，但在战场上或其他地方西境人使用弩却毫无顾忌。#!"
 purple_marines:0 "紫水手"
 purple_marines_flavor:0 "#F 布拉佛斯是自由贸易城邦中第二强大的势力，其力量的核心在于海军。那些用潟湖蜗牛染就的紫色船帆，载着城邦的海军将士横渡重洋。#!"
 shrikes:0 "伯劳鸟信众"
 shrikes_flavor:0 "#F 淹神的牧师们已拿起武器，要将异端和渎神者逐出群岛，正如曾经的伯劳鸟对抗哈穆德三世那样。#!"
 poorfellow_skirmishers:0 "星辰武士团"
 poorfellow_skirmishers_flavor:0 "#F 这些男女已将自己奉献于穷人集会。#!"
 warriors_sons_heavy_infantry:0 "圣剑骑士团"
 warriors_sons_heavy_infantry_flavor:0 "#F 这些高贵而勇武的战士之子成员选择步行作战。#!"
 warriors_sons_heavy_cav:0 "圣剑骑士团"
 warriors_sons_heavy_cav_flavor:0 "#F 这些高贵而勇武的战士之子成员选择骑马作战。#!"
 grey_wolves:0 "灰狼军"
 grey_wolves_flavor:0 "#F 随着狼灵王堡重建，众多英勇战士前来继承「灰狼」嘉文的名号，延续狼灵王的遗产。#!"
 hammers_of_justice:0 "正义之锤"
 hammers_of_justice_flavor:0 "#F 随着荒石城重建，众多英勇战士前来继承特里斯蒂芬·穆德的名号，延续河流王的遗产。#!"
 morne_guardians:0 "完美骑士团"
 morne_guardians_flavor:0 "#F 随着摩恩重建，众多英勇战士前来继承加勒敦爵士的名号，延续完美骑士的遗产。#!"
 dust_devils:0 "沙中恶魔"
 dust_devils_flavor:0 "#F 随着狱门厅重建，众多英勇战士前来继承路西法·旱地的名号，延续硫磺王的遗产。#!"
 head_collectors:0 "拾颅者"
 head_collectors_flavor:0 "#F 随着轻语堡重建，众多英勇战士前来继承克莱伦斯·克莱勃的名号，延续野牛骑士的遗产。#!"
 cruel_chains:0 "残酷之链"
 cruel_chains_flavor:0 "#F 随着霍尔堡重建，众多英勇战士前来继承科瑞·霍尔的名号，延续残酷至高王的遗产。#!"
 bloody_blades:0 "血刃卫"
 bloody_blades_flavor:0 "#F 随着血堡重建，众多英勇战士前来继承「血刃」布兰登的名号，延续血刃的遗产。#!"
 sharp_claws:0 "红狮利爪"
 sharp_claws_flavor:0 "#F 随着卡斯特梅重建，众多英勇战士前来继承罗杰·雷耶斯的名号，延续红狮的遗产。#!"
 ursulas_screams:0 "娥苏拉尖叫者"
 ursulas_screams_flavor:0 "#F 随着美人鱼堡重建，众多英勇战士前来继承娥苏拉·厄利夫的名号，延续美人鱼新娘的遗产。#!"
 pirate_archers:0 "艏楼弓手"
 pirate_archers_flavor:0 "#F 安排到艏楼的瞭望员都携带了弓箭，他们会最先杀伤敌人。#!"
 pirate_pikemen:0 "长钩手"
 pirate_pikemen_flavor:0 "#F 长钩原本用于钩住敌船，本身也是一件绝佳的武器，尤其克制马背上的对手。#!"
 pirate_skirmishers:0 "黑弯刀手"
 pirate_skirmishers_flavor:0 "#F 这些海盗身着黑衣，手持弯刀，他们会砍倒任何挡在劫掠路上的敌人。#!"
 archers_pursuit_mult:0 "#F $archers_pursuit_add$#!"
 dogsled_chariots:0 "狗拉雪橇战车"
 dogsled_chariots_flavor:0 "#F 在冰封海岸，正如东方人使用战车一般，部落的战士使用狗拉的雪橇。在冰面与雪山之间，再没有比这更大的威胁。#!"
 black_soles:0 "黑脚板"
 black_soles_flavor:0 "#F 硬足民因赤足行走在塞外而闻名。他们的脚因冻伤而变黑，硬化成强壮、冷酷、不屈的战士。#!"
 shrouded_guard:0 "遮面卫队"
 shrouded_guard_flavor:0 "#F 伤心领的石民在洛恩河上下令人闻风丧胆，因为被他们触碰意味着死刑。#!"
 bone_collectors:0 "拾骨者"
 bone_collectors_flavor:0 "#F 骸骨山脉的三座要塞城市都面临着持续的威胁，但北方的卡亚卡亚纳亚人所处的骨之路才是最危险的地方。但他们的战士迎击所有来敌，并拾起敌人的骨头来加固城墙。#!"
 toll_collectors:0 "劫路团"
 toll_collectors_flavor:0 "#F 绿叉河自古就是抵御北方和东方威胁的关键防线。不过就算有这些威胁在，只要守住那几个渡口，向过路的人收税，照样能赚到钱。#!"
 knights_of_the_fool:0 "傻子骑士"
 knights_of_the_fool_flavor:0 "#F 最伟大的爱情故事属于佛罗理安与琼琪，这些骑士致力于效仿佛罗理安的典范。#!"
 ironbreakers:0 "碎铁者"
 ironbreakers_flavor:0 "#F 长久以来，铁民一直是那些居住在雄鹰角和海湾沿岸的河间地人的祸患。他们如今已习惯于像铁民劫掠者一样全副武装展开迎击。#!"
 warlord_scouts:0 "军阀斥候"
 warlord_scouts_flavor:0 "#F 居住在黑水河上游及其支流的河间地人，其领地宣称可追溯到古代安达尔人的征服时期。各路军阀定居于此，他们使用斥候的做法也一直延续至今。#!"
 willow_spears:0 "柳木矛手"
 willow_spears_flavor:0 "#F 绿叉河以东，河间地人长期以来一直面临着来自明月山脉的威胁。无论是面对野人部落还是谷地骑士，长矛都已被证明是经得起时间考验的武器。#!"
 green_fishers:0 "绿渔夫"
 green_fishers_flavor:0 "#F 尽管千面屿受到绿先知的守护，但神眼湖向所有人开放。河间地人定期在其水域捕鱼，并时刻警惕来自黑水河的威胁。#!"
 sapphire_scouts:0 "蓝宝石斥候"
 sapphire_scouts_flavor:0 "#F 蓝宝石之岛的居民自称是古代安达尔人的后裔，他们为战士配备坐骑，但为了海上运输而放弃了重甲。#!"
 kingswood_spears:0 "御林长矛手"
 kingswood_spears_flavor:0 "#F 御林占据了风暴地北部的大片地区，那里高耸的树木既能提供庇护，也出产丰富的木材，可用于制作结实笔直的长矛。#!"
 abulu_spears:0 "阿布鲁矛手"
 abulu_spears_flavor:0 "#F 当娜梅莉亚离开盛夏群岛时，并非所有洛伊拿人都随她而去，留下的人发现，他们长矛用法与盛夏群岛人的战斗风格颇为契合。#!"
 weeping_sailors:0 "哭泣水手"
 weeping_sailors_flavor:0 "#F 风怒角与雨林名副其实，席卷半岛的风暴凶猛而强劲。许多水手因此葬身大海，他们参加的葬礼如此之多，以至于人们说他们终日都在哭泣。#!"
 milk_eye_archers:0 "乳眼弓手"
 milk_eye_archers_flavor:0 "#F 马赛岬的居民自古便历经动荡，常与风暴地的同胞同室操戈。他们练就了一手好箭法，尤其在海上作战时更是箭术精湛。#!"
 vulture_killers:0 "秃鹰杀手"
 vulture_killers_flavor:0 "#F 边疆地人世世代代与赤红山脉另一侧的敌人作战。那些秃鹫一直侵扰着多恩边疆的土地与人民，他们唯一应得的下场，便是葬身刀剑之下。#!"
 feathered_blades:0 "羽翎剑士"
 feathered_blades_flavor:0 "#F 风暴地的边疆地人向来以剑士和卫兵所饰的羽翎而闻名。#!"
 hunters_of_the_horn:0 "号角猎人"
 hunters_of_the_horn_flavor:0 "#F 河湾地的边疆地人向来以猎术闻名。尽管他们舍弃了弓箭，改用刀剑与锁甲，但在追猎之中，其狠辣却丝毫不减。#!"
 fair_isle_seamen:0 "仙女岛水手"
 fair_isle_seamen_flavor:0 "#F 仙女岛的人们长久以来不仅与大海抗争，也与在其水域中出没的铁民作战。这些水手往往更看重速度而非蛮力，以此保卫自己的家园。#!"
 silver_scouts:0 "银斥候"
 silver_scouts_flavor:0 "#F 青绿边疆的西境人常常充当抵御南方河湾地的屏障，他们在对敌侦察方面早就练得炉火纯青。#!"
 ash_spears:0 "岑木矛手"
 ash_spears_flavor:0 "#F 在西境的高地上，树木高大挺拔，其中岑树因其木质坚韧而尤为珍贵。以岑木制成的长矛坚韧可靠，因此深受西境人的青睐。#!"