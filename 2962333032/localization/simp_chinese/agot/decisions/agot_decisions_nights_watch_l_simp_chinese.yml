l_simp_chinese:
 restore_the_nights_watch:0 "重组守夜人军团"
 restore_the_nights_watch_desc:0 "守夜人军团被摧毁后，我们的城堡和人民一直受到潜伏在遥远北方的野蛮人和不敬生物的威胁。我们必须重组守夜人军团，让北方恢复秩序，让妇女儿童晚上能安然入睡。"
 restore_the_nights_watch_tooltip:0 "我们必须重组守夜人军团，让北方恢复秩序，让妇女儿童晚上能安然入睡。"
 restore_the_nights_watch.tooltip.1:0 "我们将选出一位新的总司令，负责守卫和管理长城。"
 restore_the_nights_watch.tooltip.2:0 "#N 你将会失去绝境长城的领地！#!"
 restore_the_nights_watch_confirm:0 "为了王国！"
 dissolve_the_nights_watch:0 "解散守夜人军团"
 dissolve_the_nights_watch_desc:0 "我们的人民已经被长城上的守夜人威胁太久了！我们已经控制了长城，现在是时候终结黑乌鸦的兄弟情谊，夺回人民被剥夺了几千年的自由与和平了。"
 dissolve_the_nights_watch_tooltip:0 "守夜人的管制结束了。"
 dissolve_the_nights_watch_confirm:0 "为了人民！"
 rebuild_nights_watch_fort:0 "在长城上重建堡垒"
 rebuild_nights_watch_fort_desc:0 "几个世纪以来，守夜人的古老秩序每况愈下。这使得长城沿线的无数堡垒屈服于时间的摧残。鉴于守夜人最近的财务状况有所好转，大多数弟兄认为是时候重建失去的东西了。"
 rebuild_nights_watch_fort_tooltip:0 "修复长城沿线的堡垒。"
 rebuild_nights_watch_fort_confirm:0 "传唤首席工匠！"
 desert_the_nw:0 "$game_concept_agot_desert_nw$"
 desert_the_nw_desc:0 "绝境长城向来索取的多，赐予的少。背弃守夜人军团，便是背弃我的誓言、我的弟兄，以及职责带来的安宁。但自由就在长城之外，我已触手可及。"
 desert_the_nw_tooltip:0 "你将背誓[nw_govt|E]"
 desert_the_nw_confirm:0 "背誓守夜人"
 reclaim_brandons_gift_decision:0 "夺回布兰登的馈赠"
 reclaim_brandons_gift_decision_desc:0 "布兰登的馈赠过去向来臣服于北境而非守夜人。现在是时候收复这片本就属于我们的领地了，任命新领主，整治这片被守夜人荒废的土地。"
 reclaim_brandons_gift_decision_tooltip:0 "夺回布兰登的馈赠"
 reclaim_gift_decision.requirements:0 "以下条件满足其一即可：\n$EFFECT_LIST_BULLET$你已与守夜人缔结同盟\n$EFFECT_LIST_BULLET$你拥有[GetPerk('diplomat_perk').GetName( GetNullCharacter )]特质\n$EFFECT_LIST_BULLET$守夜人总司令对你的好感度达到100"
 reclaim_brandons_gift_decision_confirm:0 "$reclaim_brandons_gift_decision_tooltip$"
 reclaim_gift_decision:0 "夺回新赠地"
 reclaim_gift_decision_desc:0 "新赠地过去向来臣服于北境而非守夜人。现在是时候收复这片本就属于我们的领地了，任命新领主，整治这片被守夜人荒废的土地。"
 reclaim_gift_decision_tooltip:0 "夺回新赠地"
 reclaim_gift_decision_confirm:0 "$reclaim_gift_decision_tooltip$"
 reclaim_gift_decision_desc_effect:0 "[GetTitleByKey('k_the_wall').GetHolder.GetName]将收到一份提议，要求将[GetTitleByKey('d_new_gift').GetNameNoTier]交还北境。"
 reclaim_brandons_gift_decision_desc_effect:0 "[GetTitleByKey('k_the_wall').GetHolder.GetName]将收到一份提议，要求将[GetTitleByKey('d_brandons_gift').GetNameNoTier]交还北境。"
 reclaim_gift_decision_desc_use_hook_tt:0 "你将使用对你的[top_liege|E]的[hook|e]。"
 agot_nights_watch.3000.t:0 "新赠地"
 agot_nights_watch.3000.desc:0 "[winterfell_petitioner.GetName]请求我们将新赠地归还北境，作为交换，对方愿支付一笔重金。我们将在当地册封四位新领主，这些领主需效忠于北境，守夜人数代对这片土地的掌控也将就此终结。"
 agot_nights_watch.3000.desc_brandons_gift:0 "[winterfell_petitioner.GetName]请求我们将布兰登的馈赠归还北境，作为交换，对方愿支付一笔重金。我们将在当地册封三位新领主，这些领主需效忠于北境，守夜人数代对这片土地的掌控也将就此终结。"
 agot_nights_watch.3000.a:0 "我同意，北境可以拿回自己的土地。"
 agot_nights_watch.3000.b:0 "我拒绝，这片土地属于守夜人。"
 agot_nights_watch.3001.t:0 "赠地：请求获批准"
 agot_nights_watch.3001.desc:0 "[nw_lc.GetName]已同意将赠地交还北境治下。\n\n现在我们要任命新的领主前往该地区的各个伯爵领进行治理。"
 agot_nights_watch.3001.a:0 "我会亲自挑选新长官。"
 agot_nights_watch.3001.b:0 "领地授予任何人都行。"
 agot_nights_watch.3003.t:0 "新赠地的长官"
 agot_nights_watch.3003.desc:0 "是时候为[new_gift_county_to_give_away.GetNameNoTier]选择一位长官了。"
 agot_nights_watch.3003.a:0 "这个人很合适。"
 agot_nights_watch.3003.b:0 "实际上，头衔随便给谁都行。"
 nw_proposal_rejected:0 "提议被拒"
 agot_nights_watch.3004.t:0 "夺回赠地"
 agot_nights_watch.3004.desc:0 "在守夜人多年管辖之后，新赠地已重归北境。[winterfell_petitioner.GetName]任命了以下领主来驻守这片土地：\n\n$BULLET$[GetTitleByKey('c_norlinton').GetNameNoTier]的[norlinton_holder.GetFirstName]·[norlinton_holder.GetHouse.GetName]\n$BULLET$[GetTitleByKey('c_boreharrow').GetNameNoTier]的[boreharrow_holder.GetFirstName]·[boreharrow_holder.GetHouse.GetName]\n$BULLET$[GetTitleByKey('c_whitecross').GetNameNoTier]的[whitecross_holder.GetFirstName]·[whitecross_holder.GetHouse.GetName]\n$BULLET$[GetTitleByKey('c_giantsbeard').GetNameNoTier]的[giantsbeard_holder.GetFirstName]·[giantsbeard_holder.GetHouse.GetName]"
 agot_nights_watch.3004.desc_brandons_gift:0 "在守夜人多年管辖之后，布兰登的馈赠已重归北境。[winterfell_petitioner.GetName]任命了以下领主来驻守这片土地：\n\n$BULLET$[GetTitleByKey('c_weatherback_ridge').GetNameNoTier]的[weatherback_ridge_holder.GetFirstName]·[weatherback_ridge_holder.GetHouse.GetName]\n$BULLET$[GetTitleByKey('c_moles_town').GetNameNoTier]的[moles_town_holder.GetFirstName]·[moles_town_holder.GetHouse.GetName]\n$BULLET$[GetTitleByKey('c_hoarburn').GetNameNoTier]的[hoarburn_holder.GetFirstName]·[hoarburn_holder.GetHouse.GetName]"
 agot_nights_watch.3004.a:0 "我做的这些事能让北境的后人都沾光。"
 agot_nights_watch.holding_conversion_tt:0 "[new_gift_county_to_give_away.GetNameNoTier]将转变为[castle_holding|E]"
 agot_nights_watch.new_capital_tt:0 "[new_capital.GetName]将成为[new_gift_county_to_give_away.GetNameNoTier]的首都。"
 donate_land_to_nw_decision_desc:0 "我们手中掌控着部分守夜人的历史领地，把这些土地交还他们或许能增强其实力。"
 donate_land_to_nw_decision_tooltip:0 "归还土地！"
 donate_land_to_nw_decision:0 "将历史中的土地归还给守夜人"
 donate_land_to_nw_decision_confirm:0 "归还土地！"
 brandons_gift_will_be_returned_to_nw_tt:0 "[GetTitleByKey('d_brandons_gift').GetName]下辖的所有伯爵领将授予[GetTitleByKey('k_the_wall').GetHolder.GetName]"
 new_gift_will_be_returned_to_nw_tt:0 "[GetTitleByKey('d_new_gift').GetName]下辖的所有伯爵领将授予[GetTitleByKey('k_the_wall').GetHolder.GetName]"
 agot_nights_watch.3005.t:0 "归还领地"
 agot_nights_watch.3005.desc:0 "虽然北境收复了新赠地，但他们现在慷慨地将土地归还给了守夜人。\n\n[GetTitleByKey('c_norlinton').GetNameNoTier]、[GetTitleByKey('c_boreharrow').GetNameNoTier]、[GetTitleByKey('c_whitecross').GetNameNoTier]和[GetTitleByKey('c_giantsbeard').GetNameNoTier]现在再次成为守夜人军团的财产！"
 agot_nights_watch.3005.desc_brandons_gift:0 "虽然北境收复了布兰登的馈赠，但他们现在慷慨地将土地归还给了守夜人。\n\n[GetTitleByKey('c_weatherback_ridge').GetNameNoTier]、[GetTitleByKey('c_moles_town').GetNameNoTier]和[GetTitleByKey('c_hoarburn').GetNameNoTier]现在再次成为守夜人军团的财产！"
 agot_nights_watch.3005.a:0 "我们不会拒绝这样的慷慨。"