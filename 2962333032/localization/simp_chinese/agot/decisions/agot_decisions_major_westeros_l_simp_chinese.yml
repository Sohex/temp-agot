l_simp_chinese:
 agot_proclaim_iron_throne:0 "宣称铁王座"
 agot_proclaim_iron_throne_tooltip:0 "该决议允许你将领地统一于铁王座之下。"
 agot_proclaim_iron_throne_desc:0 "铁王座始终是维斯特洛统一与权力的象征。随着王国的无数小领地归入我们麾下，是时候收集起战败者的断剑，为七大王国打造一座新的铁王座了。\n\n我是否具备宣称铁王座的实力、智谋与决心？[ROOT.Char.GetHouse.GetName]家族又是否有能力成为维斯特洛唯一真正的统治者？"
 agot_proclaim_iron_throne_confirm:0 "送出渡鸦"
 set_capital_kingslanding_decision:0 "收复君临城"
 set_capital_kingslanding_decision_tooltip:0 "收复君临作为你领地的首都。"
 set_capital_kingslanding_decision_desc:0 "君临城是铁王座的法定首都，因此理应为我所有。"
 set_capital_kingslanding_decision_confirm:0 "重建王国的真正宝座！"
 end_the_ironborn_decision:0 "终结铁种"
 end_the_ironborn_decision_desc:0 "几个世纪以来，铁群岛的狗杂种在维斯特洛乃至更远的地方强奸、掠夺。现在，我们必须对这些海盗采取行动，彻底粉碎他们的势力。我们必须对铁种发动一场毁灭性的战争，让铁国王再也无法坐上海石之位。"
 end_the_ironborn_decision_confirm_text_desc:0 "拿起武器！"
 end_the_ironborn_decision_tooltip:0 "铁种去死。"
 regrow_oakenseat_decision:0 "复苏橡树王座"
 regrow_oakenseat_decision_tooltip:0 "请一位技艺高超的园丁重新种植橡树王座。"
 regrow_oakenseat_decision_desc:0 "橡树王座，于「青手」加尔斯亲手栽种的橡树上雕刻出的古老王座，它在加尔斯·园丁十世统治时期被一位多恩国王摧毁，如今仅存在于传说之中。\n\n尽管复苏橡树王座绝非易事，但若能成功，它必将为我的家族在河湾地——乃至整个七大王国赢得巨大的名望、威信与影响力。"
 regrow_oakenseat_decision_confirm:0 "播下种子"
 regrow_oakenseat_excellent_aptitude:0 "你的$court_gardener_court_position$需要#V 极佳#!的称职度"
 agot_major_decisions_events.1001.t:0 "橡树王座重生"
 agot_major_decisions_events.1001.desc:0 "传说[greenhand.GetFullNameNicknamed]用自己的青手雕刻了最初的活橡树王座，[greenhand.GetHouse.GetName]国王们世世代代都在安坐于王座上。\n\n它的毁灭动摇了高庭的根基，也撕碎了高庭的心。\n\n终于，经过数十年的精心培育、修剪和繁育，曾经傲视诸国的橡树王座重新茁壮生长。无论远近，所有人都将知道我们闻名遐迩的[ROOT.Char.GetHouse.GetName]家族的荣耀。或许，我甚至可以自称是「青手」加尔斯本人的真正继承者……"
 agot_major_decisions_events.1001.a:0 "传奇再现！"
 ironborn_rebellion_decision:0 "反抗铁王座"
 ironborn_rebellion_decision_desc:0 "青绿之地的居民已经安寝多年。事实上，自从「黑心」赫伦死后，维斯特洛便不再发自内心地惧怕铁种，如今只剩少数劫掠者会时不时侵袭海岸，向他们付铁钱。铁王座上的国王换了一代又一代，我们是否忘记了，我们也有自己的王座，数百年前，我们也曾有自己的国王？\n\n其他人或许忘了，但我没有。我将解开束缚人民的枷锁；我将加冕为海盐王与磐岩王。安达尔人、洛伊拿人和先民将再一次感受到对铁民的恐惧为何物。"
 ironborn_rebellion_decision_tooltip:0 "哭泣吧，维斯特洛人，铁群岛将再度崛起！"
 ironborn_rebellion_decision_confirm_text_desc:0 "该付铁钱了！"
 defy_winter_lords_decision:0 "反抗北境领主"
 defy_winter_lords_decision_desc:0 "岩种清楚北境人的嘲笑，他们认为我们并不比野人文明。斯卡格斯曾经独立于北境领主的自由领地——它将再次如此。我们的力量将让[ROOT.Char.GetLiege.GetNameNicknamedRegnal]颤抖！"
 defy_winter_lords_decision_tooltip:0 "你将宣布独立，让斯卡格斯人再次回归大海。"
 defy_winter_lords_decision_confirm_text_desc:0 "北境将铭记对斯卡格斯的恐惧！"
 agot_minor_decisions_events.0001:0 "反抗北境领主"
 agot_minor_decisions_events.0001.desc:0 "许多岩种都梦想着斯卡格斯岛重获自由的那一天。布兰登·史塔克国王摧毁我们的力量后，他禁止我们出海。现在，当我们的船只靠近时，整个北境都将颤抖！"
 agot_minor_decisions_events.0001.a:0 "我们#bold 不再#!宣誓效忠。"
 agot_minor_decisions_events.0001.a_tt:0 "北境肯定不会对这种不忠行为无动于衷。你准备好打仗了吗？"
 agot_minor_decisions_events.0002:0 "独立的斯卡格斯岛"
 agot_minor_decisions_events.0002.desc:0 "岩种再次独立自主！海豹湾的人将会知晓我们的旗号。\n\n我已经把我的遗产刻入石头，所有岩种都将记住我的名字。"
 agot_minor_decisions_events.0002.a:0 "我的遗产将经受住时间的考验。"
 agot_minor_decisions_events.0002.a_tt:0 "斯卡格斯岛获得独立。"
 agot_adopt_kneeler_ways_decision:0 "遵循南方习俗"
 agot_adopt_kneeler_ways_decision_desc:0 "远北之地的严酷荒原上的生活，造就了我们的冷酷无情与坚韧不拔，这与长城另一边的习性截然不同。但既然我们已在他们的土地上安家落户，或许适应他们的生活方式、法律以及风俗习惯，也不失为一种明智的做法。"
 agot_adopt_kneeler_ways_decision_confirm:0 "时间让我们渐渐弯下膝盖"
 agot_adopt_kneeler_ways_decision_tooltip:0 "你的人民将遵循铁王座治下人民的生活方式，这将加强你们与长城以南的统治者之间的联系，但从此你们也将失去作为自由民的种种特权。"
 is_culture_head:0 "你是文化领袖"
 hybridized_with_kneelers:0 "你的文化是长城以南某个现存文化的融合文化"
 capital_south_of_the_wall:0 "你的首都位于长城以南"
 agot_major_decisions_events.1003.t:0 "另一边的世界……"
 agot_major_decisions_events.1003.desc:0 "我们世世代代都渴望着逃离长城以北的严酷生活，如今这一梦想终于实现。然而，如果我们继续固执己见，无视新邻居的法律和习俗，这种狂妄又如何让我们与之相处？\n\n长城以南的人可能胆怯懦弱、但他们的生活却安逸长久。他们显然真正明白如何充分利用好这片宜人沃土，如果他们正是借助现有法律习俗实现了这一点，那么我们也应该予以接纳。"
 agot_major_decisions_events.1003.a:0 "敬美好崭新的未来！"
 every_freefolk_ruler_tt:0 "所有自由民酋长"