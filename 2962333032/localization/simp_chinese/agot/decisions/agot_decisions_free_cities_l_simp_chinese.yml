 agot_form_undisputed_lands:0 "统一争议之地"
 agot_form_undisputed_lands_decision_desc:0 "自瓦雷利亚末日浩劫以来，这片土地一直被战火蹂躏，而我终于把它们统一在一起。"
 agot_form_undisputed_lands_decision_tooltip:0 "在这片曾经争议之地建立王国"
 agot_form_undisputed_lands_confirm:0 "敬恶行与不朽！"
 three_daughters_confederation:0 "三女儿联盟存在"
 agot_break_braavos_pentos_treaty:0 "撕毁布拉佛斯‑潘托斯协议"
 agot_break_braavos_pentos_treaty_desc:0 "自209年起，布拉佛斯人就强迫骄傲的潘托斯接受这份苛刻条约。如今，潘托斯是时候撕毁这份协议，自由地治理自己了！"
 agot_break_braavos_pentos_treaty_effect_tt:0 "布拉佛斯‑潘托斯协议将被废除。潘托斯能够再次#bold 发展军队，雇用佣兵，并参与奴隶贸易#!。"
 agot_break_braavos_pentos_treaty_effect_2_tt:0 "布拉佛斯将在#bold 15年#!内获得一个宣战理由，使其可以重申该协议。"
 agot_break_braavos_pentos_treaty_tooltip:0 "撕毁布拉佛斯‑潘托斯协议"
 agot_break_braavos_pentos_treaty_confirm:0 "潘托斯万岁！"
 agot_create_braavos_pentos_treaty_effect_tt:0 "[GetModifier('agot_pentos_braavos_treaty').GetNameWithTooltip]将被永久添加至潘托斯境内的所有角色。只有通过战争重新获得自由才能移除该修正。"
 agot_break_braavos_pentos_treaty_as_braavos:0 "$agot_break_braavos_pentos_treaty$"
 agot_break_braavos_pentos_treaty_as_braavos_desc:0 "我们一直遵守着209年签订的《布拉佛斯‑潘托斯协议》，尊重潘托斯的边界。但扩张的时机已经成熟——与征服土地相比，一纸协议又算得了什么？"
 agot_break_braavos_pentos_treaty_as_braavos_effect_tt:0 "你，以及任何布拉佛斯封臣，都将有权向潘托斯及其封臣宣战。"
 agot_break_braavos_pentos_treaty_as_braavos_confirm:0 "布拉佛斯万岁！"
 agot_braavos_pentos_treaty_is_active:0 "在[GetModifier('agot_pentos_braavos_treaty').GetNameWithTooltip]生效期间你无法宣战。"
 agot_break_braavos_pentos_treaty_as_braavos_tooltip:0 "$agot_break_braavos_pentos_treaty_tooltip$"
 agot_overthrow_bearded_priests:0 "推翻大胡子僧侣"
 agot_overthrow_bearded_priests_desc:0 "据说，诺佛斯真正的掌权者是那些“大胡子僧侣”，他们藏在幕后操控一切，而明面上的总督政府不过是处理日常杂务的摆设。现在，是时候从大胡子僧侣手里夺回这座城市的控制权了！"
