l_simp_chinese:
 agot_go_on_reaving_decision:0 "发动劫掠"
 agot_go_on_reaving_decision_opening_desc:0 "#F 付铁钱，组织一次伟大的劫掠，到狭海彼岸烧杀抢掠。铁民将从王国各地加入你的舰队，蹂躏番红花与丝绸之地！#!"
 reaving_effect_1:0 "你将选择一个适宜掠夺的目的地"
 reaving_effect_2:0 "劫掠越成功，你将获得越多的[piety|E]与[prestige|E]"
 reaving_effect_3:0 "你可能获得[GetTrait('viking').GetName( GetNullCharacter )]特质"
 agot_go_on_reaving_decision_tooltip:0 "一次大[reaving|E]将被召集。"
 agot_go_on_reaving_decision_confirm:0 "青绿之地的居民将会恐惧铁种！"
 agot_buy_diving_bell:0 "购买潜水钟"
 agot_buy_diving_bell_desc:0 "我将在船上安装潜水钟，以便我的家族能依照古老的藏宝图，探索沉入海底的残骸。"
 agot_buy_diving_bell_tooltip:0 "安装潜水钟"
 agot_buy_diving_bell_effect_tooltip:0 "解锁$agot_sailing_type_treasure$[GetActivityType('activity_agot_sailing').GetName][activity|E]"
 agot_buy_diving_bell_confirm_text_desc:0 "召集造船匠"
 agot_buy_ship:0 "购买一艘船"
 agot_buy_ship_desc:0 "大海为那些敢于航行的人提供财富、荣耀与冒险。一艘好船能很好地为我家族效力，将我的旗帜带往远方的海岸，在波涛上开启新的机会。现在我只需要决定，要委托建造哪种船。"
 agot_buy_ship_tooltip:0 "为家族委托建造一艘船"
 agot_buy_ship_effect_1_tooltip:0 "解锁$agot_sailing_type_raid$[GetActivityType('activity_agot_sailing').GetName]"
 agot_buy_ship_effect_2_tooltip:0 "解锁$agot_sailing_type_valyria$[GetActivityType('activity_agot_sailing').GetName]"
 agot_buy_ship_confirm_text_desc:0 "召集造船匠"
 agot_buy_ship_small_ship:0 "购买一艘$owns_small_ship$"
 agot_buy_ship_small_ship_desc:0 "一艘适中的船只，足以载着我的旗帜跨越重洋，又不至于掏空我的钱袋。"
 agot_buy_ship_small_ship_tooltip:0 "$agot_buy_ship_small_ship_desc$"
 agot_buy_ship_big_ship:0 "购买一艘$owns_big_ship$"
 agot_buy_ship_big_ship_desc:0 "一艘配得上显赫家族的宏伟船只，无论停泊何处，必会引来无数赞叹的目光。"
 agot_buy_ship_big_ship_tooltip:0 "$agot_buy_ship_big_ship_desc$"