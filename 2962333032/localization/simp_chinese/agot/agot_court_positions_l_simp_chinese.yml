 court_position_inquisitive_trait:0 "[GetTrait('inquisitive').GetName( ROOT.Char )]"
 admiral_court_position:0 "海军上将"
 admiral_court_position_desc:0 "$admiral_court_position$负责你的航海和海军事务，是你的[fleet|E]的统帅，同时监督军队[embark|E]。"
 admiral_fleet:0 "布散舰队"
 admiral_fleet_desc:0 "该角色正在布散领地的舰队，以巡逻更广阔的水域，并对沿海威胁做出快速反应。"
 admiral_maritime:0 "保护贸易"
 admiral_maritime_desc:0 "该角色负责保护海上贸易航线，并确保货物经你的港口稳定流通。"
 admiral_raid:0 "鼓励劫掠者"
 admiral_raid_desc:0 "该角色鼓励在海上采取积极行动，倾向于发动迅猛的袭击与掠夺，而非谨慎或克制。"
