 bloodrider_court_position:0 "血盟卫"
 bloodrider_court_position_desc:0 "$bloodrider_court_position$是立下血誓的护卫，是兄弟也是伙伴，发誓同生共死，并肩作战。这并不是一般的效忠关系，更像是牢不可破的灵魂纽带，直至首领离世。若其未能尽到守护职责，则应该先替首领复仇，然后追随一同死去，以便在来世重逢。"
 bloodrider_employer_custom_effect_description:0 "$BULLET$有概率阻止行刺[GetScheme('murder').GetTypeName][schemes|E]#!\n$BULLET$共同作战时，减少你在[battles|E]中死亡或被俘的风险#!\n$BULLET$将获得[GetTrait('loyal').GetName( GetNullCharacter )][trait|E]并成为你的[friend|E]（如果还不是的话）.\n$BULLET$将在你死后履行血誓自杀"
