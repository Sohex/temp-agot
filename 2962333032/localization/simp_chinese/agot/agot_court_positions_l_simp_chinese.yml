 court_position_reforge_vs:0 "知晓重铸瓦雷利亚钢的秘密"
 lorath_harvest_prince_court_position:0 "丰收亲王"
 lorath_harvest_prince_court_position_desc:0 "由罗拉斯群岛上拥有土地的人选出的丰收亲王，曾经负责统辖该城所有的土地管理事务。如今这只是一个仪式性的职位，亲王的职责是赞助群岛上所有的重大庆典。"
 lorath_fisher_prince_court_position:0 "渔民亲王"
 lorath_fisher_prince_court_position_desc:0 "由所有拥有船只的罗拉斯人选出来的渔民亲王，曾经负责指挥全城人民拥有的所有船只。如今这只是一个仪式性的职位，亲王的职责是为群岛上所有新造的船只主持下水仪式。"
 lorath_prince_of_streets_court_position:0 "街道亲王"
 lorath_prince_of_streets_court_position_desc:0 "由所有罗拉斯自由人选出的街道亲王，曾经负责监管司法行政和民众治理事务。如今这只是一个仪式性的职位，亲王的职责是组织城墙内所有的游行活动。"