 sea_watch_commander_court_position:0 "海上警卫队指挥官"
 sea_watch_commander_court_position_desc:0 "巡逻队的统领，负责守卫君临城周边黑水湾的海域，防线延伸至蟹爪半岛、御林海岸以及马赛岬。"
 royal_counter_court_position:0 "王家税吏"
 royal_counter_court_position_desc:0 "$royal_counter_court_position$负责管理王国的税收事务，确保所有应缴税款均妥善征收。"
 royal_scales_court_position:0 "王家天平"
 royal_scales_court_position_desc:0 "王室度量衡掌管官，$royal_scales_court_position$负责在整个王国内强制推行这些标准作为通行规范。"
 high_reeve_court_position:0 "大议长"
 high_reeve_court_position_desc:0 "$high_reeve_court_position$负责审理首都的所有轻罪案件，例如盗窃和扒窃。"
 justiciar_court_position:0 "裁判法官"
 justiciar_court_position_desc:0 "裁判法官由在位君主直接授予高级司法权。他们巡游王国各地，有权审理涉及地牢与绞刑架的案件，并以王室之名在需要之处伸张正义。此举可凭自身之剑施行，亦可借侍从之剑完成。"
 royal_mint_officer_court_position:0 "王家铸币厂主管"
 royal_mint_officer_court_position_desc:0 "王家铸币厂的官员，负责监督其所在城市的王室铸币厂，统筹钱币的铸造生产。"
 keeper_of_keys_court_position:0 "掌钥人"
 keeper_of_keys_court_position_desc:0 "$keeper_of_keys_court_position$负责掌管王室宅邸内特定门扉与箱柜的钥匙。其中一些钥匙对应的是王冠珠宝，另一些则能开启君主私人金库——无一不关系重大。"
 grey_cloaks_commander_court_position:0 "鹅卵石守卫指挥官"
 grey_cloaks_commander_court_position_desc:0 "$grey_cloaks_commander_court_position$统领着资金充足的旧镇城市守备队——鹅卵石守卫。"
 crimson_cloaks_commander_court_position:0 "红袍子指挥官"
 crimson_cloaks_commander_court_position_desc:0 "$crimson_cloaks_commander_court_position$统领着训练有素且资金充足的兰尼斯港城市守备队——红袍子。"
 white_knife_court_position:0 "白刃河守卫"
 white_knife_court_position_desc:0 "$white_knife_court_position$负责守卫白刃河在咬人湾的入海口。"
 stone_way_court_position:0 "石路守护"
 stone_way_court_position_desc:0 "$stone_way_court_position$这一职位授予俗称“骨路”要道的主要守护者。在防御石路期间，此职位的拥有者享有凌驾于所有其他封臣之上的军事优先权。"
 princes_pass_court_position:0 "亲王隘口守护"
 princes_pass_court_position_desc:0 "$princes_pass_court_position$这一职位授予历史上所称“大山口”要道的主要守护者。在防御亲王隘口期间，此职位的拥有者享有凌驾于所有其他封臣之上的军事优先权。"
 employee_is_not_your_spouse:0 "不能是你的[spouse|E]"
