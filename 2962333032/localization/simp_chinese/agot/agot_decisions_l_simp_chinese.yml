 disavow_incest_decision:0 "放弃近亲通婚"
 disavow_incest_decision_desc:0 "数百年来，坦格利安家族通过近亲通婚保持血统的纯净，教会也根据《例外法则》给予我们特殊豁免。但现在，是时候重新审视这一传统了。我们是该继续坚守旧俗，还是应寻求新的联盟、拓展家族的视野？"
 disavow_incest_decision_tooltip:0 "禁止你家族内的兄妹通婚。"
 disavow_incest_decision_confirm:0 "我们将打破这一传统"
 reinstate_incest_decision:0 "恢复近亲通婚"
 reinstate_incest_decision_desc:0 "我们家族曾因血统纯净而兴盛，这依靠的是近亲通婚的传统。尽管我们已不再恪守这一习俗，但教会的《例外法则》依然有效，赋予我们延续这项古老习俗的权利。我们是否应该重新拾起这份遗产，恢复我们标志性的传统？"
 reinstate_incest_decision_tooltip:0 "允许你家族内的兄妹通婚。"
 reinstate_incest_decision_confirm:0 "我们将恢复旧有的道路"
