 retrieve_hidden_artifact_decision:0 "取出隐藏的宝物"
 retrieve_hidden_artifact_decision_desc:0 "世人都不知晓，我持有[ROOT.Char.Custom('HiddenArtifact')]。如今再也没有隐藏的必要，是时候将其公之于众了。"
 retrieve_hidden_artifact_decision_tooltip:0 "取出隐藏着宝物"
 retrieve_hidden_artifact_decision_confirm:0 "让世人知晓吧！"
 retrieve_stored_artifacts_decision:0 "取出封存的宝物"
 retrieve_stored_artifacts_decision_desc:0 "坦格利安家族的诸多遗物仍被遗忘在红堡地下的地窖里，王冠和古老的龙骨静静地积着灰尘。是时候让它们重见天日，让它们重归在历史上应有的位置。"
 retrieve_stored_artifacts_decision_tooltip:0 "取出封存在红堡地窖的坦格利安宝物"
 retrieve_stored_artifacts_decision_confirm:0 "派仆人下去"
 high_heart_the_pact_decision:0 "重新在高尚之心栽种鱼梁木"
 high_heart_the_pact_decision_desc:0 "长久以来，高尚之心一直是安达尔人及其新神的见证。是时候让这座山丘再次披上鱼梁木的树皮了——那些雕刻的面孔将注视着所有前来造访的人。"
 high_heart_the_pact_decision_effect:0 "你将重新栽种这种树林，它最终会发展成[GetBuilding('agot_high_heart_01').GetName]"
 high_heart_the_pact_decision_tooltip:0 "你将重新在高尚之心栽种鱼梁木"
 high_heart_the_pact_decision_confirm:0 "旧神在低语！"
 high_heart_the_seven_decision:0 "砍倒高尚之心的鱼梁木"
 high_heart_the_seven_decision_desc:0 "艾瑞格的善举已毁于一旦。现在，我们必须再次将高尚之心从这些恶魔树中净化。"
 high_heart_the_seven_decision_tooltip:0 "你将砍倒高尚之心的鱼梁木"
 high_heart_the_seven_decision_confirm:0 "七神的意志！"
