 justman_revival_decision:0 "复兴公平人家族"
 justman_revival_desc:0 "很久以前，布莱伍德与布雷肯的私生子贝尼狄克·河文一统三叉戟河流域，建立了公平人家族。他们对河间地的统治大约持续了三百年，最终被铁种终结。我也身负这两种血脉——也许是时候复兴这个曾经伟大的[dynasty|E]了，而我将担任它的领袖。"
 justman_revival_decision_confirm:0 "赢来的名字"
 agot_events_generic.0030.t:0 "你这可恶的[ROOT.Char.Custom('GirlBoy')]，"
 agot_events_generic.0030.desc_vassal:0 "我把你从烂泥堆里拉了出来，也能再把你扔回去！你不会#EMP 真的#!以为#EMP 君临城#!，这可鄙土地上最后一根博学支柱，会是你的吧！你的小脚指都不配踩在它闪闪发光的砖块上！把它还给我，否则我就把你溺死在黑水河里——我会亲自动手，如果有必要的话。"
 agot_events_generic.0030.a:0 "我只是在替你照看它！"
 agot_events_generic.0030.b:0 "祝铁王座割掉你的蠢猪脑袋。"
 saerygan_revival_decision:0 "复兴赛里冈家族"
 saerygan_revival_desc:0 "由于暴行或命运，古老的赛里冈家族已经灭绝，这个曾见证瓦雷利亚自由堡垒全盛时期、历经瓦雷利亚浩劫而幸存的家族，统治终在数百年后结束。也许是时候复兴这个曾经伟大的[dynasty|E]了，而我将担任它的领袖。"
 saerygan_revival_decision_confirm:0 "赢来的名字"
 decision_reforge_longthorn:0 "重铸「长刺」"
 decision_reforge_longthorn_desc:0 "「长刺」的剑刃依然被保存着，因为连龙焰也无法摧毁瓦雷利亚钢。然而，我的家族曾立下庄严誓言：只有在收复高庭、复兴园丁家族荣光之后，才会重铸此剑。"
