 agot_commission_special_artifact_decision_effects_tooltip:0 "你将制作一件新的特殊宝物。"
 agot_commission_special_artifact_decision_desc:0 "评判一位统治者，既看其所行，亦看其所持。王冠也好，铠甲也罢，既是象征，亦是声明。我要打造一件全新的宝物，一件配得上我身份的宝物。"
 agot_commission_special_artifact_decision_confirm:0 "召唤铁匠！"
