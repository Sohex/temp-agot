 recover_brightroar_decision:0 "找回光啸"
 recover_brightroar_decision_desc:0 "我会资助一名勇敢的探险家将前往危险的古瓦雷利亚废墟，寻找兰尼斯特家族的祖传之剑「光啸」。"
