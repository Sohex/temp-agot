 tradition_agot_ib_name:0 "在影子统治下"
 tradition_agot_ib_desc:0 "#italic “獠牙湾之后便是颤抖海的中心地带，这里的每一波海浪和每一块岩石都归伊班大岛上的长毛人所有。”#!"
 tradition_agot_ibbenese_name:0 "在颤抖海上"
 tradition_agot_ibbenese_desc:0 "#italic “伊班人和其他人类不同，他们体格魁梧，肩宽胸阔，身高却很少超过五尺半，且双腿粗短，手臂顾长。尽管身材低矮，他们却相当强壮，在其最喜爱的摔跤运动上，维斯特洛人难以匹敌。”#!"
 tradition_agot_ibbatese_name:0 "在冰封高地上"
 tradition_agot_ibbatese_desc:0 "#italic “生活在林地和山间的伊班人比海边的同族更不好客，他们很少会其他语言，以伐木、牧羊和采矿维生，穴居或把灰石头直接埋进地里，再用板岩或茅草做顶，当作房子。”#!"
 tradition_agot_sarese_name:0 "在寒冷海岸上"
 tradition_agot_sarese_desc:0 "#italic “伊班·萨为该岛唯一市镇，从前是犯人的流放地和惩处地，过去的伊班人会将罪大恶极的凶犯送来，通常还先折损肢体，令其无法返回伊班岛。”#!"
