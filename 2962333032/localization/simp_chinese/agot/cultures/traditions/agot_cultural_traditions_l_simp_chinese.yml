 culture_parameter_uses_generic_milk_names:0 "该文化的新生儿将使用[agot_milk_names|E]"
 culture_parameter_uses_animal_milk_names:0 "该文化的新生儿将使用基于动物的[agot_milk_names|E]"
 tradition_agot_dorne_name:0 "沙石毒蛇"
 tradition_agot_dorne_desc:0 "多恩人与维斯特洛其他民族格格不入。他们起初同北方的邻居一样为安达尔人所征服，之后洛伊拿人登陆，通过马泰尔家族融入多恩。来自洛伊拿人的风俗传统，让多恩如同北境一般遗世独立，此后数百年间，这种隔阂愈发根深蒂固。"
 tradition_agot_thenns_name:0 "最后的先民"
 tradition_agot_thenns_desc:0 "#italic “……无耳的斯迪是瑟恩的马格拿，他的族人把他当神看待，而不仅仅是首领。”#!"
 tradition_agot_cave_dweller_name:0 "地下深处"
 tradition_agot_cave_dweller_desc:0 "#italic “结果越走越深，越走越深，想原路返回，眼前却始终是石头，看不到天空。很快火炬开始熄灭，一支接着一支，直到最后只剩黑暗。没人再见过詹德尔和他的部下，但在寂静的夜晚里，你可以听到他们的子孙后代在山底哭泣。他们仍在寻找回家的路。你听？听到了吗？”#!"
 tradition_agot_fangmen_name:0 "荒凉冰山"
 tradition_agot_fangmen_desc:0 "#italic “那里究竟有多少野人？其中又有多少能操起武器作战？没有人说得清。霜雪之牙是一片严酷、冷漠、荒凉的冰山，无法供养大批人群长期停留。照我分析，曼斯·雷德只有一个目的——南下长城，扫荡七大王国。”#!"
 tradition_agot_forestmen_name:0 "不屈之膝"
 tradition_agot_forestmen_desc:0 "#italic “我们自由民知道你们下跪之人所忘记的事。有时捷径并非安全之道，琼恩·雪诺，长角王曾说，巫术乃无柄之剑，没法掌握。”#!"
 tradition_agot_frozen_shoremen_name:0 "象牙与冰镐"
 tradition_agot_frozen_shoremen_desc:0 "#italic “……甚至更奇怪的地方：冰封海岸的原住民驾着海象骨战车，由彪悍的大白狗牵引。”#!"
 tradition_agot_hornfoots_name:0 "脚踏实地"
 tradition_agot_hornfoots_desc:0 "#italic “矮小的硬足民赤脚列队在冰雪上疾走，脚板像沸水煮过的皮革。”#!"
 tradition_agot_ice_river_clans_name:0 "融冰微光"
 tradition_agot_ice_river_clans_desc:0 "#italic “恐怖的冰川部落据说以人肉为生。”#!"
 tradition_agot_lake_folk_name:0 "冰雪奇缘"
 tradition_agot_lake_folk_desc:0 "#italic “到处是齐膝深的雪，但人们把这里的雪铲走，用斧子、铲子和锄头在冻土上挖洞。呼啸的寒风从西边袭来，裹挟着无数雪花吹过封冻的湖面。”#!"
 tradition_agot_milkwatermen_name:0 "国王与英雄之谷"
 tradition_agot_milkwatermen_desc:0 "#italic “……他们打开百座坟墓……国王和英雄们的坟墓，遍布乳河河谷，但一直没有……”#!"
 tradition_agot_nightrunners_name:0 "白月光下共舞"
 tradition_agot_nightrunners_desc:0 "#italic “……让狗头哈犸与骸骨之王讲和，让硬足民与夜行部交流，让冰封海岸的海象民与大冰川的食人部落和解。”#!"
 tradition_agot_moon_clans_name:0 "天降怒火"
 tradition_agot_moon_clans_desc:0 "#italic “……但多数同胞西逃进明月山脉的高山峡谷和崎岖隘口。这个一度辉煌的民族的后代至今在那边顽强繁衍，只是成了盗匪，过着短暂、野蛮而残酷的生活，劫掠蠢到疏于防备便进山的人。这些高山部落类似长城外的「自由民」，亦被文明世界称为「野人」。”#!"
 culture_parameter_immune_to_all_diseases_except_greyscale:0 "该文化的角色免疫所有疾病，但天生带有[GetTrait('greyscale').GetName( GetNullCharacter )]"
 culture_parameter_possessed_trait_more_common:0 "[GetTrait('possessed_1').GetName( GetNullCharacter )][trait|E]更加常见"
 culture_parameter_impatient_trait_is_looked_down_upon:0 "[GetTrait('impatient').GetName(GetNullCharacter)][trait|E]更加常见"
 tradition_agot_the_sorrows_name:0 "在悲伤的迷雾中"
 tradition_agot_the_sorrows_desc:0 "#italic “这地方太诡异，充满绝望与死亡的气息。耶利亚说得对，这雾绝非自然的造物。有脏东西在水里滋生、在空气中蔓延。难怪石民们都发了疯。”#!"
 tradition_agot_stonemen_name:0 "灰王之吻"
 tradition_agot_stonemen_desc:0 "#italic “伤心领亲王的灰吻是不会轻易送出的。”#!"
 culture_parameter_can_have_paramours:0 "角色可以拥有[agot_paramour|E]"
 culture_parameter_gregarious_trait_more_common:0 "[GetTrait('gregarious').GetName( GetNullCharacter )][trait|E]更加常见"
 culture_parameter_reveler_traits_increased_opinion:0 "[GetTrait('lifestyle_reveler').GetName( GetNullCharacter )][traits|E]更受重视"
 culture_parameter_sadistic_trait_looked_down_upon:0 "[GetTrait('sadistic').GetName(GetNullCharacter)][trait|E]受人歧视"
 culture_parameter_better_guild_bonuses:0 "该[culture|E]的[counties|E]中的#V $building_type_guild_halls_01$#!线[buildings|E]拥有额外增益"
 culture_parameter_minor_development_gain_on_building_complete:0 "[building|E]完工时获得#V 10#![development_growth|E]#weak （每年最多一次）#!"
 tradition_agot_reach_name:0 "翠绿之果"
 tradition_agot_reach_desc:0 "河湾地广袤而丰饶，坐拥维斯特洛最广阔的农田与沃野——这是一片富足之地。此地居民以骑士精神闻名遐迩，同时也以与多恩人的世代仇隙著称。"
 tradition_agot_mandermen_name:0 "青手指引"
 tradition_agot_mandermen_desc:0 "#italic “河湾地本土，广袤的田野和农场，其间有无数湖泊、河流、山丘、树林及芳草地，点缀着磨坊、矿井、村落、闹市和古堡。地理范围从落日之海畔的盾牌列岛上溯到曼德河口，经高庭而至红湖、金树城和苦桥，终点是腾石镇和曼德河源头。”#!"
 tradition_agot_shieldmen_name:0 "雾中盾牌"
 tradition_agot_shieldmen_desc:0 "#italic “最沉重的打击来自河湾王「金手」加尔斯七世，他将铁民赶出迷雾列岛，重新命名为盾牌列岛，并让最强悍的战士和最娴熟的水手在岛上定居，以保卫曼德河口。”#!"
 tradition_agot_arbormen_name:0 "风帆载酒"
 tradition_agot_arbormen_desc:0 "#italic “……这是青亭岛的上等金色葡萄酒，带果味的醇酿。”#!"
