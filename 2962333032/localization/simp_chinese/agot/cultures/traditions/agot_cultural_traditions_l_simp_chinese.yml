 culture_parameter_more_likely_to_steal_artifacts:0 "该文化的成员更可能在战斗或劫掠中窃取[artifacts|E]"
 culture_parameter_deceitful_trait_more_common:0 "[GetTrait('deceitful').GetName( GetNullCharacter )][trait|E]更加常见"
 culture_parameter_vengeful_trait_more_valued:0 "[GetTrait('vengeful').GetName( GetNullCharacter )][trait|E]更受重视"
