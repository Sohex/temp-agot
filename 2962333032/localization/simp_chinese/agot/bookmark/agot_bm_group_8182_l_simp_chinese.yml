 agot_bm_group_8182:0 "182 A.C."
 agot_bm_8182:0 "战争钟声"
 agot_bm_8182_desc:0 "战火席卷洛恩河。在罗拉斯，第一总督提斯·奥雷尔新近战胜诺佛斯人，此刻正力图延续其军事上的胜利——但他的下一个目标：斧头半岛的伊班人据点，或许会比预想中更为棘手。\n\n与此同时，在科霍尔，竞选者们正在城内角逐：哈拉特·埃克纳主张严惩诺佛斯的侵犯；科雷娜·奥斯托拉特则认为，在罗拉斯那位不断崛起的征服者面前，诺佛斯与科霍尔的同盟是他们仅存的希望。\n\n而在南方，加尔·萨贡的总督背弃了昔日盟友，阿苏哈拉·阿赫·梅阿利为首的洛伊拿联盟，于是一场生死存亡之战已经打响。\n\n#bold 黄钟毁弃，瓦釜雷鸣，汇成一曲阴沉合唱，世界终将听见——战争之钟，正为谁而鸣。#!"
 bookmark_182_thys_o_rell:0 "第一总督 提斯"
 bookmark_182_thys_o_rell_subheading:0 "罗拉斯第一总督"
 bookmark_182_thys_o_rell_desc:0 "[Concept( 'story_content_thys_o_rell_182', '$bm_story_content_available_icon|q$' )|E][Concept( 'story_content_thys_o_rell_182', '$bm_story_content_available_copy|q$' )|E]\n罗拉斯的年轻领袖在两年半前击败诺佛斯后声名鹊起。如今，他以一幅真正征服者——或许更该说是好大喜功的统帅——的姿态，将目光投向了斧头半岛。\n\n#bold 然而，当这场战役陷入泥潭，罗拉斯人的野心，是否会作茧自缚，让那些昔日败敌趁虚而入？#!"
 bookmark_182_korena_ostorlat:0 "总督 科雷娜"
 bookmark_182_korena_ostorlat_subheading:0 "盖耶维若斯总督"
 bookmark_182_korena_ostorlat_desc:0 "[Concept( 'story_content_korena_ostorlat_182', '$bm_story_content_available_icon|q$' )|E][Concept( 'story_content_korena_ostorlat_182', '$bm_story_content_available_copy|q$' )|E]\n在科霍尔这场竞争激烈的选举中，科雷娜·奥斯托拉特以亲诺佛斯派候选人的姿态脱颖而出。她的盘算很简单：那位年轻的罗拉斯第一总督提斯·奥雷尔，已对这片地区构成直接威胁——而诺佛斯唯有与科霍尔联手结盟，方能将其遏制。\n\n#bold 然而，在直面罗拉斯的威胁之前，科雷娜必须先赢得这场将决定她命运的选举。#!"
 bookmark_182_haratt_ekna:0 "总督 哈拉特"
 bookmark_182_haratt_ekna_subheading:0 "埃罗杜纳瓦尔总督"
 bookmark_182_haratt_ekna_desc:0 "[Concept( 'story_content_haratt_ekna_182', '$bm_story_content_available_icon|q$' )|E][Concept( 'story_content_haratt_ekna_182', '$bm_story_content_available_copy|q$' )|E]\n哈拉特·埃克纳不仅在临近的科霍尔选举中一马当先，更是反对好战的诺佛斯人的头号人物。他曾多次——往往以激烈的方式——主张，诺佛斯必须为其对科霍尔犯下的罪行付出代价。\n\n#bold 一旦埃卡纳当选首席执政官，战争的钟声必将再次敲响。#!"
 bookmark_182_krahas_segal:0 "总督 克拉哈斯"
 bookmark_182_krahas_segal_subheading:0 "加尔·萨贡总督"
 bookmark_182_krahas_segal_desc:0 "[Concept( 'story_content_krahas_segal_182', '$bm_story_content_available_icon|q$' )|E][Concept( 'story_content_krahas_segal_182', '$bm_story_content_available_copy|q$' )|E]\n克拉哈斯·塞加尔据守着加尔·萨贡这一战略要地。本是靠着与洛伊拿人的联盟，瓦兰提斯人才得以拿下此地；然而如今，随着克拉哈斯背弃旧日盟友，企图将其彻底击溃，这片土地已沦为已沦为激烈争夺的焦点。\n\n#bold 他的图谋能否得逞？——将洛伊拿人击得粉碎，一如惊涛在嶙峋巨岩上化作飞沫。#!"
 bookmark_182_arhe_meali:0 "夫人 阿苏哈拉"
 bookmark_182_arhe_meali_subheading:0 "皮胡·萨星女领主"
 bookmark_182_arhe_meali_desc:0 "[Concept( 'story_content_arhe_meali_182', '$bm_story_content_available_icon|q$' )|E][Concept( 'story_content_arhe_meali_182', '$bm_story_content_available_copy|q$' )|E]\n阿苏哈拉·阿赫·梅阿利是洛伊拿人联盟的领袖。曾几何时，她与其同盟者尚是瓦兰提斯人的关键盟友，如今却遭其背叛。威胁他们生死存亡的敌人，正来自那座他们亲手攻克的要塞——加尔·萨贡。\n\n#bold 面对背信弃义与流亡的危机，阿苏哈拉能否号召联盟，夺取胜利？#!"