 agot_multi_duel.0030.desc.intro.a:0 "我发现自己竟与[duelist_enemy.GetTitledFirstName]狭路相逢，此人正是横亘在我与胜利之间的对手。"
 agot_multi_duel.0030.desc.intro.b:0 "是时候直面[duelist_enemy.GetTitledFirstName]了，如今已无路可退。"
 agot_multi_duel.0030.desc.intro.c:0 "站在我面前的是[duelist_enemy.GetTitledFirstName]——一位意志坚定、早已准备开战的对手。"
 agot_multi_duel.0030.desc.intro.d:0 "杀气弥漫，我与[duelist_enemy.GetTitledFirstName]的大战一触即发。"
 agot_multi_duel.0030.desc.intro.e:0 "就是此刻。我与[duelist_enemy.GetTitledFirstName]，不死不休。"
 agot_multi_duel.0030.desc.intro.f:0 "我们准备战斗时，[duelist_enemy.GetTitledFirstNamePossessive]的眼神中透露出冷酷的决心。"
 agot_multi_duel.0030.desc.intro.g:0 "我严阵以待，直面[duelist_enemy.GetTitledFirstName]，心知你我之间唯有一人能全身而退。"
 agot_multi_duel.0030.desc.intro.h:0 "此时此刻，场上只剩下我和[duelist_enemy.GetTitledFirstName]二人。这场决斗的结果，将改变一切。"
 agot_multi_duel.0030.desc.intro.i:0 "空气中弥漫着期待的氛围，我正面对着这场生死决斗中的对手[duelist_enemy.GetTitledFirstName]。"
 agot_multi_duel.0030.desc.intro.j:0 "我紧握我的[player_duelist.Custom('signature_weapon')]，也知晓[duelist_enemy.GetTitledFirstName]亦是如此。"
 agot_multi_duel.0030.desc.intro.k:0 "我与[duelist_enemy.GetTitledFirstName]四目相对，深知这或许是我此生最后一战。"
 agot_multi_duel.0030.desc.intro.l:0 "当我站在[duelist_enemy.GetTitledFirstName]面前，心中再无恐惧，唯有专注。"
 agot_multi_duel.0030.desc.intro.m:0 "在我们准备战斗时，我能从[duelist_enemy.GetTitledFirstNamePossessive]的架势中看出决心。"
 agot_multi_duel.0030.desc.intro.n:0 "[duelist_enemy.GetTitledFirstName]就在面前，我知此战，非胜不可。"
 agot_multi_duel.0030.desc.intro.o:0 "深吸一口气，我稳住心神，只待同[duelist_enemy.GetTitledFirstName]一战。"
 agot_multi_duel.0030.desc.intro.p:0 "战场的喧嚣褪去，我眼中只剩一人——我的敌手，[duelist_enemy.GetTitledFirstName]。"
 agot_multi_duel.0030.desc.intro.q:0 "是时候证明自己了。我与[duelist_enemy.GetTitledFirstName]，交锋在即。"
 agot_multi_duel.0030.desc.intro.r:0 "我曾历经无数决斗，却无一能与[duelist_enemy.GetTitledFirstName]相提并论。"
 agot_multi_duel.0030.desc.intro.s:0 "当我直面[duelist_enemy.GetTitledFirstName]之时，胸中涌起一股决意。"
 agot_multi_duel.0030.desc.intro.t:0 "无处可逃。我与[duelist_enemy.GetTitledFirstName]即将一决胜负。"
 agot_multi_duel.0030.desc.outro.a:0 "当我们站在战斗的悬崖边时，我感受到了即将发生之事的沉重。"
 agot_multi_duel.0030.desc.outro.b:0 "整个世界仿佛屏息以待，等待着我们即将爆发的冲突。紧张的气氛令人窒息，却又令人振奋。我知道，接下来的时刻将决定一切。"
 agot_multi_duel.0030.desc.outro.c:0 "寒风凛冽，裹挟着无数次战斗和胜利的重量。这次也不例外，却令人感到一切都悬于一线。"
 agot_multi_duel.0030.desc.outro.d:0 "随着每一次心跳，真相的时刻越来越近。我能感受到手中的力量，以及意志的坚定。"
 agot_multi_duel.0030.desc.outro.e:0 "我们周围的战场渐渐模糊，只剩下我和[duelist_enemy.GetTitledFirstNameNoTooltip]，我们各自被驱使至此的力量所推动。"
 agot_multi_duel.0030.desc.outro.f:0 "空气中弥漫着暴力的预兆。我们过往的一切，我们如今的模样，都将引向此刻。我能感受到肌肉的紧绷，姿态中的蓄势待发。"
 agot_multi_duel.0030.desc.outro.g:0 "每一次呼吸，每一秒流逝，都让我们离不可避免的冲突更近一步。再无犹豫的余地了。"
 agot_multi_duel.0030.desc.outro.h:0 "我手中的[player_duelist.Custom('signature_weapon')]比以往任何时候都更沉重——并非源于它自身的重量，而是即将发生的一切所带来的负担。"
 agot_multi_duel.0030.desc.outro.i:0 "这是我们一路走来所有经历的顶点。前方的战斗不仅关乎生存，更关乎命运——关乎我们是谁，以及我们所捍卫的信念。"
 agot_multi_duel.0030.desc.outro.j:0 "暴风雨前的寂静中，我整理思绪，鼓起勇气。即将发生的一切无可逃避。"
 agot_multi_duel.0030.desc.outro.k:0 "整个世界被压在这唯一而可怕的时刻。所有的喧嚣，所有的战场混乱，都退散成了背景。"
 agot_multi_duel.0030.desc.outro.l:0 "我们为进攻做最后准备时，即将发生之事的沉重感压在我心头。这不仅是场战斗，这是一段旅程的终结，是对力量与意志的最后考验。"
 agot_multi_duel.0030.desc.outro.m:0 "紧张感令人难以忍受，但我强迫自己保持冷静。我曾面对过挑战，但从未有过如此局面。"
 agot_multi_duel.0030.desc.outro.n:0 "随着决斗临近，时间仿佛变慢了。我脑海中的每一个细节都变得清晰起来——[player_duelist.Custom('signature_weapon')]的重量、脚下的土地，以及[duelist_enemy.GetTitledFirstNamePossessiveNoTooltip]眼中的决心。"
 agot_multi_duel.0030.desc.outro.o:0 "这份期待逐渐活跃，蓄势待发。我能从每寸肌体中感受到那种确信——这场决斗必将与众不同。"
 agot_multi_duel.0030.desc.outro.p:0 "当我们面对面时，命运的重量沉沉压下。这不仅仅是一场决斗，而是一个岔路口，一个将决定我们人生走向的时刻。"
 agot_multi_duel.0030.desc.outro.q:0 "暴风雨前的寂静震耳欲聋，这份平静掩盖了即将到来的激烈冲突。在这一刻，很明显，除了决斗，其他一切都不重要。"
 agot_multi_duel.0030.desc.outro.r:0 "每一秒流逝，命定的终局便更近一分。这场决斗不止是搏杀——它是一场试炼，对我毕生所学、对我一切的试炼。"
 agot_multi_duel.0030.desc.outro.s:0 "这一刻有着终结的意味，仿佛一切皆为此而来。"
 agot_multi_duel.0030.desc.outro.t:0 "当我准备迎战[duelist_enemy.GetTitledFirstNameNoTooltip]时，我能感受到自己每个抉择都至关重要。"
 agot_multi_duel.0030.desc.outro2.a:0 "\n\n每一个决定，每一次行动，不仅将决定这场决斗的胜负，更将决定未来的道路。容不得半点差错。"
 agot_multi_duel.0030.desc.outro2.b:0 "\n\n唯有能抓住机遇之人，方能赢得胜利。"
 agot_multi_duel.0030.desc.outro2.c:0 "\n\n我的决心愈发坚定。我必须成为那个从中脱身而去的人。"
 agot_multi_duel.0030.desc.outro2.d:0 "\n\n但这真的足够吗？很快，将不再有疑问，只剩下决斗与冰冷的现实。"
 agot_multi_duel.0030.desc.outro2.e:0 "\n\n胜者唯有一人，而代价之沉重，无以复加。"
 agot_multi_duel.0030.desc.outro2.f:0 "\n\n是时候看看谁更强了。"
 agot_multi_duel.0030.desc.outro2.g:0 "\n\n决斗即将开始，唯有一人能活到最后。而那人必定是我。"
 agot_multi_duel.0030.desc.outro2.h:0 "\n\n这场决斗远非寻常打斗，它是一场清算——以刀剑为笔、技艺为墨写下的裁决。"
 agot_multi_duel.0030.desc.outro2.i:0 "\n\n最佳时机已知。"
 agot_multi_duel.0030.desc.outro2.j:0 "\n\n我们将是两股力量的碰撞，当尘埃落定时，只有一方能够屹立不倒。"
 agot_multi_duel.0030.desc.outro2.k:0 "\n\n现在重要的是即将到来的决斗，这将是我们之中必有一人倒下的试炼场。"
 agot_multi_duel.0030.desc.outro2.l:0 "\n\n希望我已经准备好了。"
 agot_multi_duel.0030.desc.outro2.m:0 "\n\n这场决斗将成为决定性的时刻——要么将我彻底摧毁，要么见证我赢得最终胜利。"
 agot_multi_duel.0030.desc.outro2.n:0 "\n\n接下来的一切，已无可避免。"
 agot_multi_duel.0030.desc.outro2.o:0 "\n\n此时此刻，将改变一切。"
 agot_multi_duel.0030.desc.outro2.p:0 "\n\n我稳住呼吸，心知接下来发生的一切，都将决定一切。"
 agot_multi_duel.0030.desc.outro2.q:0 "\n\n这个结果，将以我们二人皆无法预知的方式塑造未来。"
 agot_multi_duel.0030.desc.outro2.r:0 "\n\n我只愿自己足够强大，能够坚持到底。"
 agot_multi_duel.0030.desc.outro2.s:0 "\n\n这场决斗无关胜负，而是为了证明一件至关重要的事——向我自己，也向[duelist_enemy.GetTitledFirstNameNoTooltip]。"
 agot_multi_duel.0030.desc.outro2.t:0 "\n\n这场决斗将是终极的试炼——要么成就我，要么摧毁我。"
 agot_multi_duel.1000.b:0 "或许现在退让，才是明智之举。"
 agot_multi_duel.0030.a.a:0 "现在才刚开始。"
 agot_multi_duel.0030.a.b:0 "直面我！"
 agot_multi_duel.0030.a.c:0 "战吧。"
 agot_multi_duel.0030.a.d:0 "别玩把戏了。"
 agot_multi_duel.0030.a.e:0 "到此为止了。"
 agot_multi_duel.0030.a.f:0 "现在结束了。"
 agot_multi_duel.0030.a.g:0 "为了荣誉！"
 agot_multi_duel.0030.a.h:0 "直视我！"
 agot_multi_duel.0030.a.i:0 "我准备好了。"
 agot_multi_duel.0030.a.j:0 "至死方休！"
 agot_multi_duel.0030.a.k:0 "此事到此为止。"
 agot_multi_duel.0100.t.tos.accuser_yielded:0 "$agot_multi_duel.tos_header$：指控者屈服"
 agot_multi_duel.0100.t.tos.accuser_downed:0 "$agot_multi_duel.tos_header$：指控者之溃败"
 agot_multi_duel.0100.t.tos.accuser_dead:0 "$agot_multi_duel.tos_header$：指控者之陨"
 agot_multi_duel.0100.t.tos.accused_downed:0 "$agot_multi_duel.tos_header$：裁决已定"
 agot_multi_duel.0100.t.tos.accused_dead:0 "$agot_multi_duel.tos_header$：血证其罪"
 agot_multi_duel.0100.desc.accuser_yielded:0 "这场冲突没有任何交锋就宣告结束。[main_loser_leader.GetTitledFirstName]在王国众人面前认输，垂下[main_loser_leader.GetHerHis]手中的[main_loser_leader.Custom('signature_weapon')]，撤回了这场引动刀剑的指控。\n\n接下来的话语，比任何一击都更有分量。指控者在诸神与世人面前，彻底收回指控。七子审判并未以鲜血落幕，而是以投降告终。我被证明是清白的，它并非来自王令，而是由指控者亲自澄清。[main_loser_leader.GetTitledFirstNamePossessiveNoTooltip]亲口撤销对我的一切指控，全境都为此见证。"
 agot_multi_duel.0100.desc.accuser_downed:0 "[main_loser_leader.GetTitledFirstName]倒在场上，力气耗尽，再也站不起来了。支撑[main_loser_leader.GetHerHim]走进这场审判的那股决心，此时都已彻底瓦解。\n\n既然指控者已无力再战，七子审判就此结束。依循法律与惯例，指控随[main_loser_leader.GetTitledFirstNamePossessiveNoTooltip]的落败而撤销。我以钢铁般的毅力在所有见证这一判决的人面前得到了证明，支撑我主张的并非言语，而是在最紧要关头的坚持。"
 agot_multi_duel.0100.desc.accuser_dead:0 "最后的冲突让[main_loser_leader.GetTitledFirstName]倒在战场上，召唤这场审判的声音终于沉寂。\n\n随着指控者消逝，七子审判在血与终结中落幕。再无挑战需要回应，再无指控需要辩驳。我仅凭幸存便获无罪，在誓言与控诉一度失灵的所在，我的诉求得到证明。对于裁决胜利究竟落于何方，全境上下已毋庸置疑。"
 agot_multi_duel.0100.desc.accused_downed:0 "[main_loser_leader.GetTitledFirstName]倒在战场上，随着战斗意志的彻底消散，力气也离[main_loser_leader.GetHerHim]而去。这场对决以[main_loser_leader.GetHerHim]再也无法站立告终。\n\n七子审判终于做出了裁决。我依然站立，而被告已经倒下。根据钢铁和习俗，罪人的名字是[main_loser_leader.GetTitledFirstNamePossessiveNoTooltip]。在全境面前，我所提出的指控已得到证实，我所要求的判决也已下达。"
 agot_multi_duel.0100.desc.accused_dead:0 "决斗以鲜血告终，[main_loser_leader.GetTitledFirstName]倒在了针对[main_loser_leader.GetHerHim]的审判之下。现场一片寂静，这一刻的意义逐渐明确。\n\n七子审判终于尘埃落定。我还站立着，而被告已经倒下。指控在众目睽睽之下于战场上得到证实。所有人都能看到，无需多言，毫无疑问。王国已得到答案，清晰地铭刻于钢铁上。"
 agot_multi_duel.0100.desc.accuser_yielded.observer:0 "随着[main_loser_leader.GetTitledFirstName]认输，在众目睽睽之下放下了[main_loser_leader.GetHerHis]的[main_loser_leader.Custom('signature_weapon')]，激烈的交锋戛然而止。钢铁的声响渐渐消退，取而代之的是一阵沉重的沉默，这个瞬间的意义在场上蔓延开来。\n\n随着指控的撤回，七子审判不攻自破。对[main_winner_leader.GetTitledFirstName]的罪名并非因流血而消除，而是源于指控者的投降。在诸神与世人面前，此事未再动干戈便已了结，全境将用言语而不是钢铁来评判。"
 agot_multi_duel.0100.desc.accuser_downed.observer:0 "[main_loser_leader.GetTitledFirstName]被击倒在地再也无法站起。决斗场在紧张的寂静中等待，却不见任何动静。\n\n七子审判以指控方落败告终。遵照传统与律法，当勇士无法坚持时，指控即告失败。[main_winner_leader.GetTitledFirstName]在全境面前证明了清白，当对方倒下时，这一指控得到了力量的回应。"
 agot_multi_duel.0100.desc.accuser_dead.observer:0 "最后一次交锋，[main_loser_leader.GetTitledFirstName]倒在了决斗场上，随着[main_loser_leader.GetHerHim]的倒下，发起这场审判的声音也一同沉寂。交击声消散，场上只剩下一切结束的沉重。\n\n七子审判在血中分出了胜负。[main_winner_leader.GetTitledFirstName]还站着，指控者却没有。指控仅凭生还便已做出回答。无需再行宣判，钢铁写成的判决已由全境见证。"
 agot_multi_duel.0100.desc.accused_downed.observer:0 "[main_loser_leader.GetTitledFirstName]被击倒在地，再无力续战。挣扎渐渐消散，直至被告已然无法站起，再次回应这指控。\n\n七子审判终于做出裁决。[main_winner_leader.GetTitledFirstName]在所有见证者面前赢得了胜利，罪责则落于被告之身。昔日曾遭受质疑之事，如今已不容置喙。"
 agot_multi_duel.0100.desc.accused_dead.observer:0 "决斗以[main_loser_leader.GetTitledFirstName]倒在战场上告终，这最后一击，令所有对此指控的抵赖，彻底哑然。\n\n七子审判在鲜血与确证中落下帷幕。指控以刀锋为证，[main_winner_leader.GetTitledFirstName]在王国瞩目下凯旋。胜负的裁决已再无悬念，此事就此尘埃落定。"
 agot_multi_duel.0100.desc.accuser_yielded.loser:0 "力量离我而去，也带走了支撑我走到这里的信念。我颤抖着垂下握住[main_loser_leader.Custom('signature_weapon')]的手臂，此刻的沉重远胜以往。\n\n在所有观众面前，我认输了。我撤回提出的控诉，放弃那场兵刃相接的挑战。七子审判因我的主动投降而终结，我曾大胆说出的控诉随着话语消散，让王国铭记，当无力更进一步时，我选择了退让。"
 agot_multi_duel.0100.desc.accuser_downed.loser:0 "我试图起身，躯体却不听使唤。地面显得遥远而不稳，战场的喧嚣逐渐模糊，痛苦淹没了其他一切感知。\n\n真相已无可回避——我再也无法站直身躯，无法继续向全境上下宣告控诉。七子审判以我的落败告终，正如我的控诉随着力量衰竭一同瓦解。在所有旁观者面前，我的挑战在战场上化为泡影。"
 agot_multi_duel.0100.desc.accused_downed.loser:0 "战斗耗尽了我的力气，双腿发软再也无法站立。每一次呼吸都灼烧着肺腑，视野天旋地转，我竭力保持清醒，想要看清这场审判的结果。\n\n七子审判以刀剑回应了对我的控诉。众目睽睽之下，判决降临，我伤痕累累地倒在尘埃中——我的命运并非由言语或誓言裁定，而是由我在关键时刻的失败导致。"
 agot_multi_duel.0100.a:0 "结束了。"
 agot_multi_duel.1002.desc.tos.stands_winner_pov.friend:0 "我将[loser_multi_duelist.GetTitledFirstName]击倒在地，以确信这场交锋已经结束。有那么一瞬，[loser_multi_duelist.GetSheHe]在纷乱的战场中一动不动，静静躺着。"
 agot_multi_duel.1002.desc.tos.stands_loser_pov.friend:0 "[winner_multi_duelist.GetTitledFirstNamePossessive]一击将我击倒在地，天地旋转，刀刃与喧嚣在周身轰鸣。有那么一瞬，战斗仿佛已然终结。"
 agot_multi_duel.1002.desc.tos.stands_winner_pov.friend.outro_1:0 "\n\n一个声音穿透嘈杂，[loser_duelist_friend.GetTitledFirstName]从人群中大喊。\n\n#EMP “站起来，[loser_multi_duelist.GetTitledFirstNameNoTooltip]！这场战斗你不可以输！”#!\n\n不知怎的，[loser_multi_duelist.GetSheHe]起身了。浑身是血，摇摇晃晃，但没有倒下。[loser_multi_duelist.GetHerHis]不顾伤痛与理智，强撑着到战局中。"
 agot_multi_duel.1002.desc.tos.stands_winner_pov.friend.outro_2:0 "\n\n冲突中传来一声呼喊，[loser_duelist_friend.GetTitledFirstName]从人群中喊道。\n\n#EMP “站起来，[loser_multi_duelist.GetTitledFirstNameNoTooltip]！这不是你倒下的地方！”#!\n\n出乎所有人意料，[loser_multi_duelist.GetSheHe]再次挣扎站起，虽然伤痕累累但斗志未减，决斗继续进行。"
 agot_multi_duel.1002.desc.tos.stands_winner_pov.friend.outro_3:0 "\n\n钢铁交击的轰鸣中，[loser_duelist_friend.GetTitledFirstNamePossessive]的声音清晰地响起。\n\n#EMP “站起来，爵士！让他们看看你还能战！”#!\n\n片刻之后，[loser_multi_duelist.GetSheHe]挣扎着站起，摇摇晃晃却依然准备再战。"
 agot_multi_duel.1002.desc.tos.stands_winner_pov.friend.outro_4:0 "\n\n一声绝望的呼喊穿透嘈杂，[loser_duelist_friend.GetTitledFirstName]鼓励着[loser_multi_duelist.GetHerHim]继续。\n\n#EMP “站起来！七神正注视着你——不要屈服”#!\n\n[loser_multi_duelist.GetSheHe]气喘吁吁地再次站起来，拒绝让对决结束。"
 agot_multi_duel.1002.desc.tos.stands_winner_pov.friend.outro_5:0 "\n\n人群中，[loser_duelist_friend.GetTitledFirstName]带着坚定的决心高声呐喊。\n\n#EMP “站起来，[loser_multi_duelist.GetTitledFirstNameNoTooltip]！站起来面对他们！”#!\n\n[loser_multi_duelist.GetSheHe]缓慢而倔强地重新站稳脚跟，重新投入战斗。"
 agot_multi_duel.1002.desc.tos.stands_loser_pov.friend.outro_1:0 "\n\n在迷雾中，我听见[loser_duelist_friend.GetTitledFirstName]在混乱中大声呼喊。\n\n#EMP “站起来，[loser_multi_duelist.GetTitledFirstNameNoTooltip]！站起来战斗！”#!\n\n喊声刺破迷雾，我强忍疼痛逼迫自己站起身，呼吸粗重，四肢在抗议中嘶喊。无论接下来发生什么，我都不会倒下。"
 agot_multi_duel.1002.desc.tos.stands_loser_pov.friend.outro_2:0 "\n\n在一片混乱中，[loser_duelist_friend.GetTitledFirstNamePossessive]的声音找到了我。\n\n#EMP “站起来，[loser_multi_duelist.GetTitledFirstNameNoTooltip]！你还没有输！”#!\n\n这句话穿透了迷茫的阴霾，我强迫自己挺起身来，拒绝让这场战斗就此结束。"
 agot_multi_duel.1002.desc.tos.stands_loser_pov.friend.outro_3:0 "\n\n耳边的嗡鸣中传来一个熟悉的声音，是[loser_duelist_friend.GetTitledFirstName]，语气激烈而不容妥协。\n\n#EMP “起来，[loser_multi_duelist.GetTitledFirstNameNoTooltip]！站起来，战斗！”#!\n\n我咬紧牙关，挣扎着重新站起，每一个动作都伴随着剧痛。"
 agot_multi_duel.1002.desc.tos.stands_loser_pov.friend.outro_4:0 "\n\n在钢铁的碰撞声中，我听到[loser_duelist_friend.GetTitledFirstName]在呼唤我的名字。\n\n#EMP “站起来！别倒下！”#!\n\n喊声让我镇定，我努力克服疼痛，再次站了起来。"
 agot_multi_duel.1002.desc.tos.stands_loser_pov.friend.outro_5:0 "\n\n在喧嚣的某处，[loser_duelist_friend.GetTitledFirstName]绝望而急切地呼喊。\n\n#EMP “站起来，[loser_multi_duelist.GetTitledFirstNameNoTooltip]！这场战斗属于你——站起来！”#!\n\n这些话穿透了迷雾，我挺直身子，喘着粗气，意志未曾动摇。"
 agot_multi_duel.1002.desc.tos.stands_loser_pov.memory.outro_1:0 "\n\n世界有那么一瞬间恍惚了。我看见[my_teacher_knight.GetTitledFirstName]站在训练场里，低头看着我挣扎着从泥地上爬起来。[my_teacher_knight.GetSheHe|U]摇了摇头，语气严厉却熟悉。\n\n#EMP “起来。骑士无论摔得多重，都会站起来。”#!\n\n钢铁的交击声将我撞回现实，我喘了口气，手撑在被翻起的地面上，又逼着自己站了起来。"
 agot_multi_duel.1002.desc.tos.stands_loser_pov.memory.outro_2:0 "\n\n黑暗淹没过来，直到[my_teacher_knight.GetTitledFirstNamePossessive]平静而坚定的声音穿透它。如同在过去一样，每次瘀伤都是一次教训，每次跌倒换来新的命令。\n\n#EMP “疼痛会过去，你得站起来。”#!\n\n战吼声如潮水般涌回，尖锐而压倒一切。我咬紧牙关，强忍着疼痛，硬撑着站了起来。"
 agot_multi_duel.1002.desc.tos.stands_loser_pov.memory.outro_3:0 "\n\n有那么一刻，战场消失了，我仿佛又回到了旧日的训练场，站在的尘土里，[my_teacher_knight.GetTitledFirstName]抱着双臂，看着我拼尽全力去证明自己配得上手中的剑。\n\n#EMP “重来。直到你学会不再跌倒。”#!\n\n记忆在钢铁碰撞声中骤然消散。肺中灼烧的气息翻涌，我踉跄着站直身体，这堂课还没到下课的时候。"
 agot_multi_duel.1002.desc.tos.stands_loser_pov.memory.outro_4:0 "\n\n厮杀声忽然变得遥远，我清晰地听到[my_teacher_knight.GetTitledFirstNamePossessive]的声音，好像[my_teacher_knight.GetSheHe]就站在我身边，站在那条早已忘记的道路旁，在我疲惫不堪、即将倒下时催促我继续。\n\n#EMP “真正的骑士，懂得坚持。”#!\n\n现实随着钢铁的碰撞声和命令的呼喊声骤然回归。我得到来自过去的力量，强令四肢服从意志，再次起身。"
 agot_multi_duel.1002.desc.tos.stands_loser_pov.memory.outro_5:0 "\n\n某个瞬间，眼前的战场远了，取而代之的是[my_teacher_knight.GetTitledFirstName]严厉的脸——那次切磋之后，我趴在泥地上，满嘴土腥味，等[my_teacher_knight.GetSheHe]拉我一把。我伸出手，[my_teacher_knight.GetSheHe]没有接。\n\n#EMP “不要等待怜悯——站起来。”#!\n\n幻象碎裂，我重新感到身体的重量。我喘着粗气，带着颤抖的决心挺直身子，重新投入战斗。"
 agot_multi_duel.0020.desc.outro_survived1.stands_up.friend:0 "\n\n一记重击将[loser_duelist.GetTitledFirstNameNoTooltip]打倒在地，[loser_duelist.GetHerHim]的呼吸猛地一窒。就在决斗即将分出胜负之际，人群中传来[loser_duelist_friend.GetTitledFirstName]的喊声。\n\n#EMP “起来，[loser_duelist.GetTitledFirstNameNoTooltip]！站起来，战斗还没有结束！”#!\n\n受到激励，[loser_duelist.GetSheHe]强撑着重新站了起来。"
 agot_multi_duel.0020.desc.outro_survived2.stands_up.friend:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip]重重摔倒在地，尘土在[loser_duelist.GetSheHe]撞击地面之处飞扬。一瞬间，冲突就停止了，直到[loser_duelist_friend.GetTitledFirstNamePossessive]的声音划破了喧嚣。\n\n#EMP “站起来，[loser_duelist.GetFirstNameNoTooltip]！站起来面对他们！”#!\n\n[loser_duelist.GetSheHe]深吸一口气后，挣扎着重新站起。"
 agot_multi_duel.0020.desc.outro_survived3.stands_up.friend:0 "\n\n钢铁的力量将[loser_duelist.GetTitledFirstNameNoTooltip]击倒在地，[loser_duelist.Custom('signature_weapon')]从[loser_duelist.GetHerHis]手中滑落。在这一刻结束之前，人群中响起了一声喊叫，[loser_duelist_friend.GetTitledFirstName]为[loser_duelist.GetHerHim]鼓劲。\n\n#EMP “站起来！你还没被打败，站起来！”#!\n\n[loser_duelist.GetHerHis]咬紧牙关，再次挣扎着起身。"
 agot_multi_duel.0020.desc.outro_survived4.stands_up.friend:0 "\n\n交锋的冲击力将[loser_duelist.GetTitledFirstNameNoTooltip]掀翻在泥泞的土地上。围观者中响起一阵低语，直到一个声音盖过了其余人，那是[loser_duelist_friend.GetTitledFirstName]，声音铿锵而坚定。\n\n#EMP “站起来，[loser_duelist.GetFirstNameNoTooltip]，让他们看看你的力量！”#!\n\n响应着呼唤，[loser_duelist.GetSheHe]再次起身，摇晃却未屈服。"
 agot_multi_duel.0020.desc.outro_survived5.stands_up.friend:0 "\n\n在猛烈的攻势下，[loser_duelist.GetTitledFirstNameNoTooltip]被压倒在地，于尘土与钢铁中倒下。决斗似乎已尘埃落定，此时战场之外传来一声清晰的呼喊，是[loser_duelist_friend.GetTitledFirstName]。\n\n#EMP “站起来！七神正注视着你，不能倒下！”#!\n\n话语传遍全场，[loser_duelist.GetSheHe]挣扎着重新站起。"
