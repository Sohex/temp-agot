 agot_multi_duel.0020.desc.intro1:0 "混战中，[winner_duelist.GetTitledFirstName]与[loser_duelist.GetTitledFirstName]的对决如风暴般爆发，我的目光被牢牢吸引在他们的刀光剑影之上。"
 agot_multi_duel.0020.desc.intro2:0 "我看见[winner_duelist.GetTitledFirstName]和[loser_duelist.GetTitledFirstName]正以杀意腾腾的姿态互相周旋，战场的喧嚣逐渐褪去，他们的决斗成为了现在唯一的焦点。"
 agot_multi_duel.0020.desc.intro3:0 "在混乱的团体对决中，我的注意力被[winner_duelist.GetTitledFirstName]和[loser_duelist.GetTitledFirstName]吸引，他们正互相冲锋，刀刃闪烁着致命寒光。"
 agot_multi_duel.0020.desc.intro4:0 "[winner_duelist.GetTitledFirstName]与[loser_duelist.GetTitledFirstName]以响彻战场的狂暴气势交锋，这场致命决斗犹如死亡之舞，吸引了我的目光。"
 agot_multi_duel.0020.desc.intro5:0 "混乱之中，我注意到[winner_duelist.GetTitledFirstName]和[loser_duelist.GetTitledFirstName]四目相对，二人都决意在这场足以逆转战局的决斗中，分个高低。"
 agot_multi_duel.0020.desc.intro6:0 "激战正酣，我瞅见[winner_duelist.GetTitledFirstName]与[loser_duelist.GetTitledFirstName]步步逼近，每一招都算计精准、致命无比。"
 agot_multi_duel.0020.desc.intro7:0 "[winner_duelist.GetTitledFirstName]与[loser_duelist.GetTitledFirstName]展开惨烈对决，兵刃交击之声，刺穿了战场的喧嚣。"
 agot_multi_duel.0020.desc.intro8:0 "我的目光被[winner_duelist.GetTitledFirstName]和[loser_duelist.GetTitledFirstName]所吸引，他们在战场上穿梭交错，武器蓄势待发，这场决斗或将染血收场。"
 agot_multi_duel.0020.desc.intro9:0 "在激战中，[winner_duelist.GetTitledFirstName]与[loser_duelist.GetTitledFirstName]之间的决斗如同灯塔般引人注目，他们全力以赴，为求生而战，充分展示出了武艺。"
 agot_multi_duel.0020.desc.intro10:0 "[winner_duelist.GetTitledFirstName]与[loser_duelist.GetTitledFirstName]激烈交锋，刀剑相击迸发的火花照亮了战场，决斗就此展开。"
 agot_multi_duel.0020.desc.middle1:0 "[winner_duelist.GetTitledFirstNameNoTooltip]一个快步冲刺向前，但[loser_duelist.GetTitledFirstNameNoTooltip]侧身闪避，并用一记凶狠的[loser_duelist.Custom('AGOT_SignatureWeaponCritical')]反击，几乎命中目标。"
 agot_multi_duel.0020.desc.middle2:0 "[loser_duelist.GetTitledFirstNamePossessiveNoTooltip]的[loser_duelist.Custom('signature_weapon')]呼啸着划过空气，[winner_duelist.GetTitledFirstNameNoTooltip]俯身躲过，随即用一记迅猛的[winner_duelist.Custom('AGOT_SignatureVerb')]反击，击中[loser_duelist.GetTitledFirstNamePossessiveNoTooltip]的侧身，鲜血飞溅。"
 agot_multi_duel.0020.desc.middle3:0 "决斗愈发激烈，[winner_duelist.GetTitledFirstNameNoTooltip]挡下了[loser_duelist.GetTitledFirstNameNoTooltip]一记重击，将[loser_duelist.GetHerHim]逼退后，随即展开了一连串猛攻。"
 agot_multi_duel.0020.desc.middle4:0 "[loser_duelist.GetTitledFirstNameNoTooltip]向左佯攻，引开[winner_duelist.GetTitledFirstNamePossessiveNoTooltip]的防御，随即挥出[winner_duelist.Custom('AGOT_SignatureWeaponHeavy')]重击，几乎将[winner_duelist.GetTitledFirstNameNoTooltip]打倒在地。"
 agot_multi_duel.0020.desc.middle5:0 "[winner_duelist.GetTitledFirstNameNoTooltip]格挡开[loser_duelist.GetTitledFirstNamePossessiveNoTooltip]的过顶挥砍，紧接贴近，用膝盖猛击[loser_duelist.GetTitledFirstNamePossessiveNoTooltip]腹部，随后将[loser_duelist.GetHerHim]推退。"
 agot_multi_duel.0020.desc.middle6:0 "[loser_duelist.GetTitledFirstNameNoTooltip]挥动[loser_duelist.GetHerHis]的[loser_duelist.Custom('signature_weapon')]低扫，朝着[winner_duelist.GetTitledFirstNamePossessiveNoTooltip]的双腿，但[winner_duelist.GetTitledFirstNameNoTooltip]跃过攻击，以一记凌厉的[winner_duelist.Custom('AGOT_SignatureWeaponCritical')]回击[loser_duelist.GetTitledFirstNamePossessiveNoTooltip]的肩膀。"
 agot_multi_duel.0020.desc.middle7:0 "[winner_duelist.GetTitledFirstNameNoTooltip]与[loser_duelist.GetTitledFirstNameNoTooltip]在一轮激烈的交锋中相互攻击，双方在猛烈进攻中均惊险地避开了致命一击。"
 agot_multi_duel.0020.desc.middle8:0 "[loser_duelist.GetTitledFirstNameNoTooltip]闪身避开一记重击，顺势在[winner_duelist.GetTitledFirstNamePossessiveNoTooltip]手臂上划出一道血痕。"
 agot_multi_duel.0020.desc.middle9:0 "[winner_duelist.GetTitledFirstNameNoTooltip]佯装撤退，引诱[loser_duelist.GetTitledFirstNameNoTooltip]贸然追击，随后趁势给了[loser_duelist.GetTitledFirstNamePossessiveNoTooltip]胸口狠狠一击。"
 agot_multi_duel.0020.desc.middle10:0 "[loser_duelist.GetTitledFirstNamePossessiveNoTooltip]的[loser_duelist.Custom('signature_weapon')]与[winner_duelist.GetTitledFirstNamePossessiveNoTooltip]的[winner_duelist.Custom('signature_weapon')]猛烈相撞，但[winner_duelist.GetTitledFirstNameNoTooltip]迅速反击，将[winner_duelist.GetHerHis]的[winner_duelist.Custom('signature_weapon')]挥向[loser_duelist.GetTitledFirstNamePossessiveNoTooltip]的脖颈。"
 agot_multi_duel.0020.desc.outro1:0 "\n\n随着最后绝望的奋力一刺，[winner_duelist.GetTitledFirstNameNoTooltip]将[winner_duelist.GetHerHis]的[winner_duelist.Custom('signature_weapon')]刺入[loser_duelist.GetTitledFirstNamePossessiveNoTooltip]胸口，在鲜血飞溅中结束了这场决斗。[loser_duelist.GetTitledFirstNameNoTooltip]倒地不起，再未醒来。"
 agot_multi_duel.0020.desc.outro2:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip]成功缴械了[winner_duelist.GetTitledFirstNameNoTooltip]，但就在[loser_duelist.GetSheHe]即将结果[winner_duelist.GetHerHim]时，[winner_duelist.GetTitledFirstNamePossessiveNoTooltip]的[winner_duelist.Custom('signature_weapon')]却刺入了[loser_duelist.GetTitledFirstNamePossessiveNoTooltip]的心脏。[loser_duelist.GetTitledFirstNameNoTooltip]瘫倒在地，落地前便已气绝身亡。"
 agot_multi_duel.0020.desc.outro3:0 "\n\n[winner_duelist.GetTitledFirstNamePossessiveNoTooltip]的[winner_duelist.Custom('signature_weapon')]刺穿了[loser_duelist.GetTitledFirstNameNoTooltip]的喉咙，鲜血喷涌而出，[loser_duelist.GetTitledFirstNameNoTooltip]倒地不起，决斗就此终结。"
 agot_multi_duel.0020.desc.outro4:0 "\n\n[loser_duelist.GetTitledFirstNamePossessiveNoTooltip]最后的奋力一击落空，露出破绽，[winner_duelist.GetTitledFirstNamePossessiveNoTooltip]趁机给予致命一击。[winner_duelist.GetTitledFirstNamePossessiveNoTooltip]的[winner_duelist.Custom('signature_weapon')][winner_duelist.Custom('AGOT_SignatureWeaponCriticalPresent')]穿透[loser_duelist.GetHerHis]心脏，[loser_duelist.GetTitledFirstNameNoTooltip]发出一声最后的喘息后轰然倒下。"
 agot_multi_duel.0020.desc.outro5:0 "\n\n随着一记猛烈的挥砍，[winner_duelist.GetTitledFirstNameNoTooltip]将[loser_duelist.GetTitledFirstNameNoTooltip]斩首，以一招制敌的利落一击终结了决斗。[loser_duelist.GetTitledFirstNamePossessiveNoTooltip]的身体瘫倒在地。"
 agot_multi_duel.0020.desc.outro6:0 "\n\n[winner_duelist.GetTitledFirstNamePossessiveNoTooltip]的最后一击[winner_duelist.Custom('AGOT_SignatureWeaponCriticalPresent')]，刺中[loser_duelist.GetTitledFirstNamePossessiveNoTooltip]侧身，致命伤令[loser_duelist.GetTitledFirstNameNoTooltip]跪倒在地，随后[loser_duelist.GetSheHe]轰然倒下，毙命当场。"
 agot_multi_duel.0020.desc.outro7:0 "\n\n[winner_duelist.GetTitledFirstNameNoTooltip]对[loser_duelist.GetTitledFirstNameNoTooltip]施以致命一击，[winner_duelist.GetHerHis][winner_duelist.Custom('signature_weapon')]深深刺入对手胸膛，[loser_duelist.GetTitledFirstNamePossessiveNoTooltip]的尸体瘫倒在地。"
 agot_multi_duel.0020.desc.outro8:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip]露出破绽，而[winner_duelist.GetTitledFirstNameNoTooltip]抓住机会，用[winner_duelist.GetHerHis][winner_duelist.Custom('signature_weapon')]一记精准突刺贯穿对手。[loser_duelist.GetTitledFirstNameNoTooltip]随之倒下，在[loser_duelist.GetSheHe]落地前便已死去。"
 agot_multi_duel.0020.desc.outro9:0 "\n\n以迅捷而凶残的一击，[winner_duelist.GetTitledFirstNameNoTooltip]割开了[loser_duelist.GetTitledFirstNamePossessiveNoTooltip]的喉咙。[loser_duelist.GetTitledFirstNamePossessiveNoTooltip]双眼圆睁，满是震惊，[loser_duelist.GetSheHe]瘫倒在地，鲜血从伤口中喷涌而出。"
 agot_multi_duel.0020.desc.outro10:0 "\n\n[winner_duelist.GetTitledFirstNameNoTooltip]闪过了[loser_duelist.GetTitledFirstNamePossessiveNoTooltip]的防守，将[winner_duelist.GetHerHis]的[winner_duelist.Custom('signature_weapon')]深深刺入[loser_duelist.GetHerHis]的腹部。[loser_duelist.GetTitledFirstNameNoTooltip]踉跄了片刻，随即倒地，气息全无，躺在鲜血染红的地面上。"
 agot_multi_duel.0020.desc.outro_survived1:0 "\n\n二位决斗者皆已浑身浴血、遍体鳞伤，但仍侥幸生还。他们各自撤开，退去疗伤。"
 agot_multi_duel.0020.desc.outro_survived2:0 "\n\n[winner_duelist.GetTitledFirstNameNoTooltip]成功缴械了[loser_duelist.GetTitledFirstNameNoTooltip]，但并未痛下杀手，而是饶了[loser_duelist.GetHerHim]一命，任由[loser_duelist.GetHerHim]爬离战场。"
 agot_multi_duel.0020.desc.outro_survived3:0 "\n\n决斗以平局告终，双方都已筋疲力尽，无法继续。他们警惕地对视一眼，随后各自退开，彼此的荣誉得以保全。"
 agot_multi_duel.0020.desc.outro_survived4:0 "\n\n战场上的突发干扰迫使[winner_duelist.GetTitledFirstNameNoTooltip]和[loser_duelist.GetTitledFirstNameNoTooltip]中断了决斗，双方都不愿在此不确定局势下贸然出击。"
 agot_multi_duel.0020.desc.outro_survived5:0 "\n\n[winner_duelist.GetTitledFirstNameNoTooltip]和[loser_duelist.GetTitledFirstNameNoTooltip]谨慎地相互周旋，但双方都未能找到致命一击的破绽。最终两人各自退开，虽然负伤但都活着。"
 agot_multi_duel.0020.desc.outro_survived6:0 "\n\n战斗因敌军士兵的突然涌入而中断，迫使[winner_duelist.GetTitledFirstNameNoTooltip]和[loser_duelist.GetTitledFirstNameNoTooltip]不得不中止决斗，返回主战场。"
 agot_multi_duel.0020.desc.outro_survived7:0 "\n\n两人都已濒临崩溃，却无人屈服。最终，他们惺惺相惜，同意终止这场决斗。"
 agot_multi_duel.0020.desc.outro_survived8:0 "\n\n[winner_duelist.GetTitledFirstNameNoTooltip]成功击伤了[loser_duelist.GetTitledFirstNameNoTooltip]，可就在[winner_duelist.GetSheHe]准备了结对方之际，其他战士骤然冲至二人之间，打断了这致命一刻，决斗就此终止。"
 agot_multi_duel.0020.desc.outro_survived9:0 "\n\n两人都已疲惫不堪，攻势也随之乏力，最终各自后退，点头承认平手，随即又投身入混战之中。"
 agot_multi_duel.0020.desc.outro_survived10:0 "\n\n[winner_duelist.GetTitledFirstNameNoTooltip]击出本应致命的一击，但[loser_duelist.GetTitledFirstNamePossessiveNoTooltip]盔甲救了他。意识到战斗可能无休止地持续下去，双方气喘吁吁地分开了。"
 agot_multi_duel.0020.desc.outro_survived1.stands_up:0 "\n\n一记重击将[loser_duelist.GetTitledFirstNameNoTooltip]击倒在地，使其在混战中一时迷失方向。就在决斗似乎即将分出胜负之际，挣扎着重新站起，继续战斗。"
 agot_multi_duel.0020.desc.outro_survived2.stands_up:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip]跌跌撞撞地重重摔倒在地，撞击声让旁观者倒吸一口冷气。然而片刻之后，[loser_duelist.GetSheHe]重新站起，抖落伤痛，强撑着自己重新投入战斗。"
 agot_multi_duel.0020.desc.outro_survived3.stands_up:0 "\n\n冲突以[loser_duelist.GetTitledFirstNameNoTooltip]被击倒在地告终，[loser_duelist.Custom('signature_weapon')]从[loser_duelist.GetHerHis]手中滑落。凭借着毅力与决心，[loser_duelist.GetSheHe]重新拾起武器，站起身来，准备再次面对战斗。"
 agot_multi_duel.0020.desc.outro_survived4.stands_up:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip]被击倒在地，在人群的拥挤中摔得四仰八叉。决斗停滞了一瞬，随后[loser_duelist.GetSheHe]重新站起，虽已负伤，却仍不愿认输。"
 agot_multi_duel.0020.desc.outro_survived5.stands_up:0 "\n\n利刃与暴力将[loser_duelist.GetTitledFirstNameNoTooltip]击倒在地，尘土与鲜血在[loser_duelist.GetHerHim]身下交织。然而[loser_duelist.GetSheHe]并未就此倒下，在战吼震天中[loser_duelist.GetHerHis]重新爬起，挣扎着站稳身形。"
 agot_multi_duel.0020.desc.outro_survived6.stands_up:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip]被强攻击倒，[loser_duelist.GetHerHis]的呼吸被震散，[loser_duelist.GetHerHim]迎面倒下。片刻之后，[loser_duelist.GetSheHe]再次撑起身躯，不肯让决斗如此轻易结束。"
 agot_multi_duel.0020.desc.outro_survived7.stands_up:0 "\n\n一次激烈的交锋将[loser_duelist.GetTitledFirstNameNoTooltip]击倒在地，一动不动，晕眩不已。短暂的停顿后，[loser_duelist.GetSheHe]再次起身，凭借坚韧与决心重返战局。"
 agot_multi_duel.0020.desc.outro_survived8.stands_up:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip]被击退倒地，决斗因这一摔而暂时中断。随着一声急促的呼吸和紧咬的决心，[loser_duelist.GetSheHe]重新站稳脚步，再次向前迈进。"
 agot_multi_duel.0020.desc.outro_survived9.stands_up:0 "\n\n激斗汇总，[loser_duelist.GetTitledFirstNameNoTooltip]被拍倒在地，武器刮擦着地面。然而，[loser_duelist.GetSheHe]并未屈服，挣扎着站起身重新加入战局。"
 agot_multi_duel.0020.desc.outro_survived10.stands_up:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip]被击倒，瞬间被周围的混乱吞噬。随后[loser_duelist.GetSheHe]再次站起，其虽遭重创却依然挺立，决斗仍在继续。"
 agot_multi_duel.0020.desc.outro_survived1.downed:0 "\n\n一场激烈的交锋将[loser_duelist.GetTitledFirstNameNoTooltip]重重击倒在地，这次没能迅速起身。[loser_duelist.GetSheHe]挣扎着要站起来，却已力竭，决斗便在他倒下的地方宣告结束。"
 agot_multi_duel.0020.desc.outro_survived2.downed:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip]被重重摔倒在地，冲击力将[loser_duelist.GetHerHim]的战斗意志彻底击溃。尽管[loser_duelist.GetSheHe]仍在挣扎，却无法重新站稳。"
 agot_multi_duel.0020.desc.outro_survived3.downed:0 "\n\n钢铁与力量将[loser_duelist.GetTitledFirstNameNoTooltip]击倒在地。[loser_duelist.GetSheHe]试图找回平衡却未能如愿，决斗就此分出胜负。"
 agot_multi_duel.0020.desc.outro_survived4.downed:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip]在攻击下倒地不起，呼吸急促，四肢已不听使唤。起身的尝试失败了，这场战斗就此结束。"
 agot_multi_duel.0020.desc.outro_survived5.downed:0 "\n\n最后一击将[loser_duelist.GetTitledFirstNameNoTooltip]击倒在地，尘土与血迹标示出[loser_duelist.GetSheHe]倒下的位置。[loser_duelist.GetSheHe]再也没能起身，决斗就此终结。"
 agot_multi_duel.0020.desc.outro_survived6.downed:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip]在战斗的重压下倒地不起，努力站起的尝试以失败告终。如今人群看得一清二楚：[loser_duelist.GetSheHe]已无法再战。"
 agot_multi_duel.0020.desc.outro_survived7.downed:0 "\n\n冲突以[loser_duelist.GetTitledFirstNameNoTooltip]被击倒在地告终，[loser_duelist.GetSheHe]力量消耗殆尽，意志消沉。尽管[loser_duelist.GetSheHe]仍在挣扎着，却再也无力起身再战。"
 agot_multi_duel.0020.desc.outro_survived8.downed:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip]被击倒，瘫倒原地。决斗随之停下并宣告结束，因为[loser_duelist.GetSheHe]显然已经站不起来了。"
 agot_multi_duel.0020.desc.outro_survived9.downed:0 "\n\n这场交锋的力量终于压倒了[loser_duelist.GetTitledFirstNameNoTooltip]，将其击倒在地。试图起身的努力失败了，胜负不再有疑问。"
 agot_multi_duel.0020.desc.outro_survived10.downed:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip]被击倒在地，再也无法起身——疲惫与伤痛终结了斗志。决斗并非以另一记重击告终，而是败于[loser_duelist.GetHerHis]无力再战。"
 agot_multi_duel.0020.desc.outro_survived1.yielded:0 "\n\n随着[loser_duelist.GetTitledFirstNameNoTooltip]放下[loser_duelist.GetHerHis]的[loser_duelist.Custom('signature_weapon')]，并在众目睽睽之下投降，这场冲突逐渐平息。当众人领会这举动的含义后，全场陷入一片寂静。\n\n随着投降，七子审判便失去了意义。[loser_duelist.GetSheHe|U]撤回了对[tos_accused.GetTitledFirstName]的指控，那曾引动刀剑相向的控诉，最终被[loser_duelist.GetHerHis]自己的言语所化解。"
 agot_multi_duel.0020.desc.outro_survived2.yielded:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip]从战斗中退后一步，[loser_duelist.Custom('signature_weapon')]垂下，意志消沉，在整个全境面前服输投降。这场决斗并非以最后一击终结，而是以投降告终。\n\n七子审判在那一刻结束。[loser_duelist.GetSheHe|U]撤回了对[tos_accused.GetTitledFirstName]的指控，这场震动全境的挑战就此平息。"
 agot_multi_duel.0020.desc.outro_survived3.yielded:0 "\n\n全场一片寂静，[loser_duelist.GetTitledFirstNameNoTooltip]认输了。[loser_duelist.GetHerHis]在神明与世人面前放低了自己的[loser_duelist.Custom('signature_weapon')]，在场的所有人都明白这意味着什么。\n\n通过认输，[loser_duelist.GetSheHe]撤销了对[tos_accused.GetTitledFirstName]的指控，使得这场七子审判失去了诉求。原本要用鲜血来裁决的事情，最终通过投降而化解。"
 agot_multi_duel.0020.desc.outro_survived4.yielded:0 "\n\n[loser_duelist.GetTitledFirstNameNoTooltip]踉跄后退，终于垂下[loser_duelist.GetHerHis]的[loser_duelist.Custom('signature_weapon')]，战斗的喧嚣随之沉寂。战场上众人屏息凝神。\n\n随着指控者认输，七子审判宣告终结。[loser_duelist.GetSheHe|U]撤回了对[tos_accused.GetTitledFirstName]的指控，那曾要求以刀剑裁决的罪责，一笔勾销。"
 agot_multi_duel.0020.desc.outro_survived5.yielded:0 "\n\n随着[loser_duelist.GetTitledFirstNameNoTooltip]认输，力量与决心都已耗尽，这一刻的紧张随之消散。钢铁归于沉寂，决斗未再交锋便已终结。\n\n七子审判无法继续进行。[loser_duelist.GetSheHe|U]撤回对[tos_accused.GetTitledFirstName]的指控，这场控诉再无人发声，也没有勇士愿意为之而战。"
 agot_multi_duel.0020.a.a:0 "专心点！"
 agot_multi_duel.0020.a.b:0 "抬腿！"
 agot_multi_duel.0020.a.c:0 "了结它，快！"
 agot_multi_duel.0020.a.d:0 "小心点！"
 agot_multi_duel.0020.a.e:0 "切勿分心！"
 agot_multi_duel.0020.a.f:0 "继续战斗！"
