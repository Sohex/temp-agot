l_simp_chinese:
 agot_multi_duel.header:0 "[background_terrain_scope.GetNameNoTooltip]的对决"
 agot_multi_duel.tos_header:0 "七子审判"
 agot_multi_duel.1002.a.t:0 "$agot_multi_duel.tos_header$：仍未倒下"
 agot_multi_duel.1002.desc.tos.stands_winner_pov:0 "我将[loser_multi_duelist.GetTitledFirstName]击倒在地，以确信这场交锋已经结束。在战场的喧嚣中，[loser_multi_duelist.GetSheHe]有那么一瞬静静躺着不动。\n\n随后[loser_multi_duelist.GetSheHe]又站了起来。浑身浴血，步履蹒跚，却再次挺立，仿佛将痛苦与理智一并抛却，[loser_multi_duelist.GetHerHis]硬是重新杀回了战局。"
 agot_multi_duel.1002.desc.tos.stands_loser_pov:0 "[winner_multi_duelist.GetTitledFirstNamePossessive]一击将我击倒在地，天地旋转，刀刃与喧嚣在周身轰鸣。有那么一瞬，战斗仿佛已然终结。\n\n我强忍剧痛撑起身躯，呼吸粗重，四肢发出不堪重负的哀鸣。无论接下来要面对什么，我绝不会就此倒下。"
 agot_multi_duel.1002.a:0 "战斗还在继续。"
 agot_multi_duel.1003.a.t:0 "$agot_multi_duel.tos_header$：一击而溃"
 agot_multi_duel.1003.desc.tos.downed_winner_pov:0 "[loser_multi_duelist.GetTitledFirstName]试图再次站起，却已力竭。先前支撑[loser_multi_duelist.GetHerHim]站立的力量终于耗尽，[loser_multi_duelist.GetSheHe]重新倒在了地上。\n\n战斗结束了。[loser_multi_duelist.GetSheHe|U]一息尚存，但[loser_multi_duelist.GetSheHe]再已无力以刀刃反击。"
 agot_multi_duel.1003.desc.tos.downed_loser_pov:0 "我试图撑起身体，但四肢早已不听使唤。剧痛淹没了一切，我的躯干不再服从命令。\n\n战斗在我缺席时继续着，而此刻它即将落幕。我看见[winner_multi_duelist.GetTitledFirstName]伫立在我的上方，浴血却未折脊梁，正品尝着我再也无法触碰的胜利的醍醐味。"
 agot_multi_duel.1003.a:0 "又少一人。"
 agot_multi_duel.1004.a.t:0 "$agot_multi_duel.tos_header$：攻势未成"
 agot_multi_duel.1004.desc.tos.yields_winner_pov:0 "[loser_multi_duelist.GetTitledFirstName]终于踉跄倒地，气力耗尽，意志崩摧。不等兵刃再度交锋，[loser_multi_duelist.GetSheHe]便已俯首认输。\n\n话音未落，指控随之撤销。针对[tos_accused.GetTitledFirstName]的诘难，在举国瞩目之下彻底作罢。昔日备受质疑的一切，再无人敢于争辩。这场七神审判，并未以鲜血落幕，而是以投降告终。"
 agot_multi_duel.1004.desc.tos.yields_loser_pov:0 "我浑身气力散尽，支撑我走到如今的信念也随之崩塌。我垂下手中的[loser_multi_duelist.Custom('signature_weapon')]，选择认输。我知道，再坚持下去也毫无意义。\n\n在所有旁观者面前，我撤回指控，放弃了这场由我发起、针对[tos_accused.GetTitledFirstName]的审判。我曾竭力求证的真相，终究无法由我亲手证明。七子审判就此终结，以我的投降，悄然落幕。"
 agot_multi_duel.1004.desc.tos.yields_observer_pov:0 "钢铁交击的速度减慢，终至平息。[loser_multi_duelist.GetTitledFirstName]，那位全境面前公开指控[tos_accused.GetTitledFirstName]并发起审判的人，终于选择认输。\n\n随着这一投降，指控将被撤回。七子审判并非以一记重击告终，而是经由指控者自己的口。在所有见证者面前，此事就此了结，指控随之平息。"
 agot_multi_duel.1004.a:0 "审判到此结束。"
 agot_multi_duel.1005.t.tos:0 "$agot_multi_duel.tos_header$：审判作废"
 agot_multi_duel.1005.desc.tos:0 "七子审判尚未开始，[dead_enemy_leader.GetTitledFirstName]便在站上比武场前死去。不论是死于意外、不幸还是另有仇人下手，审判的理由都已不复存在。\n\n既无被告也无原告为控辩负责，审判无法继续。聚集的骑士纷纷离去，由七子刀剑交鸣所决定的审判，如今为寂静取代。"
 agot_multi_duel.1005.a:0 "结束了。"
