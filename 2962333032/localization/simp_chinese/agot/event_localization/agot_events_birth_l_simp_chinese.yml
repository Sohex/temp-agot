l_simp_chinese:
 agot_birth_events.0003.t:0 "死亡鳞片"
 agot_birth_events.0003.desc:0 "“就再用力一下，[ROOT.Char.GetLadyLord]！宝宝就快出来了！”我最后一次用力，尖叫声窜出了我的嘴唇。剧痛遍布全身，太多了，受不了了——然后，它结束了。我……我做到了。\n\n“我的孩子还好吗？”我几乎无法听出这是我自己的声音。“是……是[child.Custom('GirlBoy')]吗？”\n\n产婆并没有问答我，甚至没有看我。不，她只是看着她怀中一动不动的婴儿。"
 agot_birth_events.0003.a:0 "不是……为什么孩子没有呼吸？#EMP 帮帮忙吧！#!"
 agot_birth_events.0004.t:0 "死亡鳞片"
 agot_birth_events.0004.desc:0 "当产婆终于离开产房，她脸色苍白，不敢直视我的眼睛。\n\n“对不起，[ROOT.Char.GetLadyLord|U]。孩子是……是畸形的。”她已说不出话来，但是她的语调说了一切。我走进这弥漫着死亡气息的房间。[mother.GetFirstNameNoTooltip]抱着一个小小的，一动不动的生物。它有着长满鳞片的皮肤和没有退化完全的翅膀，如果不是[mother.GetFirstNameNoTooltip]用手轻轻缕着的头发，我几乎都认不出这是个人类。\n\n我的[child.Custom('GetDaughterSon')]生下来就是个怪物。"
 agot_birth_events.0004.a:0 "真是悲剧。"
 agot_birth_events.0005.t:0 "怪物"
 agot_birth_events.0005.desc:0 "#bold 难以忍受#!的疼痛！\n\n在一阵阵撕心裂肺的喘息尖叫和雷霆焚烧般的撕裂痛苦之间，我仿佛听到了龙的怒吼。然后……一切归于#italic 寂静#!。\n\n寂静笼罩着整个房间，在场的人都沉浸在这无声无息的静谧之中。终于，[second_adult.GetFirstNameNoTooltip]开口打破了宁静：“我的[ROOT.Char.GetLadyLord|l]，您的孩子……在这里。”\n\n我甚至都没意识到[second_adult.GetHerHim]把孩子递给了我——如果那真的是我的孩子的话。\n\n我#bold 怀里#!的是个#NEG 怪物#!。"
 agot_birth_events.0005.a:0 "我的[child.Custom('GetDaughterSon')]是个怪物。"
 agot_birth_events.0006.t:0 "怪物"
 agot_birth_events.0006.desc:0 "产房里传来的尖叫声越来越疯狂，仿佛撕裂了空气，就像一头从禁锢中挣扎出来的恶龙。#italic 我可怜的心爱的[mother.GetFirstNameNoTooltip]……这个孩子可能会要了她的命……#!\n\n突如其来的寂静让我一阵失神，#italic 终于结束了。#!但进入产房前，我迟疑了一下——我让自己镇定下来，为即将到来的一切做好准备。\n\n分娩过程的惨状让我震惊。我心爱的[mother.GetFirstNameNoTooltip]身上的衣服已被鲜血浸透，怀里则紧紧抱着婴儿。但当我走近去看我的孩子时，[mother.GetFirstNameNoTooltip]脸上痛苦的表情让我感到害怕。\n\n那……那不是什么孩子。那分明是一个#bold 怪物#!！"
 agot_birth_events.0101.t:0 "苦乐参半的降生"
 agot_birth_events.0101.desc:0 "分娩的阵痛漫长而激烈，但最后我听到了婴儿的啼哭穿透空气。欣慰感淹没了我，直到我注意到接生婆怀中一动不动、一声不发的包裹，我的心都颤抖起来。我的一个孩子在我身边，另一个还未见天日即已死去。"
 agot_birth_events.0101.a:0 "至少我的[child.Custom('GetDaughterSon')]活了下来……"
 agot_birth_events.0102.t:0 "苦乐参半的降生"
 agot_birth_events.0102.desc:0 "我走进产房，看到[mother.GetFirstName]坐在床上，眼中全是怀中的婴孩。对于我的到来她未置一瞥。卧室静悄悄，只有一个婴儿脆弱的啼哭。然后我看到壁炉旁的接生婆，怀抱一个一动不动的包裹。那时我就明白了。"
 agot_birth_events.0102.a:0 "一个孩子幸存，另一个没有。"
 agot_birth_events.1000.t:0 "我自己的家族"
 agot_birth_events.1000.desc:0 "随着[child.GetName]的诞生，是否建立我自己的家族的问题摆在了我的面前。我的兄弟，[daemon.GetFirstNameNicknamed]，早已建立了属于他的家族，如今世人闻黑火之名皆将胆寒。我应该考虑一下，是否也要让世人见识下寒铁的恐惧。"
 agot_birth_events.1000.a:0 "寒铁家族就此诞生！"
 agot_birth_events.1000.a_tt:0 "你将建立一个分支家族，你的婚姻会转为父系婚姻"
 agot_birth_events.1000.b:0 "不，现有的一切就足够了。"
 agot_birth_events.2000.t:0 "我自己的家族"
 agot_birth_events.2000.desc:0 "伟大的瓦雷利亚钢剑，[vs_blackfyre.GetName]，现已落入我手中。它是坦格利安家族权力、英勇与正统的至高象征。\n\n然而，我并非坦格利安。身为私生子，我从未有资格继承[vs_blackfyre.GetNameNoTooltip]的荣耀。但或许，我可以创立自己的家族，一个能彰显这把剑的历史与崇高地位的家族……"
 agot_birth_events.2000.a:0 "黑火家族就此诞生！"
 agot_birth_events.2000.a_tt:0 "你将建立黑火家族。"
 agot_birth_events.2000.b:0 "不，现有的一切就足够了。"
 agot_birth_events.1500.t:0 "被污染的血脉"
 agot_birth_events.1500.desc:0 "分娩的阵痛漫长而激烈，但最后我听到了婴儿的啼哭穿透空气，我心头涌上一阵宽慰。接着我看向产婆。\n\n她什么都没说。\n\n“怎么了？”我问。\n\n“[ROOT.Char.Custom('FormOfAddressForLiege')|U]……这孩子看起来有些异样。”她回答。\n\n我和[real_father.GetFirstName]一直都清楚，我们这样的结合存在风险，可当我看向自己刚出生的孩子时，愧疚还是淹没了我。"
 agot_birth_events.1500.twins:0 "分娩的阵痛漫长而激烈，但最后我听到了婴儿的啼哭穿透空气，我心头涌上一阵宽慰。接着我看向产婆。\n\n她什么都没说。\n\n“怎么了？”我问。\n\n“[ROOT.Char.Custom('FormOfAddressForLiege')|U]……孩子看起来有些异样。”她回答。\n\n我和[real_father.GetFirstName]一直都清楚，我们这样的结合存在风险，可当我看向自己刚出生的孩子时，愧疚还是淹没了我。"
 agot_birth_events.1500.a:0 "既成的事实，再无法改变……"
 agot_birth_events.1501.t:0 "被污染的血脉"
 agot_birth_events.1501.desc:0 "我焦急地在产房外踱步，直到一位产婆走出来。她告诉我分娩过程顺利，我顿时如释重负。\n\n随即我看到了她脸上的神情。\n\n“怎么了？”我问。\n\n“[ROOT.Char.Custom('FormOfAddressForLiege')|U]……这孩子看起来有些异样。”她回答。\n\n我和[mother.GetFirstName]一直都清楚，我们这样的结合存在风险，可当我听到门后传来孩子的哭声时，愧疚还是淹没了我。"
 agot_birth_events.1501.twins:0 "我焦急地在产房外踱步，直到一位产婆走出来。她告诉我分娩过程顺利，我顿时如释重负。\n\n随即我看到了她脸上的神情。\n\n“怎么了？”我问。\n\n“[ROOT.Char.Custom('FormOfAddressForLiege')|U]……孩子看起来有些异样。”她回答。\n\n我和[mother.GetFirstName]一直都清楚，我们这样的结合存在风险，可当我听到门后传来孩子的哭声时，愧疚还是淹没了我。"
 agot_birth_events.1501.a:0 "既成的事实，再无法改变……"
 birth.3001.desc_incompatible_biology:0 "它长得畸形，几乎看不出一点人类婴儿的样子。产婆拼命压下自己的反感，在场所有人都盯着眼前这个毫无生气的东西——"
 birth.3001.desc_incompatible_biology.nohead:0 "它根本就没长脑袋！"
 birth.3001.desc_incompatible_biology.eightdigits:0 "它每只手都有八根手指！"
 birth.3001.desc_incompatible_biology.threeeyes:0 "它额头上长着第三只眼睛！"
 birth.3001.desc_incompatible_biology.fisheyes:0 "它长着一双水汪汪、玻璃般透明的眼睛，和长在鱼身上那对一模一样！"
 birth.3001.desc_incompatible_biology.unicornhorn:0 "它的额头上长着一个凸起，像没发育完全的犄角！"
 birth.3001.desc_incompatible_biology.fur:0 "它浑身长毛，就像传说中的长毛人一样！"