l_simp_chinese:
 agot_wildling_events.0001.t:0 "起名字"
 agot_wildling_events.0001.desc.me:0 "[ROOT.Char.GetFirstNameNoTooltip]。\n\n一个简单的乳名，我的族人仅在生命最初的日子用于抵御厄运。\n\n现在我已经足够强壮，可以取一个正式的名字了，我想知道我该取什么样的名字。"
 agot_wildling_events.0001.desc:0 "[child.GetFirstNameNoTooltip]。\n\n一个简单的乳名，我的族人仅在生命最初的日子用于抵御厄运。\n\n现在[child.GetSheHe]已经足够强壮，是时候让[child.GetHerHim]在族人中获得一个真正的名字了。"
 agot_wildling_events.0001.a:0 "给[Select_CString(Character.IsLocalPlayer, '我', '这孩子' )]重新起个名字。"
 agot_wildling_events.0100.t:0 "成形中的名字"
 agot_wildling_events.0100.desc.me:0 "[ROOT.Char.GetFirstNameNoTooltip]。\n\n这不再是乳名，而是一个真正的名字，取自世界上的生物，这是我们族人的传统。\n\n虽然还不是成年[ROOT.Char.GetWomanMan]真正的名字，但这是我跨过童年的第一步。"
 agot_wildling_events.0100.desc:0 "[child.GetFirstNameNoTooltip]。\n\n这不再是乳名，而是一个真正的名字，取自世界上的生物，这是我们族人的传统。\n\n虽然还不是成年人的名字，但这是[child.GetSheHe]跨过童年的第一步。"
 agot_wildling_events.0100.a:0 "在成长中获得的名字。"
 agot_wildling_events.0101.t:0 "成型的名字"
 agot_wildling_events.0101.desc.me:0 "[ROOT.Char.GetFirstNameNoTooltip]。\n\n我童年时的名字已成过去，如今我的名字带上一个反映我成长过程的绰号，这是我们族人的习俗。\n\n这是一个适合成年人的名字。"
 agot_wildling_events.0101.desc:0 "[child.GetFirstNameNoTooltip]。\n\n[child.GetHerHis|U]童年时的名字已成过去，如今[child.GetHerHis]的名字带上一个反映[child.GetSheHe]成长过程的绰号，这是我们族人的习俗。\n\n这是一个适合成年人的名字。"
 agot_wildling_events.0101.a:0 "一个完整的名字。"