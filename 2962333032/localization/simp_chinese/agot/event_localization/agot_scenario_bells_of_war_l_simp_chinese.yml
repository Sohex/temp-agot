l_simp_chinese:
 agot_bells_of_war.0001.t:0 "扩建迷宫"
 agot_bells_of_war.0001.desc:0 "在对诺佛斯的战役大获全胜之后，我已调转罗拉斯的军队，转而直指斧头半岛的伊班人定居点。当地人由那位声名赫赫的[ibbenese_colony_leader.GetName]领导。\n\n不过，对伊班人的战事进展却比我当初预想的要迟缓得多。[ibbenese_colony_leader.GetTitledFirstNameNoTooltip]巧妙利用了当地的崎岖地形，而我的将领们却令人恼火地仍未适应此地。\n\n若不能尽快战胜伊班人，我担心罗拉斯的敌人们会在我远在异乡之时图谋不轨。"
 agot_bells_of_war.0001.a:0 "伊班人必遭粉碎！"
 agot_bells_of_war.0002.t:0 "战争钟声"
 agot_bells_of_war.0002.desc:0 "大约三年前，罗拉斯的军队在战场上击败了诺佛斯。竞选之时，我立誓要洗刷罗拉斯人加诸于我们的耻辱。自就任以来，我便一直在枕戈待旦，等待着时机到来。\n\n如今，我麾下斥候与密探向我示意，称[lorathi_leader.GetName]]深陷斧头半岛与伊班人的苦战，难以脱身。显而易见，这位自命的征服者贪多嚼不烂，已是骑虎难下。\n\n话虽如此，倘若我们孤立无援，罗拉斯的军队对诺佛斯仍是一大威胁。[qohor_m1.GetNamePossessive]——我在科霍尔的盟友——在即将到来的选举中位居前列，承诺会支持对罗拉斯的反击。我们只需静待良机即可。"
 agot_bells_of_war.0002.a:0 "战争的钟声就要响起！"
 agot_bells_of_war.0003.t:0 "选举迫近"
 agot_bells_of_war.0003.desc:0 "[old_qohor_guy.GetName]已命不久矣。\n\n尽管[old_qohor_guy.GetTitledFirstNameNoTooltip]离世之前，我严格来说还是个非官方候选人，但遍布全城的密探已向我禀报，我已是继任第一总督之职的头号人选。我唯一的对手，便是与我意识形态截然相反的[qohor_m2.GetName]。\n\n为彰显我的实力，我已向诺佛斯人承诺，将支持他们对罗拉斯发起反击。凭借一场强有力的军事行动，我既可巩固科霍尔在外邦盟友中的支持，又能一举平息国内的捣乱分子。至少——计划如此。"
 agot_bells_of_war.0003.a:0 "选举迫近……"
 agot_bells_of_war.0004.t:0 "选举迫近"
 agot_bells_of_war.0004.desc:0 "谢天谢地，[old_qohor_guy.GetName]很快就将撒手人寰。据我盟友的初步消息，能真正与我争夺第一总督之位的，唯有[qohor_m1.GetName]。\n\n为争取支持、巩固我候选人的地位，我不遗余力地宣扬我对本国与诺佛斯过从甚密的反感。一旦我当选，必叫诺佛斯为其对科霍尔的种种冒犯付出代价。"
 agot_bells_of_war.0004.a:0 "我的统治指日可待。"
 agot_bells_of_war.0005.t:0 "选举迫近"
 agot_bells_of_war.0005.desc:0 "我的生命正走向终点，但更重要的是，由我担任第一执政的日子也将结束——而世人都对此心知肚明。\n\n我的同胞们竟在赌我何时断气，外邦人则忙着讨好下届选举的候选人。看来，这片国度正迫不及待地想要翻过有我的这一页。"
 agot_bells_of_war.0005.a:0 "至少现在，我仍然在此。"
 agot_bells_of_war.0006.t:0 "侍从比武大会"
 agot_bells_of_war.0006.desc:0 "我的堂妹[daena_targaryen.GetNamePossessive]之子——[daemon_blackfyre.GetName]的命名日来临。虽然我与那孩子一向保持着距离，但我仍旧爱他……老实说，我爱他恐怕胜过爱我#italic 其他所有#!孩子！\n\n我想要为这孩子庆贺一番，送他一份永生难忘的贺礼。得知他对剑术的热爱，我已命我的顾问们筹办一场盛大的比武大会，让王国中最出色的侍从们一较高下——自然，包括[daemon_blackfyre.GetFirstNameNoTooltip]。"
 agot_bells_of_war.0006.a:0 "祝你好远，[daemon_blackfyre.GetFirstNameNoTooltip]。"
 agot_bells_of_war.0007.t:0 "长女之怒"
 agot_bells_of_war.0007.desc:0 "瓦兰提斯人背叛了我们。尽管[rhoynar_confederation.GetName]曾为夺取战略要地加尔·萨贡而流血牺牲，瓦兰提斯人却强占了这座堡垒，并宣称我们为敌人。\n\n[volantis_invader.GetName]已率领一支令人胆寒的大军抵达，他毫不耽搁地阐明：洛伊拿人如今乃是瓦兰提斯之敌……\n\n其余的洛伊拿人已响应了我的召唤，与我汇合，试图击退这些背信弃义的叛徒。[rhoynar_confederation.GetName]必须获胜，否则我们注定万劫不复。\n\n 既然瓦兰提斯人自称是龙王传人……"
 agot_bells_of_war.0007.a:0 "那就送他们去见祖先！"
 agot_bells_of_war.0008.t:0 "征讨洛伊拿人"
 agot_bells_of_war.0008.desc:0 "我已发动战役，誓要将[rhoynar_confederation.GetName]彻底碾碎。尽管他们曾为夺取加尔·萨贡的立下汗马功劳，但我们绝不能坐视他们在这里坐大，更遑论让他们掌控加尔·萨贡本身。\n\n我麾下雄壮的大军听我号令，必能征服这片腹地，将其尽数纳入瓦兰提斯的版图！"
 agot_bells_of_war.0008.a:0 "但愿能速战速决。"
 agot_bells_of_war.0020.t:0 "比武开幕"
 agot_bells_of_war.0020.desc:0 "侍从比武大会已拉开帷幕，首轮对阵如下：\n\n[squire_1.GetName][squire_1.Custom('AGOTGetSurname')]对阵[squire_2.GetName][squire_2.Custom('AGOTGetSurname')]\n\n[squire_3.GetName][squire_3.Custom('AGOTGetSurname')]对阵[squire_4.GetName][squire_4.Custom('AGOTGetSurname')]\n\n[squire_5.GetName][squire_5.Custom('AGOTGetSurname')]对阵[squire_6.GetName][squire_6.Custom('AGOTGetSurname')]\n\n[squire_7.GetName][squire_7.Custom('AGOTGetSurname')]对阵[squire_8.GetName][squire_8.Custom('AGOTGetSurname')]\n\n[squire_9.GetName][squire_9.Custom('AGOTGetSurname')]对阵[squire_10.GetName][squire_10.Custom('AGOTGetSurname')]\n\n[squire_11.GetName][squire_11.Custom('AGOTGetSurname')]对阵[squire_12.GetName][squire_12.Custom('AGOTGetSurname')]\n\n[squire_13.GetName][squire_13.Custom('AGOTGetSurname')]对阵[squire_14.GetName][squire_14.Custom('AGOTGetSurname')]\n\n[squire_15.GetName][squire_15.Custom('AGOTGetSurname')]对阵[squire_16.GetName][squire_16.Custom('AGOTGetSurname')]"
 agot_bells_of_war.0020.a:0 "比武开始！"
 agot_bells_of_war.0021.t:0 "比武决赛"
 agot_bells_of_war.0021.desc:0 "经过一连串激烈的较量，两位侍从脱颖而出，杀入比武大会的决赛！\n\n[top_bracket_finalist.GetName]即将迎战[bottom_bracket_finalist.GetName]，争夺冠军的荣耀。"
 agot_bells_of_war.0021.desc_daemon_blackfyre_flavor:0 "\n\n我儿在这样的场合中真是如鱼得水。毫无疑问，他算得上同龄人中最出色的剑客，仿佛生来便手握利剑……若他此番比武夺冠，必当以一份与他那惊艳表现相配的赏赐来嘉奖于他。"
 agot_bells_of_war.0021.a:0 "真让人兴奋！"
 agot_bells_of_war.0022.t:0 "比武冠军"
 agot_bells_of_war.0022.desc:0 "欢快的乐声奏响，[champion.GetName]被加冕为本次比武大会的冠军！在击败[loser.GetName]之后，[champion.GetSheHe]已是无可争议的胜者，现在可以领取[champion.GetHerHis]的奖赏：黄金、名望，以及无尽的赞誉。"
 agot_bells_of_war.0022.desc_generic_aegon_bastard_flavor:0 "\n\n[champion.GetNamePossessiveNoTooltip]的表现堪称楷模。[champion.GetHerHis|U]的出色发挥不仅令我折服，也让我的封臣与廷臣们赞叹不已。在众人眼中，[champion.GetHerHim]算得上一个#italic 名副其实#!的坦格利安……而在我心中，[champion.GetHerHim]可是我最钟爱的[champion.Custom('DaughterSon')]，理应享有殊荣。"
 agot_bells_of_war.0022.a:0 "恭喜你，好好享受吧。"
 agot_bells_of_war.0022.generic_targaryen_description:0 "一场精彩绝伦的表现，配得上一份与坦格利安家族相称的奖赏！"
 agot_bells_of_war.0022.baelor_or_maekar_extra_snark:0 "[champion.GetFirstNameNoTooltip]是一个#italic 真正的#!战士，不像[champion.GetHerHis]的父亲。他必须为此得到一份奖赏！"
 agot_bells_of_war.0022.b:0 "[champion.GetFirstNameNoTooltip]当得起王室的恩宠#italic 与#!褒奖。"
 agot_bells_of_war.0022.c:0 "按常规来就行，不必太多。"
 agot_bells_of_war.0023.t:0 "比武风波"
 agot_bells_of_war.0023.desc:0 "自我将王室的恩宠与嘉奖授予[champion.GetName]以来，已有些时日。尽管[champion.GetSheHe]无疑配得上所获的每一项荣誉与赞美，但我的家族成员和朝臣们却对我的慷慨之举表示了难以置信与震惊。他们几乎不加掩饰地张扬着自己的妒意，仿佛这就能震慑到我。"
 agot_bells_of_war.0023.a:0 "谁在乎？我可是国王！"
 agot_bells_of_war.0024.t:0 "比武大会落幕"
 agot_bells_of_war.0024.a:0 "精彩！"
 agot_bells_of_war.0031.t:0 "奥斯托拉特掌权"
 agot_bells_of_war.0031.desc:0 "白日漫长，选票投下，科霍尔的未来系于其上——从许多方面来说，整个地区的未来也与其休戚相关。就在我等待之际，[ROOT.Char.Custom('IdleActivity')]，一名侍从带着消息向我走来：\n\n选举已然落幕，而我赢得了胜利！如今，我必须兑现我的竞选承诺……"
 agot_bells_of_war.0031.a:0 "告诉诺佛斯，科霍尔将与罗拉斯为敌。"
 agot_bells_of_war.0031.a_tt:0 "诺佛斯很快便会发动对抗罗拉斯的战争，而你将被作为盟友召唤。"
 agot_bells_of_war.0032.t:0 "埃卡纳掌权"
 agot_bells_of_war.0032.desc:0 "白日漫长，选票投下，科霍尔的未来系于其上——从许多方面来说，整个地区的未来也与其休戚相关。就在我等待之际，[ROOT.Char.Custom('IdleActivity')]，一名侍从带着消息向我走来：\n\n选举已然落幕，而我赢得了胜利！如今，我必须兑现我的竞选承诺……"
 agot_bells_of_war.0032.a:0 "告诉诺佛斯，科霍尔必将雪耻！"
 agot_bells_of_war.0033.t:0 "$agot_bells_of_war.0002.t$"
 agot_bells_of_war.0033.desc:0 "我的盟友[qohor_leader.GetName]已在科霍尔的选举中胜出。[qohor_leader.GetSheHe|U]已承诺即刻支援我们对罗拉斯发起进攻，以雪诺佛斯人在那位年轻征服者——[lorath_leader.GetNameNicknamed]总督手下所蒙受的耻辱。\n\n伟大的诺佛斯将再次奋起武装！"
 agot_bells_of_war.0033.a:0 "战钟鸣响"
 agot_bells_of_war.0034.t:0 "$agot_bells_of_war.0002.t$"
 agot_bells_of_war.0034.desc:0 "诺佛斯的[norvos_leader.GetName]已得知我在近日选举中获胜的消息，以及我重申的对罗拉斯作战的支持。[lorath_leader.GetNameNicknamed]的扩张野心已使其战线过度拉长，我们出手的时机已然成熟！"
 agot_bells_of_war.0034.a:0 "我听到了战争的钟声！"
 agot_bells_of_war.0034.a.tt:0 "你和[norvos_leader.GetNameNoTooltip]已成为同盟"
 agot_bells_of_war.0035.t:0 "诺佛斯‑科霍尔联盟"
 agot_bells_of_war.0035.desc:0 "一名侍从匆匆赶来禀报最新消息：[norvos_leader.GetName]与[qohor_leader.GetName]已结成同盟，妄图遏制我的征服。他们联合对罗拉斯宣战，企图夺回诺佛斯失去的领土。"
 agot_bells_of_war.0035.a:0 "可怕的消息。"
 agot_bells_of_war.0036.t:0 "科霍尔的进攻"
 agot_bells_of_war.0036.desc:0 "科霍尔的选举并未按计划进行。\n\n我的盟友[ostorlat.GetName]败给了[qohor_leader.GetName]——一位宣称自己从根本上就站在诺佛斯对立面的候选人。[qohor_leader.GetTitledFirstNameNoTooltip]就任后片刻未歇，已然对诺佛斯发动了攻势！"
 agot_bells_of_war.0036.a:0 "一场灾难。"
 agot_bells_of_war.0037.t:0 "计划落空"
 agot_bells_of_war.0037.desc:0 "科霍尔的选举结果终于传到了我耳中。\n\n我的盟友[ostorlat.GetName]败给了一位此前名不见经传的对手——[qohor_leader.GetName]。虽说我无法断言科霍尔将迎来怎样的命运，但我深知，如今诺佛斯只得独自面对洛罗拉斯了。"
 agot_bells_of_war.0037.a:0 "我必须立刻阻止罗拉斯。"
 agot_bells_of_war.0050.t:0 "战胜破盟者"
 agot_bells_of_war.0050.desc:0 "洛伊拿人联盟已战胜瓦兰提斯的破盟者。我们已将加尔·萨贡夺回自己手中。\n\n眼下的问题是，我们是应当解散联盟，还是合众为一。"
 agot_bells_of_war.0050.a:0 "解散联盟。"
 agot_bells_of_war.0050.b:0 "续延联盟。"
 agot_bells_of_war.0051.t:0 "战胜洛伊拿联盟"
 agot_bells_of_war.0051.desc:0 "我的大军为瓦兰提斯赢得了胜利。加尔·萨贡的威胁已被铲除，我已将洛伊拿人逐离了这片土地。"
 agot_bells_of_war.0051.a:0 "三执政会满意的。"
 agot_bells_of_war.0037.b:0 "我们独自毫无胜算。"
 agot_bells_of_war.0052.t:0 "洛伊拿联盟的终结"
 agot_bells_of_war.0052.desc:0 "confederation_leader.GetName]宣告了我们战胜瓦兰提斯叛徒的消息。\n\n随着战事终结，[confederation_leader.GetNameNoTooltip]已将加尔·萨贡据为封邑，并宣布洛伊拿联盟就此解散。[confederation_leader.GetSheHe|U]还声称，对我们这些昔日曾以盟友身份站在[confederation_leader.GetHerHis]身旁的少数人，亦可拥有统治之权。无论好坏，洛伊拿联盟的残余如今已在[confederation_leader.GetLadyLord|U][confederation_leader.GetNameNoTooltip]的领导下，整合为一个崭新的国度！"
 agot_bells_of_war.0052.a:0 "洛恩河上迎来了新的一天。"
 agot_bells_of_war.0009.t:0 "侍从比武大会"
 agot_bells_of_war.0009.desc:0 "[aegon_iv.GetName]在君临举办了一场侍从比武大会。他邀请了王国中众多有名望的侍从，我的儿子[baelor.GetName]和[maekar.GetName]亦在其列。参赛者中还有[daemon_blackfyre.GetName]，许多人相信他是我父亲那个未曾公开承认的儿子。\n\n我不清楚父亲究竟在盘算什么，但我知道，这对我们之间的关系绝非吉兆……"
 agot_bells_of_war.0009.a:0 "父亲到底在打什么算盘？"
 agot_bells_of_war.0010.t:0 "侍从比武大会"
 agot_bells_of_war.0010.desc:0 "[squire_tourney_participant.GetName]受邀参加在君临举行的盛大的侍从比武大会。全境各地最杰出的少年才俊将齐聚一堂，同场竞技，而[[squire_tourney_participant.GetFirstNameNoTooltip]将有机会在他们之中证明[squire_tourney_participant.GetHerselfHimself]。\n\n对一名侍从而言，能收到这样的邀请，实属难得。我心中不禁百感交集，既骄傲，又担忧。[​squire_tourney_participant.GetFirstNameNoTooltip]毕竟还年轻，而比武场上危机四伏。\n\n然而，这样的机会不容错过。若[squire_tourney_participant.GetFirstNameNoTooltip]能脱颖而出，或许便是一段锦绣前程的开端。"
 agot_bells_of_war.0010.two_squires_desc:0 "[​squire_tourney_participant.GetName]和[​squire_tourney_participant_2.GetName]均受邀参加在君临举行的盛大侍从比武大会。全境各地最杰出的少年才俊将齐聚一堂，同场竞技，他们二人皆有机会在他们之中证明自己。\n\n对侍从而言，能收到这样的邀请，实属难得。我心中不禁百感交集，既骄傲，又担忧。他们毕竟还年轻，而比武场上危机四伏。\n\n然而，这样的机会不容错过。若他们中任何一人能脱颖而出，或许便是一段锦绣前程的开端。\"
 agot_bells_of_war.0010.a:0 "为我们争光，[squire_tourney_participant.GetFirstNameNoTooltip]！"
 agot_bells_of_war.0010.two_squires_a:0 "为我们争光！"
 agot_bells_of_war.0024.squire_winner_desc:0 "[champion.GetName]在比武大会上力压群雄，击败了挡在[​champion.GetHerHis]身前的每一位挑战者，最终夺魁。看到[​champion.GetHerHim]摘下冠军的荣誉，我心中的骄傲无以复加。如此年纪便取得这般佳绩，实在不凡，我衷心希望这只是[​champion.GetHerHis]未来众多辉煌中的第一桩。"
 agot_bells_of_war.0024.squire_loser_desc:0 "[​champion.GetName]在比武大会上拔得头筹，证明了[​champion.GetHerselfHimself]乃是全境最杰出的少年战士。我的侍从[​my_squire.GetName]虽未能取得最终的胜利，但能在如此强劲的对手中同场竞技，[​my_squire.GetSheHe]仍可为之自豪。"
 agot_bells_of_war.0024.blackfyre_sword_reaction_desc:0 "\n\n国王已决意将那柄瓦雷利亚钢剑——黑火，赐予[​champion.GetNameNoTooltip]。这柄剑曾为征服者伊耿所执，代代相传于国王与王储之手。黑火不仅仅是一柄利刃，它更是坦格利安王权与正统的象征。"
 agot_bells_of_war.0024.daemon_reaction_desc:0 "\n\n国王已正式承认戴蒙为他的儿子，并选择以此为契机，将那柄瓦雷利亚钢剑——黑火，赐予了他。这柄剑曾为征服者伊耿所执，代代相传于国王与王储之手。黑火不仅仅是一柄利刃，它更是坦格利安王权与正统的象征。"
 agot_bells_of_war.0024.b:0 "真不幸……"
 agot_bells_of_war.0024.c:0 "父亲，您做了什么……"