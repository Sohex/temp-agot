l_simp_chinese:
 agot_trial_of_seven.0100.t:0 "向全境的主张"
 agot_trial_of_seven.0100.desc:0 "王冠才刚落到我头上，指控的声音便已公然响起。[accuser_leader.GetTitledFirstName]将我称为簒夺者，声称王国是被我强占所得，并要求对此进行审判。\n\n要求再清楚不过。一场七子审判。七名勇士对阵七名勇士，分别代表我与[accuser_leader.GetHersHis]的主张，我的统治权将取决于这场对决的结果。拒绝在很多人眼里等于是认罪，接受则意味着王国的命运将在这场战斗中决定。"
 agot_trial_of_seven.0100.desc.helper:0 "王冠才刚落到我头上，指控的声音便已公然响起。[accuser_leader.GetTitledFirstName]前来将我称为簒夺者，声称[true_heir.GetTitledFirstName]的继承权被我强占所得，并要求以[true_heir.GetSheHe]的名义进行七子审判。\n\n要求再清楚不过。七名勇士对阵七名勇士，分别代表我与他们的主张，我的统治权将取决于这场对决的结果。拒绝在很多人眼里会被视为畏惧，接受则意味着王国的命运将在这场战斗中决定。"
 agot_trial_of_seven.0100.desc.accuser:0 "王冠不安地落在[defender_leader.GetTitledFirstNamePossessive]的额头上，我绝不会让王国对此抱有任何幻想。在众领主与平民面前，我将明确指出[defender_leader.GetSheHe]统治的本质——篡夺者，并请求诸神与世人共同裁决。\n\n一场七子审判。七名勇士代表我与我将捍卫的权利，另外七名勇士代表那占据王座的人。让钢铁与信仰来决定那些言语所无法解决的事情。如果[defender_leader.GetSheHe]拒绝，整个王国都会明白那沉默意味着什么。"
 agot_trial_of_seven.0100.a:0 "让诸神来裁决[accuser_leader.GetSheHe]。"
 agot_trial_of_seven.0100.a.accuser:0 "愿七神见证。"
 agot_trial_of_seven.0101.t:0 "审判之路"
 agot_trial_of_seven.0101.desc:0 "我们自有办法让[crown_thief.GetTitledFirstName]为其篡逆之举付出代价。我可要求举行七子审判，将其罪名公之于众，在诸神与王国面前，为[crown_theft_king_legit_heir.GetTitledFirstNamePossessive]名正言顺的王位继承权而战。"
 agot_trial_of_seven.0101.a:0 "我会考虑的。"
 agot_trial_of_seven.0101.a.tt:0 "你现在可以向统治者提出七子审判的要求。"
 agot_trial_of_seven.9999.t:0 "决斗被拒绝"
 agot_trial_of_seven.9999.desc:0 "我的要求被拒绝了。[recipient.GetTitledFirstName]既不愿在战场上与我对峙，也不肯在全境面前与我一决高下。这番拒绝包裹着礼貌的言辞，可我听得见底下的真相。他们不敢以身犯险，不敢拔剑相向——只因兵刃一旦出鞘，说出的真相便太过响亮。"
 agot_trial_of_seven.9999.a:0 "我绝不会对此保持沉默。"
 agot_trial_of_seven.0103.t:0 "全境的审判"
 agot_trial_of_seven.0103.desc.legit_won:0 "审判已定，裁决分明。我与支持者一同败北，我的事业在所有见证者面前彻底瓦解。\n\n战场尸横遍野，王冠的代价以鲜血与钢铁铸就。如今王冠将传予[legit_heir.GetTitledFirstName]，其宣称权并非凭言语确立，而是从死亡手中夺取的胜利所印证。失去之物已在全境众目睽睽下重归原主，再无领主能质疑这场裁决的确定性。"
 agot_trial_of_seven.0103.desc.legit_won.usurper_died:0 "审判已定，裁决分明。[usurper.GetTitledFirstName]与拥护[usurper.GetHerHim]之人皆已殒命，[usurper.GetHerHis]的事业在所有见证者面前彻底溃败。\n\n战场尸骸枕藉，王冠的代价以鲜血与钢铁铸成。如今王位已传予[legit_heir.GetTitledFirstName]——其宣称权非凭言语，而是从死亡手中夺取的胜利所印证。被篡夺之物已在全境众目睽睽下重归正主，再无领主能质疑这场审判的公正。"
 agot_trial_of_seven.0103.desc.legit_helper_won:0 "审判已定，裁决分明。[legit_combatant.GetTitledFirstName]与其同伴击败了我和我的拥护者，我的事业在所有见证者面前彻底溃败。\n\n战场尸骸枕藉，王冠的代价以鲜血与钢铁铸成。如今王位已传予[legit_heir.GetTitledFirstName]——其宣称权非凭言语，而是从死亡手中夺取的胜利所印证。被篡夺之物已在全境众目睽睽下重归正主，再无领主能质疑这场审判的公正。"
 agot_trial_of_seven.0103.desc.legit_helper_won.usurper_died:0 "审判已定，裁决分明。[legit_combatant.GetTitledFirstName]与其同伴击败了[usurper.GetTitledFirstName]及其拥护者，[usurper.GetHerHis]的事业在所有见证者面前彻底溃败。\n\n战场尸骸枕藉，王冠的代价以鲜血与钢铁铸成。如今王位归于[legit_heir.GetTitledFirstName]，其宣称非凭言语，而是从死亡手中夺取的胜利所印证。被篡夺之物已在全境众目睽睽下重归正主，再无领主能质疑这场无可动摇的审判。"
 agot_trial_of_seven.0103.desc.legit_helper_won.legit_heir_died:0 "败局已定，我与我的勇士们一同倒下，然而即便胜利也无法带来明晰。[legit_heir.GetTitledFirstName]已然陨落，在审判权归于求索者之前便遭击溃。\n\n战场归于沉寂，未给生者丝毫慰藉。尽管[legit_heir.GetTitledFirstNameNoTooltip]未能活着见证王冠重归应许之首，但以鲜血与牺牲铸就的裁决已然成立。如今王位传予[final_heir.GetTitledFirstName]，其继承的不仅是王座，更是以生命为代价换取的正义之重负。"
 agot_trial_of_seven.0103.desc.legit_helper_won.legit_heir_died.usurper_died:0 "战场已吞尽它能吞没的一切。[usurper.GetTitledFirstName]与那些拥护[usurper.GetHerHim]的人一同倒毙于地，[legit_heir.GetTitledFirstName]亦然——未等裁决降临，便已殒命刀下。\n\n随之而来的沉默，无法给出任何答案。尽管[legit_heir.GetTitledFirstNameNoTooltip]未能活着见证王冠重归应许之首，但以鲜血与牺牲铸就的裁决已然成立。王冠传至[final_heir.GetTitledFirstName]手中，其继承的不仅是王座，更是以生命为代价换取的正义之重负。 "
 agot_trial_of_seven.0103.desc.usurper_won:0 "指控者们已然溃败。[legit_combatant.GetTitledFirstName]战败倒地，横尸沙场，[legit_combatant.GetHerHis]的事业就此终结。\n\n脚下的土地本身，便是反抗代价的无声见证。王冠岿然不动，那场本想将其掀翻的审判，未能动摇它分毫。指控已由刀剑作答，王国别无选择，唯有接受那历经考验却屹立不倒的统治。"
 agot_trial_of_seven.0103.desc.legit_helper_won.no_heir:0 "[legit_combatant.GetTitledFirstName]赢得了这场审判，然而[legit_heir.GetTitledFirstName]已然身陨，在这血腥屠戮中未曾留下任何子嗣，无人可去夺取那胜利果实。\n\n战场无言，唯余遍地尸骸与死寂。既然再无血脉来回应裁决，王冠便落到了我头上——非因凯旋，实乃万不得已。王国保住了它的统治者，但那苦苦追寻的正义，已与逝者一同埋葬。"
 agot_trial_of_seven.0103.desc.legit_heir_won_after_all:0 "钢剑出鞘，生命消逝，然而这场争斗的结局并未带来众人期盼的明朗。[usurper.GetTitledFirstName]已倒毙沙场，随着他的陨落，战局之变已非任何裁决所能定夺。\n\n七子审判并未以凯歌告终，而是在沉寂中落幕。尘埃落定后，[final_heir.GetTitledFirstName]坐上了王座。究竟是诸神真正裁决了此事，抑或只是静观其落入他人之手，唯有留待王国自行定论。"
 agot_trial_of_seven.0103.a:0 "我希望[final_heir.GetTitledFirstNameNoTooltip]能英明统治。"
 agot_trial_of_seven.0103.b:0 "耻辱。"
 agot_trial_of_seven.0103.c:0 "战至最后一刻的人，王国不会忘记。"
 agot_trial_of_seven.0103.d:0 "太多的流血，却没任何意义。"
 agot_trial_of_seven.0104.t:0 "七神的裁决"
 agot_trial_of_seven.0104.desc.legit_won:0 "审判已定，其裁决铭刻于残盾之上、浸血土中。[usurper.GetTitledFirstName]与拥护[usurper.GetHerHim]之人一同败亡，那窃取王冠的主张，已然在王国面前被剥得干干净净。\n\n沙场上尸骸相枕，正义的代价被刀剑与死亡写得明明白白。我将被夺走之物重新夺回——靠的并非法令，亦非谁人恩宠，而是因为我置之死地而后生。王冠于众位领主与见证者的注视下，重归其应有之位，再无人能质疑这场审判的公正。"
 agot_trial_of_seven.0104.desc.legit_helper_won:0 "我虽未立于战场之上，但此战却是以我之名义。[legit_heir_helper.GetTitledFirstName]与[legit_heir_helper.GetHerHis]的同伴于堂堂对阵中，击碎了篡位者的事业，终结了王冠所戴非人的谎言。\n\n这片战场以血和沉寂，偿付了真相的代价。我被人夺走之物，终归还是回到了我手中——不是靠我亲手去夺，而是靠那些在我力有未逮之时，替我扛起大业的勇士们。王国已得裁决，王冠依律律法与血统的本意，重归于我。\n\n我不会忘记那些替我立于战场之人。为了我的宣称得以存续，[legit_heir_helper.GetTitledFirstNameNoTooltip]赌上了性命与名誉，这份恩情之重，将随我一同登上王座。世人或许只看见了王冠的复归，唯我深知，这一切是用谁人的血换来。"
 agot_trial_of_seven.0104.desc.legit_helper_won.legit_heir_died:0 "胜利于战场之上赢得，却未能及时抵达。[legit_heir_helper.GetTitledFirstName]在众目睽睽之下粉碎了篡位者的事业，然而[legit_heir.GetTitledFirstName]未能活着看到这判决实现。\n\n沉默的战场无法带来慰藉。纵然受屈者已然逝去，裁决依然成立——以鲜血与牺牲封缄。如今王冠传至我手，它并非以胜利的姿态降临，而是笼罩在迟来的正义阴影之下——这份正义来得太晚，未能拯救它本应恢复之人。\n\n我所继承的，远不止一顶王冠。[legit_heir_helper.GetTitledFirstNameNoTooltip]曾在我家族大业的合法继承者力不能及之时，扛起了它，这份恩情不会随逝者消亡。从今往后，无论何人统治，都需铭记：在血脉与命运几近终结之际，是何人的勇气保全了它。"
 agot_trial_of_seven.0104.desc.usurper_won:0 "审判已定，裁决无情。那些曾为我的宣称挺身而出的人如今已被击倒，随之倒下的是以我之名提出的指控。\n\n言语既钝，刀剑方鸣。[usurper.GetTitledFirstName]依然稳坐王位，我的挑战在王国面前被剥夺了所有合法性。王冠未易其主，那曾使这片战场染血的指控，也随亡者一同埋葬。"
 agot_trial_of_seven.0104.a:0 "此事已定。"
 agot_trial_of_seven.0105.t:0 "$agot_trial_of_seven.0104.t$"
 agot_trial_of_seven.0105.desc.legit_heir_won_after_all:0 "篡位风波之后，一道七子审判的消息传至王国各处——这是一场绝望的武力申辩，意在推翻对[main_title.GetNameNoTier]的占据。勇士们被选定，刀剑出鞘，血流成河。\n\n然而，在审判真正定论之前，死亡悄然介入。[usurper.GetTitledFirstName]在厮杀中丧命，令这场审判戛然而止，失去意义。随着篡夺者的死去，[main_title.GetNameNoTierNoTooltip]依照常规继承顺序传至[final_heir.GetTitledFirstName]，而非审判裁决。\n\n战场上尸横遍野，王国上下苦痛地认识到：这场审判并未改变一切，除了死亡。"
 agot_trial_of_seven.0105.desc.legit_won:0 "在[main_title.GetNameNoTier]被[usurper.GetTitledFirstName]夺取之后，一场七子审判被召集，旨在神与人面前裁决此罪行。指控与刀剑相迎，王冠的命运被置于血染的战场之上。\n\n审判现已做出裁决。[legit_heir.GetTitledFirstName]作为指控者之一站出来，并在公开战斗中获胜，粉碎了[usurper.GetTitledFirstNamePossessiveNoTooltip]的事业。[main_title.GetNameNoTierNoTooltip]已重归至其合法持有者手中，这并非通过法令或妥协，而是通过整个王国共同见证的胜利铸就。\n\n从宫廷到乡间，这一判决被视为既定事实，王冠的代价并非以言辞衡量，而是以生命换取。"
 agot_trial_of_seven.0105.desc.legit_helper_won:0 "篡权风波之后，对[main_title.GetNameNoTier]的合法宣称并未诉诸议政厅，而是被带到了战场之上。一场七子审判就此召开，召唤勇士们以鲜血回应窃取之罪。\n\n如今战场已给出答案。[legit_combatant.GetTitledFirstName]击败了[usurper.GetTitledFirstNamePossessive]的勇士们，粉碎了非法窃取王冠的根基。尽管[final_heir.GetTitledFirstName]并未站在参战者之列，但裁决支持了[final_heir.GetHerHim]。\n\n根据审判的裁定，[main_title.GetNameNoTierNoTooltip]易主，曾经分裂王国的指控，在一切前来观战者的注视下得到了最终的回答。"
 agot_trial_of_seven.0105.desc.usurper_won:0 "[main_title.GetNameNoTier]被夺走后，有人发起七子审判，旨在挑战[usurper.GetTitledFirstNamePossessive]的统治权。[legit_combatant.GetTitledFirstNamePossessive]与指控者指定了各自的勇士，举国齐聚，要看刀剑能否终结野心攫取的权柄。\n\n然而，这场审判以寻求裁决者的失败告终。对抗王权的勇士倒下了，以[legit_heir.GetTitledFirstName]之名发起的指控也在决斗场上被彻底推翻。\n\n[main_title.GetNameNoTierNoTooltip]依旧掌握在[usurper.GetTitledFirstNameNoTooltip]手中。指控被撤销，王国只得接受这场浴血考验后仍屹立不倒的统治。"
 agot_trial_of_seven.0105.desc.legit_helper_won.no_heir:0 "在[main_title.GetNameNoTier]被[usurper.GetTitledFirstName]夺取后，一场七子审判应召而来，旨在收复失土。勇士们响应指控，王冠的命运就此交付战场。\n\n胜利已于兵刃之间斩获。在各地见证者面前，[legit_combatant.GetTitledFirstName]击碎了[usurper.GetTitledFirstNamePossessiveNoTooltip]的诉求。然而裁决之下，竟无应得之人。[legit_heir.GetTitledFirstName]未及亲见审判结果便已离世，并无继承人可领受此判决。\n\n既无继承人能从胜利中获益，[main_title.GetNameNoTierNoTooltip]便仍由[final_usurper.GetTitledFirstName]执掌。这场审判之所以被铭记，并非因其收复了什么，而是因其吞噬了诸多生命，却未能改变王冠的归属。"
 agot_trial_of_seven.0105.a:0 "此事已定。"
 agot_trial_of_seven.0200.t:0 "全境的审判"
 agot_trial_of_seven.0200.desc.defender.against_accuser:0 "无论是否戴着锁链，我仍主张比武审判的权利，坚信刀剑与荣耀或许能为我赢回自由。然而，[accuser_ruler.GetTitledFirstName]却断绝了这条道路。在宫廷与王冠面前，[accuser_ruler.GetSheHe]竟提出了更宏大的裁决——七子审判。\n\n七位勇士将为[accuser_ruler.GetHerHis]而战，另七位为我而战。本可凭双刃了结的纷争，如今要在神明与王国的注视下衡量。这究竟是正义还是暴行，战场自会给出答案。"
 agot_trial_of_seven.0200.desc.defender.against_accuser_kin:0 "我要求的只是一柄利刃，和一个公正的机会来回应对我的指控。然而，[accuser_ruler.GetTitledFirstNamePossessive]的亲属[accuser_candidate_kin.GetTitledFirstName]却站了出来，以王冠之名要求举行七子审判。这本该是一场骑士决斗，如今却成了整个王国都将瞩目的盛景。\n\n现在必须找到七位勇士为我并肩而立，否则交锋之前，我的基业就会败亡。傲慢和权位把是非拧成了说不清的烂账，唯有刀剑能决。"
 agot_trial_of_seven.0200.desc.accuser:0 "[defender_leader.GetTitledFirstName]身陷囹圄之中，要求以比武审判来回应针对[defender_leader.GetHerHim]的指控。一场决斗即可迅速了结此事，却未必能干净利落。\n\n宫廷中有人私语，认为涉及王冠的争端不该仅凭一把剑来裁决。我可以准许[defender_leader.GetSheHe]所要求的比武审判……亦或拒绝，改为七子审判。"
 agot_trial_of_seven.0200.a:0 "很好，那就让[accuser_candidate_kin.GetFirstNameNoTooltip]发起七子审判。"
 agot_trial_of_seven.0200.b:0 "这件事由我决定，我要求进行七子审判。"
 agot_trial_of_seven.0200.c:0 "我允许[defender_leader.GetTitledFirstNameNoTooltip]进行比武审判。"
 agot_trial_of_seven.0200.d:0 "我们七人并肩作战。"
 agot_trial_of_seven.0200.a.tt:0 "此选项将开始七子审判，而非比武审判。"
 agot_trial_of_seven.0201.t:0 "七子陨落"
 agot_trial_of_seven.0201.desc.defender_won_default.accuser_pov:0 "结束了。七子审判已宣布不利于我的裁决，战场也否定了我所企图逃避的一切。我的勇士们或死或伤，而[tos_final_accused.GetTitledFirstName]在诸神与王国面前证明了清白。\n\n这样的胜利无法掩盖。领主们会牢记究竟是谁取得了胜利，而平民们将传颂这个故事，直到它成为真相。无论我曾想对[tos_final_accused.GetHerHim]施加怎样的判决，它都已回落在我自己头上。"
 agot_trial_of_seven.0201.desc.defender_won_accuser_died.accuser_pov:0 "七子审判以血与废墟告终，而我只能凝视这代价。[tos_final_accuser.GetTitledFirstNamePossessive]的事业已在战场上落败，[tos_final_accuser.GetSheHe]未能再次站起来。[tos_final_accused.GetTitledFirstName]成为了胜利者，王国上下皆已见证。\n\n如今宫廷的目光从战场转向了后续。凭借刀剑与七神的意志，[tos_final_accused.GetTitledFirstName]获得了昭雪。无论曾针对[tos_final_accused.GetHerHim]的指控是什么，都得到了答案，而王国上下皆目睹了神明昭然若揭的裁决。"
 agot_trial_of_seven.0201.desc.accuser_won_defender_died.accuser_pov:0 "七子审判已落幕，[tos_final_accused.GetTitledFirstName]再也说不出反抗的话语。战场夺走了[tos_final_accused.GetHerHim]应付的代价，最后一击落下时，我的勇士们依然屹立。\n\n有人会称此为正义，也有人会说这不过是披着合法外衣的强权。让他们议论去吧。王国上下亲眼目睹了神明的裁决，而死者从不争辩判决。"
 agot_trial_of_seven.0201.desc.defender_won_default.defender_pov:0 "七子审判已落幕，我依然活着。面对王冠与审判的重压，我的勇士们挺身而立，战场给出了答案。在诸神与王国面前，我的信念已被证明比那些本该囚禁我的锁链更为坚韧。\n\n但胜利从来都不是干净的。大地沾染着胜利的代价，垂死之人的惨叫比任何欢呼声都更久远地回荡。尽管如此…… 我已摆脱他们的判决，整个王国都已见证。"
 agot_trial_of_seven.0201.desc.defender_won_accuser_died.defender_pov:0 "七子审判已然落幕，诸神以无可置疑的声音给出了裁决。我的勇士们守住了战场，[tos_final_accuser.GetTitledFirstName]在钢铁的夹击下殒命。王冠的裁决随[tos_final_accuser.GetHerHim]一同消亡。\n\n战场此刻归于沉寂，其判决已化作法律与记忆。凭诸神之意，凭我勇士之力，我洗清了所有指控。反对我的一切言论已在刀剑下得到回答，无人能否认这一胜诉的裁决。"
 agot_trial_of_seven.0201.desc.defender_won_accuser_died.inherited_crown_pov:0 "七子审判已然落幕，那个曾横亘于我与王冠之间的人，也随之逝去。[tos_final_accuser.GetTitledFirstName]倒于战场之上，而统治的重担则落到我肩——并非经由平稳的继承，而是通过鲜血与裁决。\n\n我踏上这片战场，不为王座，只为讨一个公道。然而刀剑无情，竟将两者一并交予我手。诸神既于万众之前明示，我从这场审判中崛起，非但洗清了污名，更被那本想摧毁我的判决，亲手加冕。"
 agot_trial_of_seven.0201.desc.defender_won_default.observer_pov:0 "七子审判已落幕，胜者昭然若揭。[tos_final_accused.GetTitledFirstName]大获全胜，其勇士仍屹立不倒，而[tos_final_accuser.GetTitledFirstNamePossessive]已然折戟。\n\n王国上下将传颂此事多年。此类审判本就罕见，而结果同时牵涉权力与惩罚更是少之又少。囚徒的诉求已成众人目睹的裁决，此事无人会轻易忘却。"
 agot_trial_of_seven.0201.desc.defender_won_accuser_died.observer_pov:0 "七子审判以尸骸写下的判决落下帷幕。[tos_final_accused.GetTitledFirstName]获胜，而[tos_final_accuser.GetTitledFirstName]与倒下的勇士们一同殒命沙场。\n\n随着[tos_final_accuser.GetTitledFirstNameNoTooltip]陨落，这场审判已不容置疑。在诸神与凡人面前，[tos_final_accused.GetTitledFirstNameNoTooltip]得以昭雪，所有对[tos_final_accused.GetHerHim]的指控皆在众目睽睽之下得到了回应。昔日以言辞争辩之事，如今已由刀剑定论。"
 agot_trial_of_seven.0201.desc.accuser_won_defender_died.observer_pov:0 "七子审判以[tos_final_accused.GetTitledFirstName]战死告终。[tos_final_accuser.GetTitledFirstNamePossessive]的勇士们屹立不倒，囚犯的诉求也随之与[tos_final_accused.GetHerHim]一同消亡。\n\n有人宣称神明已然昭示天意，亦有人坚称诸神不过冷眼旁观。无论孰是孰非，已然有人以性命为代价，换来追问真相的资格，而王国，亦将永远铭记这份沉重代价。"
 agot_trial_of_seven.0201.desc.defender_won_accuser_died.inherited_crown_observer_pov:0 "七子审判的结局，即便是最心软的吟游诗人也无从下笔修饰——[tos_final_accuser.GetTitledFirstName]战死沙场，而曾经沦为阶下囚的那一位，如今在神明与凡人面前，以正统统治者的姿态屹立。\n\n始于裁决的诉求，终成王冠的易主。刀剑已对指控与继承做出回应，凡目睹者皆知：此座王位非悄然窃取，而是在七神注视下，以血搏来的荣耀。"
 agot_trial_of_seven.0201.a:0 "诸神已作出裁决。"
 agot_trial_of_seven.0202.t:0 "黑暗中的访客"
 agot_trial_of_seven.0202.desc:0 "高墙内的时间过得极慢，只有远处隐约的脚步声和不辨源头的水滴声能划破这份凝滞。当牢门终于打开时，我本以为来的会是另一个守卫……却没想到是张熟悉的面孔。\n\n[tos_friend.GetTitledFirstName]踏入幽暗的灯光中，有那么一瞬间，我不知该微笑还是咒骂这景象。[tos_friend.GetSheHe|U]虽是囚禁我的家族一员，但[tos_friend.GetHerHis]眼中却没有那家族的强硬。我们压低声音交谈，提防隔墙有耳，直到最后[tos_friend.GetSheHe]承诺会替我去向[tos_imprisoner.GetTitledFirstName]求情。\n\n这或许是件小事——不过是把几句话，从一个厅堂传到另一个厅堂——可当你一无所有时，就连小小的承诺也变得弥足珍贵。"
 agot_trial_of_seven.0202.a:0 "我将坚守那份希望。"
 agot_trial_of_seven.0203.t:0 "王冠之前"
 agot_trial_of_seven.0203.desc:0 "一名守卫前来找我。我本以为是又一次审问。然而，他们把我带到了一间小室里，我的[SCOPE.sC('tos_prisoner').Custom2('RelationToMeShort', SCOPE.sC('tos_friend'))]、[tos_friend.GetTitledFirstName]，正在那里等候。[tos_friend.GetSheHe|U]没有浪费时间寒暄。[tos_friend.GetSheHe]告诉我，如果我想带着荣誉干干净净地离开这里，就必须准备好为此而战。\n\n比武审判或许是我唯一的出路。唯一能赢得[tos_imprisoner.GetTitledFirstName]尊重的语言并非言辞，而是刀剑。很快，守卫带领我们向前走去，进入了一个更大的厅堂，[tos_imprisoner.GetTitledFirstNameNoTooltip]和聚集的廷臣们正在那里等待我的答复。众目睽睽，所有人都在等着听我究竟会提出什么要求……如果，我会的话。"
 agot_trial_of_seven.0203.a:0 "我要求比武审判。"
 agot_trial_of_seven.0203.b:0 "我不会让这变成一场闹剧。"
 agot_trial_of_seven.0203.b.tt:0 "你被押送回地牢。"
 agot_trial_of_seven.1000.t:0 "七神的勇士"
 agot_trial_of_seven.1000.desc:0 "七子审判即将开始。当剑拔出之时，我必须确定谁将前来支持我的主张。\n\n如果我无法找到另外六人为我而战，那么审判无需开始便能宣告结束，而罪名也将归咎在我头上。\n\n已有数位骑士愿意效劳，我必须从中择定谁将与我并肩出战。"
 agot_trial_of_seven.1000.desc.lost_before_started:0 "沉寂不断蔓延，无人打破。再也没有勇士站出来与我并肩，没有七人应战，这场审判便无法进行。\n\n依照律法与习俗，指控无人辩驳，我被判有罪。"
 agot_trial_of_seven.1000.desc.helper_knight.a:0 "沉默如铁，沉重不破。最终，[helper_knight.GetTitledFirstName]踏前一步，将自己与人群分离开来，以其佩剑，献于吾业。"
 agot_trial_of_seven.1000.desc.helper_knight.b:0 "起初无人动弹。随后[helper_knight.GetTitledFirstName]挺身而出，宣告愿为我而战。"
 agot_trial_of_seven.1000.desc.helper_knight.c:0 "沉默片刻，[helper_knight.GetTitledFirstName]上前一步，将佩剑轻轻放在我的身侧。"
 agot_trial_of_seven.1000.desc.helper_knight.d:0 "所有的目光都紧紧盯着人群，直到[helper_knight.GetTitledFirstName]独自上前，打破沉寂，愿以手中之剑，为我而战。"
 agot_trial_of_seven.1000.desc.helper_knight.e:0 "良久，无人动弹。随后，一个身影——[helper_knight.GetTitledFirstName]——打破沉默，从人群中迈步而出，拔剑为我而战。"
 agot_trial_of_seven.1000.desc.helper_squire:0 "沉默仿佛要将这一刻彻底吞噬，直到一位年轻的侍从，[helper_knight.GetTitledFirstName]，从人群边缘走了出来。[helper_knight.GetHerHis]的声音中带着犹豫，却没有恐惧。\n\n[helper_knight.GetSheHe]在我面前单膝跪下，低下头，声音清晰，以至于能让所有人都能听见。\n\n#EMP “[the_other_leader.GetTitledFirstNameNoTooltip]，请册封我为骑士……我将与您并肩作战。#!”"
 agot_trial_of_seven.1000.a:0 "极好的选择。"
 agot_trial_of_seven.1000.a.buy:0 "金钱比沉默更能说服。"
 agot_trial_of_seven.1000.a.tt:0 "你选择的勇士将为你方而战。\n"
 agot_trial_of_seven.1000.a.lost_before_started:0 "我的命运已经注定。"
 agot_trial_of_seven.1000.a.need_new_char:0 "谁愿起身与我并肩作战？"
 agot_trial_of_seven.1000.a.squire_approved:0 "起身吧，[helper_knight.GetFirstNameNoTooltip]，为我而战。"
 agot_trial_of_seven.1000.a.squire_approved.tt:0 "#EMP 以战士之名我要求你勇敢。以天父之名我要求你公正。以圣母之名我要求你保护弱者和无辜之人。以少女之名我要求你保护所有妇女。\n#!"
 agot_trial_of_seven.1000.b.squire_denied:0 "我不该这样。"
 agot_trial_of_seven.1000.b.squire_denied.tt:0 "如果没有足够的勇士，七子审判将无法开始，你将被判有罪。"
 agot_trial_of_seven.1001.t:0 "七子对决"
 agot_trial_of_seven.1001.t.accusers:0 "$agot_trial_of_seven.1002.t$：[accuser_leader.GetTitledFirstNameNoTooltip]与指控者"
 agot_trial_of_seven.1001.t.defenders:0 "$agot_trial_of_seven.1002.t$：[defender_leader.GetTitledFirstNameNoTooltip]与[defender_leader.GetHerHis]的勇士"
 agot_trial_of_seven.1001.desc:0 "在全境的注视下，古老的七子审判再次被召集。现在，任何领主的命令或国王的旨意都无法平息这场纷争，唯有各自将七把利剑指向双方的罪名，而诸神将通过钢铁与鲜血做出裁决。指控者与被指控者对峙而立，他们的命运与以他们之名而战的勇士们紧紧绑在一起。让这片土地见证一切，当最后一把剑沉寂落地时，诸神将宣判：谁站在了真理一边，谁站在了罪恶一边。\n\n#EMP [oth_1.GetTitledFirstName]与[oth_5.GetTitledFirstName]、[oth_4.GetTitledFirstName]、[oth_2.GetTitledFirstName]、[oth_3.GetTitledFirstName]、[oth_6.GetTitledFirstName]和[oth_7.GetTitledFirstName]并肩作战。\n\n面对他们的是[roy_1.GetTitledFirstName]、[roy_5.GetTitledFirstName]、[roy_4.GetFirstName]、[roy_2.GetTitledFirstName]、[roy_3.GetTitledFirstName]、[roy_6.GetTitledFirstName]以及[roy_7.GetTitledFirstName]。#!"
 agot_trial_of_seven.1001.a:0 "让诸神来裁决。"
 agot_trial_of_seven.1001.a.second:0 "让七子审判开始吧。"
 agot_trial_of_seven.1002.t:0 "七子审判"
 agot_trial_of_seven.1002.desc.usurpation:0 "流言迅速传遍了宫廷与营帐。一场七子审判已被召集，[the_other_leader.GetTitledFirstName]公然指控[the_royal_leader.GetTitledFirstNamePossessive]的崛起为篡位之举，并要求其在神与人面前接受裁决。\n\n此类审判本就罕见，而当王冠与宣称权相互对立时则更为稀有。贵族们窃窃私语，传言说勇士们已然聚集，每一柄利刃皆已立誓，要辨明哪位统治者占据真理，哪位浑身罪孽。很快，刀剑将决定内阁无法裁决之事。"
 agot_trial_of_seven.1002.desc.imprisonment:0 "消息传得飞快：原本不过是要求比武审判，如今已演变成一场更为浩大的争端。在[the_other_leader.GetTitledFirstName]请求以单挑回应[the_royal_leader.GetTitledFirstNamePossessive]判决后，王室不仅断然拒绝，反而宣布举行七子审判。\n\n世人或赞此举为大胆，或斥之为残酷——毕竟这类审判将纷争化作举国瞩目的盛大场面。而今各方勇士云集，不消多时，七柄利刃对阵七柄利刃，将决定单凭言语无法裁定的命运。"
 agot_trial_of_seven.1002.a:0 "我将密切关注审判。"
 agot_trial_of_seven.1002.a.tt:0 "你将获知七子审判的后续。"
 agot_trial_of_seven.1002.b:0 "这不关我的事。"
 agot_trial_of_seven.1003.t:0 "$agot_trial_of_seven.1000.t$"
 agot_trial_of_seven.1003.desc.need_more_knights.a:0 "人数还不够。我还没有回答指控所需的七人，审判无法照此进行。\n\n重压从四面八方涌来，人数反复点数，却仍然不足够。如果要推进这场审判，就必须找到更多的勇士。否则，裁决将在没有刀剑见证的情况下作出。"
 agot_trial_of_seven.1003.desc.need_more_knights.b:0 "注视我的目光并没有任何回应。挺身而出者寥寥无几，所需人数仍未凑齐。\n\n人群窃窃私语，有好奇，有刻薄，沉默在不断蔓延。在更多人站出来之前，七子审判悬而未决，在所有旁观者的注视下保持着微妙的平衡。"
 agot_trial_of_seven.1003.desc.need_more_knights.c:0 "律法昭然，而人数未齐。若无七人并肩而立，指控便无从应答。\n\n古老习俗的箴言在我脑海中回响——那是许久前习得的道理，我从未想过会以这般方式经受考验。若审判要继续推进，必须寻得更多勇士为我而战，否则律法将毫不留情地宣判我的命运。"
 agot_trial_of_seven.1003.desc.need_more_knights.d:0 "眼前之人仍不足数。七名勇士尚未聚齐，这一刻便只能悬而未决。\n\n每一瞬，都让人群的目光愈发紧绷，他们都在等待是否还有人会挺身而出。若再无人站到我身边，这场审判便无法进行，结局将在此时此刻决定。"
 agot_trial_of_seven.1003.desc.need_more_knights.e:0 "沉默回应了我的呼唤。那些愿意站出来的人已经挺身而出，没有其他人加入他们。\n\n在一瞬间，疑虑比任何刀刃都更深刻，我想知道这是否是我事业的终点。如果想要更多勇士，就必须主动寻找他们，否则沉默本身就是我的答案。"
 agot_trial_of_seven.1003.a.honorable.a:0 "谁愿意与正义并肩作战？"
 agot_trial_of_seven.1003.a.honorable.b:0 "这里就没有人再相信正义了吗？"
 agot_trial_of_seven.1003.a.honorable.c:0 "难道没有人愿意为正义而战了吗？"
 agot_trial_of_seven.1003.a.honorable.d:0 "难道没有骑士还记得誓言吗？"
 agot_trial_of_seven.1003.a.honorable.e:0 "你们中就没有一位真正的骑士吗？！"
 agot_trial_of_seven.1003.a.greedy.a:0 "要出什么价才能换得你们的剑？"
 agot_trial_of_seven.1003.a.greedy.b:0 "谁愿意为好的报酬而战？"
 agot_trial_of_seven.1003.a.greedy.c:0 "难道没人愿意用勇气换取报酬吗？"
 agot_trial_of_seven.1003.a.greedy.d:0 "谁愿意为黄金献上自己的剑？"
 agot_trial_of_seven.1003.a.greedy.e:0 "你们中谁愿意为合理的价钱而战？"
 agot_trial_of_seven.1003.a.dishonorable.a:0 "你们就那么害怕战斗吗？"
 agot_trial_of_seven.1003.a.dishonorable.b:0 "有谁会在我呼唤时回应？"
 agot_trial_of_seven.1003.a.dishonorable.c:0 "难道没有配得上与我并肩作战的人吗？"
 agot_trial_of_seven.1003.a.dishonorable.d:0 "难道我面前的都是些懦夫吗？"
 agot_trial_of_seven.1003.a.dishonorable.e:0 "你们当中谁愿意为我站出来？"
 agot_trial_of_seven.1004.t:0 "没有钢铁的审判"
 agot_trial_of_seven.1004.desc:0 "挑战未及应战便已搁浅。[leader_lost_before_started.GetTitledFirstName]未能集齐同[leader_lost_before_started.GetHerHim]并肩作战的六位勇士，七子审判无从进行。\n\n依律法与惯例，指控无人应辩。罪责落定于[leader_lost_before_started.GetHerHim]身上，此事尘埃落定，竟无须一刀一剑。"
 agot_trial_of_seven.1004.a:0 "让[leader_lost_before_started.GetHerHim]从我眼前消失。"
 agot_trial_of_seven.0101.desc.legit_heir:0 "或许我当初接受这一切，太过草率了。[crown_thief.GetTitledFirstName]窃居本应属于我的王座，而整个王国却都假装此事已尘埃落定。但我尚有另一条路可走——一场七子审判可将这篡位之罪公之于众，让兵刃与诸神共同裁决——我的继承权，是否真的被人窃取。"
 agot_trial_of_seven.0103.desc.legit_heir_won_after_all.legit_heir:0 "钢剑出鞘，生命消逝，然而这场争斗的结局并未带来众人期盼的明朗。[usurper.GetTitledFirstName]已倒毙沙场，随着他的陨落，战局之变已非任何裁决所能定夺。\n\n七子审判并未以凯歌告终，而是在沉寂中落幕。尘埃落定后，我坐上了王座。究竟是诸神真正裁决了此事，抑或只是静观其落入他人之手，唯有留待王国自行定论。"
 agot_trial_of_seven.0103.desc.legit_heir_won_after_all.usurper:0 "钢剑出鞘，生命消逝，然而这场争斗并未如众人所愿那般尘埃落定。[legit_heir.GetTitledFirstName]已倒毙沙场，随着他的陨落，战局的走向发生了任何裁决都无法带来的剧变。\n\n七子审判并未以胜利告终，而是在沉寂中落幕。一切尘埃落定，如今我坐上了王座，究竟诸神是已然作出了审判，还是仅仅冷眼旁观，让一切落入他人之手，就任有王国去评说吧。"
 agot_trial_of_seven.0200.desc.accuser_kin.start:0 "我的囚犯[defender_leader.GetTitledFirstName]要求比武审判，其想用一柄剑来了结此事。我本已打算应允，不料[accuser_candidate_kin.GetTitledFirstName]走到庭前宣称，这等纷争绝非一场决斗就能了断。"
 agot_trial_of_seven.0200.desc.accuser_kin.end:0 "[accuser_candidate_kin.GetSheHe]转而要求举行七子审判，主张由七名勇士代表王权出战，七名勇士与之对抗。此刻宫廷上下皆在观望，静待我是否准许族人推进此事……抑或亲自执掌大局。"
 agot_trial_of_seven.0200.desc.accuser_kin.end.from_tbc:0 "[accuser_candidate_kin.GetSheHe]要求进行七子审判，主张由七名勇士代表王权出战，七名勇士与之对抗。此刻宫廷上下皆在观望，等待我决定是否允许亲族推进此事……或是亲自执掌大局。"
 agot_trial_of_seven.0200.desc.accuser.from_tbc:0 "[defender_leader.GetTitledFirstName]，现被羁押于我的监管之下，其要求以比武审判来回应对[defender_leader.GetHerHim]的指控。一场单人对决固然能迅速了结此事，却未必总能彻底解决。\n\n宫廷中有人私言，牵涉王权的纷争，其分量远非一柄利剑所能承载。他们的谏言已被采纳。此事将不再以单人决斗，而是通过一场在诸神与王国共同见证下的七子审判来了结。"
 agot_trial_of_seven.0200.desc.accuser_kin.start.from_tbc:0 "我的囚犯[defender_leader.GetTitledFirstName]，要求进行比武审判，试图用一把剑来解决此事。我正要宣布此事将以七子审判的方式了结，这时[accuser_candidate_kin.GetTitledFirstName]却在法庭上抢在我之前站了出来。"
 agot_trial_of_seven.0200.a.tt.from_tbc:0 "七子审判开始了……"
 agot_trial_by_combat.1000.f:0 "我要求进行七子审判。"
 agot_trial_of_seven.0200.b.from_tbc:0 "那就各自召唤勇士"
 agot_trial_of_seven.0200.b.generic:0 "$agot_trial_by_combat.1000.f$"
 accuser_kin_plotting:0 "\n\n“[defender_leader.GetTitledFirstNameNoTooltip]在暗中对我图谋不轨，我要在光天化日之下予以审判。”\n\n"
 accuser_kin_abduction:0 "\n\n“[defender_leader.GetTitledFirstNameNoTooltip]想在暗中将我绑架，我要让王国见证这件事将如何了结。”\n\n"
 accuser_kin_murder:0 "\n\n“[defender_leader.GetTitledFirstNameNoTooltip]想在暗地里置我于死地，如果注定要死亡，那便让诸神见证这一切。”\n\n"
 accuser_kin_torture:0 "\n\n“[defender_leader.GetTitledFirstNameNoTooltip]拿我的痛苦取乐，我不会让这事仅以一刀了结。”\n\n"
 accuser_kin_maimed:0 "\n\n“看清楚，[defender_leader.GetTitledFirstNameNoTooltip]对我做了些什么，无法言说的话，七子的剑将代替我发声。”\n\n"
 accuser_kin_stole:0 "\n\n“[defender_leader.GetTitledFirstNameNoTooltip]偷走了本该属于我的东西，我不会就被几句借口打发走。”\n\n"
 accuser_kin_sabotage:0 "\n\n“[defender_leader.GetTitledFirstNameNoTooltip]在最关键时刻背叛了我，让诸神来裁决这份背信弃义。”\n\n"
 accuser_kin_slander:0 "\n\n“[defender_leader.GetTitledFirstNameNoTooltip]将我的名誉践踏在脚下。我要的判决，必须让整个王国都清楚看见。”\n\n"
 accuser_kin_imprison:0 "\n\n“[defender_leader.GetTitledFirstNameNoTooltip]将我戴上镣铐，如果需要审判，就让它以正当的方式进行。”\n\n"
 accuser_kin_banished:0 "\n\n“[defender_leader.GetTitledFirstNameNoTooltip]将我驱逐，仿佛我一文不值。就让这一切在众人面前得到回应。”\n\n"
 accuser_kin_deposed:0 "\n\n“[defender_leader.GetTitledFirstNameNoTooltip]想要毁掉正义的秩序，七位勇士将去捍卫它。”\n\n"
 accuser_kin_child_kill:0 "\n\n“[defender_leader.GetTitledFirstNameNoTooltip]夺去了我的孩子，我不会让这事这么悄无声息地了结。”\n\n"
 accuser_kin_execute:0 "\n\n“[defender_leader.GetTitledFirstNameNoTooltip]亵渎了正义。既然律法已无法裁决，便让诸神来定夺。”\n\n"
 accuser_kin_mute:0 "\n\n[accuser_candidate_kin.GetTitledFirstNameNoTooltip]一拳砸在桌上，匆匆在一片羊皮纸上写下了进行七子审判的要求。\n\n"
 accuser_kin_tried_to_aith_me:0 "\n\n“[defender_leader.GetTitledFirstNameNoTooltip]想把我吃掉，我倒希望诸神能裁定那是否得当。”\n\n"
 accuser_kin_sacrifice:0 "\n\n“[defender_leader.GetTitledFirstNameNoTooltip]想把我当黑暗仪式上的祭品，让诸神来回应这一切吧。”\n\n"
 accuser_kin_beaten:0 "\n\n“[defender_leader.GetTitledFirstNameNoTooltip]毫不留情地殴打过我。今天，我不会让[defender_leader.GetHerHim]轻易得到答复。”\n\n"
 accuser_kin_insane:0 "\n\n“一把刀完全不够！七把！七把才能取悦七神！”\n\n"
 agot_trial_of_seven.0202.b:0 "我不需要你们家族的人情。"
 agot_trial_of_seven.1000.desc.sellsword:0 "沉默持续的时间比我预想的要长。最终，一位目光锐利的战士从人群中走出，直到我将赏金明说，他才停下脚步。\n\n刀剑向来效忠多方，而今日黄金足以让其中一柄为我所用。"
 agot_single_combat.0031.b:0 "这还没有结束。"
 agot_trial_of_seven.0204.t:0 "慈悲之举"
 agot_trial_of_seven.0204.desc:0 "[tos_friend.GetTitledFirstName]来到我面前，提出了一个既大胆又令人为难的请求。[tos_friend.GetSheHe]措辞谨慎、语调沉稳，恳求我释放[tos_prisoner.GetTitledFirstName]。\n\n[tos_friend.GetSheHe|U]声称此事已造成足够损害，此刻施以仁慈方能避免更多麻烦。然而囚犯的锁链鲜少无故解开，宫廷之上众人侧目，正注视着我将如何回应。"
 agot_trial_of_seven.0204.a:0 "很好，让[tos_prisoner.GetHerHim]走吧。"
 agot_trial_of_seven.0204.b:0 "自由自有其价，支付便是。"
 agot_trial_of_seven.0204.c:0 "不，[tos_prisoner.GetSheHe|U]就待在[tos_prisoner.GetSheHe]该待的地方。"
 agot_trial_of_seven.0204.d:0 "释放[tos_prisoner.GetTitledFirstNameNoTooltip]……并送[tos_prisoner.GetHerHim]去绝境长城。"
 agot_trial_of_seven.0205.t:0 "来自[tos_imprisoner.Custom('GetQueenKing')|U]的消息"
 agot_trial_of_seven.0205.desc.ok:0 "门再次打开，[tos_friend.GetTitledFirstName]回来了。这一次，[tos_friend.GetHerHis]的神情中带着一丝不易察觉的释然。\n\n[tos_friend.GetSheHe|U]告诉我，[tos_imprisoner.GetTitledFirstName]已同意释放我。束缚我于此的锁链即将被斩断，高墙之外的道路将再次为我敞开。"
 agot_trial_of_seven.0205.desc.gold:0 "当门打开时，[tos_friend.GetTitledFirstName]正站在门外等候，然而[tos_friend.GetHerHis]脸上的表情却并非我所期盼的那样。\n\n[tos_imprisoner.GetTitledFirstName]愿意给予我自由，但必须付出代价——唯有黄金易手，这些锁链方能解除。"
 agot_trial_of_seven.0205.desc.no:0 "[tos_friend.GetTitledFirstName]回到了我的囚室，可[tos_friend.GetSheHe]带来的消息，并非我所期盼的那样。\n\n[tos_imprisoner.GetTitledFirstName]拒绝了请求。我的枷锁依旧，所有离开高墙的希望，都已被彻底驳回。"
 agot_trial_of_seven.0205.desc.nw:0 "当门再次打开时，[tos_friend.GetTitledFirstName]站在门外等候，可[tos_friend.GetHerHis]眼中的沉重告诉我，这并非一次寻常的监狱探望。\n\n[tos_imprisoner.GetTitledFirstName]已同意放我出去……这并非重获自由。我将被送往绝境长城，披上黑衣，余生都要为守夜人军团效命。"
 agot_trial_of_seven.0205.a:0 "很好，我接受。"
 agot_trial_of_seven.0205.b:0 "这不是正义。"
 agot_trial_of_seven.0205.b.nw:0 "这不是正义，我要求比武审判。"
 agot_trial_of_seven.0205.c:0 "就这样吧"
 they_agot_unavailable_due_to_grand_wedding:0 "因参加一场大婚，他们无法抽身"
 i_agot_unavailable_due_to_grand_wedding:0 "因参加一场大婚，我无法抽身"
 agot_trial_of_seven.0201.desc.accuser_won_default.accuser_pov:0 "七子审判已然落幕，诸神眷顾了我的事业。我的代理人在比武场上取胜，而[tos_final_accused.GetTitledFirstName]非但没能得到[tos_final_accused.GetSheHe]所要求的自由，反而落得个败北的下场。\n\n然而即便是胜利，也有其代价。七柄利剑齐聚于此，其中许多将无法完好如初地归来。不过，世人已亲眼见证了这场审判，而这份见证，正如任何利剑般锋利。"
 agot_trial_of_seven.0201.desc.accuser_won_default.defender_pov:0 "尘埃落定。七子审判对我反戈相向，我的代理人未能守住比武场。诸神没有赐予我所求的答案——又或者，祂们将答案赐予了另一方。\n\n我靠正义打破这些锁链的任何机会，都已尽付血泊。如今，我必须在败诉之后面对接下来的一切：一个相信裁决的国度，以及一个不会忘记我曾强行提出此问的胜者。"
 agot_trial_of_seven.0201.desc.accuser_won_default.observer_pov:0 "七子审判已经结束，[tos_final_accuser.GetTitledFirstNamePossessive]一方赢得了比武场。[tos_final_accused.GetTitledFirstName]落败，而裁决正从营火到宫廷四处传扬，仿佛福音一般。\n\n有人称之为正义，也有人称之为必然。无论如何，七柄利剑决定了言语无法决断之事，世人亲眼目睹。裁决由钢铁赢得，而世人已然见证。"