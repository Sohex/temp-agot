l_simp_chinese:
 agot_title_and_name_events.0001.t:0 "王室血脉问题"
 agot_title_and_name_events.0001.desc:0 "吾之[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('child'))][AGOTGetName(child)]，虽系王室血脉，然尚无相应名分。身为[ROOT.Char.GetTitleAsNameNoTooltip]，自有权柄赐殊荣予[child.GetHerHim]，使[child.GetHerHis]之尊贵血脉昭告天下。"
 agot_title_and_name_events.0001.desc.twins:0 "吾之[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('scoped_relative'))][AGOTGetName(scoped_relative)]所生双子，[AGOTGetName(child)]与[AGOTGetName(child_2)]，虽系王室血脉，然尚无相应名分。身为[ROOT.Char.GetTitleAsNameNoTooltip]，自有权柄赐殊荣予此二人，使其尊贵血脉昭告天下。"
 agot_title_and_name_events.0001.desc.triplets:0 "吾之[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('scoped_relative'))][AGOTGetName(scoped_relative)]所生三子，[AGOTGetName(child)]、[AGOTGetName(child_2)]与[AGOTGetName(child_3)]，虽系王室血脉，然尚无相应名分。身为[ROOT.Char.GetTitleAsNameNoTooltip]，自有权柄赐殊荣予此三人，使其尊贵血脉昭告天下。"
 agot_title_and_name_events.0001.a:0 "王室血统需要获王室认可。"
 agot_title_and_name_events.0001.b:0 "远亲不配获得这样的荣誉。"
 agot_title_and_name_events.0001.b.flavor:0 "@alert_icon!#alert_trial 之后你可以选择授予王室头衔#!"
 agot_title_and_name_events.0002.desc:0 "吾族成员虽系王室血脉，然尚无相应名分。身为[ROOT.Char.GetTitleAsNameNoTooltip]，有权柄赐殊此荣予，使世人皆知其王室血脉。\n\n#I 选择要授予王室头衔的亲属#!"