l_simp_chinese:
 agot_a_new_harvest_prince_is_elected_tt:0 "新一任丰收亲王即将被选出"
 agot_a_new_harvest_prince_is_elected_soon_tt:0 "新一任丰收亲王将在三天后被选出"
 agot_a_new_harvest_prince_is_elected_eight_tt:0 "丰收亲王的选举将在八天后开始"
 agot_a_new_fisher_prince_is_elected_tt:0 "新一任渔民亲王即将被选出"
 agot_a_new_fisher_prince_is_elected_soon_tt:0 "新一任渔民亲王将在三天后被选出"
 agot_a_new_fisher_prince_is_elected_eight_tt:0 "渔民亲王的选举将在八天后开始"
 agot_a_new_prince_of_streets_is_elected_tt:0 "新一任街道亲王即将被选出"
 agot_a_new_prince_of_streets_is_elected_soon_tt:0 "新一任街道亲王将在三天后被选出"
 agot_a_new_prince_of_streets_is_elected_eight_tt:0 "街道亲王的选举将在八天后开始"
 agot_three_princes.0001.t:0 "丰收亲王去世"
 agot_three_princes.0001.desc:0 "[agot_harvest_prince|E]去世了。由于我在[GetTitleByKey('k_lorath').GetName]岛内拥有土地，我有权投票选举下一任[agot_harvest_prince|E]。我希望谁获得这个虽享有特权但纯属礼仪性质的职位呢？"
 agot_three_princes.0001.a:0 "很好。"
 agot_three_princes.0002.t:0 "选举丰收亲王"
 agot_three_princes.0002.desc:0 "现在，罗拉斯诸岛上的拥有领土的选举人已经提名了各自的候选人，是时候投下我个人的一票，表达我期望谁成为下一任[agot_harvest_prince|E]了。"
 agot_three_princes.0002.a:0 "我喜欢[harvest_prince_candidate_one.GetFullNameNicknamed]的举止风度。"
 agot_three_princes.0002.b:0 "[harvest_prince_candidate_two.GetFullNameNicknamed]引起了我的注意。"
 agot_three_princes.0002.c:0 "[harvest_prince_candidate_three.GetFullNameNicknamed]是我中意的人选！"
 agot_three_princes.0004.t:0 "新的丰收亲王！"
 agot_three_princes.0004.desc:0 "选票已清点完毕，结果已经揭晓！[lorath_new_harvest_prince.GetFirstName]已被宣布为新的[agot_harvest_prince|E]！他将被护送至[GetTitleByKey('c_palliera').GetName]，在丰收宫正式即位。"
 agot_three_princes.0004.a:0 "又一场皆大欢喜的选举。"
 agot_three_princes.0005.t:0 "渔民亲王去世"
 agot_three_princes.0005.desc:0 "[agot_fisher_prince|E]去世了。作为[GetTitleByKey('k_lorath').GetName]的公民和船主，我有权投票选举下一任[agot_fisher_prince|E]。我希望谁获得这个虽享有特权但纯属礼仪性质的职位呢？"
 agot_three_princes.0005.a:0 "很好。"
 agot_three_princes.0006.t:0 "选举渔民亲王"
 agot_three_princes.0006.desc:0 "现在，罗拉斯诸岛上的船主选举人已经提名了各自的候选人，是时候投下我个人的一票，表达我期望谁成为下一任[agot_fisher_prince|E]了。"
 agot_three_princes.0006.a:0 "[fisher_prince_candidate_one.GetFullNameNicknamed]深谙航海之道。"
 agot_three_princes.0006.b:0 "除了[fisher_prince_candidate_two.GetFullNameNicknamed]，还有谁能为我们指引航向？"
 agot_three_princes.0006.c:0 "[fisher_prince_candidate_three.GetFullNameNicknamed]是我的亲王！"
 agot_three_princes.0008.t:0 "新的渔民亲王！"
 agot_three_princes.0008.desc:0 "选票已清点完毕，结果已经揭晓！[lorath_new_fisher_prince.GetFirstName]已被宣布为新的[agot_fisher_prince|E]！他将被护送至[GetTitleByKey('c_qapahienn').GetName]，在渔民宫正式即位。"
 agot_three_princes.0008.a:0 "又一场皆大欢喜的选举。"
 agot_three_princes.0009.t:0 "街道亲王去世"
 agot_three_princes.0009.desc:0 "[agot_streets_prince|E]去世了。作为[GetTitleByKey('k_lorath').GetName]的公民和自由民，我有权投票选举下一任[agot_streets_prince|E]。我希望谁获得这个虽享有特权但纯属礼仪性质的职位呢？"
 agot_three_princes.0009.a:0 "很好。"
 agot_three_princes.0010.t:0 "选举街道亲王"
 agot_three_princes.0010.desc:0 "现在，罗拉斯诸岛上的自由民选举人已经提名了各自的候选人，是时候投下我个人的一票，表达我期望谁成为下一任[agot_streets_prince|E]了。"
 agot_three_princes.0010.a:0 "我相信[prince_of_streets_candidate_one.GetFullNameNicknamed]能领导我们自由的人们。"
 agot_three_princes.0010.b:0 "[prince_of_streets_candidate_two.GetFullNameNicknamed]最了解这片土地。"
 agot_three_princes.0010.c:0 "我喜欢[prince_of_streets_candidate_three.GetFullNameNicknamed]的竞选演讲！"
 agot_three_princes.0012.t:0 "新的街道亲王！"
 agot_three_princes.0012.desc:0 "选票已清点完毕，结果已经揭晓！[lorath_new_prince_of_streets.GetFirstName]已被宣布为新的[agot_streets_prince|E]！他将被护送至[GetTitleByKey('c_west_catch').GetName]，在街道宫正式即位。"
 agot_three_princes.0012.a:0 "又一场皆大欢喜的选举。"
 agot_three_princes.1000.t:0 "丰收亲王去世"
 agot_three_princes.1000.desc:0 "罗拉斯三位礼仪性亲王之一的[agot_harvest_prince|E]去世了，[dead_prince.GetHerHis]任期由此结束。身为[GetTitleByKey('k_lorath').GetName]诸岛中的一位土地持有者，我将有权参与对继任者的票选，在土地持有者们所推举的候选人中，我会希望由谁来继任这有名无实的尊贵头衔？"
 agot_three_princes.1000.a:0 "我必须慎重考虑我的选择。"
 agot_three_princes.1001.t:0 "选举丰收亲王"
 agot_three_princes.1001.desc:0 "罗拉斯诸岛的土地持有者已经推举出了各自的候选人，如今每位选举人都要投下自己的一票了。渔民亲王这个职位或许早已失去了昔日的权威，但这一头衔依然是令人向往的荣誉。我该把票投给哪位候选人呢？"
 agot_three_princes.1001.a:0 "[harvest_prince_candidate_one.GetFullNameNicknamed]足够有风度。"
 agot_three_princes.1001.b:0 "[harvest_prince_candidate_two.GetFullNameNicknamed]了解这片土地的需求。"
 agot_three_princes.1001.c:0 "[harvest_prince_candidate_three.GetFullNameNicknamed]有丰收亲王的样子。"
 agot_three_princes.1003.t:0 "新的丰收亲王！"
 agot_three_princes.1003.desc:0 "选票已经收齐，票数清点完毕，结果十分明确。[lorath_new_harvest_prince.GetFirstName]被宣布为新任丰收亲王！在到场选举人的欢呼声中，[lorath_new_harvest_prince.GetSheHe]将被护送至[GetTitleByKey('c_palliera').GetName]，在渔民宫正式即位。"
 agot_three_princes.1003.a:0 "选民做出了决定。"
 agot_three_princes.2000.t:0 "渔民亲王去世"
 agot_three_princes.2000.desc:0 "罗拉斯三位礼仪性亲王之一的[agot_fisher_prince|E]去世了，[dead_prince.GetHerHis]任期由此结束。身为[GetTitleByKey('k_lorath').GetName]诸岛中一位拥有船只的人，我将有权参与对继任者的票选，在船主所推举的候选人中，我会希望由谁来继任这有名无实的尊贵头衔？"
 agot_three_princes.2000.a:0 "我必须慎重考虑我的选择。"
 agot_three_princes.2001.t:0 "选举渔民亲王"
 agot_three_princes.2001.desc:0 "罗拉斯诸岛的船主已经推举出了各自的候选人，如今每位选举人都要投下自己的一票了。渔民亲王这个职位或许早已失去了昔日的权威，但这一头衔依然是罗拉斯航海传统引以为傲的象征。我该把票投给哪位候选人呢？"
 agot_three_princes.2001.a:0 "没有人比[fisher_prince_candidate_one.GetFullNameNicknamed]更了解大海。"
 agot_three_princes.2001.b:0 "[fisher_prince_candidate_two.GetFullNameNicknamed]具备成为优秀渔民亲王的潜质。"
 agot_three_princes.2001.c:0 "海洋在[fisher_prince_candidate_three.GetFullNameNicknamed]的身体里奔流不息。"
 agot_three_princes.2003.t:0 "新的渔民亲王！"
 agot_three_princes.2003.desc:0 "选票已经收齐，票数清点完毕，结果十分明确。[lorath_new_fisher_prince.GetFirstName]被宣布为新任渔民亲王！在到场选举人的欢呼声中，[lorath_new_fisher_prince.GetSheHe]将被护送至[GetTitleByKey('c_qapahienn').GetName]，在渔民宫正式即位。"
 agot_three_princes.2003.a:0 "选民做出了决定。"
 agot_three_princes.3000.t:0 "街道亲王去世"
 agot_three_princes.3000.desc:0 "罗拉斯三位礼仪性亲王之一的[agot_streets_prince|E]去世了，[dead_prince.GetHerHis]任期由此结束。身为[GetTitleByKey('k_lorath').GetName]诸岛的自由公民，我将有权参与对继任者的票选，在自由人所推举的候选人中，我会希望由谁来继任这有名无实的尊贵头衔？"
 agot_three_princes.3000.a:0 "我必须慎重考虑我的选择。"
 agot_three_princes.3001.t:0 "选举街道亲王"
 agot_three_princes.3001.desc:0 "罗拉斯诸岛的自由人已经推举出了各自的候选人，如今每位选举人都要投下自己的一票了。“街道亲王”这个职位虽无多大实权，但其在位者始终是罗拉斯街头巷尾和市井集市中普通民众的象征。我该把票投给哪位候选人呢？"
 agot_three_princes.3001.a:0 "人民信任[prince_of_streets_candidate_one.GetFullNameNicknamed]。"
 agot_three_princes.3001.b:0 "[prince_of_streets_candidate_two.GetFullNameNicknamed]最了解罗拉斯的街道。"
 agot_three_princes.3001.c:0 "人民愿意听到[prince_of_streets_candidate_three.GetFullNameNicknamed]的声音。"
 agot_three_princes.3003.t:0 "新的街道亲王！"
 agot_three_princes.3003.desc:0 "选票已经收齐，票数清点完毕，结果十分明确。[lorath_new_prince_of_streets.GetFirstName]被宣布为新任街道亲王！在到场选举人的欢呼声中，[lorath_new_prince_of_streets.GetSheHe]将被护送至[GetTitleByKey('c_west_catch').GetName]，在街道宫正式即位。"
 agot_three_princes.3003.a:0 "选民做出了决定。"