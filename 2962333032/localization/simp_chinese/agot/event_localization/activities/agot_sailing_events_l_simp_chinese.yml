 agot_sailing.5602.desc.i_two:0 "航行数小时后，惊叫声与恐惧的呼喊将我惊醒。“海怪！海怪来了！”水手们喊道，有些人已经吓得开始逃跑。\n\n看来猎物反过来找上了我们。船后方的海水剧烈翻涌，很快露出一只覆满鳞片的巨大#high 海怪#!的头颅，黏滑的喙发出可怖的嚎叫声，一张一合。\n\n我看到[first_mate.GetFirstName]冲到[host.GetTitledFirstNameNicknamed]身边。“怎么办，船长？是打，还是逃跑？”\n\n“我不会逃跑！”[host.GetFirstName]喊道，“所有人做好准备！”\n\n海怪是可怕的怪物，许多水手被它带吸盘的触手击中，尖叫着被拖入深海。[host.GetTitledFirstNameNoTooltip]吹响了他的海怪之角，吸引了那怪物的注意，可这头受了伤又被四面围攻的怪物求生欲太强，根本没法让它安分哪怕片刻。鱼叉只是在它黏滑的皮肤上滑开。它杀不死！幸运的是，海怪终于失去了兴趣，潜入水中，带走了不少倒霉蛋，留给我们只有伤口和一艘损坏的船。"
 agot_sailing.5602.desc.j:0 "这次捕猎进展不顺。好几个小时过去，我们连一个活物都没看见，我开始觉得无聊。就在这时，我身后传来一声受惊的大喊：“右舷发现鲸鱼，船长！”\n\n一瞬间，一道巨大的水柱喷向空中，鲸鱼庞大的身体从浪里钻了出来。船被一股巨大的力道撞得晃了晃，我们全都摔倒在地。我挣扎着要站起来，[first_mate.GetFirstName]朝我爬过来，脸色白得像一张纸。\n\n“是——是「白死神」，那个……那个海中的恐怖！”[first_mate.GetSheHe]结结巴巴地说。我听过那些传闻：一头狡猾又凶狠的白鲸，像个巨大的幽灵一样在这片海域出没。它撞沉过很多船，现在……它找上我们了。\n\n“准备战斗！”[host.GetTitledFirstNameNicknamed]喊道，抓起一支鱼叉。船又遭到一次撞击，我被甩到甲板上捆着的一桶给养上。等我重新站稳，我看见白怖发出一声震耳欲聋的胜利嚎叫高高跃起——它几乎把我们的船拍成了碎片，认定我们已经落败。它潜入水中时，我感到心跳得比以往任何时候都要响。这个怪物怕是会成为我噩梦里的常客……"
 agot_sailing.5602.desc.k:0 "很长一段时间，海面一片沉寂，仿佛大海本身也在屏息等待。我在船舵附近不安地来回踱步。终于，瞭望员喊道：“发现鲸鱼！”\n\n我冲到前面，难以置信地睁大了眼睛。它又找到了我们。「白死神」迅速逼近，劈开海浪，直接朝我们的船冲来。\n\n我闭了一下眼，紧接着抓起一支鱼叉。我发誓这一次我不会袖手旁观，那头白鲸已经下潜，开始发起凶狠的攻击。\n\n船被一股巨大的力道撞得晃起来，我听见脚下的木头裂开的声音。我攥紧鱼叉，勉强站稳身子。我攒起剩下的所有力气，把手里的武器朝「白死神」掷过去——但它却傲慢而轻松地避开了我的投掷！那头鲸鱼抬起身，发出一声震耳的得意嚎叫——它几乎把我们的船撕成了碎片，又一次认定我们已经落败。它几乎是带着嘲弄的姿态，往空中喷了一大道水柱，接着再次潜回了浪下。"
 agot_sailing.5602.a:0 "我们就差那么一点……"
 agot_sailing.5603.t:0 "白死神逃离"
 agot_sailing.5603.desc:0 "今天的海面很安静——甚至可以说近乎平和。我站在甲板上，看着浪头轻轻撞在我们船的船身上。就在这时，我瞥见深色的水面下有东西在动。水下有什么东西——一个白点，变得越来越大，越来越大，然后——\n\n随着一声震耳的撞击声，一头巨大的生物晃了晃船，把我甩倒在地。等我重新站起来，就看见一头白得异乎寻常的鲸鱼从浪里抬起身，它红色的眼睛正盯着我们的船。\n\n“是——是「白死神」，那个……那个海中的恐怖！”有人结结巴巴地说。我听过那些传闻：一头狡猾又凶狠的白鲸，像个巨大的幽灵一样在这片海域出没。它撞沉过很多船，现在……它找上我们了。\n\n但「白死神」看起来并不想战斗。它绕着我们的船转圈，一直待在鱼叉够不到的地方，恐惧的几分钟后，从喷气孔喷出水花戏弄了我们一下，才潜回浪下消失不见。"
 agot_sailing.5603.a:0 "那#italic 是什么#!怪物？"
 agot_sailing.6005.b.success:0 "你悄悄绕过了鲨鱼群"
 agot_sailing.6007.t:0 "徒劳之行"
 agot_sailing.6007.desc:0 "[host.GetTitledFirstName]安全返回船上，但这次远征却一无所获。[host.GetSheHe|U]带领我们来到这里，而现在我们所能得到的只有[host.GetHerHis]的失败……"
 agot_sailing.6007.a:0 "我们回家吧。"
 agot_sailing.6013.t:0 "游泳时刻"
 agot_sailing.6013.desc:0 "“[host.GetLadyLord]！”\n\n[first_mate.GetName]喊道，想引起[host.GetTitledFirstNamePossessive]的注意，[host.GetSheHe]正望着海面。\n\n我走到[first_mate.GetHerHim]身边，靠在栏杆上，朝我们锚泊地不远处的海水里看去——然后我看到了！\n\n在那平静的水面深处，有一艘沉船！"
 agot_sailing.6013.a:0 "[ROOT.Char.Custom2('spoken_address_by_familiarity', SCOPE.sC('host') )]要去潜水了……"
 agot_sailing.6014.t:0 "打捞成功"
 agot_sailing.6014.desc:0 "我带着从残骸中找到的箱子回到了船上。尽管它因多年沉于海底而锈迹斑斑、膨胀变形，我们还是设法撬开了它，露出了那些久被认为已沉入深海的珍宝。终于，我们可以离开这个被诅咒的地方了。"
 agot_sailing.6014.vermax_skull:0 "\n\n在海底，我还发现了[GetScriptedCharacterByHistoryID('dragon_vermax').GetName]的遗骸。据说[vermax.GetSheHe|U]在「血龙狂舞」时葬身在了喉道。谁能想到，我们寻找宝藏时竟会找到[vermax.GetHerHis]的长眠之地。"
 agot_sailing.6014.a:0 "收获颇丰！"
 agot_sailing.6014.a_generic_artifact:0 "#V 你#!获得了[generic_artifact.GetNameNoTooltip][artifact|E]"
 agot_sailing.6014.a_valyrian_steel_sword:0 "#V 你#!获得了[valyrian_steel_sword.GetNameNoTooltip][artifact|E]"
 agot_sailing.6014.a_spare:0 "#V 你#!获得了[spare.GetNameNoTooltip][artifact|E]"
 agot_sailing.9110.d:0 "附近似乎没有可劫掠的地方。"
 agot_sailing.9150.t:0 "[host.GetTitledFirstNamePossessiveNoTooltip]的失败"
 agot_sailing.9150.desc:0 "我们发动突袭的企图遭到挫败，而责任完全在于[host.GetTitledFirstName]。[host.GetHerHis|U]无能的领导把我们带偏了；我的失望无法估量，我的一整天都被毁了。"
 agot_sailing.9150.a:0 "真是失望……"
 agot_sailing.9151.t:0 "劫掠成功！"
 agot_sailing.9151.desc:0 "终于，我们望见了前方的海岸，目标轮廓开始在地平线上浮现。海鸥在桅杆上空盘旋，船员们在甲板上集结，磨着武器，喝着酒壮胆。\n\n[host.GetTitledFirstName]已经定下了我们的计划："
 agot_sailing.9151.desc_sabotaged_production:0 "我们将破坏当地的基础设施，对他们的生产手段造成无法弥补的损害。\n\n剩下的我记得不太清了，但我清楚地记得放火烧了一两栋建筑。#EMP 真是好时光！#!"
 agot_sailing.9151.desc_pillage_settlement:0 "我们将洗劫这个定居点，把他们的钱财据为己有。\n\n有机会捞点值钱货总是让人兴奋的；转眼间，我已经回到船上，正跟船友们讲述这次成功的洗劫。#EMP 真痛快！#!"
 agot_sailing.9151.desc_duel_the_baron:0 "[host.GetSheHe|U]将与当地统治者进行一场武力决斗。\n\n[host.GetHerHis|U]的计划完美执行，轻松击伤了[host.GetHerHis]的对手。#EMP 真是精彩！#!"
 agot_sailing.9151.desc_kidnap_villager:0 "我们将绑架当地村民。\n\n相信这些当地人未来会对[host.GetTitledFirstNameNoTooltip]有用。#EMP 大获成功！#!"
 agot_sailing.9151.a:0 "干得好，[host.GetTitledFirstNameNoTooltip]！"
 agot_sailing.9152.t:0 "失败的劫掠..."
 agot_sailing.9152.desc:0 "终于，我们望见了前方的海岸，目标轮廓开始在地平线上浮现。海鸥在桅杆上空盘旋，船员们在甲板上集结，磨着武器，喝着酒壮胆。\n\n[host.GetTitledFirstName]已经定下了我们的计划："
 agot_sailing.9152.desc_sabotaged_production:0 "我们将破坏当地的基础设施，对他们的生产手段造成无法弥补的损害。\n\n计划进行得不太顺利；我试图放火烧一栋建筑时，一个守卫出现并狠狠揍了我一顿。等我回过神来，我已经回到了船上。#EMP 真疼啊！#!"
 agot_sailing.9152.desc_pillage_settlement:0 "我们将洗劫这个定居点，把他们的钱财据为己有。\n\n可惜对我们的船员来说，这个定居点守卫森严，我们试图拿走当地人财物的尝试遭到了挫败。#EMP 真可惜啊！#!"
 agot_sailing.9152.desc_duel_the_baron:0 "[host.GetSheHe|U]将与当地领主进行一场实力的较量。\n\n不幸的是，[host.GetHerHis|U]计划进展不顺，[host.GetSheHe]在过程中受了伤。#EMP 可惜！#!"
 agot_sailing.9152.desc_kidnap_villager:0 "我们打算绑架当地村民。\n\n不幸的是，我们没料到这个定居点守卫如此森严，我们的企图遭到了挫败。#EMP 该死！#!"
 agot_sailing.9152.a:0 "指挥不力，[host.GetTitledFirstNameNoTooltip]……"
 agot_sailing.9501.t:0 "[ship_province.GetNameNoTooltip]外的悲剧"
 agot_sailing.9501.desc_intro:0 "[admiral.GetName]带着一封信朝我走来。[admiral.GetSheHe|U]想告诉我最近在海上发生的一起悲剧。\n\n一艘船在[ship_province.GetName]沿海遭遇了不测，幸存者很少。"
 agot_sailing.9501.desc_reaction_sadistic:0 "\n\n我在想，[admiral.GetSheHe]为什么要把这消息告诉我。比起那些葬身大海的生命，我更心疼那损失的货物与浪费的钱财。"
 agot_sailing.9501.desc_reaction:0 "\n\n这是一场可怕的悲剧。我不禁想起那些逝去的生命，以及他们身后悲痛欲绝的家人。"
 agot_sailing.9501.desc_reaction_compassionate:0 "\n\n这场悲剧令我心碎。如此多的灵魂沉没在波涛之下，如此多的家庭支离破碎。想到这般苦难，我心头沉重如铅。"
 agot_sailing.9501.desc_greed_greedy:0 "\n\n[admiral.GetNameNoTooltip]谈到丢失的货物时，我脑子里闪过一个念头。我知道那艘船沉在哪——在[ship_province.GetNameNoTooltip]沿海。我可以装备一艘船，派潜水员去打捞剩下的东西……不过看来[admiral.GetNameNoTooltip]并不是第一个知道这艘沉船的人。可能已经有其他人正往那个地点赶去了。"
 agot_sailing.9501.desc_greed_not_tarth:0 "\n\n[admiral.GetNameNoTooltip]继续读着信，解释说那艘遇难船上损失了一大笔财富，如今散落在海床各处。或许连塔斯岛著名的蓝宝石海，如今在美景上也要遇到对手了。"
 agot_sailing.9501.desc_greed_tarth:0 "\n\n[admiral.GetNameNoTooltip]继续读着信，解释说那艘遇难船上损失了一大笔财富，如今散落在海床各处。塔斯岛的蓝宝石海现在也许闪烁着金色的光点——比以往更加美丽，尽管代价惨重。"
 agot_sailing.9501.a:0 "多么悲痛的消息。"
 agot_sailing_end:0 "@warning_icon!#X 这将结束此次活动#!"
 agot_sailing_end_failure:0 "@warning_icon!#X 这将结束此次活动#!"
 agot_sailing_kraken_spawn:0 "我们继续航行着，船头开始弥漫一种隐约的不安。远处，我看到海面下有东西在移动……大得不可思议，而且越来越近。\n\n#EMP 一只巨大的海怪！#!传说中讲过这种神话生物，但大多数人把它们当作奶妈和修女们讲的夸张故事。"