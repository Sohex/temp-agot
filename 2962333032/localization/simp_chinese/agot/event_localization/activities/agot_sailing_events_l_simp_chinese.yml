l_simp_chinese:
 agot_sailing.0800.t:0 "到达港口"
 agot_sailing.0800.desc:0 "我走在[location.GetName]港口的栈桥上，清新的海风扑面而来。船员们正在准备船只，我和同伴们还有一点时间，可以在码头上逗留片刻。\n\n海鸥的歌声在我头顶回荡，大海的浪涛拍击着码头。大海横陈于面前，其无限可能也随之铺开。很快我们就要启航，驶向开阔的水域。"
 agot_sailing.0800.a:0 "大海的呼唤"
 agot_sailing.1005.t:0 "船坞的诱惑"
 agot_sailing.1005.desc:0 "当我在启航前的码头上走动时，一个迷人的[hooker.GetWomanMan]走近我，[hooker.GetHerHis]的眼睛里闪着光。\n\n“想在出发前找点乐子吗，水手？”[hooker.GetFirstName]挑逗地问着。\n\n我还有很多事情要做，为未来的旅程做准备，但还有一些时间……"
 agot_sailing.1005.a:0 "怎么样？[hooker.GetFirstNameNoTooltip]的乐子#EMP 多#!吗？一会儿再见！"
 agot_sailing.1005.b:0 "找一点无害的乐子没有错，对吧？"
 agot_sailing.1005.c:0 "滚开，肮脏的[hooker.GetWomanMan]！"
 sailing_gained_concubine_log:0 "将[hooker.GetFirstName]纳为[concubine|E]"
 sailing_had_sexual_encounter:0 "与[hooker.GetFirstName]来一段“浪漫的”邂逅"
 agot_sailing.1006.t:0 "卧室里的一柄匕首"
 agot_sailing.1006.desc:0 "当我躺在床上，精神振奋，心满意足，看到[hooker.GetFirstName]爬到我身上，松开[hooker.GetHerHis]的袍子时，我笑得很开心。\n\n然而，[hooker.GetHerHis]脸上充满了强烈的欲望，[hooker.GetSheHe]越过头顶高高举起了一把匕首。当[hooker.GetSheHe]把刀子刺下来的时候，任何对第二回合的希望都很快变成了灰尘。\n\n“无面者的礼物，愚蠢的[ROOT.Char.GetTitleAsNameNoTooltip]！”"
 agot_sailing.1006.a:0 "[hooker.GetFirstNameNoTooltip]！等等……不！"
 agot_sailing.1006.a.desc:0 "你尽一切可能偏转刀锋。"
 agot_sailing.1006.duel_success:0 "你拼尽全力抢走了匕首，制服了[hooker.GetHerHim]"
 agot_sailing.1006.duel_failure:0 "你感觉到匕首深深地刺进了你的胸膛，你的视野逐渐黯淡"
 agot_sailing.1007.t:0 "在你等待时削木"
 agot_sailing.1007.desc:0 "当我在码头徘徊，等待物资装船时，我的沉闷被刮木头的声音打断了。循声望去，我发现我的船员[whittler.GetFirstName]正在用一块木头雕刻一个小而复杂的雕像。\n\n从[whittler.GetHerHis]的工作中抬起头来，[whittler.GetFirstNameNoTooltip]微笑着叫我过去，“你好，[whittler.Custom2('spoken_address_by_familiarity', ROOT.Char)]。愿意加入我的削皮工作吗？”\n\n看起来这需要灵活地使用小刀，但我相信如果我努力的话，我可以做出一些东西……"
 agot_sailing.1007.a:0 "我将为我的孩子做一些小玩意。"
 agot_sailing.1007.b:0 "我要为我的爱人做一个甜蜜的纪念品。"
 agot_sailing.1007.c:0 "我要做一支长笛，为我的歌词配上音乐。"
 agot_sailing.1007.d:0 "我将做一些简单的东西，只是为了打发时间。"
 agot_sailing.1007.e:0 "我宁愿不把时间浪费在无聊的工作上。"
 agot_sailing.1008.t:0 "酒吧斗殴"
 agot_sailing.1008.desc:0 "这是我们航行的前一天晚上，我在当地的一家小酒馆里和我的船员们一起喝酒吃饭，很开心。大家兴致很高，笑声不断，因为每个人都想把别人的航海故事引导出来。\n\n突然，在醉醺醺的食客们的嗡鸣中，我听到酒吧里传来了嘈杂的声音，争吵声此起彼伏。我努力睁大眼睛，很快看到其中一个人是我的船员[brawler.GetFirstName]。\n\n分歧很快升级为全面的喊叫，口水横飞。没过多久，人们举起了拳头，[brawler.GetFirstNameNoTooltip]向这群粗壮的流氓求救。"
 agot_sailing.1008.a:0 "肯定有更好的方法来解决这个问题？"
 agot_sailing.1008.a.success:0 "你迅速化解局势，使流氓们平静下来。"
 agot_sailing.1008.a.failure:0 "你的努力被置若罔闻，你们都因为胆大妄为而被打了一顿。"
 agot_sailing.1008.b:0 "我来了，[brawler.GetFirstNameNoTooltip]！"
 agot_sailing.1008.b.success:0 "你和[brawler.GetFirstNameNoTooltip]在短时间内解决了这些流氓。"
 agot_sailing.1008.b.failure:0 "你和[brawler.GetFirstNameNoTooltip]被流氓们狠狠揍了一顿。"
 agot_sailing.1008.c:0 "你要靠自己，[brawler.GetFirstNameNoTooltip]……"
 agot_sailing.1009.t:0 "饮酒比赛"
 agot_sailing.1009.desc:0 "现在天色渐晚了。酒过三巡，我的船员们回到了他们平常的滑稽模样，吹嘘着他们过往的勇武和冒险传说。\n\n显然是有些坐不住了，我的一个船员[challenger.GetFirstName]站起身来，手上还端着[challenger.GetHerHis]酒杯，只不过看起来那酒杯马上就要翻到在木桌上了。\n\n“我还没遇到过什么能把我喝倒的玩意儿！[challenger.Custom2('spoken_address_by_familiarity', ROOT.Char)|U]，满上满上……最后一个倒的赢二十五个金币！”"
 agot_sailing.1009.a:0 "你觉得你能撑得比我久？你#EMP 一定#!是喝高了……"
 agot_sailing.1009.a.success:0 "在许多轮豪饮之后，你最终听到[challenger.GetFirstNameNoTooltip]一头撞倒在地。"
 agot_sailing.1009.a.failure:0 "这种饮料很快进入你的大脑，然后你就昏倒了。"
 agot_sailing.1009.b:0 "我永远也没指望喝得比你多[ROOT.Char.Custom2('spoken_address_by_familiarity', SCOPE.sC('challenger'))]！"
 agot_sailing.1010.t:0 "幸运使者"
 agot_sailing.1010.desc:0 "当我沿着海边漫步，望着桅杆随着摇摆的波浪而起落摇摆时，我听到了来自路边一架马车旁的老妪的声音，招手示意我靠近。\n\n我靠近了她，而她华丽方桌上的天鹅绒包中收藏了各式各样铭刻着卢恩符文的石头。她摇了摇包，从中拿出五个，并把它们排列成了一条整齐的直线。\n\n“日安，水手。这些谜一样的石头被深渊者灌输了魔力，有给你前方的旅途带来吉兆的力量。而你只需要给我几个小小的银币……”"
 agot_sailing.1010.a:0 "让我看看这些石头能预示些什么吧……"
 agot_sailing.1010.a.success.t:0 "好兆头！"
 agot_sailing.1010.a.success:0 "符文石为你的旅途以及将来数年都带来了吉兆"
 agot_sailing.1010.a.failure.t:0 "坏兆头！"
 agot_sailing.1010.a.failure:0 "符文石为你的旅途和将来数年带来了噩兆"
 agot_sailing.1010.b:0 "拿着把破石头就想忽悠我的钱？你这个江湖骗子！"
 agot_sailing.1011.t:0 "码头美味"
 agot_sailing.1011.desc:0 "在旅途中的一个清晨，我和船员[fellow_diner.GetFirstName]一起从码头向我的船只走去。\n\n当我和他正谈及未来的冒险时，我注意到[fellow_diner.GetHerHis]好像闻到了什么，一个灿烂的微笑在[fellow_diner.GetHerHis]脸上绽开。[fellow_diner.GetSheHe]推着我的手臂，一路顺着气味走到了两个仓库间的路边摊上。\n\n“我简直不敢相信这个地方还开着！他们的汤简直是世界上最好的，你必须得试一试，只要喝了它你就能以一个完美的状态上路了！”\n\n我看着[fellow_diner.GetSheHe]急切地抓了一碗就开始大快朵颐，但我自己却不禁犹豫了起来。这个厨房简直是脏乱差，但香料的浓郁味道盖住了一切。[fellow_diner.GetFirstNameNoTooltip]倒是看起来很喜欢……没准这是一场真正的路边摊体验呢！"
 agot_sailing.1011.a:0 "我想试试……就这一次！"
 agot_sailing.1011.a.success.t:0 "这顿饭简直美味极了！"
 agot_sailing.1011.a.success:0 "这顿饭非常美味，使得你对于接下来的旅途感到精力充沛"
 agot_sailing.1011.a.too_spicy.t:0 "这顿饭简直太辣了！"
 agot_sailing.1011.a.too_spicy:0 "这顿饭里辣椒放得简直太过了，让你大汗直流"
 agot_sailing.1011.a.failure.t:0 "我感觉不太好……"
 agot_sailing.1011.a.failure:0 "糟糕的食物让你感觉十分不适，但你早上还是得扬帆起航"
 agot_sailing.1011.b:0 "你疯了吗？看看这些盘子有多脏！"
 agot_sailing.1012.t:0 "空中突袭！"
 agot_sailing.1012.desc:0 "我正沿着码头走着，默默清点着旅途所需的物资，突然感到头上传来一阵猛烈的撞击。我抬手轻轻揉了揉现在黏糊糊的太阳穴，随即转身寻找哪个胆大包天的人敢这样袭击我！\n\n我身旁的[laugher.GetFirstName]大声地笑了出来，随后用手指了指码头尽头。\n\n“我的[ROOT.Char.GetTitleAsNameNoTooltip]，我想你会在那里找到袭击者的！”\n\n望着码头尽头，我终于懂了，一只海鸥正在码头上休息，且它正直直地盯着我。我把手放了下来，这时才反应过来我是被这只鸟在头上拉屎了。"
 agot_sailing.1012.a:0 "这简直是我见过最不要命的死士了！"
 agot_sailing.1012.b:0 "你竟敢笑话我？我扒了你的皮！"
 agot_sailing.1013.t:0 "富有经验的水手"
 agot_sailing.1013.desc:0 "在检查过船员名单后，我突然发觉比起平常的航行我们还差几个人。虽然这也不太影响，但我还是觉得齐装满员毕竟要更好些。\n\n我在码头四下打听，听说了[recruit.GetFirstName]，一个有着丰富航行经验的水手。我最终找到了[recruit.GetHerHim]，但令我失望的是[recruit.GetSheHe]已经在另一艘船上报名了！\n\n听到我过来了，[recruit.GetFirstNameNoTooltip]挑了挑眉毛。\n\n“有什么是我能帮您的吗？”"
 agot_sailing.1013.a:0 "我有一个机会给你……"
 agot_sailing.1013.a.success:0 "你成功地说服了这名航海家加入你的队伍"
 agot_sailing.1013.a.failure:0 "你没能说服水手"
 agot_sailing.1013.b:0 "告诉我，他们一般给你多少钱？我给两倍！"
 agot_sailing.1013.c:0 "我们的水手也差不多够了，没事的"
 agot_sailing.1014.t:0 "在市场的一天"
 agot_sailing.1014.desc:0 "当船只正在装载补给时，我抓住这个空闲逛了逛本地的市集。\n\n许多商人正在大声吆喝，尝试着向我兜售他们的货物。这里倒是有些东西真的有些异域风情：从来没有吃过的食物、用我不理解的语言写作的书籍。这也有一些精选的好酒——我知道如果我把这个买回去，船员们一定会对我感激涕零的！\n\n这里有什么入了我的眼吗？"
 agot_sailing.1014.a:0 "这本书看起来很有趣！"
 agot_sailing.1014.a.tt:0 "有概率获得[GetTrait('lifestyle_mariner').GetName( GetNullCharacter )]特质经验"
 agot_sailing.1014.a.success.toast:0 "你获得[GetTrait('lifestyle_mariner').GetName( GetNullCharacter )]经验加成"
 agot_sailing.1014.a.failure.toast:0 "你没能获得[GetTrait('lifestyle_mariner').GetName( GetNullCharacter )]的经验加成"
 agot_sailing.1014.b:0 "接过美酒，赞颂[ROOT.Char.GetFaith.HighGodName]！"
 agot_sailing.1014.c:0 "橘子？确实是有趣的水果！"
 agot_sailing.1014.d:0 "一张藏宝图？也许我在那里能找到些什么东西？"
 agot_sailing.1015.t:0 "老乞丐"
 agot_sailing.1015.desc:0 "在[location.GetName]的港口漫步时，[dockyard_guest.GetFirstName]和我被一个老乞丐拦住了。“准备启航驶向大海吗，我的[ROOT.Char.GetTitleAsNameNoTooltip]？”老人用沙哑的声音说道，“在我年轻的时候，我在船上的时间比在陆地上还多……只要给几个小钱，也许我可以教你一些航海的本事……？”\n\n[ROOT.Char.Custom2('direct_address_by_familiarity', dockyard_guest)|U]挡在我们之间，“乞讨是违法的，这老东西心知肚明。赶走他吧，我的[ROOT.Char.GetTitleAsNameNoTooltip]！”"
 agot_sailing.1015.a:0 "嗯，那么让我们听听你的秘密配不配得上这个价。"
 agot_sailing.1015.b:0 "[dockyard_guest.GetFirstNameNoTooltip]是对的。收好你的东西然后滚蛋。"
 agot_sailing.1015.c:0 "他没什么可教我的。我们走吧。"
 agot_sailing.1990.t:0 "大副"
 agot_sailing.1990.desc:0 "起航之前，我必须选定我的大副——那个会在茫茫大海上站在我身边、与我一同承担指挥重担的人。\n\n今天聚在这里的，有家人，有朋友，也有老练的水手。有些人确实有航海的本事，有些人则是出于忠诚、交情，或者野心而来。一旦我们驶离了安全的港口，他们每个人都能用自己的方式派上用场。"
 agot_sailing.1990.a:0 "这人会成为我的大副！"
 agot_sailing.2001.t:0 "投骰子邀请"
 agot_sailing.2001.desc:0 "当我走过主甲板时，能听到从下层甲板传来的人群喧闹声。所有不当值的水手都围在一张桌子旁，在烟雾与酒气中正进行着一场热闹的掷骰子游戏。\n\n“船长，快过来！”[first_mate.GetFirstName]喊着，“我们给您露一手！”\n\n人群中突然有人喊道：“别把[ROOT.Char.GetHerHis]的金子全赢走了，那里面还有我的薪水呢！” 紧接着是一阵哄堂大笑。"
 agot_sailing.2001.a:0 "当然！ 我会玩一些骰子！"
 agot_sailing.2001.b:0 "你不会抓到我赌博的！"
 agot_sailing.2002.t:0 "困境中的船只"
 agot_sailing.2002.desc:0 "正当船只在离港不远的海岸上航行时，我的其中一个负责观测的船员喊道他在视野里发现了一艘正在沉没的本地船只。\n\n即使从这边看起来，那艘船的情况也很明显：要么是触礁了，要么是遇着海盗了。它的船员们勉强地维持着船只的漂浮，在甲板上跑来跑去尝试着做一些最基本的修补。显然他们的处境岌岌可危，急需援手。"
 agot_sailing.2002.a:0 "停船并帮助他们！"
 agot_sailing.2002.a.tt_success:0 "你救下来了那边的船员"
 agot_sailing.2002.a.tt_failure:0 "这艘船连人带货一起沉没了"
 agot_sailing.2002.b:0 "要是把这些人全杀掉，就没人知道我们拿到那艘船里的财宝了……"
 agot_sailing.2002.b.tt_success:0 "你劫掠了这艘船并杀死了所有船员"
 agot_sailing.2002.b.tt_failure:0 "你冲上了船，但在混乱中受了伤"
 agot_sailing.2002.c:0 "让我们直接开走吧。"
 agot_sailing.2003.t:0 "利维坦"
 agot_sailing.2003.desc:0 "我在甲板上行走并深呼吸，享受着迎面吹来的海风和咸咸的空气。今天真是一个航行的好日子！\n\n这趟短短的旅程已经成为了宫廷生活的愉悦调剂，直到我们发现了它：羽毛般展开的水面，并紧跟跟着一团浮岛般大小的酒黑色血肉从波浪当中冲撞而出。\n\n深海之中最大的野兽之一。\n\n一条鲸鱼！"
 agot_sailing.2003.a:0 "拿我的鱼叉来！"
 agot_sailing.2003.a.tt_success:0 "你杀掉了这只鲸鱼并把它拖回海岸"
 agot_sailing.2003.a.tt_failure:0 "这野兽从你手上逃脱了"
 agot_sailing.2003.b:0 "让别人来处理这事吧，把尸体带给我就行了。"
 agot_sailing.2003.c:0 "多么#EMP 巨大#!的猎物啊！"
 agot_sailing.2003.c.tt:0 "你面对着一只深海中#EMP 真正的#!利维坦巨兽"
 agot_sailing.2003.d:0 "拥有可怖权威的生物。我们走吧。"
 agot_sailing.2003.d.tt:0 "鲸鱼被放走了。"
 agot_sailing.2004.t:0 "公海上的战斗"
 agot_sailing.2004.desc:0 "当我们在空旷开阔的大海上航行时，海面平静而又清澈。我站在甲板上，享受着阳光的照耀。但一声大喊打破了寂静。\n\n“船长！”我的大副喊道，“一艘不明身份的船只正在向我们快速接近！”\n\n我迅速赶到船只的栏杆旁，扫视着地平线，终于发现了那黑色的、急速靠近的舰影。情况再明显不过了——一艘海盗船。他们马上就要赶上我们了，我们应该战，还是逃？"
 agot_sailing.2004.a:0 "放马过来吧！"
 agot_sailing.2004.a.success:0 "你击退了海盗。"
 agot_sailing.2004.a.failure:0 "海盗洗劫了你的财物。"
 agot_sailing.2004.b:0 "扬起帆来！"
 agot_sailing.2005.t:0 "水手落海！"
 agot_sailing.2005.desc:0 "如今已在远海，汹涌的浪头让船来回摇晃。有时站稳都不容易，不过还能撑住。\n\n突然，一个惊慌的声音尖锐地喊了起来。我一转身，看见一名水手已经翻出船舷外！我冲到船边，只见他的头刚冒出水面，马上又被浪头卷入。\n\n我必须立刻动手，不然他准会葬身在这狂暴的大海深处。"
 agot_sailing.2005.a:0 "坚持住！我来了！"
 agot_sailing.2005.a.tt_success:0 "你救下了船员"
 agot_sailing.2005.a.tt_failure:0 "你没能救下船员"
 agot_sailing.2005.b:0 "你，去拿绳子！你，准备一艘救生船！"
 agot_sailing.2005.b.tt_success:0 "你救援的尝试成功了"
 agot_sailing.2005.b.tt_failure:0 "你的救援尝试失败了"
 agot_sailing.2005.c:0 "已经太晚了——关闭舱门！"
 agot_sailing.2006.t:0 "卡牌游戏"
 agot_sailing.2006.desc:0 "夜晚，当我从我的小屋中出门时，我听到人群嘈杂的声音从身后的甲板上传来。所有不在岗的劳力都聚集在一张桌子旁边，在烟尘与酒精之中，那里正在进行一场生动的卡牌游戏。\n\n“来吧船长，[first_mate.GetFirstName]叫牌了，来我们让你看看这场是怎么玩的吧！”\n\n人群中掀起一声喊声：“不要把[ROOT.Char.GetHerHis]所有钱全拿走，里边有我的工钱！”，随后紧跟着一阵阵大笑。"
 agot_sailing.2006.a:0 "让让位置，我加入"
 agot_sailing.2006.a.tt_success:0 "你赢得了游戏"
 agot_sailing.2006.a.tt_failure:0 "你输掉了你的钱"
 agot_sailing.2006.b:0 "现在，那张多出来的A被我放在？……"
 agot_sailing.2006.b.tt_success:0 "你的千术没被注意到"
 agot_sailing.2006.b.tt_failure:0 "你被抓了个正着"
 agot_sailing.2006.c:0 "伙计们你们玩吧，我就出来喝一杯"
 agot_sailing.2007.t:0 "难以忍受的不和谐音（Discord）"
 agot_sailing.2007.desc:0 "到目前为止，航程还算顺利，但我开始听到船员们在发牢骚了。没过多久，一个累得够呛的船员走过来找我。他胡子油亮，可两只手却磨得粗粗糙糙——一看就是跑过太多码头的水手。他嗓音沙哑，但那股憋不住的火气一听就明白。\n\n“这伙人都是好样的，卖力气没话说。就是都想去厄斯索斯更远的地方闯闯，不想老照着现在这条航线走。想往远处走这个念头，把几个小伙子撩得够呛。”\n\n我知道他说的是实话，可船员们可没借口说这些。上船的时候，他们就看过了那张写着航行路线的卷轴，应该明白在咱们攒够经验之前，不会去那个遥远的厄斯索斯。要是再不有所动作，我怕这帮人真要哗变了！"
 agot_sailing.2007.a:0 "命令船员继续前进。"
 agot_sailing.2007.a.tt_success:0 "船员们压下了自己的渴望。"
 agot_sailing.2007.a.tt_failure:0 "更多厄斯索斯什么时候端上来？"
 agot_sailing.2008.t:0 "无风之海"
 agot_sailing.2008.desc:0 "已经有好几天没有风吹过我们的船帆了。我看得出来船员们正在变得焦躁不安，但我也不知道现在该怎么办。[first_mate.GetFirstName]要求进入船舱见我，[first_mate.GetHerHis]脸上带着严肃的表情。\n\n“船长，船员们现在很担心。他们说我们的行为激怒了[ROOT.Char.GetFaith.WaterGodName]，我们需要供奉些东西来安抚[ROOT.Char.GetFaith.WaterGodHerHim]。”\n\n尽管我知道这完全是胡说八道，但这样做也许能提振提振士气。"
 agot_sailing.2008.a:0 "行，让我们像[ROOT.Char.GetFaith.WaterGodHerHim]献上金币和祈祷……"
 agot_sailing.2008.b:0 "我不想再听到这种事情了，我们等着来风就行！"
 agot_sailing.2008.c:0 "向船员解释风不会受[ROOT.Char.GetFaith.WaterGodName]支配。"
 agot_sailing.2009.t:0 "群星依旧"
 agot_sailing.2009.desc:0 "当我走出船舱时，已经是晚上了，甲板上异常安静。我看到一名船员安静地在那里坐着，[stargazer.GetHerHis]望着星星。\n\n“一个安静的夜晚，对吧？”\n\n[stargazer.GetSheHe|U]转头发现了我，吓了一跳。“船长！抱歉，我们看到你在……你知道吗？在我来这里之前，我从来没有真正花时间去欣赏过星星？”\n\n我点头同意，抬头看着远方天空的点点星光。“让我告诉你一些关于星星的事……”"
 agot_sailing.2009.a:0 "你可以使用它们来导航！"
 agot_sailing.2009.a.mariner_progress:0 "你获得[GetTrait('lifestyle_mariner').GetName( GetNullCharacter )]生活方式经验。"
 agot_sailing.2009.a.success.toast:0 "你分享了关于航海的见识"
 agot_sailing.2009.b:0 "它们是[ROOT.Char.GetFaith.NightGodName]的造物——你看到那团星星了吗？那是……"
 agot_sailing.2009.c:0 "总有一天，我们会像在大海中航行一样在航行在星海。"
 agot_sailing.2010.t:0 "航行事故！"
 agot_sailing.2010.desc:0 "连日来都是晴空万里，海面风平浪静，一路顺风，船上士气高昂。\n\n于是，这场突如其来的狂风让所有人措手不及。我听到身后传来一声痛苦的叫声，转身发现[sailor.GetFirstNameNoTooltip]趴在了甲板上，[sailor.GetHerHis]的腿折成一个吓人的角度。\n\n[first_mate.GetFirstName]在我身边，焦急地等待着我的指示。"
 agot_sailing.2010.a:0 "给我拿些布和木棍来，要快！"
 agot_sailing.2010.a.success:0 "你处理得很好"
 agot_sailing.2010.a.failure:0 "你把事情搞得更糟"
 agot_sailing.2010.b:0 "别管[sailor.GetHerHim]，这样[sailor.GetSheHe]下次就不会那么蠢了。"
 agot_sailing.2010.c:0 "来人帮帮[first_mate.GetFirstNameNoTooltip]，我什么都做不了！"
 agot_sailing.2011.t:0 "突然的大雾"
 agot_sailing.2011.desc:0 "启航不久后，我们的船只突然被毫无征兆升起的浓雾所笼罩。天空与四周的海面都消失在雾中，显然我们必须立刻做出抉择——\n\n是保持航向期待浓雾很快散去？还是调转船头，虽可能延误行程但避免在雾中彻底迷失方向？"
 agot_sailing.2011.a:0 "保持航向！这雾气很快就会散去……"
 agot_sailing.2011.a.success:0 "你们成功驶出了浓雾区"
 agot_sailing.2011.a.failure:0 "你们的船只在迷雾中迷失了方向"
 agot_sailing.2011.b:0 "我们还是把船掉头吧，接受延误"
 agot_sailing.2011.c:0 "真正的老海员从不畏惧迷雾——满帆前进！"
 agot_sailing.2100.t:0 "和风习习"
 agot_sailing.2100.desc:0 "我站在船头，海风轻柔地拂过我的头发，我尽情享受着这氛围。#Italic 这正是我此行所求#!我心想。我已经很久没有感到如此……放松了。\n\n我闭上眼睛，任思绪飘飞，只专注于海浪拍击的声音、脚下甲板轻柔的摇摆，以及近岸海鸥的阵阵啼鸣。是啊，这……就是这种感觉。"
 agot_sailing.2100.a:0 "我感觉压力随风而逝……"
 agot_sailing.2101.t:0 "闲谈片刻"
 agot_sailing.2101.opening:0 "我们的船只驶过一座大城镇，远处矗立着一座醒目的灯塔，大多数乘客都在欣赏风景。[woo_target.GetFirstName]在附近斜倚着：此刻正是闲聊的绝佳时机。"
 agot_sailing.2101.married:0 "我趁[woo_target.GetHerHis]的[woo_target.GetPrimarySpouse.GetWifeHusband][woo_target.GetPrimarySpouse.GetTitledFirstName]分心的时候行动。"
 agot_sailing.2101.married_absent:0 "[woo_target.GetHerHis|U]的[woo_target.GetPrimarySpouse.GetWifeHusband][woo_target.GetPrimarySpouse.GetTitledFirstName]离着很远……"
 agot_sailing.2101.currentspouse:0 "或许今天我就能赢得我[woo_target.GetWomanMan]的心！"
 agot_sailing.2101.desc:0 "\n\n“啊，[woo_target.GetTitledFirstName]，能在航船之上闲谈，实属难得。希望你在这美妙的航程中也能找到些许乐趣，”我用轻松的语气说道。\n\n我确信[woo_target.GetHerHis]的笑容不仅仅是出于礼貌……"
 agot_sailing.2101.a:0 "没有什么比在开阔的水域航行更棒的了！"
 agot_sailing.2101.a.tt:0 "#F 迎合[woo_target.GetFirstNamePossessiveNoTooltip]活跃的一面。#!"
 agot_sailing.2101.b:0 "与友人一同饱览世间风光，方为不虚此生。"
 agot_sailing.2101.b.tt:0 "#F 迎合[woo_target.GetFirstNamePossessiveNoTooltip]喜爱社交的一面。#!"
 agot_sailing.2101.c:0 "有时我真挺同情那些辛勤劳作的水手们。"
 agot_sailing.2101.c.tt:0 "#F 迎合[woo_target.GetFirstNamePossessiveNoTooltip]慈悲的一面。#!"
 agot_sailing.2101.d:0 "如果我有足够的能力，我会帮忙维持船只航行。"
 agot_sailing.2101.d.tt:0 "#F 迎合[woo_target.GetFirstNamePossessiveNoTooltip]勤勉的一面。#!"
 agot_sailing.2101.e:0 "若有需要，海洋的馈赠足以养活整个城镇。"
 agot_sailing.2101.e.tt:0 "#F 迎合[woo_target.GetFirstNamePossessiveNoTooltip]管理才能。#!"
 agot_sailing.2102.reply_sailor:0 "“$agot_sailing.2101.a$”\n\n"
 agot_sailing.2102.reply_pity:0 "“$agot_sailing.2101.c$”\n\n"
 agot_sailing.2102.reply_wastrel:0 "“$agot_sailing.2101.d$”\n\n"
 agot_sailing.2102.reply_steward:0 "“$agot_sailing.2101.e$”\n\n"
 agot_sailing.2102.opening:0 "当我们的船驶过一座大城镇，远处矗立着一座醒目的灯塔，吸引了大多数乘客的注意力时，[woo_actor.GetTitledFirstName]向我走来。\n\n[woo_actor.GetSheHe|U]沉思片刻，然后开口道："
 agot_sailing.2102.sailor:0 "$agot_sailing.2102.reply_sailor$我无法否认，这种刺激，这种行动，令人愉悦。"
 agot_sailing.2102.pity:0 "$agot_sailing.2102.reply_pity$也许[woo_actor.GetSheHe]和其他人不同。"
 agot_sailing.2102.wastrel:0 "$agot_sailing.2102.reply_wastrel$这是一个即将取得成功的[woo_actor.GetWomanMan]。"
 agot_sailing.2102.steward:0 "$agot_sailing.2102.reply_steward$有序的自然中确实存在美。"
 agot_sailing.2102.fallback:0 "我觉得很难想到如何回应。"
 agot_sailing.2102.a:0 "不可否认[woo_actor.GetSheHe]确实有一定的魅力……"
 agot_sailing.2103.sailor:0 "$agot_sailing.2102.reply_sailor$\n\n真让我恶心……"
 agot_sailing.2103.pity:0 "$agot_sailing.2102.reply_pity$\n\n要学会接受赞美！"
 agot_sailing.2103.wastrel:0 "$agot_sailing.2102.reply_wastrel$\n\n"
 agot_sailing.2103.steward:0 "$agot_sailing.2102.reply_steward$\n\n"
 agot_sailing.2103.fallback:0 "[woo_actor.GetSheHe|U]只是会意地对我微笑，让我#EMP 非常#!不舒服。"
 agot_sailing.2103.a:0 "真是个荒谬的[befriend_actor.GetWomanMan]。"
 agot_sailing.2104.reply:0 "[woo_target.GetTitledFirstName]似乎对我的回复反应热烈"
 agot_sailing.2104.sailor:0 "$agot_sailing.2104.reply$，[woo_target.GetSheHe]双眼发出火花，大声表示赞同。"
 agot_sailing.2104.pity:0 "$agot_sailing.2104.reply$，哀叹我们这个时代和身份的暴力运动。"
 agot_sailing.2104.wastrel:0 "$agot_sailing.2104.reply$，显然很惊讶找到了志趣相投的人。"
 agot_sailing.2104.steward:0 "$agot_sailing.2104.reply$，很高兴找到一个也能从这些事情中找到快乐的人。"
 agot_sailing.2104.fallback:0 "$agot_sailing.2104.reply$，久久地凝视着我的眼睛。"
 agot_sailing.2104.desc:0 "\n\n到[woo_target.GetSheHe]离开时，我们的每一句玩笑话都能感觉到明显的紧张——我就知道我能找到合适的话来赢得[woo_target.GetHerHim]的心！"
 agot_sailing.2104.a:0 "我想[woo_target.GetSheHe]上钩了……"
 agot_sailing.2105.reply:0 "看来我的回应没能打动[woo_target.GetTitledFirstName]"
 agot_sailing.2105.sailor:0 "$agot_sailing.2105.reply$，因为[woo_target.GetSheHe]避开了我的目光，向我道谢之后，很快就离开了。"
 agot_sailing.2105.pity:0 "$agot_sailing.2105.reply$，因为我的话让[woo_target.GetSheHe]泄了气，很快就失去了兴趣。"
 agot_sailing.2105.wastrel:0 "$agot_sailing.2105.reply$，因为[woo_target.GetSheHe]目光呆滞，似乎没怎么在听。"
 agot_sailing.2105.steward:0 "$agot_sailing.2105.reply$，因为[woo_target.GetSheHe]目光呆滞，似乎没怎么在听。"
 agot_sailing.2105.fallback:0 "$agot_sailing.2105.reply$，因为[woo_target.GetSheHe]看起来等不及要离我远点了。"
 agot_sailing.2105.desc:0 "\n\n在[woo_target.GetSheHe]向我道别之后，我一个人站在那里，只感觉自己就是个傻瓜，居然犯了这么大的错误……"
 agot_sailing.2105.a:0 "我当时在想什么……？"
 agot_sailing.2201.t:0 "真正的奖品"
 agot_sailing.2201.desc:0 "当我们驶离港口，驶向开阔水域时，我注意到了[ROOT.Char.Custom2('DescriptorNegative', murder_target)][murder_target.GetTitledFirstName]，[murder_target.GetSheHe]站在船的主桅附近，没有注意到我的观察。"
 agot_sailing.2201.agent:0 "\[murder_schemer.GetTitledFirstName]虽不在此，但这或许正是我们一直在等待的机会。\n\n"
 agot_sailing.2201.a:0 "就在今天了。"
 sailing_murder_accomplice_tt:0 "[THIS.Char.GetShortUIName|U]会尝试谋杀[murder_target.GetShortUIName]"
 agot_sailing.2202.opening:0 "我花了许多天时间跟踪[murder_target.GetTitledFirstName]，观察[murder_target.GetSheHe]在船上的日常活动。终于，一个雾气弥漫的夜晚来临，我确信我的目标独自一人在[murder_target.GetHerHis]船舱里。\n\n"
 agot_sailing.2202.desc:0 "我走进去，发现[murder_target.GetHerHim]正躺在[murder_target.GetHerHis]的床上睡得正香。"
 agot_sailing.2202.a:0 "只需一刀，便可永远摆脱[murder_target.GetHerHim]！"
 agot_sailing.2202.a.tt:0 "#EMP 机不可失，时不再来……#!"
 agot_sailing.2202.b:0 "不，不值得冒着险……"
 agot_sailing.2202.b.tt:0 "#EMP 万一[murder_target.GetSheHe]大难不死呢……？#!"
 sailing_kill_murder_missed:0 "[murder_target.GetFirstNameOrMeNoTooltip]真走运"
 sailing_kill_murder_injured:0 "[murder_target.GetFirstNameOrMeNoTooltip]“意外”受伤"
 sailing_kill_murder_killed:0 "[murder_target.GetFirstNameOrMeNoTooltip]“不幸”身亡"
 sailing_kill_murder_escape:0 "[murder_target.GetFirstNameOrMeNoTooltip]逃走了"
 sailing_target_attendee_killed_tt:0 "@death_icon![murder_target.GetShortUIName]死亡"
 sailing_target_attendee_injured_chance_tt:0 "[murder_target.GetShortUIName]可能会受伤"
 agot_sailing.2203.desc:0 "我以最快的速度行动，走到[murder_target.GetTitledFirstName]睡觉的床边。就在我拔出匕首的那一刻，我看到[murder_target.GetHerHim]动了一下。"
 agot_sailing.2203.agent:0 "我不想让[abduct_schemer.GetFirstName]失望……"
 agot_sailing.2203.success:0 "\n\n“[ROOT.Char.GetFirstNameNoTooltip]？！你——”[murder_target.GetFirstNameNoTooltip]话音未落，便颓然倒回床上，我的匕首已深深刺入[murder_target.GetHerHis]的心脏。\n\n甚至来不及说完最后的遗言，[murder_target.GetSheHe]便已命丧黄泉。我迅速掩盖痕迹，将[murder_target.GetHerHis]的尸体从船舱唯一的窗户抛入海中。"
 agot_sailing.2203.failure:0 "\n\n“[ROOT.Char.GetFirstNameNoTooltip]？！你这恶魔！”我的匕首刺去，[murder_target.GetFirstNameNoTooltip]竟设法翻滚躲开。随后，[murder_target.GetFirstNameNoTooltip]挣扎着站了起来。\n\n但当我试图重新站稳时，[murder_target.GetSheHe]冲出了舱门，惊恐地回头张望，声嘶力竭地呼喊着。我追不上[murder_target.GetHerHim]了……"
 agot_sailing.2203.a:0 "我得在有人起疑之前回到甲板上……"
 agot_sailing.2203.b:0 "该死！该死！该死！"
 agot_sailing.2204.t:0 "黑暗中的利刃"
 agot_sailing.2204.desc:0 "夜已深，我回到船舱，准备好好休息一番。正当我快要入睡时，身后传来一阵不寻常的声响，将我惊醒。我及时睁开眼睛，正好看见[murder_actor.GetTitledFirstName]高举着[murder_actor.GetHerHis]的匕首，向我扑来。"
 agot_sailing.2204.success:0 "\n\n我意识到[murder_actor.GetFirstNamePossessiveNoTooltip]眼中的决绝时已经晚了，我未能躲开[murder_actor.GetHerHis]的挥刺，“扑通”一声倒回床上，匕首深深刺入我的心脏。\n\n我的视线变得模糊，最后瞥见[murder_actor.GetFirstName]的身影，[murder_actor.GetHerHis]嘴角挂着一丝淡淡的、残忍的微笑。“永别了，[ROOT.Char.GetFirstNameNoTooltip]。”"
 agot_sailing.2204.failure:0 "\n\n[murder_actor.GetFirstNameNoTooltip]想杀我！我拼命躲闪，匕首落下时，尖端还是划伤了我。我笨拙地摔倒在地，但趁[murder_actor.GetSheHe]失去平衡而咒骂时，我挣扎着爬了起来。\n\n我冲出船舱，不顾一切地想找任何还没睡的人求助。"
 agot_sailing.2204.a:0 "什——！唔——"
 agot_sailing.2204.b:0 "继续跑！"
 sailing_ends_tt:2 "[GetActivityType('activity_agot_sailing').GetName]结束"
 agot_sailing.2301.t:1 "闲谈片刻"
 agot_sailing.2301.desc:0 "阳光明媚，我们的船在开阔的水面上快速航行，速度很快。[befriend_target.GetFirstName]站在不远处欣赏风景：这是我给[befriend_target.GetHerHim]留下深刻印象的机会。\n\n“[befriend_target.GetTitledFirstNameNoTooltip]！你好吗？我们不常有机会聊天。”我随意开场。\n\n[befriend_target.GetSheHe|U]似乎对我的搭话有点意外，但并没有反感的意思。"
 agot_sailing.2302.reply_pity:0 "“$agot_sailing.2101.c$”\n\n"
 agot_sailing.2302.reply_wastrel:0 "“$agot_sailing.2101.d$”\n\n"
 agot_sailing.2302.reply_steward:0 "“$agot_sailing.2101.e$”\n\n"
 agot_sailing.2302.opening:0 "当船只在平静的海面上疾驰时，[befriend_actor.GetTitledFirstName]悄悄走到我身边。\n\n[befriend_actor.GetSheHe|U]热情地笑着，开口说道："
 agot_sailing.2302.pity:0 "$agot_sailing.2302.reply_pity$我不能否认[befriend_actor.GetHerHis]的话是对的；这是一项残酷的活动。"
 agot_sailing.2302.wastrel:0 "$agot_sailing.2302.reply_wastrel$这当然是对的；我可以做的各种有用的事情而不是……"
 agot_sailing.2302.steward:0 "$agot_sailing.2302.reply_steward$有序的自然当然是我可以从中找到快乐的东西。"
 agot_sailing.2302.fallback:0 "我不知道该说什么。"
 agot_sailing.2302.a:0 "也许我们的共同点比我想象的要多。"
 agot_sailing.2303.pity:0 "$agot_sailing.2302.reply_pity$真软弱，世界是残酷的。"
 agot_sailing.2303.wastrel:0 "$agot_sailing.2302.reply_wastrel$我们都需要腾出时间来消遣。"
 agot_sailing.2303.steward:0 "$agot_sailing.2302.reply_steward$多么沉闷……"
 agot_sailing.2303.fallback:0 "[befriend_actor.GetSheHe|U]满怀希望地咧嘴一笑，显然是在期待某种相互的亲和力。"
 agot_sailing.2303.a:0 "说，那边是什么？"
 agot_sailing.2304.reply:0 "[befriend_target.GetTitledFirstName]似乎和我有很多共同点"
 agot_sailing.2304.pity:0 "$agot_sailing.2304.reply$，真为那些必须如此辛苦劳作的人感到可怜"
 agot_sailing.2304.wastrel:0 "$agot_sailing.2304.reply$，感叹[befriend_target.GetHerHis]的时间或许也可以用在更有意义的事情上。"
 agot_sailing.2304.steward:0 "$agot_sailing.2304.reply$，渴望分享对海上贸易路线的见解。"
 agot_sailing.2304.fallback:0 "$agot_sailing.2304.reply$，在我的陪伴下放松[befriend_target.GetHerHis]的举止。"
 agot_sailing.2304.desc:0 "\n\n我们继续前进，我们几乎无法分开——我知道我会找到合适的词来赢得[befriend_target.GetHerHim]的情谊！"
 agot_sailing.2304.a:0 "我想我赢得了[befriend_target.GetHerHim]的情谊……"
 agot_sailing.2305.reply:0 "我的话似乎对[befriend_target.GetTitledFirstName]没有太大影响"
 agot_sailing.2305.pity:0 "$agot_sailing.2305.reply$，因为[befriend_target.GetSheHe]奇怪地看了我一眼，挠了挠头。"
 agot_sailing.2305.wastrel:0 "$agot_sailing.2305.reply$，[befriend_target.GetSheHe]看起来完全被我的话吓坏了。"
 agot_sailing.2305.steward:0 "$agot_sailing.2305.reply$，[befriend_target.GetSheHe]很快就失去了兴趣，显然不想谈论贸易路线。"
 agot_sailing.2305.fallback:0 "$agot_sailing.2305.reply$，[befriend_target.GetSheHe]默不作声。"
 agot_sailing.2305.desc:0 "\n\n[befriend_target.GetSheHe]开始和别人聊天后独自站着，我觉得自己很傻……"
 agot_sailing.2305.a:0 "干得好，[ROOT.Char.GetFirstNameNoTooltip]"
 sailing_woo_success_key_title:0 "$agot_sailing.2301.t$"
 sailing_woo_failure_key_title:0 "$agot_sailing.2301.t$"
 sailing_murder_restrain_key_title:0 "$agot_sailing.2301.t$"
 sailing_kill_murder_killed_title:0 "$agot_sailing.2301.t$"
 sailing_kill_murder_missed_title:0 "$agot_sailing.2301.t$"
 sailing_befriend_success_key_title:0 "$agot_sailing.2301.t$"
 sailing_befriend_failure_key_title:0 "$agot_sailing.2301.t$"
 agot_sailing.3100.t:0 "规划前往瓦雷利亚的航线"
 agot_sailing.3100.desc:0 "当[first_mate.GetSheHe]开始召集其他船员时，我看到[first_mate.GetFirstNameNoTooltip]很是兴奋，他们很快开始工作，展开帆并拉起了锚。\n\n我走下甲板，进入我的房间，打开一个舱门，让阳光洒在船长桌上摊开的一排海图上。[first_mate.GetFirstNameNoTooltip]进来加入了我的工作。\n\n“船长，我们准备出发寻找被毁灭的瓦雷利亚了吗？”"
 agot_sailing.3100.a:0 "遵照我的每个指示！"
 agot_sailing.3100.a.success:0 "你成功地绘制出一条路线"
 agot_sailing.3100.a.success.tt:0 "你满怀信心地驶入大海。"
 agot_sailing.3100.a.failure.tt:0 "你找不到一条可行的路线。"
 agot_sailing.3101.t:0 "规划好的航线"
 agot_sailing.3101.desc:0 "在翻阅我的航海图并将它们与瓦雷利亚历史相关的笔记进行比较后，我沿着航线向东驶向十四火峰。\n\n拿出一支羽毛笔，我用一个大十字标记了这个位置，然后满脸自信地转向我的大副。\n\n“我们将驶过自由贸易城邦，向奴隶湾行进，然后转260度方位进入烟海！”"
 agot_sailing.3101.a:0 "我们启程！"
 agot_sailing.3102.t:0 "一条仍然隐匿着的路线"
 agot_sailing.3102.desc:0 "在翻阅我的航海图并将它们与瓦雷利亚历史相关的笔记进行比较后，我始终无法确定十四火峰内一处优良锚地的可能位置。真的，名副其实的大海捞针。\n\n我眼角的余光瞥见[first_mate.GetFirstNamePossessiveNoTooltip]的信心渐渐消失，这是因为[first_mate.GetSheHe]也意识到了我的无能为力。随后，[first_mate.GetSheHe]慢慢地把手放在我的肩膀上。\n\n“要不……我们下次再找吧？”"
 agot_sailing.3102.a:0 "我想[first_mate.GetSheHe]是对的。我们会航行到末路。"
 agot_sailing.3200.t:0 "丑陋海怪"
 agot_sailing.3200.desc:0 "航行中，我心神不宁，眼神时不时瞥向深海。\n\n当我向远方望去时，好像有什么东西破水而出，但又转瞬消失，一股不祥的寒意慢慢爬上我的脊梁。我再次发现它，离我越来越近，现在能够辨认出有东西在水中移动。\n\n当我开始更清楚地观察它时，恐惧几乎将我吞没——它有一艘船那么大，长着带触手的躯体和有冠的头颅，我从未见过这样的生物。那是传说中的海怪，是如今许多海域中常见的小鱿鱼的远亲。我曾以为它们不过是个传说！\n\n我看到它越来越近，朝着我船的眼中充满了恶意，现在必须马上做出选择。我是选择留下战斗，还是转身逃跑？"
 agot_sailing.3200.a:0 "弓箭手，准备射击！我们要杀死这只海怪！"
 agot_sailing.3200.a.success:0 "你成功杀死了海怪"
 agot_sailing.3200.a.success.tt:0 "你和你的船员庆祝你的伟大胜利。"
 agot_sailing.3200.a.failure:0 "你被海怪的猛攻打败了"
 agot_sailing.3200.a.failure.tt:0 "@death_icon!海怪摧毁了你的船，你即将面临死亡。"
 agot_sailing.3200.b:0 "快离开这儿！我们不可能打败它！"
 agot_sailing.3200.b.tt:0 "你试图逃回港口。"
 agot_sailing.3200.b.success.tt:0 "你和你的船设法逃脱，毫发无损。"
 agot_sailing.3200.b.failure.tt:0 "你逃脱了，但你的船受到了严重的损坏。"
 agot_sailing.3201.t:0 "海怪杀手"
 agot_sailing.3201.desc:0 "那野兽扑向船只时，船员们不断用箭射它，我则趁机寻找空隙，准备给它来一记狠的。最后，当它用那张没有牙齿的喙来抓我时，我险险避开，随即用我的[ROOT.Char.Custom('signature_weapon')]捅进了它的眼睛。\n\n野兽痛得嚎叫起来，剧烈挣扎，把我甩到了甲板上。不过，我那一击确实打中了要害——野兽最后尖叫了一声，便瘫倒落进海里，尸体浮了上来。\n\n船员们爆发出狂喜的欢呼，有人甚至掏出了私藏的酒来庆祝。大副[first_mate.GetFirstNameNoTooltip]拍了拍我的肩膀，说道：“干得漂亮，我的[ROOT.Char.GetTitleAsNameNoTooltip]！那畜生根本不是你的对手！”"
 agot_sailing.3201.a:0 "确实，确实！此刻，我们的道路畅通无阻……"
 agot_sailing.3201.b:0 "少说些没用的，我要大喝特喝！"
 agot_sailing.3202.t:0 "美味小吃"
 agot_sailing.3202.desc:0 "巨大的海怪轻易无视了我的船员拼命向它射出的箭，肆意用触手左右抓攫着船员！\n\n不久它找上我了。我第一次闪开了，然后又闪开了一次，然后——没有然后了。"
 agot_sailing.3202.a:0 "不……不要这样！"
 agot_sailing.3202.a.success.tt:0 "你奇迹般地死里逃生。"
 agot_sailing.3202.a.failure.tt:0 "@death_icon!你被整个生吞了，从此再也没出现过。"
 agot_sailing.3300.t:0 "补给不足"
 agot_sailing.3300.desc:0 "我在海上度过了很长时间，持续的强劲逆风意味着我的航程无法取得我希望的进展。更糟糕的是，我的大副告诉我，我们的补给品已经所剩无几，很可能在到达目的地之前就耗尽了。我的船员之间已经开始发生争斗，如果没有我的领导，这次航行肯定会以灾难告终。、\n\n是时候让我决定是使用胡萝卜还是大棒了。我可以尝试设计一个公平的方法来将我们剩余的补给分配更长的时间，或者我可以用暴力强制执行纪律，利用我在战争中维持补给的知识来帮助我们渡过难关。\n\n如果现在就返航，也许补给还够撑到我们抵达港口，但我现在真的要放弃吗？"
 agot_sailing.3300.a:0 "我相信我能分配好剩下的物资……"
 agot_sailing.3300.a.success:0 "你成功配给了剩余的物资"
 agot_sailing.3300.a.success.tt:0 "你将有足够的食物饮水来继续航程。"
 agot_sailing.3300.a.failure:0 "你算错了口粮的数量"
 agot_sailing.3300.a.failure.tt:0 "@death_icon!你和你的全体船员将饿死在海上。"
 agot_sailing.3300.b:0 "纪律就是答案，这艘船现在进入战时状态！"
 agot_sailing.3300.b.success:0 "你成功地让你的船员凝聚在一起"
 agot_sailing.3300.b.success.tt:0 "你对补给的了解和对军队纪律的要求确保你不会挨饿。"
 agot_sailing.3300.b.failure:0 "你没有处理好情况"
 agot_sailing.3300.b.failure.tt:0 "@death_icon!你的高压手段和无力执行纪律驱使船员们叛变，摆脱你的暴政。"
 agot_sailing.3300.c:0 "至少我努力过，但不值得继续下去了。"
 agot_sailing.3300.c.tt:0 "你回到港口。"
 agot_sailing.3301.t:0 "精打细算"
 agot_sailing.3301.desc:0 "通过一些精明的计算，我通过在我的船上实施严格的配给制度，设法以公平的方式延长了我们有限的补给。\n\n虽然我们的肚子可能不像我们旅程的第一段那样充实，至少没有一个船员会感到不公平。"
 agot_sailing.3301.a:0 "你一份，我一份。"
 agot_sailing.3302.t:0 "挨饿"
 agot_sailing.3302.desc:0 "当我为船上的每个人计算出相当大的每日食物和水定量时，他们情绪高涨。但希望很快就变成了绝望，因为我们的存货已经枯竭了，我们还在海上漂着，陆地遥不可及。\n\n我的喉咙很干，我的胃也因痉挛而疼痛。我剩下的时间不多了，我的许多船员也已经遇难了。\n\n为什么？"
 agot_sailing.3302.a:0 "我计算时是不是忘记加上那个了？"
 agot_sailing.3303.t:0 "紧急状态"
 agot_sailing.3303.desc:0 "尽管我的船员一开始表示反对，但我以坚定的决心和不妥协的态度，设法重新控制了我们的供应情况。\n\n尽管士气可能受到了打击，时常也会听到肚子咕咕叫的声音，但至少我可以再次专注于接下来的旅程。"
 agot_sailing.3303.a:0 "不得不如此。"
 agot_sailing.3304.t:0 "哗变"
 agot_sailing.3304.desc:0 "我试图用武力让我的船员服从的努力以灾难告终。我那些饥肠辘辘、心怀不满的人没有足够的力量让我们到达传说中的目的地，他们在叛变中推翻了我的船！\n\n他们把我的双臂紧紧地绑在背后，在他们争论要怎么处置我时，一条绳子被扔到我脚边，然后，他们的头领[mutiny_leader.GetTitledFirstNameNicknamed]，拖着我脚下的绳子，强迫我站在悬挂在我船舷上的匆忙组装的木板上，伸出手上的剑护卫我离开。\n\n“走吧，暴君……”"
 agot_sailing.3304.a:0 "懦夫！叛徒！"
 agot_sailing.3400.t:0 "末日浩劫的疯狂"
 agot_sailing.3400.desc:0 "我在一片歇斯底里的声音中醒来。走出船舱，发现平日沉着冷静的大副[first_mate.GetFirstName]正蜷在我门外抽泣。我摇晃着[first_mate.GetHerHim]的肩膀想问个究竟，却只得到混乱的回应，只好转而寻找其他船员。\n\n我在甲板上穿行，挨个询问那些双手颤抖、眼神空洞的水手。每个人都在诉说着同一个幻象——瓦雷利亚的末日重现，烈焰与灰烬的风暴吞噬岩石和血肉，连大海都被煮沸。那些画面如同烙铁般刻进了他们的脑海。\n\n我的船已死寂般停在海面。没有一片帆升起，没有一支桨划动。船员们蜷缩在甲板各处，向新旧诸神低声祈祷。他们不愿再前进了。他们#EMP 根本无法#!继续前进。\n\n“返航吧，船长，”[first_mate.GetFirstNameNoTooltip]声音嘶哑地恳求，“末日浩劫是在警告我们。我们会像瓦雷利亚人一样被烧死。”其他人应和着[first_mate.GetHerHis]的哀求，他们的恐惧如同瘟疫般蔓延开来。"
 agot_sailing.3400.a:0 "振作起来，伙计们——这只是一个梦，我们就快到了！"
 agot_sailing.3400.a.success:0 "你的话让你的船员安心"
 agot_sailing.3400.a.success.tt:0 "你召集你的船员，消除他们对你的追求的疑虑"
 agot_sailing.3400.a.failure:0 "他们对你的话充耳不闻"
 agot_sailing.3400.a.failure.tt:0 "你的船员感到绝望，将你抓了起来以确保他们的生存。"
 agot_sailing.3400.b:0 "末日浩劫只在你们的脑海中，但#EMP 我#!就在这里！"
 agot_sailing.3400.b.desc:0 "你试图用你的高[dread|E]让你的船员摆脱他们的愚蠢。"
 agot_sailing.3400.b.success.tt:0 "你用恐惧迫使船员回到岗位，他们不敢面对你的怒火，只得压下疑虑"
 agot_sailing.3400.b.failure.tt:0 "你的威胁不足以让船员克服疑虑"
 agot_sailing.3400.c:0 "深入骨髓的冷……我得回去。"
 agot_sailing.3400.c.tt:0 "你回到港口"
 agot_sailing.3401.t:0 "疯狂褪去"
 agot_sailing.3401.desc:0 "我的话刺穿了笼罩在船员们身上的那场狂热梦魇。我亲眼看见——他们眼中那股疯狂的光芒一点点退去，取而代之的是一种更沉稳的东西。理智像潮水一样重新涌了回来。\n\n船员们一个接一个清醒过来。[first_mate.GetFirstName]走到我身边，目光清澈，准备面对前方的航程。我们再次调转船头向东，驶向那片遥远的、被诅咒的海域。\n\n船员们默默操练着，但那不再是恐惧带来的沉默。那是一群曾凝视过深渊、却依然选择继续前行的人的沉默。"
 agot_sailing.3401.a:0 "我们已经战胜了恐惧。"
 agot_sailing.3402.t:0 "疯狂上脑"
 agot_sailing.3402.desc:0 "他们什么也听不进去。我先试着讲道理，然后又试着下命令——声音像刀子一样利。但恐惧已经把他们攥住了，恐惧让人除了自己那颗乱蹦的心，什么也听不见。\n\n我朝舵轮走去时，我的大副[first_mate.GetFirstName]挡在了我面前。[first_mate.GetHerHis]缓缓地摇了摇头。“抱歉了，船长。”\n\n我还没来得及推开他们，几只手已经抓住了我的胳膊，死死地扣住。“你疯了，”有人几乎是轻声低语，“末日搅乱了你的神志。我们这是在救你，救你自个儿。”"
 agot_sailing.3402.a:0 "我没疯，#EMP 你们#!才疯了！"
 agot_sailing.3500.t:0 "风起云涌"
 agot_sailing.3500.desc:0 "最后，一切都进行的很顺利。根据我的测算，我们应该已经接近失落的瓦雷利亚所在地，大海对我们很友好——清风徐徐，水波不兴。\n\n然而正当我这么想时，一切都变了。一阵狂风吹过我的船，怒涛也拍打在上面，声音仿佛深渊里的鼓声。然后开始下雨——先是涓涓细流，然后变成了倾盆大雨。这场风暴与我此生见过的任何一次都不一样，它是在最平静的日子里突然出现的风暴。\n\n在倾盆大雨中，我相信我能看到越来越多的乌云汇聚到船只上空。巨浪冲到我脸上，又落回深渊之中。可我没有时间去想这个了——我必须做出选择，是勇敢的面对风暴，还是在目的地前最后一道关口处折返。"
 agot_sailing.3500.a:0 "“我们#EMP 必须#!征服这场风暴！”"
 agot_sailing.3500.a.success:0 "你设法渡过风暴"
 agot_sailing.3500.a.success.tt:0 "你利用你在海上的所有经验安全地度过了风暴。"
 agot_sailing.3500.a.failure:0 "你的船消失在风暴中"
 agot_sailing.3500.a.failure.tt:0 "@death_icon!这场风暴是你无法应对的，你最终消失在了海浪中。"
 agot_sailing.3500.b:0 "愚蠢至极！我们必须回头！"
 agot_sailing.3500.b.tt:0 "你回到港口"
 agot_sailing.3501.t:0 "乘风破浪"
 agot_sailing.3501.desc:0 "我抓住船轮，将它拉过另一波猛烈的浪峰。雷声大作，闪电划破黑暗。\n\n我大声下令并再次调整索具，水手们拼命地执行我的命令。我的船被撞得遍体鳞伤，但我始终不愿放弃。\n\n最终风开始平静，海浪落下。暴风雨平息了，当太阳光再一次穿过云层时，我几乎无法想象会有比这更美丽的景象。我经历了一场无人能敌的风暴，征服了眼前的每一道浪潮。\n\n而在远处……那难道是？"
 agot_sailing.3501.a:0 "张开风帆，我们就快到了！"
 agot_sailing.3502.t:0 "葬身大海"
 agot_sailing.3502.desc:0 "我拼命地试图与风暴搏斗，对我的手下发出命令。但这不仅仅是一场风暴。\n\n我听到一声巨大的爆裂声，长期被风吹雨打的主桅杆再也支撑不住断开，在主甲板上翻滚。船开始分崩离析，猛烈的海浪将我卷入深渊。\n\n我生命的最后，周身汹涌的海水轰鸣不止，盖住了其他所有的声音……\n\n随后黑暗涌来。"
 agot_sailing.3502.a:0 "娜——迦……"
 agot_sailing.3900.t:0 "十四火峰"
 agot_sailing.3900.desc:0 "终于，我找到了破碎的群岛，脸上露出了狂野的笑容，一阵略带歇斯底里的笑声从中迸发出来——我做到了。征途是伟大的，许多人甚至怀疑它是否存在可能——但我做到了。那肯定是瓦雷利亚十四火峰最后的遗迹。\n\n当我靠近时，我皱起眉头陷入沉思。我要尝试着登陆吗？\n\n它的四周的边缘都是陡峭的悬崖，似乎无法轻易登陆——而且，周边的水与岩石都腾起浓烟。登陆那里的人会面临自我毁灭的风险——一如降临于古代龙王身上的末日。\n\n现在要做出选择了——是登陆，还是远远欣赏？"
 agot_sailing.3900.a:0 "没必要去冒险，单是抵达此处就值得被歌颂了！"
 agot_sailing.3900.a.tt:0 "你从你的船上恭敬地凝视着瓦雷利亚"
 agot_sailing.3900.b:0 "来都来了，我们去找个停泊点吧。"
 agot_sailing.3900.b.success:0 "你设法探索瓦雷利亚的废墟"
 agot_sailing.3900.b.failure:0 "你的探险以突然而意外的死亡作结。"
 agot_sailing.3901.t:0 "瓦雷利亚的宏伟"
 agot_sailing.3901.desc:0 "我决定不尝试登陆破碎群岛，耸立的悬崖和岩石遍布的海岸阻止了我的靠近。尽管如此，我还是让我的船尽可能的一点点接近它。与此同时，瓦雷利亚末日浩劫的全景一览无余。穿过永恒的浓烟，能看到破碎的尖塔与石柱，被彻底摧毁的城镇与住宅。即使是如此荒废的景象，也能依稀辨认出过往十四火峰的雄伟。\n\n最终，在环绕了几圈后，我们终于心满意足地返航了。我们找到了别人口中的神话，勇敢地冒着远超同龄人的危险，亲眼看到了久已失落的瓦雷利亚。没有人会再质疑我的技能和名声。"
 agot_sailing.3901.a:0 "我永远不会忘记这一幕。"
 agot_sailing.3902.t:0 "探索遗迹"
 agot_sailing.3902.desc:0 "我小心翼翼地走下船，试图找到一个立足点，接着向上望去。即使是如今，塑造岛屿的火山大部分已被海水吞没，其山巅仍旧高耸入云，但陡峭的悬崖高高地耸立在海浪之上。我睁大眼睛，终于在粗糙的岩石中发现一条小路，通向嵌入崖壁的陈旧台阶，这些台阶被末日浩劫彻底毁坏撕裂。\n\n走过阶梯，我终于到达了古瓦雷利亚的宫殿，出于某些原因，它依旧大致保存完好。寂静的建筑中冒出浓烟，绝望的空气将其包围。我四处张望，寻找一些有价值的东西……"
 agot_sailing.3902.a:0 "这里只剩下一片废墟。"
 agot_sailing.3903.t:0 "海难"
 agot_sailing.3903.desc:0 "我站在船甲板上，船只正沿着散布着残破冒烟悬崖的烟海航行。我的脑海中已然浮现出古老瓦雷利亚废墟里必定藏着的无数珍宝，黄金、宝石当然还有价值连城的瓦雷利亚钢……很快，这些就都是我的了。\n\n一声刺耳的#italic 巨响#!将我拉回现实。刹那间，天空被烟尘与火焰填满，燃烧的岩石如雨点般砸向船只，火势迅速蔓延开来。我惊恐地看着船帆燃起大火，烈焰从桅杆窜向甲板。\n\n在恐慌与痛苦的尖叫声中，四周升腾起难以忍受的高温。我来不及多想，纵身跃入下方汹涌的海水，却眼睁睁看着船只在眼前沉没。我拼命划水，试图逃离……"
 agot_sailing.3903.a:0 "我……我必须……继续游……"
 agot_sailing.3904.t:0 "废墟危机"
 agot_sailing.5500.t:0 "猎捕海洋生物"
 agot_sailing.5500.desc:0 "我们的船驶入广阔无垠的大洋深处，[first_mate.GetFirstName]走近我：“船长，我们正密切留意着海中的任何生物。一旦有人发现什么，会第一时间通知您。”\n\n我点点头，心中的期待感油然而生。不知今天我们会遇上什么样的海洋生物呢？"
 agot_sailing.5500.desc.a:0 "将我们之前的遭遇抛在脑后，我指示船员们继续仔细观察海平线。我们定会找到另一头海洋生物的，我对此确信无疑……"
 agot_sailing.5500.a:0 "都给我打起精神来，伙计们！"
 agot_sailing.5500.a.tt:0 "你将搜寻一头 #high 海洋生物#! 进行猎捕"
 agot_sailing.5501.t:0 "发现猎物"
 agot_sailing.5501.desc.a:0 "没过多久就传来了喊声。“发现海龟，船长！”\n\n在我们船边悠闲地游着，可以看到一头巨大的绿色 #high 大海龟#!。“我们动手吗，船长？”[first_mate.GetFirstName]问道。"
 agot_sailing.5501.a:0 "这应该不难……"
 agot_sailing.5501.a.tt:0 "你决定猎捕 #high 大海龟#!"
 agot_sailing.5501.desc.b:0 "没过多久就传来了喊声。“发现海豹，船长！”\n\n在我们船边悠闲地游着，可以看到一头圆滚滚的 #high 灰海豹#!。“我们动手吗，船长？”[first_mate.GetFirstName]问道。"
 agot_sailing.5501.b:0 "去抓住那头海豹！"
 agot_sailing.5501.b.tt:0 "你决定猎捕 #high 灰海豹#!"
 agot_sailing.5501.desc.c:0 "没过多久就传来了喊声。“发现海豚，船长！”\n\n在我们船边兴奋地游弋着，可以看到一头细长的 #high 白海豚#!。“我们动手吗，船长？”[first_mate.GetFirstName]问道。"
 agot_sailing.5501.c:0 "让我们来捕猎这只海豚。"
 agot_sailing.5501.c.tt:0 "你决定猎捕#high 白海豚#!。"
 agot_sailing.5501.desc.d:0 "没过多久就传来了喊声。“发现海象，船长！”\n\n在我们船附近的一座岩石小岛上懒洋洋地趴着一头巨大的#high 大海象#!。“我们动手吗，船长？”[first_mate.GetFirstName]问道。"
 agot_sailing.5501.d:0 "它的象牙肯定能卖个好价钱！"
 agot_sailing.5501.d.tt:0 "你决定猎捕#high 大海象#!。"
 agot_sailing.5501.desc.e:0 "没过多久就传来了喊声。“发现虎鲸，船长！”\n\n在我们船边飞速游动着，可以看到一头气势汹汹的 #high 虎鲸#!。“我们动手吗，船长？”[first_mate.GetFirstName]问道。"
 agot_sailing.5501.e:0 "把我的鱼叉拿来！"
 agot_sailing.5501.e.tt:0 "你决定猎捕#high 虎鲸#!。"
 agot_sailing.5501.desc.f:0 "没过多久就传来了喊声。“右舷发现鲸鱼，船长！”\n\n就在这时，一股巨大的水柱喷向空中，那鲸鱼庞大的身躯破浪而出。这是一头成年的 #high 座头鲸#!。“我们动手吗，船长？”[first_mate.GetFirstName]问道。"
 agot_sailing.5501.f:0 "伙计们，狩猎时间！"
 agot_sailing.5501.f.tt:0 "你决定猎捕#high 座头鲸#!。"
 agot_sailing.5501.desc.g:0 "没过多久就传来了喊声。“右舷发现鲸鱼，船长！”\n\n就在这时，一股巨大的水柱喷向空中，那鲸鱼庞大的身躯破浪而出。这是一头成年的 #high 抹香鲸#!。“我们动手吗，船长？”[first_mate.GetFirstName]问道。"
 agot_sailing.5501.g:0 "这东西肯定值大钱！"
 agot_sailing.5501.g.tt:0 "你决定猎捕#high 抹香鲸#!。"
 agot_sailing.5501.desc.h:0 "没过多久就传来了喊声。“正前方发现鲸鱼，船长！”\n\n就在这时，一股巨大的水柱喷向空中，那鲸鱼庞大的身躯破浪而出。这是一头巨型的 #high 蓝鲸#!，真正的海中巨兽。“我们动手吗，船长？”[first_mate.GetFirstName]问道。"
 agot_sailing.5501.h:0 "大家伙！我们上！"
 agot_sailing.5501.h.tt:0 "你决定猎捕#high 蓝鲸#!"
 agot_sailing.5501.desc.i:0 "航行了几小时后，我被一阵惊恐的尖叫声惊醒。“海怪！海怪！”船员们喊叫着，有些人已经吓得跑开了。\n\n看来是猎物先找到了我们，而不是我们找到它。船后的海水剧烈翻腾起来，很快露出一头庞大#high 海怪#!的鳞甲头颅，它的触手狂暴地抽打着四周。\n\n[first_mate.GetFirstName]跑到我跟前。“怎么办，船长？是战斗？还是尝试逃跑？”"
 agot_sailing.5501.i:0 "我绝不逃跑！准备战斗，伙计们！"
 agot_sailing.5501.i.tt:0 "你决定猎捕#high 海怪#!。"
 agot_sailing.5501.desc.j:0 "没过多久就传来了喊声。“右舷发现鲸鱼，船长！”\n\n就在这时，一股巨大的水柱喷向空中，那鲸鱼庞大的身躯破浪而出。船体突然被猛烈一撞，把我们都掀翻在地。我挣扎着起身时，[first_mate.GetFirstName]爬到我身边，脸色惨白如纸。\n\n“是——是白死神，船长！”[first_mate.GetSheHe]结结巴巴地说。我听说过那些传说：一头狡猾无比、充满恶意的白色巨鲸，据说它一直游荡在颤抖海的水域。它已击沉多艘船只，而现在……它找到我们了。"
 agot_sailing.5501.desc.k:0 "很长一段时间，大海一片寂静，仿佛海洋本身也屏息期待着什么。我心神不宁，在船舵附近踱来踱去。终于，瞭望手喊道：“发现鲸鱼！”\n\n我冲上前去，难以置信地睁大了眼睛。它找到我们了。白死神正高速逼近，径直破浪而来，目标正是我们的船。\n\n我闭眼一瞬间，随即抓起了我的鱼叉。“准备战斗，伙计们！”我大喊道，那头白鲸随即下潜，开始了它恶毒的攻击。"
 agot_sailing.5501.j:0 "今天就是白死神的死期！！"
 agot_sailing.5501.j.tt:0 "你决定猎捕#high 白死神#!。"
 agot_sailing.5501.k:0 "这附近肯定还有其他猎物。"
 agot_sailing.5501.k.tt:0 "你调转船头去别处寻找猎物。"
 agot_sailing.5502.t:0 "猎捕海龟"
 agot_sailing.5502.desc:0 "我手持鱼叉站在甲板上。船员们满怀期待地看着我瞄准船边游动的大海龟。\n\n“稳住……”我心想，同时紧了紧握住叉杆的手。"
 agot_sailing.5502.a:0 "预备，瞄准，放……"
 agot_sailing.5502.a.success:0 "你杀死了大海龟。"
 agot_sailing.5503.t:0 "猎捕海豹"
 agot_sailing.5503.desc:0 "我手持鱼叉站在甲板上。船员们满怀期待地看着我瞄准船边游动的灰海豹。\n\n“稳住……”我心想，同时紧了紧握住叉杆的手。"
 agot_sailing.5503.a:0 "预备，瞄准，放……"
 agot_sailing.5503.a.success:0 "你杀死了海豹。"
 agot_sailing.5504.t:0 "猎捕海豚"
 agot_sailing.5504.desc:0 "我手持鱼叉站在甲板上。船员们满怀期待地看着我瞄准船边游动的细长海豚。\n\n“稳住……”我心想，同时紧了紧握住叉杆的手。"
 agot_sailing.5504.a:0 "预备，瞄准，放……"
 agot_sailing.5504.a.success:0 "你杀死了海豚。"
 agot_sailing.5505.t:0 "猎捕海象"
 agot_sailing.5505.desc:0 "手持鱼叉站在甲板上。船员们满怀期待地看着我瞄准附近小岛上趴着的巨大海象。\n\n“稳住……”我心想，同时紧了紧握住叉杆的手。"
 agot_sailing.5505.a:0 "预备，瞄准，放……"
 agot_sailing.5505.a.success:0 "你杀死了海象。"
 agot_sailing.5506.t:0 "猎捕虎鲸"
 agot_sailing.5506.desc:0 "我手持鱼叉站在甲板上。船员们满怀期待地看着我瞄准船边水域逡巡的可怕虎鲸。\n\n“稳住……”我心想，同时紧了紧握住叉杆的手。"
 agot_sailing.5506.a:0 "预备，瞄准，放……"
 agot_sailing.5506.a.success:0 "你杀死了虎鲸。"
 agot_sailing.5507.t:0 "猎捕座头鲸"
 agot_sailing.5507.desc:0 "我手持鱼叉站在甲板上。船员们满怀期待地看着我瞄准船边破浪前行的灰色座头鲸。\n\n“稳住……”我心想，同时紧了紧握住叉杆的手。"
 agot_sailing.5507.a:0 "预备，瞄准，放……"
 agot_sailing.5507.a.success:0 "你杀死了座头鲸。"
 agot_sailing.5508.t:0 "猎捕抹香鲸"
 agot_sailing.5508.desc:0 "我手持鱼叉站在甲板上。船员们满怀期待地看着我瞄准船边猛烈冲破水面的强壮黑色抹香鲸。\n\n“稳住……”我心想，同时紧了紧握住叉杆的手。"
 agot_sailing.5508.a:0 "预备，瞄准，放……"
 agot_sailing.5508.a.success:0 "你杀死了抹香鲸。"
 agot_sailing.5509.t:0 "猎捕蓝鲸"
 agot_sailing.5509.desc:0 "我手持鱼叉站在甲板上。船员们满怀期待地看着我瞄准船边紧贴水面下游动的雄伟蓝鲸。\n\n“稳住……”我心想，同时紧了紧握住叉杆的手。"
 agot_sailing.5509.a:0 "预备，瞄准，放……"
 agot_sailing.5509.a.success:0 "你杀死了蓝鲸。"
 agot_sailing.5510.t:0 "猎捕海怪"
 agot_sailing.5510.desc:0 "当那头可怕的海怪开始攻击时，船上瞬间乱作一团。水手们惊恐地尖叫，有些人丢下武器试图逃离这生物的怒火。它强有力的触须砸在船壳上，冲击波震得许多船员摔倒在地。\n\n弓箭手们不断骚扰着野兽，进一步激怒了它。它那尖嘴的头颅愤怒地抬起，迅速逼近船头——我正手持鱼叉站在这里。在撞击前的最后几秒，我稳稳握紧叉杆。这是我唯一的机会，必须一击即中。"
 agot_sailing.5510.a:0 "你的死期到了，邪恶的畜生！"
 agot_sailing.5510.a.success:0 "你杀死了海怪"
 agot_sailing.5510.a.failure:0 "你的鱼叉被海怪的触须扫开了。"
 agot_sailing.5511.t:0 "猎捕白死神"
 agot_sailing.5511.desc:0 "又一道冲击波撕裂了船身。船体开裂，船开始倾斜。我疯狂地四下搜寻那头巨兽，但它太快了——它潜入船底深处，用那方方正正的额头从下方狠狠撞上来，船员们被甩得到处乱飞。白死神从船前的海浪中浮出，与我对视。\n\n我认出了它的狡诈，一阵寒意顺着脊椎窜上来。这可不是维斯特洛海域里能碰上的那种对手。可白死神居然敢来挑衅我，它这一现身——哪怕只是一瞬——就暴露了自己。我匆忙架好鱼叉，就在那野兽发出胜利的咆哮、准备再次冲上来的时候……"
 agot_sailing.5511.desc.a:0 "我感到握着鱼叉的手越收越紧，指关节都发白了。“你这次#italic 跑不掉#!了，畜生，”我喃喃自语，就在这时，又一阵冲击波撼动了整艘船，将许多船员抛飞。\n\n但我的脚步依然稳固。我决心要杀死这头怪物，彻底终结它邪恶的存在。\n\n我赶到船舵处，正好看到白死神在我面前得意地昂起身躯。它与我对视，挑战我，#italic 嘲弄#!我。怒火涌上心头，我举起手臂，开始瞄准……"
 agot_sailing.5511.a:0 "抓住你了，畜生……"
 agot_sailing.5511.a.success:0 "你杀死了白死神！"
 agot_sailing.5511.a.failure:0 "白死神躲开了你的鱼叉。"
 agot_sailing.5512.t:0 "白死神的诅咒"
 agot_sailing.5512.desc:0 "我们的船在海面上艰难地航行，船身伤痕累累，勉强漂浮着。白死神已消失在突然升起的浓雾之中。\n\n我说不出话来，仍未从与那头恶鲸的遭遇中回过神。我仍能感觉到它那刺骨的目光落在我身上。注视着我。等待着我。它就在外面某个地方，正为它的破坏洋洋得意。怒火在我心中升腾，我无助地攥紧了拳头，怒不可遏。\n\n决不能就这样算了！"
 agot_sailing.5512.a:0 "我#italic 一定#!要宰了你，畜生！"
 agot_sailing.5512.b:0 "不，我必须……我必须放下……"
 agot_sailing.9001.t:0 "航程结束"
 agot_sailing.9001.desc:0 "随着船缓缓靠岸，这次漫长的航行终于到头了。一股成就感涌上心头——我知道，经过这一路风浪，我作为水手的本事又精进了不少。虽然心里头还是想留在海上，可现在，我该回去打理领地的事务了……"
 agot_sailing.9001.a:0 "……然而我的心再次渴望大海。"
 agot_sailing.9002.t:0 "航程结束"
 agot_sailing.9002.desc:0 "随着我的船驶回港口，漫长的航行终于结束了。虽然这次旅程并没有如我所愿地结束，但我现在必须翻过这一页，回到治理我的领地的正事上来……"
 agot_sailing.9002.a:0 "……然而我的心再次渴望大海。"
 agot_sailing.9100.t:0 "扬起黑帆！"
 agot_sailing.9100.desc:0 "我大步走向码头，深深吸了一口咸湿的海风——提神，但跟看到自家船停在那儿的感觉比起来，差远了。船边和码头上都忙得热火朝天，水手们一边搬补给，一边扯着嗓子唱些粗俗的小调。\n\n军需官看见我走来，夸张地鞠了一躬。我笑着点点头回应，踏过跳板上船。大副扯开嗓子喊了一声：“船长来了！”船员们一片欢呼。一个个看着都干劲十足，巴不得立刻动手。\n\n现在只剩一件事：定下这次的任务。是逡巡大海，捕猎羔羊；还是深入虎穴，抢个盆满钵满？"
 agot_sailing.9100.a:0 "我们将会沿着海岸线劫掠！"
 agot_sailing.9100.b:0 "我们将逡巡海上！"
 agot_sailing.9110.t:0 "选择目标"
 agot_sailing.9110.desc:0 "军官们聚在起居舱里。我已经把好几张地图摊开在那张长长的橡木桌上，也跟他们说了，这次出海是去劫掠——只是还没定下去哪儿。我觉得让他们也掺和一下，多少能提提士气，于是就由着他们争，听他们掰扯每个目标的好处。\n\n吵了一个钟头，话头越来越冲。我觉着该收场了，把酒杯往桌上一顿——屋里立刻静下来，所有人都转过头，眼巴巴地望着我。"
 agot_sailing.9110.a:0 "让我们去抢[piracy_destination_1.GetName]"
 agot_sailing.9110.b:0 "[piracy_destination_2.GetName]该给我们上贡了！"
 agot_sailing.9110.c:0 "[piracy_destination_3.GetName]会血流成河！"
 agot_sailing.9111.t:0 "海军巡逻队！"
 agot_sailing.9111.desc:0 "目标越来越近，船员们的士气也涨了起来。黑帆已经升起，一股顺风从背后推着我们，船头像开了刃的刀子一样切开海浪。\n\n突然，桅楼上一声喊叫——发现一艘巡逻船。那船身修长，甲板上全是全副武装的人。我得做个决断：正面硬碰硬，试着用机动甩掉它，还是掉头往回跑……"
 agot_sailing.9111.a:0 "准备好，水手们！准备战斗！"
 agot_sailing.9111.a.success:0 "你击沉了巡逻舰"
 agot_sailing.9111.a.failure:0 "你的船在战斗中受损，但好在问题不大"
 agot_sailing.9111.toast.a.success:0 "喂鲨鱼去吧！"
 agot_sailing.9111.toast.a.failure:0 "你的船受损了！"
 agot_sailing.9111.c:0 "扬起帆来！我们要追上他们！"
 agot_sailing.9111.c.success:0 "你避开巡逻船"
 agot_sailing.9111.c.failure:0 "巡逻船击伤了你的船只并迫使你撤退"
 agot_sailing.9111.toast.c.success:0 "巡逻船避开了！"
 agot_sailing.9111.toast.c.failure:0 "你的船受损，被迫撤退"
 agot_sailing.9111.e:0 "这太过冒险，调转船首！"
 agot_sailing.9114.t:0 "劫掠"
 agot_sailing.9114.desc:0 "终于，前方的海岸露在我们面前，目标也在天边渐渐显出轮廓。海鸥在桅杆上方来回盘旋，船员们聚在甲板上，磨刀的磨刀，灌酒的灌酒——给自己壮胆。\n\n现在才是真正要拿主意的时候：怎么才能从这趟勾当里捞到最大的好处？"
 agot_sailing.9114.a:0 "我们去破坏[selected_piracy_destination.GetName]的生产。"
 agot_sailing.9114.a.success:0 "你降低了[selected_piracy_destination.GetName]的[development|E]和[garrison|E]规模。"
 agot_sailing.9114.a.failure:0 "你被守卫打伤"
 agot_sailing.9114.toast.a.success:0 "把这儿夷为平地！"
 agot_sailing.9114.toast.a.failure:0 "撤退！"
 agot_sailing.9114.b:0 "是时候获得你们的回报了！我们将洗劫[selected_piracy_destination.GetName]。"
 agot_sailing.9114.b.success:0 "你洗劫了[selected_piracy_destination.GetNameNoTooltip]"
 agot_sailing.9114.b.failure:0 "你被守卫打伤"
 agot_sailing.9114.toast.b.success:0 "烧杀掳掠！"
 agot_sailing.9114.toast.b.failure:0 "撤退！"
 agot_sailing.9114.c:0 "直接去找[selected_piracy_destination_baron.GetName]。"
 agot_sailing.9114.c.success:0 "你打伤了[selected_piracy_destination_baron.GetName]"
 agot_sailing.9114.c.failure:0 "你被[selected_piracy_destination_baron.GetName]打伤了"
 agot_sailing.9114.toast.c.success:0 "你赢得了决斗！"
 agot_sailing.9114.toast.c.failure:0 "你输掉了决斗！"
 agot_sailing.9114.d:0 "我们可以劫持村民！"
 agot_sailing.9114.d.success:0 "你绑走了一个村民"
 agot_sailing.9114.d.failure:0 "你被守卫打伤"
 agot_sailing.9114.toast.d.success:0 "绑票！"
 agot_sailing.9114.toast.d.failure:0 "失手了"
 agot_sailing.9114.e:0 "这太过冒险，调转船首！"
 agot_sailing.9120.t:0 "商船"
 agot_sailing.9120.desc:0 "天气一直不错，风向也顺，可一连几天，连艘船的影子都没见着。船员们越来越坐不住，开始互相拌嘴。我开始担心，要是再没点事让他们忙活，怕是真要窝里反了。\n\n这时，瞭望哨一声喊——西边海平线上有帆！我下令转舵，直奔那条船而去。等靠得近了，我不禁笑了——这回可碰上了一头肥羊。一艘大商船，载货沉甸甸的，吃水吃得很深。"
 agot_sailing.9120.a:0 "做好准备，兄弟们！我们要抢劫那艘商船！"
 agot_sailing.9120.a.success:0 "你洗劫了商船"
 agot_sailing.9120.toast.a.success:0 "商船被你洗劫了"
 agot_sailing.9120.a.failure:0 "遭到激烈的抵抗……"
 agot_sailing.9120.toast.a.failure:0 "撤退！"
 agot_sailing.9120.c:0 "如果我们能够夺取艘船，那为何要击沉她呢？"
 agot_sailing.9120.c.success:0 "你劫持了船并把它带回你的老巢"
 agot_sailing.9120.toast.c.success:0 "商船被劫持！"
 agot_sailing.9120.c.failure:0 "遭到激烈的抵抗……"
 agot_sailing.9120.toast.c.failure:0 "马有失蹄，人有失手！"
 agot_sailing.9120.e:0 "这太过冒险，调转船首！"
 agot_sailing.9130.t:0 "海盗的纷争"
 agot_sailing.9130.desc:0 "我们靠近[selected_piracy_destination.GetName]时，桅楼上传来一声喊——有船！定睛一看，来的可不是任人宰割的肥羊，而是一艘身经百战的海盗船，也是出来找食吃的。\n\n如果我们把它们干掉，那这些家伙的宝贝就归我们了，没有胆量，哪有产量？"
 agot_sailing.9130.a:0 "他们不会夺走我们的战利品。进攻！"
 agot_sailing.9130.a.success:0 "你洗劫了海盗船！"
 agot_sailing.9130.toast.a.success:0 "海盗船被你洗劫了！"
 agot_sailing.9130.a.failure:0 "你没能击败对手……"
 agot_sailing.9130.toast.a.failure:0 "船只受损！"
 agot_sailing.9130.c:0 "我将与他们的船长[dueled_pirate.GetName]决斗！"
 agot_sailing.9130.c.success:0 "你将决定[dueled_pirate.GetName]的命运"
 agot_sailing.9130.toast.c.success:0 "决斗获胜"
 agot_sailing.9130.c.failure:0 "你输掉了决斗"
 agot_sailing.9130.toast.c.failure:0 "你输了！"
 agot_sailing.9130.d:0 "扬帆，我们撤！"
 agot_sailing.9131.t:0 "[dueled_pirate.GetFirstNameNoTooltip]船长屈服"
 agot_sailing.9131.desc:0 "一场激烈的决斗之后，我终于站在了被我击败的对手面前，[dueled_pirate.GetSheHe]蜷缩在甲板上。双方船员似乎都僵在原地，专注地看着我，而我正享受着这个时刻。我的对手发出痛苦的呜咽声，打破了沉默，开始乞求宽恕。\n\n现在我必须决定如何最好地利用这场胜利。我已经证明了自己的勇武，但面前或许还有更大的机会……"
 agot_sailing.9131.a:0 "关到船底牢里去！"
 agot_sailing.9131.b:0 "大海不容弱者。让[dueled_pirate.GetFirstNameNoTooltip]走跳板！"
 agot_sailing.9131.c:0 "打得挺好，跟我干吧！"
 agot_sailing.9131.toast.c.success:0 "[dueled_pirate.GetNameNoTooltip]加入了你！"
 agot_sailing.9131.d:0 "你手下的船员技艺精湛……"
 agot_sailing.9131.d.success:0 "你招募敌方船员"
 agot_sailing.9131.toast.d.success:0 "招募了敌方船员"
 agot_sailing.9131.d.failure:0 "你没能说服船员"
 agot_sailing.9131.toast.d.failure:0 "船员拒绝加入你"
 agot_sailing.9131.e:0 "我并非全无怜悯。你走吧！"
 agot_sailing.9131.toast.e.success:0 "[dueled_pirate.GetNameNoTooltip]被释放了！"
 attempt_to_leave_valyria:0 "你设法离开瓦雷利亚"
 valyrian_artifact:0 "你发现了一件古瓦雷利亚的[artifact|E]"
 guest_reached_valyria_tt:0 "所有宾客获得[GetModifier( 'guest_reached_valyria' ).GetNameWithTooltip|L]"
 ship_sunk:0 "你的船消失在瓦雷利亚"
 ship_sunk_bell:0 "你的潜水钟已随船只一同遗失"
 death_by_kraken:0 "@death_icon!你被海怪碾碎"
 found_new_map:0 "你发现一张新的藏宝图"
 agot_sailing.0800.b:0 "我们没有足够的人手开船。"
 agot_sailing.1014.d.tt.success.toast:0 "你收到了一张真的藏宝图"
 agot_sailing.1014.d.tt.failure.toast:0 "你收到了一张假的藏宝图"
 agot_sailing.1014.e:0 "我很好，谢谢。"
 agot_sailing.3200.c:0 "是时候测试号角的力量了……"
 agot_sailing.3200.c_success:0 "你成功控制海怪的心智并命令它离开"
 agot_sailing.3200.c_failure:0 "你未能控制海怪的心智，它毁掉了你的船"
 agot_sailing.3503.desc:0 "我听见[host.GetFirstName]正试图命令船员继续前行，但这绝非一场普通的风暴。\n\n只听“咔嚓”一声巨响，那根长期受狂风肆虐的船上主桅杆，终于不堪重负，轰然砸向主甲板。船只开始解体，汹涌的巨浪瞬间将我卷入深海。\n\n我最后听到的，是周围翻江倒海的巨浪发出的、仿佛能吞噬一切的轰鸣……\n\n随后，便是一片漆黑。"
 agot_sailing.3902.b:0 "散开！看看还能找到些什么！"
 agot_sailing.3905.t:0 "废墟宝藏"
 agot_sailing.3905.desc:0 "我小心翼翼地跟着[host.GetTitledFirstNameNicknamed]走下船，踏上了瓦雷利亚的海岸。这片土地已有数百年无人踏足——自瓦雷利亚末日浩劫之后，自[GetScriptedCharacterByHistoryID('Varezys_1').GetName]试图夺回此地并自立为帝后，便再无人造访。\n\n上岸后，我望见了那座塑造了这座岛屿的火山，其峰顶直插云霄。我们所有人一起跟着[host.GetFirstNameNoTooltip]穿过废墟，由[host.GetSheHe]寻路前行。当[host.GetSheHe]走到残破石阶的尽头时，下令让众人在废墟周边搜寻，争取找到所有能发现的遗迹。\n我走上前准备开始搜寻，这时才意识到，我们正身处一座古瓦雷利亚宫殿保存最完好的废墟之中。即便废墟仍在散发着烟雾，这座宫殿依旧难掩其壮丽。\n\n时间一点点过去，我在碎石堆里翻找着，终于找到了它——一件[newest_found_artifact.GetName]。\n这件古老而珍贵的瓦雷利亚遗物就静卧在碎石之下，仿佛正等着我将它拾起，等着我拥有这件属于我的珍宝……"
 agot_sailing.3905.a:0 "古瓦雷利亚遗迹！"
 agot_sailing.3906.t:0 "劫掠废墟"
 agot_sailing.3906.desc:0 "[candle_store.GetName]还不够！搜遍废墟，翻遍每一块石头，给我找出更有价值的东西！\n\n我命令船员们出发，指望还能抢救出点别的值钱玩意。\n\n废墟还在我们四周冒着烟——末日带来的破坏太大了，要是这儿还能剩下什么，我倒要吃惊了。但这地方太危险，不能老来，所以趁还在的时候，能拿多少拿多少，然后赶紧返航。\n\n谁知道这片地狱里还藏着什么东西？船员们动作得快。"
 agot_sailing.3906.a:0 "把这里翻个底朝天！"
 agot_sailing.3907.t:0 "回家之旅"
 agot_sailing.6000.toast:0 "你在围城中偷走了一张藏宝图。"
 agot_sailing.6000.toast_desc:0 "你发现了一批资料，这些资料指向[sunken_ship_province.GetName]，一艘满载货物的商船曾在那里失踪。"
 agot_sailing.6001.t:0 "寻找残骸"
 agot_sailing.6001.desc:0 "沿着海岸航行时，我又看了一眼地图。我们正在接近那艘船最后已知的位置——应该就在这附近——就在它沉入海底的地方。\n\n我喊来[first_mate.GetName]，命令[first_mate.GetHerHim]让船员留意任何沉船残骸的迹象，同时也下令把潜水钟准备好。等找到沉船，我想第一时间就潜下去。\n\n不知道海底藏着多少好东西！"
 agot_sailing.6001.a:0 "给我搜！"
 agot_sailing.6001.a.success.tt:0 "你发现了残骸的踪迹"
 agot_sailing.6001.a.failure.tt:0 "你找不到那艘船的任何踪迹"
 agot_sailing.6002.t:0 "准备下潜"
 agot_sailing.6002.desc:0 "“[host.GetLadyLord]！”\n\n我正望着海面时，[first_mate.GetName]大声呼喊着吸引我的注意。\n\n我走到船边，[first_mate.GetSheHe]正站在那儿，盯着离锚地不远的水面——然后我也看见了。\n\n在平静海面下相当深的地方，有一处残骸！"
 agot_sailing.6002.a:0 "是时候游了！"
 agot_sailing.6002.b:0 "这太危险了。"
 agot_sailing.6003.t:0 "潜到深处去"
 agot_sailing.6003.desc:0 "随着潜水钟开始下降，我跟着它一同沉入深海，直到它触及海底。随着我们在海浪之下越沉越深，我环顾四周，确定自己的方位。\n\n我来抢劫的那艘船已经破碎，残骸散落在海床上。\n\n我无法判断残骸中潜藏着怎样的危险，也不知道这里还隐藏着什么宝藏，但一想到那说不尽的财富，我的心就怦怦直跳。"
 agot_sailing.6003.a:0 "看看我能找到什么！"
 agot_sailing.6004.t:0 "白鲸！"
 agot_sailing.6004.desc:0 "靠近残骸时，我不禁留意到：这片水域太安静了。废墟里没有潜伏的掠食者，连鱼都很少在附近游动。\n\n正当我琢磨这片令人不安的寂静时，远处传来了一声巨兽的呼唤。\n\n一头白鲸！\n\n终于，我在远处看到了她。难怪没有其他东西敢靠近——这是巨兽亲自赐下的福佑！\n\n我可以安心细细搜一遍残骸，把剩下来的财宝都带走。"
 agot_sailing.6004.a:0 "让我们把宝藏运回船上去吧"
 agot_sailing.6005.t:0 "拦路鲨"
 agot_sailing.6005.desc:0 "一群鲨鱼在通往沉船残骸的航线上游弋。我可以试着强行冲过去，或者悄悄绕过它们。如果危险太大，或许我只能放弃宝藏。"
 agot_sailing.6005.a:0 "我要强行冲过去！"
 agot_sailing.6005.a.success:0 "你强行驱散了鲨鱼"
 agot_sailing.6005.toast.a.success:0 "你强行从鲨鱼群中穿过，成功拿到了宝藏"
 agot_sailing.6005.a.failure:0 "鲨鱼实在太难对付了"
 agot_sailing.6005.toast.a.failure:0 "鲨鱼将你团团围住，迫使你逃离"
 agot_sailing.6005.b:0 "我可以小心地绕开它们。"
 agot_sailing.6005.toast.b.success:0 "你悄悄绕过鲨群，抵达了宝藏所在处"
 agot_sailing.6005.b.failure:0 "你没能绕过鲨群"
 agot_sailing.6005.toast.b.failure:0 "鲨鱼注意到你，你被迫撤退"
 agot_sailing.6005.c:0 "这太危险了。"
 agot_sailing.6006.t:0 "在幽暗深渊之中"
 agot_sailing.6006.desc:0 "骇人的景象往往是不祥之兆，我注视着眼前的战况，神经紧绷：一头长着触手的巨兽，想必就是传说中克拉肯，正与它的猎物纠缠扭打……一头比我旗舰大一倍的灰色巨鲸。\n\n但沉在下面的宝藏已近在咫尺。潜水将危机四伏，但此刻我真能掉头离去吗？"
 agot_sailing.6006.a:0 "这笔宝藏值得冒险！"
 agot_sailing.6006.a.success:0 "你会带着宝藏脱身"
 agot_sailing.6006.toast.a.success:0 "你带着宝藏返回船上"
 agot_sailing.6006.a.failure:0 "你被卷入了巨兽之间的战斗"
 agot_sailing.6006.toast.a.failure:0 "你在巨兽的搏斗中受了伤"
 agot_sailing.6006.b:0 "你不会为此赌上性命！"
 agot_sailing.6010.t:0 "船长归来"
 agot_sailing.6010.desc_big:0 "[host.GetTitledFirstName]带着一个从残骸中找回的箱子回来了。尽管箱子因多年沉于海底而锈蚀膨胀，但很快就被撬开了，露出了一大批久被认为已沉入深海的财宝。"
 agot_sailing.6010.desc_normal:0 "[host.GetTitledFirstName]带着一个从残骸中找回的箱子回来了。尽管箱子因多年沉于海底而锈蚀膨胀，但很快就被撬开了，露出一批久被认为已沉入深海的财宝。"
 agot_sailing.6010.desc_small:0 "[host.GetTitledFirstName]带着一个从残骸中找回的箱子回来了。尽管箱子因多年沉于海底而锈蚀膨胀，但很快就被撬开了，露出了一小批久被认为已沉入深海的财宝。"
 agot_sailing.6010.desc:0 "[host.GetTitledFirstName]空手而归。残骸处太过危险，无法靠近，这次探险一无所获。"
 agot_sailing.6010.a:0 "我们回家吧。"
 agot_sailing.6012.t:0 "坐失良机"
 agot_sailing.6012.desc:0 "我倒是平平安安回到了船上，可这趟出去，什么财宝也没捞着。我把这些人带到这儿来，到头来，他们记住的恐怕只有我的失败。"
 agot_sailing.6012.a:0 "我们还是回家吧"
 agot_sailing.9140.t:0 "战利品里有地图吗？"
 agot_sailing.9140.desc:0 "搜那位败将船长舱室的时候，我翻出了一堆地图。乍一看没什么特别，可仔细一瞧，里面竟藏着一张正儿八经的藏宝图——标记的是一艘船沉没的地方。\n\n随船的文件说，那艘船上载满了值钱货。说不定还有一部分躺在海底呢。要是咱们有潜水钟，就能出趟海，去那残骸里再翻翻！"
 agot_sailing.9140.a:0 "我们必须计划一次新的航行！"
