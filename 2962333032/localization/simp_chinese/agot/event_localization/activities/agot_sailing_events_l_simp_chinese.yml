 agot_sailing.5602.desc.g:0 "“正前方发现鲸鱼，船长！”\n\n喊声刚落，一股巨大的水柱喷向空中，鲸鱼庞大的身躯冲破海浪。那是一头成年的#high 黑色抹香鲸#!。“要捕猎吗，船长？”[first_mate.GetFirstName]问道。\n\n[host.GetTitledFirstNameNicknamed]抓起一支鱼叉，瞄准那头鲸鱼，然后——\n\n#italic 没中！#!那头抹香鲸用尾巴拍打船舷，把船震得厉害，我踉跄了一下。然后它潜入水中，不见了。"
 agot_sailing.5602.desc.h:0 "“正前方发现鲸鱼，船长！”\n\n喊声刚落，，一股巨大的水柱喷向空中，那鲸鱼庞大的身躯破浪而出。这是一头巨型的 #high 蓝鲸#!，真正的海中巨兽。“要捕猎吗，船长？”[first_mate.GetFirstName]问道。\n\n[host.GetTitledFirstNameNicknamed]抓起一支鱼叉，瞄准那头鲸鱼，然后——\n\n#italic 没中！#!那头蓝鲸反应迅速。它转身离开我们的船，潜入水中，从视野里消失了。"
