 nice_try_tt:0 "你所拥有的藏宝图没有一张指向你航行去的地方"
 agot_sailing.1016.t:0 "在船上？"
 agot_sailing.1016.desc:0 "“我常常#italic 不#!在#船上！”\n\n两个码头工人之间的争论引来了众多目光；[location.GetName]的港口因这一幕而安静下来。\n\n“不对，你说的那个不是‘在船上’。你不可能#bold 不#italic 在#!#!船上！”这番争执让我目瞪口呆，只觉自己的脑子正跟人生本身的复杂性较劲。这两个愚蠢的码头工到底是谁，他们究竟在吵些什么？"
 agot_sailing.1016.a:0 "真是件蠢事。"
 agot_sailing.1016.b:0 "不，不，他说得有道理！"
 agot_sailing.1016.b.tt:0 "死亡会不会就是一艘船？"
 agot_sailing.1991.t:0 "进入大海"
 agot_sailing.1991.desc:0 "随着船身猛地一倾，驶离港口，我望见[host.GetTitledFirstNameNicknamed]和[host.GetHerHis]大副[first_mate.GetFirstName]——他们凝视着远方的地平线，我们的冒险就此启程。"
 agot_sailing.1991.a:0 "我等不及要看看我们会猎到什么了！"
 agot_sailing.1991.b:0 "这将是一场痛快的劫掠！"
 agot_sailing.1991.c:0 "古瓦雷利亚的秘密等着我们……"
 agot_sailing.1991.d:0 "沉没的宝藏必将归我们所有！"
 agot_sailing.2001.c:0 "一个了解我船员的机会。"
 agot_sailing.2020.t:0 "$agot_sailing.2002.t$：救下船员"
 agot_sailing.2020.desc:0 "远处发现了另一艘船！它看起来即将沉没，经过简短商议，[host.GetTitledFirstNameNicknamed]决定设法营救那艘遇难船的船员。\n\n"
 agot_sailing.2020.desc.jerk:0 "我满心鄙夷地看着我们的水手将船靠得离残骸足够近，把绳索抛入翻涌的海水中，竟将那条必沉之船上的船员一个一个地拖了上来。\n\n真是白白浪费我们宝贵的时间和精力……"
 agot_sailing.2020.desc.normal:0 "我满怀欣慰与惊叹地看着我们的水手将船驶近残骸，把绳索抛入翻涌的海水中，成功将那艘注定沉没的船上的船员一一救了上来。\n\n他们感激我们的水手救命之恩，主动提出到了下一个港口便下船离开。"
 agot_sailing.2020.a:0 "干得好！"
 agot_sailing.2020.b:0 "[host.GetFirstNameNoTooltip]到底在想什么……"
 agot_sailing.2020.c:0 "目睹一艘船竟能沉得如此之快，真是令人着迷……"
 agot_sailing.2021.t:0 "$agot_sailing.2002.t$：葬身大海"
 agot_sailing.2021.desc:0 "远处发现了一艘船！眼看它就要沉没，简短商议之后，[host.GetTitledFirstNameNicknamed]决定尝试营救那艘遇难船的船员。\n\n就在我们靠近残骸时，一声巨响传来。那艘破船的主桅轰然砸向仅存的甲板，令我们惊骇的是，整艘船竟随之四分五裂，被贪婪的波涛一口吞噬。\n\n只有寥寥几名船员获救，其余的水手则随他们的船一同葬身于水墓之中！"
 agot_sailing.2021.a:0 "诸神保佑！真是一场灾难！"
 agot_sailing.2021.b:0 "海洋是位残忍的女士……"
 agot_sailing.2022.t:0 "$agot_sailing.2002.t$：强袭船只"
 agot_sailing.2022.desc:0 "远处发现了一艘船！眼看它就要沉没，简短商议之后，[host.GetTitledFirstNameNicknamed]决定洗劫残骸，将任何幸存者统统杀光。\n\n我看着我们的水手三下五除二地解决了那些精疲力竭的船员，把残骸翻了个底朝天，搜寻一切能到手的战利品。他们归来时，脸上都挂着满载而归的得意笑容。"
 agot_sailing.2022.a:0 "不义之财"
 agot_sailing.2022.b:0 "一人的损失，便是另一人的横财！"
 agot_sailing.2023.t:0 "$agot_sailing.2002.t$：走为上计"
 agot_sailing.2023.desc:0 "远处发现了一艘船！眼看它就要沉没，简短商议之后，我看着水手们将船靠上前去。奉[host.GetTitledFirstNameNicknamedPossessive]之命，他们跳帮登船，随即爆发了一场战斗。我亲眼目睹[host.GetTitledFirstNameNicknamed]在交战中负伤，随后[host.GetSheHe]和水手们带着尽可能多的收获返回……"
 agot_sailing.2023.a:0 "也许这样反倒更好。"
 agot_sailing.2024.t:0 "$agot_sailing.2002.t$：天涯过客"
 agot_sailing.2024.desc:0 "远处发现了一艘船！眼看它就要沉没，但简短商议之后，[host.GetTitledFirstNameNicknamed]还是决定避开残骸，绕行而过。\n\n我看着我们的船从那艘遇难船旁驶过，船上的水手们绝望地呼号着，随他们的船一同沉入了水墓。"
 agot_sailing.2024.a:0 "但愿我们的船比他们的更坚固。"
 agot_sailing.2024.b:0 "海洋是位残忍的女士……"
 agot_sailing.2024.c:0 "我们本可以夺下他们的财物……"
 agot_sailing.2024.d:0 "[host.GetFirstNameNoTooltip]选择绕行是正确的。"
 agot_sailing.2025.t:0 "$agot_sailing.2003.t$：宰割巨兽"
 agot_sailing.2025.desc:0 "我正悠然漫步于船的主甲板上，忽闻水手们兴奋地高喊起来——发现了一头鲸鱼！\n\n[host.GetTitledFirstNameNicknamed]下令尝试猎杀这头巨兽。船员们备好鱼叉，随即一柄利叉刺穿了鲸鱼的脊背。翻涌的海水霎时染红，那巨兽在短暂挣扎后便没了生息。\n\n我看着众人将更多绳索系上鲸尸，以便把它拖到附近岸边进行分割处理。"
 agot_sailing.2025.a:0 "即便是如此庞大的巨兽，也难逃被猎杀的命运。"
 agot_sailing.2025.b:0 "壮丽之死，不祥之兆。"
 agot_sailing.2026.t:0 "$agot_sailing.2003.t$：巨兽逃脱"
 agot_sailing.2026.desc:0 "我正悠然漫步于船的主甲板上，忽闻水手们兴奋地高喊起来——发现了一头鲸鱼！\n\n[host.GetTitledFirstNameNicknamed]下令尝试猎杀这头巨兽。船员们备好鱼叉，却无一能命中目标。转眼间，那头鲸便潜入水中，消失得无影无踪。"
 agot_sailing.2026.a:0 "令人扫兴！"
 agot_sailing.2026.b:0 "也许这就是最好的结局……"
 agot_sailing.2027.t:0 "$agot_sailing.2003.t$：搜寻鲸尸"
 agot_sailing.2027.desc:0 "我正悠然漫步于船的主甲板上，忽闻水手们兴奋地高喊起来——发现了一头鲸鱼！\n\n[host.GetTitledFirstNameNicknamed]下令尝试猎杀这头巨兽。船员们备好鱼叉，一齐掷出，终于有一柄利叉命中目标。海水霎时染红，但那头鲸却挣断了鱼叉，从追猎者眼前逃脱了。\n\n经过漫长的搜寻，船员们终于在附近一处岸边找到了搁浅的鲸尸，随即开始分割处理。"
 agot_sailing.2027.a:0 "逃得了一时，逃不了一世。"
 agot_sailing.2028.t:0 "$agot_sailing.2003.t$：宏伟猎获"
 agot_sailing.2028.desc:0 "我正悠然漫步于船的主甲板上，忽闻水手们兴奋地高喊起来——发现了一头壮美的白鲸！\n\n[host.GetTitledFirstNameNicknamed]是位经验丰富的猎手，[host.GetSheHe]无疑会把握住这个时机。鱼叉已备好；一股咸水喷涌而上，暴露了那头巨兽的方位。[host.GetFirstNameNoTooltip]凝神瞄准，将那带倒钩的叉尖深深扎入这头海中巨兽的血肉之中，并牢牢系上了一根绳索。待我们的船靠近，[host.GetFirstNameNoTooltip]抽出一杆长矛，刺出了致命一击。"
 agot_sailing.2028.a:0 "白红交织的奇观！"
 agot_sailing.2028.b:0 "如此壮美的生灵，本不该被打扰……"
 agot_sailing.2029.t:0 "$agot_sailing.2003.t$：须臾愚行"
 agot_sailing.2029.desc:0 "我正悠然漫步于船的主甲板上，忽闻水手们兴奋地高喊起来——发现了一头壮美的白鲸！\n\n[host.GetTitledFirstNameNicknamed]是位经验丰富的猎手，[host.GetSheHe]无疑会把握住这个时机。鱼叉已备好；一股咸水喷涌而上，暴露了那头巨兽的方位。[host.GetFirstNameNoTooltip]凝神瞄准，但那带倒钩的叉尖却偏离了目标。这头海中巨兽发出一声低沉悲凉的哀鸣，随即没入水中，永远消失了踪影。"
 agot_sailing.2029.a:0 "也许[host.GetFirstNameNoTooltip]并不像看上去那般技艺精湛。"
 agot_sailing.2030.t:0 "$agot_sailing.2003.t$：惊遇巨兽"
 agot_sailing.2030.desc:0 "我正悠然漫步于船的主甲板上，忽闻水手们兴奋地高喊起来——发现了一头鲸鱼！\n\n尽管猎杀这头鲸能带来财富，[host.GetTitledFirstNameNicknamed]却决定放它一条生路。我满怀惊叹地注视着那雄伟的生灵从船舷旁游过，喷吐着气息，将一股咸咸的水雾洒向空中。最后，它潜入平静的波涛之下，消失得无影无踪。"
 agot_sailing.2030.a:0 "真是一次宁静的体验！"
 agot_sailing.2030.b:0 "[host.GetFirstNameNoTooltip]居然放走了那头巨兽，真是愚蠢……"
 agot_sailing.2031.desc:0 "我眺望着无边无际的大海，突然响起一片惊呼。远处出现一艘船，正直直朝我们冲来。“海盗！”水手们大喊，纷纷看向[host.GetTitledFirstNameNicknamed]，等他发话。\n\n“别担心，弟兄们！”[host.GetSheHe]一脸镇定地说，“他们哪是咱们的对手！”\n\n果然，短暂交火之后，海盗被我们打跑了，消失在这片安静广阔的大海里。"
 agot_sailing.2031.a:0 "别再回来了！"
 agot_sailing.2032.desc:0 "我眺望着无边无际的大海，突然响起一片惊呼。远处出现一艘船，正直直朝我们冲来。“海盗！”水手们大喊，纷纷看向[host.GetTitledFirstNameNicknamed]，等他发话。\n\n“准备战斗！”[host.GetSheHe]拔出剑下令。转眼间，海盗就冲上了我们的船。\n\n然而交手没多久，海盗就打倒了我们的船员，抢走了值钱的东西，消失在一望无际的汪洋中。"
 agot_sailing.2032.a:0 "该死！"
 agot_sailing.2033.desc:0 "我眺望着无边无际的大海，突然响起一片惊呼。远处出现一艘船，正直直朝我们冲来。“海盗！”水手们大喊，纷纷看向[host.GetTitledFirstNameNicknamed]，等他发话。\n\n“升起所有的帆！”[host.GetSheHe]下令，“我们能甩掉他们！”果然，我们的船够快，一直跟海盗船保持着安全距离。没过多久，那帮强盗就放弃了，消失在海平线尽头。"
 agot_sailing.2033.a:0 "在船上干一杯！"
 agot_sailing.2034.desc:0 "我正站在船首沉思，忽然一声大叫吓了我一跳。“有人落水了！有人落水了！”\n\n我连忙循声冲去，只见[host.GetTitledFirstNameNicknamed]从甲板上一跃而下，没入波涛之中。等[host.GetSheHe]重新冒出水面时，[host.GetSheHe]正拖着那名溺水的水手朝船边游来。"
 agot_sailing.2034.a:0 "好身手！"
 agot_sailing.2035.desc:0 "我正站在船首沉思，忽然一声大叫吓了我一跳。“有人落水了！有人落水了！”\n\n我连忙循声冲去，只见[host.GetTitledFirstNameNicknamed]从甲板上一跃而下，没入波涛之中。等[host.GetSheHe]重新浮出水面时，我发现[host.GetSheHe]两手空空……"
 agot_sailing.2035.a:0 "又折了一名水手……"
 agot_sailing.2036.desc:0 "我正站在船首沉思，忽然一声大叫吓了我一跳。“有人落水了！有人落水了！”\n\n我连忙循声冲去，只见[host.GetTitledFirstNameNicknamed]正在甲板上高声发令，组织仓促的救援。不多时，[host.GetSheHe]便将那名溺水的水手拉回船上，救下了一条命。"
 agot_sailing.2036.a:0 "了不起！"
 agot_sailing.2037.desc:0 "我正站在船首沉思，忽然一声大叫吓了我一跳。“有人落水了！有人落水了！”\n\n我连忙循声冲去，只见[host.GetTitledFirstNameNicknamed]正在甲板上高声发令，组织仓促的救援。然而令船员们沮丧的是，那名溺水的水手早已消失在波涛之下了……"
 agot_sailing.2037.a:0 "不幸的损失……"
 agot_sailing.2038.desc:0 "我正站在船首沉思，忽然一声大叫吓了我一跳。“有人落水了！有人落水了！”\n\n我连忙循声冲去，只见[host.GetTitledFirstNameNicknamed]正在甲板上高喊下令。“别管他！我们可没时间冒险救人。”"
 agot_sailing.2038.a:0 "大海有时真是残酷无情……"
 agot_sailing.2040.t:0 "$agot_sailing.2007.t$：怨声退散"
 agot_sailing.2040.desc:0 "航行至今还算顺利，但渐渐地，我开始听到船员们的抱怨声。水手们干活很卖力，可其中一些人却在挑拨离间。\n\n我反复听到同样的抱怨：“我们什么时候去探索厄斯索斯？我们想看到更多厄斯索斯！”\n\n[host.GetTitledFirstNameNicknamed]很快就厌倦了这些没完没了的问题，并设法说服船员把心思集中在我们原定的目的地上。"
 agot_sailing.2040.a:0 "这下他们该闭嘴了。"
 agot_sailing.2041.t:0 "$agot_sailing.2007.t$：何时能看到更多厄斯索斯？"
 agot_sailing.2041.desc:0 "航行至今还算顺利，但渐渐地，我开始听到船员们的抱怨声。水手们干活很卖力，可其中一些人却在挑拨离间。\n\n我反复听到同样的抱怨：“我们什么时候去探索厄斯索斯？我们想看到更多厄斯索斯！”\n\n[host.GetTitledFirstNameNicknamed]也同样恼火，但还是吩咐船员不要理会这些牢骚，无视那些不和谐的杂音。"
 agot_sailing.2041.a:0 "还有完没完？"
 agot_sailing.2042.t:0 "$agot_sailing.2008.t$：献祭"
 agot_sailing.2042.desc:0 "已经好几天了，我们连一丝能鼓起船帆的风都没感受到。我能看出船员们越来越焦躁，但我不知道能为此做些什么。\n\n只见[host.GetTitledFirstNameNicknamed]正与船上的大副交谈，大副试图说服船长向诸神献祭，祈求他们赐福，让海风重新吹起。而[host.GetFirstNameNoTooltip]确实立刻就同意了这一提议，于是献祭开始进行。"
 agot_sailing.2042.a:0 "希望这能管用……"
 agot_sailing.2043.t:0 "$agot_sailing.2008.t$：耐心等待"
 agot_sailing.2043.desc:0 "已经好几天了，我们连一丝能鼓起船帆的风都没感受到。我能看出船员们越来越焦躁，但我不知道能为此做些什么。\n\n只见[host.GetTitledFirstNameNicknamed]正与船上的大副交谈，大副试图说服船长向诸神献祭，祈求他们赐福，让海风重新吹起。但[host.GetFirstName]摇了摇头[host.GetSheHe]。“我不想再听这种胡言乱语！我们会等风自己来找我们的。”"
 agot_sailing.2043.a:0 "希望我们不会被困在这里……"
 agot_sailing.2044.t:0 "$agot_sailing.2008.t$：虔诚的训诫"
 agot_sailing.2044.desc:0 "已经好几天了，我们连一丝能鼓起船帆的风都没感受到。我能看出船员们越来越焦躁，但我不知道能为此做些什么。\n\n只见[host.GetTitledFirstNameNicknamed]正与船上的大副交谈，大副试图说服船长向诸神献祭，祈求他们赐福，让海风重新吹起。但[host.GetFirstName]摇了摇头[host.GetSheHe]，并试图向船员们解释，风并不受任何海神的支配。"
 agot_sailing.2044.a:0 "这明智吗？"
 agot_sailing.2045.desc:0 "连日来都是晴空万里，海面风平浪静，一路顺风，船上士气高昂。\n\n于是，这场突如其来的狂风让所有人措手不及。我听到身后传来一声痛苦的叫声，转身发现[sailor.GetFirstName]趴在了甲板上，[sailor.GetHerHis]的腿折成一个吓人的角度。[host.GetTitledFirstNameNicknamed]正跪在受伤的水手身旁，试图将腿骨复位。\n\n只听一声令人牙酸的脆响，那条腿被推回了比较自然的位置，水手的痛苦几乎立刻得到了缓解。"
 agot_sailing.2045.a:0 "干得好，船长！"
 agot_sailing.2046.desc:0 "连日来都是晴空万里，海面风平浪静，一路顺风，船上士气高昂。\n\n于是，这场突如其来的狂风让所有人措手不及。我听到身后传来一声痛苦的叫声，转身发现[sailor.GetFirstName]趴在了甲板上，[sailor.GetHerHis]的腿折成一个吓人的角度。[host.GetTitledFirstNameNicknamed]半跪在受伤的水手身旁，试图为腿复位。\n\n随着一声令人不快的咔嚓声，腿是复位了，但水手痛苦的尖叫表明，船长帮了个倒忙……"
 agot_sailing.2046.a:0 "哦不！"
 agot_sailing.2047.desc:0 "连日来都是晴空万里，海面风平浪静，一路顺风，船上士气高昂。\n\n于是，这场突如其来的狂风让所有人措手不及。我听到身后传来一声痛苦的叫声，转身发现[sailor.GetFirstName]趴在了甲板上，[sailor.GetHerHis]的腿折成一个吓人的角度。[host.GetTitledFirstNameNicknamed]正站在受伤的水手旁，脸上带着不悦的表情。“下次小心点！海洋可不是笨手笨脚的水手该待的地方......”"
 agot_sailing.2047.a:0 "话虽刺耳，却是事实。"
 agot_sailing.2048.desc:0 "连日来都是晴空万里，海面风平浪静，一路顺风，船上士气高昂。\n\n于是，这场突如其来的狂风让所有人措手不及。我听到身后传来一声痛苦的叫声，转身发现[sailor.GetFirstName]趴在了甲板上，[sailor.GetHerHis]的腿折成一个吓人的角度。[host.GetTitledFirstNameNicknamed]正站在受伤的水手身旁，[host.GetHerHis]脸上满是惊愕的表情。[first_mate.GetName]很快赶到，于是船长要[first_mate.GetHerHim]处理此事……"
 agot_sailing.2048.a:0 "希望腿能接好。"
 agot_sailing.2049.t:0 "$agot_sailing.2011.t$：逃离"
 agot_sailing.2049.desc:0 "离开港口后不久，我们的船便被一团凭空涌起的浓雾所笼罩。天空被遮蔽，四周的海洋也模糊不清。很快，我们就意识到必须采取行动了。\n\n[host.GetTitledFirstNameNicknamed]决定保持航向，希望能在不迷失方向的情况下逃出这片迷雾。而这场赌博确实得到了回报——雾气开始消散，船只回到了预定的航线上。"
 agot_sailing.2049.a:0 "真走运！"
 agot_sailing.2050.t:0 "$agot_sailing.2011.t$：迷失"
 agot_sailing.2050.desc:0 "离开港口后不久，我们的船便被一团凭空涌起的浓雾所笼罩。天空被遮蔽，四周的海洋也模糊不清。很快，我们就意识到必须采取行动了。\n\n[host.GetTitledFirstNameNicknamed]决定保持航向，希望能在不迷失方向的情况下逃出这片迷雾。但即便航行了好几个小时，雾气似乎仍无止境……"
 agot_sailing.2050.a:0 "我们还能摆脱它吗？"
 agot_sailing.2051.t:0 "$agot_sailing.2011.t$：掉头"
 agot_sailing.2051.desc:0 "离开港口后不久，我们的船便被一团凭空涌起的浓雾所笼罩。天空被遮蔽，四周的海洋也模糊不清。很快，我们就意识到必须采取行动了。\n\n[host.GetTitledFirstNameNicknamed]决定调转船头，以避免迷失航向的危险。这无疑会造成延误，但至少我们不会在雾中迷失数日。"
 agot_sailing.2051.a:0 "明智的决定！"
 agot_sailing.2052.t:0 "$agot_sailing.2011.t$：沉着操船"
 agot_sailing.2052.desc:0 "离开港口后不久，我们的船便被一团凭空涌起的浓雾所笼罩。天空被遮蔽，四周的海洋也模糊不清。很快，我们就意识到必须采取行动了。\n\n[host.GetTitledFirstNameNicknamed]，一位经验丰富的水手，没有显露出丝毫忧虑之色。“真正的航海者无惧迷雾，”[host.GetSheHe]宣称，“保持航向，笔直向前！这雾很快就会散的。”"
 agot_sailing.2052.a:0 "但愿你是对的……"
 agot_sailing.2102.reply_socialite:0 "“$agot_sailing.2101.b$”\n\n"
 agot_sailing.2102.socialite:0 "$agot_sailing.2102.reply_socialite$我知道[woo_actor.GetSheHe]暗指的象征意义。"
 intent_sailing_conversation:0 "[TARGET_CHARACTER.GetShortUIName|U]在航行过程中更关心[CHARACTER.GetShortUIName]而不是谈话。"
 agot_sailing.2103.socialite:0 "$agot_sailing.2102.reply_socialite$\n\n如此傲慢……"
 agot_sailing.2104.socialite:0 "$agot_sailing.2104.reply$，几乎对我另眼相看。"
 agot_sailing.2105.socialite:0 "$agot_sailing.2105.reply$，因为[woo_target.GetSheHe]只是不屑一顾地转动着[woo_target.GetHerHis]的眼睛。"
 agot_sailing.2302.reply_sailor:0 "“$agot_sailing.2101.a$”\n\n"
 agot_sailing.2302.sailor:0 "$agot_sailing.2302.reply_sailor$这不是我可以挑剔的陈述。"
 agot_sailing.2303.opening:0 "[befriend_actor.GetTitledFirstName]在航船平稳驶向目的地的途中向我走来。"
 agot_sailing.2303.sailor:0 "$agot_sailing.2302.reply_sailor$\n\n我完全不同意……"
 agot_sailing.2304.sailor:0 "$agot_sailing.2304.reply$，兴奋地深入探讨在港口正确抛锚和系泊船舶的种种细节。"
 agot_sailing.2305.sailor:0 "$agot_sailing.2305.reply$，因为[befriend_target.GetSheHe]只是礼貌地笑了笑，清了清嗓子，显然是在寻找一种礼貌的方式来结束我们的谈话。"
 agot_sailing.3201.t_horn:0 "海怪驭者"
 agot_sailing.3201.desc_horn:0 "船员们退到我身后，我把海怪号角举到嘴边，吹出了那深沉、如同雷鸣般的声响。声音掠过海面，没过多久，那头巨兽就开始退缩，沉回了它来时的那片深渊。这下毫无疑问了——号角果然真有魔力。\n\n船员们爆发出狂喜的欢呼，有人甚至翻出了藏起来的酒来庆祝。大副[first_mate.GetFirstNameNoTooltip]用力拍了拍我的肩膀，说：“干得漂亮，我的[ROOT.Char.GetTitleAsNameNoTooltip]！那家伙根本不是对手！”"
 agot_sailing.3300.d:0 "[man_meat.GetName]看起来真是诱人……"
 agot_sailing.3300.d.tt:0 "你选择吃掉[man_meat.GetNameNoTooltip]以喂饱船员"
 agot_sailing.3305.desc:0 "我们已在海上漂泊了很久，强劲的逆风致使航程缓慢，远不及预期。更糟糕的是，补给已经岌岌可危……\n\n[host.GetTitledFirstNameNicknamed]曾试图说服船员实施严格配给，但为时已晚。最后的储备也已耗尽，我们很快也要撑不下去了。"
 agot_sailing.3305.a:0 "拜托了，就一小口……"
 agot_sailing.3306.t:0 "水上珍馐"
 agot_sailing.3306.desc:0 "航行已经彻底出了岔子，我们的补给品也减少到只有残渣剩饭……船上有一些人甚至在试图抓老鼠失败后，开始啃咬磨损的缆绳。\n\n[man_meat.GetTitledFirstName]一直没完没了地抱怨[man_meat.GetHerHis]饿得难受，好像我们其他人就没有同样的痛苦。这足以把人#emp 逼疯#!！\n\n[man_meat.GetHerHis|U]的抱怨似乎耗尽了[man_meat.GetHerHis]全部力气，[man_meat.GetSheHe]昏倒在地，四肢摊开躺在甲板上。我不禁注意到[man_meat.GetHerHis]瘦骨嶙峋的双腿看起来是多么……鲜嫩。#emp 啊，肉的味道……这绝对是我需要用来重振精神的东西！#!"
 agot_sailing.3306.a:0 "伙计们，又能吃到肉了！"
 agot_sailing.3306.d.tt:0 "你吃掉了[man_meat.GetTitledFirstName]，并让船员们自行选择饱餐一顿。"
 agot_sailing.3307.desc:0 "航行已经彻底出了岔子，我们的补给品也减少到只有残渣剩饭……船上有一些人甚至在试图抓老鼠失败后，开始啃咬磨损的缆绳。\n\n[man_meat.GetTitledFirstName]一直没完没了地抱怨[man_meat.GetHerHis]饿得难受，好像我们其他人就没有同样的痛苦。这足以把人#emp 逼疯#!！\n\n等[man_meat.GetFirstNameNoTooltip]昏过去，摊开躺在甲板上，我注意到[host.GetTitledFirstNameNicknamed]不怀好意地盯着[man_meat.GetHerHim]。#emp [host.GetSheHe]该不会是想吃掉[man_meat.GetHerHim]吧？#!\n\n出手极快！据说恐惧会让肉变味，[host.GetFirstNameNoTooltip]在[man_meat.GetFirstNamePossessiveNoTooltip]睡着时割开了[man_meat.GetHerHis]的喉咙。血的铁腥气刺激着我的鼻子。我的肚子叫了一声。#emp 说到底，我为什么不吃呢？[man_meat.GetSheHe|U]反正已经死了！#!"
 agot_sailing.3307.a:0 "这都是为了生存！"
 agot_sailing.3307.b:0 "不，不，我必须抵御诱惑。"
 agot_sailing.3307.b.success_tt:0 "你靠微薄的口粮勉强撑过了饥饿"
 agot_sailing.3904.desc_one:0 "踏上陆地后，我们发现一条破碎的小径蜿蜒通向陡峭悬崖的顶端，俯瞰着烟海。台阶很险，迫使我们只能放慢脚步。最终，我们到达了崖顶，来到一座毁坏的庭院——这里或许曾属于某个瓦雷利亚龙王的宏伟宅邸。\n\n我转向我的同伴。“曾有人断言无人能踏足这里，但我们让所有质疑者无话可说！现在，瓦雷利亚的财富任我们取用！让我们——”\n\n我的讲话被身后一声响亮的#italic 吼叫#!打断。我迅速转身，刚好看到一只巨大的、长着鳞片的生物以非自然的速度向我扑来……"
 agot_sailing.3904.desc_two:0 "踏上陆地后，我们发现一条破碎的小径蜿蜒通向陡峭悬崖的顶端，俯瞰着烟海。台阶很险，迫使我们只能放慢脚步。最终，我们到达一个小山洞，洞口冒着烟。\n\n“这是什么？”我喘着气，一只小生物走了出来。它身上的一簇簇毛白得像雪，但头上长着深色的、带鳞片的触手。\n\n“不过是只兔子！”但等我们靠近，那只恶兽猛地扑上前，露出巨大而锋利的牙齿。我惊恐地看着它撕掉我其中一个手下的头……\n\n“快跑！”我喊道，但我清楚我们为时已晚。"
 agot_sailing.3904.desc_three:0 "踏上陆地后，我们发现一条破碎的小径蜿蜒通向陡峭悬崖的顶端，俯瞰着烟海。台阶很险，迫使我们只能放慢脚步。最终，我们到达一个小山洞，洞口冒着烟。\n\n在洞口，我发现一小堆覆着鳞片的石头……‌#italic 难道是？！#!\n\n#EMP 龙蛋！‌#! 我的心脏狂跳着朝它们冲过去。可当我的手碰到这堆蛋里最大的那一颗时，它嘶嘶作响着裂开了。诸神都没法形容它接下来发出的声音——那是一声震得地动山摇的刺耳尖啸。我强撑着痛意，直到感觉到温热的血从我的脑袋两侧汩汩流下，我的大脑正在头颅里从内部融化。"
 agot_sailing.3904.desc_four:0 "踏上陆地后，我们发现一条破碎的小径蜿蜒通向陡峭悬崖的顶端，俯瞰着烟海。台阶很险，攀爬时我一直用一只手撑着岩壁。但我的脚步没那么小心，被一块松动的石头绊倒了。\n\n我脚下一滑，伸手抓住一块像石头的凸起想稳住自己，可那东西直接断在了我手里。我跌倒在地，侥幸没摔下去送命，但我的眼睛一直盯着手里的石头——#italic 那是……一根手指？#!\n\n我的目光向上移，看到一张石头的脸，凝固在恐惧中，融进了悬崖里。它几乎像是在回看着我，然后突然……它的另一只手猛地向前伸，掐住了我的喉咙。被掐住的时候我几乎叫不出声。"
 agot_sailing.3904.desc_five:0 "踏上陆地后，我们发现一条破碎的小径蜿蜒通向陡峭悬崖的顶端，俯瞰着烟海。台阶很险，迫使我们只能放慢脚步。最终，我们到达一个小山洞，洞口冒着烟。\n\n在洞口，我看见一块巨大的黑石，里面嵌着一把泛着微光的剑刃。金属上的波纹显然只可能指向一件事：‌#italic 瓦雷利亚钢！#!\n\n这样的宝物足以让整趟旅程不虚所行。我紧紧攥住剑柄，能感觉到它卡得有多牢。我用尽全力去拔，却一点动静都没有。\n\n我全神贯注地盯着这把石中剑，几乎没注意到我的船员们已经没了声响。等我终于抽空环顾四周，看见一个纯黑的身影高高站在我上方；它的皮肤像龙晶，长着锋利的镰刀状手臂，正举过我的头顶。其中一只手臂猛地劈下，整条切掉了我的胳膊——那只手还紧握着那把宝贵的剑。\n\n另一只手臂开始朝着我的脑袋落下来。"
 agot_sailing.3904.desc_six:0 "踏上陆地后，我们发现一条破碎的小径蜿蜒通向陡峭悬崖的顶端，俯瞰着烟海。台阶很险，迫使我们只能放慢脚步。最终，我们到达一个小山洞，洞口冒着烟。\n\n我踏进光线昏暗的空间，迎面看到一群石像挤在一起，像是在取暖。‌#italic 不对，是在自保！#!\n\n这根本不是洞穴；这是一座坟墓！我转身想往外走，却感觉到一只石头手攥住了我的腿。其中一具石像抓住了我，一阵突如其来的剧痛撕开了我的小腿。我瘫倒在地，又感觉到另一只石头手按上了我的胳膊，接着是我的后背，再然后是我的脖子……"
 agot_sailing.3938.t:0 "危险岛屿"
 agot_sailing.3938.desc:0 "我踏上了领袖选择探索的那座岛屿的岩石海岸。当我们开始寻找通往附近悬崖顶上焦黑废墟的道路时，一股不安的感觉伴随着我们一行人。\n\n大约一个小时后，我们遇到了一条小径，沿着破碎的黑色石阶缓缓向上延伸。沿着这条路，我们终于到达了废墟。这里或许曾是一座宫殿，或是瓦雷利亚人在他们辉煌岁月中建造的其他建筑。如今，只剩下荒凉的石头遗迹。\n\n眼角的余光中，我瞥见有东西在移动，但当我开始转身时，已经太晚了。冰冷而有力的双手以非同寻常的力气扼住了我的脖子，在一切陷入黑暗前，我只听到一阵可怕的嘶嘶声……"
 agot_sailing.3938.a:0 "啊——"
 agot_sailing.3938.a.tt:0 "这次探险失败了，所有人都失踪在瓦雷利亚，再未出现"
 agot_sailing.3907.desc_good:0 "前往古瓦雷利亚的航行大获成功，旅程终点迎来了晴朗的天空与和煦的微风。我梦里见过的那些恐怖景象终究只是梦。\n\n在我们返程的路上，我感觉肚子里有一点发痒……#italic 啊哈！我几乎一整天没吃东西了！#!"
 agot_sailing.3907.desc_bad:0 "前往古瓦雷利亚的航行大获成功，但旅程终点迎来了阴沉的天空和让人难受的风。我梦里见过的那些恐怖景象，或许不只是梦。\n\n在我们返程的路上，我感觉肚子里有一点发痒。接着是一阵啃咬般的痛感，几乎像是我的内脏正试图从我的身体里钻出去。\n\n我感觉汗水从额头滴下，我发誓我手臂的皮肤有一瞬间抽动了下。我开始脱掉衣服，一直脱到贴身内衣，但从身体里散发的热量太强烈了。#italic 我要烧起来了！#!\n\n我按住自己的肚子，只摸到皮肤底下有奇怪的东西在蠕动。我张开嘴想尖叫，可从嘴里冒出来的只有烟……"
 agot_sailing.3907.a_good:0 "我藏起来的柠檬蛋糕去哪儿了？"
 agot_sailing.3907.a_bad:0 "关于火龙虫的传说是真的？！"
 agot_sailing.3920.desc:0 "在仔细研究了[host.GetHerHis]航海图和笔记后，[host.GetTitledFirstNameNicknamed]下令道：“我们将驶过自由贸易城邦，向奴隶湾行进，然后转260度方位进入烟海！”\n\n那些曾质疑[host.GetHerHis]才智的人，此刻都长长舒了口气。"
 agot_sailing.3920.a:0 "干得好，[ROOT.Char.Custom2('spoken_address_by_familiarity', SCOPE.sC('host') )]！"
 agot_sailing.3921.desc:0 "在仔细研究完[host.GetHerHis]的海图和笔记之后，[host.GetTitledFirstNameNicknamed]似乎陷入了困惑。在十四火峰里找出一个合适的锚地不是件容易的事，看起来[host.GetSheHe]对此束手无策。\n\n[first_mate.GetTitledFirstName]慢慢把手放在[host.GetHerHis]的肩上。“要不……我们下次再找吧？”"
 agot_sailing.3921.a:0 "真可惜，[ROOT.Char.Custom2('spoken_address_by_familiarity', SCOPE.sC('host') )]……"
 agot_sailing.3922.desc:0 "$agot_sailing_kraken_spawn$\n\n[host.GetTitledFirstNameNicknamed]冲上前去，高声下令：我们得撤退了，否则都得死在这里！"
 agot_sailing.3922.a:0 "此次航行结束了。"
 agot_sailing.3923.desc:0 "$agot_sailing_kraken_spawn$\n\n[host.GetTitledFirstNameNicknamed]大吼一声；这一刻是计划好的。[host.GetSheHe|U]把海怪之角举到唇边，吹出一阵低沉而浑厚的鸣响。那声音仿佛震动了整艘船的甲板，我看到周围的人痛苦地捂住耳朵。\n\n但海怪似乎毫无反应。一瞬间，一只抬起的触手啪的一声落在[host.GetFirstNameNoTooltip]身上，一声脆响过后，号角的声音戛然而止。我无法移开目光——触手抬起时，我们的船长只剩下一滩混着血、骨头和筋肉的糊状物。糟了，我甚至没有注意到另一只触手已经悬在我头顶……"
 agot_sailing.3923.a:0 "哦……哦不！"
 agot_sailing.3924.desc:0 "$agot_sailing_kraken_spawn$\n\n[host.GetTitledFirstNameNicknamed]下令攻击，我们搭上弓，向那怪兽射出一阵箭雨。一声刺耳的哀嚎划破空气，让我感到一阵寒意……然后便没了动静。\n\n[host.GetFirstNameNoTooltip]做到了！[host.GetSheHe|U]杀死了那头海怪！"
 agot_sailing.3924.desc_horn:0 "$agot_sailing_kraken_spawn$\n\n我和其他船员退到[host.GetTitledFirstNameNicknamed]身后，[host.GetSheHe]把海怪之角举到唇边，发出低沉而如雷鸣般的鸣响。声音在海面上回荡，没过多久，那头巨大的怪兽便开始后撤，消失在它原本出来的深海下。现在毫无疑问，这支号角确实蕴含真正的力量。\n\n我和其他船员爆发出狂喜的欢呼，其中一些人打开了藏起来的烈酒庆祝。"
 agot_sailing.3924.a:0 "给船长倒酒！"
 agot_sailing.3925.desc:0 "$agot_sailing_kraken_spawn$\n\n[host.GetTitledFirstNameNicknamed]下令进攻，我们搭上了弓。但那只怪物轻易就挡开了所有箭。它冲到我们跟前，像从托盘里拿柠檬蛋糕一样，把船员从甲板上一个个举起来。\n\n一根触手用大得难以想象的力气缠住了我的手，咔嚓一声碾碎了我的手指。我那只残废的手被怪物紧紧攥住，它把我朝它的嘴边送去……"
 agot_sailing.3925.a:0 "不……不该是这样的！"
 agot_sailing.3925.a.success.tt:0 "你奇迹般地死里逃生"
 agot_sailing.3925.a.failure.tt:0 "@death_icon!你被整个生吞了，从此再也没出现过"
 agot_sailing.3925.b:0 "如果我能挣脱开……"
 agot_sailing.3925.b.success.tt:0 "你保住了性命，却失去了一只手"
 agot_sailing.3925.b.failure.tt:0 "@death_icon!你被几乎整个吞下，但或许你的手会保下来"
 agot_sailing.3926.desc:0 "我们已在海上漂泊了很久，强劲的逆风致使航程缓慢，远不及预期。更糟糕的是，补给已经岌岌可危……\n\n[host.GetTitledFirstNameNicknamed]显然注意到了这点，为了不让我们在抵达目的地前饿死，[host.GetSheHe]开始对物资进行严格的定量分配。这些精细的盘算似乎起了作用——虽然我们所有人都饿着肚子，但至少还活着。"
 agot_sailing.3926.a:0 "干得好，[ROOT.Char.Custom2('spoken_address_by_familiarity', SCOPE.sC('host') )]！"
 agot_sailing.3926.a.fatty:0 "但代价是什么？[host.GetFirstNameNoTooltip]为什么要这么做？！"
 agot_sailing.3927.desc:0 "我们已在海上漂泊了很久，强劲的逆风致使航程缓慢，远不及预期。更糟糕的是，补给已经岌岌可危……\n\n[host.GetTitledFirstNameNicknamed]试图实施严格的配给制度，但[host.GetHerHis]的计算似乎有所偏差……四周全是海水，船上却没有食物——只剩我们因饥饿的阵痛而发出的缓慢哀嚎。"
 agot_sailing.3927.a:0 "拜托了，就一小口……"
 agot_sailing.3928.desc:0 "我们已在海上漂泊了很久，强劲的逆风致使航程缓慢，远不及预期。更糟糕的是，补给已经岌岌可危……\n\n[host.GetTitledFirstNameNicknamed]听到了船员们的抱怨，却严厉处置了我们当中闹得最凶的人。士气已经受挫，肚子咕咕叫的声音成了常事——但至少我们还活着，能继续接下来的航程。"
 agot_sailing.3928.a:0 "干得好，[ROOT.Char.Custom2('spoken_address_by_familiarity', SCOPE.sC('host') )]！"
 agot_sailing.3929.desc:0 "我们已在海上漂泊了很久，强劲的逆风致使航程缓慢，远不及预期。更糟糕的是，补给已经岌岌可危……\n\n[mutiny_leader.GetTitledFirstNameNicknamed]在整段航程里一直在散布不满，现在[mutiny_leader.GetHerHis]的时机到了。就在[host.GetTitledFirstNameNicknamed]试图说服船员必须执行严格配给的时候，[mutiny_leader.GetFirstNameNoTooltip]另有主意……\n\n经过短暂的搏斗之后，[host.GetFirstName]被迫走上跳板！"
 agot_sailing.3929.a:0 "再见了，[ROOT.Char.Custom2('spoken_address_by_familiarity', SCOPE.sC('host') )]……"
 agot_sailing.3930.desc:0 "昨晚又做了那个梦。#italic 毁灭一切的火焰。石头像油脂般融化，海水沸腾成蒸汽，巨龙被自己的烈焰吞噬而惨叫。还有那声音——天哪，那声音——仿佛世界都被撕裂开来。#!\n\n#EMP 瓦雷利亚的末日浩劫！#!\n\n我从每个人的眼中都看到了它。恐惧如石块般压在我的胸口。但船长没有斥责我们是懦夫。[host.GetSheHe|U]倾听着。\n\n“困扰你们的是记忆，不是预言。古老的恐惧代代相传，深深扎根在我们的骨肉。”[host.GetTitledFirstName]平静地开导道，抓狂的状态随之缓解。"
 agot_sailing.3930.a:0 "噩梦或许会再出现，但现在我们只能奋力划桨。"
 agot_sailing.3931.desc:0 "昨晚又做了那个梦。#italic 毁灭一切的火焰。石头像油脂般融化，海水沸腾成蒸汽，巨龙被自己的烈焰吞噬而惨叫。还有那声音——天哪，那声音——仿佛世界都被撕裂开来。#!\n\n#EMP 瓦雷利亚的末日浩劫！#!\n\n我从每个人的眼中都看到了它。恐惧如石块般压在我的胸口。但船长不肯停下。即使我们告诉过[host.GetHerHim]——#italic 恳求#!过[host.GetHerHim]——[host.GetTitledFirstName]还是坚持要继续前进，谈论海图和距离，好像这些数字能挡住瓦雷利亚的末日，好像当诸神都发出警告时，常理还能派上用场。\n\n“我们必须这么做，”[first_mate.GetFirstName]轻声说。“为了[host.GetHerHis]自己好。”片刻之后，我们把船长推进了[host.GetHerHis]的舱室。锁转上了，但透过木板，我听到[host.GetHerHim]在叫喊，诅咒我们，说要报复。"
 agot_sailing.3931.a:0 "让[host.GetHerHis]发火，总好过让[host.GetHerHis]送死。"
 agot_sailing.3932.desc:0 "当我们接近失落的瓦雷利亚时，顺风、平浪与晴空本是令人欣慰的景象。但这一切瞬间骤变。\n\n一团高耸的雷云朝我们的船滚来，接着又是一团，又是一团，又是一团。它们的排列几乎像是直指我们的位置。一柄#EMP 风暴之剑#!，看来是这样！\n\n[host.GetTitledFirstNameNicknamed]跳上前，在雷声和倾盆大雨中大声下达命令。“张开帆，我们快到了！”我听到[host.GetHerHim]喊道，往前望去，我发现[host.GetSheHe]说得没错……"
 agot_sailing.3932.a:0 "难道是真的？"
 agot_sailing.3933.desc:0 "当我们接近失落的瓦雷利亚时，顺风、平浪与晴空本是令人欣慰的景象。但这一切瞬间骤变。\n\n一团高耸的雷云朝我们的船滚来，接着又是一团，又是一团，又是一团。它们的排列几乎像是直指我们的位置。一柄#EMP 风暴之剑#!，看来是这样！\n\n[host.GetTitledFirstNameNicknamed]跳上前，在雷声和倾盆大雨中大声下达命令。但命令跟不上我们周围风暴的强度。\n\n我最后听见的声音，是四周翻涌的海水发出的、要把一切都吞掉的轰鸣……\n\n然后，一片黑暗。"
 agot_sailing.3933.a:0 "娜——迦……"
 agot_sailing.3934.desc:0 "看到那些破碎的岛屿终于出现在眼前，[host.GetTitledFirstNameNicknamed]脸上露出一个张狂的笑，一声略带歇斯底里的笑声冒了出来。我们做到了。一路上困难重重，很多人都怀疑这根本不可能——但我们做到了。这里肯定就是瓦雷利亚十四火峰的遗迹了。\n\n可等我们靠得更近，有人小声问出了一个问题……我们要试着登陆吗？\n\n四周都是陡峭的崖壁，根本没法轻易靠岸——烟从各处冒出来，水里和石头缝里都有。登陆上去等于自寻死路——就像当年降临在龙王们身上的末日浩劫一样。"
 agot_sailing.3934.a:0 "[ROOT.Char.Custom2('spoken_address_by_familiarity', SCOPE.sC('host') )]会做什么？"
 agot_sailing.3935.desc:0 "[host.GetTitledFirstNameNicknamed]决定不尝试在任何一座破碎的岛屿上登陆，那些高耸的悬崖和岩石海岸让[host.GetHerHim]打消了再往近靠的念头。但即便如此，我们还是把船开到了尽可能近的地方，越驶越近。就在这个过程里，瓦雷利亚末日的全貌慢慢露了出来。破碎的塔楼和石柱，完全毁坏的城市和居所，透过无处不在的烟雾隐约可见。然而，即使在这般惨状中，依然能看出十四火峰曾经是何等的雄伟。\n\n最后，在绕着它们转了很多圈之后，我们终于返航，心满意足。我们找到了别人认为是神话的东西，经历了无与伦比的危险，目睹了失落已久的瓦雷利亚最后的遗迹。没有人再能质疑[host.GetFirstNamePossessiveNoTooltip]的能力和声望。"
 agot_sailing.3935.a:0 "非常出色，[ROOT.Char.Custom2('spoken_address_by_familiarity', SCOPE.sC('host') )]！"
 agot_sailing.3936.desc_good:0 "前往古瓦雷利亚的航行大获成功，旅程终点迎来了晴朗的天空与和煦的微风。我们梦里见过的那些恐怖景象终究只是梦。\n\n在我们返程的路上，我感觉肚子里有一点发痒……#italic 啊哈！我几乎一整天没吃东西了！#!"
 agot_sailing.3936.desc_bad:0 "前往古瓦雷利亚的航行大获成功，但旅程终点迎来了阴沉的天空和让人难受的风。我们梦里见过的那些恐怖景象，或许不只是梦。\n\n在我们返程的路上，[host.GetTitledFirstName]抱怨说肚子里有一点发痒。接着[host.GetHerHis]说感到一阵啃咬般的痛感，像是[host.GetHerHis]的内脏正试图从身体里钻出去。\n\n我看见汗水从[host.GetHerHis]的额头滴下，我发誓[host.GetHerHis]手臂的皮肤有一瞬间抽动了下。[host.GetSheHe]开始脱掉衣服，一直脱到贴身内衣，但[host.GetHerHim]的身体像火炉一样往外冒热量。#italic [host.GetSheHe|U]要烧起来了！#!\n\n[host.GetFirstNameNoTooltip]按住自己的肚子，张开嘴想尖叫，可从里面冒出来的只有烟……\n\n等着我们剩下这些人的，会是什么残酷的命运？我自己的皮肤也开始发麻发痒，像有东西在爬。"
 agot_sailing.3936.desc_bad_two:0 "前往古瓦雷利亚的航行大获成功，但旅程终点迎来了阴沉的天空和让人难受的风。我梦里见过的那些恐怖景象，或许不只是梦。\n\n在我们返航途中，船长舱传来一声尖叫。我冲进去，只看到[host.GetTitledFirstName]正痛苦地在甲板上扭动。我走近时，停住了……[host.GetHerHis]身体散发出的热量像是燃烧的火炉，尽管房间里又湿又冷。更糟的是！我发誓我看到[host.GetHerHis]皮肤下面有东西在来回蠕动。\n\n我猛地从[host.GetHerHim]身边躲开；现在再去安抚已经太晚了。而我自己内脏里也开始有啃咬般的感觉。原本寒冷的房间现在感觉像着了火。\n\n我冲到船首，一边跑一边扯掉身上的衣服。我之前在[host.GetFirstNamePossessiveNoTooltip]皮肤底下看见的蠕动，现在清清楚楚出现在了我自己身上。还有那痛感……#EMP 它烧得太厉害了！#!\n\n我紧紧按住自己的肚子，可当我张开嘴想要尖叫时，从嘴里冒出来的只有烟……"
 agot_sailing.3936.desc_cancelled:0 "尽管前往古瓦雷利亚的航行以失败告终，但旅程终点却迎来了晴朗的天空与和煦的微风。或许那些恐怖景象都已抛在身后。\n\n然而，当我漫步甲板时，腹中却泛起一丝轻微的悸动……#italic 啊哈！我几乎一整天没吃东西了！#!"
 agot_sailing.3937.desc:0 "我站在船甲板上，航道带我们经过烟海沿岸破碎冒烟的悬崖。脑子里已经能看见，那些藏在古瓦雷利亚废墟里、我们肯定能找到的诸多财宝。黄金、宝石，当然还有无价的瓦雷利亚钢……很快，这些东西就全是我们的了……\n\n一声响亮的#italic 撞击声#!把我拉回现实，忽然间，天空满是灰烬与火焰。燃烧的岩石如雨般吞没船只，火势迅速蔓延。我恐惧地看着船帆着火，火焰从桅杆跳上甲板。\n\n在惊恐与痛苦的尖叫声中，令人难以忍受的热浪从我四周升起。我不假思索地跳进下方汹涌的海水，却眼睁睁看着船只在我面前沉没。我拼命划水，想要远离残骸……"
 agot_sailing.5501.reroll:0 "\n\n可惜天色已晚，无法继续搜寻新的猎物，只能将就了。"
 agot_sailing.5501.l:0 "我们得离开这里！"
 sailing.hunt.success:0 "将战利品拖上船后，你启程返航"
 sailing.hunt.failure.tt:0 "你失手了"
 sailing.hunt.failure:0 "你的猎物潜入深处，消失不见"
 agot_sailing.5510.b:0 "吹响号角！"
 agot_sailing.5510.b_tt:0 "你吹响号角，希望能分散海怪的注意力"
 agot_sailing.5512.c:0 "失败是良师……"
 agot_sailing.5600.t:0 "寻找异兽"
 agot_sailing.5600.desc:0 "我们的船继续驶向开阔海域，我无意间听到[host.GetTitledFirstName]和[first_mate.GetFirstName]在说话。“我们正在警戒深海的生物，船长。”[first_mate.GetFirstName]解释道。“一旦有人发现什么，你会是第一个知道的。”\n\n我转向平静的海面，想着今天我们会遇到什么样的生物。\n\n过了一会儿，主桅杆那边传来一阵骚动——瞭望手发现了什么东西！"
 agot_sailing.5600.a:0 "狩猎开始！"
 agot_sailing.5601.t:0 "成功！"
 agot_sailing.5601.desc.a:0 "“发现海龟，船长！”\n\n一只绿色的大#high 海龟#!正急切地游在我们的船旁。“要捕猎吗，船长？”[first_mate.GetFirstName]问道。\n\n[host.GetTitledFirstNameNicknamed]抓起一支鱼叉，瞄准那只海龟，然后——\n\n#italic 啪！#!直接命中！没过多久，那只绿色的海龟尸体就被拖上了甲板。"
 agot_sailing.5601.desc.b:0 "“发现海豹，船长！”\n\n一只圆滚滚的#high 灰海豹#!正慢悠悠地游在我们船的旁边。“要捕猎吗，船长？”[first_mate.GetFirstName]问道。\n\n[host.GetTitledFirstNameNicknamed]抓起一支鱼叉，瞄准那只海豹，然后——\n\n#italic 啪！#!直接命中！没过多久，海豹灰色的尸体就被拖上了甲板。"
 agot_sailing.5601.desc.c:0 "“发现海豚，船长！”\n\n一只身形修长的#high 白海豚#!正兴致勃勃地游在我们船的旁边。“要捕猎吗，船长？”[first_mate.GetFirstName]问道。\n\n[host.GetTitledFirstNameNicknamed]抓起一支鱼叉，瞄准那只海豚，然后——\n\n#italic 啪！#!直接命中！没过多久，海豚白色的尸体就被拖上了甲板。"
 agot_sailing.5601.desc.d:0 "“发现海象，船长！”\n\n一只体型庞大的#high 海象#!正懒洋洋地趴在我们船附近的一座礁石小岛上。“要捕猎吗，船长？”[first_mate.GetFirstName]问道。\n\n[host.GetTitledFirstNameNicknamed]抓起一支鱼叉，瞄准那只海象，然后——\n\n#italic 啪！#!直接命中！没过多久，海象圆鼓鼓的尸体就被拖上了甲板。"
 agot_sailing.5601.desc.e:0 "“发现虎鲸，船长！”\n\n一只气势十足的#high 虎鲸#!正快速游在我们船的旁边。“要捕猎吗，船长？”[first_mate.GetFirstName]问道。\n\n[host.GetTitledFirstNameNicknamed]抓起一支鱼叉，瞄准那只海鲸，然后——\n\n#italic 啪！#!直接命中！没过多久，虎鲸肌肉结实的尸体就被拖上了甲板。"
 agot_sailing.5601.desc.f:0 "“右舷发现鲸鱼，船长！”\n\n喊声刚落，一股巨大的水柱喷向空中，鲸鱼庞大的身躯冲破海浪。那是一头成年的#high 座头鲸#!。“要捕猎吗，船长？”[first_mate.GetFirstName]问道。\n\n[host.GetTitledFirstNameNicknamed]抓起一支鱼叉，瞄准那头鲸鱼，然后——\n\n#italic 啪！#!直接命中！但仅凭这一下还不足以杀死这样的生物。其他水手准备好各自的投射物，接连击中那头流血的鲸鱼。经过一番长时间的搏斗，那头座头鲸庞大的尸体终于被拖上了甲板。"
 agot_sailing.5601.desc.g:0 "“正前方发现鲸鱼，船长！”\n\n喊声刚落，一股巨大的水柱喷向空中，鲸鱼庞大的身躯冲破海浪。那是一头成年的#high 黑色抹香鲸#!。“要捕猎吗，船长？”[first_mate.GetFirstName]问道。\n\n[host.GetTitledFirstNameNicknamed]抓起一支鱼叉，瞄准那头鲸鱼，然后——\n\n#italic 啪！#!直接命中！但仅凭这一下还不足以杀死这样的生物。其他水手准备好各自的投射物，接连击中那头流血的鲸鱼。经过一番长时间的搏斗，那头抹香鲸巨大的尸体终于被拖上了甲板。"
 agot_sailing.5601.desc.h:0 "“正前方发现鲸鱼，船长！”\n\n喊声刚落，一股巨大的水柱喷向空中，鲸鱼庞大的身躯冲破海浪。那是一头巨大的#high 蓝鲸#!，真正的海中巨兽。“要捕猎吗，船长？”[first_mate.GetFirstName]问道。\n\n[host.GetTitledFirstNameNicknamed]抓起一支鱼叉，瞄准那头鲸鱼，然后——\n\n#italic 啪！#!直接命中！但仅凭这一下还不足以杀死这样的生物。其他水手准备好各自的投射物，接连击中那头流血的鲸鱼。经过一番长时间的搏斗，那头蓝鲸巨大的尸体终于被拖上了甲板。"
 agot_sailing.5601.desc.i:0 "航行数小时后，惊叫声与恐惧的呼喊将我惊醒。“海怪！海怪来了！”水手们喊道，有些人已经吓得开始逃跑。\n\n看来猎物反过来找上了我们。船后方的海水剧烈翻涌，很快露出一只覆满鳞片的巨大#high 海怪#!的头颅，黏滑的喙发出可怖的嚎叫声，一张一合。\n\n我看到[first_mate.GetFirstName]冲到[host.GetTitledFirstNameNicknamed]身边。“怎么办，船长？是打，还是逃跑？”\n\n“我不会逃跑！”[host.GetTitledFirstNameNoTooltip]喊道，“所有人做好准备！”\n\n海怪是可怕的怪物，许多水手被它带吸盘的触手击中，尖叫着被拖入深海。就在我开始担心船可能保不住的时候，一支鱼叉刺穿了这头怪物的眼睛，整支鱼叉完全扎进了它圆滚滚的软肉里。它发出了一声尖叫——比之前任何一次都要响。然后……它就瘫软下来。这头怪物终于被杀死了。"
 agot_sailing.5601.desc.i_two:0 "航行数小时后，惊叫声与恐惧的呼喊将我惊醒。“海怪！海怪来了！”水手们喊道，有些人已经吓得开始逃跑。\n\n看来猎物反过来找上了我们。船后方的海水剧烈翻涌，很快露出一只覆满鳞片的巨大#high 海怪#!的头颅，黏滑的喙发出可怖的嚎叫声，一张一合。\n\n我看到[first_mate.GetFirstName]冲到[host.GetTitledFirstNameNicknamed]身边。“怎么办，船长？是打，还是逃跑？”\n\n“我不会逃跑！”[host.GetTitledFirstNameNoTooltip]喊道，“所有人做好准备！”\n\n海怪是可怕的怪物，许多水手被它带吸盘的触手击中，尖叫着被拖入深海。[host.GetTitledFirstNameNoTooltip]吹响了他的海怪之角，震耳欲聋的声响暂时分散了那头巨兽的注意力，正好让一支鱼叉刺穿了那怪物的眼睛，整个没入它肿胀肉体柔软的部分。它发出了一声尖叫——比之前任何一次都要响。然后……它就瘫软下来。这头怪物终于被杀死了。"
 agot_sailing.5601.desc.j:0 "这次捕猎进展不顺。好几个小时过去，我们连一个活物都没看见，我开始觉得无聊。就在这时，我身后传来一声受惊的大喊：“右舷发现鲸鱼，船长！”\n\n一瞬间，一道巨大的水柱喷向空中，鲸鱼庞大的身体从浪里钻了出来。船被一股巨大的力道撞得晃了晃，我们全都摔倒在地。我挣扎着要站起来，[first_mate.GetFirstName]朝我爬过来，脸色白得像一张纸。\n\n“是——是「白死神」，那个……那个海中的恐怖！”[first_mate.GetSheHe]结结巴巴地说。我听过那些传闻：一头狡猾又凶狠的白鲸，像个巨大的幽灵一样在这片海域出没。它撞沉过很多船，现在……它找上我们了。\n\n“准备战斗！”[host.GetTitledFirstNameNicknamed]喊道，抓起一支鱼叉。船又遭到一次撞击，我被甩到甲板上捆着的一桶给养上。等我重新站稳，我看见「白死神」发出一声震耳欲聋的痛嚎，高高跃起——不知道从哪里飞来的一支鱼叉，刺穿了它的心脏。我们今天终结了一个传说。"
 agot_sailing.5601.desc.k:0 "很长一段时间，海面一片沉寂，仿佛大海本身也在屏息等待。我在船舵附近不安地来回踱步。终于，瞭望员喊道：“发现鲸鱼！”\n\n我冲到前面，难以置信地睁大了眼睛。它又找到了我们。「白死神」迅速逼近，劈开海浪，直接朝我们的船冲来。\n\n我闭了一下眼，紧接着抓起一支鱼叉。我发誓这一次我不会袖手旁观，那头白鲸已经下潜，开始发起凶狠的攻击。\n\n船被一股巨大的力道撞得晃起来，我听见脚下的木头裂开的声音。我攥紧鱼叉，勉强站稳身子。我攒起剩下的所有力气，把手里的武器朝「白死神」掷过去，刺穿了它的胸口。它发出一声震耳欲聋的痛嚎……然后，在剧烈的挣扎中，它死了。"
 agot_sailing.5601.a:0 "干得好！"
 agot_sailing.5602.t:0 "失败……"
