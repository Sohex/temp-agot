l_simp_chinese:
 agot_commission_special_artifact_crown.0001.t:0 "铸造冠冕"
 agot_commission_special_artifact_crown.0001.desc:0 "维斯特洛拥有王冠的人少之又少，能佩戴得上王冠之人更是屈指而数，是时候打造一个新的权力象征来代表和合法我的统治！我要让历史铭记我的姓名、我的功绩，以及我所选择的符号。我将下令铸造一顶传世王冠，使之代代相传，公然昭示我的权柄与威势。"
 agot_commission_special_artifact_crown.0001.desc_coronation:0 "一切加冕都需要王冠，因此我需要委托制作一顶王冠，它将成为传家宝，代代相传，向世人展示我的权力和影响力。"
 agot_commission_special_artifact_crown.0001.a:0 "就决定是这个了。"
 agot_commission_special_artifact_crown.0001.b:0 "我改变了主意，我不想造一顶新王冠了。"
 agot_commission_special_artifact_crown_spouse.0001.desc:0 "维斯特洛拥有王冠的人少之又少，能佩戴得上王冠之人更是屈指而数，我将为我的配偶委托打造一顶新王冠。"
 agot_commission_special_artifact_armor.0001.t:0 "订制盔甲"
 agot_commission_special_artifact_armor.0001.desc:0 "盔甲绝非仅仅只是护身之物；它彰显着穿戴者的地位与威仪。我将下令打造一套全新盔甲，依我身形量身锻造，足以名留后世。"
 agot_commission_special_artifact_armor.0001.a:0 "就决定是这个了。"
 agot_commission_special_artifact_armor.0001.b:0 "我改变了主意，我不想造一顶新盔甲了。"