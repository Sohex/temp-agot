l_simp_chinese:
 norvos_government_events.0001.t:0 "大胡子僧侣的谴责"
 norvos_government_events.0001.desc:0 "[shadowy_priests.GetName]发布了一项法令，谴责我的罪过！\n\n现在我在诺佛斯政治中已被视为贱民，我的社会地位在未来十年内都受到了玷污。"
 norvos_government_events.0001.a:0 "不幸的转折……"
 norvos_government_events.0050.t:0 "错误的信仰"
 norvos_government_events.0050.desc:0 "[shadowy_priests.GetName]因我改信[ROOT.Char.GetFaith.GetName]宣布我是罪人，并下令将我逮捕！\n\n其他自由贸易城邦或许能容纳不同信仰和教派的统治者，但在诺佛斯，大胡子祭司和他们隐秘神明的旨意仍然是最高准则。\n\n因此，我和我的同信者正等待大祭司们亲自对我们作出审判。"
 norvos_government_events.0050.a:0 "为了[ROOT.Char.GetFaith.HighGodName]真的值得吗？"
 norvos_government_events.0050.a_tt:0 "大胡子僧侣们将决定你的命运。"
 norvos_government_events.0051.t:0 "错误的信仰"
 norvos_government_events.0051.desc:0 "[shadowy_priests.GetName]已作出[shadowy_priests.GetHerHis]的判决：\n\n"
 norvos_government_events.0051.desc_judgement_conversion:0 "我与诸位皈依者，只要放弃信仰并重新改信“大胡子僧侣”的宗教，就能保住性命。"
 norvos_government_events.0051.desc_judgement_death:0 "我与诸位皈依者因在诺佛斯境内宣扬异端而被判处死刑！"
 norvos_government_events.0051.a:0 "[ROOT.Char.GetFaith.HighGodName]，救救我！"
 norvos_government_events.0051.b:0 "我将重新皈依。"
 norvos_government_events.0051.c:0 "我拒绝改信。"
 norvos_government_events.0051.d:0 "我会公开改信，但私下仍坚守我的信仰。"
 norvos_government_events.0502.t:0 "[accused.GetShortUINameNoTooltip]的罪行"
 norvos_government_events.0502.desc:0 "[accused.GetName]因皈依[ROOT.Char.GetFaith.GetName]而被处决。\n\n现在，我必须做出决定：要么重新皈依大胡子僧侣的信仰，要么与[accused.GetNameNoTooltip]一同赴死。"
 norvos_government_events.0502.a:0 "为了保全性命，我将改信。"
 norvos_government_events.0502.b:0 "我会公开改信，但私下仍坚守我的信仰。"
 norvos_government_events.0502.c:0 "我选择死亡。"
 norvos_government_events.0502_secret_conversion_tt:0 "你秘密皈依[converted_faith.GetName]"