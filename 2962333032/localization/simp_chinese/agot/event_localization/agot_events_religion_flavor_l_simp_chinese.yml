l_simp_chinese:
 pregnancy.1001.motheroffering:0 "我将向圣母献上祭品。"
 pregnancy.1001.motheroffering.self:0 "愿她庇佑我腹中的孩子。"
 pregnancy.1001.motheroffering.father:0 "愿她庇佑我的妻子。"
 pregnancy.1001.motheroffering.deadhusband:0 "愿丈夫留给我的最后礼物不被辜负……"
 agot_religion_flavor.0002.t:0 "为了战殁者"
 agot_religion_flavor.0002.desc:0 "战斗结束了，我们取得了胜利，但代价是什么？食腐者已盘旋在战场，准备啄食死者和垂死之人。随军的一位修士走过来，询问能否能建一座小神龛，让陌客指引在今日逝去之人的灵魂。"
 agot_religion_flavor.0002.a:0 "我将为陌客建一座小神龛。"
 agot_religion_flavor.0002.b:0 "我们应该做得更多；见鬼，应该建个小房子！"
 agot_religion_flavor.0002.c:0 "死人只是死人；我们帮不了他们什么……"
 agot_religion_flavor.0100.t:0 "少女节"
 agot_religion_flavor.0100.desc:0 "当我开始每日的例行事务时，无意间听到了周围的谈话。片刻之后，我意识到宫廷里谈论的都是少女节——而今天，正是这一天。\n\n所有的未婚少女都要前往附近的圣堂朝圣，在少女神像脚下点燃蜡烛，并为她挂上羊皮纸制的花环。\n\n尽管我几乎忘了这个重要的节日，但我仍需决定该如何为今日的活动做好准备……"
 agot_religion_flavor.0100.a:0 "或许我会捐些钱。"
 agot_religion_flavor.0100.b:0 "我应当主动前往圣堂，尽一份心力。"
 agot_religion_flavor.0100.c:0 "我今年事务繁重，实在无暇参与任何活动……"
 agot_religion_flavor.0100.d:0 "[maiden_daughter.GetName]，我年少的[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('maiden_daughter'))]理应出席。"
 agot_religion_flavor.0100.e:0 "[maiden_daughter.GetName]，我的[ROOT.Char.Custom2('LMF_RelationToMeShort', SCOPE.sC('maiden_daughter'))]理应出席。"
 agot_religion_flavor.0100.f:0 "我将亲自踏上朝圣之旅。"
 agot_religion_flavor.0100.g:0 "我应当出席……但我没时间。"
 agot_religion_flavor.0100.g.tt:0 "你试图逃避职责，可#bold 有人#!或许正在监视着你。"
 agot_religion_flavor.0100.h:0 "或许我该前去，沉浸在今日的歌声之中。"
 agot_listened_to_songs:0 "你整日里都在聆听歌声。"
 agot_religion_flavor.0101.t:0 "抵达圣堂"
 agot_religion_flavor.0101.desc:0 "眼前的阶梯仿佛直通天穹。阶梯顶端，便是圣堂的大理石高墙与金色穹顶——它如同一座灯塔，召唤着所有虔信者步入其中，寻求救赎。我身边则是王国里的其他少女，她们与我一同前来，共庆这神圣的日子。\n\n我拾级而上，准备迎接即将到来的祈祷与颂歌，我们一同庆祝这份纯真……"
 agot_religion_flavor.0101.a:0 "是时候唱歌，跳舞，祈祷了。"
 agot_religion_flavor.0102.t:0 "点燃七盏蜡烛"
 agot_religion_flavor.0102.desc:0 "我走向少女神像，手中紧握着用来点燃七支蜡烛的细木引火棒，手腕上还挂着羊皮纸制花环。我缓缓走到神像脚下，将花环挂上雕像的颈项，落在其他少女们早已献上的花环之上。\n\n我跪在雕像前，将引火柴的尖端探入另一支蜡烛的火焰中，直到点燃自己的火苗。我稳稳地将面前的七支蜡烛一一燃亮，每一步都严格遵循着修女曾教导我的方式。待七支蜡烛全部点亮，我双手合十，准备祈祷……"
 agot_religion_flavor.0102.a:0 "向七位一体之神祈祷"
 agot_religion_flavor.0103.t:0 "修女见证了一切"
 agot_religion_flavor.0103.desc:0 "一想到要参加少女节的庆典，我就觉得乏味至极——我还有太多更重要的事情要去做。并且如果我选择处理正事，而不是去参加这些无聊又浪费时间的节日，又能怎样？想必也不会有人惦记我。\n\n但当我我在花园里漫步，身后传来一声清嗓。我转过身去，只见[maiden_day_septa.GetName]站在那里，脸上挂着一丝笑意，可任谁都能看出，[maiden_day_septa.GetHerHis]那笑容之下隐藏的不悦。\n\n“我的孩子，你怎么不去为少女节庆典做准备？你真的该去了，可别迟到了，好吗？”"
 agot_religion_flavor.0103.a:0 "你竟然擅自决定我该去哪里，未免也太自以为是了。"
 agot_religion_flavor.0103.b:0 "为何我还要去？我早已不是少女了。"
 agot_religion_flavor.0103.b.tt:0 "这话若是说出口，恐怕不会没有后果……"
 agot_religion_flavor.0103.b.toast:0 "[maiden_day_septa.GetName]已经向整个王国宣告——你是通奸者。"
 agot_religion_flavor.0103.c:0 "好吧，我会参加的。"
 agot_religion_flavor.0105.t:0 "一如既往……叛逆"
 agot_religion_flavor.0105.desc:0 "少女节已经到了。我来到[maiden_daughter.GetFirstNamePossessive]的房间，却见[maiden_daughter.GetSheHe]丝毫没有要动身准备的样子。\n\n“你怎么还没准备好？我们得赶紧去圣堂了。”\n\n“我才不要听那个老修女对我的贞洁说教，我还有更重要的事要做。”[maiden_daughter.GetSheHe]语气厌烦地说道。\n\n我不禁又一次暗自疑惑，为什么与[maiden_daughter.GetHerHim]有关的事情，无论大小，总是这么棘手……"
 agot_religion_flavor.0105.a:0 "亲爱的，去吧。你知道违抗修女们绝非明智之举。"
 agot_religion_flavor.0105.a.tt:0 "你试图同[maiden_daughter.GetName]讲道理"
 agot_religion_flavor.0105.b:0 "身为信徒，我们理应出席。"
 agot_religion_flavor.0105.c:0 "这个无礼的小孩，竟敢违抗我！"
 agot_religion_flavor.0105.c.tt:0 "你狠狠扇了[maiden_daughter.GetFirstNameNoTooltip]一记耳光，给了[maiden_daughter.GetHerHim]一个教训"
 msg_went_to_celebrations:0 "[maiden_daughter.GetSheHe]最终妥协，参加了庆典。"
 agot_religion_flavor.0106.t:0 "虔信之女"
 agot_religion_flavor.0106.desc:0 "少女节又至。我前往[maiden_daughter.GetNamePossessive]的房间查看[maiden_daughter.GetHerHis]准备得如何，我轻轻推开门缝往里瞧，本以为[maiden_daughter.GetHerHim]还睡得正沉……却见[maiden_daughter.GetHerHis]早已把头发编成精美的发辫，正在自己穿上礼服！\n\n我无声地掩上房门，心中满是骄傲。我回到门厅等候，待[maiden_daughter.GetSheHe]梳妆完毕，[maiden_daughter.GetSheHe]就来找我，并在出发前往圣堂前拥抱了我。"
 agot_religion_flavor.0106.a:0 "我真为自己养出这么有担当的孩子感到骄傲。"
 agot_religion_flavor.0108.t:0 "惊世骇怒"
 agot_religion_flavor.0108.desc:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', maiden_daughter)]气呼呼地一头栽倒在床上，双臂紧紧抱在胸前。\n\n“我说到做到！我才不去什么沉闷又老掉牙的节日！”[maiden_daughter.GetSheHe]语气倔强，态度坚决。“谁要整天就唱歌、互相编头发啊？无聊透顶，纯粹是浪费时间！”"
 agot_religion_flavor.0108.a:0 "我会给我们#bold 双方#!空间冷静一下。"
 agot_religion_flavor.0108.a.tt:0 "你满心挫败，只得留下[maiden_daughter.GetHerHim]，让其独自静处"
 agot_religion_flavor.0109.t:0 "少女不再"
 agot_religion_flavor.0109.desc:0 "[ROOT.Char.Custom2('direct_address_by_familiarity', maiden_daughter)|U]与我说话时，[maiden_daughter.GetSheHe]神色显得局促不安。“我可以说实话吗，[maiden_daughter.Custom2('spoken_address_by_familiarity', ROOT.Char )]？”\n\n我紧张地点了点头，心中愈发忐忑，等着[maiden_daughter.GetSheHe]继续说下去。\n\n“我……已经不是处子之身了……”[maiden_daughter.GetNameNoTooltip]低声说道。"
 agot_religion_flavor.0109.a:0 "……"
 agot_religion_flavor.0109.a.tt:0 "你又惊又悲，离开了[maiden_daughter.GetHerHis]的房间，不知该做些什么、又该说些什么。"
 agot_religion_flavor.0109.b:0 "#bold 尚未婚配#!，你却已失去了贞洁？！"
 agot_religion_flavor.0110.t:0 "事前的一点小帮助"
 agot_religion_flavor.0110.desc:0 "少女节又至。我来到[maiden_daughter.GetNamePossessive]的房间，想看看[maiden_daughter.GetHerHis]准备得如何。轻轻推开房门往里一瞥，只见[maiden_daughter.GetHerHim]已穿戴整齐，却正独自费力地编着头发。我推门走了进去。\n\n[maiden_daughter.GetSheHe]立刻注意到了我，开口问道：“[maiden_daughter.Custom2('spoken_address_by_familiarity', ROOT.Char )|U]，您能帮我编头发吗？”我微笑着点了点头。拿起[maiden_daughter.GetHerHis]的发梳，轻轻梳开打结的发丝，随后为[maiden_daughter.GetHerHis]挽起了一个精致美丽的编发发髻……"
 agot_religion_flavor.0110.a:0 "真是共度了一段美好时光！"
 agot_religion_flavor.0110.a.tt:0 "[maiden_daughter.GetName]将出席此次庆典"
 agot_religion_flavor.0111.t:0 "那个漫步前往圣堂的清晨"
 agot_religion_flavor.0111.desc:0 "少女节到了，王国的所有少女都须前往圣堂参加庆典。[ROOT.Char.Custom2('direct_address_by_familiarity', maiden_daughter)|U]年纪太小，还不能独自前去，所以我得陪着[maiden_daughter.GetHerHim]。[maiden_daughter.GetSheHe]穿上为今天特制的礼服，准备好后，便伸出小手，耐心地等我牵起。\n\n我一握住[maiden_daughter.GetHerHis]的手，[maiden_daughter.GetSheHe|U]就甜甜地笑了，我们便一同朝圣堂走去。一路上我们有说有笑，不知不觉间，竟发现已经快要到了……"
 agot_religion_flavor.0111.a:0 "我希望她能尽情享受庆典……"
 agot_religion_flavor.0112.t:0 "缪斯"
 agot_religion_flavor.0112.desc:0 "听着节庆的歌谣，我的目光总是不由自主地落在一位少女身上。看着[maiden_day_muse.GetHerHim]歌唱起舞，我忍不住想方设法，靠近[maiden_day_muse.GetHerHim]……\n\n我终于凑到了能听清[maiden_day_muse.GetHerHis]动人歌喉的距离，[maiden_day_muse.GetHerHis]的美貌更让歌声平添魅力。当[maiden_day_muse.GetSheHe]唱罢，我便上前与[maiden_day_muse.GetHerHim]攀谈起来。我坚信[maiden_day_muse.GetFirstNameNicknamed]是诸神赐予的恩赐，但这其中是否另有玄机？"
 agot_religion_flavor.0112.a:0 "诸神保佑，让我们得以听闻[maiden_day_muse.GetHerHim]的天籁之音……"
 agot_religion_flavor.0112.a.tt:0 "你整日里都在聆听[maiden_day_muse.GetHerHim]的歌声"
 agot_religion_flavor.0112.b:0 "也许我们应当寻找一个可以独处的地点？"
 agot_religion_flavor.0112.b.tt:0 "你试图追求那位美丽的少女"
 msg_got_rejected_by_muse:0 "[maiden_day_muse.GetFirstNameNoTooltip]拒绝了你的示好，回到了庆典之中。"
 agot_religion_flavor.0113.t:0 "爱意弥漫"
 agot_religion_flavor.0113.desc:0 "不久之后，我便与[maiden_day_muse.GetName]独处，远离了旁人的目光。我们之间的气氛炽热浓烈，每一次对视、每一个动作，都让彼此愈发靠近，就连沉默，也满蓄着未曾言说的情愫。\n\n很快，所有克制尽数崩塌，我们沉醉在这一刻，外界的一切都烟消云散，任由心底积攒已久的情愫肆意绽放。"
 agot_religion_flavor.0113.a:0 "或许这便是诸神的旨意——让我迎娶[maiden_day_muse.GetHerHim]。"
 agot_religion_flavor.0113.b:0 "这绝不能是我最后一次见到[maiden_day_muse.GetHerHim]。"
 agot_religion_flavor.0113.c:0 "那不过只是转瞬即逝，仅此而已。"