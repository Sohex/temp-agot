l_french:
 # Slight Changes to add Prowess and Leadership to tooltip
 game_concept_prowess_skill_desc:2 "[skill|E] secondaire qui reflète l’aptitude du personnage à se battre en personne.\n\nUne valeur élevée implique qu’il est plus susceptible de survivre et bien se débrouiller à la fois comme [knight|El] dans les [battles|El] et dans les [single_combat_duel_plural|El].\n\nChaque point de prouesse donne un chevalier :\n$BULLET_WITH_TAB$[damage|E] : #V [GetDefine('NCombat', 'KNIGHT_DAMAGE_PER_PROWESS')]#!\n$BULLET_WITH_TAB$[toughness|E]: #V [GetDefine('NCombat', 'KNIGHT_TOUGHNESS_PER_PROWESS')]#!\n\n$PROWESS_MUSCLE_INFO$\n\nLe [lifestyle|E] correspondant est le [nht_prowess_lifestyle|E]."
 game_concept_lifestyle_desc:2 "Les [rulers|El] [adults|El] peuvent choisir un mode de vie qui leur permettra de choisir un [focus|El] et commencer à gagner des [perks|El].\n\nChaque mode de vie a son propre type d’[experience|El], qui est utilisé pour acheter des [perks|El]. Par exemple, l’expérience dans le [intrigue_lifestyle|El] est nécessaire pour gagner des atouts tels que [GetPerk( 'dreadful_perk' ).GetName( GetPlayer )|l] ou [GetPerk( 'like_weed_in_a_garden_perk' ).GetName( GetPlayer )|l].\n\nLes modes de vie sont :\n$BULLET_WITH_TAB$ [diplomacy_lifestyle|E]\n$BULLET_WITH_TAB$ [stewardship_lifestyle|E]\n$BULLET_WITH_TAB$ [martial_lifestyle|E]\n$BULLET_WITH_TAB$ [intrigue_lifestyle|E]\n$BULLET_WITH_TAB$ [learning_lifestyle|E]\n$BULLET_WITH_TAB$ [nht_prowess_lifestyle|E]\n$BULLET_WITH_TAB$ [nht_leadership_lifestyle|E]"
