 ########################
 ####### Decisions ######
 ########################    
 
 nht_reinforce_barony_perk_decision:1 "Renforcer la Possession"
 nht_reinforce_barony_perk_decision_tooltip:1 "Construire des fortifications dans l'une de vos [baronies|E]."
 nht_reinforce_barony_perk_decision_desc:1 "En ces temps troublés, nombreux sont ceux qui aimeraient voir ma dynastie chuter. Il serait sage de renforcer sa position contre d'éventuels ennemis avant qu'ils n'arrivent."
 nht_reinforce_barony_perk_decision_confirm:1 "Renforcer la Possession"

 ## A été omis de la mise à jour précédente
 #nht_capital_wall_perk_decision:1 "Construire un Mur de la Capitale"
 #nht_capital_wall_perk_decision_tooltip:1 "Construire un [special_building|E] dans votre [capitale|E]."
 #nht_capital_wall_perk_decision_desc:1 "En ces temps troublés, nombreux sont ceux qui aimeraient voir ma dynastie chuter. Il serait sage de renforcer sa position contre d'éventuels ennemis avant qu'ils n'arrivent. En construisant un mur autour de ma capitale, je symbolise ma force et assure la prospérité de mon royaume."
 #nht_capital_wall_perk_decision_confirm:1 "Préparer la Construction"


 nht_sack_countryside_provisions_decision: "Piller la Campagne pour des Provisions"
 nht_sack_countryside_provisions_decision_tooltip: "Cherchez et pillez un [county|E] à proximité pour trouver des provisions."
 nht_sack_countryside_provisions_decision_desc: "Mon camp a besoin de manger, et moi aussi. Les ressources sont abondantes ici et prêtes à être prises à [ROOT.Char.GetCurrentLocation.GetName]..."
 nht_sack_countryside_provisions_decision_confirm: "Piller la Campagne"
 nht_sack_countryside_provisions_decision_effect_tt: "Vous, votre [GetCourtPositionType('second_camp_officer').GetName], ou votre [GetCourtPositionType('master_of_spoils_camp_officer').GetName], pouvez fouiller et piller le [county|E] pour des [provisions|E]"

 nht_sack_countryside_provisions.0001.t: "Pillage de la Campagne de [loot_province.GetNameNoTooltip]"
 nht_sack_countryside_provisions.0001.desc: "Je donne l'ordre à mes soldats de ratisser les environs de [loot_province.Custom('TerrainTypeProvince')] à la recherche de tout ce qui a de la valeur. Nourriture, or, ou provisions—tout est bon à prendre.\n\n"

 nht_sack_countryside_provisions.0001.winter_sack: "[loot_province.GetName] offre peu de ressources en hiver. Le froid est mordant, et les [loot_province.Custom('GetTerrainTypePlural')] sont gelés sous une épaisse couche de neige. Il n'y a pas grand-chose à trouver ici..."
 nht_sack_countryside_provisions.0001.poor_sack: "Les [loot_province.Custom('GetProvinceGroundDesc')] et [loot_province.Custom('GetTerrainTypePlural')] de [loot_province.GetName] semblent stériles. Pas de nourriture, pas de richesses. Juste de la désolation. Nous pourrons peut-être trouver quelque chose d'utile, mais ce ne sera pas facile."
 nht_sack_countryside_provisions.0001.decent_sack: "Bien que [loot_province.GetName] ne soit pas une terre d'abondance, nous pourrions trouver quelques ressources éparses et du bétail errant. Nous prendrons ce que nous pourrons."
 nht_sack_countryside_provisions.0001.rich_sack: "[loot_province.GetName] est mûr pour être pillé ! Des champs riches en récoltes, des greniers pleins, et des villageois cachant des objets de valeur. Le butin sera à nous !"
 nht_sack_countryside_provisions.0001.limited_sack: "Le terrain de [loot_province.GetName] offre un peu d'espoir. Ce n'est pas grand-chose, mais avec de la patience, nous trouverons des provisions."

 nht_sack_countryside_provisions.0001.withered_land_sack: "[loot_province.GetName] semble maudit. Ses champs sont craquelés et secs, les villageois émaciés et épuisés. Même le bétail paraît faible. Nous aurons de la chance de rassembler ne serait-ce qu'une petite quantité ici."
 nht_sack_countryside_provisions.0001.scarred_battlefield_sack: "Les [loot_province.Custom('GetTerrainTypePlural')] de [loot_province.GetName] portent encore les cicatrices de la guerre récente. De nombreux villages sont en ruine, et leurs habitants ont déjà été dépouillés de tout ce qu'ils possédaient. Il reste peu pour nous, mais quelques retardataires pourraient encore avoir caché des objets de valeur."
 nht_sack_countryside_provisions.0001.protected_village_sack: "Les paysans de [loot_province.GetName] semblent avoir été prévenus de notre arrivée. Ils se sont barricadés, et les forces de leur seigneur sont vigilantes. Nous devrons agir avec précaution si nous voulons trouver quelque chose sans attirer plus de représailles."
 nht_sack_countryside_provisions.0001.unprepared_village_sack: "[loot_province.GetName] est mûr pour être pillé. Les habitants ne sont absolument pas préparés à notre assaut, et leurs réserves sont intactes. Nous pouvons piller à volonté."
 nht_sack_countryside_provisions.0001.opportunistic_sack: "En approchant de [loot_province.GetName], nous découvrons que le seigneur local est absent, occupé ailleurs. Ses soldats sont peu nombreux, et les villageois sont désorganisés. C'est le moment idéal pour profiter du chaos."

 nht_sack_countryside_provisions.0001.a: "Je mènerai moi-même la recherche."
 nht_sack_countryside_provisions.0001.a_personal_success: "Je trouve moi-même des provisions pour nous sustenter."
 nht_sack_countryside_provisions.0001.a_personal_failure: "Je ne trouve rien de valeur."

 nht_sack_countryside_provisions.0001.limit_loot: "Limiter le pillage pour ne pas énerver le seigneur local."
 nht_sack_countryside_provisions.0001.limit_loot_desc: "Je demande à mes hommes d'être modérés dans leur pillage. Nous prendrons juste ce qu'il faut pour nous nourrir, mais laisserons les villageois avec quelque chose. Ainsi, le seigneur local ne sera pas trop prompt à se venger."
 nht_sack_countryside_provisions.0001.limit_loot_success: "Le pillage se déroule sans accroc. Nous avons pris assez pour survivre sans attirer trop de colère."
 nht_sack_countryside_provisions.0001.limit_loot_failure: "Malgré notre modération, des rumeurs de nos actions sont déjà parvenues au seigneur de [loot_province.GetName], et il n'est pas content."

 nht_sack_countryside_provisions.0001.b: "Laisser les éclaireurs diriger le pillage."
 nht_sack_countryside_provisions.0001.b.named: "Les éclaireurs connaissent bien la région ; laissons-les s'occuper du pillage."
 nht_sack_countryside_provisions.0001.b.success: "Les éclaireurs rassemblent un butin considérable."
 nht_sack_countryside_provisions.0001.b.failure: "Les éclaireurs ne trouvent rien de valable."

 nht_sack_countryside_provisions.0001.c: "Envoyer mes soldats saccager la région."
 nht_sack_countryside_provisions.0001.c.named: "Envoyer [second_camp_officer.GetFirstNameNoTooltip] diriger le pillage."
 nht_sack_countryside_provisions.0001.c.success: "[second_camp_officer.GetFirstNameNoTooltip] revient avec du butin."
 nht_sack_countryside_provisions.0001.c.failure: "[second_camp_officer.GetFirstNameNoTooltip] ne trouve rien."

 nht_sack_countryside_provisions.0001.d: "Demander au Maître des Butins de superviser le pillage."
 nht_sack_countryside_provisions.0001.d.named: "[master_of_spoils_camp_officer.GetFirstNameNoTooltip], en tant que gardien des ressources du camp, veillera à ce que nous saisissions les biens les plus précieux."
 nht_sack_countryside_provisions.0001.d.success: "[master_of_spoils_camp_officer.GetFirstNameNoTooltip] revient avec un butin bien organisé—métaux précieux, bétail, et même quelques marchandises rares des marchands locaux."
 nht_sack_countryside_provisions.0001.d.failure: "[master_of_spoils_camp_officer.GetFirstNameNoTooltip] juge mal la valeur du butin, ramenant peu de choses importantes. Notre camp ne tirera aucun profit majeur de ce raid."

 nht_sack_countryside_provisions.0001.e: "J'ai reconsidéré la question."

 nht_sack_countryside_provisions.0001.no_provisions_tt: "Aucune [provision|E] trouvée."
