 ##################
 ##### Traits #####
 ##################

 ###Prowess Lifestyle Traits 
 #Vanguard
 trait_nht_vanguard:0 "Avant-garde"
 nht_vanguard_desc:0 "Une force implacable d'agression, taillant à travers les lignes ennemies comme une tempête de destruction, menant des hommes dans le chaos de la bataille."

 #Commander
 trait_nht_commander:0 "Commandant"
 nht_commander_desc:0 "Ce n'est qu'au cœur de la bataille que l'on peut vraiment comprendre comment diriger."

 #Sentinel
 trait_nht_sentinel:0 "Sentinelle"
 nht_sentinel_desc:0 "Un gardien vigilant, habile dans l'art de la défense, qui reste ferme face à toute menace, prêt à affronter tout danger qui se présente."

 ###Traits du Mode de Vie Leadership
 #Visionary
 trait_nht_visionary:0 "Visionnaire"
 trait_nht_visionary_desc:0 "Les chemins menant à la gloire et l'obscurité se cachent derrière le voile des possibilités infinies ; seuls les visionnaires savent lequel prendre."

 #Cosmopolitan
 trait_nht_cosmopolitan:0 "Cosmopolite"
 trait_nht_cosmopolitan_desc:0 "On ne peut comprendre le monde qu'à travers ses multiples perspectives et expériences."

 #Founder
 trait_nht_founder:0 "Fondateur"
 trait_nht_founder_desc:0 "Un homme peut trouver l'immortalité dans l'héritage qu'il apporte à sa dynastie."

 #Education Groups
 trait_education_nht_leadership:0 "Students of Leadership"
 trait_education_nht_prowess:0 "Students of Prowess"
 
 # Prowess Education Traits
 trait_education_nht_prowess_1:0 "Novice Fighter"
 trait_education_nht_prowess_1_desc:0 "The Novice Fighter has been introduced to the basics of combat, barely scratching the surface of martial prowess."
 trait_education_nht_prowess_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has been introduced to the basics of combat, barely scratching the surface of martial prowess."
 trait_education_nht_prowess_2:0 "Skilled Brawler"
 trait_education_nht_prowess_2_desc:0 "The Skilled Brawler has honed their combat skills through rigorous training, showing notable competence on the battlefield."
 trait_education_nht_prowess_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has honed their combat skills through rigorous training, showing notable competence on the battlefield."
 trait_education_nht_prowess_3:0 "Battle-Hardened Warrior"
 trait_education_nht_prowess_3_desc:0 "The Battle-Hardened Warrior possesses a deep understanding of both single combat and coordinated battlefield maneuvers, making them a formidable opponent in any fight."
 trait_education_nht_prowess_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] possesses a deep understanding of both single combat and coordinated battlefield maneuvers, making [ROOT.GetCharacter.GetHerHim] a formidable opponent in any fight."
 trait_education_nht_prowess_4:0 "Prestigious Champion"
 trait_education_nht_prowess_4_desc:0 "The Prestigious Champion is a paragon of martial excellence, with unmatched skill in combat and leading and inspiring any troop on the battlefield."
 trait_education_nht_prowess_4_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is a paragon of martial excellence, with unmatched skill in combat and leading and inspiring any troop on the battlefield."
 trait_education_nht_prowess_5:0 "Master of Arms"
 trait_education_nht_prowess_5_desc:0 "The Master of Arms is a legend in their own right, wielding combat mastery that silences doubters and inspires allies. The mere mention of their presence sends whispers of awe through the ranks and would pause even the most seasoned warriors."
 trait_education_nht_prowess_5_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is a legend in their own right, wielding combat mastery that silences doubters and inspires allies. The mere mention of [ROOT.GetCharacter.GetHerHis] presence sends whispers of awe through the ranks and would pause even the most seasoned warriors."

 # Leadership Education Traits
 trait_education_nht_leadership_1:0 "Misguided Autocrat"
 trait_education_nht_leadership_1_desc:0 "The Misguided Autocrat has barely begun to understand the rudiments of leadership. Fair or just ruling are concepts that eludes them as much as long-term plans...."
 trait_education_nht_leadership_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has barely begun to understand the rudiments of leadership. Fair or Just ruling are concepts that eludes [ROOT.GetCharacter.GetHerHim] as much as long-term plans..."
 trait_education_nht_leadership_2:0 "Adept Steward"
 trait_education_nht_leadership_2_desc:0 "The Adept Steward is adequate when it comes to managing the realm's affairs, but there is still much to be learned."
 trait_education_nht_leadership_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is adequate when it comes to managing the realm's affairs, but there is still much to be learned."
 trait_education_nht_leadership_3:0 "Sagacious Ruler" 
 trait_education_nht_leadership_3_desc:0 "The Sagacious Ruler possesses a good understanding of governance, guiding their realm wisely and ensuring at least some prosperity for their dynasty."
 trait_education_nht_leadership_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] possesses a good understanding of governance, guiding [ROOT.GetCharacter.GetHerHis] realm wisely and ensuring some prosperity for [ROOT.GetCharacter.GetHerHis] dynasty."
 trait_education_nht_leadership_4:0 "Enlightened Monarch"
 trait_education_nht_leadership_4_desc:0 "The Enlightened Monarch possesses a profound understanding of the art of ruling, leading their realm and dynasty to prosperity and unity."
 trait_education_nht_leadership_4_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] possesses a profound understanding of the art of ruling, leading [ROOT.GetCharacter.GetHerHis] realm and dynasty to prosperity and unity."
 trait_education_nht_leadership_5:0 "Architect of Legacies" 
 trait_education_nht_leadership_5_desc:0 "The Architect of Legacies knowledge of gouvernance is unparalleled, paving the way for an age of prosperity that is only rivaled by legendary tales, guiding their dynasty to new glory."
 trait_education_nht_leadership_5_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] knowledge of gouvernance is unparalleled, paving the way for an age of prosperity that is only rivaled by legendary tales, guiding [ROOT.GetCharacter.GetHerHis] dynasty to new glory."
 
 
# Héritier déshonoré
trait_nht_disgraced_heir:1 "Héritier déshonoré"
trait_nht_disgraced_heir_desc:1 "Ce personnage a été brusquement écarté au profit d'un autre héritier, suscitant du ressentiment et ternissant sa réputation et son statut parmi ses pairs."
trait_nht_disgraced_heir_character_desc:1 "[ROOT.GetCharacter.GetFirstNameNoTooltip] a été brusquement écarté au profit d'un autre héritier, suscitant du ressentiment et ternissant sa réputation et son statut parmi ses pairs."

 # Héritier controversé
 trait_nht_controversial_heir:1 "Héritier controversé"
 trait_nht_controversial_heir_desc:1 "L'ascension soudaine de ce personnage au poste d'héritier principal suscite beaucoup de controverse. Des doutes persistent quant à sa légitimité."
 trait_nht_controversial_heir_character_desc:1 "L'ascension soudaine de [ROOT.GetCharacter.GetFirstNameNoTooltip] au poste d'héritier principal suscite beaucoup de controverse. Des doutes persistent quant à sa légitimité."

 trait_nht_controversial_heir_gender_equal_same_family_desc:1 "L'ascension de ce personnage en tant qu'héritier principal suscite une certaine controverse, seuls de petits doutes persistent quant à sa légitimité, car il est toujours l'enfant de son prédécesseur."
 trait_nht_controversial_heir_gender_equal_same_family_character_desc:1 "L'ascension de [ROOT.GetCharacter.GetFirstNameNoTooltip] en tant qu'héritier principal suscite une certaine controverse, seuls de petits doutes persistent quant à sa légitimité, car il est toujours l'enfant de son prédécesseur."
 trait_nht_controversial_heir_gender_equal_same_house_desc:1 "L'ascension de ce personnage en tant qu'héritier principal suscite la controverse, seuls quelques doutes persistent quant à sa légitimité, car il appartient toujours à la maison de son prédécesseur."
 trait_nht_controversial_heir_gender_equal_same_house_character_desc:1 "L'ascension de [ROOT.GetCharacter.GetFirstNameNoTooltip] en tant qu'héritier principal suscite la controverse, seuls quelques doutes persistent quant à sa légitimité, car il appartient toujours à la maison de son prédécesseur."
 trait_nht_controversial_heir_gender_equal_same_dynasty_desc:1 "L'ascension de ce personnage en tant qu'héritier principal suscite beaucoup de controverse, même au sein de sa dynastie partagée, sa revendication au trône devient un sujet de débat intense."
 trait_nht_controversial_heir_gender_equal_same_dynasty_character_desc:1 "L'ascension de [ROOT.GetCharacter.GetFirstNameNoTooltip] en tant qu'héritier principal suscite beaucoup de controverse, même au sein de sa dynastie partagée, sa revendication au trône devient un sujet de débat intense."
 trait_nht_controversial_heir_gender_equal_other_dynasty_desc:1 "La nomination de ce personnage en tant qu'héritier principal déclenche une controverse généralisée, car son lignage diverge de la dynastie régnante, des doutes persistent quant à son droit légitime au trône."
 trait_nht_controversial_heir_gender_equal_other_dynasty_character_desc:1 "La nomination de [ROOT.GetCharacter.GetFirstNameNoTooltip] en tant qu'héritier principal déclenche une controverse généralisée, car son lignage diverge de la dynastie régnante, des doutes persistent quant à son droit légitime au trône."
 trait_nht_controversial_heir_gender_equal_lowborn_desc:1 "La nomination de ce personnage en tant qu'héritier principal déclenche une tempête de controverse, ses origines modestes alimentent des doutes quant à sa pertinence pour le trône, pour le moins que l'on puisse dire."
 trait_nht_controversial_heir_gender_equal_lowborn_character_desc:1 "La nomination de [ROOT.GetCharacter.GetFirstNameNoTooltip] en tant qu'héritier principal déclenche une tempête de controverse, ses origines modestes alimentent des doutes quant à sa pertinence pour le trône, pour le moins que l'on puisse dire."

 trait_nht_controversial_heir_gender_unequal_same_family_desc:1 "L'ascension de ce personnage en tant qu'héritier principal suscite une certaine controverse, seuls de petits doutes persistent quant à sa légitimité, car il est toujours l'enfant de son prédécesseur. Même son genre défie les attentes traditionnelles de ce royaume."
