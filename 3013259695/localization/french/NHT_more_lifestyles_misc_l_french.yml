 ###################
 #### Nicknames ####
 ###################
    
 nick_nht_the_indomitable:1 "l'Indomptable"
 nick_nht_the_indomitable_desc:1 "Une tempête implacable sous forme humaine, [CharYouSheHe(CHARACTER)|U] balaye l'adversité comme des feuilles dans le vent, une inspiration vivante cachée dans la tempête."
 nick_nht_the_valorous:1 "le Valeureux"
 nick_nht_the_valorous_desc:1 "L'engagement inébranlable de [CharYourHerHis(CHARACTER)|U] envers l'honneur et le devoir incite les autres à considérer [CHARACTER.GetShortUINameNoTooltipNoFormat] avec admiration."
 nick_nht_the_swordmaster:1 "le Maître d'armes"
 nick_nht_the_swordmaster_desc:1 "La maîtrise de l'épée de [CharYourHerHis(CHARACTER)|U] laisse tous ceux qui voient [CharYouHerHim(CHARACTER)] à l'œuvre dans une admiration totale, même parmi les guerriers les plus chevronnés." 
 
 
 
