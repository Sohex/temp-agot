 nht_ml_sack_holding_event.0001.desc.first:1 "The battle is over. My army has crushed the resistance of nht_sacked_barony.GetNameNoTierNoTooltip], a wealthy and strategic city in the territory of [nht_sack_previous_owner.GetTitledFirstName]. The enemy has been defeated, and the city is under my control.\n\nAs I enter the city, flanked by my loyal commanders. I see the riches of this holding."
 nht_ml_sack_holding_event.0001.desc.sec:1 "The day has come. My army has broken through the defenses of [nht_sacked_barony.GetNameNoTierNoTooltip], a prosperous and important city in the lands of [nht_sack_previous_owner.GetTitledFirstName]. The enemy has been routed, and the city is mine.\n\nAs I walk into the city, accompanied by my best warriors, I see the spoils of war: the buildings, the goods, and the people."
 nht_ml_sack_holding_event.0001.desc.third:1 "The siege of [nht_sacked_barony.GetNameNoTierNoTooltip] has finally come to an end. My army has stormed the gates and taken control of the city, a vital stronghold in the war against [nht_sack_previous_owner.GetTitledFirstName]. The enemy soldiers have either fled, surrendered, or died.\n\nI ride through the streets, surrounded by my loyal men. I see the fear and hatred in the eyes of the civilians, who know they are at my mercy."
 nht_ml_sack_holding_event.0001.desc.fourth:1 "After a long and bloody siege, my army finally breached the walls of [nht_sacked_barony.GetNameNoTierNoTooltip], a rich and strategic holding of [nht_sack_previous_owner.GetTitledFirstName]'s realm. The enemy soldiers put up a fierce resistance, but they were no match for my forces.\n\nAs I enter the city, I see the signs of devastation and despair. Smoke rises from the burning buildings, corpses litter the streets, and cries of pain and fear fill the air."
 #Capital
 nht_ml_sack_holding_event.0001.desc.fifth:1 "After a long and bloody siege, my army finally breaches the walls of [nht_sacked_barony.GetNameNoTierNoTooltip], the capital of [nht_sack_previous_owner.GetNameNoTierNoTooltip]. The defenders put up a fierce resistance, but they are no match for my army.\n\nAs I enter the city\n\nI enter the city, flanked by my loyal commanders. I see the riches of this city."

 nht_ml_sack_holding_event.0001.desc_warning_holysite:1 "\n\n#warning [nht_sacked_barony.GetNameNoTierNoTooltip] is considered by many to by a Holy Site.#!"

 nht_ml_sack_holding_event.0001.a:1 "Il sera épargné."
 nht_ml_sack_holding_event.0001.a_tt:1 "Le [barony|E] sera épargné cette fois-ci..."
 nht_ml_sack_holding_event.0001.b:1 "Seule une petite partie."
 nht_ml_sack_holding_event.0001.b_tt:1 "Un [buildings|E] dans cette [barony|E] sera réduit d'un niveau ou complètement détruit."
 nht_ml_sack_holding_event.0001.c:1 "La moitié suffira."
 nht_ml_sack_holding_event.0001.c_tt:1 "La moitié des [buildings|E] dans cette [barony|E] sera réduite d'un niveau ou complètement détruite."
 nht_ml_sack_holding_event.0001.d:1 "Rasez-le jusqu'au sol !"
 nht_ml_sack_holding_event.0001.d_tt:1 "Chaque [buildings|E] dans cette [barony|E] sera complètement détruit."
 nht_ml_sack_holding_event.0001.d_warning_tt:1 "#attention Les [duchy_buildings|E] et les [special_buildings|E] seront probablement détruits.#!"
 nht_ml_sack_holding_event.0001.d_holy_site_tt:1 "Chaque [rulers|E] de la région, qui considère cette [barony|E] comme un [holy_site|E], perdra #N -30#! [opinion|E] envers #high vous#! pendant #high 30 ans#!"
 nht_ml_sack_holding_event.0001.e:1 "Jamais de mon vivant !"
 nht_ml_sack_holding_event.0001.e_tt:1 "#warning @warning_icon! Cet événement ne se reproduira jamais dans la vie de ce [ruler|E]#!"
