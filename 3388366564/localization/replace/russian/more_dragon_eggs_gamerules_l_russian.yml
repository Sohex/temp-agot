 setting_canon_dragon_egg_hatch_likelihood_never_desc: "Канонические драконьи яйца никогда не вылупятся в колыбели, в драконьем логове или как дополнительные яйца на церемонии, если только эта настройка не стоит на «Всегда». Действует только при включённых канонических драконах."
 setting_canon_dragon_egg_hatch_likelihood_less_likely_desc: "Канонические драконьи яйца вылупляются реже в колыбели, в драконьем логове и как дополнительные яйца на церемонии. Суммируется с этими настройками. Действует только при включённых канонических драконах."
 setting_canon_dragon_egg_hatch_likelihood_default_desc: "Канонические драконьи яйца используют те же шансы, что и остальные яйца, в колыбели, в драконьем логове и на церемонии. Действует только при включённых канонических драконах."
 setting_canon_dragon_egg_hatch_likelihood_more_likely_desc: "Канонические драконьи яйца вылупляются чаще в колыбели, в драконьем логове и как дополнительные яйца на церемонии. Суммируется с этими настройками. Действует только при включённых канонических драконах."
 setting_canon_dragon_egg_hatch_likelihood_common_desc: "Высокий шанс вылупления канонических драконьих яиц в колыбели, в драконьем логове и как дополнительных яиц на церемонии. Суммируется с этими настройками. Действует только при включённых канонических драконах."
 setting_canon_dragon_egg_hatch_likelihood_guaranteed_desc: "Канонические драконьи яйца никогда не станут бесплодными в колыбели или в драконьем логове, если только эта настройка не стоит на «Никогда», и всегда вылупятся как дополнительные яйца на церемонии. Действует только при включённых канонических драконах."
  
