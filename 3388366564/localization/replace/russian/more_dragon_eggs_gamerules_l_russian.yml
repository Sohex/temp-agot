 rule_canon_dragon_egg_hatch_likelihood: "@dragon_destined_icon! More Dragon Eggs - Вероятность вылупления канонических яиц"
 setting_canon_dragon_egg_hatch_likelihood_never: "Никогда"
 setting_canon_dragon_egg_hatch_likelihood_less_likely: "Менее вероятно"
