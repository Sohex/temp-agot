 agot_filler_crownlands.0004.t:0 "A Day on Dragonstone: Gifts from the Past"
 agot_filler_crownlands.0004.desc:0 "I walk high up on the cliffs of Dragonstone, the sound of waves crashing against the rocks below mixing with the slow rumble of the volcano in my ears. As I walk, I find a small opening — the perfect place for my cave exploration to begin.\n\nI climb over a crest of rock, guided by the light cascading over the rocks. Several passages lead off from the main chamber, but the light streaks through a single vein of obsidian, as though guiding me. I follow it, and where it leads me, I cannot believe.\n\nAn egg rests in the center of the room, the light ending just above it! As soon as I touch it however, the passage of time makes itself known, and the light begins to fade. I barely have enough time to grab the egg and rush out of the cave before the light would fade completely, locking me in darkness.\n\nWith heavy breaths of exertion, I make it out of the cave, the egg in my hands!"
 agot_filler_crownlands.0004.a:0 "That was close, but well worth it!"
 agot_filler_crownlands.0004.tt:0 "You gained a Dragon Egg [artifact|E]"


 agot_ninepenny.0034.c:0 "A new kingdom will carved out for him."
 agot_ninepenny.0035.b:0 "$agot_ninepenny.0031.a$ It will be given a more fitting name."
 agot_ninepenny.0035.b.tt:0 "#italic The Kingdom of Tarth will be rebranded as The Sapphire Islands!"

 a_crown_for_a_king_decision:0 "A Crown for a King"
 a_crown_for_a_king_decision_desc:0 "Viserys is unworthy of being the King of The Seven Kingdoms, but there is one who is worthy..."
 a_crown_for_a_king_decision_confirm:0 "Crown him!"
 a_crown_for_a_king_decision_tooltip:0 "@warning_icon!#X This will remove Viserys as head of the Targaryen Exiles!#"

 agot_targaryen_exile_invasion.9999.t:0 "A Crown for a King"
 agot_targaryen_exile_invasion.9999.desc:0 "Now that I lead the Exiles and hold the entire Targaryen Dynasty on my shoulders, I must decide what to do with my arrogant and callous brother."
 agot_targaryen_exile_invasion.9999.b:0 "Show him mercy!"
 agot_targaryen_exile_invasion.9999.a:0 "Give him the crown he has earned!"

 agot_ruins.2001.t:0 "Treasures from Tragedy"
 agot_ruins.2001.d:0 "The ruins of Spicetown have long since been overcast with a sense of eerie gloom. The small folk often spread tale that it had been abandoned so long it was claimed as the home of cursed spirits. In face of such superstition, moving its restoration along has proven an enormous effort. But the idea of returning the city to its former glory, a center of trade and gold, has shown to be motivational\n\nToday the effort has proven worthwhile! The last remnants of the ruins were excavated, a supposedly haunted area that hadn’t seen activity from man since The Battle of The Gullet. In a large, burnt-out building, a dragon egg was found!"
 agot_ruins.2001.a:0 "A fortuitous omen!"
 agot_ruins.2001.b:0 "Better it be given to our liege lord."

 agot_ruins.2002.t:0 "A Dragon Egg Is Offered"
 agot_ruins.2002.d:0 "My vassal [egg_giver.GetName] has found an egg in the process of restoring the ruins of Spicetown! Even better news, they have offered it to us as its rightful stewards!"
 agot_ruins.2002.a:0 "We accept!"
 agot_ruins.2002.b:0 "Better they keep it."

 mde_canon_dragon_clutch_events.0001.t:0 "[dragon_parent.GetNameNoTooltip] Brings Forth a Clutch!@historical_character_icon_small!"

 agot_ninepenny.1014.c:0 "The night is alive with the music of dragons! This child is the the 'Dragonborn'!"
 agot_ninepenny.1014.d:0 "Despite the tragedy, there is hope with this child, the 'Dragonborn'."

 agot_dragon_hatching.0403.t:0 "A Flock of Dragons"
 agot_dragon_hatching.0403.desc:0 "Dragons are tenuous beasts, and must be handled thoughtfully and dilligently, for the power they possess and the danger they pose are greater than anything in the known world, especially lest one forget their restless nature. In times of old orders of men were built to maintain these wonders."
 agot_dragon_hatching.0403.opt.a:0 "Pen them in the Dragoncoop."
 agot_dragon_hatching.0403.opt.b:0 "Restore the Dragonkeepers in the Dragonmont, and hold the dragons there."
 agot_dragon_hatching.0403.opt.c:0 "Restore the Dragonkeepers in the Dragonmont, but hold the dragons here with me."
 agot_dragon_hatching.0403.opt.d:0 "The dragons will be housed here in my dragonpit."
 agot_dragon_hatching.0403.opt.e:0 "A dragon is not a slave, let them roam as they please."
 agot_dragon_hatching.0403.opt.a.tt:0 "All unbonded dragons will be moved into your dragoncoop."
 agot_dragon_hatching.0403.opt.b.tt:0 "The Dragonmont will become active again, and all unbonded dragons will be pitted there."
 agot_dragon_hatching.0403.opt.c.tt:0 "The Dragonmont will become active again, but all unbonded dragons will be pitted in the dragonpit of your capital."
 agot_dragon_hatching.0403.opt.d.tt:0 "All unbonded dragons will be pitted in the dragonpit of your capital."
 agot_dragon_hatching.0403.opt.e.tt:0 "All unbonded dragons will be left unpitted.\n#X These dragons can become wild upon your death!#"


 

 mde_egg_msg_found_intro:0 "Whispers of a remarkable discovery race through the harbors and market squares:\n\n"
 mde_egg_msg_found_outro:0 "\n\nMany wonder whether it will ever hatch, and what [mde_egg_owner.GetSheHe] will do with it if it does."
 mde_egg_toast_clutch_t:0 "[dragon_parent.GetNameNoTooltip] Lays a Clutch"
 mde_egg_toast_clutch:0 "Word travels from keep to harbor on the wings of ravens and the tongues of sailors: a dragon has laid eggs!\n\n[dragon_parent.GetName], the [dragon_parent.Custom('GetDragonColorFull')] beast, has laid a clutch for [mde_egg_owner.GetTitledFirstName], including this [mde_toast_egg.GetName].\n\nIf they hatch, the world will have more dragons to fear."
 mde_egg_toast_pickup_t:0 "[mde_egg_owner.GetFirstNameNoTooltip] Finds a Dragon Egg!"
 mde_egg_toast_pickup_skagos:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] has found [mde_toast_egg.GetName] in the Cannibal's lair on Skagos.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_vale:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] has found [mde_toast_egg.GetName] in the Cave of the Fire Witch, high in the Mountains of the Moon.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_isle_of_faces:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] has found [mde_toast_egg.GetName] on the Isle of Faces.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_dragonstone:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] has found [mde_toast_egg.GetName] in the caves of Dragonstone.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_spicetown:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] has found [mde_toast_egg.GetName] deep in the ruins of Spicetown.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_old_wyk:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] has found [mde_toast_egg.GetName] at Nagga's Hill on Old Wyk.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_hellholt:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] has found [mde_toast_egg.GetName] among the remains of Meraxes at Hellholt.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_volantis:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] has found [mde_toast_egg.GetName] at an abandoned Valyrian camp near Volantis.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_qohor_road:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] has found [mde_toast_egg.GetName] along the old road from Qohor to Valyria.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_red_lake:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] has found [mde_toast_egg.GetName] in Silverwing's lair at the Red Lake.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_winterfell:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] has found [mde_toast_egg.GetName] in the crypts of Winterfell.$mde_egg_msg_found_outro$"
 mde_egg_toast_pickup_summerhall:0 "$mde_egg_msg_found_intro$[mde_egg_owner.GetTitledFirstName] has found [mde_toast_egg.GetName] in the ruins of Summerhall.$mde_egg_msg_found_outro$"
 mde_egg_toast_restoration_t:0 "A Dragon Egg Beneath the Rubble"
 mde_egg_toast_restoration_summerhall:0 "Stonemasons and laborers carry the tale from the ruins of Summerhall to every inn along the Kingsroad:\n\nWhile clearing the rubble, the workers restoring the palace unearthed [mde_toast_egg.GetName], now in the hands of [mde_egg_owner.GetTitledFirstName].\n\nSome call it a blessing. Others say nothing good ever came out of Summerhall."
 mde_egg_toast_restoration_spicetown:0 "Stonemasons and laborers carry the tale from the ruins of Spicetown to every port on Blackwater Bay:\n\nWhile clearing the burned-out halls, the workers restoring the town unearthed [mde_toast_egg.GetName], now in the hands of [mde_egg_owner.GetTitledFirstName].\n\nThe smallfolk whisper that the ghosts of the Gullet have finally given something back."
 mde_egg_toast_expedition_t:0 "[mde_egg_owner.GetFirstNameNoTooltip] Returns with a Dragon Egg"
 mde_egg_toast_expedition_valyria:0 "Sailors who swear they saw the Smoking Sea with their own eyes tell the same astonishing story in every harbor:\n\n[mde_egg_owner.GetTitledFirstName] has returned from the ruins of Valyria bearing [mde_toast_egg.GetName].\n\nFew who sail for the Fourteen Flames ever return, and fewer still return with treasure."
 mde_egg_toast_expedition_adventure:0 "Travelers and sellswords spread the news of a daring adventure come home:\n\nAn expedition funded by [mde_egg_owner.GetTitledFirstName] has returned with [mde_toast_egg.GetName].\n\nWhere it was found, the adventurers are keeping to themselves."
 mde_egg_toast_expedition_trade:0 "Merchants and ship captains speak of little else:\n\nA trade expedition funded by [mde_egg_owner.GetTitledFirstName] has returned from distant lands with [mde_toast_egg.GetName] among its cargo.\n\nNo price, they say, could match what it is worth."
 mde_egg_toast_secret_t:0 "The Hightower's Hidden Egg"
 mde_egg_toast_secret_hightower:0 "Gossip spreads from the halls of Oldtown to every corner of the realm:\n\nHouse Hightower has long hidden a dragon egg, and [mde_egg_owner.GetTitledFirstName] has now brought [mde_toast_egg.GetName] out into the light.\n\nThe maesters of the Citadel are said to be most displeased."
 mde_egg_toast_market_t:0 "A Dragon Egg for Sale"
 mde_egg_toast_market:0 "Merchants in the great markets of the east are abuzz:\n\n[mde_toast_egg.GetName] has appeared among the wares of the artifact market, waiting for a buyer rich enough to claim it."
 mde_egg_toast_other_t:0 "A Dragon Egg Surfaces"
 mde_egg_toast_other:0 "Rumor spreads through the harbors and merchant halls:\n\n[mde_toast_egg.GetName] has come into the hands of [mde_egg_owner.GetTitledFirstName]."
