setting_canon_dragon_egg_hatch_likelihood_never_desc:0 "Les œufs de dragon canoniques n'écloront jamais au berceau, dans une fosse aux dragons ou comme œufs supplémentaires lors d'une cérémonie d'éclosion, sauf si ce paramètre est réglé sur Toujours. S'applique uniquement si les dragons canoniques sont activés."
setting_canon_dragon_egg_hatch_likelihood_less_likely_desc:0 "Les œufs de dragon canoniques écloront moins souvent au berceau, dans une fosse aux dragons ou comme œufs supplémentaires lors d'une cérémonie d'éclosion. Se cumule avec ces paramètres. S'applique uniquement si les dragons canoniques sont activés."
setting_canon_dragon_egg_hatch_likelihood_default_desc:0 "Les œufs de dragon canoniques utiliseront les mêmes probabilités que les autres œufs au berceau, dans une fosse aux dragons ou comme œufs supplémentaires lors d'une cérémonie d'éclosion. S'applique uniquement si les dragons canoniques sont activés."
setting_canon_dragon_egg_hatch_likelihood_more_likely_desc:0 "Les œufs de dragon canoniques auront plus de chances d'éclore au berceau, dans une fosse aux dragons ou comme œufs supplémentaires lors d'une cérémonie d'éclosion. Se cumule avec ces paramètres. S'applique uniquement si les dragons canoniques sont activés."
setting_canon_dragon_egg_hatch_likelihood_common_desc:0 "Les œufs de dragon canoniques auront de fortes chances d'éclore au berceau, dans une fosse aux dragons ou comme œufs supplémentaires lors d'une cérémonie d'éclosion. Se cumule avec ces paramètres. S'applique uniquement si les dragons canoniques sont activés."
setting_canon_dragon_egg_hatch_likelihood_guaranteed_desc:0 "Les œufs de dragon canoniques ne deviendront jamais stériles au berceau ou dans une fosse aux dragons, sauf si ce paramètre est réglé sur Jamais, et écloront toujours comme œufs supplémentaires lors d'une cérémonie d'éclosion. S'applique uniquement si les dragons canoniques sont activés."

