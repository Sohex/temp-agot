setting_spawn_vassarion_egg_disabled_desc:0 "L'événement Dragonlore dans l'est d'Andalos restera présent, mais il ne fera jamais apparaître d'œuf de dragon."

rule_spawn_hightower_egg:0 "@mde_icon!@blue_dragon_egg_icon!Faire apparaître l'œuf des Hightower"
setting_spawn_hightower_egg_secret:0 "Activé - Secret"
setting_spawn_hightower_egg_enabled:0 "Activé"
setting_spawn_hightower_egg_disabled:0 "Désactivé"

setting_spawn_hightower_egg_secret_desc:0 "Les Hightower commenceront la partie avec un artefact secret pouvant être révélé comme étant un œuf de dragon de Tessarion et de Fumée-des-Mers."
setting_spawn_hightower_egg_enabled_desc:0 "Les œufs de Tessarion et de Seasmoke seront détenus par le propriétaire de la Grand-Tour au début de la partie (toujours la branche principale des Hightower)."
setting_spawn_hightower_egg_disabled_desc:0 "Les Hightower ne commenceront pas la partie avec un œuf de dragon."

rule_spawn_dragonstone_eggs:0 "@mde_icon!@rainbow_dragon_egg_icon!Faire apparaître les œufs de Peyredragon"

setting_spawn_dragonstone_eggs_enabled:0 "Activé"
setting_spawn_dragonstone_eggs_disabled:0 "Désactivé"

setting_spawn_dragonstone_eggs_enabled_desc:0 "Des œufs descendants de Nessarion, Meraxes, Vhagar, Vif-Argent, Songefeu, Meleys, Aile-d'Argent, Vermithor, Syrax et Caraxes, de n'importe quelle couleur, pourront être trouvés par les voyageurs se rendant à Peyredragon."
setting_spawn_dragonstone_eggs_disabled_desc:0 "L'événement Dragonlore à Dragonstone restera présent, mais il ne fera jamais apparaître d'œuf de dragon lors d'une visite. L'événement « Une journée à Peyredragon » ainsi que les inspirations d'aventuriers vers Peyredragon resteront inchangés."





