l_french:
 #Major
rule_use_dragon_pit_mover:0 "@mde_icon!@dragon_majestic_icon!Utiliser le gestionnaire de fosses aux dragons de MDE"
setting_use_dragon_pit_mover_no:0 "Paramètre de base d'AGOT"
setting_use_dragon_pit_mover_yes:0 "@mde_icon!More Dragon Eggs"

setting_use_dragon_pit_mover_no_desc:0 "Désactive la fonctionnalité ajoutée par More Dragon Eggs. Il n'existe actuellement aucun équivalent dans la version de base."
setting_use_dragon_pit_mover_yes_desc:0 "Active le menu de gestion des fosses aux dragons ajouté par More Dragon Eggs."

rule_show_dragon_portrait_on_start:0 "@mde_icon!@dragon_majestic_icon!Afficher le portrait du dragon"
setting_show_dragon_portrait_on_start_no:0 "Non"
setting_show_dragon_portrait_on_start_yes:0 "Oui"

setting_show_dragon_portrait_on_start_no_desc:0 "Le portrait de votre dragon sera masqué au démarrage de la partie. Vous pourrez l'activer plus tard."
setting_show_dragon_portrait_on_start_yes_desc:0 "Le portrait de votre dragon sera affiché dans le coin inférieur gauche de l'écran, à côté de celui de votre personnage, dès le début de la partie. Vous pourrez le désactiver plus tard."

rule_mde_buttons:0 "@mde_icon!@dragon_majestic_icon!Interface supplémentaire de More Dragon Eggs"
setting_mde_buttons_off:0 "Désactivés"
setting_mde_buttons_standard:0 "Standard"
setting_mde_buttons_all:0 "Tous"

setting_mde_buttons_off_desc:0 "Tous les boutons MDE sont masqués au départ. Ils peuvent être activés depuis le menu MDE, accessible depuis le menu pause."
setting_mde_buttons_standard_desc:0 "Les boutons des fosses aux dragons, des dragons, des œufs et du menu MDE sont affichés au départ. La Garde Royale et l'acier valyrien peuvent être activés depuis le menu MDE."
setting_mde_buttons_all_desc:0 "Tous les boutons MDE sont affichés au départ : fosses aux dragons, dragons, œufs, Garde Royale, acier valyrien et menu MDE."

# Hatching
rule_can_hatch_multiple_dragons:0 "@mde_icon!@hatching_icon!Faire éclore plusieurs œufs lors d'une même cérémonie"
setting_can_hatch_multiple_dragons_no:0 "Impossible"
setting_can_hatch_multiple_dragons_yes_5_percent:0 "Oui - 5 % de chance par œuf"
setting_can_hatch_multiple_dragons_yes_25_percent:0 "Oui - 25 % de chance par œuf"
setting_can_hatch_multiple_dragons_yes_50_percent:0 "Oui - 50 % de chance par œuf"
setting_can_hatch_multiple_dragons_yes_75_percent:0 "Oui - 75 % de chance par œuf"
setting_can_hatch_multiple_dragons_yes_95_percent:0 "Oui - 95 % de chance par œuf"
setting_can_hatch_multiple_dragons_yes_all:0 "Tous les œufs écloront"

setting_can_hatch_multiple_dragons_no_desc:0 "Seul l'œuf sélectionné pourra éclore lors d'une cérémonie réussie."
setting_can_hatch_multiple_dragons_yes_5_percent_desc:0 "Chaque autre œuf aura 5 % de chances d'éclore lors d'une cérémonie réussie."
setting_can_hatch_multiple_dragons_yes_25_percent_desc:0 "Chaque autre œuf aura 25 % de chances d'éclore lors d'une cérémonie réussie."
setting_can_hatch_multiple_dragons_yes_50_percent_desc:0 "Chaque autre œuf aura 50 % de chances d'éclore lors d'une cérémonie réussie."
setting_can_hatch_multiple_dragons_yes_75_percent_desc:0 "Chaque autre œuf aura 75 % de chances d'éclore lors d'une cérémonie réussie."
setting_can_hatch_multiple_dragons_yes_95_percent_desc:0 "Chaque autre œuf aura 95 % de chances d'éclore lors d'une cérémonie réussie."
setting_can_hatch_multiple_dragons_yes_all_desc:0 "Tous les œufs de dragon présents dans l'inventaire du personnage écloront en cas de cérémonie réussie."

rule_dragon_hatching_success_chance:0 "@mde_icon!@hatching_icon!Probabilité de réussite de l'éclosion"
setting_dragon_hatching_guaranteed:0 "Garantie"
setting_dragon_hatching_normal:0 "Par défaut"
setting_dragon_hatching_not:0 "Échec garanti"

setting_dragon_hatching_guaranteed_desc:0 "La cérémonie d'éclosion fera apparaître un dragon à coup sûr."
setting_dragon_hatching_normal_desc:0 "La cérémonie d'éclosion utilisera les probabilités de réussite et d'échec par défaut."
setting_dragon_hatching_not_desc:0 "La cérémonie d'éclosion échouera systématiquement."

rule_extant_hatching_ceremonies:0 "@mde_icon!@hatching_icon!Les cérémonies d'éclosion sont-elles toujours disponibles ?"
setting_extant_hatching_ceremonies_yes:0 "Oui"
setting_extant_hatching_ceremonies_no:0 "Non"

setting_extant_hatching_ceremonies_yes_desc:0 "Les cérémonies d'éclosion seront possibles tant qu'il existe des dragons."
setting_extant_hatching_ceremonies_no_desc:0 "Les cérémonies d'éclosion ne seront pas possibles tant qu'il existe des dragons."

# Egg + Dragonlore
rule_dragon_egg_spawn_likelihood_player:0 "@mde_icon!@iceFire_dragon_egg_icon!Probabilité d'apparition des œufs de dragon"
setting_no_spawns:0 "Aucune apparition"
setting_1_in_1200:0 "Apparition extrêmement rare"
setting_absolute_spawn:0 "Apparition garantie"

setting_no_spawns_desc:0 "Aucun œuf de dragon ne pourra être trouvé sur la carte, que ce soit dans les lieux liés à la légende des dragons, à Winterfell ou via des décisions telles que « Une journée à Peyredragon » ou « Fuite vers Lestival / Reconstruction de Lestival »."
setting_1_in_1200_desc:0 "Environ 1 chance sur 1 200 pour n'importe quel personnage, y compris l'IA (si elle est autorisée à obtenir des œufs), de trouver un œuf de dragon en visitant un lieu ou en prenant une décision."

setting_absolute_spawn_desc:0 "Le premier personnage à visiter ces lieux ou à prendre la décision concernée obtiendra automatiquement les œufs de dragon. Désactivez les œufs de Peyrdragon, sinon ils seront présents en très grand nombre."
 rule_spawn_cannibal_egg:0 "@mde_icon!@wildfire_dragon_egg_icon!Faire apparaître l'œuf du Cannibale"
setting_spawn_cannibal_egg_enabled:0 "Activé"
setting_spawn_cannibal_egg_disabled:0 "Désactivé"

setting_spawn_cannibal_egg_enabled_desc:0 "Un œuf de dragon descendant du Cannibale pourra être trouvé par les voyageurs se rendant à Skagos."
setting_spawn_cannibal_egg_disabled_desc:0 "L'événement Dragonlore à Skagos restera présent, mais il ne fera jamais apparaître d'œuf de dragon."

 rule_spawn_sheepstealer_egg:0 "@mde_icon!@brown_dragon_egg_icon!Faire apparaître l'œuf de Voleur-de-Moutons"
setting_spawn_sheepstealer_egg_enabled:0 "Activé"
setting_spawn_sheepstealer_egg_disabled:0 "Désactivé"

setting_spawn_sheepstealer_egg_enabled_desc:0 "Un œuf de dragon descendant de Sheepstealer pourra être trouvé par les voyageurs explorant les montagnes du Val."
setting_spawn_sheepstealer_egg_disabled_desc:0 "L'événement Dragonlore dans le Val restera présent, mais il ne fera jamais apparaître d'œuf de dragon."

