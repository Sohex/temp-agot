setting_spawn_vhagar_egg_enabled_desc:0 "Un œuf de dragon descendant de Vhagar pourra être trouvé par les voyageurs se rendant à Harrenhal."
setting_spawn_vhagar_egg_disabled_desc:0 "L'événement Dragonlore à Harrenhal restera présent, mais il ne fera jamais apparaître d'œuf de dragon."

