mde_grant_egg_permission:0 "Autoriser la possession d’œufs de dragon"
mde_grant_egg_permission_desc:0 "Cette personne sera légalement autorisée à posséder des œufs de dragon !"
mde_remove_egg_permission:0 "Interdire la possession d’œufs de dragon"
mde_remove_egg_permission_desc:0 "La possession d’œufs de dragon par cette personne sera considérée comme illégale !"
mde_egg_access_gained_interface_tt:0 "[recipient.GetFullName] sera à l’abri de toute revendication de notre part sur ses œufs de dragon !"
mde_egg_access_removed_interface_tt:0 "Nous pourrons légalement exiger tout œuf de dragon en possession de [recipient.GetFullName] !"

take_prisoner_egg:0 "Prendre l’œuf"
take_prisoner_egg_desc:0 "[recipient.GetFullName] est un prisonnier sous notre garde et détient illégalement un œuf de dragon. Nous pouvons légitimement le saisir."
mde_transfer_prison_egg_tt:0 "[actor.GetFullName] a légalement saisi [target.GetName] !"

