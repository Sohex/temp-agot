mde_decisions_events.1000.t:0 "$dragon_egg_blue$"
mde_decisions_events.1000.desc:0 "Beaucoup ont spéculé sur les diverses curiosités que contiendrait la Grand-Tour, des rumeurs nourries par ses origines antiques et mystérieuses, dressée sur la pierre noire et grasse sur laquelle elle repose. La chute en disgrâce des Hightower après la Danse rendit la maison plus recluse encore, alimentant ces rumeurs, notamment celle selon laquelle ils posséderaient un œuf de dragon.\n\nCette rumeur se révèle vraie, tandis que j’observe l’éclat brillant de l’œuf de dragon bleu cobalt posé devant moi. Je connais depuis longtemps la chambre qui l’abrite, car si les derniers jours de [tessarion.GetFirstName] demeurent en grande partie inconnus de l’histoire, les Hightower savent qu’elle a pondu un œuf, et nous avons gardé ce secret pour nous.\n\nMais le moment est venu de le révéler."
mde_decisions_events.1000.desc_targs:0 "\n\nSi je devais le révéler, les Targaryen seraient presque certainement furieux. Il serait peut-être plus sage de le leur remettre discrètement, en signe de bonne volonté, avant qu’ils ne l’apprennent autrement."
mde_decisions_events.1000.a:0 "Il appartient à la maison [current_hightower.GetHouse.GetName], car nous en sommes les plus dignes gardiens."
mde_decisions_events.1000.b:0 "Il appartient au Sang de l’Ancienne Valyria."

mde_decisions_events.1001.t:0 "$dragon_egg_blue$"
mde_decisions_events.1001.desc:0 "Nous avons été informés d’une affaire des plus graves en provenance de Villevieille. Les Hightower ont caché un œuf de dragon depuis l’époque de la Danse dans leur antique demeure. Il s’agit d’un œuf bleu, engendré par Tessarion, qu’ils ont dissimulé tout ce temps. Les derniers jours de la dragonne nous étaient jusqu’à présent inconnus.\n\nCacher un tel trésor est une trahison de la plus haute gravité. Peut-être que, s’il avait été entre de bonnes mains, il aurait pu éclore et empêcher l’extinction des dragons. Quoi qu’il en soit, il doit être sécurisé."
mde_decisions_events.1001.a:0 "Cet œuf doit être récupéré !"
mde_decisions_events.1001.b:0 "Ce n’est plus qu’une pierre désormais."

mde_decisions_events.1002.t:0 "$dragon_egg_blue$"
mde_decisions_events.1002.desc:0 "Une escorte nombreuse et bien protégée est arrivée de la cité de Villevieille, transportant une cargaison d’une valeur inestimable. Selon une lettre scellée de [current_hightower.GetName], les Hightower possèdent un œuf de dragon depuis la Danse ! Les derniers jours de [tessarion.GetFirstName] ont longtemps été entourés de mystère, mais il apparaît désormais que la dragonne a pondu un œuf. Sa couleur est d’un bleu cobalt éclatant. [current_hightower.GetName] nous l’offre désormais, espérant se faire pardonner de l’avoir dissimulé si longtemps."
mde_decisions_events.1002.a:0 "Enfin, il nous est rendu."

mde_decisions_events.3000.t:0 "Mon secret révélé !"
mde_decisions_events.3000.desc.intro:0 "La Danse des Dragons fut un événement chaotique, laissant de nombreux détails du conflit dans l’ombre, notamment les derniers jours de la dragonne Tessarion. Cependant, cela n’a jamais été un secret pour notre maison, car nous savons que l’un des derniers actes de la dragonne fut de pondre un œuf de dragon bleu cobalt éclatant.\n\n"
mde_decisions_events.3000.desc.self:0 "J’ai révélé au monde ma possession de [ROOT.Char.Custom('HiddenArtifact')]."
mde_decisions_events.3000.desc.other:0 "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] a révélé au monde que je suis en possession de [ROOT.Char.Custom('HiddenArtifact')]."
mde_decisions_events.3000.desc.shared:0 "\n\nLa maison Hightower possède cet œuf depuis la fin de la Danse des Dragons..."
mde_decisions_events.3000.desc.targs:0 "\n\nLes Targaryen risquent fort de mal réagir à cette révélation. Il serait peut-être plus sage de le leur rendre discrètement, en signe de bonne volonté, avant qu’ils ne l’apprennent autrement."
mde_decisions_events.3000.a:0 "Il appartient à la maison Hightower."
mde_decisions_events.3000.b:0 "Je vais le rendre."
