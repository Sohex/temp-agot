demand_egg_desc:0 "[recipient.GetName] est injustement en possession d’un œuf de dragon !"
demanded_egg_interaction.desc:0 "[actor.GetName] a exigé un œuf de dragon !"
mde_start_demand_egg_event_chain:0 "@warning_icon!#X Cela adressera une demande à [recipient.GetFullName] afin qu’il renonce à l’œuf !#"
