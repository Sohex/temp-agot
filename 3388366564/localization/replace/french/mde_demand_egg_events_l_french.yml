l_french:
 
 demand_braavosi_eggs_decision:0 "Exigez les œufs de dragon volés"
 demand_braavosi_eggs_decision_desc:0 "L'existence d'œufs de dragons dans les Cités Libres est connue depuis longtemps. Les dettes réglées par le passé et le soupçon de l'impossibilité de faire éclore ces œufs ont maintenu un statut d'inaction en la matière.\n\nMais la menace, aussi improbable soit-elle, qu'une autre maison de dragons puisse voir le jour est bien trop grande pour que l'on puisse fermer les yeux.\n\nNous ne maintiendrons plus l'illusion de l'ignorance ! Nous exigerons officiellement la restitution de ces œufs, sous peine de guerre !\n\n@warning_icon!#X Nous ne pourrons prendre cette décision qu'une seule fois dans notre vie, même si elle est annulée!#!"
 demand_braavosi_eggs_decision_confirm:0 "Émettre la demande!"
 demand_braavosi_eggs_decision_tooltip:0 "Demander la restitution des œufs des Cités Libres"

 mde_demand_egg_events.0001.t:0 "[egg_taker.GetPrimaryTitle.GetNameNoTier] Poser un ultimatum!"
 mde_demand_egg_events.0001.desc:0 "Le grand cambriolage de  [thief.GetFullName] a été un événement particulièrement infâme. Son désir de construire un navire pour naviguer sur la mer du Couchant et son incapacité à l'acquérir auprès de son ami ont été à l'origine de cet événement, [rhaena.GetFullName], [thief.GetFullName] a volé trois œufs pondus par [dreamfyre.GetName], et les a vendus aux Seigneurs de Braavos! \n\nLe règlement par le Seigneur de la dette contractée par les Targaryens a tempéré la question dans le passé, [egg_taker.GetFullName] a émis une nouvelle et terrible demande. Ils nous ont informés qu'ils savaient que les œufs de dragon se trouvaient dans notre royaume et qu'ils allaient faire la guerre pour les récupérer !"
 mde_demand_egg_events.0001.a:0 "Nous ne pouvons pas risquer la guerre en cédant à leurs exigences."
 mde_demand_egg_events.0001.a.tt:0 "Nous remettrons les œufs de dragon à [egg_taker.GetFullName]:\n• [egg_drogon.GetName]\n• [egg_viserion.GetName]\n• [egg_rhaegal.GetName]"
 mde_demand_egg_events.0001.b:0 "Peut-être que l'or les dissuadera."
 mde_demand_egg_events.0001.b.tt:0 "Nous proposons [egg_taker.GetFullName] [gold_i]#emphasis $5000|V0$#! à la place des œufs"
 mde_demand_egg_events.0001.c:0 "Peu importe les menaces, nous resterons inébranlables dans notre détermination."
 mde_demand_egg_events.0001.c.tt:0 "@warning_icon!#X [egg_taker.GetFullName] est susceptible de nous déclarer la guerre!#!"

 mde_demand_egg_events.0002.t:0 "La guerre pour des œufs de dragons !"
 mde_demand_egg_events.0002.desc:0 "[egg_target.GetFullName] a refusé de nous donner les œufs de dragon qui nous appartiennent ! Et ils n'ont rien donné de suffisant pour les remplacer. Il ne nous reste plus qu'à rallier nos soldats et à partir en guerre.\n\nNous devons être attentifs à cette question. Avons-nous la force nécessaire pour les conquérir, et cela en vaut-il la peine ?"
 mde_demand_egg_events.0002.a:0 "Les œufs nous reviennent de droit ! A la guerre !"
 mde_demand_egg_events.0002.b:0 "Les œufs peuvent rester sous leur garde..."
 mde_demand_egg_events.0002.b.tt:0 "@warning_icon!#X Nous perdrons nos droits sur les œufs et n'aurons plus l'occasion de les revendiquer.!#!"
 
 mde_demand_egg_events.0003.t:0 "Une offre d'or"
 mde_demand_egg_events.0003.desc:0 "[egg_target.GetFullName] a entendu nos demandes et a proposé une contre-offre, sous la forme d'une énorme quantité d'or, pour un montant de [gold_i]#emphasis $5000|V0$#!. Nous devons maintenant évaluer si le bien que nous pouvons faire avec cet or vaut plus que la peine d'envenimer les choses pour obtenir les œufs de dragon."
 mde_demand_egg_events.0003.a:0 "Entre leurs mains, ils ne sont rien de plus que de la pierre, et l'or est de toute façon une meilleure pierre..."
 mde_demand_egg_events.0003.a.tt:0 "Nous gagnerons [gold_i]#emphasis $5000|V0$#! et [egg_target.GetFullName] perdra [gold_i]#emphasis $5000|V0$#!\n\n@warning_icon!#X Nous perdrons nos droits sur les œufs et n'aurons plus l'occasion de les revendiquer!#!"
 mde_demand_egg_events.0003.b:0 "Qu'est-ce que l'or comparé au feu fait chair !"
 mde_demand_egg_events.0003.b.tt:0 "Nous allons réfléchir à une escalade vers la guerre !"

 mde_demand_egg_events.0004.t:0 "[egg_taker.GetNameNoTooltip] exige notre [egg_target.GetNameNoTooltip]!"
 mde_demand_egg_events.0004.desc:0 "[egg_taker.GetFullName] a décrété que notre [egg_target.GetName] leur revient de droit selon les lois des dieux et des hommes !\n\nUne telle demande présente un grave danger et doit être considérée avec la plus grande importance. Nous pouvons soit céder à leurs exigences, soit leur offrir une somme d'or convenablement rassasiée, à hauteur de [gold_i]#emphasis $1500|V0$#!, ou risquer leur colère, qu'il s'agisse de notre arrestation ou d'une déclaration de guerre !"
 mde_demand_egg_events.0004.a:0 "[egg_taker.GetNameNoTooltip] représente une menace trop importante, nous devons le reconnaître."
 mde_demand_egg_events.0004.a.tt:0 "@warning_icon!#X Nous renonçons à notre [egg_target.GetName]!#!"
 mde_demand_egg_events.0004.b:0 "Peut-être que l'or les dissuadera..."
 mde_demand_egg_events.0004.c:0 "Peu importe les menaces, nous resterons inébranlables dans notre détermination."
 mde_demand_egg_events.0004.c.tt:0 "@warning_icon!#X [egg_taker.GetFullName] est susceptible de nous déclarer la guerre ou de nous emprisonner!#!"

 mde_demand_egg_events.0005.t:0 "Une offre d’or"
 mde_demand_egg_events.0005.desc:0 "[egg_victim.GetFullName] a entendu nos demandes et a proposé une contre-offre, sous la forme d'une très grande quantité d'or, pour un montant de [gold_i]#emphasis $1500|V0$#!. Nous devons maintenant évaluer si le bien que nous pouvons faire avec cet or vaut plus que la peine d'envenimer les choses pour obtenir cette [egg_target.GetName]."
 mde_demand_egg_events.0005.a:0 "C'est une belle somme d'or..."
 mde_demand_egg_events.0005.a.tt:0 "@warning_icon!#X Nous perdrons nos droits sur les œufs et n'aurons plus l'occasion de les revendiquer.!#!"
 mde_demand_egg_events.0005.b:0 "Qu'est-ce que l'or comparé au feu fait chair !"
 mde_demand_egg_events.0005.b.tt:0 "Nous allons réfléchir à une escalade vers la guerre !"
 
 mde_demand_egg_events.0006.t:0 "Demandes rejetées !"
 mde_demand_egg_events.0006.desc:0 "[egg_target.GetName] a refusé de nous donner l'œuf de dragon qui nous appartient ! Ils n'ont pas non plus donné quelque chose de suffisant à la place. Nous devons maintenant réfléchir à nos options.\n\nNous pouvons soit rallier nos soldats et partir en guerre si la loi nous y autorise, soit les arrêter si la loi nous y autorise, soit revendiquer l'œuf et poursuivre d'autres méthodes pour le réclamer, soit abandonner complètement et définitivement l'affaire."
 mde_demand_egg_events.0006.a:0 "Cette [egg_target.GetNameNoTooltip] nous revient de droit ! A la guerre !"
 mde_demand_egg_events.0006.a.tt:0 "@warning_icon!#X Nous ne sommes pas en mesure d'entrer en guerre avec [egg_victim.GetFullName]!#!"
 mde_demand_egg_events.0006.b:0 "Leur possession de cette [egg_target.GetNameNoTooltip] est illégal!"
 mde_demand_egg_events.0006.b.tt:0 "Nous allons revendiquer cette [egg_target.GetName] et toutes les options qui l'accompagnent !"
 mde_demand_egg_events.0006.c:0 "Les œufs peuvent rester sous leur garde..."
 mde_demand_egg_events.0006.c.tt:0 "@warning_icon!#X Nous perdrons nos droits sur les œufs et n'aurons plus l'occasion de les revendiquer.!#!"

 mde_demand_egg_events.0007.t:0 "Demandes acceptées !"
 mde_demand_egg_events.0007.desc:0 "[egg_victim.GetFullName] a tremblé devant notre puissance ! Ils ont choisi la voie de la sagesse en se pliant à nos exigences et nous ont livré cette [egg_target.GetName]!"
 mde_demand_egg_events.0007.a:0 "La victoire est à nous !"


