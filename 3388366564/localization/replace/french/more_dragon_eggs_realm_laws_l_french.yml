l_french:

 dragonpit_ruler_law:0 "Autorisation uniquement"
 dragonpit_ruler_law_effects:0 "[dragons_plural|E] dans votre [dragonpit|e] ne peut être consulté que par ceux à qui vous avez donné votre autorisation expresse."
 DRAGONPIT_RULER:0 "Ce dragon est dans un [dragonpit|E] limité à ceux qui ont reçu l'autorisation explicite du propriétaire."

 egg_ruler_law:0 "Autorisation uniquement"
 egg_ruler_law_effects:0 "Les œufs de dragon peuvent être légalement détenus par les personnes à qui vous avez donné une autorisation expresse."
 egg_close_family_law:0 "Famille proche uniquement"
 egg_close_family_law_effects:0 "Les œufs de dragon peuvent être légalement détenus par des membres de votre famille proche."
 egg_house_law:0 "Maison seulement"
 egg_house_law_effects:0 "Les œufs de dragon peuvent être légalement détenus par les membres de votre maison."
 egg_dynasty_law:0 "Dynastie seulement"
 egg_dynasty_law_effects:0 "Les œufs de dragon peuvent être légalement détenus par les membres de votre dynastie."
 egg_dragonrider_house_law:0 "Maisons des Dragonniers uniquement"
 egg_dragonrider_house_law_effects:0 "Les œufs de dragon peuvent être légalement détenus par les membres des maisons de dragonniers."
 egg_everyone_law:0 "Tout le monde"
 egg_everyone_law_effects:0 "Les œufs de dragon peuvent être légalement détenus par n’importe qui."

 EGG_LAW_IS_ON_COOLDOWN:0 "Vous avez récemment modifié les lois sur les œufs. Peut être modifié à nouveau après [GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'egg_law_cooldown') )]"