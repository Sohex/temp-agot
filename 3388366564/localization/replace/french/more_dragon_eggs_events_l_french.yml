 agot_filler_crownlands.0004.t:0 "Une journée à Peyredragon : Cadeaux du passé"
 agot_filler_crownlands.0004.desc:0 "Je marche en hauteur sur les falaises de Dragonstone, le bruit des vagues s'écrasant contre les rochers en contrebas se mêlant au lent grondement du volcan dans mes oreilles. En marchant, je trouve une petite ouverture — l'endroit parfait pour commencer mon exploration de la grotte.\n\nJe grimpe sur une crête rocheuse, guidé par la lumière qui cascade sur les rochers. Plusieurs passages partent de la chambre principale, mais la lumière traverse une seule veine d'obsidienne, comme si elle me guidait. Je le suis, et là où il me mène, je n'en crois pas mes yeux.\n\nUn œuf repose au centre de la pièce, la lumière s'arrêtant juste au-dessus de lui ! Dès que je le touche cependant, le passage du temps se fait sentir, et la lumière commence à s'estomper. J'ai à peine le temps de saisir l'œuf et de me précipiter hors de la grotte avant que la lumière ne s'éteigne complètement, me laissant enfermé dans l'obscurité.\n\nAvec des respirations lourdes d'effort, je sors de la grotte, l'œuf dans mes mains !"
 agot_filler_crownlands.0004.a:0 "C'était chaud, mais ça valait le coup !"
 agot_filler_crownlands.0004.tt:0 "Vous avez obtenu un œuf de dragon. [artifact|E]"


 agot_ninepenny.0034.c:0 "Un nouveau royaume lui sera taillé."
 agot_ninepenny.0035.b:0 "$agot_ninepenny.0031.a$ Il recevra un nom plus approprié."
 agot_ninepenny.0035.b.tt:0 "#italic Le Royaume de Tarth sera rebaptisé Les Îles de Saphir !"

 a_crown_for_a_king_decision:0 "Une couronne pour un roi"
 a_crown_for_a_king_decision_desc:0 "Viserys est indigne d'être le Roi des Sept Royaumes, mais il y en a un qui est digne..."
 a_crown_for_a_king_decision_confirm:0 "Couronnez-le!"
 a_crown_for_a_king_decision_tooltip:0 "@warning_icon!#X Cela destituera Viserys de son rôle de chef des exilés Targaryen !#"

 agot_targaryen_exile_invasion.9999.t:0 "Une couronne pour un roi"
 agot_targaryen_exile_invasion.9999.desc:0 "Maintenant que je dirige les Exilés et que je porte toute la dynastie Targaryen sur mes épaules, je dois décider quoi faire de mon frère arrogant et insensible."
 agot_targaryen_exile_invasion.9999.b:0 "Montre-lui de la miséricorde !"
 agot_targaryen_exile_invasion.9999.a:0 "Donnez-lui la couronne qu'il a méritée !"

 agot_ruins.2001.t:0 "Trésors de la Tragédie"
 agot_ruins.2001.d:0 "Les ruines de Spicetown sont depuis longtemps enveloppées d'une atmosphère lugubre et étrange. Les petites gens racontent souvent que cet endroit a été si longtemps abandonné qu'il est considéré comme le foyer d'esprits maudits. Face à une telle superstition, l'accélération de sa restauration a nécessité un effort considérable. Cependant, l'idée de restaurer la ville à sa splendeur passée, en tant que centre commercial et doré, a démontré être une source de motivation.\n\nAujourd'hui, l'effort a porté ses fruits ! Les derniers vestiges des ruines ont été mis à jour, dans une zone censément hantée qui n'a pas connu d'activité humaine depuis la bataille du Goulet. On a découvert un œuf de dragon dans un vaste édifice ravagé par les flammes !"
 agot_ruins.2001.a:0 "Un présage fortuit !"
 agot_ruins.2001.b:0 "Il vaut mieux qu'il soit remis à notre seigneur suzerain."

 agot_ruins.2002.t:0 "Un œuf de dragon est proposé."
 agot_ruins.2002.d:0 "Mon vassal [egg_giver.GetName] a découvert un œuf lors de la restauration des ruines de Spicetown ! Encore meilleure nouvelle, ils nous l'ont proposé en tant que ses gardiens légitimes !"
 agot_ruins.2002.a:0 "Nous acceptons !"
 agot_ruins.2002.b:0 "Il vaut mieux qu'ils le gardent."

mde_canon_dragon_clutch_events.0001.t:0 "[dragon_parent.GetNameNoTooltip] Apporte une poignée.!@historical_character_icon_small!"

agot_ninepenny.1014.c:0 "La nuit s’anime au chant des dragons ! Cet enfant est le « Né-du-Dragon » !"
agot_ninepenny.1014.d:0 "Malgré la tragédie, il reste un espoir avec cet enfant, le « Né-du-Dragon »."


 
