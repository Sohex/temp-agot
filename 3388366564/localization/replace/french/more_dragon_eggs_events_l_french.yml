 mde_dragon_eggs_events.0001.t:0 "Savoir des dragons : Cannibale de Skagos"
 mde_dragon_eggs_events.0001.desc:0 "Le dragon redoutable et violent, [cannibal.GetName], était notoire pour les actes abominables qui lui ont valu son nom. Ni les Targaryen ni l'Ordre des Gardiens de Dragons n'ont pu contenir la bête monstrueuse, encore moins l'empêcher de se repaître de ses semblables.\n\nDans l'histoire enregistrée, [cannibal.GetNamePossessive] Son apparition est aussi énigmatique que sa disparition, car on sait très peu de choses sur l'un ou l'autre. On dit souvent que sa naissance a eu lieu avant celle des dragons des Conquérants.\n\nIl est toutefois bien connu que [cannibal.GetName] a disparu quelque temps après La Danse des Dragons. Bien que certains aient émis l'hypothèse qu'il aurait pu s'envoler au cœur de Skagos, attiré par ceux de nature semblable. Vous pensez que cela pourrait être plus qu'une simple spéculation, comme le prouve la présence de verre dragon sur le sol forestier qui vous entoure."
 mde_dragon_eggs_events.0001.a:0 "Dérangeant."

 mde_dragon_eggs_events.0002.t:0 "Savoir des dragons: La sorcière rouge du Val"
 mde_dragon_eggs_events.0002.desc:0 "À l'époque de la Danse des Dragons, il y avait plusieurs dragons sauvages. L'un d'eux errait dans le Val, un dragon craintif particulièrement friand d'agneau, ce qui lui valut son surnom ; [sheepstealer.GetName].\n\nCela a été exploité uniquement par l'hypothétique chevaucheur de dragons non descendant des Targaryen à Westeros. [nettles.GetName]. Elle apprivoiserait ce dragon en l'attirant avec des moutons chaque jour jusqu'à ce qu'il lui fasse confiance. Elle a également gagné la confiance de [daemon.GetName], des rumeurs prétende qu'elle est soit sa fille, soit son amante.\n\nDurant la danse, [nettles.GetName] et [sheepstealer.GetName] ont disparue, pour ne plus jamais être revu.\n\nCela dit, il existe dans les Montagnes du Val un clan nommé les Hommes Brûlés qui ont un rituel d'initiation impliquant leurs garçons offrant des présents à la Sorcière Rouge, évitant ainsi l'ire de ses flammes pour démontrer leur virilité. Beaucoup supposent que la Sorcière de Feu est [nettles.GetName]"
 mde_dragon_eggs_events.0002.a:0 "Si les rumeurs sont vraies..."


 mde_dragon_eggs_events.0004.t:0 "Savoir des dragons: Le Monticule Cannibale"
 mde_dragon_eggs_events.0004.desc:0 "Vous examinez les traces de verre de dragon dans la forêt, et au fil du temps, vous commencez à percevoir une tendance vers laquelle le volume de verre de dragon s'accroît. Vous parcourez ce sentier, avec nervosité, jusqu'à ce qu'il débouche à l'entrée d'une énorme caverne.\n\nAprès une attente apparemment infinie, à l'écoute de tout bruit provenant de la grotte, vous avancez. La grotte est parsemée sur toutes ses parois, soit d'une peinture rouge profonde, soit de verre dragon , et des os jonchent le sol.\n\nAu bout du compte, vous parvenez au cœur de la grotte, où une fosse cérémonielle semble être présente. Un monticule colossal de crânes variés, comprenant des lapins, des ours, des cerfs, des géants, des licornes et des humains, se situe au centre de la fosse cérémonielle. Toutefois, au sommet, un crâne plus grand que les autres se dresse, brillant d'un vert maléfique à travers son orbite.\n\nVous grimpez sournoisement la colline et découvrez un trésor unique en son genre ! Un œuf de dragon !"
 mde_dragon_eggs_events.0004.a:0 "Craignez ma puissance !"

 mde_dragon_eggs_events.0005.t:0 "Savoir des dragons: La Grotte de la Sorcière Rouge"
 mde_dragon_eggs_events.0005.desc:0 "Après avoir discuté avec les habitants pendant une bonne partie de plusieurs jours, vous les convainquez finalement de vous mettre sur le chemin des Hommes Brûlés.\n\nVous avez raison de les fuir en vous aventurant dans les montagnes, et il n'est pas complexe de découvrir le parcours de leur rituel sans leur assistance, car il est souvent indiqué par des squelettes plus jeunes et mâles.  Quelques-uns d'entre eux montrent des brûlures de divers niveaux, jusqu'à atteindre les os..\n\nQue ce soit par chance, compétence ou les deux, vous parvenez à la caverne de la Sorcière du Feu sans croiser un seul Homme Brûlé. À l'intérieur, les murs sont tapissés de milliers de marques, presque comme si un maester rat gris avait perdu la raison faute de papier. Un œuf de dragon poussiéreux et marron se cache dans le coin !"
 mde_dragon_eggs_events.0005.a:0 "Chanceux, en effet."

 mde_dragon_eggs_events.0006.t:0 "Savoir des dragons: L'Île des Visages"
 mde_dragon_eggs_events.0006.desc:0 "Un horrible murmure émanant de l'intérieur de ma propre tête m'arrête net et me laisse ne ressentir qu'un froid profond et de la peur.\n\nContre ma propre volonté, je me dirige rapidement vers l'Île des Visages, et je commence à marcher vers elle, puis à nager.\n\nAlors que je marche sur les rives de l'Île, épuisé, je remarque que les arbres saignent, laissant tomber des gouttes de sang bruyamment. Une silhouette enveloppée aux yeux verts brillants sort sa tête de derrière l'épaisse crique d'arbres Barral, me remplissant de terreur jusqu'à ce que je m'évanouisse.\n\nJe me suis réveillé sur la rive de l'Œil des Dieux, désorienté, alarmé par la découverte d'un œuf de dragon dans mes mains !"
 mde_dragon_eggs_events.0006.a:0 "Le destin attend."

 mde_dragon_eggs_events.0007.t:0 "Savoir des dragons: Cadeaux du Passé"
 mde_dragon_eggs_events.0007.desc:0 "Je me promène haut sur les falaises de Dragonstone, le bruit des vagues qui s'écrasent contre les rochers en contrebas se mêlant au grondement lent du volcan que j'entends. En marchant, je découvre une petite ouverture — l'endroit idéal pour débuter mon exploration de caverne.\n\nJe grimpe sur un sommet de roche, guidé par la lumière qui cascade sur les pierres. De nombreux passages débouchent sur la salle principale, cependant une unique veine d'obsidienne laisse passer la lumière, comme si elle me montrait le chemin. Je le suis, et là où il me mène, je n'arrive pas à le croire.\n\nUn œuf repose au centre de la pièce, la lumière se terminant juste au-dessus ! Toutefois, dès que je le touche, l'écoulement du temps se fait sentir et la lumière commence à s'éteindre. J'ai à peine le temps de saisir l'œuf et de quitter la grotte avant que la lumière ne s'éteigne complètement, me plongeant dans l'obscurité.\n\nAprès avoir fourni un grand effort, je parviens à sortir de la grotte, l'œuf fermement tenu dans mes mains !"
 mde_dragon_eggs_events.0007.desc_missing:0 "Je me promène en hauteur sur les falaises de Dragonstone, le bruit des vagues qui s'écrasent contre les rochers en bas se mêlant au grondement lent du volcan que j'entends. En marchant, je découvre une petite ouverture — l'endroit idéal pour débuter mon exploration de caverne.\n\nJe grimpe sur un sommet de roche, guidé par la lumière qui cascade sur les pierres. De nombreux passages débouchent sur la salle principale, cependant une unique veine d'obsidienne laisse passer la lumière, comme si elle me montrait le chemin. Je le suis, et là où il me mène, je n'arrive pas à le croire.\n\nUn groupe d'œufs repose au centre de la pièce, la lumière s'arrêtant juste au-dessus ! Toutefois, dès que je le touche, l'écoulement du temps se fait sentir et la lumière commence à s'éteindre. J'ai à peine assez de temps pour prendre les œufs et sortir de la grotte avant que la lumière ne s'éteigne complètement, me laissant enfermé dans l'obscurité.\n\nEn haletant d'effort, j'arrive à sortir de la grotte, les œufs dans mes bras ! J'ai trouvé des œufs de dragon manquants de [aegon_ii.GetNamePossessive],  les derniers signalés étaient avec [valarr.GetName]!"
 mde_dragon_eggs_events.0007.a:0 "C'était serré, mais ça valait vraiment le coup !"
 mde_dragon_eggs_events.0007.tt:0 "Vous avez obtenu un œuf de dragon !"

 mde_dragon_eggs_events.0008.t:0 "Savoir des dragons: Les ruines de Spicetown"
 mde_dragon_eggs_events.0008.desc:0 "La Bataille de la Gullet figure parmi les affrontements notoires qui se sont déroulés durant la Danse des Dragons, le conflit civil ayant considérablement affaibli le pouvoir Targaryen. Une alliance a été négociée entre les Verts et la Triarchie, menant à une immense flotte qui s'est abattue sur le blocus Velaryon du Gullet, un point stratégique bloquant l'accès aux approvisionnements vers Port-Réal.\n\nLa bataille s'est soldée par une victoire à la Pyrrhus pour les Noirs, qui ont réussi à maintenir leur blocus et à vaincre l'armada de la Triarchie, mais à un coût élevé. Le prince héritier [jaecaerys.GetName] et son dragon [vermax.GetName], Les deux ont été tués, et Spicetown a été réduite en cendres. Selon la légende, [jaecaerys.GetNamePossessive] a promis à [baela.GetName] et à son dragon, [moondancer.GetName], de se retrouver parmi les décombres."
 mde_dragon_eggs_events.0008.a:0 "Une tragédie obsédante."

 mde_dragon_eggs_events.0009.t:0 "Savoir des dragons: Au plus profond des ruines de Spicetown"
 mde_dragon_eggs_events.0009.desc:0 "La nature sombre des ruines de Spicetown a pesé lourdement sur mon esprit, et en conséquence, j'ai choisi de faire une pause parmi les ruines et de les explorer.\n\nEn explorant les diverses structures délabrées, vous découvrez une vaste zone calcinée d'un grand édifice qui n'a pas été touchée depuis sa destruction initiale. En me déplaçant parmi les pierres éparpillées au sol, un éclat de couleur attire mon regard, choquant par son contraste avec les nuances sombres de la destruction qui m'entoure.\n\nJe détache les pierres colorées du sol et je reste stupéfait par ce que j'ai entre les mains. Un œuf de dragon ! Les bruits de couloir concernant un deuil [moondancer.GetName] Si c'était le cas, j'aurais découvert son œuf !"
 mde_dragon_eggs_events.0009.a:0 "Une lueur d'espoir dans la tragédie !"

 mde_dragon_eggs_events.0010.t:0 "Savoir des dragons: Les Os de Nagga"
 mde_dragon_eggs_events.0010.desc:0 "Il y a des milliers d'années, durant l'Ère des Héros, de nombreuses légendes ont vu le jour à partir des événements merveilleux qui se sont déroulés en cette époque antique. La légende la plus historiquement résonnante de ces contes est celle de [nagga.GetName], dont les grands os ont une importance culturelle considérable pour les Ironborn. C'était le siège de [grey_king.GetName] et a servi de lieu pour le Kingsmoot pendant de nombreux siècles.\n\nLes récits des Ironborn affirment que [nagga.GetName] C'était la première dragonne marine, qui se nourrissait de léviathans et de krakens, et dont la férocité était telle qu'elle pouvait faire sombrer des îles entières. De tels récits de ces exploits ne font que mythifier l'habileté de [grey_king.GetName], Qui a terrassé la bête redoutable, construit son palais avec ses ossements, l'a réchauffé avec le feu qu'elle portait en vie, a forgé son trône à partir de sa mâchoire et sa couronne à partir de ses dents.\n\nMaintenant, l'endroit est étrangement silencieux, mais les énormes os m'assaillent d'une terreur méga-phobique."
 mde_dragon_eggs_events.0010.a:0 "Une bête d'une envergure sans précédent..."

 mde_dragon_eggs_events.0011.t:0 "Savoir des dragons: Le Kingsmoot Ancien"
 mde_dragon_eggs_events.0011.desc:0 "Il semble presque que le destin ait voulu que je visite les restes effroyables de la grande bête [nagga.GetName] un jour où les niveaux de la mer étaient extrêmement rares en raison d'une marée basse unique dans une vie.\n\nBien que les Ironborn prédisent que de tels marées basses sont un signe de danger, une force profonde et obscure en moi ressent quelque chose d'irrésistible. Si le destin me le commande, j'obéirai. C'est presque de manière instinctive que je me dirige vers la côte découverte, suivant les traces des anciens rois du consensus. Alors que je m'approche de l'eau, plusieurs armes anciennes se dévoilent, rouillées et recouvertes de coraux et de balanes. Je m'immerge dans les profondeurs, me baignant dans le sel, laissant la mer envahir mes poumons.\n\nJe perds connaissance, ma dernière mémoire étant celle d'une entité puissante, peut-être un être de quelque sorte, et quelque chose entre mes mains. À mon réveil, je découvre que je suis sur les plages de sable, avec un œuf de dragon d'un bleu cobalt brillant à mes côtés !"
 mde_dragon_eggs_events.0011.a:0 "Un don faustien de la part d'un serviteur du Grand Autre..."
 mde_dragon_eggs_events.0011.b:0 "Le Dieu Noyé pourvoit !  @drownedgod_icon!"

 mde_dragon_eggs_events.0012.t:0 "Savoir des dragons: Le Bolt au Hellholt"
 mde_dragon_eggs_events.0012.desc:0 "J'ai longtemps parcouru les douloureux déserts de Dorne, et m'être aventuré si loin des Routes des Dunes a rendu ce voyage pénible et épuisant. Le château le plus proche, le Hellholt, n'offre qu'une répit pour les fous, et pourtant, il n'y a pas d'autre choix. À mesure que le château s'approche, des bouffées de smog sulfuré émanent du Brimstone voisin et des geysers, voilant le soleil. Mais cela n'apporte aucun soulagement, rendant simplement l'air plus chaud. En m'approchant du château, je remarque que la tour principale n'a pas été restaurée depuis la Conquête.\n\nLa destruction a été causée par la célèbre mort du dragonier . [rhaenys.GetName], et sa dragonne, [meraxes.GetName]. Au moment de son décès., [rhaenys.GetName] avait mené une campagne visant à écraser les Dorniens résistants en réduisant leurs châteaux en cendres avec du feu de dragon. Les Ullers de Hellholt ont accompli ce que personne d'autre n'avait réussi, tirant un carreau de scorpion directement dans l'œil de [meraxes.GetName], Envoie à la fois le dragonier et le dragon dans une chute mortelle. [meraxes.GetNamePossessive] Des os sont visibles, saillant de la verre de sable environnant."
 mde_dragon_eggs_events.0012.a:0 "Quelle puissance !"

 mde_dragon_eggs_events.0013.t:0 "Savoir des dragons: À travers le verre de dragon"
 mde_dragon_eggs_events.0013.desc:0 "En examinant de plus près le squelette de [meraxes.GetNamePossessive], je suis consterné par la puissance du feu d'un dragon. Le sol environnant est entièrement vitrifié, fondu à partir du sable qui se trouvait autrefois ici, la plupart étant épais, sombre et opaque.\n\nMais je trouve que plus je découvre les couches de terre les plus récentes, plus le verre devient clair. Vexé, je travaille comme un fou pour trouver le morceau de verre le plus clair possible.\n\nAprès des heures d'inspection, je trouve du verre qui révèle un éclat doré et argenté. Je le recouvre et reviens à la faveur de l'obscurité, frappant avec une pioche jusqu'à ce que je découvre mon trésor : un œuf de dragon !"
 mde_dragon_eggs_events.0013.a:0 "Mon précieux!"

 mde_dragon_eggs_events.0014.t:0 "Savoir des dragons: Le Jardinier de l'Orbe de Verre"
 mde_dragon_eggs_events.0014.desc:0 "Peu nombreux étaient les seigneurs dragons après le Fléau. Ce n'est qu'avec la prévoyance magique de Daenys la Rêveuse que les Targaryen ont pu conserver leur chair de feu. Bien que, dans la période qui a suivi immédiatement le Fléau, il y en ait eu d'autres.\n\n[jaehaelor.GetName] était un propriétaire terrien et un chevaucheur de dragons dans la Seigneurie Valyrienne qui montait le dragon [pythax.GetName] qui semblait être un érudit avec une aptitude particulière pour la botanique, car il écrivait souvent sur la serre à orbe de verre à Valyria même.\n\n Quand le Destin a ébranlé les cieux et la terre, [jaehaelor.GetName] Faisait un tour dans les forêts de Qohor pour collecter des échantillons.  Il a traversé ce même lieu en revenant de Qohor à anciennes Volantis, là où il passerait le restant de son existence à se souvenir du plus grand nombre possible de ses jardins.  Son dragon. [pythax.GetName] est mort peu après le désastre, ayant refusé de manger. [jaehaelor.GetName] est mort peu après, alors qu'il tentait d'intervenir lors du fouet d'un esclave sur le Long Bridge."
 mde_dragon_eggs_events.0014.a:0 "Une fin ironique."

 mde_dragon_eggs_events.0015.t:0 "Savoir des dragons: Parti à la hâte"
 mde_dragon_eggs_events.0015.desc:0 "Il est certain qu'il a monté son camp à cet emplacement exact, mais il ne reste aucune preuve tangible de cela. En quête de mon propre emplacement pour monter ma tente, je me débrouille à travers des buissons denses et tombe sur plusieurs objets qui étaient manifestement la propriété d'une personne issue de la classe supérieure du Freehold.\n\nJe suis une piste chaotique d'artéfacts valyriens éparpillés, assurément tous d'une valeur inestimable. Néanmoins, presque entièrement enseveli sous la boue et dissimulé par la terre, je découvre un tronc jusqu'alors intact qui a dû être abandonné à la va-vite.\n\nAvec beaucoup de peine, je déterre le coffre et l'ouvre en force à partir de ses charnières pétrifiées, dévoilant un trésor bien plus précieux que les butins environnants. Un œuf de dragon !"
 mde_dragon_eggs_events.0015.a:0 "[jaehaelor.GetNamePossessiveNoTooltip] dernier cadeau !"

 mde_dragon_eggs_events.0016.t:0 "Savoir des dragons: L'Empereur Qui N'a Jamais Été"
 mde_dragon_eggs_events.0016.desc:0 "Peu étaient les seigneurs dragons suite à la Doom. C'est uniquement grâce à la vision prophétique de Daenys la Rêveuse que les Targaryens ont réussi à maintenir leur lien avec le feu incarné. Bien que dans la période immédiatement post-Doom, d'autres étaient présents.\n\n[oreo.GetName] était peut-être le plus connu d'entre eux. Aurion Varezys était un dragonlord puissant dans le Libre État de Valyria. Quand le Doom a secoué les cieux et la terre, Aurion Varezys se trouvait à Qohor. Après avoir pris conscience qu'aucun autre ne pouvait égaler sa puissance, Aurion Varezys leva une armée de 30 000 hommes et se proclama le premier empereur de Valyria. Aurion Varezys, avec son dragon redoutable. [vassarion.GetName], et son vaste contingent ont tous pris la direction du sud depuis Qohor, sans rencontrer d'opposition, dans le but de reconquérir Valyria. Cependant, c'est au moment où ils ont franchi l'entrée du doom que l'on a vu pour la dernière fois ceux qui y sont entrés."
 mde_dragon_eggs_events.0016.a:0 "Audacieux, mais insensé."

 mde_dragon_eggs_events.0017.t:0 "Savoir des dragons: L'Oeuf d'Or"
 mde_dragon_eggs_events.0017.desc:0 "On sait que son groupe a fait une halte à cet exact emplacement lors de leur voyage de Qohor vers Valyria. Cependant, après un si long laps de temps, peu de preuves de cet événement demeurent. Cependant, ce qui persiste est une effigie valyrienne traditionnelle, réalisée par les membres de l'Armée Impériale Valyrienne, en mémoire de ceux disparus lors de la catastrophe, vraisemblablement pour les familles éloignées des soldats, aujourd'hui disparues.\n\nL'inscription valyrienne gravée dans la pierre ici n'a pas été réalisée par le feu, mais de manière irrégulière, avec du métal, et je peux juste distinguer une phrase parlant de quelque chose en dessous. Je fais confiance à mon instinct et je creuse sous la statue, découvrant une cache d'armes et quelque chose de plus précieux encore, un œuf de dragon doré !"
 mde_dragon_eggs_events.0017.a:0 "Libéré de l'emprise des morts !"



