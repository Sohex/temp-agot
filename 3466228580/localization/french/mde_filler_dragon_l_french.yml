l_french:

 mde_filler_dragon.0002.t: "Un œuf de saltimbanque"
 mde_filler_dragon.0002.desc: "Alors que ma [GetCourtPositionType('wet_nurse_court_position').GetName()] [nursemaid.GetFirstName] #italic fait irruption #!dans ma chambre, une vague d’inquiétude — et peut-être un soupçon d’agacement — m’envahit. Élever des enfants, même avec des domestiques, n’a jamais été une tâche facile.\n\nJuste derrière [nursemaid.GetFirstName] arrivent [older_child.GetFirstName] et [younger_child.GetFirstName], et tandis que [nursemaid.GetSheHe] tente d’expliquer la farce de [older_child.GetFirstName], les enfants se lancent dans une vive dispute.\n\nApparemment, [older_child.GetFirstName] a offert à [younger_child.GetFirstName] un faux œuf de dragon pour plaisanter, et désormais, la blague est sur toutes les lèvres dans le [ROOT.Char.Custom('ResidenceBuilding')]."
 mde_filler_dragon.0002.a: "#italic Hilarant, [older_child.GetFirstName] !#!"
 mde_filler_dragon.0002.b: "#italic Assez de ces idioties, [older_child.GetFirstName].#!"
 mde_filler_dragon.0002.c: "Quel casse-tête..."
 
 mde_filler_dragon.0004.t: "Caprices de jeunesse"
 mde_filler_dragon.0004.desc: "Dans tout le [ROOT.Char.Custom('ResidenceBuilding')], un hurlement furieux fend soudainement l’air, résonnant depuis la nurserie.\n\nJe m’y précipite pour y trouver le jeune [child.GetFirstName], le visage rouge, pointant du doigt son berceau [egg_child.GetName]. Des larmes coulent sur ses joues alors qu’il s’écrie : #italic « Je n’en veux pas ! Je veux un joli œuf ! »#! en désignant avec envie mon [egg.GetName] non réclamé.\n\nMon [child.Custom('GetDaughterSon')] montre déjà une forte volonté... et un goût coûteux ! Dois-je céder à cette exigence draconique ou enseigner une leçon de gratitude ?"
 mde_filler_dragon.0004.a: "Céder à [child.GetHerHim]."
 mde_filler_dragon.0004.b: "Reprendre l'œuf."
 mde_filler_dragon.0004.c: "[child.GetSheHe] aura oublié demain."
 
 mde_filler_dragon.0006.t: "Première véritable épreuve"
 mde_filler_dragon.0006.desc: "Aujourd’hui, je prévoyais de partir en chevauchée avec mon [child_rider.Custom('GetDaughterSon')]. Même pour un(e) [ROOT.Char.GetTitleTierName], le temps passé avec son enfant est précieux.\n\nMais en entrant dans la Fosse aux Dragons, je découvre le chaos. #italic « Que se passe-t-il ici ? »#! demandé-je aux gardiens. #italic « Votre [child_rider.Custom('GetDaughterSon')], mon [ROOT.Char.GetTitleTierName]… Eh bien, [child_dragon.GetName] refuse de quitter [child_dragon.GetHersHis] nid ! »#!\n\n[child_rider.GetFirstNameNicknamed] se tient là, nerveux(se) et gêné(e), luttant pour maîtriser son dragon.\n\nC’est la première vraie épreuve de [child_rider.GetFirstNameNicknamed]. Je m’avance et dis d’un ton calme mais ferme : #italic « Un chevaucheur doit commander sa monture avec assurance. Les dragons sont fiers et intelligents — mais c’est vous qui donnez les ordres. Vos mots doivent porter. Réessayez. Parlez clairement. Avec conviction. »#!\n\n#italic « Je vais essayer, [child_rider.Custom2('RelationToMeShort', SCOPE.sC('root_char') )]... [Glossary( 'Dohaerās', 'DOHAERAS_GLOSS' )], [child_dragon.GetName] ! [Glossary( 'Dohaerās', 'DOHAERAS_GLOSS' )] ! »#!"
 mde_filler_dragon.0006.a: "Espérons que [child_rider.GetHerHis] ton soit juste..."
 mde_filler_dragon.0006.b: "#italic « Laisse-moi faire ! »#!"
 mde_filler_dragon.0006.a.one: "[child_rider.GetFirstNameNicknamed] contrôle le dragon."
 mde_filler_dragon.0006.a.two: "[child_rider.GetFirstNameNicknamed] échoue à contrôler le dragon."
 mde_filler_dragon.0006.a.a: "[child_rider.GetFirstNameNicknamed] contrôle le dragon"
 mde_filler_dragon.0006.a.b: "[child_rider.GetFirstNameNicknamed] échoue à contrôler le dragon"
 
 mde_filler_dragon.0008.t: "Dormir dangereusement"
 mde_filler_dragon.0008.desc: "Alors que les cloches du matin sonnent, une [nursemaid.GetFirstName] nerveuse s’approche de moi en toute hâte. Les mains tremblantes, [nursemaid.GetSheHe] m’explique que [child_lost.GetFirstNameNicknamed] a disparu !"
 mde_filler_dragon.0008.desc.outpit: "Ce n’est qu’à midi que j’apprends où se trouve [child_lost.GetHerHis].\n\nApparemment, [child_lost.GetFirstNameNicknamed] a passé la nuit dans l’antre de [active_dragon.GetName], blotti(e) contre le flanc de la bête.\n\nDes témoins affirment même que [child_lost.GetSheHe] parlait au dragon et sautait sur son dos !"
 mde_filler_dragon.0008.desc.inpit: "Ce n’est qu’à midi que j’apprends où se trouve [child_lost.GetHerHis].\n\nApparemment, [child_lost.GetFirstNameNicknamed] a dormi toute la nuit aux côtés de [active_dragon.GetName] dans la Fosse aux Dragons !\n\nEncore plus scandaleux : [child_lost.GetSheHe] aurait été vu(e) grimpant sur le dos de [random_pit_dragon.GetHerHis], #italic tout en#! riant et esquivant les gardiens."
 mde_filler_dragon.0008.a: "Réprimander [child_lost.GetFirstNameNicknamed]"
 mde_filler_dragon.0008.b: "Encourager ce comportement."
 mde_filler_dragon.0008.c: "Déplacer [active_dragon.GetName] dans la Fosse aux Dragons !"
 mde_filler_dragon.0008.b.a: "[child_lost.GetFirstNameNicknamed] développe des rêves de dragon"
 mde_filler_dragon.0008.b.b: "Il ne se passe rien"
 
 #ROOT.Char.GetCouncillorPosition( 'councillor_steward' ).GetPositionName]
 mde_filler_dragon.0010.t: "Nourris à jamais"
 mde_filler_dragon.0010.desc: "Alors que la guerre s’éternise sans fin en vue, mon conseil me rapporte sans cesse les mêmes préoccupations :\n\nDes problèmes de distribution de nourriture sur les marchés, la hausse des prix de tous les produits et une agitation croissante parmi les petites gens.\n\nSi les difficultés sont attendues en temps de guerre, quelque chose de nouveau me tourmente. Les petites gens ont eu une idée folle : que le #bold corps#! d’un seul dragon pourrait les nourrir pour toujours. Les chuchotements deviennent des conversations, et les conversations une espérance dangereuse. La bête morte, disent-ils, mettrait fin à toute faim..."
 mde_filler_dragon.0010.a: "Mettre de l’argent de côté pour gérer l’agitation."
 mde_filler_dragon.0010.b: "Personne ne peut blesser les dragons !"
 mde_filler_dragon.0010.c: "Montrons-leur ce que sont #bold vraiment#! les dragons."
 
 mde_filler_dragon.0011.desc: "Lors d’une énième réunion du conseil, une bonne nouvelle m’arrive enfin : l’idée ridicule qu’un cadavre de dragon pourrait nourrir les petites gens pour l’éternité a presque complètement disparu des conversations dans les rues.\n\nIl semblerait que la population croissante de #italic rats, et autres choses répugnantes qui rampent#! ait suffi à apaiser leur faim, et à éloigner leurs pensées les plus folles.\n\nQuoi qu’il en soit, il y a toujours des sujets plus urgents à traiter."
 mde_filler_dragon.0011.a: "Sujet suivant, je vous prie, #italic [ROOT.Char.GetCouncillorPosition( 'councillor_castellan' ).GetPositionName]#!."
 
 mde_filler_dragon.0012.desc: "Alors que je suis en pleine discussion avec mes conseillers, mon [ROOT.Char.GetCouncillorPosition( 'councillor_castellan' ).GetPositionName] fait irruption dans la salle. La panique est évidente sur le visage de [hand.GetHerHis], alors qu’il tente d’expliquer la situation.\n\nLes petites gens ont eu l’audace de #bold O-SER#! s’en prendre à mes biens ! Une horde rugissante de créatures affamées, ingrates et traîtresses — à peine humaines — a pris d’assaut la Fosse aux Dragons !\n\nMême si les gardiens de dragons, les gardes et même les dragons eux-mêmes se sont défendus, le sol est jonché de corps… et les rapports disent que #color_red [dead_dragon.GetName]#! a été massacré.\n\nLes survivants ont utilisé outils, armes, tout ce qu’ils pouvaient trouver pour soulever ses écailles sacrées."
 mde_filler_dragon.0012.a: "Les petits gens vont souffrir pour cela !"
 
 mde_filler_dragon.0014.t: "Un endroit lointain"
 mde_filler_dragon.0014.desc: "Alors que je suis assis tranquillement à mon bureau, perdu dans les interminables registres, [child.GetFirstName] entre.\n\n#italic « Tu sembles tendu ces derniers temps, [child.Custom2('RelationToMeShort', SCOPE.sC('root_char') )]. »#! observe [child.GetSheHe]. #italic « Viens avec moi. Laisse-moi te montrer un endroit spécial que j’ai trouvé avec [child_dragon.GetName]. Juste pour aujourd’hui, laisse les autres porter ce fardeau. Tout le monde a besoin de repos de temps en temps ; on ne peut pas gouverner sans relâche. »#!\n\nJ’hésite. Combien de fois ai-je rêvé de tout laisser tomber, ne serait-ce qu’un jour ? De m’envoler sur [ridden_dragon.GetName], loin des querelles des seigneurs, des réunions de conseil incessantes, des demandes sans fin.\n\n#italic « C’est paisible, là-bas, »#! poursuit [child.GetFirstName]. #italic « Parfois, je m’assieds avec [child_dragon.GetName] jusqu’au coucher du soleil, en regardant son reflet dans les eaux peu profondes pendant que le ciel devient nuit. »#!\n\nPeut-être — juste peut-être — qu’un jour de silence ne me briserait pas…"
 mde_filler_dragon.0014.a: "#italic « J’aimerais voir cet endroit… »#!"
 mde_filler_dragon.0014.a.a: "Quelque chose s’éveille en [child.GetFirstNameNicknamed]"
 mde_filler_dragon.0014.a.b: "Rien de spécial ne se passe"
 mde_filler_dragon.0014.b: "#italic « Je n’ai pas le temps. Un court vol devra suffire. »#!"
 
 mde_filler_dragon.0016.t: "Un accident draconique"
 mde_filler_dragon.0016.desc: "Je me précipite vers les écuries, sanglé de cuir, lançant des ordres à la hâte. Je monte en selle et galope vers la Fosse aux Dragons, tandis que ma suite peine à me suivre.\n\nMon cœur bat #italic de plus en plus fort#! depuis que ces mots ont atteint mes oreilles. Même de loin, j’entends les #x hurlements#! – non pas d’une bête, mais d’un cœur d’enfant qui se brise.\n\nLes sanglots de [child.GetFirstNameNicknamed] transpercent l’air comme des couteaux. Et là, au milieu de la pierre et des cendres, repose un amas ruiné d’écailles et de dents brisées, tendrement enlacé dans les bras tremblants de [child.GetHersHis].\n\n#italic « Je n’ai pas… Je ne voulais pas ! »#! sanglote [child.GetFirstNameNicknamed]. #italic « On... on jouait. J’ai glissé et je suis tombé(e) dessus… »#! ajoute [child.GetSheHe] entre deux sanglots. #italic « Qu’ai-je fait ?! »#!"
 mde_filler_dragon.0016.a: "#italic « Non... »#!"
 mde_filler_dragon.0016.b: "Frapper [child.GetFirstNameNicknamed] pour son erreur."
 mde_filler_dragon.0016.c: "Autant l’achever…"
 mde_filler_dragon.0016.a.a: "Un impact durable"
 mde_filler_dragon.0016.a.b: "Tout le monde fait des erreurs"
 
 mde_filler_dragon.0018.t: "Une ménagerie ardente"
 mde_filler_dragon.0018.desc: "Alors que la session du conseil touche à sa fin et que ses membres commencent à quitter la salle, mon [ROOT.Char.GetCouncillorPosition( 'councillor_steward' ).GetPositionName], [steward.GetTitleTierName] [steward.GetNameNicknamed], reste en arrière avec une proposition pour le moins absurde.\n\nIl semblerait que de petits seigneurs, des marchands fortunés et même de simples artisans soient désespérés à l’idée de voir – et peut-être de toucher – mon [ridden_dragon.GetName].\n\n[steward.GetNameNicknamed] propose de transformer ce désir insensé en un grand festival unique. Une célébration de la Maison [ROOT.Char.GetDynastyHouseName], et une occasion de remplir nos coffres d’or.\n\nTout ce que j’ai à faire… c’est garder la bête calme."
 mde_filler_dragon.0018.a: "#italic « Très bien, faisons-le. »#!"
 mde_filler_dragon.0018.b: "Un dragon n’est pas un animal de foire."
 mde_filler_dragon.0018.c: "#italic « Et si c’était vous qui le caressiez ?#!"
 mde_filler_dragon.0018.a.a: "Tout se passe bien"
 mde_filler_dragon.0018.a.b: "Le dragon s’échappe"
 
 mde_filler_dragon.0020.t: "Un dragon qui dépérit"
 mde_filler_dragon.0020.desc: "#italic « Comment ! »#! demandé-je. #x « COMMENT ! »#! rugis-je.\n\nPersonne ne répond. Les mestres bafouillent en feuilletant des parchemins. Les septons prient le Père d’En-Haut, comme si des mots sacrés pouvaient réparer ce qui est déjà brisé.\n\nLes dragons ne tombent pas malades. Ni dans les contes, ni dans les livres, ni dans les chansons des bardes, ni même dans les pierres gravées. Et pourtant, lorsque je regarde [ridden_dragon.GetName], je vois la vérité de mes propres yeux.\n\nLa bête bouge, lente et lourde, ses membres tremblant à chaque souffle. #italic Je le ressens aussi#!, quelque part au plus profond de moi — une douleur partagée qui ronge os et esprit. La pourriture a atteint ses dents. Elles se fendent comme de vieilles pierres.\n\nCe n’est pas une maladie ordinaire. Magie noire, poison, ou quelque chose de #S pire#! encore… je l’ignore.\n\nMais cette question reste accrochée à mes lèvres, comme du sang : Comment… ?"
 mde_filler_dragon.0020.a: "Je suis sans voix…"
 mde_filler_dragon.0020.b: "#x Achevons-le.#!"
 
 mde_filler_dragon.0022.t: "Un nouveau bouc émissaire"
 mde_filler_dragon.0022.desc: "Je me réveille au son de poings #bold tambourinant#! à ma porte, de cloches #bold résonnant#! depuis les tours, et de cris #bold affolés#! dans les couloirs.\n\nLa peste n’est pas étrangère aux petits gens. Ils ont déjà enterré des proches. Mais cette fois-ci, ils ont trouvé un nouveau bouc émissaire.\n\n#S Les dragons.#!\n\nDurant la nuit, une grande foule puante s’est rassemblée — fourches, haches, massues, torches à la main. La peur et la folie leur ont donné force. Ils se sont rués vers la Fosse aux Dragons comme un torrent de rats.\n\nLes gardes ont été submergés, mis en pièces dans le chaos. Et même avec griffes, flammes et rage… le pire est arrivé…"
 mde_filler_dragon.0022.a: "Les petites gens paieront !"
 
 mde_filler_dragon.0024.t: "Présence imperturbable"
 mde_filler_dragon.0024.desc: "Le moment du nourrissage est habituellement un chaos maîtrisé, les gardiens distribuant prudemment la viande en gardant une distance respectueuse.\n\nPourtant, [ridden_dragon.GetName] fit preuve d’un calme remarquable. Il attendit patiemment sa part, laissant les gardiens se déplacer autour de lui sans signe d’agitation.\n\nÀ un moment, l’un d’eux trébucha, faisant tomber un seau dans un fracas métallique. Le bruit résonna comme de l’acier, mais [ridden_dragon.GetName] leva simplement la tête, observa l’homme se redresser, puis reprit son repas sans même un grognement.\n\nUne telle sérénité, au milieu de l’agitation humaine, révélait une créature étonnamment à l’aise dans ce monde."
 mde_filler_dragon.0024.a: "Quel gentil dragon."
 mde_filler_dragon.0024.b: "Encourageons ce comportement."
 mde_filler_dragon.0024.a.tt: "Le tempérament du dragon augmente."
 
 mde_filler_dragon.0026.t: "Un mangeur difficile"
 mde_filler_dragon.0026.desc: "L’offrande du jour était une chèvre, habituellement le mets favori des jeunes dragons. Pourtant, [ridden_dragon.GetName] s’est contenté de la renifler avant de s’en détourner sans intérêt.\n\nHier, il avait pourtant dévoré le cochon proposé avec appétit.\n\nLes soigneurs ont noté que ce comportement se répétait : le dragon affiche des préférences marquées, refusant souvent une viande parfaitement bonne si elle ne lui plaît pas.\n\nSi cela agace les nourrisseurs, ce palais exigeant a toutefois réduit sa consommation, faisant de [ridden_dragon.GetName] une créature étonnamment modérée."
 mde_filler_dragon.0026.a: "Très bien, donnons-lui ce qu’il aime."
 mde_filler_dragon.0026.b: "Affamez-le, qu’il mange ce qu’on lui donne."
 mde_filler_dragon.0026.b.tt: "Le tempérament du dragon diminue de 5."
 