 # play: tymās (tee-maas)
 # wait: umbās (oom-baas)
 # right: paktot (pak-toht)
 # left: geptot (gep-toht)
 # down: embrot (em-broht)
 # stand: iōrās (ee-oh-rras)
 # back: inkot (in-koht)
 # drink: iēdrot (ee-ed-roht)
 
  #\n\n
 ############ one offs ############
 #lost interest
 mde_dragon.0001.t: "Pourquoi suis-je ici ?"
 mde_dragon.0001.desc: "Alors que j'entre dans la Fosse aux Dragons, le monde devient silencieux. Les murs sont épais de terre et de feux anciens, mais mon esprit se vide. Je perds tout intérêt. J'oublie même pourquoi je suis venu·e.\n\nPourquoi dois-je monter [ridden_dragon.GetName] ? Est-ce vraiment important ? Dois-je vraiment me soumettre au jugement des Gardiens des Dragons ? Supporter le poids de leurs regards ? Et être observé·e par le monde entier ?\n\nTout cela me semble absurde, comme une cage d’attentes sans aucune récompense."
 mde_dragon.0001.a: "Non ! Je dois le monter."
 mde_dragon.0001.a.f: "Vous vous forcerez à monter en selle."
 mde_dragon.0001.b: "Peut-être juste un moment seul avec [ridden_dragon.GetName]."
 mde_dragon.0001.c: "Je n’aurais pas dû venir."
 mde_dragon.0001.b.f: "Vous passerez la soirée seul·e avec votre dragon."
 mde_dragon.0001.c.f: "Vous rentrerez chez vous."
 
 #lunatic flying
 mde_dragon.0002.t: "Voler ensemble !"
 mde_dragon.0002.desc: "#high Alors que je monte sur [ridden_dragon.GetName] et que nous nous élevons dans le ciel, je le ressens – ce calme parfait. La sérénité. C’est ici que je dois être. C’est ici que je #italic suis#!.\n\n[ridden_dragon.GetName] et moi ne sommes pas deux êtres distincts – nous ne faisons qu’un. Sans le dragon, je ne suis rien. #italic Avec#! le dragon, je suis tout.\n\nLe sang des dragons coule en nous – en moi, en ma Maison, dans les os de ma dynastie. Et pourtant… je suis ici, coincé·e dans une selle. Harnaché·e dans une cage de cuir et de peur.\n\nMais si je lâchais prise ? Si je me détachais, que je lançais les rênes au vent et que je volais vraiment – #italic non pas sur#! [ridden_dragon.GetName], mais avec [ridden_dragon.GetName] ? Côte à côte. Comme cela a toujours été destiné à l’être.#!"
 mde_dragon.0002.a: "#S JE SUIS LE DRAGON#!"
 mde_dragon.0002.a.f: "#S ET JE LE MONTRERAI AU MONDE ENTIER.#!"
 mde_dragon.0002.b: "#weak Pourtant, je ne vois pas d’ailes sur moi... #!"
 mde_dragon.0002.b.f: "Vous poursuivrez sans encombre."
 mde_dragon.0002.c: "#X LE FEU BRÛLE EN MOI.#!"
 
 
 #forgot to strap
 mde_dragon.0003.t: "Oublié de s'attacher"
 mde_dragon.0003.desc: "#high Le vent hurle alors que nous montons, et pendant un instant, tout semble parfait. [ridden_dragon.GetName] s'élève avec puissance, chaque battement d'ailes secouant le ciel.\n\nMais alors que nous ralentissons, suspendus au cœur des nuages, l'élan reprend le dessus. Mon corps bascule vers l'avant – et je glisse, dévalant le flanc de [ridden_dragon.GetName].\n\nMaintenant suspendu d'une seule main, le vent rugissant dans mes oreilles, la vérité me frappe comme une pierre : j'ai oublié de m'attacher.\n\nComment ai-je pu être aussi négligent ?#!"
 mde_dragon.0003.a: "#italic Se hisser.#!"
 mde_dragon.0003.b: "#italic #emp [Glossary( 'Vēzot', 'VEZOT_GLOSS' )], [ridden_dragon.GetName] !#!#!"
 mde_dragon.0003.c: "#italic Lâcher prise et voler.#!"
 mde_dragon.0003.toast.a.success: "Vous parvenez à vous hisser et à atterrir."
 mde_dragon.0003.toast.a.failure: "Vous n’avez pas la force de vous hisser."
 mde_dragon.0003.toast.b.success: "[ridden_dragon.GetName] vous soutient."
 mde_dragon.0003.toast.b.failure: "[ridden_dragon.GetName] ne réagit pas."
 mde_dragon.0003.a.a: "Vous vous hissez"
 mde_dragon.0003.a.b: "Vous glissez et tombez"
 mde_dragon.0003.b.a: "[ridden_dragon.GetName] réagit"
 mde_dragon.0003.b.b: "Vous glissez et tombez"
 
 
 #broken strap
 mde_dragon.0004.t: "Sangles Brisées"
 mde_dragon.0004.desc: "#high Après avoir survolé le ciel, je fais ralentir [ridden_dragon.GetName].\n\nAlors que j’observe les champs, les villages et les forêts en contrebas, je remarque autre chose. Les sangles qui me maintiennent à la selle sont rompues et entaillées, que ce soit par accident… ou volontairement.\n\nUn frisson me parcourt l’échine — je suis là, au-dessus des nuages, le vent hurlant autour de moi, le soleil me brûlant les yeux.\n\nEt pourtant, une simple erreur pourrait me précipiter vers la mort.#!"
 mde_dragon.0004.a: "Descendre lentement et prudemment."
 mde_dragon.0004.b: "J’ai confiance en [ridden_dragon.GetName]."
 mde_dragon.0004.b.f: "Plus le lien est fort, plus les chances augmentent."
 mde_dragon.0004.c: "Continuer à chevaucher."
 mde_dragon.0004.toast.a.success: "Vous parvenez à descendre en toute sécurité."
 mde_dragon.0004.toast.a.failure: "Une simple erreur vous fait glisser de la selle."
 mde_dragon.0004.toast.b.success: "Votre lien vous sauve."
 mde_dragon.0004.toast.b.failure: "Faire confiance à un grand dragon ne vous a pas aidé."
 mde_dragon.0004.toast.c.success: "Tout se passe comme d’habitude."
 mde_dragon.0004.toast.c.failure: "Une simple erreur vous fait glisser de la selle."
 mde_dragon.0004.a.a: "Vous atterrissez sans encombre"
 mde_dragon.0004.a.b: "Vous paniquez et tombez"
 mde_dragon.0004.b.a: "[ridden_dragon.GetName] vous garde en sécurité"
 mde_dragon.0004.b.b: "Vous tombez, emporté par les mouvements de [ridden_dragon.GetName]"
 mde_dragon.0004.c.a: "Votre expérience vous protège"
 mde_dragon.0004.c.b: "Même les meilleurs finissent par tomber"
 
 #missed meal alone 
 mde_dragon.0005.t: "Un repas manqué"
 mde_dragon.0005.desc: "#high Alors que je me dirige vers l'antre de [ridden_dragon.GetName], une peur soudaine m'envahit. J'ai oublié de nourrir [ridden_dragon.Custom('GetDragonHerHim')] depuis presque une semaine !\n\nBien que [ridden_dragon.GetName] soit tout à fait capable de chasser, fournir régulièrement du bétail maintient la bête calme, obéissante... et évite des incidents désagréables avec la paysannerie locale.\n\nMaintenant, alors que j'approche de l'antre, un sifflement sourd résonne depuis l'ombre. [ridden_dragon.GetName] se redresse lentement, dos arqué, yeux plissés.#!"
 mde_dragon.0005.a: "Chante en valyrien."
 mde_dragon.0005.a.f: "Tu chanteras en harnachant et montant ton dragon."
 mde_dragon.0005.b: "Tente de le seller."
 mde_dragon.0005.toast.a: "Tu parviens à grimper et à voler autour."
 mde_dragon.0005.toast.b: "Tu tombes dans ta tentative et lutte pour revenir."
 mde_dragon.0005.c: "Emprisonne-le dans le Donjon du Dragon."
 mde_dragon.0005.b.a: "[ridden_dragon.GetName] obéit à tes ordres"
 mde_dragon.0005.b.b: "Tu es violemment projeté au sol"
 
 #struggle alone
 mde_dragon.0006.t: "Lutte solitaire"
 mde_dragon.0006.desc: "#high Portant un enchevêtrement de lanières de cuir, je me dirige vers le lieu de repos de [ridden_dragon.GetName]. La vie d’un Cavalier de Dragon, c’est plus que la bataille et la gloire. C’est nourrir, calmer, et apprendre à vivre aux côtés d’une créature de feu et de fureur.\n\nEt pourtant, je lutte seul. [ridden_dragon.GetName] ne montre aucun signe d’amitié, et la moitié du temps, je jure que [ridden_dragon.Custom('GetDragonSheHe')] me refuse par pure rancune.\n\nAlors que je lutte pour ajuster la selle et commence à me hisser sur son dos, la bête s’agite..."
 mde_dragon.0006.a: "#emp [Glossary('Dohaerās', 'DOHAERAS_GLOSS')], [ridden_dragon.GetName] !#!"
 mde_dragon.0006.b: "Tiens bon et hisse-toi."
 mde_dragon.0006.toast.b.success: "Tu parviens à grimper."
 mde_dragon.0006.toast.b.failure: "Tu tombes dans ta tentative et struggles pour revenir."
 mde_dragon.0006.c: "Abandonne toute idée de monter aujourd’hui."
 mde_dragon.0006.d: "Emprisonne-le dans le Donjon du Dragon."
 mde_dragon.0006.b.a: "[ridden_dragon.GetName] obéit à tes ordres"
 mde_dragon.0006.b.b: "Tu es violemment projeté au sol"
 
 #flying with spouse 1 happy little flying
 mde_dragon.0007.t: "\"Ailes de feu, cœurs enlacés\""
 mde_dragon.0007.desc: "#strong_glow Le ciel #italic rugit #! du tonnerre des ailes alors que moi et mon bien-aimé [spouse.GetFirstNameNicknamed] nous élevons ensemble sur nos dragons, [ridden_dragon.GetName] et [ridden_dragon_spouse.GetName]. Le vent fouette mon visage tandis que nos bêtes volent côte à côte.\n\nDepuis cette hauteur, tout semble petit, toutes les inquiétudes lointaines. Pendant un instant fugace, je ne suis ni un [ROOT.Char.GetTitleTierName] ni un [spouse.GetTitleTierName], mais deux âmes liées par le sang, la flamme et l’amour.\n\nJe jette un regard à travers le ciel vers [spouse.GetFirstNameNicknamed], et [spouse.GetSheHe] sourit, féroce et libre. Il n’existe aucun lien plus fort que celui-ci : deux cavaliers de dragons, unis par le mariage, cœurs enflammés de passion et de puissance.#!"
 mde_dragon.0007.a: "Danse avec [spouse.GetFirstNameNicknamed]."
 mde_dragon.0007.b: "Inspirez l’admiration ensemble."
 
 
 #flying with spouse 2 heirs to valyria
 mde_dragon.0008.t: "\"Échos de Valyria\""
 mde_dragon.0008.desc: "#strong_glow Mon dragon traverse les nuages avec aisance tandis que [spouse.GetFirstNameNicknamed] et moi nous élevons au-dessus d’eux, plus haut que n’importe quel oiseau, plus haut que n’importe quel mortel n’a #bold;italic le droit #!de voler.\n\nLe monde s’efface sous nos pieds, et pour un battement de cœur étiré à l’éternité, le temps lui-même semble se plier. Je ne suis plus [ROOT.Char.GetName], et [spouse.GetSheHe] n’est plus [spouse.GetName]. Nous sommes les héritiers du Freehold, descendants du #r Feu #!et du #r Sang#!, chevauchant des #bold;italic Dieux vivants #! à travers un ciel peint de mémoire et de mythe.\n\nAu-dessus, les étoiles témoignent en silence. En dessous, la terre tremble d’émerveillement.\n\nNous volons en parfaite harmonie — deux dragons, deux cœurs, un héritage. Est-ce ainsi que les Seigneurs des Dragons de Valyria planaient autrefois ?#!"
 mde_dragon.0008.a: "Nous sommes les derniers de Valyria !"
 mde_dragon.0008.b: "Nous recréerons le Freehold !"
 mde_dragon.0008.c: "Les Dragons nous gouvernent !"
 mde_dragon.0008.d: "C’est un rêve perdu..."
 
 
  #flying with spouse mating on hill
 mde_dragon.0009.t: "\"Amour en flammes\""
 mde_dragon.0009.desc: "#high La nuit est chaude, l’air chargé du parfum de cendre et de sel alors que nos dragons s’élèvent dans le ciel de velours. À mes côtés, [spouse.GetFirstNameNicknamed] chevauche [ridden_dragon_spouse.GetName] avec une aisance habituée, le clair de lune jetant de l’argent sur son visage et ses cheveux.\n\nBien loin en dessous, notre [ROOT.Char.Custom('ResidenceBuilding')] repose dans un sommeil paisible. Mais ici, le monde est silencieux — seul le souffle du vent, le lent battement des ailes, et la rare sérénité de deux Cavaliers de Dragons seuls dans l’obscurité.\n\nNous glissons côte à côte, traçant de lentes spirales dans la nuit comme des danseurs en rêve. Lorsque nos dragons atterrissent enfin sur un perchoir au sommet d’une colline, mon [spouse.GetTitleTierName] descend et me serre contre [spouse.GetHerHim].\n\n#italic « Toi et moi, » #! murmure [spouse.GetFirstNameNicknamed], #italic « contre tout le monde. »#!#!"
 mde_dragon.0009.a: "#italic « Je t’aime » #!"
 mde_dragon.0009.b: "Allonge-toi avec [spouse.GetFirstNameNicknamed]."
 mde_dragon.0009.b.tt.lovers: "[spouse.GetFirstNameNicknamed] doit être ton amoureux ou âme sœur !"
 mde_dragon.0009.b.tt.lay: "Tu t’allonges avec [spouse.GetFirstNameNicknamed]."
 
 
  #dangerous maneuvors
 mde_dragon.0010.t: "\"Manœuvres dangereuses\""
 mde_dragon.0010.desc: "#high Je pousse [ridden_dragon.GetName] plus haut, plus vite ; au-delà de la raison, au-delà de la peur. [ridden_dragon.GetSheHe] pousse un cri d’excitation alors que je commande une plongée raide, le vent hurlant à mes oreilles. Les arbres en dessous se dressent comme des lances, le bord de la montagne est un flou de pierre et de neige. [ridden_dragon.GetName] vire juste avant le point de non-retour, comme je le voulais.\n\nMais ce n’est pas assez.\n\nJe me tords en spirales plus serrées, vole assez bas pour brûler les cimes des arbres, cours le long du méandre de la rivière jusqu’à ce que nos ailes effleurent la brume. Le dragon rugit en protestation… ou peut-être en approbation. Difficile à dire par-dessus le martèlement de mon cœur.\n\nJe ne vole pas. Je défie la mort.#!"
 mde_dragon.0010.a: "#italic Je ris au visage du danger !#!"
 mde_dragon.0010.a.f: "Tu continues à pousser."
 mde_dragon.0010.b: "C’est assez proche. Même moi, je connais mes limites."
 mde_dragon.0010.b.f: "Tu ralentis et mets fin au vol."
 mde_dragon.0010.toast.a.one: "Tu réussis."
 mde_dragon.0010.toast.a.two: "Tu effleures quelque chose."
 mde_dragon.0010.toast.a.three: "Tu es violemment heurté par un objet."
 mde_dragon.0010.a.a: "Tu réalises un spectacle impressionnant."
 mde_dragon.0010.a.b: "Tu ratures quelque chose."
 mde_dragon.0010.a.c: "Tu es violemment heurté par un objet."
 mde_dragon.0010.a.d: "Tu te cognes le crâne contre un objet."
 
  #low altitude over water
 mde_dragon.0011.t: "\"Ailes sur l’eau\""
 mde_dragon.0011.desc: "#high L’océan s’étend devant moi, sombre et infini. La plupart du temps, je préfère les montagnes ou les plaines, mais pas aujourd’hui.\n\nJe me penche en avant, et [ridden_dragon.GetName] répond. Nous descendons rapidement, la surface lisse comme un miroir de la mer défile sous nous. Les ailes de [ridden_dragon.GetName] battent à quelques pieds au-dessus des vagues. Le vent et le sel piquent mon visage tandis que l’eau devient un flou.\n\nUn cavalier moins habile s’élèverait maintenant. Mais je ne suis pas un cavalier moindre.\n\nJe vire en virages serrés et inclinés au-dessus de falaises escarpées. Les embruns fouettent le ventre de [ridden_dragon.GetName]. Je me baisse suffisamment pour que les extrémités de ses ailes effleurent la surface de l’eau. Derrière nous, une sillage se forme — une tempête en miniature.\n\nJe #italic défie#! le destin. Et je n’ai pas encore fini.#!"
 mde_dragon.0011.a: "Que la mer tente de m’engloutir !"
 mde_dragon.0011.a.f: "Pousse le dragon encore plus bas."
 mde_dragon.0011.toast.a.one: "Tu termines le vol indemne."
 mde_dragon.0011.toast.a.two: "Tu subis des blessures légères."
 mde_dragon.0011.b: "Restons simples."
 mde_dragon.0011.a.a: "Tu réussis."
 mde_dragon.0011.a.b: "Tu subis des blessures légères."
 mde_dragon.0011.a.c: "Tu t’écrases dans l’eau et te noies dans ton armure."
 
  #public stunt
 mde_dragon.0012.t: "\"Scène céleste\""
 mde_dragon.0012.desc: "#high Les champs près de mon [ROOT.Char.Custom('ResidenceBuilding')] sont remplis de spectateurs ; paysans, marchands, chevaliers errants, et enfants, tous les yeux grands ouverts et la bouche bée, regardant vers le ciel.\n\nIls sont tous venus pour voir [ridden_dragon.GetName]. Mais je ne prévois pas qu’un simple vol, je prépare un spectacle.\n\nD’un coup de rêne et d’un mot en Haut Valyrien, [ridden_dragon.GetName] s’élance dans le ciel dans un rugissement de terre, de poussière et de vent. Nous faisons des loopings et des spirales, plongeons et grimpons. Je slalome à travers des arches étroites de roche et crache des flammes dans le ciel, dessinant des symboles et des ombres dans l’air.\n\nLa foule s’émerveille. Les enfants acclament. Certains crient. Je chevauche une bête de feu et de mort ; et pour l’instant, je la chevauche pour eux.\n\nMais alors… je vois le bord d’une falaise. Une tour en ruines. Un endroit où tenter quelque chose qu’aucun cavalier n’a osé auparavant. Dois-je ? #!"
 mde_dragon.0012.a: "Qu’ils s’en souviennent pendant des générations !"
 mde_dragon.0012.a.f: "Tente une cascade extrême pour laisser la foule en admiration."
 mde_dragon.0012.b: "C’est assez de gloire pour une journée."
 mde_dragon.0012.toast.a.one: "Tu termines le vol indemne."
 mde_dragon.0012.toast.a.two: "Tu subis des blessures légères."
 mde_dragon.0012.toast.a.three: "Tu heurtes un rocher."
 mde_dragon.0012.a.a: "Tu réalises un spectacle impressionnant."
 mde_dragon.0012.a.b: "Tu subis des blessures légères."
 mde_dragon.0012.a.c: "Tu es violemment heurté par un objet."
 
 
  #sacred in pit
 mde_dragon.0013.t: "\"La peur dans l’arène\""
 mde_dragon.0013.desc: "[ridden_dragon.GetName] m’attend, sa massive tête baissée, ailes repliées, queue qui tressaille légèrement. [ridden_dragon.GetSheHe] me regarde, attend que je m’approche, que je monte la selle, que je chevauche. Mais mes pieds ne bougent pas.\n\nJe fais un pas. Je m’arrête. Le souffle du dragon résonne comme une tempête passant à mes oreilles. Je vois ses griffes, ses dents, sa taille immense. Je me souviens des histoires ; des cavaliers brûlés vifs, dévorés lors du lien, brisés sur les pierres.\n\nEt soudain, je suis figé. La honte me serre le ventre. Des yeux regardent, les gardiens du dragon, même un mestre."
 mde_dragon.0013.a: "Non. Je dois chevaucher."
 mde_dragon.0013.a.f: "Tu te forces à surmonter la peur et tentes le vol quand même."
 mde_dragon.0013.b: "#italic « Je… je ne suis pas prêt. »#!"
 mde_dragon.0013.b.f: "Tu fais demi-tour, et tout le monde le voit, la cour en entendra parler…"
 
 
  #spouse wants to die
 mde_dragon.0014.t: "\"Par le feu seul\""
 mde_dragon.0014.desc.bigbond: "#strong_glow Alors que je poursuis [spouse.GetFirstNameNicknamed] perché sur [ridden_dragon_spouse.GetName], comme je l’ai fait d’innombrables fois auparavant, nous volons en larges cercles et glissons ensemble à travers les cieux.#!"
 mde_dragon.0014.desc.smallbond: "#strong_glow Tandis que nous tirons les rênes de nos dragons ; [ridden_dragon.GetName] et [ridden_dragon_spouse.GetName], et nageons à travers le ciel ouvert. Je tourne autour de [spouse.GetFirstNameNicknamed], suivant chacun de ses mouvements.#!"
 mde_dragon.0014.desc.end: "#strong_glow \n\nAucune inquiétude du monde d’en bas ne peut nous atteindre ici. Pourtant, alors que nous sommes assis au sommet des nuages, les yeux plongés l’un dans l’autre, [spouse.GetTitleTierName] me confesse enfin quelque chose :\n\n#italic « [ROOT.Char.GetName], mes os me font mal quand je bouge. Mon corps s’épuise. Accorde-moi une mort digne de mon sang valyrien. »#!#!"
 mde_dragon.0014.a: "Tout pour toi..."
 mde_dragon.0014.a.tt: "La famille proche de [spouse.GetFirstNameNicknamed] sera déçue."
 mde_dragon.0014.b: "#bold NON JE NE POURRAIS JAMAIS ! #!"
 mde_dragon.0014.c: "#italic « Partons ensemble de ce monde... »#!"
 
 
  #a joyful moment with wife
 mde_dragon.0015.t: "\"Un moment de joie\""
 mde_dragon.0015.desc: "#strong_glow Je saute dans mon équipement de cavalier, riant et taquinant [spouse.GetFirstNameNicknamed] tandis que nous nous préparons. Main dans la main, nous quittons notre [ROOT.Char.Custom('ResidenceBuilding')], approchons nos dragons, montons en selle, et bientôt [ridden_dragon.GetName] me porte dans les airs, avec [ridden_dragon_spouse.GetName] à notre poursuite.\n\nAlors que nous montons vers le ciel, le jeu change ; je poursuis [spouse.GetFirstNameNicknamed], puis [spouse.GetSheHe] me poursuit. De plus en plus haut nous volons, jusqu’à ce que nos dragons enlacent leurs cous au milieu des nuages, puis, sans avertissement, ils plongent, visant droit vers le sol.#!"
 mde_dragon.0015.a: "Tire sur les rênes et éloigne-toi."
 mde_dragon.0015.a.tt: "Montrer de la méfiance ne sera pas bien perçu..."
 mde_dragon.0015.toast.a: "Tu réussis à t’éloigner et à revenir en vol."
 mde_dragon.0015.b: "Fais confiance à [spouse.GetFirstNameNicknamed] et à tes dragons..."
 mde_dragon.0015.b.tt: "Quelque chose pourrait mal tourner ?"
 mde_dragon.0015.toast.b: "Les dragons se corrigent."
 
 
  #angry spouse awful snap
 mde_dragon.0016.t: "\"Une cassure terrible\""
 mde_dragon.0016.desc: "#strong_glow Une fois de plus, je suis dans les airs, poursuivant [spouse.GetFirstNameNicknamed] perché sur [ridden_dragon_spouse.GetName]. [spouse.GetSheHe] tourne autour de moi en cercles sans fin, taquinant à chaque passage.\n\nAprès un moment, [spouse.GetSheHe] ralentit, positionnant [ridden_dragon_spouse.GetName] directement devant [ridden_dragon.GetName], bloquant mon chemin. [spouse.GetFirstNameNicknamed] s’écrie en riant, #italic « Tu n’as pas le cœur à ça aujourd’hui ?#! »\n\nHumeur ?! [spouse.GetSheHe] m’a nargué pendant tout le vol, sans parler des plaintes incessantes !\n\nCe serait si facile de faire craquer le cou de [ridden_dragon_spouse.GetName] par [ridden_dragon.GetName]...#!"
 mde_dragon.0016.a: "#emp #bold [Glossary( 'Angōs', 'ANGOS_GLOSS' )], [ridden_dragon.GetName]!#!"
 mde_dragon.0016.b: "Ignore les provocations de [spouse.GetHerHis]."
 
  
  #clear sky
 mde_dragon.0017.t: "\"Ciel clair\""
 mde_dragon.0017.desc.inpit: "#high Avec [ridden_dragon.GetName] qui sort en trombe de l'Arène des Dragons, je lève les yeux vers un ciel entièrement peint en turquoise.#!"
 mde_dragon.0017.desc.outpit: "#high Avec [ridden_dragon.GetName] qui foule les plaines, je lève les yeux vers un ciel entièrement peint en turquoise.#!"
 mde_dragon.0017.desc: "#high \n\nMême le vent est immobile ! Aujourd’hui, le vol dépendra uniquement de notre force et de notre habileté. Une occasion parfaite pour s’entraîner !\n\nJe lance un appel, \"#bold [Glossary( 'Sovês!', 'SOVES_GLOSS' )]#!\" et, après quelques puissants battements d’ailes de [ridden_dragon.GetName], nous nous élevons dans les airs, volant de toutes nos forces. La selle est naturelle sous moi, le ciel accueillant au-dessus. Être au sommet d’un dragon semble être ma place légitime.\n\nJe suis un véritable Cavalier de Dragon !#!"
 mde_dragon.0017.a: "Profite du moment."
 
 
  #doesn't feel right (to ride)
 mde_dragon.0018.t: "\"Terribles sensations\""
 mde_dragon.0018.desc: "#high Je chevauche. Le dragon obéit à mes ordres. Le vent me porte au-dessus des collines, de la mer, des arêtes acérées des montagnes lointaines.\n\nLe vent hurle comme une bête dans mes oreilles. Chaque virage sur [ridden_dragon.GetName] me retourne l’estomac et je ne peux m’empêcher de jeter des regards vers le sol ; vers les rochers, vers ce vide terrifiant entre moi et la mort.\n\nJe serre les rênes plus fort. Je respire entre mes dents, pourtant j’ai l’impression que [ridden_dragon.GetName] traîne mon âme à travers le ciel.\n\nQuand j’atterris et descends de selle, mes jambes tremblent. La bête à côté de moi souffle et renifle, peut-être agacée.\n\nJe peux dire que j’ai volé. Je peux même dire que je m’en suis bien sorti. Mais quelle est la vérité ? #bold J’ai détesté chaque instant.#!#!"
 mde_dragon.0018.a: "#italic \"Je suis un tel échec\"#!"
 mde_dragon.0018.b: "Je vais abandonner l’équitation..."
 
 
  #super relaxing flight
 mde_dragon.0019.t: "\"Au-dessus du bruit\""
 mde_dragon.0019.desc: "#high Sur le dos de [ridden_dragon.GetName], je bondis vers le ciel, et le monde disparaît sous moi.\n\nLà-haut, il n’y a plus de voix, ni de cour, ni de cliquetis d’épées, ni de lettres non lues, ni de regards sournois. Il n’y a qu’un rythme régulier d’ailes, la respiration basse de [ridden_dragon.GetName], et le ciel ouvert qui se déploie autour de moi comme une douce couverture.\n\nJe ferme les yeux, savoure la chaleur, et perçois même mon propre battement de cœur lent. #bold C’est ça#! la paix, c’est la #italic tranquillité#!.\n\nPour un court instant, je ne suis ni [ROOT.Char.GetTitleTierName], ni cavalier, ni un nom dans un livre. Je suis juste... moi.#!"
 mde_dragon.0019.a: "Je pourrais rester ici pour toujours."
 mde_dragon.0019.b: "#italic \"Le ciel m’a rappelé qui je suis.\"#!"
 
 
  #within the storm
 mde_dragon.0020.t: "Au cœur de la tempête"
 mde_dragon.0020.desc: "#high Les nuages #warning bouillonnent#!, et le tonnerre #alert_trial gronde#! au loin. Quand je me suis envolé il y a quelques instants, une tempête était déjà en formation. Mais un cavalier de dragon de la Maison [ROOT.Char.GetDynastyHouseName] doit être prêt à affronter tous les temps.\n\nSous moi, [ridden_dragon.GetName] agite ses ailes, comme s’il était mal à l’aise, alors que nous traversons ces nuages sombres et tourbillonnants.\n\nJe guide mon dragon plus haut ; pas pour fuir la tempête, mais pour la traverser. La foudre danse à la limite de ma vision. Le vent déchire ma cape. La pluie fouette mon visage comme une pluie de petites lames.\n\nEt pourtant, je reste stable en selle. [ridden_dragon.GetName], sentant mon calme, se stabilise aussi. Ensemble, nous ne fuyons pas la tempête. Nous la traversons, comme une aiguille dans la soie.#!"
 mde_dragon.0020.a: "Navigation parfaite !"
 mde_dragon.0020.b: "#italic #color_red Le feu intérieur brûle plus fort que tout.#!#!"
 mde_dragon.0020.b.a: "Le dragon est en moi"
 mde_dragon.0020.b.b: "Quel beau rêve"
 
 
  #watching the skies
 mde_dragon.0021.t: "Veiller sur les cieux"
 mde_dragon.0021.desc: "#high [ridden_dragon.GetName] fend le ciel en larges arcs lents ; assez haut pour ne pas effrayer, assez bas pour rappeler sa présence. Les villageois interrompent leur travail pour lever les yeux. Les marchands sur les routes s’arrêtent net. Les enfants agitent les bras et sautillent.\n\nJe ne suis pas ici pour brûler ni conquérir. Je suis ici pour être vu..\n\nMa monture devine mon intention et reste calme, ne soufflant que de légers nuages de fumée. Certains à la cour pourraient râler de mon désir d'attirer l’attention, mais les routes se font plus calmes, et les champs plus sûrs. #!"
 mde_dragon.0021.a: "Commencer à voler régulièrement."
 mde_dragon.0021.b: "Une fois suffit."
 
  #only tear drops with wife
 mde_dragon.0022.t: "Seulement des larmes"
 mde_dragon.0022.desc: "#high Les ailes des deux bêtes résonnent dans le ciel alors que nous planons. Même la pluie froide, battant à la fois sur le cavalier et le dragon, ne peut ternir notre enthousiasme.\n\nEn regardant derrière moi, j’aperçois [spouse.GetFirstNameNicknamed] et [ridden_dragon_spouse.GetName], à nos trousses. Quelle occasion parfaite de tester nos compétences ensemble.\n\nNous filons entre les nuages, plongeant bas puis montant haut. D’abord [spouse.GetSheHe] me poursuit, puis c’est moi qui poursuis [spouse.GetHerHim]. Nous tournoyons et virons. Ce n’est que lorsque le ciel commence à se dégager et que le soleil perce que nous redescendons enfin.#!"
 mde_dragon.0022.a: "#italic « Passons la journée ensemble ! »#!"
 mde_dragon.0022.b: "#italic « Concentrons-nous sur notre entraînement. »#!"
 
 
  #endless teasing with wife
 
 mde_dragon.0023.t: "Taquineries sans fin"
 mde_dragon.0023.desc: "#strong_glow Même haut dans les airs, #italic même perché sur un dragon#! [spouse.GetFirstNameNicknamed] me taquine. Avec un large sourire, [spouse.GetSheHe] crie, #italic « Tu sais ce qui est plus chaud que le feu de dragon ? Moi ! »#!\n\n[spouse.GetSheHe] n’a même pas pu se tenir correctement en chemin vers les montures. J’ai dû supporter des paroles du genre #italic « faire éclore quelque chose de spécial ensemble »#! et #italic « s’enflammer l’un l’autre »#!…\n\nMaintenant, avec une lueur malicieuse dans les yeux, [spouse.GetHersHis] flotte en face de moi, perché sur [ridden_dragon_spouse.GetName], clairement prêt à lancer une autre plaisanterie grossière.#!"
 mde_dragon.0023.a: "#italic « Que dirais-tu de tirer là-dessus… »#!"
 mde_dragon.0023.b: "#italic « Assez de plaisanteries enfantines. »#!"
 
  #your and dragon spouse bond
 
 mde_dragon.0024.t: "Une danse d'amour draconique"
 mde_dragon.0024.desc: "#strong_glow Les écailles scintillent au soleil, et les flammes dansent dans le ciel. Je suis perché sur [ridden_dragon.GetName], planant en larges arcs au-dessus de la terre, en parfaite harmonie avec [spouse.GetFirstNameNicknamed].\n\nNous avons pris les cieux ensemble maintes fois, cavalier et cavalier, dragon et dragon. Mais quelque chose est différent cette fois.\n\n[ridden_dragon.GetName] et [ridden_dragon_spouse.GetName] glissent à l’unisson, leurs ailes tranchant l’air en parfaite harmonie. Leur vol devient une danse, fluide et instinctive, comme liés par quelque chose de plus ancien et profond que nous. Puis, soudain, ils s’entrelacent. Leurs longs cous s’enlacent en plein vol dans une démonstration féroce, presque tendre.\n\nJe serre la selle, les rênes mordant mes gants. En face de moi, je vois [spouse.GetFirstNameNicknamed] faire de même.\n\nQuand nous atterrissons enfin et descendons, aucun de nous ne prononce un mot. Les deux dragons s’élèvent à nouveau, sans cavaliers, tournoyant ensemble vers les cieux. Le battement de leurs ailes s’accorde parfaitement.#!"
 mde_dragon.0024.a: "Encourager la relation"
 mde_dragon.0024.b: "Nous régnons sur les #italic bêtes# !"
 
 
 ############ event chains ############
 
 #lost dragon
 mde_dragon.0101.t: "Dragon perdu"
 mde_dragon.0101.desc: "En entrant dans l’Arène des Dragons à la recherche de [ridden_dragon.GetName], je vérifie leur cachette habituelle. Je fouille les lieux des festins. Je jette même un œil au grand nid du dragon.\n\nPourtant, [ridden_dragon.GetName] est introuvable. Et je me demande... comment un dragon peut-il se perdre ?"
 mde_dragon.0101.a: "Allons trouver les Gardiens des Dragons"
 mde_dragon.0101.b: "Je vais continuer la recherche moi-même"
 mde_dragon.0101.b.f: "Je ne sais pas trop ce que je pourrai trouver."
 
 mde_dragon.0102.desc: "Comme je le pensais – les Gardiens des Dragons ont déplacé les dragons pour nettoyer et entretenir l’arène.\n\nQuand ils me montrent [ridden_dragon.GetName], la grande bête avance en piétinant, attirée, je suppose, par le lien qui nous unit."
 mde_dragon.0102.a: "Il est temps de voler !"
 mde_dragon.0102.a.f: "Tu engages un vol normal."
 mde_dragon.0102.b: "J’ai perdu l’intérêt"
 mde_dragon.0102.b.f: "Tu ne monteras pas, mais seras quand même en période de repos."
 
 mde_dragon.0103.desc: "Je parcours l’Arène des Dragons comme une poule sans tête, désespérément perdu – jusqu’à ce qu’un rugissement déchire l’air. Un dragon !\n\nLa sueur me rafraîchit le front, et [ridden_dragon.GetName] s’avance vers moi en piétinant, j’imagine qu’il a ressenti le même stress que moi."
 
 mde_dragon.0104.desc: "Je commence à accélérer le pas, à respirer plus vite. J’ai arpenté l’Arène des Dragons de long en large plusieurs fois maintenant. Chaque recoin inspecté. Chaque cellule passée au crible. Rien. Juste le vide.\n\nPuis enfin, les lourdes portes grincent en s’ouvrant. Les Gardiens des Dragons entrent… et il y a [ridden_dragon.GetName], parfaitement sain et sauf.\n\nJe me précipite vers lui, exigeant une explication, tout en essayant nerveusement de caresser [ridden_dragon.GetName] comme si cela pouvait calmer l’un de nous deux."
 mde_dragon.0104.a: "Eh bien, il est temps de prendre le vol, je suppose"
 
 
 #rough day
 mde_dragon.0201.t: "Journée difficile"
 mde_dragon.0201.desc.intro: "En entrant dans l’Arène des Dragons, je donne ordre aux Gardiens des Dragons de préparer [ridden_dragon.GetName] et d’équiper ma selle sur [ridden_dragon.Custom('GetDragonHerHim')].\n\n"
 mde_dragon.0201.desc.huge.bad: "Pourtant, ils peinent, certains tremblent visiblement. [ridden_dragon.GetName] est véritablement une énorme bête incontrôlable, [ridden_dragon.Custom('GetDragonSheHe')] gronde contre les Gardiens des Dragons et les secoue comme une poupée d’enfant. Aucun mot en valyrien ni coup de bâton ne parvient à l’apaiser."
 mde_dragon.0201.desc.huge: "Pourtant, ils peinent, [ridden_dragon.GetName] est trop grand et [ridden_dragon.Custom('GetDragonSheHe')] refuse de s’abaisser pour laisser les Gardiens des Dragons faire leur travail."
 mde_dragon.0201.desc.small: "Pourtant, ils peinent, [ridden_dragon.GetName] montre sa vraie nature, claquant des mâchoires vers le Gardien le plus proche et refusant d’écouter leur valyrien."
 mde_dragon.0201.desc.fallback: "Pourtant, ils peinent, [ridden_dragon.GetName] est agité, battant des ailes et s’agitant, ses yeux allant dans toutes les directions."
 mde_dragon.0201.desc.finish: "\n\nJe reste là, stupéfait. Malgré leurs efforts, la selle pend maladroitement, et je regarde en silence leurs tentatives répétées pour l’ajuster correctement sur la bête."
 mde_dragon.0201.a: "Tenter de les aider"
 mde_dragon.0201.toast.a.success: "Tu calmes [ridden_dragon.GetName] et pars pour un vol léger."
 mde_dragon.0201.toast.a.failure: "[ridden_dragon.GetName] se débat contre toi, et tu retournes chez toi."
 mde_dragon.0201.b: "Les regarder galérer"
 mde_dragon.0201.b.f: "À ce rythme, tu ne monteras probablement pas [ridden_dragon.GetName] aujourd’hui."
 mde_dragon.0201.custom_tt.a: "0 "La compétence du Gardien et les traits du Dragon sont pris en compte."
 mde_dragon.0201.c: "Appeler [ridden_dragon.GetName] en Haut Valyrien"
 mde_dragon.0201.toast.c: "0 "Tu calmes [ridden_dragon.GetName] et pars pour un vol léger."
 mde_dragon.0201.a.a: "Tu selles et montes [ridden_dragon.GetName] avec succès"
 mde_dragon.0201.a.b: "Tu te fais secouer"
 mde_dragon.0201.b.a: "Ils réussissent à seller [ridden_dragon.GetName]"
 mde_dragon.0201.b.b: "Ils se blessent pendant le processus"
 
 mde_dragon.0202.desc: "Enfin, la selle est en place, et [ridden_dragon.GetName] est prêt à voler.\n\nMais ce spectacle m’a fait me demander : devrais-je vraiment monter ?"
 
 #higher to a fault
 mde_dragon.0301.t: "Toujours Plus Haut"
 mde_dragon.0301.desc: "#high Comme toujours quand je chevauche [ridden_dragon.GetName], l'air devient plus rare à mesure que nous grimpons. Mon cœur bat plus vite, chaque pulsation résonnant dans ma poitrine comme un tambour de guerre. Le vent mord, mais je peine à le remarquer – je sens chaque fibre de mon être vibrer.\n\nEt je me demande : jusqu'où pouvons-nous aller ?\n\nLe ciel est-il vraiment sans limite pour nous, les Cavaliers de Dragons ? Notre puissance, notre portée, notre habileté sont-elles infinies ?#! "
 mde_dragon.0301.a: "Je dois monter #S plus haut !#!"
 mde_dragon.0301.a.f: "Vous tenterez de grimper plus haut dans les airs."
 mde_dragon.0301.b: "C’est insensé, il est temps de redescendre."
 mde_dragon.0301.b.f: "Vous continuerez sans encombre."
 
 mde_dragon.0302.desc: "#high Alors que je commande à [ridden_dragon.GetName] de s’élever davantage, une douleur lancinante envahit ma tête. J’ai l’impression que [ROOT.Char.GetFaith.DeathDeityName] serre mon crâne de toutes parts, m’empêchant de dépasser mes limites.\n\n[ridden_dragon.GetName] ralentit et s’immobilise dans le ciel, ses ailes tremblantes. Son souffle devient lourd, rauque. Moi-même je lutte – chaque inspiration est un combat, chaque expiration un effort.\n\nMais… est-ce vraiment la limite ?\n\nJe porte le sang de la Maison [ROOT.Char.GetDynastyHouseName] ! Le ciel m’appartient. Je ne faiblis pas. Je règne sur les cieux !#!"
 mde_dragon.0302.a: "#X;bold PLUS HAUT#!"
 mde_dragon.0302.a.f: "Vous deviendrez le maître du ciel."
 mde_dragon.0302.b: "J’ai atteint ma limite..."
 mde_dragon.0302.b.f: "Vous tenterez de redescendre."
 
 mde_dragon.0303.desc: "#high J’ai été humilié, vaincu, et j’en viens à la douloureuse réalité : je ne suis qu’un simple [ROOT.Char.GetWomanMan] mortel. Même après l’atterrissage, ma langue trébuche – les mots se coincent dans ma gorge tandis que mon cœur refuse de ralentir son rythme implacable.\n\nJe me demande si j’aurai jamais le courage d’affronter une telle épreuve à nouveau.#!"
 mde_dragon.0303.a: "Le sol – comme tu m’as manqué !"
 
 mde_dragon.0304.desc: "#high Avant même d’avoir fini de crier l’ordre, [ridden_dragon.GetName] bat des ailes et s’élance vers le haut, nous portant toujours plus haut. Les nuages défilent, révélant un ciel laiteux et infini devant nous. C’est ici que je dois être !\n\nMais soudain, je sens l’eau couler sur mon visage – pas du sang, mais des gouttes qui coulent de mon nez. Ma vision commence à se troubler, pourtant [ridden_dragon.GetName] continue de grimper sans pause. Je dois agir : tirer sur les rênes, crier un ordre – faire n’importe quoi !#!"
 mde_dragon.0304.a: "#X;bold MAÎTRISE TON BESTIAIRE#!"
 mde_dragon.0304.a.f: "Seule la force brute peut te sauver maintenant !"
 mde_dragon.0304.custom_tt.a: "#italic Vos qualités et celles du Dragon ; traits, taille, habileté, etc., sont prises en compte.#!"
 mde_dragon.0304.toast.a: "Vous dominez les cieux !"
 mde_dragon.0304.toast.b: "Vous luttez pour redescendre."
 mde_dragon.0304.toast.c: "Vous souffrez d’hémorragies internes."
 mde_dragon.0304.toast.d: "Un vaisseau sanguin éclate."
 mde_dragon.0304.a.a: "Vous dominez les cieux"
 mde_dragon.0304.a.b: "Vous luttez pour redescendre"
 mde_dragon.0304.a.c: "Vous souffrez d’hémorragies internes"
 mde_dragon.0304.a.d: "Un vaisseau sanguin éclate"
 
 #pay-per-view
 mde_dragon.0401.t: "Pay-Per-View"
 mde_dragon.0401.desc: "#high En me rendant au Dragonpit avec mon courtisan, j’ai assisté à une scène incroyable à notre arrivée : une file de artisans, riches marchands et même de simples paysans s’étendait le long du mur extérieur.\n\nCurieux, je me suis approché – pour découvrir que mes Dragonniers organisaient des visites payantes du Dragonpit. Payantes ! Et bien rémunérées. Ils font payer la promesse d’une « vue sûre et rapprochée » de ce qui se trouve à l’intérieur.\n\nIls ont transformé un lieu sacré en spectacle. Un endroit de feu et d’héritage… désormais une attraction commerciale.#!"
 mde_dragon.0401.a: "C’est un manque total de respect !"
 mde_dragon.0401.a.f: "Vous ferez cesser cette opération."
 mde_dragon.0401.b: "Demander une compensation."
 mde_dragon.0401.c: "Exécuter le Chef des Dragonniers."
 
 mde_dragon.0402.desc: "Enfin, la foule s’est dispersée et je me retrouve seul. [ridden_dragon.GetName] est prêt à être chevauché.\n\nMais ce spectacle m’a fait douter : devrais-je vraiment monter ?"
 
 mde_dragon.0403.desc: "#high Un an s’est écoulé depuis que j’ai autorisé la petite opération de [head_dragonkeeper.GetNameNicknamed] pour vendre des visites du Dragonpit.\n\nEt aujourd’hui, [head_dragonkeeper.GetSheHe] est venu avec ma part des bénéfices en main.\n\nDans l’ensemble, un arrangement tout à fait acceptable.#!"
 mde_dragon.0403.a: "Ça valait bien la peine !"
 mde_dragon.0403.b: "Assez de ça."
 
 #strong gust of wind
 mde_dragon.0501.t: "Une Rafale Violente"
 mde_dragon.0501.desc: "#high Après une envolée rapide, me voilà juché sur [ridden_dragon.GetName]. Comme tant de fois auparavant. Le ciel au-dessus est clair, infini et bleu. Rien ne nous arrête.\n\nPourtant, [ridden_dragon.GetName] n’est pas le plus grand des dragons, et une rafale soudaine et violente nous prend au dépourvu. En un instant, nous spirales vers le sol, le vent rugissant à nos oreilles.\n\nJe serre les rênes de toutes mes forces, les muscles tendus, le cœur battant. Pas le temps de réfléchir – à peine quelques secondes avant l’impact, #s violent. #!#!"
 mde_dragon.0501.a: "Tire sur les rênes de toutes tes forces."
 mde_dragon.0501.custom_tt.a: "#p Tu chevauches avec le vent. #!"
 mde_dragon.0501.b: "Appelle [ridden_dragon.GetName]."
 mde_dragon.0501.custom_tt.b: "#p [ridden_dragon.GetName] entend ton cri ! #!"
 mde_dragon.0501.custom_tt.c: "#n Tu t’écrases au sol. #!"
 
 mde_dragon.0502.desc: "#high Et voilà, nous volons de nouveau au-dessus des champs, les ailes de [ridden_dragon.GetName] battant puissamment sous moi.\n\nLe danger est passé, le ciel nous appartient de nouveau, et je sens que mon lien avec [ridden_dragon.GetName] s’est renforcé.#!"
 mde_dragon.0502.a: "Nous sommes vivants !"
 
 mde_dragon.0503.desc: "#high [ridden_dragon.GetName] ne réagit pas, et [ridden_dragon.Custom('GetDragonSheHe')] tourne sauvagement dans les airs, tombant en cercles désespérés. Aucun battement d’ailes ne peut arrêter la chute, aucun contrôle, aucune grâce, seulement la terrible attraction de la gravité.\n\nCe n’est pas possible, je suis un Cavalier de Dragon ! Je commande les cieux ! Pourtant mon monde explose d’un #italic bruit sourd ! #!\n\n... J’ouvre les yeux, je suis vivant, mais à quel prix ?\n\n[ridden_dragon.GetName] est tordu, meurtri, haletant. Des os dépassent là où ils ne devraient pas. Pourtant, malgré la douleur, [ridden_dragon.Custom('GetDragonSheHe')] commence à boiter et avance vers la maison.#!"
 mde_dragon.0503.a: "#s Aïe... #!"
 
 mde_dragon.0504.desc: "#high Tirer sans relâche ne sert à rien – pire, [ridden_dragon.GetName] tourne de plus en plus vite, en spirale incontrôlable. Ses ailes restent repliées, incapables de se déployer, incapables de capter l’air. Nous tombons de plus en plus vite.\n\nCe n’est pas possible, je suis un Cavalier de Dragon ! Je commande les cieux ! Je tire, je frappe, je crie, rien ne fonctionne.\n\nEn relevant la tête, le sol fonce vers moi, et j’ouvre la bouche une dernière fois...#!"
 mde_dragon.0504.a: "Valar..."
 
 #dragon duel heir
 mde_dragon.0601.t: "Tournant Inattendu"
 mde_dragon.0601.desc: "#strong_glow Alors que [ridden_dragon.GetName] et moi embrassons les vents, comme tant de fois, une ombre au-dessus de nous apparaît puis disparaît.\n\nPourtant, je ne vois que des nuages à perte de vue. Mais peu après, l’ombre revient, et [enemy_dragonrider.GetFirstNameNicknamed] surgit devant moi, chevauchant [enemy_dragon.GetName].\n\n... Même avec le vent qui siffle, j’entends [enemy_dragonrider.GetFirstNameNicknamed] crier : #italic « Ta tyrannie est finie ! »#!#!"
 mde_dragon.0601.a: "#t QUOI ?!#!"
 mde_dragon.0601.a.tt: "#warning Un duel de dragons va commencer.#!"
 mde_dragon.0601.b: "#italic;bold « Je prends le noir ! »#!"
 
 #embarrassing flight
 mde_dragon.0701.t: "Un Vol Pitoyable"
 mde_dragon.0701.desc: "#high J’ai à peine réussi à m’élever dans le ciel.\n\nAvant même que les ailes de mon dragon ne soient complètement déployées, la panique m’a saisi. Le sol disparaît trop vite, le vent hurle trop fort, et la bête sous moi ressemble plus à un monstre incontrôlable qu’à un fidèle destrier.\n\nCe n’est pas moi, je ne sais pas ce qui ne va pas, mais mon corps s’arrête, hésite, panique, et pire, abandonne.#!"
 mde_dragon.0701.a: "Donne des ordres."
 
 mde_dragon.0702.desc.intro: "Je murmure des ordres, faibles et incertains, [ridden_dragon.GetName] hésite, puis amorce un atterrissage maladroit, visiblement mécontent. Je manque presque de tomber en descendant de [ridden_dragon.Custom('GetDragonHerHim')], le cœur battant, les jambes tremblantes."
 mde_dragon.0702.desc.outpit: "\n\nQuelques témoins ont vu ça. J’ai même entendu un rire. Ma cour va assurément en entendre parler. Pire encore, [ridden_dragon.GetName] semble me regarder avec un mépris inquiétant."
 mde_dragon.0702.desc.inpit: "\n\nQuelques Dragonniers ont vu mon atterrissage. J’entends des chuchotements, nul doute que la cour en parlera. Pire encore, [ridden_dragon.GetName] semble me regarder avec un mépris inquiétant."
 mde_dragon.0702.a: "#italic « Débarrasse-moi de ce truc ! »#!"
 mde_dragon.0702.a.f: "Tu cèdes entièrement à ta peur, et ton dragon le sait."
 mde_dragon.0702.b: "#italic « …Au moins, j’ai essayé. »#!"
 mde_dragon.0702.b.f: "Tu essaies de sauver la face, mais les dégâts sont faits."
 
 #beneath the rain
 mde_dragon.0801.t: "Sous la Pluie"
 mde_dragon.0801.desc.inpit: "#high Aujourd’hui, je pars pour une chevauchée sur [ridden_dragon.GetName]. Mais en chemin vers le Dragonpit, le ciel se déchire, et le ciel se met à pleurer. Quand j’atteins enfin mon dragon, je suis confronté à un choix : devons-nous affronter la tempête ?#!"
 mde_dragon.0801.desc.outpit: "#high Aujourd’hui, je pars pour une chevauchée sur [ridden_dragon.GetName]. Mais en chemin vers la tanière de [ridden_dragon.GetHerHis], le ciel se déchire, et le ciel se met à pleurer. Quand j’atteins enfin mon dragon, je suis confronté à un choix : devons-nous affronter la tempête ?#!"
 mde_dragon.0801.desc: "#high \n\nCe n’est un secret pour personne : un vrai Cavalier de Dragon doit être prêt à affronter tous les temps, et une pluie légère comme celle-ci ne représente aucune menace pour nous.\n\nEt pourtant… j’hésite.#!"
 mde_dragon.0801.a: "Je chevaucherai !"
 mde_dragon.0801.b: "Je ferais mieux de rebrousser chemin..."
 mde_dragon.0801.b.f: "Tu ne chevaucheras pas, et tu seras en période de repos."
 
 mde_dragon.0802.desc: "#high Sous la pluie torrentielle, nous fendons le ciel avec une excitation sauvage. C’est presque comme si #S c’était moi #!qui nous guidais dans et hors des nuages d’orage.\n\n[ridden_dragon.GetName] rugit, fend l’obscurité d’une flambée brillante. Voilà – c’est vraiment ça, vivre !\n\nJe crie des ordres au milieu du hurlement de la tempête, je tire sur les rênes quand il faut, et ensemble, nous dansons sous la pluie, maîtrisant chaque virage et chaque plongeon. À chaque manœuvre, nous devenons plus forts, mieux préparés à affronter ce que le monde nous réserve.#!"
 mde_dragon.0802.a: "Quel spectacle !"
 