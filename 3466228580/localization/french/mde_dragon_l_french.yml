l_french:

 #high valyrian
 ANGOS_GLOSS: "Valyrien supérieur pour "Attaque"
 DRAKARYS_GLOSS: "Valyrien supérieur pour "Cracher du feu"
 DEMAS_GLOSS: "Valyrien supérieur pour "Assis"" #Demās"
 SOVES_GLOSS: "Valyrien supérieur pour "Voler"" #Sōvēs"
 LYKIRI_GLOSS: "Valyrien supérieur pour "Reste calme"" #lykirī"
 VEZOT_GLOSS: "Valyrien supérieur pour "En haut"" #vēzot"
 KISAS_GLOSS: "Valyrien supérieur pour "Manger"" #kisās"
#  #  #VALYRIAN #in agot main
 #  DOHAERAS_GLOSS: "High Valyrian for "Serve""
 #  VALAR_DOHAERIS_GLOSS:0 "High Valyrian for "All men must serve" — and a secret code for the Faceless Men."
