#extra needed
 TRAIT_FLAG_DESC_add_size_modifier_40:0 "[dragon_size|E] : @dragon_size_icon!#P +40%#!"
 TRAIT_FLAG_DESC_subtract_size_modifier_40:0 "[dragon_size|E] : @dragon_size_icon!#N -40%#!"

#Traits congénitaux
 trait_dragon_agile: "Agile"
 trait_dragon_agile_desc: "Nul ne nie que les dragons ont un cerveau, et ainsi, comme chez d'autres créatures, ils peuvent être brillants ou idiots."
 trait_dragon_agile_character_desc: "Avec une présence presque énergique à chaque pas, [ROOT.Char.GetFirstNameNoTooltip] est étonnamment vif pour un dragon, un trait qui lui apporte de nombreux avantages."

 trait_dragon_obtuse: "Obtus"
 trait_dragon_obtuse_desc: "Nul ne nie que les dragons ont un cerveau, et ainsi, comme chez d'autres créatures, ils peuvent être brillants ou idiots."
 trait_dragon_obtuse_character_desc: "Défiant et lent à agir. [ROOT.Char.GetFirstNameNoTooltip] obéit uniquement lorsqu'il en a envie et semble délibérément indolent."

 trait_dragon_large_wingspan: "Envergure Large"
 trait_dragon_large_wingspan_desc: "Certains dragons naissent avec une envergure plus imposante, capable de modeler l’air autour d’eux. Ils peuvent plonger et voler plus vite que les autres."
 trait_dragon_large_wingspan_character_desc: "[ROOT.Char.GetFirstNameNoTooltip] est connu pour son immense envergure, sculptant l’air à chaque battement lent et puissant de ses ailes."

 trait_dragon_small_wingspan: "Petite Envergure"
 trait_dragon_small_wingspan_desc: "Certains soupçonnent une origine génétique à la faible envergure de certains dragons. Ils semblent instables dans les airs et ont plus de difficultés."
 trait_dragon_small_wingspan_character_desc: "[ROOT.Char.GetFirstNameNoTooltip] est connu pour ses battements d’ailes courts et rapides, ce qui entrave son envol et le rend instable en vol."

 trait_dragon_thick_scales: "Écailles Épaisses"
 trait_dragon_thick_scales_desc: "Tout comme nous, les dragons naissent avec des écailles de taille et d’épaisseur variables. Les écailles épaisses les protègent des infections et des armes humaines."
 trait_dragon_thick_scales_character_desc: "À y regarder de plus près, les écailles de [ROOT.Char.GetFirstNameNoTooltip] sont incroyablement épaisses, certains disent aussi épaisses que les murs d’un château. Difficile de l’abattre."

 trait_dragon_thin_scales: "Écailles Fines"
 trait_dragon_thin_scales_desc: "Comme chez nous, l’épaisseur des écailles varie d’un dragon à l’autre. Les écailles fines rendent les dragons vulnérables aux infections et autres dangers."
 trait_dragon_thin_scales_character_desc: "Infesté d’infections et grouillant d’insectes logés entre ses écailles fragiles, [ROOT.Char.GetFirstNameNoTooltip] est une créature vulnérable – sensible aux maladies comme aux armes."

 trait_dragon_withered_wings: "Ailes Flétries"
 trait_dragon_withered_wings_desc: "Que ce soit à cause d’un œuf endommagé ou d’autres causes, certains dragons naissent extrêmement fragiles."
 trait_dragon_withered_wings_character_desc: "Maudit par des ailes d’une extrême fragilité, [ROOT.Char.GetFirstNameNoTooltip] peut à peine s’envoler, le rendant presque inutile en toutes choses."

 trait_dragon_glowing_scales: "Écailles Lumineuses"
 trait_dragon_glowing_scales_desc: "Encore un défaut rare de naissance, bien que positif : certains dragons possèdent des écailles aux reflets de verre."
 trait_dragon_glowing_scales_character_desc: "Né avec des écailles épaisses aux reflets de verre, [ROOT.Char.GetFirstNameNoTooltip] reflète la lumière avec une intensité éblouissante, tel un joyau vivant."

 trait_dragon_aerodynamic: "Aérodynamique"
 trait_dragon_aerodynamic_desc: "Bien qu’immenses, les dragons varient dans leur manière de voler. Certains sont maladroits, d’autres fendent l’air comme une flèche."
 trait_dragon_aerodynamic_character_desc: "Avec une forme profilée et une grâce sans effort, [ROOT.Char.GetFirstNameNoTooltip] semble né pour régner sur les cieux, se déplaçant avec une vitesse et une fluidité inégalées."

 trait_dragon_toothless: "Déclinant"
 trait_dragon_toothless_desc: "Une maladie dévorante, capable de corrompre même la plus puissante des bêtes."
 trait_dragon_toothless_character_desc: "Un grand mal ronge [ROOT.Char.GetFirstNameNoTooltip], qui lutte désormais pour voler, respirer et se nourrir."

 trait_dragon_picky_eater: "Difficile"
 trait_dragon_picky_eater_desc: "Les dragons mangent de la viande, mais pas n’importe laquelle. Certains développent des goûts très particuliers, refusant tout ce qui n’est pas leur proie préférée."
 trait_dragon_picky_eater_character_desc: "Facilement irrité lorsqu’il est contrarié, [ROOT.Char.GetFirstNameNoTooltip] est connu pour son extrême exigence alimentaire."

 trait_dragon_green_flames: "Flammes Vertes"
 trait_dragon_green_flames_desc: "Les textes anciens affirment que la couleur des flammes des [dragons_plural|El] reflète leur intensité : certaines sont ternes, d’autres brûlent au-delà de l’imaginable."
 trait_dragon_green_flames_character_desc: "[ROOT.Char.GetFirstNameNoTooltip] est réputé pour ses terrifiantes flammes vertes, capables de tout faire fondre instantanément."

 trait_dragon_blue_flames: "Flammes Bleues"
 trait_dragon_blue_flames_desc: "Les textes anciens affirment que la couleur des flammes des [dragons_plural|El] reflète leur intensité : certaines sont ternes, d’autres brûlent au-delà de l’imaginable."
 trait_dragon_blue_flames_character_desc: "[ROOT.Char.GetFirstNameNoTooltip] est connu pour produire des flammes bleues intenses, semblables à celles qui brillent au cœur d’un brasier."

 trait_dragon_white_flames: "Flammes Blanches"
 trait_dragon_white_flames_desc: "Les textes anciens affirment que la couleur des flammes des [dragons_plural|El] reflète leur intensité : certaines sont ternes, d’autres brûlent au-delà de l’imaginable."
 trait_dragon_white_flames_character_desc: "[ROOT.Char.GetFirstNameNoTooltip] est réputé pour produire des flammes blanches brûlantes, capables d'effacer les armures les plus résistantes."

 trait_dragon_yellow_flames: "Flammes Jaunes"
 trait_dragon_yellow_flames_desc: "Les textes anciens affirment que la couleur des flammes des [dragons_plural|El] reflète leur intensité : certaines sont ternes, d’autres brûlent au-delà de l’imaginable."
 trait_dragon_yellow_flames_character_desc: "[ROOT.Char.GetFirstNameNoTooltip] est connu pour ses flammes jaunes incandescentes, carbonisant tout ce qui s’y trouve."

 trait_dragon_red_flames: "Flammes Rouges"
 trait_dragon_red_flames_desc: "Les textes anciens affirment que la couleur des flammes des [dragons_plural|El] reflète leur intensité : certaines sont ternes, d’autres brûlent au-delà de l’imaginable."
 trait_dragon_red_flames_character_desc: "[ROOT.Char.GetFirstNameNoTooltip] est connu pour ses faibles flammes rouges, à peine capables de brûler ce qu'elles touchent."

 trait_dragon_black_flames: "Flammes Noires"
 trait_dragon_black_flames_desc: "Les textes anciens affirment que la couleur des flammes des [dragons_plural|El] reflète leur intensité : certaines sont ternes, d’autres brûlent au-delà de l’imaginable."
 trait_dragon_black_flames_character_desc: "[ROOT.Char.GetFirstNameNoTooltip] est réputé pour ses mortelles flammes noires, détruisant tout ce qu'elles touchent."

 trait_dragon_orange_flames: "Flammes Oranges"
 trait_dragon_orange_flames_desc: "Les textes anciens affirment que la couleur des flammes des [dragons_plural|El] reflète leur intensité : certaines sont ternes, d’autres brûlent au-delà de l’imaginable."
 trait_dragon_orange_flames_character_desc: "[ROOT.Char.GetFirstNameNoTooltip] est connu pour produire des flammes oranges classiques, brûlant tout sur leur passage."

 trait_dragon_purple_flames: "Flammes Violettes"
 trait_dragon_purple_flames_desc: "Les textes anciens affirment que la couleur des flammes des [dragons_plural|El] reflète leur intensité : certaines sont ternes, d’autres brûlent au-delà de l’imaginable."
 trait_dragon_purple_flames_character_desc: "[ROOT.Char.GetFirstNameNoTooltip] est connu pour produire des flammes violettes explosives, déclenchant des explosions à l’impact."

#Taille

 trait_dragon_physique_good_4: "Bête Astronomique"
 trait_dragon_physique_good_4_desc: "Les légendes exagèrent souvent, mais parfois… une vraie légende naît."
 trait_dragon_physique_good_4_character_desc: "[ROOT.Char.GetFirstNameNoTooltip] dépasse toute imagination. Sa taille impressionnante est vouée à marquer les âges."

 trait_dragon_physique_bad_4: "Dragon Déformé"
 trait_dragon_physique_bad_4_desc: "Né avec un corps affreusement difforme, ce dragon peine à respirer, ses ailes à peine mobiles."
 trait_dragon_physique_bad_4_character_desc: "Depuis l’instant où [ROOT.Char.GetFirstNameNoTooltip] a brisé sa coquille, il semble anormal. Il peine encore à se déplacer, souvent recroquevillé dans une fosse de tristesse."
