l_english:
 afs_maa_city_guard:0 "City Guard"
 afs_maa_city_guard_flavor:0 "Halberdiers paid from the town treasury hold gates and bridges in close order. Their plain colours mark an office rather than a noble house, and every watch begins with a count of sound shafts and sharpened blades."
 afs_can_recruit_city_guard:0 "Personally hold an active Founder’s Seat that recruits City Guard."
 afs_maa_city_garrison:0 "City Garrison"
 afs_maa_city_garrison_flavor:0 "Well-paid garrison soldiers wear fitted plate and open-faced steel helms, equipment bought through the city’s merchants. They are trained to hold a breach without abandoning the streets behind it."
 afs_can_recruit_city_garrison:0 "Personally hold an active Founder’s Seat that recruits City Garrison."
 afs_maa_city_watch:0 "City Watch"
 afs_maa_city_watch_flavor:0 "In quilted coats and battered helmets, these watchmen know every alley of the town they serve. Their modest equipment is kept ready for rioters, raiders, and any enemy who slips through an open gate."
 afs_can_recruit_city_watch:0 "Personally hold an active Founder’s Seat that recruits City Watch."
 afs_maa_wall_crossbowmen:0 "City Wall Guard"
 afs_maa_wall_crossbowmen_flavor:0 "Crossbowmen take their places behind stone parapets, covering the approaches while their fellows span and load. Patient drill and well-kept weapons sustain a measured succession of bolts above the gate."
 afs_can_recruit_wall_crossbowmen:0 "Personally hold an active Founder’s Seat that recruits City Wall Guard."
 afs_maa_sons_and_daughters:0 "Sons and Daughters"
 afs_maa_sons_and_daughters_flavor:0 "When the horn sounds, sons and daughters leave their hearths together. Hide coats, wooden shields and spears tipped with bone or stone must serve where good iron is scarce. They know the broken paths by which their kin can strike and withdraw."
 afs_can_recruit_sons_and_daughters:0 "Personally hold an active Founder’s Seat that recruits Sons and Daughters."
 afs_maa_hunting_band:0 "Hunting Band"
 afs_maa_hunting_band_flavor:0 "The hunters who feed the clan carry short bows of wood and horn, with arrows carefully saved or recovered after a kill. Men and women alike read the tracks beneath the trees. In war, they favour a hidden approach over an exchange of volleys on open ground."
 afs_can_recruit_hunting_band:0 "Personally hold an active Founder’s Seat that recruits Hunting Band."
 afs_maa_clan_retinue:0 "Clan Retinue"
 afs_maa_clan_retinue_flavor:0 "The chief’s trusted companions stand behind stout wooden shields in layered hide and fur. A recovered iron axe is a possession worth guarding, not the issue of a common armoury. Familiar ground and loyalty to their kin hold these veterans together."
 afs_can_recruit_clan_retinue:0 "Personally hold an active Founder’s Seat that recruits Clan Retinue."
 afs_maa_scale_guard:0 "Scale Guard"
 afs_maa_scale_guard_flavor:0 "Descendants of Valyrians and the peoples who lived beside them serve in close ranks of scale, spear, and shield. Their household prizes remembered loyalties, but discipline must still be learned on the drilling ground."
 afs_can_recruit_scale_guard:0 "Personally hold an active Founder’s Seat that recruits Scale Guard."
 afs_maa_ironclad_guard:0 "Ironclad Guard"
 afs_maa_ironclad_guard_flavor:0 "Heavy armour and tall pavises protect these soldiers on a slow advance. Short war picks find gaps that a sword may miss; old Freehold traditions survive beside the practical lessons of many homelands."
 afs_can_recruit_ironclad_guard:0 "Personally hold an active Founder’s Seat that recruits Ironclad Guard."
 afs_maa_fire_adepts:0 "Fire Adepts"
 afs_maa_fire_adepts_flavor:0 "Keepers of guarded fire lore travel with braziers, incendiary jars, and siege crews. Whatever their whispered rites may promise, it is prepared fuel, protected approaches, and patient work that threaten a fortress gate."
 afs_can_recruit_fire_adepts:0 "Personally hold an active Founder’s Seat that recruits Fire Adepts."
 afs_maa_household_knights:0 "Household Knights"
 afs_maa_household_knights_flavor:0 "Mail-clad riders owe their place to years of service within the household. Behind plain kite shields, they keep their lances steady until the command to charge carries down the line."
 afs_can_recruit_household_knights:0 "Personally hold an active Founder’s Seat that recruits Household Knights."
 afs_maa_household_infantry:0 "Household Infantry"
 afs_maa_household_infantry_flavor:0 "These sworn foot soldiers live by the household’s pay and reputation. Maintained mail, serviceable swords, and familiar comrades make their shield line steadier than a hurried levy."
 afs_can_recruit_household_infantry:0 "Personally hold an active Founder’s Seat that recruits Household Infantry."
 afs_maa_sworn_spears:0 "Sworn Spears"
 afs_maa_sworn_spears_flavor:0 "A sound spear and a steady shield are enough in disciplined hands. These companies practise closing ranks against horsemen and guarding the narrow paths by which an army must pass."
 afs_can_recruit_sworn_spears:0 "Personally hold an active Founder’s Seat that recruits Sworn Spears."
 afs_maa_household_bowmen:0 "Household Bowmen"
 afs_maa_household_bowmen_flavor:0 "Chosen bowmen train throughout the year with carefully seasoned bows. Their household supplies sound arrows and time to practise, turning a familiar craft into a reliable instrument of war."
 afs_can_recruit_household_bowmen:0 "Personally hold an active Founder’s Seat that recruits Household Bowmen."
 afs_maa_sharpshooters:0 "Sharpshooters"
 afs_maa_sharpshooters_flavor:0 "Veteran crossbowmen value a clear shot more than a hurried volley. Well-kept mechanisms and measured aim let them threaten armoured foes, though they need room and protection to reload."
 afs_can_recruit_sharpshooters:0 "Personally hold an active Founder’s Seat that recruits Sharpshooters."
 afs_maa_lords_riders:0 "Lords’ Riders"
 afs_maa_lords_riders_flavor:0 "Lightly equipped riders carry orders, screen the household’s march, and follow a broken enemy. Their loyalty is tested as often on lonely roads as beneath the noise of battle."
 afs_can_recruit_lords_riders:0 "Personally hold an active Founder’s Seat that recruits Lords’ Riders."
 afs_maa_warriors_sons:0 "Warrior’s Sons"
 afs_maa_warriors_sons_flavor:0 "Sworn to the Seven, these armoured devotees carry the old name of the Warrior’s Sons. A subdued rainbow gleams across their polished steel; their vows demand courage long after the splendour of ceremony has faded."
 afs_can_recruit_warriors_sons:0 "Personally hold an active Founder’s Seat that recruits Warrior’s Sons."
 afs_maa_poor_fellows:0 "Poor Fellows"
 afs_maa_poor_fellows_flavor:0 "Armed pilgrims in rough habits guard the roads and the faithful who walk them. Few possess fine armour, but shared vows and long journeys have taught these Poor Fellows to endure hardship together."
 afs_can_recruit_poor_fellows:0 "Personally hold an active Founder’s Seat that recruits Poor Fellows."
 afs_maa_old_gods_wardens:0 "Wardens of the Old Gods"
 afs_maa_old_gods_wardens_flavor:0 "Quiet archers keep watch near the old sacred groves. They know where roots conceal a footpath and where a bow can be drawn unseen; their arrows require no miracle to find an intruder."
 afs_can_recruit_old_gods_wardens:0 "Personally hold an active Founder’s Seat that recruits Wardens of the Old Gods."
 afs_maa_free_company_veterans:0 "Free Company Veterans"
 afs_maa_free_company_veterans_flavor:0 "Survivors of distant contracts bring mismatched weapons and a common knowledge of war. Their pay buys experience rather than affection, yet a reputable captain knows the worth of keeping an oath."
 afs_can_recruit_free_company_veterans:0 "Personally hold an active Founder’s Seat that recruits Free Company Veterans."
 afs_maa_keepers_of_the_word:0 "Keepers of the Word"
 afs_maa_keepers_of_the_word_flavor:0 "Scholars, lay brothers, and learned attendants drill to protect the people and writings entrusted to them. Padded coats and simple weapons serve where a locked library door no longer suffices."
 afs_can_recruit_keepers_of_the_word:0 "Personally hold an active Founder’s Seat that recruits Keepers of the Word."
 afs_maa_shadow_guard:0 "Shadow Guard"
 afs_maa_shadow_guard_flavor:0 "Hooded guards in blackened mail stand where visitors are not invited to linger. Their unsettling silence hides ordinary, well-trained soldiers whose strength lies in preparation rather than any power of darkness."
 afs_can_recruit_shadow_guard:0 "Personally hold an active Founder’s Seat that recruits Shadow Guard."
 afs_maa_tidebound_reavers:0 "Tidebound Reavers"
 afs_maa_tidebound_reavers_flavor:0 "Salt-stained mail and broad shields protect experienced shipboard fighters. They practise holding quays and narrow landings, keeping their footing where water hems in an enemy. Far from the coast, steep uplands and tangled northern woods offer less familiar ground."
 afs_can_recruit_tidebound_reavers:0 "Personally hold an active Founder’s Seat that recruits Tidebound Reavers."
 afs_maa_marsh_stalkers:0 "Marsh Stalkers"
 afs_maa_marsh_stalkers_flavor:0 "Hunters of reed beds and flooded woods travel lightly, carrying short bows above the water. They watch raised paths and concealed crossings, striking where a stranger can scarcely find firm ground."
 afs_can_recruit_marsh_stalkers:0 "Personally hold an active Founder’s Seat that recruits Marsh Stalkers."
 afs_maa_quarry_wardens:0 "Quarry Wardens"
 afs_maa_quarry_wardens_flavor:0 "The wardens of the stone roads guard quarries, bridges, and mountain cuttings. Long spears and patient formation drill make them difficult to shift from the narrow ground on which their livelihood depends."
 afs_can_recruit_quarry_wardens:0 "Personally hold an active Founder’s Seat that recruits Quarry Wardens."
 afs_maa_mine_wardens:0 "Mine Wardens"
 afs_maa_mine_wardens_flavor:0 "Paid from the workings they protect, these mailed guards carry stout shields and short axes. They escort valuable ore and hold the mine approaches, where a broken line can cost a lord an entire season’s revenue."
 afs_can_recruit_mine_wardens:0 "Personally hold an active Founder’s Seat that recruits Mine Wardens."
 afs_maa_caravan_riders:0 "Caravan Riders"
 afs_maa_caravan_riders_flavor:0 "Experienced outriders ride ahead of wagons and pack trains, learning the wells and tracks between distant markets. Their employers prize a warning delivered in time more than a reckless charge."
 afs_can_recruit_caravan_riders:0 "Personally hold an active Founder’s Seat that recruits Caravan Riders."
 afs_maa_frostbound_spears:0 "Frostbound Spears"
 afs_maa_frostbound_spears_flavor:0 "Fur and layered hides shelter the watchers of the northern stores. Their spears bear bone, stone and a handful of recovered iron points. Careful provisions and knowledge of snowbound paths sustain their watch when less prepared armies begin to falter."
 afs_can_recruit_frostbound_spears:0 "Personally hold an active Founder’s Seat that recruits Frostbound Spears."
 afs_maa_vault_sentinels:0 "Vault Sentinels"
 afs_maa_vault_sentinels_flavor:0 "Chosen guards keep the keys to vaults of fused stone and chambers of old learning. Their ancestry is varied and their equipment carefully maintained; neither a precious text nor a dangerous relic is left to an untested watch."
 afs_can_recruit_vault_sentinels:0 "Personally hold an active Founder’s Seat that recruits Vault Sentinels."
 afs_maa_barrow_wardens:0 "Barrow Wardens"
 afs_maa_barrow_wardens_flavor:0 "Small bone tokens fasten the hide cloaks of those who watch their ancestors’ resting places. Wooden shields and a few treasured iron blades discourage grave robbers. These are living guardians, bound to familiar ground by memory and duty."
 afs_can_recruit_barrow_wardens:0 "Personally hold an active Founder’s Seat that recruits Barrow Wardens."
 afs_maa_dothraki_bowriders:0 "Dothraki Bowriders"
 afs_maa_dothraki_bowriders_flavor:0 "Far from their khalasars, these hired riders still measure distance from the saddle. Short recurved bows and remounts let them harry an exposed enemy; a contract buys their service, not the submission of the Dothraki Sea."
 afs_can_recruit_dothraki_bowriders:0 "Personally hold an active Founder’s Seat that recruits Dothraki Bowriders."
 afs_maa_ghiscari_guard:0 "Ghiscari Guard"
 afs_maa_ghiscari_guard_flavor:0 "Free soldiers from the cities of Ghis drill behind broad shields and long spears. Their captains preserve the measured tread of the old legions, demanding obedience by oath and pay rather than the making of Unsullied."
 afs_can_recruit_ghiscari_guard:0 "Personally hold an active Founder’s Seat that recruits Ghiscari Guard."
 afs_maa_sarnori_guard:0 "Sarnori Guard"
 afs_maa_sarnori_guard_flavor:0 "Descendants of the Tall Men keep their companies together in foreign service. Scale, mail and bright-edged swords recall the cities of Sarnor; their banners bear the company’s colours instead of claiming a vanished kingdom."
 afs_can_recruit_sarnori_guard:0 "Personally hold an active Founder’s Seat that recruits Sarnori Guard."
 afs_maa_rhoynish_bowmen:0 "Rhoynish Bowmen"
 afs_maa_rhoynish_bowmen_flavor:0 "Archers of Rhoynish descent guard boats, crossings and riverside paths. Woven bands recall Mother Rhoyne, while practical bows and patient scouting sustain traditions carried far beyond her banks."
 afs_can_recruit_rhoynish_bowmen:0 "Personally hold an active Founder’s Seat that recruits Rhoynish Bowmen."
 afs_maa_rosehip_lances:0 "Rosehip Lances"
 afs_maa_rosehip_lances_flavor:0 "Rose engravings curl over polished helms and the fittings of well-bred chargers. These household riders are raised among Rosehip’s lists and gardens, where grace in ceremony must be matched by a steady lance in war."
 afs_can_recruit_rosehip_lances:0 "Personally hold an active Founder’s Seat that recruits Rosehip Lances."
 afs_maa_dawnspire_cavaliers:0 "Dawnspire Cavaliers"
 afs_maa_dawnspire_cavaliers_flavor:0 "The lists beneath Dawnspire train riders to keep their places under pressure. Well-fitted armour and carefully chosen horses serve them beyond the tourney rail, where no herald calls an end to the charge."
 afs_can_recruit_dawnspire_cavaliers:0 "Personally hold an active Founder’s Seat that recruits Dawnspire Cavaliers."
 afs_maa_thornveil_riders:0 "Thornveil Riders"
 afs_maa_thornveil_riders_flavor:0 "Dark thornwork ornaments the armour of Thornveil’s trusted riders. They escort private messengers and guard the household on campaign, keeping its confidences with the same discipline as its battle line."
 afs_can_recruit_thornveil_riders:0 "Personally hold an active Founder’s Seat that recruits Thornveil Riders."
 afs_maa_golden_spurs:0 "Golden Spurs"
 afs_maa_golden_spurs_flavor:0 "Mine revenues maintain these armoured riders and their powerful horses. Gilded fittings proclaim their patron’s wealth, but constant drill is the more valuable part of their equipment."
 afs_can_recruit_golden_spurs:0 "Personally hold an active Founder’s Seat that recruits Golden Spurs."
 afs_maa_longgate_halberdiers:0 "Longgate Halberdiers"
 afs_maa_longgate_halberdiers_flavor:0 "Longgate’s gate companies train with halberds beneath the shadow of their own walls. Hook, point and blade give them an answer to a mounted intruder, provided their ranks remain unbroken."
 afs_can_recruit_longgate_halberdiers:0 "Personally hold an active Founder’s Seat that recruits Longgate Halberdiers."
 afs_maa_redbanner_arbalesters:0 "Redbanner Arbalesters"
 afs_maa_redbanner_arbalesters_flavor:0 "Heavy crossbows are kept dry in the redoubt’s guarded stores. Their crews practise from prepared positions, covering broken approaches while shield-bearing companions watch for an enemy rush."
 afs_can_recruit_redbanner_arbalesters:0 "Personally hold an active Founder’s Seat that recruits Redbanner Arbalesters."
 afs_maa_yewguard_longbowmen:0 "Yewguard Longbowmen"
 afs_maa_yewguard_longbowmen_flavor:0 "Selected yew is seasoned under the lodge’s watch and worked into tall war bows. Its chosen bowmen train through the year, supplied with arrows whose making is as carefully judged as their shooting."
 afs_can_recruit_yewguard_longbowmen:0 "Personally hold an active Founder’s Seat that recruits Yewguard Longbowmen."
 afs_maa_hartwood_rangers:0 "Hartwood Rangers"
 afs_maa_hartwood_rangers_flavor:0 "Trackers from the hunting grounds leave their hearths in small, familiar bands. They carry war arrows beside their hunting tackle, using patience and sheltered paths to protect the lands that feed them."
 afs_can_recruit_hartwood_rangers:0 "Personally hold an active Founder’s Seat that recruits Hartwood Rangers."
 afs_maa_amber_outriders:0 "Amber Road Outriders"
 afs_maa_amber_outriders_flavor:0 "Amber merchants pay for warning as readily as for steel. These outriders watch the road ahead of the household’s baggage and return swiftly when dust on the horizon proves to be more than another caravan."
 afs_can_recruit_amber_outriders:0 "Personally hold an active Founder’s Seat that recruits Amber Road Outriders."
 afs_maa_pearl_coast_lancers:0 "Pearl Coast Lancers"
 afs_maa_pearl_coast_lancers_flavor:0 "Light lancers guard the roads between the pearl markets and sheltered landings. Their horses carry modest armour and ample endurance, suited to escort and pursuit rather than a heavy knight’s collision."
 afs_can_recruit_pearl_coast_lancers:0 "Personally hold an active Founder’s Seat that recruits Pearl Coast Lancers."
 afs_maa_hearthshield_women:0 "Hearthshield Women"
 afs_maa_hearthshield_women_flavor:0 "These women have sworn to defend the hearths that shelter their kin. Thick hides and rawhide-bound shields are repaired through many winters; a few carry iron blades taken in raids. They fight beside familiar companions, with little taste for a lord’s formal battle line."
 afs_can_recruit_hearthshield_women:0 "Personally hold an active Founder’s Seat that recruits Hearthshield Women."
 afs_maa_flintfang_spears:0 "Flintfang Spears"
 afs_maa_flintfang_spears_flavor:0 "Flint points are knapped and bound to sound wooden shafts beneath the timber ring. Bone serves where stone is lacking, and captured iron is passed to a trusted hand. From a rocky approach, the clan can present many points to an enemy with little room to advance."
 afs_can_recruit_flintfang_spears:0 "Personally hold an active Founder’s Seat that recruits Flintfang Spears."
 afs_maa_blacktusk_axemen:0 "Blacktusk Axemen"
 afs_maa_blacktusk_axemen_flavor:0 "The rampart’s seasoned raiders treasure the iron axe heads brought home from past forays. Fresh hafts and repeated sharpening keep them useful long after finer gear has failed. Heavy hides and broad wooden shields protect a close assault through broken woodland."
 afs_can_recruit_blacktusk_axemen:0 "Personally hold an active Founder’s Seat that recruits Blacktusk Axemen."
 afs_maa_ashscale_hammerers:0 "Ashscale Hammerers"
 afs_maa_ashscale_hammerers_flavor:0 "The armoury equips these guards with compact war hammers and carefully fitted plates. Their steel is the patient work of living smiths, not a promise that the secrets of Valyrian steel have returned."
 afs_can_recruit_ashscale_hammerers:0 "Personally hold an active Founder’s Seat that recruits Ashscale Hammerers."
 afs_maa_cinderwing_guard:0 "Cinderwing Guard"
 afs_maa_cinderwing_guard_flavor:0 "Long spears and high shields mark the guards of the aerie’s outer gates. They keep crowds from the keeper passages and hold a disciplined line in war; tending dragons remains the keepers’ dangerous craft."
 afs_can_recruit_cinderwing_guard:0 "Personally hold an active Founder’s Seat that recruits Cinderwing Guard."
 afs_maa_silent_quay_marksmen:0 "Silent Quay Marksmen"
 afs_maa_silent_quay_marksmen_flavor:0 "Quiet watches overlook the harbour approaches, where crossbow crews learn to judge distance against wind and water. Unmarked pavises shelter their work without advertising the household’s business to every passing sail."
 afs_can_recruit_silent_quay_marksmen:0 "Personally hold an active Founder’s Seat that recruits Silent Quay Marksmen."
 afs_maa_masons_mangonels:0 "Masons’ Mangonels"
 afs_maa_masons_mangonels_flavor:0 "The lodge’s crews know how stone bears weight—and where a wall will cease to bear it. Measured shot, sound timber and patient labour make a breach where a rash assault would leave only bodies."
 afs_can_recruit_masons_mangonels:0 "Personally hold an active Founder’s Seat that recruits Masons’ Mangonels."
 afs_maa_basalt_trebuchets:0 "Basalt Trebuchets"
 afs_maa_basalt_trebuchets_flavor:0 "Heavy counterweights rise between dark timber frames. The vaults supply rope, iron fittings and carefully dressed shot; a long arm does the rest. These engines demand firm ground and a well-fed train of labourers."
 afs_can_recruit_basalt_trebuchets:0 "Personally hold an active Founder’s Seat that recruits Basalt Trebuchets."
 afs_maa_children_of_the_bough:0 "Children of the Bough"
 afs_maa_children_of_the_bough_flavor:0 "Small figures move beneath the white boughs, their leaf-work garments breaking the outline of an ancient people. Obsidian points and short bows guard the paths they still remember. This rare fellowship answers an old pact, not a lord’s levy call."
 afs_can_recruit_children_of_the_bough:0 "Personally hold an active Founder’s Seat that recruits Children of the Bough."
 afs_maa_elder_giant_riders:0 "Giants of the Elder Pact"
 afs_maa_elder_giant_riders_flavor:0 "Woolly giants travel beside their mammoths beneath the old pact’s protection. Their strength and the weight of their mammoths help siege crews clear obstacles and batter gates. They serve as rare siege support, and feeding such companions is no small undertaking. They are allies of the grove, not beasts bred for a lord’s stable."
 afs_can_recruit_elder_giant_riders:0 "Personally hold an active Founder’s Seat that recruits Giants of the Elder Pact."
 afs_maa_jade_coast_elephants:0 "Jade Coast Elephants"
 afs_maa_jade_coast_elephants_flavor:0 "Merchants have brought these trained elephants and their keepers west from the eastern coasts. Their arrival empties granaries and fills streets with onlookers. On open ground their weight is formidable; on a mountain track, it becomes a burden."
 afs_can_recruit_jade_coast_elephants:0 "Personally hold an active Founder’s Seat that recruits Jade Coast Elephants."
 afs_maa_ibbenese_harpooners:0 "Ibbenese Harpooners"
 afs_maa_ibbenese_harpooners_flavor:0 "Broad, weathered sailors from Ibben hire out between voyages. Long boat-spears and stout shields serve them on quays as well as decks. Their captains bargain plainly: sound coin, hot food, and no promises about dying cheaply."
 afs_can_recruit_ibbenese_harpooners:0 "Personally hold an active Founder’s Seat that recruits Ibbenese Harpooners."
 afs_maa_skagosi_stoneborn:0 "Skagosi Stoneborn"
 afs_maa_skagosi_stoneborn_flavor:0 "Hard companions from Skagos carry dark shields and axes worn smooth by use. Outsiders bring tales of their island; the warriors offer little encouragement and fewer explanations. In broken country, it is wiser to watch their hands than to repeat a sailor’s story."
 afs_can_recruit_skagosi_stoneborn:0 "Personally hold an active Founder’s Seat that recruits Skagosi Stoneborn."
 afs_maa_rosehip_garden_guard:0 "Rosehip Garden Guard"
 afs_maa_rosehip_garden_guard_flavor:0 "Small roses are worked into the fittings of the garden guard’s helms. Their long spears keep the gates, lists and market lanes orderly. Beneath the courtesy of a noble welcome stands a company taught never to open its ranks."
 afs_can_recruit_rosehip_garden_guard:0 "Personally hold an active Founder’s Seat that recruits Rosehip Garden Guard."
 afs_maa_stormwatch_boltmen:0 "Stormwatch Boltmen"
 afs_maa_stormwatch_boltmen_flavor:0 "Bowstrings are waxed and spare cords kept beneath oilcloth at Stormwatch. The crews learn patience during foul weather, taking sheltered positions above the approaches. A clear interval in the rain is sometimes all the warning an attacker receives."
 afs_can_recruit_stormwatch_boltmen:0 "Personally hold an active Founder’s Seat that recruits Stormwatch Boltmen."
 afs_maa_cloudbreak_spears:0 "Cloudbreak Spears"
 afs_maa_cloudbreak_spears_flavor:0 "The citadel’s companies know every turn of the climbing road. Short steps, braced shields and long spear points make the ascent costly. Their pride lies in holding a ledge, not in chasing cavalry across a summer plain."
 afs_can_recruit_cloudbreak_spears:0 "Personally hold an active Founder’s Seat that recruits Cloudbreak Spears."
 afs_maa_silverhand_payguard:0 "Silverhand Payguard"
 afs_maa_silverhand_payguard_flavor:0 "The mine’s pay chests travel under sober guard. Silver wire marks an officer’s scabbard, but the company spends its money on sound mail and broad shields. Missing coin can be replaced; a reputation for losing it cannot."
 afs_can_recruit_silverhand_payguard:0 "Personally hold an active Founder’s Seat that recruits Silverhand Payguard."
 afs_maa_amber_oath_spears:0 "Amber Oath Spears"
 afs_maa_amber_oath_spears_flavor:0 "Amber beads hang beneath the company’s plain collars, tokens of service sworn before the hall. They guard its gatherings and the roads that supply them. The beads are kept out of sight in battle; the spear points are not."
 afs_can_recruit_amber_oath_spears:0 "Personally hold an active Founder’s Seat that recruits Amber Oath Spears."
 afs_maa_saffron_outriders:0 "Saffron Outriders"
 afs_maa_saffron_outriders_flavor:0 "A pouch of saffron may be worth more than the horse that carries it. These riders escort the harvest and scout the roads beyond the citadel, wearing faded yellow wraps against dust. Speed preserves both cargo and men."
 afs_can_recruit_saffron_outriders:0 "Personally hold an active Founder’s Seat that recruits Saffron Outriders."
 afs_maa_tinvein_shields:0 "Tinvein Shields"
 afs_maa_tinvein_shields_flavor:0 "Tin from the workings buys iron for those who guard them. The company carries compact axes and deep shields through the mine roads, where a narrow cutting can be defended by a few determined men. Their trade is protection, not pageantry."
 afs_can_recruit_tinvein_shields:0 "Personally hold an active Founder’s Seat that recruits Tinvein Shields."
 afs_maa_millwheel_billmen:0 "Millwheel Billmen"
 afs_maa_millwheel_billmen_flavor:0 "The demesne keeps proper bills in its stores beside the tools of harvest. Millers’ sons and tenant veterans drill between their duties, paid to defend the grain that feeds them. A hooked blade is no courtly weapon, but it is an honest answer to a raider."
 afs_can_recruit_millwheel_billmen:0 "Personally hold an active Founder’s Seat that recruits Millwheel Billmen."
 afs_maa_alumscar_crossbows:0 "Alumscar Crossbows"
 afs_maa_alumscar_crossbows_flavor:0 "The manor’s dye and alum trade supports a small company of crossbowmen. Their muted coats are practical work rather than bright heraldry. Behind prepared cover they can make an expensive cargo uncommonly difficult to steal."
 afs_can_recruit_alumscar_crossbows:0 "Personally hold an active Founder’s Seat that recruits Alumscar Crossbows."
 afs_maa_nightshade_knives:0 "Nightshade Knives"
 afs_maa_nightshade_knives_flavor:0 "The conservatory’s quiet escorts carry short blades under dark coats. They watch doors, alleys and garden walls with equal care. Their reputation travels further than their voices; on an open battlefield, reputation is a poor shield."
 afs_can_recruit_nightshade_knives:0 "Personally hold an active Founder’s Seat that recruits Nightshade Knives."
 afs_maa_blackwax_blades:0 "Blackwax Blades"
 afs_maa_blackwax_blades_flavor:0 "Sealed orders pass through the chancery under armed escort. These mailed guards ask whose seal a message bears, not whether its contents please them. Blackened fittings keep their equipment plain and their attention on the road."
 afs_can_recruit_blackwax_blades:0 "Personally hold an active Founder’s Seat that recruits Blackwax Blades."
 afs_maa_gloamward_lanterns:0 "Gloamward Lanterns"
 afs_maa_gloamward_lanterns_flavor:0 "At dusk the watch lights its hooded lanterns and counts the doors left open. Short spears and cudgels serve in streets too narrow for a lord’s charge. By morning, those streets should belong to their inhabitants again."
 afs_can_recruit_gloamward_lanterns:0 "Personally hold an active Founder’s Seat that recruits Gloamward Lanterns."
 afs_maa_velvet_duellists:0 "Velvet Duellists"
 afs_maa_velvet_duellists_flavor:0 "Fine sleeves conceal callused sword hands. The court’s retainers practise with sword and buckler, settling danger before it reaches the inner rooms. They are graceful in a doorway and less comfortable beneath a storm of arrows."
 afs_can_recruit_velvet_duellists:0 "Personally hold an active Founder’s Seat that recruits Velvet Duellists."
 afs_maa_sevenstar_protectors:0 "Sevenstar Protectors"
 afs_maa_sevenstar_protectors_flavor:0 "Seven-pointed stars mark the shields beneath the sept’s walls. These sworn defenders stand between pilgrims and those who would prey upon them. Their prayers are brief when the gates close; their spears are long."
 afs_can_recruit_sevenstar_protectors:0 "Personally hold an active Founder’s Seat that recruits Sevenstar Protectors."
 afs_maa_gentle_hand_escorts:0 "Gentle Hand Escorts"
 afs_maa_gentle_hand_escorts_flavor:0 "The temple’s escorts keep patients, healers and supply carts from harm. Padded coats and broad shields matter more to them than a trophy taken in pursuit. Bringing the wounded home is counted as service well performed."
 afs_can_recruit_gentle_hand_escorts:0 "Personally hold an active Founder’s Seat that recruits Gentle Hand Escorts."
 afs_maa_ravenry_pathfinders:0 "Ravenry Pathfinders"
 afs_maa_ravenry_pathfinders_flavor:0 "Not every message can be trusted to a raven. These bowmen guide couriers through wooded passes and remember the paths beneath the mist. They carry plain feathers in their caps, not a promise that a bird will warn them of every ambush."
 afs_can_recruit_ravenry_pathfinders:0 "Personally hold an active Founder’s Seat that recruits Ravenry Pathfinders."
 afs_maa_fossil_crown_spears:0 "Fossil Crown Spears"
 afs_maa_fossil_crown_spears_flavor:0 "The priory’s guardians watch the paths used by scholars, pilgrims and stone-cutters. Old shells decorate a few fittings; the spearheads are ordinary steel. Whatever sleeps in the rock, living travellers remain their charge."
 afs_can_recruit_fossil_crown_spears:0 "Personally hold an active Founder’s Seat that recruits Fossil Crown Spears."
 afs_maa_emberglass_wardens:0 "Emberglass Wardens"
 afs_maa_emberglass_wardens_flavor:0 "The archive’s armed keepers escort sealed caskets and bar the doors to forbidden rooms. Dull red cloth breaks the black of their armour. They defend the records of the Freehold with living skill, not weapons conjured from its ashes."
 afs_can_recruit_emberglass_wardens:0 "Personally hold an active Founder’s Seat that recruits Emberglass Wardens."
 afs_maa_brimstone_boltmen:0 "Brimstone Boltmen"
 afs_maa_brimstone_boltmen_flavor:0 "The retort keeps its watch at a prudent distance from the sulphur stores and furnace fires. Crossbow crews cover the outer approaches while labourers work behind them. Their bolts are ordinary iron; the danger inside the walls needs no embellishment."
 afs_can_recruit_brimstone_boltmen:0 "Personally hold an active Founder’s Seat that recruits Brimstone Boltmen."
 afs_maa_sailcloth_marines:0 "Sailcloth Marines"
 afs_maa_sailcloth_marines_flavor:0 "Coarse canvas coats and light shields suit the close fighting of a quay. These marines guard sail lofts, cargo and the men who work them. They know how to hold a gangway, and when to cut one loose."
 afs_can_recruit_sailcloth_marines:0 "Personally hold an active Founder’s Seat that recruits Sailcloth Marines."
 afs_maa_redkiln_hammermen:0 "Redkiln Hammermen"
 afs_maa_redkiln_hammermen_flavor:0 "The borough’s guilds equip their guard with mail, shields and compact war hammers. Red dust clings to the hems of their coats. The kiln workers make the bricks; these men ensure the walls remain in friendly hands."
 afs_can_recruit_redkiln_hammermen:0 "Personally hold an active Founder’s Seat that recruits Redkiln Hammermen."
 afs_maa_oathfire_bronzes:0 "Oathfire Bronze Guard"
 afs_maa_oathfire_bronzes_flavor:0 "A few old bronze helms shine among the hides gathered at the oath fire. Some were traded, some inherited, and all are carefully kept. The guard’s strength is the promise made between companions, not a common armoury full of matching gear."
 afs_can_recruit_oathfire_bronzes:0 "Personally hold an active Founder’s Seat that recruits Oathfire Bronze Guard."
 afs_maa_hidehearth_clubmen:0 "Hidehearth Clubmen"
 afs_maa_hidehearth_clubmen_flavor:0 "Heavy wooden clubs cost no precious iron. The camp’s seasoned fighters carry them with hide shields and patched winter coats, closing by familiar paths before an enemy can bring its line to bear. They have little reason to seek an open field."
 afs_can_recruit_hidehearth_clubmen:0 "Personally hold an active Founder’s Seat that recruits Hidehearth Clubmen."
