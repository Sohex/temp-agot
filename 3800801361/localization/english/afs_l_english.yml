 building_afs_stagdrum_hall_01_desc:0 "Antler-carved gables crown a vast timber hall behind stout palisades. Great drums summon scattered households to councils and musters, turning shared feasts, songs, and sworn promises into loyalty to the ruling family."
 building_type_afs_emberglass_archive_01:0 "Emberglass Archive"
 building_type_afs_emberglass_archive_01_desc:0 "An ancient fused-stone archive has been restored around sealed manuscript vaults. Scribes gather fragments of the Freehold and compare surviving copies, building a collection whose scholarship brings renown to its patron."
 building_afs_emberglass_archive_01:0 "Emberglass Archive"
 building_afs_emberglass_archive_01_desc:0 "An ancient fused-stone archive has been restored around sealed manuscript vaults. Scribes gather fragments of the Freehold and compare surviving copies, building a collection whose scholarship brings renown to its patron. Rare manuscripts and their careful preservation demand continuing patronage."
 building_type_afs_wyrmrest_terraces_01:0 "Wyrmrest Terraces"
 building_type_afs_wyrmrest_terraces_01_desc:0 "Warm stone terraces shelter a dragonpit devoted to the care of ailing dragons. Experienced keepers clean wounds, prepare fresh meat, and watch over their charges through quiet nights. Broad landing courts give recovering wings room to stretch beneath the old tower."
 building_afs_wyrmrest_terraces_01:0 "Wyrmrest Terraces"
 building_afs_wyrmrest_terraces_01_desc:0 "Warm stone terraces shelter a dragonpit devoted to the care of ailing dragons. Experienced keepers clean wounds, prepare fresh meat, and watch over their charges through quiet nights. Broad landing courts give recovering wings room to stretch beneath the old tower. Fresh carcasses, medicines, and experienced keepers make this a costly refuge."
 building_type_afs_ashscale_armoury_01:0 "Ashscale Armoury"
 building_type_afs_ashscale_armoury_01_desc:0 "Scale-carved gates guard ancient weapon vaults and extensive armourers' courts. Carefully fitted armour, disciplined drill, and well-kept stores sustain a formidable household guard without wasting the treasury on poor equipment."
 building_afs_ashscale_armoury_01:0 "Ashscale Armoury"
 building_afs_ashscale_armoury_01_desc:0 "Scale-carved gates guard ancient weapon vaults and extensive armourers' courts. Carefully fitted armour, disciplined drill, and well-kept stores sustain a formidable household guard without wasting the treasury on poor equipment. Metal, leather, and skilled labour require a modest standing allowance."
 building_type_afs_smokestone_vault_01:0 "Smokestone Vault"
 building_type_afs_smokestone_vault_01_desc:0 "Heavy doors seal a treasury within an ancient stronghold of fused stone. Guarded counting rooms collect revenues from the surrounding estates, while trusted keepers watch the passages as closely as they watch the ledgers."
 building_afs_smokestone_vault_01:0 "Smokestone Vault"
 building_afs_smokestone_vault_01_desc:0 "Heavy doors seal a treasury within an ancient stronghold of fused stone. Guarded counting rooms collect revenues from the surrounding estates, while trusted keepers watch the passages as closely as they watch the ledgers."
 building_type_afs_amber_oath_hall_01:0 "Amber Oath Hall"
 building_type_afs_amber_oath_hall_01_desc:0 "Amber beads gleam above a hall where old feuds are settled before sworn witnesses. Guests surrender their weapons at the outer gate; breaking bread here binds a lord more tightly than any written promise."
 building_afs_amber_oath_hall_01:0 "Amber Oath Hall"
 building_afs_amber_oath_hall_01_desc:0 "Amber beads gleam above a hall where old feuds are settled before sworn witnesses. Guests surrender their weapons at the outer gate; breaking bread here binds a lord more tightly than any written promise."
 building_type_afs_pearlwater_pavilion_01:0 "Pearlwater Pavilion"
 building_type_afs_pearlwater_pavilion_01_desc:0 "Pearl merchants bargain beneath carved sea arches while envoys wait in cool chambers above. A gracious reception can win what threats cannot, though maintaining such hospitality drains the household purse."
 building_afs_pearlwater_pavilion_01:0 "Pearlwater Pavilion"
 building_afs_pearlwater_pavilion_01_desc:0 "Pearl merchants bargain beneath carved sea arches while envoys wait in cool chambers above. A gracious reception can win what threats cannot, though maintaining such hospitality drains the household purse."
 building_type_afs_hostages_court_01:0 "Hostages' Court"
 building_type_afs_hostages_court_01_desc:0 "Noble wards learn their letters and swordplay within these gracious walls. Their chambers are comfortable, their guards discreet, and their distant families remember why the gates are watched."
 building_afs_hostages_court_01:0 "Hostages' Court"
 building_afs_hostages_court_01_desc:0 "Noble wards learn their letters and swordplay within these gracious walls. Their chambers are comfortable, their guards discreet, and their distant families remember why the gates are watched."
 building_type_afs_singers_crown_01:0 "The Singers’ Crown"
 building_type_afs_singers_crown_01_desc:0 "A tiered hall carries every song to its highest gallery. Patronage draws singers from distant courts; their verses spread the house’s name, although tales grow less truthful with each telling."
 building_afs_singers_crown_01:0 "The Singers’ Crown"
 building_afs_singers_crown_01_desc:0 "A tiered hall carries every song to its highest gallery. Patronage draws singers from distant courts; their verses spread the house’s name, although tales grow less truthful with each telling."
 building_type_afs_saffron_citadel_01:0 "Saffron Citadel"
 building_type_afs_saffron_citadel_01_desc:0 "Terraced beds yield a brief harvest of purple flowers. Behind the citadel walls, workers separate the precious red threads by hand, while armed factors guard a spice worth stealing by the handful."
 building_afs_saffron_citadel_01:0 "Saffron Citadel"
 building_afs_saffron_citadel_01_desc:0 "Terraced beds yield a brief harvest of purple flowers. Behind the citadel walls, workers separate the precious red threads by hand, while armed factors guard a spice worth stealing by the handful."
 building_type_afs_tinvein_hold_01:0 "Tinvein Hold"
 building_type_afs_tinvein_hold_01_desc:0 "Ore carts climb from wet galleries beneath a squat stone keep. Smelters cast the tin into stamped ingots for bronze workers, but exhausted miners have little love for the tally at the pithead."
 building_afs_tinvein_hold_01:0 "Tinvein Hold"
 building_afs_tinvein_hold_01_desc:0 "Ore carts climb from wet galleries beneath a squat stone keep. Smelters cast the tin into stamped ingots for bronze workers, but exhausted miners have little love for the tally at the pithead."
 building_type_afs_alumscar_manor_01:0 "Alumscar Manor"
 building_type_afs_alumscar_manor_01_desc:0 "Pale spoil heaps surround the manor’s boiling sheds. Alum fixes rich dyes into cloth bound for noble wardrobes; the trade fattens the treasury while bitter runoff fouls the neighbouring streams."
 building_afs_alumscar_manor_01:0 "Alumscar Manor"
 building_afs_alumscar_manor_01_desc:0 "Pale spoil heaps surround the manor’s boiling sheds. Alum fixes rich dyes into cloth bound for noble wardrobes; the trade fattens the treasury while bitter runoff fouls the neighbouring streams."
 building_type_afs_yewguard_lodge_01:0 "Yewguard Lodge"
 building_type_afs_yewguard_lodge_01_desc:0 "Foresters mark the oldest yews for bowstaves, seasoning each length beneath guarded eaves. Poachers resent the closed woods, but the household’s bowmen never lack a sound weapon."
 building_afs_yewguard_lodge_01:0 "Yewguard Lodge"
 building_afs_yewguard_lodge_01_desc:0 "Foresters mark the oldest yews for bowstaves, seasoning each length beneath guarded eaves. Poachers resent the closed woods, but the household’s bowmen never lack a sound weapon."
 building_type_afs_palace_of_silken_sighs_01:0 "Palace of Silken Sighs"
 building_type_afs_palace_of_silken_sighs_01_desc:0 "Curtained galleries promise music, wine, and discreet company. The streets prosper from the palace’s custom, while stern bannermen whisper that their liege spends too much time behind its perfumed doors."
 building_afs_palace_of_silken_sighs_01:0 "Palace of Silken Sighs"
 building_afs_palace_of_silken_sighs_01_desc:0 "Curtained galleries promise music, wine, and discreet company. The streets prosper from the palace’s custom, while stern bannermen whisper that their liege spends too much time behind its perfumed doors."
 building_type_afs_nightshade_conservatory_01:0 "Nightshade Conservatory"
 building_type_afs_nightshade_conservatory_01_desc:0 "Locked glasshouses shelter plants whose remedies depend upon the measure. The gardener keeps two ledgers: one for household medicines, another that is burned whenever a stranger asks to see it."
 building_afs_nightshade_conservatory_01:0 "Nightshade Conservatory"
 building_afs_nightshade_conservatory_01_desc:0 "Locked glasshouses shelter plants whose remedies depend upon the measure. The gardener keeps two ledgers: one for household medicines, another that is burned whenever a stranger asks to see it."
 building_type_afs_blackwax_chancery_01:0 "Blackwax Chancery"
 building_type_afs_blackwax_chancery_01_desc:0 "Sealed copies of debts, marriages, and inconvenient promises fill the chancery vaults. Clerks never raise their voices; a single document laid upon the table usually brings an argument to an end."
 building_afs_blackwax_chancery_01:0 "Blackwax Chancery"
 building_afs_blackwax_chancery_01_desc:0 "Sealed copies of debts, marriages, and inconvenient promises fill the chancery vaults. Clerks never raise their voices; a single document laid upon the table usually brings an argument to an end."
 building_type_afs_whispering_oubliette_01:0 "Whispering Oubliette"
 building_type_afs_whispering_oubliette_01_desc:0 "A narrow stair descends beneath a windowless tower. No one agrees how deep its cells reach, and the gaolers encourage every rumour; fear is cheaper to maintain than another company of soldiers."
 building_afs_whispering_oubliette_01:0 "Whispering Oubliette"
 building_afs_whispering_oubliette_01_desc:0 "A narrow stair descends beneath a windowless tower. No one agrees how deep its cells reach, and the gaolers encourage every rumour; fear is cheaper to maintain than another company of soldiers."
 building_type_afs_starwatch_observatory_01:0 "Starwatch Observatory"
 building_type_afs_starwatch_observatory_01_desc:0 "Bronze sighting rings crown a tower above the smoke of the hearths. Patient observers chart the wandering stars, recording what they see even when it contradicts a cherished omen."
 building_afs_starwatch_observatory_01:0 "Starwatch Observatory"
 building_afs_starwatch_observatory_01_desc:0 "Bronze sighting rings crown a tower above the smoke of the hearths. Patient observers chart the wandering stars, recording what they see even when it contradicts a cherished omen."
 building_type_afs_leechwater_infirmary_01:0 "Leechwater Infirmary"
 building_type_afs_leechwater_infirmary_01_desc:0 "Boiled linen dries behind whitewashed walls. Healers keep the fevered apart from the wounded, arguing over herbs and humours while the kitchens feed those too weak to work."
 building_afs_leechwater_infirmary_01:0 "Leechwater Infirmary"
 building_afs_leechwater_infirmary_01_desc:0 "Boiled linen dries behind whitewashed walls. Healers keep the fevered apart from the wounded, arguing over herbs and humours while the kitchens feed those too weak to work."
 building_type_afs_fossil_crown_priory_01:0 "Fossil Crown Priory"
 building_type_afs_fossil_crown_priory_01_desc:0 "Huge bones jut from the rock beneath the priory. Learned visitors dispute the beasts they belonged to, while pilgrims leave offerings beside shapes that seem older than any history in the library."
 building_afs_fossil_crown_priory_01:0 "Fossil Crown Priory"
 building_afs_fossil_crown_priory_01_desc:0 "Huge bones jut from the rock beneath the priory. Learned visitors dispute the beasts they belonged to, while pilgrims leave offerings beside shapes that seem older than any history in the library."
 building_type_afs_ravenry_of_the_mists_01:0 "Ravenry of the Mists"
 building_type_afs_ravenry_of_the_mists_01_desc:0 "Raven lofts rise above a mist-filled courtyard. Keepers tend breeding pairs and copy every message before it leaves; news crosses the realm while the household’s own counsel stays within these walls."
 building_afs_ravenry_of_the_mists_01:0 "Ravenry of the Mists"
 building_afs_ravenry_of_the_mists_01_desc:0 "Raven lofts rise above a mist-filled courtyard. Keepers tend breeding pairs and copy every message before it leaves; news crosses the realm while the household’s own counsel stays within these walls."
 building_type_afs_basalt_muster_vaults_01:0 "Basalt Muster Vaults"
 building_type_afs_basalt_muster_vaults_01_desc:0 "Barracks descend beneath black terraces into cool store vaults. A remnant of the Freehold’s severity survives in their ordered ranks: more soldiers can be housed here, but discipline is costly to impose."
 building_afs_basalt_muster_vaults_01:0 "Basalt Muster Vaults"
 building_afs_basalt_muster_vaults_01_desc:0 "Barracks descend beneath black terraces into cool store vaults. A remnant of the Freehold’s severity survives in their ordered ranks: more soldiers can be housed here, but discipline is costly to impose. Paymasters and storekeepers draw a regular allowance from the surrounding estate."
 building_type_afs_brimstone_retort_01:0 "Brimstone Retort"
 building_type_afs_brimstone_retort_01_desc:0 "Yellow sulphur lies beneath an old furnace tower. Refiners work behind thick shutters, selling their carefully measured stock to smiths and alchemists; a careless flame could swallow a season’s profit."
 building_afs_brimstone_retort_01:0 "Brimstone Retort"
 building_afs_brimstone_retort_01_desc:0 "Yellow sulphur lies beneath an old furnace tower. Refiners work behind thick shutters, selling their carefully measured stock to smiths and alchemists; a careless flame could swallow a season’s profit."
 building_type_afs_glass_candle_sanctum_01:0 "Glass Candle Sanctum"
 building_type_afs_glass_candle_sanctum_01_desc:0 "An unlit glass candle stands within a ring of dark mirrors. Scholars keep watch for a light that may never come, gathering forbidden histories whose value needs no miracle to prove it."
 building_afs_glass_candle_sanctum_01:0 "Glass Candle Sanctum"
 building_afs_glass_candle_sanctum_01_desc:0 "An unlit glass candle stands within a ring of dark mirrors. Scholars keep watch for a light that may never come, gathering forbidden histories whose value needs no miracle to prove it."
 building_type_afs_cinderwing_aerie_01:0 "Cinderwing Aerie"
 building_type_afs_cinderwing_aerie_01_desc:0 "A cavernous enclosure opens beneath wind-scoured towers of fused stone. Iron gates divide the nesting vaults from the keepers’ galleries; beyond the walls, shepherds count their flocks with unease."
 building_afs_cinderwing_aerie_01:0 "Cinderwing Aerie"
 building_afs_cinderwing_aerie_01_desc:0 "A cavernous enclosure opens beneath wind-scoured towers of fused stone. Iron gates divide the nesting vaults from the keepers’ galleries; beyond the walls, shepherds count their flocks with unease. The household pays the keepers and supplies meat for the creatures behind the gates."
