 building_type_afs_ivory_envoy_court_01:0 "Ivory Envoy Court"
 building_type_afs_ivory_envoy_court_01_desc:0 "Pale stone towers shelter guest courts, an audience hall, and covered galleries. Envoys of distant customs meet beneath their arches, while patient hosts turn safe lodging and generous hospitality into enduring influence."
 building_afs_ivory_envoy_court_01:0 "Ivory Envoy Court"
 building_afs_ivory_envoy_court_01_desc:0 "Pale stone towers shelter guest courts, an audience hall, and covered galleries. Envoys of distant customs meet beneath their arches, while patient hosts turn safe lodging and generous hospitality into enduring influence. Its kitchens and guest chambers are maintained at the patron's expense."
 building_type_afs_redbanner_redoubt_01:0 "Redbanner Redoubt"
 building_type_afs_redbanner_redoubt_01_desc:0 "Three lines of walls enclose a towering keep, deep magazines, and broad drill yards. Bowmen command the approaches while spear companies hold the gates, their red pennons marking a garrison prepared for a long siege."
 building_afs_redbanner_redoubt_01:0 "Redbanner Redoubt"
 building_afs_redbanner_redoubt_01_desc:0 "Three lines of walls enclose a towering keep, deep magazines, and broad drill yards. Bowmen command the approaches while spear companies hold the gates, their red pennons marking a garrison prepared for a long siege. Keeping the magazines full and the walls in repair burdens the estate."
 building_type_afs_millwheel_demense_01:0 "Millwheel Demesne"
 building_type_afs_millwheel_demense_01_desc:0 "A fortified manor commands a chain of great mills and stone-lined watercourses. Grain rents, milling dues, and well-tended fields fill its stores, rewarding the stewards who keep the sluices and accounts in order."
 building_afs_millwheel_demense_01:0 "Millwheel Demesne"
 building_afs_millwheel_demense_01_desc:0 "A fortified manor commands a chain of great mills and stone-lined watercourses. Grain rents, milling dues, and well-tended fields fill its stores, rewarding the stewards who keep the sluices and accounts in order."
 building_type_afs_hollowmask_house_01:0 "Hollowmask House"
 building_type_afs_hollowmask_house_01_desc:0 "A many-gabled mansion hides behind watchful towers and shuttered galleries. Its discreet household studies each visitor, guards the private stairs, and keeps dangerous knowledge in rooms opened to very few."
 building_afs_hollowmask_house_01:0 "Hollowmask House"
 building_afs_hollowmask_house_01_desc:0 "A many-gabled mansion hides behind watchful towers and shuttered galleries. Its discreet household studies each visitor, guards the private stairs, and keeps dangerous knowledge in rooms opened to very few."
 building_type_afs_sages_cloister_01:0 "Sage's Cloister"
 building_type_afs_sages_cloister_01_desc:0 "Fortified galleries surround a quiet court of readers and disputing scholars. Histories, herbals, and accounts of distant lands are copied and compared here, drawing skilled minds to the patron who maintains the collection."
 building_afs_sages_cloister_01:0 "Sage's Cloister"
 building_afs_sages_cloister_01_desc:0 "Fortified galleries surround a quiet court of readers and disputing scholars. Histories, herbals, and accounts of distant lands are copied and compared here, drawing skilled minds to the patron who maintains the collection. The patron provides parchment and stipends for the resident scholars."
 building_type_afs_weighmasters_yard_01:0 "Weighmaster's Yard"
 building_type_afs_weighmasters_yard_01_desc:0 "An imposing exchange hall overlooks covered markets and guarded customs vaults. Sworn weighers inspect grain, wool, and salt beneath the great scales, bringing steady dues to the treasury and confidence to honest traders."
 building_afs_weighmasters_yard_01:0 "Weighmaster's Yard"
 building_afs_weighmasters_yard_01_desc:0 "An imposing exchange hall overlooks covered markets and guarded customs vaults. Sworn weighers inspect grain, wool, and salt beneath the great scales, bringing steady dues to the treasury and confidence to honest traders."
 building_type_afs_candlewright_ward_01:0 "Candlewright Ward"
 building_type_afs_candlewright_ward_01_desc:0 "A tall guildhall presides over a walled quarter of chandlers and wax merchants. Its workshops supply noble halls, shrines, and counting houses, providing steady work and a profitable trade in light through the winter months."
 building_afs_candlewright_ward_01:0 "Candlewright Ward"
 building_afs_candlewright_ward_01_desc:0 "A tall guildhall presides over a walled quarter of chandlers and wax merchants. Its workshops supply noble halls, shrines, and counting houses, providing steady work and a profitable trade in light through the winter months."
 building_type_afs_cistern_court_01:0 "Cistern Court"
 building_type_afs_cistern_court_01_desc:0 "Arcaded walls surround deep reservoirs and guarded distribution courts. Wardens maintain the channels and ration the stores during siege, sustaining the garrison and easing the fears of the households gathered within."
 building_afs_cistern_court_01:0 "Cistern Court"
 building_afs_cistern_court_01_desc:0 "Arcaded walls surround deep reservoirs and guarded distribution courts. Wardens maintain the channels and ration the stores during siege, sustaining the garrison and easing the fears of the households gathered within. Masons and water wardens must be paid to keep the reservoirs sound."
 building_type_afs_lockwarden_quay_01:0 "Lockwarden Quay"
 building_type_afs_lockwarden_quay_01_desc:0 "Twin chain towers protect a fortified harbour of toll houses, pilot stairs, and crowded quays. Experienced crews guide vessels through the narrow entrance; when danger approaches, the boom closes and spearmen take the walls."
 building_afs_lockwarden_quay_01:0 "Lockwarden Quay"
 building_afs_lockwarden_quay_01_desc:0 "Twin chain towers protect a fortified harbour of toll houses, pilot stairs, and crowded quays. Experienced crews guide vessels through the narrow entrance; when danger approaches, the boom closes and spearmen take the walls."
 building_type_afs_sailmakers_close_01:0 "Sailmaker's Close"
 building_type_afs_sailmakers_close_01_desc:0 "A great maritime guildhall rises above sail lofts, ropewalks, and guarded slips. Canvas, cordage, and skilled deckhands are always close at hand, fitting ships for efficient crossings and bringing reliable custom to the waterfront."
 building_afs_sailmakers_close_01:0 "Sailmaker's Close"
 building_afs_sailmakers_close_01_desc:0 "A great maritime guildhall rises above sail lofts, ropewalks, and guarded slips. Canvas, cordage, and skilled deckhands are always close at hand, fitting ships for efficient crossings and bringing reliable custom to the waterfront."
 building_type_afs_redkiln_borough_01:0 "Redkiln Borough"
 building_type_afs_redkiln_borough_01_desc:0 "An imposing guild court commands a walled district of kilns, tile sheds, and brick yards. Its craftsmen supply roofs, drains, and sound masonry throughout the town, turning steady orders into coin and lasting growth."
 building_afs_redkiln_borough_01:0 "Redkiln Borough"
 building_afs_redkiln_borough_01_desc:0 "An imposing guild court commands a walled district of kilns, tile sheds, and brick yards. Its craftsmen supply roofs, drains, and sound masonry throughout the town, turning steady orders into coin and lasting growth."
 building_type_afs_flintfang_ring_01:0 "Flintfang Ring"
 building_type_afs_flintfang_ring_01_desc:0 "Steep earthen banks and towering palisades encircle a great timber hall. Spears crowd the muster yards beneath carved gateposts, where clansmen drill to hold each narrow entrance against a stronger foe."
 building_afs_flintfang_ring_01:0 "Flintfang Ring"
 building_afs_flintfang_ring_01_desc:0 "Steep earthen banks and towering palisades encircle a great timber hall. Spears crowd the muster yards beneath carved gateposts, where clansmen drill to hold each narrow entrance against a stronger foe."
 building_type_afs_hidehearth_camp_01:0 "Hidehearth Camp"
 building_type_afs_hidehearth_camp_01_desc:0 "A carved timber hall overlooks defended fur stores, curing sheds, and busy trading yards. Hunters exchange hides and winter provisions beneath its rafters, giving their patron a steady income and a welcome refuge from court."
 building_afs_hidehearth_camp_01:0 "Hidehearth Camp"
 building_afs_hidehearth_camp_01_desc:0 "A carved timber hall overlooks defended fur stores, curing sheds, and busy trading yards. Hunters exchange hides and winter provisions beneath its rafters, giving their patron a steady income and a welcome refuge from court."
 building_type_afs_reedwatch_crannog_01:0 "Reedwatch Crannog"
 building_type_afs_reedwatch_crannog_01_desc:0 "A great timber stronghold stands above pools and wooded backwaters, reached by narrow raised paths. Bowmen watch the reeds while light-footed guards patrol the approaches, making every unfamiliar crossing a danger to intruders."
