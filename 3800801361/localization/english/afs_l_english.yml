 afs_additional_seat_decision_desc:0 "Pay 6,000 gold and 1,000 prestige to receive Founder's Ambition. After ten days, choose a new seat and its location. You may commission another seat as soon as the previous selection is finished. Cancel an unbuilt paid commission for a full refund."
