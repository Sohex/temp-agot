 building_afs_barrowflame_circle_01_desc:0 "Terraced burial mounds and tall standing stones surround a great ceremonial hearth. Earth banks protect the gathering ground, where families honour their dead, seek counsel, and lay quarrels aside before the assembled clan."
 building_type_afs_stagdrum_hall_01:0 "Stagdrum Hall"
 building_type_afs_stagdrum_hall_01_desc:0 "Antler-carved gables crown a vast timber hall behind stout palisades. Great drums summon scattered households to councils and musters, turning shared feasts, songs, and sworn promises into loyalty to the ruling family."
