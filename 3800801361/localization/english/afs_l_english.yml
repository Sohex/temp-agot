 afs.choose_cinderwing_aerie:0 "Cinderwing Aerie"
 afs.0401.t:0 "Cinderwing Aerie"
 afs.0401.desc:0 "A cavernous enclosure opens beneath wind-scoured towers of fused stone. Iron gates divide the nesting vaults from the keepers’ galleries; beyond the walls, shepherds count their flocks with unease.\n\n#V [afs_site.GetName]#!\n"
