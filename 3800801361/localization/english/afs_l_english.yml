 building_type_afs_barrowflame_circle_01:0 "Barrowflame Circle"
 building_type_afs_barrowflame_circle_01_desc:0 "Terraced burial mounds and tall standing stones surround a great ceremonial hearth. Earth banks protect the gathering ground, where families honour their dead, seek counsel, and lay quarrels aside before the assembled clan."
