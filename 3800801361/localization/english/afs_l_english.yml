 afs.0365.desc:0 "Fortified galleries surround a quiet court of readers and disputing scholars. Histories, herbals, and accounts of distant lands are copied and compared here, drawing skilled minds to the patron who maintains the collection.\n\n#V [afs_site.GetName]#!\n"
 afs.1256.desc:0 "#bold Holding#!\nFort Level: +4\nStationed Skirmishers Toughness Mult: +10%"
 afs.1257.desc:0 "#bold County#!\nDevelopment Growth Factor: +20%"
 afs.1258.desc:0 "#bold Holder#!\nLearning: +4\nMonthly Learning Lifestyle Xp Gain Mult: +20%\nCultural Head Fascination Mult: +15%"
 afs.choose_weighmasters_yard:0 "Weighmaster's Yard"
 afs.0366.t:0 "Weighmaster's Yard"
 afs.0366.desc:0 "An imposing exchange hall overlooks covered markets and guarded customs vaults. Sworn weighers inspect grain, wool, and salt beneath the great scales, bringing steady dues to the treasury and confidence to honest traders.\n\n#V [afs_site.GetName]#!\n"
 afs.1260.desc:0 "#bold Holding#!\nFort Level: +4\nMonthly Income: +3.5\nStationed Pikemen Toughness Mult: +10%"
 afs.1261.desc:0 "#bold County#!\nTax Mult: +20%\nCounty Opinion Add: +10"
 afs.1262.desc:0 "#bold Holder#!\nStewardship: +2\nPikemen Recruitment Cost Mult: -5%"
 afs.choose_candlewright_ward:0 "Candlewright Ward"
 afs.0367.t:0 "Candlewright Ward"
 afs.0367.desc:0 "A tall guildhall presides over a walled quarter of chandlers and wax merchants. Its workshops supply noble halls, shrines, and counting houses, providing steady work and a profitable trade in light through the winter months.\n\n#V [afs_site.GetName]#!\n"
 afs.1264.desc:0 "#bold Holding#!\nFort Level: +3\nMonthly Income: +2.5\nStationed Skirmishers Toughness Mult: +10%"
 afs.1265.desc:0 "#bold County#!\nDevelopment Growth Factor: +25%\nCounty Opinion Add: +15"
 afs.1266.desc:0 "#bold Holder#!\nMonthly Stewardship Lifestyle Xp Gain Mult: +20%\nSkirmishers Recruitment Cost Mult: -5%"
 afs.choose_cistern_court:0 "Cistern Court"
 afs.0368.t:0 "Cistern Court"
 afs.0368.desc:0 "Arcaded walls surround deep reservoirs and guarded distribution courts. Wardens maintain the channels and ration the stores during siege, sustaining the garrison and easing the fears of the households gathered within.\n\n#V [afs_site.GetName]#!\n"
 afs.1268.desc:0 "#bold Holding#!\nFort Level: +6\nGarrison Size: +35%\nStationed Heavy Infantry Toughness Mult: +10%"
 afs.1269.desc:0 "#bold County#!\nSupply Limit Mult: +40%\nCounty Opinion Add: +15"
 afs.1270.desc:0 "#bold Holder#!\nStewardship: +2\nStress Gain Mult: -10%\nHeavy Infantry Recruitment Cost Mult: -5%"
 afs.choose_lockwarden_quay:0 "Lockwarden Quay"
 afs.0369.t:0 "Lockwarden Quay"
 afs.0369.desc:0 "Twin chain towers protect a fortified harbour of toll houses, pilot stairs, and crowded quays. Experienced crews guide vessels through the narrow entrance; when danger approaches, the boom closes and spearmen take the walls.\n\n#V [afs_site.GetName]#!\n"
 afs.1272.desc:0 "#bold Holding#!\nFort Level: +7\nMonthly Income: +3\nStationed Pikemen Toughness Mult: +25%\nStationed Heavy Infantry Toughness Mult: +10%"
 afs.1273.desc:0 "#bold County#!\nHostile Raid Time: +30%"
 afs.1274.desc:0 "#bold Holder#!\nNaval Movement Speed Mult: +20%\nCoastal Sea Travel Danger: -15\nHeavy Infantry Recruitment Cost Mult: -5%"
 afs.1275.desc:0 "#bold Activities & Training#!\n$unlocks_building_desc$[GetActivityType('activity_agot_sailing').GetTextIcon]Voyage base cost when departing here: #P -40%#!. Adult, unimprisoned holder: #P +0.625#! base [GetTrait('lifestyle_mariner').GetName(GetNullCharacter)] XP each quarterly pulse. Strongest port training only."
 afs.choose_sailmakers_close:0 "Sailmaker's Close"
 afs.0370.t:0 "Sailmaker's Close"
 afs.0370.desc:0 "A great maritime guildhall rises above sail lofts, ropewalks, and guarded slips. Canvas, cordage, and skilled deckhands are always close at hand, fitting ships for efficient crossings and bringing reliable custom to the waterfront.\n\n#V [afs_site.GetName]#!\n"
 afs.1276.desc:0 "#bold Holding#!\nFort Level: +4\nMonthly Income: +3.5\nStationed Archers Toughness Mult: +10%\nStationed Skirmishers Toughness Mult: +10%"
 afs.1277.desc:0 "#bold County#!\nDevelopment Growth Factor: +15%"
 afs.1278.desc:0 "#bold Holder#!\nNaval Movement Speed Mult: +25%\nEmbarkation Cost Mult: -20%\nSea Travel Danger: -10\nArchers Recruitment Cost Mult: -5%\nSkirmishers Recruitment Cost Mult: -5%"
 afs.1279.desc:0 "#bold Activities & Training#!\n$unlocks_building_desc$[GetActivityType('activity_agot_sailing').GetTextIcon]Voyage base cost when departing here: #P -40%#!. Adult, unimprisoned holder: #P +0.75#! base [GetTrait('lifestyle_mariner').GetName(GetNullCharacter)] XP each quarterly pulse. Strongest port training only."
 afs.choose_redkiln_borough:0 "Redkiln Borough"
 afs.0371.t:0 "Redkiln Borough"
 afs.0371.desc:0 "An imposing guild court commands a walled district of kilns, tile sheds, and brick yards. Its craftsmen supply roofs, drains, and sound masonry throughout the town, turning steady orders into coin and lasting growth.\n\n#V [afs_site.GetName]#!\n"
 afs.1280.desc:0 "#bold Holding#!\nFort Level: +4\nMonthly Income: +3\nStationed Heavy Infantry Toughness Mult: +10%\nStationed Skirmishers Toughness Mult: +10%"
 afs.1281.desc:0 "#bold County#!\nDevelopment Growth Factor: +30%"
 afs.1282.desc:0 "#bold Holder#!\nStewardship: +3\nMonthly Stewardship Lifestyle Xp Gain Mult: +20%\nHeavy Infantry Recruitment Cost Mult: -5%\nSkirmishers Recruitment Cost Mult: -5%"
 afs.choose_flintfang_ring:0 "Flintfang Ring"
 afs.0372.t:0 "Flintfang Ring"
 afs.0372.desc:0 "Steep earthen banks and towering palisades encircle a great timber hall. Spears crowd the muster yards beneath carved gateposts, where clansmen drill to hold each narrow entrance against a stronger foe.\n\n#V [afs_site.GetName]#!\n"
 afs.1284.desc:0 "#bold Holding#!\nFort Level: +6\nLevy Size: +30%\nStationed Pikemen Damage Mult: +35%\nStationed Pikemen Toughness Mult: +38%"
 afs.1285.desc:0 "#bold County#!\nHostile Raid Time: +30%"
 afs.1286.desc:0 "#bold Holder#!\nMartial: +2\nProwess: +2"
 afs.choose_hidehearth_camp:0 "Hidehearth Camp"
 afs.0373.t:0 "Hidehearth Camp"
 afs.0373.desc:0 "A carved timber hall overlooks defended fur stores, curing sheds, and busy trading yards. Hunters exchange hides and winter provisions beneath its rafters, giving their patron a steady income and a welcome refuge from court.\n\n#V [afs_site.GetName]#!\n"
 afs.1288.desc:0 "#bold Holding#!\nFort Level: +3\nMonthly Income: +2.5\nStationed Archers Toughness Mult: +10%\nStationed Skirmishers Toughness Mult: +10%"
 afs.1289.desc:0 "#bold County#!\nSupply Limit Mult: +25%"
 afs.1290.desc:0 "#bold Holder#!\nProwess: +2\nStress Gain Mult: -15%"
 afs.choose_reedwatch_crannog:0 "Reedwatch Crannog"
 afs.0374.t:0 "Reedwatch Crannog"
 afs.0374.desc:0 "A great timber stronghold stands above pools and wooded backwaters, reached by narrow raised paths. Bowmen watch the reeds while light-footed guards patrol the approaches, making every unfamiliar crossing a danger to intruders.\n\n#V [afs_site.GetName]#!\n"
 afs.1292.desc:0 "#bold Holding#!\nFort Level: +6\nStationed Archers Damage Mult: +35%\nStationed Skirmishers Toughness Mult: +35%\nStationed Archers Toughness Mult: +10%"
 afs.1293.desc:0 "#bold County#!\nHostile Raid Time: +50%"
 afs.1294.desc:0 "#bold Holder#!\nMartial: +2\nEnemy Hostile Scheme Success Chance Add: -10"
 afs.choose_barrowflame_circle:0 "Barrowflame Circle"
 afs.0375.t:0 "Barrowflame Circle"
 afs.0375.desc:0 "Terraced burial mounds and tall standing stones surround a great ceremonial hearth. Earth banks protect the gathering ground, where families honour their dead, seek counsel, and lay quarrels aside before the assembled clan.\n\n#V [afs_site.GetName]#!\n"
 afs.1296.desc:0 "#bold Holding#!\nFort Level: +3\nStationed Heavy Infantry Toughness Mult: +10%"
 afs.1297.desc:0 "#bold County#!\nCounty Opinion Add: +25"
 afs.1298.desc:0 "#bold Holder#!\nMonthly Piety: +1.5\nLearning: +2\nStress Gain Mult: -20%"
 afs.choose_stagdrum_hall:0 "Stagdrum Hall"
 afs.0376.t:0 "Stagdrum Hall"
 afs.0376.desc:0 "Antler-carved gables crown a vast timber hall behind stout palisades. Great drums summon scattered households to councils and musters, turning shared feasts, songs, and sworn promises into loyalty to the ruling family.\n\n#V [afs_site.GetName]#!\n"
 afs.1300.desc:0 "#bold Holding#!\nFort Level: +4\nLevy Size: +25%\nStationed Heavy Infantry Toughness Mult: +10%"
 afs.1301.desc:0 "#bold County#!\nCounty Opinion Add: +20"
 afs.1302.desc:0 "#bold Holder#!\nDiplomacy: +3\nMonthly Prestige: +1.5\nSame Culture Opinion: +15"
 afs.choose_emberglass_archive:0 "Emberglass Archive"
 afs.0377.t:0 "Emberglass Archive"
 afs.0377.desc:0 "An ancient fused-stone archive has been restored around sealed manuscript vaults. Scribes gather fragments of the Freehold and compare surviving copies, building a collection whose scholarship brings renown to its patron.\n\n#V [afs_site.GetName]#!\n"
 afs.1304.desc:0 "#bold Holding#!\nFort Level: +7\nStationed Heavy Infantry Toughness Mult: +10%"
 afs.1305.desc:0 "#bold County#!\nDevelopment Growth Factor: +15%"
 afs.1306.desc:0 "#bold Holder#!\nLearning: +4\nMonthly Learning Lifestyle Xp Gain Mult: +20%\nMonthly Prestige: +1.5\nHeavy Infantry Maintenance Mult: -3%"
 afs.choose_wyrmrest_terraces:0 "Wyrmrest Terraces"
 afs.0378.t:0 "Wyrmrest Terraces"
 afs.0378.desc:0 "Warm stone terraces shelter a dragonpit devoted to the care of ailing dragons. Experienced keepers clean wounds, prepare fresh meat, and watch over their charges through quiet nights. Broad landing courts give recovering wings room to stretch beneath the old tower.\n\n#V [afs_site.GetName]#!\n"
 afs.1308.desc:0 "#bold Holding#!\nFort Level: +8\nStationed Pikemen Toughness Mult: +10%"
 afs.1309.desc:0 "#bold Holder#!\nLearning: +2\nMonthly Prestige: +2.5\nBond With Dragon Scheme Scheme Phase Duration Add: -20\nDeepen Bond With Dragon Scheme Scheme Phase Duration Add: -20\nPikemen Maintenance Mult: -3%"
 afs.choose_ashscale_armoury:0 "Ashscale Armoury"
 afs.0379.t:0 "Ashscale Armoury"
 afs.0379.desc:0 "Scale-carved gates guard ancient weapon vaults and extensive armourers' courts. Carefully fitted armour, disciplined drill, and well-kept stores sustain a formidable household guard without wasting the treasury on poor equipment.\n\n#V [afs_site.GetName]#!\n"
 afs.1312.desc:0 "#bold Holding#!\nFort Level: +9\nStationed Heavy Infantry Damage Mult: +40%\nStationed Heavy Infantry Toughness Mult: +40%"
 afs.1313.desc:0 "#bold Holder#!\nMartial: +3\nMen At Arms Maintenance: -10%\nKnight Effectiveness Mult: +20%\nHeavy Infantry Maintenance Mult: -3%"
 afs.choose_smokestone_vault:0 "Smokestone Vault"
 afs.0380.t:0 "Smokestone Vault"
 afs.0380.desc:0 "Heavy doors seal a treasury within an ancient stronghold of fused stone. Guarded counting rooms collect revenues from the surrounding estates, while trusted keepers watch the passages as closely as they watch the ledgers.\n\n#V [afs_site.GetName]#!\n"
 afs.1316.desc:0 "#bold Holding#!\nFort Level: +8\nMonthly Income: +3.5\nStationed Heavy Infantry Toughness Mult: +10%"
 afs.1317.desc:0 "#bold County#!\nTax Mult: +15%"
 afs.1318.desc:0 "#bold Holder#!\nStewardship: +3\nEnemy Hostile Scheme Success Chance Add: -15\nHeavy Infantry Maintenance Mult: -3%"
 afs.choose_amber_oath_hall:0 "Amber Oath Hall"
 afs.0381.t:0 "Amber Oath Hall"
 afs.0381.desc:0 "Amber beads gleam above a hall where old feuds are settled before sworn witnesses. Guests surrender their weapons at the outer gate; breaking bread here binds a lord more tightly than any written promise.\n\n#V [afs_site.GetName]#!\n"
 afs.1320.desc:0 "#bold Holding#!\nFort Level: +4\nMonthly Income: +1\nStationed Light Cavalry Toughness Mult: +10%\nStationed Pikemen Toughness Mult: +10%"
 afs.1321.desc:0 "#bold County#!\nCounty Opinion Add: +15"
 afs.1322.desc:0 "#bold Holder#!\nDiplomacy: +3\nSame Culture Opinion: +20\nMonthly Prestige: +1.5"
 afs.choose_pearlwater_pavilion:0 "Pearlwater Pavilion"
 afs.0382.t:0 "Pearlwater Pavilion"
 afs.0382.desc:0 "Pearl merchants bargain beneath carved sea arches while envoys wait in cool chambers above. A gracious reception can win what threats cannot, though maintaining such hospitality drains the household purse.\n\n#V [afs_site.GetName]#!\n"
 afs.1324.desc:0 "#bold Holding#!\nFort Level: +3\nMonthly Income: -0.5\nStationed Light Cavalry Toughness Mult: +10%"
 afs.1325.desc:0 "#bold County#!\nDevelopment Growth Factor: +20%"
 afs.1326.desc:0 "#bold Holder#!\nDiplomacy: +4\nDiplomatic Range Mult: +25%\nDifferent Culture Opinion: +20"
 afs.choose_hostages_court:0 "Hostages' Court"
 afs.0383.t:0 "Hostages' Court"
 afs.0383.desc:0 "Noble wards learn their letters and swordplay within these gracious walls. Their chambers are comfortable, their guards discreet, and their distant families remember why the gates are watched.\n\n#V [afs_site.GetName]#!\n"
 afs.1328.desc:0 "#bold Holding#!\nFort Level: +6\nGarrison Size: +25%\nStationed Heavy Infantry Toughness Mult: +10%"
 afs.1329.desc:0 "#bold Holder#!\nDiplomacy: +2\nDread Baseline Add: +15\nVassal Opinion: -5\nMonthly Dynasty Prestige: +0.5"
 afs.choose_singers_crown:0 "The Singers’ Crown"
 afs.0384.t:0 "The Singers’ Crown"
 afs.0384.desc:0 "A tiered hall carries every song to its highest gallery. Patronage draws singers from distant courts; their verses spread the house’s name, although tales grow less truthful with each telling.\n\n#V [afs_site.GetName]#!\n"
 afs.1332.desc:0 "#bold Holding#!\nFort Level: +3\nMonthly Income: -1\nStationed Skirmishers Toughness Mult: +10%"
 afs.1333.desc:0 "#bold County#!\nCounty Opinion Add: +20"
 afs.1334.desc:0 "#bold Holder#!\nMonthly Prestige: +3\nMonthly Diplomacy Lifestyle Xp Gain Mult: +20%\nStress Loss Mult: +20%"
 afs.choose_saffron_citadel:0 "Saffron Citadel"
 afs.0385.t:0 "Saffron Citadel"
 afs.0385.desc:0 "Terraced beds yield a brief harvest of purple flowers. Behind the citadel walls, workers separate the precious red threads by hand, while armed factors guard a spice worth stealing by the handful.\n\n#V [afs_site.GetName]#!\n"
 afs.1336.desc:0 "#bold Holding#!\nFort Level: +5\nMonthly Income: +4"
 afs.1337.desc:0 "#bold County#!\nTax Mult: +15%\nCounty Opinion Add: -5"
 afs.1338.desc:0 "#bold Holder#!\nStewardship: +2\nMonthly Stewardship Lifestyle Xp Gain Mult: +20%\nLight Cavalry Maintenance Mult: -5%"
 afs.choose_tinvein_hold:0 "Tinvein Hold"
 afs.0386.t:0 "Tinvein Hold"
 afs.0386.desc:0 "Ore carts climb from wet galleries beneath a squat stone keep. Smelters cast the tin into stamped ingots for bronze workers, but exhausted miners have little love for the tally at the pithead.\n\n#V [afs_site.GetName]#!\n"
 afs.1340.desc:0 "#bold Holding#!\nFort Level: +6\nMonthly Income: +3.5\nStationed Pikemen Toughness Mult: +20%"
 afs.1341.desc:0 "#bold County#!\nCounty Opinion Add: -10"
 afs.1342.desc:0 "#bold Holder#!\nMen At Arms Maintenance: -10%\nStewardship: +2\nHeavy Infantry Maintenance Mult: -5%"
 afs.choose_alumscar_manor:0 "Alumscar Manor"
 afs.0387.t:0 "Alumscar Manor"
 afs.0387.desc:0 "Pale spoil heaps surround the manor’s boiling sheds. Alum fixes rich dyes into cloth bound for noble wardrobes; the trade fattens the treasury while bitter runoff fouls the neighbouring streams.\n\n#V [afs_site.GetName]#!\n"
 afs.1344.desc:0 "#bold Holding#!\nFort Level: +4\nMonthly Income: +4.5"
 afs.1345.desc:0 "#bold County#!\nDevelopment Growth Factor: +20%\nCounty Opinion Add: -15"
 afs.1346.desc:0 "#bold Holder#!\nMonthly Stewardship Lifestyle Xp Gain Mult: +20%\nArchers Maintenance Mult: -5%\nHeavy Infantry Maintenance Mult: -5%"
 afs.choose_yewguard_lodge:0 "Yewguard Lodge"
 afs.0388.t:0 "Yewguard Lodge"
 afs.0388.desc:0 "Foresters mark the oldest yews for bowstaves, seasoning each length beneath guarded eaves. Poachers resent the closed woods, but the household’s bowmen never lack a sound weapon.\n\n#V [afs_site.GetName]#!\n"
 afs.1348.desc:0 "#bold Holding#!\nFort Level: +5\nMonthly Income: +2\nStationed Archers Damage Mult: +35%\nStationed Archers Toughness Mult: +20%"
 afs.1349.desc:0 "#bold County#!\nCounty Opinion Add: -5"
 afs.1350.desc:0 "#bold Holder#!\nArchers Max Size Add: +2\nMen At Arms Recruitment Cost: -15%\nArchers Maintenance Mult: -5%"
 afs.choose_palace_of_silken_sighs:0 "Palace of Silken Sighs"
 afs.0389.t:0 "Palace of Silken Sighs"
 afs.0389.desc:0 "Curtained galleries promise music, wine, and discreet company. The streets prosper from the palace’s custom, while stern bannermen whisper that their liege spends too much time behind its perfumed doors.\n\n#V [afs_site.GetName]#!\n"
 afs.1352.desc:0 "#bold Holding#!\nFort Level: +3\nMonthly Income: +2\nStationed Skirmishers Damage Mult: +10%"
 afs.1353.desc:0 "#bold County#!\nCounty Opinion Add: +25"
 afs.1354.desc:0 "#bold Holder#!\nIntrigue: +2\nAttraction Opinion: +25\nVassal Opinion: -10\nStress Gain Mult: -20%"
 afs.choose_nightshade_conservatory:0 "Nightshade Conservatory"
 afs.0390.t:0 "Nightshade Conservatory"
 afs.0390.desc:0 "Locked glasshouses shelter plants whose remedies depend upon the measure. The gardener keeps two ledgers: one for household medicines, another that is burned whenever a stranger asks to see it.\n\n#V [afs_site.GetName]#!\n"
 afs.1356.desc:0 "#bold Holding#!\nFort Level: +4\nStationed Heavy Infantry Damage Mult: +10%\nStationed Skirmishers Damage Mult: +10%"
 afs.1357.desc:0 "#bold Holder#!\nIntrigue: +4\nOwned Hostile Scheme Success Chance Add: +15\nEnemy Hostile Scheme Success Chance Add: -10\nGeneral Opinion: -5"
 afs.choose_blackwax_chancery:0 "Blackwax Chancery"
 afs.0391.t:0 "Blackwax Chancery"
 afs.0391.desc:0 "Sealed copies of debts, marriages, and inconvenient promises fill the chancery vaults. Clerks never raise their voices; a single document laid upon the table usually brings an argument to an end.\n\n#V [afs_site.GetName]#!\n"
 afs.1360.desc:0 "#bold Holding#!\nFort Level: +5\nMonthly Income: +1\nStationed Heavy Infantry Damage Mult: +10%"
 afs.1361.desc:0 "#bold County#!\nMonthly County Control Growth Add: +0.5"
 afs.1362.desc:0 "#bold Holder#!\nIntrigue: +3\nVassal Tax Mult: +15%\nVassal Opinion: -10\nMonthly Intrigue Lifestyle Xp Gain Mult: +20%"
 afs.choose_whispering_oubliette:0 "Whispering Oubliette"
 afs.0392.t:0 "Whispering Oubliette"
 afs.0392.desc:0 "A narrow stair descends beneath a windowless tower. No one agrees how deep its cells reach, and the gaolers encourage every rumour; fear is cheaper to maintain than another company of soldiers.\n\n#V [afs_site.GetName]#!\n"
 afs.1364.desc:0 "#bold Holding#!\nFort Level: +7\nGarrison Size: +20%\nStationed Heavy Infantry Damage Mult: +10%"
 afs.1365.desc:0 "#bold County#!\nCounty Opinion Add: -20"
 afs.1366.desc:0 "#bold Holder#!\nDread Baseline Add: +25\nDread Decay Mult: -25%\nIntrigue: +2"
 afs.choose_starwatch_observatory:0 "Starwatch Observatory"
 afs.0393.t:0 "Starwatch Observatory"
 afs.0393.desc:0 "Bronze sighting rings crown a tower above the smoke of the hearths. Patient observers chart the wandering stars, recording what they see even when it contradicts a cherished omen.\n\n#V [afs_site.GetName]#!\n"
 afs.1368.desc:0 "#bold Holding#!\nFort Level: +4\nStationed Skirmishers Toughness Mult: +10%"
 afs.1369.desc:0 "#bold Holder#!\nLearning: +4\nCultural Head Fascination Mult: +25%\nMonthly Learning Lifestyle Xp Gain Mult: +20%\nMonthly Income: -0.5"
 afs.choose_leechwater_infirmary:0 "Leechwater Infirmary"
 afs.0394.t:0 "Leechwater Infirmary"
 afs.0394.desc:0 "Boiled linen dries behind whitewashed walls. Healers keep the fevered apart from the wounded, arguing over herbs and humours while the kitchens feed those too weak to work.\n\n#V [afs_site.GetName]#!\n"
 afs.1372.desc:0 "#bold Holding#!\nFort Level: +3\nMonthly Income: -1.5\nStationed Skirmishers Toughness Mult: +10%"
 afs.1373.desc:0 "#bold County#!\nCounty Opinion Add: +20"
 afs.1374.desc:0 "#bold Holder#!\nHealth: +0.3\nLearning: +2\nMonthly Piety: +1"
 afs.choose_fossil_crown_priory:0 "Fossil Crown Priory"
 afs.0395.t:0 "Fossil Crown Priory"
 afs.0395.desc:0 "Huge bones jut from the rock beneath the priory. Learned visitors dispute the beasts they belonged to, while pilgrims leave offerings beside shapes that seem older than any history in the library.\n\n#V [afs_site.GetName]#!\n"
 afs.1376.desc:0 "#bold Holding#!\nFort Level: +5\nMonthly Income: +1\nStationed Heavy Infantry Toughness Mult: +10%\nStationed Pikemen Toughness Mult: +10%"
 afs.1377.desc:0 "#bold County#!\nDevelopment Growth Factor: +15%"
 afs.1378.desc:0 "#bold Holder#!\nLearning: +3\nMonthly Piety: +1.5\nMonthly Learning Lifestyle Xp Gain Mult: +20%"
 afs.choose_ravenry_of_the_mists:0 "Ravenry of the Mists"
 afs.0396.t:0 "Ravenry of the Mists"
 afs.0396.desc:0 "Raven lofts rise above a mist-filled courtyard. Keepers tend breeding pairs and copy every message before it leaves; news crosses the realm while the household’s own counsel stays within these walls.\n\n#V [afs_site.GetName]#!\n"
 afs.1380.desc:0 "#bold Holding#!\nFort Level: +4\nStationed Archers Toughness Mult: +10%\nStationed Skirmishers Toughness Mult: +10%"
 afs.1381.desc:0 "#bold County#!\nMonthly County Control Growth Add: +0.3"
 afs.1382.desc:0 "#bold Holder#!\nLearning: +2\nDiplomatic Range Mult: +30%\nEnemy Hostile Scheme Success Chance Add: -15"
 afs.choose_basalt_muster_vaults:0 "Basalt Muster Vaults"
 afs.0397.t:0 "Basalt Muster Vaults"
 afs.0397.desc:0 "Barracks descend beneath black terraces into cool store vaults. A remnant of the Freehold’s severity survives in their ordered ranks: more soldiers can be housed here, but discipline is costly to impose.\n\n#V [afs_site.GetName]#!\n"
 afs.1384.desc:0 "#bold Holding#!\nFort Level: +9\nStationed Heavy Infantry Toughness Mult: +40%\nStationed Siege Weapon Siege Value Mult: +10%"
 afs.1385.desc:0 "#bold County#!\nCounty Opinion Add: -10"
 afs.1386.desc:0 "#bold Holder#!\nMax Men-at-Arms Regiments: +1\nMen-at-Arms Regiment Size: +2\nMonthly Income: -2\nHeavy Infantry Maintenance Mult: -3%\nSiege Weapon Maintenance Mult: -3%"
 afs.choose_brimstone_retort:0 "Brimstone Retort"
 afs.0398.t:0 "Brimstone Retort"
 afs.0398.desc:0 "Yellow sulphur lies beneath an old furnace tower. Refiners work behind thick shutters, selling their carefully measured stock to smiths and alchemists; a careless flame could swallow a season’s profit.\n\n#V [afs_site.GetName]#!\n"
 afs.1388.desc:0 "#bold Holding#!\nFort Level: +7\nMonthly Income: +4\nStationed Siege Weapon Siege Value Mult: +20%\nStationed Archers Toughness Mult: +10%"
 afs.1389.desc:0 "#bold County#!\nCounty Opinion Add: -15"
 afs.1390.desc:0 "#bold Holder#!\nMen At Arms Maintenance: -10%\nArchers Maintenance Mult: -3%\nSiege Weapon Maintenance Mult: -3%"
 afs.choose_glass_candle_sanctum:0 "Glass Candle Sanctum"
 afs.0399.t:0 "Glass Candle Sanctum"
 afs.0399.desc:0 "An unlit glass candle stands within a ring of dark mirrors. Scholars keep watch for a light that may never come, gathering forbidden histories whose value needs no miracle to prove it.\n\n#V [afs_site.GetName]#!\n"
