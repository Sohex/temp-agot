 afs_maa_bellbronze_warders:0 "Bellbronze Warders"
 afs_maa_bellbronze_warders_flavor:0 "Bound by household oath rather than temple service, these warders carry long-hafted axes. They keep a measured pace until the signal sounds, then strike together."
 afs_can_recruit_bellbronze_warders:0 "Personally hold an active seat that recruits Bellbronze Warders."
