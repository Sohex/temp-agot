 afs_maa_switchback_arbalesters:0 "Switchback Arbalesters"
 afs_maa_switchback_arbalesters_flavor:0 "Their captains count distances in bends of the road. From prepared galleries, these careful arbalesters loose at horses and officers before retreating behind the next gate."
 afs_can_recruit_switchback_arbalesters:0 "Personally hold an active seat that recruits Switchback Arbalesters."
 building_type_afs_giltweight_assay_01:0 "Giltweight Assay"
