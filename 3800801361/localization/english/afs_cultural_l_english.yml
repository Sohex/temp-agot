 afs_maa_rimecellar_shields:0 "Rimecellar Shields"
 afs_maa_rimecellar_shields_flavor:0 "A shield is worth little if the hand behind it freezes. These seasoned northern retainers wear padded wool beneath their mail and hold close ranks around the winter stores."
 afs_can_recruit_rimecellar_shields:0 "Personally hold an active seat that recruits Rimecellar Shields."
 building_type_afs_tidemark_counting_house_01:0 "Tidemark Counting House"
 building_afs_tidemark_counting_house_01:0 "Tidemark Counting House"
 afs.choose_tidemark_counting_house:0 "Tidemark Counting House"
 afs.6002.t:0 "Tidemark Counting House"
 building_afs_tidemark_counting_house_01_desc:0 "Iron-bound strongrooms lie beneath a fortified counting house, where grain contracts and cargo tallies are sealed before witnesses. Its hired watch guards the narrow approaches while merchants settle their accounts behind barred stone windows."
 building_type_afs_tidemark_counting_house_01_desc:0 "Iron-bound strongrooms lie beneath a fortified counting house, where grain contracts and cargo tallies are sealed before witnesses. Its hired watch guards the narrow approaches while merchants settle their accounts behind barred stone windows."
