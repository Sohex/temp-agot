 afs_maa_brinehook_boarders_flavor:0 "Salt has eaten the shine from their mail. These veteran shore fighters carry short axes and broad shields, closing quickly where a long spear has no room to turn."
 afs_can_recruit_brinehook_boarders:0 "Personally hold an active seat that recruits Brinehook Boarders."
 building_type_afs_ferrymoot_ward_01:0 "Ferrymoot Ward"
 building_afs_ferrymoot_ward_01:0 "Ferrymoot Ward"
 afs.choose_ferrymoot_ward:0 "Ferrymoot Ward"
 afs.6006.t:0 "Ferrymoot Ward"
 building_afs_ferrymoot_ward_01_desc:0 "A fortified tollhouse oversees ferries, flood markers and granaries raised above the riverbank. Its lord earns from safe crossings, but must keep enough trained men to stop a crossing becoming an invasion."
 building_type_afs_ferrymoot_ward_01_desc:0 "A fortified tollhouse oversees ferries, flood markers and granaries raised above the riverbank. Its lord earns from safe crossings, but must keep enough trained men to stop a crossing becoming an invasion."
