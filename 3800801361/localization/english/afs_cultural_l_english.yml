 afs_maa_giltweight_escorts:0 "Giltweight Escorts"
 afs_maa_giltweight_escorts_flavor:0 "They escort weighed silver as readily as newly cast gold. Closed helms and heavy shields conceal their faces; the assay seal on a ledger is the only heraldry their work requires."
 afs_can_recruit_giltweight_escorts:0 "Personally hold an active seat that recruits Giltweight Escorts."
