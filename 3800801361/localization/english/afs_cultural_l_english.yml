 afs.6009.t:0 "Orchardseal Grange"
 building_afs_orchardseal_grange_01_desc:0 "A walled grange preserves seed grain, grafted fruit trees and the records of generations of harvests. Wealth from dependable crops supports a small mounted household pledged to defend the estate and its tenants."
