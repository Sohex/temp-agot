 afs_maa_marchward_longspears:0 "Marchward Longspears"
 afs_maa_marchward_longspears_flavor:0 "Marcher veterans brace long ash spears in close ranks. Their plain shields carry old repairs rather than painted victories, and every man knows the ground on which his neighbours will stand."
 afs_can_recruit_marchward_longspears:0 "Personally hold an active seat that recruits Marchward Longspears."
