 afs_maa_ferrymoot_pikes_flavor:0 "The ferry chain is lowered only on their captain’s word. Long ash spears and patient drill make these river retainers difficult to dislodge from a narrow landing."
 afs_can_recruit_ferrymoot_pikes:0 "Personally hold an active seat that recruits Ferrymoot Pikes."
 building_type_afs_switchback_gatehouse_01:0 "Switchback Gatehouse"
 building_afs_switchback_gatehouse_01:0 "Switchback Gatehouse"
 afs.choose_switchback_gatehouse:0 "Switchback Gatehouse"
 afs.6007.t:0 "Switchback Gatehouse"
 building_afs_switchback_gatehouse_01_desc:0 "Successive gates command a zigzag road cut into the mountainside. Toll wagons fund its garrison, whose crossbow galleries cover each bend without exposing the defenders to the approach below."
 building_type_afs_switchback_gatehouse_01_desc:0 "Successive gates command a zigzag road cut into the mountainside. Toll wagons fund its garrison, whose crossbow galleries cover each bend without exposing the defenders to the approach below."
