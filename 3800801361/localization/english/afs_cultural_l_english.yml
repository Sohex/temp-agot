 afs_maa_vintners_cavaliers:0 "Vintners’ Cavaliers"
 afs_maa_vintners_cavaliers_flavor:0 "Good horses, sound mail and a long lance distinguish the sworn escorts of the wine road. They ride in close order across open country; narrow muddy tracks can undo their finest charge."
 afs_can_recruit_vintners_cavaliers:0 "Personally hold an active seat that recruits Vintners’ Cavaliers."
 building_type_afs_brinehook_curing_yard_01:0 "Brinehook Curing Yard"
 building_afs_brinehook_curing_yard_01:0 "Brinehook Curing Yard"
 afs.choose_brinehook_curing_yard:0 "Brinehook Curing Yard"
 afs.6005.t:0 "Brinehook Curing Yard"
 building_afs_brinehook_curing_yard_01_desc:0 "Salt fish hangs beneath long roofs above a defended landing. The curing yards provision crews for distant voyages; a hard-bitten household keeps the stores and the shore against anyone seeking an easy prize."
 building_type_afs_brinehook_curing_yard_01_desc:0 "Salt fish hangs beneath long roofs above a defended landing. The curing yards provision crews for distant voyages; a hard-bitten household keeps the stores and the shore against anyone seeking an easy prize."
