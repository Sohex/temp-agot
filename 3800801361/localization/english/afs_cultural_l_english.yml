 building_afs_vintners_court_01:0 "Vintners’ Court"
 afs.choose_vintners_court:0 "Vintners’ Court"
 afs.6004.t:0 "Vintners’ Court"
 building_afs_vintners_court_01_desc:0 "Wine cellars and a walled press yard surround a fortified lordly hall. Casks bearing the estate’s seal travel to distant tables, while the household maintains a small company of mounted retainers to escort the autumn revenues."
 building_type_afs_vintners_court_01_desc:0 "Wine cellars and a walled press yard surround a fortified lordly hall. Casks bearing the estate’s seal travel to distant tables, while the household maintains a small company of mounted retainers to escort the autumn revenues."
