 afs_maa_clearlens_marksmen:0 "Clearlens Marksmen"
 afs_maa_clearlens_marksmen_flavor:0 "An expensive crossbow is wasted in hurried hands. The atelier’s guards judge range and wind before loosing, trusting careful practice rather than a rain of bolts."
 afs_can_recruit_clearlens_marksmen:0 "Personally hold an active seat that recruits Clearlens Marksmen."
