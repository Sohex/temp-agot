 afs_maa_purplevat_blades:0 "Purplevat Blades"
 afs_maa_purplevat_blades_flavor:0 "A stained sleeve need not mean a careless blade. These experienced yard guards move lightly through workshops and alleys, wearing enough protection to survive the first close encounter."
 afs_can_recruit_purplevat_blades:0 "Personally hold an active seat that recruits Purplevat Blades."
