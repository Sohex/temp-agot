 building_afs_clearlens_atelier_01:0 "Clearlens Atelier"
 afs.choose_clearlens_atelier:0 "Clearlens Atelier"
 afs.6017.t:0 "Clearlens Atelier"
 building_afs_clearlens_atelier_01_desc:0 "Lens grinders and makers of delicate instruments work behind a guarded courtyard. Their precise craft brings wealthy patrons and patient scholars; its profits pay for crossbowmen trained to place each shot with equal care."
 building_type_afs_clearlens_atelier_01_desc:0 "Lens grinders and makers of delicate instruments work behind a guarded courtyard. Their precise craft brings wealthy patrons and patient scholars; its profits pay for crossbowmen trained to place each shot with equal care."
