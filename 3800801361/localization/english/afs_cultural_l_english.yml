 building_afs_rimecellar_hall_01:0 "Rimecellar Hall"
 afs.choose_rimecellar_hall:0 "Rimecellar Hall"
 afs.6001.t:0 "Rimecellar Hall"
 building_afs_rimecellar_hall_01_desc:0 "Deep stone cellars hold salted meat and root crops beneath a steep-roofed northern hall. When the snows close the roads, its sworn household guards the stores that keep the surrounding villages alive."
 building_type_afs_rimecellar_hall_01_desc:0 "Deep stone cellars hold salted meat and root crops beneath a steep-roofed northern hall. When the snows close the roads, its sworn household guards the stores that keep the surrounding villages alive."
