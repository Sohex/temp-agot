 afs.6020.desc:0 "Charcoal carts pass through a blackened gate to a foundry prized for dependable tools and armour. Its master pays skilled workers well and keeps a small armoured household to protect the furnaces and finished goods.\n\n#V [afs_site.GetName]#!\n#low Qohorik craftsmanship.#!"
 afs_maa_unlock_coalblack_foundry:0 "$unlocks_building_desc$Unlocks recruitment: [GetMaA('afs_maa_coalblack_mauls').GetName]."
 afs_maa_coalblack_mauls:0 "Coalblack Mauls"
 afs_maa_coalblack_mauls_flavor:0 "Their armour is fitted by the same smiths whose wagons they guard. Compact polehammers and drilled footwork make these foundry retainers formidable against another armoured line."
 afs_can_recruit_coalblack_mauls:0 "Personally hold an active seat that recruits Coalblack Mauls."
