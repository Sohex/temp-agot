 afs.6020.t:0 "Coalblack Foundry"
 building_afs_coalblack_foundry_01_desc:0 "Charcoal carts pass through a blackened gate to a foundry prized for dependable tools and armour. Its master pays skilled workers well and keeps a small armoured household to protect the furnaces and finished goods."
 building_type_afs_coalblack_foundry_01_desc:0 "Charcoal carts pass through a blackened gate to a foundry prized for dependable tools and armour. Its master pays skilled workers well and keeps a small armoured household to protect the furnaces and finished goods."
