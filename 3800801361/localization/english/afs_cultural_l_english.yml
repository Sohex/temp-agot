 afs.6019.t:0 "Bellbronze Precinct"
 building_afs_bellbronze_precinct_01_desc:0 "Bell founders work beside a stern, walled residence, casting bronze for households and sanctuaries. Its warders answer to the sound of a small watch bell; no claim is made upon the great bells of distant Norvos."
 building_type_afs_bellbronze_precinct_01_desc:0 "Bell founders work beside a stern, walled residence, casting bronze for households and sanctuaries. Its warders answer to the sound of a small watch bell; no claim is made upon the great bells of distant Norvos."
