 afs.preview_sluicegate_bastion:0 "#T [GetBuilding('afs_sluicegate_bastion_01').GetName]#!\n[GetBuilding('afs_sluicegate_bastion_01').GetDescription]\n\n[GetBuilding('afs_sluicegate_bastion_01').GetEffectDescription( GetPlayer )]"
 afs.6015.desc:0 "A squat stone bastion straddles the sluice works that feed the surrounding fields. Its guards keep the channels clear and the gates locked; in troubled seasons, control of the water can preserve a harvest or delay an approaching army.\n\n#V [afs_site.GetName]#!\n#low Riverlanders craftsmanship.#!"
 afs_maa_unlock_sluicegate_bastion:0 "$unlocks_building_desc$Unlocks recruitment: [GetMaA('afs_maa_sluicegate_shields').GetName]."
 afs_maa_sluicegate_shields:0 "Sluicegate Shields"
 afs_maa_sluicegate_shields_flavor:0 "These mailed household soldiers defend lock gates and narrow embankments with broad shields and serviceable swords. Their strength lies in holding confined ground, not pursuing an enemy across the hills."
 afs_can_recruit_sluicegate_shields:0 "Personally hold an active seat that recruits Sluicegate Shields."
 building_type_afs_greycord_ropewalk_01:0 "Greycord Ropewalk"
 building_afs_greycord_ropewalk_01:0 "Greycord Ropewalk"
 afs.choose_greycord_ropewalk:0 "Greycord Ropewalk"
 afs.6016.t:0 "Greycord Ropewalk"
 building_afs_greycord_ropewalk_01_desc:0 "Long covered ropewalks stand within a defended merchant court. Cable makers supply ships with tested cordage, while hired crossbowmen guard the costly hemp stores and the accounts that bind the business together."
 building_type_afs_greycord_ropewalk_01_desc:0 "Long covered ropewalks stand within a defended merchant court. Cable makers supply ships with tested cordage, while hired crossbowmen guard the costly hemp stores and the accounts that bind the business together."
 afs.preview_greycord_ropewalk:0 "#T [GetBuilding('afs_greycord_ropewalk_01').GetName]#!\n[GetBuilding('afs_greycord_ropewalk_01').GetDescription]\n\n[GetBuilding('afs_greycord_ropewalk_01').GetEffectDescription( GetPlayer )]"
 afs.6016.desc:0 "Long covered ropewalks stand within a defended merchant court. Cable makers supply ships with tested cordage, while hired crossbowmen guard the costly hemp stores and the accounts that bind the business together.\n\n#V [afs_site.GetName]#!\n#low Braavosi craftsmanship.#!"
 afs_maa_unlock_greycord_ropewalk:0 "$unlocks_building_desc$Unlocks recruitment: [GetMaA('afs_maa_greycord_pavisiers').GetName]."
 afs_maa_greycord_pavisiers:0 "Greycord Pavisiers"
 afs_maa_greycord_pavisiers_flavor:0 "They are hired for steady hands, not bright clothes. Behind plain pavises, these contract guards loose by pairs while the ropewalk’s apprentices carry spare bolts."
 afs_can_recruit_greycord_pavisiers:0 "Personally hold an active seat that recruits Greycord Pavisiers."
