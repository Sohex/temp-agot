 afs.6018.t:0 "Purplevat Enclosure"
 building_afs_purplevat_enclosure_01_desc:0 "Dyers stir costly pigments in enclosed vats beyond a fortified counting house. Brilliant cloth leaves by guarded wagon, and the owners keep quick-footed retainers to prevent theft among the crowded workshops."
 building_type_afs_purplevat_enclosure_01_desc:0 "Dyers stir costly pigments in enclosed vats beyond a fortified counting house. Brilliant cloth leaves by guarded wagon, and the owners keep quick-footed retainers to prevent theft among the crowded workshops."
