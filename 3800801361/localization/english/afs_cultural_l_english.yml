 afs_maa_tidemark_pavisiers:0 "Tidemark Pavisiers"
 afs_maa_tidemark_pavisiers_flavor:0 "Paid from the counting house ledgers, these disciplined crossbowmen work in pairs behind plain timber pavises. A patient watch and a clear field of fire matter more to them than a fine banner."
 afs_can_recruit_tidemark_pavisiers:0 "Personally hold an active seat that recruits Tidemark Pavisiers."
 building_type_afs_marchward_redoubt_01:0 "Marchward Redoubt"
 building_afs_marchward_redoubt_01:0 "Marchward Redoubt"
 afs.choose_marchward_redoubt:0 "Marchward Redoubt"
 afs.6003.t:0 "Marchward Redoubt"
 building_afs_marchward_redoubt_01_desc:0 "Successive walls close around a battered stone keep above the border road. Muster yards, covered wells and spare spear shafts fill the cramped ward; maintaining such a watch is costly, but a raiding column cannot pass unnoticed."
 building_type_afs_marchward_redoubt_01_desc:0 "Successive walls close around a battered stone keep above the border road. Muster yards, covered wells and spare spear shafts fill the cramped ward; maintaining such a watch is costly, but a raiding column cannot pass unnoticed."
