 afs.6008.t:0 "Giltweight Assay"
 building_afs_giltweight_assay_01_desc:0 "Within a walled assay court, trusted weighers test bullion before it bears the lord’s seal. Fees and honest measures attract trade; the guarded vaults require retainers whose loyalty cannot be purchased twice."
 building_type_afs_giltweight_assay_01_desc:0 "Within a walled assay court, trusted weighers test bullion before it bears the lord’s seal. Fees and honest measures attract trade; the guarded vaults require retainers whose loyalty cannot be purchased twice."
