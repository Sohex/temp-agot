 afs_maa_beaconwright_runners:0 "Beaconwright Runners"
 afs_maa_beaconwright_runners_flavor:0 "Selected for judgement as well as speed, the beacon riders remain mounted until a message is delivered. When war comes, the same discipline makes them dependable scouts and pursuers."
