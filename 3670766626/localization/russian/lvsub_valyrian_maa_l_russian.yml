l_russian:
 # Династия Белейрис
 sunspears_of_belaerys:0 "Солнечные Копья Белейрисов"
 sunspears_of_belaerys_flavor:0 "Личная гвардия Дома Белейрисов, закованная в обсидианово-черную сталь. Эти рыцари-всадники воплощают мощь Валирии: их доспехи украшены золотой чеканкой в форме палящего солнца, а шлемы венчают крылья драконов. В бою они действуют как карающая длань своего лорда, уничтожая ряды противника сокрушительным чарджем."
 sunhammers_of_belaerys:0 "Солнечные Молоты Белейрисов"
 sunhammers_of_belaerys_flavor:0 "Спешенные рыцари и элитные сержанты Дома Белейрисов, променявшие пики на тяжелые двуручные булавы и шестоперы. Их доспехи из вороненой стали способны выдержать ливень стрел, а один взмах их дробящего оружия превращает латы противника в бесполезный металл."

 # Династия Варезис
 halberdiers_golden_flame:0 "Алебардщики Золотого Пламени"
 halberdiers_golden_flame_flavor:0 "Профессиональный корпус тяжелой пехоты на службе Дома Варезис. В отличие от других валирийских домов, полагающихся на чистую мощь, Варезисы ставят во главу угла дисциплину и строй. Эти солдаты облачены в полулаты поверх темно-красных туник, а их алебарды позволяют одинаково эффективно останавливать кавалерийский натиск и стаскивать всадников с седел."
 veterans_laurel_crown:0 "Ветераны Лаврового Венца"
 veterans_laurel_crown_flavor:0 "Элитная пехота Дома Варезис, формируемая из наиболее опытных дворян, доказавших свою верность на полях сражений. Облаченные в полные доспехи и вооруженные каплевидными щитами, эти солдаты представляют собой живую стену, о которую разбиваются атаки врага."

 # Королевство Локирия
 blademasters_of_lokiria:0 "Мастера Клинка Локирии"
 blademasters_of_lokiria_flavor:0 "Гордость Королевства Локирия и живое воплощение доблести Валирийского Фригольда. Эти аристократы-фехтовальщики, посвятившие жизнь искусству владения двуручным мечом. Их доспехи, украшенные чеканкой в виде переплетенных змей и драконов, созданы мастерами-кузнецами для обеспечения максимальной подвижности при сохранении полной защиты."
 steelbows_of_lokiria:0 "Сталелуки Локирии"
 steelbows_of_lokiria_flavor:0 "Уникальный корпус стрелков Королевства Локирия, опровергающий стереотип о том, что лучник должен быть легко вооружен. Эти воины носят тяжелые доспехи, что позволяет им вести дуэли с вражескими застрельщиками, не опасаясь ответного огня."

 # Династия Матейрион
 purple_trident_arrows:0 "Стрелки Пурпурного Трезубца"
 purple_trident_arrows_flavor:0 "Элитные лучники Дома Матейрион, охраняющие порты и прибрежные твердыни своих лордов. Эти воины славятся своей способностью вести прицельную стрельбу даже в условиях штормового ветра или густого морского тумана."
 scaled_guard_mateirion:0 "Чешуйчатая Гвардия Матейрион"
 scaled_guard_mateirion_flavor:0 "Вооруженные массивными стальными шестоперами, гвардейцы специализируются на прорыве вражеских построений, где щиты и латы становятся бесполезными под сокрушительной мощью их дробящих ударов."

 # Династия Сонарьен
 blades_purple_grove:0 "Клинки Пурпурной Рощи"
 blades_purple_grove_flavor:0 "Почетная гвардия Дома Сонарьен, чье мастерство владения мечом воспето в балладах Фригольда. В отличие от тяжеловесных рыцарей других домов, эти воины предпочитают более легкие открытые шлемы и кирасы, обеспечивающие превосходный обзор и свободу движений."
 thorns_purple_garden:0 "Шипы Пурпурного Сада"
 thorns_purple_garden_flavor:0 "Основная опора армий Дома Сонарьен. Эти солдаты обучены сражаться в тесном строю, выставляя перед собой стену длинных ясеневых копий. «Шипы» олицетворяют защитный аспект своей геральдики: они — та самая изгородь, о которую разбивается любая попытка осквернить земли Сонарьенов."

 # Династия Таргариен
 knights_dragon_flame:0 "Рыцари Драконьего Пламени"
 knights_dragon_flame_flavor:0 "Высшая аристократия и верные вассалы Дома Таргариенов, чье появление на поле боя предвещает гибель. Когда они опускают свои длинные копья и переходят в чардж, кажется, будто сама земля дрожит под копытами их бронированных коней."
 dragon_eye_crossbowmen:0 "Арбалетчики Драконьего Ока"
 dragon_eye_crossbowmen_flavor:0 "В отличие от вольных наемников, арбалетчики «Драконьего Ока» — это кадровые военные, которые обучены вести залповый огонь, способный остановить даже самую тяжелую кавалерию Вестероса. Их арбалеты обладают чудовищной пробивной силой."

 # Династия Урнебар
 urnebar_smashers:0 "Крушители Урнебаров"
 urnebar_smashers_flavor:0 "Специализированный корпус тяжелой пехоты, чье предназначение — превращать вражеские построения в кровавый хаос. Их главное оружие — массивные двуручные секиры, способные одним ударом раскалывать щиты и перерубать древки копий."
 armor_piercing_urnebars:0 "Бронебои Урнебаров"
 armor_piercing_urnebars_flavor:0 "Гордость арсеналов Дома Урнебар. Эти стрелки облачены в массивные чешуйчатые панцири, позволяющие им игнорировать ответный обстрел легких застрельщиков. Их тяжелые стальные арбалеты оснащены особыми воронеными болтами."

 # Династия Урузарис
 shadows_of_sothoryos:0 "Тени Соториоса"
 shadows_of_sothoryos_flavor:0 "Специализированный корпус Дома Урузарисов, приученный к ведению войны в удушающей жаре и непроходимых зарослях южного континента. Эти воины специализируются на тактике «ударь и беги», заманивая неповоротливые армии врага вглубь джунглей."
 basilisk_riders_uruzarys:0 "Наездники на Василисках"
 basilisk_riders_uruzarys_flavor:0 "В то время как северные дома Валирии полагаются на коней или драконов, Дом Урузарисов приручил свирепых василисков Джунглей Смерти. Эти массивные чешуйчатые рептилии не знают страха."

 # Династия Селтигар
 claw_guardians:0 "Стражи Клешни"
 claw_guardians_flavor:0 "Хотя Селтигары и не обладают мощью великих домов Валирии, их воины славятся своей невероятной цепкостью в бою. «Стражи Клешни» — это профессиональная пехота острова Клешня, обученная сражаться в тесном строю на узких береговых полосах и палубах кораблей."
 coastal_butchers:0 "Береговые Мясники"
 coastal_butchers_flavor:0 "Эти воины — живое воплощение ярости морского прибоя. В то время как другие дома полагаются на изящные мечи, Селтигары отдают предпочтение тяжелым топорам, способным крушить кости и пробивать щиты."

 # Династия Веларион
 sea_serpents_velaryon:0 "Морские Змеи"
 sea_serpents_velaryon_flavor:0 "Живое воплощение морского могущества Дрифтмарка. Облаченные в чешуйчатые доспехи из полированной стали, защищающие их от влаги и коррозии, «Морские Змеи» одинаково опасны как на палубе дредноута, так и на суше."
 knights_of_tide:0 "Рыцари Прилива"
 knights_of_tide_flavor:0 "Гордость и стальной кулак Дрифтмарка. Эти всадники представляют собой редкое зрелище: валирийское благородство, закаленное в соленых брызгах Узкого моря. Облаченные в доспехи высочайшего качества с характерными драконьими гребнями на шлемах."

 # Гегемония - Валирийский Фригольд
 praetorians_of_freehold:0 "Преторианцы Фригольда"
 praetorians_of_freehold_flavor:0 "Эти рыцари — живой символ имперской воли Валирии. Облаченные в латы, покрытые искусной гравировкой из валирийской стали, они представляют собой непреодолимую силу на поле боя. Их мечи выкованы из лучшей стали, а ростовые щиты способны выдержать даже удар тарана."

 # Королевство Лирия
 liria_incinerators:0 "Инсинераторы Лирии"
 liria_incinerators_flavor:0 "Лирия известна как хранилище древних знаний, но её главная защита — не высокие стены, а те, кто ими владеет. Инсинераторы — это боевое крыло лирийских академий магии. Облаченные в тяжелые багряные робы и скрывающие лица под масками, они направляют чистую энергию Фригольда через посохи из обожженного драконьим пламенем дерева."

 # Дом Биттерстил
 iron_stallions:0 "Железные Жеребцы"
 iron_stallions_flavor:0 "«Горькая сталь» — это не просто девиз, это суть каждого воина в этом полку. Железные Жеребцы — это профессиональная гвардия Дома Биттерстилов, набранная из самых закаленных и суровых ветеранов Речных земель и Драконьего Камня. Вооруженные тяжелыми боевыми молотами, способными проминать лучшие валирийские доспехи, и прикрытые треугольными щитами с эмблемой красного жеребца, они идут в бой с неумолимостью шторма."
 steelhoof_crossbowmen:0 "Арбалетчики «Стального Копыта»"
 steelhoof_crossbowmen_flavor:0 "Эти воины — хладнокровный ответ Дома Биттерстилов на рыцарскую гордыню Вестероса. В отличие от ополченцев, арбалетчики «Стального Копыта» — профессиональные солдаты, облаченные в полные латы и обученные вести огонь в самых жестких условиях боя."

 # Дом Блэкфайр
 black_dragon_warriors:0 "Воины Черного Дракона"
 black_dragon_warriors_flavor:0 "Эти рыцари — фанатичные приверженцы истинных бастардов Таргариенов, верящие, что власть принадлежит тому, кто способен удержать меч. Облаченные в доспехи кроваво-красного цвета, они внушают ужас одним своим видом. Каждый из них поклялся на мече Блэкфайр, что не отступит, пока законный государь не воцарится над Семью Королевствами."
 crimson_peaks_blackfyre:0 "Багряные Пики Блэкфайров"
 crimson_peaks_blackfyre_flavor:0 "Эти воины составляют стальной хребет армии Черного Дракона. Облаченные в тяжелые латы, покрытые алой эмалью, они обучены действовать как единый организм, выставляя перед собой непроницаемый лес длинных пик. Их задача — удерживать ключевые позиции, превращая поле боя в неприступную крепость, о которую разбиваются надежды врагов."

 # Империя Северная Валирия
 mountain_guard_north_valyria:0 "Горные Стражи Северной Валирии"
 mountain_guard_north_valyria_flavor:0 "Закаленные в разреженном воздухе и вечных снегах северных пиков, эти стрелки составляют основу обороны Северной Валирии. В отличие от южных сородичей, они используют массивные луки из черного дерева. Горные Стражи — мастера стрельбы под крутым углом; их залпы обрушиваются на врага подобно каменным лавинам, а знание каждой тайной тропы позволяет им исчезать и появляться там, где противник меньше всего их ждет."

 # Королевство Элирия
 halberdiers_lone_peak:0 "Алебардисты Одинокого Пика"
 halberdiers_lone_peak_flavor:0 "Элирия, будучи изолированным островным королевством, полагается на дисциплину и длину древка. Алебардисты Одинокого Пика — это кадровые гвардейцы, обученные сражаться в условиях ограниченного пространства. Их массивные алебарды позволяют не только держать дистанцию, но и эффективно стаскивать всадников с седел или прорубать щиты щитоносцев."

 # Королевство Элория и Велес
 bronze_sunbearers:0 "Бронзовые Солнценосцы"
 bronze_sunbearers_flavor:0 "Элитные защитники Элории, чье снаряжение отражает древние металлургические секреты колонии. Их доспехи выкованы из редкого сплава бронзовой стали, который сочетает в себе гибкость классической бронзы и несокрушимую прочность валирийских рецептов."
