l_spanish:
 # Dynasty Belaerys
 sunspears_of_belaerys:0 "Lanzas del Sol de Belaerys"
 sunspears_of_belaerys_flavor:0 "La guardia personal de la Casa Belaerys, revestida de acero negro como la obsidiana. Estos caballeros montados encarnan la grandeza de Valyria: sus armaduras lucen grabados dorados en forma de sol ardiente, y sus yelmos están coronados con alas de dragón."
 sunhammers_of_belaerys:0 "Martillos del Sol de Belaerys"
 sunhammers_of_belaerys_flavor:0 "Caballeros desmontados y sargentos de élite de la Casa Belaerys que cambiaron sus lanzas por pesadas mazas a dos manos y mazas de bridas. Sus armaduras de acero bruñido resisten lluvias de flechas, y un solo golpe de sus armas demoledoras reduce la coraza enemiga a metal inservible."

 # Dynasty Varezys
 halberdiers_golden_flame:0 "Alabarderos de la Llama Dorada"
 halberdiers_golden_flame_flavor:0 "Un cuerpo profesional de infantería pesada al servicio de la Casa Varezys. A diferencia de otras casas valyrias que confían en la fuerza bruta, los Varezys priorizan la disciplina y la formación cerrada. Estos soldados visten media armadura sobre túnicas rojo oscuro, y sus alabardas les permiten detener cargas de caballería y arrancar jinetes de sus monturas con igual eficacia."
 veterans_laurel_crown:0 "Veteranos de la Corona de Laurel"
 veterans_laurel_crown_flavor:0 "Infantería de élite de la Casa Varezys, formada por los nobles más experimentados que probaron su lealtad en el campo de batalla. Revestidos con armadura completa y armados con escudos en forma de lágrima, estos soldados conforman un muro viviente contra el cual se estrellan los ataques enemigos."

 # Kingdom of Lokiria
 blademasters_of_lokiria:0 "Maestros de la Espada de Lokiria"
 blademasters_of_lokiria_flavor:0 "El orgullo del Reino de Lokiria y la encarnación viviente del valor del Feudo Franco Valyrio. Estos aristócratas espadachines han consagrado sus vidas al arte de la espada a dos manos. Sus armaduras, adornadas con grabados de serpientes y dragones entrelazados, son forjadas por maestros herreros para ofrecer máxima movilidad sin sacrificar protección completa."
 steelbows_of_lokiria:0 "Arcos de Acero de Lokiria"
 steelbows_of_lokiria_flavor:0 "Un cuerpo singular de arqueros del Reino de Lokiria, que desafía el estereotipo de que un arquero debe ir ligeramente armado. Estos guerreros portan armadura pesada, lo que les permite batirse con hostigadores enemigos sin temer el fuego de respuesta. Sus enormes arcos, reforzados con inserciones de acero, pueden lanzar pesadas saetas a distancias colosales, atravesando incluso la coraza de un caballero."

 # Dynasty Mataeryon
 purple_trident_arrows:0 "Flechas del Tridente Púrpura"
 purple_trident_arrows_flavor:0 "Arqueros de élite de la Casa Mataeryon, encargados de custodiar los puertos y bastiones costeros de sus señores. Estos guerreros son célebres por su capacidad de lanzar fuego certero incluso bajo vientos tormentosos o entre la espesa bruma marina."
 scaled_guard_mateirion:0 "Guardia Escamada de Mataeryon"
 scaled_guard_mateirion_flavor:0 "Armados con enormes mazas de acero con aletas, estos guardias se especializan en quebrar formaciones enemigas, donde escudos y corazas se vuelven inútiles bajo la fuerza demoledora de sus golpes."

 # Dynasty Sonaryen
 blades_purple_grove:0 "Espadas del Bosque Púrpura"
 blades_purple_grove_flavor:0 "La guardia honoraria de la Casa Sonaryen, cuya destreza con la espada es celebrada en las baladas del Feudo Franco Valyrio. A diferencia de los caballeros fuertemente acorazados de otras casas, estos guerreros prefieren yelmos abiertos y corazas más ligeras, lo que les otorga mejor visión y mayor libertad de movimiento."
 thorns_purple_garden:0 "Espinas del Jardín Púrpura"
 thorns_purple_garden_flavor:0 "El pilar principal de los ejércitos de la Casa Sonaryen. Estos soldados están entrenados para combatir en formación cerrada, alzando un muro de largas lanzas de fresno. Las «Espinas» encarnan el aspecto defensivo de su heráldica: son el seto contra el cual se quiebra cualquier intento de mancillar las tierras de los Sonaryen."

 # Dynasty Targaryen
 knights_dragon_flame:0 "Caballeros de la Llama del Dragón"
 knights_dragon_flame_flavor:0 "La más alta aristocracia y vasallos leales de la Casa Targaryen, cuya sola presencia en el campo de batalla anuncia la perdición. Cuando bajan sus largas lanzas y cargan, la propia tierra parece estremecerse bajo los cascos de sus corceles acorazados, y sus sobreveste negras con el dragón tricéfalo rojo se convierten en lo último que el enemigo contempla antes de la muerte."
 dragon_eye_crossbowmen:0 "Ballesteros del Ojo del Dragón"
 dragon_eye_crossbowmen_flavor:0 "A diferencia de mercenarios errantes, los ballesteros del «Ojo del Dragón» son soldados de carrera entrenados para desatar andanadas capaces de detener incluso a la caballería más pesada de Poniente. Sus ballestas poseen un poder de penetración monstruoso, y su emblema recuerda a todo adversario que ningún escudo puede ocultarse de la mirada del dragón."

 # Dynasty Urnebar
 urnebar_smashers:0 "Aplastadores Urnebar"
 urnebar_smashers_flavor:0 "Un cuerpo especializado de infantería pesada cuya finalidad es convertir las formaciones enemigas en un caos sangriento. Su arma principal — enormes hachas a dos manos capaces de partir escudos y cercenar astas de lanza de un solo golpe."
 armor_piercing_urnebars:0 "Urnebar Perforacorazas"
 armor_piercing_urnebars_flavor:0 "El orgullo de los arsenales de la Casa Urnebar. Estos tiradores van revestidos con pesada armadura escamada, lo que les permite ignorar el fuego de respuesta de hostigadores ligeros. Sus ballestas de acero reforzado disparan virotes bruñidos especiales que, a corta y media distancia, atraviesan la coraza de un caballero como si fuera pergamino."

 # Dynasty Uruzarys
 shadows_of_sothoryos:0 "Sombras de Sothoryos"
 shadows_of_sothoryos_flavor:0 "Un cuerpo especializado de la Casa Uruzarys, habituado a guerrear bajo el calor sofocante y entre la maleza impenetrable del continente austral. Estos guerreros dominan las tácticas de hostigamiento y retirada, atrayendo a los pesados ejércitos enemigos a lo profundo de la jungla, donde la propia naturaleza se convierte en aliada de los Uruzarys."
 basilisk_riders_uruzarys:0 "Jinetes de Basilisco"
 basilisk_riders_uruzarys_flavor:0 "Mientras las casas septentrionales de Valyria confían en caballos o dragones, la Casa Uruzarys ha logrado domar a los feroces basiliscos de las Junglas de la Muerte. Estos enormes reptiles escamados no conocen el miedo y pueden desplazarse entre la densa maleza que sería tumba segura para la caballería ordinaria."

 # Dynasty Celtigar
 claw_guardians:0 "Guardianes de la Garra"
 claw_guardians_flavor:0 "Aunque los Celtigar no poseen el poderío de las grandes casas de Valyria, sus guerreros son célebres por su increíble tenacidad en combate. Los «Guardianes de la Garra» constituyen la infantería profesional de la Isla de la Garra, entrenada para luchar en formación cerrada sobre estrechas franjas costeras y en las cubiertas de los navíos."
 coastal_butchers:0 "Carniceros Costeros"
 coastal_butchers_flavor:0 "Estos guerreros son la encarnación viviente de la furia del oleaje. Mientras otras casas confían en espadas elegantes, los Celtigar prefieren hachas pesadas capaces de quebrar huesos y destrozar escudos."

 # Dynasty Velaryon
 sea_serpents_velaryon:0 "Serpientes Marinas"
 sea_serpents_velaryon_flavor:0 "La encarnación viviente del poder naval de Marcaderiva. Revestidos con armadura escamada de acero pulido que los protege de la humedad y la corrosión, las «Serpientes del Mar» son igual de letales sobre la cubierta de un navío de guerra que en tierra firme."
 knights_of_tide:0 "Caballeros de las Mareas"
 knights_of_tide_flavor:0 "El orgullo y puño de acero de Marcaderiva. Estos jinetes son una visión poco común: nobleza valyria forjada bajo la salobre bruma del Mar Angosto. Ataviados con armaduras de la más alta calidad y yelmos coronados con crestas de dragón, sirven en veloces navíos, siempre listos para un desembarco rápido y un golpe demoledor en el corazón de la formación enemiga."

 # Hegemony - Valyrian Freehold
 praetorians_of_freehold:0 "Pretorianos del Feudo Franco"
 praetorians_of_freehold_flavor:0 "Estos caballeros son el símbolo viviente de la voluntad imperial de Valyria. Revestidos con armadura de placas cubierta de exquisitos grabados de acero valyrio, constituyen una fuerza irresistible en el campo de batalla. Sus espadas están forjadas con el acero más fino, y sus escudos de torre pueden resistir incluso el embate de un ariete."

 # Kingdom of Lyria
 liria_incinerators:0 "Incineradores de Lyria"
 liria_incinerators_flavor:0 "Lyria es conocida como un repositorio de saberes ancestrales, pero su verdadera defensa no reside en sus altas murallas, sino en quienes las custodian. Los Incineradores constituyen el ala marcial de las academias mágicas de Lyria. Revestidos con pesadas túnicas carmesí y ocultando sus rostros tras máscaras, canalizan la energía pura del Feudo Franco a través de báculos forjados con madera chamuscada por la llama de dragón."