l_english:
 # Dynasty Belaerys
 sunspears_of_belaerys:0 "Sunspears of Belaerys"
 sunspears_of_belaerys_flavor:0 "The personal guard of House Belaerys, clad in obsidian-black steel. These mounted knights embody the might of Valyria: their armor adorned with golden engravings in the shape of a blazing sun, and their helms crowned with dragon wings."
 sunhammers_of_belaerys:0 "Sunhammers of Belaerys"
 sunhammers_of_belaerys_flavor:0 "Dismounted knights and elite sergeants of House Belaerys who traded lances for heavy two-handed maces and flanged maces. Their burnished steel armor can withstand a rain of arrows, and a single swing of their crushing weapons turns enemy plate into useless metal."

 # Dynasty Varezys
 halberdiers_golden_flame:0 "Halberdiers of Golden Flame"
 halberdiers_golden_flame_flavor:0 "A professional corps of heavy infantry in service to House Varezys. Unlike other Valyrian houses relying on brute force, the Varezys prioritize discipline and formation. These soldiers wear half-plate over dark-red tunics, and their halberds allow them to halt cavalry charges and pull riders from their saddles with equal efficiency."
 veterans_laurel_crown:0 "Veterans of Laurel Crown"
 veterans_laurel_crown_flavor:0 "Elite infantry of House Varezys, formed from the most experienced nobles who proved their loyalty on the battlefield. Clad in full armor and armed with teardrop shields, these soldiers form a living wall against which enemy attacks shatter."

 # Kingdom of Lokiria
 blademasters_of_lokiria:0 "Blademasters of Lokiria"
 blademasters_of_lokiria_flavor:0 "The pride of the Kingdom of Lokiria and the living embodiment of the valor of the Valyrian Freehold. These aristocrat-swordsmen have devoted their lives to the art of the two-handed sword. Their armor, adorned with engravings of intertwined serpents and dragons, is crafted by master smiths for maximum mobility while maintaining full protection."
 steelbows_of_lokiria:0 "Steelbows of Lokiria"
 steelbows_of_lokiria_flavor:0 "A unique corps of archers of the Kingdom of Lokiria, defying the stereotype that an archer must be lightly armed. These warriors wear heavy armor, allowing them to duel enemy skirmishers without fear of return fire. Their massive bows, reinforced with steel inserts, can send heavy arrows over immense distances, piercing even knightly plate."

 # Dynasty Mataeryon
 purple_trident_arrows:0 "Purple Trident Arrows"
 purple_trident_arrows_flavor:0 "Elite archers of House Mataeryon, guarding the ports and coastal strongholds of their lords. These warriors are famed for their ability to deliver accurate fire even in stormy winds or thick sea fog."
 scaled_guard_mateirion:0 "Scaled Guard of Mataeryon"
 scaled_guard_mateirion_flavor:0 "Armed with massive steel flanged maces, the guardsmen specialize in breaking enemy formations, where shields and plate become useless under the crushing might of their blows."

 # Dynasty Sonaryen
 blades_purple_grove:0 "Blades of Purple Grove"
 blades_purple_grove_flavor:0 "The honorary guard of House Sonaryen, whose swordsmanship is celebrated in the ballads of the Freehold. Unlike the heavily armored knights of other houses, these warriors prefer lighter open helms and cuirasses, ensuring superior vision and freedom of movement."
 thorns_purple_garden:0 "Thorns of Purple Garden"
 thorns_purple_garden_flavor:0 "The main pillar of House Sonaryen's armies. These soldiers are trained to fight in tight formation, presenting a wall of long ash spears. The 'Thorns' embody the defensive aspect of their heraldry: they are the hedge against which any attempt to defile the lands of the Sonaryens is broken."

 # Dynasty Targaryen
 knights_dragon_flame:0 "Knights of Dragon Flame"
 knights_dragon_flame_flavor:0 "The highest aristocracy and loyal vassals of House Targaryen, whose appearance on the battlefield heralds doom. When they lower their long lances and charge, the very earth seems to tremble beneath the hooves of their armored steeds, and their black tabards with the red three-headed dragon become the last thing the enemy sees before death."
 dragon_eye_crossbowmen:0 "Dragon's Eye Crossbowmen"
 dragon_eye_crossbowmen_flavor:0 "Unlike freelance mercenaries, the crossbowmen of the 'Dragon's Eye' are career soldiers trained to deliver volley fire capable of stopping even the heaviest cavalry of Westeros. Their crossbows possess monstrous piercing power, and their emblem reminds every foe: no shield can hide from the dragon's gaze."

 # Dynasty Urnebar
 urnebar_smashers:0 "Urnebar Smashers"
 urnebar_smashers_flavor:0 "A specialized corps of heavy infantry whose purpose is to turn enemy formations into bloody chaos. Their main weapon — massive two-handed axes capable of splitting shields and severing spear shafts in a single blow."
 armor_piercing_urnebars:0 "Armor-piercing Urnebars"
 armor_piercing_urnebars_flavor:0 "The pride of House Urnebar's arsenals. These shooters are clad in massive scale armor, allowing them to ignore the return fire of light skirmishers. Their heavy steel crossbows are equipped with special burnished bolts that at short and medium range pierce knightly plate like parchment."

 # Dynasty Uruzarys
 shadows_of_sothoryos:0 "Shadows of Sothoryos"
 shadows_of_sothoryos_flavor:0 "A specialized corps of House Uruzarys, accustomed to waging war in the suffocating heat and impenetrable thickets of the southern continent. These warriors specialize in hit-and-run tactics, luring the enemy's cumbersome armies deep into the jungle, where nature itself becomes an ally of the Uruzarys."
 basilisk_riders_uruzarys:0 "Basilisk Riders"
 basilisk_riders_uruzarys_flavor:0 "While the northern houses of Valyria rely on horses or dragons, House Uruzarys has tamed the ferocious basilisks of the Jungles of Death. These massive scaled reptiles know no fear and can navigate through dense undergrowth that would be a grave for ordinary cavalry."

 # Dynasty Celtigar
 claw_guardians:0 "Claw Guardians"
 claw_guardians_flavor:0 "Though the Celtigars do not possess the might of the great houses of Valyria, their warriors are famed for their incredible tenacity in battle. The 'Claw Guardians' are professional infantry of Claw Isle, trained to fight in tight formation on narrow coastal strips and ship decks."
 coastal_butchers:0 "Coastal Butchers"
 coastal_butchers_flavor:0 "These warriors are the living embodiment of the fury of the sea surf. While other houses rely on elegant swords, the Celtigars favor heavy axes capable of crushing bones and smashing shields."

 # Dynasty Velaryon
 sea_serpents_velaryon:0 "Sea Serpents"
 sea_serpents_velaryon_flavor:0 "The living embodiment of Driftmark's naval might. Clad in scale armor of polished steel that protects them from moisture and corrosion, the 'Sea Serpents' are equally dangerous on the deck of a dreadnought and on land."
 knights_of_tide:0 "Knights of Tide"
 knights_of_tide_flavor:0 "The pride and steel fist of Driftmark. These riders are a rare sight: Valyrian nobility tempered in the salt spray of the Narrow Sea. Clad in armor of the highest quality with characteristic dragon crests on their helms, they serve on swift ships, ready for rapid landing and a crushing blow at the heart of the enemy formation."

 # Hegemony - Valyrian Freehold
 praetorians_of_freehold:0 "Praetorians of Freehold"
 praetorians_of_freehold_flavor:0 "These knights are the living symbol of Valyria's imperial will. Clad in plate covered with exquisite Valyrian steel engravings, they are an irresistible force on the battlefield. Their swords are forged from the finest steel, and their tower shields can withstand even a battering ram."

 # Kingdom of Lyria
 liria_incinerators:0 "Incinerators of Lyria"
 liria_incinerators_flavor:0 "Lyria is known as a repository of ancient knowledge, but its main defense is not its high walls, but those who wield them. The Incinerators are the combat wing of Lyria's academies of magic. Clad in heavy crimson robes and concealing their faces behind masks, they channel the pure energy of the Freehold through staves of dragon-flame-scorched wood."

 # House Bittersteel
 iron_stallions:0 "Iron Stallions"
 iron_stallions_flavor:0 "'Bitter steel' is not just a motto, it is the essence of every warrior in this regiment. The Iron Stallions are the professional guard of House Bittersteel, recruited from the most hardened and grim veterans of the Riverlands and Dragonstone. Armed with heavy war hammers capable of denting the finest Valyrian armor, and covered by triangular shields bearing the red stallion emblem, they march into battle with the relentlessness of a storm."
 steelhoof_crossbowmen:0 "Steelhoof Crossbowmen"
 steelhoof_crossbowmen_flavor:0 "These warriors are House Bittersteel's cold-blooded answer to the knightly pride of Westeros. Unlike levies, the Steelhoof Crossbowmen are professional soldiers clad in full plate and trained to deliver fire under the harshest conditions of battle."

 # House Blackfyre
 black_dragon_warriors:0 "Black Dragon Warriors"
 black_dragon_warriors_flavor:0 "These knights are fanatical adherents of the true bastards of the Targaryens, believing that power belongs to those who can hold a sword. Clad in blood-red armor, they inspire terror by their mere appearance. Each has sworn upon the sword Blackfyre that they will not retreat until their rightful sovereign rules the Seven Kingdoms."
 crimson_peaks_blackfyre:0 "Crimson Peaks of Blackfyre"
 crimson_peaks_blackfyre_flavor:0 "These warriors form the steel backbone of the Black Dragon's army. Clad in heavy plate covered in crimson enamel, they are trained to act as a single organism, presenting an impenetrable forest of long pikes. Their task is to hold key positions, turning the battlefield into an impregnable fortress against which the hopes of enemies shatter."

 # Empire of North Valyria
 mountain_guard_north_valyria:0 "Mountain Guard of North Valyria"
 mountain_guard_north_valyria_flavor:0 "Hardened in the thin air and eternal snows of the northern peaks, these shooters form the backbone of North Valyria's defense. Unlike their southern kin, they use massive bows of black wood. The Mountain Guard are masters of shooting at steep angles; their volleys crash down upon the enemy like stone avalanches, and their knowledge of every secret trail allows them to vanish and appear where the enemy least expects them."

 # Kingdom of Elyria
 halberdiers_lone_peak:0 "Halberdiers of Lone Peak"
 halberdiers_lone_peak_flavor:0 "Elyria, being an isolated island kingdom, relies on discipline and the length of the shaft. The Halberdiers of Lone Peak are career guardsmen trained to fight in confined spaces. Their massive halberds allow them not only to keep distance, but also to effectively pull riders from their saddles or hack through shieldwalls."

 # Kingdom of Elyria and Velos
 bronze_sunbearers:0 "Bronze Sunbearers"
 bronze_sunbearers_flavor:0 "Elite defenders of Eloria, whose equipment reflects the ancient metallurgical secrets of the colony. Their armor is forged from a rare bronze-steel alloy that combines the flexibility of classical bronze with the indestructible strength of Valyrian recipes."
