l_english:

#High Valyrian

high_valyrian_legacy_track_name: "High Valyrian"
high_valyrian_legacy_track_desc: "From the ashes of the Freehold, our dominion shall rise again."
high_valyrian_legacy_1_name: "Scions of the Freehold"
high_valyrian_legacy_2_name: "Tongue of Dragons"
high_valyrian_legacy_3_name: "Forged in Fire and Blood"
high_valyrian_legacy_4_name: "Rule of the Dragons"
high_valyrian_legacy_5_name: "Ashes of the Doom"


HIGH_VALYRIAN_SCIONS_OF_THE_FREEHOLD_NO_BULLETTAB:0 "We are the blood of the Forty, keepers of an unyielding sovereignty that ruled the known world for thousands of years. \n#weak Our veins carry the sorcery of the Freehold, refusing to mix with lesser men."

HIGH_VALYRIAN_TONGUE_OF_DRAGONS_NO_BULLETTAB:0 "Our ancestral language is not meant for common commerce, but for blood-vows, sorcery, and the thundering commands that bend beasts to our will. \n#weak When High Valyrian is spoken, the world listens in terror."

HIGH_VALYRIAN_FORGED_IN_FIRE_AND_BLOOD_NO_BULLETTAB:0 "Tempered in the volcanic heat of the Fourteen Flames, our line is impervious to the sicknesses and fragile fears of the southrons. \n#weak The blood of the dragon runs hot, proud, and entirely unburnt."

HIGH_VALYRIAN_RULE_OF_THE_DRAGONS_NO_BULLETTAB:0 "Feudal laws and smallfolk customs mean nothing to those who command the sky. Imperial rule is our birthright, and we answer to no gods but our own. \n#weak The dragonlords claim what is theirs by right of absolute conquest."

HIGH_VALYRIAN_ASHES_OF_THE_DOOM_NO_BULLETTAB:0 "Though the Freehold shattered in a cataclysm of boiling glass and fire, we are the living embers of that extinct empire—ruthless, unrepentant, and ready to rebuild. \n#weak We carve our new kingdoms out of the ashes of the old world."


#Westerosi Valyrian

westerosi_valyrian_legacy_track_name: "Westerosi Valyrian"
westerosi_valyrian_legacy_track_desc: "What fire did not consume, ambition reforged."
westerosi_valyrian_legacy_1_name: "Embers of Valyria"
westerosi_valyrian_legacy_2_name: "Serpents of the Sea-Wind"
westerosi_valyrian_legacy_3_name: "Blood of the High Towered Houses"
westerosi_valyrian_legacy_4_name: "Sea-Carved Thrones"
westerosi_valyrian_legacy_5_name: "Forged in Smoke and Legacy"


WESTEROSI_VALYRIAN_EMBERS_OF_VALYRIA_NO_BULLETTAB:0 "We are the silver-haired outliers of the Narrow Sea, maintaining our ancient lineage while anchoring our fortunes firmly in the stone of Westeros. \n#weak Our blood remains proud, but our eyes are fixed on the future of the realm."

WESTEROSI_VALYRIAN_SERPENTS_OF_THE_SEA_WIND_NO_BULLETTAB:0 "Commanding the deep channels from the Gullet to the Stepstones, our fleets dictate the trade of the known world. We do not need to ride dragons when our hulls master the salt-water. \n#weak Valyrian blood rules the waves, and our coffers overflow with foreign coin."

WESTEROSI_VALYRIAN_BLOOD_OF_THE_HIGH_TOWERED_HOUSES_NO_BULLETTAB:0 "From the high seat of High Tide to the black stone of Dragonstone, our dynasties built walls that dominate the shipping lanes. We coil our power around the vital choke-points of the Trident and the Blackwater. \n#weak Our coastal bastions echo with ancestral pride and maritime leverage."

WESTEROSI_VALYRIAN_SEA_CARVED_THRONES_NO_BULLETTAB:0 "The autumn storms have shattered our hulls and tested our timber for centuries, yet we always return to claim dominion over the bays. We rule through iron navigation and naval blockades. \n#weak No king can cross the narrow seas without our explicit consent."

WESTEROSI_VALYRIAN_FORGED_IN_SMOKE_AND_LEGACY_NO_BULLETTAB:0 "We were not born in the melting heat of the Freehold, but tempered by the harsh realities of Westerosi politics and maritime warfare. Our legacy is written in salt-stained parchment and seasoned oak. \n#weak We forge our own empire, built on heavy wood and absolute naval supremacy."


#Essosi Valyrian

essosi_valyrian_legacy_track_name: "Essosi Valyrian"
essosi_valyrian_legacy_track_desc: "Old Blood, Black Walls, and ever shadowed by the Doom."
essosi_valyrian_legacy_1_name: "Old Blood of the Black Walls"
essosi_valyrian_legacy_2_name: "Codices of Dragon-Law"
essosi_valyrian_legacy_3_name: "Ash-Shrouded Lineage"
essosi_valyrian_legacy_4_name: "City of Chains"
essosi_valyrian_legacy_5_name: "Blood Above All"


ESSOSI_VALYRIAN_BLACK_WALLS_OLD_BLOOD_NO_BULLETTAB:0 "Behind the colossal, fused-black stone of the Black Walls, we live as if the Doom never touched our empire. Our lineages are recited like holy scripture, our dynastic marriages are recorded in ledgers older than the Triarchy, and the ancient rites of Valyria are preserved within pristine palaces of basalt and dragon-glass.\n#weak We do not mingle with the freedmen or the foreign mud beyond our gates. Our pedigree is absolute law."

ESSOSI_VALYRIAN_DRAGONLAW_CODICES_NO_BULLETTAB:0 "When fire consumed the Freehold, the First Daughter of Valyria seized what the flames could not burn—the absolute majesty of Valyrian law. Codices written in ancient glyphs, magistrate tallies, and ancestral precedents dictate our governance, balancing accounts as ruthlessly as we manage our geopolitical alliances.\n#weak From our counting-houses to our massive quays, the law of the Freehold remains unyielding."

ESSOSI_VALYRIAN_ASH_SHROUDED_LINEAGE_NO_BULLETTAB:0 "We do not walk the streets like common men; we ride above the dirt in gilded palanquins borne on the backs of slaves. Let the foreign merchants guess at our wealth and whisper of our private sorceries behind closed doors—our isolation is our strength, and our supreme arrogance is our birthright.\n#weak We are the untouched aristocracy of the east, looking down on the world from our high seats."

ESSOSI_VALYRIAN_CITY_OF_CHAINS_NO_BULLETTAB:0 "The Long Bridge groans under the staggering wealth of our slave markets, where five slaves labor for every free citizen. Our shipyards and warehouses weave a massive fortune measured strictly in ink for our ledgers, iron for our collars, and the tattoos inked directly onto human skin to mark a life's station.\n#weak We command the greatest slave-state in the known world, our power anchored in iron chains."

ESSOSI_VALYRIAN_BLACK_WALLS_BLOOD_ABOVE_ALL_NO_BULLETTAB:0 "The Triarchy belongs to the Old Blood, and no annual election or populist mob can ever dilute the authority of names carved into the stone of Valyria. Let the Tigers scream for war and the Elephants buy the votes of the commoners—in the end, the masters of the Black Walls always hold the ultimate leverage over the fate of Essos.\n#weak We are the true heirs of the Freehold, and our legacy commands the east."



#Sisterman

sisterman_legacy_track_name: "Sisterman"
sisterman_legacy_track_desc: "The tides remember our name, even if the lords forget."
sisterman_legacy_1_name: "Blood in the Brine"
sisterman_legacy_2_name: "Storm-Kissed Sails"
sisterman_legacy_3_name: "Isles Apart, Blades Alike"
sisterman_legacy_4_name: "The Grave of Strangers"
sisterman_legacy_5_name: "Saltcairn Wisdom"


SISTERMAN_BLOOD_IN_THE_BRINE_NO_BULLETTAB:0 "Born in the freezing bogs and slate-gray gales of the Bite, our blood has never belonged to the soft mainland kings. We carry ourselves with the hard, cold resilience of the rocks, our fingers marked by the webbed skin of our ancestors.\n#weak The mark of the Bite runs deep, and our heritage refuses to be drowned by southron laws."

SISTERMAN_STORM_KISSED_SAILS_NO_BULLETTAB:0 "When the gales scream across the Bite, our skiffs fly through the black water while Vale cogs shatter against the rocks. We do not look to septons for mercy—we pray to the Lord of the Skies and the Lady of the Waves to send us our plunder.\n#weak The autumn storms are our truest allies, clearing the seas for our reivers."

SISTERMAN_ISLES_APART_BLADES_ALIKE_NO_BULLETTAB:0 "Though Sweetsister, Longsister, and Littlesister bicker endlessly over fishing bogs and cave-loot, we share a bitter memory of the Rape of the Three Sisters. When the northern wolves or falcon knights threaten our shores, our iron hooks strike in unison.\n#weak We forget no ancient atrocities, and we yield no inch of our rock to outsiders."

SISTERMAN_THE_GRAVE_OF_STRANGERS_NO_BULLETTAB:0 "Let the wealthy merchants of White Harbor and Gulltown launch their deep-bellied trading cogs. When our false night-fires flicker along the jagged cliffs of Sisterton, their hulls are ripped open on the reefs, transforming the shallows into a rich graveyard for us to strip bare.\n#weak We do not beg for coin; we lure our wealth onto the rocks and harvest the dead."

SISTERMAN_SALTCAIRN_WISDOM_NO_BULLETTAB:0 "Our history is not preserved in the delicate library vellums of Oldtown, but etched into salt-bitten driftwood, grease-dipped sealskins, and centuries of blood-soaked border grudges. We remember the names of the ancient Pirate Kings who ruled before the dragons came.\n#weak What the sea swallows, the Sistermen dredge up and claim as their own."


#Skagosi

skagosi_legacy_track_name: "Skagosi"
skagosi_legacy_track_desc: "Where storms scream and gods whisper, we endure."
skagosi_legacy_1_name: "Isleborn Endurance"
skagosi_legacy_2_name: "Reavers of Skagos"
skagosi_legacy_3_name: "Pale Giants' Blood"
skagosi_legacy_4_name: "Faith Carved from Bone"
skagosi_legacy_5_name: "The Silent Rule"


SKAGOSI_ISLEBORN_ENDURANCE_NO_BULLETTAB:0 "Born on a desolate rock of freezing fogs, black obsidian glass, and absolute isolation, our people thrive where mainlanders starve. We do not fear the long winters, for our hearts are as hard and unyielding as the cliffs of Skagos.\n#weak The world calls us savages, but we are the true masters of the bitter north."

SKAGOSI_REAVERS_OF_SKAGOS_NO_BULLETTAB:0 "We do not sail deep-bellied ironships; we slide through the freezing currents of the Bay of Seals in nimble canoes of skin and bone. We slip into northern harbors like ghosts under the cover of a blizzard, taking what we need by the edge of a obsidian axe.\n#weak When the ice thaws, our reivers harvest the wealth of the coast."

SKAGOSI_PALE_GIANTS_BLOOD_NO_BULLETTAB:0 "We are massive, broad-shouldered, and fiercely stubborn, carrying the heavy, ancient blood of the giants who once ruled the north. When the war-horns blow, our warriors scale the jagged mountains on the backs of fierce, shaggy unicorns, smashing shieldwalls with raw, terrifying strength.\n#weak The blood of the first giants runs thick and violent in our veins."

SKAGOSI_FAITH_CARVED_FROM_BONE_NO_BULLETTAB:0 "Our Old Gods are not soft; they do not content themselves with simple silent prayers in a pretty grove. They demand blood, stone, and the flesh of men to keep the winter at bay—and we feast upon the marrow of the uninvited to absorb their strength.\n#weak The true laws of the First Men are written in blood. Skagosi are frequently born [GetTrait('cannibal').GetName( GetNullCharacter )]."

SKAGOSI_THE_SILENT_RULE_NO_BULLETTAB:0 "The Kings of Winter think they own our rocks because of a few ancient pieces of parchment, but they still remember the century-old rebellion when a Lord of Winterfell was slaughtered in our mountains. We rule ourselves through clan law, and we bow our heads to no man across the water.\n#weak Skagos belongs to the Stone-Born, unbent and entirely unbroken by the mainland."


#Wildling

wildling_legacy_track_name: "Free Folk"
wildling_legacy_track_desc: "We Do Not Kneel"
wildling_legacy_1_name: "Ice-born Blood"
wildling_legacy_2_name: "Clans of the True North"
wildling_legacy_3_name: "Lore of the Weirwoods"
wildling_legacy_4_name: "The Hornfoot Way"
wildling_legacy_5_name: "No King or Throne"


WILDLING_ICE_BORN_BLOOD_NO_BULLETTAB:0 "Born in the shadow of the Wall, in a frozen wilderness that our ancestors held long before the kneelers built their cages of stone. We do not fear the deep frost, for it weeds out the weak before they can even grip a spear. \n#weak The True North breeds survivors. Free Folk are frequently born [GetTrait('strong').GetName( GetNullCharacter )]."

WILDLING_CLANS_OF_THE_TRUE_NORTH_NO_BULLETTAB:0 "Whether we herd giant hounds on the Frozen Shore, mine bronze in the mountain caves of the Thenns, or run with the cave-dwellers, we are bound by a mutual hatred for the crows and their stone fortresses. We do not need a throne to make us brothers when the long winter comes. \n#weak The kneelers call us savages, but we are the only men in the world who know the true taste of freedom."

WILDLING_LORE_OF_THE_WEIRWOODS_NO_BULLETTAB:0 "Our history isn't written by old men in velvet robes using ink and paper. Our laws are cut directly into the white bark of the heart trees, spoken in the howling of the winter wind, and sealed in the blood of the sacrifices we leave for the Old Gods. \n#weak We remember the ancient names of the woods, long forgotten south of the Wall."

WILDLING_THE_HORNFOOT_WAY_NO_BULLETTAB:0 "We do not wear the soft leather boots of the southrons. We coat our soles in boiling pine-tar and thick river-pitch until our skin turns as tough and black as horn, allowing our raiders to run across the jagged glacier ice without leaving a trail of blood. \n#weak Our march is silent, and our feet are harder than the stones we walk upon."

WILDLING_NO_KING_OR_THRONE_NO_BULLETTAB:0 "We do not bow our heads to some inbred boy sitting on a chair of melted swords across the realm. If a man wants us to follow him, he must prove his strength with a battle-axe—not a golden crown or a piece of royal parchment. \n#weak The Free Folk choose their own leaders, and we kill any master who tries to put a chain on our necks."


#Braavosi

braavosi_legacy_track_name: "Braavosi"
braavosi_legacy_track_desc: "Free to Rise, Bound to None"
braavosi_legacy_1_name: "Legacy of the Titan"
braavosi_legacy_2_name: "Secret and Safe"
braavosi_legacy_3_name: "Guilds and Freedmen"
braavosi_legacy_4_name: "Vaults of the Iron Bank"
braavosi_legacy_5_name: "Will of the Many-Faced God"


BRAAVOSI_LEGACY_OF_THE_TITAN_NO_BULLETTAB:0 "Our city was born in the northern fogs, founded by escaped slaves who fled the chains of the Valyrian Freehold. The colossal bronze Titan stands over our lagoons, screaming its defiance to the world—a warning that no dragonlord will ever set foot in our streets.\n#weak We are the Secret City, and our freedom is guarded by stone and iron."

BRAAVOSI_SECRET_AND_SAFE_NO_BULLETTAB:0 "Our lagoons are a maze of hidden channels, pine-choked islands, and stone arches that defy foreign navies. In our winding canals, courtesans and bravos cross swords at midnight, while our shipbuilders churn out standard-made hulls with a terrifying speed.\n#weak Let the mainlanders sail the open seas; our waters belong to us alone."

BRAAVOSI_GUILDS_AND_FREEDMEN_NO_BULLETTAB:0 "Braavos recognizes no slave-collars, and no man's pedigree dictates his worth. Wealth and power are won through the precision of the Water Dancer's blade, the cunning of the merchant guilds, and the democratic vote that chooses the Sealord.\n#weak Our nobility is built on merit, skill, and the cold weight of silver."

BRAAVOSI_VAULTS_OF_THE_IRON_BANK_NO_BULLETTAB:0 "The deep granite vaults beneath our city hold the wealth of the known world. We do not need armies when our ledgers can purchase entire hosts of sellswords, unseat tyrants, and force desperate kings to kneel before their own creditors.\n#weak The Iron Bank will have its due, and no crown is safe from our debt."

BRAAVOSI_WILL_OF_THE_MANY_FACED_GOD_NO_BULLETTAB:0 "While our markets handle the coin of the living, a silent shadow watches over our city from the House of Black and White. All men must serve, and all men must die—and the threat of a nameless face ensures that even the wealthiest magisters tread with absolute care.\n#weak Valar Morghulis. Valar Dohaeris."


#Myrish

myrish_legacy_track_name: "Myrish"
myrish_legacy_track_desc: "Glass, Gold, and Guilt"
myrish_legacy_1_name: "Gilded Ingenuity"
myrish_legacy_2_name: "Cloaks of Copper and Silk"
myrish_legacy_3_name: "Crossbows and Contracts"
myrish_legacy_4_name: "Silver-Tongued Syndicates"
myrish_legacy_5_name: "League of Masters"


MYRISH_GILDED_INGENUITY_NO_BULLETTAB:0 "Our workshops produce the most coveted luxuries in the known world, from intricate brass far-eyes to delicate lace that takes generations to weave. Our master artisans labor with an obsessive, mathematical precision that makes the works of other cultures look like primitive toys. \n#weak Perfection is hammered into every glass lens and gilded gear. Myrish characters are frequently born [GetTrait('diligent').GetName( GetNullCharacter )]."

MYRISH_CLOAKS_OF_COPPER_AND_SILK_NO_BULLETTAB:0 "The Conclave of Magisters rules through silken corruption and velvet-lined extortion. We do not need heavy armor when our dye-houses control the wealth of the Free Cities, and our tapestries hide the listening slits where our agents catalog the private vices of every visiting lord. \n#weak We clothe the kings of the world, and we know exactly how to choke them with their own silks."

MYRISH_CROSSBOWS_AND_CONTRACTS_NO_BULLETTAB:0 "Our artisans have perfected the heavy, repeating Myrish crossbow—a weapon of terrifying efficiency that can pierce a southron knight's plate mail from across a courtyard. Favored by our sellsword vanguards, it proves that a well-aimed iron bolt cares nothing for ancient bloodlines or royal titles. \n#weak Our smiths manufacture death with unparalleled, mechanical precision."

MYRISH_SILVER_TONGUED_SYNDICATES_NO_BULLETTAB:0 "The trade-princes of Myr control the shipping lanes with iron-clad monopolies and predatory banking ledgers. We do not field peasant levies; we use our immense, coin-rich syndicates to secure exclusive trade contracts and manipulate the markets of the Narrow Sea to enrich our private vaults. \n#weak True power isn't won on the battlefield—it is signed in a merchant's backroom."

MYRISH_LEAGUE_OF_MASTERS_NO_BULLETTAB:0 "We do not rely on the clumsy maesters of Oldtown or the ancient myths of dragonlords to advance our city. Our hereditary artisan guilds guard their secrets with absolute lethality—blinding glass-blowers who leak designs to foreigners—ensuring that Myr remains the undisputed center of mechanical ingenuity and glasswork. \n#weak The gears of our economy are oiled by absolute secrecy and unrivaled skill."


#Lyseni

lyseni_legacy_track_name: "Lyseni"
lyseni_legacy_track_desc: "Where Beauty Reigns and Gold Rules"
lyseni_legacy_1_name: "Perfume and Influence"
lyseni_legacy_2_name: "Gilded Shackles"
lyseni_legacy_3_name: "Blessed by Beauty"
lyseni_legacy_4_name: "Tears of Lys"
lyseni_legacy_5_name: "Pearl of the Summer Sea"


LYSENI_PERFUME_AND_INFLUENCE_NO_BULLETTAB:0 "Our marble sun-pavilions are heavy with the scent of sweet incense, spiced oils, and venomous political subtext. Lysene magisters do not rely on clumsy battlefield shouting; we manipulate our rivals through silken blackmail, courtly seduction, and promises whispered in the dark.\n#weak We mask our deepest treasons behind a veil of absolute, intoxicating charm."

LYSENI_GILDED_SHACKLES_NO_BULLETTAB:0 "Behind our painted smiles and sun-drenched gardens lies the most lucrative luxury slave network in the known world. We breed bed-slaves for the palaces of Westeros and train pleasure-houses with a brutal, mathematical precision—proving that human flesh is the most profitable cargo in Essos.\n#weak We dominate the markets through iron-clad property contracts and golden collars."

LYSENI_BLESSED_BY_BEAUTY_NO_BULLETTAB:0 "Our island has preserved the pure, unblemished features of the old Valyrian Freehold better than any other daughter city. With our silver-gold hair, violet eyes, and pale skin, our dynasties carry a divine, breathtaking grace that makes mainland lords weep with envy.\n#weak The ancient beauty of the dragonlords runs pure in our lineage. Lyseni characters are frequently born [GetTrait('beauty_good_1').GetName( GetNullCharacter )], [GetTrait('beauty_good_2').GetName( GetNullCharacter )], or [GetTrait('beauty_good_3').GetName( GetNullCharacter )]."

LYSENI_TEARS_OF_LYS_NO_BULLETTAB:0 "Our alchemists have perfected the ultimate weapon of the shadows: the Tears of Lys, a poison so fluid and clear that it dissolves in wine without leaving a trace of color, scent, or taste. It eats a man's bowels away from the inside, mimicking a natural sickness and leaving your enemies completely blind to who struck the blow.\n#weak Every feast-cup in our halls is a potential grave, guarded by absolute silence."

LYSENI_PEARL_OF_THE_SUMMER_SEA_NO_BULLETTAB:0 "Planted squarely on a cluster of fertile islands at the crossroads of the Summer Sea, our fleets dominate the trading channels of the south. We do not need heavy peasant hosts when our sell-sails control the Stepstones and our wealth can starve out any mainland king who dares threaten our borders.\n#weak We rule the southern shipping lanes with immense wealth and absolute naval leverage."


#Pentoshi

pentoshi_legacy_track_name: "Pentoshi"
pentoshi_legacy_track_desc: "Balance of Power, Wealth of the East"
pentoshi_legacy_1_name: "Princes Without Power"
pentoshi_legacy_2_name: "Blood Price and Silk Chains"
pentoshi_legacy_3_name: "Merchant Guilds"
pentoshi_legacy_4_name: "Courts of Velvet Blades"
pentoshi_legacy_5_name: "The Pact of the Tiger and the Merchant"


PENTOSHI_PRINCES_WITHOUT_POWER_NO_BULLETTAB:0 "We choose a Prince of Pentos from our noblest houses to sit upon a velvet throne, treating him like a god—until a poor harvest or a lost war demands we slit his throat as a blood-sacrifice to appease the sea. The real power belongs to the Conclave of Magisters, who rule from behind the scenes while the Prince carries the burden of the gods' wrath.\n#weak We rule through wealthy manipulation, ensuring our figureheads take the blame for our failures."

PENTOSHI_BLOOD_PRICE_AND_SILK_CHAINS_NO_BULLETTAB:0 "Since our humiliating defeat by the Sealord of Braavos, we are legally forbidden by treaty from maintaining a standing army or hiring sellsword captains. We have learned to adapt, buying off our enemies with massive gold tributes, signed blood-prices, and complex webs of foster-hostages.\n#weak We do not bleed on the battlefield when our deep coffers can simply purchase a peace."

PENTOSHI_MERCHANT_GUILDS_NO_BULLETTAB:0 "Our massive square brick keeps do not house heavy garrisons; they are stuffed to the rafters with spices, Myrish lace, and Westerosi timber. Our merchant guilds dominate the overland trade routes across the Flatlands, transforming our deep-water port into the premier gateway between East and West.\n#weak Ships and caravans are our truest weapons, bringing silver faster than any army can conquer."

PENTOSHI_COURTS_OF_VELVET_BLADES_NO_BULLETTAB:0 "Forbidden from using open military force, our magisters have elevated political treachery to a fine art. Our grand brick palaces are thick with high-interest loans, paid-off informants, and discreet poisoners who ensure that an inconvenient rival or a demanding creditor suffers a sudden, tragic illness.\n#weak We fight our wars with signed parchment, quiet bribes, and untraceable poisons."

PENTOSHI_THE_PACT_OF_THE_TIGER_AND_THE_MERCHANT_NO_BULLETTAB:0 "Though the Braavosi treaty strictly bans us from owning slaves, thousands of 'free servants' with bronze collars around their necks still tend our fields and haul our cargo under pain of the lash. We maintain a delicate, highly lucrative balance between legal compliance and immense, cutthroat economic greed.\n#weak We bypass the laws of our enemies to ensure our private vaults never stop growing."


#Tyroshi

tyroshi_legacy_track_name: "Tyroshi"
tyroshi_legacy_track_desc: "Gilded Masks, Hidden Blades"
tyroshi_legacy_1_name: "Dyers' Dynasty"
tyroshi_legacy_2_name: "Guildborn Authority"
tyroshi_legacy_3_name: "Masks and Mirrors"
tyroshi_legacy_4_name: "Trading Cartels"
tyroshi_legacy_5_name: "Sapphire Dominion"


TYROSHI_DYERS_DYNASTY_NO_BULLETTAB:0 "Our city-fortress dominates the rocks of the Bleeding Gulf, built upon the staggering wealth of our secret sea-snail harvest. We treat our massive textile monopolies like a religion, draping our courts in pearlescent greens and deep tyrian purples that only the wealthiest kings can afford. \n#weak We extract silver from every thread we dye. Tyroshi characters are frequently born [GetTrait('greedy').GetName( GetNullCharacter )]."

TYROSHI_GUILDBORN_AUTHORITY_NO_BULLETTAB:0 "The Archon of Tyrosh is elected by the wealthiest merchant-princes, but our conclaves are ruled by heavy iron rather than polite treaties. Unlike the soft traders of Pentos, every Tyroshi master is a veteran of the sellsword wars, perfectly willing to slide a dagger into a competitor's ribs to protect a trade monopoly.\n#weak Our gold is forged in blood, and our councils are garrisoned by hardened blades."

TYROSHI_MASKS_AND_MIRRORS_NO_BULLETTAB:0 "We do not hide our ambitions in the shadows; we broadcast our wealth with a blinding, aggressive flamboyance. Our knights dye their beards and hair in shades of neon vermilion and sharp lime, wearing extravagant helm-crests shaped like screaming manticores to terrify their enemies on the battlefield.\n#weak Our pride is an absolute weapon, and we mock the drab customs of the southrons."

TYROSHI_TRADING_CARTELS_NO_BULLETTAB:0 "Our workshops produce the most complex and lethal engineering in Essos, specializing in heavy, iron-limbed torsion scorpions and beautifully articulated plate armor that flows like liquid silver. Our trading cartels do not merely ship goods; we sell the raw machinery of siege warfare to the highest bidder.\n#weak We manufacture the instruments of conquest, and our vaults grow fat on the realm's wars."

TYROSHI_SAPPHIRE_DOMINION_NO_BULLETTAB:0 "Planted directly at the northern throat of the Stepstones, our colossal stone walls have weathered centuries of naval blockades and pirate raids. We are a military garrison first and a market second, using our massive sell-sail fleets to aggressively squeeze the shipping lanes of the Narrow Sea.\n#weak The Archonship commands the gates of the south, and no cog passes without paying our blood-tax."


#Volantene

volantene_legacy_track_name: "Volantene"
volantene_legacy_track_desc: "Two voices speak for Volantis, but its will is one: power everlasting."
volantene_legacy_1_name: "Heirs of the Black Walls"
volantene_legacy_2_name: "Tigers' Ambition"
volantene_legacy_3_name: "Elephants’ Cunning"
volantene_legacy_4_name: "Chains of the Three Triarchs"
volantene_legacy_5_name: "Dream of the First Empire"

VOLANTENE_HEIRS_OF_THE_BLACK_WALLS_NO_BULLETTAB:0 "We are the Old Blood, living within the monumental, fused-black stone fortification built by the Freehold itself. No freedman, foreigner, or common trader is permitted to set foot inside our sanctuary, ensuring that our ancient Valyrian pedigree remains completely unsullied by the filth of the lower city.\n#weak We look down upon the world from our high courts, our lineage our absolute authority."

VOLANTENE_TIGERS_AMBITION_NO_BULLETTAB:0 "When the Tiger faction holds the Triarchy, our grand war-galleys clog the mouth of the Rhoyne and our legionnaires pack the slave-hosts for conquest. We remember when Volantis ruled the entire right bank of the river, and we spit upon the cowardice of peaceful trade.\n#weak We march to reclaim the lost empire of our ancestors, our laws written in steel."

VOLANTENE_ELEPHANTS_CUNNING_NO_BULLETTAB:0 "When the Elephant faction takes the high seat, we put away the war-horns and open our ledgers to the world. We dominate the shipping lanes from Westeros to Slaver's Bay, using trade monopolies, bribes, and high-interest credit to bloodlessly choke our rivals into absolute submission.\n#weak Gold buys the compliance that swords can only temporarily command."

VOLANTENE_CHAINS_OF_THE_THREE_TRIARCHS_NO_BULLETTAB:0 "Our massive sugar-vines and sprawling shipyards are fueled by the backs of a staggering slave populace that outnumbers freemen five to one. From the moment our temple smiths brand tears or wheels directly onto their skin, their lives are tallied strictly as assets in our household ledgers.\n#weak We rule the greatest slave-state in the known world, our peace secured by absolute iron control."

VOLANTENE_DREAM_OF_THE_FIRST_EMPIRE_NO_BULLETTAB:0 "We are the First Daughter of Valyria, and our grand ambition stretches far beyond the muddy banks of the Rhoyne. Annual elections and faction squabbles may shift our focus, but the underlying drive to rebuild the Freehold beneath our own banner remains an unbreakable dynastic truth.\n#weak The glory of the dragonlords did not die; it simply migrated east to our walls."


#Norvoshi

norvoshi_legacy_track_name: "Norvoshi"
norvoshi_legacy_track_desc: "In silence we serve, in faith we remain."
norvoshi_legacy_1_name: "Bearded Vows"
norvoshi_legacy_2_name: "Axes of the Bearded Priests"
norvoshi_legacy_3_name: "Law of the Silent Bell"
norvoshi_legacy_4_name: "Sanctified Isolation"
norvoshi_legacy_5_name: "Iron Faith, Silent Reign"


NORVOSHI_BEARDED_VOWS_NO_BULLETTAB:0 "In the terraced stone streets of the high city, a man's face is his testament before the gods. Our ruling Priests swear holy oaths never to cut their beards, letting their whiskers grow into thick, sweeping tapestries of faith, while the shamed and the enslaved are kept brutally shorn to mark their lower station. \n#weak The longbeard is a sacred badge of absolute sovereignty, untouchable by the razor."

NORVOSHI_AXES_OF_THE_BEARDED_PRIESTS_NO_BULLETTAB:0 "Our holy protectors do not offer gentle sermons; they are a fanatical, iron-capped brotherhood sworn to the sacred long-axe. Trained in the mountain caves to strike with a terrifying, rhythmic precision, they cleave through foreign steel and smash shieldwalls without uttering a single word. \n#weak Anointed iron knows no mercy, and our guard enforces our piety with a blood-soaked edge."

NORVOSHI_LAW_OF_THE_SILENT_BELL_NO_BULLETTAB:0 "The daily life of our city is strictly governed by the thunderous voices of our three colossal bronze bells: Noon, Narrah, and Nyend. Their heavy, booming rings dictate when our people pray, when our markets open, and when our magistrates execute transgressors from the high steps of the temple fortress. \n#weak We march to the rhythm of the bronze, and no soul in Norvos defies the command of the bells."

NORVOSHI_SANCTIFIED_ISOLATION_NO_BULLETTAB:0 "Perched high upon the jagged limestone cliffs of the upper hills, our holy seat looks down upon the corrupt, low-lying river valleys of Essos. We shut our monumental oak gates against the caravans of the foreign traders, keeping our focus fixed entirely inward upon our sacred flagellating fasts and deep underground shrines. \n#weak Let the outlanders wander in their sins; we maintain our purity on the high crags."

NORVOSHI_IRON_FAITH_SILENT_REIGN_NO_BULLETTAB:0 "The High Priests rule Norvos not through flashy gold crowns, but through absolute theological discipline and the labor of thousands of tattooed slaves who weave our famous tapestries. We wrap our domain in a suffocating shroud of religious secrecy, ensuring that the will of our nameless god crushes any whisper of rebellion before it can even leave the throat.\n#weak Our temples are silent, but our absolute authority is as unyielding as the mountain bedrock."


#Hartalari

hartalari_legacy_track_name: "Hartalari"
hartalari_legacy_track_desc: "We were born from broken bonds, yet still we rise."
hartalari_legacy_1_name: "Fractured Yet Enduring"
hartalari_legacy_2_name: "Daughters' Debt"
hartalari_legacy_3_name: "Gutter-Crowned"
hartalari_legacy_4_name: "Voices of the Unnamed"
hartalari_legacy_5_name: "Rise of the Fourth"


HARTALARI_FRACTURED_YET_ENDURING_NO_BULLETTAB:0 "Born in the mud of the Disputed Lands from the camp-followers, deserters, and outcasts of Myr, Lys, and Tyrosh, we are the bastard children of the Triarchy. We have spent generations dodging the sellsword hosts of three corrupt masters, hardening our bones in the bloodiest crossfire of the east.\n#weak Our roots are mangled by three mothers, but our steel belongs to us alone."

HARTALARI_DAUGHTERS_DEBT_NO_BULLETTAB:0 "We have watched the Magisters buy and sell entire armies with their trade ledgers, and we have mastered the cold mathematics of their corruption. We weaponize their own extortion tactics against them, turning broken treaties, high-interest loans, and forged cargo manifests into a lethal financial blade.\n#weak We squeeze silver directly from the veins of those who tried to starve us."

HARTALARI_GUTTER_CROWNED_NO_BULLETTAB:0 "The high lords of the Free Cities deny us seats in their marble conclaves, so we rule the lawless underbelly from the shadows of the alleyways and pirate coves. Our magistrates are hardened brigand-captains, and our crown is forged from the cold-iron daggers that keep our borders secure from predatory tax collectors.\n#weak We carve our dominion out of the gutters, where a sharp blade dictates the true law."

HARTALARI_VOICES_OF_THE_UNNAMED_NO_BULLETTAB:0 "The thousands of unnamed oarsmen, branded field-slaves, and broken sellswords who bleed for the wealth of the Triarchy find a ruthless sanctuary beneath our banner. We do not offer them soft mercy; we give them iron spears and direct them toward the counting-houses of their former masters.\n#weak The grievances of the forgotten are forged into a vanguard of absolute vengeance."

HARTALARI_RISE_OF_THE_FOURTH_NO_BULLETTAB:0 "Myr, Lys, and Tyrosh have exhausted their treasuries and slaughtered their own bloodlines in an endless, futile war for the Stepstones. From the ashes of their fractured alliance, our unified culture rises as a formidable fourth power in the Narrow Sea, ready to dictate terms to the entire world.\n#weak We do not inherit the empire of the Daughters; we conquer it by our own absolute strength."


#RHOYNISH

rhoynish_legacy_track_name: "Rhoynish"
rhoynish_legacy_track_desc: "The River Flows Still"
rhoynish_legacy_1_name: "Children of the River"
rhoynish_legacy_2_name: "River-Riders and Shorewalkers"
rhoynish_legacy_3_name: "Riverwise"
rhoynish_legacy_4_name: "Nymeria’s Flame"
rhoynish_legacy_5_name: "Kingdom in Exile"


RHOYNISH_CHILDREN_OF_THE_RIVER_NO_BULLETTAB:0 "We are the children of Mother Rhoyne, born from the grandest, most ancient civilization the western world has ever known. Though the Valyrian dragonlords shattered our marble city-states of Chroyane and Ny Sar in a cataclysm of fire and blood, the river still flows through our veins.\n#weak We were broken by fire, but we endure through the absolute strength of water."

RHOYNISH_RIVER_RIDERS_AND_SHOREWALKERS_NO_BULLETTAB:0 "Whether navigating the treacherous reed-bogs of the Greenblood or riding through the scorched sands of Dorne, our people move with the fluid grace of the tide. We are master navigators and quick-moving lancers, adapting to the harshest soils without ever losing our affinity for the currents.\n#weak The water taught us how to ride, and the land has learned to fear our approach."

RHOYNISH_RIVERWISE_NO_BULLETTAB:0 "Our ancestors commanded the water-wizards, who could call up towering walls of river-water to drown dragons and heal the sick with the touch of a wave. Though that deep sorcery is half-lost to time, our healers and scholars still preserve an unmatched wisdom of irrigation, medicine, and river-craft.\n#weak We turn the arid wastes into fertile fields, using ancient knowledge to outlast our enemies."

RHOYNISH_NYMERIAS_FLAME_NO_BULLETTAB:0 "We remember the absolute defiance of Princess Nymeria, who burned her ten thousand ships at Sunspear so her people could never retreat from their new home. She bound her blood to House Martell, conquering the petty Andal kings and establishing a supreme, unyielding dynasty that rules Dorne to this day.\n#weak We recognize no master but our own, and our women rule with the iron will of the Warrior Queen."

RHOYNISH_KINGDOM_IN_EXILE_NO_BULLETTAB:0 "We do not bow to the primitive feudal customs of the southrons or the backward laws of the First Men. We preserve the grand legal traditions of the Rhoyne—where eldest daughters inherit the high seats of power and equal rights are guaranteed to all under the sun.\n#weak Our ancient kingdom lives on in our laws, unbending and entirely unbroken by exile."


#ANDALOSI

andalosi_legacy_track_name: "Andalosi"
andalosi_legacy_track_desc: "The River Flows Still"
andalosi_legacy_1_name: "Crown of Seven Stars"
andalosi_legacy_2_name: "Iron-Taught Hands"
andalosi_legacy_3_name: "Sons of Hugor"
andalosi_legacy_4_name: "The Abandoned Kingdom"
andalosi_legacy_5_name: "Blood in the Hills"


ANDALOSI_CROWN_OF_SEVEN_NO_BULLETTAB:0 "Our line traces back to the sacred hills of Andalos, where the Seven walked among men in human guise. The Father pulled down seven flashing stars from the heavens to forge a crown for our first king, Hugor of the Hill, setting our holy dynasty on a path of absolute divine right.\n#weak We are the chosen bloodline of the heavens, anointed to rule by the light of the stars."

ANDALOSI_IRON_TAUGHT_HANDS_NO_BULLETTAB:0 "Let the soft rivermen of the Rhoyne boast of their primitive smithing; our ancestors learned the true secrets of smelting and hammer-craft directly from the Smith himself. We were the first to encase our warriors in heavy iron plate, transforming our vanguard into an unstoppable machine of war.\n#weak We forge our own destiny, our iron weapons blessed by divine design."

ANDALOSI_SONS_OF_HUGOR_NO_BULLETTAB:0 "From the forty-four mighty sons of King Hugor—each gifted absolute strength by the Warrior and heavy mail by the Smith—came the great conquerors who crossed the narrow sea. We are a lineage born for empire, promised by the Crone that our descendants would carve out great kingdoms in a foreign land.\n#weak The blood of the first conquerors runs hot in our veins, demanding expansion."

ANDALOSI_ABANDONED_KINGDOM_NO_BULLETTAB:0 "Though the Valyrian dragonlords forced us to abandon our ancestral hills, we carried our iron weapons and the *Seven-Pointed Star* across the water. We carved our holy sigils directly into our flesh and smashed the blood-soaked weirwoods of the First Men, replacing their primitive trees with sacred stone septs.\n#weak We do not mourn our lost hills; we turn our new domains into holy sanctuaries of the Faith."

ANDALOSI_BLOOD_IN_THE_HILLS_NO_BULLETTAB:0 "The magisters of Pentos build their brick villas over the graves of our ancient kings, viewing us as nothing but ghosts of a dead era. But the Andalosi soul cannot be bought with Essosi silk—we are a line of anointed knights and holy steel, ready to reclaim our ancient sovereignty.\n#weak The land may be choked by foreign traders, but the blood of Andalos never forgets its crown."


#CRACKCLAW

clawman_legacy_track_name: "Crackclaw"
clawman_legacy_track_desc: "We Bend for No Lord"
clawman_legacy_1_name: "Mirewalkers"
clawman_legacy_2_name: "Lords of Hollow Ground"
clawman_legacy_3_name: "Never Conquered"
clawman_legacy_4_name: "Feudsworn"
clawman_legacy_5_name: "Bones in the Bog"


CRACKCLAW_MIREWALKERS_NO_BULLETTAB:0 "Our homeland is a desolate, windswept finger of jagged rock and choking bogs jutting into the narrow sea. We do not build fancy southern roads or welcome soft mainland merchants; the sucking mires know our step, and the dark pine forests guard our breath.\n#weak Let the outlanders invade—our bogs will swallow them whole."

CRACKCLAW_HOLLOW_GROUND_NO_BULLETTAB:0 "We walk in the shadow of Ser Clarence Crabb, the legendary giant who rode an enormous aurochs into battle. From the ruins of the Whispers, we remember how his woods-witch wife would kiss the severed heads of the lords, wizards, and kings he slaughtered, bringing them back to life to whisper their secrets and counsel to our bloodline.\n#weak The dead still breathe their ancient wisdom into the ears of the Point."

CRACKCLAW_NEVER_CONQUERED_NO_BULLETTAB:0 "We are the unconquered. We broke the Andal crusaders in our thickets until they begged to marry our daughters, and we violently smashed the armies of the Celtigars and Darklyns whenever they tried to steal our rocks. We bend our knees to no petty regional master.\n#weak The Point recognizes no lordly hand but our own."

CRACKCLAW_FEUDSWORN_NO_BULLETTAB:0 "A Crackclaw man never forgives a slight, and an old border grudge is passed down from father to son like a prized iron axe. We do not waste our time with courtly compromises or legal appeals—we bury our disputes deep in the mud, settled with a sudden stroke of cold steel.\n#weak Our blood-feuds are etched into bone, and our daggers cut deep."

CRACKCLAW_BONES_IN_BOG_NO_BULLETTAB:0 "Every isolated valley has its own fiercely independent clan, and every single one of us deeply distrusts the outside world. When a foreign host marches into our hills, we retreat into our hidden caverns, bleed them dry from the treelines, and watch the marshlands rot their ambition.\n#weak The mire makes no distinction between kings and cowards—it swallows both alike."


#CROWNLANDER

crownlander_legacy_track_name: "Crownlander"
crownlander_legacy_track_desc: "Where the Realm Begins"
crownlander_legacy_1_name: "Blood of the Conquest"
crownlander_legacy_2_name: "Court-Bred Subtlety"
crownlander_legacy_3_name: "Never Conquered"
crownlander_legacy_4_name: "Servants of the Iron Throne"
crownlander_legacy_5_name: "Keepers of the Capital"


CROWNLANDER_BLOOD_OF_THE_CONQUEST_NO_BULLETTAB:0 "Our domain was forged in the blinding heat of Balerion’s breath when Aegon the Dragon landed at the mouth of the Blackwater Rush. We had no ancient kings or ancient bloodlines to bind us—only smallholdings and river-pirates until the Conqueror raised his Aegonfort. We are the children of the Conquest, our very fields sacred because they belong to the crown.\n#weak We exist by grace of the Throne, and we are the first to bleed for it."

CROWNLANDER_COURT_BRED_SUBTLETY_NO_BULLETTAB:0 "The capital city draws the greedy like a rotting horse-carcass draws crows. The narrow, filth-choked streets of Flea Bottom crawl with landless hedge knights, foreign spice-merchants, and whispering master-spies, all fighting for a crumb of favor from the Red Keep. Survival here is a matter of reading the wind—knowing precisely when to bow, when to bribe, and when to slide a dagger into a rival's back.\n#weak Silence is a lethal art in the capital. Crownlanders are frequently born [GetTrait('ambitious').GetName( GetNullCharacter )]."

CROWNLANDER_SERVANTS_OF_THE_IRON_THRONE_NO_BULLETTAB:0 "The ancient lords of Rosby, Stokeworth, and the Hook have survived centuries of carnage simply by mastering the art of absolute sycophancy. Let the great houses launch their devastating rebellions across the realm—dragons have turned to ash and kings have been butchered in their beds, yet our estates remain intact because we always kneel to whoever holds the throne.\n#weak We do not fight the Crown; we outlast the tyrants who wear it."

CROWNLANDER_WALLS_OF_BLACKWATER_NO_BULLETTAB:0 "The mouth of the Blackwater is a graveyard of shattered fleets, scarred by midnight fire and stained with wild-fire. From the dark, Valyrian stone of Dragonstone to the iron-studded gates of our coastal keeps, we act as the shield protecting the heart of the realm. When war threatens the iron seat, our fields must be paid in blood before the enemy ever glimpses the city walls.\n#weak The bay turns the color of blood, but our bastions stand firm."

CROWNLANDER_KEEPERS_OF_THE_CAPITAL_NO_BULLETTAB:0 "To rule within a day's ride of the Great Sept of Baelor is to control the very scales of power in Westeros. Our household knights command the Gold Cloaks on the battlements, our merchants dictate the royal customs-dues, and our families are woven directly into every small council intrigue. We treat the wealth and the rotting squalor of the capital as our birthright, for the realm begins at our gates.\n#weak We hold the keys to the capital, and the Seven Kingdoms bend to our leverage."


#MARCHER

marcher_legacy_track_name: "Marcher"
marcher_legacy_track_desc: "Steel Along the Red Mountains"
marcher_legacy_1_name: "Blood on the Border"
marcher_legacy_2_name: "Stone Wardens"
marcher_legacy_3_name: "Riders of the Pass"
marcher_legacy_4_name: "Grudges of the Marches"
marcher_legacy_5_name: "Storm of the Dornish Wars"


MARCHER_BLOOD_ON_THE_BORDER_NO_BULLETTAB:0 "Our homeland is a jagged spine of watchfires, whistling arrow-slits, and sudden warning horns. Marcher children learn to pull a yew longbow before they are even tall enough to hold a sword, knowing that a single column of smoke on the horizon means Dornish reivers have slipped through the high crags to burn our steads.\n#weak The border mud is our cradle, and our graves are dug in the passes."

MARCHER_STONE_WARDENS_NO_BULLETTAB:0 "We do not waste our gold on flowery tourney grounds or grand marble septs; we build thick curtain walls and iron-reinforced portcullises that bar the mountain roads. From the deep basalt vaults of Blackhaven to the ancient, singing stone of Nightsong, our castles are designed to bleed invaders white before they ever glimpse our inner baileys.\n#weak Let the sand-kings launch their hosts—our masonry will break them."

MARCHER_RIDERS_OF_THE_PASS_NO_BULLETTAB:0 "Castles alone cannot choke off every goat-track in the Red Mountains. Our border outriders constantly scour the stony ridges and dry ravines, moving with an aggressive, predatory speed to run down Dornish scouts before they can report our numbers. When a watchtower is lit, our lancers strike like a lightning storm.\n#weak We rule the high paths, and we hunt down any outsider who steps onto our stone."

MARCHER_GRUDGES_OF_THE_MARCHES_NO_BULLETTAB:0 "A Marcher lord records a stolen head of cattle or a butchered patrol as an absolute debt of blood, passed down from father to son like a notched iron war-axe. We spit upon courtly truces and royal compromises; the border has taught us that offering mercy to a Dornish sand-crawler is nothing but an act of suicidal weakness.\n#weak We keep a tally of every burned crop, and we pay our debts with interest."

MARCHER_STORM_OF_THE_DORNISH_WARS_NO_BULLETTAB:0 "For ten thousand years, our lands have been the bloody anvil upon which the fury of Dorne has been smashed to pieces. Our knights have perfected the brutal art of mountain warfare, shattering the hosts of the outlaw Vulture Kings, holding narrow choke points against impossible numbers, and answering desert ambush with merciless slaughter.\n#weak The March stands unyielding, an unbroken wall of iron and longbows."


#VINEMAN

vineman_legacy_track_name: "Vineman"
vineman_legacy_track_desc: "From Vine and Tide"
vineman_legacy_1_name: "Fruits of the Arbor"
vineman_legacy_2_name: "Island Mariners"
vineman_legacy_3_name: "Merchants of the Sunset Sea"
vineman_legacy_4_name: "The Vintage Courts"
vineman_legacy_5_name: "Guardians of the Western Excursions"


VINEMAN_FRUITS_OF_THE_ARBOR_NO_BULLETTAB:0 "Our island is a sun-drenched sanctuary of deep purple valleys, stone-terraced vineyards, and sweet orchards that bend heavy under the sea-breeze. Generations of meticulous cultivation have turned the Arbor into the wealthiest agricultural jewel of the Reach, ensuring our storehouses overflow even when the mainland chokes on winter.\n#weak Our fortune is squeezed directly from the vine, and the world pays our price."

VINEMAN_ISLAND_MARINERS_NO_BULLETTAB:0 "Every child of the Arbor learns to read the sky and handle an oar before they are ever given a sword. Our shipwrights command the greatest shipyards in Westeros, shaping massive, deep-bellied dromonds alongside our fishing fleets, ensuring our sailors possess an unrivaled navigation instinct across the treacherous currents.\n#weak We do not fear the deep water; the deck of a Redwyne warship is our truest home."

VINEMAN_MERCHANTS_OF_THE_SUNSET_SEA_NO_BULLETTAB:0 "Heavy oak casks stamped with our grape sigil dominate every port from Lannisport to the slave-markets of Volantis. We hold an absolute, iron-clad monopoly over the realm's luxury vintages, turning our sweet Arbor Gold into a commercial weapon that draws foreign silver directly into our private vaults.\n#weak Our trading cogs bleed the Seven Kingdoms dry, one flagon at a time."

VINEMAN_VINTAGE_COURTS_NO_BULLETTAB:0 "We treat hospitality as a highly lethal, silk-wrapped art. By drowning visiting lords, Free City envoys, and wealthy merchant factors in our rarest private reserves, we loosen their tongues, discover their vulnerabilities, and sign lucrative trade pacts while they are far too drunk to read the fine print.\n#weak We conquer our rivals with full flagons, listening closely while they boast."

VINEMAN_GUARDIANS_OF_THE_WESTERN_EXCURSIONS_NO_BULLETTAB:0 "Though we feast in velvet-lined solars, the Arbor is ever vigilant against the reeving scum of the world. Our colossal war-fleet stands as the primary shield guarding the Redwyne Straits and the Sunset Sea, ready to smash Ironborn longships and stepstone pirates long before they can glimpse our white cliffs.\n#weak We command the largest navy in the realm, and the shipping lanes are ours to rule."


#HONEYWINER

honeywiner_legacy_track_name: "Honeywiner"
honeywiner_legacy_track_desc: "By River, Faith, and Flame"
honeywiner_legacy_1_name: "Lords of the Honeywine"
honeywiner_legacy_2_name: "Faith of the Honeywine"
honeywiner_legacy_3_name: "Scholars and Scribes"
honeywiner_legacy_4_name: "River and Harbor Trade"
honeywiner_legacy_5_name: "Shields of the Citadel"


HONEYWINER_LORDS_OF_THE_HONEYWINE_NO_BULLETTAB:0 "Our river is the golden artery of the southern Reach, a bustling highway of grain-barges, timber-skiffs, and rich trade cogs winding directly to the quays of Oldtown. We do not field primitive, reckless hosts; our bailiffs govern the market towns with precise tax ledgers, ensuring our custom-houses extract a heavy toll from every hull that floats past our battlements.\n#weak We hold the keys to the river, and our prosperity is meticulously managed."

HONEYWINER_FAITH_OF_THE_HONEYWINE_NO_BULLETTAB:0 "Though the Targaryen kings dragged the High Septon north to their new capital, the ancient soil of the Honeywine remains the spiritual cradle of the Andal race. From the monumental white stone of the Starry Sept to the humblest riverside shrines, our people bow to the strict theological order of the Seven, using holy law to anchor our political stability.\n#weak The crown moved to the Blackwater, but the true Faith remains anchored in our stone."

HONEYWINER_SCHOLARS_AND_SCRIBES_NO_BULLETTAB:0 "We dwell in the shadow of the Citadel, where the Grand Maesters forge their multi-metalled chains and catalog the secrets of the known world. Our courts are defined by ink-stained fingers, measured diplomacy, and legal precedents, proving that a sharp mind armed with royal charters can outlast any brute wielding a broadsword.\n#weak We rule through statecraft and ink, letting our enemies bleed themselves dry."

HONEYWINER_RIVER_AND_HARBOR_TRADE_NO_BULLETTAB:0 "Where the Honeywine meets the sea, the world gathers to trade at our docks. Summer Isles swan-ships and Braavosi merchant galleas pack our harbors, haggling with our powerful urban guilds over fine silks, rare spices, and heavy silver. We understand the precise mathematics of the sea, and we claim our due from every cargo that crosses our piers.\n#weak Our vaults overflow with foreign coin, and we dictate the price of the realm's luxuries."

HONEYWINER_SHIELDS_OF_THE_CITADEL_NO_BULLETTAB:0 "The immense wealth of Oldtown has constantly tempted ironborn longships, stepstone pirates, and ambitious rebel kings, yet our streets stand completely unbroken behind colossal curtain walls. Our city garrison is a highly disciplined, well-paid force of iron-capped watchmen, ready to freeze the ports and manned the battlements the moment the warning bells echo from the Hightower.\n#weak We light the way for the south, and the unruly break themselves against our gates."


#SHIELDMAN

shieldman_legacy_track_name: "Shieldman"
shieldman_legacy_track_desc: "The Sea Breaks Here."
shieldman_legacy_1_name: "Wardens of the Sunset Sea"
shieldman_legacy_2_name: "Island Watchfires"
shieldman_legacy_3_name: "Shields Locked"
shieldman_legacy_4_name: "Salt and Steel"
shieldman_legacy_5_name: "The Western Bastion"


SHIELDMAN_WARDENS_OF_THE_SUNSET_SEA_NO_BULLETTAB:0 "Our four rocky bastions—Greyshield, Shield, Oakenshield, and Southshield—sit squarely at the throat of the Sunset Sea, specifically placed to take the first, bloodiest blow of any ironborn reiver host. While the fat lords of the inner Reach sleep soundly in their soft beds, our eyes are permanently fixed on the western horizon, watching for the black sails of the Krakens.\n#weak We are the iron gatehouse of the Mander, and our rocks are bought with blood."

SHIELDMAN_ISLAND_WATCHFIRES_NO_BULLETTAB:0 "When an unfamiliar sail breaches the horizon, the colossal gilded beacon tower of Greyshield bursts into a roaring sheet of flame, echoed instantly by watchfires across every cliffside. The ancient bronze warning horns blast across the straits, signaling our coastal fisherfolk to drop their nets, grab their spears, and man the watchposts before the first longship can touch the surf.\n#weak Our fires pierce the coastal fog, and our warning horns wake the Reach."

SHIELDMAN_SHIELDS_LOCKED_NO_BULLETTAB:0 "We do not cower behind castle masonry while our smallfolk are dragged away in chains. Our household vanguards are trained to launch our own longship fleets directly into the crashing breakers, ramming the ironborn hulls out in the deep water and locking our iron-rimmed oak shields together on the slippery decks until the reivers are driven back into the sea.\n#weak We meet the reiver's rush with an unyielding wall of seasoned oak and iron."

SHIELDMAN_SALT_AND_STEEL_NO_BULLETTAB:0 "The biting salt air of the western coast hardens our boys early, turning them into grim, cynical wardens who have spent generations rebuilding burned keeps and burying the mutilated dead. We have no use for chivalric songs or soft mainland mercy; we know exactly how the Iron Islands operate, and we repay every torch with an axe to the skull.\n#weak We remember every stolen harvest, and our steel answers their iron."

SHIELDMAN_WESTERN_BASTION_NO_BULLETTAB:0 "The Shields are the floating citadel protecting the vital shipping lanes into the heart of the Reach. Our fortified harbors are packed with heavily armed dromonds, our cliffs are lined with boulder-throwing mangonels, and our smallfolk are trained to weather the longest naval blockades. We are the shield that never breaks, ensuring the fields of Highgarden remain untouched.\n#weak The wealth of the Mander stands behind us. We do not yield an inch of our rock."


#STONE DORNISH

stone_dornish_legacy_track_name: "Stone Dornish"
stone_dornish_legacy_track_desc: "Hard Land, Hard Blood."
stone_dornish_legacy_1_name: "Children of the Red Mountains"
stone_dornish_legacy_2_name: "Lords of the Pass"
stone_dornish_legacy_3_name: "Hard as Stone"
stone_dornish_legacy_4_name: "Knights of Sky and Stone"
stone_dornish_legacy_5_name: "Ancient Mountain Blood"


STONE_DORNISH_CHILDREN_OF_THE_RED_MOUNTAINS_NO_BULLETTAB:0 "Our lineage was forged in the freezing mountain gales and jagged limestone crags of the Red Mountains. Carrying the heavy, proud blood of Andal knights and First Men kings, we are completely distinct from the soft, salty water-striders of the coast, our minds as unyielding as the mountains we rule.\n#weak The high peaks do not bend to the wind, and neither do we. Stone Dornish characters are frequently born [GetTrait('stubborn').GetName( GetNullCharacter )]."

STONE_DORNISH_LORDS_OF_THE_PASS_NO_BULLETTAB:0 "Commanding the vital bottleneck choke points of the Prince's Pass and the blood-soaked ravines of the Boneway, our keeps act as the iron gatekeepers of Dorne. We do not hide behind fragile promises; we turn every narrow path into a killing ground, ready to drop avalanches of stone onto any Marcher host or royal vanguard.\n#weak Let the storm-lords try the passes—their knights will rot in our canyons."

STONE_DORNISH_HARD_AS_STONE_NO_BULLETTAB:0 "Our mountains house the richest iron veins and deep copper mines in the peninsula, granting us a solid, material wealth that doesn't rely on foreign trading cogs. Our smallfolk labor in the dark rock, and our armies are encased in heavy, locally forged plate mail that can blunt any southron lance.\n#weak We extract our power directly from the bedrock, our strength silent and unyielding."

STONE_DORNISH_SWORDS_OF_SKY_AND_STONE_NO_BULLETTAB:0 "We do not produce flowery, painted courtiers; we breed hard-bitten mountain lancers and elite crossbowmen who master the brutal terrain of the crags. Our vanguard specializes in the devastating art of high-ground ambushes and calculated retreats, luring arrogant enemies deep into our stone traps to butcher them at leisure.\n#weak Our steel is honed on the jagged ridges, and we strike without warning."

STONE_DORNISH_ANCIENT_MOUNTAIN_BLOOD_NO_BULLETTAB:0 "We remember the supreme majesty of the Bloodroyals, who ruled the heights as High Kings of Dorne long before the Martells ever intermarried with Rhoynish exiles. We have never truly forgiven Sunspear for forcing us to bend our knees to a foreign princess, and our ancient, independent pride sleeps with one hand on its sword-hilt.\n#weak We are the true, unbroken blood of the hills, and we answer no command from the sand-palaces."


#SALT DORNISH

salt_dornish_legacy_track_name: "Salt Dornish"
salt_dornish_legacy_track_desc: "Wind and Tide"
salt_dornish_legacy_1_name: "People of the Salt Shore"
salt_dornish_legacy_2_name: "Ports of the Narrow Sea"
salt_dornish_legacy_3_name: "Raiders of the Stepstones"
salt_dornish_legacy_4_name: "Rhoynish Mariners"
salt_dornish_legacy_5_name: "Lords of Wind and Tide"


SALT_DORNISH_PEOPLE_OF_THE_SALT_SHORE_NO_BULLETTAB:0 "Our lineage was born along the sun-bleached shores, deep lagoons, and salty shallows where the Greenblood empties into the sea. Carrying the purest, unblemished blood of Nymeria’s ten thousand ships, we are a dark-skinned, quick-witted people who look out across the waters for our fortune rather than brooding over mountain mud.\n#weak The sea-wind shapes our sails, and our heritage is as fluid as the tide."

SALT_DORNISH_PORTS_OF_THE_NARROW_SEA_NO_BULLETTAB:0 "We dominate the chaotic, floating markets of Planky Town, where hundreds of rafts and flat-bottomed poleboats are lashed together at the river's mouth. Our merchant networks control the flow of Dornish wine, lemons, and olives, transforming our riverways into a massive commercial throat that chokes or feeds the interior keeps.\n#weak We rule the floating docks, extracting a heavy toll from every hull that enters Dorne."

SALT_DORNISH_RAIDERS_OF_THE_STEPSTONES_NO_BULLETTAB:0 "The jagged, pirate-choked rocks of the Stepstones are our backyard. Our sailors are master privateers and sellsails, navigating the lethal currents in swift, shallow-draft skiffs to hunt down deep-bellied Free City cogs or launch nocturnal raids against the Lyseni slave-fleets.\n#weak We are the corsairs of the south, and the narrow channels are our hunting grounds."

SALT_DORNISH_RHOYNISH_MARINERS_NO_BULLETTAB:0 "We are the proud descendants of Mother Rhoyne, maintaining the ancient, water-wise customs of the lost river-states better than any other house in the peninsula. We allow our women to inherit the high seats of power, we mock the rigid prejudices of the Andal invaders, and we welcome foreign traders with open arms.\n#weak The laws of Princess Nymeria are written in our hearts, unbending and unbroken."

SALT_DORNISH_LORDS_OF_WIND_AND_TIDE_NO_BULLETTAB:0 "The supreme masters of the Salt Dornish do not rely on cold mountain keeps; our power is anchored in our privateer fleets, our deep-water shipyards, and our alliance with the Orphans of the Greenblood. We command the coastal approaches to Sunspear, ensuring no foreign king can land an army without our explicit consent.\n#weak We rule the surf and the sky, and our dominion is guarded by absolute naval leverage."


#FINGER VALEMAN

finger_valeman_legacy_track_name: "Finger Valemen"
finger_valeman_legacy_track_desc: "Hard coasts, cunning survivors."
finger_valeman_legacy_1_name: "Folk of the Fingers"
finger_valeman_legacy_2_name: "Keepers of Treacherous Waters"
finger_valeman_legacy_3_name: "False Lights and Broken Hulls"
finger_valeman_legacy_4_name: "Raised on Rock and Salt"
finger_valeman_legacy_5_name: "Ambition of the Fingers"


FINGER_VALEMEN_FOLK_OF_THE_FINGERS_NO_BULLETTAB:0 "Our homeland is a cluster of four desolate, windswept fingers of jagged stone jutting into the freezing currents of the Bite. We do not build grand marble septs or rule fertile valleys; our petty, dirt-poor lords survive on the meager coin of sheep-runs, goat-herding, and the absolute squalor of our bleak, salt-crusted shores.\n#weak The soil is too thin to bury our dead, so the sea claims our bones."

FINGER_VALEMEN_KEEPERS_OF_TREACHEROUS_WATERS_NO_BULLETTAB:0 "The waters surrounding our peninsulas are a nightmare of blinding autumn fogs, razor-sharp rocks, and shifting sandbars. While mainland captains view our coastline as an absolute graveyard, our local skiff-pilots navigate the deep channels with an instinctive, lethal precision.\n#weak We master the grey currents of the Bite, turning the seafaring peril into our sanctuary."

FINGER_VALEMEN_FALSE_LIGHTS_AND_BROKEN_HULLS_NO_BULLETTAB:0 "We do not wait for the gods to bless our tables; we harvest the wealth of the Sunset Sea by luring wealthy Braavosi and Gulltown cogs onto our hidden reefs with false shore-beacons. When the gales break their hulls, our smallfolk strip the floating corpses bare of their silks, spices, and silver.\n#weak We do not beg for trade; we shipwreck our wealth and plunder the wreckage."

FINGER_VALEMEN_RAISED_ON_ROCK_AND_SALT_NO_BULLETTAB:0 "Life upon our rain-swept crags leaves absolutely no room for Andal chivalry or soft courtly manners. Our boys grow up lean, hollow-eyed, and fiercely dangerous, wielding heavy skinning knives and flint-axes with a cold, desperate survival instinct that makes mainland soldiers look fragile.\n#weak We are the grey dregs of the Vale, hardened by hunger and cold stone."

FINGER_VALEMEN_AMBITION_OF_THE_FINGERS_NO_BULLETTAB:0 "We are born to the poorest keeps in the realm, but our lack of land has forced us to master the modern arts of coin-counting, port-customs fraud, and market manipulation. While the ancient, arrogant houses brag of their bloodlines, our calculating schemers use ink and trade ledgers to slowly buy out their debts.\n#weak A lord of the stone fingers climbs the ladder of power through gold and silver leverage."


#UPPER VALEMAN

upper_valeman_legacy_track_name: "Upper Valeman"
upper_valeman_legacy_track_desc: "Ancient blood of the high mountains."
upper_valeman_legacy_1_name: "Lords of the Uplands"
upper_valeman_legacy_2_name: "Valley Fortresses"
upper_valeman_legacy_3_name: "Wardens of the Passes"
upper_valeman_legacy_4_name: "Knights of the Uplands"
upper_valeman_legacy_5_name: "Masters of the Upper Vale"


UPPER_VALEMAN_LORDS_OF_THE_UPLANDS_NO_BULLETTAB:0 "Our seats are planted in the jagged, storm-swept valleys of the upper interior, far above the soft coastal plains. Ruling over hard mountain soil and fiercely insular smallfolk, our dynasties have been seasoned by generations of frontier isolation and unrelenting weather.\n#weak The high crags do not tolerate weakness, and our lords are as unyielding as the stone."

UPPER_VALEMAN_VALLEY_FORTRESSES_NO_BULLETTAB:0 "We do not waste our stone on sprawling pleasure-palaces or grand tourney grounds; we build grim, thick-walled masonry keeps designed to secure the narrow choke points of the valleys. Our strongholds are designed to act as iron traps, choking off local supply lines and bleeding any aggressive neighbor or ambitious rebel white.\n#weak Our castles are built for prolonged sieges, their gates reinforced by cold iron."

UPPER_VALEMAN_WARDENS_OF_THE_PASSES_NO_BULLETTAB:0 "We are the first wall of defense guarding the treacherous tracks of the High Road. Our watchposts look down upon the vertigo-inducing drop-offs of the Mountains of the Moon, keeping a permanent, paranoid watch for savage Mountain Clan raiders or invading host-vanguards attempting to breach the bloody passes.\n#weak We hold the keys to the interior, and the passes are paid in blood."

UPPER_VALEMAN_KNIGHTS_OF_THE_UPLANDS_NO_BULLETTAB:0 "Our vanguards do not train for the soft pageantry of southern tilts; our heavily armored knights master the brutal reality of mountain warfare. Accustomed to leading cavalry charges down loose gravel slopes and defending narrow, rock-strewn ridges, they possess a lethal campaign discipline that shatters less disciplined hosts.\n#weak Our lances fly true in the crags, and our steel is forged strictly for slaughter."

UPPER_VALEMAN_MASTERS_OF_THE_UPPER_VALE_NO_BULLETTAB:0 "Living in a constant state of low-intensity border warfare against the Stone Crows and Burned Men, our ancient houses have developed an unbreakable, martial tenacity. We use blood-feuds, dynastic foster-hostages, and absolute military vigilance to ensure the interior remains stable under our iron rule.\n#weak We are the true wardens of the heights, and our authority is carved into the bedrock."


#BARROWMAN

# ==========================================
# BARROWMAN CULTURE LEGACY TRACK PERKS
# ==========================================
BARROWMAN_KINGS_BENEATH_THE_MOUNDS_NO_BULLETTAB:0 "Our domain was old and powerful long before the first Stark ever raised the walls of Winterfell. Beneath the colossal, grass-grown mound of the Great Barrow rests the mythical Barrow King, entombed with his crown of bronze and iron—a permanent monument to a sovereignty that predates the direwolf.\n#weak The crown of the First Men rests in our soil, and our blood remembers its majesty."

BARROWMAN_RIDERS_OF_THE_BARROWLANDS_NO_BULLETTAB:0 "Across our flat, wind-scoured plains of low grass and peat-bogs, distance is a weapon used to bleed invaders dry. Our outriders are master horsemen, patrolling the wide burial fields in shifting vanguard patterns to strike down trespassers long before they can glimpse the timber walls of Barrowton.\n#weak Our ryders gallop across the graves of kings, bringing swift and merciless steel."

BARROWMAN_GUARDIANS_OF_THE_BARROWS_NO_BULLETTAB:0 "We do not view our burial mounds as mere dirt; they are sacred vaults containing the blood, iron axes, and unyielding spirits of the First Men. Our specialized sentries are sworn to protect these crypts from graverobbers, southron maesters, and defilers, keeping a grim, unblinking watch over our ancestors' resting places.\n#weak We guard the ancient dead with sharpened spears. Enables the recruitment of [GetMaA('barrowman_barrow_wardens').GetName] as [men_at_arms|E]."

BARROWMAN_WINDS_OF_THE_EMPTY_HILLS_NO_BULLETTAB:0 "The bleak, unending gales that scream off the shivering sea shape a population as hard and biting as the frost. We do not tolerate southron softness or courtly vanities; our lords endure in drafty timber halls where a man's worth is measured by his winter provisions and the iron in his word.\n#weak The wind sweeps across empty fields, but our resolve remains unshakable."

BARROWMAN_MEMORY_OF_THE_FIRST_KINGS_NO_BULLETTAB:0 "House Dustin remembers every treaty signed with bronze and every blood-debt left unpaid by the Kings of Winter. We preserve the ancient, un-Andal customs of the north, holding a deep-seated dynastic pride that answers the commands of Winterfell with a cautious, heavily transactional loyalty.\n#weak We are the lords of the First Mounds, and our honor is as stubborn as the earth."

# ==========================================
# MEN-AT-ARMS LOCALIZATION
# ==========================================
barrowman_barrow_wardens:0 "Barrow Wardens"
barrowman_barrow_wardens_flavor:0 "Drawn from the insular clans surrounding the Great Barrow, these hardened infantrymen are equipped with heavy, circular bronze-rimmed shields and long, iron-tipped spears. Sworn by blood-oaths to defend the ancient tombs and border-crossings of the plain, they fight with a grim, silent fanaticism, viewing themselves as the physical shield of the dead."


#CRANNOGMAN

crannogman_legacy_track_name:0 "Crannogman"
crannogman_legacy_track_desc:0 "No crown holds the Neck."
crannogman_legacy_1_name:0 "Children of the Neck"
crannogman_legacy_2_name:0 "Mist and Reed"
crannogman_legacy_3_name:0 "Bog Warfare"
crannogman_legacy_4_name:0 "Secrets of the Marsh"
crannogman_legacy_5_name:0 "Unconquered Marsh"

CRANNOGMAN_CHILDREN_OF_THE_NECK_NO_BULLETTAB:0 "Our lineage was forged in the black water, shivering fogs, and bottomless mud of the Neck. Carrying the ancient, undiluted blood of the First Men, we are a small-statured, keen-eyed people who move through the marshlands with a silent, ghost-like precision that terrifies outlanders.\n#weak We are the moss and the root, and the swamp recognizes its own children."

CRANNOGMAN_MIST_AND_REED_NO_BULLETTAB:0 "We do not build stone keeps that can be surrounded or burned; our ancestral seat of Greywater Watch is a floating fortress that drifts through the channels, completely invisible to enemy maesters. While ironborn hosts and southron lancers lose themselves in the shifting mires, we glide past them unseen through the high reeds.\n#weak What cannot be tracked cannot be brought to battle, and no outsider maps our waters."

CRANNOGMAN_BOG_WARFARE_NO_BULLETTAB:0 "We spit upon the flowery rules of southern chivalry and open-field glory. Our reivers strike from the deep thickets, entangling armored knights in heavy nets before plunging three-pronged tridents and venomous, black-tipped frog-spears directly through the gaps in their plate mail.\n#weak We do not trade blows; we paint our steel in swamp toxins and watch our enemies rot."

CRANNOGMAN_SECRETS_OF_THE_MARSH_NO_BULLETTAB:0 "We share our bogs with predatory lizard-lions, and we preserve the ancient, sacred sorceries handed down directly by the Children of the Forest before the dawn age. We know how to speak to the ravens, read the mud-charters, and blend into the treelines until we are indistinguishable from the bark.\n#weak The old truths of the First Men remain pure beneath our moss, hidden from dry men."

CRANNOGMAN_NO_CROWN_IN_THE_NECK_NO_BULLETTAB:0 "Arrogant kings may draw boundaries across the Neck on their parchment maps, but their heavy armies only find a watery grave when they try to cross the causeway. We have drowned ironborn kings and rotted the ambitions of Andal crusaders, answering only to our ancient blood-oaths with Winterfell.\n#weak No crown holds sway where the shifting quagmire swallows the horse and the rider alike."


#BEARMAN

bearman_legacy_track_name:0 "Bearman"
bearman_legacy_track_desc:0 "Fierce, faithful, and unbroken."

bearman_legacy_1_name:0 "Blood of Bear Island"
bearman_legacy_2_name:0 "Shields of the North"
bearman_legacy_3_name:0 "Women of the Bear"
bearman_legacy_4_name:0 "Hunters of the Wild"
bearman_legacy_5_name:0 "Oathbound and Unbroken"


BEARMAN_BLOOD_OF_BEAR_ISLAND_NO_BULLETTAB:0 "Our homeland is a bleak, wind-lashed rock choked with ancient pines and frozen bogs, won for us when King Rodrik Stark wrestled an ironborn tyrant for its sovereignty. We do not build grand stone keeps; our lords rule from a sprawling timber longhall, outlasting centuries of brutal winters through sheer, stubborn physical endurance.\n#weak The frost weeds out the weak, and the blood of the bear runs thick in our veins."

BEARMAN_SHIELDS_OF_THE_NORTH_NO_BULLETTAB:0 "Planted squarely in the freezing waters of the Bay of Ice, our home stands as the northernmost shield against wildling raiders and ironborn reivers alike. We do not wait for reinforcements from Winterfell when the black sails breach the horizon; our smallfolk pick up their battle-axes and turn our beaches into immediate slaughter grounds.\n#weak We do not cower behind high masonry; our iron resolve is our truest rampart."

BEARMAN_WOMEN_OF_THE_BEAR_NO_BULLETTAB:0 "Because our men are so often killed at sea or marching in the King's host, the women of Bear Island are born to command the battlements. Carved above our hall gate is a woman in a bearskin with a suckling babe in one arm and a battle-axe in the other, a testament to daughters who can put down a raider vanguard before the dinner fires are even lit.\n#weak No hand on this island is soft, and our women fight with the ferocity of a cornered she-bear."

BEARMAN_HUNTERS_OF_THE_WILD_NO_BULLETTAB:0 "Our island yields absolutely nothing to soft lords or idle courtiers. To survive, our kin must track giant shadow-cats through the deep pine-woods, hunt seals along the jagged ice-floes, and skin massive forest beasts with a cold, calculated efficiency that turns every hunter into a lethal guerrilla scout.\n#weak The wildwoods belong to the tracker, and our arrows strike unseen from the treeline. Bearman characters are frequently born [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )]."

BEARMAN_OATHBOUND_AND_UNBROKEN_NO_BULLETTAB:0 "We do not trade our loyalty for southern gold or empty royal promises, maintaining an ironclad fidelity to the Direwolf of Winterfell that has stood unbroken since the Dawn Age. We are a blunt, un-Andal people who keep our vows in blood, gold, and cold iron, executing any traitor who dares bring dishonor to our shores.\n#weak The bear does not dance for crowns; we stand unyielding beside our ancient kin."


#KRAKENMAN

krakenman_legacy_track_name:0 "Krakenman"
krakenman_legacy_track_desc:0 "Too hard for chains, too stubborn for kings."
krakenman_legacy_1_name:0 "Blood of Cape Kraken"
krakenman_legacy_2_name:0 "Blackwater Paths"
krakenman_legacy_3_name:0 "Raiders of Rock and Foam"
krakenman_legacy_4_name:0 "Between Wolf and Kraken"
krakenman_legacy_5_name:0 "No Thrall's Chain"


KRAKENMAN_BLOOD_OF_CAPE_KRAKEN_NO_BULLETTAB:0 "Our homeland is a bleak, rock-ribbed peninsula jutting out into the freezing swells of the Blazewater Bay. Ruled by the iron-willed Flints of Flint's Finger, our people are a hard-bitten breed of Northmen who have spent thousands of years watching their timber keeps get burned to ash by Ironborn marauders.\n#weak The western winds weed out the weak, and we sleep with an axe beside our straw beds."

KRAKENMAN_BLACKWATER_PATHS_NO_BULLETTAB:0 "The shallow, rock-strewn channels surrounding Cape Kraken are an absolute graveyard for deep-bellied mainland fleets. While foreign captains run their hulls aground on our hidden reefs, our local long-galleys navigate the blind inlets and jagged surf with an instinctive, lethal precision.\n#weak We master the grey shallows of the bay, turning the seafaring peril into our sanctuary."

KRAKENMAN_RAIDERS_OF_ROCK_AND_FOAM_NO_BULLETTAB:0 "We do not waste our time with the soft pageantry of southern tourneys or open-field infantry ranks. Our coastal levies are trained to launch immediate, savage counter-attacks the moment an ironborn longship touches our beaches, swinging heavy wood-axes and iron hooks to butcher the raiders in the breaking surf.\n#weak We meet the reiver's rush with a merciless, mud-spattered slaughter on the rocks."

KRAKENMAN_BETWEEN_WOLF_AND_KRAKEN_NO_BULLETTAB:0 "Planted squarely between the absolute authority of the Stark Kings of Winter and the mindless cruelty of the iron salt-kings, our houses have developed a fiercely defensive, paranoid survival instinct. We pay our taxes to Winterfell, but we rely entirely on our own walls and watchfires to defend our smallfolk from the krakens.\n#weak We are the outer shield of the West, trusting no promises from across the water."

KRAKENMAN_NO_THRALLS_CHAIN_NO_BULLETTAB:0 "Our peninsula has been raided, pillaged, and bled by the Iron Islands for generations, yet our spirit has never been broken. We hold an ancient, burning blood-feud against the reevers who sneak ashore to steal our women and salt our fields, and we hang every ironborn captive from our coastal gallowposts.\n#weak We do not bow to the Driftwood Chair; we answer their torches with cold northern iron."


#NORTHERN CLAN

northern_clan_legacy_track_name:0 "Northern Clans"
northern_clan_legacy_track_desc:0 "Strength, alone, decides."
northern_clan_legacy_1_name:0 "Moot of the Clans"
northern_clan_legacy_2_name:0 "Stone Paths"
northern_clan_legacy_3_name:0 "Feud and Foray"
northern_clan_legacy_4_name:0 "Held by Strength Alone"
northern_clan_legacy_5_name:0 "Mountain-Hardened"


NORTHERN_CLAN_MOOT_OF_THE_CLANS_NO_BULLETTAB:0 "Among the mountain clans, no chieftain rules by right of southern parchment or distant royal decrees. A chief is chosen in open council by the shouting of his kin, holding his seat only so long as his iron axe is sharp enough to defend our high valley pastures.\n#weak A chief stands by his own strength, or he is brutally cast aside."

NORTHERN_CLAN_STONE_PATHS_NO_BULLETTAB:0 "The high ridges hide absolutely no easy roads; our valleys are a maze of blinding blizzards, vertical goat-tracks, and treacherous, snow-choked passes. Yet our warriors glide through the Mountains of the Moon with an instinctive, lethal precision that shatters lowland hosts.\n#weak We master the grey stone paths, and the frost is our truest sanctuary."

NORTHERN_CLAN_FEUD_AND_FORAY_NO_BULLETTAB:0 "The Wulls, Liddles, Norreys, and Harclays have never lacked for ancient blood-debts, nor for the immediate will to settle them with broad-axes. Border raids, nocturnal sheep-stealing, and sudden skirmishes over valley borders are as common in the high crags as the winter snows.\n#weak We keep a precise tally of every slight, and we answer every raid in blood."

NORTHERN_CLAN_HELD_BY_STRENGTH_ALONE_NO_BULLETTAB:0 "We do not bow our heads to the soft lords of the plains, nor do we tolerate their talk of taxes, bailiffs, and laws. We hold our transactional loyalty exclusively to the Stark in Winterfell—whom we proudly call 'The Ned'—answering his call to war only out of mutual, ancient respect.\n#weak We are the free blood of the first peaks, unruled by the soft men of the castles."

NORTHERN_CLAN_MOUNTAIN_HARDENED_NO_BULLETTAB:0 "When the long winters threaten our caves with starvation, our old men pack their weapons and walk out into the snow to die, ensuring the young have enough food to survive the frost. We are a lineage hardened by absolute, merciless hunger, and we fear nothing but dishonor.\n#weak The mountain weeds out the frail, leaving only an unyielding wall of iron and stone."


#WOLFSWOOD clansman

wolfswood_clansman_legacy_track_name:0 "Wolfswood Clansman"
wolfswood_clansman_legacy_track_desc:0 "The Wolfswood is Our Blood."
wolfswood_clansman_legacy_1_name:0 "Children of the Wolfswood"
wolfswood_clansman_legacy_2_name:0 "Hearths Beneath the Pines"
wolfswood_clansman_legacy_3_name:0 "Hooks Beneath the Ice"
wolfswood_clansman_legacy_4_name:0 "Ashes of the Ironborn"
wolfswood_clansman_legacy_5_name:0 "Gods Within the Trees"


WOLFSWOOD_CLANSMAN_CHILDREN_OF_THE_WOLFSWOOD_NO_BULLETTAB:0 "Our bloodlines are deeply rooted in the primordial heart of the North, bound to the colossal shadow of ancient sentinels and ironwood groves. The Forresters, Woodses, Boles, and Branches have ruled these timberlands since the Dawn Age, their minds as unyielding as the frozen trunks they harvest.\n#weak The wood-sap runs thick in our veins, and our resolve cannot be broken. Wolfswood characters are frequently born [GetTrait('stubborn').GetName( GetNullCharacter )]."

WOLFSWOOD_CLANSMAN_HEARTHS_BENEATH_THE_PINES_NO_BULLETTAB:0 "We do not waste our coin on soft southern court-intrigues or flowery tourney pavilions. Our clans survive through absolute mastery of woodcraft, engineering massive timber holdfasts from soldier pines and feeding our settlements through the deep, snow-packed winters on forest game and smoked moss.\n#weak We carve our livelihoods directly from the bark, and we owe nothing to the flatlands."

WOLFSWOOD_CLANSMAN_HOOKS_BENETTAB_THE_ICE_NO_BULLETTAB:0 "When the deep freezes choke off the forest trails, our trackers take to the ice-bound rivers and black bogs. We spear massive river-pike beneath the thick ice-sheets and hunt giant shadow-cats through the dense undergrowth, developing a cold campaign patience that makes mainland levies look fragile.\n#weak We harvest life from a frozen wilderness, and our hunters know exactly where to strike."

WOLFSWOOD_CLANSMAN_ASHES_OF_THE_IRONBORN_NO_BULLETTAB:0 "We remember every ancient raid launched by the ironborn reivers who sailed up the coastline to pillage our ancient timber groves. We have rebuilt our longhalls in blackened clearings, and we train our longbowmen to greet the black sails of the Krakens with a rain of yard-long, fire-hardened arrows.\n#weak What the sea-scum burned, we fertilized with their own blood and buried deep."

WOLFSWOOD_CLANSMAN_GODS_WITHIN_TREES_NO_BULLETTAB:0 "Deep within the dense canopy of the Wolfswood, the Old Gods are a looming, physical presence carved into the bone-white bark of massive heart trees. We keep the ancient, bloody blood-oaths of the First Men pure, trusting no law, no septon, and no king that comes from beyond our treelines.\n#weak The bark has eyes, the roots remember, and the Old Gods watch over our groves."


#HARBORMAN

harborman_legacy_track_name:0 "Harbormen"
harborman_legacy_track_desc:0 "Where ships anchor, power abides."
harborman_legacy_1_name:0 "Harbor Coin"
harborman_legacy_2_name:0 "Salt and Courtesy"
harborman_legacy_3_name:0 "Quays and Counting Houses"
harborman_legacy_4_name:0 "Harbor Watch"
harborman_legacy_5_name:0 "White Harbor's Legacy"


HARBORMAN_HARBOR_COIN_NO_BULLETTAB:0 "We are the masters of the White Knife, controlling the premier silver-throat of the North. While inland lords choke on winter frost, our great storehouses overflow with salted cod, timber tallies, and foreign coin, ensuring that the wealth of House [GetPlayer.GetDynasty.GetNameNoTooltip] dictates the flow of commerce across the entire region.\n#weak Our silver is minted by royal right, and our fortunes follow the high tide."

HARBORMAN_SALT_AND_COURTESY_NO_BULLETTAB:0 "As exiles from the soft courts of the Mander, we brought the refined arts of southern hospitality, sacred guest right, and knightly chivalry to the harsh shores of the North. We greet foreign merchant captains and High Septon envoys with grand feasts of roasted whale, binding them to our interest before they even leave our solar.\n#weak A well-filled goblet smooths the sharpest mercantile contracts."

HARBORMAN_QUAYS_AND_COUNTING_HOUSES_NO_BULLETTAB:0 "Our prosperity relies on the massive stone-lined vaults of the New Castle and the ink-stained ledgers of our port collectors. By maintaining the only silver mint north of the Neck, our stewards meticulously audit every trading cog from Braavos to King's Landing, transforming our city into an ironclad bastion of regional trade.\n#weak Heavy walls protect deep cellars, and deep cellars secure the realm's coin."

HARBORMAN_HARBOR_WATCH_NO_BULLETTAB:0 "The narrow seas bring immense trade, but they also tempt ironborn reivers, Stepstone pirates, and unscrupulous smugglers. Our household vanguards patrol the breakwaters day and night, ready to lock the harbor chains and man our high white towers the moment an unauthorized sail breaches the horizon.\n#weak No pirate slips past our white stone bastions, and our watch never sleeps."

HARBORMAN_WHITE_HARBORS_LEGACY_NO_BULLETTAB:0 "We are the Order of the Green Hand, the lone bastion of the Seven and true knighthood in a land of old trees and wolf-kings. Our absolute, fanatical loyalty to Winterfell is bought not with subjection, but with centuries of mutual honor—and any man who threatens our city will drown in our harbor.\n#weak We light the way for the North, our honor as unyielding as our city walls."


#THENN

thenn_legacy_track_name:0 "Thenn"
thenn_legacy_track_desc:0 "Bronze, law, and the will of the Magnar."
thenn_legacy_1_name:0 "The Magnar's Will"
thenn_legacy_2_name:0 "Tongue of the First Men"
thenn_legacy_3_name:0 "Bronze-Bound Warriors"
thenn_legacy_4_name:0 "Laws of the Hidden Valley"
thenn_legacy_5_name:0 "Bronze Before Kings"


THENN_THE_MAGNARS_WILL_NO_BULLETTAB:0 "To our people, the Magnar is no mere war-chief; he is a god made flesh, whose absolute decrees bind law, judgment, and holy reverence into an unbreakable crown. While the lawless clans across the tundra squabble like dogs, our valley moves as a single, lethal body beneath his divine will.\n#weak The Magnar speaks, and the valley obeys without question."

THENN_TONGUE_OF_THE_FIRST_MEN_NO_BULLETTAB:0 "We preserve the pure, unblemished Old Tongue of the First Men, refusing to dilute our ancestral speech with the vulgar trader-talk of the southrons. In our words live the ancient laws, blood-charters, and sovereign identity that we have carried unchanged through ten thousand winters.\n#weak We speak the language of the first kings, and we hold to our ancient laws."

THENN_BRONZE_BOUND_WARRIORS_NO_BULLETTAB:0 "We do not charge into battle screaming like half-starved beasts; our vanguard is an elite, drilled phalanx that marches to war under iron discipline. Encased in heavy bronze scales and wielding massive, locally forged pikes, we lock our shields together to flatten any host that defies the Magnar.\n#weak Bronze shatters stone, and our discipline flattens our foes. Enables recruitment of [GetMaA('thenn_bronze_phalanx').GetName] as [men_at_arms|E]."

THENN_LAWS_OF_THE_HIDDEN_VALLEY_NO_BULLETTAB:0 "Deep within the thermal, volcanic caverns of the high Frostfangs, our people have built a thriving civilization of structured mines, stone keeps, and legal continuity. We look down upon the scattered, primitive savages of the haunted forest, for we alone have maintained true order beyond the Wall.\n#weak The peaks guard our furnaces, and our laws endure in the dark rock."

THENN_BRONZE_BEFORE_KINGS_NO_BULLETTAB:0 "We remember the ancient days when we mined the deep copper and tin veins long before the southrons built their cages of stone. We bow our heads to no crown forged across the water, and our ancient, unyielding pride sleeps with one hand on our bronze axes.\n#weak We knelt to no man before the Wall was raised, and we do not bend now. Thenns are frequently born [GetTrait('stubborn').GetName( GetNullCharacter )]."

thenn_bronze_phalanx:0 "Magnar's Bronze Phalanx"
thenn_bronze_phalanx_flavor:0 "Drawn from the volcanic mining holds of the high Frostfangs, these elite infantrymen are equipped with massive, heavy pikes and circular shields hammered from pure, gleaming bronze. Operating with the rigid, absolute battlefield discipline of an ancient empire, they form a lethal wall of bronze points that can break heavy cavalry charges and wildling rushes alike."
