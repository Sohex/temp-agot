l_english:

  trait_bla_legacy_customizer:0 "Custom Dynasty Chronicler"
  trait_bla_legacy_customizer_desc:0 "This house has drawn the attention of a chronicler, come to write down the tale of how an obscure bloodline rose from little consequence to a name worthy of remembrance."

bla_custom_steel_legacy_track_name:0 "[GetPlayer.GetDynasty.GetNameNoTooltip]" 
bla_custom_steel_legacy_track_desc:0 "Steel remembers the hand that wielded it."
bla_custom_coin_legacy_track_name:0 "[GetPlayer.GetDynasty.GetNameNoTooltip]" 
bla_custom_coin_legacy_track_desc:0 "Gold endures where glory fades." 
bla_custom_banner_legacy_track_name:0 "[GetPlayer.GetDynasty.GetNameNoTooltip]" 
bla_custom_banner_legacy_track_desc:0 "A sworn word may bind more tightly than iron." 
bla_custom_veil_legacy_track_name:0 "[GetPlayer.GetDynasty.GetNameNoTooltip]" 
bla_custom_veil_legacy_track_desc:0 "What is hidden may rule what is seen." 
bla_custom_candle_legacy_track_name:0 "[GetPlayer.GetDynasty.GetNameNoTooltip]" 
bla_custom_candle_legacy_track_desc:0 "What is remembered need never be lost." 
bla_custom_mosaic_legacy_track_name:0 "[GetPlayer.GetDynasty.GetNameNoTooltip]" 
bla_custom_mosaic_legacy_track_desc:0 "Every generation lays another stone."

custom_house_sworn_shields:0 "Sworn Shields"
custom_house_sworn_shields_flavor:0 "#F Drawn from the most steadfast retainers of the household, the Sworn Shields are oath-bound to stand between their lord and any blade raised against them. Clad in heavy mail and bearing stout shields, they form the unyielding heart of their house's battle line.#!"

custom_house_rangers:0 "Rangers"
custom_house_rangers_flavor:0 "#F Lightly armed and accustomed to ranging ahead of the host, Rangers seek paths through difficult country, harry enemy scouts and marching columns, and fall away before a slower foe can answer.#!"

custom_house_sworn_lances:0 "Sworn Lances"
custom_house_sworn_lances_flavor:0 "#F The finest mounted warriors in the household ride among the Sworn Lances. Knights and hardened retainers alike bear their lord's colors into battle, trusting in steel, horseflesh, and the terrible weight of a well-timed charge.#!"

custom_house_outriders:0 "Outriders"
custom_house_outriders_flavor:0 "#F Swift riders range far beyond their lord's banners, carrying messages, scouting roads, pursuing broken foes, and striking where they are least expected. A host with good Outriders is seldom taken unawares.#!"

custom_house_banner_spears:0 "Banner Spears"
custom_house_banner_spears_flavor:0 "#F Drilled to hold their ground beneath the colors of their house, the Banner Spears meet horse and foot alike behind a disciplined hedge of steel. So long as the banner stands, so too does their line.#!"

custom_house_high_strings:0 "High Strings"
custom_house_high_strings_flavor:0 "#F Trained household bowmen loose together at their lord's command, filling the air with disciplined volleys before the enemy can close. Their bowstrings are drawn high, and their arrows fall thick.#!"

  #------------------------------------------------
  # ESTABLISH DYNASTY SEAT
  #------------------------------------------------

  bla_establish_dynasty_seat_decision:0 "Establish the Dynasty Seat"
  bla_establish_dynasty_seat_decision_desc:0 "Our name has been set to parchment, our deeds recorded, and the character of House [GetPlayer.GetDynasty.GetNameNoTooltip] made known. Yet words alone do not make a great house. If our bloodline is to endure through war, winter, and the passing of generations, it must possess a seat worthy of its ambitions.\n\nThe time has come to lay the first foundations of a home that our descendants may one day look upon as ancient."
  bla_establish_dynasty_seat_decision_tooltip:0 "Establish the ancestral [dynasty|E] seat of House [GetPlayer.GetDynasty.GetNameNoTooltip]."
  bla_establish_dynasty_seat_decision_confirm:0 "Lay the First Stone"

  bla_establish_dynasty_seat_capital_requirement:0 "Your [capital|E] must be non-tribal and must not already contain a [special_building|E]."



  #------------------------------------------------
  # ESTABLISH DYNASTY SEAT - LEGACY PATH
  #------------------------------------------------

  bla_dynasty_seat_steel_path_tt:0 "The martial legacy of House [GetPlayer.GetDynasty.GetNameNoTooltip] will allow the construction of a unique #high Martial Dynasty Seat#!."
  bla_dynasty_seat_coin_path_tt:0 "The mercantile legacy of House [GetPlayer.GetDynasty.GetNameNoTooltip] will allow the construction of a unique #high Mercantile Dynasty Seat#!."
  bla_dynasty_seat_banner_path_tt:0 "The diplomatic legacy of House [GetPlayer.GetDynasty.GetNameNoTooltip] will allow the construction of a unique #high Diplomatic Dynasty Seat#!."
  bla_dynasty_seat_veil_path_tt:0 "The secretive legacy of House [GetPlayer.GetDynasty.GetNameNoTooltip] will allow the construction of a unique #high Espionage Dynasty Seat#!."
  bla_dynasty_seat_candle_path_tt:0 "The scholarly legacy of House [GetPlayer.GetDynasty.GetNameNoTooltip] will allow the construction of a unique #high Scholarly Dynasty Seat#!."
  bla_dynasty_seat_mosaic_path_tt:0 "The ancestral legacy of House [GetPlayer.GetDynasty.GetNameNoTooltip] will allow the construction of a unique #high Ancestral Dynasty Seat#!."

  #------------------------------------------------
  # ESTABLISH DYNASTY SEAT - COMPLETION
  #------------------------------------------------

  bla_dynasty_seat_established_tt:0 "House [GetPlayer.GetDynasty.GetNameNoTooltip] formally establishes its ancestral seat."
  bla_dynasty_seat_building_unlocked_tt:0 "The first stage of your Dynasty Seat can now be constructed in your [capital|E]."
  bla_dynasty_seat_future_upgrades_tt:0 "Once constructed, the seat may be expanded through several increasingly prestigious stages."

  bla_dynasty_seat_foundation_flavor_tt:0 "#weak A name may be written in ink, but a dynasty is remembered in stone.#!"


  #------------------------------------------------
  # STEEL DYNASTY SEAT
  #------------------------------------------------

  building_type_bla_steel_dynasty_seat_01:0 "Martial Dynasty Seat"
  building_type_bla_steel_dynasty_seat_01_desc:0 "A fortified ancestral seat shaped by the martial traditions of House [GetPlayer.GetDynasty.GetNameNoTooltip], where walls, arms, and disciplined men stand as enduring proof of the dynasty's strength."

  building_bla_steel_dynasty_seat_01:0 "Timber Palisade"
  building_bla_steel_dynasty_seat_01_desc:0 "Sharpened stakes, muddy ditches, and rough-hewn towers enclose the first stronghold of House [GetPlayer.GetDynasty.GetNameNoTooltip]. Within its walls, household swords drill beneath the eyes of their lord, and what began as a name upon parchment takes its first shape in timber and iron."

  building_bla_steel_dynasty_seat_02:0 "Garrison Hall"
  building_bla_steel_dynasty_seat_02_desc:0 "A stout hall and smoking smithy now stand behind the palisade. Men-at-arms sleep beneath its rafters, armorers hammer through the daylight hours, and a Master-at-Arms drills the household guard until every shield rises and every spear lowers as one."

  building_bla_steel_dynasty_seat_03:0 "Stone Gatehouse"
  building_bla_steel_dynasty_seat_03_desc:0 "Timber gives way to quarried stone. An iron-bound gatehouse commands the approach while thick walls shelter the household within. No longer a fortified camp, this is a castle in truth—and a warning to every neighbor who once dismissed House [GetPlayer.GetDynasty.GetNameNoTooltip] as an upstart name."

  building_bla_steel_dynasty_seat_04:0 "Curtain Wall Fortress"
  building_bla_steel_dynasty_seat_04_desc:0 "High curtain walls and crenellated towers encircle the inner ward, their walks crowded with bowmen whenever unfamiliar banners appear upon the road. Smithies, barracks, armories, and drill yards make the seat as much a weapon as a home."

  building_bla_steel_dynasty_seat_05:0 "Iron-Capped Citadel"
  building_bla_steel_dynasty_seat_05_desc:0 "Generations of stonework have transformed the old palisade into a formidable citadel of towers, armories, barracks, and war chambers. Captains study old campaigns beneath smoke-darkened rafters while the household guard trains in the yards below. The strength of House [GetPlayer.GetDynasty.GetNameNoTooltip] is now written in stone as plainly as upon any battlefield."


  #------------------------------------------------
  # COIN DYNASTY SEAT
  #------------------------------------------------

  building_type_bla_coin_dynasty_seat_01:0 "Mercantile Dynasty Seat"
  building_type_bla_coin_dynasty_seat_01_desc:0 "An ancestral seat built upon tolls, markets, careful accounting, and accumulated wealth, ensuring that the fortunes of House [GetPlayer.GetDynasty.GetNameNoTooltip] grow alongside its name."

  building_bla_coin_dynasty_seat_01:0 "Tollhouse"
  building_bla_coin_dynasty_seat_01_desc:0 "A timber tollhouse stands where merchants, drovers, and travelers must pass beneath the banner of House [GetPlayer.GetDynasty.GetNameNoTooltip]. The sums collected are modest—coppers here, a silver stag there—but every coin marks another traveler who has paid for the privilege of crossing our lands."

  building_bla_coin_dynasty_seat_02:0 "Customs Yard"
  building_bla_coin_dynasty_seat_02_desc:0 "A walled yard now receives wagons and merchant trains beneath the watch of armed guards. Barrels are counted, cargoes weighed, and ledgers filled by sharp-eyed collectors who have learned that a lord may grow wealthy from roads and markets as surely as from fields."

  building_bla_coin_dynasty_seat_03:0 "Chartered Market"
  building_bla_coin_dynasty_seat_03_desc:0 "Warehouses, granaries, workshops, and permanent stalls crowd beneath the walls. Merchants arrive knowing that contracts sworn here will be enforced, and the markets of House [GetPlayer.GetDynasty.GetNameNoTooltip] begin drawing silver from lands far beyond its own boundaries."

  building_bla_coin_dynasty_seat_04:0 "Steward's Court"
  building_bla_coin_dynasty_seat_04_desc:0 "Behind guarded doors, stewards and clerks reckon rents, tolls, debts, harvests, and contracts upon rows of parchment ledgers. Little escapes their accounting. Wealth that once trickled through careless fingers is gathered, counted, and turned toward the ambitions of the house."

  building_bla_coin_dynasty_seat_05:0 "Iron-Vaulted Treasury"
  building_bla_coin_dynasty_seat_05_desc:0 "Deep beneath the seat lie chambers secured by iron doors and watched by trusted guards. Gold dragons share their darkness with silver stags, sealed contracts, merchant bonds, and the accumulated wealth of generations. Wars may be lost for want of coin; House [GetPlayer.GetDynasty.GetNameNoTooltip] intends never to learn that lesson."


  #------------------------------------------------
  # VEIL DYNASTY SEAT
  #------------------------------------------------

  building_type_bla_veil_dynasty_seat_01:0 "Shadowed Dynasty Seat"
  building_type_bla_veil_dynasty_seat_01_desc:0 "An ancestral seat shaped as much by what lies unseen as by its walls and towers, where secrets, hidden passages, and carefully gathered whispers serve House [GetPlayer.GetDynasty.GetNameNoTooltip]."

  building_bla_veil_dynasty_seat_01:0 "Shuttered Solar"
  building_bla_veil_dynasty_seat_01_desc:0 "Heavy shutters and a stout door conceal a private chamber deep within the household. Letters are opened here, rumors compared, and delicate questions asked where servants know better than to linger."

  building_bla_veil_dynasty_seat_02:0 "Hidden Galleries"
  building_bla_veil_dynasty_seat_02_desc:0 "Renovations have left certain walls thicker than they need be and certain corridors absent from every plan. Through narrow passages and concealed alcoves, trusted servants may watch the halls without themselves being seen."

  building_bla_veil_dynasty_seat_03:0 "Secret Rookery"
  building_bla_veil_dynasty_seat_03_desc:0 "Hidden from the castle's ordinary traffic lies a small rookery known only to a trusted few. Ravens depart beneath darkness bearing coded messages, while replies arrive without ever passing through the hands of the household's usual scribes."

  building_bla_veil_dynasty_seat_04:0 "Chamber of Shadows"
  building_bla_veil_dynasty_seat_04_desc:0 "Behind an unremarkable stretch of stone lies a chamber without banners or windows. Here are kept intercepted letters, secret ledgers, whispered accusations, and the names of men and women whose loyalties may someday be purchased—or broken."

  building_bla_veil_dynasty_seat_05:0 "Labyrinth of Whispers"
  building_bla_veil_dynasty_seat_05_desc:0 "Generations of alterations have left hidden passages threaded throughout the ancient walls. Servants vanish behind panels, messages travel unseen, and guests sometimes discover that words spoken in solitude were not so private after all. Within the seat of House [GetPlayer.GetDynasty.GetNameNoTooltip], even stone seems to have ears."


  #------------------------------------------------
  # CANDLE DYNASTY SEAT
  #------------------------------------------------

 building_type_bla_candle_dynasty_seat_01:0 "Scholarly Dynasty Seat"
 building_type_bla_candle_dynasty_seat_01_desc:0 "An ancestral seat devoted to chronicles, learning, and the preservation of knowledge, ensuring that neither the deeds nor hard-won wisdom of House [GetPlayer.GetDynasty.GetNameNoTooltip] are surrendered to time."

 building_bla_candle_dynasty_seat_01:0 "House Scriptorium"
 building_bla_candle_dynasty_seat_01_desc:0 "A modest chamber of desks, shelves, inkpots, and guttering candles gives the household maester and his scribes a permanent place to work. Harvest tallies, births, deaths, debts, and land grants are committed to parchment so that memory need no longer depend upon old men."

 building_bla_candle_dynasty_seat_02:0 "Household Archive"
 building_bla_candle_dynasty_seat_02_desc:0 "Stone chambers protect an expanding collection of charters, histories, correspondence, and copied texts. What began as simple household accounts has become a record of the lands, rights, blood, and obligations of House [GetPlayer.GetDynasty.GetNameNoTooltip]."

 building_bla_candle_dynasty_seat_03:0 "Hall of Chronicles"
 building_bla_candle_dynasty_seat_03_desc:0 "Oak shelves climb the walls beneath vaulted ceilings, bearing histories, maps, legal precedents, and correspondence gathered over generations. Maesters and learned guests increasingly seek the hall when some forgotten treaty, boundary, or bloodline must be remembered."

 building_bla_candle_dynasty_seat_04:0 "Scholars' Repository"
 building_bla_candle_dynasty_seat_04_desc:0 "The collection has grown beyond the needs of household governance. Rare histories, medicinal works, astronomical tables, foreign accounts, and carefully copied manuscripts fill an entire wing, attracting learned men who bring still more knowledge in exchange for access."

 building_bla_candle_dynasty_seat_05:0 "Tower of a Thousand Candles"
 building_bla_candle_dynasty_seat_05_desc:0 "From dusk until dawn, countless candles glow behind the high windows of the tower. Within lie generations of accumulated histories, maps, correspondence, legal precedents, and rare manuscripts. Swords preserve a house for a battle; memory may preserve it for a thousand years."


  #------------------------------------------------
  # BANNER DYNASTY SEAT
  #------------------------------------------------

 building_type_bla_banner_dynasty_seat_01:0 "Courtly Dynasty Seat"
 building_type_bla_banner_dynasty_seat_01_desc:0 "An ancestral seat whose halls are made for feasts, councils, petitions, marriages, and sworn oaths, binding friends and bannermen ever more closely to House [GetPlayer.GetDynasty.GetNameNoTooltip]."


 building_bla_banner_dynasty_seat_01:0 "Hearth Hall"
 building_bla_banner_dynasty_seat_01_desc:0 "A broad timber hall rises around a great central hearth. Here knights, neighbors, sworn swords, and passing guests eat beneath the banner of House [GetPlayer.GetDynasty.GetNameNoTooltip], and many a friendship begins over bread, salt, and a shared cup."

 building_bla_banner_dynasty_seat_02:0 "Audience Hall"
 building_bla_banner_dynasty_seat_02_desc:0 "A raised seat now stands at the end of a proper stone hall where petitioners, tenants, knights, and neighboring lords may be received with suitable ceremony. Every judgment delivered beneath its rafters strengthens the authority attached to the name of House [GetPlayer.GetDynasty.GetNameNoTooltip]."

 building_bla_banner_dynasty_seat_03:0 "Council Chamber"
 building_bla_banner_dynasty_seat_03_desc:0 "A spacious chamber furnished with maps and long tables provides a proper setting for negotiations between lords. Marriage contracts are debated, disputes settled, alliances considered, and plans laid while heralds wait beyond the doors."

 building_bla_banner_dynasty_seat_04:0 "Hall of Banners"
 building_bla_banner_dynasty_seat_04_desc:0 "Fine tapestries and the standards of friends, kin, and sworn allies hang from the rafters of a magnificent reception hall. Feasts held here are remembered long afterward, and those welcomed beneath its roof leave knowing that House [GetPlayer.GetDynasty.GetNameNoTooltip] possesses friends as well as swords."

 building_bla_banner_dynasty_seat_05:0 "Great Hall of Oaths"
 building_bla_banner_dynasty_seat_05_desc:0 "Banners accumulated across generations hang above a vast stone hall built for feasts, councils, marriages, judgments, and solemn vows. Before its high seat, alliances are proclaimed and swords sworn in service. Few monuments better display how far House [GetPlayer.GetDynasty.GetNameNoTooltip] has risen from its humble beginnings."


  #------------------------------------------------
  # MOSAIC DYNASTY SEAT
  #------------------------------------------------

 building_type_bla_mosaic_dynasty_seat_01:0 "Ancestral Dynasty Seat"
 building_type_bla_mosaic_dynasty_seat_01_desc:0 "An ancestral seat raised as a living monument to the bloodline of House [GetPlayer.GetDynasty.GetNameNoTooltip], preserving the relics, deeds, sorrows, and triumphs of each passing generation."

 building_bla_mosaic_dynasty_seat_01:0 "Founder's Hearth"
 building_bla_mosaic_dynasty_seat_01_desc:0 "The first hall of House [GetPlayer.GetDynasty.GetNameNoTooltip] is humble, but its hearth burns beneath the family's banner. Nearby hang the founder's arms, the earliest grants of land, and those few possessions already deemed worthy of being remembered."

 building_bla_mosaic_dynasty_seat_02:0 "Lineage Vault"
 building_bla_mosaic_dynasty_seat_02_desc:0 "A secure chamber preserves marriage contracts, grants, letters, seals, and relics belonging to the first generations of the house. Each object is modest by the standards of ancient dynasties, yet together they form something more precious: a past."

 building_bla_mosaic_dynasty_seat_03:0 "Gallery of Deeds"
 building_bla_mosaic_dynasty_seat_03_desc:0 "The victories and sorrows of House [GetPlayer.GetDynasty.GetNameNoTooltip] now line a long stone gallery. Captured banners hang beside battered shields, old portraits, tournament prizes, and painted scenes commissioned so that descendants may know the deeds that shaped their inheritance."

 building_bla_mosaic_dynasty_seat_04:0 "Ancestral Court"
 building_bla_mosaic_dynasty_seat_04_desc:0 "Carved likenesses of departed lords and ladies watch over a grand ceremonial court. Here heirs are presented, marriages celebrated, judgments remembered, and family relics displayed on solemn occasions beneath the eyes of generations cast in stone."

 building_bla_mosaic_dynasty_seat_05:0 "Sanctuary of the Bloodline"
 building_bla_mosaic_dynasty_seat_05_desc:0 "What began with a founder's hearth has become a monument to generations. Tombs, statues, banners, relics, chronicles, and ancestral arms fill halls whose every stone recalls some triumph, marriage, sacrifice, or grief. House [GetPlayer.GetDynasty.GetNameNoTooltip] no longer needs a chronicler to prove that it has a history."



  # -------------------------
  # STEEL PERK NAMES
  # -------------------------

 bla_custom_steel_legacy_1_name:0 "The First Cut"
 bla_custom_steel_legacy_2_name:0 "Eyes Beneath the Helm"
 bla_custom_steel_legacy_3_name:0 "The Unbroken Line"
 bla_custom_steel_legacy_4_name:0 "Granaries Before Glory"
 bla_custom_steel_legacy_5_name:0 "Iron Without Applause"

BLA_CUSTOM_STEEL_LEGACY_1_NO_BULLETTAB:0 "They do not wait to be struck. From the training yard to the battlefield, theirs is a tradition of seizing the moment and forcing the foe to answer. \n#weak The first cut is seldom forgotten. [GetPlayer.GetDynasty.GetNameNoTooltip]s tend to be [GetTrait('brave').GetName( GetNullCharacter )]."

BLA_CUSTOM_STEEL_LEGACY_2_NO_BULLETTAB:0 "Battle is more than the meeting of swords. Their captains are taught to watch the ground and the enemy alike, waiting for the weakness that turns a hard fight into a victory. \n#weak A watchful commander needs strike only once."

BLA_CUSTOM_STEEL_LEGACY_3_NO_BULLETTAB:0 "Their lines do not break easily. Knights ride where the fighting is fiercest, men close ranks around fallen comrades, and even hard blows fail to scatter the host. \n#weak So long as one stands, the line remains unbroken."

BLA_CUSTOM_STEEL_LEGACY_4_NO_BULLETTAB:0 "No campaign is won by valor alone. Granaries are filled before the banners rise, wagons kept in repair, and every retreat planned with the same care as an advance. \n#weak Glory wins songs; preparation wins wars."

BLA_CUSTOM_STEEL_LEGACY_5_NO_BULLETTAB:0 "A house seasoned by generations of war has little need for boasts. Its captains know when to advance and when to yield ground, its household troops are kept in proper order, and the lessons of old campaigns are practiced long after the songs have forgotten them.\n#weak Unlocks the #V Hold a Household Muster#! decision, allowing the ruler to gather the household's fighting men and turn their attention toward knights, soldiers, or captains."

agot_bla_custom_house_legacy.0110.t:0 "The Household Muster"

agot_bla_custom_house_legacy.0110.desc:0 "The yard has been crowded since first light. Knights ride beneath the walls while men-at-arms drill in ranks nearby, their serjeants barking corrections over the ring of blunted steel. Captains who have served my house through war and peace stand together at the edge of the field, watching for faults that younger men have yet to learn to see.\n\nThere is time enough to test every part of a fighting household, but one lesson should receive particular attention."

agot_bla_custom_house_legacy.0110.a:0 "Put the knights through their paces."
agot_bla_custom_house_legacy.0110.b:0 "Drill the men until they move as one."
agot_bla_custom_house_legacy.0110.c:0 "Gather the captains around the maps."

bla_hold_household_muster_decision:0 "Hold a Household Muster"
bla_hold_household_muster_decision_desc:0 "A fighting household grows dull if its swords are only drawn in war. Knights, captains, men-at-arms, and retainers can be gathered at my seat for days of riding, drill, and mock battle, keeping old lessons alive while teaching new ones."
bla_hold_household_muster_decision_tooltip:0 "Gather the fighting men of House [GetPlayer.GetDynasty.GetNameNoTooltip] for an intensive household muster."
bla_hold_household_muster_decision_confirm:0 "Summon the Household"

bla_hold_household_muster_cost_tt:0 "You must have at least #high 100#! [gold|E]."
bla_hold_household_muster_cooldown_tt:0 "A Household Muster has not been held within the last #high 10 years#!."

bla_household_muster_held:0 "Household Muster Held"
bla_household_muster_held_desc:0 "The household's knights, captains, and fighting men have recently been gathered for an extensive muster."

agot_bla_custom_house_legacy.0111.t:0 "A Knight Distinguished"

agot_bla_custom_house_legacy.0111.desc:0 "By the end of the day's trials, [muster_knight.GetFirstName] has drawn more than a few eyes. Whether in the saddle or with blunted steel in hand, [muster_knight.GetSheHe] has acquitted [muster_knight.GetHerselfHimself] well against the other swords of my household.\n\nThe others have noticed. What lesson they take from it is mine to decide."

agot_bla_custom_house_legacy.0111.a:0 "Such skill deserves recognition."
agot_bla_custom_house_legacy.0111.b:0 "Let the others learn from [muster_knight.GetHerHim]."

bla_household_knight_distinguished:0 "Distinguished at the Muster"
bla_household_knight_distinguished_desc:0 "This knight distinguished themselves during the household muster and has since received particular attention in the training yard."

bla_muster_knights_tested:0 "Knights Tested"
bla_muster_knights_tested_desc:0 "Competition at the household muster has sharpened the knights who ride beneath this house's banner."

bla_muster_men_drilled:0 "Men Well Drilled"
bla_muster_men_drilled_desc:0 "Repeated drills have accustomed the household's fighting men to maintaining formation and answering commands amid confusion."

bla_muster_captains_schooled:0 "Captains Schooled"
bla_muster_captains_schooled_desc:0 "Experienced captains have spent days studying old campaigns, arguing over failures, and drilling responses to the battlefield's more familiar dangers."


  # -------------------------
  # COIN PERK NAMES
  # -------------------------

 bla_custom_coin_legacy_1_name:0 "Measured Fields"
 bla_custom_coin_legacy_2_name:0 "Ledgers Kept Close"
 bla_custom_coin_legacy_3_name:0 "Stone Raised Slowly"
 bla_custom_coin_legacy_4_name:0 "Blades Bought and Bound"
 bla_custom_coin_legacy_5_name:0 "The Long Counting"

BLA_CUSTOM_COIN_LEGACY_1_NO_BULLETTAB:0 "They know their lands by more than the view from a castle wall. Fields are measured, boundaries kept, and poor ground put to better use where it can be. \n#weak A careful lord seldom finds his lands wanting.\n#weak [GetPlayer.GetDynasty.GetNameNoTooltip]s tend to be [GetTrait('diligent').GetName( GetNullCharacter )]."

BLA_CUSTOM_COIN_LEGACY_2_NO_BULLETTAB:0 "Rents, tolls, harvests, and debts all find their way into the household books. A missing silver stag may go unnoticed for a day, but seldom for a year. \n#weak Good accounts make for full coffers."

BLA_CUSTOM_COIN_LEGACY_3_NO_BULLETTAB:0 "Prosperous years are put to use. New towers rise beside old ones, walls are thickened, and timber gives way to stone wherever the house can afford it. \n#weak What is built well may serve generations yet unborn."

BLA_CUSTOM_COIN_LEGACY_4_NO_BULLETTAB:0 "When more swords are needed, there is coin to pay for them. Sellsword captains know which houses pay what they promise, and armed men have a way of remembering the same. \n#weak Silver can fill an empty muster quickly."

BLA_CUSTOM_COIN_LEGACY_5_NO_BULLETTAB:0 "Coin spent is easily counted. Coin kept is another matter. Year by year, prudent hands set something aside against failed harvests, unexpected wars, ransoms, repairs, and all the other misfortunes that visit even the richest halls. In time, the reserves of House [GetPlayer.GetDynasty.GetNameNoTooltip] become a strength in their own right.\n#weak Accumulating sufficient wealth establishes increasingly valuable #V House Reserves#!. Unlocks the #V Call Upon the House's Reserves#! decision, allowing those reserves to be emptied in a time of need."

bla_long_counting_full_coffers:0 "Full Coffers"
bla_long_counting_full_coffers_desc:0 "The house keeps sufficient coin and goods in reserve to meet an unexpected need."

bla_long_counting_deep_reserves:0 "Deep Reserves"
bla_long_counting_deep_reserves_desc:0 "Years of careful stewardship have left the house with substantial reserves beyond its immediate expenses."

bla_long_counting_house_of_means:0 "A House of Means"
bla_long_counting_house_of_means_desc:0 "Few ordinary reversals could exhaust the resources accumulated by this house."

bla_long_counting_vaults_emptied:0 "Vaults Emptied"
bla_long_counting_vaults_emptied_desc:0 "The house has recently drawn heavily upon the reserves gathered over many years. Replenishing them will take time."

 bla_call_upon_house_reserves_decision:0 "Call Upon the House's Reserves"
 bla_call_upon_house_reserves_decision_desc:0 "Not all the wealth of a great household lies in the lord's purse. Plate and jewels rest in locked chambers, old debts remain uncollected, and stores laid aside in prosperous years may yet be turned to coin. If the need is great enough, those reserves can be called upon."
 bla_call_upon_house_reserves_decision_tooltip:0 "Draw upon the deeper reserves of House [GetPlayer.GetDynasty.GetNameNoTooltip] for immediate [gold|E]."
 bla_call_upon_house_reserves_decision_confirm:0 "Open the Vaults"

 bla_call_upon_house_reserves_full_coffers_tt:0 "The household reserves will yield #P 250#! [gold|E]."
 bla_call_upon_house_reserves_deep_reserves_tt:0 "The household reserves will yield #P 500#! [gold|E]."
 bla_call_upon_house_reserves_house_of_means_tt:0 "The household reserves will yield #P 750#! [gold|E]."

 bla_call_upon_house_reserves_vaults_emptied_tt:0 "The deeper reserves of House [GetPlayer.GetDynasty.GetNameNoTooltip] will be considered #N depleted for 5 years#!."
 bla_call_upon_house_reserves_long_counting_disabled_tt:0 "The benefits of #high The Long Counting#! cannot be gained while the vaults remain depleted."

 bla_call_upon_house_reserves_has_reserves_tt:0 "You must have #high Full Coffers#!, #high Deep Reserves#!, or be #high A House of Means#!."
 bla_call_upon_house_reserves_not_depleted_tt:0 "Your deeper household reserves must not already be depleted."


  # -------------------------
  # BANNER PERK NAMES
  # -------------------------

  bla_custom_banner_legacy_1_name:0 "Bread and Salt"
  bla_custom_banner_legacy_2_name:0 "Oaths Remembered"
  bla_custom_banner_legacy_3_name:0 "Bonds of Blood"
  bla_custom_banner_legacy_4_name:0 "Banners Answered"
  bla_custom_banner_legacy_5_name:0 "Beneath One Banner"

BLA_CUSTOM_BANNER_LEGACY_1_NO_BULLETTAB:0 "Their halls are seldom closed to those who come in peace. Guests are given a place by the fire, travelers find bread and salt waiting, and those who enter beneath the house's roof are treated with the courtesy expected of a noble household.\n#weak [GetPlayer.GetDynasty.GetNameNoTooltip]s tend to be [GetTrait('gregarious').GetName( GetNullCharacter )]."

BLA_CUSTOM_BANNER_LEGACY_2_NO_BULLETTAB:0 "An oath binds lord and sworn man alike. Service is remembered, grievances are heard, and those who have stood faithfully beneath the banner know that their loyalty will not be taken for granted. \n#weak Old oaths are strongest when both sides remember them."

BLA_CUSTOM_BANNER_LEGACY_3_NO_BULLETTAB:0 "A marriage may join lands that swords could never hold together. Over generations, cousins, wards, old companions, and marriage kin have carried the house's friendships far beyond its own walls."

BLA_CUSTOM_BANNER_LEGACY_4_NO_BULLETTAB:0 "When the ravens fly and the summons goes out, the answer comes from tower, holdfast, and landed knight. Some march from duty, others from affection or debts remembered, but all gather beneath the same standard. \n#weak A banner is only cloth until men choose to follow it."

BLA_CUSTOM_BANNER_LEGACY_5_NO_BULLETTAB:0 "Generations of marriages, favors, victories, and faithfully kept oaths have given the house a place of its own in the feudal order. Lords may die and heirs may change, yet the obligations surrounding their name endure. In time of war, an extraordinary summons may call upon those deeper obligations and bring men from across the lands to gather beneath the house's standard. \n#weak Unlocks the #high Call the Banners#! decision."

  # -------------------------
  # CALL THE BANNERS
  # -------------------------

bla_call_the_banners_decision:0 "Call the Banners"
bla_call_the_banners_decision_desc:0 "War has come, and the strength already gathered beneath my own roof may not be enough. Ravens can be sent to landed knights, household retainers, lesser sworn men, and all those whose obligations to my house run deeper than an ordinary levy."
bla_call_the_banners_decision_tooltip:0 "Issue an extraordinary summons to those bound to House [GetPlayer.GetDynasty.GetNameNoTooltip]."
bla_call_the_banners_decision_confirm:0 "Send the Ravens"

bla_call_the_banners_count_tt:0 "Your summons will raise #P 500#! additional levies."
bla_call_the_banners_duke_tt:0 "Your summons will raise #P 1,000#! additional levies."
bla_call_the_banners_king_tt:0 "Your summons will raise #P 2,500#! additional levies."
bla_call_the_banners_emperor_tt:0 "Your summons will raise #P 5,000#! additional levies."

bla_call_the_banners_at_war_tt:0 "You must be at [war|E] to call upon the extraordinary obligations of your house."
bla_call_the_banners_not_called_tt:0 "The banners must not have been called within the last #high 10 years#!."

bla_called_banners_army:0 "Called Banners"

bla_banners_called:0 "The Banners Were Called"
bla_banners_called_desc:0 "Ravens have already carried an extraordinary summons across the lands, and men have left their fields, halls, and holdfasts to answer. Such obligations cannot be demanded again so soon."


  # -------------------------
  # VEIL PERK NAMES
  # -------------------------

bla_custom_veil_legacy_1_name:0 "Words Behind Doors"
bla_custom_veil_legacy_2_name:0 "A Closed Mouth"
bla_custom_veil_legacy_3_name:0 "Debts Unspoken"
bla_custom_veil_legacy_4_name:0 "The Hand Unseen"
bla_custom_veil_legacy_5_name:0 "The Web Behind the Wall"

BLA_CUSTOM_VEIL_LEGACY_1_NO_BULLETTAB:0 "The most useful words are seldom spoken in the great hall. Servants talk while carrying wine, guards complain when the watch runs long, and men who hold their tongues before a lord may speak freely before someone they scarcely notice.\n#weak [GetPlayer.GetDynasty.GetNameNoTooltip]s tend to be [GetTrait('deceitful').GetName( GetNullCharacter )]."

BLA_CUSTOM_VEIL_LEGACY_2_NO_BULLETTAB:0 "Those who live by whispers soon learn the worth of silence. Letters are burned, servants chosen carefully, and family affairs kept behind doors that remain firmly shut. What the house knows may travel far; what it intends seldom does."

BLA_CUSTOM_VEIL_LEGACY_3_NO_BULLETTAB:0 "There are obligations that never appear in a maester's ledger. A favor quietly granted, an indiscretion overlooked, or a confidence kept may bind a man more securely than coin. Those who know what House [GetPlayer.GetDynasty.GetNameNoTooltip] remembers are often careful to meet what is expected of them."

BLA_CUSTOM_VEIL_LEGACY_4_NO_BULLETTAB:0 "Some victories require neither banners nor drawn steel. A letter delivered to the right hands, a servant persuaded to look elsewhere, or a rumor placed carefully enough may accomplish what an army cannot. The finest work leaves little behind by which the hand responsible might be known."

BLA_CUSTOM_VEIL_LEGACY_5_NO_BULLETTAB:0 "Secrets seldom announce themselves. They are carried by servants who linger too long at doors, merchants who hear more than they are paid to hear, guards who know which visitors arrive after dark, and correspondents whose letters contain more than polite words. House [GetPlayer.GetDynasty.GetNameNoTooltip] has learned that a whisper gathered today may prove worth more than a threat made tomorrow.\n#weak Unlocks the #V Establish a Whisper Network#! decision, allowing the ruler to cultivate informants within the court, among the bannermen, or beyond the borders for #V 10 years#!."

bla_establish_whisper_network_decision:0 "Establish a Whisper Network"
bla_establish_whisper_network_decision_desc:0 "Useful information rarely comes from a single spy. Servants, merchants, guards, clerks, travelers, and lesser retainers can each be persuaded to listen in the right places, until scattered whispers begin to form a web."
bla_establish_whisper_network_decision_tooltip:0 "Establish an intelligence network serving House [GetPlayer.GetDynasty.GetNameNoTooltip]."
bla_establish_whisper_network_decision_confirm:0 "Set the Whispers in Motion"
bla_establish_whisper_network_available_tt:0 "You must not already maintain an active #high Whisper Network#!."

agot_bla_custom_house_legacy.0120.t:0 "A Web of Whispers"
agot_bla_custom_house_legacy.0120.desc:0 "A single informant may hear something useful. A dozen, placed carefully, may hear far more.\n\nThere are servants willing to listen beside closed doors, merchants who know which lords are buying grain or hiring swords, and travelers who carry more than stories between one castle and the next. With patience, coin, and discretion, such scattered ears might be made to serve a common purpose.\n\nThe only question is where they should listen."

agot_bla_custom_house_legacy.0120.a:0 "Begin beneath my own roof."
agot_bla_custom_house_legacy.0120.b:0 "Listen among my sworn lords."
agot_bla_custom_house_legacy.0120.c:0 "Send our whispers beyond the borders."

bla_whisper_network_eyes_within:0 "Eyes Within"
bla_whisper_network_eyes_within_desc:0 "Servants, guards, clerks, and other inconspicuous members of the household have been encouraged to report unusual behavior within the ruler's own court."

bla_whisper_network_among_banners:0 "Whispers Among the Banners"
bla_whisper_network_among_banners_desc:0 "The household maintains quiet sources among its sworn lords and their retainers, allowing discontent and private dealings to reach the ruler's ears before they are spoken openly."

bla_whisper_network_beyond_borders:0 "Whispers Beyond the Borders"
bla_whisper_network_beyond_borders_desc:0 "Merchants, travelers, correspondents, and other useful ears carry scraps of information back from courts beyond the ruler's own lands."

agot_bla_custom_house_legacy.0121.t:0 "A Whisper Beneath My Roof"
agot_bla_custom_house_legacy.0121.desc:0 "A servant attached to the network asks for a private audience. Nothing they have heard amounts to an accusation: a door opened after midnight, a conversation that ended when footsteps approached, a name spoken twice by men who had no reason to know one another.\n\nAny one of these things might mean nothing. Taken together, they have made my informant uneasy."

agot_bla_custom_house_legacy.0121.a:0 "Find out what lies beneath it."
agot_bla_custom_house_legacy.0121.b:0 "Let them know that I am watching."
agot_bla_custom_house_legacy.0121.c:0 "Not every whisper deserves an answer."

bla_whisper_network_household_watched:0 "Household Watched"
bla_whisper_network_household_watched_desc:0 "Unusual movements within the household are being watched more carefully, making it harder for conspirators to act unnoticed."

bla_whisper_network_nervous_court:0 "A Nervous Court"
bla_whisper_network_nervous_court_desc:0 "Few within the household are certain who reports to their lord. Even innocent conversations have become guarded."

agot_bla_custom_house_legacy.0122.t:0 "Words Beneath the Banners"
agot_bla_custom_house_legacy.0122.desc:0 "The complaint was never meant for me. It passed from a household knight to a steward, from the steward to a merchant, and from the merchant to one of the quiet ears maintained in my service.\n\nThere is grumbling among my sworn lords. Nothing yet amounts to defiance, but old grievances are being repeated more freely than they once were. I have learned of it before any man has dared bring the matter before my seat."

agot_bla_custom_house_legacy.0122.a:0 "Then hear the grievance before it festers."
agot_bla_custom_house_legacy.0122.b:0 "Find out who has been speaking loudest."
agot_bla_custom_house_legacy.0122.c:0 "Knowing their complaints is enough."

bla_whisper_network_grievances_heard:0 "Grievances Quietly Heard"
bla_whisper_network_grievances_heard_desc:0 "Complaints among the sworn lords have been addressed before they could harden into open resentment."

bla_whisper_network_vassals_watched:0 "Watched Banners"
bla_whisper_network_vassals_watched_desc:0 "Word has begun to spread that careless speech in a vassal's hall may eventually find its way back to the liege."

agot_bla_custom_house_legacy.0123.t:0 "Whispers from Afar"
agot_bla_custom_house_legacy.0123.desc:0 "A merchant recently returned from foreign lands has brought more than wares with him. Over wine he heard guards complain of their officers, servants speak of visitors who arrived after dark, and men with loose tongues discuss matters their lords would rather have kept within their own walls.\n\nMost of it is gossip. A few pieces, however, may be worth remembering."

agot_bla_custom_house_legacy.0123.a:0 "Send every useful word to my agents."
agot_bla_custom_house_legacy.0123.b:0 "My captains should hear of this."
agot_bla_custom_house_legacy.0123.c:0 "Information has buyers of its own."

bla_whisper_network_foreign_intelligence:0 "Foreign Intelligence"
bla_whisper_network_foreign_intelligence_desc:0 "Reports gathered beyond the realm have given the ruler's agents a clearer understanding of foreign households and their weaknesses."

bla_whisper_network_foreign_dispositions:0 "Foreign Dispositions"
bla_whisper_network_foreign_dispositions_desc:0 "Loose talk from soldiers, travelers, and retainers has provided useful details about how neighboring forces are organized and commanded."

  # -------------------------
  # CANDLE PERK NAMES
  # -------------------------

bla_custom_candle_legacy_1_name:0 "Lessons Well Learned"
bla_custom_candle_legacy_2_name:0 "The Raven's Reach"
bla_custom_candle_legacy_3_name:0 "In Sickness and in Health"
bla_custom_candle_legacy_4_name:0 "Ink Outlasts Blood"
bla_custom_candle_legacy_5_name:0 "A Candle Against the Dark"

BLA_CUSTOM_CANDLE_LEGACY_1_NO_BULLETTAB:0 "A lord who refuses counsel soon finds himself surrounded by men afraid to give it. From an early age, members of the house are taught to listen before judging and to weigh counsel carefully before acting in haste.\n#weak [GetPlayer.GetDynasty.GetNameNoTooltip]s tend to be [GetTrait('patient').GetName( GetNullCharacter )]."

BLA_CUSTOM_CANDLE_LEGACY_2_NO_BULLETTAB:0 "A raven may cross in hours what would take a rider days. Letters are answered promptly, correspondence carefully kept, and news carried between distant halls with a regularity that lesser households seldom match. Distance is less troublesome when the rookery is well tended."

BLA_CUSTOM_CANDLE_LEGACY_3_NO_BULLETTAB:0 "The maester's chamber is kept well supplied with clean linen, herbs, poultices, needles, and medicines brought from near and far. Wounds are tended before they fester, illnesses watched closely, and women in childbirth receive every care the household can provide."

BLA_CUSTOM_CANDLE_LEGACY_4_NO_BULLETTAB:0 "A sword may rust and a harvest may fail, but a lesson properly recorded can serve generations yet unborn. Chronicles, accounts, letters, maps, and the observations of learned men are copied and preserved, while heirlooms entrusted to the house are kept with equal care. What one generation learns need not be learned again at the same cost."

BLA_CUSTOM_CANDLE_LEGACY_5_NO_BULLETTAB:0 "Knowledge need not make a maester of every child. One may study the campaigns of dead kings, another the laws of inheritance, the keeping of accounts, the intrigues of courts, or the mysteries of the higher arts. What matters is that each is taught to bring learning to whatever path lies before them.\n#weak Members of House [GetPlayer.GetDynasty.GetNameNoTooltip] receive an improved [education_trait|E] upon coming of age, up to the highest tier attainable without advanced study."

  # -------------------------
  # MOSAIC PERK NAMES
  # -------------------------

bla_custom_mosaic_legacy_1_name:0 "Strangers at the Hearth"
bla_custom_mosaic_legacy_2_name:0 "Lessons from Afar"
bla_custom_mosaic_legacy_3_name:0 "A Lesson in Everything"
bla_custom_mosaic_legacy_4_name:0 "A Ready Hand"
bla_custom_mosaic_legacy_5_name:0 "A House of Many Threads"

BLA_CUSTOM_MOSAIC_LEGACY_1_NO_BULLETTAB:0 "A closed hall hears only its own counsel. Travelers, merchants, wandering knights, and guests from distant lands are welcomed beneath our roof, and members of House [GetPlayer.GetDynasty.GetNameNoTooltip] are encouraged to ask after the roads they have traveled and the customs they have known.\n#weak [GetPlayer.GetDynasty.GetNameNoTooltip]s tend to be [GetTrait('inquisitive').GetName( GetNullCharacter )]."

BLA_CUSTOM_MOSAIC_LEGACY_2_NO_BULLETTAB:0 "Not every useful lesson is learned at home. A foreign custom may settle an old dispute, an unfamiliar method may save a harvest, and a chance conversation may reveal more than years spent among familiar faces. What proves useful is remembered, whatever road first brought it to our door."

BLA_CUSTOM_MOSAIC_LEGACY_3_NO_BULLETTAB:0 "No child of the house is taught that one calling alone is worthy of study. The histories of wars sit beside ledgers and letters; the workings of courts are considered alongside the quieter arts of secrets and scholarship. Few will master every pursuit, but none should be wholly helpless when duty calls them beyond the one they know best."

BLA_CUSTOM_MOSAIC_LEGACY_4_NO_BULLETTAB:0 "A road seldom runs exactly as the map promises. Lands differ, people differ, and yesterday's answer may prove ill suited to tomorrow's trouble. Those of House [GetPlayer.GetDynasty.GetNameNoTooltip] learn to govern what lies before them, to travel unfamiliar roads with care, and to carry a greater share of their own affairs without being bound to a single way of doing things."

BLA_CUSTOM_MOSAIC_LEGACY_5_NO_BULLETTAB:0 "With the passing of generations, a house gathers more than lands and names. It gathers ways of doing things: lessons from the field and counting room, from crowded halls and whispered chambers, from books preserved long after their authors are dust. House [GetPlayer.GetDynasty.GetNameNoTooltip] has learned to keep them all, taking up whichever thread the times demand.\n#weak Unlocks the #V Take Up the Thread#! decision, allowing the ruler to emphasize the Warrior, Steward, Envoy, Whisperer, or Scholar tradition of the house for #V 10 years#!."

agot_bla_custom_house_legacy.0150.t:0 "Which Thread to Weave?"
agot_bla_custom_house_legacy.0150.desc:0 "No house is shaped by a single hand. Warriors have stood beneath our banners, careful stewards have counted our harvests and rents, silver tongues have spoken for us in distant halls, quiet hands have guarded what was best left unsaid, and learned minds have filled shelves with the wisdom of years past.\n\nEach has left something behind. A lesson repeated to a son, an old account book kept instead of burned, a letter tucked safely away, a campaign studied long after the swords were sheathed. Together they have become the many threads of House [ROOT.Char.GetDynasty.GetNameNoTooltip].\n\nFor the years ahead, one such thread shall be taken up anew."

agot_bla_custom_house_legacy.0150.a:0 "We will follow the warrior's thread."
agot_bla_custom_house_legacy.0150.b:0 "The steward's thread will serve us well."
agot_bla_custom_house_legacy.0150.c:0 "Let us take up the envoy's thread."
agot_bla_custom_house_legacy.0150.d:0 "Some threads are best followed in shadow."
agot_bla_custom_house_legacy.0150.e:0 "There is wisdom yet to be put to use."

bla_take_up_the_thread_decision:0 "Take Up the Thread"
bla_take_up_the_thread_decision_desc:0 "Over generations, House [ROOT.Char.GetDynasty.GetNameNoTooltip] has gathered lessons from many walks of life. Some were learned upon the field, others at the counting table, in crowded halls, behind closed doors, or over dusty books. I may choose which of these traditions will guide my rule in the years ahead."
bla_take_up_the_thread_decision_tooltip:0 "Choose one of your house's five traditions to emphasize for the next #V 10 years#!"
bla_take_up_the_thread_decision_confirm:0 "Take Up the Thread"

bla_mosaic_warrior_tradition:0 "The Warrior's Thread"
bla_mosaic_warrior_tradition_desc:0 "For a time, the house looks to the lessons of captains, knights, and commanders who understood that some disputes are settled only beneath unfurled banners."

bla_mosaic_steward_tradition:0 "The Steward's Thread"
bla_mosaic_steward_tradition_desc:0 "Old accounts and proven practices are brought forward once more, with close attention paid to rents, construction, and the careful ordering of the house's wealth."

bla_mosaic_envoy_tradition:0 "The Envoy's Thread"
bla_mosaic_envoy_tradition_desc:0 "The house turns outward, placing renewed value upon correspondence, reputation, and the difficult art of finding common purpose with distant lords."

bla_mosaic_whisperer_tradition:0 "The Whisperer's Thread"
bla_mosaic_whisperer_tradition_desc:0 "Not every lesson of consequence was learned openly. For the present, discretion, hidden intentions, and words spoken behind closed doors are given their proper weight."

bla_mosaic_scholar_tradition:0 "The Scholar's Thread"
bla_mosaic_scholar_tradition_desc:0 "Books are reopened, old observations reconsidered, and knowledge gathered across generations is put to practical use."
