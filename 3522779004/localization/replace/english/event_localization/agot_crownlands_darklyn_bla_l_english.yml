l_english:

agot_crownlands_bla.0300.t:0 "Seven White Swords"

agot_crownlands_bla.0300.desc:0 "Few honors bind the name Darklyn to the history of the realm as tightly as the white cloak.\n\nSeven sons of Duskendale have been called to the Kingsguard across the generations, surrendering lands, inheritance, and family for a place beside their sovereign. Their names remain part of our house's memory: knights remembered not for the wealth they gathered, but for the swords they carried and the vows they swore.\n\nSuch distinction casts a long shadow. Every promising young sword in my household invites comparison. Every tourney victory awakens old stories. Every discussion of honor eventually finds its way back to those seven white cloaks.\n\nA legacy such as this may be celebrated in more than one way."

agot_crownlands_bla.0300.a:0 "Let Duskendale breed swords worthy of our ancestors."

agot_crownlands_bla.0300.b:0 "The vows mattered more than the swords."

agot_crownlands_bla.0300.c:0 "Seven Darklyns served kings. Let the realm remember it."

agot_crownlands_bla.0300.d:0 "White cloaks are honorable, but Duskendale needs Darklyns too."

agot_darklyn_seven_swords_tradition_bla:0 "Legacy of Seven Swords"
agot_darklyn_seven_swords_tradition_bla_desc:0 "The martial household of Duskendale is encouraged to measure itself against the remarkable tradition of Darklyn knights who earned places among the Kingsguard."

agot_darklyn_white_cloak_ideal_bla:0 "The White Cloak Ideal"
agot_darklyn_white_cloak_ideal_bla_desc:0 "The Darklyn tradition of royal service is remembered not merely for martial prowess, but for the ideals of loyalty, sacrifice, and knightly honor represented by the white cloak."

agot_darklyn_lords_of_duskendale_bla:0 "Lords of Duskendale"
agot_darklyn_lords_of_duskendale_bla_desc:0 "Kingsguard may surrender inheritance for glory, but someone must remain to govern. This Darklyn believes the first obligation of the house is to preserve Duskendale and the power built there across generations."

agot_crownlands_bla.0301.t:0 "The Dun Fort"

agot_crownlands_bla.0301.desc:0 "The mason places two pieces of stone upon my table.\n\nThe first came from the Dun Fort. Rain and salt have worked their way into an outer wall, widening old cracks and loosening mortar that has held since my forebears were dust. Nothing threatens collapse, he assures me — not yet — but another generation of neglect will cost far more than repairing it now.\n\nThe second stone comes from Duskendale below. A merchant delegation has been asking for improvements of its own: better approaches for carts, repairs where goods are stored, and coin spent upon the town that fills my coffers rather than the castle that overlooks it.\n\nMy knights find the merchants' priorities shortsighted. The merchants say much the same of my knights.\n\nFrom the heights of the Dun Fort, castle and town seem parts of the same inheritance. Paying for them makes the distinction considerably clearer."

agot_crownlands_bla.0301.a:0 "The Dun Fort has guarded our house for generations."

agot_crownlands_bla.0301.b:0 "Walls do not make Duskendale prosperous. Its people do."

agot_crownlands_bla.0301.c:0 "Castle and town are both Darklyn. Fund them both."

agot_crownlands_bla.0301.c.success:0 "Stone and Silver"
agot_crownlands_bla.0301.c.failure:0 "Too Much, Too Quickly"

agot_crownlands_bla.0301.d:0 "Repair only what must be repaired."

agot_darklyn_dun_fort_restored_bla:0 "The Dun Fort Restored"
agot_darklyn_dun_fort_restored_bla_desc:0 "Substantial resources have been committed to the ancient seat of House Darklyn, strengthening the Dun Fort and reaffirming its place above Duskendale."

agot_darklyn_duskendale_investment_bla:0 "Investment in Duskendale"
agot_darklyn_duskendale_investment_bla_desc:0 "Rather than lavish coin upon the ancestral fortress, House Darklyn has directed its resources toward the town whose trade and people sustain its power."

agot_darklyn_dun_fort_and_town_bla:0 "Stone and Silver"
agot_darklyn_dun_fort_and_town_bla_desc:0 "Careful management has allowed House Darklyn to strengthen the Dun Fort without neglecting Duskendale below, binding the fortunes of castle and town more closely together."

agot_darklyn_overextended_works_bla:0 "Overextended Works"
agot_darklyn_overextended_works_bla_desc:0 "Attempts to improve both the Dun Fort and Duskendale at once have left projects unfinished, accounts swollen, and craftsmen demanding payment."

agot_crownlands_bla.0302.t:0 "The Guilds of Duskendale"

agot_crownlands_bla.0302.desc:0 "The delegation before me agrees on only one thing: everyone else is ruining Duskendale.\n\nThe harbor merchants complain that old tolls and privileges make it harder to bring goods through the town than through competing ports. The craftsmen answer that those same merchants flood the markets with foreign wares while demanding every protection Duskendale provides. Behind both stand the guild elders, clutching charters bearing Darklyn seals generations older than anyone in the room.\n\nEach insists that prosperity depends upon my choosing correctly.\n\nEach also seems remarkably certain that choosing correctly means choosing them."

agot_crownlands_bla.0302.a:0 "Open the town to commerce. Let merchants bring their coin."

agot_crownlands_bla.0302.a.duskendale_tt:0 "Your earlier decision to #bold invest in Duskendale#! has already laid the groundwork for expanded commerce."

agot_crownlands_bla.0302.b:0 "Duskendale's own craftsmen deserve our protection."

agot_crownlands_bla.0302.c:0 "The old charters will be honored."

agot_crownlands_bla.0302.c.preserved_tt:0 "Your earlier preference for #bold preserving what already stands#! makes the established rights of Duskendale's old guilds especially persuasive."

agot_crownlands_bla.0302.d:0 "No. You will all sit down and reach terms."

agot_crownlands_bla.0302.d.balance_tt:0 "Having successfully balanced #bold the Dun Fort and Duskendale#! gives you experience reconciling competing interests."

agot_crownlands_bla.0303.t:0 "The Price of Privilege"

agot_crownlands_bla.0303.desc_prosperity:0 "The merchants were not exaggerating every claim, it seems.\n\nMore ships now unload at Duskendale, warehouses fill more quickly, and traders who once passed the town by have begun seeking space along its quays. The guilds complain about competition, naturally, but even their members appear to have found more customers than before.\n\nThe town has grown louder, busier, and richer."

agot_crownlands_bla.0303.desc_stability:0 "The arguments have quieted.\n\nDuskendale's established interests have accepted the settlement, and the guilds once again conduct their quarrels through petitions, contracts, and carefully worded insults rather than threats of open defiance. The arrangement may not produce spectacular new wealth, but the town feels more settled beneath Darklyn rule."

agot_crownlands_bla.0303.desc_compromise:0 "Against every prediction offered during our first meeting, the guilds have reached terms.\n\nMerchants receive greater freedom without completely stripping Duskendale's craftsmen of protection. Old privileges survive, but with enough flexibility that they no longer choke every new enterprise before it begins.\n\nNo one received everything they wanted.\n\nThe fact that everyone complains roughly equally may be the surest proof that the settlement is fair."

agot_crownlands_bla.0303.desc_dispute:0 "The settlement has achieved an impressive feat: every faction now believes another has been favored at its expense.\n\nMerchants complain of obstruction, craftsmen of betrayal, and guild elders of rights trampled beneath innovations no respectable Darklyn would have tolerated. Petitions pile upon my steward's table while arguments spill from guildhalls into the streets.\n\nDuskendale still functions. It merely does so angrily."

agot_crownlands_bla.0303.a:0 "Then let Duskendale prosper."

agot_crownlands_bla.0303.b:0 "A town at peace is wealth of another kind."

agot_crownlands_bla.0303.c:0 "Perhaps dissatisfaction truly is the foundation of compromise."

agot_crownlands_bla.0303.d:0 "I solved one argument only to create three more."

agot_darklyn_open_duskendale_trade_bla:0 "Open Duskendale Trade"
agot_darklyn_open_duskendale_trade_bla_desc:0 "Commercial privileges have been loosened, allowing more merchants and goods to pass through Duskendale and increasing the town's prosperity."

agot_darklyn_guild_compact_bla:0 "Guild Compact"
agot_darklyn_guild_compact_bla_desc:0 "The established interests of Duskendale have accepted a settlement that preserves their place beneath Darklyn rule and reduces the constant friction among the town's guilds."

agot_darklyn_balanced_guild_charter_bla:0 "Balanced Guild Charter"
agot_darklyn_balanced_guild_charter_bla_desc:0 "A carefully negotiated settlement balances merchants, craftsmen, and ancient guild privileges, giving Duskendale room to prosper without wholly abandoning its established customs."

agot_darklyn_guild_resentment_bla:0 "Guild Resentment"
agot_darklyn_guild_resentment_bla_desc:0 "Duskendale's merchants, craftsmen, and guild elders each believe the others have been granted unfair advantages, creating persistent friction throughout the town."

agot_crownlands_bla.0304.t:0 "A White Cloak for Duskendale"

agot_crownlands_bla.0304.desc:0 "[darklyn_white_cloak_candidate_bla.GetFirstName] has become difficult to ignore.\n\nThe younger Darklyn's skill with a blade has drawn praise from knights who are not usually generous with it, and every strong performance inevitably awakens the same comparison.\n\nSeven Darklyns have worn the white cloak.\n\nNo royal summons has arrived, nor has any place been promised. Yet reputations often reach court before the men who possess them, and there are already whispers that [darklyn_white_cloak_candidate_bla.GetFirstNameNoTooltip] might someday prove worthy of the honor our house has claimed so often before.\n\nThere is pride in that thought.\n\nThere is also a harder truth. A knight who takes the white gives his sword to the Crown forever. House Darklyn gains the honor, but Duskendale loses the man."

agot_crownlands_bla.0304.a:0 "Then let [darklyn_white_cloak_candidate_bla.GetFirstNameNoTooltip] strive to become the eighth."

agot_crownlands_bla.0304.a.seven_swords_tt:0 "Your earlier embrace of #bold the Legacy of Seven Swords#! makes the prospect of another Darklyn aspiring to the white cloak especially prestigious."

agot_crownlands_bla.0304.b:0 "The choice must be [darklyn_white_cloak_candidate_bla.GetHerHis] own."

agot_crownlands_bla.0304.b.chivalry_tt:0 "Your earlier embrace of #bold the White Cloak Ideal#! reminds you that a vow freely sworn means more than an honor pursued for the glory of one's house."

agot_crownlands_bla.0304.c:0 "No. Duskendale has need of such a sword."

agot_crownlands_bla.0304.c.duskendale_tt:0 "Your earlier commitment to #bold the Lords of Duskendale#! reinforces your belief that House Darklyn must preserve its finest people rather than surrender them for distant honors."

agot_crownlands_bla.0304.d:0 "The possibility alone is useful enough."

agot_crownlands_bla.0304.d.royal_service_tt:0 "Your earlier emphasis upon #bold Royal Service#! makes the reputation of another potential white cloak a useful reminder of House Darklyn's long relationship with the Crown."


agot_crownlands_bla.0305.t:0 "The Knight's Answer"

agot_crownlands_bla.0305.desc_service:0 "[darklyn_white_cloak_candidate_bla.GetFirstName] does not answer immediately.\n\nWhen the answer finally comes, however, there is no uncertainty in it.\n\n'If the white cloak were ever offered to me, I would take it.'\n\nThere is pride in [darklyn_white_cloak_candidate_bla.GetHerHis] voice, but something more serious beneath it. [darklyn_white_cloak_candidate_bla.GetSheHe|U] understands what such an oath would cost: inheritance, marriage, children, and the freedom to choose another life.\n\nSeven Darklyns made that sacrifice before [darklyn_white_cloak_candidate_bla.GetHerHim]. Perhaps there may yet be an eighth."

agot_crownlands_bla.0305.desc_home:0 "[darklyn_white_cloak_candidate_bla.GetFirstName] considers the question for a long while before answering.\n\n'I honor the seven who wore white. But I do not think their road must be mine.'\n\nThere is no shame in the words. If anything, speaking them seems to lift some invisible weight from [darklyn_white_cloak_candidate_bla.GetHerHis] shoulders.\n\nThe white cloak has brought House Darklyn great honor across the generations. Yet Duskendale was not built by men who surrendered every claim to home."

agot_crownlands_bla.0305.a:0 "Then may the Crown someday find [darklyn_white_cloak_candidate_bla.GetHerHim] worthy."

agot_crownlands_bla.0305.b:0 "Then your sword remains with your house."

agot_crownlands_bla.0306.t:0 "The Shadow on the Blackwater"

agot_crownlands_bla.0306.desc:0 "Duskendale has prospered upon the Blackwater for generations, its quays crowded with merchants and its warehouses filled with goods carried from both sides of the narrow sea.\n\nYet no port prospers alone. Other harbors compete for the same ships, the same cargoes, and the same purses. Royal favor can redirect trade with a word. A new road can make an old route less valuable. A merchant who has unloaded at Duskendale for twenty years may still sail elsewhere if another harbor promises greater profit.\n\nMy stewards insist that Duskendale remains strong.\n\nThey also insist that strength maintained without effort eventually becomes memory."

agot_crownlands_bla.0306.a:0 "Then make Duskendale the better bargain."

agot_crownlands_bla.0306.a.merchants_tt:0 "Because Duskendale's merchants remain #bold grateful for your earlier support#!, they are willing to invest alongside House Darklyn."

agot_crownlands_bla.0306.b:0 "We need not dominate every trade. Only the ones that matter."

agot_crownlands_bla.0306.b.guilds_tt:0 "The #bold balanced guild settlement#! gives Duskendale the cooperation necessary to reshape its commercial strengths."

agot_crownlands_bla.0306.c:0 "Royal prosperity need not come at Duskendale's expense."

agot_crownlands_bla.0306.c.royal_service_tt:0 "Your earlier emphasis upon #bold Royal Service#! makes cooperation with royal commerce a natural extension of Darklyn tradition."

agot_crownlands_bla.0306.d:0 "Duskendale prospered before others rose. It will prosper still."

agot_crownlands_bla.0306.d.duskendale_tt:0 "Your commitment to #bold the Lords of Duskendale#! makes accepting the commercial shadow of another city particularly distasteful."

agot_darklyn_competing_blackwater_port_bla:0 "A Competing Blackwater Port"
agot_darklyn_competing_blackwater_port_bla_desc:0 "House Darklyn has committed substantial resources to ensuring that merchants continue to find Duskendale more attractive than rival ports upon the Blackwater."

agot_darklyn_specialized_duskendale_trade_bla:0 "Specialized Duskendale Trade"
agot_darklyn_specialized_duskendale_trade_bla_desc:0 "Rather than attempting to dominate every market, Duskendale has concentrated upon trades, crafts, and services in which its merchants can compete most effectively."

agot_darklyn_royal_blackwater_connections_bla:0 "Royal Blackwater Connections"
agot_darklyn_royal_blackwater_connections_bla_desc:0 "House Darklyn has cultivated commercial ties connected to royal power, allowing Duskendale to profit from proximity to the political heart of the realm."

agot_crownlands_bla.0307.t:0 "The Crown's Due"

agot_crownlands_bla.0307.desc:0 "The royal seal upon the parchment leaves little doubt as to where the request originated.\n\nThe Crown requires coin, and Duskendale has been judged prosperous enough to provide more than its customary share. The language is courteous — gracious, even — but the sum written beneath it is neither.\n\nMy stewards protest that our obligations have already been met. Duskendale's merchants will say the same, though they are unlikely to say it where a royal officer might hear them. Others in my hall counsel obedience. House Darklyn has served kings for generations, and royal favor is worth considerably more than the silver now being demanded.\n\nYet there is a difference between service and submission.\n\nThe difficulty lies in deciding precisely where that difference begins."

agot_crownlands_bla.0307.a:0 "House Darklyn has never been miserly in royal service."

agot_crownlands_bla.0307.a.royal_service_tt:0 "Your earlier embrace of #bold Royal Service#! makes fulfilling the Crown's request another demonstration of the relationship House Darklyn has cultivated across generations."

agot_crownlands_bla.0307.b:0 "The Crown shall have its due — after we discuss the sum."

agot_crownlands_bla.0307.b.success:0 "A More Reasonable Sum"
agot_crownlands_bla.0307.b.failure:0 "The Crown Will Not Haggle"

agot_crownlands_bla.0307.c:0 "Duskendale has prospered with us. Now it can stand with us."

agot_crownlands_bla.0307.c.guilds_tt:0 "Your earlier dealings with Duskendale have left you with #bold merchants or guilds willing to share the burden#!."

agot_crownlands_bla.0307.d:0 "Our charters and customs are not scraps of parchment."

agot_crownlands_bla.0307.d.independence_tt:0 "You have already insisted that #bold Duskendale will not live in another city's shadow#!. Surrendering its privileges now would make those words ring hollow."

agot_crownlands_bla.0307.e:0 "Perhaps the royal men should see the Dun Fort before asking again."

agot_crownlands_bla.0307.e.dun_fort_tt:0 "Because you #bold strengthened the Dun Fort#!, you can make Duskendale's ability to resist pressure considerably more obvious — though the Crown may wonder why a loyal vassal feels the need to do so."

agot_crownlands_bla.0308.t:0 "An Answer from Above"

agot_crownlands_bla.0308.desc_favored:0 "The answer arrives beneath the royal seal.\n\nThere is no rebuke within it. Instead, House Darklyn's conduct is acknowledged with the polished gratitude courts reserve for those who have made themselves useful without first needing to be compelled.\n\nThe demanded coin is gone, but goodwill has taken its place.\n\nWhether the exchange was equal is a question best left unanswered."

agot_crownlands_bla.0308.desc_compromise:0 "The royal answer is neither victory nor defeat.\n\nOur arguments have been heard. Some demands remain, others have been softened, and neither side has been required to pretend that the other's position was entirely correct.\n\nThere are men who mistake compromise for weakness. They have rarely governed prosperous towns beneath powerful kings."

agot_crownlands_bla.0308.desc_tolerated:0 "The royal answer is brief.\n\nNo punishment follows. No praise accompanies it either. The matter, apparently, is considered closed.\n\nMy council receives the news with relief. I find myself lingering instead upon what has gone unsaid.\n\nThe Crown yielded this time — or decided the matter was not worth pursuing."

agot_crownlands_bla.0308.desc_suspicion:0 "The answer contains no threat.\n\nThat makes it worse.\n\nThe royal court has taken note of the Dun Fort's strength, of the language used by my representatives, and of House Darklyn's apparent willingness to display one while defending the other. The immediate demand has become almost secondary.\n\nA lord may possess strong walls without intending rebellion.\n\nConvincing a king of that distinction is another matter."

agot_crownlands_bla.0308.desc_displeasure:0 "The royal answer is cold enough that even my steward stops attempting to find courtesy between its lines.\n\nOur arguments have not persuaded the Crown. If anything, they have transformed a dispute over coin into a question of obedience.\n\nNothing further is demanded — for now.\n\nThe words are absent from the parchment, yet everyone in the chamber seems to hear them."

agot_crownlands_bla.0308.a:0 "Service remembered is service well rendered."

agot_crownlands_bla.0308.b:0 "A Darklyn can bend without bowing."

agot_crownlands_bla.0308.c:0 "Then let the matter rest."

agot_crownlands_bla.0308.d:0 "Strong walls cast long shadows."

agot_crownlands_bla.0308.e:0 "Kings have long memories. So do Darklyns."

agot_darklyn_crown_favor_bla:0 "Favor of the Crown"
agot_darklyn_crown_favor_bla_desc:0 "House Darklyn's willingness to meet an extraordinary royal demand has been remembered favorably at court."

agot_darklyn_watched_by_the_crown_bla:0 "Watched by the Crown"
agot_darklyn_watched_by_the_crown_bla_desc:0 "The strength of the Dun Fort and the assertiveness of its lord have attracted unwelcome attention from royal authority."

agot_crownlands_bla.0309.t:0 "Beneath the Dun Fort"

agot_crownlands_bla.0309.desc:0 "The opening was found behind stone that no living mason remembers laying.\n\nThere is no treasure chamber beyond it. No forgotten crown. No sword carried by some hero whose name survives in song.\n\nThere are shelves.\n\nUpon them lie rotted ledgers, fragments of correspondence, household rolls, memorial stones, and bundles of parchment whose bindings crumble when touched. Names emerge from the dust: Darklyns remembered only dimly, knights absent from every song, merchants who advanced coin to long-dead lords, craftsmen paid to raise walls still standing above us, and retainers whose descendants may yet walk the streets of Duskendale.\n\nThe story they tell is recognizably ours, but less tidy than the one recited in the hall.\n\nHouse Darklyn did not rise upon valor alone. There were debts. Failed ventures. Useful marriages. Bargains with merchants. Compromises made by proud lords who later allowed chroniclers to call them victories.\n\nSeven white swords shine brightly across our history.\n\nBeneath them stand generations of people whose names were never carved into songs."

agot_crownlands_bla.0309.a:0 "Preserve it. Every word."

agot_crownlands_bla.0309.a.preserved_tt:0 "You once chose to #bold preserve rather than transform the Dun Fort#!. The same instinct now guides your treatment of what has been discovered beneath it."

agot_crownlands_bla.0309.b:0 "I want to know what truly happened."

agot_crownlands_bla.0309.b.success:0 "The Lessons of the Dead"

agot_crownlands_bla.0309.b.failure:0 "Fragments and Contradictions"

agot_crownlands_bla.0309.c:0 "Have a proper history of House Darklyn written."

agot_crownlands_bla.0309.c.seven_swords_tt:0 "Your celebration of #bold the Seven White Swords#! gives the chroniclers a powerful centerpiece around which to tell the story of House Darklyn."

agot_crownlands_bla.0309.d:0 "These names belong to Duskendale as much as they do to us."

agot_crownlands_bla.0309.d.guilds_tt:0 "Your earlier relationship with #bold Duskendale's merchants and guilds#! makes acknowledging their ancestors' role in the town's history especially meaningful."

agot_crownlands_bla.0309.e:0 "Seal the chamber. The songs are enough."

agot_darklyn_keeper_of_duskendale_memory_bla:0 "Keeper of Duskendale's Memory"
agot_darklyn_keeper_of_duskendale_memory_bla_desc:0 "Old records discovered beneath the Dun Fort have been carefully preserved rather than discarded, allowing generations of forgotten Duskendale history to survive."

agot_darklyn_lessons_of_the_dun_fort_bla:0 "Lessons of the Dun Fort"
agot_darklyn_lessons_of_the_dun_fort_bla_desc:0 "Careful study of records found beneath the Dun Fort has revealed how earlier Darklyns actually governed: through ambition and valor, certainly, but also through compromise, calculation, and occasional failure."

agot_darklyn_chronicled_glory_bla:0 "The Darklyn Chronicle"
agot_darklyn_chronicled_glory_bla_desc:0 "House Darklyn has commissioned a grand account of its long history, ensuring that its knights, lords, victories, and service to the realm are remembered as its descendants believe they deserve to be."

agot_darklyn_shared_history_of_duskendale_bla:0 "A Shared History"
agot_darklyn_shared_history_of_duskendale_bla_desc:0 "House Darklyn has publicly acknowledged that Duskendale was built not by its lords alone, but by generations of merchants, craftsmen, knights, sailors, and smallfolk who prospered beneath them."

agot_crownlands_bla.0310.t:0 "The Blood That Remains"

agot_crownlands_bla.0310.desc:0 "House Darklyn is gone.\n\nThe blood is not."

agot_crownlands_bla.0310.desc_darke:0 "The name Darklyn no longer rules at Duskendale, yet its blood did not perish with its last trueborn lords.\n\nHouse Darke sprang from that same ancient stock. We are no pretenders searching dusty chronicles for some convenient ancestor. The descent is known. The connection is remembered. What changed was the name.\n\nFor generations that distinction mattered little. Darklyn ruled Duskendale, and Darke followed its own road beneath another banner.\n\nThen came the Defiance.\n\nOne disastrous lord brought ruin upon a house that had endured for centuries. Duskendale passed from Darklyn hands, the old name was broken, and those branches that remained were left to carry fragments of an inheritance no longer theirs to claim.\n\nYet blood has a troublesome way of remembering what parchment declares finished."

agot_crownlands_bla.0310.desc_darkwood:0 "House Darklyn is spoken of now as something finished — an old name belonging to Duskendale's past.\n\nHouse Darkwood knows better.\n\nOur line branched from theirs long before the final ruin, carrying Darklyn blood beneath another name while the elder house remained secure in the Dun Fort. There was no reason then to question which branch possessed Duskendale or which name stood foremost among us.\n\nThe Defiance answered that question with extinction.\n\nThe elder branch is gone. We are not.\n\nThat does not make Duskendale ours. It does mean that when men speak of the blood of House Darklyn as though it vanished entirely, they speak falsely."

agot_crownlands_bla.0310.desc_dargood:0 "There is an irony in the fate of House Darklyn that few singers would dare put to verse.\n\nThe trueborn line is gone.\n\nThe bastard blood remains.\n\nHouse Dargood was never permitted to forget where its blood came from, nor entirely allowed to claim the honors that came with it. We were kin when kinship was useful, something lesser when lineage was discussed too proudly, and proof that even ancient houses leave inconvenient branches behind them.\n\nThen the Defiance destroyed the lords of Duskendale.\n\nTheir castle passed to other hands. Their name fell into ruin. Seven white cloaks, generations of rule, and centuries of Darklyn pride could not save them.\n\nYet the blood they once regarded as the lesser branch endured.\n\nThere are jests cruel enough that only history can tell them."

agot_crownlands_bla.0310.a:0 "Darklyn blood still runs in us."

agot_crownlands_bla.0310.a.darke_tt:0 "As a #bold legitimate cadet branch#! of House Darklyn, House Darke possesses a direct claim to the memory of the extinguished elder line."

agot_crownlands_bla.0310.a.darkwood_tt:0 "As a #bold legitimate cadet branch#! of House Darklyn, House Darkwood possesses a direct claim to the memory of the extinguished elder line."

agot_crownlands_bla.0310.a.dargood_tt:0 "House Dargood descends from #bold bastard Darklyn blood#!. What the elder line might once have considered a stain has become proof that Darklyn blood survived its own destruction."

agot_crownlands_bla.0310.b:0 "Their blood is ours. Their name need not be."

agot_crownlands_bla.0311.t:0 "What Was Lost"

agot_crownlands_bla.0311.desc:0 "Blood is the simplest part of inheritance.\n\nNo army is required to carry it. No king must confirm it. No castle wall can keep it from passing from parent to child.\n\nEverything else House Darklyn possessed proved considerably less durable.\n\nThe name itself is gone from the rolls of living lords. Duskendale, seat of the house for generations, passed into other hands. The Dun Fort still stands, but not for us. Lands once ruled beneath Darklyn banners now answer to other masters. Even the memory of the house has begun to narrow around its final catastrophe, as though centuries of history existed merely to end in one act of ruin.\n\nIf I mean to disturb that ending, I must first decide what exactly I intend to recover."

agot_crownlands_bla.0311.a:0 "The name. Let House Darklyn live again."

agot_crownlands_bla.0311.b:0 "Without Duskendale, the name is hollow."

agot_crownlands_bla.0311.c:0 "I want what our forebears once ruled."

agot_crownlands_bla.0311.d:0 "Name, Dun Fort, Duskendale, lands — all of it."

agot_crownlands_bla.0312.t:0 "Seven Swords, One Folly"

agot_crownlands_bla.0312.desc:0 "Seven Darklyns wore the white cloak.\n\nSeven sons of Duskendale surrendered inheritance, marriage, and children to stand beside kings. Before them and after them came generations of Darklyn lords who governed their lands, raised the Dun Fort, enriched Duskendale, fought the wars of their age, and passed an ancient name from father to son.\n\nYet ask a man today what he remembers of House Darklyn, and one name threatens to swallow all the others.\n\nDenys.\n\nLord Denys Darklyn demanded privileges from his king, seized Aerys Targaryen when they were refused, and held him within Duskendale for half a year. Ser Barristan Selmy brought the king out alive. The vengeance that followed destroyed the main Darklyn line.\n\nThat is the inheritance waiting for anyone who would raise the Darklyn name again.\n\nIf I mean to reclaim what was lost, I must decide whether Denys Darklyn is to be defended, condemned, or denied the power to define us at all."

agot_crownlands_bla.0312.desc_dargood:0 "Seven Darklyns wore the white cloak. Lords of that name ruled Duskendale for generations before Denys Darklyn gambled everything upon his Defiance and lost.\n\nThe trueborn Darklyns paid for that failure with extinction.\n\nHouse Dargood did not.\n\nThere is bitterness in the thought. Our blood descended from theirs, though bastard descent ensured that men could acknowledge the kinship while denying us equal place within the family history. The trueborn possessed the Dun Fort, Duskendale, the ancient name, and all the honors that came with them.\n\nThen Denys wagered those honors against a king.\n\nNow the bastard branch remains to decide what the last trueborn Lord Darklyn deserves from history."

agot_crownlands_bla.0312.a:0 "Denys would not crawl merely because a king commanded it."

agot_crownlands_bla.0312.b:0 "One lord's pride destroyed centuries of Darklyn achievement."

agot_crownlands_bla.0312.c:0 "Seven white swords. One disastrous lord. I know which deserves remembering."

agot_crownlands_bla.0312.d:0 "His trueborn pride died. Our bastard blood did not."

agot_darklyn_memory_of_defiance_bla:0 "Memory of Defiance"
agot_darklyn_memory_of_defiance_bla_desc:0 "This ruler remembers Denys Darklyn not merely for the destruction that followed his rebellion, but as a proud lord who refused to surrender what he believed was owed to Duskendale."

agot_darklyn_lesson_of_denys_bla:0 "The Lesson of Denys"
agot_darklyn_lesson_of_denys_bla_desc:0 "The destruction of the main Darklyn line is remembered as a warning that the pride of one lord can consume an inheritance built over centuries."

agot_darklyn_before_the_defiance_bla:0 "Before the Defiance"
agot_darklyn_before_the_defiance_bla_desc:0 "House Darklyn possessed centuries of history before its final catastrophe. This ruler refuses to allow the deeds of one doomed lord to overshadow generations of service, rule, and achievement."

agot_darklyn_bastard_blood_endures_bla:0 "Bastard Blood Endures"
agot_darklyn_bastard_blood_endures_bla_desc:0 "The trueborn Darklyns vanished in the ruin of the Defiance, while blood once regarded as lesser endured through House Dargood. History has rendered its own judgment upon the distinction."

 agot_crownlands_bla.0313.t:0 "A Claim Remembered"

 agot_crownlands_bla.0313.desc:0 "It is one thing to say that Darklyn blood survives. It is another to look toward Duskendale and ask what that blood is owed.\n\nThe Dun Fort still rises above the town. Ships still enter the harbor beneath walls our forebears knew. Streets laid beneath Darklyn lords remain crowded with merchants who scarcely remember when another banner flew above them.\n\nYet memory is not ownership.\n\nIf Duskendale is ever to return to Darklyn blood, I cannot rely upon sentiment alone. A claim must be made believable before men will risk anything upon it.\n\nThere are several ways to begin."

agot_crownlands_bla.0313.desc_everything:0 "I said that I would recover everything.\n\nThe words were easily spoken. Duskendale makes them real.\n\nThe Dun Fort still stands above the town our forebears ruled for generations. Other hands possess it now, as they possess what remained after the destruction of the main Darklyn line. No declaration of ancestry will cause those hands to open willingly.\n\nYet every restoration must begin somewhere.\n\nFor House Darklyn, there can be only one beginning."

agot_crownlands_bla.0313.desc_dargood:0 "There was a time when a Dargood claiming Duskendale would have invited laughter from the trueborn Darklyns themselves.\n\nThe bastard branch could share their blood, perhaps even their table, but never their inheritance.\n\nHistory has altered the argument.\n\nThe trueborn line is gone. Duskendale passed to strangers. The Dun Fort stands without a Darklyn master, while the blood once dismissed as bastard blood still passes from parent to child.\n\nThat alone gives me no right to Duskendale.\n\nBut rights have been built upon weaker foundations."

agot_crownlands_bla.0313.a:0 "Put the descent upon parchment. Make the blood undeniable."

agot_crownlands_bla.0313.a.cadet_tt:0 "As the descendant of a #bold legitimate Darklyn cadet branch#!, your genealogical argument carries particular weight."

agot_crownlands_bla.0313.a.dargood_tt:0 "Your #bold bastard descent#! complicates a purely genealogical argument. Blood survives, but the old laws of inheritance were rarely kind to such blood."

agot_crownlands_bla.0313.b:0 "A lord needs more than blood. Find those who still remember."

agot_crownlands_bla.0313.b.duskendale_tt:0 "You declared that #bold Duskendale itself#! mattered more than merely recovering an ancient name. Winning the town therefore comes before proclaiming the house."

agot_crownlands_bla.0313.c:0 "The Crown ended House Darklyn. Let the Crown recognize its heir."

agot_crownlands_bla.0313.c.denys_tt:0 "Because you #bold condemned Denys Darklyn's folly#!, you can distinguish your restoration from the rebellion that destroyed the elder line."

agot_crownlands_bla.0313.c.history_tt:0 "Because you refused to let #bold the Defiance define House Darklyn#!, you can present restoration as the return of an ancient Crownlands house rather than the vindication of Denys."

agot_crownlands_bla.0313.d:0 "Duskendale was taken from our blood. It can be taken back."

agot_crownlands_bla.0313.d.denys_tt:0 "Your defense of #bold Denys Darklyn's defiance#! makes relying upon royal approval an unlikely foundation for restoration."

agot_crownlands_bla.0313.d.everything_tt:0 "You swore to recover #bold everything that was lost#!. Mere recognition was never likely to satisfy such an ambition."

agot_crownlands_bla.0314.t:0 "Whispers in Duskendale"

agot_crownlands_bla.0314.desc_genealogy:0 "The parchments have done what swords could not.\n\nCopies of old pedigrees, marriage contracts, and household records have circulated among men interested enough to read them. The descent from House Darklyn can no longer be dismissed as vague family boasting. The line is there, written generation by generation.\n\nThat alone will not open the gates of the Dun Fort.\n\nBut men who once called my claim impossible have begun calling it inconvenient instead."

agot_crownlands_bla.0314.desc_local:0 "The first answers came quietly.\n\nA merchant whose grandfather prospered beneath Darklyn rule. A household descended from retainers who once served within the Dun Fort. A guild elder who insists the town remembers more than its current lords realize.\n\nNo one has raised a banner. No crowd chants my name in the streets.\n\nThat would be foolish.\n\nBut Duskendale is no longer entirely silent."

agot_crownlands_bla.0314.desc_royal:0 "The Crown has not proclaimed me heir to Duskendale.\n\nIt has done something nearly as useful: it has declined to declare the idea treasonous.\n\nThe response is carefully worded. No promise is made, no possession challenged, no royal officer instructed to return the Dun Fort to Darklyn blood.\n\nYet the destruction of the elder line is described as punishment for Denys Darklyn's acts rather than an eternal judgment upon all who share his ancestry.\n\nThere is room within those words.\n\nSometimes room is enough."

agot_crownlands_bla.0314.desc_force:0 "They come one at a time.\n\nA hedge knight whose grandsire served a Darklyn. A younger son with little inheritance and a great appetite for causes. Men who remember Duskendale through family stories and others who simply recognize that a restored ancient house might reward those who helped raise it.\n\nThey are not an army.\n\nNot yet.\n\nBut old banners have a way of gathering men once someone is willing to lift them."

agot_crownlands_bla.0314.desc_failure:0 "The first attempt has produced little beyond uncomfortable silence.\n\nRecords are questioned, old loyalties prove colder than expected, and men who seemed sympathetic become suddenly cautious when asked to attach their names to anything concrete.\n\nPerhaps Duskendale has forgotten more than I hoped.\n\nOr perhaps memory simply requires greater persuasion."

agot_crownlands_bla.0314.a:0 "Then let no one call our descent a fantasy."

agot_crownlands_bla.0314.b:0 "Duskendale remembers."

agot_crownlands_bla.0314.c:0 "The Crown need not support us. It merely needs to stand aside."

agot_crownlands_bla.0314.d:0 "Every old banner begins with one man willing to carry it."

agot_crownlands_bla.0314.e:0 "Then we find another way."

agot_darklyn_proven_descent_bla:0 "Proven Darklyn Descent"
agot_darklyn_proven_descent_bla_desc:0 "Careful genealogical work has made this branch's descent from House Darklyn difficult to dismiss, strengthening the legitimacy of its restoration ambitions."

agot_darklyn_duskendale_sympathizers_bla:0 "Sympathizers in Duskendale"
agot_darklyn_duskendale_sympathizers_bla_desc:0 "Merchants, households, and others with memories of the old Darklyn order have begun quietly regarding this claimant as a plausible heir to Duskendale's past."

agot_darklyn_royal_tolerance_bla:0 "Royal Tolerance"
agot_darklyn_royal_tolerance_bla_desc:0 "The Crown has stopped short of endorsing a Darklyn restoration, but neither has it treated the surviving branch's ambitions as an extension of Denys Darklyn's rebellion."

agot_darklyn_gathering_the_old_banners_bla:0 "Gathering the Old Banners"
agot_darklyn_gathering_the_old_banners_bla_desc:0 "Knights, adventurers, and descendants of old Darklyn retainers have begun gathering around the prospect of recovering Duskendale for Darklyn blood."

agot_crownlands_bla.0315.t:0 "The Dun Fort Beckons"

agot_crownlands_bla.0315.desc_held:0 "There are moments when ambition arrives before intention.\n\nDuskendale is already mine.\n\nWhatever path brought the town into my hands, the fact remains unchanged: Darklyn blood once again commands the streets our forebears ruled, and the Dun Fort rises above lands held by one of their surviving descendants.\n\nThe question is no longer whether Duskendale can be recovered.\n\nIt has been."

agot_crownlands_bla.0315.desc_genealogy:0 "The blood has been proven upon parchment.\n\nMen may dispute what that descent entitles me to, but fewer now dispute the descent itself. The legitimate branches of House Darklyn did not vanish merely because the elder line was destroyed.\n\nDuskendale remains in other hands.\n\nYet there is now a claim that can be spoken openly rather than whispered."

agot_crownlands_bla.0315.desc_local:0 "Claims are usually written upon parchment.\n\nMine has begun appearing in quieter places.\n\nIn guildhalls. At merchant tables. In the stories of families who remember service beneath the old Darklyns. No uprising waits within Duskendale, and I would be a fool to mistake sympathy for possession.\n\nBut should my banner ever approach the Dun Fort, there will be those within the town who know why it comes."

agot_crownlands_bla.0315.desc_royal:0 "The Crown has given me no castle and issued no command in my favor.\n\nYet neither has it forbidden the claim.\n\nThat distinction matters. The old Darklyn line was destroyed for the Defiance of one lord. My blood has not been declared forever attainted, nor has Duskendale been proclaimed beyond the reach of any surviving heir.\n\nI have not been granted the Dun Fort.\n\nI have been permitted to argue that it should one day be mine."

agot_crownlands_bla.0315.desc_force:0 "Men now speak of the Dun Fort as though its walls were already being measured for siege ladders.\n\nThat is premature.\n\nYet there is value in momentum. Knights have begun attaching themselves to the cause. Old names are spoken beside new ones. The notion that Duskendale might someday return to Darklyn blood no longer sounds like the fantasy of a dispossessed descendant.\n\nIt sounds like a dispute that may eventually require steel."

agot_crownlands_bla.0315.desc_setback:0 "My first attempt to make the Darklyn inheritance respectable achieved little.\n\nThat does not mean the inheritance vanished.\n\nClaims have been built upon forged pedigrees, dubious marriages, forgotten promises, and arguments far weaker than mine. If no easy road to Duskendale exists, I can still construct one slowly — with coin, persistence, and enough parchment to bury every objection beneath it."

agot_crownlands_bla.0315.a:0 "Duskendale has returned to Darklyn blood."

agot_crownlands_bla.0315.a.duskendale_tt:0 "You declared that #bold Duskendale itself#! was the heart of your restoration. Recovering it fulfills the central ambition with which you began."

agot_crownlands_bla.0315.b:0 "Then put my right to Duskendale into law."
agot_crownlands_bla.0315.b.tt:0 "Your #bold proven Darklyn descent#! becomes a pressed claim upon the County of Duskendale."

agot_crownlands_bla.0315.c:0 "Let the Dun Fort know that the town remembers."
agot_crownlands_bla.0315.c.tt:0 "Support cultivated within #bold Duskendale#! strengthens your pressed claim to the ancestral Darklyn seat."

agot_crownlands_bla.0315.d:0 "The Crown has left the door open. I will walk through it."
agot_crownlands_bla.0315.d.tt:0 "Royal tolerance allows you to advance a #bold pressed claim upon Duskendale#! without presenting the restoration as a continuation of the Defiance."

agot_crownlands_bla.0315.e:0 "Enough parchment. The Dun Fort will be ours."
agot_crownlands_bla.0315.e.tt:0 "The followers gathered beneath the old banners give substance to your #bold pressed claim upon Duskendale#!."

agot_crownlands_bla.0315.f:0 "Then I will build the claim one silver stag at a time."
agot_crownlands_bla.0315.f.tt:0 "Your earlier setback makes establishing the claim costly, but persistence ultimately gives you a #bold pressed claim upon Duskendale#!."

agot_darklyn_claim_backed_by_duskendale_bla:0 "Backed by Duskendale"
agot_darklyn_claim_backed_by_duskendale_bla_desc:0 "The claimant's ambitions are quietly supported by families and interests within Duskendale that remember the old Darklyn order."

agot_darklyn_claimant_of_the_dun_fort_bla:0 "Claimant of the Dun Fort"
agot_darklyn_claimant_of_the_dun_fort_bla_desc:0 "Knights and adventurers have begun gathering around this ruler's declared intention to recover the ancestral Darklyn seat."

agot_crownlands_bla.0316.t:0 "Those Who Took Our Place"

agot_crownlands_bla.0316.desc:0 "[duskendale_holder_bla.GetTitledFirstName] holds Duskendale.\n\nThere is no crime in that fact alone. Lands pass between houses. Kings reward service, punish rebellion, rearrange lordships, and expect the descendants of the dispossessed to learn the difference between memory and ownership.\n\nYet from the Dun Fort flies another banner where the Darklyn arms once stood.\n\n[duskendale_holder_bla.GetHouse.GetName] did not build the history of Duskendale. They inherited the aftermath of its destruction.\n\nPerhaps that should make no difference after all these years.\n\nIt does."

agot_crownlands_bla.0316.desc_dargood:0 "[duskendale_holder_bla.GetTitledFirstName] holds Duskendale beneath the banner of [duskendale_holder_bla.GetHouse.GetName].\n\nOnce, a Dargood might have had little standing to object. The trueborn Darklyns themselves would have laughed before allowing bastard descendants to speak as heirs to the Dun Fort.\n\nBut those trueborn descendants are dead.\n\nNow another house occupies Duskendale while the blood that survived watches from beyond its walls.\n\nHistory has already overturned one old certainty. It may yet overturn another."

agot_crownlands_bla.0316.a:0 "Let them know exactly who means to take Duskendale back."

agot_crownlands_bla.0316.b:0 "Their rule can be weakened long before a sword is drawn."

agot_crownlands_bla.0316.c:0 "The banner above the Dun Fort changed. The people beneath it did not."

agot_crownlands_bla.0316.c.local_tt:0 "Because you have already cultivated #bold support within Duskendale#!, you can turn old loyalties into pressure upon its current rulers."

agot_crownlands_bla.0316.d:0 "There is only one argument the Dun Fort cannot ignore."

agot_crownlands_bla.0316.d.force_tt:0 "You built your claim upon #bold force and the gathering of old banners#!. Confrontation with Duskendale's current lord is the natural culmination of that path."

agot_darklyn_duskendale_claimant_opinion_bla:0 "Claimant to Duskendale"

agot_darklyn_undermining_duskendale_bla:0 "Undermining Duskendale"
agot_darklyn_undermining_duskendale_bla_desc:0 "Rather than confront the holder of Duskendale openly, this claimant is quietly weakening confidence in their rule and searching for every vulnerability within it."

agot_darklyn_old_loyalties_stir_bla:0 "Old Loyalties Stir"
agot_darklyn_old_loyalties_stir_bla_desc:0 "Memories of the old Darklyn order have begun to acquire political meaning again among those with ties to Duskendale."

agot_darklyn_dun_fort_in_our_sights_bla:0 "The Dun Fort in Our Sights"
agot_darklyn_dun_fort_in_our_sights_bla_desc:0 "The recovery of Duskendale has ceased to be merely an ancestral aspiration. Knights and retainers increasingly regard possession of the Dun Fort as a military objective."

agot_crownlands_bla.0317.t:0 "Old Servants, New Lords"

agot_crownlands_bla.0317.desc:0 "The letter bears no seal.\n\nIts author claims descent from a household that once served the Darklyns within Duskendale. Grandfathers carried messages through the Dun Fort, mothers kept accounts for merchants favored by our forebears, and old family stories still remember the years before another banner flew above the town.\n\nThe writer does not claim that Duskendale groans beneath tyranny. That would be convenient, but false.\n\nInstead, the message offers something subtler.\n\nMemory.\n\nThere are still people within Duskendale who remember that House Darklyn once ruled there — and who might be persuaded that it should again."

agot_crownlands_bla.0317.a:0 "Then I want eyes inside those walls."
agot_crownlands_bla.0317.a.local_tt:0 "Your earlier cultivation of #bold old loyalties within Duskendale#! makes these contacts particularly useful."

agot_crownlands_bla.0317.b:0 "Let the Darklyn name begin passing from mouth to mouth."

agot_crownlands_bla.0317.c:0 "Tell them to serve faithfully. Their moment may come later."

agot_crownlands_bla.0317.d:0 "No. I will not spend their lives for my ambition."

agot_darklyn_eyes_inside_duskendale_bla:0 "Eyes Inside Duskendale"
agot_darklyn_eyes_inside_duskendale_bla_desc:0 "Sympathetic households within Duskendale quietly pass information to the Darklyn claimant."

agot_darklyn_name_whispered_in_duskendale_bla:0 "The Darklyn Name Whispered"
agot_darklyn_name_whispered_in_duskendale_bla_desc:0 "Old loyalties and family memories have begun turning the restoration of House Darklyn from private ambition into quiet conversation within Duskendale."

agot_crownlands_bla.0318.t:0 "The Banner Above the Dun Fort"

agot_crownlands_bla.0318.desc:0 "[duskendale_current_holder_bla.GetTitledFirstName] is not waiting quietly for history to remove [duskendale_current_holder_bla.GetHerHim].\n\nWord from Duskendale speaks of repairs to the Dun Fort, favors granted to merchants, old local customs publicly honored, and deliberate efforts to make [duskendale_current_holder_bla.GetHouse.GetName] appear not as strangers occupying a dead house's inheritance, but as the natural lords of the town.\n\nIt is clever.\n\nPerhaps more troubling, it may be working.\n\nThe longer another house rules Duskendale well, the easier it becomes for memory to turn into nostalgia — and nostalgia into irrelevance."

agot_crownlands_bla.0318.a:0 "A borrowed hall does not make them Darklyns."

agot_crownlands_bla.0318.b:0 "Then remind Duskendale who built the history they now borrow."

agot_crownlands_bla.0318.b.genealogy_tt:0 "Your #bold proven descent from House Darklyn#! gives unusual force to appeals founded upon ancestry and historical legitimacy."

agot_crownlands_bla.0318.c:0 "Damn them. They may actually deserve some loyalty."

agot_crownlands_bla.0318.d:0 "Then every year I wait makes my task harder."

agot_crownlands_bla.0318.d.martial_tt:0 "You already chose to make the recovery of Duskendale a #bold military objective#!. The current lord's growing legitimacy only sharpens that urgency."

agot_darklyn_mocked_rule_opinion_bla:0 "Mocked My Rule"

agot_darklyn_history_against_the_new_lords_bla:0 "History Against the New Lords"
agot_darklyn_history_against_the_new_lords_bla_desc:0 "The claimant has begun using the deep historical association between House Darklyn and Duskendale to challenge the legitimacy of those who currently possess it."

agot_darklyn_reclamation_urgency_bla:0 "Reclamation Urgency"
agot_darklyn_reclamation_urgency_bla_desc:0 "Every year another house rules Duskendale strengthens their claim upon its loyalty. This ruler has concluded that delay is becoming dangerous."

agot_crownlands_bla.0319.t:0 "The Keys of the Dun Fort"

agot_crownlands_bla.0319.desc:0 "The keys are heavier than I expected.\n\nIron, worn smooth by hands that carried them through years when no Darklyn blood commanded these walls.\n\nThe Dun Fort stands before me now not as a memory, a pedigree, a claim upon parchment, or a promise repeated among loyal retainers.\n\nIt is mine.\n\nBelow, Duskendale spreads toward the harbor exactly as it did when viewed from afar — roofs, markets, streets, quays, and walls that never cared which house claimed ownership of them. Yet from this height everything feels different.\n\nHouse Darklyn lost this place once.\n\nDarklyn blood has returned."

agot_crownlands_bla.0319.desc_local:0 "\n\nThe return has not gone unnoticed in the streets. Some faces waiting beyond the gates belong to families whose support was cultivated long before my banner reached the Dun Fort. Their cheers are not universal, but neither are they merely purchased."

agot_crownlands_bla.0319.desc_genealogy:0 "\n\nThe pedigrees and old records that once seemed like dry arguments now possess stone walls and a harbor. What was proven upon parchment has become fact upon the map."

agot_crownlands_bla.0319.desc_royal:0 "\n\nThe Crown once allowed room for my claim to exist. Whether that tolerance amounted to approval no longer matters as much as it did before the keys were placed in my hand."

agot_crownlands_bla.0319.desc_force:0 "\n\nMen gathered beneath old banners because they believed the Dun Fort could be recovered. Whatever price was paid to prove them right, the banner now flies where they were promised it would."

agot_crownlands_bla.0319.desc_persistence:0 "\n\nThere was no elegant path back to Duskendale. Coin, petitions, disputed records, persistence, and years of refusal to abandon the claim accomplished what the first attempt could not."

agot_crownlands_bla.0319.desc_respect:0 "\n\nYet I cannot pretend that every year between the fall of House Darklyn and my return was merely an occupation. Others governed here. Some governed poorly. Some did not. Duskendale lived while our blood remained beyond its walls."

agot_crownlands_bla.0319.a:0 "Restore the Dun Fort. Let it be ours again."

agot_crownlands_bla.0319.a.duskendale_tt:0 "You declared from the beginning that #bold Duskendale itself#! was the heart of the restoration. Its recovery fulfills that ambition."

agot_crownlands_bla.0319.b:0 "We have taken the castle. Now win the town."

agot_crownlands_bla.0319.b.local_tt:0 "Because you cultivated or protected #bold supporters within Duskendale#!, the return of Darklyn blood begins with existing goodwill."

agot_crownlands_bla.0319.c:0 "Raise the banners. Let every rival see who holds the Dun Fort now."

agot_crownlands_bla.0319.c.rivalry_tt:0 "The political rivalry over Duskendale has ended with #bold Darklyn blood once again holding the ancestral seat#!."

agot_crownlands_bla.0319.d:0 "Keep what worked. Duskendale is greater than any one house."

agot_crownlands_bla.0319.d.respect_tt:0 "You previously acknowledged that Duskendale's intervening rulers could govern well. Their useful institutions need not be destroyed merely because their banner has fallen."

agot_crownlands_bla.0319.e:0 "The seat is ours. The old lordship comes next."

agot_crownlands_bla.0319.e.lands_tt:0 "You vowed to recover #bold the old Darklyn lands#!. Possessing Duskendale is only the beginning of that ambition."

agot_crownlands_bla.0319.f:0 "Duskendale and its lordship are ours. Now restore the name."

agot_darklyn_dun_fort_reclaimed_bla:0 "The Dun Fort Reclaimed"
agot_darklyn_dun_fort_reclaimed_bla_desc:0 "Darklyn blood once again holds the ancestral fortress above Duskendale, and considerable effort has been spent securing the ancient seat against another loss."

agot_darklyn_return_to_duskendale_bla:0 "The Darklyn Return"
agot_darklyn_return_to_duskendale_bla_desc:0 "The restoration has been presented not merely as the seizure of an old castle, but as the return of a house determined to rebuild its relationship with Duskendale."

agot_darklyn_continuity_of_duskendale_bla:0 "Continuity of Duskendale"
agot_darklyn_continuity_of_duskendale_bla_desc:0 "The restored Darklyn bloodline has retained useful customs and institutions established during the years when other houses ruled Duskendale, emphasizing continuity over vengeance."

agot_crownlands_bla.0320.t:0 "The House That Was Lost"

agot_crownlands_bla.0320.desc:0 "Duskendale is ours.\n\nThe Dun Fort is ours.\n\nThe lordship that once belonged to House Darklyn has returned to the blood that survived its destruction.\n\nThere remains only the question of the name."

agot_crownlands_bla.0320.desc_darke:0 "House Darke was born beneath the shadow of House Darklyn.\n\nOnce, there was no shame in that. The elder branch held Duskendale, while our ancestors carried the same blood beneath another name and made their own place in the world.\n\nThen the elder branch vanished.\n\nNow the Dun Fort is mine. Duskendale is mine. The lordship from which House Darklyn ruled for generations has returned to one of its legitimate descendants.\n\nI could take the old name and declare that House Darklyn lives again.\n\nOr I could leave the dead their name and proclaim something history never expected:\n\nHouse Darke inherited everything."

agot_crownlands_bla.0320.desc_darkwood:0 "For generations House Darkwood existed beside the elder Darklyns rather than in their place.\n\nThat distinction ended when the Defiance destroyed the main line.\n\nNow Duskendale answers to us. The Dun Fort stands beneath our banner. Lands from which the old Darklyns once commanded their power have returned to the blood of their surviving cadet branch.\n\nThe name Darklyn could live again with a word.\n\nYet Darkwood survived the years when Darklyn did not.\n\nPerhaps survival deserves its own remembrance."

agot_crownlands_bla.0320.desc_dargood:0 "There is a cruelty to history that almost makes me laugh.\n\nThe bastard branch stands in the Dun Fort.\n\nDuskendale, once the inheritance of trueborn Darklyns who would never have regarded House Dargood as their equal, has returned through the blood they considered lesser.\n\nI can reclaim their name now. No one could reasonably deny the right after all that has been recovered.\n\nYet if I do, there is another irony.\n\nHouse Dargood survived the destruction of House Darklyn only to disappear at the moment of its greatest triumph."

agot_crownlands_bla.0320.a:0 "Let the banners rise. House Darklyn lives again."

agot_crownlands_bla.0320.a.darke_tt:0 "House Darke, a #bold legitimate cadet branch#! of House Darklyn, has returned the elder name to Duskendale."

agot_crownlands_bla.0320.a.darkwood_tt:0 "House Darkwood, a #bold legitimate cadet branch#! of House Darklyn, has returned the elder name to Duskendale."

agot_crownlands_bla.0320.a.dargood_tt:0 "The #bold bastard descendants#! of House Darklyn have accomplished what history denied the trueborn line: the restoration of the ancient house."

agot_crownlands_bla.0320.a.name_goal_tt:0 "You began this campaign determined above all to #bold restore the Darklyn name#!. That ambition is finally fulfilled."

agot_crownlands_bla.0320.a.everything_goal_tt:0 "You swore to recover #bold everything that was lost#!: the name, Duskendale, the Dun Fort, and the old lordship. Nothing remains of that oath unfulfilled."

agot_crownlands_bla.0320.b:0 "No. We inherited Darklyn's legacy — not its name."

agot_darklyn_heirs_without_the_name_bla:0 "Heirs Without the Name"
agot_darklyn_heirs_without_the_name_bla_desc:0 "This house has recovered Duskendale and the inheritance of the extinguished Darklyns, yet deliberately retained the name that carried its blood through the years of exile."

agot_crownlands_bla.0321.t:0 "The Eighth Sword"

agot_crownlands_bla.0321.desc:0 "Seven Darklyns wore the white cloak.\n\nThe eighth sword was never forged.\n\nPerhaps it need not be.\n\nHouse Darklyn lives again. The name once erased from the rolls of living lords has returned to Duskendale, and the Dun Fort once more answers to the blood of those who built its history.\n\nYet restoration is not the same as resurrection. The house that vanished cannot simply be recreated exactly as it was. Too much has happened. Too many years passed beneath other names and other banners.\n\nIf this is to be a second age of House Darklyn, then it must decide what it intends to remember."

agot_crownlands_bla.0321.desc_darke:0 "\n\nHouse Darke carried our blood through the years when Darklyn could not. That name may no longer stand foremost upon my banner, but it need not vanish from memory merely because the elder house has returned."

agot_crownlands_bla.0321.desc_darkwood:0 "\n\nHouse Darkwood survived as its own line while the elder Darklyns passed into history. Restoring the ancient name does not erase the generations who kept its blood alive beneath another."

agot_crownlands_bla.0321.desc_dargood:0 "\n\nThe irony remains impossible to ignore. House Darklyn returned through the bastard blood it might once have regarded as lesser. If the restored house forgets that truth, then it has learned surprisingly little from its own extinction."

agot_crownlands_bla.0321.a:0 "Seven white swords came before us. Let honor define the eighth."

agot_crownlands_bla.0321.a.denys_tt:0 "You condemned #bold Denys Darklyn's folly#!. Renewed service and honor offer the restored house a deliberate break from the act that destroyed it."

agot_crownlands_bla.0321.b:0 "Duskendale is why the house mattered. Let it be our future."

agot_crownlands_bla.0321.b.duskendale_tt:0 "Your earlier effort to #bold reconcile House Darklyn with Duskendale#! gives this renewed focus upon the town a stronger foundation."

agot_crownlands_bla.0321.c:0 "Let kings remember that Darklyn blood does not bend easily."

agot_crownlands_bla.0321.c.denys_tt:0 "You chose to #bold defend Denys Darklyn#!. The restored house now embraces the pride and independence that you believe history judged too harshly."

agot_crownlands_bla.0321.d:0 "Denys was one man. House Darklyn is centuries."

agot_crownlands_bla.0321.d.history_tt:0 "You previously refused to let #bold the Defiance define House Darklyn#!. Restoration now gives you the chance to make that argument permanent."

agot_crownlands_bla.0321.e:0 "Record the name that carried our blood back home."

agot_crownlands_bla.0321.e.dargood_tt:0 "A restored House Darklyn founded through #bold House Dargood#! openly acknowledges that its bastard branch preserved the blood that ultimately returned to Duskendale."

agot_darklyn_second_age_white_swords_bla:0 "The Eighth Sword"
agot_darklyn_second_age_white_swords_bla_desc:0 "The restored House Darklyn has chosen to define its second age through the ancient tradition of knightly honor and royal service that produced seven Kingsguard before its fall."

agot_darklyn_second_age_duskendale_bla:0 "Duskendale Reborn"
agot_darklyn_second_age_duskendale_bla_desc:0 "The restored House Darklyn has turned its attention toward rebuilding the prosperity and loyalty of Duskendale rather than chasing the glories or grievances of the past."

agot_darklyn_second_age_defiant_bla:0 "Defiant Blood"
agot_darklyn_second_age_defiant_bla_desc:0 "The restored Darklyns remember their destruction without shame, embracing the fierce pride and independence that once brought their house into conflict with the Crown."

agot_darklyn_second_age_beyond_denys_bla:0 "Beyond the Defiance"
agot_darklyn_second_age_beyond_denys_bla_desc:0 "The restored house deliberately places Denys Darklyn and the Defiance within a much longer history, refusing to allow one disastrous generation to define centuries of Darklyn rule."

agot_darklyn_second_age_remembers_the_branch_bla:0 "The Branch Remembered"
agot_darklyn_second_age_remembers_the_branch_bla_desc:0 "House Darklyn openly honors the cadet or bastard branch that preserved its blood through extinction and ultimately returned the ancient name to Duskendale."

agot_crownlands_bla.0350.t:0 "Beneath the Dun Fort"

agot_crownlands_bla.0350.desc:0 "The workmen were repairing a foundation wall beneath the oldest part of the Dun Fort when one of their hammers broke through stone that should have been solid.\n\nBehind it lies darkness.\n\nThe opening is narrow, but unmistakably fashioned by human hands. A flight of worn steps descends beneath the foundations before turning toward the earth below. The masonry is unlike the work above it: enormous blocks fitted without mortar, their surfaces blackened by age and damp.\n\nMore curious still is the stone uncovered beside the entrance.\n\nUpon it, barely visible beneath centuries of grime, is the image of a crowned man carrying a sword beneath a sinking sun.\n\nNo mason in my service recognizes it. Yet there is something unmistakably Darklyn about the figure."

agot_crownlands_bla.0350.desc_restored:0 "\n\nThere is an uncomfortable poetry to finding another piece of House Darklyn's forgotten past so soon after restoring its name. We spent generations trying to recover what our family had lost. It seems the Dun Fort has losses of its own."

agot_crownlands_bla.0350.a:0 "Nothing this old should meet an impatient pickaxe."

agot_crownlands_bla.0350.b:0 "It is a wall, not a riddle. Open it."

agot_crownlands_bla.0350.c:0 "Before we descend, find out what our ancestors wrote of this place."

agot_crownlands_bla.0350.d:0 "Some doors were closed for a reason."

agot_crownlands_bla.0351.t:0 "The Changing of the Blades"

agot_crownlands_bla.0351.desc_records:0 "The answer was not hidden beneath the Dun Fort at all. It was hidden in its library.\n\nThree references appear across chronicles separated by centuries, none complete. One describes a procession at the coming of winter. Another speaks of the extinguishing of every light in Duskendale. The oldest, copied from a fragment supposedly dating to the days of the Shadow Kings, names the rite plainly:\n\n#italic The Changing of the Blades.#!"

agot_crownlands_bla.0351.desc_careful:0 "Slow work has exposed more of the ancient stone without destroying it.\n\nThe crowned swordsman is not alone. Along the buried wall marches a procession of smaller figures bearing lights. In the next surviving panel the king presents his weapon before another figure, while in the last every carved flame has disappeared beneath a field of darkness.\n\nA fragmentary inscription gives the ceremony a name:\n\n#italic The Changing of the Blades.#!"

agot_crownlands_bla.0351.desc_force:0 "The wall came down.\n\nSo did rather more of the passage than intended.\n\nAmong the shattered stones, however, several carved fragments survive. One shows torchbearers following a crowned swordsman. Another bears only a few ancient words. My scholars curse the damage, but agree upon the surviving phrase:\n\n#italic ...Changing of the Blades...#!"

agot_crownlands_bla.0351.desc_revelation:0 "\n\nPiece by piece, the forgotten rite emerges.\n\nWhen the Darklyns still ruled as kings, the coming of winter was marked by a procession beginning at the Dun Fort at twilight. The king bore an ancestral sword called #italic Last Light#! before his people. Its blade was renewed, and darkness followed.\n\nLater accounts suggest the rite survived the coming of the Seven in altered form, but eventually it vanished altogether. Even the date of its final observance has been lost.\n\nOne phrase appears repeatedly in the oldest fragments:\n\n#italic Shadow Will Fall.#!\n\nMore troubling is another line, preserved only once:\n\n#italic When the light is spent, return it beneath the shadow.#!"

agot_crownlands_bla.0351.a:0 "Find every surviving account of this rite."

agot_crownlands_bla.0351.a.records_tt:0 "Because you #bold searched the Darklyn records before entering the passage#!, your scholars already possess several fragments with which to reconstruct the lost ceremony."

agot_crownlands_bla.0351.b:0 "Maesters need not explain my own ancestors to me."

agot_crownlands_bla.0351.c:0 "A forgotten ceremony is not a message from the dead."

agot_crownlands_bla.0351.d:0 "We have learned enough. Leave the rest buried."

agot_crownlands_bla.0352.t:0 "Where the Shadow Lies"

agot_crownlands_bla.0352.desc:0 "The passage does not end beneath the Dun Fort.\n\nIt continues beyond the foundations, descending through increasingly ancient stone until dressed masonry gives way to rock hacked directly from the earth. The air grows colder as we advance, carrying with it the unmistakable smell of salt.\n\nWe are heading toward the sea.\n\nThen we find the carvings.\n\nA crowned warrior stands upon a high white wall or cliff, sword raised against a host emerging from stylized waves. Some resemble men. Others have been carved with long limbs, scaled bodies, or faces that seem more fish than human. Above them looms a larger crowned figure rising from the water.\n\nOne of the workmen immediately names him.\n\n#italic The Merling King.#!"

agot_crownlands_bla.0352.desc_studied:0 "\n\nThe name is familiar from the chronicles I ordered gathered. Several of the oldest Darklyn fragments speak of Shadow Kings warring against a Merling King along the shores of Blackwater Bay. Later maesters dismissed these enemies as pirates, slavers, or early invaders transformed into monsters by generations of retelling.\n\nThat explanation remains considerably easier to believe than what the stone depicts."

agot_crownlands_bla.0352.desc_traditionalist:0 "\n\nThe oldest tales of my house speak of enemies who came from the sea during darkness, and of Shadow Kings who stood between them and the Duskmen. Learned men may call them pirates and slavers. The old stories give them another name.\n\n#italic Deep Ones.#!"

agot_crownlands_bla.0352.desc_skeptical:0 "\n\nThe meaning seems obvious enough without inventing monsters. Some forgotten enemy came by sea, and some forgotten Darklyn king defeated them. Give a frightened fisherman enough centuries and a pirate becomes a merling easily enough.\n\nStill, someone considered the victory important enough to carve it beneath the Dun Fort."

agot_crownlands_bla.0352.a:0 "Slowly. I want every carving preserved."

agot_crownlands_bla.0352.a.careful_tt:0 "Your expedition has been #bold careful from the beginning#!. More of the ancient passage survives intact because of it."

agot_crownlands_bla.0352.b:0 "The chronicles brought us this far. Let them guide us farther."

agot_crownlands_bla.0352.b.tt:0 "Your study of the #bold Changing of the Blades#! has uncovered fragments that may help interpret the passage."

agot_crownlands_bla.0352.c:0 "The Shadow Kings left this road for their blood. Follow it."

agot_crownlands_bla.0352.c.tt:0 "You have chosen to treat the forgotten traditions of the #bold Shadow Kings#! as something more than the inventions of later chroniclers."

agot_crownlands_bla.0352.d:0 "Fish-men or pirates, the tunnel is real. Keep moving."

agot_crownlands_bla.0352.e:0 "Whatever waits beneath these cliffs can remain there."

agot_crownlands_bla.0353.t:0 "The Last King in Darkness"

agot_crownlands_bla.0353.desc:0 "The passage ends at a door of blackened oak bound in green bronze.\n\nIt should have rotted centuries ago. Much of it has. Yet the bronze has held enough of the ruin together that we must carefully pull the remains apart before entering.\n\nBeyond lies a chamber untouched by daylight.\n\nA stone bier occupies its center. Upon it rests the skeleton of a man wearing the corroded remnants of a bronze circlet. Around him lie offerings: cracked pottery, blackened silver, fragments of mail, the bones of some long-dead animal, and a stone carved with a sinking sun.\n\nWhether king, prince, priest, or merely some later lord buried in imitation of older customs, I cannot know."

agot_crownlands_bla.0353.desc_records:0 "\n\nOne inscription resembles a name appearing in the oldest fragments recovered from the Darklyn records, but too little survives to identify the dead with confidence. My scholars are already arguing over three different readings."

agot_crownlands_bla.0353.desc_tradition:0 "\n\nThe men with me have fewer doubts. They kneel almost as one. To them there is no question that we stand before one of the ancient Shadow Kings."

agot_crownlands_bla.0353.desc_practical:0 "\n\nA crown does not make every skeleton a legendary king, particularly when no one can read half the markings around it. Yet whoever was buried here possessed enough wealth and importance that considerable effort was spent ensuring the sea itself would not disturb his rest."

agot_crownlands_bla.0353.desc_sword:0 "\n\nThen I see what lies across the dead man's chest.\n\nA sword.\n\nIts leather grip has long since rotted away. The wood beneath has nearly followed it, and the pommel is so dark with age that whatever device once adorned it cannot be distinguished.\n\nThe blade is different.\n\nThere is no rust.\n\nI wipe centuries of dust from the steel and find dark ripples running through its surface like smoke caught beneath ice.\n\nEvery lord in Westeros knows that pattern.\n\n#bold Valyrian steel.#!"

agot_crownlands_bla.0353.a:0 "Nobody touches it until we understand what we have found."

agot_crownlands_bla.0353.b:0 "Whatever his name was, his blood runs in mine. Give me the sword."

agot_crownlands_bla.0353.c:0 "Close the chamber. The dead have kept it this long."

agot_crownlands_bla.0354.t:0 "Last Light"

agot_crownlands_bla.0354.desc:0 "There is no dispute over the steel.\n\nThe smith needed only moments with the blade before giving his judgment. The strange ripples, the unnatural lightness, the edge untouched by centuries beneath the earth — all mark the work of old Valyria.\n\nIt is Valyrian steel.\n\nEverything else has produced an argument."

agot_crownlands_bla.0354.desc_examined:0 "\n\nBecause I forbade anyone from disturbing the weapon before its surroundings could be examined, several details survived that might otherwise have been lost. Traces beneath the ruined grip suggest it had been rehilted more than once. The pommel is younger than portions of the burial around it, while the blade itself offers no useful answer at all."

agot_crownlands_bla.0354.desc_claimed:0 "\n\nI claimed the weapon from the dead before scholars could catalogue every scrap surrounding it. They have complained of that fact repeatedly. Even so, neither dust nor missing fragments can change what now rests before me."

agot_crownlands_bla.0354.desc_records:0 "\n\nThe surviving accounts of the Changing of the Blades only complicate matters. They never speak of Last Light as we might speak of a single treasured weapon. One chronicle says its blade was #italic renewed#!. Another says it was #italic changed#!. A third describes the king receiving #italic Last Light made new#! at the coming of winter.\n\nPerhaps generations of scholars have been asking the wrong question."

agot_crownlands_bla.0354.desc_conclusion:0 "\n\nIf the oldest Darklyn tales truly reach back to the Age of Heroes, then a Valyrian blade cannot plausibly have been carried by the first Shadow Kings. The Freehold itself belongs to a younger world.\n\nA later king may have acquired the weapon and placed it in an older tomb. The burial may have been reopened. The inscriptions may be younger than the chamber. Any of these explanations would satisfy a maester.\n\nYet another possibility requires no impossible chronology at all.\n\nPerhaps #italic Last Light#! was never one sword.\n\nIf its blade was ritually replaced as winter followed summer, then the name belonged not to one piece of steel but to the weapon carried by the Shadow King — remade again and again across generations.\n\nIf so, this Valyrian blade need not be the first Last Light.\n\nIt need only have been the last."

agot_crownlands_bla.0354.desc_restored:0 "\n\nThere is something familiar in that thought. A thing may disappear while something of it survives beneath another form, waiting for a later generation to give the old name meaning again. House Darklyn itself is proof enough of that."

agot_crownlands_bla.0354.a:0 "This is Last Light. I require no maester's permission to know it."

agot_crownlands_bla.0354.a.tradition_tt:0 "You have trusted the traditions of the #bold Shadow Kings#! throughout the search. The discovery of the blade has only strengthened that conviction."

agot_crownlands_bla.0354.b:0 "Not the first Last Light. Perhaps the last."

agot_crownlands_bla.0354.b.records_tt:0 "Your study of the surviving records revealed that #italic Last Light#! may have been a ritual identity carried by successive blades rather than the name of one weapon."

agot_crownlands_bla.0354.c:0 "A Valyrian sword, certainly. An Age of Heroes relic? Hardly."

agot_crownlands_bla.0354.c.skeptical_tt:0 "From the beginning, you have treated the legends of Shadow Kings and Deep Ones as #bold history distorted by time#! rather than literal truth."

agot_crownlands_bla.0354.d:0 "Its first history is unknowable. Its next will be ours."

agot_crownlands_bla.0355.t:0 "Shadow Will Fall"

agot_crownlands_bla.0355.desc:0 "At twilight, the gates of the Dun Fort open.\n\nFor the first time in centuries, a Darklyn walks from them bearing Last Light.\n\nWord of what we uncovered beneath the castle has traveled quickly. The streets are crowded. Some have come out of devotion to House Darklyn, others from curiosity, and more than a few because they wish to see whether the old tales truly contained a Valyrian blade.\n\nCandles mark our path through Duskendale.\n\nNo living man can say whether we follow the route of the ancient Shadow Kings. Too much has been forgotten. The words spoken tonight are assembled from fragments. The gestures are reconstructed from carvings. What was once a royal rite became a septon's ceremony, and what remained of that ceremony eventually became little more than ink in neglected chronicles.\n\nYet when I draw the recovered blade, the murmuring stops.\n\nDark waves move through the steel as the last sunlight disappears beyond Blackwater Bay.\n\nThe old words come easily.\n\n#italic Shadow Will Fall.#!"

agot_crownlands_bla.0355.desc_restored:0 "\n\nPerhaps no one present understands those words quite as I do.\n\nShadow already fell upon House Darklyn. The Dun Fort was lost. Our banners vanished from Duskendale. The elder line passed from the world, and for a time the name itself belonged only to dead men and dusty histories.\n\nYet blood survived the darkness.\n\nAnd here we stand."

agot_crownlands_bla.0355.a:0 "Last Light was lost. Tonight, it burns again."

agot_crownlands_bla.0355.a.tt:0 "The recovered Valyrian steel sword will retain the ancient name #bold Last Light#!, and the lost #bold Changing of the Blades#! will be restored in a new form."

agot_crownlands_bla.0355.b:0 "Last Light belonged to the old kings. This blade shall be Duskfall."

agot_crownlands_bla.0355.b.tt:0 "The recovered Valyrian steel sword will be named #bold Duskfall#!. Rather than merely reconstruct the ancient ceremony, House Darklyn will transform it into the first tradition of a new age."

agot_crownlands_bla.0355.c:0 "Keep the songs and shadows. The steel is real."

last_light_bla_name:0 "Last Light"

last_light_bla_description:0 "A longsword of dark, rippled Valyrian steel recovered from an ancient chamber beneath the lands of Duskendale. The burial in which it was found appears connected to the forgotten rites of House Darklyn's Shadow Kings, though neither the age of the tomb nor the identity of its occupant can be established with certainty.\n\nFragmentary Darklyn chronicles describe an ancestral sword called #italic Last Light#! whose blade was renewed during the long-lost Changing of the Blades. Whether this weapon was truly one incarnation of that ceremonial sword, or merely a later Valyrian blade interred within a far older sanctuary, remains a matter of dispute.\n\nHouse Darklyn has chosen its answer. Last Light has returned."

last_light_bla_modifier:0 "Last Light"
last_light_bla_modifier_desc:0 "The recovered ancestral blade of House Darklyn, believed by its wielders to be the lost Last Light of the ancient Shadow Kings."

duskfall_bla_name:0 "Duskfall"

duskfall_bla_description:0 "A longsword of smoke-dark Valyrian steel recovered from an ancient chamber beneath Duskendale. The blade was found in a burial associated with the forgotten Shadow Kings, though its true age and original owner remain impossible to establish.\n\nDarklyn chronicles speak of an ancestral weapon called #italic Last Light#! and a lost winter rite known as the Changing of the Blades. Rather than attempt to bind the recovered sword entirely to a past obscured by thousands of years of myth, its Darklyn wielder gave the steel a new name drawn from the ancient words of the house:\n\n#italic Shadow Will Fall.#!\n\nThus Duskfall was born."

duskfall_restored_bla_description:0 "A longsword of smoke-dark Valyrian steel recovered from an ancient chamber beneath Duskendale. The blade was found in a burial associated with the forgotten Shadow Kings, though its true age and original owner remain impossible to establish.\n\nDarklyn chronicles speak of an ancestral weapon called #italic Last Light#! and a lost winter rite known as the Changing of the Blades. Rather than attempt to bind the recovered sword entirely to a past obscured by thousands of years of myth, its Darklyn wielder gave the steel a new name drawn from the ancient words of the house:\n\n#italic Shadow Will Fall.#!\n\nThus Duskfall was born."

duskfall_bla_modifier:0 "Duskfall"
duskfall_bla_modifier_desc:0 "A Valyrian steel blade recovered beneath Duskendale and given a new identity by House Darklyn, joining the mysteries of the Shadow Kings to the house's living future."