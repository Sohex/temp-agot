l_english:

agot_crownlands_bla.0800.t:0 "The Granaries of Stokeworth"

agot_crownlands_bla.0800.desc:0 "The road south carries more than travelers.\n\nEvery cart of barley, sack of flour, side of salted meat, and basket of onions that leaves our lands can eventually find its way toward the hungry mouths of King's Landing. When harvests are good, merchants come north eagerly. When they are poor, officials come instead.\n\nThis year the stores are full.\n\nMy steward presents the accounts with obvious satisfaction. There is enough grain to sell, enough to reserve against a lean season, and perhaps enough to win gratitude from those whose tables depend upon the countryside beyond the city walls.\n\nFood is an ordinary thing.\n\nUntil there is not enough of it."

agot_crownlands_bla.0800.a:0 "Open the granaries. Let no neighbor go hungry."
agot_crownlands_bla.0800.b:0 "Sell what the markets will bear."
agot_crownlands_bla.0800.c:0 "A wise lord prepares for the harvest that fails."
agot_crownlands_bla.0800.d:0 "The crown will receive the first wagons."

agot_stokeworth_open_granaries_bla:0 "Open Granaries"
agot_stokeworth_open_granaries_bla_desc:0 "House Stokeworth has released part of its stores generously, winning goodwill among those dependent upon the surrounding estates."

agot_stokeworth_grain_trade_bla:0 "Profitable Grain Trade"
agot_stokeworth_grain_trade_bla_desc:0 "Strong harvests and proximity to large markets have allowed House Stokeworth to turn its agricultural surplus into considerable profit."

agot_stokeworth_full_storehouses_bla:0 "Full Storehouses"
agot_stokeworth_full_storehouses_bla_desc:0 "Rather than chase immediate profit, House Stokeworth has maintained deep reserves against war, winter, or failed harvest."

agot_stokeworth_provisioner_of_the_crown_bla:0 "Provisioner of the Crown"
agot_stokeworth_provisioner_of_the_crown_bla_desc:0 "The ruler's household has made a point of ensuring that the needs of the royal court are supplied before private profit is considered."

agot_crownlands_bla.0801.t:0 "A Match Worth Making"

agot_crownlands_bla.0801.desc:0 "The advantage of living near the royal court is that one rarely lacks opportunities to hear who is seeking a husband, who requires a wife, whose inheritance has unexpectedly improved, and whose prospects have deteriorated just as suddenly.\n\nSeveral names have reached my household regarding a possible match for one of our kin.\n\nSome offer greater birth. Others offer coin. One family possesses neither in abundance, but has friends close to powerful ears.\n\nA marriage joins two people, the septons say.\n\nEvery lord knows that it also joins two sets of interests."

agot_crownlands_bla.0801.a:0 "House Stokeworth should marry upward."
agot_crownlands_bla.0801.b:0 "A friend at court is worth more than another field."
agot_crownlands_bla.0801.c:0 "Prestige does not pay household expenses."
agot_crownlands_bla.0801.d:0 "Find someone worthy of our blood, not merely useful to it."

agot_stokeworth_ambitious_matches_bla:0 "Ambitious Matches"
agot_stokeworth_ambitious_matches_bla_desc:0 "House Stokeworth has become increasingly deliberate about using marriage to raise the standing of its bloodline."

agot_stokeworth_ties_to_court_bla:0 "Ties to Court"
agot_stokeworth_ties_to_court_bla_desc:0 "Marriage negotiations and family connections have strengthened House Stokeworth's relationships with those close to its liege."

agot_stokeworth_practical_matches_bla:0 "Practical Matches"
agot_stokeworth_practical_matches_bla_desc:0 "House Stokeworth has favored marriages that strengthen estates and finances rather than merely flattering family pride."

agot_crownlands_bla.0802.t:0 "The Blackened Beam"

agot_crownlands_bla.0802.desc:0 "The carpenters found it behind newer timber while repairing one of the older roofs.\n\nThe beam is blackened almost from end to end. Age has hardened the burned wood rather than consumed it, and one of the workmen immediately declares that it must date from the Conquest.\n\nThe story is familiar to every Stokeworth child.\n\nWhen Queen Visenya came for our submission upon Vhagar, men upon these walls loosed their crossbows at the dragon. Vhagar answered with flame. The roofs burned, and our forebears wisely decided that honor had been sufficiently demonstrated.\n\nWhether this piece of wood truly survived that day is another matter.\n\nThe maester cannot say.\n\nThe servants already can."

agot_crownlands_bla.0802.a:0 "Keep it. True or not, the story is ours."
agot_crownlands_bla.0802.b:0 "Let the maester determine what he can."
agot_crownlands_bla.0802.b.tt:0 "The timber is certainly ancient, though proving that Vhagar burned this particular beam is beyond even the maester"

agot_crownlands_bla.0802.c:0 "Remember that our men fired first."
agot_crownlands_bla.0802.d:0 "Remember instead that our ancestors knew when to yield."

agot_stokeworth_ashes_of_vhagar_bla:0 "Ashes of Vhagar"
agot_stokeworth_ashes_of_vhagar_bla_desc:0 "A charred relic said to date from the submission of Stokeworth has renewed interest in the family's survival through the fires of Aegon's Conquest."

agot_stokeworth_remembers_the_flame_bla:0 "Remember the Flame"
agot_stokeworth_remembers_the_flame_bla_desc:0 "The story of the men who dared loose crossbow bolts at Vhagar is remembered as evidence that House Stokeworth did not surrender without first showing its courage."

agot_stokeworth_bend_before_breaking_bla:0 "Bend Before Breaking"
agot_stokeworth_bend_before_breaking_bla_desc:0 "The submission of Stokeworth is remembered not as humiliation, but as proof that survival sometimes requires recognizing an unwinnable contest."

agot_crownlands_bla.0803.t:0 "The Hand's Road"

agot_crownlands_bla.0803.desc:0 "The road between Stokeworth and King's Landing is not particularly long.\n\nFor our house, it has sometimes been very long indeed.\n\nAlyn Stokeworth traveled it and rose to become Hand of the King. He helped oversee the raising of the Red Keep itself, served one king and then another, and finally rode away upon royal business to hunt Harren the Red.\n\nHe never returned.\n\nThere is honor in being trusted by kings. There is influence in standing close to a throne. There can even be greatness there.\n\nBut those nearest the crown are also nearest its burdens.\n\nHouse Stokeworth has walked that road before."

agot_crownlands_bla.0803.a:0 "Let the crown always find House Stokeworth ready."
agot_crownlands_bla.0803.b:0 "Alyn died doing his duty. That must mean something."
agot_crownlands_bla.0803.c:0 "If we stand near the throne, we should make that proximity count."
agot_crownlands_bla.0803.d:0 "No office is worth forgetting where our true strength lies."

agot_stokeworth_crowns_diligent_servants_bla:0 "The Crown's Diligent Servants"
agot_stokeworth_crowns_diligent_servants_bla_desc:0 "House Stokeworth embraces the tradition of capable royal service exemplified by those of its blood who have held high office."

agot_stokeworth_duty_in_the_field_bla:0 "Duty in the Field"
agot_stokeworth_duty_in_the_field_bla_desc:0 "Alyn Stokeworth's death in royal service is remembered as proof that duty sometimes demands more than comfortable attendance at court."

agot_stokeworth_near_the_throne_bla:0 "Near the Throne"
agot_stokeworth_near_the_throne_bla_desc:0 "Few Crownlands houses are positioned so conveniently to cultivate influence at the royal court, and House Stokeworth intends to make use of that proximity."

agot_stokeworth_house_before_office_bla:0 "House Before Office"
agot_stokeworth_house_before_office_bla_desc:0 "Royal favor may come and go. This ruler has chosen to ensure that the estates and bloodline of House Stokeworth remain strong regardless of who sits the throne."