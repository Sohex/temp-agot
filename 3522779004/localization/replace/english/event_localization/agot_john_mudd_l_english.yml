# ==========================================
# EVENT 0001: A MUDD RETURNS
# ==========================================
agot_john_mudd.0001.t:0 "A Mudd Returns"
agot_john_mudd.0001.desc:0 "The final Lord Pemford has died without a drop of true blood left to inherit his seat. Before a distant cousin can even gather their things to claim the gates, a foreign galleas drops anchor at Seagard. A battle-scarred warrior step ashore, wearing the faded silk and gilded armbands of the Golden Company.\n\nHe introduces himself as John Mudd, an exiled captain claiming direct descent from the ancient Mudds of Oldstones. He hasn't come alone; five hundred hardened, Essosi-trained sellswords march behind his banner. Mudd petitions you to grant him Hammerford—the last standing piece of his family's stolen kingdom. In exchange, he offers you a company of lethal steel, but inviting Essosi mercenaries into your borders will surely draw the furious gaze of the Iron Throne."
agot_john_mudd.0001.a:0 "Accept his oaths. The blood of the Mudds belongs in the Riverlands."
agot_john_mudd.0001.b:0 "Toss the sellsword back into the sea. Hammerford passes to the Pemford cousins."
agot_john_mudd.0001.c:0 "The Trident belongs to the First Men. I will take up John Mudd's cause myself."

# ==========================================
# MAA RETINUE LOCALIZATION
# ==========================================
golden_company_retinue:0 "Mudd's Golden Vanguard"
golden_company_retinue.desc:0 "A dedicated company of exiled Westerosi knights and Essosi professional sellswords who followed Captain John Mudd across the Narrow Sea. They fight with the absolute discipline of the Golden Company, bound by contracts written in blood and gold."
