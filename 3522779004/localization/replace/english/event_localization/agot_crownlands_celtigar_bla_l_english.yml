l_english:

agot_crownlands_bla.0200.t:0 "The Crab's Due"

agot_crownlands_bla.0200.desc:0 "The ledgers laid before me are precise enough to satisfy a maester and unpleasant enough to interest a Celtigar.\n\n[celtigar_tax_collector_bla.GetFirstName], one of the sharper minds employed in the collection of my revenues, has spent months comparing harbor dues, rents, fines, and obligations against what has actually reached my treasury. The difference is considerable.\n\nSome debts are small and ancient. Others belong to merchants who have apparently discovered remarkable skill in forgetting what they owe. A few entries suggest that local officials may have been equally forgetful when recording payments already collected.\n\n'Coin does not vanish, my [ROOT.Char.GetLadyLord],' [celtigar_tax_collector_bla.GetFirstName] says, tapping one column with a finger. 'It merely changes hands.'"

agot_crownlands_bla.0200.a:0 "Then we shall discover whose hands."
agot_crownlands_bla.0200.b:0 "Collect every copper that is owed."
agot_crownlands_bla.0200.c:0 "Offer them terms. Coin today is worth more than promises tomorrow."
agot_crownlands_bla.0200.d:0 "These accounts reveal more than unpaid taxes."

agot_crownlands_bla.0200.a.success:0 "The Accounts Yield Their Secrets"
agot_crownlands_bla.0200.a.failure:0 "A Maze of Ledgers"

agot_celtigar_empowered_tax_collector_bla:0 "The Crab's Collector"
agot_celtigar_empowered_tax_collector_bla_desc:0 "Entrusted with unusual authority over Celtigar revenues, this official has become adept at discovering unpaid obligations and ensuring that coin reaches the treasury rather than disappearing along the way."

agot_crownlands_bla.0201.t:0 "The Claw Isle Taxman"

agot_crownlands_bla.0201.desc:0 "[celtigar_tax_collector_bla.GetFirstName] has proven extraordinarily successful.\n\nThat is precisely the problem.\n\nCoin reaches my treasury in quantities my stewards have not seen in years. Old obligations have been collected, dubious exemptions overturned, and merchants who once seemed incapable of finding their purses have suddenly rediscovered them.\n\nYet complaints now arrive almost as quickly as the silver. Fishermen speak of nets assessed as though they were merchant cargo. Lesser officials insist that every discrepancy is treated as theft. Several prosperous traders have begun threatening to move their business elsewhere rather than endure another visit from [celtigar_tax_collector_bla.GetFirstName].\n\n'They complain because they are paying,' the collector tells me. 'If they were pleased, my [ROOT.Char.GetLadyLord], I would not be doing my duty.'"

agot_crownlands_bla.0201.a:0 "Then keep doing your duty."
agot_crownlands_bla.0201.b:0 "Collect what is owed, not every copper you can find."
agot_crownlands_bla.0201.c:0 "Perhaps I should examine your accounts as closely as you examine theirs."
agot_crownlands_bla.0201.d:0 "No. You are far too useful to waste upon ordinary collections."
agot_crownlands_bla.0201.e:0 "Your service to House Celtigar is finished."

agot_crownlands_bla.0201.c.success:0 "Coin Between the Pages"
agot_crownlands_bla.0201.c.failure:0 "The Books Are Clean"

agot_celtigar_false_accusation_opinion_bla:0 "Accused Me Without Proof"

agot_celtigar_relentless_collector_bla:0 "Relentless Collector"
agot_celtigar_relentless_collector_bla_desc:0 "Few unpaid obligations escape this official's attention. Their methods are not beloved, but the Celtigar treasury rarely has cause to complain."

agot_celtigar_keeper_of_the_ledgers_bla:0 "Keeper of the Ledgers"
agot_celtigar_keeper_of_the_ledgers_bla_desc:0 "This official has moved beyond ordinary tax collection and now keeps close watch over debts, contracts, suspicious accounts, and the financial secrets of those who deal with House Celtigar."

agot_crownlands_bla.0202.t:0 "Old Blood, New Coin"

agot_crownlands_bla.0202.desc:0 "Old Valyria survives in strange ways.\n\nSome remember it in dragons and ruined towers. Others in pale hair, ancient words, or blades forged by arts the world has forgotten. House Celtigar has none of the dragons that once raised the Targaryens above kings, nor has the seahorse ever permitted the Narrow Sea to forget the name Velaryon.\n\nYet the crab endured.\n\nOur blood crossed the sea before the Doom, and Claw Isle has remained ours while kingdoms rose, dynasties fell, and conquerors turned to bones. Our vaults have filled coin by coin, our ledgers line shelf after shelf, and Celtigars have served kings without surrendering the name that was ours before Westeros knew theirs.\n\nI find myself wondering what inheritance matters most."

agot_crownlands_bla.0202.a:0 "Gold tarnishes. The blood of Old Valyria does not."
agot_crownlands_bla.0202.b:0 "Ancient blood is finer still when dressed in gold."
agot_crownlands_bla.0202.c:0 "Our worth is proven by the crowns that have trusted us."
agot_crownlands_bla.0202.d:0 "Let others boast. The crab has endured."

agot_celtigar_old_valyrian_pride_bla:0 "Blood of Old Valyria"
agot_celtigar_old_valyrian_pride_bla_desc:0 "This Celtigar takes particular pride in the ancient Valyrian origins of their house, regarding that inheritance as something no amount of coin or royal favor could replace."

agot_celtigar_display_of_wealth_bla:0 "The Wealth of the Crab"
agot_celtigar_display_of_wealth_bla_desc:0 "The coffers of Claw Isle are not meant merely to be counted. Wealth displayed wisely reminds lord, merchant, and courtier alike that the red crabs possess resources accumulated across generations."

agot_celtigar_crownbound_service_bla:0 "Crownbound Service"
agot_celtigar_crownbound_service_bla_desc:0 "House Celtigar has long found influence through service to greater crowns. This ruler embraces that tradition, treating royal trust as another form of power."

agot_celtigar_claw_isle_identity_bla:0 "The Crab Endures"
agot_celtigar_claw_isle_identity_bla_desc:0 "Neither dragons nor the fame of other Valyrian houses define House Celtigar. Claw Isle, its people, and generations of stubborn survival are inheritance enough."

agot_crownlands_bla.0203.t:0 "Wreck upon the Claw"

agot_crownlands_bla.0203.desc:0 "The storm spent itself before dawn, leaving broken timber scattered across the shores of Claw Isle.\n\nA merchant vessel foundered upon the rocks during the night. What remains of her lies beyond the surf, while barrels, shattered crates, bolts of cloth, and stranger cargo now litter the strand. Some of the crew survived and have been dragged half-drowned from the water. Others will be found only when the tide returns them.\n\nMy men have already begun gathering whatever the sea surrendered.\n\nThe question spreading along the shore is an old one: when the sea casts wealth upon Celtigar land, whose wealth is it?"

agot_crownlands_bla.0203.a:0 "What the sea gives the Claw belongs to the crab."

agot_crownlands_bla.0203.a.wealth_tt:0 "Your earlier embrace of #bold the Wealth of the Crab#! allows your household to extract greater value from the recovered cargo."

agot_crownlands_bla.0203.b:0 "Count survivors first. Cargo can wait."

agot_crownlands_bla.0203.c:0 "Open those chests. Something here is being hidden."

agot_crownlands_bla.0203.d:0 "Inventory everything. We shall claim a lawful salvage fee."

agot_crownlands_bla.0203.c.success:0 "Cargo Without a Manifest"
agot_crownlands_bla.0203.c.failure:0 "Nothing but Salt and Suspicion"

agot_celtigar_asserted_wreck_rights_bla:0 "Rights of Wreck"
agot_celtigar_asserted_wreck_rights_bla_desc:0 "This ruler has asserted Celtigar authority over valuable goods cast upon the shores of Claw Isle, treating the bounty of wrecked ships as another due belonging to the crab."

agot_celtigar_mercy_of_the_claw_bla:0 "Mercy of the Claw"
agot_celtigar_mercy_of_the_claw_bla_desc:0 "When wreck and storm brought helpless sailors onto Celtigar shores, this ruler ordered that lives be saved before coin was counted." 

agot_crownlands_bla.0204.t:0 "The Crab and Seahorse"

agot_crownlands_bla.0204.desc:0 "There are few houses in Westeros that can speak of Old Valyria as something belonging to their blood rather than their histories.\n\nHouse Velaryon is one of them.\n\nAs [celtigar_velaryon_lord_bla.GetTitledFirstName] and I speak, it is difficult not to consider the strange course our houses have taken. The seahorse found fame upon the Narrow Sea, its fleets carrying Velaryon names into courts far beyond Driftmark. The crab followed a quieter road, gathering coin, offices, obligations, and influence upon Claw Isle.\n\nDifferent fortunes, perhaps, but our ancestors crossed the same sea before the Doom made exiles of every Valyrian who remained beyond it.\n\nWhat that ancient kinship should mean today is another matter."

agot_crownlands_bla.0204.a:0 "There are few enough of the old blood. We should stand together."
agot_crownlands_bla.0204.a.valyria_tt:0 "Your earlier embrace of #bold the Blood of Old Valyria#! strengthens your conviction that the ancient ties between Celtigar and Velaryon should be renewed."

agot_crownlands_bla.0204.b:0 "Blood is well and good. Let us speak of trade."

agot_crownlands_bla.0204.c:0 "Let them chase glory. We shall count what it costs them."

agot_crownlands_bla.0204.d:0 "The crab has no need to shelter beneath the seahorse."

agot_celtigar_velaryon_commerce_bla:0 "Crab and Seahorse Commerce"
agot_celtigar_velaryon_commerce_bla_desc:0 "Closer dealings with Velaryon merchants and captains have opened profitable opportunities for Celtigar interests across the Narrow Sea."

agot_celtigar_quiet_competition_bla:0 "Quiet Competition"
agot_celtigar_quiet_competition_bla_desc:0 "Rather than challenge House Velaryon openly, this Celtigar watches the seahorse carefully, seeking opportunities wherever Velaryon ambition leaves them."

agot_crownlands_bla.0205.t:0 "The Claws of Claw Isle"

agot_crownlands_bla.0205.desc:0 "The men who bear arms for House Celtigar are not maintained by courage alone.\n\nArmor must be repaired, weapons replaced, horses fed, and men paid often enough that they remember whose banner they serve. My officers warn that the cost of maintaining the household soldiery has risen steadily, while the obligations traditionally used to support them no longer stretch as far as they once did.\n\nSome suggest simply demanding more from Claw Isle. Others argue that fewer, better-trained men would serve us more faithfully than a larger force assembled through old custom.\n\nThe crab has claws for a reason. The question is how best to keep them sharp."

agot_crownlands_bla.0205.a:0 "Pay good men well, and they will fight well."
agot_crownlands_bla.0205.b:0 "Claw Isle owes more than coin to House Celtigar."
agot_crownlands_bla.0205.c:0 "I want fewer men perhaps, but better ones."
agot_crownlands_bla.0205.d:0 "The old obligations have served us long enough."

agot_celtigar_paid_claws_bla:0 "Well-Paid Claws"
agot_celtigar_paid_claws_bla_desc:0 "House Celtigar has chosen to maintain its fighting men through dependable pay and professional service rather than relying chiefly upon traditional obligations."

agot_celtigar_military_tithes_bla:0 "Military Tithes"
agot_celtigar_military_tithes_bla_desc:0 "The obligations owed to House Celtigar have been expanded to provide more coin and manpower for the defense of Claw Isle. The levy is effective, if hardly beloved."

agot_celtigar_elite_claws_bla:0 "The Finest Claws"
agot_celtigar_elite_claws_bla_desc:0 "Rather than maintaining numbers for their own sake, House Celtigar has concentrated its resources upon a smaller core of disciplined and capable warriors."

agot_crownlands_bla.0206.t:0 "Crownbound"

agot_crownlands_bla.0206.desc:0 "A raven bearing the seal of [celtigar_crown_holder_bla.GetTitledFirstName] has arrived upon Claw Isle.\n\nThe words are courteous. The meaning is less delicate.\n\nThe Iron Throne has need of its lords.\n\nHouse Celtigar has answered such calls before. Our name has appeared in royal councils and accounts, beside fleets and armies, and beneath decrees issued in the names of kings. Service to the Crown has brought influence to Claw Isle, though service is seldom requested without cost.\n\nThe messenger waits to learn what the crab will offer."

agot_crownlands_bla.0206.a:0 "Open the coffers. The Crown shall have our coin."

agot_crownlands_bla.0206.a.crownbound_tt:0 "Your earlier embrace of #bold Crownbound Service#! makes this fulfillment of Celtigar's traditional duty especially prestigious."

agot_crownlands_bla.0206.b:0 "Coin can be replaced. Send the Crown our claws."

agot_crownlands_bla.0206.b.claws_tt:0 "Your earlier creation of #bold the Finest Claws#! allows House Celtigar to offer soldiers whose quality brings particular distinction."

agot_crownlands_bla.0206.c:0 "Send stewards. A kingdom bleeds coin faster than any army."

agot_crownlands_bla.0206.d:0 "Claw Isle has needs of its own."

agot_crownlands_bla.0206.d.claw_tt:0 "Your earlier embrace of #bold the Crab Endures#! strengthens your conviction that the interests of Claw Isle must come before service to distant crowns."

agot_celtigar_royal_accounting_bla:0 "Royal Accounting"
agot_celtigar_royal_accounting_bla_desc:0 "By placing Celtigar expertise at the service of the Crown, this ruler's household has gained experience administering revenues and obligations on a scale far beyond Claw Isle."

agot_crownlands_bla.0207.t:0 "Beneath the Cellars"

agot_crownlands_bla.0207.desc:0 "The workmen came to me expecting punishment.\n\nThey had been repairing an old cellar wall when part of the masonry gave way beneath their tools. Behind it they found not earth or foundation stone, but darkness — a narrow passage descending farther beneath the castle.\n\nThe opening had been deliberately sealed. Whoever laid the stones did so carefully enough that generations passed without anyone realizing a doorway had ever stood there.\n\nHouse Celtigar has occupied Claw Isle since before the Doom of Valyria. Coin, records, weapons, gifts, curiosities, and the accumulated possessions of countless generations have passed through these halls. Not all of them appear in the inventories that survive today.\n\nOne of the workmen asks the question hanging silently over all of us.\n\n'What did your ancestors put down there?'"

agot_crownlands_bla.0207.a:0 "There is only one way to learn. Open it."

agot_crownlands_bla.0207.a.valyria_tt:0 "Your earlier embrace of #bold the Blood of Old Valyria#! makes the possibility of uncovering something left by your earliest ancestors especially compelling."

agot_crownlands_bla.0207.b:0 "Not yet. Bring me every old plan and household ledger."

agot_crownlands_bla.0207.c:0 "Seal the cellar above us. No one else hears of this."

agot_crownlands_bla.0207.d:0 "Some doors were sealed for a reason."

agot_crownlands_bla.0212.t:0 "The Crab Endures"

agot_crownlands_bla.0212.desc:0 "Claw Isle has never been rich in broad fields or great forests. Its strength lies in what it has always been: hard shores, stubborn settlements, and people accustomed to making do with little.\n\nYet several of the island's smaller hamlets now sit dangerously exposed. Fishermen complain of raiders testing isolated coves, while storms have damaged piers and huts built too close to the water. My stewards warn that if nothing is done, the island may lose both people and coin one settlement at a time.\n\nClaw Isle has endured for generations. Endurance, however, is not the same as neglect."

agot_crownlands_bla.0212.a:0 "Fortify the coast. No landing will come cheaply."
agot_crownlands_bla.0212.a.claw_tt:0 "Your earlier embrace of #bold the Crab Endures#! strengthens your resolve to invest directly in the survival of Claw Isle."

agot_crownlands_bla.0212.b:0 "Every village will keep watch for sails."
agot_crownlands_bla.0212.c:0 "Move the most vulnerable settlements inland."
agot_crownlands_bla.0212.d:0 "The island has weathered worse."

agot_celtigar_fortified_claw_isle_bla:0 "Fortified Claw Isle"
agot_celtigar_fortified_claw_isle_bla_desc:0 "Watch posts, strengthened landing places, and improved defenses have made Claw Isle harder to surprise from the sea."

agot_celtigar_coastal_watch_bla:0 "Coastal Watch"
agot_celtigar_coastal_watch_bla_desc:0 "Fishermen, villagers, and local men-at-arms maintain a regular watch over Claw Isle's coves and approaches."

agot_celtigar_sheltered_settlements_bla:0 "Sheltered Settlements"
agot_celtigar_sheltered_settlements_bla_desc:0 "Several exposed communities have been moved or rebuilt in safer locations, reducing their vulnerability to storms and sudden raids."

agot_celtigar_exposed_coast_bla:0 "Exposed Coast"
agot_celtigar_exposed_coast_bla_desc:0 "Little has been done to protect Claw Isle's most vulnerable settlements, leaving isolated communities increasingly anxious."

agot_crownlands_bla.0213.t:0 "A Debt Called Due"

agot_crownlands_bla.0213.desc:0 "A debt owed to House Celtigar has finally grown too large to ignore.\n\nThe original sum was modest enough, advanced years ago against cargo, land, or favor. Since then the obligation has gathered interest, penalties, and excuses in roughly equal measure. My stewards now insist that the debtor can no longer pretend the matter will simply disappear.\n\nCoin is the obvious answer.\n\nBut a debt may be worth more than coin if one is patient enough."

agot_crownlands_bla.0213.a:0 "Pay what is owed. Nothing more, nothing less."
agot_crownlands_bla.0213.b:0 "A debt can purchase obedience."
agot_crownlands_bla.0213.c:0 "Forget the coin. I want favorable terms instead."
agot_crownlands_bla.0213.c.wealth_tt:0 "Your earlier embrace of #bold the Wealth of the Crab#! makes you especially adept at turning obligations into profitable arrangements."
agot_crownlands_bla.0213.d:0 "Let everyone see what happens when Celtigar debts are ignored."

agot_celtigar_debts_as_leverage_bla:0 "Debts as Leverage"
agot_celtigar_debts_as_leverage_bla_desc:0 "This ruler has learned that an unpaid obligation may be more useful than a settled account, particularly when the debtor still has something to lose."

agot_celtigar_trade_concessions_bla:0 "Trade Concessions"
agot_celtigar_trade_concessions_bla_desc:0 "Rather than demanding immediate repayment, House Celtigar has converted old debts into favorable commercial arrangements."

agot_celtigar_no_debt_forgotten_bla:0 "No Debt Forgotten"
agot_celtigar_no_debt_forgotten_bla_desc:0 "House Celtigar has made a public example of those who ignore their obligations. The lesson has been widely understood."

agot_crownlands_bla.0214.t:0 "The Locked Chest"

agot_crownlands_bla.0214.desc:0 "The chest was never truly lost.\n\nIt has sat for generations in a locked room among the private apartments of House Celtigar, mentioned occasionally in inventories but rarely opened. Three keys have been found for it over the years. None fit. At last, a locksmith has defeated what time and several generations of stewards could not.\n\nInside lie silver, old coin, pieces of jewelry, and a bundle of carefully preserved household papers. Valuable, certainly, though hardly the legendary treasure of some singer's tale.\n\nThe difficulty lies elsewhere.\n\nOne account describes the chest as the private property of a long-dead Lord Celtigar. Another calls its contents a reserve 'for the preservation of the house.' A third is frustratingly vague.\n\nThe dead have left me their wealth, but neglected to say precisely who should own it."

agot_crownlands_bla.0214.a:0 "I am Lord Celtigar. What was his is mine."

agot_crownlands_bla.0214.b:0 "A lord holds such things for those who come after."

agot_crownlands_bla.0214.c:0 "My ancestors did not save this coin merely so I could admire it."

agot_crownlands_bla.0214.d:0 "Set aside the silver. I want those papers."

agot_crownlands_bla.0214.d.archives_tt:0 "Your recovery of #bold the Celtigar Archives#! allows these papers to be compared against records uncovered in the forgotten vaults."

agot_celtigar_keeper_not_owner_bla:0 "Keeper, Not Owner"
agot_celtigar_keeper_not_owner_bla_desc:0 "This ruler regards the accumulated wealth of House Celtigar not merely as personal property, but as an inheritance held in trust for generations yet to come."

agot_celtigar_ancestral_capital_bla:0 "Ancestral Capital"
agot_celtigar_ancestral_capital_bla_desc:0 "Old Celtigar wealth has been taken from locked chests and put back into circulation, ensuring that the careful savings of dead lords continue to serve the living."

agot_celtigar_household_precedents_bla:0 "Household Precedents"
agot_celtigar_household_precedents_bla_desc:0 "Old accounts and household records have revealed how earlier Lords Celtigar settled disputes over property, inheritance, debts, and the distinction between a lord's possessions and those of his house."