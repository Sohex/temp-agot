l_english:

  agot_riverlands_bla.0300.t:0 "The Ravens of Raventree"
 agot_riverlands_bla.0300.desc:0 "A sudden, suffocating silence has fallen over the courtyard. Thousands of ravens have descended upon the skeleton of the colossal, dead weirwood, their black plumage completely choking out its bone-white branches. Below, the smallfolk whisper in terror, crossing themselves or murmuring prayers to the Old Gods. Your maester dismisses it as a simple seasonal migration, yet the heavy, unblinking gaze of ten thousand black eyes leaves even your hardiest household guards shifting their boots in unease."
 agot_riverlands_bla.0300.a:0 "Lay out an offering of flesh and grain before the ancient roots."
 agot_riverlands_bla.0300.b:0 "Hold court beneath the branches to prove Blackwood blood does not fear omens."
 agot_riverlands_bla.0300.c:0 "Command the maester to search the house chronicles for past visitations."
 agot_riverlands_bla.0300.d:0 "Archers, loose! Our seat will not be held hostage by a flock of carrion birds."
 agot_riverlands_bla.0300.c.success_tt:0 "Your scholar uncovers a forgotten precedent in the archives, restoring confidence to your hall."
 agot_riverlands_bla.0300.c.omen_tt:0 "The archives yield only dark gaps, leaving the court deeply unsettled by the silent flock."


 agot_riverlands_bla.0301.t:0 "A Singer from the North"
 agot_riverlands_bla.0301.desc:0 "A salt-stained bard from the North has arrived at your gates, trading his throat and his lute for a warm hearth and a horn of ale. He sings none of the sweet, courtly Andal love ballads popular in the south. Instead, his voice is a rough baritone that rasps of ancient Winter Kings, the baying of direwolves, and dark blood spilled before weeping trees. The hall sits spellbound, caught in the primal rhythm of the First Men."
 agot_riverlands_bla.0301.a:0 "Offer him a bench at the high table and let the old songs ring out."
 agot_riverlands_bla.0301.b:0 "Toss him a few silver stags; a rich bard sings a friendlier tune."
 agot_riverlands_bla.0301.c:0 "Raise your horn high to the blood of the First Men."
 agot_riverlands_bla.0301.d:0 "Whisper a subtle threat; his next verse will carry your warning."
 agot_riverlands_bla.0301.d.tt:0 "The bard will act as a temporary asset for your quiet schemes before he leaves."


 agot_riverlands_bla.0302.t:0 "The Bleeding Tree"
 agot_riverlands_bla.0302.desc:0 "The colossal weirwood of Raventree has stood dead and leafless for a thousand years, yet today it mocks the living. A sudden, unnatural gale whips through the windless godswood, and down from the bare, bone-white branches showers a flurry of what looks like blood-red leaves. As they hit the earth, the smallfolk shriek; they are not leaves at all, but clotted flakes of ancient, dried red sap, shed from the heart tree's weeping face like scabs from an old wound. Your servants drop their tools, gathering the holy crimson shards in a terrified silence."
 agot_riverlands_bla.0302.a:0 "Lead the household in a silent prayer to the Old Gods beneath the branches."
 agot_riverlands_bla.0302.b:0 "Gather your bloodline beneath the heart tree to reaffirm our ancient house vows."
 agot_riverlands_bla.0302.c:0 "Command the maester to press the finest shards into our oldest chronicles."
 agot_riverlands_bla.0302.d:0 "Order them back to their chores; dead wood sheds, nothing more."
 agot_riverlands_bla.0302.c.tt:0 "The crimson leaves are preserved, adding a sacred item to your house's holy relics."


 agot_riverlands_bla.0303.t:0 "Echoes in the Bark"
 agot_riverlands_bla.0303.desc:0 "As twilight deepens over the godswood, the talk among your veteran knights turns to the bloody, scarred history of the Trident. In hushed tones, they name the long-dead First Men kings who once ruled these hills, the kin slain in forgotten skirmishes, and the bitter Bracken rivals whose bones have fed the soil for a thousand years. Standing beneath the giant, pale skeleton of the weirwood, the weight of a hundred centuries of blood feud settles heavily over your men."
 agot_riverlands_bla.0303.a:0 "Summon the smallfolk to join our vigil for the dead."
 agot_riverlands_bla.0303.b:0 "Prick your palm and swear an oath to maintain our ancient customs."
 agot_riverlands_bla.0303.c:0 "Search the weeping, carved face of the heart tree for hidden signs."
 agot_riverlands_bla.0303.d:0 "Dismiss their brooding tales; ghosts will not hold our borders."


 agot_riverlands_bla.0304.t:0 "Wolves at the Gates"
 agot_riverlands_bla.0304.desc:0 "An embassy from Winterfell has ridden into your courtyard, and your guards have hoisted the grey direwolf banner directly alongside the black ravens of House Blackwood. To your smallfolk, seeing the sigils fly together is a proud reminder of the blood of the First Men. Yet to the Andal lords across your borders, this display looks less like hospitality and more like a direct, threatening alliance with the wild Lords of Winter."
 agot_riverlands_bla.0304.a:0 "Feast the Stark men righteously with ale and venison to honor our shared blood."
 agot_riverlands_bla.0304.b:0 "Bring the wolves to the godswood to pray together before the heart tree."
 agot_riverlands_bla.0304.c:0 "Keep the parley behind closed doors, focusing strictly on trade and borders."
 agot_riverlands_bla.0304.d:0 "Ensure the guards on our borders fly the Wolf banner right in the Brackens' faces."


 agot_riverlands_bla.0305.t:0 "A Ledger of Ghosts"
 agot_riverlands_bla.0305.desc:0 "Your family stands gathered in the damp chill beneath the bare, skeletal canopy of Raventree. As you read from a crumbling, salt-stained parchment, the names of your ancestors echo against the ancient stone walls. Generations of Blackwoods who fought, bled, and died to defend these few leagues of the Blackwood Vale. Looking upon your kin, the sheer weight of their unfulfilled vengeance and ancient duty presses heavily upon your chest."
 agot_riverlands_bla.0305.a:0 "Command your heirs to memorize the lineage, lest they forget our dead."
 agot_riverlands_bla.0305.b:0 "Pour a heavy horn of dark wine onto the roots to quench our ancestors' thirst."
 agot_riverlands_bla.0305.c:0 "Retire to the solar with the maester to verify our oldest lineage dates."
 agot_riverlands_bla.0305.d:0 "Recite the names of the Brackens who slew them, swearing never to forgive."


 agot_riverlands_bla.0306.t:0 "A Breath Before the Storm"
 agot_riverlands_bla.0306.desc:0 "The godswood is frozen in an eerie, deathly stillness. The flock of ravens sits perfectly motionless across the pale, bare branches of Raventree, refusing to utter a single croak. The suffocating silence feels almost heavy enough to touch, as if the heart tree itself is holding its breath before a strike of lightning."
 agot_riverlands_bla.0306.a:0 "Spend the afternoon in solitary meditation beneath the trunk."
 agot_riverlands_bla.0306.b:0 "Order the guards to lock the ironwood gates to the grove."
 agot_riverlands_bla.0306.c:0 "Stay watchful; a quiet grove often precedes a loud betrayal."
 agot_riverlands_bla.0306.d:0 "Use the heavy silence to meet with your spymaster completely unseen."


 agot_riverlands_bla.0307.t:0 "Bones of the Bronze Age"
 agot_riverlands_bla.0307.desc:0 "Swollen river waters have collapsed a muddy bank, exposing a subterranean barrow-tomb hidden for millennia. A local septon demands the pit be cleared and consecrated to the Seven, but your scouts have already pulled ancient treasures from the mud: shattered bronze longswords, charred bones, and worked runic stones carved thousands of years before the Andals ever crossed the Narrow Sea. It is the resting place of our ancestors."
 agot_riverlands_bla.0307.a:0 "Seal the barrow and leave an offering of blood to honor their spirits."
 agot_riverlands_bla.0307.b:0 "Bring your children to hold the heavy bronze swords of their forefathers."
 agot_riverlands_bla.0307.c:0 "Deliver the runic artifacts to the maester's tower for deep study."
 agot_riverlands_bla.0307.d:0 "Let the septon clear the ditch; the dead have no use for mud or stone."


 blackwood_raven_omens_bla:0 "A Shadow of Wings"
 blackwood_raven_omens_bla_desc:0 "An unnatural gathering of thousands of ravens has left this court deeply paranoid, with courtiers constantly scanning the skies for signs of impending doom."

 blackwood_courtyard_cleared_bla:0 "The Empty Canopy"
 blackwood_courtyard_cleared_bla_desc:0 "By aggressively driving the ravens from the dead weirwood, this ruler has shattered the superstitious panic in the hall, though traditionalists view the act as an insult to the heart tree."

 blackwood_old_ways_strengthened_bla:0 "Rites of the First Men"
 blackwood_old_ways_strengthened_bla_desc:0 "Ancient ceremonies and proper offerings have been restored beneath the weirwood, deeply pleasing traditionalists among the smallfolk and vassals."

 blackwood_whispering_faces_bla:0 "Watched by the Woods"
 blackwood_whispering_faces_bla_desc:0 "This character has spent too many hours staring into the weeping eyes of the heart tree, and they are thoroughly convinced the Old Gods are watching their every move."

 blackwood_questioned_the_gods_bla:0 "A Broken Faith"
 blackwood_questioned_the_gods_bla_desc:0 "A recent brush with tragedy has severely shaken this character's devotion to the Old Gods, leaving them bitterly cynical toward ancient omens and signs."

 blackwood_haunted_lineage_bla:0 "The Burden of Ghosts"
 blackwood_haunted_lineage_bla_desc:0 "The crushing pressure to live up to the legendary bronze-clad kings and heroes of First Men history weighs heavily upon this character's mind."

 blackwood_weirwood_whispers_bla:0 "Godswood Solitude"
 blackwood_weirwood_whispers_bla_desc:0 "Frequent hours spent in quiet meditation away from the endless, whispering chaos of court have granted this character a sharp, focused clarity of mind."

 blackwood_ancient_blood_bla:0 "Blood of the First Men"
 blackwood_ancient_blood_bla_desc:0 "This character proudly flaunts their ancient, unbroken lineage, earning the fierce respect of the smallfolk and traditionalist houses alike."

 blackwood_sworn_remembrance_bla:0 "A Vow Written in Blood"
 blackwood_sworn_remembrance_bla_desc:0 "The names of the fallen are spoken alongside the names of those who slew them, binding the house's grief to a generational demand for vengeance."

 blackwood_godswood_secrets_bla:0 "Whispers in the Wood"
 blackwood_godswood_secrets_bla_desc:0 "The suffocating silence beneath the dead weirwood has become a flawless cover for secret councils and quiet, lethal designs."


