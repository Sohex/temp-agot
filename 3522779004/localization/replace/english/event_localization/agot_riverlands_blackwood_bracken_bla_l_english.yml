l_english:

 # =========================================================
 # Event 0200: Blood in the Border Mud
 # =========================================================
agot_riverlands_bla.0200.t:0 "Blood in the Border Mud"
 agot_riverlands_bla.0200.desc:0 "A peasant found the body half-sunk in the riverbank, right on the disputed boundary line. The wounds are fresh and clearly made by a castle-forged blade. While there are no witnesses to name the killer, everyone in your hall is already shouting for the rival house's head."
 agot_riverlands_bla.0200.a:0 "Denounce them before the riverlords."
 agot_riverlands_bla.0200.b:0 "Bury the poor soul and offer restitution to keep the peace."
 agot_riverlands_bla.0200.c:0 "If we lack proof, we can manufacture it."
 agot_riverlands_bla.0200.d:0 "Let the sword settle this."
 agot_riverlands_bla.0200.c.success_tt:0 "Your fabricated proof turns suspicion against your rivals."
 agot_riverlands_bla.0200.c.failure_tt:0 "Your deception is exposed."

 # =========================================================
 # Event 0201: Sour Wine
 # =========================================================
 agot_riverlands_bla.0201.t:0 "Sour Wine"
 agot_riverlands_bla.0201.desc:0 "The feast started with forced pleasantries, but the atmosphere turned foul before the second course. A careless toast, a mock song from a drunkard, and a bitter glance toward old banners were all it took. Men are already reaching for their daggers, remembering how easily Blackwood and Bracken blood mixes on a hall floor."
 agot_riverlands_bla.0201.a:0 "Answer the insult here and now."
 agot_riverlands_bla.0201.b:0 "Call for restraint and keep your seat."
 agot_riverlands_bla.0201.c:0 "Spread a nastier rumor once the torches burn low."
 agot_riverlands_bla.0201.d:0 "Humiliate them openly in front of the guests."
 agot_riverlands_bla.0201.c.success_tt:0 "Your rumors take root among the guests."
 agot_riverlands_bla.0201.c.failure_tt:0 "Your meddling is traced back to you."


 # =========================================================
 # Event 0202: Crossed Wings
 # =========================================================
agot_riverlands_bla.0202.t:0 "Crossed Wings"
 agot_riverlands_bla.0202.desc:0 "Your maester reports that three ravens have gone missing along the usual flight paths. Worse, two letters arrived late with the wax seals crudely melted and pressed back together. Someone is reading your correspondence before it reaches its destination."
 agot_riverlands_bla.0202.a:0 "Demand an explanation for the broken seals."
 agot_riverlands_bla.0202.b:0 "Ignore it; let us not start a war over birds."
 agot_riverlands_bla.0202.c:0 "Send our own messages via more discreet routes."
 agot_riverlands_bla.0202.c.success_tt:0 "Your agents uncover useful leverage."
 agot_riverlands_bla.0202.c.failure_tt:0 "Your interference is exposed."

 # =========================================================
 # Event 0203: The Ancient Venom
 # =========================================================
agot_riverlands_bla.0203.t:0 "The Ancient Venom"
 agot_riverlands_bla.0203.desc:0 "The bickering in the courtyard has turned back to ancient history. Your men are trading insults with the neighbors over centuries-old dead trees, broken marriage contracts, and whether horse banners or ravens hold the rightful claim to these fields. The arguments are exhausting, but the hatred is entirely real."
 agot_riverlands_bla.0203.a:0 "Remind them that the Old Gods do not forget."
 agot_riverlands_bla.0203.b:0 "Invoke the Seven against these savages."
 agot_riverlands_bla.0203.c:0 "Use their religious pride to spin a damaging rumor."
 agot_riverlands_bla.0203.d:0 "Order both sides to quiet down."
 agot_riverlands_bla.0203.a.tt:0 "You invoke the old gods against your ancient enemies."
 agot_riverlands_bla.0203.b.tt:0 "You answer with Andal pride and righteous contempt."
 agot_riverlands_bla.0203.c.success_tt:0 "Your whispers stain your rival’s honor."
 agot_riverlands_bla.0203.c.failure_tt:0 "Your scheme is exposed."
 agot_riverlands_bla.0203.d.tt:0 "For now, faith is used to quiet the feud rather than feed it."
 # =========================================================
 # Event 0204: Stolen Stallions
 # =========================================================
 agot_riverlands_bla.0204.t:0 "Stolen Stallions"
 agot_riverlands_bla.0204.desc:0 "Several prize stallions have vanished from the pasture overnight. The tracks lead straight through the mud toward the disputed border before washing away in the rain. Your stablemaster insists it was the neighbors, though a few scouts suspect common outlaws."
 agot_riverlands_bla.0204.a:0 "Mount up and ride for reprisal."
 agot_riverlands_bla.0204.a.investigation_tt:0 "You dispatch your finest outriders and trackers to hunt for tracks along the muddy border."
 agot_riverlands_bla.0204.result.real_tt:0 "Your scouts track the missing bloodstock directly to your rival's hidden paddocks."
 agot_riverlands_bla.0204.result.bandits_tt:0 "The muddy tracks lead away from the border, terminating at a chaotic outlaw encampment."
 agot_riverlands_bla.0204.result.false_tt:0 "The tracks reveal the horses merely broke a fence, leaving your rivals furious over the false charge."
 agot_riverlands_bla.0204.b:0 "Send men to investigate the tracks properly."
agot_riverlands_bla.0204.b.investigation_tt:0 "You dispatch discreet scouts to quietly follow the tracks without provoking your rivals."
  agot_riverlands_bla.0204.b.real_tt:0 "The trail points toward your rivals."
 agot_riverlands_bla.0204.b.bandit_tt:0 "The theft appears to be the work of common bandits."
 agot_riverlands_bla.0204.b.false_tt:0 "The accusation was built on lies and useful fear."
agot_riverlands_bla.0204.c:0 "Double the guards on the border fences."
 agot_riverlands_bla.0204.d:0 "We have no proof, but blame them anyway."

 agot_riverlands_bla.02040.t:0 "The Trail Revealed"
 agot_riverlands_bla.02040.desc:0 "Your scouts slide from their saddles with mud-caked boots and exhausted mounts. Though battered by the riverbank rain, they bring back a definitive answer regarding the missing horses."
 agot_riverlands_bla.02040.a:0 "So, the truth comes to light at last."

 agot_riverlands_bla.02041.t:0 "The Hidden Trail Uncovered"
 agot_riverlands_bla.02041.desc:0 "Following days of careful inquiries in local taverns and analyzing rain-washed hoofprints, your scouts slip back into the keep. They have successfully pinpointed exactly where the missing herd went."
 agot_riverlands_bla.02041.a:0 "At last, the mystery is solved."

 # =========================================================
 # Event 0205: An Ultimatum of Steel
 # =========================================================

 agot_riverlands_bla.0205.t:0 "An Ultimatum of Steel"
 agot_riverlands_bla.0205.desc:0 "The time for courtly posturing has passed. Armed retainers are aggressively drilling in your courtyard, creaking leather and oiled mail are being hauled from armory chests, and your border guards refuse to ride out without a loaded crossbow. Your rival is waiting to see how far you will push, and the rest of the Riverlands watches to see who will blink first."
 agot_riverlands_bla.0205.a:0 "Demand a formal trial by combat."
 agot_riverlands_bla.0205.b:0 "Pay a standard blood price to settle the damages and avoid an all-out war."
 agot_riverlands_bla.0205.c:0 "Send discreet envoys to neighboring lords to secure military backing."
 agot_riverlands_bla.0205.d:0 "Barricade the border gates; we will not yield a single inch of mud."
 agot_riverlands_bla.0205.a.success_tt:0 "Your uncompromising demand cows your rivals and cements your martial reputation."
 agot_riverlands_bla.0205.a.wounded_tt:0 "The trial turns into a bloodbath, leaving your champion dead."
 agot_riverlands_bla.0205.b.tt:0 "A hefty transfer of gold temporarily pacifies your rivals, buying you breathing room."
 agot_riverlands_bla.0205.c.success_tt:0 "Sympathetic riverlords quietly pledge their spears and outriders to our cause."
 agot_riverlands_bla.0205.c.failure_tt:0 "Your secret letters are intercepted, exposing your desperate plotting to the entire realm."

 blackwood_bracken_failed_champion_bla:0 "Disgraced Vanguard"
 blackwood_bracken_failed_champion_bla_desc:0 "A catastrophic defeat in a trial by combat has thoroughly broken this house's martial prestige, proving your knights can be beaten by your ancient rivals."



 # =========================================================
 # Event 0206: The Liege’s Shadow
 # =========================================================
 agot_riverlands_bla.0206.t:0 "The Liege’s Shadow"
 agot_riverlands_bla.0206.desc:0 "The local squabbling has finally reached the ears of your liege lord. A rider has arrived bearing a formal summons to court. While the letter is packed with polite legal jargon about peace and King's justice, the subtext is simple: the Lord Paramount is sick of burying your men."
 agot_riverlands_bla.0206.a:0 "Ride to court and accept mediation."
 agot_riverlands_bla.0206.b:0 "Bring enough gifts to win the liege to our side."
 agot_riverlands_bla.0206.c:0 "Sign whatever peace they want, then ignore it at home."
 agot_riverlands_bla.0206.d:0 "No trout will tell us how to settle our blood."
 agot_riverlands_bla.0206.a.tt:0 "You accept a humiliating but stabilizing settlement."
 agot_riverlands_bla.0206.b.success_tt:0 "Your liege is swayed by your account."
 agot_riverlands_bla.0206.b.failure_tt:0 "Your performance fails to convince."
 agot_riverlands_bla.0206.c.success_tt:0 "Peace is spoken aloud while vengeance gathers below."
 agot_riverlands_bla.0206.c.failure_tt:0 "Your false compliance draws suspicion."
 agot_riverlands_bla.0206.d.tt:0 "You reject outside judgment and inflame the feud further."

 # =========================================================
 # Event 0207: The Embers Flare
 # =========================================================
 agot_riverlands_bla.0207.t:0 "The Embers Flare"
 agot_riverlands_bla.0207.desc:0 "The dispute has spilled out into the countryside. Three border hamlets have been abandoned, a mill was torched Tuesday night, and small skirmishes are breaking out in the woods. It is no longer a matter of law; it is a border war."
 agot_riverlands_bla.0207.a:0 "Burn two of their villages for every one of ours."
 agot_riverlands_bla.0207.b:0 "Call back the raiders before the smallfolk starve."
 agot_riverlands_bla.0207.c:0 "Send hired knives to strike them in the dark."
 agot_riverlands_bla.0207.a.tt:0 "Your retaliation scorches the borderlands."
 agot_riverlands_bla.0207.a.wounded_tt:0 "The violence reaches even you."
 agot_riverlands_bla.0207.b.tt:0 "A weary peace settles over the ashes."
 agot_riverlands_bla.0207.c.success_tt:0 "Your quiet retaliation finds its mark."
 agot_riverlands_bla.0207.c.failure_tt:0 "Your shadow war draws unwanted attention."

 # =========================================================
 # Event 0208: A Weary Sheathing
 # =========================================================

agot_riverlands_bla.0208.t:0 "A Weary Sheathing"
agot_riverlands_bla.0208.desc:0 "The violence has finally burned itself out. With too many fields ruined and too many able-bodied men dead or crippled, both sides have simply run out of the coin and blood required to keep fighting. The hatred remains, but the border is quiet."
 agot_riverlands_bla.0208.a:0 "Enjoy the respite while it lasts."
 agot_riverlands_bla.0208.b:0 "Keep the peace publicly, but look for a weakness."
 agot_riverlands_bla.0208.c:0 "Make it clear we will never forgive them."
 agot_riverlands_bla.0208.a.tt:0 "For a time, exhaustion does what mercy could not."
 agot_riverlands_bla.0208.b.tt:0 "You wear peace like a cloak while keeping a knife beneath it."
 agot_riverlands_bla.0208.c.tt:0 "The feud quiets, but your hatred does not."

  # =========================================================
 # Event 0209: Songs of Red and Black
 # =========================================================
  agot_riverlands_bla.0209.t:0 "Songs of Red and Black"
 agot_riverlands_bla.0209.desc:0 "The wandering singers have taken up the old refrains again. In low taverns and high keeps alike, ancient verses are being sung with our family names swapped into the lyrics. Children are learning to hate our neighbors for wrongs done centuries ago, and green boys who have never held a steel blade are already bragging about the blood they intend to spill."
 agot_riverlands_bla.0209.a:0 "Fill the singers' purses. The realm must remember what we are owed."
 agot_riverlands_bla.0209.b:0 "Silence the harps. We have had enough of these bloody verses."
 agot_riverlands_bla.0209.c:0 "Whisper a different version into the master's ear to reshape the rhyme."
 agot_riverlands_bla.0209.a.tt:0 "The new songs ensure that your people do not forget the old hatreds."
 agot_riverlands_bla.0209.b.tt:0 "You attempt to suppress the songs before they incite further violence."
 agot_riverlands_bla.0209.c.success_tt:0 "Your version of the tragedy spreads, casting your rivals as the sole monsters."
 agot_riverlands_bla.0209.c.failure_tt:0 "Your attempt to rewrite the ballad is exposed and mocked."


blackwood_bracken_rekindled_hatred_bla:0 "Rekindled Hatred"
blackwood_bracken_rekindled_hatred_bla_desc:0 "Old wounds have been torn open once more, and every slight now carries the promise of retaliation."

blackwood_bracken_fragile_truce_bla:0 "Fragile Truce"
blackwood_bracken_fragile_truce_bla_desc:0 "The bloodshed has quieted for now, though no one truly believes the peace will last."

blackwood_bracken_secret_feud_bla:0 "Secret Feud"
blackwood_bracken_secret_feud_bla_desc:0 "The feud continues in whispers, hidden riders, and quiet promises of vengeance."

blackwood_bracken_old_gods_fervor_bla:0 "Old Gods Fervor"
blackwood_bracken_old_gods_fervor_bla_desc:0 "The ancient gods are invoked once more against old enemies and newer insults alike."

blackwood_bracken_andal_righteousness_bla:0 "Andal Righteousness"
blackwood_bracken_andal_righteousness_bla_desc:0 "The traditions of the Andals are wielded as both shield and accusation in the ancient feud."

blackwood_bracken_border_patrols_bla:0 "Border Patrols"
blackwood_bracken_border_patrols_bla_desc:0 "Mounted patrols now ride the disputed roads and river crossings day and night."

blackwood_bracken_border_victory_bla:0 "Border Victory"
blackwood_bracken_border_victory_bla_desc:0 "A successful reprisal along the border has strengthened confidence among retainers and sworn men."

blackwood_bracken_dueling_reputation_bla:0 "Dueling Reputation"
blackwood_bracken_dueling_reputation_bla_desc:0 "This ruler has become known for answering insults with drawn steel."

blackwood_bracken_forced_truce_bla:0 "Forced Truce"
blackwood_bracken_forced_truce_bla_desc:0 "Peace has been imposed from above, though resentment lingers beneath every courteous word."

blackwood_bracken_open_raids_bla:0 "Open Raids"
blackwood_bracken_open_raids_bla_desc:0 "The feud has descended into retaliatory raids, reprisals, and open destruction."

blackwood_bracken_burning_borderlands_bla:0 "Burning Borderlands"
blackwood_bracken_burning_borderlands_bla_desc:0 "Fields burn, ferries rot, and villages empty as the feud consumes the borderlands."

blackwood_bracken_wearied_peace_bla:0 "Wearied Peace"
blackwood_bracken_wearied_peace_bla_desc:0 "Too many graves and too many burned halls have left even bitter rivals longing for silence."

blackwood_bracken_legacy_of_hatred_bla:0 "Legacy of Hatred"
blackwood_bracken_legacy_of_hatred_bla_desc:0 "Songs, stories, and whispered lessons ensure that old grievances are never truly forgotten."

blackwood_bracken_secret_networks_bla:0 "Secret Networks"
blackwood_bracken_secret_networks_bla_desc:0 "Messengers, informants, and hidden allies quietly feed the feud from the shadows."
