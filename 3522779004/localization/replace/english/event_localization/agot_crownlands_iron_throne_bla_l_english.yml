l_english:

agot_crownlands_bla.1100.t:0 "The Roads to the Capital"

agot_crownlands_bla.1100.desc:0 "A city as vast as King's Landing consumes more each day than its walls could ever provide.\n\nGrain comes by wagon. Cattle are driven along muddy roads. Timber arrives from distant woods, while merchants, royal messengers, pilgrims, soldiers, and petitioners compete for space upon the same routes.\n\nMy officials report that several roads through the Crownlands have deteriorated badly. Bridges require repair. Bandits have learned which stretches are poorly watched. Wagons arrive late, when they arrive at all.\n\nThe Iron Throne may command the Seven Kingdoms.\n\nIts supper still has to reach the kitchen."

agot_crownlands_bla.1100.a:0 "The crown will rebuild the roads."
agot_crownlands_bla.1100.b:0 "What good is a road that is not safe?"
agot_crownlands_bla.1100.c:0 "Those who use royal roads can pay for them."
agot_crownlands_bla.1100.d:0 "The Crownlords will maintain the roads through their own lands."

agot_crownlands_royal_roads_bla:0 "Royal Roads Renewed"
agot_crownlands_royal_roads_bla_desc:0 "The crown has invested heavily in maintaining the roads and bridges that bind King's Landing to the surrounding Crownlands."

agot_crownlands_guarded_roads_bla:0 "Guarded Roads"
agot_crownlands_guarded_roads_bla_desc:0 "Patrols and watch posts have been strengthened along the principal approaches to King's Landing."

agot_crownlands_road_tolls_bla:0 "Royal Road Tolls"
agot_crownlands_road_tolls_bla_desc:0 "The crown has imposed additional charges upon merchants and travelers using the busiest roads around King's Landing."

agot_crownlands_lords_keep_the_roads_bla:0 "Crownlord Road Duties"
agot_crownlands_lords_keep_the_roads_bla_desc:0 "The lords surrounding King's Landing have been reminded that maintaining the roads through their lands is part of their obligation to the Iron Throne."

agot_crownlands_bla.1101.t:0 "Lords of the Crownlands"

agot_crownlands_bla.1101.desc:0 "A lord complains of grazing rights. Another insists that a boundary stone has been moved. A third claims that men bearing his neighbor's colors have been cutting timber where they have no right to cut it.\n\nNone of these disputes threatens the realm.\n\nThat is precisely why they have reached me.\n\nElsewhere, a great lord might settle such quarrels among lesser vassals. The Crownlords possess no such intermediary. Their lands surround the royal seat, and their grievances eventually find their way to the throne itself.\n\nA monarch may rule seven kingdoms and still spend the morning arguing over a stand of oak trees."

agot_crownlands_bla.1101.a:0 "Hear them patiently. Their loyalty is worth the time."
agot_crownlands_bla.1101.b:0 "Establish clear judgments and make them abide by them."
agot_crownlands_bla.1101.c:0 "A little rivalry keeps any one Crownlord from growing too bold."
agot_crownlands_bla.1101.d:0 "Remind them whose peace they are disturbing."

agot_crownlands_first_among_crownlords_bla:0 "First Among the Crownlords"
agot_crownlands_first_among_crownlords_bla_desc:0 "The ruler has cultivated a personal relationship with the lords whose lands surround the royal seat."

agot_crownlands_royal_arbitration_bla:0 "Royal Arbitration"
agot_crownlands_royal_arbitration_bla_desc:0 "Disputes among the Crownlords are being subjected to consistent royal judgment rather than allowed to fester."

agot_crownlands_divided_crownlords_bla:0 "Divided Crownlords"
agot_crownlands_divided_crownlords_bla_desc:0 "The crown quietly permits rivalries among its nearby vassals, ensuring that none becomes too comfortable acting without royal favor."

agot_crownlands_royal_authority_bla:0 "Authority over the Crownlands"
agot_crownlands_royal_authority_bla_desc:0 "The lords surrounding King's Landing have been firmly reminded that the King's Peace begins immediately beyond the capital's walls."

agot_crownlands_bla.1102.t:0 "The Price of the Red Keep"

agot_crownlands_bla.1102.desc:0 "A royal palace is apparently incapable of being finished.\n\nOne hall requires new hangings. Another needs repairs. The kitchens demand additional ovens. A courtier insists that foreign envoys have noticed the age of several carpets, while my steward has produced a list of household offices whose expenses appear to grow whenever nobody is looking.\n\nThe Red Keep houses the ruler of the Seven Kingdoms. It must impress those who enter it.\n\nIt must also function.\n\nPreferably without consuming the treasury."

agot_crownlands_bla.1102.a:0 "Let every visitor understand the magnificence of this throne."
agot_crownlands_bla.1102.b:0 "Spend where it makes the court function better."
agot_crownlands_bla.1102.c:0 "Improve the passages, guards, locks, and private chambers."
agot_crownlands_bla.1102.d:0 "The realm needs a ruler, not new carpets."

agot_crownlands_splendor_of_the_red_keep_bla:0 "Splendor of the Red Keep"
agot_crownlands_splendor_of_the_red_keep_bla_desc:0 "Considerable expense has been devoted to ensuring that the royal court visibly reflects the dignity of the Iron Throne."

agot_crownlands_working_palace_bla:0 "A Working Palace"
agot_crownlands_working_palace_bla_desc:0 "Royal expenditure has been directed toward administration, household efficiency, and the less glamorous necessities of governing a realm."

agot_crownlands_quiet_red_keep_bla:0 "The Quiet Red Keep"
agot_crownlands_quiet_red_keep_bla_desc:0 "Resources have been directed toward making the royal residence more secure, private, and difficult for unwanted eyes and ears to penetrate."

agot_crownlands_frugal_court_bla:0 "A Frugal Royal Court"
agot_crownlands_frugal_court_bla_desc:0 "Unnecessary court expenses have been cut sharply. The treasury approves, even if some courtiers do not."

agot_crownlands_bla.1103.t:0 "Petitioners at the Gate"

agot_crownlands_bla.1103.desc:0 "Three petitions await me before the morning audience has properly begun.\n\nSeveral farmers from the Crownlands claim that passing soldiers requisitioned animals without adequate payment. A delegation of merchants wants new privileges upon the roads leading into King's Landing. Behind them waits a landed knight who insists that one of my Crownlords has seized rights belonging to his family since before the Conquest.\n\nAll three insist their matter cannot possibly wait.\n\nBeyond the doors are dozens more.\n\nThere are days when ruling the Seven Kingdoms seems less like sitting the Iron Throne and more like being the only person in Westeros nobody is permitted to tell, 'Ask someone else.'"

agot_crownlands_bla.1103.a:0 "I will hear them. One at a time."
agot_crownlands_bla.1103.b:0 "My officials exist for precisely this reason."
agot_crownlands_bla.1103.c:0 "Before granting anything, discover what each petitioner is not telling me."
agot_crownlands_bla.1103.c.success:0 "A little investigation reveals that at least one petitioner has omitted facts decidedly unfavorable to their case"
agot_crownlands_bla.1103.c.failure:0 "The investigation produces rumors, contradictions, and very little that makes the petitions easier to judge"

agot_crownlands_bla.1103.d:0 "The Iron Throne cannot adjudicate every dead cow in the Crownlands."

agot_crownlands_open_royal_audience_bla:0 "Open Royal Audience"
agot_crownlands_open_royal_audience_bla_desc:0 "The ruler has developed a reputation for personally hearing grievances that lesser monarchs might leave entirely to officials."

agot_crownlands_ordered_petitions_bla:0 "Ordered Royal Petitions"
agot_crownlands_ordered_petitions_bla_desc:0 "A more disciplined system has been established for filtering, investigating, and resolving petitions before they consume the ruler's attention."

agot_crownlands_distant_throne_bla:0 "A Distant Throne"
agot_crownlands_distant_throne_bla_desc:0 "The ruler has little patience for minor grievances that should have been resolved long before reaching the royal court."

agot_crownlands_bla.1104.t:0 "The King's Own Lands"

agot_crownlands_bla.1104.desc:0 "The map before me shows seven kingdoms, yet the lands nearest my hand belong neatly to none of them.\n\nDriftmark and Claw Isle guard the waters. Duskendale looks toward its harbor. Rosby and Stokeworth sit upon the approaches to King's Landing. Massey's Hook reaches into the sea, while Crackclaw Point remains a country unto itself whenever its people can manage it.\n\nThese are the Crownlands.\n\nThey possess no Lord Paramount between their castles and my throne. Their fortunes are bound more closely to King's Landing than those of any distant lord, and when enemies come for the capital it is their fields, roads, villages, and shores they cross first.\n\nThe Iron Throne rules a realm stretching from the Wall to the Dornish marches.\n\nBut every ruler must decide what to make of the lands immediately beyond the gates."

agot_crownlands_bla.1104.a:0 "These are the crown's lands. Govern them accordingly."
agot_crownlands_bla.1104.b:0 "The Crownlords should be our closest partners."
agot_crownlands_bla.1104.c:0 "The Crownlands will be the shield around King's Landing."
agot_crownlands_bla.1104.d:0 "Make them the administrative heart of the realm."

agot_crownlands_royal_domain_bla:0 "The Royal Domain"
agot_crownlands_royal_domain_bla_desc:0 "The Crownlands are being governed first and foremost as the immediate domain surrounding the royal seat."

agot_crownlands_loyal_crownlords_bla:0 "Loyal Crownlords"
agot_crownlands_loyal_crownlords_bla_desc:0 "The ruler has cultivated the Crownlords as trusted partners whose proximity to King's Landing gives their loyalty unusual importance."

agot_crownlands_shield_of_the_capital_bla:0 "Shield of the Capital"
agot_crownlands_shield_of_the_capital_bla_desc:0 "The Crownlands are being treated as the first defensive belt protecting King's Landing from threats by land and sea."

agot_crownlands_heart_of_the_realm_bla:0 "Heart of the Realm"
agot_crownlands_heart_of_the_realm_bla_desc:0 "The roads, ports, estates, and officials of the Crownlands are being developed as the administrative hinterland of the royal capital."