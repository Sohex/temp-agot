l_english:
 
 # Decisions
  reclaim_castamere_decision:0 "Reclaim Castamere"
  reclaim_castamere_decision_desc:0 "You hold Castamere again, but its legacy lies buried. Proclaim the rebirth of House Reyne and stake your family's claim to the ruins."
  reclaim_castamere_decision_tooltip:0 "Restore the name and honor of House Reyne."
  reclaim_castamere_decision_confirm:0 "Let all Westeros hear the Red Lion's roar."
  ruins_drained_requirement_tt:0 "The ruins of Castamere have been drained."

# ==========================================
# EVENT 1000: THE RUINS OF CASTAMERE
# ==========================================
agot_reyne_excavation.1000.t:0 "Castamere: Breaking the Earth"
agot_reyne_excavation.1000.desc:0 "Castamere is finally back in your grasp, but it is little more than a hollow scar on the Westerlands. Above ground, the stone keeps are blackened, crumbling ruins. Below your feet lies the real nightmare: miles of subterranean mines, deliberately flooded and sealed shut by Tywin Lannister to entomb your ancestors alive.\n\nYour master of works has assembled hundreds of laborers equipped with massive copper siphons and leather buckets. Pumping out millions of gallons of stagnant river-mud will be a ruinous, stomach-churning task. Do you dare break the king's seal and unearth the dead?"
agot_reyne_excavation.1000.a:0 "Bring up the pumps. I want the water cleared from my halls."
agot_reyne_excavation.1000.a.tt:0 "You commit gold and labor to begin draining the subterranean ruins of Castamere."
agot_reyne_excavation.1000.b:0 "Seal the gates. The mines are nothing but a tomb now."

# ==========================================
# EVENT 1010: TUNNELS OF THE FALLEN
# ==========================================
agot_reyne_excavation.1010.t:0 "Castamere: The Sunken Vaults"
agot_reyne_excavation.1010.desc:0 "The first tier of the mine has finally been drained, leaving behind a sickening, waist-deep slurry of gray river silt and rotting timber. Your miners push forward with sputtering torches, their boots splashing through the muck as they uncover the first defensive chamber.\n\nThe sight is horrific. Rusted suits of plate mail lie piled against the iron gatehouse doors, their wearers having clawed the wood raw in the pitch black as the riverwater rose to choke them. The air down here is foul, thick with the stench of ancient rot and stagnant pools."
agot_riverlands_bla_broken_knight_arrives_tt:0 "" # Fixed key reference string container
agot_reyne_excavation.1010.a:0 "Stop here. Pull the bones out for a proper burial and brick up the tunnel."
agot_reyne_excavation.1010.b:0 "Keep pumping. The Reyne treasury lay much deeper than this."

# ==========================================
# EVENT 1020: DEEPER INTO DARKNESS
# ==========================================
agot_reyne_excavation.1020.t:0 "Castamere: The Bleeding Strata"
agot_reyne_excavation.1020.desc:0 "You are deep beneath the earth now, in tunnels where the air is so thin that the torches barely stay lit. The stone walls here run thick with iron and copper veins, weeping a dark, rust-red moisture that looks exactly like fresh blood running down the stone faces.\n\nYour pick-axes finally shatter a massive slab of collapsed granite, revealing the private solar where the last Reynes retreated to escape the deluge. Silt chokes the room to the ceiling, but a glint of unblemished metal catches your eye from a half-buried oak table."
agot_reyne_excavation.1020.a:0 "Clear the rubble. Let us see what my ancestors left behind."
agot_reyne_excavation.1020.a.tt:0 "You force your way into the deepest, unlooted sanctuary of House Reyne."

# ==========================================
# EVENT 1030: LEGACY UNEARTHED
# ==========================================
agot_reyne_excavation.1030.t:0 "Castamere: The Red Lion Ramps"
agot_reyne_excavation.1030.desc:0 "Inside a waterlogged iron strongbox, miraculously protected from the worst of the silt, lies a magnificent signet ring. Forged from heavy red-gold and set with a raw, blood-red ruby, the snarling lion of House Reyne glares out from the metal, untouched by decades of dark and damp.\n\nThis ring was once worn by the lords who dared to mock Casterly Rock. Your fingers tremble as you wipe away the river mud. The Lannisters thought they sang the final verse of your house's song, but they left the melody unfinished."
agot_reyne_excavation.1030.a:0 "Slide the ring onto my finger. The Westerlands will fear the Red Lion once more."
agot_reyne_excavation.1030.a.tt:0 "You recover the legendary signet ring of House Reyne, vastly increasing your prestige and Westerlands claim power."

# ==========================================
# EVENT 1040: WHISPERS IN THE DEEP
# ==========================================
agot_reyne_excavation.1040.t:0 "Castamere: The Empty Echo"
agot_reyne_excavation.1040.desc:0 "The excavation is complete, but a suffocating, unnatural silence has settled over the drained chambers of Castamere. Your servants are terrified, swearing that when the wind howls through the ventilation shafts at night, it sounds like the muffled strains of 'The Rains of Castamere' mocking them from the empty mine shafts.\n\nYou know it is merely the tricks of the wind against hollow stone, but standing in the damp dark, the memory of Tywin's ruthlessness presses heavily against your chest. You are living in a grave."
agot_reyne_excavation.1040.a:0 "Let the ghosts whine. The Lannisters will soon learn what it means to be hunted."
agot_reyne_excavation.1040.a.tt:0 "The grim memory of your house's slaughter hardens your resolve, unlocking the 'Dreadful Vengeance' trait modifier."
agot_reyne_excavation.1040.b:0 "The lesson of this place is absolute. I will never allow my house to risk such ruin again."
agot_reyne_excavation.1040.b.tt:0 "The horror of Castamere teaches you caution, granting a permanent bonus to your scheme defense and fort level."


# Artifact
agot_reyne_ring_name:0 "The Red Lion's Ring"
agot_reyne_ring_desc:0 "Forged from heavy red-gold and set with a raw, blood-red ruby, this signet ring bears the snarling lion of House Reyne. Recovered from the drowned, silt-choked mines of Castamere decades after Tywin Lannister flooded them, the metal is permanently tarnished by river mud—a grim reminder of a house completely erased beneath the earth."

