l_english:

agot_riverlands_bla.0700.t:0 "The Scent of the Summer Sea"
agot_riverlands_bla.0700.desc:0 "The morning breeze blowing into Maidenpool carried the thick reek of boiling pitch, salted cod, and an intoxicating, suffocatingly sweet Essosi perfume long before the Lysene merchant galley cleared the breakwaters. By midday, half the waterfront had gathered along the pink stone docks to marvel at its bright, paint-striped hull. Foreign sailors are already staggering into the dockside wine sinks, hauling heavy chests of lace and sealed flagons that our port collectors were suspiciously forbidden from auditing.\n\nThe Essosi captain insists his ledgers hold nothing but honest trade. Our harbor master, however, whispers that the lower holds smell of golden collars, luxury bed-slaves, and the illicit alchemy of the Free Cities."

agot_riverlands_bla.0700.a:0 "Silver is silver. Unbolt the gates and let the market decide the price."
agot_riverlands_bla.0700.b:0 "Seize the vessel. We will audit every single board for contraband and poisons."
agot_riverlands_bla.0700.c:0 "Slap double customs on their hulls—our walls require maintenance."
agot_riverlands_bla.0700.d:0 "Order the City Watch to drive the slavers out of our bay immediately."

mooton_busy_harbor_bla:0 "Bay of Crabs Concourse"
mooton_busy_harbor_bla_desc:0 "The pink stone quays of Maidenpool are locked in a continuous crawl of maritime trade from dawn until midnight. Braavosi factor-princes haggle with local salt-merchants, foreign oarsmen pack the dockside alehouses, and our port collectors meticulously audit every single timber-crate that touches our piers."

agot_riverlands_bla.0701.t:0 "Chivalry Beneath the Pink Walls"
agot_riverlands_bla.0701.desc:0 "The bustling fishmarkets closed down before noon the moment the town heralds announced that the grand lists were being raised outside Maidenpool's gates. By dusk, the entire valley below our stone keep was choked with an enormous sprawl of silk pavilions, landless hedge knights, cutpurse gamblers, and opportunistic smallfolk selling watered wine at astronomical prices.\n\nOur elder knights are already whispering of the legendary tourney where Ser Criston Cole first unhorsed the greatest champions of the realm. Down by the harbor wharves, two hot-blooded southron squires have already drawn steel over a tavern wager before a single lance has even been lowered."

agot_riverlands_bla.0701.a:0 "Empty the treasury for the prizes! Let the realm see the wealth of the salmon."
agot_riverlands_bla.0701.b:0 "Lace my armor. The Lord of Maidenpool will ride in the lists today."
agot_riverlands_bla.0701.c:0 "Deploy the City Watch—tourneys are breeding grounds for treason."
agot_riverlands_bla.0701.d:0 "Shut the gates and levy a crushing gate-tax on every single knight who enters."

mooton_famous_tourney_bla:0 "Lists of the Pink City"
mooton_busy_harbor_bla_desc:0 "Weeks after the final champion was crowned, the pink stone streets are still packed with bankrupt hedge knights nursing cracked ribs, drunken squires brawling outside the wine sinks, and local armor-smiths charging exorbitant rates to repair broken plate mail."

agot_riverlands_bla.0702.t:0 "The Cough of the Spring Sickness"
agot_riverlands_bla.0702.desc:0 "The first few bloated corpses washing into the canal sluices were easy enough for our bailiffs to ignore—sailors die in dockside brawls every night. But this morning, half the market fishmongers began violently coughing black blood directly into the gutters, and the entire lower harbor now reeks of vinegar-rags, burning pitch, and absolute panic.\n\nOur maesters warn that the early symptoms mirror the catastrophic outbreaks of the great plagues. The visiting Lyseni factors are already blaming an Ibbenese whaling cog anchored offshore, while the hairy northern sailors claim the pollution was seeded in our own city aqueducts."

agot_riverlands_bla.0702.a:0 "Draft the smallfolk to burn the refuse, flush the gutters, and scrub the quays!"
agot_riverlands_bla.0702.b:0 "Seal the lower harbor—keep the healthy working and the silver flowing."
agot_riverlands_bla.0702.c:0 "Have the City Watch interrogate the foreign captains. Find who brought this rot."
agot_riverlands_bla.0702.d:0 "The ports are filthy. Let the weak die so the strong can inherit."

mooton_cleaned_harbor_bla:0 "Purged Slums of the Quay"
mooton_cleaned_harbor_bla_desc:0 "The filth-choked alleyways beneath the pink stone quays have finally been scraped clear of rotting offal, stagnant bilge-water, and collapsed fish stalls. The mud still reeks of dead kelp at low tide, but the City Watch is dragging far fewer bodies out of the canal ditches."

mooton_traced_harbor_sickness_bla:0 "Traced Harbor Sickness"
mooton_traced_harbor_sickness_bla_desc:0 "Someone followed the stink back through the lower harbor — past the sour water barrels, the sealed fish stalls, and the sailors who suddenly forgot which ship they came from."

mooton_quieted_docks_bla:0 "The Watchman's Silence"
mooton_quieted_docks_bla_desc:0 "An absolute, suffocating quiet has settled over the waterfront taverns. Dockworkers quickly lower their voices the moment our iron-capped guards pass, and tavern keepers have masterfully learned to stop asking questions that will earn them a cell."

agot_riverlands_bla.0703.t:0 "A Sharp Tongue in the Wine Sinks"
agot_riverlands_bla.0703.desc:0 "The wandering minstrel first appeared down by the low-tier harbor wharves, wielding a battered wood-and-wire lute and a voice loud enough to slice through the drunken brawling of foreign oarsmen. Three nights later, his identical satirical verses were being repeated inside our merchant guildhalls, our garrison barracks, and even our private castle kitchens.\n\nOur captain of the guard warns that this vagabond isn't merely talented—his songs contain precise, dangerous details regarding our tax tallies, small council appointments, and private household vices that only a well-paid informant could discover."

agot_riverlands_bla.0703.a:0 "Offer him a silk cloak and a permanent seat at my table. Let him spy for us."
agot_riverlands_bla.0703.b:0 "A clever minstrel tracks many secrets. Place a paid agent to shadow him."
agot_riverlands_bla.0703.c:0 "Have the City Watch break his lute and throw him into the dungeons."
agot_riverlands_bla.0703.d:0 "I have absolutely no patience for wandering beggars. Hang him by the quays."

mooton_favored_singer_bla:0 "The Court's Informant"
mooton_favored_singer_bla_desc:0 "The traveling minstrel has become a permanent, suspicious fixture inside our high halls and dockside wine sinks alike. Half the city claims to know his latest verse before the week is out, though our master spy-runners note that the political subtext changes with every single coin he pockets."
mooton_silenced_singer_bla:0 "Silenced Harbor Songs"
mooton_silenced_singer_bla_desc:0 "The singer's verses vanished from Maidenpool as quickly as they had spread. A few say gold bought the silence. Others say it was fear. Either way, the harbor has grown quieter since."

agot_riverlands_bla.0704.t:0 "Inferno on the Waterfront"
agot_riverlands_bla.0704.desc:0 "The midnight alarm bells shattered the silence of Maidenpool as an out-of-control blaze tore through the lower harbor wharves. By dawn, half the crowded fishmarkets had collapsed into a smoking graveyard of blackened cedar beams, melted tallow, and boiling mud, sending thick columns of soot drifting across the Bay of Crabs.\n\nNow, the merchant factors are screaming obscenities over their lost cargo, the displaced dock-laborers are aggressively demanding compensation, and the entire lower city stinks of charred eel and water-damaged timber."

agot_riverlands_bla.0704.a:0 "Pour gold into the masonry! Rebuild the district with strict, defensible stone."
agot_riverlands_bla.0704.b:0 "Levy a crushing new wharf-tax. The guilds will fund their own recovery."
agot_riverlands_bla.0704.c:0 "Have the City Watch lock the gates. Fires do not ignite without a rival's coin."
agot_riverlands_bla.0704.d:0 "Let the dregs scavenge the ash. The pink walls protect the castle, not the mud."

mooton_rebuilt_market_bla:0 "Restored Quayside Bazaar"
mooton_rebuilt_market_bla_desc:0 "The fire-gutted fishmarkets have been thoroughly rebuilt with solid stone foundations, widened thoroughfares, and reinforced masonry fire-breaks designed to prevent the next harbor inferno from devouring our lucrative custom-houses."

mooton_higher_market_fees_bla:0 "Gilded Wharf Extortion"
mooton_higher_market_fees_bla_desc:0 "The local urban merchant guilds howl with rage over our predatory new harbor tariffs every morning, usually while desperately handing their silver over to our port collectors."



