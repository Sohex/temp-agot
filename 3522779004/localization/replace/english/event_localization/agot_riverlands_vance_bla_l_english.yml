l_english:


 agot_riverlands_bla.0800.t: "The Shadow of Armistead"
 agot_riverlands_bla.0800.desc: "A map of the Trident lies unrolled before you. Your maester points to Riverrun, noting idly that the mud-palace of the Tullys sits on land given to them by our ancestor, Armistead Vance. Today, we field more swords than our liege, yet we bend the knee to the trout. A historic generosity, or an ancient mistake?"
 agot_riverlands_bla.0800.a: "We are the true power in the Riverlands."
 agot_riverlands_bla.0800.b: "Honor demands we respect the old pacts."
 agot_riverlands_bla.0800.c: "The river will run red before the trout rules the dragon."
 agot_riverlands_bla.0800.d: "Remind Lord Tully of his debts. Politely."
agot_riverlands_bla.0800.c.tt:0 "The dragons of Vance do not bow to fish. Our defiance today lays the foundation to eventually cast the Tullys down and claim Riverrun as our own."
 agot_riverlands_bla.0800.d.success_tt: "You successfully leverage history to charm your liege lord."
 agot_riverlands_bla.0800.d.failure_tt: "Lord Tully sees through your honeyed words and grows wary."


 agot_riverlands_bla.0801.t: "The Twin Dragons"
 agot_riverlands_bla.0801.desc: "A messenger arrives from our cousins. The eternal bickering between Wayfarer's Rest and Atranta has aired up once more over a boundary stone. They mock our sigil, claiming their dragon flies higher than ours. The blood of the dragon does not brook insults from cadet branches."
 agot_riverlands_bla.0801.a: "Teach our cousins their proper place."
 agot_riverlands_bla.0801.b: "Offer a marriage to heal the ancient rift."
 agot_riverlands_bla.0801.c: "Execute the messenger and send his head back in a box."
 agot_riverlands_bla.0801.d: "Fabricate a scandal to ruin their reputation instead."
 agot_riverlands_bla.0801.d.success_tt: "Your whispers succeed, utterly destroying your cousin's standing while giving you supreme leverage."
 agot_riverlands_bla.0801.d.failure_tt: "Your agents are caught, dragging your entire dynasty's name through the mud."

 vance_family_reconciliation_bla:0 "A Truce of Two Dragons"
 vance_family_reconciliation_bla_desc:0 "Diplomacy, strategically placed gold, and marriage ties have successfully muzzled the ancient bickering of our cadet branches. A tense, lucrative solidarity blankets the house."

 agot_riverlands_bla.0802.t: "The Dragon Masters"
 agot_riverlands_bla.0802.desc: "While inspecting the armory, your master-at-arms presents a beautifully restored shield bearing your house crest. The dragons look fierce, almost alien in their design. A traveling singer notes that the old tales speak of a time when the Vances were not mere lords, but 'The Dragon Masters' of a strange, forgotten world."
 agot_riverlands_bla.0802.a: "A grand tale! Let our knights embody it."
 agot_riverlands_bla.0802.b: "Keep the dragons on the shield, and the fairy tales in the books."
 agot_riverlands_bla.0802.c: "This is clearly a corruption of ancient Valyrian lore."
 agot_riverlands_bla.0802.d: "Search the oldest scrolls for the truth behind this myth."
 agot_riverlands_bla.0802.c.valyrian_tt: "Your cynical and academic analysis links the fable back to historical dragonlord migrations."
 agot_riverlands_bla.0802.d.success_tt: "You uncover a beautifully preserved scroll detailing ancestral lineage, expanding your prestige."
 agot_riverlands_bla.0802.d.failure_tt: "You empty your pockets on a pile of rotting, unreadable parchment sold by a fraudulent scholar."

 vance_dragon_parchment_name:0 "The Dragon-Ink Chronicles"
 vance_dragon_parchment_desc:0 "A collection of heavy, yellowed sheepskin vellum, bound in crackling black leather. The text is written in an archaic script, painstakingly translating old Andal songs alongside detailed, soot-stained sketches of dragonlord bloodlines."

 vance_dragon_parchment_modifier:0 "The Dragon-Ink Chronicles"
 vance_dragon_parchment_modifier_desc:0 "Our scholars have painstakingly reconciled ancient fables with Valyrian histories, casting a brilliant and terrifying aura around our dynastic lineage."

 agot_riverlands_bla.0803.t: "The Golden Eyes of Liane"
 agot_riverlands_bla.0803.desc: "A mysterious merchant passing through your lands offers you a peculiar golden ring. It perfectly matches the twin eyes emblazoned on your house banners. He whispers that the ring belonged to Liane, a rogue of old, and that wearing it allows a man to see through walls, masks, and lies."
 agot_riverlands_bla.0803.a: "Slip it on. Let us see what my courtiers are hiding."
 agot_riverlands_bla.0803.b: "This is sorcery. Melt down the gold."
 agot_riverlands_bla.0803.c: "Arrest this merchant for peddling witchcraft and lies."
 
agot_riverlands_bla.0803.a.safe_tt:0 "The encounter leaves you unsettled, but otherwise unchanged."
agot_riverlands_bla.0803.a.paranoid_existing_tt:0 "The golden eyes speak whispers and truths that you already knew. Vigilance is an old friend."
agot_riverlands_bla.0803.a.trusting_to_paranoid_tt:0 "Whatever trust remained in your heart withers beneath those golden eyes. You lose [GetTrait('trusting').GetName( GetNullCharacter )] and gain [GetTrait('paranoid').GetName( GetNullCharacter )]."
agot_riverlands_bla.0803.a.paranoid_tt:0 "The memory of those golden eyes lingers long after the meeting ends. You gain the [GetTrait('paranoid').GetName( GetNullCharacter )] trait."

 agot_riverlands_bla.0804.t: "Whispers from the Gods Eye"
 agot_riverlands_bla.0804.desc: "Standing on the battlements, you look out across the misty waters of the Gods Eye. The wind howling off the lake carries strange, echoing whispers. You remember the old tales—how King Jaehaerys landed his great dragon Vermithor right where you stand, and how the mysterious Green Men watch from the lake’s center."
 agot_riverlands_bla.0804.a: "Peer deeper into the mists."
 agot_riverlands_bla.0804.a.safe_tt:0 "You turn back from the abyss shaken, but your mind remains intact."
 agot_riverlands_bla.0804.a.lunatic_tt:0 "Something within you snaps beneath the sheer weight of what you witnessed. You slide helplessly into the abyss of #V madness#!."
 agot_riverlands_bla.0804.a.lunatic_existing_tt:0 "The ancient fracture in your mind widens, transforming your inner chaos into terrifyingly sharp, forbidden #V clarity#!."
 agot_riverlands_bla.0804.b: "Turn back inside. The lake air is catching up to me."
 agot_riverlands_bla.0804.c: "Pray to the Old Gods for a sign."
 agot_riverlands_bla.0804.d: "The mists are a hazard. Build a system of signal fires along the shore."
 agot_riverlands_bla.0804.d.success_tt: "Your brilliant engineering project tames the shorelines, boosting coastal development and trade speed."
 agot_riverlands_bla.0804.d.failure_tt: "You waste substantial treasury funds on heavy wood and signal fires that immediately drown in the damp fog."

vance_signal_fires_modifier:0 "Gods Eye Signal Fires"
vance_signal_fires_modifier_desc:0 "Signal fires and watchposts now watch the mists and roads around the Gods Eye."

 agot_riverlands_bla.0805.t: "The Toll at the Golden Tooth"
 agot_riverlands_bla.0805.desc: "A heavily guarded Lannister merchant caravan approaches your gates, seeking passage through the hills below the Golden Tooth. They offer the standard toll, but their carts groan under the weight of Casterly Rock gold. As a Vance holding the western roads, you dictate the price of passage."
 agot_riverlands_bla.0805.a: "Double the toll. The lions can afford it."
 agot_riverlands_bla.0805.b: "Seize the caravan! They are smuggling weapons."
 agot_riverlands_bla.0805.c: "Squeeze them dry, then blackmail them over their unsafe routes."
 agot_riverlands_bla.0805.d: "Ambush them in the mountain pass and frame cutthroats for it."
 agot_riverlands_bla.0805.d.success_tt: "Your vanguard executes a flawless assault in the dark. The gold is yours,  and dead men carry no tales to Casterly Rock."
 agot_riverlands_bla.0805.d.failure_tt: "A surviving merchant escapes the massacre. House Lannister uncovers your treasonous ambush, publicly ruining your fame."

vance_seized_westerland_caravan_bla:0 "Spoils of the Westerlands"
vance_seized_westerland_caravan_bla_desc:0 "A massive train of Casterly Rock gold was intercepted under color of 'toll enforcement.' Coin flows like wine through our halls, though the Lannisters are quietly sharpening their swords."

vance_exposed_border_extortion_bla:0 "The Highwayman of Wayfarer's Rest"
vance_exposed_border_extortion_bla_desc:0 "A clumsy, failed attempt to plunder western merchants has left this ruler exposed to the realm as a common brigand rather than a true lord."

agot_riverlands_bla.0810.t:0 "The Riverlords Watch"
agot_riverlands_bla.0810.desc:0 "Word of your ambitions has begun to spread beyond your own halls.\n\nSome riverlords whisper that House Vance remembers old honors too well. Others quietly wonder whether Riverrun has grown complacent beneath the trout banners.\n\nFor now, the Riverlands only watches.\n\nBut rivers have a habit of changing course."

agot_riverlands_bla.0810.a:0 "Then let the Trident decide who should rule it."
agot_riverlands_bla.0810.b:0 "Ambition is a dangerous thing. Rethink this provocation."
agot_riverlands_bla.0810.c:0 "Quietly gather support before the challenge comes."

agot_riverlands_bla.0810.a.tt:0 "Your ambitions toward Riverrun become increasingly difficult to conceal."

agot_riverlands_bla.0810.c.tt:0 "You will continue building support among dissatisfied riverlords in secret."

 agot_riverlands_bla.0811.t: "The Call to the Trident"
 agot_riverlands_bla.0811.desc: "The die is cast. Your open defiance has sent shockwaves from the Red Fork to the Bay of Crabs. Lord Tully’s ravens fly fast, branding you a petulant rebel to any lord who will listen. In the armory of Wayfarer's Rest, your captains stand over a map of the Riverlands, matching swords against trout. If we are to take Riverrun, we must secure the borders now before our liege calls his banners."
 agot_riverlands_bla.0811.a: "Empty the vaults. Hire every sellsword between here and Duskendale."
 agot_riverlands_bla.0811.b: "Send a diplomatic envoy to placate Riverrun while we consolidate."
 agot_riverlands_bla.0811.c: "Let the riverlords look upon our blades and tremble. They will join us, or burn."
 agot_riverlands_bla.0811.b.success_tt: "Your honeyed words confuse the Tully court, buying you precious time."
 agot_riverlands_bla.0811.b.failure_tt: "The Tullys see right through your desperate envoy, painting you as a reckless coward to your peers."

 agot_riverlands_bla.0812.t: "Ravens in the Dark"
 agot_riverlands_bla.0812.desc: "While the Tullys feast blindly in their great hall, your whisperers are hard at work. Half a dozen minor riverlords have quietly pledged their support, their signatures drying on secret parchments hidden beneath your floorboards. But a conspiracy cannot feed on promises alone. To truly break the trout's hold on the Riverlands, we must strike at their legitimacy from the shadows."
 agot_riverlands_bla.0812.a: "Fabricate a ledger proving the Tullys are embezzling the King's taxes."
 agot_riverlands_bla.0812.b: "Let the network simmer. There is gold to be made in the delay."
 agot_riverlands_bla.0812.c: "Secure the loyalty of our new allies through blood vows and heavy drinking."
 agot_riverlands_bla.0812.a.success_tt: "The forged ledgers ruin Lord Tully's standing across the realm."
 agot_riverlands_bla.0812.a.failure_tt: "A careless spy drops the forged parchment, making Riverrun deeply suspicious of your activities."
 agot_riverlands_bla.0812.c.tt:0 "A hidden knife is drawn in the dark. Bound by blood and wine, another lord quietly aligns their house with our grand ambitions."

agot_riverlands_bla.0814.t:0 "Ravens in the Dark"
agot_riverlands_bla.0814.success.desc:0 "The forged letters find their way into the right hands before dawn. By morning, men who once spoke of Riverrun with easy loyalty are asking quieter questions. Nobody names you openly, but suspicion has begun to crawl beneath the trout banners."
agot_riverlands_bla.0814.failure.desc:0 "The scheme frays before it can take root. One seal is pressed too deeply, one hand writes too cleanly, one servant remembers a face he should have forgotten. By noon, Riverrun has heard enough to suspect your involvement."
agot_riverlands_bla.0814.a:0 "So the river carries word."



challenge_riverrun_bla:0 "Cast Down the Trout"
challenge_riverrun_bla_desc:0 "The mud-palace of Riverrun sits on land granted by our Andal ancestors, yet the Tullys rule while the Vances bleed. They are lords of ink and parchment, not steel. It is time to remind the Trident that the true power in the Riverlands flies on draconic wings, not swimming in a stream."
challenge_riverrun_bla_confirm:0 "Let the rivers run red."
challenge_riverrun_bla_tooltip:0 "Set your schemes into motion to strip House Tully of their lordship and claim dominion over the Riverlands."
agot_riverlands_bla.challenge_riverrun_outcomes_tt:0 "The river currents are unpredictable:\n• The lesser lords of the Trident may quietly rally to your banners.\n• Your pride could backfire, leaving your house dangerously isolated against the wrath of Riverrun."



vance_dragon_knights_modifier:0 "Legacy of the Twin Dragons"
vance_dragon_knights_modifier_desc:0 "The knights of House Vance still train beneath tales of dragons and ancient river kings."

liane_golden_eyes_modifier:0 "The Golden Eyes of Liane"
liane_golden_eyes_modifier_desc:0 "Whispers, glances, and hidden motives seem easier to read beneath the gaze of the old golden ring."

vance_righteous_rule_modifier:0 "Righteous Rule"
vance_righteous_rule_modifier_desc:0 "Justice and honest judgment have strengthened local faith in this ruler."

vance_gods_eye_piety_modifier:0 "Whispers from the Gods Eye"
vance_gods_eye_piety_modifier_desc:0 "The strange mists and quiet waters near the Gods Eye have left a lasting mark upon this ruler."

vance_hardened_border_tolls_bla:0 "Hardened Border Tolls"
vance_hardened_border_tolls_bla_desc:0 "Travelers and merchants alike now pay heavily to pass along these guarded roads."

vance_ordered_border_trade_bla:0 "Ordered Border Trade"
vance_ordered_border_trade_bla_desc:0 "Careful administration and reliable toll collection have strengthened commerce along the western roads."

vance_rallying_support_bla:0 "Whispers Across the Trident"
vance_rallying_support_bla_desc:0 "Hidden promises, secret ravens, and ancient debts stir quietly along the riverbanks as the foundation for a new order is laid."

vance_gathered_river_support_bla:0 "The Dragon's Shadow"
vance_gathered_river_support_bla_desc:0 "A loose network of minor riverlords has begun to drift away from the Tullys, looking to the strength of House Vance for protection."

vance_isolated_claimant_bla:0 "The Hubris of the Dragon"
vance_isolated_claimant_bla_desc:0 "The riverlords view our ambitions as reckless folly, closing their gates and leaving our house dangerously exposed to our liege's wrath."





