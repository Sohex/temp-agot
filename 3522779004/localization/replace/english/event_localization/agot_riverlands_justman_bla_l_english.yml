l_english:

 # =========================================================
 # 1001 - A Relic of Silt
 # =========================================================
 agot_riverlands_bla.1001.t:0 "A Relic of Silt"
 agot_riverlands_bla.1001.desc:0 "A muddy ditch worker presents you with a mangled, blackened band of bronze, twisted by time and heavily encrusted with river clay. At first glance, it looks like worthless scrap metal, but your maester drops his quill and grows deathly quiet when he traces the crude, interlocking scales worked into its inner edge.\n\nYour courtiers begin to whisper that this was once a relic of the River Kings. House Justman ruled the Trident with a scale and gavel where others ruled by the torch and blood feud. Even crushed in the mud, such a relic carries the immense weight of a stolen kingdom."
 agot_riverlands_bla.1001.a:0 "Cleanse the bronze and display it proudly; let the realm see what was buried."
 agot_riverlands_bla.1001.b:0 "Toss it into the forge. Ancient memories will not fill our grain stores."
 agot_riverlands_bla.1001.c:0 "Deliver the artifact to the maester's tower for deep, scholarly study."

 # =========================================================
 # 1002 - The Bastard's Peace
 # =========================================================
 agot_riverlands_bla.1002.t:0 "The Bastard's Peace"
 agot_riverlands_bla.1002.desc:0 "Two ancient, bitter rivals sit beneath your roof, their hands resting entirely too close to their sword-hilts. Blackwood and Bracken glare across the high table, their hatred sharpened by ten thousand mutual murders.\n\nYet history remembers that King Benedict Justman—born a bastard of both their houses—once bound raven and stallion together beneath one imperial peace. Your own name stands as a living testament that the rivers need not always run red with their spite."
 agot_riverlands_bla.1002.a:0 "Drink to our shared ancestry and demand they bury the hatchet beneath my roof."
 agot_riverlands_bla.1002.b:0 "Slam your fist down. They will keep my peace, or they will bleed for it."
 agot_riverlands_bla.1002.c:0 "Speak softly; a fragile peace is woven with patience, not commanded."

 # =========================================================
 # 1003 - The Scales of Benedict
 # =========================================================
 agot_riverlands_bla.1003.t:0 "The Scales of Benedict"
 agot_riverlands_bla.1003.desc:0 "A bitter, snarling dispute between minor riverlords is brought before your court. Encroached boundaries, broken betrothals, unpaid dowries, and murdered smallfolk are all named in a chaotic torrent of grievances.\n\nThe entire hall falls silent, waiting for your final decree. The old kings of the rivers were not celebrated merely because they held a sword, but because the realm believed their scales were entirely unbroken."
 agot_riverlands_bla.1003.a:0 "A ruler's justice must be as blind and clean as winter ice."
 agot_riverlands_bla.1003.b:0 "The Trident needs absolute order and cold law, not soft-hearted mercy."
 agot_riverlands_bla.1003.c:0 "Let the unbroken laws of the First Men guide us."


 # =========================================================
 # 1004 - A Plea for One Law
 # =========================================================
 agot_riverlands_bla.1004.t:0 "A Plea for One Law"
 agot_riverlands_bla.1004.desc:0 "A lesser landed knight arrives at your gates with river-silt caked onto his boots and terror written into his face. His smallholdings have been thoroughly ravaged by neighboring feuds, illegal tolls, and lawless robber knights.\n\nHe kneels upon the rushes, asking not for gold, but for the protection of an ancient name. 'Under the Justmans,' he croaks, 'the rivers had but one law, and the weak could sleep at night.'"
 agot_riverlands_bla.1004.a:0 "Then that same law shall rise again to shield you."
 agot_riverlands_bla.1004.b:0 "The protection of my shield wall does not come cheaply, ser."
 agot_riverlands_bla.1004.c:0 "Establish a unified code of tolls and protections across the valleys."


 # =========================================================
 # 1005 - The Justman Causeway
 # =========================================================
 agot_riverlands_bla.1005.t:0 "The Justman Causeway"
 agot_riverlands_bla.1005.desc:0 "Your surveyors have uncovered the massive stone foundations of an old causeway, buried beneath layers of mud and weed-choked stone. This highway once linked bustling market towns, vital river crossings, and lordly seats before war, neglect, and floodwaters swallowed it whole.\n\nRebuilding such a massive thoroughfare will win no glorious songs from the bards—but roads bind a broken realm together far more surely than silk banners."
 agot_riverlands_bla.1005.a:0 "Lay the cobbles anew. The fractured rivers must be joined."
 agot_riverlands_bla.1005.b:0 "Leave it in the dirt and tax the ferry crossings instead."
 agot_riverlands_bla.1005.c:0 "Personally oversee the restoration project to guarantee structural permanence."


 # =========================================================
 # 1006 - Ash-Dark Stone
 # =========================================================
 agot_riverlands_bla.1006.t:0 "Ash-Dark Stone"
 agot_riverlands_bla.1006.desc:0 "Fairmarket still remembers the fire.\n\nAmong the weed-choked ruins and half-buried stones near the river, your digging crews find the blackened imprints of the great halls where Justman decrees were spoken. Nothing grand remains of their golden age—only fire-scarred stone, collapsed cellars, and names worn thin by centuries of relentless rain.\n\nStanding among the ruins, the hair on your neck rises. The grove feels watched."
 agot_riverlands_bla.1006.a:0 "Pour out a horn of wine for the dead; let their memory endure."
 agot_riverlands_bla.1006.b:0 "Summon the septons to sing holy prayers for the souls lost to the flame."
 agot_riverlands_bla.1006.c:0 "Scrape the ruins clean. Strip whatever valuable iron or stone remains."
 agot_riverlands_bla.1006.d:0 "Have the maester meticulously document and archive these lost legal decrees."


 # =========================================================
 # 1007 - The Scourge of the Hoares
 # =========================================================
 agot_riverlands_bla.1007.t:0 "The Scourge of the Hoares"
 agot_riverlands_bla.1007.desc:0 "The old songs name the ironborn Kings of House Hoare with absolute venom. They sing of Justman kings dragged in chains to Old Wyk, halls put to the torch, children drowned in the waves, and the entire Trident bent double beneath an iron boot.\n\nNow, reaver longships have been sighted stirring at the mouth of the river again, and your men look to you with hard, expectant eyes. Some ancient wounds never truly heal."
 agot_riverlands_bla.1007.a:0 "The rivers remember the iron reavers. Sharpen the axes."
 agot_riverlands_bla.1007.b:0 "We shall answer their savagery as true lords, not butchers."
 agot_riverlands_bla.1007.c:0 "Let the maesters hoard those ancient grudges; we have modern wars to fight."

 # =========================================================
 # 1008 - The Whispering Crown
 # =========================================================
 agot_riverlands_bla.1008.t:0 "The Whispering Crown"
 agot_riverlands_bla.1008.desc:0 "It begins as a dangerous, intoxicating whisper in the dark corners of your crowded hall.\n\nNot merely lord. Not merely master of works.\n\nKing.\n\nThe heavy word passes from wandering singer to hedge knight, from village septon to simple smallfolk, from old fishermen on the riverbanks to young heirs raised on legends of Justman peace. No crown of bronze yet rests upon your brow, yet the ghost of a kingdom is gathering around your seat all the same."
 agot_riverlands_bla.1008.a:0 "The Trident remembers its true kings. Let the banners be stitched."
 agot_riverlands_bla.1008.b:0 "I serve the law and the peace of the realm, not blind, bloody ambition."
 agot_riverlands_bla.1008.c:0 "Let the whispers spread; rumors can conquer what an army cannot."

 # =========================================================
 # 1009 - Echoes of the Trident
 # =========================================================
 agot_riverlands_bla.1009.t:0 "Echoes of the Trident"
 agot_riverlands_bla.1009.desc:0 "It begins as a dangerous, intoxicating murmur in the shadows of drafty halls and smoky campfires.\n\nAncient names, long thought buried in the silt, are spoken aloud once more—Fisher, Mudd, Justman. Your captains and smallfolk alike speak of the iron-willed River Kings who ruled these valleys before the ironborn came, before the Targaryen dragons burned Harrenhal, and centuries before the leaping trout of Riverrun ever rose above its betters.\n\nSome say the rivers have always belonged to whichever bloodline is strong enough to bleed for them. Others simply whisper that the Trident remembers."
 agot_riverlands_bla.1009.a:0 "The rivers were ours once, and by blood, they shall be ours again."
 agot_riverlands_bla.1009.b:0 "A unified realm is what matters now—not old, broken crowns."
 agot_riverlands_bla.1009.c:0 "Let the dead kings sleep. We have modern wars to fight."
 agot_riverlands_bla.1009.d:0 "The river waters are still too turbulent. We must bide our time."

 # =========================================================
 # 1010 - Blades Upon the Table
 # =========================================================
 agot_riverlands_bla.1010.t:0 "Blades Upon the Table"
 agot_riverlands_bla.1010.desc:0 "What began as a cautious truce has transformed into a far heavier burden: expectation.\n\nEnvoys representing raven and stallion interests now pack your court, demanding a permanent settlement to their endless friction. Betrothals, wardships, border patrol limits, and ancient slights are laid out before your dais like unsheathed daggers.\n\nKing Benedict Justman famously bound these quarrelsome houses beneath a single crown. Now, his descendants are asked to work that same miracle, yet you lack the throne to enforce it."
 agot_riverlands_bla.1010.a:0 "Bind them together by marriage; let their hostile blood mix."
 agot_riverlands_bla.1010.b:0 "Trade their children as fosterlings; let the next generation grow as brothers."
 agot_riverlands_bla.1010.c:0 "Put their men into the same outrider patrols; force them to rely on each other."
 agot_riverlands_bla.1010.d:0 "Vague promises will have to serve for now. We are not ready."

 # =========================================================
 # 1011 - The Ink-Stained Truce
 # =========================================================
 agot_riverlands_bla.1011.t:0 "The Ink-Stained Truce"
 agot_riverlands_bla.1011.desc:0 "The high hall is suffocated by a tense, heavy silence.\n\nNo drinking songs echo from the rafters, and no drunken boasts ring from the benches. Men and women who would normally draw steel at a sideways glance now stand beneath your roof, meticulously weighing ink, parchment, pride, and ancient murders.\n\nA paper compact will never truly end a blood feud older than the Seven Kingdoms themselves. But it may teach these bitter rivals to ride the same road, if only for a brief summer."
 agot_riverlands_bla.1011.a:0 "Let the seals be pressed; let all the realm witness this peace."
 agot_riverlands_bla.1011.b:0 "Tear up the draft. A lasting peace must be bought with harder concessions."
 agot_riverlands_bla.1011.c:0 "Let patience seal what ancestral pride is trying to tear apart."
 agot_riverlands_bla.1011.d:0 "The ink is dry, and this is enough for today. Dismiss the court."
 agot_riverlands_bla.1011.b.success_tt:0 "Your firm terms endure the grueling parley, binding both houses to a strict agreement."
 agot_riverlands_bla.1011.b.failure_tt:0 "The treaty is reluctantly signed, but bitter resentment festers beneath the seals."

 # =========================================================
 # 1012 - The Root of Spite
 # =========================================================
 agot_riverlands_bla.1012.t:0 "The Root of Spite"
 agot_riverlands_bla.1012.desc:0 "Parchment cannot erase a millennium of graves.\n\nA fresh brawling match has erupted near the border stables between men sworn to rival river houses. One side screams of broken boundaries, the other of targeted insult. By nightfall, the petty rumor has already grown razor-sharp teeth: a slaughtered horse, an unhonored oath, a foul name spat too loudly before witnesses.\n\nThe old monster of the feud stirs beneath the floorboards once more."
 agot_riverlands_bla.1012.a:0 "Convene a court immediately and judge both sides with an absolute, blind hand."
 agot_riverlands_bla.1012.b:0 "String up the ringleaders from both houses; make a bloody example of them."
 agot_riverlands_bla.1012.c:0 "Drag the opposing lords back to the high table to resolve this before it spreads."
 agot_riverlands_bla.1012.d:0 "Step aside. Let them blood each other in their own petty skirmishes."
 agot_riverlands_bla.1012.d.tt:0 "Your hard-won peace begins to unravel as border steel is drawn."


 
 justman_ancient_authority_bla:0 "Legacy of the Gavel"
 justman_ancient_authority_bla_desc:0 "The unforgotten majesty of the old kings lends immense weight and legitimacy to this ruler's decrees, forcing even the proudest lords to listen."

 justman_peacemaker_bla:0 "The Bastard's Mantle"
 justman_peacemaker_bla_desc:0 "Invoking the ancient example of King Benedict, this ruler stands as a sacred mediator between rival houses, holding raven and stallion at bay."

 justman_lawgiver_bla:0 "The Scales of the Trident"
 justman_lawgiver_bla_desc:0 "Justice is rendered as blindly and cleanly as winter ice under this authority, recalling the unbroken laws of the old River Kings."

 justman_riverlord_authority_bla:0 "Shield of the Lesser Lords"
 justman_riverlord_authority_bla_desc:0 "The lesser lords and landed knights of the rivers increasingly look toward this seat for arbitration, stability, and protection against local feuds."

 justman_memory_of_fairmarket_bla:0 "The Ashes of Fairmarket"
 justman_memory_of_fairmarket_bla_desc:0 "The fire-scarred ruins of Fairmarket serve as a solemn, haunting reminder of both the golden age and the tragic downfall of the Justman line."

 justman_anti_ironborn_fervor_bla:0 "The Vengeance of Old Wyk"
 justman_anti_ironborn_fervor_bla_desc:0 "The butcheries and chains brought upon the riverlands by the ironborn are neither forgotten nor forgiven, turning every local heart to iron against the reavers."

 justman_crown_remembered_bla:0 "The Whispering Crown"
 justman_crown_remembered_bla_desc:0 "The rivers remember their true sovereigns, and many now whisper that the law-forged legacy of House Justman was never truly extinguished in the mud."

 justman_fair_judgment_bla:0 "The Unbroken Scale"
 justman_fair_judgment_bla_desc:0 "A recent decree from the high seat has reinforced the smallfolk's faith in the absolute rule of law over the sword."

 justman_one_law_bla:0 "Benedict's Peace"
 justman_one_law_bla_desc:0 "This province benefits from a firmer, unified legal order under Justman authority, sweeping away the lawless chaos of robber knights and petty feuds."

 justman_causeway_bla:0 "The Kingsroad Restored"
 justman_causeway_bla_desc:0 "Rebuilt cobbles and fortified crossings tie the valleys together, quickening the march of trade and armies across the treacherous marshes of the Trident."

 justman_toll_road_bla:0 "The Sovereign's Toll"
 justman_toll_road_bla_desc:0 "Local river crossings have been aggressively squeezed for lordly profit, lining your treasury at the cost of deep, bitter resentment from the merchant class."

 justman_remembered_dead_bla:0 "Vigil for the Sinking Kings"
 justman_remembered_dead_bla_desc:0 "The ancient sovereigns of the river halls are properly honored with holy prayers, bringing a solemn, quiet reverence to the surrounding fields."

 justman_guarded_rivers_bla:0 "The Iron Watch"
 justman_guarded_rivers_bla_desc:0 "The banks of the Blue Fork are heavily patrolled by outriders and garrisoned watchposts, locking down the approaches against ironborn reavers."

 justman_river_king_claimant_bla:0 "Claimant of the River Kings"
 justman_river_king_claimant_bla_desc:0 "This ruler openly invokes the ancient, absolute authority of the pre-Andal River Kings, terrifying their neighbors with a legacy forged in law and iron."

 justman_riverlord_unifier_bla:0 "The Trident's Hammer"
 justman_riverlord_unifier_bla_desc:0 "This ruler is widely recognized as a singular, unifying figure among the notoriously quarrelsome, blood-feuding houses of the riverlands."

 justman_humble_legacy_bla:0 "A Restrained Heritage"
 justman_humble_legacy_bla_desc:0 "This ruler chooses to honor the sacred memory of the ancient River Kings through quiet piety and law, explicitly refusing to grasp at their dangerous crown."

justman_cautious_restoration_bla:0 "The Quiet Hearth"
 justman_cautious_restoration_bla_desc:0 "This ruler allows the legal memory and ancient claims of House Justman to take root carefully, deliberately avoiding the premature reach for a crown that would unite their enemies against them."

 justman_detente_bla:0 "The Sovereign's Shadow"
 justman_detente_bla_desc:0 "Through grueling mediation, this ruler has forced ancient rivals to tolerate a fragile truce beneath the stern guidance of House Justman."

 justman_shared_patrols_bla:0 "Brothers of the Road"
 justman_shared_patrols_bla_desc:0 "Men once divided by a millennium of blood feud now patrol the borders together. They watch the trails shoulder to shoulder, though trust remains far harder to build than palisades."

 justman_river_compact_bla:0 "The Parchment Peace"
 justman_river_compact_bla_desc:0 "A formal accord has been struck between raven and stallion, strengthening the fragile hope that the lords of the Trident may yet stand as one."

 justman_forced_compact_bla:0 "The Gavel's Weight"
 justman_forced_compact_bla_desc:0 "Peace has been aggressively imposed by absolute, uncompromising authority rather than willing reconciliation. The truce holds, but bitter resentment festers beneath the seals."

