l_english:

agot_crownlands_bla.0700.t:0 "Seven upon the Sound"

agot_crownlands_bla.0700.desc:0 "Salt has found its way into the stones of the old sept.\n\nRain enters through part of the roof, the Father's painted face has faded almost to nothing, and one of the Mother's hands has cracked from the wall entirely. Yet every seventh day the doors still open, candles are lit, and the people of Sweetport Sound come to pray.\n\nThe septon assures me that devotion does not require marble.\n\nHe then glances toward the leaking roof.\n\nApparently it does benefit from timber."

agot_crownlands_bla.0700.a:0 "Restore it properly. The Seven deserve no less."
agot_crownlands_bla.0700.b:0 "Repair what is needed, but keep the sept humble."
agot_crownlands_bla.0700.c:0 "Let it become a place for all the people of the Sound."
agot_crownlands_bla.0700.d:0 "The Faith can mend its own roof."

agot_sunglass_patron_of_sweetport_faith_bla:0 "Patron of Sweetport's Faith"
agot_sunglass_patron_of_sweetport_faith_bla_desc:0 "This ruler has become a generous patron of the Faith upon Sweetport Sound."

agot_sunglass_humble_sept_bla:0 "A Humble Sept"
agot_sunglass_humble_sept_bla_desc:0 "The local sept has been maintained carefully without allowing pious expenditure to overwhelm more earthly necessities."

agot_sunglass_open_sept_bla:0 "Sept of the Sound"
agot_sunglass_open_sept_bla_desc:0 "The local sept has become an important gathering place for the communities scattered around Sweetport Sound."

agot_crownlands_bla.0701.t:0 "The Beacon of Sweetport"

agot_crownlands_bla.0701.desc:0 "The merchant captain is still angry when he is brought before me, though surviving the night has at least made him grateful enough to temper his language.\n\nHis ship came dangerously close to the rocks during the storm. The small fire traditionally kept above the approach to Sweetport had gone dark, leaving his helmsman to judge the coast through rain and blackness.\n\n'Another hundred yards,' he tells me, 'and half my cargo would be beneath the waves.'\n\nOne of my own sailors corrects him.\n\n'All of it.'"

agot_crownlands_bla.0701.a:0 "Build a beacon worthy of the Sound."
agot_crownlands_bla.0701.b:0 "The sailors shall maintain the watch themselves."
agot_crownlands_bla.0701.c:0 "Ships benefiting from the light can pay for it."
agot_crownlands_bla.0701.d:0 "A captain who needs a fire to find land needs a new trade."

agot_sunglass_beacon_of_sweetport_bla:0 "Beacon of Sweetport"
agot_sunglass_beacon_of_sweetport_bla_desc:0 "A dependable coastal beacon guides vessels toward the safer waters of Sweetport Sound."

agot_sunglass_sailors_watch_bla:0 "Sailors' Watch"
agot_sunglass_sailors_watch_bla_desc:0 "Local sailors have assumed responsibility for maintaining the lights and watches that protect vessels approaching the Sound."

agot_sunglass_harbor_dues_bla:0 "Sweetport Harbor Dues"
agot_sunglass_harbor_dues_bla_desc:0 "Ships using the safety and facilities of Sweetport Sound are expected to contribute toward their upkeep."

agot_crownlands_bla.0702.t:0 "The King's Command"

agot_crownlands_bla.0702.desc:0 "My liege's command is clear.\n\nThe septon's objection is equally so.\n\nWhat has been demanded of House Sunglass is lawful enough by the customs of lordship, yet the old man insists that obedience would require us to act against the teachings he has spent his life placing before us.\n\n'A lord owes service,' one of my councillors reminds me.\n\n'A soul owes service as well,' the septon replies.\n\nNeither man looks inclined to yield.\n\nThere are occasions when duty points in one direction. Those are easy.\n\nThis is not one of them."

agot_crownlands_bla.0702.a:0 "I will not purchase obedience with my conscience."
agot_crownlands_bla.0702.b:0 "A vassal cannot choose which commands deserve obedience."
agot_crownlands_bla.0702.c:0 "There must be a path that dishonors neither obligation."
agot_crownlands_bla.0702.d:0 "Obey in appearance. Quietly avoid the worst of it."

agot_sunglass_conscience_before_command_bla:0 "Conscience Before Command"
agot_sunglass_conscience_before_command_bla_desc:0 "This ruler has demonstrated that there are commands House Sunglass will not obey when temporal duty collides with sacred conviction."

agot_sunglass_obedient_vassal_bla:0 "Obedient Vassal"
agot_sunglass_obedient_vassal_bla_desc:0 "Whatever private doubts this ruler may possess, obligations to their liege are fulfilled without public defiance."

agot_sunglass_tempered_obedience_bla:0 "Tempered Obedience"
agot_sunglass_tempered_obedience_bla_desc:0 "Careful diplomacy has allowed this ruler to balance obligations of faith and fealty without openly sacrificing either."

agot_crownlands_bla.0703.t:0 "A Sail upon the Horizon"

agot_crownlands_bla.0703.desc:0 "The ship has appeared three mornings in succession.\n\nAlways distant. Always beyond the Sound. Always gone before one of our vessels can draw close enough to identify her.\n\nShe flies no banner that my watchmen recognize.\n\nPerhaps she is merely a merchant captain with peculiar habits. Perhaps smugglers are studying our patrols. Perhaps pirates are counting ships and wondering how quickly armed men could be put ashore.\n\nLiving upon an island teaches a simple lesson: the sea protects you only until someone decides to cross it."

agot_crownlands_bla.0703.a:0 "Double the watches and put boats into the water."
agot_crownlands_bla.0703.b:0 "Follow her. I want to know what she is."
agot_crownlands_bla.0703.b.smugglers:0 "The mysterious vessel proves to be supporting a profitable smuggling operation"
agot_crownlands_bla.0703.b.merchant:0 "The suspicious stranger proves considerably more mundane than feared"
agot_crownlands_bla.0703.b.pirates:0 "Your sailors return convinced that the ship was sounding the defenses of Sweetport Sound"

agot_crownlands_bla.0703.c:0 "Signal her openly. Let us see whether she answers."
agot_crownlands_bla.0703.c.tt:0 "The vessel eventually departs without incident, though its purpose remains uncertain"

agot_crownlands_bla.0703.d:0 "We will not empty our purse chasing every sail."

agot_sunglass_watched_waters_bla:0 "Watched Waters"
agot_sunglass_watched_waters_bla_desc:0 "The approaches to Sweetport Sound are being watched carefully for unfamiliar or potentially hostile vessels."

agot_sunglass_pirates_mark_the_sound_bla:0 "Pirates Mark the Sound"
agot_sunglass_pirates_mark_the_sound_bla_desc:0 "There are troubling indications that seaborne raiders have taken an interest in the wealth and defenses of Sweetport Sound."

agot_crownlands_bla.0704.t:0 "Beneath the Seven-Pointed Sun"

agot_crownlands_bla.0704.desc:0 "At sunset the waters beyond Sweetport catch the dying light until the whole Sound seems made of beaten copper.\n\nAbove me flies the device of House Sunglass.\n\nOur name has never commanded the armies of the great houses, nor filled the histories with the conquests of kings. Yet our banners have flown above these waters through war, storm, royal favor, royal displeasure, and generations whose names survive only upon old stones.\n\nA small house does not endure by pretending to be a great one.\n\nIt endures by knowing what it will defend, what it will surrender, and what price it refuses to pay."

agot_crownlands_bla.0704.a:0 "Our light comes from the Seven."
agot_crownlands_bla.0704.b:0 "Our first duty is to guard the Sound."
agot_crownlands_bla.0704.c:0 "Let Sweetport prosper beneath our banner."
agot_crownlands_bla.0704.d:0 "Faith and fealty need not be enemies."

agot_sunglass_light_of_the_seven_bla:0 "Light of the Seven"
agot_sunglass_light_of_the_seven_bla_desc:0 "House Sunglass has embraced its reputation as one of the Crownlands' notably devout noble families."

agot_sunglass_guardians_of_the_sound_bla:0 "Guardians of the Sound"
agot_sunglass_guardians_of_the_sound_bla_desc:0 "The defense of Sweetport Sound and its surrounding waters has become central to the duties of House Sunglass."

agot_sunglass_sweetport_prosperity_bla:0 "Prosperity of Sweetport"
agot_sunglass_sweetport_prosperity_bla_desc:0 "House Sunglass has turned its attention toward the ships, markets, and communities that sustain Sweetport Sound."

agot_sunglass_faith_and_fealty_bla:0 "Faith and Fealty"
agot_sunglass_faith_and_fealty_bla_desc:0 "This ruler strives to reconcile devotion to the Seven with the worldly obligations demanded of a Crownlands lord."