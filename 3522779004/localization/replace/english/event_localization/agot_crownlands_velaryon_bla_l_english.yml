l_english:

rival_disagreement:0 "A Bitter Disagreement"

agot_crownlands_bla.0100.t:0 "A Forest of Masts"
agot_crownlands_bla.0100.desc:0 "From the heights above the harbor, the sea itself seems lost beneath sailcloth and timber. War galleys ride at anchor beside merchant cogs, while tenders dart between them bearing barrels of water, coils of rope, salted meat, and fresh hands. Along the quays, sailors curse one another over berths as harbor men struggle to impose order upon the press.\n\nThe fleet is a testament to the power of House Velaryon, yet even the greatest fleet requires somewhere to rest its oars. With every new hull that enters the harbor, Driftmark groans beneath the weight of its own maritime strength."

agot_crownlands_bla.0100.a:0 "Then we shall build a harbor worthy of our fleet."
agot_crownlands_bla.0100.b:0 "Put the harbor master in command of this chaos."
agot_crownlands_bla.0100.c:0 "Every berth has its price."
agot_crownlands_bla.0100.d:0 "The tide will sort them out."

agot_velaryon_expanded_harbor_bla:0 "Expanded Velaryon Harbor"
agot_velaryon_expanded_harbor_bla_desc:0 "New quays, storehouses, and anchorages have been constructed to accommodate the great press of ships serving House Velaryon."

agot_velaryon_harbor_discipline_bla:0 "Master of the Anchorage"
agot_velaryon_harbor_discipline_bla_desc:0 "Strict harbor discipline keeps ships, supplies, and sailors moving according to the will of their lord."

agot_velaryon_crowded_anchorages_bla:0 "Crowded Anchorages"
agot_velaryon_crowded_anchorages_bla_desc:0 "Merchants pay handsomely for space among these crowded quays, though fishermen and common sailors increasingly find themselves pushed aside."

agot_crownlands_bla.0101.t:0 "The Fleet Must Be Fed"

agot_crownlands_bla.0101.desc:0 "A great fleet is an imposing sight upon the water, but ships do not sail upon prestige alone. Every hull requires rope and sailcloth, every deck must be caulked with pitch, and every hold must carry water, grain, salted meat, and enough provisions to keep its crew from hunger.\n\nMy harbor masters bring before me a mounting tally of what the fleet consumes. Fishermen complain that their catches are bought before reaching market, coopers labor day and night over barrels, and merchants have begun raising their prices at the mere sight of a Velaryon quartermaster.\n\nIf these ships are to remain the pride of House Velaryon, someone must bear the cost."

agot_crownlands_bla.0101.a:0 "Open the coffers. Our fleet will want for nothing."
agot_crownlands_bla.0101.b:0 "Let the merchants of the harbor supply them."
agot_crownlands_bla.0101.c:0 "Take what the fleet requires."
agot_crownlands_bla.0101.d:0 "Make the stores last."

agot_velaryon_fleet_well_provisioned_bla:0 "A Well-Provisioned Fleet"
agot_velaryon_fleet_well_provisioned_bla_desc:0 "The ships of House Velaryon are stocked generously with provisions, spare rigging, fresh sailcloth, and every necessity their captains might require."

agot_velaryon_fleet_supply_contracts_bla:0 "Fleet Supply Contracts"
agot_velaryon_fleet_supply_contracts_bla_desc:0 "Lucrative contracts supplying the great fleet have brought steady work to merchants, fishermen, craftsmen, and laborers throughout the harbor."

agot_velaryon_fleet_requisitions_bla:0 "Fleet Requisitions"
agot_velaryon_fleet_requisitions_bla_desc:0 "Food, timber, rope, and other necessities are being requisitioned for the fleet. The ships remain supplied, but the people who provide for them have little reason to celebrate."

agot_velaryon_stretched_fleet_stores_bla:0 "Stretched Fleet Stores"
agot_velaryon_stretched_fleet_stores_bla_desc:0 "The fleet's quartermasters have been ordered to stretch every barrel and coil of rope as far as possible. Coin has been saved, though the fleet is less prepared than its reputation suggests."

agot_crownlands_bla.0102.t:0 "Captains of Driftmark"

agot_crownlands_bla.0102.desc_old_salt:0 "There are sailors upon Driftmark who claim to know every current between the Gullet and the narrow sea, but few have spent as many years upon those waters as [velaryon_captain_bla.GetFirstName].\n\nSalt has faded [velaryon_captain_bla.GetHerHis] clothes and the years have weathered [velaryon_captain_bla.GetHerHis] face, yet there is nothing uncertain in the way [velaryon_captain_bla.GetSheHe] speaks of wind, tide, and sail. Harbor men tell me that [velaryon_captain_bla.GetSheHe] has brought ships home through storms that sent younger captains fleeing for shore.\n\nA lord of the tides could make use of such experience."

agot_crownlands_bla.0102.desc_tide_taker:0 "The sailors have taken to calling [velaryon_captain_bla.GetFirstName] the Tide-Taker, though whether the name is one of admiration or warning seems to depend upon which sailor is asked.\n\n[velaryon_captain_bla.GetSheHe|U] is young for a captain and possesses the irritating confidence of one who has survived every risk taken thus far. Where other ships shorten sail before a storm, [velaryon_captain_bla.GetFirstName] presses onward. Where cautious captains skirt dangerous waters, [velaryon_captain_bla.GetSheHe] searches for the quicker passage.\n\nRecklessness and courage are close kin upon the sea. House Velaryon has prospered from both."

agot_crownlands_bla.0102.desc_merchant:0 "Not every great captain earns a reputation through battle or storm. [velaryon_captain_bla.GetFirstName] has instead learned that a well-filled hold can prove more valuable than a bloodied deck.\n\nFrom the merchants along the harbor I hear tales of profitable cargoes, favorable bargains, and foreign traders who somehow remember [velaryon_captain_bla.GetFirstName]'s name long after [velaryon_captain_bla.GetSheHe] has sailed from their ports. [velaryon_captain_bla.GetSheHe|U] seems equally comfortable discussing currents, cargo, or coin.\n\nSuch talents have their uses upon Driftmark."

agot_crownlands_bla.0102.a:0 "There is a place for you in my household."
agot_crownlands_bla.0102.b:0 "Good service deserves good coin."
agot_crownlands_bla.0102.c:0 "Driftmark has no shortage of sailors."

agot_crownlands_bla.0103.t:0 "Rot Beneath the Waterline"

agot_crownlands_bla.0103.desc:0 "The harbor rolls declare the ships fit for sea. The ships themselves tell another tale.\n\nAn inspection of several hulls has uncovered planks gone soft beneath the waterline, rigging long overdue for replacement, and stores of pitch that seem to exist only upon parchment. Most troubling of all are the accounts. Coin has been issued for repairs that were never made, signed for by men who insist that every copper reached the shipyards.\n\nA fleet may look magnificent from the shore while rot spreads unseen beneath the waves. Someone has wagered that I would never look closely enough to notice."

agot_crownlands_bla.0103.a:0 "Replace every rotten plank."
agot_crownlands_bla.0103.b:0 "Drag the thieves into the light."
agot_crownlands_bla.0103.c:0 "No one beyond these docks need know."
agot_crownlands_bla.0103.d:0 "The missing coin will be returned."


agot_velaryon_harbor_accounts_scrutinized_bla:0 "Scrutinized Harbor Accounts"
agot_velaryon_harbor_accounts_scrutinized_bla_desc:0 "Harbor accounts are being inspected with unusual care, making it considerably harder for officials and contractors to enrich themselves from the fleet's coffers."


agot_crownlands_bla.0104.t:0 "The Tides of Driftmark"

agot_crownlands_bla.0104.desc:0 "The sea has turned against Driftmark.\n\nAll morning the wind has driven dark water against the coast, until the tide rose beyond the oldest marks cut into the harbor stones. Waves now break across the quays. Fishing boats have torn loose from their moorings, merchants scramble to move their wares above the flood, and families nearest the shore abandon their homes with whatever they can carry.\n\nThe people of Driftmark have lived by the sea for generations. They know well that the waters which fill their nets and carry their ships can just as readily take everything back.\n\nThere is still time to act, but not enough hands to save everything."

agot_crownlands_bla.0104.a:0 "Forget the cargo. Get the people to safety."
agot_crownlands_bla.0104.b:0 "Save the warehouses before the water reaches them."
agot_crownlands_bla.0104.c:0 "Get those ships away from the quays!"
agot_crownlands_bla.0104.d:0 "Driftmark has endured worse."

agot_crownlands_bla.0104.b.success:0 "Above the Rising Tide"
agot_crownlands_bla.0104.b.failure:0 "The Tide Takes Its Due"

agot_crownlands_bla.0104.c.success:0 "Safe Beyond the Breakers"
agot_crownlands_bla.0104.c.failure:0 "Ships Against the Storm"

agot_velaryon_people_before_coin_bla:0 "People Before Coin"
agot_velaryon_people_before_coin_bla_desc:0 "When the sea threatened Driftmark, its lord spent freely to protect the people rather than the wealth upon its quays. The deed has not been forgotten."

agot_velaryon_flooded_storehouses_bla:0 "Flooded Warehouses"
agot_velaryon_flooded_storehouses_bla_desc:0 "The harbor's storehouses have been flooded from the recent storm and much was lost in the aftermath."

agot_velaryon_storm_neglect_bla:0 "Storm-Damaged Coast"
agot_velaryon_storm_neglect_bla_desc:0 "Little was spent protecting Driftmark from the recent storm. Damaged homes, flooded workshops, and ruined property remain visible along the coast."

agot_crownlands_bla.0105.t:0 "Cargo from the East"

agot_crownlands_bla.0105.desc:0 "The quays of Driftmark have begun to speak in a hundred tongues.\n\nShips arriving from across the narrow sea unload bolts of bright cloth, casks of wine, worked glass, spices, dyes, carved ivory, and goods whose uses the harbor men can scarcely guess. Behind the cargo come the merchants themselves, along with craftsmen, factors, moneychangers, and sailors seeking another voyage before their last-earned coin is gone.\n\nSome among my household see only prosperity. Others warn that foreign merchants are buying the best warehouses, crowding local traders from the quays, and carrying too much of Driftmark's coin back across the sea.\n\nThe tide has brought wealth to my shores. It remains for me to decide where that wealth will flow."

agot_crownlands_bla.0105.a:0 "Let them come. Trade has always been Driftmark's lifeblood."
agot_crownlands_bla.0105.b:0 "Every cargo that crosses our quays owes House Velaryon its due."
agot_crownlands_bla.0105.c:0 "Find the finest craftsmen among them."
agot_crownlands_bla.0105.d:0 "Driftmark must not be sold from beneath its own people."

agot_velaryon_eastern_merchants_bla:0 "Eastern Merchants"
agot_velaryon_eastern_merchants_bla_desc:0 "Merchants from across the narrow sea have been welcomed freely upon Driftmark, bringing foreign coin and encouraging the growth of the island's ports."

agot_velaryon_harbor_customs_bla:0 "Velaryon Harbor Customs"
agot_velaryon_harbor_customs_bla_desc:0 "Foreign cargo entering Driftmark is carefully assessed and taxed. The lord's coffers prosper, though some merchants have begun seeking friendlier harbors."

agot_velaryon_foreign_craftsmen_bla:0 "Foreign Craftsmen"
agot_velaryon_foreign_craftsmen_bla_desc:0 "Skilled builders and craftsmen from ports across the narrow sea have been encouraged to settle on Driftmark, bringing unfamiliar methods and generations of accumulated knowledge."

agot_velaryon_restricted_foreign_trade_bla:0 "Restricted Foreign Trade"
agot_velaryon_restricted_foreign_trade_bla_desc:0 "Foreign merchants face restrictions intended to protect Driftmark's native traders and craftsmen. The policy is popular among the locals, though less foreign coin reaches the island."

agot_crownlands_bla.0106.t:0 "Pirates in the Gullet"

agot_crownlands_bla.0106.desc:0 "Another merchant ship has limped into Driftmark beneath torn sails, its crew bloodied and its hold considerably lighter than when it departed.\n\nThe captain speaks of pirates prowling the waters of the Gullet, appearing from hidden coves and falling upon merchantmen before vanishing again into the narrow sea. Some traders now sail only in company, while others threaten to carry their goods to safer ports altogether.\n\nThe wealth of Driftmark has always come upon the tide. If men begin to fear the waters around my island, that tide may yet turn."

agot_crownlands_bla.0106.a:0 "Send the fleet. Sweep every cove."
agot_crownlands_bla.0106.b:0 "Put our fastest ships on constant patrol."
agot_crownlands_bla.0106.c:0 "Let every pirate head carry a price."
agot_crownlands_bla.0106.d:0 "The merchants can fend for themselves."

agot_crownlands_bla.0107.t:0 "The Gullet Answered"

agot_crownlands_bla.0107.desc_success:0 "The word reaches Driftmark with the morning tide: the pirates have been broken.\n\nTheir hiding places were found, their ships scattered or taken, and those who escaped did so with little more than the clothes upon their backs. Merchant captains already speak of the Gullet with renewed confidence, while along the docks sailors boast that the raiders learned too late what it means to prey upon waters guarded by House Velaryon.\n\nFor now, at least, the sea lanes are ours."

agot_crownlands_bla.0107.desc_partial:0 "The ships sent against the pirates have returned, though their victory is less complete than I had hoped.\n\nSeveral raiders were caught and a handful of their vessels taken, but the greater part scattered at the first sign of danger. Some fled east into the narrow sea, while others abandoned their ships and vanished among hidden coves before our men could reach them.\n\nThe Gullet is safer than it was, but sailors know well that a pirate driven from one shore may simply seek another."

agot_crownlands_bla.0107.desc_failure:0 "The hunt has yielded little beyond frustration.\n\nWhether warned by spies, favored by the winds, or simply more cunning than those sent against them, the pirates slipped away before they could be brought to battle. Empty coves and abandoned fires were all our men found, while merchant captains report that unfamiliar sails still shadow vessels passing through the Gullet.\n\nWorse, the failure has given the raiders something more dangerous than plunder: confidence."

agot_crownlands_bla.0107.a:0 "Let every sail know whose waters these are."
agot_crownlands_bla.0107.b:0 "Not every rat escaped the net."
agot_crownlands_bla.0107.c:0 "They have made fools of us."

agot_crownlands_bla.0108.t:0 "The Price of Inaction"

agot_crownlands_bla.0108.desc:0 "The pirates I once dismissed as a merchant's inconvenience have grown bolder.\n\nAnother ship has been taken in the Gullet, this one close enough to Driftmark that fishermen watched smoke rise from its deck. The survivors tell of raiders who no longer bother concealing their banners and captains who laugh at the prospect of Velaryon reprisal. Merchants have begun demanding escorts, and some now speak openly of carrying their cargoes elsewhere.\n\nWhat might once have been dealt with cheaply has been allowed to fester. The waters around Driftmark have remembered my inaction, and so have the men who prey upon them."

agot_crownlands_bla.0108.a:0 "Enough. Drive them from our waters."
agot_crownlands_bla.0108.b:0 "The merchants knew the risks."

agot_velaryon_gullet_swept_clean_bla:0 "The Gullet Swept Clean"
agot_velaryon_gullet_swept_clean_bla_desc:0 "Pirates have been driven from the waters surrounding Driftmark, and merchant captains once more sail the Gullet with confidence."

agot_velaryon_emboldened_pirates_bla:0 "Emboldened Pirates"
agot_velaryon_emboldened_pirates_bla_desc:0 "Failed attempts to suppress piracy have convinced the raiders of the Gullet that these waters may be hunted with little fear of reprisal."

agot_velaryon_late_pirate_response_bla:0 "A Belated Response"
agot_velaryon_late_pirate_response_bla_desc:0 "Only after piracy grew intolerable were ships and coin committed to restoring order. The damage done to local confidence will take time to mend."

agot_crownlands_bla.0109.t:0 "Old Driftmark"

agot_crownlands_bla.0109.desc:0 "There are places upon Driftmark where the island seems older than the ships in its harbors.\n\nWeathered stones rise from the earth beyond the newer quays and storehouses, while old passages and half-forgotten chambers remain within the ancestral seat. Some bear carvings whose meanings have been lost; others hold records so faded that even the maesters disagree upon their age.\n\nHouse Velaryon has called this island home since before many of the kingdoms of Westeros took their present shape. Yet each generation builds anew, and what came before is easily buried beneath newer walls, richer ports, and greater ambitions.\n\nThe question is not whether Driftmark remembers. It is whether we choose to listen."

agot_crownlands_bla.0109.a:0 "Preserve what remains."
agot_crownlands_bla.0109.b:0 "Search the old records."
agot_crownlands_bla.0109.c:0 "The future matters more than old stones."
agot_crownlands_bla.0109.d:0 "We need no relics to know who we are."

agot_velaryon_preserved_old_driftmark_bla:0 "Preserved Old Driftmark"
agot_velaryon_preserved_old_driftmark_bla_desc:0 "Ancient chambers, records, and ancestral structures have been preserved rather than swept aside by the island's continued growth."

agot_velaryon_new_driftmark_bla:0 "A New Driftmark"
agot_velaryon_new_driftmark_bla_desc:0 "Old structures have given way to new construction as Driftmark looks toward future prosperity rather than ancestral memory."

agot_crownlands_bla.0110.t:0 "What the Records Remember"

agot_crownlands_bla.0110.desc_roll:0 "Beneath layers of brittle accounts and faded correspondence, a far older roll has emerged.\n\nIts parchment has darkened with age, yet row after row of names remains legible: captains, stewards, shipwrights, sworn swords, harbor masters, and household servants who once served the Lords of Driftmark. Beside some are brief notes of voyages made, storms survived, or service rendered to House Velaryon.\n\nMost of these men and women have been dead so long that even their descendants may have forgotten them. Yet here they remain, preserved in ink beneath the seahorse banner."

agot_crownlands_bla.0110.desc_charter:0 "What first appeared to be an unremarkable bundle of old accounts has proven considerably older than expected.\n\nWrapped within them is a harbor charter bearing the seals of long-dead Velaryon lords. Its language is archaic, but its purpose is plain enough: it records ancient rights concerning anchorage, markets, warehouse dues, fishing waters, and the obligations owed to the lord of Driftmark.\n\nSome provisions have long since fallen from custom. Others are strikingly familiar. The harbor may have grown, but much of the order beneath it was laid down generations ago."

agot_crownlands_bla.0110.desc_chart:0 "A sheet of stiffened parchment was found folded between two ancient ledgers, covered not in sums or household inventories but in coastlines.\n\nThe chart bears the waters surrounding Driftmark and the Gullet, though countless additions have been made in different hands. Shoals are marked beside warnings of treacherous currents. Sheltered anchorages bear old Velaryon notations. Beside one stretch of water, a captain long dead has simply written: 'Never in an eastern wind.'\n\nIt is less a single map than generations of sailors speaking to one another across the years."

agot_crownlands_bla.0110.a:0 "Their service will not be forgotten."
agot_crownlands_bla.0110.b:0 "Some rights grow stronger with age."
agot_crownlands_bla.0110.c:0 "There is wisdom in old waters."

agot_velaryon_ancient_harbor_rights_bla:0 "Ancient Harbor Rights"
agot_velaryon_ancient_harbor_rights_bla_desc:0 "An old Velaryon charter has clarified long-standing rights and obligations surrounding Driftmark's harbors, strengthening the lord's administration of the island."

agot_velaryon_studied_old_sea_charts_bla:0 "Lessons from Old Sea Charts"
agot_velaryon_studied_old_sea_charts_bla_desc:0 "Generations of Velaryon sailors left behind observations of currents, shoals, anchorages, and dangerous waters. Their accumulated knowledge remains useful centuries later."

agot_crownlands_bla.0111.t:0 "Blood of the Sea"

agot_crownlands_bla.0111.desc:0 "[velaryon_sea_child_bla.GetFirstName] has begun spending more time along the waterfront than within the halls of [ROOT.Char.GetPrimaryTitle.GetNameNoTier].\n\nHarbor men tell me that [velaryon_sea_child_bla.GetSheHe] watches the ships with unusual attention, asking captains why one sail is reefed while another remains full, how they judge the depth beneath a hull, and why certain winds are welcomed while others send sailors hurrying for shelter.\n\nYesterday I found [velaryon_sea_child_bla.GetHerHim] attempting to repeat a knot shown by one of the dockhands, tongue caught between [velaryon_sea_child_bla.GetHerHis] teeth in fierce concentration.\n\nThe sea has always called strongly to House Velaryon. It seems it has found another willing ear."

agot_crownlands_bla.0111.a:0 "A Velaryon must know how to command a deck."
agot_crownlands_bla.0111.b:0 "Teach [velaryon_sea_child_bla.GetHerHim] what makes a harbor prosper."
agot_crownlands_bla.0111.c:0 "Let the sailors teach what tutors cannot."
agot_crownlands_bla.0111.d:0 "There are better lessons to learn ashore."

agot_velaryon_child_sea_command_bla:0 "Lessons of Sea Command"
agot_velaryon_child_sea_command_bla_desc:0 "This young Velaryon is being taught the fundamentals of command aboard ship: discipline, courage, and how to make decisions when wind and water leave little time for hesitation."

agot_velaryon_child_harbor_training_bla:0 "Lessons of the Harbor"
agot_velaryon_child_harbor_training_bla_desc:0 "This young Velaryon is learning that ships alone do not create maritime power; merchants, contracts, dockworkers, warehouses, and careful accounting keep a harbor alive."

agot_velaryon_child_among_sailors_bla:0 "Raised Among Sailors"
agot_velaryon_child_among_sailors_bla_desc:0 "Time spent among Driftmark's sailors has given this child a practical familiarity with ships, weather, and the men and women who live by the sea."

agot_crownlands_bla.0112.t:0 "Lessons of Wind and Water"

agot_crownlands_bla.0112.desc:0 "[velaryon_sea_child_bla.GetFirstName] returned to the harbor soaked through, shivering, and wearing an expression caught somewhere between pride and dread.\n\nThe fishermen entrusted with [velaryon_sea_child_bla.GetHerHis] instruction had taken their boat farther from shore than expected when the wind suddenly turned. A squall swept across the water before they could make for shelter, pitching the little vessel hard enough that one sailor swears he thought they would lose the mast.\n\nYet when panic began to spread, [velaryon_sea_child_bla.GetFirstName] did not hide beneath the gunwale. [velaryon_sea_child_bla.GetSheHe|U] hauled upon wet rope beside the crew until the boat was safely pointed toward Driftmark again.\n\nThe sailors are impressed. I am less certain whether to be proud that [velaryon_sea_child_bla.GetSheHe] faced the storm or furious that [velaryon_sea_child_bla.GetSheHe] was there to face it at all."

agot_crownlands_bla.0112.a:0 "You kept your head. Remember that."
agot_crownlands_bla.0112.b:0 "A good sailor knows when not to challenge the sea."
agot_crownlands_bla.0112.c:0 "Good. Send [velaryon_sea_child_bla.GetHerHim] out again tomorrow."
agot_crownlands_bla.0112.d:0 "Enough. Your lessons upon the water are over."

agot_velaryon_young_seafarer_bla:0 "Young Seafarer"
agot_velaryon_young_seafarer_bla_desc:0 "A dangerous encounter with rough seas has given this young Velaryon confidence aboard ship and the respect of Driftmark's sailors."

agot_velaryon_cautious_mariner_bla:0 "Cautious Mariner"
agot_velaryon_cautious_mariner_bla_desc:0 "This young Velaryon has been taught that surviving the sea requires judgment and preparation as much as courage."

agot_velaryon_seasoned_young_sailor_bla:0 "Seasoned Young Sailor"
agot_velaryon_seasoned_young_sailor_bla_desc:0 "Repeated voyages with the sailors of Driftmark have given this young Velaryon an unusually practical education in life upon the water."

agot_crownlands_bla.0113.t:0 "The Captain's Share"

agot_crownlands_bla.0113.desc:0 "[velaryon_disputed_captain_bla.GetFirstName] has returned to Driftmark with a profitable cargo and an argument.\n\nAccording to my stewards, [velaryon_disputed_captain_bla.GetSheHe] has already received every copper promised before the voyage began. According to [velaryon_disputed_captain_bla.GetFirstName], the agreement was rather different. [velaryon_disputed_captain_bla.GetSheHe|U] insists that additional coin was promised should the voyage prove especially profitable — a condition which, judging by the goods now filling our warehouses, has certainly been met.\n\nThe written accounts favor my household. Several sailors favor their captain. Neither side appears inclined to reconsider.\n\nA profitable voyage has returned home safely. It would be unfortunate if the greatest quarrel it produced began only after reaching port."

agot_crownlands_bla.0113.a:0 "Pay [velaryon_disputed_captain_bla.GetHerHim]. Good captains are worth good coin."
agot_crownlands_bla.0113.b:0 "There is a fair bargain somewhere between these accounts."
agot_crownlands_bla.0113.c:0 "The contract says what the contract says."
agot_crownlands_bla.0113.d:0 "Perhaps we should discuss what else was carried aboard that ship."

agot_crownlands_bla.0113.b.success:0 "A Fair Settlement"
agot_crownlands_bla.0113.b.failure:0 "A Costly Compromise"

agot_crownlands_bla.0114.t:0 "Lord of the Tides"

agot_crownlands_bla.0114.desc:0 "A quarrel from the waterfront has found its way before me.\n\nThe fishermen of Driftmark accuse the island's larger shipmasters of crowding them from waters their families have worked for generations. Merchant vessels anchor where nets were once cast, they say, while wakes from heavily laden ships spoil traps and force smaller boats farther from shore.\n\nThe shipmasters answer that Driftmark cannot prosper by treating every inlet as the private inheritance of a fisherman's grandfather. Their vessels bring coin, cargo, and employment to the island, and they demand room enough to do so.\n\nBoth sides now look to me. They call me Lord of the Tides. Today, it seems, they expect the title to mean something."

agot_crownlands_bla.0114.a:0 "These waters fed Driftmark before merchants crowded our quays."
agot_crownlands_bla.0114.b:0 "Driftmark prospers when ships fill its harbors."
agot_crownlands_bla.0114.c:0 "Then we shall mark where each may sail and fish."
agot_crownlands_bla.0114.d:0 "These waters belong to House Velaryon."

agot_crownlands_bla.0114.c.success:0 "The Waters Divided"
agot_crownlands_bla.0114.c.failure:0 "No One Is Satisfied"

agot_velaryon_protected_fishing_waters_bla:0 "Protected Fishing Waters"
agot_velaryon_protected_fishing_waters_bla_desc:0 "Traditional fishing grounds have been protected from the growing press of commercial shipping, earning the gratitude of Driftmark's fishing communities."

agot_velaryon_merchant_anchorages_bla:0 "Merchant Anchorages"
agot_velaryon_merchant_anchorages_bla_desc:0 "Commercial vessels have been granted priority in valuable anchorages around Driftmark, enriching the island at the expense of some traditional fishing grounds."

agot_velaryon_ordered_waters_bla:0 "Ordered Waters"
agot_velaryon_ordered_waters_bla_desc:0 "Fishing grounds, shipping lanes, and anchorages around Driftmark have been carefully delineated, bringing unusual order to the island's busy waters."

agot_velaryon_disputed_waters_bla:0 "Disputed Waters"
agot_velaryon_disputed_waters_bla_desc:0 "An attempt to settle competing claims upon Driftmark's waters has instead produced confusion, resentment, and endless arguments over boundaries."

agot_velaryon_lords_waters_bla:0 "The Lord's Waters"
agot_velaryon_lords_waters_bla_desc:0 "House Velaryon has asserted its authority over the waters surrounding Driftmark, leaving little doubt as to whose judgment governs the island's shores."

agot_crownlands_bla.0115.t:0 "The Wealth of the Tides"

agot_crownlands_bla.0115.desc:0 "There was a time when the wealth of Driftmark could be counted in fishing boats, salt-stained quays, and whatever cargo happened to survive the crossing of the narrow sea.\n\nNo longer.\n\nWarehouses crowd the harbor. Foreign merchants bargain beneath the seahorse banner. Shipwrights complain that there is more work than timber, while captains compete for crews before their vessels have even finished unloading. Coin passes through Driftmark in quantities that would have astonished many of my forebears.\n\nYet wealth gathered by the tide can be carried away by it just as easily. If this prosperity is to leave something lasting behind, I must decide what House Velaryon means to build from it."

agot_crownlands_bla.0115.a:0 "Let the name Velaryon grow richer than our coffers."
agot_crownlands_bla.0115.b:0 "Every harbor and hall upon Driftmark shall prosper."
agot_crownlands_bla.0115.c:0 "Coin is useful. Ships are power."
agot_crownlands_bla.0115.d:0 "Let every court know the wealth of the seahorse."

agot_velaryon_golden_age_driftmark_bla:0 "Golden Age of Driftmark"
agot_velaryon_golden_age_driftmark_bla_desc:0 "Years of maritime prosperity have been deliberately reinvested into Driftmark's harbors, settlements, workshops, and roads, allowing the island to flourish beyond the wealth of any single lord."

agot_velaryon_mastery_of_the_gullet_bla:0 "Mastery of the Gullet"
agot_velaryon_mastery_of_the_gullet_bla_desc:0 "House Velaryon has poured its wealth into the men, officers, ships, and traditions required to dominate the waters surrounding Driftmark."

agot_velaryon_court_of_the_tides_bla:0 "Court of the Tides"
agot_velaryon_court_of_the_tides_bla_desc:0 "Merchants, captains, envoys, and ambitious courtiers increasingly look toward the Velaryon court as a place where maritime wealth may be turned into influence."

agot_crownlands_bla.0170.t:0 "The Ruins of High Tide"
agot_crownlands_bla.0170.desc:0 "The sea has not forgotten High Tide.\n\nWhere once pale towers rose above Driftmark, broken stone now stands against the salt wind. Gulls nest where courtiers once gathered, seawater pools between shattered walls, and weeds creep across halls that once displayed treasures brought home from the ends of the known world.\n\nThis was the seat raised by the Sea Snake at the height of his glory. From these halls, Corlys Velaryon made House Velaryon richer than even the Lannisters for a time.\n\nIt would be easy to leave the ruins to memory. Easier still to retreat to the safety of what remains.\n\nBut I am a Velaryon. The tide may recede, but it always returns."

agot_crownlands_bla.0170.a:0 "Raise High Tide as the Sea Snake knew it."
agot_crownlands_bla.0170.b:0 "What burned once must never burn so easily again."
agot_crownlands_bla.0170.c:0 "Corlys built his wealth before he displayed it."
agot_crownlands_bla.0170.d:0 "High Tide is more than stone. It is our authority."

agot_velaryon_hightide_old_glory_bla:0 "Restoring the Sea Snake's High Tide"
agot_velaryon_hightide_old_glory_bla_desc:0 "The ruins of High Tide are being rebuilt with careful attention to the splendor of Corlys Velaryon's famed palace."

agot_velaryon_hightide_fortification_works_bla:0 "Fortifying High Tide"
agot_velaryon_hightide_fortification_works_bla_desc:0 "The restoration of High Tide has been shaped by the lessons of its destruction. Strong walls and defensible works are being given priority."

agot_velaryon_hightide_practical_rebuilding_bla:0 "Practical Reconstruction"
agot_velaryon_hightide_practical_rebuilding_bla_desc:0 "Rather than merely recreate the extravagance of the past, High Tide is being rebuilt with an eye toward commerce, administration, and the wealth of Driftmark."

agot_velaryon_hightide_legacy_restoration_bla:0 "High Tide Shall Rise"
agot_velaryon_hightide_legacy_restoration_bla_desc:0 "House Velaryon has committed itself to restoring High Tide not merely as a palace, but as the unmistakable seat of its power upon the Narrow Sea."

agot_crownlands_bla.0171.t:0 "The Sea Snake's Gallery"

agot_crownlands_bla.0171.desc:0 "The workmen clearing High Tide's lower halls have uncovered something unexpected.\n\nBehind a wall of fallen stone lies a chamber the sackers never reached. Salt has found its way inside, and time has been no kinder than dragonfire, yet traces of the Sea Snake's glory remain.\n\nFaded maps cling to the walls. Splintered cabinets bear carvings of distant ports. Fragments of lacquered wood, pale stone, painted tiles, and strange workmanship lie beneath years of dust. One water-stained chart still traces a course far beyond the familiar waters of Westeros.\n\nWhether these things truly accompanied Corlys Velaryon upon his voyages, no living man can say. Yet they plainly belonged to the High Tide he built at the summit of our house's power.\n\nMy builders ask what is to be done with them."

agot_crownlands_bla.0171.a:0 "Preserve everything that can be saved."
agot_crownlands_bla.0171.b:0 "Dead men's treasures can pay living men's wages."
agot_crownlands_bla.0171.c:0 "Bring me the charts."
agot_crownlands_bla.0171.d:0 "Restore the gallery with the palace."

agot_velaryon_sea_snake_charts_bla:0 "Charts of the Sea Snake"
agot_velaryon_sea_snake_charts_bla_desc:0 "Surviving charts recovered from the ruins of High Tide are being studied by sailors, scholars, and navigators in service to House Velaryon."

agot_crownlands_bla.0172.t:0 "High Tide Rises Again"

agot_crownlands_bla.0172.desc:0 "For years the broken stones of High Tide stood as a monument to what House Velaryon had lost.\n\nNo longer.\n\nOnce more its towers rise above the waters of Driftmark. Servants cross halls that had lain open to wind and rain, banners bearing the silver seahorse stir above rebuilt walls, and ships entering the harbor can see from afar that High Tide lives again.\n\nThe Sea Snake is long dead. His age is gone with him.\n\nHouse Velaryon is not."

agot_crownlands_bla.0172.desc_corlys:0 "High Tide rises from its ruins in the image of the palace Corlys Velaryon once knew. Pale stone catches the sun above the sea, restored halls recall the wealth of distant voyages, and the silver seahorse flies again where dragonfire once left only ruin.\n\nThere are those who will call it imitation. Let them.\n\nSome things deserve to be remembered."

agot_crownlands_bla.0172.desc_fortified:0 "High Tide rises again, but not as it stood before its destruction. Stronger walls guard its approaches, towers watch the sea, and beauty has been made to share its place with strength.\n\nThe old High Tide was built during the greatest age House Velaryon had ever known. This one was built by those who remembered how quickly such an age could end."

agot_crownlands_bla.0172.desc_practical:0 "High Tide rises again, though its rebirth has not been an exercise in vanity. Warehouses, offices, quays, and practical halls stand beside the restored seat, tying the palace more closely to the commerce that sustains Driftmark.\n\nCorlys Velaryon built High Tide after making himself rich.\n\nThat lesson, at least, has not been forgotten."

agot_crownlands_bla.0172.desc_legacy:0 "High Tide rises again above the waters of Driftmark, its pale towers proclaiming what every ship upon the Narrow Sea can plainly see: House Velaryon yet endures.\n\nHigh Tide was never merely a palace. At its height it was the visible proof of Velaryon power — wealth made stone, voyages made splendor, and ancient blood made authority.\n\nSo it shall be again."

agot_crownlands_bla.0172.a:0 "The tide has returned."

agot_crownlands_bla.0173.t:0 "The Ashes of Spicetown"

agot_crownlands_bla.0173.desc:0 "Spicetown once grew beneath High Tide like a second city upon Driftmark. Its quays received ships from across the narrow sea, its markets smelled of pepper, saffron, wine, tar, salt, and stranger things besides, and merchants grew rich beneath the protection of the silver seahorse.\n\nThen came the Dance.\n\nThe town that wealth had raised was consumed in war, and what survived the flames was left to wind, salt, and memory.\n\nYet harbors do not forget why men first built beside them. Ships still pass Driftmark. Traders still seek safe quays. Shipwrights still require timber, rope, canvas, and hands.\n\nIf Spicetown is to live again, I must decide what sort of town shall rise upon its bones."

agot_crownlands_bla.0173.a:0 "Let Spicetown be a merchant's town once more."
agot_crownlands_bla.0173.b:0 "Fill the shore with shipyards and sail-lofts."
agot_crownlands_bla.0173.c:0 "Open the harbor. Let whoever has coin come."
agot_crownlands_bla.0173.d:0 "Spicetown made our house rich once. It shall do so again."

agot_crownlands_bla.0174.t:0 "Who Shall Fill Its Streets?"

agot_crownlands_bla.0174.desc:0 "Stone and timber may raise a town, but neither can make one live. Spicetown requires people."

agot_crownlands_bla.0174.desc_merchants:0 "Word of Spicetown's rebuilding has traveled farther than I expected.\n\nMen and women have begun arriving upon Driftmark bearing old deeds, faded account books, and stories inherited from grandparents who once kept shops and warehouses beneath High Tide. Some claim descent from the merchant families who fled when Spicetown burned. Others are undoubtedly opportunists who have discovered that ash makes poor evidence against a clever claim.\n\nYet among them are experienced traders with ships, partners, and coin of their own.\n\nIf the old mercantile town is to live again, perhaps its old blood should return with it."

agot_crownlands_bla.0174.desc_shipyards:0 "The new quays have drawn a different sort of petitioner.\n\nShipwrights, sailmakers, caulkers, ropemakers, carpenters, and smiths crowd my hall with proposals. A master builder among them claims that, given sufficient timber and freedom to organize his craftsmen, the yards of Spicetown could launch hulls for merchants and lords alike.\n\nThe old town grew rich from goods crossing its quays. This Spicetown might grow rich by building the ships that carry them."

agot_crownlands_bla.0174.desc_open:0 "Opening Spicetown's harbor has produced results with remarkable speed.\n\nWesterosi merchants came first. Then came traders from across the narrow sea. Painted sails now appear beside familiar hulls, and on the half-finished quays one hears accents from ports far beyond Driftmark.\n\nA Myrish merchant has offered to establish a permanent house here and promises that others will follow if I guarantee their safety and freedom to trade.\n\nWhere merchants gather, coin follows.\n\nSo do other things."

agot_crownlands_bla.0174.desc_legacy:0 "Spicetown's return has already attracted merchants, craftsmen, captains, and speculators from either shore of the narrow sea.\n\nThe question before me is no longer whether the town can live again. It is who shall shape the life within it.\n\nThe Sea Snake made Driftmark rich by opening it to the world. His descendants learned how quickly wealth beyond their control could vanish."

agot_crownlands_bla.0174.a:0 "Give the old families a place in the new town."
agot_crownlands_bla.0174.b:0 "A harbor needs ships more than memories."
agot_crownlands_bla.0174.c:0 "Give the Myrishman his counting house."
agot_crownlands_bla.0174.d:0 "They may prosper — beneath a Velaryon charter."

agot_crownlands_bla.0174.a.tt:0 "An experienced merchant will join your court"
agot_crownlands_bla.0174.b.tt:0 "A skilled master shipwright will join your court"
agot_crownlands_bla.0174.c.tt:0 "A wealthy Myrish merchant will join your court"

agot_crownlands_bla.0175.t:0 "The Price of Spice"

agot_crownlands_bla.0175.desc:0 "Spicetown grows, and with growth comes dispute."

agot_crownlands_bla.0175.desc_families:0 "The return of Spicetown's old families has brought more than merchants.\n\nIt has brought claims.\n\nTwo families insist that the same stretch of waterfront belonged to their forebears before the Dance. A third possesses a seal that may be genuine, while a fourth claims that every record proving its ownership was lost when the town burned.\n\nThe arguments have begun spreading from the counting houses into the streets.\n\nA town raised from ashes cannot restore every boundary drawn before the fire."

agot_crownlands_bla.0175.desc_shipwright:0 "The shipyards are taking shape quickly, but their master builders have discovered the value of their labor.\n\nThey now ask for guaranteed contracts from House Velaryon, preferential access to imported timber, and the right to regulate who may practice their trades within Spicetown.\n\nGranting these privileges would bind skilled craftsmen to Driftmark.\n\nIt would also give them considerable power."

agot_crownlands_bla.0175.desc_essosi:0 "Spicetown's foreign merchants have wasted little time testing the limits of my hospitality.\n\nA cargo declared as common dye-stuffs has yielded several crates of goods upon which considerably greater duties should have been paid. The Myrish factors insist the mistake belongs to an ignorant clerk.\n\nMy customs men call it smuggling.\n\nThe distinction, I suspect, depends upon which side of the ledger one stands."

agot_crownlands_bla.0175.desc_charter:0 "The Velaryon charter has given Spicetown order, but every merchant now wants a voice in interpreting it.\n\nWesterosi traders complain of Essosi competition. Shipwrights demand protection from imported hulls. Foreign factors seek exemptions from duties. Warehouse owners insist the harbor master favors his friends.\n\nIf every quarrel reaches High Tide, I shall rule nothing but merchants.\n\nPerhaps Spicetown requires a government of its own."

agot_crownlands_bla.0175.a:0 "Honor every claim that can reasonably be proven."
agot_crownlands_bla.0175.b:0 "The fire ended the old claims. These streets are mine."
agot_crownlands_bla.0175.c:0 "Give the shipwrights their contracts."
agot_crownlands_bla.0175.d:0 "No guild shall own my harbor."
agot_crownlands_bla.0175.e:0 "A little freedom keeps wealthy merchants happy."
agot_crownlands_bla.0175.f:0 "Search every hold and count every crate."
agot_crownlands_bla.0175.g:0 "Form a council — and remind them who grants its charter."

agot_crownlands_bla.0176.t:0 "Spicetown Reborn"

agot_crownlands_bla.0176.desc:0 "Spicetown lives again.\n\nWhere for generations there stood only broken foundations and memories of fire, roofs now crowd the shoreline. Ships lie three-deep along new quays. Warehouses rise behind them, carts grind over the streets, and coin changes hands beneath the silver seahorse.\n\nThe town destroyed in the Dance cannot truly be returned.\n\nBut another has risen in its place."

agot_crownlands_bla.0176.desc_families:0 "Spicetown lives again.\n\nOld names hang above new counting houses. Families whose forebears fled fire and slaughter have returned to the shore, joined by merchants who have adopted the town as readily as any native son.\n\nThe streets are not the same streets their ancestors knew, nor are the warehouses built upon precisely the same stones.\n\nYet when evening falls and lamps shine along the harbor, there are old men who swear they remember such a sight from stories told beside their grandparents' hearths."

agot_crownlands_bla.0176.desc_shipyards:0 "Spicetown lives again to the sound of hammers.\n\nSpars rise above the waterfront like a forest stripped of leaves. Saws rasp through imported timber, pitch boils beside the yards, and half-built hulls rest upon their stocks waiting for the tide.\n\nThe old Spicetown was famous for what passed through its harbor.\n\nThe new town may become famous for what sails out of it."

agot_crownlands_bla.0176.desc_essosi:0 "Spicetown lives again, and half the narrow sea appears to have heard the news.\n\nPainted sails mingle with Westerosi hulls. Foreign tongues carry across the market. Spices, dyes, wines, cloth, timber, worked metal, and a hundred stranger wares crowd the warehouses behind the quays.\n\nSome upon Driftmark mutter that the town no longer feels entirely Westerosi.\n\nCorlys Velaryon might have considered that praise."

agot_crownlands_bla.0176.desc_charter:0 "Spicetown lives again beneath Velaryon law.\n\nIts merchants govern their markets, its guilds oversee their trades, and its harbor officers settle a hundred disputes before any need reach High Tide. Yet every charter bears the authority of the silver seahorse, and every ship entering the harbor knows beneath whose protection it trades.\n\nSpicetown has regained its wealth without becoming a power apart from the house that restored it."

agot_crownlands_bla.0176.a:0 "Let every harbor hear of it."

agot_crownlands_bla.0177.t:0 "The Glory of Driftmark"

agot_crownlands_bla.0177.desc:0 "There was a time when sailors approaching Driftmark saw ruin before they saw greatness.\n\nNo longer.\n\nHigh Tide's pale towers rise once more above the sea, banners snapping from rebuilt walls as ships pass beneath them. Farther along the shore, Spicetown sprawls around a living harbor, its quays crowded with masts and its warehouses heavy with goods from either side of the narrow sea.\n\nDragonfire destroyed in a night what generations had built. War scattered merchants, sailors, craftsmen, servants, and kin. The wealth of the Sea Snake became a story, and Driftmark endured as a reminder that even the greatest tide must someday fall.\n\nYet tides return.\n\nHigh Tide stands. Spicetown lives. The silver seahorse flies above both.\n\nHouse Velaryon has not recovered Corlys's age.\n\nWe have made one of our own."

agot_crownlands_bla.0177.a:0 "The Old, the True, the Brave."

agot_velaryon_driftmark_reborn_bla:0 "Driftmark Reborn"
agot_velaryon_driftmark_reborn_bla_desc:0 "House Velaryon has restored both High Tide and Spicetown from the devastation that once left them in ruins. Across the narrow sea, the silver seahorse is again associated with wealth, ships, and the power of Driftmark."
