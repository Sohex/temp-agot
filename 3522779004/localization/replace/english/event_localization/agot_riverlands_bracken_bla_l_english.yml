l_english:

 agot_riverlands_bla.0400.t:0 "Stallions of Stone Hedge"
 agot_riverlands_bla.0400.desc:0 "Your master of horse presents a magnificent line of heavy destriers and swift coursers, born from the famous Bracken breeding stock this season. Your master-at-arms is already boasting about how these massive, thick-necked stallions will break shield walls and run down fleeing foes. Meanwhile, your master of coin watches them with greedy eyes, calculating the small fortune they would command from wealthy lords across the Trident."
 agot_riverlands_bla.0400.a:0 "Select the finest mounts to lead our personal vanguard into battle."
 agot_riverlands_bla.0400.b:0 "Send the prize stallions to the river docks and sell them to the highest bidder."
 agot_riverlands_bla.0400.c:0 "Gift the horses to our most loyal household knights as a reward for service."
agot_riverlands_bla.0400.c.success_tt:0 "Your stablemasters break the spirited colts into lethal, disciplined destriers."
 agot_riverlands_bla.0400.c.rivalry_tt:0 "Your household knights grow overconfident on their new mounts, aggressively provoking the border guards."
 agot_riverlands_bla.0400.d:0 "Send our finest stallion to our liege lord to secure their favor."


 agot_riverlands_bla.0401.t:0 "The Red Stallion Rides"
 agot_riverlands_bla.0401.desc:0 "Deep into the cups after a long feast, your veteran knights begin swapping old tales of the Bracken horse. The great hall echoes with boasts of the legendary cavalry charges of Stone Hedge, singing of the glorious days when our red stallion banners tore across the river plains to shatter ironclad hosts. In the shadows of the hearth, the young squires and pages listen with wide, eager eyes, their hands twitching for the hilts of their swords."
 agot_riverlands_bla.0401.a:0 "Order the stablemaster to sound the horns; we drill the heavy horse at dawn."
 agot_riverlands_bla.0401.b:0 "Remind them that cold, disciplined steel wins wars, not drunken songs."
 agot_riverlands_bla.0401.c:0 "Clear the lists! We shall host a joust to blood these boys properly."
 agot_riverlands_bla.0401.d:0 "Ride to the Blackwood border and let them hear our thunder."


 agot_riverlands_bla.0402.t:0 "The Warrior's Shield"
 agot_riverlands_bla.0402.desc:0 "A visiting septon delivers a fiery, thundering sermon in your sept, praising House Bracken for long ago casting down the savage, blood-soaked ways of the First Men to embrace the true Light of the Seven. While your knights clash their swords in roaring approval, a few old smallfolk look to the floor in silence—remembering that despite your Andal faith, the same ancient blood of the First Men flows through your veins as the raven-worshipers across the border."
 agot_riverlands_bla.0402.a:0 "Affirm our devotion to the Father above with a generous gold tithe."
 agot_riverlands_bla.0402.b:0 "Lead the court in a solemn vow to purge the heathen tree-worshipers from the riverlands."
 agot_riverlands_bla.0402.c:0 "Remind the septon that a lord rules all his smallfolk, no matter their gods."
agot_riverlands_bla.0402.c.success_tt:0 "Measured diplomacy settles the marches and restores confidence in your rule."
 agot_riverlands_bla.0402.c.failure_tt:0 "Your compromises are viewed with deep suspicion, reopening ancestral wounds."
 agot_riverlands_bla.0402.d:0 "Send the septon to preach along the border to stir up the smallfolk."

 agot_riverlands_bla.0403.t:0 "The Lists of Stone Hedge"
 agot_riverlands_bla.0403.desc:0 "Bright silk banners snap in the river breeze as the fields outside your walls fill with glittering knights, rowdy smallfolk, and traveling merchant stalls. Hosting a grand tourney is a brilliant stage to flex Bracken wealth to the rest of the Trident, though an embarrassing unhorsing in the joust would leave your house the laughingstock of the riverlands."
 agot_riverlands_bla.0403.a:0 "Lace on your helm and ride into the lists to claim the champion's purse."
 agot_riverlands_bla.0403.b:0 "Squeeze the merchant stalls for heavy coin; let them pay for our glory."
 agot_riverlands_bla.0403.c:0 "Drown the visiting lords in fine wine and lavish feasts to win their favor."
 agot_riverlands_bla.0403.d:0 "Dismantle the pavilions afterward to build lasting works for the estate."

 agot_riverlands_bla.0404.t:0 "The Red Stallion's Burden"
 agot_riverlands_bla.0404.desc:0 "Sitting upon the high seat of Stone Hedge, you look down at the heavy tapestry of the red stallion hanging over your hall. To rule the Bracken Vale is to inherit an endless ledger of blood feuds, rowdy vassals, and grasping septons. Your commanders look to you for strength, your smallfolk for bread, and your ancestors for vengeance. The crown of a river lord is forged of iron and anxiety."
 agot_riverlands_bla.0404.a:0 "We shall carry the name of Bracken to glorious new heights!"
 agot_riverlands_bla.0404.b:0 "Enforce absolute law in the valleys; stability brings prosperity."
 agot_riverlands_bla.0404.c:0 "Gather our vassals to toast our shared bonds and enduring unity."
 agot_riverlands_bla.0404.d:0 "Let them hate us, so long as they fear our shadow."


 agot_riverlands_bla.0405.t:0 "The Knight of the Mire"
 agot_riverlands_bla.0405.desc:0 "Word reaches your court of a young hedge knight who has swept a band of notorious outlaws from the river road. Armed with little more than a boiled leather jerkin and an unarmored courser, he outmaneuvered the bandits through the treacherous, deep mud of the marshes. Your hall is ringing with praise for his bravery, and your men demand that such exceptional Bracken steel be justly rewarded."
 agot_riverlands_bla.0405.a:0 "Grant him a permanent captaincy within our heavy vanguard."
 agot_riverlands_bla.0405.b:0 "Toss him a purse of silver stags and offer him a place in your service."
 agot_riverlands_bla.0405.c:0 "Command our master-at-arms to incorporate his tactics into our drills."
 agot_riverlands_bla.0405.d:0 "Send him to 'scout' the Blackwood border using those same tactics."
 agot_riverlands_bla.0405.d.success_tt:0 "Your riders strike like ghosts, melting back into the bogs before the enemy can mount a counter-attack."
 agot_riverlands_bla.0405.d.failure_tt:0 "The Blackwoods quickly trap your 'scouts' in the brush, leaving no doubt as to who ordered the raid."


 agot_riverlands_bla.0406.t:0 "Wealth of the Vale"
 agot_riverlands_bla.0406.desc:0 "The markets beneath the walls of Stone Hedge are loud with commerce. Grain wagons crowd the roads, river barges load timber at the docks, and the famed Bracken stallions commands high prices from passing merchants. Your treasury is filling fast, yet with such abundance comes a difficult choice for any lord: do you reinvest this gold into the soil, share the wealth to secure loyalty, or squeeze the realm for every single coin it is worth?"
 agot_riverlands_bla.0406.a:0 "Invest heavily in our markets; trade will secure our future."
 agot_riverlands_bla.0406.b:0 "Host a lavish feast for our vassals to share in this bounty."
 agot_riverlands_bla.0406.c:0 "Tighten our administration to ensure our granaries are fully secure."
 agot_riverlands_bla.0406.d:0 "Squeeze the merchants for extra tolls; our coffers demand it."

 agot_riverlands_bla.0407.t:0 "Blood and Banner"
 agot_riverlands_bla.0407.desc:0 "To be a Bracken of Stone Hedge is to accept that your flesh and blood belong to the house. Looking across your court at your family, you see the future of your seat—and the targets your enemies would love to strike. In the toxic courts of the Trident, a family must stand as tight as a shield wall. How do you intend to prepare the next generation to carry the red stallion banner?"
 agot_riverlands_bla.0407.a:0 "We shall bind our bloodline in tight solidarity and honor."
 agot_riverlands_bla.0407.b:0 "Secure their dowries and inheritances with careful investments."
 agot_riverlands_bla.0407.c:0 "Bring our children to the yards; they must learn to ride and bleed."
 agot_riverlands_bla.0407.d:0 "Parade our heirs to the great lords to secure strategic alliances."


 bracken_horse_breeders_bla:0 "Stone Hedge Studbooks"
 bracken_horse_breeders_bla_desc:0 "Meticulous breeding records and generations of stable-craft ensure that this house always has access to the finest heavy coursers in the Trident."

bracken_warhorse_training_bla:0 "Blood of the Destrier"
 bracken_warhorse_training_bla_desc:0 "The prize colts of Stone Hedge have been rigorously blooded and broken for the battlefield, drastically increasing the crushing weight of your cavalry charge."

bracken_border_diplomacy_bla:0 "A Fragile Truce"
 bracken_border_diplomacy_bla_desc:0 "Carefully weighed words and calculated concessions have brought a brief, uneasy peace to the blood-soaked frontier."

 bracken_reckless_riders_bla:0 "The Border Gallop"
 bracken_reckless_riders_bla_desc:0 "Arrogant young knights have turned fine colts into an instrument of intimidation, riding down smallfolk and dangerously sparking ancestral blood feuds."

 bracken_liege_favor_bla:0 "The Sovereign's Mount"
 bracken_liege_favor_bla_desc:0 "By presenting a legendary warhorse from the Stone Hedge stables to their liege lord, this character has earned significant favor through an esteemed gesture of feudal loyalty and high nobility."

 bracken_border_posturing_bla:0 "Thunder on the Border"
 bracken_border_posturing_bla_desc:0 "This ruler has paraded their finest heavy cavalry directly along the enemy's borders, filling their own men with pride while striking unease into the hearts of their neighbors."

 bracken_hardened_riders_bla:0 "Stallion Vanguard"
 bracken_hardened_riders_bla_desc:0 "Constant drills and border skirmishes have turned this character's mounted retainers into an aggressive, lethal cavalry force."

 bracken_tourney_glory_bla:0 "Stallion of the Tilt"
 bracken_tourney_glory_bla_desc:0 "A spectacular display of jousting excellence at Stone Hedge has left the rest of the Riverlands talking about this house's knightly prowess."

 bracken_river_riders_bla:0 "Marshland Outriders"
 bracken_river_riders_bla_desc:0 "These riders know every muddy track, hidden ford, and river crossing in the region, making them impossible to ambush on home soil."

 bracken_shadow_riders_bla:0 "Riders of the Red Stallion"
 bracken_shadow_riders_bla_desc:0 "Mounted outriders and border raiders now patrol the twilight trails with an unsettling, lethal familiarity with the terrain."

 bracken_prosperous_fields_bla:0 "Drained Bottomlands"
 bracken_prosperous_fields_bla_desc:0 "By heavily taxing the border roads and reclaiming fertile soil from the river marshes, this territory's agricultural income is booming."

 bracken_heirs_drilled_bla:0 "Raised on the Reins"
 bracken_heirs_drilled_bla_desc:0 "The children of this house were placed on horses before they could properly walk, instilling them with natural horsemanship and fierce martial pride."


