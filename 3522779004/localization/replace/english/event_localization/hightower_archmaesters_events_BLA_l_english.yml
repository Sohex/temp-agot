l_english:

# ==========================================
# DECISION BLOCK: SUMMON THE ARCHMAESTERS
# ==========================================
hightower_summon_archmaesters_decision:0 "Summon the Conclave"
hightower_summon_archmaesters_decision_desc:0 "As the historic founders, protectors, and patrons of the Citadel, House Hightower holds an ancient right to summon the Conclave of Archmaesters down from their high chambers. We can command the greatest minds in the Seven Kingdoms to calculate our taxes, record our triumphs, and fabricate the historical precedents needed to legitimize our ambitions. Their ink is an unmatched weapon—but the grey rats never offer their wisdom without a price."

hightower_summon_archmaesters_decision_tooltip:0 "Call upon the Archmaesters of the Citadel to manipulate the realm's laws, administration, or history."
summoned_archmaesters_effect_tooltip:0 "The Conclave of Archmaesters will convene in the Hightower."
hightower_summon_archmaesters_decision_confirm:0 "Send for the Archmaesters."
summoned_archmaesters_blocked_tt:0 "You may summon the Conclave."

# ==========================================
# EVENT 0001: THE ARCHMAESTERS ARRIVE
# ==========================================
hightower_archmaesters.0001.t:0 "The Conclave Assembles"
hightower_archmaesters.0001.desc:0 "A somber procession of old men files into the great hall of the Hightower, the heavy clinking of their multi-metalled chains echoing against the vaulted stone. The Archmaesters of the Citadel have arrived, smelling faintly of old parchment, damp vaults, and candle wax.\n\nThey stand before your high seat, leaning on staff and rod of gold, silver, and Valyrian steel. They have read every text from the Doom to the Conquest, and they await your command. How shall their ancient knowledge serve Oldtown?"

hightower_archmaesters.0001.a:0 "Audit our holdings. Squeeze every copper from the port ledgers."
hightower_archmaesters.0001.b:0 "Scour the oldest scrolls. Find an ancient precedent for my claims."
hightower_archmaesters.0001.c:0 "Open the vaults. Let my courtiers learn the deeper mysteries."
hightower_archmaesters.0001.d:0 "Dismiss them. I have no time to listen to the wheezing of old men."

# ==========================================
# OUTCOME A: COURT REFORMS
# ==========================================
hightower_archmaesters.0001.a.t:0 "Oldtown Audited"
hightower_archmaesters.0001.a.desc:0 "For weeks, the Archmaesters have taken over your solar, their fingers permanently stained with ink as they rip through your bailiff's messy tax records. By the time they pack away their ledgers, they have rooted out dozens of corrupt collectors, streamlined the port customs, and completely reorganized your household administration."
hightower_archmaesters.0001.a.a:0 "We light the way with coin and order."

# ==========================================
# OUTCOME B: PRESTIGE & CLAIMS
# ==========================================
hightower_archmaesters.0001.b.t:0 "History Rewritten"
hightower_archmaesters.0001.b.desc:0 "The Archmaester of History has unearthed—or perhaps masterfully forged—a series of ancient, dust-covered parchments dating back to the Age of Heroes. Bearing the seals of long-dead Kings of the High Tower, these documents heavily legitimize your family's territorial ambitions before the eyes of the entire realm."
hightower_archmaesters.0001.b.a:0 "Let the other lords argue with the ink."

# ==========================================
# OUTCOME C: SCHOLARSHIP
# ==========================================
hightower_archmaesters.0001.c.t:0 "The Flame of Learning"
hightower_archmaesters.0001.c.desc:0 "The Citadel has graciously gifted your court a legendary collection of hand-copied tomes, star-charts, and medical treatises. Your halls are now thick with eager young acolytes and lecturing maesters, completely replacing idle court gossip with the furious scratching of quills."
hightower_archmaesters.0001.c.a:0 "Knowledge is the truest weapon."

# ==========================================
# OUTCOME D: DECLINE
# ==========================================
hightower_archmaesters.0001.d.t:0 "The Grey Rats Dismissed"
hightower_archmaesters.0001.d.desc:0 "You wave your hand dismissively, cutting off the Grand Maester mid-sentence. The old men look at one another, their chains clinking in silent insult, before bowing stiffly and shuffling back out of your hall. They will return to their libraries across the river, muttering about your lack of southron sophistication."
hightower_archmaesters.0001.d.a:0 "They can take their books back to the Citadel."
