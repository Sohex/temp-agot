l_english:

agot_crownlands_bla.0600.t:0 "No Road Through the Claw"

agot_crownlands_bla.0600.desc:0 "The men from outside the Point arrived with measuring ropes, axes, carts, and the absolute certainty that they understood the problem.\n\nThe track through my lands, they say, is disgraceful. It bends around bogs where a straighter road might be cut. It disappears beneath pine needles. Streams cross it without bridges, and in several places the route seems to divide for no reason whatsoever.\n\nThe clawmen listening to this explanation exchange glances.\n\nThey know precisely why it divides.\n\nA proper road would bring merchants more easily, certainly. It would also bring taxmen, knights, soldiers, and every ambitious stranger who presently discovers that Crackclaw Point is far larger once one becomes lost inside it."

agot_crownlands_bla.0600.a:0 "A lord's lands should have proper roads."
agot_crownlands_bla.0600.b:0 "Improve the paths. Do not make them easier to read."
agot_crownlands_bla.0600.c:0 "The difficulty is the point."
agot_crownlands_bla.0600.d:0 "Those who cannot find the way may hire someone who can."

agot_brune_open_tracks_bla:0 "Open Tracks"
agot_brune_open_tracks_bla_desc:0 "Travel through these lands has been made easier, encouraging trade and settlement at the cost of some of Crackclaw Point's old isolation."

agot_brune_hidden_ways_bla:0 "Hidden Ways"
agot_brune_hidden_ways_bla_desc:0 "The useful paths of the Point are maintained carefully without making them any easier for outsiders to understand."

agot_brune_country_without_roads_bla:0 "Country Without Roads"
agot_brune_country_without_roads_bla_desc:0 "Broken tracks, boggy ground, tangled woods, and deliberate neglect make these lands miserable country for an unfamiliar enemy."

agot_brune_clawman_guides_bla:0 "Clawman Guides"
agot_brune_clawman_guides_bla_desc:0 "Those who wish to travel safely through the Point have learned that local knowledge is worth paying for."

agot_crownlands_bla.0601.t:0 "The Men of Brownhollow"

agot_crownlands_bla.0601.desc:0 "The dispute began with a boundary marker that nobody outside Crackclaw Point would have recognized as one.\n\nOne of my men ordered it moved. The folk nearby promptly returned it to its old place. When he moved it again, they moved it back before sunrise.\n\nNow a delegation has come to explain that the stone has marked the division between grazing rights for longer than any living man remembers, and that no lord's clerk has the right to alter an arrangement understood perfectly well by everyone who actually lives here.\n\nThere is no shortage of obedience among the clawmen when they believe a lord has earned it.\n\nThat final condition is the troublesome part."

agot_crownlands_bla.0601.a:0 "If the custom works, I see little reason to break it."
agot_crownlands_bla.0601.b:0 "A boundary stands where its lord says it stands."
agot_crownlands_bla.0601.c:0 "Record the custom properly and settle the matter."
agot_crownlands_bla.0601.d:0 "They have managed without me this long."

agot_brune_old_customs_bla:0 "Old Customs of the Claw"
agot_brune_old_customs_bla_desc:0 "This ruler has shown unusual respect for the unwritten customs by which the isolated communities of Crackclaw Point govern themselves."

agot_brune_one_lord_of_the_claw_bla:0 "One Lord of the Claw"
agot_brune_one_lord_of_the_claw_bla_desc:0 "Local traditions may be old, but this ruler has made it clear that custom does not outrank lordly authority."

agot_brune_clawman_compromise_bla:0 "Clawman Compromise"
agot_brune_clawman_compromise_bla_desc:0 "Old local practice has been reconciled with more formal lordly administration rather than simply swept aside."

agot_crownlands_bla.0602.t:0 "The Bog Hunter"

agot_crownlands_bla.0602.desc:0 "Three armed thieves fled into the bogs after robbing travelers upon the edge of my lands.\n\nMy men searched for two days and found nothing.\n\n[brune_bog_hunter_bla.GetFullName] found them before noon.\n\nThe clawman followed a bent reed, mud disturbed beneath standing water, and a mark upon a pine that I would never have noticed. By dusk the thieves were bound together beneath a tree, while [brune_bog_hunter_bla.GetFirstName] seemed chiefly annoyed that everyone had made such a great matter of it.\n\n'A man leaves signs,' [brune_bog_hunter_bla.GetSheHe] says. 'You only need know which ones matter.'"

agot_crownlands_bla.0602.a:0 "A talent like that belongs in my service."
agot_crownlands_bla.0602.a.tt:0 "[brune_bog_hunter_bla.GetFullName] will join your court"

agot_crownlands_bla.0602.b:0 "I have quieter work for someone who can find anyone."
agot_crownlands_bla.0602.b.tt:0 "[brune_bog_hunter_bla.GetFullName] will join your court"

agot_crownlands_bla.0602.c:0 "Reward the hunter and send [brune_bog_hunter_bla.GetHerHim] home."
agot_crownlands_bla.0602.d:0 "Show my men how you did it."

agot_brune_lessons_of_the_bog_bla:0 "Lessons of the Bog"
agot_brune_lessons_of_the_bog_bla_desc:0 "Local hunters have taught this ruler's men how to read the difficult ground of Crackclaw Point rather than fight against it."

agot_crownlands_bla.0603.t:0 "A Battle Fought Sideways"

agot_crownlands_bla.0603.desc:0 "My household knight watches the clawmen drill with growing irritation.\n\nThey scatter when he orders them to form ranks. They disappear behind trees rather than hold a line. Men sent to guard one path appear unexpectedly upon another, while several seem to regard concealment in a bog as a perfectly respectable military maneuver.\n\n'They need discipline,' the knight insists. 'Put these men against proper soldiers and they will break.'\n\nAn older clawman snorts.\n\n'Put proper soldiers in there,' he says, pointing toward the woods, 'and they'll never find us to break.'"

agot_crownlands_bla.0603.a:0 "Teach them to fight as soldiers."
agot_crownlands_bla.0603.b:0 "Teach my soldiers to fight as clawmen."
agot_crownlands_bla.0603.c:0 "Enough arguing. We shall test both methods."
agot_crownlands_bla.0603.c.knights:0 "Discipline holds, and the household men carry the field"
agot_crownlands_bla.0603.c.clawmen:0 "The clawmen disappear into the country and dismantle the opposing force piece by piece"
agot_crownlands_bla.0603.c.mixed:0 "Neither side wins cleanly, and both discover something worth learning from the other"

agot_crownlands_bla.0603.d:0 "There is merit in both. I will show you."

agot_brune_drilled_clawmen_bla:0 "Drilled Clawmen"
agot_brune_drilled_clawmen_bla_desc:0 "The fighting men of these lands have been subjected to more conventional military discipline without entirely abandoning their local methods."

agot_brune_warfare_of_the_claw_bla:0 "Warfare of the Claw"
agot_brune_warfare_of_the_claw_bla_desc:0 "Rather than force the clawmen into unfamiliar formations, this ruler has embraced their knowledge of ambush, concealment, and difficult country."

agot_brune_blended_warfare_bla:0 "Steel Among the Pines"
agot_brune_blended_warfare_bla_desc:0 "Household discipline and the irregular fighting traditions of Crackclaw Point have been deliberately combined."

agot_crownlands_bla.0604.t:0 "A Feud in the Pines"

agot_crownlands_bla.0604.desc:0 "Three men are dead, a barn has burned, and two families upon the Point have begun carrying axes whenever they leave their homes.\n\nThe difficulty lies in discovering why.\n\nOne family claims the trouble began generations ago when their grandfather's grandfather had a pig stolen. The other insists the first offense concerned a woman and that the pig entered the story much later. An elderly neighbor remembers hearing that the woman stole the pig herself.\n\nNobody finds this uncertainty sufficient reason to stop killing one another.\n\nBoth families have finally come before me, each expecting House Brune to declare that the other has been wrong for the better part of a century."

agot_crownlands_bla.0604.a:0 "Everyone speaks. Everyone listens. Then this ends."
agot_crownlands_bla.0604.a.success:0 "Neither family is entirely satisfied, which may be the closest thing to justice available"
agot_crownlands_bla.0604.a.failure:0 "By the end of the hearing they are arguing over offenses nobody mentioned when it began"

agot_crownlands_bla.0604.b:0 "Silver has ended older quarrels than this."
agot_crownlands_bla.0604.c:0 "Both families will give me sureties for their peace."
agot_crownlands_bla.0604.d:0 "If neither remembers the beginning, perhaps they can decide the ending."

agot_brune_peace_of_the_pines_bla:0 "Peace of the Pines"
agot_brune_peace_of_the_pines_bla_desc:0 "Old quarrels among the clawmen have been settled with patience and compromise, bringing an uncommon measure of peace beneath the pines."

agot_brune_hard_peace_bla:0 "A Hard Peace"
agot_brune_hard_peace_bla_desc:0 "Order has returned to the pines, though few mistake it for friendship. Feuds have been suppressed through stern authority and the knowledge that renewed bloodshed will be answered swiftly."

agot_crownlands_bla.0605.t:0 "The Stranger's Justice"

agot_crownlands_bla.0605.desc:0 "The men seeking the fugitive arrived with horses, mail, and a parchment bearing enough seals to make their purpose appear respectable.\n\nThey say the man hiding among the clawmen is a murderer.\n\nThe village sheltering him tells another story. Their guest did kill a man, they admit readily enough, but only after that man beat a boy nearly senseless and drew steel upon the boy's father. To them, the matter is already settled.\n\nTo the armed strangers standing in my hall, it plainly is not.\n\n'He committed murder,' their leader says.\n\nOne of the clawmen beside me mutters, 'He killed a murderer.'"

agot_crownlands_bla.0605.a:0 "A lord cannot shelter every man who dislikes a judgment."
agot_crownlands_bla.0605.b:0 "He is beneath my protection while he remains upon the Point."

agot_crownlands_bla.0605.c:0 "Before I surrender anyone, I want the whole story."
agot_crownlands_bla.0605.c.success:0 "The strangers' account contains enough convenient omissions to make their demand considerably less convincing"
agot_crownlands_bla.0605.c.failure:0 "Every witness offers a different story, and certainty retreats with each answer"

agot_crownlands_bla.0605.d:0 "You demand a man from my lands. Prove your right to him."

agot_brune_law_before_custom_bla:0 "Law Before Custom"
agot_brune_law_before_custom_bla_desc:0 "This ruler has made clear that local loyalties do not place the people of the Point beyond established law."

agot_brune_shelter_of_the_claw_bla:0 "Shelter of the Claw"
agot_brune_shelter_of_the_claw_bla_desc:0 "The people of Crackclaw Point know that those accepted among them will not lightly be surrendered to outsiders."

agot_crownlands_bla.0606.t:0 "The Pinewood Muster"

agot_crownlands_bla.0606.desc:0 "They do not look like the levies of richer lands.\n\nThe men gathering beneath my banners wear boiled leather, old mail, homespun wool, and whatever else their families could provide. One carries a hunting bow. Another has an axe more accustomed to pine than plate. Spears outnumber swords by a considerable margin.\n\nA lord from the Reach might laugh at such a muster.\n\nThat lord would be wiser to notice how quietly these men move beneath the trees.\n\nThey know every bog, stream, ridge, and deer path for miles around. Give them better weapons and some discipline, and the Point may provide considerably more dangerous soldiers than their appearance suggests."

agot_crownlands_bla.0606.a:0 "Open the stores. Arm every man properly."
agot_crownlands_bla.0606.b:0 "I want fewer men and better ones."
agot_crownlands_bla.0606.c:0 "Keep them dispersed. I want the Point ready when called."
agot_crownlands_bla.0606.d:0 "I will make soldiers of them myself."

agot_brune_pinewood_muster_army:0 "Pinewood Muster"
agot_brune_picked_clawmen_army:0 "Picked Clawmen"
agot_brune_drilled_clawmen_army:0 "Drilled Clawmen"

agot_brune_clawmen_ready_bla:0 "Clawmen at the Ready"
agot_brune_clawmen_ready_bla_desc:0 "Rather than gather the fighting men of the Point into a standing force, this ruler has ensured that scattered communities remain prepared to answer a sudden summons."

agot_crownlands_bla.0607.t:0 "The Den"

agot_crownlands_bla.0607.desc:0 "No singer would mistake my seat for the Red Keep.\n\nGood.\n\nStone sits heavily upon the earth here, surrounded by pine, wet ground, and paths that become less convincing the farther one follows them. The walls are old enough to have acquired repairs in half a dozen different styles, and visitors accustomed to brighter courts sometimes struggle to understand why anyone would choose such a place for a lord's seat.\n\nThe clawmen understand perfectly.\n\nA hall need not glitter to be useful. A castle need not impress a traveler if that traveler cannot easily reach it in the first place.\n\nStill, House Brune has grown, and the Den may grow with it."

agot_crownlands_bla.0607.a:0 "Strengthen every wall and narrow every approach."
agot_crownlands_bla.0607.b:0 "Let the clawmen know there is always a hearth here for them."
agot_crownlands_bla.0607.c:0 "House Brune should possess a seat worthy of its name."
agot_crownlands_bla.0607.d:0 "Let outsiders keep underestimating it."

agot_brune_hard_den_bla:0 "The Hard Den"
agot_brune_hard_den_bla_desc:0 "The Brune seat has been strengthened with defense in mind above all else, turning an already difficult approach into an even more unpleasant prospect for an attacker."

agot_brune_open_hearth_of_the_claw_bla:0 "Open Hearth of the Claw"
agot_brune_open_hearth_of_the_claw_bla_desc:0 "The Brune seat has become a natural gathering place for clawmen seeking protection, judgment, fellowship, or a lord who still remembers their customs."

agot_brune_lordly_den_bla:0 "A Lordly Den"
agot_brune_lordly_den_bla_desc:0 "House Brune has invested in making its ancestral seat not merely defensible, but suitable for a family of consequence."

agot_brune_unassuming_stronghold_bla:0 "An Unassuming Stronghold"
agot_brune_unassuming_stronghold_bla_desc:0 "Visitors frequently mistake the rough appearance of the Brune seat for weakness. Those responsible for its defense are content to encourage the misunderstanding."

agot_crownlands_bla.0608.t:0 "The Claw Closes"

agot_crownlands_bla.0608.desc:0 "They entered the Point in good order.\n\nMail polished. Spears upright. Horses well fed. Wagons heavy with provisions. Their commander has fought real battles and plainly expects the clawmen to scatter before soldiers who know how to keep formation.\n\nFor the first day, everything goes according to his expectations.\n\nOn the second, one of his guides disappears.\n\nOn the third, a wagon overturns where the road becomes mud beneath standing water.\n\nBy the fourth, men are seeing movement between trees that vanishes whenever they pursue it.\n\nThe commander still has the stronger force.\n\nHe is merely beginning to discover that strength and usefulness are not always the same thing."

agot_crownlands_bla.0608.a:0 "Enough games. Meet them openly."
agot_crownlands_bla.0608.a.success:0 "The clawmen stand their ground and force the outsiders back."
agot_crownlands_bla.0608.a.failure:0 "The enemy's discipline proves costly to challenge in open fighting."

agot_crownlands_bla.0608.b:0 "Do not fight their army. Fight their march."
agot_crownlands_bla.0608.b.tt:0 "Every bog, stream, false path, and tree line becomes another weapon against the invaders."

agot_crownlands_bla.0608.c:0 "The Point itself will refuse them."
agot_crownlands_bla.0608.c.tt:0 "Food vanishes, bridges fail, guides misremember paths, and nobody admits knowing who is responsible"

agot_crownlands_bla.0608.d:0 "A few guides can lead an army remarkably far in the wrong direction."
agot_crownlands_bla.0608.d.success:0 "By the time the deception is discovered, the invading column has wasted days marching toward nowhere."
agot_crownlands_bla.0608.d.failure:0 "The false guides are discovered before they can do meaningful harm."

agot_crownlands_bla.0609.t:0 "The Claw Bends to No Man"

agot_crownlands_bla.0609.desc:0 "There are richer lands in Westeros.\n\nThere are straighter roads, taller castles, broader fields, and villages where a lord's rider can cross from one end of his holdings to the other without once sinking to the knee in black mud.\n\nLet them keep them.\n\nThe strength of Crackclaw Point has never been measured by the grandeur of its halls. It lies in people who know which trail disappears beneath a flood, which grove conceals a second path, where horses cannot follow, and which families will answer a summons before a raven could ever reach them.\n\nSuch folk have never loved distant masters.\n\nHouse Brune endures because we are not distant."

agot_crownlands_bla.0609.a:0 "No one shall know the Point better than House Brune."
agot_crownlands_bla.0609.b:0 "We rule clawmen because we are clawmen."
agot_crownlands_bla.0609.c:0 "Independent folk still require a strong lord."
agot_crownlands_bla.0609.d:0 "The Claw need not remain cut off from the realm."

agot_brune_lords_of_the_hidden_paths_bla:0 "Lords of the Hidden Paths"
agot_brune_lords_of_the_hidden_paths_bla_desc:0 "House Brune has made mastery of Crackclaw Point's difficult ground a cornerstone of its military tradition."

agot_brune_first_among_clawmen_bla:0 "First Among Clawmen"
agot_brune_first_among_clawmen_bla_desc:0 "This ruler draws authority from shared identity and old custom rather than treating the people of the Point as subjects to be governed from afar."

agot_brune_hard_lord_of_the_claw_bla:0 "Hard Lord of the Claw"
agot_brune_hard_lord_of_the_claw_bla_desc:0 "The people of Crackclaw Point value independence, but this ruler has ensured that independence does not become disobedience."

agot_brune_claw_and_crown_bla:0 "Claw and Crown"
agot_brune_claw_and_crown_bla_desc:0 "House Brune has begun balancing the traditions of Crackclaw Point with greater participation in the wider realm."