l_english:


agot_riverlands_bla.0600.t:0 "Sails Off the Cape"
agot_riverlands_bla.0600.desc:0 "Just past sunrise, the colossal bronze bell of the Booming Tower burst into a deafening, thunderous roar, rattling the masonry of the white keep. Far out beyond the freezing fogbanks of the Sunset Sea, the lookout had spotted the distinct, low-slung silhouettes of ironborn longships. Within minutes, the harbor was a scene of calculated chaos—fishermen were violently hauling their skiffs onto the shingle, merchant factors were locking their silver vaults, and our guards were running to the sea-walls.\n\nThough the reiver sails eventually melted back into the western mist, the grim terror of the Krakens never truly lifts from the Cape of Eagles."

agot_riverlands_bla.0600.a:0 "Lock the harbor chains and arm every scorpion on the wall!"
agot_riverlands_bla.0600.b:0 "Keep the sentries posted. We will not waste our arrows on ghosts."
agot_riverlands_bla.0600.c:0 "Let the sea-scum come. Our war-hammers are thirsty."

mallister_coastal_watch_bla:0 "Vigil of the Booming Tower"
mallister_coastal_watch_bla_desc:0 "Massive, pitch-soaked beacon-fires burn day and night along the cliffs of Seagard. The household guardsmen posted there curse the freezing salt-spray and the relentless gales, but no ironborn longship breaches our shallows undetected."

agot_riverlands_bla.0601.t:0 "The Stench of the Reaver"
agot_riverlands_bla.0601.desc:0 "The choking reek reached our battlements before the sun could breach the fogbanks—a foul gust of burning pine-tar, scorched kelp, and melted lard blowing directly off the Sunset Sea. By midday, our coastal outriders had arrived at the gatehouse with foam on their mounts, reporting that a fishing hamlet down the coast had been reduced to smoking ash. \n\nNo black sails have breached the shallows of our harbor yet, but every iron-capped watchman stands on the battlements with a sheathed blade, staring into the western mist."

agot_riverlands_bla.0601.a:0 "Keep the cross-bolts notched and the watchfires roaring!"
agot_riverlands_bla.0601.b:0 "Drop the iron harbor-chains. No rogue hull enters our channel tonight."
agot_riverlands_bla.0601.c:0 "Let the smallfolk shake. Terror keeps a sentry's eyes wide."
agot_riverlands_bla.0601.d:0 "Dull wits and marsh-paranoia. The reavers are miles away."

mallister_hardened_garrison_bla:0 "Iron-Cap Vigilance"
mallister_hardened_garrison_bla_desc:0 "Our household vanguards spend their nights locked in freezing steel plate, huddled behind stone merlons while the ocean swells hammer the base of the keeps. The Cape of Eagles breeds merciless defenders who know the exact price of an ironborn breach."

agot_riverlands_bla.0602.t:0 "The Harvest of the Surf"
agot_riverlands_bla.0602.desc:0 "The autumn gale broke against our battlements sometime during the night, and by dawn the jagged limestone rocks below Seagard were choked with the brutal machinery of a shipwreck. Splintered hull-planks, soaked wool-sacks, and bloated corpses tangled in kelp have washed into the shallows.\n\nA few half-drowned survivors are still shivering on the outer reefs, while our garrison men-at-arms argue over the shipwreck. The cargo is drifting on the breakers, and our bailiffs demand we claim the salvage before the tide pulls the silver back into the deep."

agot_riverlands_bla.0602.a:0 "Drag the survivors ashore. If they are merchants, they will pay for their breath."
agot_riverlands_bla.0602.b:0 "The sea broke the ship, but the right of the strand belongs to Seagard!"
agot_riverlands_bla.0602.c:0 "Send the levies into the surf! Haul the crates up."
agot_riverlands_bla.0602.d:0 "Leave the wreckage to the gulls. The sea-god always claims his due."

mallister_salvaged_cargo_bla:0 "Strand-Wreck Spoils"
mallister_salvaged_cargo_bla_desc:0 "Our vaults are packed with water-damaged Myrish silks, wet spice-chests, and reclaimed silver coinage salvaged directly from the coastal reefs. The sea may shatter ships, but it feeds our treasury well."

agot_riverlands_bla.0603.t:0 "The Fallen Sentry"
agot_riverlands_bla.0603.desc:0 "The relentless pounding of the western gales has finally claimed one of our ancient First Men watchposts along the Cape of Eagles. Its foundation stones, heavily stained with salt-crust and pitch-soot, have collapsed directly into the crashing breakers below, completely shattering the upper masonry steps.\n\nThe local fisherfolk are already muttering that this was the very beacon that first signaled the Booming Tower when Dagon Greyjoy's longships invaded a century ago. With the promontory sitting entirely dark tonight, our coastal galley captains are deeply uneasy about the blind spot in our waters."

agot_riverlands_bla.0603.a:0 "Draft the local stonemasons! Rebuild the platform and restack the pitch-baskets."
agot_riverlands_bla.0603.b:0 "Force the coastal smallfolk to man the ruins with hand-lanterns."
agot_riverlands_bla.0603.c:0 "Let the tides take it. We have high white walls to defend the harbor."
agot_riverlands_bla.0603.d:0 "A light upon the crags is worth a hundred blades in the dark."

mallister_rekindled_watchfires_bla:0 "The Cape Fire-Line"
mallister_rekindled_watchfires_bla_desc:0 "The ancient line of pitch-baskets along the western cliffs has been thoroughly restored. Our coastal outriders maintain a heavy vigil, casting a roaring glare across the breakers to blind sneaking reivers."

mallister_signal_network_bla:0 "Vigil of the Booming Tower"
mallister_signal_network_bla_desc:0 "Our restored network of cliff-beacons, fast outriders, and skiff-scouts ensures that any unauthorized sail breaching Ironman's Bay is instantly signaled directly to Seagard's master-garrison."

agot_riverlands_bla.0604.t:0 "The Iron Price in Chains"
agot_riverlands_bla.0604.desc:0 "The captured ironborn raider has spent three days shackled to the damp limestone walls of our lowest keep-dungeon, yet his grin remains as mocking as the day we dragged him from the surf. This morning, he spit blood onto our master-at-arms' boots, demandingly howling for salt water to perform his primitive baptismal rites while mocking our threats of execution.\n\nOur veteran knights warn that these zealots are entirely numb to the fear of a common noose. They have spent their miserable lives listening to the thundering waves of Pyke, entirely convinced that the Drowned God will summon them to an eternal feasting hall the moment their breath fails."

agot_riverlands_bla.0604.a:0 "Hang him from the sea-gate at dawn to rot in the salt air!"
agot_riverlands_bla.0604.b:0 "Drown him in a flagon of fresh river-water—let him meet his god today."
agot_riverlands_bla.0604.c:0 "Strip his gear and audit his longship's hidden plunder trunks."
agot_riverlands_bla.0604.d:0 "Toss the fanatic back into the breakers. He isn't worth the price of a rope."

mallister_seized_reaver_plunder_bla:0 "Reclaimed Reiver Spoils"
mallister_seized_reaver_plunder_bla_desc:0 "Heavy iron broad-axes, raw Northern amber, and salt-crusted silver coins have been stripped from the captured marauders. We have quietly melted down their plunder to fund the reinforcement of our harbor walls."


