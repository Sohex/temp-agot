l_english:

agot_crownlands_bla.0900.t:0 "The King's Road"

agot_crownlands_bla.0900.desc:0 "The first riders were easy enough to accommodate.\n\nThen came the wagons.\n\nBehind them came men-at-arms, servants, merchants, smiths, drovers, cooks, grooms, washerwomen, and enough horses to consume half the fodder in the countryside if allowed to linger.\n\nThe road toward King's Landing has always brought opportunity through Rosby. Unfortunately, opportunity has an appetite.\n\nMy steward reports that local merchants are delighted. The farmers are rather less so."

agot_crownlands_bla.0900.a:0 "See that they are properly provisioned."
agot_crownlands_bla.0900.b:0 "If they require Rosby's goods, they will pay Rosby's prices."
agot_crownlands_bla.0900.c:0 "Our own people receive what they need first."
agot_crownlands_bla.0900.d:0 "Feed them enough to keep them marching."

agot_rosby_generous_provision_bla:0 "Generous Provision"
agot_rosby_generous_provision_bla_desc:0 "Rosby's stores have been opened generously to travelers and forces passing toward the capital, earning useful gratitude."

agot_rosby_roadside_trade_bla:0 "Roadside Trade"
agot_rosby_roadside_trade_bla_desc:0 "The constant flow of people toward King's Landing has been turned into a profitable trade, though the locals increasingly resent the prices it brings."

agot_rosby_guarded_stores_bla:0 "Guarded Stores"
agot_rosby_guarded_stores_bla_desc:0 "House Rosby has made clear that the needs of its own lands come before those of every traveler bound for King's Landing."

agot_rosby_keep_them_moving_bla:0 "Keep Them Moving"
agot_rosby_keep_them_moving_bla_desc:0 "Travelers receive enough assistance to continue toward the capital, but little encouragement to linger in Rosby lands."

agot_crownlands_bla.0901.t:0 "A Guest from King's Landing"

agot_crownlands_bla.0901.desc:0 "The gates opened well after dark.\n\n[rosby_fugitive_courtier_bla.GetFullName] arrived with a tired horse, a small purse, and none of the servants one would expect from someone accustomed to the royal court.\n\nThe explanation comes only after the doors are closed.\n\nThere has been some disagreement in King's Landing. Names are mentioned carefully. Others are conspicuously avoided. Whatever happened, [rosby_fugitive_courtier_bla.GetFirstName] believed it prudent to be beyond the city walls before sunrise.\n\n'I ask only a roof for the night,' [rosby_fugitive_courtier_bla.GetSheHe] says.\n\nPeople fleeing King's Landing rarely bring only themselves."

agot_crownlands_bla.0901.a:0 "You may remain beneath my protection."
agot_crownlands_bla.0901.a.tt:0 "[rosby_fugitive_courtier_bla.GetFullName] will join your court"

agot_crownlands_bla.0901.b:0 "First, tell me what happened in the capital."
agot_crownlands_bla.0901.b.success:0 "Your guest knows considerably more than was first admitted, and some knowledge can be made profitable"
agot_crownlands_bla.0901.b.failure:0 "Whatever drove your guest from King's Landing remains frustratingly obscure"

agot_crownlands_bla.0901.c:0 "I will not quarrel with the court on your behalf."
agot_crownlands_bla.0901.d:0 "Rest tonight. At dawn, you continue elsewhere."
agot_crownlands_bla.0901.d.tt:0 "You offer temporary sanctuary without becoming entangled in the fugitive's troubles"

agot_crownlands_bla.0902.t:0 "The Gates of Rosby"

agot_crownlands_bla.0902.desc:0 "They arrive first in dozens and then in hundreds.\n\nFarmers carrying children. Apprentices with their tools wrapped in blankets. A merchant pulling what remains of his household behind a mule. Old men who have walked farther in two days than they usually travel in a year.\n\nWhatever disorder has seized the roads nearer King's Landing, these people believe Rosby lies far enough away to escape it.\n\nMy captain looks toward the gathering crowd beneath the walls.\n\n'If we open the gates,' he warns, 'more will come.'\n\nMy steward adds the obvious second half.\n\n'If we feed them, they will eat.'"

agot_crownlands_bla.0902.a:0 "Open the gates. We will find room."
agot_crownlands_bla.0902.b:0 "Establish camps outside and distribute provisions."
agot_crownlands_bla.0902.c:0 "We cannot take everyone. Find those who can strengthen Rosby."
agot_crownlands_bla.0902.c.tt:0 "Craftsmen, smiths, masons, and other useful workers are offered a place within your lands"
agot_crownlands_bla.0902.d:0 "Close the gates before the crowd grows larger."

agot_rosby_open_gates_bla:0 "The Open Gates of Rosby"
agot_rosby_open_gates_bla_desc:0 "House Rosby has spent heavily to shelter common folk displaced by turmoil around the capital."

agot_rosby_ordered_refuge_bla:0 "Ordered Refuge"
agot_rosby_ordered_refuge_bla_desc:0 "Refugees have been sheltered and supplied without being allowed to overwhelm Rosby's settlements."

agot_rosby_refugee_craftsmen_bla:0 "New Hands in Rosby"
agot_rosby_refugee_craftsmen_bla_desc:0 "Skilled people displaced from elsewhere have been encouraged to settle permanently in Rosby lands."

agot_rosby_closed_gates_bla:0 "Closed Gates"
agot_rosby_closed_gates_bla_desc:0 "House Rosby has chosen security over charity, keeping displaced outsiders beyond its walls."

agot_crownlands_bla.0903.t:0 "Beneath the Capital's Shadow"

agot_crownlands_bla.0903.desc:0 "King's Landing is close enough that on a clear day a rider can leave Rosby after sunrise and reach the city before nightfall.\n\nThat distance has shaped our house as surely as blood.\n\nRoyal messengers pass our roads. Merchants carry news from the city. Courtiers remember Rosby when they require a convenient friend beyond the walls, and armies remember us whenever thousands of hungry men require food and shelter.\n\nWhen the capital prospers, some of that prosperity travels outward.\n\nWhen it burns, the smoke travels too.\n\nHouse Rosby cannot move farther away.\n\nWe can only decide what sort of neighbor we intend to be."

agot_crownlands_bla.0903.a:0 "Let the capital learn that it cannot do without Rosby."
agot_crownlands_bla.0903.b:0 "What happens in King's Landing should never surprise us."
agot_crownlands_bla.0903.c:0 "When the city burns, Rosby's gates must hold."
agot_crownlands_bla.0903.d:0 "We are House Rosby, not an appendage of King's Landing."

agot_rosby_indispensable_neighbor_bla:0 "Indispensable Neighbor"
agot_rosby_indispensable_neighbor_bla_desc:0 "House Rosby has deliberately made its estates, stores, and services increasingly valuable to the nearby capital."

agot_rosby_eyes_on_the_capital_bla:0 "Eyes on the Capital"
agot_rosby_eyes_on_the_capital_bla_desc:0 "News, rumors, servants, merchants, and courtiers ensure that developments in King's Landing rarely reach House Rosby entirely unexpectedly."

agot_rosby_guarded_doorstep_bla:0 "Guarded Doorstep"
agot_rosby_guarded_doorstep_bla_desc:0 "Proximity to King's Landing has taught House Rosby that turmoil in the capital can reach its neighbors with frightening speed."

agot_rosby_beyond_the_city_bla:0 "Beyond the City"
agot_rosby_beyond_the_city_bla_desc:0 "House Rosby benefits from its proximity to King's Landing without allowing the fortunes of the capital to define its own."