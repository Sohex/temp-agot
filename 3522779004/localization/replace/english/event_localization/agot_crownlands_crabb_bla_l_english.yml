l_english:

agot_crownlands_bla.0500.t:0 "The Heads of Clarence Crabb"

agot_crownlands_bla.0500.desc:0 "Every child upon Crackclaw Point knows some version of the tale.\n\nSer Clarence Crabb was said to have been a monstrous man, eight feet tall and strong enough to tear lesser knights apart. When he slew men of renown, the stories claim that he carried their severed heads back to the Whispers, where his wife — a woman remembered as a woods witch — preserved them and called upon their dead tongues for counsel.\n\nMaesters have their doubts. Septons have stronger words still.\n\nThe clawmen care little for either.\n\nEven now, travelers speak softly when the Whispers are mentioned, and some among my own people insist that the old heads were never all accounted for.\n\nWhatever truth once lay beneath the tale has long since become something more powerful: a story people still fear."

agot_crownlands_bla.0500.a:0 "Clarence Crabb was our blood. Let them remember him."
agot_crownlands_bla.0500.b:0 "Every tale begins somewhere. Find where this one began."
agot_crownlands_bla.0500.c:0 "If they fear the story, I see no reason to correct them."
agot_crownlands_bla.0500.d:0 "I have little use for dead men's heads."

agot_crabb_legacy_of_clarence_bla:0 "Legacy of Clarence Crabb"
agot_crabb_legacy_of_clarence_bla_desc:0 "This character openly celebrates the legendary strength and bloody reputation attributed to Ser Clarence Crabb."

agot_crabb_whispers_reputation_bla:0 "Whispers of the Crabb"
agot_crabb_whispers_reputation_bla_desc:0 "Rather than dispute the darker stories told about House Crabb and the Whispers, this character has discovered that an old fear can be a useful inheritance."

agot_crownlands_bla.0501.t:0 "The Whispers"

agot_crownlands_bla.0501.desc:0 "Part of an old wall at the Whispers has fallen after days of rain.\n\nBehind it lies a narrow opening descending beneath the ruins. The men who discovered it ventured only far enough to establish that the passage continues beyond the reach of daylight.\n\nThen one remembered the stories.\n\nThey have refused to go farther without my command."

agot_crownlands_bla.0501.desc_scholar:0 "My inquiries into the stories of Clarence Crabb have finally produced something more substantial than tavern tales.\n\nPart of an old wall at the Whispers has collapsed after days of rain, revealing a passage beneath the ruins that does not appear upon any surviving description of the place.\n\nIf there is any truth hidden beneath generations of embellishment, an unopened chamber may preserve it."

agot_crownlands_bla.0501.desc_fear:0 "I have spent some time ensuring that the darker stories surrounding the Whispers remain alive upon Crackclaw Point.\n\nIt seems the stories have worked too well.\n\nA collapsed wall has revealed an unknown passage beneath the ruins, and the men who found it now refuse to enter. One insists he heard something moving below. Another claims the air coming from the opening smelled of an opened grave.\n\nNeither seems amused when reminded how eagerly they repeat such tales to travelers."

agot_crownlands_bla.0501.desc_legend:0 "The Whispers has yielded another fragment of the world associated with Clarence Crabb.\n\nAfter days of rain, part of an ancient wall collapsed and exposed a narrow passage descending beneath the ruins. No one knows when it was sealed or what lies beyond it.\n\nThe clawmen who found the opening have already decided that it must belong to Clarence.\n\nHistory may require rather more evidence."

agot_crownlands_bla.0501.a:0 "If there is something below, I will see it myself."
agot_crownlands_bla.0501.b:0 "Send men with torches and tools."
agot_crownlands_bla.0501.c:0 "Find clawmen who know these ruins."
agot_crownlands_bla.0501.d:0 "Nothing is to be disturbed until I examine it."
agot_crownlands_bla.0501.e:0 "Seal the opening."

agot_crownlands_bla.0502.t:0 "Beneath the Whispers"

agot_crownlands_bla.0502.desc_common:0 "The passage beneath the Whispers leads eventually to several cramped chambers choked with dirt and fallen stone.\n\nWhat remains within is disappointingly mortal: fragments of pottery, rusted iron, rotted wood, and a scattering of coins whose markings are barely recognizable.\n\nNo giant's treasure. No witch's chamber. No speaking dead.\n\nStill, old things need not be magical to possess value."

agot_crownlands_bla.0502.desc_dead:0 "The passage beneath the Whispers ends in a chamber containing the remains of several men.\n\nTime has stripped them of names, but not of every wound. One skull is split above the temple. Another skeleton lies with a rusted blade lodged between its ribs. Several appear to have been cast into the chamber rather than carefully buried.\n\nThey may be victims of war, murder, execution, or something considerably less dramatic than the tales told above.\n\nThe Whispers offers no explanation."

agot_crownlands_bla.0502.desc_large_bones:0 "At the end of the passage lies a grave unlike the others.\n\nThe skeleton within belonged to an enormous man. Even allowing for the exaggerations produced by torchlight and excited witnesses, the bones are unusually long and heavily built.\n\nSomeone whispers the name before I can prevent it.\n\nClarence.\n\nThere is no inscription. No sigil. Nothing upon the remains can tell us whose bones these truly are.\n\nThat detail will undoubtedly vanish by the time the tale reaches the nearest village."

agot_crownlands_bla.0502.desc_skulls:0 "Behind a second wall we find a chamber too deliberate to dismiss as rubble.\n\nHuman skulls occupy niches cut into the stone.\n\nSome are badly damaged. Others remain almost whole. Whatever else once occupied the chamber has long since rotted away, and there is no inscription explaining why the dead were arranged in such a fashion.\n\nNobody speaks for several moments.\n\nThen one of the clawmen beside me mutters that perhaps Clarence's wife did not keep all her husband's trophies above ground."

agot_crownlands_bla.0502.a:0 "Not every old chamber contains a legend."
agot_crownlands_bla.0502.b:0 "Someone died badly down here."
agot_crownlands_bla.0502.c:0 "Do not call him Clarence. Not yet."
agot_crownlands_bla.0502.d:0 "Count them. Carefully."

agot_crownlands_bla.0503.t:0 "A Voice Without a Throat"

agot_crownlands_bla.0503.desc:0 "The guard insists he was awake.\n\nHe had been stationed outside the newly opened chamber beneath the Whispers when he heard something behind him. At first he mistook it for another man speaking farther down the passage.\n\nThen it came again.\n\nOne word, he says. Perhaps two.\n\nWhen he turned, the chamber was empty save for the dead.\n\nHe cannot tell me what was said. Indeed, with every retelling he seems less certain that he heard words at all. Air moving through the newly opened passages could produce strange sounds. Loose stone can shift. Frightened men have heard voices in running water and crackling fires since the dawn of days.\n\nYet when I enter the chamber, I notice that one skull has fallen from its niche.\n\nIt lies facing the doorway."

agot_crownlands_bla.0503.a:0 "A skull has no tongue. There is an explanation."
agot_crownlands_bla.0503.b:0 "Bring a septon down here."
agot_crownlands_bla.0503.c:0 "Put it back where we found it."
agot_crownlands_bla.0503.d:0 "Very well. What do you have to say?"

agot_crownlands_bla.0503.d.nothing:0 "You wait in silence. Nothing answers."
agot_crownlands_bla.0503.d.wind:0 "Something stirs in the darkness, though it may only be air passing through the ancient stones."
agot_crownlands_bla.0503.d.whisper:0 "For one brief moment, you are no longer certain that the stories are merely stories."

agot_crabb_words_from_the_dark_bla:0 "Words from the Dark"
agot_crabb_words_from_the_dark_bla_desc:0 "Something happened beneath the Whispers. Whether it was imagination, ancient stone, or something less easily explained, this character has never entirely forgotten it."

agot_crownlands_bla.0504.t:0 "The Blood of Clarence"

agot_crownlands_bla.0504.desc:0 "A remarkable man has come out of the Point.\n\n[crabb_clarence_descendant_bla.GetFullName] stands taller than most knights and has already earned a reputation in local contests, tavern fights, and several less organized demonstrations of his strength. Yet it is not his size that has brought him before me.\n\nHis grandmother, he says, knew the names of her forebears back through generations, until at last the line reached an unacknowledged son of Ser Clarence Crabb.\n\nThere is no parchment proving any of this. No maester recorded the birth. No lord placed a seal beneath the claim.\n\nBut [crabb_clarence_descendant_bla.GetFirstName] certainly looks like the sort of man the singers would give Clarence for a grandson."

agot_crownlands_bla.0504.a:0 "Whatever his blood, I can use that sword."
agot_crownlands_bla.0504.a.tt:0 "[crabb_clarence_descendant_bla.GetFullName] will join your court."

agot_crownlands_bla.0504.b:0 "Look at him. Who would dare doubt the tale?"
agot_crownlands_bla.0504.b.tt:0 "[crabb_clarence_descendant_bla.GetFullName] will join your court."

agot_crownlands_bla.0504.c:0 "Clarence was famed for strength. Show me yours."
agot_crownlands_bla.0504.c.success:0 "You prove that a Crabb requires more than size to be formidable."
agot_crownlands_bla.0504.c.failure:0 "[crabb_clarence_descendant_bla.GetFirstName] proves frighteningly worthy of his claimed ancestor."

agot_crownlands_bla.0504.d:0 "A grandmother's tale does not make him my kin."

agot_crownlands_bla.0505.t:0 "Something in the Water"

agot_crownlands_bla.0505.desc:0 "The fishermen tell the story reluctantly.\n\nSomething has been moving through the shallows after dark. Nets have been torn. Two goats vanished from a field near the water, and one fisherman claims to have seen a pale shape disappear beneath the surface when he raised his lantern.\n\nTracks were found in the mud the following morning, though no two men agree upon their shape.\n\nA smuggler, says one.\n\nA seal, says another.\n\nAn old woman spits into the mud when she hears them.\n\n'Squishers.'\n\nThe younger men laugh rather more loudly than necessary."

agot_crownlands_bla.0505.a:0 "Hunt whatever is making those tracks."
agot_crownlands_bla.0505.a.smugglers:0 "Your hunters find signs that men, rather than beasts, have been moving through part of the marsh."
agot_crownlands_bla.0505.a.animal:0 "The trail continues deeper into the wetlands."
agot_crownlands_bla.0505.a.nothing:0 "After an exhausting search, the trail simply disappears."
agot_crownlands_bla.0505.a.tracks:0 "The tracks lead directly into the sea — and does not return."

agot_crownlands_bla.0505.b:0 "Study the tracks before deciding what they mean."
agot_crownlands_bla.0505.b.mundane:0 "Careful examination explains the strange impressions as ordinary tracks distorted by mud and tide."
agot_crownlands_bla.0505.b.animal:0 "The tracks reveal enough consistent detail to suggest that a sizable creature can be followed."
agot_crownlands_bla.0505.b.strange:0 "Several impressions stubbornly resist any convincing identification."

agot_crownlands_bla.0505.c:0 "Set traps along the waterline."
agot_crownlands_bla.0505.c.success:0 "Before long, one of your traps is sprung."
agot_crownlands_bla.0505.c.failure:0 "The traps remain empty until weather and tide finally ruin them."

agot_crownlands_bla.0505.d:0 "Crackclaw has enough monsters already."
agot_crownlands_bla.0505.d.tt:0 "You dismiss the entire affair as another tale grown in the telling."

agot_crabb_tracks_into_the_sea_bla:0 "Tracks into the Sea"
agot_crabb_tracks_into_the_sea_bla_desc:0 "This character has seen peculiar tracks upon the shores of Crackclaw Point which entered the sea and did not emerge again. There is undoubtedly a reasonable explanation."

agot_crownlands_bla.0506.t:0 "The Bog Road"

agot_crownlands_bla.0506.desc:0 "A rider arrived this morning bearing an embarrassing message.\n\nA representative of my liege entered Crackclaw Point several days ago with an escort and the firm conviction that the road upon his map actually existed.\n\nIt does not.\n\nAfter following a track through the pines, crossing the same stream twice, losing a horse in the mud, and apparently spending one entire afternoon traveling in a circle, the party has admitted defeat.\n\nThey now request guides from House Crabb.\n\nThe clawman who brought me the message has been struggling unsuccessfully not to smile."

agot_crownlands_bla.0506.a:0 "Send guides before they lose another horse."
agot_crownlands_bla.0506.b:0 "A man who needs a clawman's guidance can pay for it."
agot_crownlands_bla.0506.c:0 "Perhaps another night will improve their sense of direction."
agot_crownlands_bla.0506.d:0 "Come. I shall show them what passes for a road here."

agot_crabb_knows_the_point_bla:0 "Knows the Point"
agot_crabb_knows_the_point_bla_desc:0 "Bog, pine, stream, and half-vanished trail are as legible to this character as any lord's road."

agot_crownlands_bla.0507.t:0 "The Grave Beneath the Pine"

agot_crownlands_bla.0507.desc:0 "A great pine came down during the night's storm, taking half the hillside with its roots.\n\nBeneath them lay a grave.\n\nThe dead man was buried with a sword, remnants of mail, and a corroded fastening upon which a device can still barely be seen. Time has rendered the design uncertain. One of my household sees a crab. Another insists it is merely damage upon the metal.\n\nThe burial is plainly old. How old is harder to say.\n\nAlready the men who discovered it are calling the corpse an ancestor of House Crabb.\n\nThe dead man himself remains conspicuously silent upon the question."

agot_crownlands_bla.0507.a:0 "Whoever he was, return him to the earth."
agot_crownlands_bla.0507.b:0 "Examine everything before the grave is closed."
agot_crownlands_bla.0507.b.success:0 "The burial is confirmed to be exceptionally ancient, though the dead man's identity remains unknowable"
agot_crownlands_bla.0507.b.failure:0 "Age has destroyed whatever evidence might once have identified the warrior"
agot_crownlands_bla.0507.c:0 "Look at the device. One of our own has come home."
agot_crownlands_bla.0507.d:0 "The dead have little need of iron or silver."

agot_crabb_old_blood_of_the_point_bla:0 "Old Blood of the Point"
agot_crabb_old_blood_of_the_point_bla_desc:0 "An ancient warrior uncovered beneath the pines has been proclaimed an early forebear of House Crabb. Whether the claim is true matters somewhat less now that people have begun repeating it."

agot_crownlands_bla.0508.t:0 "The Whispers Remember"

agot_crownlands_bla.0508.desc_common:0 "I return to the Whispers expecting, perhaps foolishly, that the place will seem different.\n\nIt does not.\n\nThe same broken stones stand among the trees. Wind passes through empty windows, and birds nest where men once walked. The chambers beneath the ruins yielded no witch's secrets, no speaking dead, and nothing that could transform an old tale into certain history.\n\nYet the stories have already changed.\n\nMen now speak not only of Clarence Crabb and his wife, but of the day when another Crabb opened the earth beneath the Whispers and went searching for the truth.\n\nI sought an old legend.\n\nWithout intending it, I may have added to one."

agot_crownlands_bla.0508.desc_dead:0 "The Whispers seems quieter than I remember it.\n\nBeneath my feet lie the nameless dead we uncovered — men who met violent ends long enough ago that even their killers have been forgotten. Whether they died in Clarence Crabb's day, a forgotten war, or some private slaughter, I cannot say.\n\nThe distinction has mattered little to the storytellers.\n\nAlready there are versions in which every corpse belonged to a knight slain by Clarence himself.\n\nHistory decays slowly. Stories grow overnight."

agot_crownlands_bla.0508.desc_bones:0 "The tale has escaped me.\n\nBy the time I return to the Whispers, the enormous skeleton found beneath the ruins is no longer merely that of an unusually large man. In nearby villages it has become Clarence Crabb himself.\n\nSome claim the bones were eight feet long. Others say nine. One fisherman solemnly assures me that the dead man's hands were large enough to close around another man's skull.\n\nNone of these men saw the grave.\n\nIt hardly matters now.\n\nPerhaps this is how Clarence became Clarence in the first place."

agot_crownlands_bla.0508.desc_skulls:0 "The skulls remain beneath the Whispers.\n\nTheir empty sockets have provided no names, no dates, and no explanation for why someone placed them so carefully within the stone. Yet uncertainty has done nothing to restrain the stories spreading across the Point.\n\nThey were knights, some say. Pirates, say others. Men killed by Clarence. Men questioned by his wife. Men who continued answering long after death.\n\nI know only what I saw.\n\nThe stories know considerably more."

agot_crownlands_bla.0508.desc_questioned:0 "I once stood beneath the Whispers and asked a dead man's skull a question.\n\nThere are decisions that seem considerably stranger when remembered in daylight.\n\nWhatever I heard — or imagined I heard — has never become clearer. Yet somehow the story escaped the chamber. The clawmen now whisper that a Crabb once again sought counsel from the dead beneath the ruins.\n\nSome versions insist the skull answered.\n\nA few even claim to know what it said.\n\nNone have thought to ask me."

agot_crownlands_bla.0508.a:0 "Then let Clarence's legend belong to us."
agot_crownlands_bla.0508.b:0 "Write what we know. Leave the rest to fools."
agot_crownlands_bla.0508.c:0 "Correct them? Why would I do that?"
agot_crownlands_bla.0508.d:0 "Let the Whispers keep its secrets."

agot_crabb_keeper_of_the_old_tales_bla:0 "Keeper of the Old Tales"
agot_crabb_keeper_of_the_old_tales_bla_desc:0 "The ancient stories surrounding House Crabb are being preserved and celebrated rather than surrendered to skeptical maesters and fading memory."

agot_crabb_chronicler_of_the_whispers_bla:0 "Chronicler of the Whispers"
agot_crabb_chronicler_of_the_whispers_bla_desc:0 "This character has attempted to separate what can actually be learned of the Whispers from the centuries of stories surrounding its ruins."

agot_crabb_shadow_of_the_whispers_bla:0 "Shadow of the Whispers"
agot_crabb_shadow_of_the_whispers_bla_desc:0 "Dark stories have always clung to the Whispers. Under this character, those stories have begun to cling to House Crabb once more."

agot_crownlands_bla.0509.t:0 "A Crabb of Crackclaw"

agot_crownlands_bla.0509.desc:0 "Beyond Crackclaw Point, men know House Crabb through stories.\n\nThey know Clarence, if they know us at all. They know the Whispers. They know tales of witches, severed heads, bogs, squishers, and clawmen who vanish into woods where armored knights lose their way.\n\nLet them have their stories.\n\nThe Point is more than that.\n\nIt is pine and stone, mud and saltwater, poor roads and hidden paths. It is fishermen who know every inlet, hunters who can cross ground an outsider considers impassable, and stubborn folk who have never been particularly impressed by the claims of distant lords.\n\nHouse Crabb belongs to this place as thoroughly as any ruined tower or weathered stone.\n\nThe question is what others shall learn to associate with our name."

agot_crownlands_bla.0509.a:0 "Let them remember the blood of Clarence Crabb."
agot_crownlands_bla.0509.b:0 "The Point protects its own."
agot_crownlands_bla.0509.c:0 "Let outsiders fear what they do not understand."
agot_crownlands_bla.0509.d:0 "Our descendants deserve more than old stories."

agot_crabb_blood_of_clarence_bla:0 "Blood of Clarence"
agot_crabb_blood_of_clarence_bla_desc:0 "House Crabb has embraced the martial legend of Clarence Crabb as an example for a new generation of warriors."

agot_crabb_the_point_protects_its_own_bla:0 "The Point Protects Its Own"
agot_crabb_the_point_protects_its_own_bla_desc:0 "The strength of House Crabb lies not merely in its castle or bloodline, but in the stubborn people and difficult country of Crackclaw Point."

agot_crabb_clawman_reputation_bla:0 "Clawman Reputation"
agot_crabb_clawman_reputation_bla_desc:0 "Outsiders have heard enough unpleasant stories about House Crabb and Crackclaw Point that few are eager to discover which ones are true."

agot_crabb_future_of_the_point_bla:0 "Future of the Point"
agot_crabb_future_of_the_point_bla_desc:0 "Ancient legends have their place, but this character intends to leave House Crabb stronger in substance rather than merely richer in stories."

agot_crownlands_bla.0510.t:0 "Something in the Reeds"

agot_crownlands_bla.0510.desc_hunt:0 "For two days we follow broken reeds, gouges in the mud, and prints half-lost beneath the tide.\n\nThe clawmen with me grow quieter the farther we go. Every man has heard a different story about what moves through the waters of Crackclaw Point after dark.\n\nAt last there is movement ahead.\n\nI raise a hand, and the hunting party stops."

agot_crownlands_bla.0510.desc_study:0 "The tracks become more revealing the farther we follow them.\n\nWhatever left them is heavy. It moves comfortably through mud and shallow water, though several impressions are distorted badly enough that no two of my companions agree upon their shape.\n\nThen something shifts among the reeds ahead.\n\nFor the first time, the tracks may have an owner."

agot_crownlands_bla.0510.desc:0 "Something moves among the reeds ahead."

agot_crownlands_bla.0510.a:0 "So that is what frightened them."
agot_crownlands_bla.0510.a.tt:0 "The supposed monster proves to be an ordinary creature whose tracks were distorted by mud, water, and fearful imaginations."

agot_crownlands_bla.0510.b:0 "That is no small beast."
agot_crownlands_bla.0510.b.tt:0 "The creature is real enough — unusually large, aggressive, and quite capable of explaining several recent disappearances."

agot_crownlands_bla.0510.c:0 "...What was that?"
agot_crownlands_bla.0510.c.tt:0 "You glimpse something retreat into the water, but neither the tracks nor the brief sighting provide an answer you are willing to swear to."

agot_crownlands_bla.0511.t:0 "The Trap is Sprung"

agot_crownlands_bla.0511.desc:0 "The shouting begins before dawn.\n\nI reach the shore expecting teeth, claws, or perhaps another tale for frightened children.\n\nInstead, my men have dragged a cursing man from one of the concealed pits we prepared beside the reeds.\n\nNearby lie two small boats, several covered bundles, and a narrow path through the marsh that someone has taken great care to hide.\n\nThere was indeed something creeping from the water at night.\n\nIt simply happened to walk on two legs."

agot_crownlands_bla.0511.a:0 "Then the cargo belongs to House Crabb."
agot_crownlands_bla.0511.a.tt:0 "The concealed goods are confiscated and the men responsible driven from your shores."

agot_crownlands_bla.0511.b:0 "Before we arrest anyone, show me where this path leads."
agot_crownlands_bla.0511.b.tt:0 "Interrogation reveals hidden landing places and smuggling paths along the Crackclaw coast."

agot_crownlands_bla.0511.c:0 "Let every thief upon the Point hear what happened here."
agot_crownlands_bla.0511.c.tt:0 "The captured men are punished publicly as a warning to others using the hidden coast."

agot_crownlands_bla.0511.d:0 "Perhaps there is another use for such a convenient route."
agot_crownlands_bla.0511.d.tt:0 "The smugglers are permitted to continue under an arrangement decidedly more profitable to their lord."

agot_crabb_hidden_landings_bla:0 "Hidden Landings of Crackclaw"
agot_crabb_hidden_landings_bla_desc:0 "Smugglers have revealed forgotten tracks, concealed coves, and obscure landing places along the difficult shores of Crackclaw Point."