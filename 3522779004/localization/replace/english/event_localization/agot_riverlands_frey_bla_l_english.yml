l_english:

agot_riverlands_bla.0500.t:0 "The Bridge Must Be Paid"
agot_riverlands_bla.0500.desc:0 "The road leading up to the Twins has dissolved into a soup of churned mud and horse manure. Carts and pack mules are backed up for miles, their drivers shouting over the roar of the Green Fork while soaked guardsmen stand firm before the iron-studded gates.\n\nA wealthy wool merchant is waving a fistful of silver stags at the gatehouse steps, screaming that his stock will rot in the rain before he pays your new levy. Your captain doesn't care. Nobody crosses the bridge for free."
agot_riverlands_bla.0500.a:0 "Let them rot in the rain then. No coin, no crossing."
agot_riverlands_bla.0500.b:0 "Open the gates before this turns into a riot."
agot_riverlands_bla.0500.c:0 "Tell him the price doubles once the torches are lit."
agot_riverlands_bla.0500.d:0 "Send down a dozen more spears to quiet the crowd."

frey_harsh_tolls_bla:0 "Harsh Tolls"
frey_harsh_tolls_bla_desc:0 "Every cart, barrel, and head of cattle passing the Green Fork is measured, weighed, and taxed to the absolute limit. Merchants leave the Twins with light purses and heavy grudges."

frey_open_crossings_bla:0 "Open Crossings"
frey_open_crossings_bla_desc:0 "The gates stand open and the levies have been temporarily relaxed. Travelers are actually smiling as they cross the river, though the Master of Coin is weeping over the ledgers."

frey_night_tolls_bla:0 "Night Tolls"
frey_night_tolls_bla_desc:0 "When the sun goes down, the official ledgers are put away. Late-night travelers find themselves paying steep 'moonlight fees' that go straight into the household's private coffers."

frey_bridge_patrols_bla:0 "Bridge Patrols"
frey_bridge_patrols_bla_desc:0 "The span between the towers is thick with iron-capped guardsmen. No one crosses without being interrogated, upended, and thoroughly searched for contraband or hidden coin."


agot_riverlands_bla.0501.t:0 "Too Many Heirs"
agot_riverlands_bla.0501.desc:0 "The shouting from the gallery has been going on for hours. This time, it is a couple of cousins brawling over who gets the larger bedchamber and a bigger slice of the eastern ferry incomes. By the time you intervene, the argument has devolved into broken furniture, ancient insults about bastards, and a bloody nose.\n\nThe Twins are massive towers, but they are entirely too small for a family that breeds like rabbits."

agot_riverlands_bla.0501.a:0 "Bring me the ledger. I will divide their shares myself."
agot_riverlands_bla.0501.b:0 "Crack their heads together. They will respect my lordship."
agot_riverlands_bla.0501.c:0 "Let them. Divided cousins are easily ruled."
agot_riverlands_bla.0501.d:0 "Lock the door and let them beat each other blind."

agot_riverlands_bla.0502.t:0 "Guests at the Crossing"
agot_riverlands_bla.0502.desc:0 "A sudden downpour has turned the Kingsroad into a swamp just before dusk. Down at the eastern gatehouse, a dozen soaked riders are hammering their gauntlets against the wood while their servants frantically try to winch a heavy carriage out of the rising river mud.\n\nTheir lord is screaming up at the battlements, demanding shelter from the storm and invoking the sacred laws of hospitality. The Twins offer fine protection from the elements, but a Frey gate is rarely unbolted out of pure charity."

agot_riverlands_bla.0502.a:0 "Bring them inside. Stash their horses and warm some wine."
agot_riverlands_bla.0502.b:0 "They can have a dry bed—once they pay a guest-fee."
agot_riverlands_bla.0502.c:0 "Have the guards rip through their wagons before the gate lifts."
agot_riverlands_bla.0502.d:0 "Give them stale bread, cheap salt, and nothing more."

agot_riverlands_bla_0502_weak_hook_tt:0 "You gain a weak hook on your guest."

agot_riverlands_bla.0503.t:0 "Barges Beneath the Bridge"
agot_riverlands_bla.0503.desc:0 "A bleary-eyed sentry swears he heard the muffled clank of iron chains down in the dark river shadows last night. Come morning, your scouts find the reeds trampled along the western bank, littered with shattered oak crates and the unmistakable gouges of flat-bottomed poleboats.\n\nSmugglers are slipping contraband right between your two towers, entirely bypassing the toll collectors on the span above."

agot_riverlands_bla.0503.a:0 "Have the river patrols hunt down these boats and hang the crews."
agot_riverlands_bla.0503.b:0 "Send a cousin to find them. If they pay a cut, they can operate."
agot_riverlands_bla.0503.c:0 "Double the night watch. I want to know exactly whose coin is funding this."
agot_riverlands_bla.0503.d:0 "Burn their landing spots and sink any barge without a Frey seal."


agot_riverlands_bla.0504.t:0 "The Crossing Delayed"
agot_riverlands_bla.0504.desc:0 "The petty riverlord pacing your hall smells of wet wool, cheap steel, and horse sweat. He is practically choking on his own rage, swearing that your levies deliberately delayed their march until the battle was already decided, only to swoop in at the end to demand a full share of the spoils and ransoms.\n\nYour captains claim the mud on the roads made a swift march impossible, but your guest knows exactly how convenient a late arrival can be."

agot_riverlands_bla.0504.a:0 "A battle is won when it is won. My men will have their share."
agot_riverlands_bla.0504.b:0 "Toss him a bag of silver stags to shut his mouth."
agot_riverlands_bla.0504.c:0 "Let him whine to his liege lord. His anger only weakens them."
agot_riverlands_bla.0504.d:0 "The Green Fork flooded. If he dislikes the weather, he can pray to the Seven."


agot_riverlands_bla.0505.t:0 "A Marriage Across the Fork"
agot_riverlands_bla.0505.desc:0 "A minor lord arrived at your gates with half his household in tow, his knights tracking mud across your solar while bragging loudly of their grain yields. They have spent the entire evening hinting that a marriage match would secure your eastern borders and grant your merchants favorable trade routes through their lands.\n\nTo a Frey, a wedding contract is no different than a ferry lease or a timber toll—a transactional matter of blood, ink, and profit."

agot_riverlands_bla.0505.a:0 "An excellent match. Draw up the marriage contracts."
agot_riverlands_bla.0505.b:0 "If he wants a Frey bride, I expect a massive dowry in return."
agot_riverlands_bla.0505.c:0 "Agree to it, but keep the terms loose enough to break later."
agot_riverlands_bla.0505.d:0 "Send this petty lordling packing. We marry for crowns, not fields."

agot_riverlands_bla.0506.t:0 "Missing Beneath the Twins"
agot_riverlands_bla.0506.desc:0 "A bloated corpse was dragged from the river reeds three days ago, its throat slit from ear to ear. Last night, a merchant's clerk vanished entirely between the eastern gatehouse and the western bank, leaving only a blood-splattered mule behind. Now, the tavern smallfolk are whispering that the Green Fork is swallowing travelers whole.\n\nYour bridge guards swear they heard nothing over the rush of the water, but their shifty eyes suggest otherwise."

agot_riverlands_bla.0506.a:0 "Scour the riverbanks and put the night watch to the question."
agot_riverlands_bla.0506.b:0 "Hang a few gossiping peasants to quiet the tavern rumors."
agot_riverlands_bla.0506.c:0 "Find out who is doing the killing—and who is pocketing the coin."
agot_riverlands_bla.0506.d:0 "People die on the Kingsroad every day. Throw the body back."


frey_silenced_rumors_bla:0 "Silenced Rumors"
frey_silenced_rumors_bla_desc:0 "The tavern whispers haven't stopped, but the smallfolk now look over their shoulders before speaking. A few public floggings have taught everyone that gossiping about the Twins carries a deadly price."


agot_riverlands_bla.0507.t:0 "The River Chooses Winners"
agot_riverlands_bla.0507.desc:0 "Recent floods have shifted the sandbars, completely ruining the northern ferry routes while turning a southern mudflat into a prime new crossing. Naturally, your cousins are already at each other's throats. A dozen angry Freys from the ruined branch are hammering on your table, demanding you strip the new, lucrative crossing from their luckier kinsmen to pay them compensation.\n\nOne side claims the gods have ruined them; the other claims they are just too lazy to dig their boats out of the silt."

agot_riverlands_bla.0507.a:0 "Pool the ferry taxes and divide them evenly. I will have peace in this house."
agot_riverlands_bla.0507.b:0 "The new crossing stays with my favorites. The rest can starve."
agot_riverlands_bla.0507.c:0 "Let them fight over the boats. The strongest branch wins."
agot_riverlands_bla.0507.d:0 "Tax both sides twice as hard while they are distracted by this feud."

frey_balanced_crossings_bla:0 "Balanced Crossings"
frey_balanced_crossings_bla_desc:0 "Ferry revenues have been split with just enough transactional precision to stop the family from murdering each other. They are still bitter, but at least they are quiet."

frey_favored_crossings_bla:0 "Favored Crossings"
frey_favored_crossings_bla_desc:0 "The most lucrative river routes have been handed to your favorite lackeys. They praise your lordship's wisdom, while the cousins left with the dry mud banks whisper of betrayal."
