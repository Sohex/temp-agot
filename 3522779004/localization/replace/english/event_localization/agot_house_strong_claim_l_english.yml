l_english:

# ==========================================
# EVENT 0001: A STRONG CLAIM
# ==========================================
agot_strong_claim.0001.t:0 "A Strong Claim"
agot_strong_claim.0001.desc:0 "A massive, broad-shouldered warrior has ridden into your courtyard without banners or heralds, yet he carries himself with the terrifying weight of a born commander. He introduces himself as Ser [GetFirstName(strong_candidate)] Strong—a name that should be entirely dead, supposedly wiped from the earth when Prince Aemond slaughtered the line centuries ago. \n\nHe claims his grandfather escaped the bloodbath across the Narrow Sea, surviving as a sellsword captain in the Golden Company. Now, he has returned to the Trident to demand the keep of Gaines—once a minor holding of his ancestors, now held by a failing vassal. He offers you a legendary name and a seasoned sword arm, but elevating a man claiming to be a surviving Strong will instantly ignite a furious political firestorm with whoever currently sits in the melted halls of Harrenhal."
agot_strong_claim.0001.a:0 "Welcome home, Ser. Take the keys to Gaines and raise your banner."
agot_strong_claim.0001.b:0 "The male line of House Strong died in blood long ago. Drive this pretender out."
agot_strong_claim.0001.c:0 "The blood of the First Men must reclaim the Trident. I will take up his cause."

# ==========================================
# EVENT 0002: A STRONG RETURN
# ==========================================
agot_strong_claim.0002.t:0 "A Strong Return"
agot_strong_claim.0002.desc:0 "The whispers of a Strong restoration have swept through the bogs and taverns of the Trident like wildfire. The common folk, weary of foreign lords and endless wars, are looking to the ancient past for hope. \n\nBefore the mortar on your newly repaired gates can even dry, a ragged but dangerous host begins arriving at Strong Keep. Landless hedge knights, grim-faced veterans of the Essosi camps, and strapping smallfolk seeking a master who breathes war have gathered in your courtyard. Five hundred spears stand ready to bleed for the resurrected name—it is not a royal host, but it is a bloody beginning."
agot_strong_claim.0002.a:0 "Give them iron and let the Riverlands hear our thunder."
agot_strong_claim.0002.a.tt:0 "A seasoned vanguard of 500 battle-hardened men-at-arms joins House Strong at Strong Keep."

# ==========================================
# RETINUE LOCALIZATION
# ==========================================
strong_retinue:0 "The Broken Men of Harrenhal"
strong_retinue_desc:0 "A lethal cadre of heavy infantry and landless vanguard riders who have swarmed to the resurrected banner of House Strong, eager to carve out fortunes in the blood of the Riverlands."

