l_english:

agot_crownlands_bla.0400.t:0 "The Stones Remember"

agot_crownlands_bla.0400.desc:0 "Repairs at Stonedance have exposed a course of masonry beneath one of the older walls, buried so deeply that even the castle's masons cannot agree upon its age.\n\nThe stones are enormous, weathered smooth at their edges and fitted in a fashion unlike the work above them. One of my household insists that they must date from the days when the Masseys ruled the Hook as kings. Another scoffs that every ancient wall in Westeros acquires a king once men have forgotten who truly raised it.\n\nHouse Massey is old. Of that there can be little doubt.\n\nWhether these stones remember more than men do is another matter."

agot_crownlands_bla.0400.a:0 "Have the old foundations carefully examined."
agot_crownlands_bla.0400.a.discovery:0 "The examination reveals markings suggesting the foundations are considerably older than the castle above them"
agot_crownlands_bla.0400.b:0 "These stones stood when Masseys were kings."
agot_crownlands_bla.0400.c:0 "My masons need stone, not stories."

agot_massey_ancient_claims_bla:0 "Heirs of the Hook"
agot_massey_ancient_claims_bla_desc:0 "Ancient remains at Stonedance are being displayed as evidence of House Massey's antiquity and the long memory of its rule upon the Hook."

agot_crownlands_bla.0401.t:0 "Lords of the Hook"

agot_crownlands_bla.0401.desc:0 "Two men from the Hook have come before me with a quarrel older than either cares to admit.\n\n[massey_fisher_bla.GetFirstName] speaks for several fishing families who have long drawn their boats onto a sheltered strip of shore during rough weather. [massey_shepherd_bla.GetFirstName] insists that the same ground belongs to families who drive their animals down from the stony hills and require access to its freshwater spring.\n\nEach has witnesses. Each has grievances. Each claims his grandfather enjoyed rights the other's grandfather stole.\n\nSuch disputes rarely trouble singers, yet a lord who cannot settle quarrels over a patch of mud will soon discover how little his grander titles are worth."

agot_crownlands_bla.0401.a:0 "There is enough shore for both."
agot_crownlands_bla.0401.a.success:0 "You settle the dispute without favoring either community"
agot_crownlands_bla.0401.a.failure:0 "Your compromise satisfies neither side"

agot_crownlands_bla.0401.b:0 "The fishermen shall have the cove."
agot_crownlands_bla.0401.b.tt:0 "[massey_fisher_bla.GetFirstName] will join your court"

agot_crownlands_bla.0401.c:0 "The grazing families have the stronger claim."
agot_crownlands_bla.0401.c.tt:0 "[massey_shepherd_bla.GetFirstName] will join your court"

agot_crownlands_bla.0401.d:0 "Neither. The shore belongs to House Massey."

agot_massey_just_lord_of_hook_bla:0 "Just Lord of the Hook"
agot_massey_just_lord_of_hook_bla_desc:0 "Careful judgment in the disputes of Massey's Hook has earned this character a reputation for hearing even the humblest petition."

agot_massey_hard_hand_of_stonedance_bla:0 "Hard Hand of Stonedance"
agot_massey_hard_hand_of_stonedance_bla_desc:0 "Disputed rights upon Massey's Hook have been swept aside in favor of the ancient authority of Stonedance."

agot_crownlands_bla.0402.t:0 "Fires Upon the Hook"

agot_crownlands_bla.0402.desc:0 "For three nights, fires have appeared upon the distant headlands of Massey's Hook.\n\nThe villagers insist they are warning beacons, lit after unfamiliar sails were sighted offshore. Yet no raiders have landed, no fishing boats are missing, and several of my men note that the fires seem remarkably well timed with the passing of certain merchant vessels.\n\nPerhaps the folk of the Hook are guarding my shores.\n\nPerhaps they are telling smugglers when those shores are safe."

agot_crownlands_bla.0402.a:0 "Watch the watchers."
agot_crownlands_bla.0402.a.success:0 "Your men uncover a smuggling operation hidden among the coves"
agot_crownlands_bla.0402.a.failure:0 "Whatever the fires meant, their secret remains hidden"

agot_crownlands_bla.0402.b:0 "Then Stonedance shall control the beacons."
agot_crownlands_bla.0402.c:0 "Some questions are more profitable unanswered."

agot_crownlands_bla.0402.d:0 "I will see these fires for myself."
agot_crownlands_bla.0402.d.success:0 "Your patrol discovers contraband hidden near one of the coves"

agot_massey_watchful_hook_bla:0 "Watchful Lord of the Hook"
agot_massey_watchful_hook_bla_desc:0 "The lonely coves and headlands of Massey's Hook are watched more carefully after the discovery of illicit signals along the coast."

agot_massey_beacon_watch_bla:0 "Beacon Watch"
agot_massey_beacon_watch_bla_desc:0 "A more organized system of watches and warning fires has been established along Massey's Hook."

agot_massey_coastal_understanding_bla:0 "A Coastal Understanding"
agot_massey_coastal_understanding_bla_desc:0 "Certain activities along the lonely coves of Massey's Hook are overlooked so long as the lord of Stonedance receives an appropriate share."

agot_crownlands_bla.0403.t:0 "The King's Stone"

agot_crownlands_bla.0403.desc:0 "There is an old stone upon the Hook, weathered by wind and salt until whatever markings it once bore have nearly vanished.\n\nThe smallfolk call it the King's Stone.\n\nTheir tale holds that, before the Masseys bent their knees to greater kings, the Kings of the Hook sat beside it to hear the quarrels of their people. Shepherds disputed pasture there, fishermen argued over coves, and blood debts were supposedly settled beneath the open sky.\n\nWhether any king of my blood ever sat upon the stone is another question. The oldest account my household can produce was written long after House Massey had ceased to wear a crown.\n\nYet even now, some folk of the Hook still touch the stone before bringing a grievance to Stonedance.\n\nA custom need not be true to become old."

agot_crownlands_bla.0403.a:0 "Then a Massey shall sit in judgment there again."
agot_crownlands_bla.0403.b:0 "Let the stone serve the law, not dead kings."
agot_crownlands_bla.0403.c:0 "There must be an older truth beneath the tale."
agot_crownlands_bla.0403.c.success:0 "The Tradition Predates the Tale"
agot_crownlands_bla.0403.c.failure:0 "The Stone Keeps Its Secrets"
agot_crownlands_bla.0403.d:0 "I rule from Stonedance, not a weathered rock."

agot_massey_judgment_of_the_hook_bla:0 "Judgment of the Hook"
agot_massey_judgment_of_the_hook_bla_desc:0 "By hearing petitions beside the ancient King's Stone, this character has deliberately revived one of the oldest traditions attributed to the rulers of Massey's Hook."

agot_massey_law_of_the_hook_bla:0 "Law of the Hook"
agot_massey_law_of_the_hook_bla_desc:0 "An old local custom has been stripped of its royal pretensions and incorporated into the practical administration of Massey's Hook."

agot_crownlands_bla.0404.t:0 "Between Storm and Crown"

agot_crownlands_bla.0404.desc:0 "The histories of House Massey are filled with greater powers.\n\nOnce, the Masseys ruled the Hook as kings. Those crowns vanished long ago, while other kings rose around us and other banners claimed the lands beyond our stony peninsula. Storm lords looked north. Kings upon the Blackwater looked south. Conquerors came, kingdoms changed, and new masters demanded old oaths in different words.\n\nStill Stonedance endured.\n\nPerhaps that is the true inheritance of my house. Not a vanished crown, nor some half-remembered boundary upon an ancient map, but the knowledge that a lord of the Hook must understand the powers surrounding him without allowing them to swallow what is his.\n\nThe question is what lesson I shall take from it."

agot_crownlands_bla.0404.a:0 "The Hook comes before every distant quarrel."
agot_crownlands_bla.0404.b:0 "Let greater lords learn the value of a loyal Massey."
agot_crownlands_bla.0404.c:0 "Our future lies across the Blackwater."
agot_crownlands_bla.0404.d:0 "Greater powers? We were kings once."

agot_massey_hook_before_all_bla:0 "The Hook Before All"
agot_massey_hook_before_all_bla_desc:0 "This Massey has resolved that the security and strength of the Hook must come before the ambitions of distant courts."

agot_massey_indispensable_vassal_bla:0 "Indispensable of Stonedance"
agot_massey_indispensable_vassal_bla_desc:0 "House Massey has survived beneath greater powers for generations. This character intends to make loyalty to those powers a source of influence rather than submission."

agot_massey_blackwater_outlook_bla:0 "Eyes Upon the Blackwater"
agot_massey_blackwater_outlook_bla_desc:0 "Rather than retreat behind the stony shores of the Hook, this character looks toward the trade, politics, and opportunities of Blackwater Bay."

agot_massey_blood_of_kings_bla:0 "Blood of the Kings of the Hook"
agot_massey_blood_of_kings_bla_desc:0 "The crown once worn by the ancient Masseys is long gone, but this character has little intention of allowing others to forget that House Massey once bowed to no king but its own."

agot_crownlands_bla.0405.t:0 "The Road to Stonedance"

agot_crownlands_bla.0405.desc:0 "A season of hard rain has done what armies and neglect have failed to accomplish: much of the road leading toward Stonedance has become scarcely worthy of the name.\n\nWagons sink to their axles in mud. A bridge across one of the Hook's streams has collapsed entirely, forcing travelers through a ford that becomes treacherous whenever the water rises. Merchants complain of broken wheels, while my own men report that moving riders quickly across the peninsula has become increasingly difficult.\n\nEveryone agrees the road must be repaired.\n\nNaturally, everyone also believes someone else should pay for it."

agot_crownlands_bla.0405.a:0 "Build a road worthy of Stonedance."
agot_crownlands_bla.0405.b:0 "Improve the routes the merchants actually use."
agot_crownlands_bla.0405.c:0 "My riders must be able to cross the Hook quickly."
agot_crownlands_bla.0405.d:0 "Every village shall repair the road nearest it."

agot_massey_roads_of_the_hook_bla:0 "Roads of the Hook"
agot_massey_roads_of_the_hook_bla_desc:0 "Considerable effort has been spent improving the roads and bridges connecting Stonedance with the settlements of Massey's Hook."

agot_massey_merchant_roads_bla:0 "Merchant Roads of the Hook"
agot_massey_merchant_roads_bla_desc:0 "Repairs upon Massey's Hook have concentrated upon the routes most valuable to merchants, markets, and the movement of goods."

agot_massey_military_roads_bla:0 "Stonedance's Roads"
agot_massey_military_roads_bla_desc:0 "The roads of Massey's Hook have been improved with the rapid movement of riders, levies, and supplies foremost in mind."

agot_massey_forced_road_labor_bla:0 "Road Levies of the Hook"
agot_massey_forced_road_labor_bla_desc:0 "The villages of Massey's Hook have been ordered to provide the labor necessary to maintain the roads leading toward Stonedance."

agot_crownlands_bla.0406.t:0 "A Knight of Stonedance"

agot_crownlands_bla.0406.desc:0 "There are places upon the Hook where a man's reputation travels faster than any raven.\n\n[massey_hook_knight_bla.GetFullName] has acquired such a reputation.\n\nWhen thieves descended upon a small settlement several days from Stonedance, the local men did not wait for my riders. [massey_hook_knight_bla.GetFirstName] gathered what swords and bows could be found, followed the thieves into the hills, and returned with the stolen goods — and considerably fewer thieves.\n\nMy household knights are divided upon him. Some see a natural warrior worthy of a place at Stonedance. Others see only a rough local sword who has grown accustomed to acting without his lord's command.\n\nThe distinction may depend upon what I do with him."

agot_crownlands_bla.0406.a:0 "A sword like that belongs at Stonedance."
agot_crownlands_bla.0406.a.tt:0 "[massey_hook_knight_bla.GetFullName] will join your court"

agot_crownlands_bla.0406.b:0 "Reward him. The Hook still needs men like him."

agot_crownlands_bla.0406.c:0 "Let us see how good he truly is."
agot_crownlands_bla.0406.c.success:0 "You best [massey_hook_knight_bla.GetFirstName] before the watching household"
agot_crownlands_bla.0406.c.failure:0 "[massey_hook_knight_bla.GetFirstName] proves every bit as formidable as the stories claim"

agot_crownlands_bla.0406.d:0 "Let the Hook keep its champion."

agot_crownlands_bla.0407.t:0 "The Narrow Place"

agot_crownlands_bla.0407.desc:0 "A storm has driven a merchant vessel onto the rocks of the Hook.\n\nThe ship will never sail again. Much of its cargo lies beneath the water, though my people have already recovered barrels, broken crates, lengths of sailcloth, and several survivors.\n\nOne of them has been brought to Stonedance.\n\n[massey_wreck_survivor_bla.GetFullName] claims to be nothing more remarkable than a traveler who purchased passage aboard the unfortunate vessel. Yet the man carries good boots, speaks with the confidence of someone accustomed to being obeyed, and guarded a small leather case more carefully than he guarded his own purse.\n\nThe sea has delivered many things onto the Hook.\n\nI suspect this time it has delivered a secret."

agot_crownlands_bla.0407.a:0 "Whatever his secrets, he is my guest."
agot_crownlands_bla.0407.a.tt:0 "[massey_wreck_survivor_bla.GetFullName] will join your court"

agot_crownlands_bla.0407.b:0 "A few questions before he continues his journey."
agot_crownlands_bla.0407.c:0 "The sea cast the cargo upon Massey shores."
agot_crownlands_bla.0407.d:0 "Give him provisions and send him on his way."

agot_crownlands_bla.0408.t:0 "What the Sea Delivered"

agot_crownlands_bla.0408.desc:0 "[massey_wreck_survivor_bla.GetFirstName]'s story survives my questions rather less well than his ship survived the rocks.\n\nThe leather case contains letters written in several hands, along with accounts whose numbers appear deliberately obscure. None names a king or speaks openly of treason. Their authors are wiser than that.\n\nYet merchants, knights, and men of rank appear throughout the correspondence, bound together by debts, favors, shipments, and promises clearly never intended for unfamiliar eyes.\n\n[massey_wreck_survivor_bla.GetFirstName] watches me carefully as I turn the final page.\n\nA shipwreck is ordinarily a misfortune.\n\nThis one may yet prove an opportunity."

agot_crownlands_bla.0408.a:0 "These letters remain at Stonedance."
agot_crownlands_bla.0408.a.tt:0 "[massey_wreck_survivor_bla.GetFullName] will remain at your court"

agot_crownlands_bla.0408.b:0 "Secrets have value. He knows the price."
agot_crownlands_bla.0408.c:0 "Seal the case. I have read enough."
agot_crownlands_bla.0408.d:0 "A man trusted with such letters could be useful."
agot_crownlands_bla.0408.d.tt:0 "[massey_wreck_survivor_bla.GetFullName] will join your court"