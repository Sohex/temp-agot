l_english:

# ==========================================
# DECISION BLOCK: ARBOR WINE FESTIVAL
# ==========================================
agot_redwyne_festival_decision:0 "Host the Arbor Vintage Festival"
agot_redwyne_festival_decision_desc:0 "Open our ports and unseal the cellars. By gathering the highest lords, wealthiest merchants, and most notorious sell-sails from Oldtown to Braavos, we can flood the realm with Arbor Gold. It is a lavish display of our economic dominance—and an excellent excuse to sign trade monopolies while our guests are too drunk to read the fine print."
agot_redwyne_festival_decision_confirm:0 "Uncork the casks and let the coin flow."
agot_redwyne_festival_decision_tooltip:0 "Invite the nobility and merchant princes of the world to drown themselves in our finest vintages."
agot_redwyne_festival_blocked_tt:0 "Our vineyards are still recovering from the last great vintage cycle."
redwyne_festival_hosted_tooltip:0 "The Arbor fleet begins escorting merchant fleets to our ports for the grand festival."

# ==========================================
# EVENT 0001: FESTIVAL OF THE VINE
# ==========================================
agot_redwyne_festival.0001.t:0 "The Gates of Summer Open"
agot_redwyne_festival.0001.desc:0 "The sprawling valleys of the Arbor are a sea of deep purple and emerald green, the grapevines heavy and ready for the press. Down in the harbor, the great warships of the Redwyne fleet are guiding hundreds of foreign merchant cogs into the docks, their decks bursting with lords, ladies, and Essosi factor-princes.\n\nThe feast tents are pitched along the white stone cliffs, and the scent of roasting meats, sea salt, and sweet fermenting sugar chokes the air. The world has come to drink at our table."
agot_redwyne_festival.0001.a:0 "Send out the heralds. Let no man's cup sit empty tonight."
agot_redwyne_festival.0001.a.tt:0 "You host the Arbor Vintage Festival, incurring a heavy gold cost but massive prestige."

# ==========================================
# EVENT 0002: A VINTAGE FOR THE AGES
# ==========================================
agot_redwyne_festival.0002.t:0 "The Bottom of the Cask"
agot_redwyne_festival.0002.desc:0 "The last of the foreign galleas ships have finally untied from our docks, leaving your servants to scrub red wine stains from the marble floors of your courtyard. The celebration was a chaotic triumph of silver, songs, and staggering drunkenness. \n\nWhile half your court is still nursing a brutal hangover, your Master of Coin is already grinning over the initial ledgers. The festival has yielded fruits far beyond mere goodwill."
agot_redwyne_festival.0002.a:0 "They came for our gold, and left us their silver."

# ==========================================
# EVENT 0003: REDWYNE VINTAGE PRAISED
# ==========================================
agot_redwyne_festival.0003.t:0 "Singing for Arbor Gold"
agot_redwyne_festival.0003.desc:0 "Your private reserve of pale, sweet Arbor Gold was the undisputed star of the feast. High lords from the North to the Dornish Marches were seen weeping openly into their cups, swearing that the nectar of the Reach makes the rest of the world's wine taste like vinegar.\n\nTraveling singers are already carrying your name to every tavern along the Mander, turning your vintage into a symbol of ultimate courtly sophistication."
agot_redwyne_festival.0003.a:0 "A lord who controls the wine controls the court's favor."
agot_redwyne_festival.0003.a.tt:0 "Word of your exquisite vintage spreads across the Seven Kingdoms, granting you a massive diplomacy and vassal opinion boost."

# ==========================================
# EVENT 0004: A TRADE TRIUMPH
# ==========================================
agot_redwyne_festival.0004.t:0 "The Braavosi Treaties"
agot_redwyne_festival.0004.desc:0 "While the lesser nobles were busy making fools of themselves on the dance floors, you spent the evening huddled in a quiet alcove with three prominent key-holders from the Iron Bank of Braavos. \n\nSoftened by multiple flagons of our rarest private stock, the Essosi bankers have agreed to grant our merchant fleets unprecedented, low-tariff access to the narrow sea ports. Our storehouses will soon overflow with Eastern coin."
agot_redwyne_festival.0004.a:0 "Ink and wine make for a highly profitable blend."
agot_redwyne_festival.0004.a.tt:0 "Your shrewd negotiation secures a permanent merchant modifier, increasing your monthly income."

# ==========================================
# EVENT 0005: THE VINTAGE OF A LIFETIME
# ==========================================
agot_redwyne_festival.0005.t:0 "The King's Oak"
agot_redwyne_festival.0005.desc:0 "The highlight of the festival occurred when your cellarmen wheeled out a legendary, iron-hooped oak cask that had remained sealed in the deepest volcanic vaults since the days of King Viserys I. \n\nWhen the bung was struck, a rich, dark scent of summer fruit and ancient oak filled the great hall. To taste a single goblet from this barrel is to drink living history—and your guests spent the night clamoring like beggars just for a drop of the ancient brew."
agot_redwyne_festival.0005.a:0 "Let them taste the wealth of House Redwyne."
agot_redwyne_festival.0005.a.tt:0 "You showcase a legendary historic cask, unlocking a massive court grandeur bonus."

# ==========================================
# EVENT 0006: A CURIOUS DISCOVERY
# ==========================================
agot_redwyne_festival.0006.t:0 "Contraband in the Vaults"
agot_redwyne_festival.0006.desc:0 "While your cellarmen were clearing out the empty barrels from the oldest, forgotten tunnels beneath the castle, they broke through a crumbling stone partition. Tucked inside was a heavy iron lockbox, wrapped in rotting sailcloth and bearing the sigil of an ancient, executed smuggler-captain.\n\nInside: a stone-like egg, warm to the touch and dark as night... a dragon egg."
agot_redwyne_festival.0006.a:0 "By the Seven... what have we found?"
agot_redwyne_festival.0006.a.tt:0 "You acquire a black dragon egg."

# ==========================================
# MODIFIERS & ARTIFACTS
# ==========================================
opinion_fine_vintage:0 "Drowned in Arbor Gold"
agot_cask_of_summerwine_name:0 "The King's Coronation Cask"
agot_cask_of_summerwine_desc:0 "A legendary oak cask filled during the coronation feast of King Viserys I Targaryen. Kept deep within the volcanic cellars of the Arbor, its wood is imbued with the scent of dark summer fruits and decades of absolute prestige. To serve from it is to command the envy of the entire civilized world."
