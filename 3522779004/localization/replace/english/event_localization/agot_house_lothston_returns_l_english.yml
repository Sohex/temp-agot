# ==========================================
# EVENT 0001: A BAT IN THE FOG
# ==========================================
agot_lothston_returns.0001.t:0 "A Bat in the Fog"
agot_lothston_returns.0001.desc:0 "A grim, weather-beaten sellsword has slipped into Darry’s hall under the cover of a thick autumn fog, flanked by two silent men in scarred gold cloaks. He refuses to give his name, but when he throws back his heavy wool cloak, your court gasps—embroidered on his stained tabard is the giant black bat of House Lothston, a line of supposed monsters and blood-drinkers wiped out generations ago.\n\nThe stranger demands the minor keep of Riverbend, positioned right down the road from the Crossroads Inn. He smiles with sharp teeth, hinting that he knows exactly which local smugglers Lord Darry has been bribing, and which secret contracts are hidden beneath his floorboards. It is a blatant act of blackmail by a man carrying a cursed name. You can buy his silence with a grant of land, but letting a Lothston roost so close to Harrenhal will terrify your smallfolk and deeply anger your neighbors."
agot_lothston_returns.0001.a:0 "Give the black bat his roost. Better a quiet neighbor than a loud blackmailer."
agot_lothston_returns.0001.b:0 "Toss the extortionist into the dungeons. The line of Danelle Mad-Eye is dead and buried."
agot_lothston_returns.0001.c:0 "The line of the black bat shall rise again. I will take up his cause myself."

# ==========================================
# EVENT 0002: THE BAT FINDS A ROOST
# ==========================================
agot_lothston_returns.0002.t:0 "The Bat Finds a Roost"
agot_lothston_returns.0002.desc:0 "Riverbend is yours—though it is little more than a rotting timber tower, a choked dock, and acres of stagnant bog-mud. As you ride through the local hamlets, the superstitious peasants throw up the sign of the Seven to ward off evil, terrified of the giant bat banner snapping from your roof.\n\nNo neighboring lords send gifts or welcome you to the Trident, but the criminal underbelly of the Riverlands recognizes its own. Within days, your courtyard fills with the dregs of the Kingsroad: disgraced city watchmen, broken men, and vicious outlaws fleeing the gallows. They bring rusted steel, broken teeth, and a complete lack of mercy. They care nothing for honor, but they are perfectly willing to spill blood for a name that the entire realm still fears."
agot_lothston_returns.0002.a:0 "Let the cutthroats assemble. Outlaws carve out the bloodiest kingdoms."
agot_lothston_returns.0002.a.tt:0 "A desperate retinue of 500 lawless brigands and outlaws joins House Lothston at Riverbend."

