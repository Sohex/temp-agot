l_english:

# ==========================================
# 0001 — AGE OF HOUSE
# ==========================================
agot_bla_custom_house_legacy.0001.t:0 "Lineage: The Age of the House" 

agot_bla_custom_house_legacy.0001.desc:0 "The maester settles into his chair and opens a fresh ledger upon the table. After arranging his ink and quills, he looks up at you.\n\n\"Before we concern ourselves with deeds, my [ROOT.Char.GetLadyLord], we should establish how far back the name goes. Old houses have a habit of growing older with every telling, so let us be as honest as we can. How long has House [ROOT.Char.GetDynasty.GetNameNoTooltip] held lands and title?\"" 

agot_bla_custom_house_legacy.0001.a1:0 "The name is new. Its history begins with me." 
agot_bla_custom_house_legacy.0001.a2:0 "Our house has stood for about a century." 
agot_bla_custom_house_legacy.0001.a3:0 "Some two and a half centuries have passed since our founding." 
agot_bla_custom_house_legacy.0001.a4:0 "Our line has endured for roughly five hundred years." 
agot_bla_custom_house_legacy.0001.a5:0 "A thousand years or more. Few remember our beginnings." 

# ========================================== 
# 0015 — DRAGONRIDER HOUSE 
# ========================================== 
agot_bla_custom_house_legacy.0015.t:0 "Lineage: The Blood of the Dragon" 

agot_bla_custom_house_legacy.0015.desc:0 "The maester makes a final note beside the account of your ancestry, then hesitates.\n\n\"There is one distinction I should record separately. Some houses claim descent from the dragonlords of Valyria, and with that blood the ability—or at least the expectation—to take dragons as their mounts. Is House [ROOT.Char.GetDynasty.GetNameNoTooltip] such a house?\"" 

agot_bla_custom_house_legacy.0015.a:0 "Yes. The blood of the dragon runs in our line." 
agot_bla_custom_house_legacy.0015.b:0 "No. Whatever our ancestry, we make no such claim."

# ==========================================
# Q1 — FOUNDING
# ==========================================
agot_bla_custom_house_legacy.q1.t:0 "History: The First Name"

agot_bla_custom_house_legacy.q1.desc_old:0 "The maester turns back through the oldest pages of the chronicle. Some are faded, and more than one name has been added later in another hand.\n\n\"There is never much agreement about the beginnings of an old house,\" he says. \"Still, your forebears must have done something right. Other names from those days have vanished. Yours has not. Why?\""

agot_bla_custom_house_legacy.q1.desc_new:0 "The maester looks down at the empty page before him and dips his quill.\n\n\"Then this is where we begin,\" he says. \"A grant of lands may make a lord, but it takes rather more to make a lasting house. What would you say first set yours apart?\""

agot_bla_custom_house_legacy.q1.a1:0 "\"They knew how to make good use of the lands given to them.\""
agot_bla_custom_house_legacy.q1.a2:0 "\"Men trusted their word, and remembered the oaths made to them.\""
agot_bla_custom_house_legacy.q1.a3:0 "\"When others came against them, they held their ground.\""
agot_bla_custom_house_legacy.q1.a4:0 "\"They were quick to see an opportunity and quicker still to take it.\""
agot_bla_custom_house_legacy.q1.a5:0 "\"They listened to good counsel and learned from their mistakes.\""


# ==========================================
# Q2 — BORDER CRISIS
# ==========================================
agot_bla_custom_house_legacy.q2.t:0 "History: The Boundary Stones"

agot_bla_custom_house_legacy.q2.desc_old:0 "The maester runs a finger beneath a faded passage and gives a small grunt.\n\n\"A dispute over the eastern boundary. Your neighbor moved his stones into your fields and claimed they had always stood there. The histories are full of quarrels begun over less. What did your house do?\""

agot_bla_custom_house_legacy.q2.desc_new:0 "The maester makes another note in the margin.\n\n\"A new lord is always tested. Let us say your neighbor has moved his boundary stones into your woods. Not far enough to make a war of it, but far enough that doing nothing would be noticed. How would you answer?\""

agot_bla_custom_house_legacy.q2.a1:0 "\"We made certain those lands were worth more in our hands than in his.\""
agot_bla_custom_house_legacy.q2.a2:0 "\"We spoke to the neighboring lords before he could. He soon found himself standing alone.\""
agot_bla_custom_house_legacy.q2.a3:0 "\"We put the stones back and sent men to see that they stayed there.\""
agot_bla_custom_house_legacy.q2.a4:0 "\"For a time, we let him think he had gotten away with it.\""
agot_bla_custom_house_legacy.q2.a5:0 "\"We brought out the old surveys and charters and proved where the boundary lay.\""


# ==========================================
# Q3 — YEAR OF DIVISION
# ==========================================
agot_bla_custom_house_legacy.q3.t:0 "History: The Divided Hall"

agot_bla_custom_house_legacy.q3.desc_old:0 "The maester stops at a page crowded with names and notes in the margins.\n\n\"This was an ugly year,\" he says. \"Your kin were quarreling, several sworn men had chosen sides, and someone seems to have thought himself better suited to your family's seat. How was the matter settled?\""

agot_bla_custom_house_legacy.q3.desc_new:0 "The maester leaves a little space before beginning the next passage.\n\n\"Every house quarrels sooner or later. Brothers fall out, cousins grow ambitious, and old complaints are remembered at inconvenient times. Suppose your own household begins to divide. What do you do first?\""

agot_bla_custom_house_legacy.q3.a1:0 "\"We heard their grievances and gave them the chance to renew their oaths.\""
agot_bla_custom_house_legacy.q3.a2:0 "\"We found out what each man wanted. Some grievances were cheaper to settle than others.\""
agot_bla_custom_house_legacy.q3.a3:0 "\"We called our men together. Once they saw where the strength lay, most came to their senses.\""
agot_bla_custom_house_legacy.q3.a4:0 "\"Before acting, we found out who was speaking to whom.\""
agot_bla_custom_house_legacy.q3.a5:0 "\"We looked to old judgments and asked how such disputes had been settled before.\""


# ==========================================
# Q4 — CHARGE / ACCUSATION
# ==========================================
agot_bla_custom_house_legacy.q4.t:0 "History: A Name Questioned"

agot_bla_custom_house_legacy.q4.desc_old:0 "The maester produces an old letter bearing the remains of several seals.\n\n\"Here is a less pleasant matter. An accusation was made against your house before half the neighboring lords. I cannot say whether anyone truly believed it, but enough repeated the tale for it to become troublesome. How did your family answer?\""

agot_bla_custom_house_legacy.q4.desc_new:0 "The maester turns his quill between his fingers.\n\n\"Swords are not the only way to wound a house. Suppose a rival makes an accusation against you before your peers. There is just enough truth in it to set tongues wagging. How would you deal with him?\""

agot_bla_custom_house_legacy.q4.a1:0 "\"We made certain that spreading lies about our house came at a cost.\""
agot_bla_custom_house_legacy.q4.a2:0 "\"We called upon those who knew us. Their word answered his better than ours could.\""
agot_bla_custom_house_legacy.q4.a3:0 "\"We answered him openly and dared him to repeat the charge to our faces.\""
agot_bla_custom_house_legacy.q4.a4:0 "\"First, we found out who had given him the tale.\""
agot_bla_custom_house_legacy.q4.a5:0 "\"We answered his charges one by one and let the evidence speak for us.\""


# ==========================================
# Q5 — AMBITION
# ==========================================
agot_bla_custom_house_legacy.q5.t:0 "The Chronicle: What Comes After"

agot_bla_custom_house_legacy.q5.desc_old:0 "The maester closes the older histories and draws the unfinished chronicle toward him.\n\n\"That tells me something of the house you inherited,\" he says. \"Now tell me something of the one you mean to leave behind. When your descendants speak of these years, what do you hope they will say you gave them?\""

agot_bla_custom_house_legacy.q5.desc_new:0 "The maester reads over what he has written, then comes to the last empty passage.\n\n\"A new house must think beyond its first lord if it means to survive him. Lands may be lost and won again. Titles change hands. What do you mean to leave your descendants that will be harder to take away?\""

agot_bla_custom_house_legacy.q5.a1:0 "\"Enough means that one bad year will never be enough to ruin us.\""
agot_bla_custom_house_legacy.q5.a2:0 "\"A name men are glad to call friend and reluctant to call enemy.\""
agot_bla_custom_house_legacy.q5.a3:0 "\"The strength to face hard times without depending upon another house to save us.\""
agot_bla_custom_house_legacy.q5.a4:0 "\"The good sense to know more than we say, and to notice what others miss.\""
agot_bla_custom_house_legacy.q5.a5:0 "\"The knowledge to leave our children better prepared than we were.\""

# ==========================================
# 0007 — SUMMARY & TOOLTIPS
# ==========================================
agot_bla_custom_house_legacy.0007.t:0 "The Chronicle Completed" 
agot_bla_custom_house_legacy.0007.desc:0 "The maester reads the last few lines to himself, makes a small correction in the margin, and waits for the ink to dry.\n\n\"There,\" he says at last. \"It is hardly the whole history of a house. No single volume ever is. But it is enough that a reader may understand something of the people who bore the name, and perhaps something of those who will bear it after you.\"" 
agot_bla_custom_house_legacy.0007.a:0 "Let that be the record."

bla_custom_summary_new_intro:0 "House [ROOT.Char.GetDynasty.GetNameNoTooltip] has little history behind it. Whatever reputation the name will carry must be made by those who bear it now."

bla_custom_summary_coin:0 "The chronicle remembers a practical house, attentive to its lands and careful with what it possesses. Its fortunes have rested less upon grand gestures than upon good management, patient investment, and keeping something in reserve for harder years."

bla_custom_summary_banner:0 "Again and again, the chronicle returns to oaths, friendships, marriages, and obligations between one house and another. House [ROOT.Char.GetDynasty.GetNameNoTooltip] has seldom stood entirely alone, and there are those who consider its fortunes closely tied to their own."

bla_custom_summary_steel:0 "War has left its mark upon the history of House [ROOT.Char.GetDynasty.GetNameNoTooltip]. Its forebears were not always the strongest men in the field, nor always the victors, but they learned the value of readiness, discipline, and holding firm when matters could no longer be settled by words."

bla_custom_summary_veil:0 "Much in the chronicle is uncertain, and perhaps deliberately so. The house has often preferred to know another man's purpose before revealing its own, keeping counsel close and making use of information that others overlooked."

bla_custom_summary_candle:0 "The chronicle gives unusual attention to letters, records, learned counsel, and lessons preserved from one generation to the next. House [ROOT.Char.GetDynasty.GetNameNoTooltip] has long placed value upon knowing why a thing happened, not merely that it did."

bla_custom_summary_mosaic:0 "No single habit dominates the history recorded here. In one generation the house relied upon arms, in another careful stewardship, good relations, quiet observation, or learned counsel. House [ROOT.Char.GetDynasty.GetNameNoTooltip] seems to have survived by knowing when an old answer no longer suited a new problem."

agot_bla_custom_house_legacy_summary_tt:0 "Your house's history has been recorded, establishing its dynasty legacy tradition."


# ==========================================
# 0008 — HOUSE GUARD
# ==========================================

agot_bla_custom_house_legacy.0008.t:0 "The Men Beneath the Banner"

agot_bla_custom_house_legacy.0008.desc:0 "The maester turns back through what he has written, stopping at a passage concerning the household of House [ROOT.Char.GetDynasty.GetNameNoTooltip].\n\n\"There is one matter I have neglected,\" he says. \"A lord may call upon levies when the need arises, but some warriors are remembered more closely with the house they served. Men trained in its yards, fed at its tables, or kept near at hand when trouble was expected. What sort of men have traditionally filled that place in your household?\"\n\nHe lowers his quill to the page."

agot_bla_custom_house_legacy.0008.a:0 "\"Men we could trust to stand their ground when others gave way.\""
agot_bla_custom_house_legacy.0008.b:0 "\"Men accustomed to rough country, long roads, and fighting without a battle line.\""
agot_bla_custom_house_legacy.0008.c:0 "\"Our best-born and best-equipped warriors have traditionally fought from horseback.\""
agot_bla_custom_house_legacy.0008.d:0 "\"We have always valued riders who could cover ground quickly and return with useful news.\""
agot_bla_custom_house_legacy.0008.e:0 "\"Steady men with long spears have served us better than more splendid warriors.\""
agot_bla_custom_house_legacy.0008.f:0 "\"A good bow in practiced hands has settled more than one quarrel before swords were crossed.\""


bla_custom_guard_heavy_infantry_tt:0 "The #high Sworn Shields#! — a regiment of #high Heavy Infantry#! — will serve as your dynasty's unique [men_at_arms|E]."

bla_custom_guard_skirmishers_tt:0 "The #high Rangers#! — a regiment of #high Skirmishers#! — will serve as your dynasty's unique [men_at_arms|E]."

bla_custom_guard_heavy_cavalry_tt:0 "The #high Sworn Lances#! — a regiment of #high Heavy Cavalry#! — will serve as your dynasty's unique [men_at_arms|E]."

bla_custom_guard_light_cavalry_tt:0 "The #high Outriders#! — a regiment of #high Light Cavalry#! — will serve as your dynasty's unique [men_at_arms|E]."

bla_custom_guard_pikemen_tt:0 "The #high Banner Spears#! — a regiment of #high Pikemen#! — will serve as your dynasty's unique [men_at_arms|E]."

bla_custom_guard_archers_tt:0 "The #high High Strings#! — a regiment of #high Archers#! — will serve as your dynasty's unique [men_at_arms|E]."

