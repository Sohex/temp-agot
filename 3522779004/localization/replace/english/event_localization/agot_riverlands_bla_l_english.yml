l_english:

building_type_agot_misty_isle_fisher_watchposts_01:0 "Misty Isle Hall"
building_agot_misty_isle_fisher_watchposts_01:0 "Misty Isle Watchposts"
building_agot_misty_isle_fisher_watchposts_01_desc:0 "Ancient, decaying watchtowers and spiked river-stakes once guarded the fog-veiled approaches to the Misty Isle. Though centuries of relentless floodwaters have claimed their timber, the massive, moss-grown foundations still look out over the marshes like silent sentinels."

building_agot_misty_isle_fisher_watchposts_02:0 "Hall of the River Kings"
building_agot_misty_isle_fisher_watchposts_02_desc:0 "Raised atop the cyclopean foundations of the ancient First Men, this smoke-blackened hall honors the forgotten sovereign lords who once ruled the reeds, streams, and shifting waters of the Misty Isle before the Andals ever crossed the sea."

building_agot_misty_isle_fisher_watchposts_03:0 "The Throne of the Mists"
building_agot_misty_isle_fisher_watchposts_03_desc:0 "Emerging from the choking fog and black bogwater, the ancient seat of the Fisher kings rises once more. Though the great lords of the Trident have long forgotten their primitive crowns, the mists of the rivers remember their true masters."

rival_disagreement:0 "A Bitter Disagreement"

# ==========================================
# Convene the Council of the Trident
# ==========================================

convene_lords_of_the_trident_bla_confirm:0 "Send the Ravens."

convened_trident_lords_recently_bla:0 "Convened the Trident Lords Recently"
convened_trident_lords_recently_bla_desc:0 "This ruler recently gathered the volatile and notoriously quarrelsome barons of the Riverlands to a grand regional council, demanding administrative order and checking their multi-generational blood-feuds before they could tear the forks apart."

attended_trident_council_bla:0 "Attended the Trident Council"
attended_trident_council_bla_desc:0 "For a few tense days, the riverlords gathered beneath one roof instead of across a battlefield. Old grudges were not forgotten, but neither were the promises made beside the Trident."

convened_trident_lords_required_bla:0 "You have not recently convened the Council of the Trident."

# =========================================================
# Trident Council — Opening
# =========================================================

agot_riverlands_trident_council_decision.0100.t:0 "The Concourse of the Forks"
agot_riverlands_trident_council_decision.0100.desc:0 "By dusk, your inner castle bailey is choked with a chaotic sprawl of baggage-wagons, mud-spattered lancers, and brawling household retainers. The entire Riverlands has answered your summons, bringing half the muck of the Trident directly onto your clean stone floors.\n\nInside the great hall, the deafening roar of voices bounces off the rafters in a relentless wave of mutual hostility. The river lords are already shouting obscenities over disputed border-ditches, uncollected custom-dues, logging poaching in the sentinel woods, and broken betrothal contracts. A dozen ancient blood-debts drift through the chamber like toxic smoke.\n\nNear the hearth, a boisterous Bracken is already red-faced with sour wine, slamming his tankard down. Further down the benches, a calculating Blackwood lets out a mocking laugh at exactly the wrong moment, his hand sliding instantly toward his dagger-hilt.\n\nYet, despite their deep, generational hatreds, they have occupied the same benches under your roof tonight—rather than hiding behind their own bolted gates."

agot_riverlands_trident_council_decision.0100.a:0 "Let them air their grievances. I will arbitrate their blood-debts."
agot_riverlands_trident_council_decision.0100.b:0 "Silence the room. We will audit the river-tolls and customs ledgers first."
agot_riverlands_trident_council_decision.0100.c:0 "The borders are bleeding. We must coordinate our frontier defense."
agot_riverlands_trident_council_decision.0100.d:0 "Bang the gavel! I demand absolute, ironclad unity beneath my seat."

agot_riverlands_trident_council_decision.0100.a.tt:0 "The council floor awaits. Today we must untangle centuries-old blood feuds, taste the latest vintage from the Arbor, hear out the merchants on the River Roads, or answer the growing complaints at the Crossing."
agot_riverlands_trident_council_decision.0100.b.tt:0 "A ruler’s work is never done. The harbor merchants demand our ear, travelers are crying foul over the price of the crossing, and dark whispers are drifting down the river."
agot_riverlands_trident_council_decision.0100.c.tt:0 "Grim tidings dominate the table. Raiders plague the riverbanks, broken men wander our fields, and our watchtowers stand rotting and unmanned."
agot_riverlands_trident_council_decision.0100.d.tt:0 "Tensions run high in the hall today. We face open defiance from our vassals, a bitter dispute over inheritance, and desperate calls for a stronger hand to rule."


# =========================================================
# Grievances
# =========================================================

agot_riverlands_trident_council_decision.0110.t:0 "Old Feuds, Fresh Blood"
agot_riverlands_trident_council_decision.0110.desc:0 "The inevitable shouting matches ignite long before the second course can even reach the high tables. A boisterous Bracken lord slams his calloused fist against the oakboards, rattling the goblets, while a Blackwood across the aisle smiles with the chilling satisfaction of a man sharpening a hunting knife.\n\nWithin minutes, the entire hall falls completely silent to listen. Ancient border-raids are dragged back into the light, dead fathers are loudly insulted, and old livestock thefts from three generations ago are paraded as fresh crimes. The remaining river lords watch the spectacle with the exhausted, weary glares of men who have endured this exact madness for centuries."
agot_riverlands_trident_council_decision.0110.a:0 "Silence! You shame yourselves and dishonor my court."
agot_riverlands_trident_council_decision.0110.b:0 "Let the dogs bark. They know whose iron roof keeps them safe."
agot_riverlands_trident_council_decision.0110.c:0 "A curse upon both your houses. This endless brawling ceases now."

agot_riverlands_trident_council_decision.0111.t:0 "The Scurvy of the Thoroughfares"
agot_riverlands_trident_council_decision.0111.desc:0 "A desperate line of soot-stained smallfolk waits shivering outside your castle gates long after sunset. Brought before the council, they weep over scorched grain-mills, slaughtered dairy herds, and fertile fields completely ruined beneath the trampling hooves of passing noble hosts.\n\nWithout uttering a single word, an elderly widow steps forward and presses a heavy canvas sack filled entirely with blackened, charred wheat into your steward's hands. The brawling river lords fall uncomfortably quiet after that, staring down at their greased trenchers."
agot_riverlands_trident_council_decision.0111.a:0 "Issue emergency grain sums. The smallfolk must survive the winter."
agot_riverlands_trident_council_decision.0111.b:0 "Peasants are like weeds in the mud—they will endure the frost."
agot_riverlands_trident_council_decision.0111.c:0 "I am a ruler of castles and armies, not a savior of common beggars."

agot_riverlands_trident_council_decision.0112.t:0 "Extortion at the Green Fork"
agot_riverlands_trident_council_decision.0112.desc:0 "If the testimony of the merchant factors is to be believed, every single trading guild between Seagard and the capital is being thoroughly fleeced at the Crossing. A wealthy spice-trader bellows that he was extorted for three separate bridge-tolls in the span of a single rain-slicked afternoon.\n\nBefore the merchant can even finish his accusation, an arrogant Frey retainer steps out from the benches, shouting that the tradesman is a liar and a tax-evader. The uproar instantly gets worse, with hands dropping back to dagger-hilts."
agot_riverlands_trident_council_decision.0112.a:0 "Our port collectors will audit the Twins' customs ledgers immediately."
agot_riverlands_trident_council_decision.0112.b:0 "If the guilds want safe roads and open gates, they will pay the Frey's price."
agot_riverlands_trident_council_decision.0112.c:0 "Enough! I will not have my council hijacked by squabbling over coppers."


# =========================================================
# Trade
# =========================================================

agot_riverlands_trident_council_decision.0120.t:0 "The Patricians of the Bay"
agot_riverlands_trident_council_decision.0120.desc:0 "The merchant factors of Maidenpool arrive heavily perfumed, wearing fine Myrish lace surcoats, and carrying customs ledgers thicker than septon prayer books. \n\nThey speak bitterly of choked shipping lanes, predatory river tariffs, and water-damaged warehouses, warning that valuable Essosi trade is rapidly drifting south toward Gulltown or King's Landing. A shrewd, grey-bearded trader quietly steps forward, reminding the high table that a starving port turns into a bankrupt treasury before the winter recedes."
agot_riverlands_trident_council_decision.0120.a:0 "We will expand the quayside bazaars and dredge the harbor channels."
agot_riverlands_trident_council_decision.0120.b:0 "If your ships are fat with silver, our tax tallies will rise to match."
agot_riverlands_trident_council_decision.0120.c:0 "The guilds would complain of poverty even with vaults bursting with gold."

agot_riverlands_trident_council_decision.0121.t:0 "The Extortion of the Fords"
agot_riverlands_trident_council_decision.0121.desc:0 "The composure of the room shatters completely the moment the word 'tolls' is uttered before the assembly. \n\nVolatile river lords immediately accuse neighboring keeps of bleeding trading cogs entirely dry, while the guildmasters mutter that every single wooden bridge and ferry ramp between the three forks demands its own silver stag. Near the back of the chamber, an arrogant Frey retainer pounds his fist, loudly boos, and insists the roads would crawl with outlaws without their iron-guarded gates."
agot_riverlands_trident_council_decision.0121.a:0 "I will codify a fair river-charter. Trade must flow unhindered."
agot_riverlands_trident_council_decision.0121.b:0 "Every causeway is bought with noble stone. Let the merchants pay."
agot_riverlands_trident_council_decision.0121.c:0 "Silence! I did not summon great vassals to count coppers like bailiffs."

agot_riverlands_trident_council_decision.0122.t:0 "Contraband on the Waterways"
agot_riverlands_trident_council_decision.0122.desc:0 "The accusations begin as a collection of malicious, quiet whispers across the benches. \n\nReports are paraded of deep-bellied cargo barges unloaded in the dead of night along secluded inlets, port custom-dues that mysteriously vanished before reaching your collectors, and common sailors drinking in Lannisport with pockets full of silver stags. By the end of the hour, the great hall has erupted into a chaotic shouting match, with half the lords accusing the other half of shielding smugglers."
agot_riverlands_trident_council_decision.0122.a:0 "Deploy the watch. Hunt the smugglers and line the docks with gallows."
agot_riverlands_trident_council_decision.0122.b:0 "A blind eye keeps the markets cheap and the tavern-owners quiet."
agot_riverlands_trident_council_decision.0122.c:0 "Let them sneak their contraband, so long as my private due is paid."


# =========================================================
# Defense
# =========================================================

agot_riverlands_trident_council_decision.0130.t:0 "Sails in the Shallows"
agot_riverlands_trident_council_decision.0130.desc:0 "A battle-hardened Mallister captain steps up to the high table, aggressively spreading a damp, salt-stained parchment chart across the oakboards. \n\nHe points to a grim trail of devastation: charred fishing hamlets along the western banks, missing ferrymen whose boats were found split open, and grain-skiffs drifting aimlessly downriver with blood pooling in the bilge. The great hall falls completely silent; nobody utters the word 'ironborn' aloud, for the terrifying shadow of the black sails requires no name."
agot_riverlands_trident_council_decision.0130.a:0 "Double the patrols and watch every ferry checkpoint."
agot_riverlands_trident_council_decision.0130.b:0 "Let the sea-scum come—our war-hammers will smash them in the surf."
agot_riverlands_trident_council_decision.0130.c:0 "The Trident always runs red; let the smallfolk defend their own mud."

agot_riverlands_trident_council_decision.0131.t:0 "The Outlaw Scourge"
agot_riverlands_trident_council_decision.0131.desc:0 "The vital thoroughfares of the Kingsroad have become an absolute graveyard after sunset. \n\nTraveling merchants vanish entirely between villages, smoke-choked embers of plundered camps litter the roadsides, and landless, broken men who once marched in noble hosts now hunt the thickets in rusted iron mail and hollow-eyed starvation. Rather than coordinating a defense, the river lords instantly fall into a bitter shouting match, aggressively blaming one another's deserters for the chaos."
agot_riverlands_trident_council_decision.0131.a:0 "Mobilize the local garrisons. Clear the woods and hunt the bandits."
agot_riverlands_trident_council_decision.0131.b:0 "Line the Kingsroad with gallows. Hang them until they scatter."
agot_riverlands_trident_council_decision.0131.c:0 "Broken men are like the autumn frost; I will not waste my armies on beggars."

agot_riverlands_trident_council_decision.0132.t:0 "The Crumbling Sentinels"
agot_riverlands_trident_council_decision.0132.desc:0 "One great vassal after another stands to launch a flurry of complaints regarding abandoned watchposts and crumbling stone ramparts. \n\nA stern knight from the Blue Fork swears that the ancient line of cliffside beacon-baskets has been left to rot, entirely unable to take spark in an emergency. Further down the benches, a border bailiff furiously claims that lawless brigands are now sleeping inside the very towers built to keep them out."
agot_riverlands_trident_council_decision.0132.a:0 "Draft the stonemasons. We will repair every outpost across the forks."
agot_riverlands_trident_council_decision.0132.b:0 "Our silver is better spent on sharpening swords and reinforcing gates."
agot_riverlands_trident_council_decision.0132.c:0 "Let the old stones rot into the mud. If a tower falls, it falls."


# =========================================================
# Authority
# =========================================================

agot_riverlands_trident_council_decision.0140.t:0 "Sedition on the Benches"
agot_riverlands_trident_council_decision.0140.desc:0 "Before the council can fully settle the current docket, a notoriously arrogant river lord openly questions your dynastic authority before the entire assembly. \n\nThe great hall goes completely dead silent. Ale-cups stop frozen halfway to lips, and even the low-born scullery servants slow their steps in sheer terror. The defiant vassal does not quite rise from his bench, staring right at the high table with an unbending, insolent glare that refuses to show submission."
agot_riverlands_trident_council_decision.0140.a:0 "Drag him to the dungeons! I will break his pride in the dark."
agot_riverlands_trident_council_decision.0140.b:0 "Let him speak. A wise ruler outmaneuvers a fool without shouting."
agot_riverlands_trident_council_decision.0140.c:0 "Ignore the dog. I will not compromise this council for a loudmouth."

agot_riverlands_trident_council_decision.0141.t:0 "The Blood-Charter Dispute"
agot_riverlands_trident_council_decision.0141.desc:0 "Two heavily armed rival claimants nearly draw steel right across the council table over a disputed boundary. \n\nBoth paraded crinkled parchment letters, paid-off court witnesses, and ancient wax seals to defend their claims, both swearing that absolute legal precedent favors their bloodline. The surrounding barons instantly take sides, screaming obscenities until the entire chamber sounds like a chaotic city market square on the verge of a bloody riot."
agot_riverlands_trident_council_decision.0141.a:0 "Audit the old charters. Legal precedent will dictate the verdict."
agot_riverlands_trident_council_decision.0141.b:0 "The claimant who pours the most silver into my treasury wins."
agot_riverlands_trident_council_decision.0141.c:0 "Settle it in the mud. I care little which of you bleeds for it."

agot_riverlands_trident_council_decision.0142.t:0 "The Verdict of the Forks"
agot_riverlands_trident_council_decision.0142.desc:0 "As the heavy oak doors are bolted and the candles burn down to tallow poolings, the grand assembly drifts toward the same bitter conclusion. \n\nThe Trident is far too divided; every petty baron jealously guards his own muddy banks, his own custom-houses, and his own multi-generational grudges. A powerful faction of reformist lords begins calling for a centralized, ironclad rule of law to stabilize the forks, while the old traditionalists stare back with absolute, suspicious hostility."
agot_riverlands_trident_council_decision.0142.a:0 "Forge an unbreakable charter. The Trident demands order."
agot_riverlands_trident_council_decision.0142.b:0 "They begged for an iron hand, and I will crush their pride until they obey."
agot_riverlands_trident_council_decision.0142.c:0 "The rivers cannot be forced together. Let them keep their liberties."


# =========================================================
# Modifiers
# =========================================================


 trident_council_mediator_bla:0 "Mediator of the Trident"
 trident_council_mediator_bla_desc:0 "For one tense evening, the ancient blood-feuds of the river lords were successfully kept from turning into an absolute slaughter beneath this ruler's roof."

 trident_rebuilding_relief_bla:0 "River Relief Efforts"
 trident_rebuilding_relief_bla_desc:0 "Emergency silver, seasoned timber, and grain reserves were dispatched across the thoroughfares to reconstruct common settlements scorched by recent border wars."

 trident_fair_toll_ruling_bla:0 "Fair Toll Rulings"
 trident_fair_toll_ruling_bla_desc:0 "Merchant factors and trading guilds speak cautiously well of the high table's equitable judicial rulings regarding river customs and causeway crossings."

 trident_toll_compromise_bla:0 "Quiet Toll Agreements"
 trident_toll_compromise_bla_desc:0 "The legal arguments over regional bridge-tariffs ended far too neatly for some tastes, though the thoroughfares remain exceptionally profitable for the local keeps."

 trident_trade_expansion_bla:0 "Expanded River Trade"
 trident_trade_expansion_bla_desc:0 "Substantial new infrastructure investments along the waterways have completely flooded the dockside bazaars with merchant caravans, deep-bellied grain barges, and foreign coin."

 trident_heavy_trade_tariffs_bla:0 "Heavy Trade Tariffs"
 trident_heavy_trade_tariffs_bla_desc:0 "Valuable commerce continues to push through the forks, though many foreign captains now bitterly curse our port collectors at every single checkpoint."

 trident_crossing_profits_bla:0 "Profitable Crossings"
 trident_crossing_profits_bla_desc:0 "The strategic ferry ramps, wooden bridges, and gated causeways of the Trident have become an absolute engine of continuous customs revenue."

 trident_smuggler_crackdown_bla:0 "Smuggler Crackdown"
 trident_smuggler_crackdown_bla_desc:0 "Harbor masters and coastal galley outriders have become entirely ruthless, executing anyone caught hiding illicit cargo or practicing nocturnal contraband trade."

 trident_smuggling_tolerated_bla:0 "Tolerated Smuggling"
 trident_smuggling_tolerated_bla_desc:0 "So long as a massive, illicit kickback keeps flowing directly into the treasury, certain black-market river traders are masterfully allowed to bypass the customs gates."

 trident_river_patrols_bla:0 "River Patrols"
 trident_river_patrols_bla_desc:0 "Heavily armed long-galleys and river-scouts now rigorously patrol the shallows to protect trading cogs from ironborn reivers and marsh-pirates."

 trident_reaver_warnings_bla:0 "Warnings to the Reavers"
 trident_reaver_warnings_bla_desc:0 "The council aggressively answered the threat of seaborne raids with an absolute, explicit promise of massive military retaliation against the Iron Islands."

 trident_roads_secured_bla:0 "Secured River Roads"
 trident_roads_secured_bla_desc:0 "Disciplined highway patrols and mounted outriders have made travel along the Kingsroad noticeably safer, freezing the movements of outlaw groups."

 trident_hanged_broken_men_bla:0 "Broken Men Hanged"
 trident_hanged_broken_men_bla_desc:0 "The roadside gallows across the plain have not stood empty for long, leaving a trail of rotting deserters to terrorize surviving brigand camps."

 trident_watchtowers_repaired_bla:0 "Repaired Watchtowers"
 trident_watchtowers_repaired_bla_desc:0 "Ancient stone watch-bastions have been fully restored, their pitch-beacons burning bright once more to signal the master-garrisons."

 trident_watchtower_levies_ignored_bla:0 "Neglected Defenses"
 trident_watchtower_levies_ignored_bla_desc:0 "The gold callously saved by canceling military repairs has left many vital border outposts crumbling into absolute, defenseless ruin."

 trident_hard_authority_bla:0 "Hard Authority"
 trident_hard_authority_bla_desc:0 "This ruler left the grand assembly with a terrifying reputation for stern discipline and an absolute, zero-tolerance policy for sedition."

 trident_lawful_arbitration_bla:0 "Lawful Arbitration"
 trident_lawful_arbitration_bla_desc:0 "Recent regional disputes were settled through a razor-sharp application of codified legal precedent instead of hollow threats and noble intimidation."

 trident_bought_judgment_bla:0 "Bought Judgment"
 trident_bought_judgment_bla_desc:0 "Several boundary and title verdicts reached during the assembly were suspiciously profitable for the high table's private coffers."

 trident_ordered_river_law_bla:0 "Ordered River Law"
 trident_ordered_river_law_bla_desc:0 "A centralized, ironclad administrative effort has been enacted to enforce institutional order over the notoriously divided and volatile Riverlands."

 trident_forced_obedience_bla:0 "Forced Obedience"
 trident_forced_obedience_bla_desc:0 "The rebellious barons of the Trident have been brutally reminded that any act of independent pride carries swift and permanent consequences."


# ==========================================
# 0001: The Leftovers of War
# ==========================================
agot_riverlands_bla.0001.t:0 "The Leftovers of War"
agot_riverlands_bla.0001.desc:0 "A desperate pack of broken men has crawled out of the woods, throwing up a ragged camp of lean-tos right along your main thoroughfare. A few wear rusted chainmail and torn surcoats stained with the faded colors of dead houses, but most are just hollow-eyed, starving peasants clutching notched wood-axes and fire-hardened spears.\n\nYour scouts report they are a mix of deserters, camp followers, and outlaws left behind by the last host that marched through. Driven mad by winter and empty bellies, they are already poaching your deer and terrorizing your tenant farmers."

agot_riverlands_bla.0001.a:0 "Give them bread, tools, and a chance to clear the ditches."
agot_riverlands_bla.0001.b:0 "Conscript the able-bodied into my levy. Steel is steel."
agot_riverlands_bla.0001.c:0 "Unleash the hounds and hound them out of my borders."
agot_riverlands_bla.0001.d:0 "Line the road with gallowposts. Hang them all as an example."
agot_riverlands_bla.0001.e:0 "Take their leader into my household. A hardened sellsword has uses."

agot_riverlands_bla.0001.a_compassionate:0 "Carve out a few plots for them. The smallfolk have bled enough."
agot_riverlands_bla.0001.b_compassionate:0 "Let them earn their bread by the sword instead of the rope."
agot_riverlands_bla.0001.c_just:0 "The law must be upheld, though this duty tastes like ash."
agot_riverlands_bla.0001.c_sadistic:0 "Break their bones before they think to break my peace."
agot_riverlands_bla.0001.d_compassionate:0 "Hang them quickly... and may the Gods show them more mercy than I can."
agot_riverlands_bla.0001.d_sadistic:0 "String them up and let the carrion crows feast on their eyes."


agot_riverlands_bla_broken_knight_arrives_tt:0 "A scarred, cynical hedge knight offers his sword to your court."
agot_riverlands_broken_men_host:0 "Broken Men Outlaws"
riverlands_settled_veterans_bla:0 "Settled Veterans"
riverlands_settled_veterans_bla_desc:0 "Former deserters and war-worn men have been given land and honest labor, lending their scarred arms to the defense of the county."
riverlands_lawless_roads_bla:0 "Brigand-Choked Roads"
riverlands_lawless_roads_bla_desc:0 "Deserters and starving outlaws haunt the local thickets, bleeding merchants dry and choking off trade."

# ==========================================
# 0002: The Trident Rises
# ==========================================
agot_riverlands_bla.0002.t:0 "The Trident Rises"
agot_riverlands_bla.0002.desc:0 "Days of ceaseless torrential rain upriver have turned the Trident into an angry, swollen monster. The current screams past your banks, ripping ferries from their docks and drowning the lower roads beneath several feet of murky, racing water. \n\nSmallfolk huddle on the high ridges, anxiously watching the timberlines. The rivers are the lifeblood of your domain, but when they rise in fury, they take whatever they please.[ROOT.GetCharacter.GetLocalization('riverlands_flood_outcome_bla')]"

agot_riverlands_bla.0002.desc_rich_soil:0 " Fortunately, the waters break gently across the lower flats, depositing a thick, black layer of fertile river-silt over the fields. Your farmers are already grinning through the mud, predicting a legendary harvest."
agot_riverlands_bla.0002.desc_destroyed_villages:0 " The devastation is immense. The river has smashed through three riverside hamlets, leaving shattered timbers, drowned crops, and bloated livestock drifting helplessly down the reeds."
agot_riverlands_bla.0002.desc_trade_boom:0 " The surging waters have cleared the usual sandbars, allowing deep-bellied trading barges to sail much further inland than usual. The docks are chaotic, bursting with merchants eager to unload their wares."
agot_riverlands_bla.0002.desc_drowned_roads:0 " The low roads have completely vanished into a sea of deep mud and stagnant pools. Travelers are stranded, bridges have collapsed, and half-submerged supply wagons lie abandoned along the banks."

agot_riverlands_bla.0002.a:0 "The river gives, and the river takes away."
agot_riverlands_bla.0002.b:0 "Empty the granaries and send timber to rebuild the hamlets."
agot_riverlands_bla.0002.b_compassionate:0 "We must save who we can. Send our personal reserves to rebuild."
agot_riverlands_bla.0002.c:0 "The smallfolk are resilient. They will rebuild on their own coppers."
agot_riverlands_bla.0002.c_compassionate:0 "It breaks my heart, but my vaults cannot bleed gold right now."
agot_riverlands_bla.0002.d:0 "Send tax collectors to the docks. If the barges are moving, I want my cut."
agot_riverlands_bla.0002.d_greedy:0 "Gold flows down the Trident faster than the water! Bring me my ledger!"
agot_riverlands_bla.0002.e:0 "Pray to the Gods that the banks hold through the night."

riverlands_rich_floodplains_bla:0 "Silt-Rich Floodplains"
riverlands_rich_floodplains_bla_desc:0 "The receding floodwaters have left behind a thick layer of fertile black muck, promising booming crop yields."
riverlands_flooded_villages_bla:0 "Ruined Hamlets"
riverlands_flooded_villages_bla_desc:0 "Destroyed mills and drowned livestock mark the trail of the river's recent rampage through the valley."
riverlands_river_trade_boom_bla:0 "Barge Trade Boom"
riverlands_river_trade_boom_bla_desc:0 "Deep channels have allowed large merchant fleets to penetrate deep into the county, flooding the markets with coin."
riverlands_drowned_roads_bla:0 "Washed-Out Roads"
riverlands_drowned_roads_bla_desc:0 "Collapsed bridges and deep bogs have made local travel an absolute nightmare for merchants and armies alike."

# ==========================================
# 0003: A KNIGHT OF ASHES
# ==========================================
agot_riverlands_bla.0003.t:0 "A Knight of Ashes"
agot_riverlands_bla.0003.desc:0 "A solitary hedge knight rides into your courtyard, looking like he just crawled out of a burning sept. His surcoat is scorched beyond recognition, his horse is an emaciated nag, and a hideous, pale burn scar twists the entire left side of his face.\n\nHe claims to have earned his spurs under a dozen different lords, though his timeline makes little sense. Your master-at-arms mutters that the man smells of tavern wine and looks more like a sellsword who stripped armor off a dead man than a true knight. Then again, a sharp blade doesn't care about a man's pedigree."

agot_riverlands_bla.0003.a:0 "Anoint his sword afresh. I have need of desperate men."
agot_riverlands_bla.0003.a_brave:0 "A scarred survivor has a place by my side. Welcome!"
agot_riverlands_bla.0003.b:0 "Put him through a grueling trial at arms before my court."
agot_riverlands_bla.0003.b_trusting:0 "Let us witness his honorable valor in the yard!"
agot_riverlands_bla.0003.c:0 "Toss him a heel of bread and cast him back out the gate."
agot_riverlands_bla.0003.c_just:0 "We have no room for fraudulent scoundrels. Begone."
agot_riverlands_bla.0003.d:0 "Strip his mail and search his saddlebags. He looks like a thief."
agot_riverlands_bla.0003.d_paranoid:0 "Tear his equipment apart! I smell an assassin or a bandit!"

riverlands_wandering_knights_bla:0 "Hedge Knight Court"
riverlands_wandering_knights_bla_desc:0 "Desperate, landless blades have begun drifting toward your hall, eager for coin, bread, and blood."
riverlands_hard_searches_bla:0 "Paranoid Gates"
riverlands_hard_searches_bla_desc:0 "Your guards are tearing apart every traveler's baggage, slowing down trade but keeping out unwanted scum."

# ==========================================
# 0004: Bones at the Crossing
# ==========================================
agot_riverlands_bla.0004.t:0 "Bones at the Crossing"
agot_riverlands_bla.0004.desc:0 "As the riverwaters receded from a local ford, they revealed a horrific blockage. Scores of pale, waterlogged bones, rusted suits of mail, and rot-shattered shields are tangled thick among the reeds and river rocks.\n\nThe armor bears no sigils left to read—they are the anonymous dead of some forgotten skirmish or a long-past betrayal. The local smallfolk are terrified, claiming the mud is haunted, and refuse to herd their cattle through the crossing."

agot_riverlands_bla.0004.a:0 "Send Silent Sisters to gather the bones for a proper burial."
agot_riverlands_bla.0004.a_compassionate:0 "The dead must rest. Fund a proper ossuary to soothe their lingering spirits."
agot_riverlands_bla.0004.b:0 "Scavenge the muck. Even rusted steel can be melted down into bog-iron."
agot_riverlands_bla.0004.b_compassionate:0 "Reclaim the scrap. We can hammer this iron into new ploughs for the living."
agot_riverlands_bla.0004.c:0 "Let the currents have them. Let the crows and river-pikes do the cleaning."
agot_riverlands_bla.0004.c_compassionate:0 "It brings me pain to leave them, but my vaults cannot afford a mass burial."
agot_riverlands_bla.0004.c_callous:0 "Why waste perfectly good coin burying ancient history? Nature will eat them."
agot_riverlands_bla.0004.d:0 "Have the maester examine the skull-cracks. Who slaughtered these men?"

riverlands_dead_given_rites_bla:0 "Quieted Souls"
riverlands_dead_given_rites_bla_desc:0 "The river-dead were given proper graves, soothing the superstitions of the nearby villages."
riverlands_mass_graves_bla:0 "Haunted Fords"
riverlands_mass_graves_bla_desc:0 "Bleaching bones still poke through the river silt, terrifying travelers and ruining local commerce."
riverlands_war_relics_bla:0 "River-Iron Spoils"
riverlands_war_relics_bla_desc:0 "Old swords and salvaged scrap metal have been reworked, providing a cheap boost to your armories."
riverlands_remembered_dead_bla:0 "Unearthed History"
riverlands_remembered_dead_bla_desc:0 "Investigating the old massacre has drawn curious maesters and traveling singers to your hall."

# ==========================================
# 0005: Old Grudges Die Hard
# ==========================================
agot_riverlands_bla.0005.t:0 "Old Grudges Die Hard"
agot_riverlands_bla.0005.desc:0 "What began as a trivial squabble over seating arrangements at your feast has turned incredibly ugly. [riverlands_rival_lord_bla.GetTitledFirstName] slams their cup down, loudly dragging up a bitter grievance from a decade ago—a slighted betrothal, a stolen timber-rights claim, or some vicious insult whispered during a long-past tourney.\n\nIn the Riverlands, blood stains the soil deep, and a slight is passed down like an inheritance. The music stops as everyone reaches for their hilts."

agot_riverlands_bla.0005.a:0 "Apologize for the ancient slight. Let us toast to a fresh start."
agot_riverlands_bla.0005.a_forgiving:0 "Life is too short to nurse old ashes. I swallow my pride and offer my peace."
agot_riverlands_bla.0005.b:0 "Your grandfather was a coward, and you are no better. I repeat the insult!"
agot_riverlands_bla.0005.b_vengeful:0 "You dare bark in my own hall?! I'll bury you next to the ancestors you speak of!"
agot_riverlands_bla.0005.c:0 "Slide a heavy purse of gold across the table to smooth his pride."
agot_riverlands_bla.0005.c_generous:0 "Take this gold to cover the old slight. Let there be no bad blood between us."
agot_riverlands_bla.0005.d:0 "The talk is over. Draw your steel."
agot_riverlands_bla.0005.d_brave:0 "I will not be humiliated in front of my own court! Face me!"

riverlands_border_tensions_bla:0 "Simmering Blood Feuds"
riverlands_border_tensions_bla_desc:0 "Old hatreds have flared up again, leading to nocturnal raids and bloody skirmishes along your borders."

# ==========================================
# 0006: Blood Over Tolls
# ==========================================
agot_riverlands_bla.0006.t:0 "Blood Over Tolls"
agot_riverlands_bla.0006.desc:0 "Chaos has erupted down at your busiest river crossing. Local ferrymen, aggressive merchant guilds, and armed minor landholders are literally brawling in the mud, each claiming the ancient, exclusive right to levy coins on travelers.\n\nThe crossing is choked with a massive backlog of cursing pilgrims, angry sellswords, and laden pack-horses. Where silver flows like water, blades are bound to follow."

agot_riverlands_bla.0006.a:0 "Uphold the customary rights of the local ferrymen. They know the water."
agot_riverlands_bla.0006.a_generous:0 "The river belongs to the common folk who row it. Waive their fees for a month."
agot_riverlands_bla.0006.b:0 "Sell the exclusive toll-rights to my most sycophantic allies."
agot_riverlands_bla.0006.b_greedy:0 "Auction the rights to the highest bidder! Let them squeeze every copper from the crossing!"
agot_riverlands_bla.0006.c:0 "Build a stone watchtower. The crossing belongs to me, and my spears will run it."
agot_riverlands_bla.0006.d:0 "Look the other way—so long as the local smugglers kick back a share to my treasury."
agot_riverlands_bla.0006.d_deceitful:0 "Let them tear each other apart in public, while my agents tax the black market in secret."

riverlands_free_crossings_bla:0 "Fair Crossings"
riverlands_free_crossings_bla_desc:0 "Light, predictable tolls have encouraged a massive influx of foreign merchants and travelers."
riverlands_oppressive_tolls_bla:0 "Predatory Tolls"
riverlands_oppressive_tolls_bla_desc:0 "Gouging travelers at the riverbanks has lined your pockets but completely poisoned your local reputation."
riverlands_militarized_crossing_bla:0 "Garrisoned Fords"
riverlands_militarized_crossing_bla_desc:0 "Heavy guard patrols have completely eliminated river piracy and secured the king's peace."
riverlands_smuggler_routes_bla:0 "The Black Market"
riverlands_smuggler_routes_bla_desc:0 "Illicit river trade and hidden docks bring wealth into the county far out of sight of the Crown."

# ==========================================
# 0007: Whispers Around the Hearth
# ==========================================
agot_riverlands_bla.0007.t:0 "Whispers Around the Hearth"
agot_riverlands_bla.0007.desc:0 "Outside, a miserable rain beats against your heavy stone shutters. Inside, your guards, traveling merchants, and a blind woodharpist huddle close around the roaring hearth fire, passing around a skin of sour red wine and trading dark stories of the Trident.[ROOT.GetCharacter.GetLocalization('riverlands_campfire_story_bla')]"

agot_riverlands_bla.0007.desc_harrenhal:0 " An old barge captain whispers that on moonless nights, the melted, black towers of Harrenhal still bleed a sickly red light, as if the stones themselves are trapped in the moment Harren the Black roasted inside them."
agot_riverlands_bla.0007.desc_oldstones:0 " A shivering young squire swears he saw pale, crown-wearing ghosts drifting through the ruins of Oldstones while a thick, choking fog rolled off the riverbanks."
agot_riverlands_bla.0007.desc_redfork:0 " A grizzled veteran speaks of the horrific slaughters upstream, recounting how hundreds of bloated, armor-clad corpses regularly clog the river-bends until the water turns the color of red wine."
agot_riverlands_bla.0007.desc_brokenmen:0 " A cynical sellsword describes the terrors of the backroads, where packs of broken men hunt human flesh, begging for a scrap of bread before plunging a rusted dirk into your belly."
agot_riverlands_bla.0007.desc_oldkings:0 " An ancient septon mutters about the mud-kings of old, whose ancient barrows and tombs have long been swallowed by the shifting bogs, waiting for foolish men to dig them up."

agot_riverlands_bla.0007.a:0 "The mud of the Riverlands is entirely made of blood and memory."
agot_riverlands_bla.0007.a_storyteller:0 "Let me weave my own tale into this dark tapestry. I have seen things you wouldn't believe."
agot_riverlands_bla.0007.b:0 "There is dark wisdom hidden in these old ghost stories."
agot_riverlands_bla.0007.c:0 "Quiet down, fools. The dead won't stand guard on the battlements tonight."
agot_riverlands_bla.0007.c_impatient:0 "Cease this pointless, superstitious blathering at once! Back to your posts!"
agot_riverlands_bla.0007.c_cynical:0 "Ghost stories won't mend broken walls or fill grain bins. Talk of something useful."
agot_riverlands_bla.0007.c_poet:0 "Your noise shatters the quiet cadence of the storm. Hold your tongues."



riverlands_keeper_of_tales_bla:0 "Keeper of Tales"
riverlands_keeper_of_tales_bla_desc:0 "This character has committed the bloody history, ancient ghost stories, and water-logged myths of the Trident to heart, granting them an uncanny understanding of the riverfolk."

riverlands_practical_mind_bla:0 "Cold-Iron Mind"
riverlands_practical_mind_bla_desc:0 "This character spits on old ghost stories and wandering singers, keeping their eyes firmly on grain tallies, toll-gates, and the hard realities of rule."

# ==========================================
# 0008: The Haven of Silent Men
# ==========================================
agot_riverlands_bla.0008.t:0 "The Haven of Silent Men"
agot_riverlands_bla.0008.desc:0 "Where the mouth of the Trident empties into the salty surf of the Bay of Crabs sits the mudflats of the Quiet Isle. The roar of the lords' wars vanishes here, replaced by the soft tolling of a single brass bell and the rhythmic scraping of wooden shovels.\n\nThere are no banners, no armor, and no boasting singers in this sanctuary. Only the Silent Brothers, heads bowed in coarse brown robes, burying the bloated casualties of the Riverlords' greed while tending to the broken soldiers who crawled ashore to die in peace."

agot_riverlands_bla.0008.a:0 "Walk the mudflats. Let the silence wash over my mind."
agot_riverlands_bla.0008.a_troubled:0 "The ghosts of my own choices scream so loudly that I must find peace in this mud."
agot_riverlands_bla.0008.b:0 "Seek out the Elder Brother. His memories of past wars could guide me."
agot_riverlands_bla.0008.c:0 "This place smells of rot and defeat. Row me back to the mainland."
agot_riverlands_bla.0008.c_impatient:0 "I have no time to waste staring at grave-diggers and listening to silence. Let us leave."
agot_riverlands_bla.0008.c_wrathful:0 "This depressing island is an insult to proper soldiers! Turn this boat around!"

agot_riverlands_bla_impatient_quiet_isle_tt:0 "Your restless mind chafes against the suffocating silence of the Isle."
agot_riverlands_bla_wrathful_quiet_isle_tt:0 "Your bloodthirsty nature rejects this harbor for cowards and broken men."

riverlands_quiet_contemplation_bla:0 "Mudflat Serenity"
riverlands_quiet_contemplation_bla_desc:0 "Time spent digging graves alongside the Silent Brothers has cooled this character's hot blood."
riverlands_spiritual_reflection_bla:0 "The Elder's Wisdom"
riverlands_spiritual_reflection_bla_desc:0 "Counsel from the survivors of the Quiet Isle has deepened this character's understanding of the cost of steel."

# ==========================================
# 0009: The Melted Walls Watch
# ==========================================
agot_riverlands_bla.0009.t:0 "The Melted Walls Watch"
agot_riverlands_bla.0009.desc:0 "The nightmares are spreading through the lower bailey again. A kitchen scullion swears she heard the agonizing screams of Harren’s sons echoing from the rafters of the Kingspyre Tower, while a hardened man-at-arms insists his horse died of sheer terror in the stables after sunset.\n\nNo blades have been drawn, yet the colossal, distorted stone towers feel as though they are physically leaning inward to suffocate you. In the shadows of Harrenhal, even the boldest men sleep with a dagger in hand."
agot_riverlands_bla.0009.a:0 "The stones are black because they drank the blood of kings. Let them watch."
agot_riverlands_bla.0009.a_paranoid:0 "They are watching... whispering behind the slag... plotting to finish what Aegon started!"
agot_riverlands_bla.0009.a_brave:0 "Let the dead stare all they like. Their kingdom is long dust, and I rule here now."
agot_riverlands_bla.0009.a_callous:0 "If the ghosts want to scream, let them. They aren't eating my rations or taking my coin."
agot_riverlands_bla.0009.b:0 "Take a dozen torches and tear open the bricked-up vaults below."
agot_riverlands_bla.0009.c:0 "Have the septon burn holy oils in every melted corridor."
agot_riverlands_bla.0009.c_cynical:0 "If burning cheap oil keeps the common soldiers from fleeing their posts, so be it."
agot_riverlands_bla.0009.d:0 "Flog the next guard who whines about ghosts. Fear is mutiny."
agot_riverlands_bla.0009.d_brave:0 "I will beat the cowardice out of them myself! Iron discipline is our only shield!"
agot_riverlands_bla.0009.d_craven:0 "Quiet them before their terrified wailing draws whatever is lurking in the dark!"
agot_riverlands_bla.0009.d_cynical:0 "They use these nursery tales as an excuse to neglect their shifts. Teach them a harsh lesson."

riverlands_harrenhal_whispers_bla:0 "The Harrenhal Curse"
riverlands_harrenhal_whispers_bla_desc:0 "Paranoia and midnight terrors plague the garrison, causing servants to flee and guards to see ghosts in every shadow."
riverlands_searched_black_towers_bla:0 "Exposed Vaults"
riverlands_searched_black_towers_bla_desc:0 "Tearing open the sealed cellars has put down some rumors, but the dark depth of the castle remains deeply unsettling."
riverlands_black_tower_discipline_bla:0 "Ash-Garrison Discipline"
riverlands_black_tower_discipline_bla_desc:0 "The Lord has made it clear that iron floggings await anyone who spreads tales of the old dragonfire."

# ==========================================
# 0100: Summon the Council of the Trident
# ==========================================
convene_lords_of_the_trident_bla:0 "Summon the Council of the Trident"
convene_lords_of_the_trident_bla_desc:0 "The Riverlands are a fractured mess of petty border feuds and ancient blood debts. Bringing the regional lords together under your roof might force a temporary peace."
convene_lords_of_the_trident_bla_tooltip:0 "Call upon your neighboring riverlords and bannermen for a grand council of wine and diplomacy."

agot_riverlands_bla.0100.t:0 "The Council of the Trident"
agot_riverlands_bla.0100.desc:0 "Your great hall is a powder keg of overlapping banners, heavy armor, and decades of mutual hatred. Blackwoods glare openly across the longtables at Brackens, Mallisters refuse to drink alongside Freys, and minor lords argue viciously over fishing rights.\n\nYet, as the strong wine flows and the roasted boars are carved, a wary, tense silence settles over the assembly. For a few brief days, the Riverlands might actually act as one realm."
agot_riverlands_bla.0100.a:0 "Raise a cup! Together, the Trident cannot be broken!"
agot_riverlands_bla.0100.b:0 "Look at them closely. They will obey my commands, or they will bleed."
agot_riverlands_bla.0100.c:0 "The feast emptied my cellars, but the political leverage is priceless."

riverlands_respected_convener_bla:0 "Master of the Trident"
riverlands_respected_convener_bla_desc:0 "This character managed to seat the most volatile lords in Westeros at the same table without a war breaking out, massiveley boosting their regional prestige."
attended_trident_council_bla:0 "Sat on the Trident Council"

# ==========================================
# 0010: The War of the Water-Wheels
# ==========================================
agot_riverlands_bla.0010.t:0 "The War of the Water-Wheels"
agot_riverlands_bla.0010.desc:0 "A miserable crowd of mud-spattered tenants is clogging up your court. A local miller is red-faced and screaming that a upstream ferryman has deliberately built a timber jetty that chokes off the river current, leaving his great water-wheels idle and his grain sacks rotting.\n\nThe dispute has already moved from angry shouting to pitchforks and broken teeth down at the riverbank. If you do not step in, your harvest processing will grind to a halt."

agot_riverlands_bla.0010.a:0 "Seize both the mill and the ferry. If they cannot share my river, it belongs to me."
agot_riverlands_bla.0010.a_greedy:0 "The river flows by my grace. Both assets are now property of my personal estate!"
agot_riverlands_bla.0010.b:0 "Force the ferryman to shorten his jetty, but grant him a minor tax break on his tolls."
agot_riverlands_bla.0010.b_just:0 "A fair compromise ensures that both commerce and agriculture may thrive in my lands."
agot_riverlands_bla.0010.c:0 "Silence these peasants. Throw them out of my hall until they can settle it with silver."
agot_riverlands_bla.0010.c_wrathful:0 "I am a lord of the realm, not a village arbiter! Clear my court before I clear your heads!"
agot_riverlands_bla.0010.c_compassionate:0 "Go home and break bread together. We will find a way to make sure no one starves this winter."
agot_riverlands_bla.0010.d:0 "Take a private bribe from the miller and rule heavily in his favor."
agot_riverlands_bla.0010.d_deceitful:0 "A quiet purse in the dark settles this matter perfectly. The ferryman will tear down his timbers."

riverlands_mill_taxes_bla:0 "Expropriated River Mills"
riverlands_mill_taxes_bla_desc:0 "The local mills have been brought under direct lordly control, maximizing tax income at the cost of smallfolk anger."
riverlands_fair_water_rights_bla:0 "Settled Water Rights"
riverlands_fair_water_rights_bla_desc:0 "A balanced compromise over the local waterways has restored order and kept the winter grain flowing."
riverlands_corrupt_millers_bla:0 "Riverbank Collusion"
riverlands_corrupt_millers_bla_desc:0 "Backroom deals with corrupt merchants have enriched the local treasury while impoverishing the common farmers."

# ==========================================
# 0011: The Braavosi Barge
# ==========================================
agot_riverlands_bla.0011.t:0 "The Braavosi Barge"
agot_riverlands_bla.0011.desc:0 "A deep-hulled, foreign barge has tied up at your docks, its timber hull bearing the iron seals of the Sealord of Braavos. Having sailed up the mouth of the Trident, its crew of smooth-tongued Essosi traders are throwing open crates of fine purple dyes, Myrish lace, and tempered throwing daggers.\n\nForeign trade brings immense wealth into the Riverlands, but it also draws the watchful, greedy eyes of tax collectors from King's Landing."

agot_riverlands_bla.0011.a:0 "Welcome the foreigners. Waive their docking fees to ensure they return."
agot_riverlands_bla.0011.a_greedy:0 "Let them unload, but make sure my agents pocket a 'handling fee' before they leave."
agot_riverlands_bla.0011.b:0 "Levy the maximum tariff on every scrap of lace that leaves that deck."
agot_riverlands_bla.0011.b_diligent:0 "Every single item must be counted, cataloged, and taxed strictly according to the law."
agot_riverlands_bla.0011.c:0 "Move the cargo into my private storehouses at midnight. Scrub the ledgers clean."
agot_riverlands_bla.0011.c_deceitful:0 "What cargo? If the Crown asks, the ship sank near the mouth of the river."
agot_riverlands_bla.0011.c_honest:0 "I cannot allow such blatant smuggling. We will split the profits cleanly with the Crown."
agot_riverlands_bla.0011.d:0 "Drive these foreign infidels out of my waters before they spread their strange ideas."

riverlands_braavosi_trade_bla:0 "Braavosi Silver Flow"
riverlands_braavosi_trade_bla_desc:0 "Essosi merchant networks have flooded the local markets with exotic wares and heavy silver coins."
riverlands_foreign_merchants_bla:0 "Braavosi Factor"
riverlands_foreign_merchants_bla_desc:0 "Foreign traders have set up permanent shops near the docks, boosting urban growth and commerce."
riverlands_smuggler_barges_bla:0 "Contraband Skiffs"
riverlands_smuggler_barges_bla_desc:0 "Untaxed Essosi luxury goods are slipped into the castle at night, padding the treasury out of sight of your liege."
riverlands_river_watch_bla:0 "Anti-Smuggling Patrols"
riverlands_river_watch_bla_desc:0 "Heavily armed river cutters monitor the waterways, keeping foreigners under strict, suspicious surveillance."

# ==========================================
# 0012: The Red Fork Runs Red
# ==========================================
agot_riverlands_bla.0012.t:0 "The Red Fork Runs Red"
agot_riverlands_bla.0012.desc:0 "A breathless scout bursts into your solar, his boots caked in river-mud. He swears that beneath the morning light, the waters of the Red Fork have completely turned a sickening, dark crimson, thick froth gathering along the reeds.[ROOT.GetCharacter.GetLocalization('riverlands_red_fork_explanation_bla')]"

agot_riverlands_bla.0012.desc_upstream_battle:0 " Word soon follows that a savage, undocumented slaughter took place at a crossing three miles upstream, the corpses of a hundred vanguard knights currently bloating in the shallows."
agot_riverlands_bla.0012.desc_natural:0 " Your maester insists it is merely the result of the heavy rains washing the loose, iron-rich red clay from the western hills into the tributaries, but the explanation does nothing to calm the courts."
agot_riverlands_bla.0012.desc_murder:0 " Local fishermen are terrified, reporting that dozens of butchered peasants—their bellies slit to make them sink—have been caught on the timber pilings of your bridges."
agot_riverlands_bla.0012.desc_omen:0 " The smallfolk are falling to their knees in panic, screaming that the river itself is weeping blood to warn of a devastating war that will soon consume the entire Trident."

agot_riverlands_bla.0012.a:0 "The Old Gods write their warnings in the currents. Prepare for war."
agot_riverlands_bla.0012.a_zealous:0 "The Seven are weeping for our sins! We must fast and pray before the doom catches us!"
agot_riverlands_bla.0012.b:0 "It is only mud and silt. Tell the smallfolk to get back to their fields."
agot_riverlands_bla.0012.b_brave:0 "Let the river burn or bleed, I will not let a little mud distract me from governing."
agot_riverlands_bla.0012.b_craven:0 "Bar the gates and double the night watches! We cannot take any chances!"
agot_riverlands_bla.0012.c:0 "Send my household knights upstream to find whoever did this killing—and hang them."
agot_riverlands_bla.0012.c_cynical:0 "I don't care about ghosts, but I do care about killers running wild across my tax base."
agot_riverlands_bla.0012.d:0 "Let the peasants panic. Terrified smallfolk are much too afraid to rebel."
agot_riverlands_bla.0012.d_callous:0 "A few dead peasants make for excellent fertilizer. Let the waters run red."

riverlands_dark_rumors_bla:0 "Bloody Waters Panic"
riverlands_dark_rumors_bla_desc:0 "Rumors of a supernatural curse on the Red Fork have caused local commerce and travel to break down out of sheer terror."
riverlands_river_inquiries_bla:0 "Investigated Tributaries"
riverlands_river_inquiries_bla_desc:0 "This character has investigated the source of the river contamination, proving their practical oversight."
riverlands_frightened_smallfolk_bla:0 "Terrified Riverfolk"
riverlands_frightened_smallfolk_bla_desc:0 "The smallfolk are hiding in their homes and praying to the gods, leaving the crops unharvested."


 # =========================================================
 # 0013 - A Shield Without Sigil
 # =========================================================
 agot_riverlands_bla.0013.t:0 "A Shield Without Sigil"
 agot_riverlands_bla.0013.desc:0 "The rowdy common room parts around a weathered hedge knight whose battered oak shield bears no coat of arms and whose grease-stained cloak displays no lordly colors.\n\nHis mismatched ringmail has clearly seen years of hard travel and harder fighting. Some among the drinkers whisper that he once fought beside great lords in the Stepstones, while others insist he is merely another broken man with a silver tongue and a collection of stolen armor.\n\nThe knight himself says nothing at all, choosing instead to stare quietly into his ale by the hearth."
 agot_riverlands_bla.0013.a:0 "A castle always has a use for seasoned, cynical steel. Invite him to our garrison."
 agot_riverlands_bla.0013.b:0 "Clear the courtyard. Let us see if his prowess matches his scars."
 agot_riverlands_bla.0013.c:0 "Toss him a heel of bread and let him go his way in peace."


 agot_riverlands_bla.0013.a.success_tt:0 "The wanderer swears his cynical sword to your hall, adding a seasoned fighter to your garrison."
 agot_riverlands_bla.0013.a.failure_tt:0 "The hedge knight slips away into the morning mists, leaving behind only an empty tankard and unverified boasts."


 # =========================================================
 # 0014 - The Crossroads Gossip
 # =========================================================
 agot_riverlands_bla.0014.t:0 "The Crossroads Gossip"
 agot_riverlands_bla.0014.desc:0 "Few places in the Seven Kingdoms swallow more secrets than the Inn at the Crossroads.\n\nGildmen from the Free Cities, wandering begging brothers, outriders, and river-men all squeeze beneath the same smoke-choked roof. By the third round of ale, the tavern is loud with drunken boasts, merchant grievances, and terrifying rumors from the capital.\n\nSomewhere among the slurred nonsense may lie a scrap of truth worth paying for."
 agot_riverlands_bla.0014.a:0 "Buy a round for the traders; let us hear what flows along the rivers."
 agot_riverlands_bla.0014.b:0 "Share a bench with the sellswords; their tavern talk rasps of oncoming war."
 agot_riverlands_bla.0014.c:0 "Corner the silent septon; holy men often hear the heaviest confessions."
 agot_riverlands_bla.0014.d:0 "Drunken chatter is worth exactly what it costs. Finish your wine."

 # =========================================================
 # 0015 - The Far Voyager
 # =========================================================
 agot_riverlands_bla.0015.t:0 "The Far Voyager"
 agot_riverlands_bla.0015.desc:0 "Long after the common room has emptied of its drunkards, a lone, salt-bitten traveler remains slouched beside the dying embers.\n\nHis skin is leathered by foreign suns. He claims to have stood atop the Wall, rowed through the treacherous Jade Gates, bled in the Disputed Lands, and looked upon the terrifying, oily black stone of Asshai itself.\n\nAny sensible lord would call him a fraud. Yet there is a chilling, quiet certainty in his rasping voice that makes his wildest lies sound entirely possible."
 agot_riverlands_bla.0015.a:0 "Sit beside him. Tell me of the lands where the sun never shines."
 agot_riverlands_bla.0015.b:0 "Have your guards search his packs; let us see what foreign trinkets he hides."
 agot_riverlands_bla.0015.c:0 "Test his steel; a traveler's sword should match his tongue."
 agot_riverlands_bla.0015.d:0 "Leave the liar to his ghosts and go up to bed."

 crossroads_travelers_tales_bla:0 "Whispers from the Jade Sea"
 crossroads_travelers_tales_bla_desc:0 "Strange and haunting accounts gathered at the Crossroads have broadened this ruler's perspective, piercing the insular mindset of the Seven Kingdoms."

 crossroads_well_informed_bla:0 "The Ears of the Trident"
 crossroads_well_informed_bla_desc:0 "By listening meticulously to the gossip of traders, sellswords, and begging brothers, this ruler has mastered the subtle art of separating gold from gravel in the rumor mill."

 crossroads_hedge_knight_stories_bla:0 "The Vagabond's Chivalry"
 crossroads_hedge_knight_stories_bla_desc:0 "Grizzled accounts of blood-soaked skirmishes in the Stepstones and legendary tourney lists have rekindled a sharp, visceral appreciation for raw martial steel."


