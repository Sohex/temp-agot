l_english:

# ==========================================
# DECISION BLOCK: RESTORE WHITEWALLS
# ==========================================
agot_restore_whitewalls_decision:0 "Rebuild the Milkhouse"
agot_restore_whitewalls_decision_desc:0 "Whitewalls once gleamed like a beacon of arrogance along the eastern banks of the Gods Eye. The smallfolk called it the Milkhouse, for its massive curtain walls and towers were made entirely of pale stone quarried in the Mountains of the Moon and hauled over the high passes at ruinous expense. Inside, the pillars were white marble veined with gold, and the great rafters were carved from the bone-pale wood of stolen weirwoods. \n\nIt stood proud for barely forty years before Bloodraven’s ravenries sniffed out treason within its gates. Handed over to the Crown after the Second Blackfyre Rebellion, the castle was entirely dismantled stone by stone so it could never become a monument to the Pretender's cause. Reclaiming these salted foundations will require immense wealth, unrivaled prestige, and a willingness to defy the lingering shadow of the Iron Throne."

agot_restore_whitewalls_decision_tt:0 "Launch the reconstruction of Whitewalls."
agot_restore_whitewalls_gold_cost_tt:0 "You pay #G 3000#! gold to clear the salt-crusted ruins and establish a massive labor camp."
agot_restore_whitewalls_decision_confirm:0 "Let the pale towers rise again."

# ==========================================
# EVENT 0001: THE SCARS OF TREASON
# ==========================================
agot_butterwell_whitewalls.0001.t:0 "Whitewalls: The Salted Earth"
agot_butterwell_whitewalls.0001.desc:0 "The site of the Milkhouse is a miserable, dead scar upon the Riverlands. No weeds sprout from the ditches, and the only remnants of Lord Butterwell's ancient ambition are shattered, blackened foundation stones half-buried in grey soil. Bloodraven's sorcery or kingly salt has choked the life out of this ground.\n\nYour stonemasons have arrived with hundreds of baggage carts, their oxen straining against the heavy mud. They stand at the perimeter, whispering superstitious prayers to the Seven and refusing to lay their hands upon the cursed foundations until the topsoil is completely cleared."

agot_butterwell_whitewalls.0001.a:0 "Bring in the plows. Dig up every inch of this cursed dirt."
agot_butterwell_whitewalls.0001.a.tt:0 "Laborers begin the grueling process of excavating the blighted earth."

# ==========================================
# EVENT 0002: FOUNDATIONS ON BITTER SOIL
# ==========================================
agot_butterwell_whitewalls.0002.t:0 "Whitewalls: A Tense Framework"
agot_butterwell_whitewalls.0002.desc:0 "The excavation is complete, and the new foundations have been set deep into the bedrock. Massive scaffolding now chokes the horizon as thousands of laborers haul fresh building materials to the banks of the Gods Eye. \n\nYour master builder corners you in your pavilion, rolling out a fresh set of vellum blueprints. He explains that if you simply want a secure fortress, the current budget will suffice. However, if you wish to resurrect the golden-veined marble luxury that once made the dragon kings jealous, you will need to open your treasury much wider."

agot_butterwell_whitewalls.0002.a:0 "Laying basic keep-stone is enough. I need a castle, not a palace."
agot_butterwell_whitewalls.0002.a.tt:0 "Your builders focus purely on military defenses, saving your gold."
agot_butterwell_whitewalls.0002.b:0 "Send to the Vale for the finest white marble. We will eclipse the old legends."
agot_butterwell_whitewalls.0002.b.tt:0 "You spend an additional #G 1500#! gold to secure a staggering legacy, unlocking the Grand Castle tier."

# ==========================================
# EVENT 0003: THE WHITE WALLS RETURN
# ==========================================
agot_butterwell_whitewalls.0003.t:0 "Whitewalls: Resurrected Grandeur"
agot_butterwell_whitewalls.0003.desc:0 "After years of endless stone-cutting, heavy tolls, and backbreaking labor, the scaffolds are finally stripped away. The gleaming pale walls of the fortress rise cleanly into the Riverlands sky, reflecting the morning light across the waters of the Gods Eye. \n\nA seat that was systematically erased from history by Targaryen fire and royal decree has been forced back into the physical world. Your lords and vassals gather in the central courtyard, staring in absolute awe—though some look over their shoulders, wondering if the Iron Throne will view this resurrection as an act of open defiance."

agot_butterwell_whitewalls.0003.a:0 "The castle stands as it did of old. Let the world know a Frey/Butterwell forgets nothing."
agot_butterwell_whitewalls.0003.a.tt:0 "Constructs Whitewalls Castle: A faithful, unyielding defense post honoring the ancient seat."
agot_butterwell_whitewalls.0003.b:0 "This is a new age, and these walls belong to my dynasty alone."
agot_butterwell_whitewalls.0003.b.tt:0 "Constructs Grand Whitewalls: A legendary, towering palace of immense prestige that wipes away the Blackfyre taint."


