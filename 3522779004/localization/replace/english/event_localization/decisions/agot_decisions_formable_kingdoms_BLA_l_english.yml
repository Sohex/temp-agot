l_english:
  # Proclaim the Kingdom of the Dusklands
kingdom_of_dusklands_decision:0 "Proclaim the Kingdom of the Dusklands"
kingdom_of_dusklands_decision_desc:0 "Long ago, before the rise of dragons and the unification of Westeros, the Darklyns reigned as Kings of the Dusklands. From their seat at Duskendale, they commanded ships and swords, ruling fertile river-vales and the harbor at the mouth of the Blackwater. Though those days of sovereignty passed into shadow, the crown of the Dusklands may yet be raised anew."
kingdom_of_dusklands_tooltip:0 "Reclaim the ancient crown of the Dusklands." # Tooltip that appears when you hover over the decision
kingdom_of_dusklands_decision_confirm:0 "Send the ravens!"
k_dusklands_bla:0 "King of the Dusklands"

# Proclaim the Kingdom of the Arbor
kingdom_of_the_arbor_decision:0 "Proclaim the Kingdom of the Arbor"
kingdom_of_the_arbor_decision_desc:0 "The Arbor, long famed for its golden wines and proud fleet, has ever stood apart from the turmoil of the mainland. The Redwynes hold sway over its vineyards, its ports, and its people — but the Arbor has never borne a crown. With independence, and by binding its lords beneath one banner and naming ourselves King, we shall transform this isle of vintners into a true realm, rich in trade, strong in ships, and secure in legacy."
kingdom_of_the_arbor_tooltip:0 "Unite the Arbor into a kingdom of wine and sail." # Tooltip that appears when you hover over the decision
kingdom_of_the_arbor_decision_confirm:0 "Send the ravens!"
k_the_arbor_bla:0 "King of the Arbor"

# Proclaim the Kingdom of the Torrentine
kingdom_of_the_torrentine_decision:0 "Proclaim the Kingdom of the Torrentine"
kingdom_of_the_torrentine_decision_desc:0 "Long before Nymeria’s fleet landed upon Dornish shores, the Daynes of Starfall bore crowns as Kings of the Torrentine. From their seat at the mouth of the river, they ruled fertile valleys, mountain passes, and the western coast, their power flowing as surely as the waters of the Torrentine itself. Now the time has come to restore that ancient realm, uniting the lands beneath the Sword of the Morning once more."
kingdom_of_the_torrentine_tooltip:0 "Reclaim the ancient kingship of the Torrentine." # Tooltip that appears when you hover over the decision
kingdom_of_the_torrentine_decision_confirm:0 "Send the ravens!"
k_torrentine_bla:0 "King of the Torrentine"
