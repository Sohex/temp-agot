l_english:


#Blackwood Bow


 artifact_ravenwood_name:0 "Ravenwood"
 artifact_ravenwood_desc:0 "Shaped from a fallen branch of the colossal, dead heart tree of Raventree Hall, this weirwood longbow is valued by House Blackwood as both a lethal weapon and a piece of sacred memory. Though its surface is carved as smooth as polished bone, the pale wood is marbled with dark, crimson veins like fresh blood creeping through winter snow. Legend claims the bow was bent and strung beneath the silent gaze of ten thousand roosting ravens, absorbing the watchful malice of the Old Gods."

 artifact_widowleaf_name:0 "Widowleaf"
 artifact_widowleaf_desc:0 "This ancient weirwood longbow was once gripped by Red Robb Rivers, the bastard Bowman of Raventree who famously shot down every raven out of the Lakeshore and pierced Criston Cole's breast at the Butcher's Ball. Though Robb vanished into the butchery of Tumbleton, his weapon was smuggled home and interred deep beneath the roots of the dead heart tree. Though its string and leather wrappings have long since rotted to dust, the bone-white wood remains entirely untouched by time, smoke, or decay."

 fashion_blackwood_weirwood_bow_decision:0 "Carve Ravenwood"
 fashion_blackwood_weirwood_bow_decision_desc:0 "The Old Gods may be silent, but the ancient bones of Raventree still yield wood to those with the strength to claim it. By gathering a fallen branch of the great dead weirwood, House Blackwood can fashion a sacred longbow worthy of its ancient First Men lineage."
 fashion_blackwood_weirwood_bow_decision_tooltip:0 "Craft a sacred weirwood longbow from the fallen bones of Raventree."
fashion_blackwood_weirwood_bow_decision_confirm:0 "Let the bowyer begin his work."

 fashion_blackwood_weirwood_bow_raventree_requirement:0 "You do not hold Raventree Hall"

 recover_robb_rivers_bow_decision:0 "Exhume the Bow of Red Robb"
 recover_robb_rivers_bow_decision_desc:0 "When Red Robb Rivers fell amidst the butchery of Tumbleton, his body was left to the crows, never to return home. Yet ancient whispers in the hall persist that the last survivors of his archers transported his legendary weirwood longbow back to the Blackwood Vale, interring the weapon deep beneath the suffocating roots of the dead heart tree so some piece of him might rest in sacred ground. To ensure its peace, those traumatized men never told a living soul, taking the secret to their graves as they succumbed to war, winter, and old age.\n\nAnd yet, tales such as this can never be truly quieted—not while the ravens still watch."
recover_robb_rivers_bow_decision_confirm: "Unearth the roots."

 recover_robb_rivers_bow_decision_tooltip:0 "Unearth the roots of the dead weirwood in search of Robb Rivers' lost bow."

 recover_robb_rivers_bow_raventree_requirement:0 "You do not hold Raventree Hall"

