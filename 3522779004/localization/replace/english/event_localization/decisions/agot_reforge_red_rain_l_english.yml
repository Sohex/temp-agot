l_english:


#Reforge Red Rain

reforge_red_rain_decision:0 "Reforge Red Rain"
reforge_red_rain_decision_desc:0 "After many generations, Red Rain has returned to House Reyne. One foolish member of House Reyne took the blade on his travels and lost it to Hilmar from House Drumm, who used nothing but his wits and a wooden cudgel. For generations, House Reyne did not know how or where the sword was lost. The sword had disappeared from the Reynes' grasp for too long, and it was only recently that House Drumm's boasting of their ancestral sword that House Reyne knew it had been found. With the ancestral sword back in our hands, it is time to reforge the red blade and make anew so that it is again worthy of the Red Lions and the legacy of House Reyne."
reforge_red_rain_decision_tooltip:0 "Let us remove the taint of the Ironborn and make it ours again."
reforge_red_rain_decision_confirm:0 "Reforge Red Rain."

reforge_red_rain.0001.t:0 "Red Rain Reforged"
reforge_red_rain.0001.desc:0 "Once stolen by the Ironborn of House Drumm, the blade Red Rain has been taken back—rightfully returned to the bloodline of Reyne. Its valyrian steel blade still sharp, the rest of the sword has worn from time. House Reyne has commissioned a master blacksmith to reforge the sword with the finest materials. Its hilt is remade with silver-coated steel and the pommel inlaid with numerous small rubies. Its crimson steel has been reforged, each hammer blow striking with the fury of a legacy drowned and now reborn. Castamere and Reyne's legacy breathes again through the edge of this sword."
reforge_red_rain.0001.a:0 "Red Rain is renewed."

red_rain_artifact_BLA_desc:0 "Red Rain is a blood-dark Valyrian steel longsword of lethal grace and grim elegance. Its blade gleams with a deep crimson sheen, said to shimmer like fresh-spilled blood under moonlight. The hilt, crafted of silver-coated steel, is smooth and cold to the touch, its craftsmanship portraying both nobility and menace. Set into the pommel are teardrop-shaped rubies, glistening like frozen sorrow—symbols of Castamere’s fall and the vengeance still burning in Reyne hearts. Once taken by Ironborn reavers, the sword has been reclaimed and reforged, a legacy of the Red Lion now sharpened to a deadly point."
