l_english:


# =========================================================
# OLDSTONES DECISION
# =========================================================

explore_oldstones_ruins_decision:0 "Delve the Ruins of Oldstones"
explore_oldstones_ruins_decision_desc:0 "The high, overgrown hill of Oldstones has long hidden the bones of the ancient Mudd kings beneath river silt and crumbling stone. Shepherds speak of hollow vaults collapsing under the briars, while maesters whisper that deep galleries of the old First Men palace still survive below the earth. Few who scratch at the dirt find anything but mud and rot—yet the unavenged memory of the Trident's old kings still lingers in the wind."
explore_oldstones_ruins_decision_tooltip:0 "Fund an arduous excavation beneath the ruins of Oldstones in search of lost relics and the tombs of the First Men."
explore_oldstones_ruins_decision_confirm:0 "Disturb the sepulchers of the ancient dead."



# =========================================================
# 0001 - THE BROKEN HILLS
# =========================================================
agot_oldstones_bla.0001.t:0 "The Whispering Halls"
agot_oldstones_bla.0001.desc:0 "The ancient seat of the Mudds rises only faintly above the riverbank now, its colossal foundations choked by weeds. Broken, massive walls jut from the muddy hillsides like fractured ribs, half-swallowed by centuries of summer floods. Here and there, fragments of ancient masonry emerging from the earth look less like a castle wall and more like the petrified bones of a dead beast.\n\nYour surveyors speak of hollow vaults collapsing beneath the weight of the hill, while the local smallfolk swear entire banquet halls remain sealed below the mire, untouched since the hammer-blow that broke the First Men.\n\nFew believe the tales. Fewer still are willing to drive a spade into this unholy soil."

agot_oldstones_bla.0001.a:0 "Proceed with caution. The river-mud remembers."
agot_oldstones_bla.0001.b:0 "Conscript more laborers. Open the hills by force."
agot_oldstones_bla.0001.c:0 "Let the Old Gods be consulted before we dig."

agot_oldstones_bla.0001.a.tt:0 "Your surveyors will proceed with calculated caution, minimizing the risk of a collapse."
agot_oldstones_bla.0001.b.tt:0 "You unleash a horde of laborers to aggressively tear through the ancient hillside."
agot_oldstones_bla.0001.c.tt:0 "You will make proper offerings before disturbing the resting place of the First Men."

 # =========================================================
 # 0002 - THE SEALED CHAMBER
 # =========================================================
agot_oldstones_bla.0002.t:0 "The Threshold of Time"
agot_oldstones_bla.0002.desc:0 "Beneath layers of fractured masonry and choked, writhing roots, the diggers uncover a monumental stone bulkhead descending into the blackness beneath the hill."
agot_oldstones_bla.0002.desc_careful:0 "\n\nInch by inch, the ancient masonry is brushed clean and laid bare without scratching the stonework. The sheer craftsmanship of the interlocking blocks leaves no doubt: whoever built this crypt intended it to withstand the end of the world."
agot_oldstones_bla.0002.desc_forced:0 "\n\nShattered into gravel by heavy picks, iron sledges, and mindless brute force, the ancient First Men seal finally buckles and collapses under the aggressive pace of your digging crews."
agot_oldstones_bla.0002.desc_old_gods:0 "\n\nA sudden, unnatural gale shrieks through the barrows, making a lone, stunted weirwood at the top of the hill groan as if in agony. Spooked by the omen, several smallfolk drop their tools and refuse to dig another spade."

 agot_oldstones_bla.0002.a:0 "Bring up the hammers and smash the seal. Oldstones has slept long enough."
 agot_oldstones_bla.0002.b:0 "Clear the threshold inch by inch. No stone is to be disturbed in haste."
 agot_oldstones_bla.0002.c:0 "Fill the trenches and seal the pit. The dead of the Trident demand their peace."

 agot_oldstones_bla.0002.a.tt:0 "Have your men smash through the threshold without delay."
 agot_oldstones_bla.0002.b.tt:0 "Clear the entryway with meticulous patience to avoid destroying what lies within."
 agot_oldstones_bla.0002.c.tt:0 "The dead demand their privacy. Order the trenches filled back in."

 # =========================================================
 # 0003 - THE FORGOTTEN DEAD
 # =========================================================
 agot_oldstones_bla.0003.t:0 "The Barrow of the Sinking King"
 agot_oldstones_bla.0003.desc:0 "The damp air inside the sub-surface crypts smells heavily of river-rot, ancient dust, and centuries of stagnation."
 agot_oldstones_bla.0003.desc_collapsed:0 "\n\nThe upper vault is little more than a gaping wound in the earth. The ceiling has buckled over the centuries, dropping colossal stone slabs that have thoroughly pulverized the bones, rotted timber, and whatever offerings were once laid before the dead."
 agot_oldstones_bla.0003.desc_burial:0 "\n\nBeyond the threshold lies a vast burial gallery, its limestone walls lined with deep niches and weathered runic carvings. The dead of the Whispering Halls were not merely discarded here; they were interred with the solemn reverence of the First Men."
 agot_oldstones_bla.0003.desc_flooded:0 "\n\nChilling, ink-black water from the Blue Fork fills the lower vault up to your knees. Every cautious step sends ripples across the drowned flagstones, and a sickening swirl in the dark hints that something ancient has just shifted beneath the surface."
 agot_oldstones_bla.0003.desc_royal_chamber:0 "\n\nThe passage opens into a monumental hall far grander than the surrounding crypts. Faded blue and green pigments still cling to the columns, and the ghost of primitive heraldry marks the masonry. This was a sanctuary reserved for the high lords of the Trident."

 agot_oldstones_bla.0003.a:0 "Press onward. Search the deeper vaults."

 # =========================================================
 # 0004 - WHAT THE RIVER LEFT BEHIND
 # =========================================================
 agot_oldstones_bla.0004.t:0 "What the Blue Fork Spared"
 agot_oldstones_bla.0004.desc:0 "The deepest vaults beneath the Whispering Halls are breached under the flickering glare of oil torches and drifting, ancient dust."
 agot_oldstones_bla.0004.desc_ruined:0 "\n\nMost of what lay hidden beneath the hills has long since been ruined by centuries of shifting clay, winter floods, and desperate grave-robbers. Crushed pottery, calcified bone shards, and damp, rotted timber are the only remnants to survive the dark.\n\nYet even in this hollow decay, the cold earth whispers of fallen kings."
 agot_oldstones_bla.0004.desc_fragments:0 "\n\nThough time and damp have ruthlessly consumed the wealth of Oldstones, a few shattered artifacts emerge from the heavy mud—the fractured, silent remnants of a kingdom long drowned by history."
 agot_oldstones_bla.0004.desc_relic:0 "\n\nAt the muddy base of the deepest trench, the diggers uncover pristine relics that surely once adorned the bronze-clad courts of the ancient River Kings themselves."
 agot_oldstones_bla.0004.desc_royal:0 "\n\nBeneath collapsed masonry and waterlogged foundations, something extraordinary has survived the long death of the First Men.\n\nThe item unmistakably bears the high majesty of the Mudd Dynasty, though a thousand years in the dark have stripped absolute certainty from its true origin."
 agot_oldstones_bla.0004.desc_monumental:0 "\n\nA heavy, breathless silence falls over the muddy trench as the clay is carefully scraped away.\n\nThis is no mere scrap of bronze or tattered silk, but a colossal monument to the lost sovereigns of the Trident—a legendary treasure from an age before the Andals ever crossed the sea."
 agot_oldstones_bla.0004.desc_crypt:0 "\n\nAt the base of the foundation, your diggers break through a final, sealed stone bulkhead, long choked by tangled roots and heavy clay. The air that vents from the breach carries a sudden, skeletal chill that makes the men drop their spades in unease.\n\nWhatever slumbers in the blackness beyond is no mere trinket dropped by a fleeing court. It is something far older, deeper, and deliberately entombed beneath the earth."

 agot_oldstones_bla.0004.a:0 "The ghosts of the First Men still linger here."
 agot_oldstones_bla.0004.b:0 "Wait—the stone wall behind the altar is hollow..."

 agot_oldstones_bla.0004.ruined.tt:0 "No artifacts are recovered, though your scholars glean much from the ancient masonry."
 agot_oldstones_bla.0004.artifact.tt:0 "You pull a relic of the First Men out of the river-silt."
 agot_oldstones_bla.0004.monumental.tt:0 "A legendary treasure of the Mudd Dynasty is restored to the light."

 # =========================================================
 # 0005 - THE KING BENEATH OLDSTONES
 # =========================================================
 agot_oldstones_bla.0005.t:0 "The Hundredth Battle"
 agot_oldstones_bla.0005.desc:0 "Beyond the shattered stone bulkhead lies a sanctuary entirely untouched by looters or floodwaters alike.\n\nA thick velvet shroud of dust blankets crumbling bronze trinkets and the rotted remains of moldering river-silks. At the center of the dark hall sits a long-dead sovereign upon a high, severe stone seat, pale roots winding through his ribs and pinning his spine to the throne.\n\nA tarnished, heavy bronze crown set with rough river gems still clings to the skeleton's brow. Around his feet lie the grim remnants of a final, desperate court—faded banners, splintered oak shields, and the tangled bones of those who chose to be buried alive beside their fallen master.\n\nNo surviving chronicle can name this sovereign with certainty, yet the smallfolk will whisper of this tomb until the river runs dry."
 agot_oldstones_bla.0005.desc_mudd:0 "\n\nFor a long while, the only sound in the vault is the ragged breathing of your men.\n\nThe high maesters in Oldtown claimed the lineage of the First Men kings was thoroughly dissolved into mud, Andal blood, and ruin. Yet here, beneath the broken weight of the hills, the ancient dead still sit their silent thrones.\n\nAnd the blood in your veins recognizes its master."

 agot_oldstones_bla.0005.a:0 "The kings of the Trident are forgotten no longer."
 agot_oldstones_bla.0005.b:0 "The crowns of the Bronze Age have returned to their rightful blood."



# =========================================================
# HISTORICAL FRAGMENTS
# =========================================================

oldstones_tapestry_fragment_name:0 "Mudd Dynasty Tapestry Fragment"
oldstones_tapestry_fragment_desc:0 "Only a few tattered patches of the original scene survive. Rising damp and aggressive mold have eaten away the ancient wool, though a few bronze-clad outriders and a crude, crowned figure remain visible beneath the faded vegetable dyes."

oldstones_goblet_fragment_name:0 "River-Worn Bronze Goblet"
oldstones_goblet_fragment_desc:0 "This heavily cracked bronze chalice was pulled from the flooded mud beneath Oldstones. Centuries of aggressive river erosion have completely smoothed its surface, scrubbing away whatever runic markings once adorned it."

oldstones_broken_river_shield_name:0 "Splintered River Shield"
oldstones_broken_river_shield_desc:0 "Though split cleanly down the center by rot and water weight, traces of painted, primitive heraldry still cling to the timber of this ancient shield. Its heavy bronze boss bears the deep scars of ancient axes."

oldstones_chronicle_pages_name:0 "Waterlogged Chronicle Pages"
oldstones_chronicle_pages_desc:0 "A collection of stiff, salt-caked pages recovered from a sealed stone box beneath Oldstones. Much of the early scholar's ink has dissolved into illegible black smears and river-silt."

oldstones_torque_fragment_name:0 "Mudd Funeral Torque Fragment"
oldstones_torque_fragment_desc:0 "A broken, heavy bronze neck-torque found among the skeletal remains beneath the hills. Its twisted-metal design is highly characteristic of the elite First Men warriors of the Bronze Age."


# =========================================================
# IDENTIFIABLE RELICS
# =========================================================

oldstones_signet_ring_name:0 "River King Signet Ring"
oldstones_signet_ring_desc:0 "Worn nearly paper-thin by centuries beneath the mud, the heavy seal upon this ancient bronze ring remains faintly visible: the unmistakable, crude crown of the old rulers of the Trident."

oldstones_funerary_reliquary_name:0 "First Men Funerary Reliquary"
oldstones_funerary_reliquary_desc:0 "A heavy, partially collapsed stone reliquary recovered from a dry crypt beneath Oldstones. The ash and calcified bone fragments within predate the arrival of the Andals by thousands of years."

oldstones_scale_armor_name:0 "Ancient River Scale Armor"
oldstones_scale_armor_desc:0 "Though missing entire sections and heavily corroded by green rust, this ceremonial suit of bronze scale armor still boasts an imposing, ancient craftsmanship that would stand out in any high hall."

shield_of_the_trident_kings_name:0 "Shield of the Trident Kings"
shield_of_the_trident_kings_desc:0 "This massive, bronze-rimmed war shield survived the centuries buried beneath the Whispering Halls, perfectly preserved under a layer of airtight clay. Its faded runes call upon the Old Gods for strength."

oldstones_royal_chronicle_name:0 "Royal Chronicle of the Whispering Halls"
oldstones_royal_chronicle_desc:0 "Though many leaves have been destroyed by rot, the surviving parchment fragments preserve the names and short, bloody reigns of the River Kings who ruled before the ironborn and Andals came."


# =========================================================
# ROYAL RELICS
# =========================================================

oldstones_crown_fragment_name:0 "Bronze Crown of Oldstones"
oldstones_crown_fragment_desc:0 "This fragment of a heavy bronze circlet was recovered from the flooded vaults beneath the hill. While its crude, ancient craftsmanship matches descriptions of the legendary crown worn by Tristifer IV Mudd, time and rust have left its authenticity up to intense scholarly debate. To the smallfolk, it is the true crown of the Hammer of Justice; to the maesters, it is merely an unverified relic of a shattered, primitive era."

oldstones_throne_fragment_name:0 "Throne Fragment of Oldstones"
oldstones_throne_fragment_desc:0 "A jagged, hand-carved block of ancient river-stone, believed to have been shattered from the high seat of the Mudd kings when their palace was finally sacked and broken by the Andal alliance."

skull_of_tristifer_name:0 "Alleged Skull of Tristifer IV"
skull_of_tristifer_desc:0 "This weathered, ancient skull was retrieved from a hidden sepulcher deep beneath the hill. While the grave-goods match the era of King Tristifer IV Mudd—the legendary Hammer of Justice who won ninety-nine battles only to fall in his hundredth—there is no true certainty after a thousand years in the mud. It remains an object of intense fascination and debate among the maesters, who question if it belongs to the great king himself or merely a fallen lord of his forgotten court."

# =========================================================
# MONUMENTAL DISCOVERY
# =========================================================

hammer_of_the_trident_kings_name:0 "The Hammer of Justice"
hammer_of_the_trident_kings_desc:0 "This colossal bronze warhammer was recovered from the deepest vault beneath Oldstones. Forged before the age of iron, its massive head is carved with primitive First Men runes. Though far too heavy for modern combat, it remains an unparalleled symbol of the absolute authority once held by House Mudd over the entire Trident."


 # =========================================================
 # MODIFIERS & EFFECTS
 # =========================================================
  oldstones_tombs_undisturbed_modifier:0 "Peace of the Whispering Halls"
 oldstones_tombs_undisturbed_modifier_desc:0 "By turning back, this ruler has left the sacred sepulchers of the Mudd dynasty undisturbed, preserving the ancient mysteries of the Trident beneath airtight clay."

 oldstones_royal_crypts_discovered_bla:0 "Exhumer of the Whispering Halls"
 oldstones_royal_crypts_discovered_bla_desc:0 "This character has broken the ancient seals beneath Oldstones, exhuming the long-buried courts and sacred sepulchers of the ancient Mudd kings."

 oldstones_royal_crypts_county_bla:0 "The Awakened Crypts"
 oldstones_royal_crypts_county_bla_desc:0 "Scholars, smallfolk pilgrims, and curious hedge knights flock to this province to marvel at the ancient First Men tombs uncovered beneath the ruined hills."

 oldstones_heirs_of_the_river_kings_bla:0 "Blood of the Hammer"
 oldstones_heirs_of_the_river_kings_bla_desc:0 "By shattering the ancient seals beneath the Whispering Halls, this character has vindicated their bloodline, pulling the sacred heritage of House Mudd out of the shadows of myth and back into the light of the living world."