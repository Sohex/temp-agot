l_english:


agot_search_vaults_of_claw_isle_decision_bla:0 "Search the Vaults of Claw Isle"

agot_search_vaults_of_claw_isle_decision_bla_desc:0 "A sealed passage has been uncovered beneath the ancient cellars of Claw Isle. Beyond it lie chambers forgotten by living memory, perhaps untouched for generations.\n\nHouse Celtigar has inhabited this island since before the Doom. Its lords have gathered coin, tribute, gifts, curiosities, records, and heirlooms from both sides of the narrow sea. What was hidden beneath these halls — and why — has been forgotten.\n\nOpening the old vaults properly will require laborers, guards, tools, and no small amount of coin. Yet whatever my ancestors left below has waited long enough."

agot_search_vaults_of_claw_isle_decision_bla_confirm:0 "Let us see what the crab has buried."

agot_search_vaults_of_claw_isle_decision_bla_tooltip:0 "Begin a funded search of the forgotten chambers beneath Claw Isle."

agot_search_vaults_of_claw_isle_decision_bla_claw_isle_tt:0 "You must control #bold Claw Isle#!."

agot_crownlands_bla.0208.t:0 "The Vaults of Claw Isle"

agot_crownlands_bla.0208.desc:0 "Stone yields reluctantly beneath hammer and chisel.\n\nThe passage uncovered beneath the cellars descends farther than I expected, through masonry noticeably older than the rooms above it. Iron fittings have rusted almost to nothing, yet the stone itself remains stubbornly sound.\n\nAt last, the workers clear enough rubble to reveal the first proper doorway. Beyond it waits stale air, dust, and darkness undisturbed by any living Celtigar in generations."

agot_crownlands_bla.0208.desc_careful:0 "\n\nThe old records have already proven their worth. Faded inventories refer to lower storerooms by names no servant recognizes, while one brittle plan shows passages omitted entirely from later drawings of the castle. We are not searching blindly."

agot_crownlands_bla.0208.desc_secret:0 "\n\nOnly a handful of trusted hands know what we are doing. The work is slow because of it, but no tavern upon Claw Isle yet buzzes with tales of Celtigar treasure being dragged from beneath the castle."

agot_crownlands_bla.0208.desc_immediate:0 "\n\nWe came prepared with more enthusiasm than knowledge. Each wall must be tested, each passage cleared as we find it, and every locked door presents another question my ancestors neglected to answer."

agot_crownlands_bla.0208.a:0 "Bring the lamps. We go deeper."

agot_crownlands_bla.0209.t:0 "Dust and Iron"

agot_crownlands_bla.0209.desc:0 "The passage divides beneath the castle.\n\nOne corridor is lined with shallow alcoves where fragments of rotted shelving still cling to the walls. Another ends before a broad iron-bound door whose lock has become a solid mass of rust. A third is scarcely a corridor at all, little more than a narrow opening concealed behind fallen stone.\n\nThe workmen look to me.\n\nWhatever the Celtigars of centuries past stored below, they clearly did not intend every chamber to serve the same purpose."

agot_crownlands_bla.0209.a:0 "The inventories mentioned these chambers. Follow the records."
agot_crownlands_bla.0209.a.preparation_tt:0 "Your decision to #bold study the old household records#! has revealed clues about the forgotten layout."

agot_crownlands_bla.0209.b:0 "Break the iron door. Treasuries require locks."

agot_crownlands_bla.0209.c:0 "The hidden passage interests me more."
agot_crownlands_bla.0209.c.preparation_tt:0 "Your decision to #bold keep the discovery secret#! has made your household particularly attentive to concealed chambers and forgotten ways."

agot_crownlands_bla.0209.d:0 "We did not come this far to be stopped by old stone."
agot_crownlands_bla.0209.d.preparation_tt:0 "Your decision to #bold open the vaults without delay#! has encouraged a more aggressive search."

agot_crownlands_bla.0211.t:0 "What the Crab Kept"

agot_crownlands_bla.0211.desc_coin:0 "The iron-bound chamber was a treasury after all.\n\nBeneath rotted cloth and the remains of wooden chests lie stacks of old coin, silver plate, ingots, and pieces of bullion blackened by age but otherwise untouched. Some bear the marks of kings long dead; others were struck in cities across the narrow sea.\n\nNo single fortune was hidden here. This wealth was accumulated slowly, payment upon payment, generation upon generation.\n\nThe crab, it seems, has always known how to keep what entered its claws."

agot_crownlands_bla.0211.desc_records:0 "The shelves have collapsed beneath the weight of years, but much of what they carried survived.\n\nLedgers, contracts, household rolls, letters, inventories, and genealogies fill the chamber. Some were written by hands centuries dead. Others refer to Celtigars whose names have nearly vanished from family memory.\n\nHere, preserved beneath dust and stone, lies something perhaps more valuable than silver: the forgotten memory of my house."

agot_crownlands_bla.0211.desc_curiosities:0 "The chamber resembles the collection of a merchant prince more than a lord's treasury.\n\nCarved boxes from the east lie beside strange coins, fragments of painted pottery, old maps, bits of worked ivory, tarnished jewelry, and objects whose purpose none of us can immediately identify. Generations of Celtigars appear to have deposited the unusual things that reached Claw Isle and were considered too interesting to discard.\n\nA lesser house might call it clutter. I call it inheritance."

agot_crownlands_bla.0211.desc_valyria:0 "At the rear of the chamber rests a small chest unlike the others.\n\nAge has darkened its fittings, but beneath the grime I recognize workmanship unlike anything fashioned upon Claw Isle. Inside, carefully wrapped against damp and time, lies a heavy signet fashioned in the likeness of a crab. Tiny red stones gleam from its ancient setting.\n\nThe work is Valyrian — and old. Perhaps very old.\n\nFor a moment the vault seems very still. House Celtigar crossed the narrow sea before the Doom, carrying with it whatever possessions its first lords deemed worthy of saving. Whether this signet was among them, no living soul can say.\n\nCoin can be earned again. This cannot."

agot_crownlands_bla.0211.desc_secret:0 "We expected treasure. Instead, we found names.\n\nLetters and sealed accounts lie hidden within a narrow compartment behind the chamber wall. Payments made quietly. Debts never entered into ordinary ledgers. Correspondence between Celtigar lords and men whose dealings were clearly never meant for public record.\n\nSome secrets have outlived everyone they could once have ruined.\n\nOthers may not have."

agot_crownlands_bla.0211.desc_ruin:0 "There is little treasure waiting beyond the final stones.\n\nWater found this chamber long before we did. Shelves have collapsed, iron has rusted into shapeless masses, and whatever once filled the rotted chests has been claimed by damp, vermin, and time.\n\nYet even here there are traces of those who came before us — fragments of writing, broken seals, and the unmistakable evidence that some forgotten Celtigar once considered this chamber worth hiding.\n\nNot every inheritance survives its heirs."

agot_crownlands_bla.0211.a:0 "Even forgotten, Celtigar coin returns to Celtigar hands."
agot_crownlands_bla.0211.b:0 "Have every surviving page preserved."
agot_crownlands_bla.0211.c:0 "Bring these things into the light."
agot_crownlands_bla.0211.d:0 "The crab remembers."
agot_crownlands_bla.0211.e:0 "Seal the chamber. These papers are for my eyes."
agot_crownlands_bla.0211.f:0 "Then we preserve what little remains."

agot_crownlands_bla.0211.d.valyria_tt:0 "Your earlier embrace of #bold the Blood of Old Valyria#! makes the recovery of an ancient Valyrian heirloom a profound vindication of the heritage you chose to uphold."

agot_celtigar_ancestral_archives_bla:0 "The Celtigar Archives"
agot_celtigar_ancestral_archives_bla_desc:0 "Forgotten household records recovered from beneath Claw Isle have restored generations of lost knowledge concerning the affairs, obligations, and history of House Celtigar."

agot_celtigar_foreign_curiosities_bla:0 "Curiosities of Claw Isle"
agot_celtigar_foreign_curiosities_bla_desc:0 "Objects gathered from distant ports over generations have emerged from the forgotten vaults of Claw Isle, offering glimpses of lands and peoples far beyond Westeros."

agot_celtigar_secrets_of_the_vault_bla:0 "Secrets of the Vault"
agot_celtigar_secrets_of_the_vault_bla_desc:0 "Old correspondence recovered beneath Claw Isle has revealed how earlier Celtigars conducted the affairs they preferred history not to remember."

celtigar_old_crab_bla_name:0 "The Old Crab"

celtigar_old_crab_bla_description:0 "A heavy signet of unmistakably Valyrian workmanship, fashioned in the likeness of a crab and set with small red stones darkened by age. It was recovered from a sealed chamber beneath Claw Isle, wrapped carefully among possessions that had lain untouched for generations.\n\nWhether the signet truly crossed the narrow sea with the first Celtigars cannot now be proven, but its workmanship is far older than the castle raised above the vault in which it was found. Whatever lord first wore it lived closer to the days of Old Valyria than any Celtigar now living."

celtigar_old_crab_bla_modifier:0 "The Old Crab"
celtigar_old_crab_bla_modifier_desc:0 "An ancient Valyrian signet associated with the earliest history of House Celtigar."