l_english:

agot_velaryon_stepstones_ambition_decision_bla:0 "Ambition in the Stepstones"

agot_velaryon_stepstones_ambition_decision_bla_desc:0 "South of the narrow sea lies a broken chain of barren islands, pirate dens, hidden coves, and blood-soaked rocks. The Stepstones have changed hands countless times, yet whoever commands them may threaten — or protect — the trade passing between Westeros and Essos.\n\nHouse Velaryon has watched these waters for generations. Perhaps it is time we ceased merely watching."

agot_velaryon_stepstones_ambition_decision_bla_tooltip:0 "Commit House Velaryon to establishing lasting dominion over the Stepstones."

agot_velaryon_stepstones_ambition_decision_bla_confirm:0 "Set My Sights Upon the Stepstones"

agot_crownlands_bla.0150.t:0 "A Crown Upon the Waves"

agot_crownlands_bla.0150.desc:0 "The charts spread across my table show the narrow sea from Driftmark to the shores of Dorne, yet my eyes continue to return to the broken chain of islands scattered across its southern waters.\n\nBloodstone. Sunstone. Grey Gallows. The Skulls. Names earned through wreckage, piracy, and blood. Lords, sellswords, corsairs, and would-be kings have fought over those rocks for generations, each imagining that the Stepstones might finally bend beneath one hand.\n\nMost have failed.\n\nYet every merchant sailing between the great ports of Westeros and Essos must reckon with those waters. Pirates grow rich there. Fleets hide there. Kingdoms have spent fortunes trying to command them.\n\nHouse Velaryon possesses ships, sailors, coin, and ambition enough to look beyond Driftmark's horizon. Before I commit them, however, I must decide what I truly mean to win."

agot_crownlands_bla.0150.a:0 "The Stepstones will shield the approaches to Driftmark."
agot_crownlands_bla.0150.a.tt:0 "Your ambition will emphasize #bold naval security and control of the narrow sea#!."

agot_crownlands_bla.0150.b:0 "Every merchant crossing those waters shall know our banners."
agot_crownlands_bla.0150.b.tt:0 "Your ambition will emphasize #bold trade, harbors, and commercial control#!."

agot_crownlands_bla.0150.c:0 "Others have worn crowns upon those rocks. Why not me?"
agot_crownlands_bla.0150.c.tt:0 "Your ambition will emphasize #bold conquest, personal glory, and kingship#!."

agot_crownlands_bla.0150.d:0 "Better our rule than another generation of pirate kings."
agot_crownlands_bla.0150.d.tt:0 "Your ambition will emphasize #bold order, settlement, and lasting rule#!."

agot_crownlands_bla.0151.t:0 "Captains Without Banners"

agot_crownlands_bla.0151.desc:0 "Ambition travels faster across the narrow sea than any raven.\n\n[stepstones_sellsail_captain_bla.GetFirstName] arrived at my harbor this morning aboard a weathered ship flying no banner I recognize. [stepstones_sellsail_captain_bla.GetSheHe|U] claims to have sailed the waters around the Stepstones for years — sometimes guarding merchants, sometimes hunting pirates, and, I suspect, sometimes finding the distinction between the two less important than [stepstones_sellsail_captain_bla.GetSheHe] now suggests.\n\nYet [stepstones_sellsail_captain_bla.GetSheHe] knows the islands. Hidden anchorages, treacherous channels, watering places, pirate coves — all the knowledge that does not find its way onto a maester's chart.\n\n'I hear the seahorse means to tame the Stepstones,' [stepstones_sellsail_captain_bla.GetSheHe] says. 'You'll need captains who know those rocks. I know them.'\n\nThe smile that follows makes one thing clear: [stepstones_sellsail_captain_bla.GetSheHe] did not come to Driftmark out of admiration."

agot_crownlands_bla.0151.a:0 "Good captains deserve good coin."
agot_crownlands_bla.0151.b:0 "Serve me well, and one of those rocks may become yours."
agot_crownlands_bla.0151.c:0 "First, show me that your reputation is deserved."
agot_crownlands_bla.0151.d:0 "House Velaryon has captains enough."

agot_crownlands_bla.0151.c.success:0 "A Captain of Proven Worth"
agot_crownlands_bla.0151.c.failure:0 "Less Impressive Than Advertised"

agot_stepstones_well_paid_captain_bla:0 "Well-Paid Captain"
agot_stepstones_well_paid_captain_bla_desc:0 "This captain entered Velaryon service for generous pay and understands both the risks and rewards of campaigning in the Stepstones."

agot_stepstones_proven_captain_bla:0 "Proven Captain"
agot_stepstones_proven_captain_bla_desc:0 "Tested before being trusted with a place in the Stepstones campaign, this captain demonstrated considerable ability in the arts of maritime warfare."

agot_crownlands_bla.0152.t:0 "The Price of Water"

agot_crownlands_bla.0152.desc:0 "The Stepstones possess no shortage of stone.\n\nFresh water is another matter.\n\nReports from the ships speak of casks emptied faster than expected, foul cisterns, and crews sent ashore to search barren slopes for springs that exist only upon old charts. Every man carried south requires water. Every horse requires more. Even a victorious fleet must eventually drink.\n\nMy officers warn that conquest will mean little if our men cannot remain upon the islands once they are taken. Supplies can be carried from Driftmark, purchased abroad, or seized wherever they are found — but every solution has its price.\n\nThe Stepstones may be won with steel. Holding them will require water."

agot_crownlands_bla.0152.a:0 "Establish a proper supply line from Driftmark."
agot_crownlands_bla.0152.b:0 "The Great Fleet will carry what our campaign requires."
agot_crownlands_bla.0152.c:0 "Find the wells and cisterns. We mean to stay."
agot_crownlands_bla.0152.d:0 "Merchants carry water as readily as wine, for the right price."
agot_crownlands_bla.0152.e:0 "Take what we require."

agot_velaryon_stepstones_harsh_requisitions_bla:0 "Harsh Requisitions"
agot_velaryon_stepstones_harsh_requisitions_bla_desc:0 "Ships, provisions, water, and supplies have been seized wherever the Stepstones campaign requires them. The method is effective, though few who surrender their property willingly call it just."

agot_crownlands_bla.0153.t:0 "A Pirate's Offer"

agot_crownlands_bla.0153.desc:0 "The visitor who has come before me makes no effort to pretend to be an honest sailor.\n\n[stepstones_pirate_bla.GetFirstName] has spent years among the Stepstones, raiding when opportunity allowed, smuggling when profit demanded it, and serving whichever captain possessed enough coin to make loyalty worthwhile. [stepstones_pirate_bla.GetSheHe|U] speaks of the islands with the confidence of one who knows not merely their shores, but the men who hide among them.\n\n'You can take Bloodstone,' [stepstones_pirate_bla.GetSheHe] tells me, 'but you'll lose ships finding the right way in. You can hunt every pirate from here to the Broken Arm, but half will flee before you know their names.'\n\nThen comes the smile.\n\n'I know their names.'"

agot_crownlands_bla.0153.a:0 "Then sail beneath the seahorse."
agot_crownlands_bla.0153.b:0 "I want your knowledge, not your allegiance."
agot_crownlands_bla.0153.c:0 "You will serve me — and I will ensure you remember why."
agot_crownlands_bla.0153.d:0 "I will not build my rule upon pirates."

agot_crownlands_bla.0154.t:0 "The Cost of Conquest"

agot_crownlands_bla.0154.desc_supply_line:0 "The supply ships from Driftmark arrive almost predictably now.\n\nBarrels of fresh water are rolled ashore beside sacks of grain, coils of rope, salted fish, lamp oil, and everything else an army discovers it cannot live without. What began as an improvised chain of ships and quartermasters has grown into something approaching a proper system.\n\nMy officers suggest that, with further investment, these temporary arrangements might become permanent depots capable of supplying our men throughout the islands. Others argue that coin spent building storehouses upon barren rocks is coin that could be better spent taking them."

agot_crownlands_bla.0154.desc_great_fleet:0 "The Great Fleet has carried men, weapons, horses, water, and provisions south with an efficiency few other powers could hope to match.\n\nYet its captains have begun to complain. Warships built to pursue enemies spend their days escorting grain ships or carrying barrels between anchorages. Oarsmen who expected battle now haul cargo beneath the sun, while valuable hulls remain tethered to the campaign's endless need for supplies.\n\nThe fleet can continue bearing the burden. Whether it should is another matter."

agot_crownlands_bla.0154.desc_local:0 "The wells and cisterns we secured have proven more valuable than any chest of captured coin.\n\nUnfortunately, the people who live among these rocks already knew that.\n\nFishermen, traders, camp followers, and inhabitants now gather near sources of water guarded by my men. Some offer coin. Others insist their families drank there long before the seahorse came south. My officers remind me that thirsty soldiers care little for local custom.\n\nIf we mean to rule the Stepstones rather than merely pass through them, this may be the first question of that rule."

agot_crownlands_bla.0154.desc_merchants:0 "The merchants have kept their word. Water, grain, wine, salted meat, and other supplies arrive regularly aboard contracted vessels.\n\nUnfortunately, merchants have also learned precisely how badly we need them.\n\nTheir newest accounts bear prices considerably higher than those first agreed upon. They speak solemnly of dangerous waters, lost opportunities, frightened crews, and the extraordinary costs of supplying an army among the Stepstones.\n\nPerhaps every word is true. They still intend to make a fortune from it."

agot_crownlands_bla.0154.desc_requisitions:0 "At first, taking what the campaign required seemed simple enough.\n\nA barrel seized here. A merchant vessel redirected there. Water taken from cisterns beneath armed guard. Few wished to argue with Velaryon men while our ships filled the horizon.\n\nNow stores disappear before our quartermasters arrive. Cisterns are found mysteriously empty. Boatmen claim ignorance of nearby springs they certainly knew a moon ago, while merchants have begun giving our anchorages a suspiciously wide berth.\n\nMen may surrender their supplies to soldiers. That does not mean they forget who took them."

agot_crownlands_bla.0154.a:0 "Build the depots. We mean to stay."
agot_crownlands_bla.0154.b:0 "What we have is sufficient."

agot_crownlands_bla.0154.c:0 "The fleet will bear whatever burden victory demands."
agot_crownlands_bla.0154.d:0 "Hire supply vessels. Warships belong at war."

agot_crownlands_bla.0154.e:0 "No soldier will drink before the people who live here."
agot_crownlands_bla.0154.f:0 "My army drinks first."

agot_crownlands_bla.0154.g:0 "Pay them. The campaign cannot stop for haggling."
agot_crownlands_bla.0154.h:0 "They have mistaken necessity for desperation."

agot_crownlands_bla.0154.h.success:0 "A Better Bargain"
agot_crownlands_bla.0154.h.failure:0 "The Merchants Know Their Leverage"

agot_crownlands_bla.0154.i:0 "If they hide supplies, search harder."
agot_crownlands_bla.0154.j:0 "Pay what was taken before this becomes rebellion."

agot_crownlands_bla.0154.desc_captain_success:0 "The sellsail captain has proven more useful than many of my officers expected.\n\nUsing half-forgotten anchorages, shallow channels, and watering places absent from our charts, [stepstones_sellsail_captain_bla.GetFirstName] has established a rough network through which supplies can move between the islands. It is hardly the orderly system a maester might design, but barrels arrive where they are needed and thirsty men have ceased complaining quite so loudly.\n\nThe question now is whether to trust these improvised routes or spend coin turning them into something more dependable."

agot_crownlands_bla.0154.desc_captain_failure:0 "The captain's knowledge has not been enough.\n\nSeveral watering places proved dry, one supposed anchorage could barely shelter a fishing boat, and a supply vessel nearly ran itself upon rocks following a channel [stepstones_sellsail_captain_bla.GetFirstName] swore was safe.\n\nOur men still need water, and now we have lost valuable time discovering where it cannot be found.\n\nImprovisation has failed us. The campaign requires another answer."

agot_crownlands_bla.0154.desc_fallback:0 "The Stepstones remain a difficult place in which to keep an army supplied. Water, provisions, ships, and men must somehow be kept moving between scattered islands if House Velaryon intends to hold what it conquers."

agot_crownlands_bla.0154.k:0 "Trust the captain's routes."
agot_crownlands_bla.0154.l:0 "Map them properly and expand the network."
agot_crownlands_bla.0154.m:0 "Then purchase what our captain could not find."
agot_crownlands_bla.0154.n:0 "The islands will provide, willingly or otherwise."

agot_crownlands_bla.0155.t:0 "Bloodstone"

agot_crownlands_bla.0155.desc:0 "The seahorse flies above Bloodstone.\n\nFor generations this island has passed between pirates, sellswords, petty lords, and men bold enough to name themselves kings. Its coves have hidden raiders, its shores have seen fleets broken, and more than one conqueror has mistaken possession of its rocks for mastery of the Stepstones.\n\nNow Bloodstone is mine.\n\nFrom its heights I can look north toward Westeros and east toward the shipping lanes of the narrow sea. The island is barren, scarred, and stubbornly difficult to rule — yet every captain understands what its capture means.\n\nWe are no longer merely sailing against the Stepstones. We have planted our banner among them."

agot_crownlands_bla.0155.desc_information:0 "\n\nThe information purchased from those who knew these waters proved its worth. Hidden approaches, forgotten anchorages, and the habits of Bloodstone's defenders were known to us before our banners ever appeared offshore."

agot_crownlands_bla.0155.desc_cooperation:0 "\n\nSome among the islanders have already begun approaching my officers willingly. Word has spread that those who submit to Velaryon rule may find a place beneath it."

agot_crownlands_bla.0155.desc_resentment:0 "\n\nYet not every face beneath my banner is welcoming. Supplies taken, wells seized, and harsh demands made during the campaign have not been forgotten. Bloodstone has been conquered; its people are another matter."

agot_crownlands_bla.0155.a:0 "Fortify Bloodstone. We will not lose what we have taken."
agot_crownlands_bla.0155.b:0 "Open the harbor. Let trade follow the seahorse."
agot_crownlands_bla.0155.c:0 "This will be the seat from which we take the rest."
agot_crownlands_bla.0155.d:0 "We conquered this island. Now we must rule it."
agot_crownlands_bla.0155.e:0 "Let them learn what defiance costs."
agot_crownlands_bla.0152.f:0 "You said you knew these islands. Prove it."
agot_crownlands_bla.0152.f.success:0 "The Captain Knows the Rocks"
agot_crownlands_bla.0152.f.failure:0 "Even the Best Charts Fail"

agot_velaryon_fortified_bloodstone_bla:0 "Fortified Bloodstone"
agot_velaryon_fortified_bloodstone_bla_desc:0 "Velaryon coin and labor have strengthened Bloodstone's defenses, turning the island into a secure base for further campaigns throughout the Stepstones."

agot_velaryon_bloodstone_trade_port_bla:0 "Bloodstone Trade Port"
agot_velaryon_bloodstone_trade_port_bla_desc:0 "Merchants have been encouraged to use Bloodstone as a protected harbor between Westeros and Essos, slowly replacing piracy with profitable commerce."

agot_velaryon_bloodstone_reconciled_bla:0 "Reconciled Bloodstone"
agot_velaryon_bloodstone_reconciled_bla_desc:0 "Velaryon rule has been tempered with concessions and investment, persuading many inhabitants that submission may offer more than continued resistance."

agot_velaryon_bloodstone_under_the_boot_bla:0 "Bloodstone Under the Boot"
agot_velaryon_bloodstone_under_the_boot_bla_desc:0 "Resistance upon Bloodstone has been answered with uncompromising force. Order is returning, though affection for the new rulers is decidedly scarce."

agot_crownlands_bla.0156.t:0 "A Crown of Salt and Stone"

agot_crownlands_bla.0156.desc:0 "They gather upon Bloodstone beneath a sky heavy with salt and wind.\n\nCaptains who once answered to no man stand beside knights bearing the seahorse. Merchants watch from the edges of the hall, calculating already what peace among these islands might be worth. Men who called themselves pirate kings only moons ago now bow their heads — willingly or otherwise — before the ruler of the Stepstones.\n\nThe title is mine now. Not merely Bloodstone, nor a scattering of barren rocks wrested from corsairs, but the Stepstones themselves.\n\nMany have conquered these islands before me. Some wore crowns. Some filled their coffers. Others left only bones bleaching beneath the sun.\n\nIf House Velaryon is to fare differently, the realm born here must be given a purpose."

agot_crownlands_bla.0156.a:0 "Bring me a crown. Let the Stepstones behold their ruler."
agot_crownlands_bla.0156.b:0 "No circlet matters beside command of these waters."
agot_crownlands_bla.0156.c:0 "Open the harbors. Let coin replace piracy."
agot_crownlands_bla.0156.d:0 "Conquest is finished. Now we build a realm."

agot_crownlands_bla.0156.a.original_ambition_tt:0 "This fulfills the ambition you declared when you first set your eyes upon the Stepstones: #bold to claim a crown upon these waters#!."

agot_crownlands_bla.0156.b.original_ambition_tt:0 "This fulfills the ambition you declared when you first set your eyes upon the Stepstones: #bold to secure the Narrow Sea beneath Velaryon power#!."

agot_crownlands_bla.0156.c.original_ambition_tt:0 "This fulfills the ambition you declared when you first set your eyes upon the Stepstones: #bold to command the trade passing between Westeros and Essos#!."

agot_crownlands_bla.0156.d.original_ambition_tt:0 "This fulfills the ambition you declared when you first set your eyes upon the Stepstones: #bold to replace the rule of pirates with lasting order#!."

velaryon_stepstones_crown_bla_name:0 "Crown of Salt and Stone"
velaryon_stepstones_crown_bla_description:0 "A severe crown of dark iron and silver, fashioned to mark House Velaryon's conquest of the Stepstones. Coral and coins from the islands are worked into the circlet, while the salt and wind of Bloodstone have already begun to leave their mark upon the metal. Unlike the ancient treasures of old Valyria, this crown claims no forgotten lineage. Its history began when the seahorse rose above the Stepstones."

agot_velaryon_lord_of_the_narrow_sea_bla:0 "Lord of the Narrow Sea"
agot_velaryon_lord_of_the_narrow_sea_bla_desc:0 "The conquest of the Stepstones has placed the sea lanes between Westeros and Essos beneath the reach of Velaryon ships. Captains throughout the Narrow Sea have learned to recognize the authority of the seahorse."

agot_velaryon_crossroads_of_the_narrow_sea_bla:0 "Crossroads of the Narrow Sea"
agot_velaryon_crossroads_of_the_narrow_sea_bla_desc:0 "Under Velaryon protection, Bloodstone is being transformed from a haven of corsairs into a dependable port for merchants crossing between Westeros and Essos."

agot_velaryon_founder_of_stepstones_order_bla:0 "Founder of a New Order"
agot_velaryon_founder_of_stepstones_order_bla_desc:0 "This ruler has begun the difficult work of turning the scattered, quarrelsome Stepstones from a collection of pirate strongholds into a realm governed beneath lasting laws and obligations."

agot_crownlands_bla.0157.t:0 "A Captain's Due"

agot_crownlands_bla.0157.desc:0 "[stepstones_sellsail_captain_bla.GetFirstName] does not bow as deeply as the newly made lords of the Stepstones have learned to do.\n\n'I gave you my ships,' [stepstones_sellsail_captain_bla.GetSheHe] says. 'I gave you the channels between these rocks, the coves pirates thought hidden, and men willing to bleed beneath your banner.'\n\nThere is no accusation in the words. Not yet.\n\n'And you gave me your word.'\n\nI remember it well enough. Before Bloodstone fell, before the seahorse flew above these islands, I promised [stepstones_sellsail_captain_bla.GetHerHim] land if [stepstones_sellsail_captain_bla.GetSheHe] helped me conquer the Stepstones.\n\nNow there are islands enough to grant — and a kingdom watching to see whether its new ruler keeps promises made before wearing a crown."

agot_crownlands_bla.0157.a:0 "You earned your island."
agot_crownlands_bla.0157.b:0 "Take gold instead, and call the debt settled."
agot_crownlands_bla.0157.c:0 "A promise made before victory binds a king no longer."
agot_crownlands_bla.0157.d:0 "Your reward will be influence at my side."

agot_crownlands_bla.0159.t:0 "A Corsair's Reward"

agot_crownlands_bla.0159.desc_recruited:0 "[stepstones_pirate_bla.GetFirstName] has remained close since the fall of Bloodstone, though the change in banners seems to have done little to make [stepstones_pirate_bla.GetHerHim] respectable.\n\nPirates who once cursed [stepstones_pirate_bla.GetHerHis] name now approach quietly seeking pardons, while merchants who once paid protection money suddenly insist they always considered [stepstones_pirate_bla.GetHerHim] an honest captain.\n\n'I served you before there was a crown,' [stepstones_pirate_bla.GetSheHe] reminds me. 'Now there is one. I assume that means something.'"

agot_crownlands_bla.0159.desc_bound:0 "[stepstones_pirate_bla.GetFirstName] enters my hall with the careful expression of someone who knows precisely how much freedom [stepstones_pirate_bla.GetSheHe] truly possesses.\n\nOur arrangement helped break the old pirate networks of the Stepstones, but neither of us has forgotten the leverage that first brought [stepstones_pirate_bla.GetHerHim] beneath my banner.\n\n'You have your kingdom,' [stepstones_pirate_bla.GetSheHe] says. 'I have kept my part of our bargain. What place does that leave for me?'"

agot_crownlands_bla.0159.desc_information:0 "I had once paid [stepstones_pirate_bla.GetFirstName] for knowledge rather than loyalty. Yet now that the Stepstones have fallen beneath the seahorse, [stepstones_pirate_bla.GetSheHe] has returned.\n\nThe old pirate claims to know which captains still refuse my authority, which smugglers continue using hidden anchorages, and which supposedly loyal men have already begun speaking of rebellion.\n\nInformation bought once may apparently be purchased again."

agot_crownlands_bla.0159.desc_rejected:0 "I recognize [stepstones_pirate_bla.GetFirstName] before [stepstones_pirate_bla.GetSheHe] is halfway across the hall.\n\nOnce, before Bloodstone fell, I rejected [stepstones_pirate_bla.GetHerHis] offer of service. Yet the pirate survived my campaign and now stands before the ruler of the Stepstones with an expression far too amused for my liking.\n\n'You said you would not build your rule upon pirates,' [stepstones_pirate_bla.GetSheHe] says. 'Seems you built it upon our islands instead.'"

agot_crownlands_bla.0159.a:0 "Then find your place beneath the seahorse."
agot_crownlands_bla.0159.b:0 "You know these islands. Tell me who still conspires against me."
agot_crownlands_bla.0159.c:0 "Take your coin and leave my kingdom."
agot_crownlands_bla.0159.d:0 "The conquest is over. So is my need for pirates."

agot_stepstones_corsair_informant_bla:0 "Corsair Informant"
agot_stepstones_corsair_informant_bla_desc:0 "This former corsair still understands the hidden networks of the Stepstones: smugglers, pirate captains, secret anchorages, and men whose loyalty changes with the tide."

agot_crownlands_bla.0160.t:0 "No King Rules the Stepstones for Long"

agot_crownlands_bla.0160.desc_stable:0 "A year has passed since the crown of the Stepstones became mine, and something unexpected has begun to settle over the islands: routine.\n\nMerchant ships enter Bloodstone without first asking which pirate controls the harbor this moon. Captains who once answered only to themselves now bring disputes before my officers. Taxes arrive — irregularly, admittedly, but without requiring a sword at every door.\n\nThere are still pirates beyond my reach and men who mutter that no king rules these rocks for long. Yet increasingly they mutter quietly.\n\nPerhaps the Stepstones are beginning to believe that the seahorse intends to remain."

agot_crownlands_bla.0160.desc_strained:0 "The crown sits more easily upon my head than the Stepstones sit beneath it.\n\nBloodstone obeys. Most captains acknowledge my banners. Yet authority weakens with every mile of open water between one island and the next. Taxes vanish before reaching my collectors. Petty captains quarrel over anchorages. Men who bowed after the conquest have begun testing how much disobedience the new order will tolerate.\n\nThe realm is not in rebellion.\n\nNot yet.\n\nBut every sailor knows that a rope under constant strain eventually parts."

agot_crownlands_bla.0160.desc_restless:0 "The conquest ended. The resistance did not.\n\nVelaryon banners have been torn down in isolated coves. Tax collectors return with excuses instead of coin. Merchant captains speak of armed men gathering on islands supposedly pacified months ago, while whispers move between old corsairs faster than my ravens can follow.\n\nSome openly repeat an old truth of these waters: no king rules the Stepstones for long.\n\nPerhaps they believe I will be merely the latest name added to that history."

agot_crownlands_bla.0160.a:0 "Then let permanence become our answer."

agot_crownlands_bla.0160.b:0 "Coin built this realm. Coin will help bind it together."
agot_crownlands_bla.0160.c:0 "Summon the captains. Let them speak before they sharpen swords."

agot_crownlands_bla.0160.d:0 "Fill the horizon with Velaryon sails."
agot_crownlands_bla.0160.e:0 "Every rebellious captain has a price."
agot_crownlands_bla.0160.f:0 "Then teach them what this king does to rebels."

agot_velaryon_stepstones_new_order_bla:0 "A New Order in the Stepstones"
agot_velaryon_stepstones_new_order_bla_desc:0 "After generations of piracy, petty kings, and changing banners, the inhabitants of the Stepstones are slowly becoming accustomed to lasting Velaryon rule."

agot_crownlands_bla.0161.t:0 "The Stepstones Bend"

agot_crownlands_bla.0161.desc_success:0 "For the first time since my conquest began, reports from the Stepstones arrive without demands for immediate action.\n\nThe captains have quieted. Merchants once again enter the harbors without hiring twice their usual guards. Men who once tested every command now carry them out with only the customary amount of grumbling.\n\nNo one has forgotten what these islands were. Nor, I suspect, have the old pirate captains abandoned every ambition of their own.\n\nBut something has changed.\n\nThey no longer speak of Velaryon rule as though it were certain to vanish with the next tide."

agot_crownlands_bla.0161.desc_partial:0 "The worst of the unrest has subsided, though peace in the Stepstones remains a brittle thing.\n\nSome captains have returned to obedience. Others merely stopped making their defiance obvious. Taxes reach Bloodstone again, though never in the amounts my stewards insist are owed. Merchant ships have returned to several harbors, while more distant islands remain suspicious of every Velaryon sail.\n\nThe realm holds.\n\nFor now, that may have to be enough."

agot_crownlands_bla.0161.desc_failure:0 "Whatever peace I hoped to impose upon the Stepstones has begun to unravel.\n\nVelaryon men have been found dead upon lonely beaches. Supply boats vanish between islands. Banners raised in my name are cut down after nightfall, while old captains gather followers behind walls they once swore to surrender.\n\nThis is no longer disobedience disguised as misunderstanding.\n\nThe Stepstones have decided to test whether their new ruler possesses the strength to remain."

agot_crownlands_bla.0161.a:0 "Then let them grow accustomed to the seahorse."
agot_crownlands_bla.0161.b:0 "Peace need not be perfect to endure."
agot_crownlands_bla.0161.c:0 "So be it. We will settle this again."

agot_velaryon_fragile_stepstones_peace_bla:0 "A Fragile Peace"
agot_velaryon_fragile_stepstones_peace_bla_desc:0 "The Stepstones have quieted, but peace among these islands remains a precarious thing. Old grudges endure, captains test the limits of Velaryon authority, and beneath the outward calm linger men who have not forgotten the freedom they once claimed."

agot_crownlands_bla.0162.t:0 "The Rocks Rise"

agot_crownlands_bla.0162.desc:0 "The first blood was spilled before dawn.\n\nA Velaryon patrol disappeared between two islands, its boat later found drifting with no living men aboard. By midday another raven arrived: armed captains have seized a harbor and torn down the seahorse. Before sunset came word of fires burning above coves supposedly pacified months ago.\n\nThis is no collection of isolated grievances now. Someone is carrying messages between the islands. Someone is promising the old captains that if they rise together, the kingdom I built will break apart as every kingdom of the Stepstones has before it.\n\nThey have chosen their moment carefully.\n\nSo must I."

agot_crownlands_bla.0162.a:0 "Our corsair knows these networks. Find the men behind this."
agot_crownlands_bla.0162.b:0 "Summon every captain still willing to hear me."
agot_crownlands_bla.0162.c:0 "Seal the channels. No rebel ship leaves these islands."
agot_crownlands_bla.0162.d:0 "Find their leaders. Every man has a price."
agot_crownlands_bla.0162.e:0 "Enough. Break them."

agot_crownlands_bla.0164.t:0 "The Tide Turns"

agot_crownlands_bla.0164.desc_success:0 "The rebellion that threatened to spread across the Stepstones has begun to collapse.\n\nIts leaders find themselves isolated. Ships once promised to their cause remain safely at anchor, while captains who spoke boldly of independence now insist their words were misunderstood. Some rebels have fled. Others have bent the knee again.\n\nThe islands are not peaceful because they love me.\n\nThey are peaceful because, for now, enough of them believe resistance will fail."

agot_crownlands_bla.0164.desc_crushed:0 "The resistance has ended in blood.\n\nStrongholds were taken. Ships burned at anchor. Men who raised banners against me learned that the sea offers fewer places to hide when every channel is watched and every harbor may become a battlefield.\n\nThe surviving captains bend the knee once more.\n\nWhether they do so from loyalty or terror matters less today than the simple fact that they kneel."

agot_crownlands_bla.0164.desc_failure:0 "The rebellion has not become the great rising its leaders promised, but neither have I destroyed it.\n\nSome captains have submitted. Others simply vanished into hidden coves and distant islands. Velaryon banners fly above the major harbors, while whispers of resistance continue wherever my men are not present to hear them.\n\nThe Stepstones remain mine.\n\nBut possession and peace are not the same thing."

agot_crownlands_bla.0164.a:0 "Let them remember who rules these waters."
agot_crownlands_bla.0164.b:0 "Then we endure longer than they do."

agot_velaryon_stepstones_smoldering_resistance_bla:0 "Smoldering Resistance"
agot_velaryon_stepstones_smoldering_resistance_bla_desc:0 "Open rebellion has faded, but resistance to Velaryon rule survives among hidden coves, disgruntled captains, and communities that still remember the independence of the old Stepstones."

agot_crownlands_bla.0163.t:0 "The Seahorse Above the Stepstones"

agot_crownlands_bla.0163.desc:0 "Ten years.\n\nFor a decade the seahorse has flown above Bloodstone. Ten years of storms and rebellions, merchants and pirates, captains bending the knee and others learning the price of refusing it.\n\nMen once told me that no king rules the Stepstones for long. They had history enough to support the claim. These islands have swallowed conquerors, broken fleets, and watched crowns rise and vanish with the tide.\n\nYet the tide has risen and fallen ten years beneath my rule.\n\nChildren now run through the harbors who cannot remember Bloodstone without my banner above it. Sailors plot their voyages expecting Velaryon patrols in these waters. Captains who once called my kingdom an occupation now argue over their rights beneath its laws.\n\nThe Stepstones remain difficult, quarrelsome, and dangerous.\n\nBut they remain mine."

agot_crownlands_bla.0163.desc_trade:0 "\n\nWhere pirate sails once hunted merchantmen, traders now calculate their profits beneath Velaryon protection. Bloodstone has become more than a fortress of conquest; ships from Westeros and Essos increasingly treat its harbor as a place of commerce rather than danger."

agot_crownlands_bla.0163.desc_order:0 "\n\nThe greatest change cannot be seen from the deck of a ship. It lies in taxes collected without raiding parties, disputes settled without bloodshed, and captains who increasingly seek judgment rather than vengeance. The Stepstones have not merely been conquered. They have begun to be governed."

agot_crownlands_bla.0163.desc_security:0 "\n\nEvery captain sailing these waters knows the sight of Velaryon sails. Pirates who once treated the channels between the islands as their private hunting grounds now look twice toward the horizon before raising black banners. The Narrow Sea has learned to fear the seahorse."

agot_crownlands_bla.0163.desc_crown:0 "\n\nThe crown once fashioned upon Bloodstone no longer represents merely a conqueror's ambition. Ten years of rule have given weight to what iron and silver alone could never provide. It has become the crown of a realm that endured."

agot_crownlands_bla.0163.desc_blood:0 "\n\nNot all of those ten years were peaceful. There are coves where men still speak quietly of fathers and brothers who died resisting my rule. The peace I leave behind was purchased partly in blood, and the islands have long memories."

agot_crownlands_bla.0163.a:0 "The seahorse is here to stay."

agot_velaryon_stepstones_legacy_bla:0 "The Seahorse Above the Stepstones"
agot_velaryon_stepstones_legacy_bla_desc:0 "House Velaryon did what generations of pirates, sellswords, and would-be kings could not: conquer the Stepstones and make its rule endure. Across the Narrow Sea, the silver seahorse is now known not merely as the sigil of Driftmark, but as the banner of a dynasty whose power reaches far beyond its ancestral shores."

agot_velaryon_stepstones_enduring_trade_bla:0 "Crossroads of the Narrow Sea"
agot_velaryon_stepstones_enduring_trade_bla_desc:0 "Years of protected commerce have transformed Bloodstone into a dependable stopping point along the dangerous sea routes between Westeros and Essos."

agot_velaryon_stepstones_lawgiver_bla:0 "Lawgiver of the Stepstones"
agot_velaryon_stepstones_lawgiver_bla_desc:0 "This ruler accomplished something rarer in the Stepstones than conquest: imposing an order that survived beyond the first victories."

agot_velaryon_stepstones_master_of_the_narrow_sea_bla:0 "Master of the Narrow Sea"
agot_velaryon_stepstones_master_of_the_narrow_sea_bla_desc:0 "A decade of Velaryon naval supremacy has made this ruler's sails a familiar and feared sight throughout the waters surrounding the Stepstones."