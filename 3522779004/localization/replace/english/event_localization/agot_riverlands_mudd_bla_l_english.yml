l_english:

 # =========================================================
 # 1200 - The Whispering Foundations
 # =========================================================

 agot_riverlands_bla.1200.t:0 "The Whispering Foundations"
 agot_riverlands_bla.1200.desc:0 "Beneath shifting river silt and water-logged clay, your trenchers have breached the colossal stone foundations of an imposing, block-built structure far too ancient for any living memory.\n\nThe smallfolk drop their tools and cross themselves in superstitious dread, whispering that this grim, half-buried monument was raised by the old kings of House Mudd to guard their ancient boundaries, long centuries before the ironborn or Andals ever brought ruin to the Trident."
 agot_riverlands_bla.1200.a:0 "Proceed with absolute caution; the sacred past slumbers below."
 agot_riverlands_bla.1200.b:0 "Halt the digging. Preserve these ancient stones exactly as they stand."
 agot_riverlands_bla.1200.c:0 "Conscript experienced stonemasons to systematically exhume the entire site."


 # =========================================================
 # 1201 - The Tooth of the River
 # =========================================================
 agot_riverlands_bla.1201.t:0 "The Tooth of the River"
 agot_riverlands_bla.1201.desc:0 "An old fisherman brings you a heavily corroded bronze spearhead, dragged out of a muddy bank after the spring floodwaters fell.\n\nIts ancient ash haft has long since rotted to nothingness and its broad edge is worn dull by centuries of river-grit, yet the primitive runic engraving along the socket is ancient beyond shadow of a doubt. Your maester grows pale, muttering that this may well be the heart of 'Rushbreaker', a legendary lost weapon of the ancient Mudd kings."
 agot_riverlands_bla.1201.a:0 "Cleanse the bronze. This ancient steel belongs to our bloodline alone."
 agot_riverlands_bla.1201.b:0 "Deliver the weapon to the maester's tower for meticulous historical study."
 agot_riverlands_bla.1201.c:0 "Melt it down or sell it to a passing blacksmith; it is not a relic."

 # =========================================================
 # 1202 - The Fractured Thunder
 # =========================================================

 agot_riverlands_bla.1202.t:0 "The Fractured Thunder"
 agot_riverlands_bla.1202.desc:0 "Inside a collapsing barrow-mound near the banks of the Blue Fork, your diggers unearth a monumental warhorn wrapped in the blackened remnants of rotted leather.\n\nIts voice is long gone. The ancient horn is heavily fractured, and it would split into splintered bone before it could ever make a sound again. Yet faded, primitive carvings still wind around its curve, depicting river reeds, weeping faces, and bronze-clad warriors beneath the marks of ancient hands. The oldest graybeards in the village swear that such mighty instruments once called the scattered banners of House Mudd to war."
 agot_riverlands_bla.1202.a:0 "Though silent, its presence speaks loud enough for our bloodline."
 agot_riverlands_bla.1202.b:0 "Place it above the hearth to be displayed as a sacred relic of our forefathers."
 agot_riverlands_bla.1202.c:0 "Command the maester to trace every single carving for lost runic secrets."

 # =========================================================
 # 1203 - The Sovereign's Cairn
 # =========================================================
 agot_riverlands_bla.1203.t:0 "The Sovereign's Cairn"
 agot_riverlands_bla.1203.desc:0 "Laborers clearing a wooded rise near the marshes uncover a massive ring of lichen-covered stone blocks surrounding a primitive barrow-mound. Beneath layers of packed clay lie ancient fragments of oxidized bronze, weathered bones, and runic carvings worn nearly smooth by centuries of rain.\n\nNo legible name remains to identify the occupant, yet the local smallfolk insist this is the sacred resting place of one of the old Mudd kings who ruled before the Andals came. Whether the tale is true or merely a peasant's ghost story, the cairn is clearly older than any castle standing in the Trident today—raised when the rivers still answered to kings of their own."
 agot_riverlands_bla.1203.a:0 "Carefully open the barrow. The secrets of our ancestors lie within."
 agot_riverlands_bla.1203.b:0 "Seal the rise. The ancient dead demand their peace."
 agot_riverlands_bla.1203.c:0 "Leave the stones untouched, but raise a monument to honor their memory."


 # =========================================================
 # 1204 - Blood of the First Men
 # =========================================================
 agot_riverlands_bla.1204.t:0 "Blood of the First Men"
 agot_riverlands_bla.1204.desc:0 "The name of Mudd is no longer confined to the melancholy love songs of wandering bards or the overgrown ruins of Oldstones.\n\nAncient stones have been pulled from the earth. Sacred relics have returned to the light of day. Your vassals and smallfolk alike now look upon your high seat and remember that long before trout, dragon, lion, or kraken ever claimed the Trident, the rivers had a king of their own."
 agot_riverlands_bla.1204.a:0 "The Trident remembers its true sovereigns. Let the realm take notice."
 agot_riverlands_bla.1204.b:0 "We shall honor our ancestors with quiet humility, not dangerous pride."
 agot_riverlands_bla.1204.c:0 "The ancient kingdom has slept long enough. It is time to rebuild."

 # =========================================================
 # 1205 - The Reforging of Justice
 # =========================================================
 agot_riverlands_bla.1205.t:0 "The Reforging of Justice"
 agot_riverlands_bla.1205.desc:0 "Your master armorer turns the heavy bronze spearhead over in his scarred hands, studying the age-darkened metal with deep reverence.\n\n'The primitive bronze cannot be melted down and re-cast without destroying the old runes, my Lord,' he admits softly. 'But it can be cleaned of its rust. I can fit it with a sturdy new shaft of weirwood and bind it in silver wire. It can be made worthy of a sovereign's grip once more.'\n\nIf this is truly the weapon that once guarded the Whispering Halls, then it should not spend another century gathering dust in a locked chest."
 agot_riverlands_bla.1205.a:0 "Strap it to a weirwood shaft. Rushbreaker shall taste blood once more."
 agot_riverlands_bla.1205.b:0 "Mount the artifact securely upon the high walls of our hall."
 agot_riverlands_bla.1205.c:0 "Send the bronze artifact to the Citadel; let the scholars preserve it."


 mudd_kings_hall_excavation_bla:0 "The Mud-Bound Redoubt"
 mudd_kings_hall_excavation_bla_desc:0 "The cyclopean foundations of a long-buried First Men monument are being systematically exhumed, stirring deep, dangerous murmurs regarding the ancient sovereignty of the Trident."


 mudd_preserved_old_stones_bla:0 "Sanctuary of the Whispering Halls"
 mudd_preserved_old_stones_bla_desc:0 "Rather than letting masonry be looted for common keeps, these ancient blocks are protected, standing as a silent monument to the rulers who preceded the Andals."

 mudd_bronze_spearhead_bla:0 "The Tooth of the River"
 mudd_bronze_spearhead_bla_desc:0 "A weathered bronze spearhead pulled from the river-silt. Though scarred by green rust and centuries of erosion, it bears the unmistakable markings of a royal guard."

 mudd_river_kings_horn_bla:0 "The Fractured Thunder"
 mudd_river_kings_horn_bla_desc:0 "Though cracked and entirely voiceless, the sheer weight of this ancient warhorn stands as a powerful, haunting symbol of House Mudd's vanished authority over the valleys."

 mudd_horn_of_banners_bla:0 "The Relic of Oldstones"
 mudd_horn_of_banners_bla_desc:0 "This broken horn is displayed prominently as a sacred relic, silently reminding all who enter your hall that the banners of the Trident once answered a single master."


 mudd_old_kings_remembered_bla:0 "Blood of the Bronze Age"
 mudd_old_kings_remembered_bla_desc:0 "The absolute authority of the pre-Andal dynasts has been brought once more into the light, drastically elevating the legitimacy of their living descendants."

 mudd_reverent_heir_bla:0 "The Patient Hearth"
 mudd_reverent_heir_bla_desc:0 "This ruler honors the fallen sovereigns with deep, quiet humility, seeking structural wisdom from their laws rather than a dangerous, premature grasp for their crown."

 mudd_trident_restorationist_bla:0 "The Mud-Crown Claimant"
 mudd_trident_restorationist_bla_desc:0 "The ambition of a restored First Men kingdom burns brightly in this ruler, who openly invokes the sacred legacy of the Hammer of Justice to challenge upstart lords."

 mudd_rushbreaker_bla:0 "Rushbreaker Renewed"
 mudd_rushbreaker_bla_desc:0 "The legendary spear of the old kings has been fitted with a sturdy new shaft of weirwood and bound in silver wire, returning a piece of sovereign justice to the living world."

 mudd_spearhead_display_bla:0 "The Trophy of Oldstones"
 mudd_spearhead_display_bla_desc:0 "The ancient bronze remnant believed to be the heart of Rushbreaker is mounted prominently above the high seat, serving as a visceral reminder of the Trident's true masters."

 mudd_bronze_spear_name:0 "Rushbreaker"
 mudd_bronze_spear_desc:0 "This massive First Men spearhead was pulled from the silt of the Blue Fork, its broad bronze edge pitted by centuries of river-grit and green rust. Though its original ash haft was long ago lost to rot, it has been bound with silver wire to a sturdy new shaft of bone-white weirwood. The primitive runes engraved along its socket still hum with the unavenged memory of the Mudd Kings who once wielded it to shatter the shield walls of the Andal invaders."

 mudd_bronze_spearhead_name:0 "The Heart of Rushbreaker"
 mudd_bronze_spearhead_desc:0 "Mounted securely upon a stand of dark oak, this colossal First Men spear stands as a silent testament to the ancient authority of House Mudd. Pulled from the river-silt of the Blue Fork, its broad bronze head is pitted by centuries of green rust and erosion. Though fitted with a fragile, unweighted wood shaft strictly for courtly display, it has not been truly reforged for modern warfare; instead, the relic hangs as a visceral reminder of the days when the entire Trident bowed to a single master."

 mudd_river_horn_name:0 "The Fractured Thunder"
 mudd_river_horn_desc:0 "A monumental warhorn unearthed from a collapsing barrow-mound, wrapped in the blackened, fragile remnants of rotted leather. Heavy fractures snake across the ancient bone, ensuring it would split to splinters before it could ever make a sound again. Yet the primitive, hand-carved depictions of river reeds, weeping faces, and bronze-clad warriors remain flawlessly visible, silently reminding all who enter your hall that the banners of the Trident once answered a single sovereign's call."

 mudd_excavated_cairn_bla:0 "Exhumer of the First Men"
 mudd_excavated_cairn_bla_desc:0 "This character has meticulously cleared the packed clay of the ancient barrow-mound, drawing long-lost Bronze Age relics and the sacred history of House Mudd back into the light."

 mudd_guardian_of_the_cairn_bla:0 "Warden of the Dead"
 mudd_guardian_of_the_cairn_bla_desc:0 "By leaving the sovereign's resting place entirely undisturbed, this ruler has shown profound piety, earning deep reverence from traditionalists who honor the old ways and the blood of the First Men."

 mudd_royal_memorial_bla:0 "The Barrow Sentinel"
 mudd_royal_memorial_bla_desc:0 "A grand stone monument now watches over the ancient mound, ensuring that the legacy of the fallen kings of House Mudd continues to look out across the shifting valleys of the Trident."



