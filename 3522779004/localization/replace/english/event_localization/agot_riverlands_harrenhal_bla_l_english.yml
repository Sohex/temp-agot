l_english:

 agot_riverlands_bla.0900.t:0 "The Hall of a Hundred Hearths"
 agot_riverlands_bla.0900.desc:0 "The legendary great hall of Harrenhal swallows your court like the belly of some stone leviathan. Voices instantly vanish up into massive rafters blackened by centuries of soot, and even a crowded, roaring feast seems thin and pathetic beneath such monstrous architecture."
 agot_riverlands_bla.0900.a:0 "Spend a fortune on massive tapestries and grand feasts to mask the emptiness."
 agot_riverlands_bla.0900.b:0 "Seal off the vacant wings entirely to save our coin."
 agot_riverlands_bla.0900.c:0 "Keep the hearths lit just enough to ensure the main chambers remain usable."
 agot_riverlands_bla.0900.d:0 "Let the dark rule; an unapproachable castle breeds respect."

 agot_riverlands_bla.0901.t:0 "The Dragon's Scar"
 agot_riverlands_bla.0901.desc:0 "While conducting inspections, your master of Works points out a massive stone support pillar that was fused completely black, smooth, and glassy. It is a terrifying testament to Balerion the Black Dread's fury, warped directly into the foundations. The masonry crews refuse to touch it, swearing it still feels hot."
 agot_riverlands_bla.0901.a:0 "Trace the melted patterns to study how dragonfire warps solid rock."
 agot_riverlands_bla.0901.b:0 "Leave it exposed so all remember what happens to kings who do not kneel."
 agot_riverlands_bla.0901.c:0 "Have a septon bless the foundation to purge the phantom heat."

 agot_riverlands_bla.0902.t:0 "Footsteps in the Wailing Tower"
 agot_riverlands_bla.0902.desc:0 "Your castle servants are in a state of near-mutiny, flatly refusing to enter one of the lesser towers after twilight. They whisper of heavy, dragging footsteps echoing behind walls that were bricked up during Harren Hoare's reign, accompanied by a biting draft that snuffs out torches."
 agot_riverlands_bla.0902.a:0 "Let them tremble; a terrified household is an obedient one."
 agot_riverlands_bla.0902.b:0 "Station a double guard detail inside the tower to catch any flesh-and-blood intruders."
 agot_riverlands_bla.0902.c:0 "Investigate the castle to see who might be faking these hauntings."
 agot_riverlands_bla.0902.d:0 "Spend a night in the tower yourself to hear what the walls are saying."

 agot_riverlands_bla.0903.t:0 "The Bottomless Pit"
 agot_riverlands_bla.0903.desc:0 "Harrenhal is a financial disaster. Your steward presents a depressing ledger showing that the castle's massive scale makes routine maintenance impossible. Roofs are sagging, ancient masonry is cracking, and every single repair project invariably uncovers three worse failures hidden beneath the stone."
 agot_riverlands_bla.0903.a:0 "Drain the treasury; whatever the cost, the seat of our house must stand."
 agot_riverlands_bla.0903.b:0 "Halt the masons and let the non-essential towers crumble as they may."
 agot_riverlands_bla.0903.c:0 "Carefully manage a strict maintenance budget with no room for vanity."
 agot_riverlands_bla.0903.d:0 "Conscript the local river peasants to cut and haul stone without pay."

 agot_riverlands_bla.0904.t:0 "The Ghost of Harren Hoare"
 agot_riverlands_bla.0904.desc:0 "A traveling hedge knight gets drunk in your courtyard and loudly repeats a common riverland superstition: that no family can hold Harrenhal for more than a few generations before the curse destroys them line and root. The grim warning has cast a heavy shroud of anxiety over your court."
 agot_riverlands_bla.0904.a:0 "Have the knight quietly dragged to the dungeons; I will outlast every ghost here."
 agot_riverlands_bla.0904.b:0 "Ignore the drunkard; time and prosperity will prove our claim absolute."
 agot_riverlands_bla.0904.c:0 "Review the tragic downfalls of the houses to avoid their mistakes."
 agot_riverlands_bla.0904.d:0 "Publicly execute him in the yard so our garrison remembers who to truly fear."

 agot_riverlands_bla.0905.t:0 "Phantom Smoke"
 agot_riverlands_bla.0905.desc:0 "As twilight settles over the lake, the colossal black stone walls seem to radiate a strange, trapped warmth. Courtiers shift uncomfortably, whispering that the very bones of Harrenhal remember the horrific night the sky turned to fire and an entire kingdom was incinerated."
 agot_riverlands_bla.0905.a:0 "Lead the court in a solemn prayer for the thousands who burned alive here."
 agot_riverlands_bla.0905.b:0 "Marvel at the sheer, terrifying power required to warp this much stone."
 agot_riverlands_bla.0905.c:0 "Consult the maester on anti-siege tactics used against dragons."
 agot_riverlands_bla.0905.d:0 "Lean into the castle's dark aura to intimidate our visiting rivals."

 agot_riverlands_bla.0906.t:0 "The Ashen Grove"
 agot_riverlands_bla.0906.desc:0 "Surrounded by towering walls of melted granite, twenty acres of dense godswood wait in a heavy, suffocating silence. Even here, choked by the soot of the Kingspyre Tower, the ancient heart tree survives—its weeping red eyes staring out from a trunk that has outlasted every conqueror who tried to burn it."
 agot_riverlands_bla.0906.a:0 "Kneel quietly in the red leaves to find refuge from the court's politics."
 agot_riverlands_bla.0906.b:0 "Invite our traditionalist vassals to a grand, solemn prayer circle."
 agot_riverlands_bla.0906.c:0 "Search the thick bark for any carvings left by the First Men."
 agot_riverlands_bla.0906.d:0 "Forbid the servants from idling; the grove is a private sanctuary."

 agot_riverlands_bla.0910.t:0 "The Shreaking Vaults"
 agot_riverlands_bla.0910.desc:0 "While digging out a blocked privy drain, your stonemasons breach a false floor, revealing an unmapped subterranean labyrinth. The air rushing out is thick with decades of dust, rotting ironwork, and the choking stench of guano. Thousands of bats screech overhead, disturbed by the light of your torches."
 agot_riverlands_bla.0910.a:0 "Send scouts with parchment to fully map every tunnel and hidden exit."
 agot_riverlands_bla.0910.b:0 "Seal the passages... but discover what lies beneath them first."
 agot_riverlands_bla.0910.c:0 "Have the guards search the dark for any forgotten hoards or relics."
 agot_riverlands_bla.0910.d:0 "Clear out the filth and convert the vaults into a highly secure dungeon complex."

 agot_riverlands_bla.0911.t:0 "The Ghost of the Mad Lady"
 agot_riverlands_bla.0911.desc:0 "The terrifying legends of Danelle Lothston have resurfaced among your smallfolk. Every harsh tax, strict curfew, or strange command from your council is met with fearful whispers in the local taverns, with the commoners muttering that the 'Mad Lady's' blood-soaked madness is returning to the castle."
 agot_riverlands_bla.0911.a:0 "Let them gossip—if a reputation for monstrous cruelty keeps them obedient, so be it."
 agot_riverlands_bla.0911.b:0 "Issue a decree dismissing the rumors and order a festival to ease their panic."
 agot_riverlands_bla.0911.c:0 "Use the sudden paranoia to feed false rumors about our local rivals."
 agot_riverlands_bla.0911.d:0 "Have the maester compile a history of House Lothston to dispel the myths."

 agot_riverlands_bla.0920.t:0 "Echoes of the Great Lists"
 agot_riverlands_bla.0920.desc:0 "While inspecting the overgrown tournament grounds outside the walls, your knights fondly reminisce about the legendary Tourney of Harrenhal hosted by your house. They point out that hosting a massive, lavish spectacle in those same yards could draw the finest lances in Westeros and restore our house's prestige."
 agot_riverlands_bla.0920.a:0 "Send out the ravens—we will host a magnificent jousting tilt to rival the last!"
 agot_riverlands_bla.0920.b:0 "We cannot afford such reckless, expensive vanity. Keep the treasury closed."
 agot_riverlands_bla.0920.c:0 "Send invitations strictly to the wealthiest lords to secure trade alliances."
 agot_riverlands_bla.0920.d:0 "Host a modest tourney, but tax the visiting merchants heavily to turn a profit."

 agot_riverlands_bla.0921.t:0 "The Cold Chambers"
 agot_riverlands_bla.0921.desc:0 "Your master of keys reveals that hundreds of guest apartments in the upper tiers haven't been opened in generations. Their heavy oak doors are swollen shut from the damp lake air, the hearths are choked with soot, and a deep, biting chill hangs in the empty corridors, making the entire wing feel completely dead."
 agot_riverlands_bla.0921.a:0 "Leave the doors barred; there is no sense in fighting the castle's decay."
 agot_riverlands_bla.0921.b:0 "Order a massive crew of servants to scrub the soot and refurnish the rooms for guests."
 agot_riverlands_bla.0921.c:0 "Strip them of their fine ironwork and timber to use elsewhere."
 agot_riverlands_bla.0921.d:0 "Reopen only a handful of central rooms for our household guards."

 agot_riverlands_bla.0930.t:0 "Bones Beneath the Ash"
 agot_riverlands_bla.0930.desc:0 "Excavation work beneath the charred floorboards of the Kingspyre Tower uncovers a mass grave filled with brittle, blackened bones and melted silver jewelry. Your maester believes they are the remains of your ancestor's household, cornered and incinerated during the Dance of the Dragons. The discovery has reignited talk of old regional vendettas."
 agot_riverlands_bla.0930.a:0 "Display the melted weapons in our armory to show our resilience."
 agot_riverlands_bla.0930.b:0 "Gather the remains and give them a dignified burial in the local sept."
 agot_riverlands_bla.0930.c:0 "Have the maester examine the signet rings to verify who perished."
 agot_riverlands_bla.0930.d:0 "Toss the bones into the lake; we have no time to mourn dead ancestors."

 agot_riverlands_bla.0931.t:0 "The Legacy of Lucamore"
 agot_riverlands_bla.0931.desc:0 "An unseemly romantic scandal among your household guards has prompted your courtiers in to gossiping about Lucamore 'the Lusty' Strong—the legendary Lord Commander who broke his Kingsguard vows to father sixteen bastards. The comparison is severely damaging the reputation of your knights."
 agot_riverlands_bla.0931.a:0 "Impose an uncompromising code of moral conduct upon our entire garrison."
 agot_riverlands_bla.0931.b:0 "Publicly strip the offending guards of their rank to set an example."
 agot_riverlands_bla.0931.c:0 "Confront all slander through trials by combat."
agot_riverlands_bla.0931.c.success_tt:0 "Our champion emerges victorious, washing away the scandal in blood to the cheers of the garrison."
 agot_riverlands_bla.0931.c.failure_tt:0 "Our champion falls on the bloody sands, leaving your house thoroughly humiliated."
 agot_riverlands_bla.0931.d:0 "Ignore piety; use the guards' secret trysts as blackmail leverage."
agot_riverlands_bla.0931.d.success_tt:0 "By completely ignoring the pious outrage, you keep your guards focused on active duty."
 agot_riverlands_bla.0931.d.failure_tt:0 "Your flagrant disregard for decency outrages the pious, turning the scandal into an open political wound."

 agot_riverlands_bla.0940.t:0 "The Tower Collapse"
 agot_riverlands_bla.0940.desc:0 "A massive autumn gale batters the castle, and shortly before dawn, a heavily warped section of the Dread Tower gives out entirely. Thousands of tons of melted granite crash down into the outer courtyard, crushing several stablehands and burying a vital granary under a mountain of smoking rubble."
 agot_riverlands_bla.0940.a:0 "Divert all seasonal funds to clear the yard and rebuild the wall immediately."
 agot_riverlands_bla.0940.b:0 "Leave the debris where it fell; the ruined heap is still a viable barrier."
 agot_riverlands_bla.0940.c:0 "Have the engineers brace the remaining towers."
 agot_riverlands_bla.0940.d:0 "Force laborers to dig out the granary under threat of the whip."

 agot_riverlands_bla.0941.t:0 "The Vanished Scullions"
 agot_riverlands_bla.0941.desc:0 "Three castle servants have completely vanished while retrieving winter bedding from the abandoned upper stories. No signs of a struggle or blood were found—only three dropped tallow candles on the cold floor and a biting, unnatural draft that refuses to leave the corridor. The staff is paralyzed with fear."
 agot_riverlands_bla.0941.a:0 "Arm the castle guards and lead a thorough personal sweep of the dark zones."
 agot_riverlands_bla.0941.b:0 "Barricade the doors to the upper levels and forbid anyone from entering them."
 agot_riverlands_bla.0941.c:0 "Consult a local witch to see what spirits are nesting in the stone."
 agot_riverlands_bla.0941.d:0 "Hang a servant to prove they cannot simply run away from duty."

 agot_riverlands_bla.0942.t:0 "Dragon Dreams"
 agot_riverlands_bla.0942.desc:0 "You wake up drenched in cold sweat after a terrifying nightmare. In the vision, Harrenhal's colossal towers were melting like warm tallow around you while a massive shadow with burning eyes circled the sky. The phantom smell of sulfur and charred flesh clings to your bedchambers long after dawn."
 agot_riverlands_bla.0942.a:0 "Write down the fiery details; this dream carries a profound prophecy."
 agot_riverlands_bla.0942.b:0 "Shake off the vision as a simple trick played by the castle's damp air."
 agot_riverlands_bla.0942.c:0 "Summon a holy man to purge these dark thoughts from my mind."
 agot_riverlands_bla.0942.d:0 "The dream is an omen of blood—we must immediately prepare for war."

 agot_riverlands_bla.0943.t:0 "The Harrenhal Devourer"
 agot_riverlands_bla.0943.desc:0 "A wandering holy man has gathered a massive crowd in your lower courtyard, loudly proclaiming that Harrenhal is an unholy abomination that systematically devours every family line that claims it. Your courtiers try to laugh it off, but their nervous glances reveal they believe every word."
 agot_riverlands_bla.0943.a:0 "Affirm our righteousness by hosting a lavish day of prayer and charity."
 agot_riverlands_bla.0943.b:0 "Mock the priest openly from the balcony and have him kicked out of our gates."
 agot_riverlands_bla.0943.c:0 "Have the guards arrest the man to interrogate who is paying him."
 agot_riverlands_bla.0943.d:0 "Force the court to watch him be flogged; let them see who rules here."

 agot_riverlands_bla.0944.t:0 "Beneath Black Stone"
 agot_riverlands_bla.0944.desc:0 "A structural shift behind a massive slab of fused black granite reveals a completely sealed, airtight hollow chamber. The air that rushes out is stale, suffocatingly hot, and smells faintly of ancient ash. Trapped beneath a fallen, warped rafter of melted iron and stone lies a mangled, soot-caked object, partially welded to the floor by Balerion's long-ago fire."
 agot_riverlands_bla.0944.a:0 "Pry the blackened artifact free from the stone to see what can be salvaged."
  agot_riverlands_bla.0944.a.artifact_tt:0 "A twisted, melted shape of Harren the Black's crown is uncovered beneath the fused stone."
 agot_riverlands_bla.0944.a.relic_tt:0 "Something deeply unsettling is found rotting below the black stone."
 agot_riverlands_bla.0944.a.discovery_tt:0 "The cryptic inscriptions deepen Harrenhal's terrible legend."
 agot_riverlands_bla.0944.a.gold_tt:0 "Old wealth and ancient coins are recovered and melted down for gold."
agot_riverlands_bla.0944.b:0 "Seal the chamber back up; we will not disturb the ashes of the doomed."
 agot_riverlands_bla.0944.c:0 "Have the maester examine the chamber walls for hidden inscriptions first."
 agot_riverlands_bla.0944.c.success_tt:0 "Your maester successfully translates the hidden inscriptions, giving your house a unique and valuable insight into the castle's history."
 agot_riverlands_bla.0944.c.whispers_tt:0 "The terrifying nature of the inscriptions leaves your scholars profoundly shaken, haunted by the secrets still buried beneath the black stone."
 agot_riverlands_bla.0944.d:0 "Chisel out the scrap and melt it down at the forge."

 harrenhal_crown_fragment_name:0 "The Twisted Iron Crown"
 harrenhal_crown_fragment_desc:0 "Though heavily warped and melted down by Balerion's fury, this charred piece of slag-fused iron still retains the distinct shape of a crown. Its edges are jagged and lethal, partially welded to the rubble of Harrenhal before being pried loose from the soot. Strangely, the metal still feels faintly warm to the touch."


 harrenhal_grand_feasts_bla:0 "Feast of a Hundred Hearths"
 harrenhal_grand_feasts_bla_desc:0 "By packing the cavernous halls with traveling bards, roaring fires, and immense luxury, this ruler has briefly masked the castle's grim reputation with genuine lordly grandeur."

 harrenhal_shuttered_halls_bla:0 "Mothballed Wings"
 harrenhal_shuttered_halls_bla_desc:0 "Entire towers have been bricked up and left to the dark. While it drastically eases the castle's ruinous upkeep, it stands as a humiliating public admission that the fortress is too monstrous to govern."

 harrenhal_managed_decay_bla:0 "Structural Containment"
 harrenhal_managed_decay_bla_desc:0 "Abandoning any foolish dreams of total reconstruction, this ruler focuses strictly on bracing collapsing foundations to keep the primary keep safe and habitable."

 harrenhal_whispers_in_dark_bla:0 "Exploited Paranoia"
 harrenhal_whispers_in_dark_bla_desc:0 "This ruler has masterfully weaponized Harrenhal's haunted reputation, turning the court's natural fear of the shadows into a highly effective web of ears and informants."

 harrenhal_dragonfire_studies_bla:0 "Scars of Balerion"
 harrenhal_dragonfire_studies_bla_desc:0 "Hours spent mapping the warped, glassy granite of the lower vaults have left this character with a dangerous, academic desire to understand the supreme power of dragonfire."

 harrenhal_blackened_memory_bla:0 "The Sovereign's Reminder"
 harrenhal_blackened_memory_bla_desc:0 "Living amidst melted stone serves as a constant, sobering warning to this ruler regarding the terrifying price of defying the Iron Throne."

 harrenhal_obsessed_with_fire_bla:0 "Pyromaniac Tendencies"
 harrenhal_obsessed_with_fire_bla_desc:0 "The oppressive, cold air of Harren Hoare's tomb has warped this character's mind, instilling them with an unhealthy, restless fixation on open flames and burning torches."

 harrenhal_feared_presence_bla:0 "Kingspyre Tyrant"
 harrenhal_feared_presence_bla_desc:0 "By deliberately leaning into the castle's cursed legacy, this ruler has cowed the local garrison and courtiers into absolute, trembling submission."

 harrenhal_guarded_towers_bla:0 "The Ghost Watch"
 harrenhal_guarded_towers_bla_desc:0 "Double guard details have been stationed in the supposedly haunted towers. Garrison morale is plummeting, as the men dread the midnight noises far more than any physical enemy."

 harrenhal_sleepless_nights_bla:0 "Wailing Tower Insomnia"
 harrenhal_sleepless_nights_bla_desc:0 "The shrieking winds whistling through the gaps in the melted stone towers make a restful night's sleep completely impossible, fraying this character's nerves."

 harrenhal_listened_to_whispers_bla:0 "Swayed by Superstition"
 harrenhal_listened_to_whispers_bla_desc:0 "This ruler has begun taking the servants' ghost stories seriously, adjusting statecraft and troop movements based on the supposed omens of the halls."

 harrenhal_restoration_efforts_bla:0 "The Bottomless Pit"
 harrenhal_restoration_efforts_bla_desc:0 "A massive portion of regional tax income is being thrown into clearing rubble and raising collapsed masonry, bleeding the treasury dry for minimal defensive gain."

 harrenhal_abandoned_wings_bla:0 "Surrendered to the Rats"
 harrenhal_abandoned_wings_bla_desc:0 "The sprawling outer bailies have been entirely surrendered to the elements, allowing vermin and damp rot to claim the historical architecture."

 harrenhal_managed_reconstruction_bla:0 "Pragmatic Masonry"
 harrenhal_managed_reconstruction_bla_desc:0 "This ruler has abandoned any foolish, vanity-driven dreams of fully restoring the castle, focusing resources strictly on fortifying the essential keeps and outer wall breaches."

 harrenhal_forced_labor_bla:0 "Conscripted Quarrymen"
 harrenhal_forced_labor_bla_desc:0 "The local peasantry is being driven to absolute exhaustion under the foreman's whip to clear out collapsed stone, dragging down regional agricultural productivity in exchange for masonry progress."

 harrenhal_defiant_lord_bla:0 "Defier of the Curse"
 harrenhal_defiant_lord_bla_desc:0 "This ruler openly mocks the grim fate of Harrenhal's past masters, projecting an air of supreme confidence that maintains garrison morale and defies the old rumors."

 harrenhal_humbled_before_history_bla:0 "Annalist's Reverence"
 harrenhal_humbled_before_history_bla_desc:0 "Studying the tragic downfalls of the houses that preceded them has made this ruler incredibly cautious, pragmatic, and heavily risk-averse when governing these lands."

 harrenhal_obsession_with_legacy_bla:0 "Lineage Anxiety"
 harrenhal_obsession_with_legacy_bla_desc:0 "Terrified by the regional myth that Harrenhal systematically destroys every family line that claims it, this ruler has become desperately fixated on securing heirs at any cost."

 harrenhal_dark_reputation_bla:0 "Lord of the Ruin"
 harrenhal_dark_reputation_bla_desc:0 "This character deliberately embraces a sinister, unapproachable persona, allowing visiting lords to believe that they are just as dangerous and cursed as the castle they sit in."

 harrenhal_burned_memory_bla:0 "Phantom Smoke"
 harrenhal_burned_memory_bla_desc:0 "The lingering smell of centuries-old soot, melted lead, and damp charcoal weighs heavily on this character's mental health, leaving them prone to frequent bouts of anxiety."

 harrenhal_fire_fascination_bla:0 "Conflagration Philosophy"
 harrenhal_fire_fascination_bla_desc:0 "This character views the ruin not as a historical tragedy, but as a magnificent, beautiful monument to the supreme, purifying authority of dragonlords."

 harrenhal_dragonfire_obsession_bla:0 "Targaryen Envy"
 harrenhal_dragonfire_obsession_bla_desc:0 "Living inside Harren Hoare's blackened tomb has left this ruler deeply envious of the royal family's dragon-riding heritage, breeding quiet, dangerous resentments."

 harrenhal_silent_godswood_bla:0 "The Ashen Grove"
 harrenhal_silent_godswood_bla_desc:0 "The sprawling godswood within the castle walls provides a stark, unsettling refuge where the normal chaos and noise of the court cannot seem to reach."

harrenhal_private_godswood_bla:0 "Private Godswood"
harrenhal_private_godswood_bla_desc:0 "The godswood has been closed to idle servants and curious courtiers, kept as a guarded sanctuary."

 harrenhal_dark_devotion_bla:0 "Sullen Prayers"
 harrenhal_dark_devotion_bla_desc:0 "Worship conducted under the shadow of the blackened Kingspyre Tower feels heavy, grim, and entirely detached from divine mercy, unsettling any visiting septons."

 harrenhal_whispering_faces_bla:0 "Attentive Bark"
 harrenhal_whispering_faces_bla_desc:0 "The carved faces on the weirwoods here feel intensely watchful, as if the old gods are cataloging every sin and secret whisper committed within the fortress."

 lothston_hidden_passages_bla:0 "Lothston Spy-Networks"
 lothston_hidden_passages_bla_desc:0 "By thoroughly mapping out the false walls and structural gaps in the castle's ancient masonry, this character has uncovered perfect alcoves for eavesdropping on visiting nobles."

 lothston_dark_fascination_bla:0 "Sorcerous Rumors"
 lothston_dark_fascination_bla_desc:0 "The deep, shadow-drenched cellar vaults have tempted this character into exploring forbidden alchemical or occult traditions away from the prying eyes of the Faith."

 lothston_whispers_below_bla:0 "Subterranean Secrets"
 lothston_whispers_below_bla_desc:0 "Something uncovered deep in the castle's archaic drainage tunnels has completely hijacked this ruler's focus, pulling them away from their daily administrative duties."

 lothston_dark_legacy_bla:0 "Blood of Mad Danelle"
 lothston_dark_legacy_bla_desc:0 "The terrifying historical legacy of House Lothston ensures that neighboring riverlords treat this character with immediate, deeply rooted hostility and suspicion."

 lothston_rejected_rumors_bla:0 "Whitewashed Lineage"
 lothston_rejected_rumors_bla_desc:0 "By aggressively executing gossips and banning tavern bards, this house has driven all talk of ancestral madness and blood-baths firmly underground."

 lothston_obsessed_with_danelle_bla:0 "Danelle's Disciple"
 lothston_obsessed_with_danelle_bla_desc:0 "This character has become utterly consumed by the macabre folklore of the Mad Lady, dedicating vast personal time to hunting down her lost diaries and alchemical tools."

 popular_rumor_denial:0 "Sanitized History"
 popular_rumor_denial_desc:0 "The circulation of an official, maester-approved chronicle has successfully silenced local gossip and steadied the smallfolk."

 whent_tourney_revival_bla:0 "The Great Lists of Harrenhal"
 whent_tourney_revival_bla_desc:0 "The massive tourney grounds are alive once more with tilting knights and wandering bards, temporarily distracting the realm from the fortress's grim reputation."

 whent_harrenhal_tourney_grounds_bla:0 "The Revived Lists"
 whent_harrenhal_tourney_grounds_bla_desc:0 "The legendary tournament grounds are alive once more with tilting knights and vibrant banners, temporarily restoring a flash of grand prestige to the ruined fortress."

 whent_fading_grandeur_bla:0 "The Diminishing Crest"
 whent_fading_grandeur_bla_desc:0 "This ruler has pragmatically accepted that the legendary, lavish displays of the past are financially unsustainable, opting for a much more modest and quiet court life."

 whent_quiet_acceptance_bla:0 "Stargazer's Resignation"
 whent_quiet_acceptance_bla_desc:0 "Instead of fruitlessly fighting the overwhelming emptiness of the castle, this character finds a strange, melancholic peace in its silent, abandoned chambers."

 whent_restored_halls_bla:0 "Reopened Apartments"
 whent_restored_halls_bla_desc:0 "Several grand suites have been thoroughly scrubbed of ancient soot and refurnished with fine silks to accommodate high-born guests in proper comfort."

 whent_haunted_memories_bla:0 "Echoes of the Bat Banner"
 whent_haunted_memories_bla_desc:0 "The lingering memories of past familial tragedies continue to haunt this ruler's mind, leaving them unusually prone to severe bouts of melancholy."

 whent_practical_restoration_bla:0 "Frugal Upkeep"
 whent_practical_restoration_bla_desc:0 "Only the essential administrative chambers and operational guardrooms are maintained, leaving the rest of the massive fortress to rot under the passage of time."

 strong_legacy_of_fire_bla:0 "The Unbroken Line"
 strong_legacy_of_fire_bla_desc:0 "This character aggressively leverages the proud, brutal military history of House Strong to demand absolute obedience from their vassals and household knights."

 strong_dragonfire_fixation_bla:0 "Anti-Dragon Strategy"
 strong_dragonfire_fixation_bla_desc:0 "Haunted by how their ancestors were cornered and burned, this commander focuses entirely on infantry tactics designed to withstand siege warfare and overwhelming, explosive force."

 strong_ashen_histories_bla:0 "Chronicles of the Burned"
 strong_ashen_histories_bla_desc:0 "The household maester has meticulously archived the precise structural and tactical failures of Harrenhal's past sieges to ensure those defensive mistakes are never repeated."

 strong_knightly_expectations_bla:0 "The Code of the Trident"
 strong_knightly_expectations_bla_desc:0 "The household retainers are held to an incredibly strict martial standard, ruthlessly weeding out any signs of cowardice, soft living, or broken oaths."

 strong_harsh_discipline_bla:0 "Iron Hand Justice"
 strong_harsh_discipline_bla_desc:0 "Domestic and military scandals are answered with immediate, public executions to preserve the absolute, untarnished authority of the high lord."

 strong_tarnished_reputation_bla:0 "Whispers of Bastardy"
 strong_tarnished_reputation_bla_desc:0 "Historical rumors regarding the true legitimacy of past family heirs have resurfaced, severely undermining this character's political standing among the traditional riverlords."

strong_victorious_champion_bla:0 "Vindicated Shield"
 strong_victorious_champion_bla_desc:0 "A decisive victory in a trial by combat has cleared this character's name in blood, affirming that the raw martial strength of House Strong still rules these halls."

strong_failed_champion_bla:0 "Humiliated Vanguard"
 strong_failed_champion_bla_desc:0 "A crushing defeat in a trial by combat has thoroughly broken this character's martial reputation, proving they lack the legendary strength of their ancestors."

 harrenhal_rebuilding_ruins_bla:0 "The Granite Tax"
 harrenhal_rebuilding_ruins_bla_desc:0 "The monumental cost of dragging fresh stone to the yards has forced this ruler to squeeze every copper possible out of the local farming tenants and merchant guilds."

 harrenhal_abandoned_sections_bla:0 "Left to the Elements"
 harrenhal_abandoned_sections_bla_desc:0 "Entire collapsed bastions have been cordoned off as fundamentally unsafe, permanently shrinking the castle's active defensive perimeter."

 harrenhal_endless_decay_bla:0 "Rotting Foundations"
 harrenhal_endless_decay_bla_desc:0 "The structural integrity of the castle is failing faster than the local engineers can patch it, creating a constant, frustrating drain on administrative focus."

 harrenhal_forced_reconstruction_bla:0 "The Mason's Whip"
 harrenhal_forced_reconstruction_bla_desc:0 "Unprecedented labor demands and brutal work hours have left the quarry workforce on the absolute brink of an open, bloody peasant rebellion."

 harrenhal_hidden_passages_sealed_bla:0 "Wall-Up Orders"
 harrenhal_hidden_passages_sealed_bla_desc:0 "Several unmapped and highly volatile structural tunnels have been completely backfilled with heavy mortar to prevent unauthorized intrusions and assassinations."

 harrenhal_disturbing_discoveries_bla:0 "The Cellar Grim"
 harrenhal_disturbing_discoveries_bla_desc:0 "The horrifying, mutilated remains uncovered during the search for missing servants have left the entire castle staff profoundly traumatized and superstitious."

 harrenhal_rule_through_fear_bla:0 "The Kingspyre Tyrant"
 harrenhal_rule_through_fear_bla_desc:0 "This character has abandoned traditional rule of law, using arbitrary, terrifying cruelty and the unnatural aura of Harrenhal to break any political dissent."

 harrenhal_whispers_growing_bla:0 "The Unraveling Court"
 harrenhal_whispers_growing_bla_desc:0 "Paranoia is spreading through the castle corridors like a plague, thoroughly destroying all trust between the ruler, the family, and the garrison."

 harrenhal_silenced_rumors_bla:0 "Severed Tongues"
 harrenhal_silenced_rumors_bla_desc:0 "Loose-lipped servants and gossiping guards have been dealt with ruthlessly, proving that this ruler will shed blood to protect the house's public image."

 harrenhal_dragon_dreams_bla:0 "Balerion's Nightmare"
 harrenhal_dragon_dreams_bla_desc:0 "Vivid, terrifying dreams of melting stone and black wings plague this character's sleep, causing severe exhaustion and frayed mental health."

 harrenhal_denied_the_flames_bla:0 "Cynical Defiance"
 harrenhal_denied_the_flames_bla_desc:0 "This ruler has aggressively dismissed all dark omens and nightmare visions as mere superstition, refusing to let phantom fears dictate their policy."

 harrenhal_consumed_by_dragonfire_bla:0 "Pyrophobic Melancholy"
 harrenhal_consumed_by_dragonfire_bla_desc:0 "A waking terror of fire and ash has completely gripped this character's mind, making them panic at the mere sight of a flickering hearth."

 harrenhal_fireborn_ambition_bla:0 "The Ash-King's Dream"
 harrenhal_fireborn_ambition_bla_desc:0 "Living in the ruin of a crushed kingdom has inspired this ruler with a ruthless, dangerous desire to forge their own absolute dominion, regardless of who burns."

 harrenhal_public_devotion_bla:0 "Piety as a Shield"
 harrenhal_public_devotion_bla_desc:0 "By funding massive septry donations and public prayers, this ruler uses the Light of the Seven to counter the terrifying rumors of the castle's curse."

 harrenhal_defied_the_curse_bla:0 "The Laughing Lord"
 harrenhal_defied_the_curse_bla_desc:0 "By openly mocking the fates of past dynasties, this character projects an infectious, arrogant confidence that bolsters the morale of their entire court."

 harrenhal_consumed_by_paranoia_bla:0 "Corridors of Shadow"
 harrenhal_consumed_by_paranoia_bla_desc:0 "Every distant echo, shifting draft, and hushed conversation now sounds like a localized assassination plot to this profoundly unstable ruler."

 harrenhal_studied_the_curse_bla:0 "Morbid Genealogy"
 harrenhal_studied_the_curse_bla_desc:0 "By meticulously studying the precise downfalls of Harrenhal's great houses, this ruler has developed an intensely cautious, protective strategy for their own heirs."

 harrenhal_ancient_discovery_bla:0 "The Kingspyre Slag"
 harrenhal_ancient_discovery_bla_desc:0 "Something ancient, historical, and deeply significant has been pried loose from the fused masonry, drawing intense interest from scholars and maesters across the realm."

 harrenhal_disturbing_relics_bla:0 "Cursed Relics"
 harrenhal_disturbing_relics_bla_desc:0 "The soot-caked, mangled artifacts recovered from the deep hollow radiate an unnatural, dark aura that deeply disturbs the local household guards."

 harrenhal_sealed_the_depths_bla:0 "Bricked Vaults"
 harrenhal_sealed_the_depths_bla_desc:0 "The hidden, ash-filled hollow has been completely sealed away behind thick layers of fresh stone, ensuring its grim secrets remain buried forever."

 harrenhal_whispers_beneath_stone_bla:0 "The Bleeding Granite"
 harrenhal_whispers_beneath_stone_bla_desc:0 "This character remains utterly convinced that the melted stone walls are harboring secrets and omens that must be uncovered before it is too late."

 harrenhal_looted_vaults_bla:0 "Desecrated Ashes"
 harrenhal_looted_vaults_bla_desc:0 "Every historic relic and ancient artifact found within the melted chamber has been ruthlessly broken down and sold to traveling merchants for raw coin value."

 harrenhal_crown_fragment_modifier:0 "Dragon-fused Crown Fragment"
 harrenhal_crown_fragment_modifier_desc:0 "Though melted and heavily deformed by Balerion's fires, this mangled piece of twisted iron still retains the distinct shape of a crown. Pried directly from the soot-caked rubble where Harren Hoare burned, it carries the grim, terrifying prestige of Harrenhal's legendary fall."



