l_english:

agot_crownlands_bla.1000.t:0 "The Light of Sharp Point"

agot_crownlands_bla.1000.desc:0 "The beacon burns above Sharp Point long after every hearth below has gone dark.\n\nKeeping it so is less romantic than sailors imagine. Timber must be hauled, oil stored, stairs repaired, lenses and braziers cleaned, and men paid to remain awake while everyone else sleeps.\n\nMy steward has brought me the latest accounts with a grim expression.\n\n'It costs a great deal of coin to show other men where the rocks are,' he observes.\n\nYet somewhere beyond the Point, a ship is undoubtedly steering by our light."

agot_crownlands_bla.1000.a:0 "Whatever it costs, the light must never fail."
agot_crownlands_bla.1000.b:0 "The beacon is also a watchtower. Treat it as one."
agot_crownlands_bla.1000.c:0 "The ships benefiting from our light can help pay for it."
agot_crownlands_bla.1000.d:0 "Let the sailors of the Point share responsibility for its flame."

agot_bar_emmon_light_never_fails_bla:0 "The Light Never Fails"
agot_bar_emmon_light_never_fails_bla_desc:0 "Sharp Point's beacon is maintained with exceptional care, ensuring that its flame remains a dependable guide across the surrounding waters."

agot_bar_emmon_watch_of_sharp_point_bla:0 "Watch of Sharp Point"
agot_bar_emmon_watch_of_sharp_point_bla_desc:0 "The beacon of Sharp Point serves not only passing ships but vigilant watchmen scanning Blackwater Bay."

agot_bar_emmon_beacon_dues_bla:0 "Beacon Dues"
agot_bar_emmon_beacon_dues_bla_desc:0 "Mariners benefiting from the light of Sharp Point are expected to contribute toward maintaining it."

agot_bar_emmon_sailors_light_bla:0 "The Sailors' Light"

agot_crownlands_bla.1001.t:0 "Three Lights in the Bay"

agot_crownlands_bla.1001.desc:0 "The beacon keeper wakes me well after midnight.\n\nThere are three lights upon Blackwater Bay.\n\nNot fishing boats. Those seldom keep such careful distance from one another. Not any vessel expected by the harbor master either.\n\nFrom Sharp Point we can see only their lanterns: three small flames moving slowly through an expanse of black water.\n\n'Could be merchants,' my captain says.\n\nThe beacon keeper shakes his head.\n\n'Could be.'\n\nNeither man sounds convinced."

agot_crownlands_bla.1001.a:0 "Send a fast boat to identify them."
agot_crownlands_bla.1001.a.merchants:0 "The mysterious lights belong to cautious merchant vessels traveling together for protection"
agot_crownlands_bla.1001.a.smugglers:0 "Your men uncover smugglers attempting to slip quietly through the bay"
agot_crownlands_bla.1001.a.warships:0 "The ships are armed and distinctly uninterested in being approached"

agot_crownlands_bla.1001.b:0 "Watch where they go before revealing that we have seen them."
agot_crownlands_bla.1001.b.success:0 "Patient observation reveals a clandestine landing and goods that were never intended to pass beneath a harbormaster's eye"
agot_crownlands_bla.1001.b.failure:0 "The lights disappear before dawn, leaving their identity unresolved"

agot_crownlands_bla.1001.c:0 "Wake the watch. Until dawn, assume the worst."
agot_crownlands_bla.1001.c.tt:0 "The coast is placed on alert until the unidentified vessels have passed"

agot_crownlands_bla.1001.d:0 "Three lanterns are not an invasion."
agot_crownlands_bla.1001.d.tt:0 "Whatever the ships were, they are gone by morning"
agot_bar_emmon_sailors_light_bla_desc:0 "The mariners of Sharp Point have taken greater responsibility for maintaining the beacon upon which their lives depend."

agot_crownlands_bla.1002.t:0 "The Point and the Bay"

agot_crownlands_bla.1002.desc:0 "From the heights of Sharp Point, Blackwater Bay seems almost peaceful.\n\nThat is an illusion best appreciated from land.\n\nShips bound for King's Landing cross these waters. So do fishing boats, smugglers, royal vessels, merchants, raiders, and fleets carrying banners whose arrival may mean celebration or war.\n\nAbove them all burns the beacon.\n\nHouse Bar Emmon may never command the wealth of Driftmark or the strength of the great houses. Yet there is value in being the first to see a sail upon the horizon — and greater value still in ensuring that others understand whose eyes are watching."

agot_crownlands_bla.1002.a:0 "We are the watchers of Blackwater Bay."
agot_crownlands_bla.1002.b:0 "Let every peaceful ship find welcome at Sharp Point."
agot_crownlands_bla.1002.c:0 "When danger comes, our liege will hear of it first."
agot_crownlands_bla.1002.d:0 "We need be nothing more — or less — than Lords of Sharp Point."

agot_bar_emmon_watchers_of_blackwater_bay_bla:0 "Watchers of Blackwater Bay"
agot_bar_emmon_watchers_of_blackwater_bay_bla_desc:0 "House Bar Emmon has embraced the defense and observation of the waters surrounding Sharp Point as one of its foremost duties."

agot_bar_emmon_harbor_of_sharp_point_bla:0 "Harbor of Sharp Point"
agot_bar_emmon_harbor_of_sharp_point_bla_desc:0 "House Bar Emmon has encouraged peaceful shipping to make greater use of the shelter and services available around Sharp Point."

agot_bar_emmon_first_light_of_warning_bla:0 "First Light of Warning"
agot_bar_emmon_first_light_of_warning_bla_desc:0 "House Bar Emmon uses its commanding position upon Blackwater Bay to ensure that its liege receives early warning of trouble approaching by sea."

agot_bar_emmon_lords_of_sharp_point_bla:0 "Lords of Sharp Point"
agot_bar_emmon_lords_of_sharp_point_bla_desc:0 "House Bar Emmon takes pride in the quiet but strategically important lordship it has maintained upon the shores of Blackwater Bay."