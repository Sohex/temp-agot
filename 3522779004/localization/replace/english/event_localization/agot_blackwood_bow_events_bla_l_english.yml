l_english:

 # --- THE CRAFTING OF RAVENWOOD ---

 agot_blackwood_bow_bla.0001.t:0 "A Gift of Bone and Bark"
 agot_blackwood_bow_bla.0001.desc:0 "A great branch has sheared from the colossal, skeletal crown of the dead weirwood.\n\nThe bone-white limb split in the dead of night with a sound like a fracturing skull, sending ten thousand roosting ravens screaming into the moonlit sky. By dawn, the massive wood lies heavy upon the frozen earth, still weeping thick, viscous sap as red as fresh blood from its freshly shattered bark. Some among your household whisper that the Old Gods have offered up a rare piece of their body as a gift. Others cross themselves, warning that no sane man should carve the sacred wood of Raventree for war.\n\nYet the great branch lies waiting beneath the silent flock."
 agot_blackwood_bow_bla.0001.a:0 "The Old Gods have gifted House Blackwood a weapon of vengeance."
 agot_blackwood_bow_bla.0001.a.tt:0 "A master bowyer shall be summoned to the castle."
 agot_blackwood_bow_bla.0001.b:0 "The wood must first be consecrated with proper blood sacrifice."
 agot_blackwood_bow_bla.0001.b.tt:0 "The ancient rites of the First Men shall be strictly observed."

 agot_blackwood_bow_bla.0002.t:0 "Bending the Bone"
 agot_blackwood_bow_bla.0002.desc:0 "The bowyer labors directly beneath the bare, skeletal crown of Raventree while the silent flock watches his every shave and cut from above.\n\nThe pale weirwood bends stubbornly beneath knife and steam, remaining as hard as old bone despite a thousand years of rot. Strange, agonizing faces seem to twist and bleed within the pale grain whenever torchlight flickers across the wood, and the craftsmen have repeatedly dropped their tools, refusing to work a single second after dusk.\n\nEven so, the terrifying outline of a great longbow slowly emerges from the sacred limb."
 agot_blackwood_bow_bla.0002.a:0 "Shape the bow for slaughter; let our enemies learn to fear it."
 agot_blackwood_bow_bla.0002.a.tt:0 "Ravenwood shall be forged into an instrument of war."
 agot_blackwood_bow_bla.0002.b:0 "Let the Old Gods guide the knife; it must be a holy thing."
 agot_blackwood_bow_bla.0002.b.tt:0 "The bow shall be carved through ancient, sacred rites."
 agot_blackwood_bow_bla.0002.c:0 "Wood is wood. Pay the cowards double and tell them to finish it."
 agot_blackwood_bow_bla.0002.c.tt:0 "You dismiss the superstitious terrors of your household."

 agot_blackwood_bow_bla.0003.t:0 "Ravenwood's Awakening"
 agot_blackwood_bow_bla.0003.desc:0 "At long last, the carving is complete.\n\nPale as winter moonlight and smooth as polished ivory, the finished weirwood longbow rests across a field of dark velvet beneath the bare heart tree. Above, the ravens pack the white branches in absolute, suffocating silence, acting as a cloud of living black leaves to witness its birth. Though freshly strung, the weapon already feels heavy and ancient in your grip.\n\nThe old maesters and singers murmur that House Blackwood has not held such a weapon since the days of the Bronze Kings."
 agot_blackwood_bow_bla.0003.a:0 "Ravenwood shall taste blood long after we are dust."


 # --- THE EXHUMATION OF WIDOWLEAF ---

 agot_blackwood_bow_bla.0100.t:0 "The Unquiet Shadow of Red Robb"
 agot_blackwood_bow_bla.0100.desc:0 "The tale is older than any living man in the Trident.\n\nWhen the bastard Red Robb Rivers rode to war during the Dance of the Dragons, he carried a legendary weirwood bow that brought ruin to the blacks and greens alike. After the butchery at Tumbleton, his body was never found, and his weapon vanished from the pages of history.\n\nYet, tales such as this can never be truly quieted—not while the ravens still watch. Whispers among your oldest servants claim that a handful of his loyal archers transported the bow back to the Blackwood Vale under cover of night, burying it deep beneath the dead tree so some piece of their commander could rest in sacred soil. They swore a lifetime pact of silence, taking the secret to their graves."
 agot_blackwood_bow_bla.0100.a:0 "Then we shall tear the earth apart until it is found."
 agot_blackwood_bow_bla.0100.a.tt:0 "The ancient root tunnels beneath Raventree Hall shall be opened."
 agot_blackwood_bow_bla.0100.b:0 "The Old Gods remember what men take to their graves."
 agot_blackwood_bow_bla.0100.b.tt:0 "You seek mystical guidance through the weeping heart tree."

 agot_blackwood_bow_bla.0101.t:0 "Into the Root Tunnels"
 agot_blackwood_bow_bla.0101.desc:0 "The cold earth beneath Raventree Hall is far older than the stones of the castle built atop it.\n\nYour digging parties break through ancient, collapsed masonry and a suffocating labyrinth of pale roots, descending into buried chambers untouched for generations. Overhead, the ravens scream in a maddened frenzy throughout the excavation, their calls echoing down into the dark where thick, bone-white roots have burrowed through ancient sepulchers and forgotten tombs alike.\n\nAt the deepest point beneath the dead weirwood, behind a massive curtain of roots as thick as a man's thigh, a sealed stone chamber is finally laid bare."
 agot_blackwood_bow_bla.0101.a:0 "Break the seals and open the chamber."
 agot_blackwood_bow_bla.0101.a.tt:0 "Whatever rests below has slept in darkness since the Dance."
 agot_blackwood_bow_bla.0101.b:0 "No true Blackwood fears the ghosts of our dead. I will go first."
 agot_blackwood_bow_bla.0101.b.tt:0 "You descend personally into the dark beneath the weirwood."

 agot_blackwood_bow_bla.0102.t:0 "The Bastard's Legacy"
 agot_blackwood_bow_bla.0102.desc:0 "The sealed chamber beneath the roots holds only dust, bone, and a chilling, ancient silence.\n\nSlouched against the far stone wall lies a skeleton wrapped in the blackened, rotted remnants of boiled leather, a massive weirwood bow still tightly clasped across its skeletal lap. Though its sinew string has long since dissolved to nothingness, the bone-white wood remains completely unyielding, untouched by time, moisture, or decay. Heavy smoke stains from the fires of Tumbleton still darken its lower limb, and deep within the grain, faint crimson veins twist like blood frozen beneath ice.\n\nAs you carry the relic back into the sunlit godswood, the thousands of ravens above erupt into a single, deafening roar of wings.\n\nThe bow that vanished with Red Robb Rivers has returned to the Blackwood Vale at last."
 agot_blackwood_bow_bla.0102.a:0 "Widowleaf has returned to the hands of its rightful masters."
