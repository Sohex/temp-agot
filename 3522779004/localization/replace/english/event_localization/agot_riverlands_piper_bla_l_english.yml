l_english:

 # =========================================================
 # 0650 - The Maiden's Leap
 # =========================================================
 agot_riverlands_bla.0650.t:0 "The Maiden's Leap"
 agot_riverlands_bla.0650.desc:0 "Outriders gallop up to your vanguard with a breathless report: an enemy detachment sits exposed and vulnerable near the river crossings. Their baggage train is scattered, their shield wall thin, and the hour ripe for bloodshed.\n\nYour young knights clash their swords against their greaves, begging you to loose the horses before the foe can reform. The hot-blooded lords of Pinkmaiden have never been known for their patience."
 agot_riverlands_bla.0650.a:0 "Sound the advance! Lower lances and ride them down!"
 agot_riverlands_bla.0650.b:0 "Hold the line. We will not be baited into a trap."
 agot_riverlands_bla.0650.c:0 "Loose the horses! Let the bastards remember the fury of Pinkmaiden!"
 agot_riverlands_bla.0650.d:0 "Reckless courage is merely a prettier word for folly. Hold your ground."


 # =========================================================
 # 0651 - The Silks of Pinkmaiden
 # =========================================================
 agot_riverlands_bla.0651.t:0 "The Silks of Pinkmaiden"
 agot_riverlands_bla.0651.desc:0 "A wandering singer has passed through your gates, trading his verses for a warm bench by the hearth. He fills your smoky hall with sweet Andal love ballads, tales of doomed knights, and tragic kings.\n\nEven your scarred household guards pause along the parapets to listen as his voice drifts beautifully through the castle. Your entire court sits spellbound by the romance."
 agot_riverlands_bla.0651.a:0 "Let the boy sing; a noble house must cultivate beauty."
 agot_riverlands_bla.0651.b:0 "Enough of love ballads—give us a mocking verse to insult our rivals."
 agot_riverlands_bla.0651.c:0 "Silence that lute. A war-torn realm has no use for pretty lies."
 agot_riverlands_bla.0651.d:0 "Dismiss the singer. This hall has no time for songs."


 # =========================================================
 # 0652 - The Burning of the Red Fork
 # =========================================================
 agot_riverlands_bla.0652.t:0 "The Burning of the Red Fork"
 agot_riverlands_bla.0652.desc:0 "Grim tidings arrive by raven: a massive enemy host has crossed the borders and is marching straight for Pinkmaiden.\n\nInside your solar, your retainers argue fiercely into the night. Your martial captains urge you to bar the gates and prepare for a siege, while your older counselors speak in hushed, terrified whispers of surrender. The Red Fork has run bloody before, and few castles ever escape the torch unscarred."
 agot_riverlands_bla.0652.a:0 "The maiden will not bow. Let them try to break our walls."
 agot_riverlands_bla.0652.b:0 "Every battlement must hold; summon the peasantry to the ramparts."
 agot_riverlands_bla.0652.c:0 "Flesh and stone will burn. Smuggle my kin away before the siege lines close."
 agot_riverlands_bla.0652.d:0 "Our blood must endure. Smuggle my kin away before the siege lines close."


 # =========================================================
 # 0653 - A Knight of Summer
 # =========================================================
 agot_riverlands_bla.0653.t:0 "A Knight of Summer"
 agot_riverlands_bla.0653.desc:0 "One of your young kin burns with a reckless, maddening desire for glory. They speak of nothing but grand tourneys, blood-soaked battlefields, and the songs that will inevitably be sung in crowded halls to honor their name.\n\nThey wear their knightly vows as though chivalry were armor enough to stop an axe. The green young seldom believe that they can die."
 agot_riverlands_bla.0653.a:0 "Then lace on their helm; let glory find him in the dirt."
 agot_riverlands_bla.0653.b:0 "A dead knight wins no glory. Teach him to win in war, not in songs."
 agot_riverlands_bla.0653.c:0 "Pound some sense into his head. Temper that blind courage with cold wisdom."
 agot_riverlands_bla.0653.d:0 "Forbid this foolishness. I will not bury another hot-headed child."


 # =========================================================
 # 0654 - The Silk and the Steel
 # =========================================================
 agot_riverlands_bla.0654.t:0 "The Silk and the Steel"
 agot_riverlands_bla.0654.desc:0 "A small token is paraded before your court with all the solemn gravity of a royal battle standard—a primary-colored ribbon, an enamel clasp, or a torn sleeve of the finest Myrish lace. Such fragile favors have famously sent green young knights smiling into the lethal chaos of the melee, while leaving older, more cynical lords muttering bitterly into their cups.\n\nHere at Pinkmaiden, where romantic gallantry is never more than a step away from sheer folly, a single flirtatious gesture can easily set the entire hall whispering for a fortnight."
 agot_riverlands_bla.0654.a:0 "Let the court indulge in its sweet, harmless romances."
 agot_riverlands_bla.0654.b:0 "A true knight wears their lady's favor boldly into the fray."
 agot_riverlands_bla.0654.c:0 "Chivalric honor must always govern a noble house's affections."
 agot_riverlands_bla.0654.d:0 "A simple scrap of cloth shall not rule a sovereign lord's hall."




 # =========================================================
 # MODIFIERS & TRAITS
 # =========================================================
 piper_reckless_glory_bla:0 "The Maiden's Pride"
 piper_reckless_glory_bla_desc:0 "Fierce cavalry charges and a fearless disregard for personal safety have earned this ruler a legendary reputation among the chivalric houses of the Trident."

 piper_measured_defense_bla:0 "Iron Beneath the Silk"
 piper_measured_defense_bla_desc:0 "Calculated caution and strict battlefield discipline have successfully tempered the impulsive, romantic spirit of the Pinkmaiden court."

 piper_songcourt_bla:0 "Halls of Chivalry"
 piper_songcourt_bla_desc:0 "Music, romantic courtly love, and high Andal arts flourish beneath the pink stone towers of this seat."

 piper_hard_wall_orders_bla:0 "Garrison of the Pink Maid"
 piper_hard_wall_orders_bla_desc:0 "The defenses of Pinkmaiden are placed under absolute, draconian command. Every gate is barred, every approach is watched, and the battlements are reinforced to withstand a brutal siege."

 pinkmaiden_defiant_bla:0 "The Unbroken Maid"
 pinkmaiden_defiant_bla_desc:0 "This ruler has sworn a solemn vow that Pinkmaiden will never yield to an invader, inspiring fierce resistance throughout the garrison."

 pinkmaiden_militia_bla:0 "The Pinkmaiden Levy"
 pinkmaiden_militia_bla_desc:0 "The smallfolk and tradesmen of the surrounding valleys have armed themselves, rallying to defend the walls of their lords."

 piper_courtly_favor_bla:0 "Whispers of the Maid"
 piper_courtly_favor_bla_desc:0 "This court has been deeply stirred by public gallantry, quiet admiration, and the beautifully dangerous warmth of forbidden noble affection."

 piper_gallant_reputation_bla:0 "The Sovereign's Grace"
 piper_gallant_reputation_bla_desc:0 "This ruler is widely celebrated for bearing courtly admiration, tourney honors, and romantic gossip with unparalleled confidence and aristocratic grace."
