reclaimed_castamere:0 "Reclaimed Castamere"
reclaimed_castamere_tt:0 "You have reclaimed Castamere for House Reyne."
disturbed_the_dead:0 "Disturbed the Dead"
disturbed_the_dead_tt:0 "You disturbed the resting place of your ancestors."
castamere_haunted:0 "Haunted by Castamere's Fallen"
castamere_haunted_tt:0 "The spirits of Castamere haunt your steps. Others feel their presence... and hesitate."
communed_with_the_dead:0 "Communed with the Spirits of Castamere"
communed_with_the_dead_tt:0 "You have spoken to the lost, and they whisper their secrets to you."
respected_the_dead:0 "Respected the Dead"
respected_the_dead_tt:0 "You have chosen not to explore Castamere and leave the ruins as the grave to the fallen."
honored_the_fallen:0 "Honored the Fallen"
honored_the_fallen_tt:0 "You have chosen to honor the lost and go no further."
angered_the_lions:0 "Angered the Golden Lion"
angered_the_lions_tt:0 "Choosing to excavate the ruins of Castamere has drawn ire from the Golden Lion of Casterly Rock who wishes it to be left alone."
angry_at_reyne_excavation_opinion:0 "Angry at Castamere being excavated."


restored_dusk_dynasty:0 "Restored Dusk Kingdom"
restored_dusk_dynasty_desc:0 "Having proclaimed a kingdom from the shadows of history, this character rules with the ambition of the Dusk Kings of old."

summoned_archmaesters_modifier_reform:0 "A Court Reshaped"
summoned_archmaesters_modifier_reform.desc:0 "The Archmaesters have advised sweeping reforms to your administration, improving governance and scholarly structure."
summoned_archmaesters_modifier_reform_tt:0 "The realm benefits from their learned insight."
summoned_archmaesters_modifier_claims:0 "Claims and Counsel"
summoned_archmaesters_modifier_claims.desc:0 "The Archmaesters have lent their credibility to bolster your court’s prestige and diplomatic standing."
