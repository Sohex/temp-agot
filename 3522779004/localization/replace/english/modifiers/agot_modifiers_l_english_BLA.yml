summoned_archmaesters_modifier_research.desc:0 "The Citadel leaves behind tomes, lectures, and eager minds. Your court becomes a haven of knowledge, with study halls replacing idle gossip."
summoned_archmaesters_modifier_research_tt:0 "Your learning and lifestyle insights flourish under their guidance."

hosted_redwyne_festival:0 "Recently Hosted the Redwyne Festival"
hosted_redwyne_festival_desc:0 "This character recently hosted a grand wine festival on the Arbor."

redwyne_vintage_praised:0 "Praised Redwyne Vintage"
redwyne_vintage_praised_desc:0 "This character's wine was declared the finest in the realm."

wine_trade_success:0 "Myr Trade Windfall"
wine_trade_success_desc:0 "Successful trade deals made during the wine festival brought unexpected coin."

redwyne_festival_vintner_glory:0 "Renowned Vintner"
