 dragonlord_council_proposal.1000.d:0 "[martial_i]威严宣告，让会场服从我的节奏"

 dragonlord_council_proposal.1010.t:0 "议席上的质问"
 dragonlord_council_proposal.1010.desc:0 "我的陈述尚未结束，[dragonlord_council_critic.GetTitledFirstName]便从席间站起，当众抓住议案中最容易引发疑虑的一点步步追问。窃窃私语沿着议席扩散；若不能立即夺回主动，准备得再充分的演说也会被这次质问拖垮。"
 dragonlord_council_proposal.1010.a:0 "[diplomacy_i]直面质疑，把质问者变成听众"
 dragonlord_council_proposal.1010.b:0 "[stewardship_i]算清得失，让数字替我回答"
 dragonlord_council_proposal.1010.c:0 "[learning_i]援引法理，证明这项质疑站不住脚"
 dragonlord_council_proposal.1010.d:0 "[martial_i]压住会场，不容质问扰乱秩序"
 dragonlord_council_proposal.challenge.success:0 "你成功控制了局面，发表得分#P +10#!"
 dragonlord_council_proposal.challenge.failure:0 "你的应对没能说服会场，发表得分#N -10#!"
 dragonlord_council_proposal.1030.t:0 "首席龙王的发表"
 dragonlord_council_proposal.1030.desc:0 "[host.GetTitledFirstName]正在向议席陈述这项议案。会场暂时保持安静，但我可以当众抓住其中的弱点发起质疑，也可以静静听完。"
 dragonlord_council_proposal.1030.a:0 "[diplomacy_i]一派胡言"
 dragonlord_council_proposal.1030.b:0 "静静聆听"
 dragonlord_council_proposal.guest_challenge.success:0 "你的质疑难住了首席龙王，首席龙王的发表得分#N -10#!"
 dragonlord_council_proposal.guest_challenge.failure:0 "首席龙王驳倒了你的质疑，首席龙王的发表得分#P +10#!"

 dragonlord_council_proposal.result.disastrous.t:0 "一场灾难"
 dragonlord_council_proposal.result.disastrous.desc:0 "质疑声彻底淹没了我的陈述。议席间只剩毫不掩饰的嘲弄与失望；在正式讨论开始前，议案已经背上了沉重的负担。\n\n发表总分：#V [ROOT.Var('dragonlord_council_speech_score').GetValue|0]#!"
 dragonlord_council_proposal.result.poor.t:0 "糟糕的发表"
 dragonlord_council_proposal.result.poor.desc:0 "我勉强说完了准备好的陈述，却没能消除听众的疑虑。几名原本愿意观望的龙王已经露出反对的神情。\n\n发表总分：#V [ROOT.Var('dragonlord_council_speech_score').GetValue|0]#!"
 dragonlord_council_proposal.result.weak.t:0 "未能取信于人"
 dragonlord_council_proposal.result.weak.desc:0 "这次发表并非全无可取之处，但漏洞与迟疑比论点更加醒目。议案留给会场的第一印象仍然偏向负面。\n\n发表总分：#V [ROOT.Var('dragonlord_council_speech_score').GetValue|0]#!"
 dragonlord_council_proposal.result.ordinary.t:0 "平平无奇的演说"
 dragonlord_council_proposal.result.ordinary.desc:0 "我的陈述顺利结束，却没有在议席间激起多少波澜。赞同者没有因此更加热切，反对者也未得到新的把柄；议案将以原本的局势进入讨论。\n\n发表总分：#V [ROOT.Var('dragonlord_council_speech_score').GetValue|0]#!"
 dragonlord_council_proposal.result.adequate.t:0 "尚可的开场"
 dragonlord_council_proposal.result.adequate.desc:0 "我的陈述清楚地说明了议案，也稳住了临场出现的质疑。它称不上震撼人心，却足以让更多龙王愿意认真考虑。\n\n发表总分：#V [ROOT.Var('dragonlord_council_speech_score').GetValue|0]#!"
 dragonlord_council_proposal.result.strong.t:0 "出色的发表"
 dragonlord_council_proposal.result.strong.desc:0 "我牢牢掌握了会场的注意力，也将质疑化作了进一步阐明议案的机会。掌声与赞许已经从数个议席上传来。\n\n发表总分：#V [ROOT.Var('dragonlord_council_speech_score').GetValue|0]#!"
 dragonlord_council_proposal.result.exceptional.t:0 "群龙为之倾听"
 dragonlord_council_proposal.result.exceptional.desc:0 "当最后一句话落下，大厅中短暂的寂静比欢呼更有力量。即使最挑剔的龙王也不得不承认，这项议案得到了近乎无可挑剔的呈现。\n\n发表总分：#V [ROOT.Var('dragonlord_council_speech_score').GetValue|0]#!"
 dragonlord_council_proposal.result.a:0 "让讨论开始吧。"

