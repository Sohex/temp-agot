 dragonlord_council_discussion.2010.t:0 "争论偏离了议案"
 dragonlord_council_discussion.2010.desc:0 "[dragonlord_council_disputant_1.GetTitledFirstName]与[dragonlord_council_disputant_2.GetTitledFirstName]对条文的解释针锋相对。旧日恩怨很快压过了议案本身，两人的追随者也开始相互叫骂。若放任不管，整场讨论都会被拖入这场私人争执。"
 dragonlord_council_discussion.2010.a:0 "[diplomacy_i]调停双方，让他们重回议题"
 dragonlord_council_discussion.2010.b:0 "支持[dragonlord_council_disputant_1.GetFirstNameNoTooltip]的解释"
 dragonlord_council_discussion.2010.c:0 "支持[dragonlord_council_disputant_2.GetFirstNameNoTooltip]的解释"
 dragonlord_council_discussion.2010.d:0 "让他们吵个够"
 dragonlord_council_discussion.mediate.success:0 "你平息了争端"
 dragonlord_council_discussion.mediate.failure:0 "你的调停令双方都感到不满"
 dragonlord_council_discussion.both_support_plus_5_tt:0 "两名争执者对本次议案的支持度均#P +5#!"
 dragonlord_council_discussion.both_support_minus_5_tt:0 "两名争执者对本次议案的支持度均#N -5#!"
 dragonlord_council_discussion.side_1_tt:0 "[dragonlord_council_disputant_1.GetShortUIName]的支持度#P +10#!；[dragonlord_council_disputant_2.GetShortUIName]的支持度#N -10#!"
