 dragonlord_council_discussion.2000.t:0 "议席上的公开质疑"
 dragonlord_council_discussion.2000.desc:0 "讨论刚刚展开，[dragonlord_council_discussion_speaker.GetTitledFirstName]便当众起身，抓住议案中最受争议的一处发起攻击。对方的立场尚未彻底凝固，但会场中的每一道目光都在等待我的回应。"
 dragonlord_council_discussion.2000.a:0 "[diplomacy_i]承认顾虑，再把对方引向我的结论"
 dragonlord_council_discussion.2000.b:0 "[learning_i]逐条拆解这番质疑"
 dragonlord_council_discussion.2000.c:0 "[martial_i]以威严喝止这场阻挠"
 dragonlord_council_discussion.answer.success:0 "你的答复说服了质疑者"
 dragonlord_council_discussion.answer.failure:0 "你的答复反而加深了质疑"
 dragonlord_council_discussion.command.success:0 "质疑者在你的威势下退让"
 dragonlord_council_discussion.command.failure:0 "你的威吓激起了公开反抗"
 dragonlord_council_discussion.speaker_support_plus_10_tt:0 "[dragonlord_council_discussion_speaker.GetShortUIName]对本次议案的支持度#P +10#!"
 dragonlord_council_discussion.speaker_support_minus_5_tt:0 "[dragonlord_council_discussion_speaker.GetShortUIName]对本次议案的支持度#N -5#!"
