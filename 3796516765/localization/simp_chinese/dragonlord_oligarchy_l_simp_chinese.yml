 dragonlord_council_voting.failed.desc:0 "点票结束，议案未能取得多数。反对者守住了足够的议席。\n\n赞成票：#P [ROOT.Var('dragonlord_council_meeting_support_votes').GetValue|0]#!\n反对票：#N [ROOT.Var('dragonlord_council_meeting_opposition_votes').GetValue|0]#!"
