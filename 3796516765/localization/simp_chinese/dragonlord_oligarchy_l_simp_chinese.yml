 dragonlord_bureaucracy_opinion_penalty_2:0 "龙王寡头制：中央官僚制"
 dragonlord_bureaucracy_opinion_penalty_2_desc:0 "集权正在侵蚀龙王家族珍视的古老权利"
 dragonlord_bureaucracy_opinion_penalty_3:0 "龙王寡头制：绝对独裁"
 dragonlord_bureaucracy_opinion_penalty_3_desc:0 "第一大君的专断激起了自由堡垒各方势力的强烈敌意"
 dragonlord_oligarchy_government:0 "龙王寡头制"
 dragonlord_oligarchy_government_adjective:0 "龙王寡头制"
 dragonlord_oligarchy_government_realm:0 "瓦雷利亚"
 dragonlord_oligarchy_government_desc:0 "#F 龙焰铸就了自由堡垒，龙王家族则执掌它的命运。第一大君居于议会之首，而古老血脉在无顶高塔间争逐权势与荣耀。#!"
 adopt_dragonlord_oligarchy_decision:0 "采用龙王寡头政体"
 adopt_dragonlord_oligarchy_decision_desc:0 "让自由堡垒从灰烬中重生。龙王家族将再次聚于议会，而我将在群龙之上执掌首席。"
 adopt_dragonlord_oligarchy_decision_tooltip:0 "以龙焰重铸瓦雷利亚的古老秩序"
 adopt_dragonlord_oligarchy_decision_confirm:0 "复兴自由堡垒"
 adopt_dragonlord_oligarchy_decision_effect_tooltip:0 "焚毁诸王冠，召集四十龙王家族，使瓦雷利亚从灰烬中重生。"
 summon_dragonlord_families_decision:0 "召集龙王家族"
 summon_dragonlord_families_decision_desc:0 "议会已然升起，席位却仍沉寂无声。传令古老血脉前来无顶高塔，在龙焰前宣告他们的权利。"
 summon_dragonlord_families_decision_tooltip:0 "令龙王家族入席议会"
 summon_dragonlord_families_decision_confirm:0 "召集诸龙王"
 summon_dragonlord_families_decision_effect_tooltip:0 "四十龙王家族将在议会中获得自己的名誉头衔。"
 dragonlord_family_name:0 "[Select_CString( CHARACTER.GetHouse.IsValid, CHARACTER.GetHouse.GetBaseNameNoTooltip, CHARACTER.GetNameNoTooltip)]龙王家族"
 dragonlord_fourteen_dragonlords_house_modifier:0 "十四龙王"
 dragonlord_fourteen_dragonlords_house_modifier_desc:0 "作为自由堡垒真正的核心掌权者，其实力与财富远超边缘龙王。他们不仅坐拥数量最庞大、体型最古老的巨龙，更垄断了瓦雷利亚最高议会的绝对话语权。"
 government_has_fourteen_dragonlords:0 "[dragonlord_dragonlords|E]执掌"
 government_forbids_kingdom_titles:0 "无法建立王国"
 game_concept_dragonlord_fourteen_dragonlords:0 "十四龙王"
 game_concept_dragonlord_fourteen_dragonlords_desc:0 "作为自由堡垒真正的核心掌权者，其实力与财富远超边缘龙王。他们不仅坐拥数量最庞大、体型最古老的巨龙，更垄断了瓦雷利亚最高议会的绝对话语权。"
 game_concept_dragonlord_fourteen_dragonlords_attribute:0 "十四龙王属性"
 game_concept_dragonlord_fourteen_dragonlords_attribute_desc:0 "$game_concept_dragonlord_fourteen_dragonlords_attribute$是[dragonlord_valyrian_freehold|E]内[house|E]的相关增益组合。属性会增益$game_concept_house$成员和[liege|E]。\n\n属性只在$game_concept_house$被视为[dragonlord_fourteen_dragonlords|E]时激活，并且[dragonlord_chief_dragonlord|E]的$game_concept_family_attribute$不会为他们的[liege|E]提供增益。\n\n[house_head|E]可以随时随意地替换属性。"
 game_concept_dragonlord_dragonlords:0 "龙王"
 game_concept_dragonlord_dragonlords_desc:0 "$game_concept_dragonlord_dragonlords$是瓦雷利亚自由堡垒中能够驾驭巨龙的显赫自由民家族。自由堡垒名义上由拥有土地的自由民共同治理，实际权势却长期汇聚于富有、古老且精通巫术的龙王家族；他们凭借巨龙、财富与派系左右议会。"
 game_concept_dragonlord_chief_dragonlord:0 "首席龙王"
 game_concept_dragonlord_chief_dragonlord_desc:0 "$game_concept_dragonlord_chief_dragonlord$是[dragonlord_valyrian_freehold|E]内权势最强的[dragonlord_dragonlords|E]家族。他们凭借巨龙、财富、古老血统与派系居于议会之首。龙王中权势最强的一家——当然，只是暂时的。"
 game_concept_dragonlord_freeholders:0 "自由民"
 game_concept_dragonlord_freeholders_desc:0 "$game_concept_dragonlord_freeholders$是生而自由并在[dragonlord_valyrian_freehold|E]拥有土地之人，因而有权参与议会、治理领地并竞争公职。并非所有自由民都是[dragonlord_dragonlords|E]。"
 game_concept_dragonlord_freeholder_lands:0 "自由民领地"
 game_concept_dragonlord_freeholder_lands_desc:0 "在瓦雷利亚，自由民是生而自由并拥有土地之人，因而有权参与自由堡垒的治理。[dragonlord_dragonlords|E]同样属于这一共同体，却往往凭借巨龙与古老血统取得远超寻常自由民的权势。"
 game_concept_dragonlord_lands:0 "领地"
 game_concept_dragonlord_lands_desc:0 "$game_concept_dragonlord_lands$是[dragonlord_freeholders|E]在[dragonlord_valyrian_freehold|E]中持有并治理的土地。龙王家族的领地还包括庄园、无顶高塔，以及供巨龙栖息的广阔疆土。"
 game_concept_dragonlord_valyrian_freehold:0 "瓦雷利亚自由堡垒"
 game_concept_dragonlord_valyrian_freehold_i:0 "@government_type_dragonlord_oligarchy!"
 game_concept_dragonlord_valyrian_freehold_desc:0 "$game_concept_dragonlord_valyrian_freehold$既无国王，也无皇帝。拥有土地的[dragonlord_freeholders|E]皆可参与治理，但议会与征服的真正权柄掌握在驾驭巨龙的[dragonlord_dragonlords|E]家族手中。"
 game_concept_dragonlord_oligarchy:0 "龙王寡头制"
 game_concept_dragonlord_oligarchy_i:0 "@government_type_dragonlord_oligarchy!"
 game_concept_dragonlord_oligarchy_desc:0 "$dragonlord_oligarchy_government_desc$"
 dragonlord_oligarchy_government_house_attribute_flavor_name:0 "[dragonlord_fourteen_dragonlords_attribute|E]"
 dragonlord_oligarchy_government_house_attribute_flavor_name_no_tooltip:0 "$game_concept_dragonlord_fourteen_dragonlords_attribute$"

