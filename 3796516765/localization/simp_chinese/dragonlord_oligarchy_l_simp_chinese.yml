 dragonlord_council_discussion.2020.t:0 "在议席间发言"
 dragonlord_council_discussion.2020.desc:0 "讨论已经全面展开。每一席龙王都在衡量这项议案，而我也有机会站起来影响会场：可以替提案陈明理由，可以指出它将带来的祸患，也可以继续保持沉默。"
 dragonlord_council_discussion.2020.a:0 "[diplomacy_i]发言支持这项提案"
 dragonlord_council_discussion.2020.b:0 "[diplomacy_i]发言反对这项提案"
 dragonlord_council_discussion.2020.c:0 "保持沉默"
 dragonlord_council_discussion.guest_support.success:0 "你的发言赢得了会场的响应"
 dragonlord_council_discussion.guest_support.failure:0 "你的支持没有打动其他议席"
 dragonlord_council_discussion.guest_opposition.success:0 "你的反驳动摇了会场"
 dragonlord_council_discussion.guest_opposition.failure:0 "你的反对未能改变其他人的看法"
 dragonlord_council_discussion.guest_support_plus_5_tt:0 "除你之外，所有参会投票者对本次议案的支持度#P +5#!"
 dragonlord_council_discussion.guest_opposition_minus_5_tt:0 "除你之外，所有参会投票者对本次议案的支持度#N -5#!"

 dragonlord_council_persuasion.3000.t:0 "争取一张反对票"
 dragonlord_council_persuasion.3000.desc:0 "公开讨论暂告一段落后，我找到了与[dragonlord_council_persuasion_target.GetTitledFirstName]单独交谈的机会。[dragonlord_council_persuasion_target.GetSheHe]目前仍反对这项议案，但立场并非没有松动的余地。若能选对手段，这张反对票或许还能被拉到我这一边。\n\n当前支持度：#V [dragonlord_council_persuasion_target.MakeScope.ScriptValue('dragonlord_council_meeting_final_support')|0]#!"
 dragonlord_council_persuasion.3000.a:0 "[diplomacy_i]耐心说服，以共同利益打消疑虑"
 dragonlord_council_persuasion.3000.b:0 "[gold_i]支付200金币，许下一笔可观的报酬"
 dragonlord_council_persuasion.3000.c:0 "[intrigue_i]说清楚反对我的代价"
 dragonlord_council_persuasion.3000.d:0 "此人不值得我浪费时间"
 dragonlord_council_persuasion.reason.success:0 "你的说辞动摇了反对者"
 dragonlord_council_persuasion.reason.failure:0 "你的说辞未能打消疑虑"
 dragonlord_council_persuasion.threat.success:0 "反对者在威压下作出让步"
 dragonlord_council_persuasion.threat.failure:0 "反对者拒绝向你的威胁低头"
 dragonlord_council_persuasion.support_plus_20_tt:0 "[dragonlord_council_persuasion_target.GetShortUIName]对本次议案的支持度#P +20#!"
