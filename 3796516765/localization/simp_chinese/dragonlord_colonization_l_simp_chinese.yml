l_simp_chinese:
 dragonlord_colonization:0 "殖民战争"
 dragonlord_colonization_cb:0 "殖民战争"
 DRAGONLORD_COLONIZATION_WAR_NAME:0 "$ORDER$[ATTACKER.GetPrimaryTitle.GetAdjective]对[DEFENDER.GetPrimaryTitle.GetName]的殖民战争"
 DRAGONLORD_COLONIZATION_WAR_NAME_BASE:0 "[ATTACKER.GetPrimaryTitle.GetAdjective][DEFENDER.GetPrimaryTitle.GetName]"
 dragonlord_colonization_cb_victory_desc:0 "[defender.GetShortUIName]携其领地与封臣臣服于[attacker.GetShortUIName]，保留王国级头衔，作为自由贸易城邦归附。战后，[attacker.GetShortUIName]可以让总督留任，或任命一位高等瓦雷利亚人接任。"
 dragonlord_colonization_cb_white_peace_desc:0 "[defender.GetShortUIName]保持独立，领地与头衔不发生变化。"
 dragonlord_colonization_cb_defeat_desc:0 "[defender.GetShortUIName]保持独立；[attacker.GetShortUIName]损失威望并支付战争赔款。"
 dragonlord_colonization.0001.t:0 "城邦的总督"
 dragonlord_colonization.0001.desc:0 "[dragonlord_colonial_city.GetName]已向自由堡垒低头。[dragonlord_colonial_governor.GetShortUIName]承认我的权威，城邦的领地与属臣也随之归附。\n\n城邦的头衔将得到保留，但由谁执掌它，尚待我裁定。我可以让现任总督继续治理，也可以从瓦雷利亚选派一位新的总督。"
 dragonlord_colonization.0001.a:0 "让[dragonlord_colonial_governor.GetFirstNameNoTooltip]继续治理。"
 dragonlord_colonization.0001.a.tt:0 "[dragonlord_colonial_governor.GetShortUIName]继续统治[dragonlord_colonial_city.GetName]，作为你的封臣。"
 dragonlord_colonization.0001.b:0 "任命一位高等瓦雷利亚人接任。"
 dragonlord_colonization.0001.b.tt:0 "任命一位高等瓦雷利亚文化的总督。"
