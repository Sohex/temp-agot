l_simp_chinese:


 dragonlord_ep3_confirmation_title:0 "$admin_confirmation_event_header$自由堡之任"
 dragonlord_ep3_confirmation_liege_desc:0 "诸龙王家族的代表、书记官与辖区官员齐聚[ROOT.Char.Custom('GetThroneRoom')]，等待依照自由堡的法律确认各自的职权。\n\n其中最引人注目的是[ROOT.Var('confirmation_vassal').Char.GetTitledFirstName]·[ROOT.Var('confirmation_vassal').Char.GetDynastyHouseName]，[ROOT.Var('confirmation_vassal').Char.GetSheHe]今日从[ROOT.Var('confirmation_vassal').Char.GetCapitalLocation.GetNameNoTooltip]赶来。作为我的[ROOT.Char.Custom2('RelationToMeShort', ROOT.Var('confirmation_vassal').Char)]，[ROOT.Var('confirmation_vassal').Char.GetSheHe]将肩负治理[ROOT.Var('confirmation_vassal').Char.GetPrimaryTitle.GetName]之责："
 dragonlord_ep3_confirmation_liege_hate:0 "\n\n[ROOT.Var('confirmation_vassal').Char.GetTitledFirstNameNoTooltip]昂首立于议席之前，我几乎不必细看，便能觉察[ROOT.Var('confirmation_vassal').Char.GetHerHis]对这项安排的轻蔑。[ROOT.Var('confirmation_vassal').Char.GetSheHe]虽然接下权杖，目光却始终冷若龙晶。"
 dragonlord_ep3_confirmation_liege_love:0 "\n\n[ROOT.Var('confirmation_vassal').Char.GetTitledFirstNameNoTooltip]郑重接过象征辖区职权的权杖，并向自由堡、议会及其法律宣誓尽责。[ROOT.Var('confirmation_vassal').Char.GetHerHis]的言辞坚定而不失尊严。"
 dragonlord_ep3_confirmation_liege_decrepit:0 "\n\n岁月已经压弯[ROOT.Var('confirmation_vassal').Char.GetTitledFirstNameNoTooltip]的脊背，但[ROOT.Var('confirmation_vassal').Char.GetSheHe]仍在诸家代表面前站得笔直。这位长者积累的经验，或许正是[ROOT.Var('confirmation_vassal').Char.GetPrimaryTitle.GetNameNoTier]所需要的。"
 dragonlord_ep3_confirmation_liege_young:0 "\n\n[ROOT.Var('confirmation_vassal').Char.GetTitledFirstNameNoTooltip]面容尚且年轻，双手紧握刚刚接过的辖区权杖。诸家族的目光都落在[ROOT.Var('confirmation_vassal').Char.GetHerHim]身上；从今日起，[ROOT.Var('confirmation_vassal').Char.GetSheHe]必须用政绩证明自己。"
 dragonlord_ep3_confirmation_liege_skilled:0 "\n\n[ROOT.Var('confirmation_vassal').Char.GetTitledFirstNameNoTooltip]以[ROOT.Var('confirmation_vassal').Char.Custom('ComplimentAdjective')]手段治理领地。无论[ROOT.Var('confirmation_vassal').Char.GetSheHe]拥护哪一派议政主张，这份才能都是自由堡不可轻弃的财富。"
 dragonlord_ep3_confirmation_liege_incompetent:0 "\n\n各项报告都表明，[ROOT.Var('confirmation_vassal').Char.GetTitledFirstNameNoTooltip]并非这份职权最理想的承担者。然而议会既已确认这项任命，接下来便只能以法律、监督与问责约束[ROOT.Var('confirmation_vassal').Char.GetHerHim]。"
 dragonlord_ep3_confirmation_liege_generic:0 "\n\n[ROOT.Var('confirmation_vassal').Char.GetTitledFirstNameNoTooltip]向在场诸家致意，接过象征辖区职权的权杖，并宣誓依照自由堡法律治理[ROOT.Var('confirmation_vassal').Char.GetPrimaryTitle.GetNameNoTier]。"
 dragonlord_ep3_confirmation_liege_option:0 "“愿你不负自由堡所托。”"

 dragonlord_ep3_confirmation_vassal_desc:0 "在[ROOT.Var('confirmation_liege').Char.GetCapitalLocation.GetTitle.GetNameNoTierPossessive]的议事大厅内，诸龙王家族的旗帜垂列两侧。[ROOT.Var('confirmation_liege').Char.GetTitledFirstNameRegnal]端坐首席，龙王、书记官与各辖区代表共同见证此次授任。\n\n"
 dragonlord_ep3_confirmation_vassal_child:0 "主持首席议席的是一位尚显稚嫩的年轻人。席间偶有审视的目光，但自由堡承认的是议会推举出的首席，而非单凭年龄衡量的君主。"
 dragonlord_ep3_confirmation_vassal_heretic:0 "大厅中信仰各异，祭司与书记官之间的气氛略显紧张；然而今日要确认的是辖区职权，依凭的是自由堡法律，而非任何神祇的恩典。"
 dragonlord_ep3_confirmation_vassal_war:0 "授任程序开始时，军官们仍在低声交换战报。战争不会因为议会开会便停下，而各辖区恪尽职守正是自由堡维持力量的根基。"
 dragonlord_ep3_confirmation_vassal_poorly_run:0 "议程一片混乱，书记官匆忙核对名册，各家代表也争相插话。这场授任几乎没有多少庄严可言。"
 dragonlord_ep3_confirmation_vassal_well_run:0 "各家代表依次就座，书记官准确宣读每一项职权与义务。无需跪拜与神授的辞藻，严整的程序本身便足以彰显自由堡的威严。"
 dragonlord_ep3_confirmation_vassal_gender:0 "主持首席议席之人的性别引来少数窃语，但诸龙王更关心的是[ROOT.Var('confirmation_liege').Char.GetSheHe]能否驾驭议程、维持家族间的均势。"
 dragonlord_ep3_confirmation_vassal_typical:0 "我被引至辖区代表的席位。随着传令官宣读我的姓名与领地，授任程序正式开始。"
 dragonlord_ep3_confirmation_vassal_hate:0 "[ROOT.Var('confirmation_liege').Char.GetTitleAsNameNoTooltip]冷淡地宣读我的职权，字句间毫不掩饰对我的不信任。权杖就在眼前，但周围诸家的目光比任何训斥都更加沉重。\n\n"
 dragonlord_ep3_confirmation_vassal_love:0 "[ROOT.Var('confirmation_liege').Char.GetTitleAsNameNoTooltip]以温和而郑重的语气宣读我的职权，并亲手向我展示辖区权杖。至少在这一刻，首席议席愿意公开支持我。\n\n"
 dragonlord_ep3_confirmation_vassal_meh:0 "[ROOT.Var('confirmation_liege').Char.GetTitleAsNameNoTooltip]依次确认新任辖区官员的权责，书记官记录誓言与见证者，终于轮到我走上议席之前。\n\n"
 dragonlord_ep3_confirmation_vassal_civilian:0 "“让[ROOT.Var('confirmation_vassal').Char.GetPrimaryTitle.GetNameNoTier]的市集、工坊与道路兴盛起来，”[ROOT.Var('confirmation_liege').Char.GetSheHe]说道，“繁荣是自由堡力量的另一副羽翼。”"
 dragonlord_ep3_confirmation_vassal_military:0 "“磨利[ROOT.Var('confirmation_vassal').Char.GetPrimaryTitle.GetNameNoTier]的剑，”[ROOT.Var('confirmation_liege').Char.GetSheHe]说道，“但只有议会与法律可以决定它应指向何方。”"
 dragonlord_ep3_confirmation_vassal_frontier:0 "“保持警醒，守住边界，”[ROOT.Var('confirmation_liege').Char.GetSheHe]说道，“[ROOT.Var('confirmation_vassal').Char.GetPrimaryTitle.GetNameNoTier]是自由堡疆域的盾牌。”"
 dragonlord_ep3_confirmation_vassal_core:0 "“你治理的是自由堡最受瞩目的辖区之一，”[ROOT.Var('confirmation_liege').Char.GetSheHe]说道，“其繁荣与秩序将被诸家共同审视。”"
 dragonlord_ep3_confirmation_vassal_naval:0 "“看守[ROOT.Var('confirmation_vassal').Char.GetPrimaryTitle.GetNameNoTierPossessive]的港口与海路，”[ROOT.Var('confirmation_liege').Char.GetSheHe]说道，“自由堡的财富与军势都离不开大海。”"
 dragonlord_ep3_confirmation_vassal_small:0 "“[ROOT.Var('confirmation_vassal').Char.GetPrimaryTitle.GetNameNoTier]或许不大，”[ROOT.Var('confirmation_liege').Char.GetSheHe]说，“但自由堡没有可以被疏忽的辖区。”"
 dragonlord_ep3_confirmation_vassal_big:0 "“[ROOT.Var('confirmation_vassal').Char.GetPrimaryTitle.GetNameNoTier]疆域广阔、事务繁重，”[ROOT.Var('confirmation_liege').Char.GetSheHe]说道，“你必须证明自己配得上这份托付。”"
 dragonlord_ep3_confirmation_vassal_balanced:0 "“你的职权源自自由堡的法律与议会的确认，”[ROOT.Var('confirmation_liege').Char.GetSheHe]说，“记住这一点，并妥善治理[ROOT.Var('confirmation_vassal').Char.GetPrimaryTitle.GetNameNoTier]。”"
 dragonlord_ep3_confirmation_vassal_outro:0 "\n\n我回答了书记官与诸家代表提出的问题，随后接过象征辖区职权的权杖，并在议事记录上留下自己的誓言。"
 dragonlord_ep3_confirmation_vassal_option:0 "我将不负自由堡所托。"

 dragonlord_ep3_confirmation_title_fallback:0 "$admin_confirmation_event_header$帝国之仆"
 dragonlord_ep3_confirmation_liege_desc_fallback:0 "我宫廷的官员们挤满了[ROOT.Char.Custom('GetThroneRoom')]，那里有一长列的帝国任命的官员们在等待。\n\n其中最引人注目的是[confirmation_vassal.GetTitledFirstName]·[confirmation_vassal.GetDynastyHouseName]，今天从[confirmation_vassal.GetCapitalLocation.GetNameNoTooltip]赶到这里。我的[ROOT.Char.Custom2('RelationToMeShort', confirmation_vassal)]负责治理[confirmation_vassal.GetPrimaryTitle.GetName]："
 dragonlord_ep3_confirmation_liege_hate_fallback:0 "\n\n即便是俯视[confirmation_vassal.GetTitledFirstNamePossessiveNoTooltip]的后脑，我也能感受到他燃烧的蔑视。这个[confirmation_vassal.GetWomanMan][second.Custom('quirk_neg_adverb')]低声诅咒……一边妄想着用[confirmation_vassal.GetHerHis]的权杖打死我。"
 dragonlord_ep3_confirmation_liege_love_fallback:0 "\n\n[confirmation_vassal.GetTitledFirstNameNoTooltip]正[second.Custom('quirk_pos_adverb')|U]进行仪式。拿起[confirmation_vassal.GetHerHis]的权杖，[second.Custom('quirk_pos_pp')]，[second.GetSheHe]宣誓忠诚效劳。"
 dragonlord_ep3_confirmation_liege_decrepit_fallback:0 "\n\n年岁如磨石般压在[confirmation_vassal.GetTitledFirstNameNoTooltip]的弯背上，[confirmation_vassal.GetHerHis|U]艰难地从跪拜中站起。这位年长者有丰富的经验可以借鉴……希望[confirmation_vassal.GetHerHis]还有一些年头可以继续施展。"
 dragonlord_ep3_confirmation_liege_young_fallback:0 "\n\n[confirmation_vassal.GetTitledFirstNameNoTooltip]面容稚嫩，几乎只能算个青年，[confirmation_vassal.GetHerHis]柔软双手紧握权杖进行仪式。对于这个人，许多方面有待证明……"
 dragonlord_ep3_confirmation_liege_skilled_fallback:0 "\n\n跪倒在我面前的这个[confirmation_vassal.GetWomanMan]以[confirmation_vassal.Custom('ComplimentAdjective')]手段统治。不论[confirmation_vassal.GetSheHe]拥护什么政治理念，不论[confirmation_vassal.GetHerHis]心中藏有什么秘密：[confirmation_vassal.GetTitledFirstNameNoTooltip]是[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]的骄傲。"
 dragonlord_ep3_confirmation_liege_incompetent_fallback:0 "\n\n根据报告，我现在确认任命的人会糟糕、[second.Custom('quirk_neg_adverb')]治理。然而，既然[confirmation_vassal.GetTitledFirstNameNoTooltip]无法做到[confirmation_vassal.GetSheHe]自己宣誓提供的完美服务，那么我再去蔑视[confirmation_vassal.GetSheHe]将毫无用处……"
 dragonlord_ep3_confirmation_liege_generic_fallback:0 "\n\n[confirmation_vassal.GetTitledFirstNameNoTooltip]深深鞠躬，拿起[confirmation_vassal.GetHerHis]象征权柄的手杖，誓言忠实地效劳[confirmation_vassal.GetHerHis]的[ROOT.Char.GetTitleAsNameNoTooltip]。"
 dragonlord_ep3_confirmation_liege_option_fallback:0 "“你要治理得当，[confirmation_vassal.GetTitleAsNameNoTooltip]。”"
 dragonlord_ep3_confirmation_vassal_desc_fallback:0 "在[confirmation_liege.GetCapitalLocation.GetTitle.GetNameNoTierPossessive]主要宫殿的[confirmation_liege.Custom('GetThroneRoom')]内，[confirmation_liege.GetTitledFirstNameRegnal]——[confirmation_liege.GetFaith.HighGodNamePossessive]在凡间的摄政——坐在华丽的宝座上。\n\n"
 dragonlord_ep3_confirmation_vassal_child_fallback:0 "在其他等待着的高级官员中，一个满脸粉刺的年轻人在[confirmation_liege.GetHerHis]的宝座上哀诉和扭动，真是相当奇怪。"
 dragonlord_ep3_confirmation_vassal_heretic_fallback:0 "这是个统治[confirmation_liege.GetCapitalLocation.GetCounty.GetFaith.GetAdherentNamePlural]的[confirmation_liege.GetPrimaryTitle.GetTierAsName]的异教徒。即便在这里，宫廷[confirmation_liege.GetFaith.PriestNeuterPlural]和教长们之间的气氛也很紧张。"
 dragonlord_ep3_confirmation_vassal_war_fallback:0 "当我们官员跪下并开始仪式时，军官们不耐烦地生着气。他们的战争似乎不太顾及我们的荣誉。"
 dragonlord_ep3_confirmation_vassal_poorly_run_fallback:0 "一片混乱中，我们官员被催促入位，宫廷众人窃笑不已，几乎没有进行任何仪式。"
 dragonlord_ep3_confirmation_vassal_well_run_fallback:0 "无数官员在列队等待；他们都充满敬畏，急切地跪在我们的君主面前。"
 dragonlord_ep3_confirmation_vassal_gender_fallback:0 "一个[confirmation_liege.GetWomanMan]登基。我们来访的官员被禁止直视我们的君主，这真是好事！"
 dragonlord_ep3_confirmation_vassal_typical_fallback:0 "我被引导加入高级官员的队列。在所有人的欢呼声、乐师的演奏声和传令官的传令声中，我们的盛大仪式开始了。"
 dragonlord_ep3_confirmation_vassal_hate_fallback:0 "[confirmation_liege.GetTitleAsNameNoTooltip][second.Custom('quirk_neg_adverb')]对我讲话；[confirmation_liege.GetSheHe]在我低头跪拜时低声吐出蔑视的言辞，我的徽章在上方晃动。\n\n"
 dragonlord_ep3_confirmation_vassal_love_fallback:0 "然而，当[confirmation_liege.GetTitleAsNamePossessiveNoTooltip]的声音温暖而[second.Custom('quirk_pos_adjective')]对我讲话，并向我展示我的徽章时，一切又显得不同。\n\n"
 dragonlord_ep3_confirmation_vassal_meh_fallback:0 "[confirmation_liege.GetTitleAsNameNoTooltip]依次对每位新任命的官员讲话，授予他们徽章并接受誓言，直到[confirmation_liege.GetSheHe]走到我面前。\n\n"
 dragonlord_ep3_confirmation_vassal_civilian_fallback:0 "“[confirmation_liege.GetFaith.PositiveAfterLife]的和平可能仍然存于[confirmation_vassal.GetPrimaryTitle.GetNameNoTier]，”[confirmation_liege.GetSheHe]说道，“这是一座花园，需要用心照料。”"
 dragonlord_ep3_confirmation_vassal_military_fallback:0 "“你要磨利[confirmation_vassal.GetPrimaryTitle.GetNameNoTier]的剑，”[confirmation_liege.GetSheHe]说道，“并且只让正义之人使用它。”"
 dragonlord_ep3_confirmation_vassal_frontier_fallback:0 "“少睡觉，”[confirmation_liege.GetSheHe]命令道，“坚守阵地。[confirmation_vassal.GetPrimaryTitle.GetNameNoTier]是所有[confirmation_liege.GetPrimaryTitle.GetAdjective]生灵的生死所在。”"
 dragonlord_ep3_confirmation_vassal_core_fallback:0 "“在[confirmation_vassal.GetPrimaryTitle.GetNameNoTier]，”[confirmation_liege.GetSheHe]说道，“你要成为[confirmation_liege.GetPrimaryTitle.GetTierAsNameNoTooltip]本身的象征。除了邪恶之人，很少有人能享有这种自由。”"
 dragonlord_ep3_confirmation_vassal_naval_fallback:0 "“在[confirmation_vassal.GetPrimaryTitle.GetNameNoTierPossessive]海岸的盐滩上，”[confirmation_liege.GetSheHe]说道，“闻到这个[confirmation_liege.GetPrimaryTitle.GetTierAsNameNoTooltip]的血腥味；看到她寡妇的泪水。”"
 dragonlord_ep3_confirmation_vassal_small_fallback:0 "“[confirmation_vassal.GetPrimaryTitle.GetNameNoTier]不大，”[confirmation_liege.GetSheHe]说，“但很重要。”"
 dragonlord_ep3_confirmation_vassal_big_fallback:0 "“像[confirmation_vassal.GetPrimaryTitle.GetNameNoTier]这样广阔的地区，”[confirmation_liege.GetSheHe]在正式致辞的间隙说道，“是一只巨兽，只有合适的主人才能驯服……”"
 dragonlord_ep3_confirmation_vassal_balanced_fallback:0 "“你的职位是由[confirmation_liege.GetFaith.HighGodName]和你的[confirmation_liege.GetTitleAsNameNoTooltip]授予的，”[confirmation_liege.GetSheHe]说，“记住这一点，并好好治理[confirmation_vassal.GetPrimaryTitle.GetNameNoTier]。”"
 dragonlord_ep3_confirmation_vassal_outro_fallback:0 "\n\n我妥善答复了所有问题。然后，深深地向我的君主鞠躬，最终拿起了代表省份权威的权杖。"
 dragonlord_ep3_confirmation_vassal_option_fallback:0 "向你致敬，[confirmation_liege.GetTitleAsNameNoTooltip]。"
