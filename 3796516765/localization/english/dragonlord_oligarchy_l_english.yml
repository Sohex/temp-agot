 dragonlord_council_proposal.1000.t:0 "Presenting the Motion"
 dragonlord_council_proposal.1000.desc:0 "The tiers of seats rise around me, and every Dragonlord's attention settles upon the motion awaiting judgment. Its clauses are already written; what remains is to decide how I shall frame them before the council."
 dragonlord_council_proposal.1000.a:0 "[diplomacy_i]Rouse the chamber with impassioned rhetoric"
 dragonlord_council_proposal.1000.b:0 "[stewardship_i]Lay out every cost and material benefit"
 dragonlord_council_proposal.1000.c:0 "[learning_i]Justify the motion through law and precedent"
 dragonlord_council_proposal.1000.d:0 "[martial_i]Command the chamber with unquestioned authority"

 dragonlord_council_proposal.1010.t:0 "A Challenge from the Benches"
 dragonlord_council_proposal.1010.desc:0 "Before I can finish, [dragonlord_council_critic.GetTitledFirstName] rises and publicly presses the most vulnerable point in the motion. Whispers spread along the benches. Unless I seize back the initiative at once, this interruption may overwhelm even the best-prepared address."
 dragonlord_council_proposal.1010.a:0 "[diplomacy_i]Meet the challenge and turn the critic into an audience"
 dragonlord_council_proposal.1010.b:0 "[stewardship_i]Let a clear reckoning of costs answer the objection"
 dragonlord_council_proposal.1010.c:0 "[learning_i]Cite the law and expose the objection's weakness"
 dragonlord_council_proposal.1010.d:0 "[martial_i]Impose order and refuse to surrender the floor"
 dragonlord_council_proposal.challenge.success:0 "You regain control of the chamber. Speech score: #P +10#!"
 dragonlord_council_proposal.challenge.failure:0 "Your answer fails to convince the chamber. Speech score: #N -10#!"
 dragonlord_council_proposal.1030.t:0 "The Chief Dragonlord's Address"
 dragonlord_council_proposal.1030.desc:0 "[host.GetTitledFirstName] is presenting the motion to the benches. The chamber remains quiet for now, but I could rise to challenge its weakest point in public—or listen in silence and leave the interruption to another Dragonlord."
 dragonlord_council_proposal.1030.a:0 "[diplomacy_i]Rise in opposition and challenge the Chief Dragonlord"
 dragonlord_council_proposal.1030.b:0 "Listen in silence"
 dragonlord_council_proposal.guest_challenge.success:0 "Your challenge wrong-foots the Chief Dragonlord. Their speech score falls by #N 10#!"
 dragonlord_council_proposal.guest_challenge.failure:0 "The Chief Dragonlord rebuts your challenge. Their speech score rises by #P 10#!"

 dragonlord_council_proposal.result.disastrous.t:0 "A Disaster"
 dragonlord_council_proposal.result.disastrous.desc:0 "The objections completely overwhelm my address. Open mockery and disappointment fill the benches; before discussion has even begun, the motion already bears a crippling burden.\n\nFinal speech score: #V [ROOT.Var('dragonlord_council_speech_score').GetValue|0]#!"
 dragonlord_council_proposal.result.poor.t:0 "A Poor Address"
 dragonlord_council_proposal.result.poor.desc:0 "I struggle through the prepared address without dispelling the chamber's doubts. Several Dragonlords who had been willing to listen now look firmly opposed.\n\nFinal speech score: #V [ROOT.Var('dragonlord_council_speech_score').GetValue|0]#!"
 dragonlord_council_proposal.result.weak.t:0 "Unconvincing"
 dragonlord_council_proposal.result.weak.desc:0 "The address is not without merit, but its gaps and hesitations prove more memorable than its arguments. The motion leaves a distinctly unfavorable first impression.\n\nFinal speech score: #V [ROOT.Var('dragonlord_council_speech_score').GetValue|0]#!"
 dragonlord_council_proposal.result.ordinary.t:0 "An Unremarkable Address"
 dragonlord_council_proposal.result.ordinary.desc:0 "My address reaches its end without stirring the benches. Its friends are no more fervent, and its opponents have found no fresh ammunition; the motion will enter discussion on precisely the footing it had before.\n\nFinal speech score: #V [ROOT.Var('dragonlord_council_speech_score').GetValue|0]#!"
 dragonlord_council_proposal.result.adequate.t:0 "A Serviceable Opening"
 dragonlord_council_proposal.result.adequate.desc:0 "I explain the motion clearly and contain the challenge from the benches. It is no triumph of oratory, but more Dragonlords are now willing to give the proposal serious consideration.\n\nFinal speech score: #V [ROOT.Var('dragonlord_council_speech_score').GetValue|0]#!"
 dragonlord_council_proposal.result.strong.t:0 "A Strong Address"
 dragonlord_council_proposal.result.strong.desc:0 "I hold the chamber's attention and turn the interruption into another opportunity to strengthen the motion. Approval and applause rise from several benches.\n\nFinal speech score: #V [ROOT.Var('dragonlord_council_speech_score').GetValue|0]#!"
 dragonlord_council_proposal.result.exceptional.t:0 "The Dragonlords Listen"
 dragonlord_council_proposal.result.exceptional.desc:0 "When my final words fall, the brief silence carries more force than cheering. Even the most exacting Dragonlords must concede that the motion has been presented with almost flawless command.\n\nFinal speech score: #V [ROOT.Var('dragonlord_council_speech_score').GetValue|0]#!"
 dragonlord_council_proposal.result.a:0 "Let the discussion begin."

