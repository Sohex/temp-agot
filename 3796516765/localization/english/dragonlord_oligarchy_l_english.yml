 dragonlord_council_discussion.2000.t:0 "A Public Challenge"
 dragonlord_council_discussion.2000.desc:0 "The discussion has barely begun when [dragonlord_council_discussion_speaker.GetTitledFirstName] rises to attack the motion at its most controversial point. The speaker's position is not yet immovable, but every eye in the chamber now waits upon my answer."
 dragonlord_council_discussion.2000.a:0 "[diplomacy_i]Acknowledge the concern, then lead the speaker to my conclusion"
 dragonlord_council_discussion.2000.b:0 "[learning_i]Dismantle the objection point by point"
 dragonlord_council_discussion.2000.c:0 "[martial_i]Silence this obstruction with authority"
 dragonlord_council_discussion.answer.success:0 "Your answer wins over the challenger"
 dragonlord_council_discussion.answer.failure:0 "Your answer only deepens the objection"
 dragonlord_council_discussion.command.success:0 "The challenger yields before your authority"
 dragonlord_council_discussion.command.failure:0 "Your threat provokes open defiance"
 dragonlord_council_discussion.speaker_support_plus_10_tt:0 "[dragonlord_council_discussion_speaker.GetShortUIName] gains #P 10#! support for this motion"
 dragonlord_council_discussion.speaker_support_minus_5_tt:0 "[dragonlord_council_discussion_speaker.GetShortUIName] loses #N 5#! support for this motion"
 dragonlord_council_discussion.speaker_support_plus_5_tt:0 "[dragonlord_council_discussion_speaker.GetShortUIName] gains #P 5#! support for this motion"
 dragonlord_council_discussion.speaker_support_minus_10_tt:0 "[dragonlord_council_discussion_speaker.GetShortUIName] loses #N 10#! support for this motion"

 dragonlord_council_discussion.2010.t:0 "The Motion Forgotten"
 dragonlord_council_discussion.2010.desc:0 "[dragonlord_council_disputant_1.GetTitledFirstName] and [dragonlord_council_disputant_2.GetTitledFirstName] clash over the meaning of a clause. Old grievances soon overwhelm the motion itself, while their followers trade insults across the chamber. Left alone, this private quarrel will swallow the entire discussion."
 dragonlord_council_discussion.2010.a:0 "[diplomacy_i]Mediate and return them to the motion"
 dragonlord_council_discussion.2010.b:0 "Endorse [dragonlord_council_disputant_1.GetFirstNameNoTooltip]'s reading"
 dragonlord_council_discussion.2010.c:0 "Endorse [dragonlord_council_disputant_2.GetFirstNameNoTooltip]'s reading"
 dragonlord_council_discussion.2010.d:0 "Let them quarrel"
 dragonlord_council_discussion.mediate.success:0 "You settle the dispute"
 dragonlord_council_discussion.mediate.failure:0 "Your mediation displeases both sides"
 dragonlord_council_discussion.both_support_plus_5_tt:0 "Both disputants gain #P 5#! support for this motion"
 dragonlord_council_discussion.both_support_minus_5_tt:0 "Both disputants lose #N 5#! support for this motion"
 dragonlord_council_discussion.side_1_tt:0 "[dragonlord_council_disputant_1.GetShortUIName] gains #P 10#! support; [dragonlord_council_disputant_2.GetShortUIName] loses #N 10#!"
 dragonlord_council_discussion.side_2_tt:0 "[dragonlord_council_disputant_2.GetShortUIName] gains #P 10#! support; [dragonlord_council_disputant_1.GetShortUIName] loses #N 10#!"
 dragonlord_council_discussion.2020.t:0 "Addressing the Benches"
 dragonlord_council_discussion.2020.desc:0 "The discussion is now fully under way. Every Dragonlord is weighing the motion, and I have a chance to shape the chamber: I can argue in its favor, warn of its dangers, or remain silent."
 dragonlord_council_discussion.2020.a:0 "[diplomacy_i]Speak in support of the motion"
 dragonlord_council_discussion.2020.b:0 "[diplomacy_i]Speak against the motion"
 dragonlord_council_discussion.2020.c:0 "Remain silent"
 dragonlord_council_discussion.guest_support.success:0 "Your speech wins a response from the chamber"
 dragonlord_council_discussion.guest_support.failure:0 "Your support fails to move the other benches"
 dragonlord_council_discussion.guest_opposition.success:0 "Your rebuttal shakes the chamber"
 dragonlord_council_discussion.guest_opposition.failure:0 "Your opposition fails to change any minds"
 dragonlord_council_discussion.guest_support_plus_5_tt:0 "Every attending voter except you gains #P 5#! support for this motion"
 dragonlord_council_discussion.guest_opposition_minus_5_tt:0 "Every attending voter except you loses #N 5#! support for this motion"

 dragonlord_council_persuasion.3000.t:0 "Winning an Opposing Vote"
 dragonlord_council_persuasion.3000.desc:0 "With the public discussion briefly adjourned, I find an opportunity to speak privately with [dragonlord_council_persuasion_target.GetTitledFirstName]. [dragonlord_council_persuasion_target.GetSheHe|U] still opposes the motion, but the position is not entirely immovable. With the right inducement, this opposing vote may yet be brought over to my side.\n\nCurrent support: #V [dragonlord_council_persuasion_target.MakeScope.ScriptValue('dragonlord_council_meeting_final_support')|0]#!"
 dragonlord_council_persuasion.3000.a:0 "[diplomacy_i]Reason patiently and appeal to our common interests"
 dragonlord_council_persuasion.3000.b:0 "[gold_i]Pay 200 Gold and promise a substantial consideration"
 dragonlord_council_persuasion.3000.c:0 "[intrigue_i]Explain the cost of standing against me"
 dragonlord_council_persuasion.3000.d:0 "This one is not worth my time"
 dragonlord_council_persuasion.reason.success:0 "Your argument sways the opponent"
 dragonlord_council_persuasion.reason.failure:0 "Your argument fails to dispel the doubts"
 dragonlord_council_persuasion.threat.success:0 "The opponent yields under pressure"
 dragonlord_council_persuasion.threat.failure:0 "The opponent refuses to bow to your threat"
 dragonlord_council_persuasion.support_plus_20_tt:0 "[dragonlord_council_persuasion_target.GetShortUIName] gains #P 20#! support for this motion"
 dragonlord_council_persuasion.support_plus_15_tt:0 "[dragonlord_council_persuasion_target.GetShortUIName] gains #P 15#! support for this motion"
 dragonlord_council_persuasion.support_plus_10_tt:0 "[dragonlord_council_persuasion_target.GetShortUIName] gains #P 10#! support for this motion"
 dragonlord_council_persuasion.support_minus_5_tt:0 "[dragonlord_council_persuasion_target.GetShortUIName] loses #N 5#! support for this motion"
 dragonlord_council_persuasion.support_minus_10_tt:0 "[dragonlord_council_persuasion_target.GetShortUIName] loses #N 10#! support for this motion"

 dragonlord_council_voting.passed.t:0 "The Motion Passes"
 dragonlord_council_voting.passed.desc:0 "When the final ballot is called, the result admits no dispute. The ayes command a majority, and the motion becomes a formal resolution of the Dragonlord Council.\n\nVotes in favor: #P [ROOT.Var('dragonlord_council_meeting_support_votes').GetValue|0]#!\nVotes against: #N [ROOT.Var('dragonlord_council_meeting_opposition_votes').GetValue|0]#!"
 dragonlord_council_voting.failed.t:0 "The Motion Is Rejected"
 dragonlord_council_voting.failed.desc:0 "The count is complete, and the motion has failed to secure a majority. Its opponents hold enough of the chamber.\n\nVotes in favor: #P [ROOT.Var('dragonlord_council_meeting_support_votes').GetValue|0]#!\nVotes against: #N [ROOT.Var('dragonlord_council_meeting_opposition_votes').GetValue|0]#!"
 dragonlord_council_voting.result.a:0 "The council has rendered its judgment."
 dragonlord_council_voting.passed.a:0 "As It Should Be"
 dragonlord_council_voting.guest_passed.a:0 "Let Us Hope This Is Right"
 dragonlord_council_voting.result.law:0 "[ROOT.Char.Custom('DragonlordCouncilSelectedLawGroupName')] changes from #high [ROOT.Char.Custom('DragonlordCouncilPreviousLawName')]#! to #high [ROOT.Char.Custom('DragonlordCouncilSelectedLawName')]#!."
 dragonlord_council_voting.result.law_failed:0 "The council authorized the law change, but the new law state could not be written; consult the error log."
 dragonlord_council_voting.result.development_county:0 "The [ROOT.Char.Custom('DragonlordCouncilDevelopmentProjectName')] plan for [dragonlord_council_result_county.GetNameNoTierNoTooltip] passes."
 dragonlord_council_voting.result.development_estate:0 "The [ROOT.Char.Custom('DragonlordCouncilDevelopmentProjectName')] plan for House [dragonlord_council_result_estate.GetHouse.GetBaseNameNoTooltip] passes."
 dragonlord_council_voting.result.war:0 "Gain a #high [ROOT.Char.Custom('DragonlordCouncilWarMotionName')]#! casus belli against [dragonlord_council_result_war_target.GetUIName]."
 dragonlord_council_voting.result.war_failed:0 "The war motion passes, but its target is no longer valid, so no casus belli is granted."
 dragonlord_council_voting.result.finance:0 "The treasury budget changes to #high [SCOPE.GetValue('dragonlord_result_budget_salary')|0]%#! salaries and #high [SCOPE.GetValue('dragonlord_result_budget_military')|0]%#! military spending."
 dragonlord_council_voting.4030.t:0 "Casting My Ballot"
 dragonlord_council_voting.4030.desc:0 "The debate and private lobbying are over, and the benches are being called in turn. This is no longer a declaration of sympathy, but the choice that will decide whether the motion becomes a resolution of the Dragonlord Council."
 dragonlord_council_voting.4030.a:0 "Vote in favor of the motion"
 dragonlord_council_voting.4030.b:0 "Vote against the motion"
 dragonlord_council_voting.guest_support_ballot_tt:0 "You cast your #V [ROOT.Var('dragonlord_council_meeting_vote_weight').GetValue|0]#! weighted votes in favor"
 dragonlord_council_voting.guest_opposition_ballot_tt:0 "You cast your #V [ROOT.Var('dragonlord_council_meeting_vote_weight').GetValue|0]#! weighted votes against"
 dragonlord_council_voting.guest_passed.desc:0 "When the final ballot is called, the outcome is beyond dispute. The ayes have won a majority, and the motion formally becomes a resolution of the Dragonlord Council.\n\nVotes in favor: #P [host.MakeScope.Var('dragonlord_council_meeting_support_votes').GetValue|0]#!\nVotes against: #N [host.MakeScope.Var('dragonlord_council_meeting_opposition_votes').GetValue|0]#!"
