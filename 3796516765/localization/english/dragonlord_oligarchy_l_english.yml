l_english:
 dragonlord_bureaucracy_opinion_penalty_1:0 "Dragonlord Oligarchy: Limited Administration"
 dragonlord_bureaucracy_opinion_penalty_1_desc:0 "The Dragonlords of the Freehold resent the tightening grip of the state"
 dragonlord_bureaucracy_opinion_penalty_2:0 "Dragonlord Oligarchy: Centralized Bureaucracy"
 dragonlord_bureaucracy_opinion_penalty_2_desc:0 "Centralization is eroding the ancient rights cherished by the Dragonlord Families"
 dragonlord_bureaucracy_opinion_penalty_3:0 "Dragonlord Oligarchy: Absolute Autocracy"
 dragonlord_bureaucracy_opinion_penalty_3_desc:0 "The First Lord's unchecked rule provokes fierce hostility throughout the Freehold"
 dragonlord_oligarchy_government:0 "Dragonlord Oligarchy"
 dragonlord_oligarchy_government_adjective:0 "Dragonlord Oligarchic"
 dragonlord_oligarchy_government_realm:0 "Valyria"
 dragonlord_oligarchy_government_desc:0 "#F Dragonfire forged the Freehold, and the Dragonlord Families command its fate. The First Lord presides over the council while ancient bloodlines contend for power and glory among the Topless Towers.#!"
 adopt_dragonlord_oligarchy_decision:0 "Adopt Dragonlord Oligarchy"
 adopt_dragonlord_oligarchy_decision_desc:0 "Let the Freehold rise from ash. The Dragonlord Families shall gather in council once more, and I shall take the first seat above them all."
 adopt_dragonlord_oligarchy_decision_tooltip:0 "Reforge the ancient order of Valyria in dragonfire"
 adopt_dragonlord_oligarchy_decision_confirm:0 "Restore the Freehold"
 adopt_dragonlord_oligarchy_decision_effect_tooltip:0 "Melt down every crown, summon the Forty Dragonlord Families, and raise Valyria from the ashes."
 summon_dragonlord_families_decision:0 "Summon the Dragonlord Families"
 summon_dragonlord_families_decision_desc:0 "The council has risen, yet its seats remain silent. Let the ancient bloodlines come before the Topless Towers and proclaim their rights in dragonfire."
 summon_dragonlord_families_decision_tooltip:0 "Call the Dragonlord Families to their council seats"
 summon_dragonlord_families_decision_confirm:0 "Summon the Dragonlords"
 summon_dragonlord_families_decision_effect_tooltip:0 "The Forty Dragonlord Families will receive their dignity titles in the council."
 dragonlord_family_name:0 "[Select_CString( CHARACTER.GetHouse.IsValid, CHARACTER.GetHouse.GetBaseNameNoTooltip, CHARACTER.GetNameNoTooltip)] Dragonlord Family"
 dragonlord_fourteen_dragonlords_house_modifier:0 "Fourteen Dragonlords"
 dragonlord_fourteen_dragonlords_house_modifier_desc:0 "As the true rulers at the heart of the Freehold, their power and wealth far surpass those of the peripheral Dragonlords. They command the greatest number of the largest and most ancient dragons, and monopolize the supreme voice in Valyria's highest council."
 government_has_fourteen_dragonlords:0 "Ruled by the [dragonlord_dragonlords|E]"
 government_forbids_kingdom_titles:0 "Cannot create Kingdoms"
 game_concept_dragonlord_fourteen_dragonlords:0 "Fourteen Dragonlords"
 game_concept_dragonlord_fourteen_dragonlords_desc:0 "As the true rulers at the heart of the Freehold, their power and wealth far surpass those of the peripheral Dragonlords. They command the greatest number of the largest and most ancient dragons, and monopolize the supreme voice in Valyria's highest council."
 game_concept_dragonlord_fourteen_dragonlords_attribute:0 "Fourteen Dragonlords Attribute"
 game_concept_dragonlord_fourteen_dragonlords_attribute_desc:0 "A $game_concept_dragonlord_fourteen_dragonlords_attribute$ is a set of bonuses associated with a [house|E] inside the [dragonlord_valyrian_freehold|E]. The Attribute benefits the members of the $game_concept_house$, as well as the [liege|E].\n\nAttributes are only active while the $game_concept_house$ is considered one of the [dragonlord_fourteen_dragonlords|E], and the $game_concept_family_attribute$ of the [dragonlord_chief_dragonlord|E] does not benefit their [liege|E].\n\nThe [house_head|E] can freely replace the Attribute at any given time."
 game_concept_dragonlord_dragonlords:0 "Dragonlords"
 game_concept_dragonlord_dragonlords_desc:0 "The $game_concept_dragonlord_dragonlords$ are the eminent freeholder families of the Valyrian Freehold who ride dragons. Though the Freehold is nominally governed by its landowning freeborn, wealth, sorcery, ancient blood, and dragons concentrate power in the hands of the dragonlord families and their factions."
 game_concept_dragonlord_chief_dragonlord:0 "Chief Dragonlord"
 game_concept_dragonlord_chief_dragonlord_desc:0 "The $game_concept_dragonlord_chief_dragonlord$ is the most powerful [dragonlord_dragonlords|E] family within the [dragonlord_valyrian_freehold|E]. Dragons, wealth, ancient blood, and faction place them at the head of the council—the mightiest of the Dragonlords, for the moment."
 game_concept_dragonlord_freeholders:0 "Freeholders"
 game_concept_dragonlord_freeholders_desc:0 "$game_concept_dragonlord_freeholders$ are freeborn landowners within the [dragonlord_valyrian_freehold|E], and therefore possess the right to sit in councils, govern their lands, and compete for office. Not every freeholder is a [dragonlord_dragonlords|E]."
 game_concept_dragonlord_freeholder_lands:0 "Freeholder Lands"
 game_concept_dragonlord_freeholder_lands_desc:0 "In Valyria, a freeholder is a freeborn owner of land and therefore possesses a voice in the government of the Freehold. The [dragonlord_dragonlords|E] belong to the same commonwealth, but dragons and ancient blood give them power far beyond that of ordinary freeholders."
 game_concept_dragonlord_lands:0 "Lands"
 game_concept_dragonlord_lands_desc:0 "$game_concept_dragonlord_lands$ are held and governed by [dragonlord_freeholders|E] within the [dragonlord_valyrian_freehold|E]. The lands of a Dragonlord Family also encompass estates, Topless Towers, and broad domains where dragons may dwell."
 game_concept_dragonlord_valyrian_freehold:0 "Valyrian Freehold"
 game_concept_dragonlord_valyrian_freehold_i:0 "@government_type_dragonlord_oligarchy!"
 game_concept_dragonlord_valyrian_freehold_desc:0 "The $game_concept_dragonlord_valyrian_freehold$ has neither king nor emperor. Every landowning [dragonlord_freeholders|E] has a voice in its government, but the true command of council and conquest rests with the dragon-riding [dragonlord_dragonlords|E] Families."
 game_concept_dragonlord_oligarchy:0 "Dragonlord Oligarchy"
 game_concept_dragonlord_oligarchy_i:0 "@government_type_dragonlord_oligarchy!"
 game_concept_dragonlord_oligarchy_desc:0 "$dragonlord_oligarchy_government_desc$"
 dragonlord_oligarchy_government_house_attribute_flavor_name:0 "[dragonlord_fourteen_dragonlords_attribute|E]"
 dragonlord_oligarchy_government_house_attribute_flavor_name_no_tooltip:0 "$game_concept_dragonlord_fourteen_dragonlords_attribute$"

