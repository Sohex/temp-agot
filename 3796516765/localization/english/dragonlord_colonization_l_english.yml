l_english:
 dragonlord_colonization:0 "Colonial War"
 dragonlord_colonization_cb:0 "Colonial War"
 DRAGONLORD_COLONIZATION_WAR_NAME:0 "$ORDER$[ATTACKER.GetPrimaryTitle.GetAdjective] Colonial War against [DEFENDER.GetPrimaryTitle.GetName]"
 DRAGONLORD_COLONIZATION_WAR_NAME_BASE:0 "[ATTACKER.GetPrimaryTitle.GetAdjective] [DEFENDER.GetPrimaryTitle.GetName]"
 dragonlord_colonization_cb_victory_desc:0 "[defender.GetShortUIName] submits to [attacker.GetShortUIName] with their lands and vassals, retaining the kingdom-tier title as a subordinate Free Trade City. After the war, [attacker.GetShortUIName] may retain the governor or appoint a newly generated High Valyrian successor."
 dragonlord_colonization_cb_white_peace_desc:0 "[defender.GetShortUIName] remains independent. Lands and titles remain unchanged."
 dragonlord_colonization_cb_defeat_desc:0 "[defender.GetShortUIName] remains independent; [attacker.GetShortUIName] loses prestige and pays war reparations."
 dragonlord_colonization.0001.t:0 "The City's Governor"
 dragonlord_colonization.0001.desc:0 "[dragonlord_colonial_city.GetName] has bowed to the Freehold. [dragonlord_colonial_governor.GetShortUIName] acknowledges my authority, bringing the city's lands and vassals under my rule.\n\nThe city's title will be preserved, but I must decide who will govern it. I may retain the incumbent or send a new governor from Valyria."
 dragonlord_colonization.0001.a:0 "Let [dragonlord_colonial_governor.GetFirstNameNoTooltip] continue to govern."
 dragonlord_colonization.0001.a.tt:0 "[dragonlord_colonial_governor.GetShortUIName] continues to rule [dragonlord_colonial_city.GetName] as your vassal."
 dragonlord_colonization.0001.b:0 "Appoint a High Valyrian successor."
 dragonlord_colonization.0001.b.tt:0 "Generate a High Valyrian governor to take over the city's title, personal domain and vassals. He becomes your vassal without receiving Dragonlord Family status."
