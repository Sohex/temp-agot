l_english:
 repair_living_dragon_personalities_decision:0 "Repair Dragon Personalities"
 repair_living_dragon_personalities_decision_desc:0 "A broken yearly dragon-development pulse prevented living dragons from developing the temperaments they should have acquired as they matured. Repair the missing personality traits without altering their congenital traits."
 repair_living_dragon_personalities_decision_tooltip:0 "Backfill missing dragon personality traits to the age-appropriate count: one at ages 3-5, two at ages 6-9, and three from age 10 onward."
 repair_living_dragon_personalities_decision_confirm:0 "Repair the Living Dragons"
 repair_living_dragon_personalities_decision_effect_tooltip:0 "Every eligible living dragon gains random missing personality traits up to the count appropriate for its current age. Dragons using scripted canon-trait development are left untouched when that game rule is active."
