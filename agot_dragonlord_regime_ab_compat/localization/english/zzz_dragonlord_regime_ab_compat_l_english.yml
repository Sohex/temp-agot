 dragonlord_ab_restore_dragon_throne_decision:0 "Restore the Dragon Throne"
 dragonlord_ab_restore_dragon_throne_decision_desc:0 "The constitutional reforms of the restored Freehold dissolved the Dragon Throne along with the lesser crowns of Valyria. Yet the Dragon Throne is not a territorial kingdom: it is the sacred office of the Jaedārys and the temporal headship of the Imperial Doctrine. Its dignity must be restored."
 dragonlord_ab_restore_dragon_throne_decision_tooltip:0 "Restore the Dragon Throne as the temporal Head of Faith of the Imperial Doctrine"
 dragonlord_ab_restore_dragon_throne_decision_confirm:0 "Restore the Sacred Office"
 dragonlord_ab_restore_dragon_throne_decision_effect_tooltip:0 "You regain the landless Dragon Throne title and the Jaedārys dignity without recreating a territorial kingdom."
