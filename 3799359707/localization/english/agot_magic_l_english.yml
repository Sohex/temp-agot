l_english:
 # DEBUG ONLY - remove before Workshop release
 agot_magic_debug_grant_everything_decision: "DEBUG: Awaken to All Powers"
 agot_magic_debug_grant_everything_decision_desc: "Testing only. Grants all 3 gifts and all 9 perks at once."
 agot_magic_debug_grant_everything_decision_confirm: "Grant everything?"
 agot_magic_debug_grant_everything_toast: "[ROOT.Char.GetNameNoTooltip] has been granted every magical gift and perk (debug)."

 # Shared requirement tooltips
 agot_magic_not_yet_awakened_tooltip: "You have not already been touched by a different tradition of magic"
 agot_magic_has_gift_tooltip: "You have been touched by the old magic"
 agot_magic_not_self_target_tooltip: "The target is not yourself"

 # Lifestyle
 agot_magic_lifestyle_name: "The Old Powers"
 agot_magic_lifestyle_desc: "A power most will never understand, and many would kill you for. Not everyone can walk this path - it takes an Awakening first, through blood, fire, or the old bonds of beast and man."
 agot_magic_lifestyle_highlight_desc: "You have been touched by the old magic and can walk this path."

 # Perk tree headers
 agot_rhllor_name: "R'hllor"
 agot_warging_name: "The Warg's Gift"
 agot_bloodmagic_name: "Blood Magic"

 # Lifestyle Focuses
 agot_magic_rhllor_focus: "Commune with the Flames"
 agot_magic_rhllor_focus_desc: "Spend your quiet hours staring into the sacred fire, listening for what it has to say. Progressing this path unlocks Ember Sight - the ability to seek visions in the flames - and deeper R'hllor perks beyond it."
 agot_magic_rhllor_focus_effect_desc: "Communing with the flames grants:"
 agot_magic_warging_focus: "Walk as the Beast"
 agot_magic_warging_focus_desc: "Spend your quiet hours deep in the mind of your bonded animal, learning to move as one. Progressing this path unlocks Beast Bond and, later, the ability to send your beast to spy on others and slip into their minds."
 agot_magic_warging_focus_effect_desc: "Walking as the beast grants:"
 agot_magic_bloodmagic_focus: "Study the Old Rites"
 agot_magic_bloodmagic_focus_desc: "Spend your quiet hours poring over the old rites, learning what blood may buy. Progressing this path unlocks the First Rite - the ability to cast a blood curse on someone - and darker rites beyond it."
 agot_magic_bloodmagic_focus_effect_desc: "Studying the old rites grants:"

 # Corruption traits
 agot_wolf_touched: "Wolf-Touched"
 agot_wolf_touched_desc: "Too many nights spent behind a beast's eyes have left their mark. There is something feral in how they move, in how they look at you - not quite a man anymore, not quite a wolf."
 agot_shadow_scarred: "Shadow-Scarred"
 agot_shadow_scarred_desc: "The flames have shown them too much. They flinch from fire and speak sometimes of things that have not happened yet - or have not happened again."
 agot_blood_cursed: "Blood-Cursed"
 agot_blood_cursed_desc: "The old rites have taken more than they gave. Their blood runs thinner now, and children do not come easily to those who spill it for power."

 # Toasts - Vision spell
 agot_magic_vision_success_toast: "[ROOT.Char.GetNameNoTooltip] sees clearly in the flames: less stress, and enemy schemes will falter (1 year)."
 agot_magic_vision_failure_toast: "[ROOT.Char.GetNameNoTooltip]'s vision shows nothing but smoke - the attempt has cost them stress."

 # Toasts - Awakening
 agot_magic_awakened_rhllor_toast: "[ROOT.Char.GetNameNoTooltip] has seen the truth in the flames. R'hllor's gift has awoken in them."
 agot_magic_awakened_warging_toast: "[ROOT.Char.GetNameNoTooltip] has felt another mind brush against their own. The warg's gift has awoken in them."
 agot_magic_awakened_blood_toast: "[ROOT.Char.GetNameNoTooltip] has learned what blood may buy. The old rites have awoken in them."

 # Toasts - Failure
 agot_magic_seek_gift_failure_toast: "[ROOT.Char.GetNameNoTooltip]'s search for the old powers has led nowhere - for now."

 # Toasts - Corruption
 agot_magic_corruption_warging_toast: "[ROOT.Char.GetNameNoTooltip] has spent too long as a beast. Something of the wolf has stayed with them."
 agot_magic_corruption_rhllor_toast: "[ROOT.Char.GetNameNoTooltip] has stared into the flames too often. Something of the fire has stayed with them."
 agot_magic_corruption_blood_toast: "[ROOT.Char.GetNameNoTooltip] has spilled too much blood for power. Something of the rite has stayed with them."

 ############################################
 # Decisions
 ############################################

 agot_magic_seek_rhllor_decision: "Seek the Gift of R'hllor"
 agot_magic_seek_rhllor_decision_desc: "It is said the Red God grants sight of what is, what was, and what may yet be to those who prove themselves worthy - and burns those who do not. To seek His gift is to stare into the flames until they answer back."
 agot_magic_seek_rhllor_decision_tooltip: "You will stare into the sacred flames and open yourself to R'hllor. This is not without risk - the Lord of Light does not suffer the unworthy gladly."
 agot_magic_seek_rhllor_decision_confirm: "Stare into the flames and seek R'hllor's gift?"

 agot_magic_seek_warging_decision: "Seek the Warg's Gift"
 agot_magic_seek_warging_decision_desc: "The old blood remembers what it is to run on four legs, to see through other eyes. Some say it is a gift of the First Men and the children of the forest both - one that must be reached for in dream and blood and old, old trees."
 agot_magic_seek_warging_decision_tooltip: "You will seek out the old ways of the greenseers and the wargs. Reaching too far into another mind carries its own dangers."
 agot_magic_seek_warging_decision_confirm: "Seek out the old ways of the wargs?"

 agot_magic_seek_bloodmagic_decision: "Seek the Old Rites"
 agot_magic_seek_bloodmagic_decision_desc: "Only death pays for life. Somewhere - in a market stall in Vaes Dothrak, a hovel in the Riverlands, a cell beneath a keep - there is always someone willing to teach the old rites, for a price."
 agot_magic_seek_bloodmagic_decision_tooltip: "You will seek out a practitioner of blood magic willing to teach you. Word of such dealings has a way of spreading."
 agot_magic_seek_bloodmagic_decision_confirm: "Seek out a practitioner of the old rites?"

 agot_magic_open_spellbook_decision: "Consult Your Gift"
 agot_magic_open_spellbook_decision_desc: "You carry a power that most will never understand and many would kill you for. Consider what you have learned, and what you might yet dare to do with it."
 agot_magic_open_spellbook_decision_tooltip: "Open a private reckoning of your magical gifts and the workings available to you. Spells that require a target are cast from that character's own portrait, not from here."
 agot_magic_open_spellbook_decision_confirm: "Consult what you have learned?"

 ############################################
 # Perks
 ############################################

 agot_rhllor_ember_sight_perk_name: "Ember Sight"
 agot_rhllor_ember_sight_perk_desc: "You have learned to read the shapes the flames make - a warning here, a name there, a shadow of a thing to come."
 agot_rhllor_ember_sight_perk_effect_text: "Unlocks the 'Seek a Vision' option in your Spellbook (opened via the Consult Your Gift decision)."

 agot_rhllor_shadow_of_the_lord_perk_name: "Shadow of the Lord of Light"
 agot_rhllor_shadow_of_the_lord_perk_desc: "R'hllor's priests have long known that the God of Flame and Shadow can be asked for darker favors than visions alone."
 agot_rhllor_shadow_of_the_lord_perk_effect_text: "The Lord of Light's favor makes your own hostile schemes harder to stop."

 agot_rhllor_herald_of_dawn_perk_name: "Herald of the Dawn"
 agot_rhllor_herald_of_dawn_perk_desc: "You are further along the path than almost anyone alive. Whatever is coming in the long night, you mean to be ready for it."
 agot_rhllor_herald_of_dawn_perk_effect_text: "Those around you sense the fire in you - your presence inspires more fear, and R'hllor rewards your devotion with piety."

 agot_warging_beast_bond_perk_name: "Beast Bond"
 agot_warging_beast_bond_perk_desc: "You have bonded with an animal companion, and it watches over you as much as you watch through it."
 agot_warging_beast_bond_perk_effect_text: "Your bonded animal's calm settles over you as well, easing your mind in troubled times."

 agot_warging_second_sight_perk_name: "Second Sight"
 agot_warging_second_sight_perk_desc: "You can send your senses out through your bonded animal to watch someone from afar. This unlocks the 'Send Your Beast to Watch' interaction on other characters."
 agot_warging_second_sight_perk_effect_text: "Unlocks the 'Send Your Beast to Watch' interaction on other characters, and makes it harder for others to scheme against you unseen."

 agot_warging_mastery_perk_name: "Mastery of the Warg's Gift"
 agot_warging_mastery_perk_desc: "You have gone further than almost any warg dares - into the minds of other people, if only for a moment. This unlocks the 'Slip Into Their Mind' interaction on other characters."
 agot_warging_mastery_perk_effect_text: "Unlocks the 'Slip Into Their Mind' interaction on other characters, and sharpens your own schemes."

 agot_bloodmagic_first_rite_perk_name: "The First Rite"
 agot_bloodmagic_first_rite_perk_desc: "You have performed the old rites once, and lived. This unlocks the 'Cast a Blood Curse' interaction on other characters."
 agot_bloodmagic_first_rite_perk_effect_text: "Unlocks the 'Cast a Blood Curse' interaction on other characters - a curse paid for with your own strength, or worse, if the rite turns against you."

 agot_bloodmagic_life_for_life_perk_name: "Life for a Life"
 agot_bloodmagic_life_for_life_perk_desc: "You understand the old law better than most: nothing is given that is not first taken away."
 agot_bloodmagic_life_for_life_perk_effect_text: "You have learned exactly what a plan is worth in blood - your own schemes succeed more often."

 agot_bloodmagic_old_rites_perk_name: "The Old Rites"
 agot_bloodmagic_old_rites_perk_desc: "Few are willing to pay what you have paid, again and again, for this power. Fewer still would dare to stand against you for it."
 agot_bloodmagic_old_rites_perk_effect_text: "Word of what you have done - and what you are capable of - spreads swiftly. Others fear you more easily now."

 ############################################
 # Interactions
 ############################################

 agot_bloodmagic_curse_interaction: "Cast a Blood Curse"
 agot_bloodmagic_curse_interaction_desc: "You will spend your own strength to work a curse against [recipient.GetNameNoTooltip]. Blood magic is nearly impossible to prove - but it is not without cost, and not always obedient to the caster's will."
 agot_bloodmagic_curse_interaction_notification: "[ROOT.Char.GetNameNoTooltip] has worked a blood curse against an enemy."
 agot_bloodmagic_curse_outcome_infertility: "The curse takes root quietly - children will not come easily to them now."
 agot_bloodmagic_curse_outcome_wasting: "The curse takes root as a wasting sickness, slow and undeniable."
 agot_bloodmagic_curse_outcome_backfire: "The rite turns in your hands. Only death pays for life - and this time, it demanded yours."

 agot_warging_scout_interaction: "Send Your Beast to Watch"
 agot_warging_scout_interaction_desc: "You will send your bonded animal to watch over [recipient.GetNameNoTooltip] from the shadows, gaining a clearer sense of the dangers around you."
 agot_warging_scout_interaction_notification: "[ROOT.Char.GetNameNoTooltip]'s bonded animal has been watching someone from the shadows."

 agot_warging_sway_interaction: "Slip Into Their Mind"
 agot_warging_sway_interaction_desc: "You will reach into [recipient.GetNameNoTooltip]'s mind for the briefest moment, trying to bend their feelings toward you. Few wargs have gone this far - and not all of them came back untouched."
 agot_warging_sway_interaction_notification: "[ROOT.Char.GetNameNoTooltip] has slipped into someone else's mind."
 agot_warging_sway_outcome_success: "For a moment, you saw the world through their eyes - and left something of yourself behind."
 agot_warging_sway_outcome_failure: "Their mind resists, and pulling free costs you more than you expected."

 ############################################
 # Events
 ############################################

 agot_magic.0001.t: "The Old Powers"
 agot_magic.0001.desc.intro: "You sit alone with what you have learned - a power most will never understand, and many would kill you for."
 agot_magic.0001.desc.rhllor: "R'hllor's fire burns in you still, showing you glimpses of what is to come, for whatever price it asks in return."
 agot_magic.0001.desc.warging: "You feel the old bond with the beast that shares your senses, and the memory of every mind you have brushed against."
 agot_magic.0001.desc.blood: "You know what blood may buy, and what it costs - a lesson few survive learning twice."
 agot_magic.0001.a: "Seek a vision in the flames"
 agot_magic.0001.a.vision_good: "The flames part, and for a moment you see clearly."
 agot_magic.0001.a.vision_bad: "The flames show you nothing but smoke, and the effort leaves you shaken."
 agot_magic.0001.close: "Close the book"

 agot_magic.0005.t: "Whispers"
 agot_magic.0005.desc: "Word of your failed dealings with powers better left alone has reached ears you would rather it hadn't."
 agot_magic.0005.a: "Deny everything"
 agot_magic.0005.b: "Let them talk"

 agot_magic.0010.t: "Caught in the Act"
 agot_magic.0010.desc: "You were seen. It does not matter that the spell worked, or that it did not - what matters is that you were seen, and now people are talking."
 agot_magic.0010.a: "Face your liege's suspicion"
 agot_magic.0010.b: "Weather the rumors"

 ############################################
 # Modifiers
 ############################################

 agot_magic_vision_foresight_modifier: "Touched by Foresight"
 agot_magic_blood_curse_infertility_modifier: "Cursed Womb"
 agot_magic_blood_curse_wasting_modifier: "Wasting Curse"
 agot_magic_blood_curse_backfire_modifier: "The Rite's Price"
 agot_magic_blood_price_modifier: "Paid in Blood"
 agot_magic_warg_swayed_opinion: "Strangely Fond"

 ############################################
 # Acquisition event chains
 ############################################

 # R'hllor
 agot_magic.0030.t: "The Call of the Flame"
 agot_magic.0030.desc: "Word reaches you of a red priest willing to test whether R'hllor has marked you for His own. If you mean to find out, the sacred fire is waiting - it will not wait forever."
 agot_magic.0030.a: "Go to the sacred fire"
 agot_magic.0030.b: "Not now"

 agot_magic.0031.t: "The Trial of Flame"
 agot_magic.0031.desc: "The priest builds the fire high and bids you look into it without blinking, without flinching, until the flames either answer or burn you for your presumption."
 agot_magic.0031.a: "Stare into the flames"
 agot_magic.0031.b: "Turn back"

 agot_magic.0032.t: "What Is Written in the Fire"
 agot_magic.0032.desc: "The heat presses against your face. Shapes begin to move in the flames - or is it only your own eyes playing tricks after too long staring?"
 agot_magic.0032.a: "Hold your gaze"
 agot_magic.0032.a.success: "The shapes resolve into something real. R'hllor has answered."
 agot_magic.0032.a.failure: "The flames show you nothing but smoke and your own reflection, distorted and strange."

 # Warging
 agot_magic.0040.t: "The Call of the Old Gods"
 agot_magic.0040.desc: "An old greenseer, or one who claims to be, offers to guide you toward the bond between man and beast - if you are willing to open your mind to it."
 agot_magic.0040.a: "Seek out the old gods"
 agot_magic.0040.b: "Not now"

 agot_magic.0041.t: "The Bonding Rite"
 agot_magic.0041.desc: "You are led to a quiet place beneath a weirwood, an animal brought before you. The old ways are explained plainly: to open your mind to a beast is to risk losing a piece of yourself inside it."
 agot_magic.0041.a: "Open yourself to the beast"
 agot_magic.0041.b: "Turn back"

 agot_magic.0042.t: "Beast and Man"
 agot_magic.0042.desc: "You close your eyes and reach outward, past your own skin, toward the animal's mind. For a moment you are not sure which thoughts are yours and which are not."
 agot_magic.0042.a: "Reach for the beast's mind"
 agot_magic.0042.a.success: "The bond takes. You feel the beast's mind settle against your own, distinct but joined."
 agot_magic.0042.a.failure: "The bond will not take - or takes too well, and it takes a long, disorienting while to find your way fully back to yourself."

 # Blood Magic
 agot_magic.0050.t: "The Whispered Invitation"
 agot_magic.0050.desc: "Someone who claims to know the old rites offers to teach you what blood may buy - if you are willing to pay the price yourself, rather than someone else's."
 agot_magic.0050.a: "Seek out the old rites"
 agot_magic.0050.b: "Not now"

 agot_magic.0051.t: "The Price to Be Paid"
 agot_magic.0051.desc: "A blade is laid before you, plain and unadorned. You are told exactly what the rite demands: not another's blood, but your own, and no small amount of it."
 agot_magic.0051.a: "Pay the price"
 agot_magic.0051.b: "Turn back"

 agot_magic.0052.t: "The First Rite"
 agot_magic.0052.desc: "The blade opens your skin. Blood runs, and with it - perhaps - power. Or perhaps only blood, and a wound you will have to explain."
 agot_magic.0052.a: "Open your own blood"
 agot_magic.0052.a.success: "The old rite answers. You feel it settle into you like a debt now owed both ways."
 agot_magic.0052.a.failure: "The rite takes more than it gives back. You are left weak, shaking, and no closer to power than before."

 ############################################
 # Casting chains
 ############################################

 # Blood Magic - Cast a Blood Curse: 0060 (the working) -> 0061 (the toll)
 agot_magic.0060.t: "The Working"
 agot_magic.0060.desc: "A curse is not simply willed into being - blood magic asks for something of the target's own first, taken or given, before it will answer."
 agot_magic.0060.a: "A lock of their hair, stolen or bought"
 agot_magic.0060.b: "Something closer - blood, taken in secret"
 agot_magic.0060.c: "Let it go"

 agot_magic.0061.t: "Paid in Blood"
 agot_magic.0061.desc: "You have what the rite needs. Now it is only a matter of opening your own vein and asking the old power to do the rest - and hoping it listens to what you ask, and not something worse."
 agot_magic.0061.a: "Open your own blood"

 # Warging - Send Your Beast to Watch: 0070 (sent out) -> 0071 (the report)
 agot_magic.0070.t: "Sent Out"
 agot_magic.0070.desc: "Your bonded animal slips away at your unspoken command, drawn toward the one you mean to watch."
 agot_magic.0070.a: "Wait for its return"
 agot_magic.0070.b: "Call it back early"

 agot_magic.0071.t: "The Report"
 agot_magic.0071.desc.a: "It watched from the rafters of their own hall, unnoticed, through the whole of an evening."
 agot_magic.0071.desc.b: "It followed at a careful distance for the better part of a day, keeping always to the shadows."
 agot_magic.0071.desc.c: "It kept to the treeline outside their walls, patient as only an animal can be."
 agot_magic.0071.a: "Receive its report"

 # Warging - Slip Into Their Mind: 0080 (reaching in) -> 0081 (the attempt)
 agot_magic.0080.t: "Reaching In"
 agot_magic.0080.desc: "For the briefest moment you might slip past the walls of another person's mind, the way you slip into your bonded animal's - if you dare it, and if they do not notice you there."
 agot_magic.0080.a: "Reach for their mind"
 agot_magic.0080.b: "Pull back"

 agot_magic.0081.t: "The Attempt"
 agot_magic.0081.desc: "Their mind is close now, closer than it should be. One more push and you will be inside it - or you will feel exactly how hard a mind can push back."
 agot_magic.0081.a: "Slip in"
