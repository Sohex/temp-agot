l_english:
 # AGOT: Magic of Westeros v3 - Faceless Men (Vielgesichtiges Spiel)

 # Toast
 agot_faceless_gift_granted_toast: "[ROOT.Char.GetNameNoTooltip] has been Awakened to the Many-Faced God's service."

 # Perk tree header
 agot_faceless_name: "The Many-Faced God"

 # Perks
 agot_faceless_novice_perk_name: "Novice"
 agot_faceless_novice_perk_desc: "You have learned the first lesson of the House of Black and White: a girl - or boy - is no one, and no one can become anyone."
 agot_faceless_novice_perk_effect_text: "Unlocks the path of the Many-Faced God and the Faceless Novice focus."

 agot_faceless_many_faces_perk_name: "Many Faces"
 agot_faceless_many_faces_perk_desc: "You have learned to wear a face not your own, and to make death itself look like nothing more than an ending that was always coming."
 agot_faceless_many_faces_perk_effect_text: "Unlocks the 'Issue a Contract' interaction against any known character, anywhere - no travel or relation required."

 agot_faceless_valar_morghulis_perk_name: "Valar Morghulis"
 agot_faceless_valar_morghulis_perk_desc: "All men must die. You have simply come to understand, better than almost anyone alive, how many ways there are to make that true a little early."
 agot_faceless_valar_morghulis_perk_effect_text: "Reduces the chance your own schemes are discovered."

 # Focus
 agot_magic_faceless_focus: "Faceless Novice"
 agot_magic_faceless_focus_desc: "Spend your days practicing the art of being no one at all - a blank face, a blank name, a blank slate for whatever face is needed next."
 agot_magic_faceless_focus_effect_desc: "Faceless Novice grants:"

 # Trait
 agot_faceless_hunted: "Hunted by the Guild"
 agot_faceless_hunted_desc: "They owe the Many-Faced God a debt they refused to pay - and somewhere, a face that is not the one they know is already being prepared for them."

 # Interaction
 agot_faceless_issue_a_contract_interaction: "Issue a Contract"
 agot_faceless_issue_a_contract_interaction_desc: "For a price only the Guild itself knows, [recipient.GetNameNoTooltip]'s death can be arranged to look like nothing more than an ending that was always coming."
 agot_faceless_issue_a_contract_notification: "[ROOT.Char.GetNameNoTooltip] has issued a contract through the Many-Faced God's servants."

 # Decision
 agot_faceless_seek_the_guild_decision: "Seek the House of Black and White"
 agot_faceless_seek_decision_desc: "In Braavos, at the top of a hill overlooking the canals, there is a temple with doors of black and white wood - and it is said that those who truly wish to serve Him of Many Faces are never turned away, whatever their birth."
 agot_faceless_seek_decision_tooltip: "You will travel to Braavos and present yourself at the House of Black and White. Not everyone who drinks from the black pool wakes up again."
 agot_faceless_seek_the_guild_decision_confirm: "Travel to Braavos?"

 # Acquisition event chain
 agot_faceless.0098.t: "The Doors of Black and White"
 agot_faceless.0098.desc: "You have heard, as everyone in the Free Cities eventually does, of the temple in Braavos that serves the Many-Faced God - and of the guild of killers who call themselves no one at all."
 agot_faceless.0098.a: "Travel to Braavos"
 agot_faceless.0098.b: "Not now"

 agot_faceless.0099.t: "A Girl Is No One"
 agot_faceless.0099.desc: "A priest in a hood meets you inside the temple. 'If you wish to serve, you must first stop being who you are,' they tell you. 'Your name, your face, your grudges - all of it must go into the black pool before anything is given back.'"
 agot_faceless.0099.a: "Give up your name"
 agot_faceless.0099.b: "Turn back"

 agot_faceless.0101.t: "The Black Pool"
 agot_faceless.0101.desc: "You kneel at the edge of the pool. The water is perfectly still, and perfectly black, and for a long moment you cannot tell if you are looking down into it or if something down there is looking up."
 agot_faceless.0101.a: "Drink from the pool"
 agot_faceless.0101.a.success: "The water burns going down, cold and bitter, and for an instant you are certain you are dying. Then it passes, and you understand - dimly, the way you understand a dream after waking - that you are no one now, and no one can become anyone."
 agot_faceless.0101.a.failure: "The water sits in your stomach like a stone, and nothing happens - except that you are certain, walking back out into the Braavosi night, that you are being watched."

 # Issuing a contract: 0104 (the Guild's price) -> 0105 (contract made)
 agot_faceless.0104.t: "The Guild's Price"
 agot_faceless.0104.desc: "A servant you do not remember hiring passes you a folded note without a word. Inside, a price is named - and beneath it, a single line: 'A man may also do this himself, if a man is fool enough.'"
 agot_faceless.0104.a: "Pay their price"
 agot_faceless.0104.b: "Refuse - do it yourself"
 agot_faceless.0104.c: "Call the whole thing off"

 agot_faceless.0105.t: "No One Sees a Contract Made"
 agot_faceless.0105.desc: "There is no ceremony to it in the end - a word passed in a crowded street, a coin changing hands, a name spoken once and never again. It is done."
 agot_faceless.0105.a: "So be it"

 # Debt choice event
 agot_faceless.0102.t: "A Man Must Pay"
 agot_faceless.0102.desc: "A face you do not recognize finds you in a crowd and speaks a single sentence before disappearing again: 'A man has taken much from the Many-Faced God, and paid nothing back. It is time.'"
 agot_faceless.0102.a: "Pay with coin and pride"
 agot_faceless.0102.b: "Refuse to pay"
