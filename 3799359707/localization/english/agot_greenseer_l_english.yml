l_english:
 # AGOT: Magic of Westeros v3 - Greenseer (Grünes Netz)
 # Kept in its own file, v1/v2 loc files untouched.

 # Toast
 agot_greenseer_gift_granted_toast: "[ROOT.Char.GetNameNoTooltip] has been Awakened to the Green Sight."

 # Perk tree header
 agot_greenseer_name: "The Green Sight"

 # Perks
 agot_greenseer_awakened_sight_perk_name: "Awakened Sight"
 agot_greenseer_awakened_sight_perk_desc: "The weirwoods have opened their eyes to you. You feel the roots beneath the earth, reaching further than any living thing has a right to."
 agot_greenseer_awakened_sight_perk_effect_text: "Unlocks the path of the Green Sight, the 'Scry' decision, and the Green Sight focus."

 agot_greenseer_truthseer_perk_name: "Truthseer"
 agot_greenseer_truthseer_perk_desc: "You have learned to look past a person's face to the truth of what moves beneath it - including the old magics others carry in secret."
 agot_greenseer_truthseer_perk_effect_text: "Unlocks the 'See the Truth' interaction, revealing whether a chosen character is touched by any tradition of magic."

 agot_greenseer_third_eye_perk_name: "The Third Eye"
 agot_greenseer_third_eye_perk_desc: "You no longer merely watch through the trees - in your deepest trances, you can, for a terrible moment, move as the children of the forest once did."
 agot_greenseer_third_eye_perk_effect_text: "Unlocks the 'Hammer of the Waters' interaction against an enemy at war with you - a desperate, world-scarring ritual, usable rarely."

 # Focus
 agot_magic_greenseer_focus: "Wehrwood Communion"
 agot_magic_greenseer_focus_desc: "Spend your quiet hours beneath the pale branches, letting the red eyes carved into the bark watch you as you watch them back."
 agot_magic_greenseer_focus_effect_desc: "Wehrwood Communion grants:"

 # Modifier
 agot_greenseer_flooded_county_modifier: "Scarred by the Hammer of the Waters"

 # Trait
 agot_greenseer_bound_to_the_tree: "Bound to the Tree"
 agot_greenseer_bound_to_the_tree_desc: "They gave themselves to the weirwood net at last. Their body still walks and speaks, but more and more of them lives somewhere else - in root and bark and a thousand watching red eyes."

 # Interaction: See the Truth
 agot_greenseer_see_the_truth_interaction: "See the Truth"
 agot_greenseer_see_the_truth_interaction_desc: "You will look past [recipient.GetNameNoTooltip]'s face to whatever truth lies beneath it - including whether the old magic has touched them."
 agot_greenseer_see_the_truth_found_rhllor_toast: "The trees show you the truth: [recipient.GetNameNoTooltip] carries the gift of R'hllor."
 agot_greenseer_see_the_truth_found_warging_toast: "The trees show you the truth: [recipient.GetNameNoTooltip] carries the gift of the warg."
 agot_greenseer_see_the_truth_found_blood_toast: "The trees show you the truth: [recipient.GetNameNoTooltip] carries the old blood magic."
 agot_greenseer_see_the_truth_found_drowned_toast: "The trees show you the truth: [recipient.GetNameNoTooltip] has been touched by the Drowned God."
 agot_greenseer_see_the_truth_found_faceless_toast: "The trees show you the truth: [recipient.GetNameNoTooltip] serves the Many-Faced God."
 agot_greenseer_see_the_truth_found_shadow_toast: "The trees show you the truth: [recipient.GetNameNoTooltip] has bound a shadow to their will."
 agot_greenseer_see_the_truth_found_nothing_toast: "The trees show you nothing - whatever [recipient.GetNameNoTooltip] hides, it is not the old magic."

 # Interaction: Hammer of the Waters
 agot_greenseer_hammer_of_the_waters_interaction: "Call the Hammer of the Waters"
 agot_greenseer_hammer_of_the_waters_interaction_desc: "The children of the forest once broke the very arm of Dorne to stop an invasion. You do not have their numbers, but you have their old rite - and a war to end."
 agot_greenseer_hammer_of_the_waters_notification: "[ROOT.Char.GetNameNoTooltip] has called the Hammer of the Waters upon an enemy's lands."
 agot_greenseer_hammer_must_be_at_war_tooltip: "You must be at war with this character"

 # Decision: Seek the Weirwood's Wisdom
 agot_greenseer_seek_the_wisdom_decision: "Seek the Weirwood's Wisdom"
 agot_greenseer_seek_decision_desc: "Somewhere in the deep wood, a weirwood waits with a face carved into its bark. It is said that those with the right blood can hear it, if they are willing to listen long enough."
 agot_greenseer_seek_decision_tooltip: "You will seek out a weirwood and open your mind to it. Not everyone who tries comes away with the gift - and those who fail are not entirely unchanged."
 agot_greenseer_seek_the_wisdom_decision_confirm: "Seek out a weirwood?"

 # Decision: Scry
 agot_greenseer_scry_decision: "Scry Through the Green"
 agot_greenseer_scry_decision_desc: "Close your eyes, and let your sight drift out past your own into every root and branch and leaf around your court."
 agot_greenseer_scry_decision_tooltip: "You will sense whether anyone close to you carries the old magic - though not who, or which kind. For that, you need a clearer sight."
 agot_greenseer_scry_decision_confirm: "Scry through the green?"
 agot_greenseer_scry_sensed_toast: "Your sight drifts through root and branch - somewhere close to your court, someone of low standing carries a magic they have not shown you."
 agot_greenseer_scry_sensed_landed_toast: "Your sight drifts through root and branch - someone of rank and title close to your court carries a magic they have not shown you."
 agot_greenseer_scry_nothing_toast: "Your sight drifts through root and branch and finds nothing untoward nearby, for now."

 # Acquisition event chain
 agot_greenseer.0070.t: "The Weirwood Calls"
 agot_greenseer.0070.desc: "You have heard the stories since childhood - that the old gods watch through the carved red faces of the weirwoods, and that some few can watch back. There is a grove not far from here where the trees still remember the First Men."
 agot_greenseer.0070.a: "Seek out the grove"
 agot_greenseer.0070.b: "Not now"

 agot_greenseer.0071.t: "The Red Paste"
 agot_greenseer.0071.desc: "An old woman living among the roots offers you a paste ground from weirwood seeds - bitter, blood-red, and said to 'wed' those who eat it to the trees. She warns you plainly: not everyone who eats it wakes up the same."
 agot_greenseer.0071.a: "Eat of the paste"
 agot_greenseer.0071.b: "Turn back"

 agot_greenseer.0072.t: "A Thousand Eyes, One Forest"
 agot_greenseer.0072.desc: "The world tilts. For a long moment you are not sure where your own body ends and the roots beneath you begin."
 agot_greenseer.0072.a: "Open your mind to the tree"
 agot_greenseer.0072.a.success: "Your sight tears loose from your own eyes and scatters - through bark, through leaf, through a hundred years of stillness. When you return to yourself, you are no longer entirely alone in your own head."
 agot_greenseer.0072.a.failure: "Your mind reaches for the tree and finds only cold sap and silence. You come back to yourself shaking, with the unpleasant sense that something in the wood noticed you anyway."

 agot_greenseer.0073.t: "The Roots Pull Tighter"
 agot_greenseer.0073.desc: "You have leaned on the green sight too long and too often. You can feel the weirwood net pulling at you now, patient and vast, offering you a stillness that no longer entirely feels like your own."
 agot_greenseer.0073.a: "Remain who you are"
 agot_greenseer.0073.b: "Give yourself to the tree"
 agot_greenseer_bound_to_the_tree_toast: "[ROOT.Char.GetNameNoTooltip] has given themselves to the weirwood net."

 # See the Truth as a vision, not a flat toast
 agot_greenseer.0074.t: "What the Trees Know"
 agot_greenseer.0074.desc.rhllor: "The bark peels back like an eyelid, and you see it plainly: a fire that does not belong to any hearth, banked low but never out, behind their eyes."
 agot_greenseer.0074.desc.warging: "You see, for a moment, through a second pair of eyes that are not their own - and understand that they have done this before, many times, with many different eyes."
 agot_greenseer.0074.desc.blood: "You see old scars that should not still hurt the way they do, and understand, without being told, exactly what was paid for what."
 agot_greenseer.0074.desc.drowned: "You see saltwater where there should be none, filling lungs that have already, once, stopped needing to breathe."
 agot_greenseer.0074.desc.faceless: "You see a hundred faces layered over one, none of them quite settling into a single true shape."
 agot_greenseer.0074.desc.shadow: "You see a second shadow standing just behind their first, cast by no light you can find."
 agot_greenseer.0074.desc.nothing: "You see nothing but an ordinary person, with ordinary secrets, none of them the old magic."
 agot_greenseer.0074.a: "Close your eyes"

 # Hammer of the Waters: 0075 (calling the old pact) -> 0076 (the flood)
 agot_greenseer.0075.t: "Calling the Old Pact"
 agot_greenseer.0075.desc: "The Pact on the Isle of Faces was never truly broken, only quiet. You do not know if anything will answer when you call on it - only that you must try."
 agot_greenseer.0075.a: "Call on the last of the children"
 agot_greenseer.0075.b: "This is too much to ask"

 agot_greenseer.0076.t: "The Waters Rise"
 agot_greenseer.0076.desc: "Something ancient and patient answers your call. The ground itself seems to hold its breath before it breaks."
 agot_greenseer.0076.a: "Break the earth"
