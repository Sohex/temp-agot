l_english:
 # AGOT: Magic of Westeros v3 - Alchemists' Guild / Wildfire
 # Not part of the magic lifestyle - mundane, dangerous knowledge.

 agot_wildfire_not_yet_known_tooltip: "You do not already know the Guild's secret"

 # Toasts
 agot_wildfire_knowledge_granted_toast: "[ROOT.Char.GetNameNoTooltip] has learned the Alchemists' Guild's closest-guarded secret."
 agot_wildfire_discovered_toast: "[ROOT.Char.GetNameNoTooltip]'s dealings with the Alchemists' Guild have not gone unnoticed."

 # Modifier
 agot_wildfire_reckless_reputation_modifier: "Reputation for Recklessness"

 # Decision
 agot_wildfire_learn_the_secret_decision: "Learn the Guild's Secret"
 agot_wildfire_learn_decision_desc: "The Alchemists' Guild guards its formula for wildfire more closely than any king guards his crown. Coin, patience, and the right questions asked of the right drunk alchemist can still buy a man - or woman - the secret."
 agot_wildfire_learn_decision_tooltip: "You will spend time and coin working your way into the Guild's confidence. This is not magic - no ritual, no gift, just dangerous knowledge that cannot be unlearned."
 agot_wildfire_learn_the_secret_decision_confirm: "Seek out the Guild's secret?"

 # Interaction
 agot_wildfire_plant_a_cache_interaction: "Plant a Wildfire Cache"
 agot_wildfire_plant_a_cache_interaction_desc: "You will have a cache of wildfire smuggled beneath [recipient.GetNameNoTooltip]'s halls. Wildfire does not care whose halls it burns, or who is standing nearby when it catches."
 agot_wildfire_plant_a_cache_notification: "[ROOT.Char.GetNameNoTooltip] has planted a wildfire cache beneath an enemy's halls."
 agot_wildfire_outcome_target_burns: "The cache catches exactly as planned. The halls go up in green flame, and there is no time for anyone inside to get out."
 agot_wildfire_outcome_collateral: "The cache catches, but the fire spreads wrong - it is not the one you meant to kill who dies in it."
 agot_wildfire_outcome_backfire: "Something goes wrong in the mixing, or the timing, or the wick. The green flame finds you instead."

 # Acquisition event chain: 0001 (call) -> 0002 (terms) -> 0003 (the deal)
 agot_wildfire.0001.t: "A Name in the Guild"
 agot_wildfire.0001.desc: "You have found, through a chain of coin and quiet questions, a name: a journeyman of the Alchemists' Guild who might, for the right price, be persuaded to talk."
 agot_wildfire.0001.a: "Seek out the Guild contact"
 agot_wildfire.0001.b: "Not now"

 agot_wildfire.0002.t: "The Guild's Terms"
 agot_wildfire.0002.desc: "The alchemist names a price that makes you wince, then adds, almost as an afterthought, that the Guild does not forgive those who learn its secrets and do not pay for them."
 agot_wildfire.0002.a: "Pay their price"
 agot_wildfire.0002.b: "Walk away"

 agot_wildfire.0003.t: "The Formula"
 agot_wildfire.0003.desc: "The alchemist walks you through the mixture once, muttering under his breath the whole time, refusing to write a single word of it down."
 agot_wildfire.0003.a: "Learn the formula"
 agot_wildfire.0003.a.success: "It is simpler than you expected, and more terrifying for it - a handful of ordinary things, combined in a way that should not work, and does."
 agot_wildfire.0003.a.failure: "You lose the thread of it halfway through, and the alchemist will not repeat himself twice for the same coin. The knowledge slips away from you, for now."

 # Planting a cache: 0010 (groundwork) -> 0011 (the night it catches)
 agot_wildfire.0010.t: "Laying the Groundwork"
 agot_wildfire.0010.desc: "Wildfire is easy enough to move if no one asks questions, and hard enough to place quietly if someone does. You weigh your options."
 agot_wildfire.0010.a: "Bribe a servant to place it"
 agot_wildfire.0010.b: "Sneak it in yourself"
 agot_wildfire.0010.c: "Call it off"

 agot_wildfire.0011.t: "The Night It Catches"
 agot_wildfire.0011.desc: "The cache is in place. There is nothing left to do now but wait for the spark - and hope it finds what it was meant to."
 agot_wildfire.0011.a: "It catches"
