l_english:
 # AGOT: Magic of Westeros v3 - Shadowbinding (Kind des Schattens)

 # Toast
 agot_shadow_gift_granted_toast: "[ROOT.Char.GetNameNoTooltip] has been Awakened to Shadowbinding."

 # Perk tree header
 agot_shadow_name: "Shadowbinding"

 # Perks
 agot_shadow_whispers_perk_name: "Whispers in the Dark"
 agot_shadow_whispers_perk_desc: "You have learned to listen for what moves at the edge of firelight, where Asshai's teachings say the truest secrets live."
 agot_shadow_whispers_perk_effect_text: "Unlocks the path of Shadowbinding and the Shadowbinding focus."

 agot_shadow_lifefire_sense_perk_name: "Life-Fire Sense"
 agot_shadow_lifefire_sense_perk_desc: "You can feel the heat of another's living spirit now, the way a shadowbinder must before they can ever hope to bind one."
 agot_shadow_lifefire_sense_perk_effect_text: "Reduces the chance your own schemes are discovered."

 agot_shadow_child_of_shadow_perk_name: "Child of Shadow"
 agot_shadow_child_of_shadow_perk_desc: "You have learned the rite Melisandre herself once used beneath Storm's End - to take a measure of life-fire from one who loves you, and shape it into something with a purpose."
 agot_shadow_child_of_shadow_perk_effect_text: "Unlocks the 'Conceive a Shadow' interaction - requires a living spouse. Sends a near-certain, delayed killer after your target, at the cost of your spouse's vitality."

 # Focus
 agot_magic_shadow_focus: "Shadowbinder's Vigil"
 agot_magic_shadow_focus_desc: "Spend your nights awake by the fire, watching the shapes the flames throw against the wall - and learning, slowly, to throw shapes of your own."
 agot_magic_shadow_focus_effect_desc: "Shadowbinder's Vigil grants:"

 # Modifier
 agot_shadow_lifefire_spent_modifier: "Life-Fire Spent"
 agot_shadow_own_lifefire_spent_modifier: "Own Life-Fire Spent"

 # Interaction
 agot_shadow_conceive_a_shadow_interaction: "Conceive a Shadow"
 agot_shadow_conceive_a_shadow_interaction_desc: "With your spouse's life-fire and your own will, you will conceive a shadow, and send it after [recipient.GetNameNoTooltip]. What is born in darkness does not miss its mark, usually."
 agot_shadow_needs_spouse_tooltip: "You must have a living spouse to give up part of their life-fire"
 agot_shadow_conceive_a_shadow_notification: "[ROOT.Char.GetNameNoTooltip] has conceived a shadow and sent it after an enemy."

 # Decision
 agot_shadow_seek_the_shadow_decision: "Seek the Shadowbinder's Favor"
 agot_shadow_seek_decision_desc: "It is said that in Asshai, at the edge of the Shadow Lands, there are those who can bind a living shadow to their will - and that a few of their secrets have traveled west with R'hllor's faithful."
 agot_shadow_seek_decision_tooltip: "You will seek out someone versed in the old Asshai'i arts and ask them to teach you. Not everyone who tries this rite comes away unmarked."
 agot_shadow_seek_the_shadow_decision_confirm: "Seek out a shadowbinder?"

 # Acquisition event chain
 agot_shadow.0090.t: "A Name Whispered in Asshai'i"
 agot_shadow.0090.desc: "You have heard a name spoken only in the smallest of voices, always with a glance over the shoulder first - someone in the city who is said to have learned the darker arts of Asshai."
 agot_shadow.0090.a: "Seek them out"
 agot_shadow.0090.b: "Not now"

 agot_shadow.0091.t: "The Price of a Shadow"
 agot_shadow.0091.desc: "The shadowbinder tells you plainly what the rite costs: a measure of your own life-fire, given up and never returned. 'A shadow is not summoned,' they say. 'It is conceived. And conception always has its price.'"
 agot_shadow.0091.a: "Give up part of your life-fire"
 agot_shadow.0091.b: "Turn back"

 agot_shadow.0092.t: "What Moves in Darkness"
 agot_shadow.0092.desc: "The candles are put out, one by one, until there is only a single flame left between you and the dark. The shadowbinder begins to chant, and you feel something of yourself leave your body and pour into the black."
 agot_shadow.0092.a: "Let the darkness in"
 agot_shadow.0092.a.success: "For a moment there are two shadows on the wall where there should be one. It bows to you, once, before it is gone. You understand now, in a way you did not before, what R'hllor's priests mean when they speak of the war between the light and what the light casts behind it."
 agot_shadow.0092.a.failure: "The flame gutters and dies, and nothing answers you in the dark. You are left shaking, cold in a way no fire will fix - and with the growing sense that whatever you almost touched, it noticed you."

 # Casting event chain: 0093 (asking) -> 0094 (the rite)
 agot_shadow.0093.t: "What Must Be Asked"
 agot_shadow.0093.desc: "You find your spouse alone, and for a long moment you cannot make yourself say the words. A shadow needs life-fire to be born, and you have none to spare of your own that this rite would accept."
 agot_shadow.0093.a: "Ask this of them"
 agot_shadow.0093.b: "You cannot ask this of them"

 agot_shadow.0094.t: "What Must Be Given"
 agot_shadow.0094.desc: "Your spouse says nothing for a long moment, then takes your hands in theirs. Whatever this costs them, they have already decided to pay it."
 agot_shadow.0094.a: "Give what must be given"

 # Casting alone (no spouse): 0096 (the choice) -> 0097 (the rite)
 agot_shadow.0096.t: "No One to Ask"
 agot_shadow.0096.desc: "There is no one at your side to share this rite's price with. If you want the shadow, you will have to give of your own life-fire, with no one to soften what it costs."
 agot_shadow.0096.a: "Give of yourself"
 agot_shadow.0096.b: "This price is too steep alone"

 agot_shadow.0097.t: "What Must Be Given, Alone"
 agot_shadow.0097.desc: "There is no hand to hold this time. You feel the life-fire leave you directly, a cold, private thing, with no one to witness what it costs."
 agot_shadow.0097.a: "Give what must be given"
