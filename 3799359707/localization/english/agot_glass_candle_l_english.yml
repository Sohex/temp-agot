l_english:
 # AGOT: Magic of Westeros v3 - Glass Candle
 # No tradition, no lifestyle - an item to be found and fought over.

 # Artifact
 agot_glass_candle_artifact_name: "A Glass Candle"
 agot_glass_candle_artifact_desc: "An obsidian candle from the House of the Undying in Qarth. Warlocks say such candles once let the wise speak to one another across half the world - though none now living has seen one truly burn."

 # Toasts
 agot_glass_candle_found_toast: "[ROOT.Char.GetNameNoTooltip] has found a glass candle from Qarth."
 agot_glass_candle_search_failed_toast: "[ROOT.Char.GetNameNoTooltip]'s search for a glass candle turned up nothing but old curiosities."
 agot_glass_candle_lit_toast: "[ROOT.Char.GetNameNoTooltip] has lit the glass candle - a moment of true clarity. (Farsighted, 3 years: +2 Learning, +2 Diplomacy)"

 # Modifiers
 agot_glass_candle_owned_modifier: "Keeper of a Glass Candle"
 agot_glass_candle_farsighted_modifier: "Farsighted"

 # Decision: Search
 agot_glass_candle_search_decision: "Search for a Glass Candle"
 agot_glass_candle_search_decision_desc: "Traders and looted ruins alike sometimes turn up strange obsidian candles from Qarth. Most are worthless curiosities - but not all."
 agot_glass_candle_search_decision_tooltip: "You will spend coin and time chasing rumors of a glass candle. Most searches turn up nothing at all."
 agot_glass_candle_search_decision_confirm: "Search for a glass candle?"

 # Decision: Light
 agot_glass_candle_light_decision: "Light the Candle"
 agot_glass_candle_light_decision_desc: "The warlocks of Qarth say a glass candle can be coaxed into burning again, for those with the patience and the will - and that what is seen in its flame is never quite forgotten."
 agot_glass_candle_light_decision_tooltip: "You will attempt to light the candle. This is not without effort, and it cannot be done again for a very long while."
 agot_glass_candle_light_decision_confirm: "Light the glass candle?"

 # Events - Search: 0001 (where to look) -> 0002 (what turned up)
 agot_glass_candle.0001.t: "Chasing Rumors"
 agot_glass_candle.0001.desc: "Glass candles surface in the strangest places - if they surface at all. You decide where to start looking."
 agot_glass_candle.0001.a: "The markets of Qarth"
 agot_glass_candle.0001.b: "A looted ruin's curiosities"
 agot_glass_candle.0001.c: "A private collector, for the right price"

 agot_glass_candle.0002.t: "What Turned Up"
 agot_glass_candle.0002.desc: "Weeks of asking, bribing and waiting come down to a single crate, finally opened in front of you."
 agot_glass_candle.0002.a: "See what turned up"
 agot_glass_candle.0002.a.success: "Beneath a layer of worthless trinkets, something catches the light wrong for glass and right for something else entirely."
 agot_glass_candle.0002.a.failure: "Old curiosities, and nothing more. The search was not entirely wasted - you know a little more about where not to look next time."

 # Events - Light: 0010 (coaxing the flame) -> 0011 (it catches)
 agot_glass_candle.0010.t: "Coaxing the Flame"
 agot_glass_candle.0010.desc: "The warlocks of Qarth say the candle answers only its own kind - but you mean to try anyway, patience and will set against a few thousand years of silence."
 agot_glass_candle.0010.a: "Coax it into burning"

 agot_glass_candle.0011.t: "A Moment of Clarity"
 agot_glass_candle.0011.desc: "Just as you are ready to give it up for a dead thing, the black wax stirs. A small flame catches, and for a heartbeat the whole world seems to sharpen around you."
 agot_glass_candle.0011.a: "The flame catches"
