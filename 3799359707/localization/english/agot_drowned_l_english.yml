l_english:
 # AGOT: Magic of Westeros v2 - Drowned God
 # Kept in its own file so v1's loc file is never touched.
 # Reuses the shared "agot_magic_not_yet_awakened_tooltip" key from v1's
 # loc file (already exists, no need to redefine it here).

 # Toast
 agot_magic_awakened_drowned_toast: "[ROOT.Char.GetNameNoTooltip] has been Awakened to the Drowned God."

 # Perk tree header
 agot_drowned_name: "The Drowned God"

 # Perks
 agot_drowned_gift_of_the_deep_perk_name: "Gift of the Deep"
 agot_drowned_gift_of_the_deep_perk_desc: "You have been drowned and reborn once already, in ritual if not in truth. The sea does not forget those it has touched."
 agot_drowned_gift_of_the_deep_perk_effect_text: "Unlocks the path of the Drowned God and the Commune with the Deep focus."

 agot_drowned_binding_perk_name: "Rite of Binding"
 agot_drowned_binding_perk_desc: "You have learned to lead another beneath the waves and call them back - no longer quite themselves, and yours from that day on."
 agot_drowned_binding_perk_effect_text: "Unlocks the 'Drown & Bind' interaction against a target of your choosing."

 agot_drowned_reborn_of_the_deep_perk_name: "Reborn of the Deep"
 agot_drowned_reborn_of_the_deep_perk_desc: "The Drowned God does not give up what is His so easily. When your natural death comes, the sea may yet pull you back from it - once."
 agot_drowned_reborn_of_the_deep_perk_effect_text: "When you would die a natural death, you may instead be given a second chance - as the vanilla 'Know Thyself' legacy perk does. You will return changed."

 # Focus
 agot_magic_drowned_focus: "Commune with the Deep"
 agot_magic_drowned_focus_desc: "Spend your quiet hours at the shore, listening to what the drowned god's priests say the waves are telling them. Progressing this path unlocks the Gift of the Deep and the rites beyond it."
 agot_magic_drowned_focus_effect_desc: "Communing with the deep grants:"

 # Modifiers / opinion modifier / hook - CK3 shows the raw script key as
 # the tooltip header if these aren't given a plain-name loc entry, same
 # pattern as v1's agot_magic_vision_foresight_modifier etc.
 agot_drowned_binding_ritual_modifier: "Shaken by the Drowning Rite"
 agot_drowned_bound_modifier: "Bound to the Drowned God"
 agot_drowned_bound_loyalty_opinion: "Bound by the Old Rite"
 agot_drowned_binding_hook: "The Drowning Debt"

 # Interaction
 agot_drowned_bind_interaction: "Drown & Bind"
 agot_drowned_bind_interaction_desc: "You will lead [recipient.GetNameNoTooltip] into the sea and hold them under until the Drowned God has had His due. If they come back, they come back changed - and bound to you."
 agot_drowned_bind_interaction_notification: "[ROOT.Char.GetNameNoTooltip] has drowned and bound someone to their service."

 # Decision
 agot_drowned_seek_the_drowned_god_decision: "Seek the Drowned God's Favor"
 agot_drowned_seek_decision_desc: "The priests of the Drowned God say that what is dead may never die, only harder and stronger. To learn if it is true, a man - or woman - must be willing to actually drown."
 agot_drowned_seek_decision_tooltip: "You will travel to the shore and submit to the old rite. This is not without real risk - the sea does not always give back what it takes."
 agot_drowned_seek_the_drowned_god_decision_confirm: "Travel to the shore and seek the Drowned God's favor?"

 # Trait
 agot_drowned_touched_returned: "Touched by the Deep"
 agot_drowned_touched_returned_desc: "They died once, and the sea gave them back - but not quite whole. There is a stillness in their eyes, and they speak sometimes of things no living person should know."

 # Events
 agot_drowned.0001.t: "The Call of the Deep"
 agot_drowned.0001.desc: "Word reaches you that the priests of the Drowned God are gathering at the shore. If you wish to seek His favor, now is the time - the tide will not wait forever."
 agot_drowned.0001.a: "Go to the shore"
 agot_drowned.0001.b: "Not now"

 agot_drowned.0002.t: "The Old Rite"
 agot_drowned.0002.desc: "A priest of the Drowned God meets you at the waterline. He tells you plainly what is to come: you will be held beneath the water until your body believes it is dying, and then - if the God wills it - you will be pulled back. Not everyone is pulled back in time."
 agot_drowned.0002.a: "Submit to the drowning"
 agot_drowned.0002.b: "Turn back"

 agot_drowned.0003.t: "What Is Dead May Never Die"
 agot_drowned.0003.desc: "Hands hold you under. The cold closes over your head, and the world narrows to the burning in your chest and the drumbeat of your own heart. Somewhere above you, the priest is chanting the old words."
 agot_drowned.0003.a: "What is dead may never die"
 agot_drowned.0003.a.survive: "You are hauled back up, choking and gasping - and something in you has changed. The Drowned God has answered."
 agot_drowned.0003.a.die: "The hands do not let go in time. The water takes you, and this time it does not give you back."

 agot_drowned.0004.t: "Pulled Back From the Deep"
 agot_drowned.0004.desc: "Death should have taken you - by all rights, it did, for a moment. But the debt owed to the Drowned God from your old rite came due, and you were pulled back from the black water one final time. You are alive. You are not entirely the same person who died."
 agot_drowned.0004.a: "What is dead may never die"

 # Drown & Bind: 0010 (into the water) -> 0011 (held under)
 agot_drowned.0010.t: "Into the Water"
 agot_drowned.0010.desc: "You lead them down to the waterline, the old words already forming on your lips. They may not yet understand what is about to happen to them."
 agot_drowned.0010.a: "Lead them into the water"
 agot_drowned.0010.b: "Turn back"

 agot_drowned.0011.t: "Held Under"
 agot_drowned.0011.desc: "The water closes over them. You hold them there, counting the moments, trusting the Drowned God to know the difference between what is dead and what only looks it."
 agot_drowned.0011.a: "Hold them under"

 # DEBUG ONLY - remove before Workshop release
 agot_drowned_debug_grant_everything_decision: "DEBUG: Awaken to the Drowned God"
 agot_drowned_debug_grant_everything_decision_confirm: "Grant everything?"
