l_english:
 # AGOT: Magic of Westeros v3 - Blut fuer Feuer, Feuer fuer Blut
 # No tradition, no lifestyle - gated entirely by owning the horn.

 # Artifact
 agot_dragonbinder_artifact_name: "Dragonbinder"
 agot_dragonbinder_artifact_desc: "A great horn banded in red gold and black iron, covered in Valyrian glyphs no living scholar can fully read. It is said that whoever sounds it commands every dragon that hears - and that no mortal man who blows it walks away unscarred."

 # Toasts
 agot_dragonbinder_found_toast: "[ROOT.Char.GetNameNoTooltip] has found the horn known as Dragonbinder."
 agot_dragonbinder_search_failed_toast: "[ROOT.Char.GetNameNoTooltip]'s search for Dragonbinder found nothing but old bones and older rumors."
 agot_dragonbinder_bound_toast: "[ROOT.Char.GetNameNoTooltip] has bound a dragon to their will with Dragonbinder."

 # Modifier
 agot_dragonbinder_owned_modifier: "Keeper of Dragonbinder"

 # Decision
 agot_dragonbinder_search_decision: "Search for Dragonbinder"
 agot_dragonbinder_search_decision_desc: "Old sailors' tales speak of a great horn, bound in red gold and black iron, lost somewhere among the ruins of Valyria or the wrecks that litter the Smoking Sea. Most who go looking find only old bones."
 agot_dragonbinder_search_decision_tooltip: "You will spend coin and risk your life chasing a legend. This is, by far, the rarest and most dangerous object in the world to go looking for."
 agot_dragonbinder_search_decision_confirm: "Search for Dragonbinder?"

 # Interaction
 agot_dragonbinder_blow_the_horn_interaction: "Blow the Dragonbinder Horn"
 agot_dragonbinder_blow_the_horn_interaction_desc: "The Valyrian glyphs on the horn are said to read: 'Blood for fire, fire for blood.' No mortal man is meant to sound this horn and live - but if you do, the dragon before you will answer to no one else again."
 agot_dragonbinder_recipient_must_be_dragon_tooltip: "This must be a dragon"

 # Events: 0105 (raising it) -> 0106 (the roll) -> 0111 (claiming the bond)
 agot_dragonbinder.0105.t: "The Horn in Your Hands"
 agot_dragonbinder.0105.desc: "The horn is heavier than it looks, cold banded iron against your palms. Somewhere close, the dragon you mean to bind is watching you with an intelligence no beast should have."
 agot_dragonbinder.0105.a: "Raise it to your lips"
 agot_dragonbinder.0105.b: "Lower it - not yet"

 agot_dragonbinder.0106.t: "Blood for Fire, Fire for Blood"
 agot_dragonbinder.0106.desc: "You fill your lungs and sound the horn. The note that comes out is wrong - too deep, too long, older than any horn has a right to be."
 agot_dragonbinder.0106.a: "See it through"
 agot_dragonbinder.0106.a.dies_a: "The note does not stop when your breath runs out. It keeps going, pulled from somewhere else, and the world goes white with pain. Blood for fire, fire for blood. The horn has taken its due."
 agot_dragonbinder.0106.a.dies_b: "Your vision blurs red at the edges before the note even finishes. Whatever answers the horn takes more than it was offered."
 agot_dragonbinder.0106.a.lives_a: "The note rolls out across the sky like thunder, and you are still standing when it fades. Somewhere above you, a great shape turns in the air - and comes toward you instead of away."
 agot_dragonbinder.0106.a.lives_b: "The pain passes as quickly as it came, leaving you shaking but upright. High above, wingbeats change rhythm, turning toward the sound of your voice."

 agot_dragonbinder.0111.t: "What the Horn Has Bound"
 agot_dragonbinder.0111.desc: "The dragon lands before you, wings beating the air into a storm, and does not burn you where you stand. That, more than anything, tells you the horn has done what no mortal craft could."
 agot_dragonbinder.0111.a: "Claim what the horn has bound"
