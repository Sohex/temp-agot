l_english:
 # AGOT: Magic of Westeros v3 - Mastery/practice decisions
 # Repeatable, capped at 3, shift the odds of the matching ability.

 # Decision: Study the Valyrian Glyphs (Dragonbinder)
 agot_dragonbinder_study_decision: "Study the Valyrian Glyphs"
 agot_dragonbinder_study_decision_desc: "The glyphs on the horn are not decoration - they are instructions, if you can only read them. Every hour spent tracing their curves teaches you something the last hour did not."
 agot_dragonbinder_study_decision_tooltip: "You will spend time studying the horn itself. Progress is slow and not guaranteed every time, but it never goes backward."
 agot_dragonbinder_study_decision_confirm: "Study the horn?"
 agot_dragonbinder_study_success: "Something in the glyphs finally makes sense - a stroke you had read as an ending is, you now see, a beginning."
 agot_dragonbinder_study_already_mastered: "You trace the glyphs again from memory. There is nothing left in them you do not already know."
 agot_dragonbinder_study_setback_a: "The glyphs blur and rearrange themselves in your mind the moment you look away. An hour is lost to nothing."
 agot_dragonbinder_study_setback_b: "You mistake one rune for another and spend the whole session chasing a meaning that was never there."
 agot_dragonbinder_study_progress_toast: "[ROOT.Char.GetNameNoTooltip]'s study of the horn has paid off - their understanding of it deepens."
 agot_dragonbinder_study_no_progress_toast: "[ROOT.Char.GetNameNoTooltip]'s study of the horn taught them nothing new this time."

 # Decision: Steel Your Resolve (Shadowbinding)
 agot_shadow_practice_decision: "Steel Your Resolve"
 agot_shadow_practice_decision_desc: "A shadow only answers a will that does not waver. You spend your nights alone with a single candle, teaching yourself not to flinch when the flame gutters."
 agot_shadow_practice_decision_tooltip: "You will discipline your own will against the dark. Not every night teaches you something, but none of them are wasted on their own."
 agot_shadow_practice_decision_confirm: "Steel your resolve?"
 agot_shadow_practice_success: "The candle gutters, and for once you do not look away. Something in you has hardened."
 agot_shadow_practice_already_mastered: "You sit with the flame out of habit now, more than need. Your will no longer wavers."
 agot_shadow_practice_setback_a: "The dark presses in closer than you expected, and you blow the candle out yourself before dawn."
 agot_shadow_practice_setback_b: "You dream, badly, of the shadow you have not yet sent - and wake having learned nothing but fear."
 agot_shadow_practice_progress_toast: "[ROOT.Char.GetNameNoTooltip]'s will has hardened further against the dark."
 agot_shadow_practice_no_progress_toast: "[ROOT.Char.GetNameNoTooltip]'s practice against the dark taught them nothing new this time."

 # Decision: Refine Your Craft (Faceless Men)
 agot_faceless_practice_decision: "Refine Your Craft"
 agot_faceless_practice_decision_desc: "A girl is no one, and no one's hand does not shake. You spend your days practicing faces that are not your own, in mirrors and in the eyes of strangers."
 agot_faceless_practice_decision_tooltip: "You will practice the discipline of the Guild alone, without a teacher. Progress is uneven, but never lost."
 agot_faceless_practice_decision_confirm: "Refine your craft?"
 agot_faceless_practice_success: "You catch your own reflection wearing an expression that is not quite yours - and for a moment, you are satisfied with that."
 agot_faceless_practice_already_mastered: "You practice out of discipline now, not need. There is little the mirror can still teach you."
 agot_faceless_practice_setback_a: "You slip back into your own face at the worst possible moment, in front of the worst possible person, and spend the day covering for it."
 agot_faceless_practice_setback_b: "A stranger looks at you too long on the street, and you cannot tell if it is suspicion or nothing at all. The uncertainty costs you the day."
 agot_faceless_practice_progress_toast: "[ROOT.Char.GetNameNoTooltip]'s craft has improved further."
 agot_faceless_practice_no_progress_toast: "[ROOT.Char.GetNameNoTooltip]'s practice taught them nothing new this time."

 # Decision: Perfect the Formula (Wildfire)
 agot_wildfire_study_decision: "Perfect the Formula"
 agot_wildfire_study_decision_desc: "The Guild's formula is a starting point, not a ceiling. Alone, carefully, you experiment with the mixture - a little more of this, a little less of that."
 agot_wildfire_study_decision_tooltip: "You will experiment with the wildfire formula in private. This is dangerous in its own small way, but progress, once made, stays made."
 agot_wildfire_study_decision_confirm: "Experiment with the formula?"
 agot_wildfire_study_success: "The mixture catches cleaner and burns hotter than anything the Guild taught you. You commit the change to memory before you forget it."
 agot_wildfire_study_already_mastered: "You test a batch out of habit. It burns exactly as you expected - which is to say, perfectly."
 agot_wildfire_study_setback_a: "A batch curdles into something inert and useless, and you have wasted a small fortune in rare oils finding out."
 agot_wildfire_study_setback_b: "The fumes alone leave you sick for two days, and you learn nothing you did not already know."
 agot_wildfire_study_progress_toast: "[ROOT.Char.GetNameNoTooltip]'s formula has improved further."
 agot_wildfire_study_no_progress_toast: "[ROOT.Char.GetNameNoTooltip]'s experiments taught them nothing new this time."
