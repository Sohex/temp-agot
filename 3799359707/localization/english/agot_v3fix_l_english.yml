l_english:
 # AGOT: Magic of Westeros - Fix-plan content (see V3_FIXPLAN.md)

 # Modifiers
 agot_rhllor_touched_by_prophecy_modifier: "Touched by Prophecy"
 agot_bloodmagic_final_rite_toll_modifier: "The Rite's Toll"

 # R'hllor finisher: Vision of What Is to Come
 agot_rhllor_vision_of_what_is_to_come_decision: "Vision of What Is to Come"
 agot_rhllor_vision_decision_desc: "The fire does not merely dance for you anymore - it shows you things, plainly, when you have the strength to truly look. This is not the flickering, half-answer of an ordinary reading."
 agot_rhllor_vision_decision_tooltip: "You will stare into the flames until they show you something real. This costs you a measure of yourself, but what you see is not left to chance."
 agot_rhllor_vision_of_what_is_to_come_decision_confirm: "Stare into the flames?"
 agot_rhllor_vision_toast: "[ROOT.Char.GetNameNoTooltip] has seen something true in the flames."

 # Vision of What Is to Come - the event itself. Where the vision has a
 # real target, it names them outright and genuinely acts on them - a
 # real payoff and a real cost, not just mood text.
 agot_magic.0090.t: "A Vision in the Flames"
 agot_magic.0090.desc.betrayal: "You see a familiar face speaking words you cannot hear, to someone you cannot see - and this time the flames do not stay vague. It is [agot_rhllor_vision_target.GetNameNoTooltip], plotting against you even now."
 agot_magic.0090.desc.war: "Not the war you already know - something closer, and worse. You see a face from your own hall looking at your seat the way a starving man looks at bread. It is [agot_rhllor_vision_target.GetNameNoTooltip], and whatever right they see in the flames, they will not unsee it now."
 agot_magic.0090.desc.death: "You see an empty chair, and this time the flames do not lie to spare you: [agot_rhllor_vision_target.GetNameNoTooltip] was already closer to it than anyone around them seems to know. You have not caused what you saw. You have only been shown it a little early."
 agot_magic.0090.desc.generic: "You see fire consuming something precious - a hall, a harvest, a name - but the shape of it will not resolve into anything you recognize. Not every vision points at something you can name."
 agot_magic.0090.a: "Look away from the flames"

 # Marked for Death trait - the death branch's real, lasting consequence
 agot_rhllor_marked_for_death: "Marked for Death"
 agot_rhllor_marked_for_death_desc: "They were already failing before anyone thought to look for it in the flames - a vision only put a name and a shape to what their own body had already decided."

 # Greenseer mastery: Deepen Your Communion
 agot_greenseer_deepen_communion_decision: "Deepen Your Communion"
 agot_greenseer_deepen_communion_decision_desc: "The weirwood net does not open all at once. Each time you return to it, a little more of it opens to you - and a little more of you opens to it."
 agot_greenseer_deepen_communion_decision_tooltip: "You will spend time in quiet communion with the trees, deepening your bond. Not every session teaches you something, but the bond never weakens."
 agot_greenseer_deepen_communion_decision_confirm: "Deepen your communion?"
 agot_greenseer_deepen_communion_success: "For a moment the boundary between your mind and the wood's blurs further than it ever has before - and holds, without pulling you in."
 agot_greenseer_deepen_communion_already_mastered: "You sit with the trees out of habit now. The bond is as deep as it can safely go."
 agot_greenseer_deepen_communion_setback_a: "The trees are silent today, no matter how long you sit with them. The hours pass for nothing."
 agot_greenseer_deepen_communion_setback_b: "You reach too far too fast and come back with a splitting headache and nothing to show for it."
 agot_greenseer_deepen_communion_progress_toast: "[ROOT.Char.GetNameNoTooltip]'s bond with the weirwood net has deepened further."
 agot_greenseer_deepen_communion_no_progress_toast: "[ROOT.Char.GetNameNoTooltip]'s communion with the trees taught them nothing new this time."

 # Blood Magic finisher: The Final Rite
 agot_bloodmagic_final_rite_interaction: "The Final Rite"
 agot_bloodmagic_final_rite_interaction_desc: "Unlike the curse you have worked before, this rite does not stop at withering [recipient.GetNameNoTooltip]'s fortunes - it asks the old powers, plainly, to take their life. It will cost you more than the last one did."
 agot_bloodmagic_final_rite_outcome_dies: "The old powers answer plainly this time - there is no lingering curse, no slow wasting. It is simply over."
 agot_bloodmagic_final_rite_outcome_survives: "The rite does not kill, this time - but what is left behind is worse than the ordinary curse, layered and lingering."
 agot_bloodmagic_final_rite_notification: "[actor.GetNameNoTooltip] has worked the Final Rite against [recipient.GetNameNoTooltip]."

 # Faceless Men finisher: Mark for Death
 agot_faceless_mark_for_death_interaction: "Mark for Death"
 agot_faceless_mark_for_death_interaction_desc: "Valar morghulis - all men must die. You will simply see to it that [recipient.GetNameNoTooltip]'s death, when it comes in ten days' time, is not a matter of chance at all."
 agot_faceless_mark_must_be_landed_tooltip: "This must be a titled ruler"
 agot_faceless_mark_for_death_notification: "[actor.GetNameNoTooltip] has marked [recipient.GetNameNoTooltip] for death."

 # Ambient events - the tradition finds YOU, unbidden
 agot_ambient.0002.t: "Unbidden"
 agot_ambient.0002.desc.rhllor: "You wake from a dream of fire that was not quite a dream, the shape of it already slipping away even as you reach for it."
 agot_ambient.0002.desc.warging: "For a long moment on waking, your limbs feel wrong - too many legs, or too few, you cannot say which. It passes."
 agot_ambient.0002.desc.blood: "An old scar aches tonight, one that should have stopped aching years ago. You remember exactly what it cost."
 agot_ambient.0002.desc.drowned: "Something in you turns toward the sea tonight, the way iron turns north. You did not choose to notice the tide."
 agot_ambient.0002.desc.greenseer: "You catch yourself listening to the trees outside your window, and cannot say for how long you have been standing there."
 agot_ambient.0002.desc.shadow: "The candle gutters though there is no wind, and for a moment your shadow on the wall does not quite match your movements."
 agot_ambient.0002.desc.faceless: "You catch your reflection wearing an expression you did not choose to make."
 agot_ambient.0002.desc.generic: "Something about the old magic in you stirs tonight, unbidden and unasked for."
 agot_ambient.0002.a: "Lean into it"
 agot_ambient.0002.b: "Push it away"
