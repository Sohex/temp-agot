 great_project_type_tooltip_lv_rehabilitate_valyria:0 "Rehabilitate a region of [valyria|E]: clear what the Doom left, then make the land bear again."
 great_project_type_lv_rehabilitate_valyria_contribution_master_engineer_desc:0 "Engineers trained in the Freehold's own methods. They read the old drainage and load-bearing work as easily as a maester reads a letter, and they know which ruin can be saved and which must come down."
 great_project_type_lv_rehabilitate_valyria_contribution_surveying_equipment_and_personnel_desc:0 "Chains, levels and the people who know how to use them. Nothing can be rebuilt before the ground has been measured and the sound rock told apart from the ash."
 great_project_type_lv_rehabilitate_valyria_contribution_volcanic_sealing_projects_desc:0 "Vents and fissures are capped with stone and slag before the work parties move in. It does not quiet the mountain, but it keeps the fumes out of the valleys."
 great_project_type_lv_rehabilitate_valyria_contribution_containment_barriers_desc:0 "Earthworks and channels that hold back ash slides and the run-off that follows every rain. Dull work, and the difference between a settlement and a grave."
 great_project_type_lv_rehabilitate_valyria_contribution_topsoil_replenishment_desc:0 "Good soil is carried in by the wagonload and spread over the dead ground. It is the slowest part of the whole undertaking and the one nothing else can replace."
 great_project_type_lv_rehabilitate_valyria_contribution_erosion_control_desc:0 "Terraces, revetments and planted banks to keep the new soil where it was put instead of in the sea by the third winter."
 great_project_type_lv_rehabilitate_valyria_contribution_toxic_soil_remediation_desc:0 "Ground that still poisons what grows in it is dug out, burned over and treated. Whole fields are written off in the process."
 great_project_type_lv_rehabilitate_valyria_contribution_cleansing_ashen_wells_desc:0 "Wells and cisterns are drained, scoured of ash and lined anew. Water that can be drunk without fear is the first thing settlers ask for."
 great_project_type_lv_rehabilitate_valyria_contribution_valyrian_arboriculture_desc:0 "Cuttings and seed stock raised from what survived the Doom. The old orchards of the Freehold are gone, but their descendants can be coaxed back into this soil."
 great_project_type_lv_rehabilitate_valyria_contribution_valyrian_steel_tools_desc:0 "Excavation tools with Valyrian steel edges. They cut through slag and fused stone that would blunt a hundred ordinary picks, and they never need the smith."
 great_project_type_lv_rehabilitate_valyria_contribution_specialized_transport_wagons_desc:0 "Wagons built for ash and rubble instead of grain. Every load that reaches the site on wheels is a load that does not have to be carried."
 great_project_type_lv_rehabilitate_valyria_contribution_advanced_logistics_desc:0 "Depots, relay stations and people whose whole task is to know where everything is. It sounds like little and it doubles the pace of the work."
 great_project_type_lv_rehabilitate_valyria_contribution_foundation_reinforcement_desc:0 "The ground under Valyria was shaken to its roots. Before anything is raised on it, the foundations must be piled, packed and tested."
 great_project_type_lv_rehabilitate_valyria_contribution_food_stores_desc:0 "Grain and salt meat laid in for the work parties. Nothing here feeds itself yet, and hungry crews leave."
 great_project_type_lv_rehabilitate_valyria_contribution_provincial_camps_desc:0 "Proper camps with shelter, water and a place to treat the injured. The alternative is losing more people to the nights than to the ruins."
 great_project_type_lv_rehabilitate_valyria_contribution_doom_driven_workforce_desc:0 "Those the Doom left with nothing, put to work rebuilding what took everything from them. They are cheap, they are many, and they do not leave."
 great_project_type_lv_rehabilitate_valyria_contribution_local_security_forces_desc:0 "Armed parties standing watch over the sites. Between the beasts and those who would rather loot the ruins than restore them, the work needs guarding."
 great_project_type_lv_rehabilitate_valyria_contribution_minimal_artifact_surveys_desc:0 "A quick look for what is worth saving before the rubble is cleared. Some of it will be lost; the work moves faster."
 great_project_type_lv_rehabilitate_valyria_contribution_extensive_artifact_surveys_desc:0 "Every site is combed through before anything is moved. It costs time and it is the only way the Freehold's relics leave the ash intact."

 situation_type_valyria_situation:0 "Ruins of Valyria"
 situation_type_valyria_situation_desc:0 "The lands the Doom left behind. Ash, poisoned water and beasts hold the peninsula; what is reclaimed is reclaimed one region at a time."
 situation_valyria_situation_desc:0 "Since the Doom the Freehold's heartland has lain in ruin. Every blocker cleared and every region rehabilitated turns a little of it green again."
 situation_parameter_valyria_green:0 "Valyria is turning green again"
