 spotted_spider_matriarch_flavor:0 "Grown far past the size of any spider that should be, and older than the ruins they nest in. Yeen keeps them; no one keeps Yeen."
 giant_spotted_spider_flavor:0 "Hunting spiders the size of hounds, driven forward in swarms. They do not need to bring a man down to finish him."
 tahae_toto_flavor:0 "Vampire bats that descend on sleeping men and drink until they are too heavy to fly. A camp can lose a dozen and hear nothing."
 marauding_basilisks_flavor:0 "Basilisks herded towards the enemy line and let loose. Their bite rots the flesh around it within hours."
 wyvern_swamp_flavor:0 "Swamp wyverns, kept hungry and released over the field. They are neither trained nor loyal, only pointed."

