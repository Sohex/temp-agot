 building_cos_river_parasites_1:0 "River Parasites"
 building_cos_river_parasites_1_desc:0 "The slow water here is thick with parasites. They enter through the skin of anyone who wades or drinks, and the fever that follows leaves whole work gangs unable to stand for weeks.\n\nNothing can be built along this stretch until the waters are cleared."
 building_type_cos_river_parasites_1:0 "River Parasites"
 building_type_cos_river_parasites_1_desc:0 "$building_cos_river_parasites_1_desc$"
 building_cos_river_parasites_2:0 "Cleared River Parasites"
 building_cos_river_parasites_2_desc:0 "This region has been cleared of its dominant fauna."
 building_cos_titanic_beast_1:0 "Titanic Beasts"
 building_cos_titanic_beast_1_desc:0 "Something very large moves through this country. The tracks are the width of a cart, the felled trees are decades old, and the few who have seen the beast itself do not agree on what it was.\n\nUntil it is driven off or killed, no settlement here will keep its livestock or its people."
 building_type_cos_titanic_beast_1:0 "Titanic Beasts"
 building_type_cos_titanic_beast_1_desc:0 "$building_cos_titanic_beast_1_desc$"
 building_cos_titanic_beast_2:0 "Cleared Titanic Beasts"
 building_cos_titanic_beast_2_desc:0 "This region has been cleared of its dominant fauna."
 building_cos_raptors_1:0 "Raptors"
 building_cos_raptors_1_desc:0 "Pack hunters, shoulder-high, fast over open ground and patient in cover. They have learned that a work camp means food that does not run far.\n\nGuards must be doubled and the work will crawl until the packs are broken."
 building_type_cos_raptors_1:0 "Raptors"
 building_type_cos_raptors_1_desc:0 "$building_cos_raptors_1_desc$"
 building_cos_raptors_2:0 "Cleared Raptors"
 building_cos_raptors_2_desc:0 "This region has been cleared of its dominant fauna."

