 COURT_VISUAL_DRAGONKEEP_TITLE:0 "Valyria - The Dragonkeep"
 COURT_VISUAL_DRAGONKEEP_DESC:0 "A hall of fused black stone raised over the Fourteen Flames, kept lit by hearths that have not been allowed to go out since the Freehold fell."
 COURT_VISUAL_LOKIRIA_COURT_TITLE:0 "Ilvonys - Court of Lokiria"
 COURT_VISUAL_LOKIRIA_COURT_DESC:0 "A court open to the sky, where audience is held with a dragon settled along the far wall and the smell of its fires in every corner."
 COURT_VISUAL_LOKIRIA_COURT_NO_DRAGON_TITLE:0 "$COURT_VISUAL_LOKIRIA_COURT_TITLE$"
 COURT_VISUAL_LOKIRIA_COURT_NO_DRAGON_DESC:0 "A court open to the sky. The perch beside the throne has stood empty since the dragons went out of the world, and the hall is the quieter for it."
 COURT_VISUAL_LYRIA_TITLE:0 "Kastaryia - Court of Lyria"
 COURT_VISUAL_LYRIA_DESC:0 "A bright hall of pale stone, warmed along its whole length by open firepits sunk into the floor."
 COURT_VISUAL_MARTIVIA_TITLE:0 "Oreos - Court of Martivia"
 COURT_VISUAL_MARTIVIA_DESC:0 "An old hall the greenery has been allowed to keep, grown through at the columns and open to the light where the roof gave way."
 COURT_VISUAL_MEEREEN_TITLE:0 "Meereen - The Great Pyramid"
 COURT_VISUAL_MEEREEN_DESC:0 "The high chamber at the summit of the Great Pyramid, its brickwork carrying the harpies of old Ghis on every wall."

 valyria_situation_valyria_ruined_situation_phase_desc:0 "The peninsula as the Doom left it. Ash, broken stone and water that kills what drinks from it; nothing here recovers on its own."
 valyria_situation_valyria_ruined_transition_situation_phase_desc:0 "The first blockers have fallen and the land has begun to answer. The change is under way, but none of it has settled yet."
 valyria_situation_valyria_restored_01_situation_phase_desc:0 "A third of what closed the peninsula is gone. Green returns in patches and the worst of the poison has drained out of the low ground."
 valyria_situation_valyria_restored_01_transition_situation_phase_desc:0 "The partial restoration holds, and the next stretch of ruined country has already started to turn."
 valyria_situation_valyria_restored_02_situation_phase_desc:0 "Two thirds of the peninsula stands clear. The fields carry a crop again and the ruins are quarries rather than deathtraps."
 valyria_situation_valyria_restored_02_transition_situation_phase_desc:0 "The restoration holds across two thirds of the peninsula, and the last of the closed country is beginning to give way."
 valyria_situation_valyria_rehabilitated_situation_phase_desc:0 "Everything the Doom took has been taken back. Valyria is a place people live in again rather than a place they survive."
