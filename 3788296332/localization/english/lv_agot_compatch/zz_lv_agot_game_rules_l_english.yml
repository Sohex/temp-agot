l_english:
 lv_agot_compatch_prefix:0 "Compatch:"
 game_rule_category_lv_colonisation:0 "LoV Colonisation"
 game_rule_category_lv_map_expansion:0 "LoV Map Expansion"

 rule_lv_agot_targaryen_pre_conquest_coa:0 "#Y $lv_agot_compatch_prefix$#! Targaryen Arms before the Conquest"
 setting_lv_agot_targaryen_coa_canon:0 "Canon"
 setting_lv_agot_targaryen_coa_canon_desc:0 "House Targaryen bears the Valyrian device of its Freehold days at every start date before Aegon's Conquest. The three-headed dragon is Aegon's sigil and appears from 7999 onwards. This is how AGOT handles it."
 setting_lv_agot_targaryen_coa_dragon:0 "Three-Headed Dragon"
 setting_lv_agot_targaryen_coa_dragon_desc:0 "House Targaryen bears the three-headed dragon at every start date, including the Century of Blood. Their titles follow the house arms."

 rule_lv_agot_colonization_cooldown:0 "#Y $lv_agot_compatch_prefix$#! Settlement Cooldown"
 setting_lv_agot_colonization_cooldown_default:0 "Default"
 setting_lv_agot_colonization_cooldown_default_desc:0 "After settling a wilderness or a pirate den, a ruler must wait before settling again: 4 years for pirate rulers and in hard-to-settle regions, 2 years everywhere else. This is how AGOT handles it."
 setting_lv_agot_colonization_cooldown_fast:0 "Fast"
 setting_lv_agot_colonization_cooldown_fast_desc:0 "Half the wait: 2 years for pirate rulers and in hard-to-settle regions, 1 year everywhere else."
 setting_lv_agot_colonization_cooldown_none:0 "No Cooldown"
 setting_lv_agot_colonization_cooldown_none_desc:0 "No wait at all. A ruler can settle the next county as soon as they can pay for it."
 setting_lv_agot_colonization_cooldown_slow:0 "Slow"
 setting_lv_agot_colonization_cooldown_slow_desc:0 "Double the wait: 8 years for pirate rulers and in hard-to-settle regions, 4 years everywhere else."

 rule_lv_agot_hv_conversion_compat:0 "#Y $lv_agot_compatch_prefix$#! High Valyrian as a Province Culture"
 setting_lv_agot_hv_conversion_compat_both:0 "Homeland Exception"
 setting_lv_agot_hv_conversion_compat_both_desc:0 "On the Valyrian peninsula a province may become High Valyrian instead of being pushed to Essosi Valyrian."
 setting_lv_agot_hv_conversion_compat_none:0 "Off"
 setting_lv_agot_hv_conversion_compat_none_desc:0 "AGOT's rule unchanged. No province becomes High Valyrian."