l_english:
  cob_7899_scenerio.0005.c:0 "Let [valyria|E] lie in its ashes. What is left of the Freehold will be ruled from here."
  cob_7899_scenerio.0005.c_tt:0 "Stay in Qohor and hold the Hegemony"
  lv_aurion_forsake_hegemony_tt:0 "The Hegemony of [valyria|E] dies with the Freehold — only your claim to it remains.\nThe Artisans' Quarter returns to the Magister of Qohor, and Qohor itself goes its own way.\nYour host is all that is left to you."
  lv_aurion_keep_hegemony_tt:0 "You keep the Hegemony of [valyria|E] and the Artisans' Quarter of Qohor.\nYour camp is broken up and the expedition east is called off before it begins."
